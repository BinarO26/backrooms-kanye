<script>

/* =========================================================
   BASIC CHECK
========================================================= */

if(
    typeof THREE === "undefined"
){

    const error =
        document.getElementById(
            "error"
        );

    error.style.display =
        "block";

    error.textContent =
        "three.min.js could not be loaded.";

    throw new Error(
        "Three.js missing"
    );

}

/* =========================================================
   PATHS
========================================================= */

const BASE =
    new URL(
        "./",
        document.baseURI
    );

const TEXTURE_PATHS = {

    floor:
        new URL(
            "textures/floor.png",
            BASE
        ).href,

    wall:
        new URL(
            "textures/wall.png",
            BASE
        ).href,

    ceiling:
        new URL(
            "textures/ceiling.png",
            BASE
        ).href

};

const ENTITY_URL =
    new URL(
        "entity.png",
        BASE
    ).href;

const AUDIO_URL =
    new URL(
        "entity.mp3",
        BASE
    ).href;

/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x70683a
    );

scene.fog =
    new THREE.FogExp2(
        0x70683a,
        0.009
    );

/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        76,

        innerWidth /
        innerHeight,

        .03,

        260

    );

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.75
    )
);

if(
    "outputColorSpace"
    in renderer
){

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

}

if(
    "toneMapping"
    in renderer
){

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        0.82;

}

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   FOUND FOOTAGE LIGHTING
========================================================= */

const ambientLight =
    new THREE.AmbientLight(
        0x6f673b,
        0.35
    );

scene.add(
    ambientLight
);

const hemisphereLight =
    new THREE.HemisphereLight(

        0xd7cb78,

        0x17150f,

        0.55

    );

scene.add(
    hemisphereLight
);

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(
    player
);

player.add(
    camera
);

const EYE_HEIGHT =
    1.18;

const PLAYER_HEIGHT =
    1.55;

const PLAYER_RADIUS =
    .28;

const WALK_SPEED =
    3.8;

const SPRINT_SPEED =
    6.5;

const GRAVITY =
    20;

const JUMP_SPEED =
    6.3;

camera.position.set(
    0,
    EYE_HEIGHT,
    0
);

let yaw = 0;
let pitch = 0;

let velocityY = 0;

let grounded = true;

/* =========================================================
   GAME STATE
========================================================= */

let running = false;
let paused = false;
let dead = false;

let fallingIntoLevel = false;

let fallTimer = 0;

const FALL_DURATION =
    2.25;

let difficulty =
    "normal";

let entity = null;

let worldObjects = [];

let walls = [];

let floorObjects = [];

let deathHoles = [];

let ladders = [];

let entityVelocity =
    new THREE.Vector2(
        0,
        0
    );

let entityDirection =
    new THREE.Vector2(
        1,
        0
    );

let lastKnownPlayer =
    new THREE.Vector2(
        0,
        0
    );

let hasLastKnownPosition =
    false;

let lastSeenTimer = 0;

let wanderTimer = 0;

let wanderAngle = 0;

/* =========================================================
   TEXTURES
========================================================= */

let floorTexture = null;
let wallTexture = null;
let ceilingTexture = null;

/* =========================================================
   TEXTURE LOADER
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

function prepareTexture(
    texture
){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(

            renderer
                .capabilities
                .getMaxAnisotropy(),

            8

        );

    texture.needsUpdate =
        true;

    return texture;

}

function loadTexture(
    url,
    name
){

    return new Promise(
        resolve => {

            textureLoader.load(

                url,

                texture => {

                    console.log(
                        "Loaded:",
                        name
                    );

                    resolve(
                        prepareTexture(
                            texture
                        )
                    );

                },

                undefined,

                error => {

                    console.error(
                        "Failed:",
                        name,
                        error
                    );

                    resolve(null);

                }

            );

        }
    );

}

async function loadEnvironmentTextures(){

    const status =
        document.getElementById(
            "textureStatus"
        );

    status.textContent =
        "Loading floor.png...";

    floorTexture =
        await loadTexture(
            TEXTURE_PATHS.floor,
            "floor.png"
        );

    status.textContent =
        "Loading wall.png...";

    wallTexture =
        await loadTexture(
            TEXTURE_PATHS.wall,
            "wall.png"
        );

    status.textContent =
        "Loading ceiling.png...";

    ceilingTexture =
        await loadTexture(
            TEXTURE_PATHS.ceiling,
            "ceiling.png"
        );

    if(
        !floorTexture ||
        !wallTexture ||
        !ceilingTexture
    ){

        status.textContent =
            "WARNING: texture failed to load.";

        status.style.color =
            "#ff7777";

    }else{

        status.textContent =
            "TEXTURES READY";

    }

}

/* =========================================================
   MATERIALS
========================================================= */

/*
    Standard material is intentional here.

    The PNG remains the texture, but the fluorescent
    lights can now illuminate it.

    This is what was missing from the old completely-flat
    MeshBasicMaterial setup.
*/

function makeMaterial(
    texture
){

    return new THREE.MeshStandardMaterial({

        map:texture,

        side:
            THREE.DoubleSide,

        roughness:1,

        metalness:0,

        fog:true

    });

}

/* =========================================================
   WORLD OBJECT
========================================================= */

function addObject(
    object
){

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;

}

/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld(){

    for(
        const object
        of worldObjects
    ){

        scene.remove(
            object
        );

        if(
            object.geometry
        ){

            object.geometry.dispose();

        }

        if(
            object.material
        ){

            if(
                Array.isArray(
                    object.material
                )
            ){

                object.material.forEach(
                    material => {

                        material.dispose();

                    }
                );

            }else{

                object.material.dispose();

            }

        }

    }

    worldObjects = [];
    walls = [];
    floorObjects = [];
    deathHoles = [];
    ladders = [];

    entity = null;

}

/* =========================================================
   FLOOR
========================================================= */

function createFloorMaterial(){

    if(!floorTexture){

        return new THREE.MeshStandardMaterial({

            color:
                0x9a8e4c,

            roughness:1

        });

    }

    const texture =
        floorTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    /*
        3x3 texture tiles.
    */

    const WORLD_WIDTH =
        180;

    const WORLD_DEPTH =
        160;

    const TILE_SIZE =
        3;

    texture.repeat.set(

        WORLD_WIDTH /
        TILE_SIZE,

        WORLD_DEPTH /
        TILE_SIZE

    );

    texture.needsUpdate =
        true;

    return makeMaterial(
        texture
    );

}

function addFloor(){

    const material =
        createFloorMaterial();

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            material

        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.position.set(
        0,
        0,
        0
    );

    addObject(
        floor
    );

    floorObjects.push(
        floor
    );

}

/* =========================================================
   CEILING
========================================================= */

const CEILING_Y =
    3.1;

function createCeilingMaterial(){

    if(!ceilingTexture){

        return new THREE.MeshStandardMaterial({

            color:
                0xd7d1b7,

            roughness:1

        });

    }

    const texture =
        ceilingTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    const WORLD_WIDTH =
        180;

    const WORLD_DEPTH =
        160;

    const TILE_SIZE =
        3;

    texture.repeat.set(

        WORLD_WIDTH /
        TILE_SIZE,

        WORLD_DEPTH /
        TILE_SIZE

    );

    texture.needsUpdate =
        true;

    return makeMaterial(
        texture
    );

}

function addCeiling(){

    const material =
        createCeilingMaterial();

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            material

        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.set(
        0,
        CEILING_Y,
        0
    );

    addObject(
        ceiling
    );

}

/* =========================================================
   WALL MATERIAL
========================================================= */

function createWallMaterial(
    width,
    height
){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({

            color:
                0xc8bb48,

            roughness:1,

            side:
                THREE.DoubleSide

        });

    }

    const texture =
        wallTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    const imageWidth =
        texture.image.width;

    const imageHeight =
        texture.image.height;

    const aspect =
        imageWidth /
        imageHeight;

    /*
        One vertical texture tile is exactly the
        wall height.

        Horizontal repetition is proportional.
    */

    const tileWidth =
        height *
        aspect;

    const repeatX =
        width /
        tileWidth;

    texture.repeat.set(

        repeatX,

        1

    );

    texture.needsUpdate =
        true;

    return makeMaterial(
        texture
    );

}

/* =========================================================
   WALL PLANE
========================================================= */

function addWallPlane(
    width,
    height,
    x,
    y,
    z,
    rotationY
){

    const material =
        createWallMaterial(
            width,
            height
        );

    const wall =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            material

        );

    wall.position.set(
        x,
        y,
        z
    );

    wall.rotation.y =
        rotationY;

    addObject(
        wall
    );

    return wall;

}

/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
){

    addWallPlane(
        width,
        height,
        x,
        y,
        z - depth/2,
        0
    );

    addWallPlane(
        width,
        height,
        x,
        y,
        z + depth/2,
        Math.PI
    );

    addWallPlane(
        depth,
        height,
        x - width/2,
        y,
        z,
        Math.PI/2
    );

    addWallPlane(
        depth,
        height,
        x + width/2,
        y,
        z,
        -Math.PI/2
    );

    walls.push({

        minX:
            x -
            width/2,

        maxX:
            x +
            width/2,

        minY:
            y -
            height/2,

        maxY:
            y +
            height/2,

        minZ:
            z -
            depth/2,

        maxZ:
            z +
            depth/2

    });

}

/* =========================================================
   LIGHTS
========================================================= */

const LIGHT_SIZE =
    2;

function addLight(
    x,
    z,
    intensity = 11
){

    /*
        Visible fluorescent panel.
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                LIGHT_SIZE,
                .055,
                LIGHT_SIZE

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xfff3bd,

                side:
                    THREE.DoubleSide

            })

        );

    fixture.position.set(
        x,
        3.025,
        z
    );

    addObject(
        fixture
    );

    /*
        Actual illumination.
    */

    const light =
        new THREE.PointLight(

            0xffe89a,

            intensity,

            15,

            1.7

        );

    light.position.set(
        x,
        2.9,
        z
    );

    scene.add(
        light
    );

}

/* =========================================================
   HOLE SYSTEM
========================================================= */

function createDeathHole(
    x,
    z,
    width,
    depth
){

    deathHoles.push({

        x,
        z,
        width,
        depth

    });

    /*
        Black depth inside hole.
    */

    const pit =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                width,
                10,
                depth

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x030302,

                side:
                    THREE.DoubleSide

            })

        );

    pit.position.set(
        x,
        -5,
        z
    );

    addObject(
        pit
    );

}

/* =========================================================
   HOLE DETECTION
========================================================= */

function isInsideDeathHole(
    x,
    z
){

    for(
        const hole
        of deathHoles
    ){

        if(

            x >
            hole.x -
            hole.width/2 &&

            x <
            hole.x +
            hole.width/2 &&

            z >
            hole.z -
            hole.depth/2 &&

            z <
            hole.z +
            hole.depth/2

        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   LADDER
========================================================= */

function addLadder(
    x,
    y,
    z,
    rotationY = 0
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        y,
        z
    );

    group.rotation.y =
        rotationY;

    const metalMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0x6a624b,

            roughness:
                .9,

            metalness:
                .15

/* =========================================================
   PLAYER COLLISION
========================================================= */

function playerCollides(
    x,
    z
){

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;

    for(
        const wall
        of walls
    ){

        if(
            top <= wall.minY ||
            bottom >= wall.maxY
        ){

            continue;

        }

        const closestX =
            Math.max(

                wall.minX,

                Math.min(
                    x,
                    wall.maxX
                )

            );

        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(
                    z,
                    wall.maxZ
                )

            );

        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;

        if(
            dx*dx +
            dz*dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
){

    for(
        const wall
        of walls
    ){

        const closestX =
            Math.max(

                wall.minX,

                Math.min(
                    x,
                    wall.maxX
                )

            );

        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(
                    z,
                    wall.maxZ
                )

            );

        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;

        if(
            dx*dx +
            dz*dz <
            ENTITY_RADIUS *
            ENTITY_RADIUS
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   LINE OF SIGHT
========================================================= */

function lineBlocked(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2 -
        x1;

    const dz =
        z2 -
        z1;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    const steps =
        Math.ceil(
            distance /
            .35
        );

    for(
        let i = 1;
        i < steps;
        i++
    ){

        const t =
            i /
            steps;

        const x =
            x1 +
            dx*t;

        const z =
            z1 +
            dz*t;

        if(
            entityHitsWall(
                x,
                z
            )
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   ENTITY DIRECTION
========================================================= */

function chooseEntityDirection(){

    if(!entity){

        return null;

    }

    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    const visible =
        !lineBlocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z

        );

    if(visible){

        lastKnownPlayer.set(

            player.position.x,
            player.position.z

        );

        hasLastKnownPosition =
            true;

        lastSeenTimer =
            0;

        return {

            x:
                dx /
                Math.max(
                    distance,
                    .001
                ),

            z:
                dz /
                Math.max(
                    distance,
                    .001
                )

        };

    }

    if(
        hasLastKnownPosition &&
        lastSeenTimer < 2.8
    ){

        const lx =
            lastKnownPlayer.x -
            entity.position.x;

        const lz =
            lastKnownPlayer.y -
            entity.position.z;

        const length =
            Math.hypot(
                lx,
                lz
            );

        if(
            length > .1
        ){

            return {

                x:
                    lx /
                    length,

                z:
                    lz /
                    length

            };

        }

    }

    wanderTimer -=
        .016;

    if(
        wanderTimer <= 0
    ){

        wanderTimer =
            1 +
            Math.random()*3;

        wanderAngle =
            Math.random() *
            Math.PI *
            2;

    }

    return {

        x:
            Math.cos(
                wanderAngle
            ),

        z:
            Math.sin(
                wanderAngle
            )

    };

}

   DIFFICULTY

const DIFFICULTIES = {

    easy:{
        name:"EASY",
        speed:1.5,
        chase:false
    },

    normal:{
        name:"NORMAL",
        speed:5.5,
        chase:true
    },

    },

/* =========================================================
   ANGLE
========================================================= */

function normalizeAngle(
    angle
){

    while(
        angle >
        Math.PI
    ){

        angle -=
            Math.PI*2;

    }

    while(
        angle <
        -Math.PI
    ){

        angle +=
            Math.PI*2;

    }

    return angle;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        dead ||
        fallingIntoLevel
    ){

        return;

    }

    const settings =
        DIFFICULTIES[
            difficulty
        ];

    lastSeenTimer +=
        dt;

    const direction =
        chooseEntityDirection();

    if(direction){

        const targetAngle =
            Math.atan2(
                direction.z,
                direction.x
            );

        const currentAngle =
            Math.atan2(
                entityDirection.y,
                entityDirection.x
            );

        let difference =
            normalizeAngle(

                targetAngle -
                currentAngle

            );

        const maxTurn =
            2.2 *
            dt;

        difference =
            Math.max(
                -maxTurn,
                Math.min(
                    maxTurn,
                    difference
                )
            );

        const angle =
            currentAngle +
            difference;

        entityDirection.x =
            Math.cos(angle);

        entityDirection.y =
            Math.sin(angle);

        const desiredX =
            entityDirection.x *
            settings.speed;

        const desiredZ =
            entityDirection.y *
            settings.speed;

        entityVelocity.x =
            THREE.MathUtils.lerp(

                entityVelocity.x,

                desiredX,

                Math.min(
                    1,
                    dt*2.6
                )

            );

        entityVelocity.y =
            THREE.MathUtils.lerp(

                entityVelocity.y,

                desiredZ,

                Math.min(
                    1,
                    dt*2.6
                )

            );

    }

    const nx =
        entity.position.x +
        entityVelocity.x *
        dt;

    const nz =
        entity.position.z +
        entityVelocity.y *
        dt;

    if(
        !entityHitsWall(
            nx,
            entity.position.z
        )
    ){

        entity.position.x =
            nx;

    }else{

        entityVelocity.x *=
            .15;

    }

    if(
        !entityHitsWall(
            entity.position.x,
            nz
        )
    ){

        entity.position.z =
            nz;

    }else{

        entityVelocity.y *=
            .15;

    }

    /*
        Billboard the entity toward the player.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );

    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );

    if(
        distance <
        1.15
    ){

        killPlayer();

    }

}

const keys = {

        ){

            case "KeyW":
                keys.w = true;
                break;

            case "KeyA":
                keys.a = true;
                break;

            case "KeyS":
                keys.s = true;
                break;

            case "KeyD":
                keys.d = true;
                break;

            case "ShiftLeft":
            case "ShiftRight":
                keys.shift = true;
                break;

            case "Space":

                if(
                    !event.repeat
                ){

                    jumpPressed =
                        true;

                }

                break;

            case "KeyP":

                if(
                    running &&
                    !dead &&
                    !fallingIntoLevel
                ){

                    togglePause();

                }

                break;

            case "Escape":

                if(
                    running &&
                    !dead &&
                    !fallingIntoLevel
                ){

                    togglePause();

                }

                break;

        }

    }
);

                break;

            case "KeyA":
                keys.a = false;
                break;

            case "KeyS":
                keys.s = false;
                break;

            case "KeyD":
                keys.d = false;
                break;

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ){

            return;

        }

        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }

        const sensitivity =
            .0022;

        yaw -=
            event.movementX *
            sensitivity;

        pitch -=
            event.movementY *
            sensitivity;

        const limit =
            Math.PI/2 -
            .05;

        pitch =
            Math.max(

                -limit,

                Math.min(
                    limit,
                    pitch
                )

            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
){

    /*
        The opening sequence takes control of the player.
    */

    if(
        fallingIntoLevel
    ){

        updateFallSequence(
            dt
        );

        return;

    }

    const direction =
        new THREE.Vector3();

    if(keys.w)
        direction.z -= 1;

    if(keys.s)
        direction.z += 1;

    if(keys.a)
        direction.x -= 1;

    if(keys.d)
        direction.x += 1;

    if(
        direction.lengthSq() >
        0
    ){

        direction.normalize();

        direction.applyAxisAngle(

            new THREE.Vector3(
                0,
                1,
                0
            ),

            yaw

        );

        const speed =
            keys.shift
                ? SPRINT_SPEED
                : WALK_SPEED;

        const amount =
            speed *
            dt;

        const nx =
            player.position.x +
            direction.x *
            amount;

        if(
            !playerCollides(
                nx,
                player.position.z
            )
        ){

            player.position.x =
                nx;

        }

        const nz =
            player.position.z +
            direction.z *
            amount;

        if(
            !playerCollides(
                player.position.x,
                nz
            )
        ){

            player.position.z =
                nz;

        }

    }

    /*
        Jump.
    */

    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;

        grounded =
            false;

    }

    jumpPressed =
        false;

    /*
        Gravity.
    */

    velocityY -=
        GRAVITY *
        dt;

    player.position.y +=
        velocityY *
        dt;

    /*
        Actual hole fall.
    */

    if(
        isInsideDeathHole(

            player.position.x,
            player.position.z

        )
    ){

        grounded =
            false;

        /*
            Don't snap back onto the normal floor.
        */

        if(
            player.position.y <
            -2.5
        ){

            killPlayer();

        }

        return;

    }

    /*
        Normal floor.
    */

    if(
        player.position.y <= 0
    ){

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;

    }

}

/* =========================================================
   FALLING INTO BACKROOMS
========================================================= */

function updateFallSequence(
    dt
){

    fallTimer +=
        dt;

    const raw =
        Math.min(

            fallTimer /
            FALL_DURATION,

            1

        );

    /*
        Smooth acceleration at first,
        then a fast drop.
    */

    const eased =
        raw * raw *
        (3 - 2 * raw);

    const startY =
        18;

    const endY =
        0;

    player.position.y =
        THREE.MathUtils.lerp(

            startY,
            endY,
            eased

        );

    /*
        Slight camera movement during the fall.
    */

    const shake =
        Math.sin(
            fallTimer * 31
        ) *
        .025 *
        (1 - raw);

    camera.position.x =
        shake;

    camera.position.y =
        EYE_HEIGHT +
        shake;

    /*
        The camera pitches slightly downward
        as the player realizes where they are.
    */

    camera.rotation.x =
        THREE.MathUtils.lerp(

            -0.28,
            0,

            Math.min(
                raw * 1.3,
                1
            )

        );

    /*
        Slight uncontrolled rotation.
    */

    player.rotation.y =
        yaw +
        Math.sin(
            fallTimer * 3.5
        ) *
        .025 *
        (1 - raw);

    /*
        Fade the world in near the end.
    */

    const fade =
        document.getElementById(
            "fallFade"
        );

    if(
        raw > .12
    ){

        fade.style.opacity =
            String(
                1 -
                Math.min(
                    1,
                    (raw-.12)/.55
                )
            );

    }

    if(
        raw >= 1
    ){

        fallingIntoLevel =
            false;

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;

        camera.position.x =
            0;

        camera.position.y =
            EYE_HEIGHT;

        camera.rotation.x =
            0;

        player.rotation.y =
            yaw;

        document.body.requestPointerLock();

    }

}

/* =========================================================
   CAMERA
========================================================= */

let cameraTime =
    0;

function updateCamera(
    dt
){

    if(
        fallingIntoLevel
    ){

        return;

    }

    cameraTime +=
        dt;

    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;

    /*
        Very subtle handheld-camera movement.

        It should feel like a person holding a camera,
        not like a head-bob videogame effect.
    */

    const movementAmount =
        moving
            ? .004
            : .0012;

    camera.position.x =
        Math.sin(
            cameraTime * 3
        ) *
        movementAmount;

    camera.position.y =
        EYE_HEIGHT +

        Math.sin(
            cameraTime * 3.7
        ) *
        movementAmount;

    camera.rotation.z =
        Math.sin(
            cameraTime * 1.25
        ) *
        .0015;

}

/* =========================================================
   AUDIO
========================================================= */

const entityAudio =
    new Audio(
        AUDIO_URL
    );

entityAudio.loop =
    true;

entityAudio.volume =
    0;

function updateEntityAudio(){

    if(
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ){

        entityAudio.volume =
            0;

        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }

        return;

    }

    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );

    const MAX_DISTANCE =
        30;

    if(
        distance >=
        MAX_DISTANCE
    ){

        entityAudio.volume =
            0;

        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }

        return;

    }

    let volume =
        1 -
        distance /
        MAX_DISTANCE;

    volume =
        Math.pow(
            volume,
            1.8
        ) *
        .85;

    if(
        lineBlocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z

        )
    ){

        volume *=
            .18;

    }

    entityAudio.volume =
        THREE.MathUtils.clamp(

            volume,
            0,
            .85

        );

    if(
        entityAudio.paused &&
        volume > .01
    ){

        entityAudio
            .play()
            .catch(
                () => {}
            );

    }

}

/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    if(
        !floorTexture ||
        !wallTexture ||
        !ceilingTexture
    ){

        await loadEnvironmentTextures();

    }

    buildLevel();

    await createEntity();

    running =
        true;

    paused =
        false;

    dead =
        false;

    fallingIntoLevel =
        true;

    fallTimer =
        0;

    /*
        Spawn high above the Backrooms.
    */

    player.position.set(

        -70,
        18,
        -65

    );

    yaw =
        0;

    pitch =
        -0.28;

    velocityY =
        0;

    grounded =
        false;

    player.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    document.getElementById(
        "fallFade"
    ).style.opacity =
        "1";

    /*
        Pointer lock immediately lets the falling sequence
        behave like the opening camera shot.
    */

    document.body.requestPointerLock();

}

/* =========================================================
   DEATH
========================================================= */

function killPlayer(){

    if(
        dead ||
        !running
    ){

        return;

    }

    dead =
        true;

    fallingIntoLevel =
        false;

    entityAudio.pause();

    entityAudio.volume =
        0;

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

    document.getElementById(
        "deathText"
    ).textContent =
        "THE BACKROOMS GOT YOU";

    document.getElementById(
        "death"
    ).style.display =
        "flex";

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !running ||
        dead ||
        fallingIntoLevel
    ){

        return;

    }

    paused =
        !paused;

    document.getElementById(
        "pause"
    ).style.display =
        paused
            ? "flex"
            : "none";

    if(paused){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    }else{

        document.body.requestPointerLock();

    }

}

/* =========================================================
   RETURN MENU
========================================================= */

function returnToMenu(){

    running =
        false;

    paused =
        false;

    dead =
        false;

    fallingIntoLevel =
        false;

    entityAudio.pause();

    entityAudio.volume =
        0;

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    document.getElementById(
        "menu"
    ).style.display =
        "flex";

}

/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(
    value
){

    difficulty =
        value;

    document
        .querySelectorAll(
            ".difficulty button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );

            }
        );

    document.getElementById(
        value +
        "Btn"
    ).classList.add(
        "selected"
    );

    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            value
        ].name;

}

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "easyBtn"
).onclick =
    () => setDifficulty(
        "easy"
    );

document.getElementById(
    "normalBtn"
).onclick =
    () => setDifficulty(
        "normal"
    );

document.getElementById(
    "hardBtn"
).onclick =
    () => setDifficulty(
        "hard"
    );

document.getElementById(
    "impossibleBtn"
).onclick =
    () => setDifficulty(
        "impossible"
    );

document.getElementById(
    "startBtn"
).onclick =
    () => startGame();

document.getElementById(
    "resumeBtn"
).onclick =

document.getElementById(
    "restartBtn"
).onclick =
    () => startGame();

document.getElementById(
    "menuBtn"
).onclick =

document.getElementById(
    "retryBtn"
).onclick =
    () => startGame();

document.getElementById(
    "deathMenuBtn"
).onclick =

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    () => {

        if(
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement !==
            document.body
        ){

            document.body.requestPointerLock();

        }

    }
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/* =========================================================
   INITIAL LOAD
========================================================= */

loadEnvironmentTextures();

/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(
            dt
        );

        updateEntity(
            dt
        );

        updateEntityAudio();

        updateCamera(
            dt
        );

    }else{

        updateEntityAudio();

    }

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>
