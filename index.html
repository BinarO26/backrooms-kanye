<!-- =========================================================
     LOCAL THREE.JS
     
     IMPORTANT:
     three.min.js must be beside index.html.
     
     There is NO CDN here.
========================================================= -->

<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   BASIC ERROR HANDLING
========================================================= */

const errorBox =
    document.getElementById(
        "error"
    );


function showError(message) {

    errorBox.style.display =
        "block";

    errorBox.textContent =
        message;
}


if (
    typeof THREE ===
    "undefined"
) {

    showError(
        "THREE.JS FAILED TO LOAD.\n\n" +

        "The game expects:\n\n" +

        "./three.min.js\n\n" +

        "to be in the SAME folder as index.html.\n\n" +

        "Check that the filename is exactly:\n" +

        "three.min.js"
    );

    throw new Error(
        "Three.js failed to load."
    );
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x777044
    );


scene.fog =
    new THREE.Fog(
        0x777044,
        45,
        145
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        78,

        window.innerWidth /
        window.innerHeight,

        0.05,

        500
    );


camera.rotation.order =
    "YXZ";


/* =========================================================
   RENDERER
========================================================= */

let renderer;


try {

    renderer =
        new THREE.WebGLRenderer({

            antialias: false,

            powerPreference:
                "high-performance",

            alpha: false

        });

} catch (error) {

    showError(
        "WEBGL COULD NOT START.\n\n" +
        error
    );

    throw error;
}


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);


if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.15;


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight =
    new THREE.AmbientLight(
        0xffedb0,
        0.55
    );


scene.add(
    ambientLight
);


const hemiLight =
    new THREE.HemisphereLight(

        0xfff2b8,

        0x211e15,

        0.65
    );


scene.add(
    hemiLight
);


/* =========================================================
   TEXTURE SYSTEM
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


let wallTexture =
    null;

let floorTexture =
    null;

let ceilingTexture =
    null;


function prepareEnvironmentTexture(
    texture
) {

    if (!texture) {
        return null;
    }


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.magFilter =
        THREE.LinearFilter;


    texture.minFilter =
        THREE.LinearMipmapLinearFilter;


    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            8
        );


    texture.needsUpdate =
        true;


    return texture;
}


function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "Texture loaded:",
                        path
                    );

                    resolve(
                        prepareEnvironmentTexture(
                            texture
                        )
                    );
                },

                undefined,

                error => {

                    console.error(
                        "Texture failed:",
                        path,
                        error
                    );

                    resolve(
                        null
                    );
                }
            );

        }
    );
}


async function loadEnvironmentTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );


    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );


    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );


    const missing = [];


    if (!wallTexture) {

        missing.push(
            "./textures/wall.png"
        );
    }


    if (!floorTexture) {

        missing.push(
            "./textures/floor.png"
        );
    }


    if (!ceilingTexture) {

        missing.push(
            "./textures/ceiling.png"
        );
    }


    if (missing.length) {

        showError(

            "SOME ENVIRONMENT TEXTURES FAILED TO LOAD.\n\n" +

            missing.join("\n") +

            "\n\n" +

            "The game will still run using fallback materials."
        );
    }
}


/* =========================================================
   WORLD ARRAYS
========================================================= */

let worldObjects = [];

let wallColliders = [];

let lights = [];

let deathHoles = [];


function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}


/* =========================================================
   MATERIAL DISPOSAL
========================================================= */

function disposeMaterial(
    material
) {

    if (!material) {
        return;
    }


    if (
        Array.isArray(
            material
        )
    ) {

        material.forEach(
            disposeMaterial
        );

        return;
    }


    if (
        material.map
    ) {

        material.map.dispose();
    }


    material.dispose();
}


function clearWorld() {

    for (
        const object
        of worldObjects
    ) {

        scene.remove(
            object
        );


        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();
                }


                if (
                    child.material
                ) {

                    disposeMaterial(
                        child.material
                    );
                }

            }
        );
    }


    worldObjects = [];

    wallColliders = [];

    deathHoles = [];

    lights = [];


    if (
        exitLight
    ) {

        scene.remove(
            exitLight
        );

        exitLight =
            null;
    }


    exitObject =
        null;


    entity =
        null;
}


/* =========================================================
   WALL MATERIAL
========================================================= */

function createWallMaterial(
    width,
    height
) {

    if (
        !wallTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0xb9ad5c,

            roughness:
                0.88,

            metalness:
                0,

            side:
                THREE.DoubleSide

        });
    }


    const texture =
        wallTexture.clone();


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.ClampToEdgeWrapping;


    const imageWidth =
        texture.image &&
        texture.image.width
            ? texture.image.width
            : 1024;


    const imageHeight =
        texture.image &&
        texture.image.height
            ? texture.image.height
            : 1024;


    const imageAspect =
        imageWidth /
        imageHeight;


    /*
       Keep the wall texture's proportions.

       A wall 4 meters wide and 3.1 meters tall
       should NOT stretch one copy of the PNG
       across the entire surface.
    */

    const textureWidth =
        Math.max(
            height *
            imageAspect,
            0.01
        );


    texture.repeat.x =
        Math.max(
            width /
            textureWidth,
            0.01
        );


    texture.repeat.y =
        1;


    texture.needsUpdate =
        true;


    return new THREE.MeshStandardMaterial({

        map:
            texture,

        color:
            0xffffff,

        roughness:
            0.92,

        metalness:
            0,

        side:
            THREE.DoubleSide
    });
}


/* =========================================================
   WALL CREATION
========================================================= */

const WALL_HEIGHT =
    3.1;


function createWall(
    x,
    z,
    width,
    depth = 0.30
) {

    wallColliders.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2,

        minY:
            0,

        maxY:
            WALL_HEIGHT
    });


    const group =
        new THREE.Group();


    const front =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                WALL_HEIGHT
            ),

            createWallMaterial(
                width,
                WALL_HEIGHT
            )
        );


    front.position.set(

        0,

        WALL_HEIGHT / 2,

        depth / 2

    );


    group.add(
        front
    );


    const back =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                WALL_HEIGHT
            ),

            createWallMaterial(
                width,
                WALL_HEIGHT
            )
        );


    back.rotation.y =
        Math.PI;


    back.position.set(

        0,

        WALL_HEIGHT / 2,

        -depth / 2

    );


    group.add(
        back
    );


    const left =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                WALL_HEIGHT
            ),

            createWallMaterial(
                depth,
                WALL_HEIGHT
            )
        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(

        -width / 2,

        WALL_HEIGHT / 2,

        0

    );


    group.add(
        left
    );


    const right =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                WALL_HEIGHT
            ),

            createWallMaterial(
                depth,
                WALL_HEIGHT
            )
        );


    right.rotation.y =
        -Math.PI / 2;


    right.position.set(

        width / 2,

        WALL_HEIGHT / 2,

        0

    );


    group.add(
        right
    );


    group.position.set(
        x,
        0,
        z
    );


    group.traverse(
        child => {

            if (
                child.isMesh
            ) {

                child.castShadow =
                    false;

                child.receiveShadow =
                    true;
            }

        }
    );


    addWorldObject(
        group
    );
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    let material;


    if (
        floorTexture
    ) {

        const texture =
            floorTexture.clone();

/* =========================================================
   FLOOR HOLES
========================================================= */

function createHoleRoom() {

    const startX =
        -60;

    const startZ =
        58;

    const columns =
        16;

    const rows =
        7;

    const spacing =
        3.7;


    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            if (
                (
                    x * 3 +
                    z * 2
                ) % 7 === 0
            ) {

                continue;
            }


            const px =
                startX +
                x *
                spacing;


            const pz =
                startZ +
                z *
                spacing;


            const hole =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.4,
                        2.4
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x020202,

                        side:
                            THREE.DoubleSide

                    })
                );


            hole.rotation.x =
                -Math.PI / 2;


            hole.position.set(
                px,
                .006,
                pz
            );


            addWorldObject(
                hole
            );


            deathHoles.push({

                x:
                    px,

                z:
                    pz,

                radius:
                    1.05

            });
        }
    }
}

function addFluorescentLight(
    x,
    z,
    intensity = 3.5,
    flicker = false
) {

    /*
       The fixture remains visible.

       Flickering only changes brightness.
       It NEVER hides the fixture.
    */


    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.15,
                .065,
                1.15
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xfff3c2

            })
        );


    fixture.position.set(
        x,
        WALL_HEIGHT -
        .055,
        z
    );


    addWorldObject(
        fixture
    );


    const light =
        new THREE.PointLight(

            0xffe7a2,

            intensity,

            15,

            1.55
        );


    light.position.set(
        x,
        WALL_HEIGHT -
        .35,
        z
    );


    light.castShadow =
        false;


    scene.add(
        light
    );


    lights.push({

        light:
            light,

        fixture:
            fixture,

        base:
            intensity,

        flicker:
            flicker,

        timer:
            Math.random() *
            2,

        phase:
            Math.random() *
            Math.PI *
            2

    });
}


function buildLighting() {

    /*
       Large grid of fluorescent fixtures.

       The irregularity prevents the map
       from looking perfectly procedural.
    */


    for (
        let x = -120;
        x <= 120;
        x += 10
    ) {

        for (
            let z = -108;
            z <= 108;
            z += 10
        ) {

            /*
               Most spaces are lit.

               Some are dim rather than completely
               black, preserving the found-footage look.
            */

            if (
                Math.random() <
                .12
            ) {

                continue;
            }


            const px =
                x +
                (
                    Math.random() -
                    .5
                ) *
                2;


            const pz =
                z +
                (
                    Math.random() -
                    .5
                ) *
                2;


            const flicker =
                Math.random() <
                .14;


            const intensity =
                flicker
                    ? 2.3
                    : 3.0 +
                      Math.random() *
                      1.4;


            addFluorescentLight(
                px,
                pz,
                intensity,
                flicker
            );
        }
    }


    /*
       Important landmark lights.
    */

    addFluorescentLight(
        -18,
        -64,
        5.0
    );

    addFluorescentLight(
        5,
        -64,
        4.8
    );

    addFluorescentLight(
        29,
        -8,
        5.0
    );

    addFluorescentLight(
        4,
        19,
        5.2
    );

    addFluorescentLight(
        32,
        60,
        5.0
    );

    addFluorescentLight(
        -55,
        58,
        2.0,
        true
    );

    addFluorescentLight(
        -29,
        68,
        2.1,
        true
    );
}


function updateLights(
    dt
) {

    for (
        const item
        of lights
    ) {

        if (
            !item.flicker
        ) {

            continue;
        }


        item.timer -=
            dt;


        if (
            item.timer <= 0
        ) {

            item.timer =
                .04 +
                Math.random() *
                .55;


            const flick =
                Math.random();


            /*
               NEVER turn the light fixture off.

               Never set visibility false.

               Instead we rapidly change intensity.
            */

            if (
                flick < .15
            ) {

                item.light.intensity =
                    item.base *
                    .18;

            } else {

                item.light.intensity =
                    item.base *
                    (
                        .65 +
                        Math.random() *
                        .55
                    );
            }
        }
    }
}

/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;


    const top =
        bottom +
        PLAYER_HEIGHT;


    for (
        const wall
        of wallColliders
    ) {

        if (
            top <=
            wall.minY
        ) {

            continue;
        }


        if (
            bottom >=
            wall.maxY
        ) {

            continue;
        }


        const closestX =
            Math.max(

                wall.minX,

                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
) {

    const radius =
        .48;


    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(

                wall.minX,

                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            radius *
            radius
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   LINE OF SIGHT
========================================================= */

function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 -
        x1;


    const dz =
        z2 -
        z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.max(
            1,
            Math.ceil(
                distance /
                .3
            )
        );


    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i /
            steps;


        if (
            entityHitsWall(

                x1 +
                dx * t,

                z1 +
                dz * t

            )
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   HOLES
========================================================= */

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;


        const dz =
            player.position.z -
            hole.z;


        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;
        }
    }


    return false;
}

    green.position.y =

    );

let entity =
    null;


/*
   ENTITY FILES ARE IN ROOT.

   NOT textures/entity.png.
*/

const ENTITY_TEXTURE =
    "./entity.png";

const ENTITY_AUDIO =
    "./entity.mp3";


const entityAudio =
    new Audio(
        ENTITY_AUDIO
    );


entityAudio.loop =
    true;

entityAudio.volume =
    0;

entityAudio.preload =
    "auto";


function createEntity() {

    return new Promise(
        resolve => {

            textureLoader.load(

                ENTITY_TEXTURE,

                texture => {

                    /*
                       ONLY THE ENTITY USES
                       UNLIT PNG RENDERING.

                       The environment does NOT.
                    */

                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    texture.magFilter =
                        THREE.LinearFilter;


                    texture.minFilter =
                        THREE.LinearMipmapLinearFilter;


                    const width =
                        texture.image.width ||
                        512;


                    const height =
                        texture.image.height ||
                        512;


                    const aspect =
                        width /
                        height;


                    const entityHeight =
                        1.65;


                    const entityWidth =
                        entityHeight *
                        aspect;


                    const material =
                        new THREE.MeshBasicMaterial({

                            map:
                                texture,

                            transparent:
                                true,

                            alphaTest:
                                .02,

                            side:
                                THREE.DoubleSide,

                            depthWrite:
                                true,

                            fog:
                                false,

                            color:
                                0xffffff

                        });


                    entity =
                        new THREE.Mesh(

                            new THREE.PlaneGeometry(

                                entityWidth,

                                entityHeight

                            ),

                            material
                        );


                    entity.position.set(

                        70,

                        entityHeight / 2,

                        -65

                    );


                    addWorldObject(
                        entity
                    );


                    resolve();
                },

                undefined,

                error => {

                    console.warn(
                        "entity.png failed:",
                        error
                    );


                    /*
                       Fallback entity.
                    */

                    entity =
                        new THREE.Mesh(

                            new THREE.PlaneGeometry(
                                1,
                                1.65
                            ),

                            new THREE.MeshBasicMaterial({

                                color:
                                    0x020202,

                                transparent:
                                    true,

                                opacity:
                                    .95

                            })
                        );


                    entity.position.set(

                        70,

                        .825,

                        -65

                    );


                    addWorldObject(
                        entity
                    );


                    resolve();
                }
            );
        }
    );
}


/* =========================================================
   ENTITY AI
========================================================= */

let entityDirection =
    new THREE.Vector2(
        1,
        0
    );


let entityVelocity =
    new THREE.Vector2(
        0,
        0
    );


let entityTarget =
    new THREE.Vector2();


let entityRepathTimer =
    0;


function findOpenDirection(
    baseAngle
) {

    const choices = [

        baseAngle,

        baseAngle +
        Math.PI / 4,

        baseAngle -
        Math.PI / 4,

        baseAngle +
        Math.PI / 2,

        baseAngle -
        Math.PI / 2,

        baseAngle +
        Math.PI * .75,

        baseAngle -
        Math.PI * .75,

        baseAngle +
        Math.PI

    ];


    let best =
        null;


    let bestScore =
        -Infinity;


    for (
        const angle
        of choices
    ) {

        const testDistance =
            2.4;


        const tx =
            entity.position.x +
            Math.cos(angle) *
            testDistance;


        const tz =
            entity.position.z +
            Math.sin(angle) *
            testDistance;


        if (
            entityHitsWall(
                tx,
                tz
            )
        ) {

            continue;
        }


        const playerDistance =
            Math.hypot(

                player.position.x -
                tx,

                player.position.z -
                tz
            );


        const score =
            -playerDistance +
            Math.random() *
            1.5;


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;

            best =
                angle;
        }
    }


    return best;
}


function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    /*
       The entity ALWAYS knows where
       the player currently is.

       No artificial detection radius.
    */

    entityTarget.set(

        player.position.x,

        player.position.z

    );


    const dx =
        entityTarget.x -
        entity.position.x;


    const dz =
        entityTarget.y -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if (
        distance >
        .001
    ) {

        const desiredAngle =
            Math.atan2(
                dz,
                dx
            );


        const currentAngle =
            Math.atan2(

                entityDirection.y,

                entityDirection.x

            );


        let difference =
            desiredAngle -
            currentAngle;


        while (
            difference >
            Math.PI
        ) {

            difference -=
                Math.PI * 2;
        }


        while (
            difference <
            -Math.PI
        ) {

            difference +=
                Math.PI * 2;
        }


        const turnRate =
            4.5;


        const turn =
            THREE.MathUtils.clamp(

                difference,

                -turnRate * dt,

                turnRate * dt

            );


        const newAngle =
            currentAngle +
            turn;


        entityDirection.set(

            Math.cos(
                newAngle
            ),

            Math.sin(
                newAngle
            )

        );
    }


    /*
       Constantly repath around walls.
    */

    entityRepathTimer -=
        dt;


    if (
        entityRepathTimer <= 0
    ) {

        entityRepathTimer =
            .12;


        const angle =
            Math.atan2(

                dz,

                dx

            );


        const testX =
            entity.position.x +
            Math.cos(angle) *
            2.2;


        const testZ =
            entity.position.z +
            Math.sin(angle) *
            2.2;


        if (
            entityHitsWall(
                testX,
                testZ
            )
        ) {

            const openAngle =
                findOpenDirection(
                    angle
                );


            if (
                openAngle !== null
            ) {

                entityDirection.set(

                    Math.cos(
                        openAngle
                    ),

                    Math.sin(
                        openAngle
                    )

                );
            }
        }
    }


    const settings =
        SETTINGS[difficulty];


    const speed =
        settings.speed;


    const movementX =
        entityDirection.x *
        speed *
        dt;


    const movementZ =
        entityDirection.y *
        speed *
        dt;


    const nextX =
        entity.position.x +
        movementX;


    const nextZ =
        entity.position.z +
        movementZ;


    /*
       X collision.
    */

    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        const alternative =
            findOpenDirection(
                Math.atan2(
                    entityDirection.y,
                    entityDirection.x
                )
            );


        if (
            alternative !== null
        ) {

            entityDirection.set(

                Math.cos(
                    alternative
                ),

                Math.sin(
                    alternative
                )

            );
        }
    }


    /*
       Z collision.
    */

    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        const alternative =
            findOpenDirection(
                Math.atan2(
                    entityDirection.y,
                    entityDirection.x
                )
            );


        if (
            alternative !== null
        ) {

            entityDirection.set(

                Math.cos(
                    alternative
                ),

                Math.sin(
                    alternative
                )

            );
        }
    }


    /*
       Billboard toward player.

       This keeps entity.png readable.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );


    const killDistance =
        difficulty ===
        "nightmare"

            ? 1.65

            : 1.35;


    if (
        distance <
        killDistance
    ) {

        killPlayer(
            "THE ENTITY FOUND YOU."
        );
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;
    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );


    const maxDistance =
        40;


    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;
    }


    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.5

        ) *
        .85;


    if (
        blocked(

            player.position.x,

            player.position.z,

            entity.position.x,

            entity.position.z

        )
    ) {

        volume *=
            .3;
    }


    entityAudio.volume =
        THREE.MathUtils.clamp(

            volume,

            0,

            .85

        );


    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;
    }


    let forward =
        0;

    let side =
        0;


    if (
        keys.w
    ) {

        forward +=
            1;
    }


    if (
        keys.s
    ) {

        forward -=
            1;
    }


    if (
        keys.d
    ) {

        side +=
            1;
    }


    if (
        keys.a
    ) {

        side -=
            1;
    }


    const inputLength =
        Math.hypot(
            forward,
            side
        );


    if (
        inputLength >
        0
    ) {

        forward /=
            inputLength;

        side /=
            inputLength;
    }


    let speed;


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.1
                : 3.8;

    } else if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.3
                : 3.4;

    } else if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.5
                : 3.25;

    } else {

        speed =
            keys.shift
                ? 5.9
                : 3.5;
    }


    /*
       IMPORTANT:

       W = forward in the direction
       the camera is facing.

       This fixes the previous W/S reversal.
    */

    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    const dx =
        (
            side * cos +
            forward * sin
        ) *
        speed *
        dt;


    /*
       The NEGATIVE cos here is intentional.

       At yaw = 0 the camera looks toward -Z.

       Therefore:
       W -> -Z
       S -> +Z
    */

    const dz =
        (
            -side * sin -
            forward * cos
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        dx;


    const nextZ =
        player.position.z +
        dz;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;
    }


    jumpPressed =
        false;


    velocityY -=
        20 *
        dt;


    player.position.y +=
        velocityY *
        dt;


    if (
        player.position.y <=
        0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;
    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }


    checkExit();
}


/* =========================================================
   FALLING INTRO
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;


    const progress =
        Math.min(

            fallTimer /
            FALL_DURATION,

            1

        );


    const eased =
        1 -
        Math.pow(

            1 -
            progress,

            3

        );


    player.position.y =
        17 -
        17 *
        eased;


    camera.position.y =
        EYE_HEIGHT;


    camera.rotation.x =
        THREE.MathUtils.lerp(

            -.32,

            0,

            Math.min(
                progress *
                1.3,

                1
            )

        );


    camera.rotation.z =
        Math.sin(

            progress *
            Math.PI *
            9

        ) *
        .025;


    if (
        progress >=
        1
    ) {

        fallingIntoLevel =
            false;


        player.position.y =
            0;


        camera.position.set(

            0,

            EYE_HEIGHT,

            0

        );


        camera.rotation.set(
            0,
            0,
            0
        );


        requestPointerLock();
    }
}


/* =========================================================
   CAMERA EFFECTS
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;
    }


    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const walkAmount =
        moving
            ? .010
            : .003;


    camera.position.x =
        Math.sin(
            cameraTime *
            3.7
        ) *
        walkAmount;


    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime *
            4.4
        ) *
        walkAmount;


    camera.position.z =
        Math.cos(
            cameraTime *
            3.1
        ) *
        walkAmount *
        .5;


    camera.rotation.z =
        Math.sin(
            cameraTime *
            .85
        ) *
        .003;


    /*
       Tiny analog camera instability.
    */

    if (
        Math.random() <
        .004
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) *
            .025;


        camera.position.y +=
            (
                Math.random() -
                .5
            ) *
            .02;


        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) *
            .012;
    }
}

========================================================= */

    if (
        document.body.requestPointerLock
    ) {

        document.body
            .requestPointerLock()
            .catch(
                () => {}
            );
    }
}


document.addEventListener(

        document.getElementById(
            "pause"
        ).style.display =
            "none";


        document.getElementById(
            "death"
        ).style.display =
            "none";


        showMessage(
            "ENTERING LEVEL 0..."
        );


    } catch (
        error
    ) {

        console.error(
            error
        );


        showError(

            "GAME START ERROR\n\n" +
            error.stack

        );

    } finally {

        starting =
            false;
    }
}

    document.getElementById(

    );


    document.getElementById(

        value.toUpperCase();
}

/* =========================================================
   CRT TOGGLE
========================================================= */

let crtEnabled =
    true;


const crtOverlay =
    document.getElementById(
        "crtOverlay"
    );


const crtButton =
    document.getElementById(
        "crtButton"
    );


function updateCRTButton() {

    if (
        crtEnabled
    ) {

        crtOverlay.classList.remove(
            "off"
        );


        crtButton.textContent =
            "CRT: ON";

    } else {

        crtOverlay.classList.add(
            "off"
        );


        crtButton.textContent =
            "CRT: OFF";
    }
}


crtButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        crtEnabled =
            !crtEnabled;


        updateCRTButton();
    }
);


updateCRTButton();


/* =========================================================
   MENU IMAGE CYCLING
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );


let menuIndex =
    Math.floor(
        Math.random() *
        menuImages.length
    );


menuImages.forEach(
    image => {

        image.classList.remove(
            "active"
        );
    }
);


if (
    menuImages[menuIndex]
) {

    menuImages[menuIndex]
        .classList.add(
            "active"
        );
}


function cycleMenuImage() {

    if (
        menuImages.length ===
        0
    ) {

        return;
    }


    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );


    /*
       Random image instead of
       always going in order.
    */

    let nextIndex;


    do {

        nextIndex =
            Math.floor(
                Math.random() *
                menuImages.length
            );

    } while (
        nextIndex ===
        menuIndex &&
        menuImages.length > 1
    );


    menuIndex =
        nextIndex;


    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}


setInterval(
    cycleMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio ||
                1,

                1.5

            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock =
    new THREE.Clock();


let recordingTime =
    0;


function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;
    }


    recordingTime +=
        dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total /
            3600
        );


    const minutes =
        Math.floor(

            (
                total %
                3600
            ) /
            60

        );


    const seconds =
        total %
        60;


    const format =
        value =>

            String(
                value
            ).padStart(
                2,
                "0"
            );


    document.getElementById(
        "tapeTime"
    ).textContent =

        format(hours) +
        ":" +
        format(minutes) +
        ":" +
        format(seconds);
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(

            clock.getDelta(),

            .05

        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        updateLights(
            dt
        );


        updateCamera(
            dt
        );


        updateEntityAudio();


        updateMessage(
            dt
        );


        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIALIZATION
========================================================= */

loadEnvironmentTextures();

animate();

</script>
