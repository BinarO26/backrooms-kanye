/* =========================================================

/* =========================================================

========================================================= */

#menu,
#pause,

}

#menu {
    display: block;

}

.menuImage {
    position: absolute;
    inset: 0;

    height: 100%;

    opacity: 0;

.menuImage.active {

/* =========================================================
   STRONG SECURITY CAMERA / CRT EFFECT
========================================================= */

.camScanlines,

.camScanlines {
    opacity: .20;

    background:
        repeating-linear-gradient(

            rgba(255,255,255,.025) 0px,

            transparent 4px

}

.camTracking {
    opacity: .09;

        repeating-linear-gradient(

            transparent 10px,
            rgba(255,255,255,.12) 11px,
            transparent 12px,
            transparent 22px

    animation:
        trackingMove 7s linear infinite;
}

@keyframes trackingMove {

    from {
        transform:
            translateY(-20px);
    }

    to {
        transform:
            translateY(20px);
    }
}

.camGrain {
    opacity: .085;

    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.8) 0px,
            rgba(255,255,255,.8) 1px,
            transparent 1px,
            transparent 4px
        );

    background-size:
        5px 5px;

    animation:
        grainMove .16s steps(2) infinite;
}

@keyframes grainMove {

    0% {
        transform:
            translate(0,0);
    }

    25% {
        transform:
            translate(-2px,1px);
    }

    50% {
        transform:
            translate(1px,-2px);
    }

    75% {

    }

}

.camVignette {

.camBleed {

.camFlicker {

@keyframes cameraFlicker {

    }

    }

.camNoiseBar {

@keyframes noiseBar {

<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   THREE CHECK
========================================================= */

if (
    typeof THREE === "undefined"
) {

    const error =
        document.getElementById("error");

    error.style.display =
        "block";

    error.textContent =
        "THREE.JS FAILED TO LOAD.\n\n" +
        "The game expects this exact file:\n\n" +
        "three.min.js\n\n" +
        "It must be in the SAME folder as index.html.\n\n" +
        "Your GitHub Pages files should contain:\n\n" +
        "index.html\n" +
        "three.min.js\n" +
        "entity.png\n" +
        "entity.mp3\n" +
        "textures/wall.png\n" +
        "textures/floor.png\n" +
        "textures/ceiling.png";

    throw new Error(
        "Local Three.js failed to load."
    );
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x17160e
    );

scene.fog =
    new THREE.FogExp2(
        0x17160e,
        0.012
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth /
        innerHeight,
        0.03,
        500
    );

camera.rotation.order =
    "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        powerPreference:
            "high-performance"

    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    0.72;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   GLOBAL LIGHTING
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0x504b30,
        0.16
    );

scene.add(
    ambient
);

const hemisphere =
    new THREE.HemisphereLight(
        0x777050,
        0x070604,
        0.22
    );

scene.add(
    hemisphere
);


/* =========================================================
   TEXTURE LOADER
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture =
    null;

let floorTexture =
    null;

let ceilingTexture =
    null;


/* =========================================================
   TEXTURE PREPARATION
========================================================= */

function prepareEnvironmentTexture(
    texture
) {

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer
                .capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate =
        true;

    return texture;
}


/* =========================================================
   LOAD TEXTURE
========================================================= */

function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        prepareEnvironmentTexture(
                            texture
                        )
                    );
                },

                undefined,

                error => {

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    resolve(
                        null
                    );
                }
            );

        }
    );
}


/* =========================================================
   LOAD ENVIRONMENT
========================================================= */

async function loadTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing = [];

    if (!wallTexture) {

        missing.push(
            "textures/wall.png"
        );
    }

    if (!floorTexture) {

        missing.push(
            "textures/floor.png"
        );
    }

    if (!ceilingTexture) {

        missing.push(
            "textures/ceiling.png"
        );
    }

    if (missing.length) {

        const error =
            document.getElementById(
                "error"
            );

        error.style.display =
            "block";

        error.textContent =
            "ENVIRONMENT TEXTURE ERROR\n\n" +
            "Could not load:\n\n" +
            missing.join("\n") +
            "\n\n" +
            "Expected structure:\n\n" +
            "index.html\n" +
            "three.min.js\n" +
            "entity.png\n" +
            "entity.mp3\n" +
            "textures/wall.png\n" +
            "textures/floor.png\n" +
            "textures/ceiling.png";
    }
}


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(
    player
);

const EYE_HEIGHT =
    1.18;

const PLAYER_HEIGHT =
    1.55;

const PLAYER_RADIUS =
    0.28;

let yaw = 0;

let pitch = 0;

let velocityY = 0;

let grounded = false;

let running = false;

let paused = false;

let dead = false;

let fallingIntoLevel =
    false;

let fallTimer = 0;

const FALL_DURATION =
    2.25;

let difficulty =
    "normal";


/* =========================================================
   WORLD STORAGE
========================================================= */

let worldObjects = [];

let wallColliders = [];

let deathHoles = [];

let lights = [];


/* =========================================================
   ADD WORLD OBJECT
========================================================= */

function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}


/* =========================================================
   MATERIAL DISPOSAL
========================================================= */

function disposeMaterial(
    material
) {

    if (!material) {

        return;
    }

    if (
        Array.isArray(
            material
        )
    ) {

        material.forEach(
            disposeMaterial
        );

        return;
    }

    if (
        material.map
    ) {

        material.map.dispose();
    }

    material.dispose();
}


/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld() {

    for (
        const object
        of worldObjects
    ) {

        scene.remove(
            object
        );

        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();
                }

                if (
                    child.material
                ) {

                    disposeMaterial(
                        child.material
                    );
                }

            }
        );
    }

    worldObjects = [];

    wallColliders = [];

    deathHoles = [];

    for (
        const item
        of lights
    ) {

        scene.remove(
            item.light
        );
    }

    lights = [];

    if (
        exitLight
    ) {

        scene.remove(
            exitLight
        );

        exitLight = null;
    }

    exitObject =
        null;

    entity =
        null;
}


/* =========================================================
   WALL MATERIAL
========================================================= */

function createWallMaterial(
    width,
    height
) {

    if (
        !wallTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0x9d9140,

            roughness:
                .88,

            metalness:
                0,

            side:
                THREE.DoubleSide
        });
    }

    const texture =
        wallTexture.clone();

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    const imageWidth =
        texture.image?.width ||
        1;

    const imageHeight =
        texture.image?.height ||
        1;

    const aspect =
        imageWidth /
        imageHeight;

    const naturalWidth =
        height *
        aspect;

    texture.repeat.set(
        Math.max(
            width /
            naturalWidth,
            .001
        ),
        1
    );

    texture.needsUpdate =
        true;

    /*
       IMPORTANT:

       Environment textures are LIT.

       The texture itself is not replaced
       by a flat color.

       Lighting creates the dark/shadowy
       horror-game appearance.
    */

    return new THREE.MeshStandardMaterial({

        map:
            texture,

        color:
            0xffffff,

        roughness:
            .93,

        metalness:
            0,

        side:
            THREE.DoubleSide
    });
}


/* =========================================================
   CREATE WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = .32
) {

    const height =
        3.1;

    wallColliders.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2,

        minY:
            0,

        maxY:
            height

    });


    const group =
        new THREE.Group();


    const front =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                width,
                height
            )
        );

    front.position.set(
        0,
        height / 2,
        depth / 2
    );

    front.castShadow =
        true;

    front.receiveShadow =
        true;

    group.add(
        front
    );


    const back =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                width,
                height
            )
        );

    back.rotation.y =
        Math.PI;

    back.position.set(
        0,
        height / 2,
        -depth / 2
    );

    back.castShadow =
        true;

    back.receiveShadow =
        true;

    group.add(
        back
    );


    const left =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height

/* =========================================================
   FLOOR HOLES
========================================================= */

function createHoleRoom() {

    const startX =
        -57;

    const startZ =
        53;

    const columns =
        18;

    const rows =
        8;

    const spacing =
        3.5;

    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            if (
                (x + z) % 5 === 0
            ) {

                continue;
            }

            const px =
                startX +
                x * spacing;

            const pz =
                startZ +
                z * spacing;

            const hole =
                new THREE.Mesh(

                    new THREE.CircleGeometry(
                        1.30,
                        24
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x010101,

                        side:
                            THREE.DoubleSide
                    })
                );

            hole.rotation.x =
                -Math.PI / 2;

            hole.position.set(
                px,
                .008,
                pz
            );

            addWorldObject(
                hole
            );

            deathHoles.push({

                x:
                    px,

                z:
                    pz,

                radius:
                    1.28
            });
        }
    }
}

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(
    dt
) {

    for (
        const item
        of lights
    ) {

        if (
            !item.flicker
        ) {

            continue;
        }

        item.timer -=
            dt;

        if (
            item.timer <= 0
        ) {

            item.timer =
                .08 +
                Math.random() *
                .55;

            const factor =
                .45 +
                Math.random() *
                .55;

            /*
               NEVER set intensity to zero.

               NEVER hide fixture.

               The light can flicker,
               but the fluorescent tube
               always remains visible.
            */

            item.light.intensity =
                item.base *
                factor;

            item.fixture.material
                .emissiveIntensity =
                .8 +
                factor *
                1.5;
        }
    }
}


/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;

    for (
        const wall
        of wallColliders
    ) {

        if (
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {

            continue;
        }

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;

        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }

    return false;
}


/* =========================================================
   ENTITY WALL COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
) {

    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;

        if (
            dx * dx +
            dz * dz <
            .43 *
            .43
        ) {

            return true;
        }
    }

    return false;
}


/* =========================================================
   LINE OF SIGHT
========================================================= */

function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 -
        x1;

    const dz =
        z2 -
        z1;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    const steps =
        Math.ceil(
            distance /
            .35
        );

    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i /
            steps;

        if (
            entityHitsWall(

                x1 +
                dx * t,

                z1 +
                dz * t
            )
        ) {

            return true;
        }
    }

    return false;
}


/* =========================================================
   HOLE CHECK
========================================================= */

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;

        const dz =
            player.position.z -
            hole.z;

        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;
        }
    }

    return false;
}

                    resolve();
                }
            );
        }
    );
}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    const settings =
        SETTINGS[
            difficulty
        ];


    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );


    lastSeen +=
        dt;


    const visible =
        distance <
        settings.detection &&
        !blocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z
        );


    let dx2 = 0;

    let dz2 = 0;


    if (
        visible
    ) {

        lastKnown.set(

            player.position.x,
            player.position.z
        );

        lastSeen =
            0;


        dx2 =
            dx /
            Math.max(
                distance,
                .001
            );

        dz2 =
            dz /
            Math.max(
                distance,
                .001
            );

    } else if (
        lastSeen < 3.2
    ) {

        const lx =
            lastKnown.x -
            entity.position.x;

        const lz =
            lastKnown.y -
            entity.position.z;

        const len =
            Math.hypot(
                lx,
                lz
            );

        if (
            len > .1
        ) {

            dx2 =
                lx / len;

            dz2 =
                lz / len;
        }

    } else {

        wanderTimer -=
            dt;

        if (
            wanderTimer <= 0
        ) {

            wanderTimer =
                .5 +
                Math.random() *
                1.8;

            wanderAngle =
                Math.random() *
                Math.PI *
                2;
        }

        dx2 =
            Math.cos(
                wanderAngle
            );

        dz2 =
            Math.sin(
                wanderAngle
            );
    }


    const targetAngle =
        Math.atan2(
            dz2,
            dx2
        );


    const currentAngle =
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );


    let difference =
        targetAngle -
        currentAngle;


    while (
        difference >
        Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }


    while (
        difference <
        -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }


    difference =
        Math.max(

            -3.4 * dt,

            Math.min(
                3.4 * dt,
                difference
            )
        );


    const angle =
        currentAngle +
        difference;


    entityDirection.x =
        Math.cos(
            angle
        );

    entityDirection.y =
        Math.sin(
            angle
        );


    entityVelocity.x =
        THREE.MathUtils.lerp(

            entityVelocity.x,

            entityDirection.x *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );


    entityVelocity.y =
        THREE.MathUtils.lerp(

            entityVelocity.y,

            entityDirection.y *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );


    const moveX =
        entityVelocity.x *
        dt;

    const moveZ =
        entityVelocity.y *
        dt;


    const nextX =
        entity.position.x +
        moveX;

    const nextZ =
        entity.position.z +
        moveZ;


    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        entityVelocity.x =
            0;

        wanderAngle +=
            Math.PI / 2;

        entityDirection.set(

            Math.cos(
                wanderAngle
            ),

            Math.sin(
                wanderAngle
            )
        );
    }


    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        entityVelocity.y =
            0;

        wanderAngle +=
            Math.PI / 2;

        entityDirection.set(

            Math.cos(
                wanderAngle
            ),

            Math.sin(
                wanderAngle
            )
        );
    }


    /*
       Billboard toward player.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );


    const killDistance =
        difficulty ===
        "nightmare"
            ? 1.55
            : 1.25;


    if (
        distance <
        killDistance
    ) {

        killPlayer();
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;
    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z
        );


    const maxDistance =
        34;


    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;
    }


    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.6

        ) * .9;


    if (
        blocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z
        )
    ) {

        volume *=
            .2;
    }


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );


    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;
    }


    /*
       W = forward
       S = backward

       This is intentionally written
       explicitly rather than using
       inverted signs.
    */

    let forward =
        0;

    let side =
        0;


    if (
        keys.w
    ) {

        forward +=
            1;
    }

    if (
        keys.s
    ) {

        forward -=
            1;
    }

    if (
        keys.d
    ) {

        side +=
            1;
    }

    if (
        keys.a
    ) {

        side -=
            1;
    }


    const length =
        Math.hypot(
            forward,
            side
        );


    if (
        length > 0
    ) {

        forward /=
            length;

        side /=
            length;
    }


    let speed =
        keys.shift
            ? 5.9
            : 3.5;


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.1
                : 3.8;
    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.3
                : 3.4;
    }


    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.5
                : 3.25;
    }


    /*
       Camera-forward movement.

       This makes W always move toward
       exactly what the player is facing.
    */

    const forwardX =
        Math.sin(
            yaw
        );

    const forwardZ =
        Math.cos(
            yaw
        );

    const rightX =
        Math.cos(
            yaw
        );

    const rightZ =
        -Math.sin(
            yaw
        );


    const dx =
        (
            forwardX *
            forward +

            rightX *
            side
        ) *
        speed *
        dt;


    const dz =
        (
            forwardZ *
            forward +

            rightZ *
            side
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        dx;

    const nextZ =
        player.position.z +
        dz;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;
    }


    jumpPressed =
        false;


    velocityY -=
        20 *
        dt;

    player.position.y +=
        velocityY *
        dt;


    if (
        player.position.y <= 0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;
    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }


    checkExit();
}


/* =========================================================
   FALL INTRO
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;


    const progress =
        Math.min(

            fallTimer /
            FALL_DURATION,

            1
        );


    const eased =
        1 -
        Math.pow(
            1 - progress,
            3
        );


    player.position.y =
        17 -
        17 *
        eased;


    camera.position.y =
        EYE_HEIGHT;


    camera.rotation.x =
        THREE.MathUtils.lerp(

            -.32,

            0,

            Math.min(
                progress * 1.3,
                1
            )
        );


    camera.rotation.z =
        Math.sin(

            progress *
            Math.PI *
            9

        ) *
        .025;


    if (
        progress >=
        1
    ) {

        fallingIntoLevel =
            false;

        player.position.y =
            0;

        camera.position.x =
            0;

        camera.position.y =
            EYE_HEIGHT;

        camera.position.z =
            0;

        camera.rotation.x =
            0;

        camera.rotation.z =
            0;

        document.body
            .requestPointerLock()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   CAMERA MOVEMENT / HORROR BOB
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;
    }


    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const amount =
        moving
            ? .009
            : .0025;


    camera.position.x =
        Math.sin(
            cameraTime * 3.4
        ) *
        amount;


    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime * 4.1
        ) *
        amount;


    camera.position.z =
        Math.cos(
            cameraTime * 3.1
        ) *
        amount *
        .55;


    camera.rotation.z =
        Math.sin(
            cameraTime * .9
        ) *
        .003;


    if (
        Math.random() <
        .004
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) *
            .035;

        camera.position.y +=
            (
                Math.random() -
                .5
            ) *
            .025;

        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) *
            .025;
    }
}

/* =========================================================
   RANDOM MENU IMAGE
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex =
    -1;


function chooseRandomMenuImage() {

    if (
        menuImages.length ===
        0
    ) {

        return;
    }


    let nextIndex =
        Math.floor(
            Math.random() *
            menuImages.length
        );


    /*
       Don't immediately pick the
       same image again.
    */

    if (
        menuImages.length > 1 &&
        nextIndex === menuIndex
    ) {

        nextIndex =
            (
                nextIndex +
                1 +
                Math.floor(
                    Math.random() *
                    (
                        menuImages.length -
                        1
                    )
                )
            ) %
            menuImages.length;
    }


    if (
        menuIndex >= 0
    ) {

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );
    }


    menuIndex =
        nextIndex;


    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}


/*
   Pick a random image immediately.

   This prevents the menu from starting
   on a blank/black screen while waiting
   for a timer.
*/

chooseRandomMenuImage();


/*
   Change to another random image
   every 60 seconds.
*/

setInterval(
    chooseRandomMenuImage,

);

/* =========================================================

========================================================= */

const clock =
    new THREE.Clock();

let recordingTime =
    0;


function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;
    }


    recordingTime +=
        dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total /
            3600
        );


    const minutes =
        Math.floor(
            (
                total %
                3600
            ) /
            60
        );


    const seconds =
        total %
        60;


    const format =
        n =>
            String(n)
                .padStart(
                    2,
                    "0"
                );


    document.getElementById(
        "tapeTime"
    ).textContent =

        `${format(hours)}:` +
        `${format(minutes)}:` +
        `${format(seconds)}`;
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );

        updateEntity(
            dt
        );

        updateLights(
            dt
        );

        updateCamera(
            dt
        );

        updateEntityAudio();

        updateMessage(
            dt
        );

        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadTextures();

animate();

</script>

</body>

</html>
