/* =========================================================

========================================================= */

function makeWallTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 1024;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "#c5b344";

    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );

    for(
        let x = 0;
        x < 1024;
        x += 30
    ) {

        ctx.fillStyle =
            "rgba(80,65,10,.12)";

        ctx.fillRect(
            x,
            0,
            2,
            1024
        );
    }

    for(
        let i = 0;
        i < 50000;
        i++
    ) {

        ctx.fillStyle =
            Math.random() > .5
            ? "rgba(255,240,120,.06)"
            : "rgba(40,30,5,.09)";

        const size =
            Math.random() * 3 + 1;

        ctx.fillRect(
            Math.random() * 1024,
            Math.random() * 1024,
            size,
            size
        );
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        2.5,
        2.5
    );

    return texture;
}


/* =========================================================
   DAMP GREY CARPET
========================================================= */

function makeFloorTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 1024;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "#555754";

    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );

    /*
       Carpet fibers.
    */

    for(
        let i = 0;
        i < 65000;
        i++
    ) {

        const shade =
            90 +
            Math.floor(
                Math.random() * 45
            );

        ctx.fillStyle =
            `rgba(
                ${shade},
                ${shade},
                ${shade - 4},
                .07
            )`;

        const size =
            Math.random() * 3 + 1;

        ctx.fillRect(
            Math.random() * 1024,
            Math.random() * 1024,
            size,
            size
        );
    }

    /*
       Damp stains.
    */

    for(
        let i = 0;
        i < 80;
        i++
    ) {

        const x =
            Math.random() * 1024;

        const y =
            Math.random() * 1024;

        const radius =
            Math.random() * 60 + 15;

        const gradient =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                radius
            );

        gradient.addColorStop(
            0,
            "rgba(15,20,18,.25)"
        );

        gradient.addColorStop(
            .55,
            "rgba(30,35,32,.11)"
        );

        gradient.addColorStop(
            1,
            "rgba(20,25,22,0)"
        );

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        3,
        3
    );

    return texture;
}

/* =========================================================
   MAP FUNCTIONS
========================================================= */

function cellToWorld(row, col) {

    const width =
        MAP[0].length;

    return new THREE.Vector3(

        (col - width / 2 + .5)
        * CELL_SIZE,

        0,

        (row - MAP.length / 2 + .5)
        * CELL_SIZE
    );
}


function isWall(row, col) {

    if(
        row < 0 ||
        row >= MAP.length ||
        col < 0 ||
        col >= MAP[0].length
    )
        return true;

    return MAP[row][col] === "#";
}


function worldToCell(position) {

    return {

        row: Math.floor(
            position.z / CELL_SIZE +
            MAP.length / 2
        ),

        col: Math.floor(
            position.x / CELL_SIZE +
            MAP[0].length / 2
        )

    };
}

function createLevel0Floor() {

        let r = 0;
        r < MAP.length;
        r++

        for(
            let c = 0;
            c < MAP[r].length;
            c++
        ) {

            if(
                MAP[r][c] === "#"
            )
                continue;

            const pos =
                cellToWorld(r, c);

            const tile =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        CELL_SIZE * .94,
                        CELL_SIZE * .94
                    ),

                    floorMaterial
                );

            tile.rotation.x =
                -Math.PI / 2;

            tile.position.set(
                pos.x,
                0,
                pos.z
            );

            scene.add(tile);

            floorTiles.push(tile);
        }
    }
}


/* =========================================================
   REAL GRID OF HOLES
========================================================= */

function createHoleGrid() {

    /*
       This section is deliberately
       placed in the large open area
       on the right side of Level 0.
    */

    const startRow = 19;
    const endRow = 37;

    const startCol = 38;
    const endCol = 53;

    for(
        let r = startRow;
        r <= endRow;
        r++
    ) {

        for(
            let c = startCol;
            c <= endCol;
            c++
        ) {

            if(
                r < 0 ||
                r >= MAP.length ||
                c < 0 ||
                c >= MAP[r].length
            )
                continue;

            if(
                MAP[r][c] === "#"
            )
                continue;

            /*
               Checkerboard grid.
            */

            if(
                (r + c) % 2 !== 0
            )
                continue;

            const key =
                `${r},${c}`;

            holeCells.add(key);

            /*
               Remove the normal floor tile.
            */

            for(
                let i = floorTiles.length - 1;
                i >= 0;
                i--
            ) {

                const tile =
                    floorTiles[i];

                const cell =
                    worldToCell(
                        tile.position
                    );

                if(
                    cell.row === r &&
                    cell.col === c
                ) {

                    scene.remove(tile);

                    floorTiles.splice(
                        i,
                        1
                    );

                    break;
                }
            }

            /*
               Deep bottom of the hole.
            */

            const pos =
                cellToWorld(r, c);

            const pit =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        CELL_SIZE,
                        CELL_SIZE
                    ),

                    new THREE.MeshBasicMaterial({
                        color: 0x020302
                    })
                );

            pit.rotation.x =
                -Math.PI / 2;

            pit.position.set(
                pos.x,
                -20,
                pos.z
            );

            scene.add(pit);
        }
    }
}

                pos.z
            );

            scene.add(wall);

            wallBoxes.push(
                new THREE.Box3()
                    .setFromObject(wall)
            );
        }
    }
}

    for(
        let r = 1;
        r < MAP.length - 1;
        r++
    ) {

        for(
            let c = 1;
            c < MAP[r].length - 1;
            c++
        ) {

            if(
                MAP[r][c] !== "."

                continue;

            if(
                Math.random() >
                (
                    currentLevel === "level188"
                    ? .09
                    : .17
                )
            )
                continue;

            const pos =
                cellToWorld(r, c);

            const light =
                new THREE.PointLight(

                    currentLevel === "level188"
                    ? 0xc7d9e4
                    : 0xffe8a0,

                    currentLevel === "level188"
                    ? 2.4
                    : 4.2,

            light.position.set(

/* =========================================================
   COLLISION
========================================================= */

function circleHitsWall(
    position,
    radius
) {

    for(
        const box of wallBoxes
    ) {

        const closestX =
            Math.max(
                box.min.x,
                Math.min(
                    position.x,
                    box.max.x
                )
            );

        const closestZ =
            Math.max(
                box.min.z,
                Math.min(
                    position.z,
                    box.max.z
                )
            );

        const dx =
            position.x - closestX;

        const dz =
            position.z - closestZ;

        if(
            dx * dx +
            dz * dz <
            radius * radius
        )
            return true;
    }

    return false;
}


function moveWithCollision(
    object,
    direction,
    speed,
    radius,
    delta
) {

    const movement =
        direction.clone()
        .multiplyScalar(
            speed * delta
        );

    /*
       X movement.
    */

    const nextX =
        object.position.clone();

    nextX.x += movement.x;

    if(
        !circleHitsWall(
            nextX,
            radius
        )
    ) {

        object.position.x =
            nextX.x;
    }


    /*
       Z movement.
    */

    const nextZ =
        object.position.clone();

    nextZ.z += movement.z;

    if(
        !circleHitsWall(
            nextZ,
            radius
        )
    ) {

        object.position.z =
            nextZ.z;
    }
}

/* =========================================================
   PATHFINDING
========================================================= */

function findPath(
    start,
    target
) {

    const queue = [start];

    const cameFrom = {};

    const key =
        (r, c) =>
            `${r},${c}`;


    cameFrom[
        key(
            start.row,
            start.col
        )
    ] = null;


    while(
        queue.length
    ) {

        const current =
            queue.shift();


        if(
            current.row === target.row &&
            current.col === target.col
        )
            break;


        const neighbors = [

            {
                row: current.row - 1,
                col: current.col
            },

            {
                row: current.row + 1,
                col: current.col
            },

            {
                row: current.row,
                col: current.col - 1
            },

            {
                row: current.row,
                col: current.col + 1
            }
        ];


        for(
            const next of neighbors
        ) {

            if(
                isWall(
                    next.row,
                    next.col
                )
            )
                continue;


            /*
               Entity cannot walk
               through Level 0 holes.
            */

            if(
                currentLevel === "level0" &&
                holeCells.has(
                    key(
                        next.row,
                        next.col
                    )
                )
            )
                continue;


            const k =
                key(
                    next.row,
                    next.col
                );


            if(
                k in cameFrom
            )
                continue;


            cameFrom[k] =
                current;

            queue.push(next);
        }
    }


    const targetKey =
        key(
            target.row,
            target.col
        );


    if(
        !(targetKey in cameFrom)
    )
        return [];


    const path = [];

    let current = target;


    while(current) {

        path.unshift(
            current
        );

        current =
            cameFrom[
                key(
                    current.row,
                    current.col
                )
            ];
    }


    return path;
}

const clock =

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    /* =====================================================
       FALLING
    ===================================================== */

    if(
        isFalling
    ) {

        verticalVelocity +=
            GRAVITY * delta;

        player.position.y -=
            verticalVelocity * delta;

        camera.rotation.z +=
            delta * .8;


        if(
            player.position.y < -10
        ) {

            isFalling = false;

            player.position.copy(
                cellToWorld(
                    1,
                    1
                )
            );

            player.position.y =
                1.65;

            verticalVelocity = 0;

            grounded = true;

            camera.rotation.z = 0;

            stamina =
                MAX_STAMINA;

            document
                .getElementById(
                    "message"
                )
                .textContent =
                    "YOU FELL.";

            setTimeout(
                () => {

                    document
                        .getElementById(
                            "message"
                        )
                        .textContent = "";

                },
                1500
            );
        }

    } else {


        /* =================================================
           PLAYER MOVEMENT
        ================================================= */

        const direction =
            new THREE.Vector3();


        if(keys["w"])
            direction.z -= 1;

        if(keys["s"])
            direction.z += 1;

        if(keys["a"])
            direction.x -= 1;

        if(keys["d"])
            direction.x += 1;


        let sprinting = false;


        if(
            direction.lengthSq() > 0
        ) {

            direction.normalize();


            direction.applyAxisAngle(
                new THREE.Vector3(
                    0,
                    1,
                    0
                ),
                yaw
            );


            sprinting =
                keys["shift"] &&
                stamina > 0;


            if(sprinting) {

                stamina -=
                    SPRINT_DRAIN *
                    delta;

                stamina =
                    Math.max(
                        0,
                        stamina
                    );

            } else {

                stamina +=
                    STAMINA_REGEN *
                    delta;

                stamina =
                    Math.min(
                        MAX_STAMINA,
                        stamina
                    );
            }


            const speed =
                sprinting
                ? SPRINT_SPEED
                : WALK_SPEED;


            moveWithCollision(
                player,
                direction,
                speed,
                PLAYER_RADIUS,
                delta
            );

        } else {

            stamina +=
                STAMINA_REGEN *
                delta;

            stamina =
                Math.min(
                    MAX_STAMINA,
                    stamina
                );
        }


        /* =================================================
           GRAVITY
        ================================================= */

        verticalVelocity -=
            GRAVITY * delta;

        player.position.y +=
            verticalVelocity * delta;


        if(
            player.position.y <= 1.65
        ) {

            player.position.y =
                1.65;

            verticalVelocity = 0;

            grounded = true;
        }


        checkForHole();
    }


    /* =====================================================
       STAMINA UI
    ===================================================== */

    const staminaBar =
        document.getElementById(
            "stamina"
        );

    staminaBar.style.width =
        `${stamina}%`;

    staminaBar.style.background =
        stamina < 25
        ? "#d33"
        : "#e1d143";


    /* =====================================================
       ENTITY PATH
    ===================================================== */

    pathTimer -= delta;


    if(
        pathTimer <= 0 &&
        !isFalling
    ) {

        pathTimer = .3;


        const start =
            worldToCell(
                entity.position
            );


        const target =
            worldToCell(
                player.position
            );


        entityPath =
            findPath(
                start,
                target
            );
    }


    /* =====================================================
       ENTITY MOVEMENT
    ===================================================== */

    if(
        entityPath.length > 1
    ) {

        const next =
            entityPath[1];


        const target =
            cellToWorld(
                next.row,
                next.col
            );


        const direction =
            new THREE.Vector3(
                target.x -
                entity.position.x,

                0,

                target.z -
                entity.position.z
            );


        if(
            direction.length() > .12
        ) {

            direction.normalize();


            moveWithCollision(
                entity,
                direction,
                ENTITY_SPEED,
                ENTITY_RADIUS,
                delta
            );
        }
    }


    /* =====================================================
       ENTITY LOOK
    ===================================================== */

    entity.lookAt(
        player.position.x,
        entity.position.y,
        player.position.z
    );


    /* =====================================================
       ENTITY AUDIO
    ===================================================== */

    const distance =
        entity.position.distanceTo(
            player.position
        );


    const maxSoundDistance = 32;


    let volume =
        1 -
        distance /
        maxSoundDistance;


    volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );


    entitySound.volume =
        volume * volume;


    /* =====================================================
       ENTITY DANGER EFFECT
    ===================================================== */

    const danger =
        document.getElementById(
            "danger"
        );


    if(
        distance < 14
    ) {

        const intensity =

                1 -

            );


        danger.style.boxShadow =
            `inset 0 0 180px

                0,
                0,
                ${intensity * .6}
             )`;

    } else {

        danger.style.boxShadow =

    }


    /* =====================================================

    ===================================================== */

        .getElementById(
            "camcorder"
        )

            .36 +

        );

    );
}
