<!-- IMPORTANT:
     This is LOCAL.
     Put three.min.js beside index.html. -->

<script src="./three.min.js"></script>

<script>

"use strict";

/* =========================================================
   ERROR REPORTING
========================================================= */

window.addEventListener("error",function(e){

    const box=document.getElementById("error");

    if(box){

        box.style.display="block";

        box.textContent=
            "GAME ERROR:\\n"+
            e.message+
            "\\n\\n"+
            (e.filename||"")+
            ":"+
            (e.lineno||"");
    }

    console.error(e.error||e.message);
});


/* =========================================================
   THREE.JS CHECK
========================================================= */

if(typeof THREE==="undefined"){

    throw new Error(
        "Three.js was not loaded. Make sure three.min.js is beside index.html."
    );
}


/* =========================================================
   SCENE
========================================================= */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    .05,
    300
);

const renderer=new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    1.65,
    0
);

let yaw=0;
let pitch=0;

const PLAYER_RADIUS=.38;
const EYE_HEIGHT=1.65;

const WALK_SPEED=4.5;
const SPRINT_SPEED=7.5;

const GRAVITY=20;
const JUMP_SPEED=7.5;

let velocityY=0;
let grounded=true;
let stamina=100;


/* =========================================================
   GAME STATE
========================================================= */

let currentLevel="level0";
let running=false;
let paused=false;

let objects=[];
let walls=[];
let floors=[];

let entity=null;

let entityStuckTime=0;


/* =========================================================
   INPUT
========================================================= */

const keys={};
let jumpPressed=false;

addEventListener("keydown",function(e){

    const k=e.key.toLowerCase();

    keys[k]=true;

    if(e.code==="Space"){

        e.preventDefault();

        if(!e.repeat)
            jumpPressed=true;
    }

    if(
        e.code==="Escape"||
        k==="p"
    ){

        if(running)
            togglePause();
    }
});

addEventListener("keyup",function(e){

    keys[
        e.key.toLowerCase()
    ]=false;
});


/* =========================================================
   MOUSE LOOK
========================================================= */

addEventListener("mousemove",function(e){

    if(
        document.pointerLockElement!==
        document.body
    )
        return;

    yaw-=e.movementX*.002;
    pitch-=e.movementY*.002;

    pitch=THREE.MathUtils.clamp(
        pitch,
        -1.5,
        1.5
    );

    player.rotation.y=yaw;
    camera.rotation.x=pitch;
});


/* =========================================================
   WORLD HELPERS
========================================================= */

function addObject(o){

    scene.add(o);
    objects.push(o);

    return o;
}


function material(color){

    return new THREE.MeshStandardMaterial({
        color,
        roughness:1
    });
}


function addWall(
    w,h,d,x,y,z,mat
){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        mat
    );

    mesh.position.set(x,y,z);

    addObject(mesh);

    walls.push({
        minX:x-w/2,
        maxX:x+w/2,
        minY:y-h/2,
        maxY:y+h/2,
        minZ:z-d/2,
        maxZ:z+d/2
    });

    return mesh;
}


function addFloor(
    w,d,x,y,z,mat
){

    const mesh=new THREE.Mesh(
        new THREE.PlaneGeometry(w,d),
        mat
    );

    mesh.rotation.x=-Math.PI/2;

    mesh.position.set(
        x,y,z
    );

    addObject(mesh);

    floors.push({
        minX:x-w/2,
        maxX:x+w/2,
        minZ:z-d/2,
        maxZ:z+d/2,
        y
    });

    return mesh;
}


function addCeiling(
    w,d,x,y,z,mat
){

    const mesh=new THREE.Mesh(
        new THREE.PlaneGeometry(w,d),
        mat
    );

    mesh.rotation.x=Math.PI/2;

    mesh.position.set(
        x,y,z
    );

    addObject(mesh);
}


/* =========================================================
   TEXTURES
========================================================= */

function wallpaperTexture(){

    const c=document.createElement("canvas");

    c.width=1024;
    c.height=1024;

    const ctx=c.getContext("2d");

    ctx.fillStyle="#c0b34b";
    ctx.fillRect(0,0,1024,1024);

    for(let i=0;i<70000;i++){

        const n=50+Math.random()*90;

        ctx.fillStyle=
            `rgba(${n},${n*.9},30,.1)`;

        ctx.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            1+Math.random()*3,
            1+Math.random()*3
        );
    }

    const t=new THREE.CanvasTexture(c);

    t.wrapS=THREE.RepeatWrapping;
    t.wrapT=THREE.RepeatWrapping;

    t.repeat.set(4,3);

    return t;
}


function carpetTexture(){

    const c=document.createElement("canvas");

    c.width=1024;
    c.height=1024;

    const ctx=c.getContext("2d");

    ctx.fillStyle="#555754";

    ctx.fillRect(0,0,1024,1024);

    for(let i=0;i<100000;i++){

        const n=45+Math.random()*65;

        ctx.fillStyle=
            `rgba(${n},${n},${n},.13)`;

        ctx.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            1+Math.random()*3,
            1+Math.random()*2
        );
    }

    for(let i=0;i<120;i++){

        const x=Math.random()*1024;
        const y=Math.random()*1024;
        const r=20+Math.random()*80;

        const g=ctx.createRadialGradient(
            x,y,0,
            x,y,r
        );

        g.addColorStop(
            0,
            "rgba(10,15,13,.35)"
        );

        g.addColorStop(
            1,
            "rgba(10,15,13,0)"
        );

        ctx.fillStyle=g;

        ctx.beginPath();
        ctx.arc(
            x,y,r,0,Math.PI*2
        );
        ctx.fill();
    }

    const t=new THREE.CanvasTexture(c);

    t.wrapS=THREE.RepeatWrapping;
    t.wrapT=THREE.RepeatWrapping;

    t.repeat.set(5,5);

    return t;
}


/* =========================================================
   LIGHTS
========================================================= */

function addLight(x,z,intensity=1.5){

    const fixture=new THREE.Mesh(
        new THREE.BoxGeometry(
            2.4,.08,.4
        ),
        new THREE.MeshBasicMaterial({
            color:0xffffd0
        })
    );

    fixture.position.set(
        x,4,z
    );

    addObject(fixture);

    const light=new THREE.PointLight(
        0xffeaa5,
        intensity,
        17
    );

    light.position.set(
        x,3.8,z
    );

    addObject(light);
}


/* =========================================================
   LEVEL 0
========================================================= */

function buildLevel0(){

    currentLevel="level0";

    document.getElementById(
        "levelName"
    ).textContent=
        "LEVEL 0 — BACKROOMS";

    scene.background=
        new THREE.Color(0x17150b);

    scene.fog=
        new THREE.Fog(
            0x17150b,
            12,
            105
        );

    addObject(
        new THREE.AmbientLight(
            0xffe9a0,
            1.4
        )
    );

    const wallpaper=
        new THREE.MeshStandardMaterial({
            map:wallpaperTexture(),
            roughness:1
        });

    const carpet=
        new THREE.MeshStandardMaterial({
            map:carpetTexture(),
            roughness:1
        });

    addFloor(
        180,
        160,
        0,0,0,
        carpet
    );

    addWall(
        180,4,1,
        0,2,-80,
        wallpaper
    );

    addWall(
        180,4,1,
        0,2,80,
        wallpaper
    );

    addWall(
        1,4,160,
        -90,2,0,
        wallpaper
    );

    addWall(
        1,4,160,
        90,2,0,
        wallpaper
    );

    addCeiling(
        180,160,
        0,4.1,0,
        material(0x96904c)
    );


    /* Hallways */

    addWall(
        1,4,95,
        -55,2,0,
        wallpaper
    );

    addWall(
        1,4,95,
        55,2,0,
        wallpaper
    );

    addWall(
        75,4,1,
        0,2,-52,
        wallpaper
    );

    addWall(
        75,4,1,
        0,2,52,
        wallpaper
    );


    /* Additional irregular spaces */

    addWall(
        35,4,1,
        -25,2,-25,
        wallpaper
    );

    addWall(
        35,4,1,
        25,2,25,
        wallpaper
    );

    addWall(
        1,4,30,
        -42,2,27,
        wallpaper
    );

    addWall(
        1,4,30,
        42,2,-27,
        wallpaper
    );


    /* Iconic column area */

    for(let x=0;x<6;x++){

        for(let z=0;z<6;z++){

            addWall(
                .8,4,.8,
                -40+x*6,
                2,
                -5+z*6,
                wallpaper
            );
        }
    }


    /* Large deadly grid section */

    createDeathGrid(
        58,-58,
        5,5,
        4,
        carpet
    );


    /* Fluorescent lights */

    for(
        let x=-80;
        x<=80;
        x+=10
    ){

        for(
            let z=-70;
            z<=70;
            z+=12
        ){

            addLight(x,z);
        }
    }


    spawn(
        -70,
        1.65,
        -65,
        0
    );

    createEntity(
        40,
        40
    );
}


/* =========================================================
   DEATH GRID
========================================================= */

function createDeathGrid(
    startX,
    startZ,
    countX,
    countZ,
    size,
    mat
){

    for(let x=0;x<countX;x++){

        for(let z=0;z<countZ;z++){

            const px=
                startX+x*size;

            const pz=
                startZ+z*size;

            const edge=.12;

            addFloor(
                size-edge*2,
                edge,
                px,
                0,
                pz-size/2+edge/2,
                mat
            );

            addFloor(
                size-edge*2,
                edge,
                px,
                0,
                pz+size/2-edge/2,
                mat
            );

            addFloor(
                edge,
                size-edge*2,
                px-size/2+edge/2,
                0,
                pz,
                mat
            );

            addFloor(
                edge,
                size-edge*2,
                px+size/2-edge/2,
                0,
                pz,
                mat
            );

            const bottom=new THREE.Mesh(
                new THREE.PlaneGeometry(
                    size,size
                ),
                new THREE.MeshBasicMaterial({
                    color:0x020202
                })
            );

            bottom.rotation.x=
                -Math.PI/2;

            bottom.position.set(
                px,-20,pz
            );

            addObject(bottom);
        }
    }
}


/* =========================================================
   HOTEL / LEVEL 188
========================================================= */

function buildHotel(){

    currentLevel="hotel";

    document.getElementById(
        "levelName"
    ).textContent=
        "LEVEL 188 — HOTEL";

    scene.background=
        new THREE.Color(0x080b0d);

    scene.fog=
        new THREE.Fog(
            0x080b0d,
            15,
            150
        );

    addObject(
        new THREE.AmbientLight(
            0x9ca5ad,
            .9
        )
    );

    const concrete=material(0x77746d);
    const dark=material(0x30312f);
    const floorMat=material(0x55534e);
    const grass=material(0x273b22);


    /* Courtyard */

    addFloor(
        80,90,
        0,0,0,
        grass
    );


    /* Multiple floors */

    const floorHeight=4.3;

    for(
        let floor=0;
        floor<5;
        floor++
    ){

        createHotelFloor(
            floor*floorHeight,
            concrete,
            dark,
            floorMat
        );
    }


    /* Bridges over courtyard */

    createBridge(
        floorHeight*2,
        dark
    );

    createBridge(
        floorHeight*4,
        dark
    );


    for(
        let x=-30;
        x<=30;
        x+=15
    ){

        for(
            let z=-30;
            z<=30;
            z+=15
        ){

            addLight(
                x,z,.35
            );
        }
    }


    spawn(
        0,
        1.65,
        30,
        Math.PI
    );

    createEntity(
        -30,-30
    );
}


function createHotelFloor(
    y,
    concrete,
    dark,
    floorMat
){

    addWall(
        82,4,6,
        0,y+2,-39,
        concrete
    );

    addWall(
        82,4,6,
        0,y+2,39,
        concrete
    );

    addWall(
        6,4,72,
        -39,y+2,0,
        concrete
    );

    addWall(
        6,4,72,
        39,y+2,0,
        concrete
    );


    /* Open walkways */

    addFloor(
        68,5,
        0,y,-33,
        floorMat
    );

    addFloor(
        68,5,
        0,y,33,
        floorMat
    );

    addFloor(
        5,60,
        -33,y,0,
        floorMat
    );

    addFloor(
        5,60,
        33,y,0,
        floorMat
    );


    /* Open rooms */

    for(
        let x=-28;
        x<=28;
        x+=7
    ){

        createRoom(
            x,y,-35,dark
        );

        createRoom(
            x,y,35,dark
        );
    }
}


function createRoom(
    x,y,z,dark
){

    const bed=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.8,.4,3
        ),
        material(0x65645e)
    );

    bed.position.set(
        x,
        y+.2,
        z
    );

    addObject(bed);


    const pillow=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.5,.18,.65
        ),
        material(0xc5c2b7)
    );

    pillow.position.set(
        x,
        y+.52,
        z>0 ? z-.9 : z+.9
    );

    addObject(pillow);
}


function createBridge(
    y,
    mat
){

    addFloor(
        12,62,
        0,y,0,
        mat
    );

    const rail=material(
        0x272927
    );

    addWall(
        .2,1.1,62,
        -6,y+.55,0,
        rail
    );

    addWall(
        .2,1.1,62,
        6,y+.55,0,
        rail
    );
}


/* =========================================================
   SPAWN
========================================================= */

function spawn(
    x,y,z,rotation
){

    player.position.set(
        x,y,z
    );

    yaw=rotation;
    pitch=0;

    player.rotation.y=yaw;
    camera.rotation.x=pitch;

    velocityY=0;
    grounded=true;
    stamina=100;
}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function hitsWall(
    x,y,z
){

    const bottom=
        y-EYE_HEIGHT;

    const top=
        bottom+1.8;

    for(const wall of walls){

        if(
            top<=wall.minY||
            bottom>=wall.maxY
        )
            continue;

        const cx=Math.max(
            wall.minX,
            Math.min(x,wall.maxX)
        );

        const cz=Math.max(
            wall.minZ,
            Math.min(z,wall.maxZ)
        );

        const dx=x-cx;
        const dz=z-cz;

        if(
            dx*dx+dz*dz<
            PLAYER_RADIUS*PLAYER_RADIUS
        )
            return true;
    }

    return false;
}


function floorBelow(
    x,z
){

    let best=-Infinity;

    for(const floor of floors){

        if(
            x>=floor.minX&&
            x<=floor.maxX&&
            z>=floor.minZ&&
            z<=floor.maxZ
        ){

            if(
                floor.y<=
                player.position.y-EYE_HEIGHT+.15
            ){

                if(floor.y>best)
                    best=floor.y;
            }
        }
    }

    return best;
}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt){

    const dir=new THREE.Vector3();

    if(keys.w)dir.z-=1;
    if(keys.s)dir.z+=1;
    if(keys.a)dir.x-=1;
    if(keys.d)dir.x+=1;

    if(dir.lengthSq()>0){

        dir.normalize();

        dir.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );

        const sprint=
            keys.shift&&
            stamina>0;

        const speed=
            sprint?
            SPRINT_SPEED:
            WALK_SPEED;

        if(sprint)
            stamina-=25*dt;
        else
            stamina+=18*dt;

        stamina=THREE.MathUtils.clamp(
            stamina,0,100
        );

        const amount=speed*dt;

        const nx=
            player.position.x+
            dir.x*amount;

        if(!hitsWall(
            nx,
            player.position.y,
            player.position.z
        )){
            player.position.x=nx;
        }

        const nz=
            player.position.z+
            dir.z*amount;

        if(!hitsWall(
            player.position.x,
            player.position.y,
            nz
        )){
            player.position.z=nz;
        }

    }else{

        stamina=Math.min(
            100,
            stamina+18*dt
        );
    }


    if(
        jumpPressed&&
        grounded
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;
    }

    jumpPressed=false;

    velocityY-=
        GRAVITY*dt;

    let nextY=
        player.position.y+
        velocityY*dt;

    const fy=
        floorBelow(
            player.position.x,
            player.position.z
        );

    if(
        fy===-Infinity
    ){

        grounded=false;

        if(
            player.position.y<-8
        ){

            respawn();
            return;
        }

    }else{

        const eyeFloor=
            fy+EYE_HEIGHT;

        if(
            nextY<=eyeFloor&&
            velocityY<=0
        ){

            nextY=eyeFloor;

            velocityY=0;

            grounded=true;

        }else{

            grounded=false;
        }
    }

    player.position.y=nextY;

    document.getElementById(
        "stamina"
    ).style.width=
        stamina+"%";
}


/* =========================================================
   ENTITY
========================================================= */

let entityTexture=null;

new THREE.TextureLoader().load(
    "./entity.png",
    function(t){

        entityTexture=t;

        entityTexture.colorSpace=
            THREE.SRGBColorSpace;

        if(entity){

            entity.material.map=
                entityTexture;

            entity.material.needsUpdate=
                true;
        }
    },
    undefined,
    function(){

        console.warn(
            "entity.png not found."
        );
    }
);


const entityMaterial=
    new THREE.MeshBasicMaterial({
        color:0x333333,
        transparent:true,
        side:THREE.DoubleSide
    });


function createEntity(
    x,z
){

    entity=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                1.8,3.5
            ),
            entityMaterial.clone()
        );

    if(entityTexture)
        entity.material.map=
            entityTexture;

    entity.position.set(
        x,1.75,z
    );

    addObject(entity);
}


function entityHitsWall(
    x,y,z
){

    const r=.42;

    const bottom=y-1.7;
    const top=y+1.7;

    for(const wall of walls){

        if(
            top<=wall.minY||
            bottom>=wall.maxY
        )
            continue;

        const cx=Math.max(
            wall.minX,
            Math.min(x,wall.maxX)
        );

        const cz=Math.max(
            wall.minZ,
            Math.min(z,wall.maxZ)
        );

        const dx=x-cx;
        const dz=z-cz;

        if(
            dx*dx+dz*dz<
            r*r
        )
            return true;
    }

    return false;
}


function unstuckEntity(){

    if(!entity)
        return;

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const len=Math.hypot(dx,dz);

    if(len<.001)
        return;

    const fx=dx/len;
    const fz=dz/len;


    /* Try the direction it is chasing */

    for(
        const distance of
        [2,3,4,5,7,9,12]
    ){

        const x=
            entity.position.x+
            fx*distance;

        const z=
            entity.position.z+
            fz*distance;

        if(
            !entityHitsWall(
                x,
                entity.position.y,
                z
            )
        ){

            entity.position.x=x;
            entity.position.z=z;

            return;
        }
    }


    /* Search around it */

    for(
        let a=0;
        a<Math.PI*2;
        a+=Math.PI/16
    ){

        const x=
            entity.position.x+
            Math.cos(a)*5;

        const z=
            entity.position.z+
            Math.sin(a)*5;

        if(
            !entityHitsWall(
                x,
                entity.position.y,
                z
            )
        ){

            entity.position.x=x;
            entity.position.z=z;

            return;
        }
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

const entityAudio=
    new Audio("./entity.mp3");

entityAudio.loop=true;
entityAudio.volume=0;


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt){

    if(!entity)
        return;

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(dx,dz);

    if(distance>.2){

        const nx=dx/distance;
        const nz=dz/distance;

        const amount=
            SPRINT_SPEED*dt;

        let x=
            entity.position.x+
            nx*amount;

        let z=
            entity.position.z+
            nz*amount;

        if(
            !entityHitsWall(
                x,
                entity.position.y,
                z
            )
        ){

            entity.position.x=x;
            entity.position.z=z;

            entityStuckTime=0;

        }else{

            /* Try left/right */

            const sx=-nz;
            const sz=nx;

            let moved=false;

            for(const sign of [1,-1]){

                x=
                    entity.position.x+
                    sx*amount*sign;

                z=
                    entity.position.z+
                    sz*amount*sign;

                if(
                    !entityHitsWall(
                        x,
                        entity.position.y,
                        z
                    )
                ){

                    entity.position.x=x;
                    entity.position.z=z;

                    entityStuckTime=0;

                    moved=true;

                    break;
                }
            }

            if(!moved)
                entityStuckTime+=dt;
        }
    }


    if(
        entityStuckTime>1
    ){

        unstuckEntity();

        entityStuckTime=0;
    }


    entity.lookAt(
        player.position.x,
        entity.position.y,
        player.position.z
    );


    const volume=
        THREE.MathUtils.clamp(
            1-distance/45,
            0,
            1
        );

    entityAudio.volume=
        volume*volume;


    if(distance<15){

        const strength=
            1-distance/15;

        document.getElementById(
            "danger"
        ).style.boxShadow=
            `inset 0 0 180px rgba(180,0,0,${strength*.6})`;

    }else{

        document.getElementById(
            "danger"
        ).style.boxShadow="none";
    }


    if(distance<1.25){

        showMessage(
            "THE ENTITY FOUND YOU"
        );

        respawn();
    }
}


/* =========================================================
   CLEAN LEVEL
========================================================= */

function clearWorld(){

    for(
        const object of objects
    ){

        scene.remove(object);

        if(object.geometry)
            object.geometry.dispose();

        if(object.material){

            if(
                Array.isArray(object.material)
            ){

                object.material.forEach(
                    m=>m.dispose()
                );

            }else{

                object.material.dispose();
            }
        }
    }

    objects=[];
    walls=[];
    floors=[];
    entity=null;

    entityAudio.pause();

    entityAudio.currentTime=0;

    scene.fog=null;
}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(level){

    try{

        clearWorld();

        if(level==="hotel")
            buildHotel();
        else
            buildLevel0();

        running=true;
        paused=false;

        document.getElementById(
            "menu"
        ).style.display="none";

        document.getElementById(
            "pause"
        ).style.display="none";

        entityAudio.play().catch(
            ()=>{}
        );

        document.body.requestPointerLock();

    }catch(error){

        console.error(error);

        const box=
            document.getElementById(
                "error"
            );

        box.style.display="block";

        box.textContent=
            "LEVEL ERROR:\\n"+
            error.stack;
    }
}


/* =========================================================
   RESPAWN
========================================================= */

function respawn(){

    if(currentLevel==="hotel"){

        spawn(
            0,
            1.65,
            30,
            Math.PI
        );

    }else{

        spawn(
            -70,
            1.65,
            -65,
            0
        );
    }
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text){

    const m=
        document.getElementById(
            "message"
        );

    m.textContent=text;

    clearTimeout(messageTimer);

    messageTimer=
        setTimeout(
            ()=>{
                m.textContent="";
            },
            1800
        );
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(!running)
        return;

    paused=true;

    document.getElementById(
        "pause"
    ).style.display="flex";

    if(document.pointerLockElement)
        document.exitPointerLock();

    entityAudio.pause();
}


function resumeGame(){

    if(!running)
        return;

    paused=false;

    document.getElementById(
        "pause"
    ).style.display="none";

    document.body.requestPointerLock();

    entityAudio.play().catch(
        ()=>{}
    );
}


function togglePause(){

    if(paused)
        resumeGame();
    else
        pauseGame();
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "level0"
).onclick=()=>{
    startLevel("level0");
};


document.getElementById(
    "hotel"
).onclick=()=>{
    startLevel("hotel");
};


document.getElementById(
    "resume"
).onclick=()=>{
    resumeGame();
};


document.getElementById(
    "restart"
).onclick=()=>{
    startLevel(currentLevel);
};


document.getElementById(
    "menuButton"
).onclick=()=>{

    running=false;
    paused=false;

    if(document.pointerLockElement)
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="flex";
};


/* =========================================================
   MOUSE RELOCK
========================================================= */

document.addEventListener(
    "click",
    function(){

        if(
            running&&
            !paused&&
            document.pointerLockElement!==
            document.body
        ){

            document.body.requestPointerLock();

            entityAudio.play().catch(
                ()=>{}
            );
        }
    }
);


/* =========================================================
   LOOP
========================================================= */

const clock=new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running&&
        !paused
    ){

        updatePlayer(dt);
        updateEntity(dt);

        document.getElementById(
            "vhs"
        ).style.opacity=
            .22+
            Math.random()*.08;
    }

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    function(){

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
