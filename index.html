/* =========================================================
   HORROR CAMERA EFFECTS
========================================================= */

.camScanlines,
.camTracking,

.camVignette,
.camBleed,
.camDarkness,
.camFlicker {
    position: absolute;

.camScanlines {
    opacity: .22;

    background:
        repeating-linear-gradient(

            rgba(255,255,255,.055) 3px,
            rgba(0,0,0,.09) 4px

}

.camTracking {
    opacity: .08;

        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 11px,
            rgba(255,255,255,.13) 12px,
            transparent 13px
        );

    animation:
        trackingMove
        8s linear infinite;
}

@keyframes trackingMove {

    0% {
        transform:
            translateY(-12px);
    }

    50% {
        transform:
            translateY(12px);
    }

    100% {
        transform:
            translateY(-12px);
    }
}

.camGrain {
    opacity: .075;

    background-image:

            #fff 0,

            transparent 1px,
            transparent 4px
        );

    background-size:
        5px 5px;

    animation:
        grainShift
        .18s steps(2) infinite;
}

@keyframes grainShift {

    0% {
        transform:
            translate(0,0);
    }

    25% {
        transform:
            translate(2px,-1px);
    }

    50% {
        transform:
            translate(-1px,2px);
    }

    75% {
        transform:
            translate(1px,1px);
    }

    100% {
        transform:
            translate(-2px,-1px);
    }
}

.camVignette {

<!-- =========================================================
     LOCAL THREE.JS
     
     IMPORTANT:
     three.min.js is beside index.html.
     
     NO CDN.
========================================================= -->

<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   THREE.JS CHECK
========================================================= */

if (
    typeof THREE === "undefined"
) {

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "THREE.JS FAILED TO LOAD.\n\n" +

        "The game expects:\n\n" +

        "index.html\n" +
        "three.min.js\n\n" +

        "to be in the SAME folder.\n\n" +

        "Check that the filename is exactly:\n" +
        "three.min.js";

    throw new Error(
        "Local Three.js failed to load."
    );
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x302d20
    );

scene.fog =
    new THREE.FogExp2(
        0x302d20,
        0.014
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        76,
        window.innerWidth /
        window.innerHeight,
        0.03,
        350
    );

camera.rotation.order =
    "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        powerPreference:
            "high-performance"

    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);


/*
    IMPORTANT:

    Environment textures are normal lit materials.

    This is NOT a MeshBasicMaterial environment.

    Therefore the walls, floor and ceiling
    actually react to the fluorescent lights.
*/

if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    0.82;

renderer.domElement.style.zIndex =
    "0";

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   GLOBAL LIGHTING
========================================================= */

const ambientLight =
    new THREE.AmbientLight(
        0x706b55,
        0.075
    );

scene.add(
    ambientLight
);


const hemisphereLight =
    new THREE.HemisphereLight(
        0xeee5a5,
        0x090805,
        0.16
    );

scene.add(
    hemisphereLight
);


/* =========================================================
   TEXTURE LOADING
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;


/* =========================================================
   TEXTURE PREPARATION
========================================================= */

function prepareTexture(
    texture
) {

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate =
        true;

    return texture;
}


/* =========================================================
   SAFE TEXTURE LOADING
========================================================= */

function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            texture
                        )
                    );
                },

                undefined,

                error => {

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    resolve(
                        null
                    );
                }
            );

        }
    );
}


/* =========================================================
   LOAD ENVIRONMENT
========================================================= */

async function loadEnvironmentTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );


    const missing = [];


    if (!wallTexture) {

        missing.push(
            "./textures/wall.png"
        );
    }


    if (!floorTexture) {

        missing.push(
            "./textures/floor.png"
        );
    }


    if (!ceilingTexture) {

        missing.push(
            "./textures/ceiling.png"
        );
    }


    if (missing.length) {

        const error =
            document.getElementById(
                "error"
            );

        error.style.display =
            "block";

        error.textContent =
            "ENVIRONMENT TEXTURE ERROR\n\n" +

            "These files could not be loaded:\n\n" +

            missing.join("\n") +

            "\n\nExpected structure:\n\n" +

            "index.html\n" +
            "three.min.js\n" +
            "entity.png\n" +
            "entity.mp3\n" +
            "textures/\n" +
            "    wall.png\n" +
            "    floor.png\n" +
            "    ceiling.png";
    }
}


/* =========================================================
   WORLD ARRAYS
========================================================= */

let worldObjects = [];

let wallColliders = [];

let deathHoles = [];

let lights = [];


function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}


/* =========================================================
   MATERIAL DISPOSAL
========================================================= */

function disposeMaterial(
    material
) {

    if (!material) {

        return;
    }


    if (
        Array.isArray(
            material
        )
    ) {

        material.forEach(
            disposeMaterial
        );

        return;
    }


    if (
        material.map
    ) {

        material.map.dispose();
    }


    material.dispose();
}


/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld() {

    for (
        const object
        of worldObjects
    ) {

        scene.remove(
            object
        );


        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();
                }


                if (
                    child.material
                ) {

                    disposeMaterial(
                        child.material
                    );
                }

            }
        );
    }


    worldObjects = [];

    wallColliders = [];

    deathHoles = [];

    lights = [];


    if (
        exitLight
    ) {

        scene.remove(
            exitLight
        );

        exitLight = null;
    }


    exitObject = null;

    entity = null;
}


/* =========================================================
   WALL MATERIAL
========================================================= */

function createWallMaterial(
    texture,
    repeatX,
    repeatY
) {

    if (!texture) {

        return new THREE.MeshStandardMaterial({

            color:
                0xb3a84f,

            roughness:
                0.92,

            metalness:
                0.0
        });
    }


    const cloned =
        texture.clone();


    cloned.colorSpace =
        THREE.SRGBColorSpace;

    cloned.wrapS =
        THREE.RepeatWrapping;

    cloned.wrapT =
        THREE.RepeatWrapping;

    cloned.repeat.set(
        repeatX,
        repeatY
    );

    cloned.needsUpdate =
        true;


    /*
        MeshStandardMaterial is intentional.

        wall.png IS affected by lighting.

        entity.png is the ONLY unshaded PNG.
    */

    return new THREE.MeshStandardMaterial({

        map:
            cloned,

        color:
            0xffffff,

        roughness:
            0.96,

        metalness:
            0.0,

        side:
            THREE.DoubleSide
    });
}


/* =========================================================
   CREATE WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = 0.32
) {

    const height =
        3.1;


    wallColliders.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2,

        minY:
            0,

        maxY:
            height
    });


    const group =
        new THREE.Group();


    const front =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                wallTexture,
                Math.max(
                    width / 3.2,
                    1
                ),
                1
            )
        );


    front.position.set(
        0,
        height / 2,
        depth / 2
    );


    front.castShadow =
        true;

    front.receiveShadow =
        true;


    group.add(
        front
    );


    const back =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                wallTexture,
                Math.max(
                    width / 3.2,
                    1
                ),
                1
            )
        );


    back.rotation.y =
        Math.PI;


    back.position.set(
        0,
        height / 2,
        -depth / 2
    );


    back.castShadow =
        true;

    back.receiveShadow =
        true;


    group.add(
        back
    );


    const left =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            createWallMaterial(
                wallTexture,
                1,
                1
            )
        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(
        -width / 2,
        height / 2,
        0
    );


    left.castShadow =
        true;

    left.receiveShadow =
        true;


    group.add(
        left
    );


    const right =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            createWallMaterial(
                wallTexture,
                1,
                1
            )
        );


    right.rotation.y =
        -Math.PI / 2;


    right.position.set(
        width / 2,
        height / 2,
        0
    );


    right.castShadow =
        true;

    right.receiveShadow =
        true;


    group.add(
        right
    );


    group.position.set(
        x,
        0,
        z
    );


    addWorldObject(
        group
    );
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    let material;


    if (
        floorTexture
    ) {

        const texture =
            floorTexture.clone();


        texture.colorSpace =
            THREE.SRGBColorSpace;

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;


        texture.repeat.set(
            90,
            90
        );


        texture.needsUpdate =
            true;


        material =
            new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    0.98,

                metalness:
                    0.0
            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color:
                    0x81763a,

                roughness:
                    0.98
            });
    }


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                280,
                280
            ),

            material
        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.receiveShadow =
        true;


    addWorldObject(
        floor
    );
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling() {

    let material;


    if (
        ceilingTexture
    ) {

        const texture =
            ceilingTexture.clone();


        texture.colorSpace =
            THREE.SRGBColorSpace;

        texture.wrapS =
            THREE.RepeatWrapping;

function createHoleRoom() {

    const startX =
        -57;

    const startZ =
        57;

    const columns =
        16;

    const rows =
        7;

    const spacing =
        3.7;


    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            if (
                (x + z) % 5 === 0
            ) {

                continue;
            }


            const px =
                startX +
                x * spacing;


            const pz =
                startZ +
                z * spacing;


            const hole =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.65,
                        2.65
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x010101,

                        side:
                            THREE.DoubleSide
                    })
                );


            hole.rotation.x =
                -Math.PI / 2;


            hole.position.set(
                px,
                0.008,
                pz
            );


            addWorldObject(
                hole
            );


            deathHoles.push({

                x:
                    px,

                z:
                    pz,

                radius:
                    1.25
            });
        }
    }
}

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(
    dt
) {

    for (
        const item
        of lights
    ) {

        if (
            !item.flicker
        ) {

            continue;
        }


        item.timer -=
            dt;


        if (
            item.timer <= 0
        ) {

            item.timer =
                0.08 +
                Math.random() * 0.65;


            /*
                NEVER turn the light off.

                Instead, make it dim or bright.
            */

            const factor =
                0.38 +
                Math.random() * 0.62;


            item.target =
                item.base *
                factor;
        }


        item.light.intensity =
            THREE.MathUtils.lerp(

                item.light.intensity,

                item.target,

                Math.min(
                    1,
                    dt * 15
                )
            );


        if (
            item.fixture &&
            item.fixture.material
        ) {

            item.fixture.material
                .emissiveIntensity =
                    THREE.MathUtils.lerp(

                        item.fixture.material
                            .emissiveIntensity,

                        0.8 +
                        item.light.intensity
                        * 0.32,

                        Math.min(
                            1,
                            dt * 8
                        )
                    );
        }
    }
}

/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;


    for (
        const wall
        of wallColliders
    ) {

        if (
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {

            continue;
        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
) {

    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            0.43 *
            0.43
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   LINE OF SIGHT
========================================================= */

function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 -
        x1;

    const dz =
        z2 -
        z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance /
            0.35
        );


    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i /
            steps;


        if (
            entityHitsWall(

                x1 +
                dx * t,

                z1 +
                dz * t
            )
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   HOLES
========================================================= */

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;

        const dz =
            player.position.z -
            hole.z;


        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;
        }
    }


    return false;
}

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    const settings =
        SETTINGS[
            difficulty
        ];


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    lastSeen +=
        dt;


    const visible =
        distance <
        settings.detection &&

        !blocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z
        );


    let dx2 =
        0;

    let dz2 =
        0;


    if (
        visible
    ) {

        lastKnown.set(
            player.position.x,
            player.position.z
        );


        lastSeen =
            0;


        dx2 =
            dx /
            Math.max(
                distance,
                .001
            );


        dz2 =
            dz /
            Math.max(
                distance,
                .001
            );

    } else if (
        lastSeen < 3.2
    ) {

        const lx =
            lastKnown.x -
            entity.position.x;


        const lz =
            lastKnown.y -
            entity.position.z;


        const len =
            Math.hypot(
                lx,
                lz
            );


        if (
            len > .1
        ) {

            dx2 =
                lx /
                len;

            dz2 =
                lz /
                len;
        }

    } else {

        wanderTimer -=
            dt;


        if (
            wanderTimer <= 0
        ) {

            wanderTimer =
                .5 +
                Math.random() *
                1.8;


            wanderAngle =
                Math.random() *
                Math.PI *
                2;
        }


        dx2 =
            Math.cos(
                wanderAngle
            );


        dz2 =
            Math.sin(
                wanderAngle
            );
    }


    const targetAngle =
        Math.atan2(
            dz2,
            dx2
        );


    const currentAngle =
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );


    let difference =
        targetAngle -
        currentAngle;


    while (
        difference >
        Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }


    while (
        difference <
        -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }


    difference =
        Math.max(

            -3.4 * dt,

            Math.min(
                3.4 * dt,
                difference
            )
        );


    const angle =
        currentAngle +
        difference;


    entityDirection.x =
        Math.cos(
            angle
        );


    entityDirection.y =
        Math.sin(
            angle
        );


    entityVelocity.x =
        THREE.MathUtils.lerp(

            entityVelocity.x,

            entityDirection.x *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );


    entityVelocity.y =
        THREE.MathUtils.lerp(

            entityVelocity.y,

            entityDirection.y *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );


    const moveX =
        entityVelocity.x *
        dt;


    const moveZ =
        entityVelocity.y *
        dt;


    const nextX =
        entity.position.x +
        moveX;


    const nextZ =
        entity.position.z +
        moveZ;


    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        entityVelocity.x =
            0;

        wanderAngle +=
            Math.PI / 2;

        entityDirection.set(

            Math.cos(
                wanderAngle
            ),

            Math.sin(
                wanderAngle
            )
        );
    }


    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        entityVelocity.y =
            0;

        wanderAngle +=
            Math.PI / 2;

        entityDirection.set(

            Math.cos(
                wanderAngle
            ),

            Math.sin(
                wanderAngle
            )
        );
    }


    /*
        Billboard toward player.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );


    const killDistance =
        difficulty ===
        "nightmare"

            ? 1.55

            : 1.25;


    if (
        distance <
        killDistance
    ) {

        killPlayer();
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;
    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z
        );


    const maxDistance =
        34;


    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;
    }


    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.6

        ) * .9;


    if (
        blocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z
        )
    ) {

        volume *=
            .2;
    }


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );


    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   PLAYER INPUT
========================================================= */

const keys = {

    w:
        false,

    a:
        false,

    s:
        false,

    d:
        false,

    shift:
        false
};


let jumpPressed =
    false;


window.addEventListener(
    "keydown",
    event => {

        /*
            W IS FORWARD.

            S IS BACKWARD.

            These are intentionally
            NOT reversed.
        */

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                true;
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                true;
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                true;
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                true;
        }


        if (
            event.code ===
            "ShiftLeft" ||
            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                true;
        }


        if (
            event.code ===
            "Space" &&
            !event.repeat
        ) {

            jumpPressed =
                true;
        }


        if (
            event.code ===
            "Escape" &&

            running &&

            !dead &&

            !fallingIntoLevel
        ) {

            togglePause();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                false;
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                false;
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                false;
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                false;
        }


        if (
            event.code ===
            "ShiftLeft" ||
            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                false;
        }
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ) {

            return;
        }


        if (
            document.pointerLockElement !==
            document.body
        ) {

            return;
        }


        yaw -=
            event.movementX *
            .0022;


        pitch -=
            event.movementY *
            .0018;


        pitch =
            Math.max(

                -1.45,

                Math.min(
                    1.45,
                    pitch
                )
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;
    }
);


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;
    }


    let forward =
        0;

    let side =
        0;


    /*
        CORRECT CONTROLS:

        W = +forward
        S = -forward

        A = -side
        D = +side
    */

    if (
        keys.w
    ) {

        forward++;
    }


    if (
        keys.s
    ) {

        forward--;
    }


    if (
        keys.d
    ) {

        side++;
    }


    if (
        keys.a
    ) {

        side--;
    }


    const length =
        Math.hypot(
            forward,
            side
        );


    if (
        length
    ) {

        forward /=
            length;

        side /=
            length;
    }


    let speed =
        keys.shift
            ? 5.9
            : 3.5;


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.1
                : 3.8;
    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.3
                : 3.4;
    }


    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.5
                : 3.25;
    }


    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    /*
        W moves in the camera's forward
        direction.

        This fixes the previous W/S inversion.
    */

    const dx =
        (
            side * cos +
            forward * sin
        ) *
        speed *
        dt;


    const dz =
        (
            -side * sin +
            forward * cos
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        dx;


    const nextZ =
        player.position.z +
        dz;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;
    }


    jumpPressed =
        false;


    velocityY -=
        20 *
        dt;


    player.position.y +=
        velocityY *
        dt;


    if (
        player.position.y <= 0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;
    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }


    checkExit();
}


/* =========================================================
   FALL INTRO
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;


    const progress =
        Math.min(

            fallTimer /
            FALL_DURATION,

            1
        );


    const eased =
        1 -
        Math.pow(
            1 - progress,
            3
        );


    player.position.y =
        17 -
        17 *
        eased;


    camera.position.y =
        EYE_HEIGHT;


    camera.rotation.x =
        THREE.MathUtils.lerp(

            -.32,

            0,

            Math.min(
                progress * 1.3,
                1
            )
        );


    camera.rotation.z =
        Math.sin(

            progress *
            Math.PI *
            9

        ) * .025;


    if (
        progress >=
        1
    ) {

        fallingIntoLevel =
            false;


        player.position.y =
            0;


        camera.position.x =
            0;

        camera.position.y =
            EYE_HEIGHT;

        camera.position.z =
            0;


        camera.rotation.x =
            0;

        camera.rotation.z =
            0;


        document.body.requestPointerLock();
    }
}


/* =========================================================
   CAMERA MOVEMENT
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;
    }


    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const amount =
        moving
            ? .012
            : .003;


    camera.position.x =
        Math.sin(
            cameraTime *
            3.4
        ) *
        amount;


    camera.position.y =
        EYE_HEIGHT +

        Math.sin(
            cameraTime *
            4.1
        ) *
        amount;


    camera.position.z =
        Math.cos(
            cameraTime *
            3.1
        ) *
        amount *
        .55;


    camera.rotation.z =
        Math.sin(
            cameraTime *
            .9
        ) *
        .003;


    /*
        Occasional camera instability.
    */

    if (
        Math.random() <
        .004
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) *
            .04;


        camera.position.y +=
            (
                Math.random() -
                .5
            ) *
            .03;


        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) *
            .03;
    }
}


/* =========================================================
   EXIT CHECK
========================================================= */

function checkExit() {

    if (
        !exitObject ||
        dead
    ) {

        return;
    }


    const distance =
        Math.hypot(

            player.position.x -
            exitX,

            player.position.z -
            exitZ
        );


    if (
        distance <
        1.8
    ) {

        winGame();
    }
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer =
    0;


function showMessage(
    text
) {

    document.getElementById(
        "message"
    ).textContent =
        text;


    messageTimer =
        2.2;
}


function updateMessage(
    dt
) {

    if (
        messageTimer <=
        0
    ) {

        return;
    }


    messageTimer -=
        dt;


    if (
        messageTimer <=
        0
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "";
    }
}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason =
        "THE BACKROOMS GOT YOU"
) {

    if (
        dead ||
        !running
    ) {

        return;
    }


    dead =
        true;


    fallingIntoLevel =
        false;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU DIED";


    document.getElementById(
        "deathTitle"
    ).className =
        "";


    document.getElementById(
        "deathText"
    ).textContent =
        reason;


    document.getElementById(
        "retryBtn"
    ).textContent =
        "RETRY";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   WIN
========================================================= */

function winGame() {

    if (
        dead ||
        !running
    ) {

        return;
    }


    dead =
        true;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU ESCAPED";


    document.getElementById(
        "deathTitle"
    ).className =
        "win";


    document.getElementById(
        "deathText"
    ).textContent =
        "YOU FOUND THE EXIT";


    document.getElementById(
        "retryBtn"
    ).textContent =
        "PLAY AGAIN";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    paused =
        !paused;


    document.getElementById(
        "pause"
    ).style.display =
        paused
            ? "flex"
            : "none";


    if (
        paused
    ) {

        if (
            document.pointerLockElement
        ) {

            document.exitPointerLock();
        }

    } else {

        document.body.requestPointerLock();
    }
}


/* =========================================================
   RETURN TO MENU
========================================================= */

function returnToMenu() {

    running =
        false;

    paused =
        false;

    dead =
        false;

    fallingIntoLevel =
        false;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "block";
}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    /*
        Environment textures MUST be loaded
        before constructing the environment.
    */

    if (
        !wallTexture ||
        !floorTexture ||
        !ceilingTexture
    ) {

        await loadEnvironmentTextures();
    }


    clearWorld();


    player.position.set(
        -92,
        17,
        -70
    );


    yaw =
        .25;

    pitch =
        -.28;

    velocityY =
        0;

    grounded =
        false;


    createFloor();

    createCeiling();

    buildFloorPlan();

    createHoleRoom();

    createExit();

    buildLighting();


    /*
        ENTITY IS ROOT DIRECTORY.

        ./entity.png
    */

    await createEntity();


    entity.position.set(
        55,
        .775,
        -48
    );


    entityDirection.set(
        1,
        0
    );


    entityVelocity.set(
        0,
        0
    );


    lastSeen =
        99;


    running =
        true;

    paused =
        false;

    dead =
        false;

    fallingIntoLevel =
        true;


    fallTimer =
        0;

    recordingTime =
        0;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );


    camera.rotation.x =
        pitch;

    camera.rotation.z =
        0;


    player.rotation.y =
        yaw;


    showMessage(
        "ENTERING LEVEL 0..."
    );
}


/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(
    value
) {

    difficulty =
        value;


    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );
            }
        );


    const id =
        value ===
        "nightmare"

            ? "nightmareBtn"

            : value +
              "Btn";


    document.getElementById(
        id
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();
}


document.getElementById(
    "easyBtn"
).onclick =
    () =>
        setDifficulty(
            "easy"
        );


document.getElementById(
    "normalBtn"
).onclick =
    () =>
        setDifficulty(
            "normal"
        );


document.getElementById(
    "hardBtn"
).onclick =
    () =>
        setDifficulty(
            "hard"
        );


document.getElementById(
    "nightmareBtn"
).onclick =
    () =>
        setDifficulty(
            "nightmare"
        );


document.getElementById(
    "startBtn"
).onclick =
    () =>
        startGame();


document.getElementById(
    "resumeBtn"
).onclick =
    () =>
        togglePause();


document.getElementById(
    "restartBtn"
).onclick =
    () =>
        startGame();


document.getElementById(
    "menuBtn"
).onclick =
    () =>
        returnToMenu();


document.getElementById(
    "retryBtn"
).onclick =
    () =>
        startGame();


document.getElementById(
    "deathMenuBtn"
).onclick =
    () =>
        returnToMenu();


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    () => {

        if (
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement !==
            document.body
        ) {

            document.body.requestPointerLock();
        }
    }
);


/* =========================================================
   MENU IMAGE ROTATION
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );


let menuIndex =
    0;


function cycleMenuImage() {

    if (
        menuImages.length ===
        0
    ) {

        return;
    }


    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );


    menuIndex =
        (
            menuIndex +
            1
        ) %
        menuImages.length;


    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}


setInterval(
    cycleMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.5
            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock =
    new THREE.Clock();


let recordingTime =
    0;


function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;
    }


    recordingTime +=
        dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total /
            3600
        );


    const minutes =
        Math.floor(
            (
                total %
                3600
            ) /
            60
        );


    const seconds =
        total %
        60;


    const format =
        number =>
            String(
                number
            ).padStart(
                2,
                "0"
            );


    document.getElementById(
        "tapeTime"
    ).textContent =

        `${format(hours)}:` +

        `${format(minutes)}:` +

        `${format(seconds)}`;
}


/* =========================================================
   CAMERA CRT FLICKER
========================================================= */

let crtFlickerTimer =
    0;


function updateCRTFlicker(
    dt
) {

    crtFlickerTimer -=
        dt;


    const element =
        document.querySelector(
            ".camFlicker"
        );


    if (
        crtFlickerTimer <=
        0
    ) {

        crtFlickerTimer =
            0.4 +
            Math.random() *
            2.5;


        if (
            Math.random() <
            .28
        ) {

            element.style.opacity =
                String(
                    .02 +
                    Math.random() *
                    .07
                );

        } else {

            element.style.opacity =
                "0";
        }
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(

            clock.getDelta(),

            .05
        );


    updateCRTFlicker(
        dt
    );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );

        updateEntity(
            dt
        );

        updateLights(
            dt
        );

        updateCamera(
            dt
        );

        updateEntityAudio();

        updateMessage(
            dt
        );

        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIALIZATION
========================================================= */

loadEnvironmentTextures();

animate();

</script>
