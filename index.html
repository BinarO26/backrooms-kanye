<script type="module">

import * as THREE from "three";

/* =========================================================
   SETUP
========================================================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    .05,
    350
);

camera.rotation.order="YXZ";

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Object3D();
scene.add(player);
player.add(camera);

camera.position.set(0,0,0);

let yaw=0;
let pitch=0;

const PLAYER_RADIUS=.38;
const EYE_HEIGHT=1.65;
const HEAD_HEIGHT=.28;

const WALK_SPEED=4.5;
const SPRINT_SPEED=7.5;
const JUMP_SPEED=7.5;
const GRAVITY=20;

let velocityY=0;
let grounded=true;
let falling=false;
let stamina=100;


/* =========================================================
   GAME
========================================================= */

let currentLevel=null;
let gameStarted=false;
let paused=false;

let world=[];
let colliders=[];
let floors=[];

let entity=null;
let entityStuck=0;

const clock=new THREE.Clock();


/* =========================================================
   INPUT
========================================================= */

const keys={};
let jumpPressed=false;

addEventListener("keydown",e=>{

    const key=e.key.toLowerCase();
    keys[key]=true;

    if(e.code==="Space"){
        e.preventDefault();

        if(!e.repeat)
            jumpPressed=true;
    }

    if(
        e.code==="Escape" ||
        key==="p"
    ){
        if(gameStarted)
            togglePause();
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});


/* =========================================================
   MOUSE
========================================================= */

document.addEventListener("mousemove",e=>{

    if(document.pointerLockElement!==document.body)
        return;

    yaw-=e.movementX*.002;
    pitch-=e.movementY*.002;

    pitch=THREE.MathUtils.clamp(
        pitch,
        -Math.PI/2.1,
        Math.PI/2.1
    );

    player.rotation.y=yaw;
    camera.rotation.x=pitch;
});


/* =========================================================
   MATERIALS
========================================================= */

function mat(color,roughness=1){

    return new THREE.MeshStandardMaterial({
        color,
        roughness
    });
}


/* =========================================================
   WORLD HELPERS
========================================================= */

function add(obj){

    scene.add(obj);
    world.push(obj);

    return obj;
}


function collider(obj){

    colliders.push(
        new THREE.Box3().setFromObject(obj)
    );
}


function box(
    w,h,d,
    x,y,z,
    material,
    solid=true
){

    const obj=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        material
    );

    obj.position.set(x,y,z);
    add(obj);

    if(solid)
        collider(obj);

    return obj;
}


function floorPlane(
    w,d,y,material,
    solid=false
){

    const obj=new THREE.Mesh(
        new THREE.PlaneGeometry(w,d),
        material
    );

    obj.rotation.x=-Math.PI/2;
    obj.position.y=y;

    add(obj);

    if(solid){

        colliders.push(
            new THREE.Box3(
                new THREE.Vector3(
                    -w/2,
                    y-.05,
                    -d/2
                ),
                new THREE.Vector3(
                    w/2,
                    y+.05,
                    d/2
                )
            )
        );
    }

    floors.push({
        minX:-w/2,
        maxX:w/2,
        minZ:-d/2,
        maxZ:d/2,
        y
    });

    return obj;
}


/* =========================================================
   COLLISION
========================================================= */

function horizontalBlocked(pos){

    for(const b of colliders){

        const x=Math.max(
            b.min.x,
            Math.min(pos.x,b.max.x)
        );

        const z=Math.max(
            b.min.z,
            Math.min(pos.z,b.max.z)
        );

        const dx=pos.x-x;
        const dz=pos.z-z;

        if(
            dx*dx+dz*dz <
            PLAYER_RADIUS*PLAYER_RADIUS
        ){
            return true;
        }
    }

    return false;
}


function entityBlocked(pos){

    const radius=.38;

    for(const b of colliders){

        const x=Math.max(
            b.min.x,
            Math.min(pos.x,b.max.x)
        );

        const z=Math.max(
            b.min.z,
            Math.min(pos.z,b.max.z)
        );

        const dx=pos.x-x;
        const dz=pos.z-z;

        if(
            dx*dx+dz*dz <
            radius*radius
        ){
            return true;
        }
    }

    return false;
}


function findFloor(x,z,currentY){

    let best=0;

    for(const f of floors){

        if(
            x>=f.minX &&
            x<=f.maxX &&
            z>=f.minZ &&
            z<=f.maxZ &&
            f.y<=currentY+.8
        ){
            best=Math.max(best,f.y);
        }
    }

    return best;
}


function findCeiling(x,z,height){

    let best=null;

    for(const b of colliders){

        if(
            x>=b.min.x-PLAYER_RADIUS &&
            x<=b.max.x+PLAYER_RADIUS &&
            z>=b.min.z-PLAYER_RADIUS &&
            z<=b.max.z+PLAYER_RADIUS &&
            b.min.y>height
        ){

            if(
                best===null ||
                b.min.y<best
            ){
                best=b.min.y;
            }
        }
    }

    return best;
}


/* =========================================================
   TEXTURES
========================================================= */

function makeWallpaper(){

    const c=document.createElement("canvas");
    c.width=1024;
    c.height=1024;

    const x=c.getContext("2d");

    x.fillStyle="#c7b64c";
    x.fillRect(0,0,1024,1024);

    for(let i=0;i<60000;i++){

        const v=Math.random()*30;

        x.fillStyle=
            `rgba(${120+v},${105+v},35,.12)`;

        x.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            Math.random()*3+1,
            Math.random()*3+1
        );
    }

    for(let i=0;i<50;i++){

        x.strokeStyle="rgba(65,55,10,.12)";
        x.lineWidth=2;

        const xx=Math.random()*1024;

        x.beginPath();
        x.moveTo(xx,0);
        x.lineTo(
            xx+Math.random()*25-12,
            1024
        );
        x.stroke();
    }

    const t=new THREE.CanvasTexture(c);

    t.wrapS=THREE.RepeatWrapping;
    t.wrapT=THREE.RepeatWrapping;
    t.repeat.set(3,3);

    return t;
}


function makeCarpet(){

    const c=document.createElement("canvas");
    c.width=1024;
    c.height=1024;

    const x=c.getContext("2d");

    x.fillStyle="#575956";
    x.fillRect(0,0,1024,1024);

    for(let i=0;i<90000;i++){

        const v=65+Math.random()*50;

        x.fillStyle=
            `rgba(${v},${v},${v},.10)`;

        x.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            2+Math.random()*2,
            1+Math.random()*3
        );
    }

    for(let i=0;i<90;i++){

        const px=Math.random()*1024;
        const py=Math.random()*1024;
        const r=15+Math.random()*55;

        const g=x.createRadialGradient(
            px,py,0,
            px,py,r
        );

        g.addColorStop(
            0,
            "rgba(10,15,13,.28)"
        );

        g.addColorStop(
            1,
            "rgba(10,15,13,0)"
        );

        x.fillStyle=g;
        x.beginPath();
        x.arc(px,py,r,0,Math.PI*2);
        x.fill();
    }

    return new THREE.CanvasTexture(c);
}


/* =========================================================
   LIGHTS
========================================================= */

function fluorescent(x,y,z){

    const fixture=box(
        2.4,.08,.42,
        x,y,z,
        new THREE.MeshBasicMaterial({
            color:0xffffd0
        }),
        false
    );

    const light=new THREE.PointLight(
        0xffeaa0,
        2.5,
        17
    );

    light.position.set(x,y-.15,z);
    add(light);

    return fixture;
}


/* =========================================================
   BACKROOMS — LEVEL 0
========================================================= */

function buildBackrooms(){

    currentLevel="backrooms";

    document.getElementById("level")
        .textContent="BACKROOMS";

    scene.background=
        new THREE.Color(0x17150a);

    scene.fog=new THREE.Fog(
        0x17150a,
        10,
        95
    );

    scene.add(
        new THREE.AmbientLight(
            0xffe6a0,
            1.55
        )
    );

    const wallpaper=
        new THREE.MeshStandardMaterial({
            map:makeWallpaper(),
            roughness:1
        });

    const carpet=
        new THREE.MeshStandardMaterial({
            map:makeCarpet(),
            roughness:1
        });


    /*
       HUGE BASE AREA
    */

    const W=180;
    const D=160;

    floorPlane(
        W,
        D,
        0,
        carpet,
        true
    );


    /*
       Outer walls
    */

    box(
        W,4.2,1,
        0,2.1,-D/2,
        wallpaper
    );

    box(
        W,4.2,1,
        0,2.1,D/2,
        wallpaper
    );

    box(
        1,4.2,D,
        -W/2,2.1,0,
        wallpaper
    );

    box(
        1,4.2,D,
        W/2,2.1,0,
        wallpaper
    );


    /*
       Ceiling
    */

    box(
        W,.15,D,
        0,4.2,0,
        mat(0x9d9346),
        false
    );


    /*
       MAIN ICONIC HALLWAY SECTION

       Long repeating corridors with
       yellow walls and open intersections.
    */

    const walls=[
        [-55,0,1,100],
        [55,0,1,100],

        [-25,-25,1,65],
        [25,25,1,65],

        [0,-52,65,1],
        [0,52,65,1],

        [-55,32,45,1],
        [55,-32,45,1],

        [-38,-10,30,1],
        [38,10,30,1]
    ];

    for(const w of walls){

        box(
            w[2],
            4.2,
            w[3],
            w[0],
            2.1,
            w[1],
            wallpaper
        );
    }


    /*
       OPEN ROOM / FOUND-FOOTAGE STYLE AREA
    */

    box(
        1,
        4.2,
        48,
        -72,
        2.1,
        25,
        wallpaper
    );

    box(
        48,
        4.2,
        1,
        -48,
        2.1,
        49,
        wallpaper
    );


    /*
       ICONIC CORNER-COLUMN GRID

       Columns sit at the corners of
       repeated square/grid spaces.
    */

    createCornerColumnGrid(
        -48,
        -5,
        6,
        6,
        wallpaper
    );


    /*
       Another smaller column grid.
    */

    createCornerColumnGrid(
        45,
        38,
        5,
        5,
        wallpaper
    );


    /*
       LARGE OPEN FOUND-FOOTAGE ROOM
    */

    createOpenRoom(
        -30,
        30,
        42,
        34,
        wallpaper
    );


    /*
       DEADLY GRID AREA
    */

    createHoleGrid(
        92,
        42,
        4,
        4,
        carpet
    );


    /*
       LIGHTS
    */

    for(let x=-75;x<=75;x+=10){

        for(let z=-65;z<=65;z+=12){

            fluorescent(
                x,
                4.02,
                z
            );
        }
    }


    /*
       Spawn
    */

    player.position.set(
        -68,
        EYE_HEIGHT,
        -58
    );

    yaw=0;
    pitch=0;

    createEntity(
        45,
        45
    );
}


/* =========================================================
   CORNER COLUMN GRID
========================================================= */

function createCornerColumnGrid(
    startX,
    startZ,
    columnsX,
    columnsZ,
    material
){

    const spacing=7;

    for(let x=0;x<columnsX;x++){

        for(let z=0;z<columnsZ;z++){

            const px=
                startX+x*spacing;

            const pz=
                startZ+z*spacing;

            box(
                .75,
                4,
                .75,
                px,
                2,
                pz,
                material
            );
        }
    }
}


/* =========================================================
   OPEN ROOM
========================================================= */

function createOpenRoom(
    x,
    z,
    w,
    d,
    material
){

    box(
        w,
        4.2,
        1,
        x,
        2.1,
        z-d/2,
        material
    );

    box(
        w,
        4.2,
        1,
        x,
        2.1,
        z+d/2,
        material
    );

    box(
        1,
        4.2,
        d,
        x-w/2,
        2.1,
        z,
        material
    );

    box(
        1,
        4.2,
        d,
        x+w/2,
        2.1,
        z,
        material
    );
}


/* =========================================================
   DEADLY SQUARE GRID
========================================================= */

function createHoleGrid(
    startX,
    startZ,
    countX,
    countZ,
    carpet
){

    const tile=3.4;
    const gap=.6;

    const totalX=
        countX*(tile+gap);

    const totalZ=
        countZ*(tile+gap);


    /*
       Surrounding walls.
    */

    box(
        totalX,
        4.2,
        1,
        startX+totalX/2,
        2.1,
        startZ-1,
        carpet
    );


    /*
       Carpet tiles around each deadly hole.
       The missing center is a REAL gap.
    */

    for(let x=0;x<countX;x++){

        for(let z=0;z<countZ;z++){

            const px=
                startX+
                x*(tile+gap)+
                tile/2;

            const pz=
                startZ+
                z*(tile+gap)+
                tile/2;


            /*
               Carpet square around hole.
            */

            box(
                tile,
                .18,
                tile,
                px,
                .09,
                pz,
                carpet,
                true
            );


            /*
               Black bottom far below.
            */

            const hole=
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        tile-.15,
                        tile-.15
                    ),
                    new THREE.MeshBasicMaterial({
                        color:0x000000
                    })
                );

            hole.rotation.x=-Math.PI/2;
            hole.position.set(
                px,
                -12,
                pz
            );

            add(hole);
        }
    }
}


/* =========================================================
   HOTEL — LEVEL 188
========================================================= */

function buildHotel(){

    currentLevel="hotel";

    document.getElementById("level")
        .textContent="HOTEL";

    scene.background=
        new THREE.Color(0x090c0e);

    scene.fog=new THREE.Fog(
        0x090c0e,
        18,
        150
    );

    scene.add(
        new THREE.AmbientLight(
            0x9ca7ad,
            .8
        )
    );


    const concrete=mat(
        0x77756f,
        .94
    );

    const dark=mat(
        0x363735,
        .9
    );

    const grass=mat(
        0x243820,
        1
    );

    const courtyardFloor=mat(
        0x625f58,
        1
    );

    const roomFloor=mat(
        0x4d4b47,
        1
    );


    /*
       LARGE COURTYARD
    */

    floorPlane(
        74,
        84,
        0,
        grass,
        true
    );


    /*
       Courtyard paths.
    */

    box(
        9,.16,84,
        -37,.08,0,
        courtyardFloor,
        false
    );

    box(
        9,.16,84,
        37,.08,0,
        courtyardFloor,
        false
    );

    box(
        74,.16,9,
        0,.08,-42,
        courtyardFloor,
        false
    );

    box(
        74,.16,9,
        0,.08,42,
        courtyardFloor,
        false
    );


    /*
       FIVE HOTEL FLOORS
    */

    const FLOOR_H=4.3;

    for(let floor=0;floor<5;floor++){

        buildHotelFloor(
            floor*FLOOR_H,
            FLOOR_H,
            concrete,
            dark,
            roomFloor
        );
    }


    /*
       Central bridge over courtyard.
    */

    buildBridge(
        FLOOR_H*2,
        dark
    );


    /*
       Secondary bridge on upper level.
    */

    buildBridge(
        FLOOR_H*4,
        dark
    );


    /*
       Staircases.
    */

    createHotelStairs(
        -31,
        -18,
        FLOOR_H
    );

    createHotelStairs(
        31,
        18,
        FLOOR_H
    );


    /*
       Spawn.
    */

    player.position.set(
        0,
        EYE_HEIGHT,
        29
    );

    yaw=Math.PI;
    pitch=0;

    createEntity(
        -28,
        -30
    );
}


/* =========================================================
   HOTEL FLOOR
========================================================= */

function buildHotelFloor(
    y,
    floorHeight,
    concrete,
    dark,
    carpet
){

    const h=floorHeight-.35;


    /*
       Four large wings.
    */

    buildWing(
        0,
        y,
        -39,
        82,
        6,
        h,
        concrete
    );

    buildWing(
        0,
        y,
        39,
        82,
        6,
        h,
        concrete
    );

    buildWing(
        -39,
        y,
        0,
        6,
        72,
        h,
        concrete
    );

    buildWing(
        39,
        y,
        0,
        6,
        72,
        h,
        concrete

/* =========================================================
   ENTITY
========================================================= */

const entityTexture=
    new THREE.TextureLoader().load(
        "./entity.png"
    );

entityTexture.colorSpace=
    THREE.SRGBColorSpace;

const entitySound=
    new Audio("./entity.mp3");

entitySound.loop=true;
entitySound.volume=0;

function createEntity(x,z){

    if(entity)
        scene.remove(entity);

    entity=new THREE.Mesh(
        new THREE.PlaneGeometry(
            1.8,
            3.4
        ),
        new THREE.MeshBasicMaterial({
            map:entityTexture,
            transparent:true,
            side:THREE.DoubleSide
        })
    );

    entity.position.set(
        x,
        1.7,
        z
    );

    add(entity);

    entityStuck=0;
}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(delta){

    if(!entity)
        return;

    const target=new THREE.Vector3(
        player.position.x,
        entity.position.y,
        player.position.z
    );

    const direction=
        target.sub(entity.position);

    direction.y=0;

    const distance=
        direction.length();

    if(distance>.2){

        direction.normalize();

        const speed=7.5;

        const movement=
            direction.clone()
            .multiplyScalar(
                speed*delta
            );

        const next=
            entity.position.clone()
            .add(movement);


        if(!entityBlocked(next)){

            entity.position.copy(next);
            entityStuck=0;

        }else{

            /*
               Try to slide around obstacle.
            */

            const left=
                new THREE.Vector3(
                    -direction.z,
                    0,
                    direction.x
                );

            const right=
                left.clone().negate();

            const leftPos=
                entity.position.clone()
                .add(
                    left.multiplyScalar(
                        speed*delta
                    )
                );

            const rightPos=
                entity.position.clone()
                .add(
                    right.multiplyScalar(
                        speed*delta
                    )
                );

            if(!entityBlocked(leftPos)){

                entity.position.copy(leftPos);
                entityStuck=0;

            }else if(!entityBlocked(rightPos)){

                entity.position.copy(rightPos);
                entityStuck=0;

            }else{

                entityStuck+=delta;
            }
        }
    }


    /*
       STUCK TELEPORT

       First choice is the closest
       valid point in the direction
       the entity is facing.
    */

    if(entityStuck>1.2){

        unstuckEntity();
        entityStuck=0;
    }


    entity.lookAt(
        player.position.x,
        entity.position.y,
        player.position.z
    );


    /*
       Distance sound.
    */

    const d=
        entity.position.distanceTo(
            player.position
        );

    const volume=
        THREE.MathUtils.clamp(
            1-d/40,
            0,
            1
        );

    entitySound.volume=
        volume*volume;


    /*
       Red danger effect.
    */

    if(d<15){

        const intensity=
            1-d/15;

        document.getElementById("danger")
            .style.boxShadow=
            `inset 0 0 180px
             rgba(180,0,0,
             ${intensity*.65})`;

    }else{

        document.getElementById("danger")
            .style.boxShadow="none";
    }


    if(
        d<1.25 &&
        !falling
    ){

        document.getElementById("message")
            .textContent=
            "THE ENTITY FOUND YOU";

        respawn();

        setTimeout(()=>{
            document.getElementById("message")
                .textContent="";
        },1800);
    }
}


/* =========================================================
   ENTITY UNSTUCK
========================================================= */

function unstuckEntity(){

    /*
       Current facing direction.
    */

    const forward=
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        entity.quaternion
    );

    forward.y=0;
    forward.normalize();


    /*
       Search progressively farther
       in facing direction.
    */

    const distances=[
        2,3,4,5,6,8,10,12,15
    ];

    for(const d of distances){

        const candidate=
            entity.position.clone()
            .add(
                forward.clone()
                .multiplyScalar(d)
            );

        if(!entityBlocked(candidate)){

            entity.position.copy(
                candidate
            );

            return;
        }
    }


    /*
       If facing direction is blocked,
       search around the entity.
    */

    for(
        let angle=0;
        angle<Math.PI*2;
        angle+=Math.PI/12
    ){

        const dir=
            new THREE.Vector3(
                Math.sin(angle),
                0,
                Math.cos(angle)
            );

        const candidate=
            entity.position.clone()
            .add(
                dir.multiplyScalar(6)
            );

        if(!entityBlocked(candidate)){

            entity.position.copy(
                candidate
            );

            return;
        }
    }
}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(delta){

    if(falling){

        velocityY-=GRAVITY*delta;

        player.position.y+=
            velocityY*delta;

        if(
            player.position.y<-12
        ){
            respawn();
        }

        jumpPressed=false;
        return;
    }


    const direction=
        new THREE.Vector3();

    if(keys.w) direction.z-=1;
    if(keys.s) direction.z+=1;
    if(keys.a) direction.x-=1;
    if(keys.d) direction.x+=1;


    if(direction.lengthSq()>0){

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );

        const sprint=
            keys.shift &&
            stamina>0;

        const speed=
            sprint
            ? SPRINT_SPEED
            : WALK_SPEED;

        if(sprint)
            stamina-=27*delta;
        else
            stamina+=18*delta;

        stamina=
            THREE.MathUtils.clamp(
                stamina,
                0,
                100
            );


        const movement=
            direction.clone()
            .multiplyScalar(
                speed*delta
            );


        const nx=
            player.position.clone();

        nx.x+=movement.x;

        if(!horizontalBlocked(nx))
            player.position.x=nx.x;


        const nz=
            player.position.clone();

        nz.z+=movement.z;

        if(!horizontalBlocked(nz))
            player.position.z=nz.z;

    }else{

        stamina=
            Math.min(
                100,
                stamina+18*delta
            );
    }


    /*
       ONE jump per press.
    */

    if(
        jumpPressed &&
        grounded
    ){

        velocityY=JUMP_SPEED;
        grounded=false;
    }

    jumpPressed=false;


    /*
       Gravity.
    */

    velocityY-=GRAVITY*delta;

    let nextY=
        player.position.y+
        velocityY*delta;


    /*
       Ceiling protection.
    */

    if(velocityY>0){

        const ceiling=
            findCeiling(
                player.position.x,
                player.position.z,
                nextY+HEAD_HEIGHT
            );

        if(
            ceiling!==null &&
            nextY+HEAD_HEIGHT>=ceiling
        ){

            nextY=
                ceiling-HEAD_HEIGHT;

            velocityY=0;
        }
    }


    /*
       Floor.
    */

    const floor=
        findFloor(
            player.position.x,
            player.position.z,
            player.position.y
        );


    if(
        nextY<=floor+EYE_HEIGHT
    ){

        nextY=
            floor+EYE_HEIGHT;

        velocityY=0;
        grounded=true;

    }else{

        grounded=false;
    }


    player.position.y=nextY;


    /*
       Level 0 holes.
    */

    checkHoles();


    document.getElementById("stamina")
        .style.width=
        stamina+"%";
}


/* =========================================================
   HOLES
========================================================= */

function checkHoles(){

    if(
        currentLevel!=="backrooms" ||
        falling
    )
        return;


    /*
       Hole-grid region.
    */

    const startX=92;
    const startZ=42;
    const tile=3.4;
    const gap=.6;

    const width=4*(tile+gap);
    const depth=4*(tile+gap);


    if(
        player.position.x<startX ||
        player.position.x>startX+width ||
        player.position.z<startZ ||
        player.position.z>startZ+depth
    ){
        return;
    }


    for(let x=0;x<4;x++){

        for(let z=0;z<4;z++){

            const px=
                startX+
                x*(tile+gap)+
                tile/2;

            const pz=
                startZ+
                z*(tile+gap)+
                tile/2;

            if(
                Math.abs(
                    player.position.x-px
                )<tile/2-.1 &&
                Math.abs(
                    player.position.z-pz
                )<tile/2-.1
            ){

                falling=true;
                velocityY=-1;
                return;
            }
        }
    }
}


/* =========================================================
   RESPAWN
========================================================= */

function respawn(){

    falling=false;
    velocityY=0;
    grounded=true;
    stamina=100;

    if(currentLevel==="hotel"){

        player.position.set(
            0,
            EYE_HEIGHT,
            29
        );

    }else{

        player.position.set(
            -68,
            EYE_HEIGHT,
            -58
        );
    }
}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(level){

    clearWorld();

    currentLevel=level;

    if(level==="hotel")
        buildHotel();
    else
        buildBackrooms();

    gameStarted=true;
    paused=false;

    document.getElementById("menu")
        .style.display="none";

    document.getElementById("pause")
        .style.display="none";

    document.body.requestPointerLock();

    entitySound.currentTime=0;

    entitySound.play().catch(()=>{});
}


/* =========================================================
   CLEAR
========================================================= */

function clearWorld(){

    for(const obj of world)
        scene.remove(obj);

    world=[];
    colliders=[];
    floors=[];

    entity=null;

    entitySound.pause();
    entitySound.currentTime=0;

    scene.fog=null;
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(paused)
        resumeGame();
    else
        pauseGame();
}


function pauseGame(){

    paused=true;

    document.getElementById("pause")
        .style.display="flex";

    document.exitPointerLock();

    entitySound.pause();
}


function resumeGame(){

    paused=false;

    document.getElementById("pause")
        .style.display="none";

    document.body.requestPointerLock();

    entitySound.play().catch(()=>{});
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById("backroomsButton")
    .onclick=()=>{
        startLevel("backrooms");
    };

document.getElementById("hotelButton")
    .onclick=()=>{
        startLevel("hotel");
    };

document.getElementById("resume")
    .onclick=()=>{
        resumeGame();
    };

document.getElementById("restart")
    .onclick=()=>{
        startLevel(currentLevel);
    };

document.getElementById("levels")
    .onclick=()=>{

        gameStarted=false;
        paused=false;

        document.exitPointerLock();

        clearWorld();

        document.getElementById("pause")
            .style.display="none";

        document.getElementById("menu")
            .style.display="flex";
    };


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener("click",()=>{

    if(
        gameStarted &&
        !paused &&
        document.pointerLockElement!==document.body
    ){

        document.body.requestPointerLock();

        entitySound.play().catch(()=>{});
    }
});


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        gameStarted &&
        !paused
    ){

        updatePlayer(delta);
        updateEntity(delta);

        document.getElementById("vhs")
            .style.opacity=
            .30+Math.random()*.08;
    }

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener("resize",()=>{

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
});
