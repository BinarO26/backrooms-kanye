    <script src="./three.min.js"></script>


    <script>

        "use strict";


        /* =================================================
           THREE.JS CHECK
        ================================================= */

        if (
            typeof THREE === "undefined"
        ) {

            const error =
                document.getElementById(
                    "error"
                );

            error.style.display =
                "block";

            error.textContent =
                "THREE.JS FAILED TO LOAD.\n\n" +
                "This version expects:\n\n" +
                "./index.html\n" +
                "./three.min.js\n\n" +
                "to be in the SAME folder.\n\n" +
                "If you are using GitHub Pages, make sure " +
                "three.min.js was actually committed to the repository.";

            throw new Error(
                "Local Three.js failed to load."
            );
        }


        /* =================================================
           SCENE
        ================================================= */

        const scene =
            new THREE.Scene();


        /*
            We keep the environment bright.

            The horror effect comes from the camera,
            fog, contrast and localized lighting,
            rather than making the whole scene black.
        */

        scene.background =
            new THREE.Color(
                0x8b824d
            );


        scene.fog =
            new THREE.Fog(
                0x8b824d,
                65,
                185
            );


        /* =================================================
           CAMERA
        ================================================= */

        const camera =
            new THREE.PerspectiveCamera(
                76,
                innerWidth /
                innerHeight,
                0.025,
                500
            );


        camera.rotation.order =
            "YXZ";


        /* =================================================
           RENDERER
        ================================================= */

        let renderer;

        try {

            renderer =
                new THREE.WebGLRenderer({
                    antialias: false,
                    powerPreference:
                        "high-performance"
                });

        } catch (errorObject) {

            const error =
                document.getElementById(
                    "error"
                );

            error.style.display =
                "block";

            error.textContent =
                "WEBGL COULD NOT START.\n\n" +
                errorObject;

            throw errorObject;
        }


        renderer.setSize(
            innerWidth,
            innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.35
            )
        );


        /*
            IMPORTANT:

            We are NOT using ACES or filmic
            tone mapping.

            This keeps the PNG colors visible.
        */

        renderer.toneMapping =
            THREE.NoToneMapping;


        renderer.toneMappingExposure =
            1;


        if (
            "outputColorSpace"
            in renderer
        ) {

            renderer.outputColorSpace =
                THREE.SRGBColorSpace;
        }


        document.body.appendChild(
            renderer.domElement
        );


        /* =================================================
           LIGHTING
        ================================================= */

        /*
            Bright ambient light.

            This prevents the environment textures
            from disappearing completely.
        */

        const ambientLight =
            new THREE.AmbientLight(
                0xfff1b0,
                1.05
            );

        scene.add(
            ambientLight
        );


        const hemisphereLight =
            new THREE.HemisphereLight(
                0xffed9b,
                0x39321e,
                1.0
            );

        scene.add(
            hemisphereLight
        );


        /* =================================================
           TEXTURE LOADING
        ================================================= */

        const textureLoader =
            new THREE.TextureLoader();


        let wallTexture = null;

        let floorTexture = null;

        let ceilingTexture = null;


        function configureTexture(
            texture
        ) {

            /*
                This is intentionally different
                from the entity.

                Environment textures are allowed
                to receive normal scene lighting.
            */

            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.magFilter =
                THREE.LinearFilter;


            texture.minFilter =
                THREE.LinearMipmapLinearFilter;


            texture.anisotropy =
                Math.min(
                    renderer
                        .capabilities
                        .getMaxAnisotropy(),
                    8
                );


            texture.needsUpdate =
                true;


            return texture;
        }


        function loadTexture(
            path
        ) {

            return new Promise(
                resolve => {

                    textureLoader.load(

                        path,

                        texture => {

                            console.log(
                                "TEXTURE LOADED:",
                                path
                            );

                            resolve(
                                configureTexture(
                                    texture
                                )
                            );

                        },

                        undefined,

                        errorObject => {

                            console.error(
                                "TEXTURE FAILED:",
                                path,
                                errorObject
                            );

                            resolve(
                                null
                            );
                        }
                    );

                }
            );
        }


        async function loadTextures() {

            wallTexture =
                await loadTexture(
                    "./textures/wall.png"
                );


            floorTexture =
                await loadTexture(
                    "./textures/floor.png"
                );


            ceilingTexture =
                await loadTexture(
                    "./textures/ceiling.png"
                );


            const missing = [];


            if (!wallTexture) {

                missing.push(
                    "./textures/wall.png"
                );
            }


            if (!floorTexture) {

                missing.push(
                    "./textures/floor.png"
                );
            }


            if (!ceilingTexture) {

                missing.push(
                    "./textures/ceiling.png"
                );
            }


            if (
                missing.length > 0
            ) {

                const error =
                    document.getElementById(
                        "error"
                    );

                error.style.display =
                    "block";

                error.textContent =
                    "ENVIRONMENT TEXTURE ERROR\n\n" +
                    "These files could not be loaded:\n\n" +
                    missing.join("\n") +
                    "\n\n" +
                    "Required GitHub Pages structure:\n\n" +
                    "index.html\n" +
                    "three.min.js\n" +
                    "entity.png\n" +
                    "entity.mp3\n" +
                    "textures/\n" +
                    "    wall.png\n" +
                    "    floor.png\n" +
                    "    ceiling.png\n" +
                    "    menu.jpg\n" +
                    "    menu2.jpg\n" +
                    "    menu3.jpg\n" +
                    "    menu4.jpg\n" +
                    "    menu5.jpg";
            }
        }


        /* =================================================
           PLAYER
        ================================================= */

        const player =
            new THREE.Object3D();


        scene.add(
            player
        );


        const EYE_HEIGHT =
            1.18;


        const PLAYER_HEIGHT =
            1.55;


        const PLAYER_RADIUS =
            0.28;


        let yaw = 0;

        let pitch = 0;

        let velocityY = 0;

        let grounded = false;

        let running = false;

        let paused = false;

        let dead = false;

        let fallingIntoLevel =
            false;

        let fallTimer = 0;


        const FALL_DURATION =
            2.25;


        let difficulty =
            "normal";


        /* =================================================
           WORLD DATA
        ================================================= */

        let worldObjects = [];

        let wallColliders = [];

        let deathHoles = [];

        let lights = [];


        function addWorldObject(
            object
        ) {

            scene.add(
                object
            );

            worldObjects.push(
                object
            );

            return object;
        }


        function disposeMaterial(
            material
        ) {

            if (!material) {
                return;
            }


            if (
                Array.isArray(
                    material
                )
            ) {

                material.forEach(
                    disposeMaterial
                );

                return;
            }


            /*
                Do NOT dispose the original
                environment texture.

                Only dispose cloned maps.
            */

            if (
                material.map &&
                material.map !== wallTexture &&
                material.map !== floorTexture &&
                material.map !== ceilingTexture
            ) {

                material.map.dispose();
            }


            material.dispose();
        }


        function clearWorld() {

            for (
                const object
                of worldObjects
            ) {

                scene.remove(
                    object
                );


                object.traverse(
                    child => {

                        if (
                            child.geometry
                        ) {

                            child.geometry.dispose();
                        }


                        if (
                            child.material
                        ) {

                            disposeMaterial(
                                child.material
                            );
                        }

                    }
                );
            }


            worldObjects = [];

            wallColliders = [];

            deathHoles = [];

            lights = [];


            if (exitLight) {

                scene.remove(
                    exitLight
                );

                exitLight =
                    null;
            }


            exitObject =
                null;


            entity =
                null;
        }


        /* =================================================
           ENVIRONMENT MATERIALS
        ================================================= */

        function createWallMaterial(
            width,
            height
        ) {

            if (!wallTexture) {

                return new THREE.MeshStandardMaterial({

                    color:
                        0xb9ae58,

                    roughness:
                        0.92,

                    metalness:
                        0,

                    side:
                        THREE.DoubleSide
                });
            }


            const texture =
                wallTexture.clone();


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.ClampToEdgeWrapping;


            const imageWidth =
                texture.image &&
                texture.image.width
                    ? texture.image.width
                    : 1;


            const imageHeight =
                texture.image &&
                texture.image.height
                    ? texture.image.height
                    : 1;


            const aspect =
                imageWidth /
                imageHeight;


            const naturalWidth =
                height *
                aspect;


            texture.repeat.set(

                Math.max(
                    width /
                    naturalWidth,
                    0.001
                ),

                1
            );


            texture.needsUpdate =
                true;


            /*
                ENVIRONMENT PNG:
                lit normally.
            */

            return new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    0.95,

                metalness:
                    0,

                side:
                    THREE.DoubleSide
            });
        }


        function createFloorMaterial() {

            if (!floorTexture) {

                return new THREE.MeshStandardMaterial({

                    color:
                        0x988d47,

                    roughness:
                        1,

                    metalness:
                        0
                });
            }


            const texture =
                floorTexture.clone();


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.repeat.set(
                100,
                100
            );


            texture.needsUpdate =
                true;


            return new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    1,

                metalness:
                    0
            });
        }


        function createCeilingMaterial() {

            if (!ceilingTexture) {

                return new THREE.MeshStandardMaterial({

                    color:

        function createHoleRoom() {

            const startX =
                -57;

            const startZ =
                53;

            const columns =
                18;

            const rows =
                8;

            const spacing =
                3.5;


            for (
                let z = 0;
                z < rows;
                z++
            ) {

                for (
                    let x = 0;
                    x < columns;
                    x++
                ) {

                    if (
                        (x + z) % 5 === 0

                        continue;

                    const px =
                        startX +
                        x *
                        spacing;


                    const pz =
                        startZ +
                        z *

                    deathHoles.push({

        function updateLights(
            dt
        ) {

            for (
                const item
                of lights
            ) {

                if (
                    !item.flicker
                ) {

                    continue;
                }


                item.timer -=
                    dt;


                if (
                    item.timer <= 0
                ) {

                    item.timer =
                        0.08 +
                        Math.random() *
                        0.55;


                    /*
                        IMPORTANT:

                        The lights NEVER disappear.

                        Instead they briefly become
                        dimmer and then return.
                    */

                    const multiplier =
                        0.45 +
                        Math.random() *
                        0.55;


                    item.light.intensity =
                        item.base *
                        multiplier;


                    item.fixture.visible =
                        true;
                }
            }
        }


        /* =================================================
           COLLISION
        ================================================= */

        function collides(
            x,
            z
        ) {

            const bottom =
                player.position.y;


            const top =
                bottom +
                PLAYER_HEIGHT;


            for (
                const wall
                of wallColliders
            ) {

                if (
                    top <= wall.minY ||
                    bottom >= wall.maxY
                ) {

                    continue;
                }


                const closestX =
                    Math.max(
                        wall.minX,
                        Math.min(
                            x,
                            wall.maxX
                        )
                    );


                const closestZ =
                    Math.max(
                        wall.minZ,
                        Math.min(
                            z,
                            wall.maxZ
                        )
                    );


                const dx =
                    x -
                    closestX;


                const dz =
                    z -
                    closestZ;


                if (
                    dx * dx +
                    dz * dz <
                    PLAYER_RADIUS *
                    PLAYER_RADIUS
                ) {

                    return true;
                }
            }


            return false;
        }


        function entityHitsWall(
            x,
            z
        ) {

            for (
                const wall
                of wallColliders
            ) {

                const closestX =
                    Math.max(
                        wall.minX,
                        Math.min(
                            x,
                            wall.maxX
                        )
                    );


                const closestZ =
                    Math.max(
                        wall.minZ,
                        Math.min(
                            z,
                            wall.maxZ
                        )
                    );


                const dx =
                    x -
                    closestX;


                const dz =
                    z -
                    closestZ;


                if (
                    dx * dx +
                    dz * dz <
                    0.43 *
                    0.43
                ) {

                    return true;
                }
            }


            return false;
        }


        function blocked(
            x1,
            z1,
            x2,
            z2
        ) {

            const dx =
                x2 -
                x1;


            const dz =
                z2 -
                z1;


            const distance =
                Math.hypot(
                    dx,
                    dz
                );


            const steps =
                Math.ceil(
                    distance /
                    0.35
                );


            for (
                let i = 1;
                i < steps;
                i++
            ) {

                const t =
                    i /
                    steps;


                if (
                    entityHitsWall(

                        x1 +
                        dx * t,

                        z1 +
                        dz * t
                    )
                ) {

                    return true;
                }
            }


            return false;
        }


        /* =================================================
           HOLE CHECK
        ================================================= */

        function playerInHole() {

            for (
                const hole
                of deathHoles
            ) {

                const dx =
                    player.position.x -
                    hole.x;


                const dz =
                    player.position.z -
                    hole.z;


                if (
                    dx * dx +
                    dz * dz <
                    hole.radius *
                    hole.radius
                ) {

                    return true;
                }
            }


            return false;
        }

        /* =================================================
           ENTITY AI
        ================================================= */

        function updateEntity(
            dt
        ) {

            if (
                !entity ||
                !running ||
                paused ||
                dead ||
                fallingIntoLevel
            ) {

                return;
            }


            const settings =
                SETTINGS[
                    difficulty
                ];


            const dx =
                player.position.x -
                entity.position.x;


            const dz =
                player.position.z -
                entity.position.z;


            const distance =
                Math.hypot(
                    dx,
                    dz
                );


            lastSeen +=
                dt;


            const visible =
                distance <
                settings.detection &&
                !blocked(

                    entity.position.x,
                    entity.position.z,

                    player.position.x,
                    player.position.z
                );


            let dx2 = 0;

            let dz2 = 0;


            if (visible) {

                lastKnown.set(
                    player.position.x,
                    player.position.z
                );


                lastSeen =
                    0;


                dx2 =
                    dx /
                    Math.max(
                        distance,
                        0.001
                    );


                dz2 =
                    dz /
                    Math.max(
                        distance,
                        0.001
                    );

            } else if (
                lastSeen < 3.2
            ) {

                const lx =
                    lastKnown.x -
                    entity.position.x;


                const lz =
                    lastKnown.y -
                    entity.position.z;


                const len =
                    Math.hypot(
                        lx,
                        lz
                    );


                if (
                    len > 0.1
                ) {

                    dx2 =
                        lx /
                        len;

                    dz2 =
                        lz /
                        len;
                }

            } else {

                wanderTimer -=
                    dt;


                if (
                    wanderTimer <= 0
                ) {

                    wanderTimer =
                        0.5 +
                        Math.random() *
                        1.8;


                    wanderAngle =
                        Math.random() *
                        Math.PI *
                        2;
                }


                dx2 =
                    Math.cos(
                        wanderAngle
                    );


                dz2 =
                    Math.sin(
                        wanderAngle
                    );
            }


            const targetAngle =
                Math.atan2(
                    dz2,
                    dx2
                );


            const currentAngle =
                Math.atan2(
                    entityDirection.y,
                    entityDirection.x
                );


            let difference =
                targetAngle -
                currentAngle;


            while (
                difference >
                Math.PI
            ) {

                difference -=
                    Math.PI *
                    2;
            }


            while (
                difference <
                -Math.PI
            ) {

                difference +=
                    Math.PI *
                    2;
            }


            difference =
                Math.max(

                    -3.4 * dt,

                    Math.min(
                        3.4 * dt,
                        difference
                    )
                );


            const angle =
                currentAngle +
                difference;


            entityDirection.x =
                Math.cos(
                    angle
                );


            entityDirection.y =
                Math.sin(
                    angle
                );


            entityVelocity.x =
                THREE.MathUtils.lerp(

                    entityVelocity.x,

                    entityDirection.x *
                    settings.speed,

                    Math.min(
                        1,
                        dt * 4
                    )
                );


            entityVelocity.y =
                THREE.MathUtils.lerp(

                    entityVelocity.y,

                    entityDirection.y *
                    settings.speed,

                    Math.min(
                        1,
                        dt * 4
                    )
                );


            const moveX =
                entityVelocity.x *
                dt;


            const moveZ =
                entityVelocity.y *
                dt;


            const nextX =
                entity.position.x +
                moveX;


            const nextZ =
                entity.position.z +
                moveZ;


            if (
                !entityHitsWall(
                    nextX,
                    entity.position.z
                )
            ) {

                entity.position.x =
                    nextX;

            } else {

                entityVelocity.x =
                    0;

                wanderAngle +=
                    Math.PI / 2;

                entityDirection.set(

                    Math.cos(
                        wanderAngle
                    ),

                    Math.sin(
                        wanderAngle
                    )
                );
            }


            if (
                !entityHitsWall(
                    entity.position.x,
                    nextZ
                )
            ) {

                entity.position.z =
                    nextZ;

            } else {

                entityVelocity.y =
                    0;

                wanderAngle +=
                    Math.PI / 2;

                entityDirection.set(

                    Math.cos(
                        wanderAngle
                    ),

                    Math.sin(
                        wanderAngle
                    )
                );
            }


            /*
                Billboard toward player.

                Keeps the PNG readable.
            */

            entity.rotation.y =
                Math.atan2(

                    player.position.x -
                    entity.position.x,

                    player.position.z -
                    entity.position.z
                );


            const killDistance =
                difficulty ===
                "nightmare"

                    ? 1.55

                    : 1.25;


            if (
                distance <
                killDistance
            ) {

                killPlayer();
            }
        }


        /* =================================================
           ENTITY AUDIO
        ================================================= */

        function updateEntityAudio() {

            if (
                !entity ||
                !running ||
                paused ||
                dead ||
                fallingIntoLevel
            ) {

                entityAudio.volume =
                    0;

                return;
            }


            const distance =
                Math.hypot(

                    entity.position.x -
                    player.position.x,

                    entity.position.z -
                    player.position.z
                );


            const maxDistance =
                34;


            if (
                distance >=
                maxDistance
            ) {

                entityAudio.volume =
                    0;

                return;
            }


            let volume =
                Math.pow(

                    1 -
                    distance /
                    maxDistance,

                    1.6
                ) *
                0.9;


            if (
                blocked(

                    player.position.x,
                    player.position.z,

                    entity.position.x,
                    entity.position.z
                )
            ) {

                volume *=
                    0.2;
            }


            entityAudio.volume =
                THREE.MathUtils.clamp(
                    volume,
                    0,
                    0.9
                );


            if (
                entityAudio.paused &&
                volume > 0.01
            ) {

                entityAudio
                    .play()
                    .catch(
                        () => {}
                    );
            }
        }

                }

                    event.code ===

        /* =================================================
           MOUSE LOOK
        ================================================= */

        document.addEventListener(
            "mousemove",
            event => {

                if (
                    !running ||
                    paused ||
                    dead ||
                    fallingIntoLevel
                ) {

                    return;
                }


                if (
                    document.pointerLockElement !==
                    document.body
                ) {

                    return;
                }


                yaw -=
                    event.movementX *
                    0.0022;


                pitch -=
                    event.movementY *
                    0.0018;


                pitch =
                    Math.max(

                        -1.45,

                        Math.min(

                        )
                    );

        /* =================================================
           PLAYER UPDATE
        ================================================= */

        function updatePlayer(
            dt
        ) {

            if (
                fallingIntoLevel
            ) {

                updateFall(
                    dt
                );

                return;
            }


            let forward =
                0;


            let side =
                0;


            if (
                keys.w
            ) {

                forward +=
                    1;
            }


            if (
                keys.s
            ) {

                forward -=
                    1;
            }


            if (
                keys.d
            ) {

                side +=
                    1;
            }


            if (
                keys.a
            ) {

                side -=
                    1;
            }


            const length =
                Math.hypot(
                    forward,
                    side
                );


            if (
                length
            ) {

                forward /=
                    length;

                side /=
                    length;
            }


            /*
                W/S FIX:

                Camera at yaw 0 looks toward -Z.

                Therefore:

                W -> -Z
                S -> +Z

                This is intentionally written
                explicitly so it cannot accidentally
                get swapped again.
            */

            let speed =
                keys.shift
                    ? 5.9
                    : 3.5;


            if (
                difficulty ===
                "easy"
            ) {

                speed =
                    keys.shift
                        ? 6.1
                        : 3.8;
            }


            if (
                difficulty ===
                "hard"
            ) {

                speed =
                    keys.shift
                        ? 6.3
                        : 3.4;
            }


            if (
                difficulty ===
                "nightmare"
            ) {

                speed =
                    keys.shift
                        ? 6.5
                        : 3.25;
            }


            const sin =
                Math.sin(
                    yaw
                );


            const cos =
                Math.cos(
                    yaw
                );


            /*
                Correct FPS movement basis.

                Forward:
                    (-sin, -cos)

                Right:
                    ( cos, -sin)
            */

            const dx =
                (
                    side * cos +
                    forward * sin
                ) *
                speed *
                dt;


            const dz =
                (
                    -side * sin -
                    forward * cos
                ) *
                speed *
                dt;


            const nextX =
                player.position.x +
                dx;


            const nextZ =
                player.position.z +
                dz;


            if (
                !collides(
                    nextX,
                    player.position.z
                )
            ) {

                player.position.x =
                    nextX;
            }


            if (
                !collides(
                    player.position.x,
                    nextZ
                )
            ) {

                player.position.z =
                    nextZ;
            }


            if (
                jumpPressed &&
                grounded
            ) {

                velocityY =
                    6.2;

                grounded =
                    false;
            }


            jumpPressed =
                false;


            velocityY -=
                20 *
                dt;


            player.position.y +=
                velocityY *
                dt;


            if (
                player.position.y <=
                0
            ) {

                player.position.y =
                    0;

                velocityY =
                    0;

                grounded =
                    true;
            }


            if (
                playerInHole()
            ) {

                killPlayer(
                    "YOU FELL INTO THE FLOOR."
                );

                return;
            }


            checkExit();
        }


        /* =================================================
           FALLING INTRO
        ================================================= */

        function updateFall(
            dt
        ) {

            fallTimer +=
                dt;


            const progress =
                Math.min(

                    fallTimer /
                    FALL_DURATION,

                    1
                );


            const eased =
                1 -
                Math.pow(
                    1 -
                    progress,
                    3
                );


            player.position.y =
                17 -
                17 *
                eased;


            camera.position.y =
                EYE_HEIGHT;


            camera.rotation.x =
                THREE.MathUtils.lerp(

                    -0.32,

                    0,

                    Math.min(
                        progress *
                        1.3,
                        1
                    )
                );


            camera.rotation.z =
                Math.sin(

                    progress *
                    Math.PI *
                    9

                ) *
                0.025;


            if (
                progress >=
                1
            ) {

                fallingIntoLevel =
                    false;


                player.position.y =
                    0;


                camera.position.set(
                    0,
                    EYE_HEIGHT,
                    0
                );


                camera.rotation.x =
                    0;


                camera.rotation.z =
                    0;


                document.body
                    .requestPointerLock();
            }
        }


        /* =================================================
           SECURITY CAMERA MOVEMENT
        ================================================= */

        let cameraTime =
            0;


        function updateCamera(
            dt
        ) {

            if (
                fallingIntoLevel
            ) {

                return;
            }


            cameraTime +=
                dt;


            const moving =
                keys.w ||
                keys.a ||
                keys.s ||
                keys.d;


            /*
                Stronger security-camera movement.

                Still subtle enough to remain playable.
            */

            const movementAmount =
                moving
                    ? 0.012
                    : 0.004;


            camera.position.x =
                Math.sin(
                    cameraTime *
                    3.4
                ) *
                movementAmount;


            camera.position.y =
                EYE_HEIGHT +
                Math.sin(
                    cameraTime *
                    4.1
                ) *
                movementAmount;


            camera.position.z =
                Math.cos(
                    cameraTime *
                    3.1
                ) *
                movementAmount *
                0.55;


            camera.rotation.z =
                Math.sin(
                    cameraTime *
                    0.9
                ) *
                0.0035;


            /*
                Random camera shake.
            */

            if (
                Math.random() <
                0.004
            ) {

                camera.position.x +=
                    (
                        Math.random() -
                        0.5
                    ) *
                    0.055;


                camera.position.y +=
                    (
                        Math.random() -
                        0.5
                    ) *
                    0.035;


                camera.rotation.z +=
                    (
                        Math.random() -
                        0.5
                    ) *
                    0.035;
            }
        }


        /* =================================================
           CRT EFFECT
        ================================================= */

        let crtEnabled =
            true;


        const crtOverlay =
            document.getElementById(
                "crtOverlay"
            );


        const crtTracking =
            document.getElementById(
                "crtTracking"
            );


        function toggleCRT() {

            crtEnabled =
                !crtEnabled;


            crtOverlay.style.display =
                crtEnabled
                    ? "block"
                    : "none";


            showMessage(

                crtEnabled
                    ? "SECURITY CAMERA EFFECT: ON"
                    : "SECURITY CAMERA EFFECT: OFF"
            );
        }


        let trackingTimer =
            0;


        function updateCRT(
            dt
        ) {

            if (
                !crtEnabled
            ) {

                return;
            }


            trackingTimer -=
                dt;


            if (
                trackingTimer <=
                0
            ) {

                trackingTimer =
                    2 +
                    Math.random() *
                    8;


                /*
                    Occasionally sweep a tracking
                    line across the screen.
                */

                if (
                    Math.random() <
                    0.65
                ) {

                    crtTracking.style.opacity =
                        "0.22";


                    crtTracking.style.top =
                        (
                            15 +
                            Math.random() *
                            70
                        ) +
                        "%";


                    setTimeout(
                        () => {

                            crtTracking.style.opacity =
                                "0";

                        },
                        80 +
                        Math.random() *
                        160
                    );
                }
            }
        }

        /* =================================================
           POINTER LOCK
        ================================================= */

        document.addEventListener(
            "click",
            () => {

                if (
                    running &&
                    !paused &&
                    !dead &&
                    !fallingIntoLevel &&
                    document.pointerLockElement !==
                    document.body
                ) {

                    document.body
                        .requestPointerLock();
                }

            }
        );


        /* =================================================
           RANDOM MENU IMAGES
        ================================================= */

        const menuImages =
            Array.from(

                document.querySelectorAll(
                    ".menuImage"
                )
            );


        let menuIndex =
            -1;


        function showRandomMenuImage() {

            if (
                menuImages.length ===
                0
            ) {

                return;
            }


            let nextIndex;


            do {

                nextIndex =
                    Math.floor(
                        Math.random() *
                        menuImages.length
                    );

            } while (
                menuImages.length >
                1 &&
                nextIndex ===
                menuIndex
            );


            if (
                menuIndex >= 0
            ) {

                menuImages[
                    menuIndex
                ].classList.remove(
                    "active"
                );
            }


            menuIndex =
                nextIndex;


            menuImages[
                menuIndex
            ].classList.add(
                "active"
            );
        }


        /*
            Start with a random image.

            This prevents the menu from opening
            to a blank first image.
        */

        showRandomMenuImage();


        /*
            Random new image every minute.
        */

        setInterval(
            () => {

                showRandomMenuImage();

            },
            60000
        );


        /* =================================================
           RESIZE
        ================================================= */

        addEventListener(
            "resize",
            () => {

                camera.aspect =
                    innerWidth /
                    innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    innerWidth,
                    innerHeight
                );


                renderer.setPixelRatio(
                    Math.min(
                        window.devicePixelRatio || 1,
                        1.35
                    )
                );
            }
        );


        /* =================================================
           TIMER
        ================================================= */

        const clock =
            new THREE.Clock();


        let recordingTime =
            0;


        function updateTimer(
            dt
        ) {

            if (
                !running ||
                paused
            ) {

                return;
            }


            recordingTime +=
                dt;


            const total =
                Math.floor(
                    recordingTime
                );


            const hours =
                Math.floor(
                    total /
                    3600
                );


            const minutes =
                Math.floor(
                    (
                        total %
                        3600
                    ) /
                    60
                );


            const seconds =
                total %
                60;


            const format =
                number => {

                    return String(
                        number
                    ).padStart(
                        2,
                        "0"
                    );
                };


            document.getElementById(
                "tapeTime"
            ).textContent =

                `${format(hours)}:` +
                `${format(minutes)}:` +
                `${format(seconds)}`;
        }


        /* =================================================
           GAME LOOP
        ================================================= */

        function animate() {

            requestAnimationFrame(
                animate
            );


            const dt =
                Math.min(

                    clock.getDelta(),

                    0.05
                );


            if (
                running &&
                !paused &&
                !dead
            ) {

                updatePlayer(
                    dt
                );


                updateEntity(
                    dt
                );


                updateLights(
                    dt
                );


                updateCamera(
                    dt
                );


                updateEntityAudio();


                updateMessage(
                    dt
                );


                updateTimer(
                    dt
                );

            } else {

                updateEntityAudio();
            }


            updateCRT(
                dt
            );


            renderer.render(
                scene,
                camera
            );
        }


        /* =================================================
           INITIAL LOAD
        ================================================= */

        loadTextures();

        animate();

    </script>
