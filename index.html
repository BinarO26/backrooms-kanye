<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>THE BACKROOMS — LEVEL 0</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================================================
   MENU
========================================================= */

#menu,
#pause,
#death{
    position:fixed;
    inset:0;
    z-index:20;
}

#menu{
    display:block;
    overflow:hidden;
    background:#111;
}

.menuImage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;

    /*
       IMPORTANT:
       Images start visible now.
       If an image fails, JS removes it.
    */
    opacity:0;
    transition:opacity 2s ease;
}

.menuImage.active{
    opacity:1;
}

.menuDark{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            rgba(0,0,0,.20),
            rgba(0,0,0,.74)
        );
}

.menuNoise{
    position:absolute;
    inset:0;
    opacity:.075;
    pointer-events:none;

    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            #fff 0,
            #fff 1px,
            transparent 1px,
            transparent 4px
        );

    background-size:6px 6px;
}

.menuScan{
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(0,0,0,.14) 4px
        );
}

.menuContent{
    position:absolute;
    top:18%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    color:white;
    width:90%;

}

.menuContent h1{

}

.menuSubtitle{

    letter-spacing:.3em;
}

.menuHint{
    margin-top:32px;

    letter-spacing:.25em;

}

.menuButtons{
    position:absolute;
    left:50%;
    bottom:11%;
    transform:translateX(-50%);
    width:min(500px,88vw);

}

.menuDifficulty{
    display:flex;

    gap:7px;
    margin-bottom:18px;
}

button{

}

.menuButton{

}

/* =========================================================
   PAUSE / DEATH
========================================================= */

#pause,

}

#pause h1{

}

#pause button,

}

#deathTitle{

}

#deathTitle.win{

}

#deathText{

/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;
    inset:0;
    z-index:10;

}

#difficultyHud{

    font-size:12px;
    letter-spacing:.18em;

}

#tapeTime{

    right:20px;

}

#message{
    position:absolute;
    left:50%;
    bottom:15%;
    transform:translateX(-50%);
    color:white;
    font-size:13px;
    letter-spacing:.18em;
    text-align:center;
    text-shadow:0 2px 7px #000;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:4px;
    height:4px;
    transform:translate(-50%,-50%);
    background:rgba(255,255,255,.38);
}

/* =========================================================
   FNAF SECURITY CAMERA EFFECT
========================================================= */

.camLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

/* horizontal CRT scanlines */
.camScanlines{
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            rgba(0,0,0,.12) 2px,
            rgba(0,0,0,.12) 4px
        );
    opacity:.55;
}

/* second slower scanline layer */
.camScanlines2{
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 7px,
            rgba(255,255,255,.025) 8px,
            transparent 9px
        );
    opacity:.35;
}

/* static/grain */
.camGrain{
    opacity:.055;

    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.9) 0,
            rgba(255,255,255,.9) 1px,
            transparent 1px,
            transparent 4px
        );

    background-size:6px 6px;
    animation:grainMove .11s steps(2) infinite;
}

@keyframes grainMove{
    0%{transform:translate(0,0)}
    25%{transform:translate(-2px,1px)}
    50%{transform:translate(1px,-2px)}
    75%{transform:translate(2px,2px)}
    100%{transform:translate(0,0)}
}

/* CRT edge darkening */
.camVignette{
    background:
        radial-gradient(
            ellipse at center,
            transparent 38%,
            rgba(0,0,0,.20) 68%,
            rgba(0,0,0,.72) 100%
        );
}

/* subtle RGB camera bleed */
.camRGB{
    background:
        linear-gradient(
            90deg,
            rgba(255,0,0,.035),
            transparent 18%,
            transparent 82%,
            rgba(0,70,255,.04)
        );

    mix-blend-mode:screen;
}

/* occasional horizontal tracking line */
.camTracking{
    opacity:0;
    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            transparent 49%,
            rgba(255,255,255,.09) 50%,
            transparent 51%,
            transparent 100%
        );
}

/* CRT slight curvature illusion */
.camCurve{
    box-shadow:
        inset 0 0 100px rgba(0,0,0,.42),
        inset 0 0 30px rgba(0,0,0,.22);
}

/* little timestamp style */
.camLabel{
    position:absolute;
    right:20px;
    bottom:18px;
    color:rgba(255,255,255,.30);
    font-family:monospace;
    font-size:10px;
    letter-spacing:.08em;
}

/* =========================================================
   ERROR
========================================================= */

#error{
    display:none;
    position:fixed;
    z-index:100;
    left:20px;
    right:20px;
    bottom:20px;
    padding:18px;
    color:#fff;
    background:rgba(120,0,0,.94);
    border:1px solid #f66;
    white-space:pre-wrap;
    font-family:monospace;
}
</style>

<!-- =========================================================
     THREE.JS LOADER

<script>

(function(){

    const sources = [
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js",
        "https://unpkg.com/three@0.180.0/build/three.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.min.js"
    ];

    let index = 0;

    function loadNext(){

        if(index >= sources.length){

            showFatalError(
                "THREE.JS COULD NOT LOAD.\n\n" +
                "The game tried multiple CDNs:\n" +
                sources.join("\n") +
                "\n\n" +
                "If you are using GitHub Pages, make sure your browser is online."
            );

            return;
        }

        const script =
            document.createElement("script");

        script.src =
            sources[index++];

        script.onload = function(){

            if(!window.THREE){

                loadNext();
                return;
            }

            startApplication();
        };

        script.onerror = function(){

            loadNext();
        };

        document.head.appendChild(script);
    }

    function showFatalError(text){

        const box =
            document.getElementById("error");

        box.style.display = "block";
        box.textContent = text;
    }

    loadNext();

})();

</script>

<script>

function startApplication(){

"use strict";

/* =========================================================
   THREE CHECK
========================================================= */

if(!window.THREE){

    document.getElementById("error").style.display="block";

    document.getElementById("error").textContent =
        "Three.js loaded incorrectly.";

    return;
}


/* =========================================================
   MENU IMAGE LOADING
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(".menuImage")
    );

let validMenuImages = [];
let menuIndex = 0;

menuImages.forEach(img => {

    const original =
        img.getAttribute("src");

    const fallback =
        img.dataset.fallback;

    img.addEventListener(
        "error",
        function(){

            if(
                fallback &&
                img.src !==
                new URL(
                    fallback,
                    location.href
                ).href
            ){

                img.src = fallback;

            }else{

                img.remove();
            }
        }
    );

    img.addEventListener(
        "load",
        function(){

            if(
                !validMenuImages.includes(img)
            ){

                validMenuImages.push(img);
            }

            /*
               Make sure the first successfully
               loaded image is actually visible.
            */
            if(validMenuImages.length === 1){

                menuImages.forEach(
                    x =>
                        x.classList.remove("active")
                );

                img.classList.add("active");
            }
        }
    );

    /*
       Reassign src so the error listener catches
       both normal and fallback attempts.
    */
    img.src = original;
});


setInterval(function(){

    if(validMenuImages.length < 2)
        return;

    validMenuImages[
        menuIndex
    ].classList.remove("active");

    menuIndex =
        (menuIndex + 1) %
        validMenuImages.length;

    validMenuImages[
        menuIndex
    ].classList.add("active");

},60000);


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x706a43);

scene.fog =
    new THREE.FogExp2(
        0x706a43,
        .008
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .025,
        500
    );

camera.rotation.order =
    "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:
            "high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio || 1,
        1.35
    )
);

if(
    "outputColorSpace"
    in renderer
){

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}

renderer.toneMapping =
    THREE.NoToneMapping;

renderer.toneMappingExposure =
    1;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        .24
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xffef9c,
        0x17140c,
        .38
    )
);


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;


function prepareTexture(texture){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate =
        true;

    return texture;
}


function loadTexture(path){

    return new Promise(resolve => {

        textureLoader.load(

            path,

            texture => {

                console.log(
                    "Loaded:",
                    path
                );

                resolve(
                    prepareTexture(texture)
                );
            },

            undefined,

            error => {

                console.warn(
                    "Failed:",
                    path,
                    error
                );

                resolve(null);
            }
        );

    });
}


async function loadTextures(){

    /*
       These are intentionally in the
       textures folder.
    */

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing=[];

    if(!wallTexture)
        missing.push(
            "./textures/wall.png"
        );

    if(!floorTexture)
        missing.push(
            "./textures/floor.png"
        );

    if(!ceilingTexture)
        missing.push(
            "./textures/ceiling.png"
        );

    if(missing.length){

        const error =
            document.getElementById("error");

        error.style.display="block";

        error.textContent =
            "TEXTURE FILE ERROR\n\n" +
            missing.join("\n") +
            "\n\n" +
            "Make sure these exact filenames exist.";
    }
}


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const EYE_HEIGHT =
    1.18;

const PLAYER_HEIGHT =
    1.55;

const PLAYER_RADIUS =
    .28;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=false;

let running=false;
let paused=false;
let dead=false;

let fallingIntoLevel=false;
let fallTimer=0;

const FALL_DURATION=2.25;

let difficulty="normal";


/* =========================================================
   WORLD
========================================================= */

let worldObjects=[];
let wallColliders=[];
let deathHoles=[];
let lights=[];

let exitObject=null;
let exitLight=null;

let exitX=0;
let exitZ=0;

function addWorldObject(object){

    scene.add(object);

    worldObjects.push(object);

    return object;
}


function disposeMaterial(material){

    if(!material)
        return;

    if(Array.isArray(material)){

        material.forEach(
            disposeMaterial
        );

        return;
    }

    /*
       Do NOT dispose shared textures
       unnecessarily.
    */

    material.dispose();
}


function clearWorld(){

    for(
        const object of worldObjects
    ){

        scene.remove(object);

        object.traverse?.(
            child => {

                if(child.geometry)
                    child.geometry.dispose();

                if(child.material)
                    disposeMaterial(
                        child.material
                    );
            }
        );
    }

    worldObjects=[];
    wallColliders=[];
    deathHoles=[];
    lights=[];

    if(exitLight){

        scene.remove(
            exitLight
        );

        exitLight=null;
    }

    exitObject=null;
    entity=null;
}


/* =========================================================
   WALL MATERIAL
========================================================= */

/*
   IMPORTANT:

   Walls are NOT MeshBasicMaterial.

   That means lights actually affect
   wall.png.

   ONLY ENTITY.PNG remains unshaded.
*/

function makeWallMaterial(
    width,
    height
){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({

            color:0xb3a94e,

            roughness:.9,

            metalness:0,

            side:THREE.DoubleSide
        });
    }

    const texture =
        wallTexture.clone();

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    const iw =
        texture.image?.width || 1;

    const ih =
        texture.image?.height || 1;

    const aspect =
        iw / ih;

    const naturalWidth =
        height * aspect;

    texture.repeat.set(
        Math.max(
            width / naturalWidth,
            .001
        ),
        1
    );

    texture.needsUpdate=true;

    return new THREE.MeshStandardMaterial({

        map:texture,

        color:0xffffff,

        roughness:.88,

        metalness:0,

        side:THREE.DoubleSide
    });
}


/* =========================================================
   WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth=.32
){

    const height=3.1;

    wallColliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minZ:z-depth/2,
        maxZ:z+depth/2,

        minY:0,
        maxY:height
    });

    const group =
        new THREE.Group();


    const front =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                height
            ),
            makeWallMaterial(
                width,
                height
            )
        );

    front.position.set(
        0,
        height/2,
        depth/2
    );

    group.add(front);


    const back =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                height
            ),
            makeWallMaterial(
                width,
                height
            )
        );

    back.rotation.y=Math.PI;

    back.position.set(
        0,
        height/2,
        -depth/2
    );

    group.add(back);


    const left =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                depth,
                height
            ),
            makeWallMaterial(
                depth,
                height
            )
        );

    left.rotation.y=
        Math.PI/2;

    left.position.set(
        -width/2,
        height/2,
        0
    );

    group.add(left);


    const right =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                depth,
                height
            ),
            makeWallMaterial(
                depth,
                height
            )
        );

    right.rotation.y=
        -Math.PI/2;

    right.position.set(
        width/2,
        height/2,
        0
    );

    group.add(right);


    group.position.set(
        x,
        0,
        z
    );

    addWorldObject(group);
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor(){

    let material;

    if(floorTexture){

        const texture =
            floorTexture.clone();

        texture.colorSpace =
            THREE.SRGBColorSpace;

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        texture.repeat.set(
            120,
            105
        );

        texture.needsUpdate=true;

        material =
            new THREE.MeshStandardMaterial({

                map:texture,

                color:0xffffff,

                roughness:1,

                metalness:0
            });

    }else{

        material =
            new THREE.MeshStandardMaterial({

                color:0x968b43,

                roughness:1,

                metalness:0
            });
    }


    const floor =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                300,
                270
            ),
            material
        );

    floor.rotation.x=
        -Math.PI/2;

    addWorldObject(floor);
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling(){

    let material;

    if(ceilingTexture){

        const texture =
            ceilingTexture.clone();

        texture.colorSpace =
            THREE.SRGBColorSpace;

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =

        texture.repeat.set(

function createHoleRoom(){

    const startX=-57;
    const startZ=53;

    const columns=18;
    const rows=8;
    const spacing=3.5;

    for(let z=0;z<rows;z++){

        for(let x=0;x<columns;x++){

            const px =
                startX+x*spacing;

            const pz =
                startZ+z*spacing;

            if((x+z)%5===0)
                continue;

            const hole =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.7,
                        2.7
                    ),

                    new THREE.MeshBasicMaterial({

                        color:0x020202,

                        side:
                            THREE.DoubleSide
                    })
                );

            hole.rotation.x=
                -Math.PI/2;

            hole.position.set(
                px,
                .006,
                pz
            );

            addWorldObject(hole);

            deathHoles.push({
                x:px,
                z:pz,
                radius:1.28
            });
        }
    }
}

/* =========================================================
   COLLISION
========================================================= */

function collides(x,z){

    const bottom =
        player.position.y;

    const top =
        bottom+PLAYER_HEIGHT;

    for(
        const wall of wallColliders
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        )
            continue;

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=
            x-closestX;

        const dz=
            z-closestZ;

        if(
            dx*dx+
            dz*dz<
            PLAYER_RADIUS*
            PLAYER_RADIUS
        )
            return true;
    }

    return false;
}


function entityHitsWall(x,z){

    for(
        const wall of wallColliders
    ){

        const closestX=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+
            dz*dz<
            .43*.43
        )
            return true;
    }

    return false;
}


function blocked(
    x1,
    z1,
    x2,
    z2
){

    const dx=x2-x1;
    const dz=z2-z1;

    const distance=
        Math.hypot(dx,dz);

    const steps=
        Math.ceil(distance/.35);

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        if(
            entityHitsWall(
                x1+dx*t,
                z1+dz*t
            )
        )
            return true;
    }

    return false;
}

}

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    )
        return;

    const settings=
        SETTINGS[difficulty];

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(dx,dz);

    lastSeen+=dt;

    const visible=
        distance<
        settings.detection&&
        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );

    let dx2=0;
    let dz2=0;


    if(visible){

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen=0;

        dx2=
            dx/
            Math.max(distance,.001);

        dz2=
            dz/
            Math.max(distance,.001);

    }else if(lastSeen<3.2){

        const lx=
            lastKnown.x-
            entity.position.x;

        const lz=
            lastKnown.y-
            entity.position.z;

        const len=
            Math.hypot(lx,lz);

        if(len>.1){

            dx2=lx/len;
            dz2=lz/len;
        }

    }else{

        wanderTimer-=dt;

        if(wanderTimer<=0){

            wanderTimer=
                .5+
                Math.random()*1.8;

            wanderAngle=
                Math.random()*
                Math.PI*2;
        }

        dx2=Math.cos(wanderAngle);
        dz2=Math.sin(wanderAngle);
    }


    const targetAngle=
        Math.atan2(dz2,dx2);

    const currentAngle=
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference=
        targetAngle-currentAngle;

    while(
        difference>Math.PI
    )
        difference-=Math.PI*2;

    while(
        difference<-Math.PI
    )
        difference+=Math.PI*2;

    difference=
        Math.max(
            -3.4*dt,
            Math.min(
                3.4*dt,
                difference
            )
        );

    const angle=
        currentAngle+difference;

    entityDirection.x=
        Math.cos(angle);

    entityDirection.y=
        Math.sin(angle);

    entityVelocity.x=
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x*
            settings.speed,
            Math.min(1,dt*4)
        );

    entityVelocity.y=
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y*
            settings.speed,
            Math.min(1,dt*4)
        );


    /*
       JUKING / WALL AVOIDANCE
    */

    const moveX=
        entityVelocity.x*dt;

    const moveZ=
        entityVelocity.y*dt;

    const nextX=
        entity.position.x+moveX;

    const nextZ=
        entity.position.z+moveZ;


    if(
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ){

        entity.position.x=nextX;

    }else{

        entityVelocity.x=0;

        wanderAngle+=
            Math.PI/2;

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }


    if(
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ){

        entity.position.z=nextZ;

    }else{

        entityVelocity.y=0;

        wanderAngle+=
            Math.PI/2;

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }


    /*
       Billboard toward player.
    */

    entity.rotation.y=
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );


    const killDistance=
        difficulty==="nightmare"
            ?1.55
            :1.25;

    if(
        distance<
        killDistance
    )
        killPlayer();
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio(){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){

        entityAudio.volume=0;

        return;
    }

    const distance=
        Math.hypot(

            entity.position.x-
            player.position.x,

            entity.position.z-
            player.position.z
        );

    const maxDistance=34;

    if(
        distance>=maxDistance
    ){

        entityAudio.volume=0;

        return;
    }

    let volume=
        Math.pow(
            1-distance/maxDistance,
            1.6
        )*.9;

    if(
        blocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    )
        volume*=.2;

    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if(
        entityAudio.paused&&
        volume>.01
    ){

        entityAudio.play().catch(
            ()=>{}
        );
    }
}

    if(difficulty==="easy")
        speed=
            keys.shift?6.1:3.8;

    if(difficulty==="hard")
        speed=
            keys.shift?6.3:3.4;

    if(difficulty==="nightmare")
        speed=
            keys.shift?6.5:3.25;


    const sin=Math.sin(yaw);
    const cos=Math.cos(yaw);

    const dx=
        (
            side*cos+
            forward*sin
        )*
        speed*
        dt;

    const dz=
        (
            -side*sin+
            forward*cos
        )*
        speed*
        dt;

    const nextX=
        player.position.x+dx;

    const nextZ=
        player.position.z+dz;


    if(
        !collides(
            nextX,
            player.position.z
        )
    )
        player.position.x=nextX;

    if(
        !collides(
            player.position.x,
            nextZ
        )
    )
        player.position.z=nextZ;


    if(
        jumpPressed&&
        grounded
    ){

        velocityY=6.2;
        grounded=false;
    }

    jumpPressed=false;

    velocityY-=20*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;
    }

    if(playerInHole()){

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }

    checkExit();
}


/* =========================================================
   FALL
========================================================= */

function updateFall(dt){

    fallTimer+=dt;

    const progress=
        Math.min(
            fallTimer/FALL_DURATION,
            1
        );

    const eased=
        1-
        Math.pow(
            1-progress,
            3
        );

    player.position.y=
        17-
        17*eased;

    camera.position.y=
        EYE_HEIGHT;

    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                progress*1.3,
                1
            )
        );

    camera.rotation.z=
        Math.sin(
            progress*
            Math.PI*
            9
        )*.025;

    if(progress>=1){

        fallingIntoLevel=false;

        player.position.y=0;

        camera.position.set(
            0,
            EYE_HEIGHT,
            0
        );

        camera.rotation.set(
            0,
            0,
            0
        );

        document.body.requestPointerLock();
    }
}


/* =========================================================
   CAMERA MOVEMENT / FNAF EFFECT
========================================================= */

let cameraTime=0;

let glitchTimer=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;

    cameraTime+=dt;

    const moving=
        keys.w||
        keys.a||
        keys.s||
        keys.d;


    /*
       Very subtle VHS/security-camera
       movement.
    */

    const amount=
        moving
            ?.0085
            :.002;

    camera.position.x=
        Math.sin(
            cameraTime*3.4
        )*
        amount;

    camera.position.y=
        EYE_HEIGHT+
        Math.sin(
            cameraTime*4.1
        )*
        amount;

    camera.position.z=
        Math.cos(
            cameraTime*3.1
        )*
        amount*.55;


    /*
       Security camera sway.
    */

    camera.rotation.z=
        Math.sin(
            cameraTime*.9
        )*.0025;


    /*
       Very occasional tiny tracking glitch.
    */

    glitchTimer-=dt;

    if(glitchTimer<=0){

        glitchTimer=
            1.5+
            Math.random()*5;

        if(
            Math.random()<.35
        ){

            const tracking=
                document.getElementById(
                    "tracking"
                );

            tracking.style.opacity=
                String(
                    .08+
                    Math.random()*.16
                );

            tracking.style.transform=
                `translateY(${
                    (
                        Math.random()-.5
                    )*80
                }px)`;

            setTimeout(()=>{

                tracking.style.opacity="0";

            },70+Math.random()*140);
        }
    }


    /*
       Rare camera bump.
    */

    if(
        Math.random()<.0025
    ){

        camera.position.x+=
            (
                Math.random()-.5
            )*.025;

        camera.position.y+=
            (
                Math.random()-.5
            )*.018;

        camera.rotation.z+=
            (
                Math.random()-.5
            )*.012;
    }
}


/* =========================================================
   EXIT
========================================================= */

function checkExit(){

    if(
        !exitObject||
        dead
    )
        return;

    const distance=
        Math.hypot(

            player.position.x-
            exitX,

            player.position.z-
            exitZ
        );

    if(distance<1.8)
        winGame();
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.2;
}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";
    }
}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason="THE BACKROOMS GOT YOU"
){

    if(
        dead||
        !running
    )
        return;

    dead=true;

    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU DIED";

    document.getElementById(
        "deathTitle"
    ).className="";

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "retryBtn"
    ).textContent="RETRY";

    document.getElementById(
        "death"
    ).style.display="flex";
}


/* =========================================================
   WIN
========================================================= */

function winGame(){

    if(
        dead||
        !running
    )
        return;

    dead=true;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU ESCAPED";

    document.getElementById(
        "deathTitle"
    ).className="win";

    document.getElementById(
        "deathText"
    ).textContent="YOU FOUND THE EXIT";

    document.getElementById(
        "retryBtn"
    ).textContent="PLAY AGAIN";

    document.getElementById(
        "death"
    ).style.display="flex";
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !running||
        dead||
        fallingIntoLevel
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
            ?"flex"
            :"none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        document.body.requestPointerLock();
    }
}


/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";
}


/* =========================================================
   START
========================================================= */

async function startGame(){

    if(
        !wallTexture||
        !floorTexture||
        !ceilingTexture
    )
        await loadTextures();

    clearWorld();

    player.position.set(
        -92,
        17,
        -70
    );

    yaw=.25;
    pitch=-.28;

    velocityY=0;
    grounded=false;

    createFloor();
    createCeiling();

    buildFloorPlan();

    createHoleRoom();

    createExit();

    buildLighting();

    await createEntity();

    entity.position.set(
        55,
        .775,
        -48
    );

    entityDirection.set(
        1,
        0
    );

    entityVelocity.set(
        0,
        0
    );

    lastSeen=99;

    running=true;
    paused=false;
    dead=false;

    fallingIntoLevel=true;

    fallTimer=0;
    recordingTime=0;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x=pitch;
    camera.rotation.z=0;

    player.rotation.y=yaw;

    showMessage(
        "ENTERING LEVEL 0..."
    );
}


/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(value){

    difficulty=value;

    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button=>
                button.classList.remove(
                    "selected"
                )
        );

    const id=
        value==="nightmare"
            ?"nightmareBtn"
            :value+"Btn";

    document.getElementById(
        id
    ).classList.add("selected");

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "easyBtn"
).onclick=
    ()=>setDifficulty("easy");

document.getElementById(
    "normalBtn"
).onclick=
    ()=>setDifficulty("normal");

document.getElementById(
    "hardBtn"
).onclick=
    ()=>setDifficulty("hard");

document.getElementById(
    "nightmareBtn"
).onclick=
    ()=>setDifficulty("nightmare");

document.getElementById(
    "startBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "resumeBtn"
).onclick=
    ()=>togglePause();

document.getElementById(
    "restartBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "menuBtn"
).onclick=
    ()=>returnToMenu();

document.getElementById(
    "retryBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "deathMenuBtn"
).onclick=
    ()=>returnToMenu();


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            running&&
            !paused&&
            !dead&&
            !fallingIntoLevel&&
            document.pointerLockElement!==
            document.body
        ){

            document.body.requestPointerLock();
        }
    }
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio||1,
                1.35
            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock=
    new THREE.Clock();

let recordingTime=0;

function updateTimer(dt){

    if(
        !running||
        paused
    )
        return;

    recordingTime+=dt;

    const total=
        Math.floor(
            recordingTime
        );

    const hours=
        Math.floor(
            total/3600
        );

    const minutes=
        Math.floor(
            (total%3600)/60
        );

    const seconds=
        total%60;

    const format=
        n=>
            String(n).padStart(
                2,
                "0"
            );

    document.getElementById(
        "tapeTime"
    ).textContent=
        `${format(hours)}:`+
        `${format(minutes)}:`+
        `${format(seconds)}`;
}


/* =========================================================
   LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running&&
        !paused&&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateLights(dt);

        updateCamera(dt);

        updateEntityAudio();

        updateMessage(dt);

        updateTimer(dt);

    }else{

        updateEntityAudio();
    }

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

loadTextures();

animate();

}

</script>

</body>
