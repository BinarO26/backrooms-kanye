<script src="./three.min.js"></script>

<script>
"use strict";

/* =========================================================
   THREE.JS CHECK
========================================================= */

if (!window.THREE) {

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "ERROR: THREE.JS COULD NOT BE LOADED.\n\n" +
        "This game expects:\n\n" +
        "./three.min.js\n\n" +
        "to be in the SAME folder as index.html.\n\n" +
        "Your GitHub Pages structure should be:\n" +
        "index.html\n" +
        "three.min.js\n" +
        "entity.png\n" +
        "entity.mp3\n" +
        "textures/";

    throw new Error(
        "Local Three.js missing"
    );
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

/*
   Darker environment.

   The actual environment is illuminated by
   the fluorescent lights instead of being
   permanently bright.
*/

scene.background =
    new THREE.Color(
        0x17170f
    );

scene.fog =
    new THREE.FogExp2(
        0x17170f,
        0.014
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        0.025,
        500
    );

camera.rotation.order =
    "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        powerPreference:
            "high-performance",

        logarithmicDepthBuffer:
            false
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.35
    )
);

if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}

/*
   We deliberately use a more realistic
   lighting pipeline for the environment.
*/

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    0.72;

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

/*
   Very low ambient illumination.

   This prevents the world from becoming
   completely invisible while still allowing
   dark areas to remain genuinely dark.
*/

const ambient =
    new THREE.AmbientLight(
        0xffedb0,
        0.055
    );

scene.add(
    ambient
);

const hemi =
    new THREE.HemisphereLight(
        0xffe89a,
        0x050504,
        0.08
    );

scene.add(
    hemi
);


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;


function prepareTexture(
    texture
) {

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate =
        true;

    return texture;
}


function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "Loaded texture:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            texture
                        )
                    );
                },

                undefined,

                error => {

                    console.warn(
                        "Texture failed:",
                        path,
                        error
                    );

                    resolve(
                        null
                    );
                }
            );
        }
    );
}


async function loadTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing = [];

    if (!wallTexture)
        missing.push(
            "./textures/wall.png"
        );

    if (!floorTexture)
        missing.push(
            "./textures/floor.png"
        );

    if (!ceilingTexture)
        missing.push(
            "./textures/ceiling.png"
        );

    if (
        missing.length
    ) {

        const error =
            document.getElementById(
                "error"
            );

        error.style.display =
            "block";

        error.textContent =
            "TEXTURE ERROR\n\n" +
            "These environment textures could not be loaded:\n\n" +
            missing.join("\n") +
            "\n\n" +
            "Make sure the files are in /textures/\n" +
            "and use these exact lowercase names.";
    }
}


/* =========================================================
   TEXTURE MATERIALS
========================================================= */

/*
   ENVIRONMENT TEXTURES ARE SHADED.

   This is intentionally different from entity.png.

   entity.png remains MeshBasicMaterial later.
*/

function createEnvironmentMaterial(
    texture,
    repeatX,
    repeatY
) {

    if (!texture) {

        return new THREE.MeshStandardMaterial({

            color:
                0x766f39,

            roughness:
                0.92,

            metalness:
                0
        });
    }

    const tex =
        texture.clone();

    tex.wrapS =
        THREE.RepeatWrapping;

    tex.wrapT =
        THREE.RepeatWrapping;

    tex.repeat.set(
        repeatX,
        repeatY
    );

    tex.needsUpdate =
        true;

    return new THREE.MeshStandardMaterial({

        map:
            tex,

        color:
            0xffffff,

        roughness:
            0.92,

        metalness:
            0,

        side:
            THREE.DoubleSide
    });
}


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(
    player
);

player.add(
    camera
);

const EYE_HEIGHT =
    1.18;

const PLAYER_HEIGHT =
    1.55;

const PLAYER_RADIUS =
    0.28;

let yaw = 0;
let pitch = 0;

let velocityY = 0;

let grounded = false;

let running = false;
let paused = false;
let dead = false;

let fallingIntoLevel =
    false;

let fallTimer = 0;

const FALL_DURATION =
    2.25;

let difficulty =
    "normal";


/* =========================================================
   WORLD ARRAYS
========================================================= */

let worldObjects = [];
let wallColliders = [];
let deathHoles = [];
let lights = [];

let exitObject = null;
let exitLight = null;
let entity = null;


/* =========================================================
   WORLD MANAGEMENT
========================================================= */

function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}


function disposeMaterial(
    material
) {

    if (!material)
        return;

    if (
        Array.isArray(material)
    ) {

        material.forEach(
            disposeMaterial
        );

        return;
    }

    if (
        material.map
    ) {

        material.map.dispose();
    }

    material.dispose();
}


function clearWorld() {

    for (
        const object
        of worldObjects
    ) {

        scene.remove(
            object
        );

        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();
                }

                if (
                    child.material
                ) {

                    disposeMaterial(
                        child.material
                    );
                }
            }
        );
    }

    worldObjects = [];

    wallColliders = [];

    deathHoles = [];

    lights = [];

    if (
        exitLight
    ) {

        scene.remove(
            exitLight
        );

        exitLight =
            null;
    }

    exitObject =
        null;

    entity =
        null;
}


/* =========================================================
   WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = 0.32
) {

    const height =
        3.1;

    /*
       The collider includes the complete
       physical wall volume.
    */

    wallColliders.push({

        minX:
            x - width / 2,

        maxX:
            x + width / 2,

        minZ:
            z - depth / 2,

        maxZ:
            z + depth / 2,

        minY:
            0,

        maxY:
            height
    });


    /*
       IMPORTANT FIX:

       Instead of four PlaneGeometry
       objects with potentially confusing
       orientation, the wall is now a real
       BoxGeometry.

       The PNG is repeated across the box.
    */

    const repeatX =
        Math.max(
            width / 3.2,
            0.15
        );

    const repeatY =
        Math.max(
            height / 3.1,
            0.5
        );

    const material =
        createEnvironmentMaterial(
            wallTexture,
            repeatX,
            repeatY
        );


    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material
        );


    wall.position.set(
        x,
        height / 2,
        z
    );


    wall.castShadow =
        true;

    wall.receiveShadow =
        true;


    addWorldObject(
        wall
    );
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    const material =
        createEnvironmentMaterial(
            floorTexture,
            110,
            100
        );


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                270
            ),

            material
        );


    floor.rotation.x =
        -Math.PI / 2;

    floor.position.y =
        0;


    floor.receiveShadow =
        true;


    addWorldObject(
        floor
    );
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling() {

    const material =
        createEnvironmentMaterial(
            ceilingTexture,
            110,
            100
        );


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                270
            ),

            material
        );


    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y =
        3.1;


    ceiling.receiveShadow =
        true;


    addWorldObject(
        ceiling
    );
}


/* =========================================================

/* =========================================================
   HOLE ROOM
========================================================= */

function createHoleRoom() {

    const startX =
        -57;

    const startZ =
        53;

    const columns =
        18;

    const rows =
        8;

    const spacing =
        3.5;


    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            const px =
                startX +
                x * spacing;

            const pz =
                startZ +
                z * spacing;


            if (
                (x + z) % 5 === 0
            ) {

                continue;
            }


            const hole =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.7,
                        2.7
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x000000,

                        side:
                            THREE.DoubleSide
                    })
                );


            hole.rotation.x =
                -Math.PI / 2;

            hole.position.set(
                px,
                0.006,
                pz
            );


            addWorldObject(
                hole
            );


            deathHoles.push({

                x:
                    px,

                z:
                    pz,

                radius:
                    1.28
            });
        }
    }
}

function addLight(
    x,
    z,
    intensity = 3.5,
    flicker = false
) {

    /*
       The fixture is ALWAYS visible.

       Flickering only changes the intensity
       of the actual light.

       This prevents the fluorescent panel
       from disappearing.
    */

    const fixtureMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0xfff2bf,

            emissive:
                0xffe9a0,

            emissiveIntensity:
                2.2,

            roughness:
                .35,

            metalness:
                0
        });


    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.15,
                .055,
                1.15
            ),

            fixtureMaterial
        );


    fixture.position.set(
        x,
        3.045,
        z
    );


    fixture.castShadow =
        false;

    fixture.receiveShadow =
        false;


    addWorldObject(
        fixture
    );


    const light =
        new THREE.PointLight(

            0xffe6a0,

            intensity,

            15,

            1.65
        );


    light.position.set(
        x,
        2.62,

    light.castShadow =
        true;

    light.shadow.mapSize.width =

    light.shadow.mapSize.height =

    light.shadow.camera.near =

    lights.push({

        light:

        fixture:
            fixture,

        flicker:
            flicker,

        timer:
            Math.random() * 2,

        base:
            intensity,

        current:
            intensity
    });
}


function buildLighting() {

    const positions = [];


    /*
       Regular fluorescent grid.

       The irregular walls make the lighting
       feel like a real office instead of
       a perfectly uniform grid.
    */

    for (
        let x = -105;
        x <= 105;
        x += 10
    ) {

        for (
            let z = -95;
            z <= 95;
            z += 10
        ) {

            if (
                Math.random() < .12
            ) {

                continue;
            }


            positions.push([

                x +
                (Math.random() - .5) * 2,

                z +
                (Math.random() - .5) * 2
            ]);
        }
    }


    positions.forEach(
        position => {

            const roll =
                Math.random();

            addLight(

                position[0],

                position[1],

                roll < .22
                    ? 1.8
                    : 3.2 +
                      Math.random() * 1.6,

                roll < .18
            );
        }
    );


    /*
       Important landmarks.
    */

    addLight(
        -18,
        -64,
        5.1
    );

    addLight(

function updateLights(
    dt
) {

    for (
        const item
        of lights
    ) {

        if (
            !item.flicker
        ) {

            continue;
        }


        item.timer -=
            dt;


        if (
            item.timer <= 0
        ) {

            item.timer =
                .08 +
                Math.random() *
                .7;


            /*
               NEVER hide the fixture.

               Instead, rapidly reduce its
               brightness.
            */

            if (
                Math.random() < .22
            ) {

                item.current =
                    item.base *
                    .04;

            } else {

                item.current =
                    item.base *
                    (
                        .42 +
                        Math.random() *
                        .55
                    );
            }


            item.light.intensity =
                item.current;


            if (
                item.fixture.material
            ) {

                item.fixture.material
                    .emissiveIntensity =
                        Math.max(
                            .25,
                            item.current *
                            .55
                        );
            }
        }
    }
}


/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;


    for (
        const wall
        of wallColliders
    ) {

        if (
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {

            continue;
        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }


    return false;
}


function entityHitsWall(
    x,
    z
) {

    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            .43 * .43
        ) {

            return true;
        }
    }


    return false;
}


function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 - x1;

    const dz =
        z2 - z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance / .35
        );


    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i / steps;


        if (
            entityHitsWall(

                x1 +
                dx * t,

                z1 +
                dz * t
            )
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   HOLES
========================================================= */

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;

        const dz =
            player.position.z -
            hole.z;


        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;
        }
    }


    return false;
}

        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    const settings =
        SETTINGS[
            difficulty
        ];


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    lastSeen +=
        dt;


    const visible =
        distance <
        settings.detection &&
        !blocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z
        );


    let dx2 = 0;
    let dz2 = 0;


    if (
        visible
    ) {

        lastKnown.set(

            player.position.x,
            player.position.z
        );


        lastSeen =
            0;


        dx2 =
            dx /
            Math.max(
                distance,
                .001
            );


        dz2 =
            dz /
            Math.max(
                distance,
                .001
            );

    } else if (
        lastSeen < 3.2
    ) {

        const lx =
            lastKnown.x -
            entity.position.x;


        const lz =
            lastKnown.y -
            entity.position.z;


        const len =
            Math.hypot(
                lx,
                lz
            );


        if (
            len > .1
        ) {

            dx2 =
                lx / len;

            dz2 =
                lz / len;
        }

    } else {

        wanderTimer -=
            dt;


        if (
            wanderTimer <= 0
        ) {

            wanderTimer =
                .5 +
                Math.random() *
                1.8;


            wanderAngle =
                Math.random() *
                Math.PI *
                2;
        }


        dx2 =
            Math.cos(
                wanderAngle
            );


        dz2 =
            Math.sin(
                wanderAngle
            );
    }


    /*
       Smooth steering.
    */

    const targetAngle =
        Math.atan2(
            dz2,
            dx2
        );


    const currentAngle =
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );


    let difference =
        targetAngle -
        currentAngle;


    while (
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }


    while (
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }


    difference =
        Math.max(

            -3.4 * dt,

            Math.min(
                3.4 * dt,
                difference
            )
        );


    const angle =
        currentAngle +
        difference;


    entityDirection.x =
        Math.cos(
            angle
        );


    entityDirection.y =
        Math.sin(
            angle
        );


    entityVelocity.x =
        THREE.MathUtils.lerp(

            entityVelocity.x,

            entityDirection.x *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );


    entityVelocity.y =
        THREE.MathUtils.lerp(

            entityVelocity.y,

            entityDirection.y *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );


    /*
       JUKING / WALL AVOIDANCE

       The entity tries its intended direction,
       then side directions if blocked.
    */

    const moveX =
        entityVelocity.x *
        dt;


    const moveZ =
        entityVelocity.y *
        dt;


    const nextX =
        entity.position.x +
        moveX;


    const nextZ =
        entity.position.z +
        moveZ;


    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        /*
           Juke around obstacle.
        */

        const sideAngle =
            angle +
            (
                Math.random() < .5
                    ? Math.PI / 2
                    : -Math.PI / 2
            );


        entityDirection.set(

            Math.cos(
                sideAngle
            ),

            Math.sin(
                sideAngle
            )
        );


        entityVelocity.x =
            entityDirection.x *
            settings.speed *
            .65;


        entityVelocity.y =
            entityDirection.y *
            settings.speed *
            .65;
    }


    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        const sideAngle =
            angle +
            (
                Math.random() < .5
                    ? Math.PI / 2
                    : -Math.PI / 2
            );


        entityDirection.set(

            Math.cos(
                sideAngle
            ),

            Math.sin(
                sideAngle
            )
        );


        entityVelocity.x =
            entityDirection.x *
            settings.speed *
            .65;


        entityVelocity.y =
            entityDirection.y *
            settings.speed *
            .65;
    }


    /*
       Entity faces player.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );


    const killDistance =
        difficulty === "nightmare"
            ? 1.55
            : 1.25;


    if (
        distance <
        killDistance
    ) {

        killPlayer();
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;
    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z
        );


    const maxDistance =
        34;


    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;
    }


    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.6
        ) *
        .9;


    if (
        blocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z
        )
    ) {

        volume *=
            .2;
    }


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );


    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   PLAYER INPUT
========================================================= */

const keys = {

    w:
        false,

    a:
        false,

    s:
        false,

    d:
        false,

    shift:
        false
};


let jumpPressed =
    false;


addEventListener(
    "keydown",
    event => {

        /*
           IMPORTANT:

           W = FORWARD
           S = BACKWARD

           This is deliberately kept
           independent of the starting yaw.
        */

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                true;

            event.preventDefault();
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                true;

            event.preventDefault();
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                true;

            event.preventDefault();
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                true;

            event.preventDefault();
        }


        if (
            event.code ===
                "ShiftLeft" ||
            event.code ===
                "ShiftRight"
        ) {

            keys.shift =
                true;
        }


        if (
            event.code ===
            "Space" &&
            !event.repeat
        ) {

            jumpPressed =
                true;
        }


        if (
            event.code ===
                "Escape" &&
            running &&
            !dead &&
            !fallingIntoLevel
        ) {

            togglePause();
        }
    }
);


addEventListener(
    "keyup",
    event => {

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                false;
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                false;
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                false;
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                false;
        }


        if (
            event.code ===
                "ShiftLeft" ||
            event.code ===
                "ShiftRight"
        ) {

            keys.shift =
                false;
        }
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ) {

            return;
        }


        if (
            document.pointerLockElement !==
            document.body
        ) {

            return;
        }


        yaw -=
            event.movementX *
            .0022;


        pitch -=
            event.movementY *
            .0018;


        pitch =
            Math.max(

                -1.45,

                Math.min(
                    1.45,
                    pitch
                )
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;
    }
);


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;
    }


    /*
       W = +1 FORWARD
       S = -1 BACKWARD

       This fixes the previous reversed
       movement problem.
    */

    let forward =
        0;

    let side =
        0;


    if (
        keys.w
    ) {

        forward +=
            1;
    }


    if (
        keys.s
    ) {

        forward -=
            1;
    }


    if (
        keys.d
    ) {

        side +=
            1;
    }


    if (
        keys.a
    ) {

        side -=
            1;
    }


    const length =
        Math.hypot(
            forward,
            side
        );


    if (
        length > 0
    ) {

        forward /=
            length;

        side /=
            length;
    }


    /*
       No sprint cooldown.
    */

    let speed =
        keys.shift
            ? 5.9
            : 3.5;


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.1
                : 3.8;
    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.3
                : 3.4;
    }


    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.5
                : 3.25;
    }


    /*
       Camera forward vector.

       In Three.js, with the player's yaw:
       
       +sin(yaw) = forward X
       -cos(yaw) = forward Z
    */

    const sin =
        Math.sin(
            yaw
        );

    const cos =
        Math.cos(
            yaw
        );


    const dx =
        (
            side * cos +
            forward * sin
        ) *
        speed *
        dt;


    const dz =
        (
            -side * sin +
            forward * cos
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        dx;


    const nextZ =
        player.position.z +
        dz;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;
    }


    jumpPressed =
        false;


    velocityY -=
        20 * dt;


    player.position.y +=
        velocityY * dt;


    if (
        player.position.y <=
        0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;
    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }


    checkExit();
}


/* =========================================================
   FALLING INTRO
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;


    const progress =
        Math.min(

            fallTimer /
            FALL_DURATION,

            1
        );


    const eased =
        1 -
        Math.pow(
            1 - progress,
            3
        );


    player.position.y =
        17 -
        17 * eased;


    camera.position.y =
        EYE_HEIGHT;


    camera.rotation.x =
        THREE.MathUtils.lerp(

            -.32,

            0,

            Math.min(
                progress * 1.3,
                1
            )
        );


    camera.rotation.z =
        Math.sin(

            progress *
            Math.PI *
            9

        ) *
        .025;


    if (
        progress >=
        1
    ) {

        fallingIntoLevel =
            false;


        player.position.y =
            0;


        camera.position.x =
            0;

        camera.position.y =
            EYE_HEIGHT;

        camera.position.z =
            0;


        camera.rotation.x =
            0;

        camera.rotation.z =
            0;


        document.body
            .requestPointerLock()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   CAMERA MOTION
========================================================= */

let cameraTime =
    0;

let securityTime =
    0;


function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;
    }


    cameraTime +=
        dt;

    securityTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    /*
       Stronger handheld/security-camera
       movement.
    */

    const amount =
        moving
            ? .014
            : .004;


    camera.position.x =
        Math.sin(
            cameraTime * 3.4
        ) *
        amount;


    camera.position.y =
        EYE_HEIGHT +

        Math.sin(
            cameraTime * 4.1
        ) *
        amount;


    camera.position.z =
        Math.cos(
            cameraTime * 3.1
        ) *
        amount *
        .65;


    camera.rotation.z =
        Math.sin(
            cameraTime * .9
        ) *
        .005;


    /*
       Random tiny analog-camera instability.
    */

    if (
        Math.random() <
        .006
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) *
            .045;


        camera.position.y +=
            (
                Math.random() -
                .5
            ) *
            .035;


        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) *
            .035;
    }


    /*
       Security camera tracking line.
    */

    const trackingBar =
        document.getElementById(
            "trackingBar"
        );


    if (
        Math.random() <
        .012
    ) {

        trackingBar.style.opacity =
            ".8";

        trackingBar.style.top =
            (
                Math.random() *
                100
            ) +
            "%";


        setTimeout(
            () => {

                trackingBar.style.opacity =
                    "0";

            },
            70 +
            Math.random() *
            160
        );
    }


    /*
       Occasional static flash.
    */

    const flash =
        document.getElementById(
            "staticFlash"
        );


    if (
        Math.random() <
        .0018
    ) {

        flash.style.opacity =
            String(
                .08 +
                Math.random() *
                .14
            );


        setTimeout(
            () => {

                flash.style.opacity =
                    "0";

            },
            30 +
            Math.random() *
            80
        );
    }
}


/* =========================================================
   EXIT CHECK
========================================================= */

function checkExit() {

    if (
        !exitObject ||
        dead
    ) {

        return;
    }


    const distance =
        Math.hypot(

            player.position.x -
            exitX,

            player.position.z -
            exitZ
        );


    if (
        distance <
        1.8
    ) {

        winGame();
    }
}

   MESSAGE
========================================================= */

let messageTimer =
    0;


function showMessage(
    text
) {

    document.getElementById(
        "message"
    ).textContent =
        text;


    messageTimer =
        2.2;
}


function updateMessage(
    dt
) {

    if (
        messageTimer <=
        0
    ) {

        return;
    }


    messageTimer -=
        dt;


    if (
        messageTimer <=
        0
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "";
    }
}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason =
        "THE BACKROOMS GOT YOU"
) {

    if (
        dead ||
        !running
    ) {

        return;
    }


    dead =
        true;


    fallingIntoLevel =
        false;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU DIED";


    document.getElementById(
        "deathTitle"
    ).className =
        "";


    document.getElementById(
        "deathText"
    ).textContent =
        reason;


    document.getElementById(
        "retryBtn"
    ).textContent =
        "RETRY";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}

   WIN
========================================================= */

function winGame() {

    if (
        dead ||
        !running
    ) {

        return;

    dead =
        true;


    entityAudio.pause();

    entityAudio.volume =

/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    paused =
        !paused;


    document.getElementById(
        "pause"
    ).style.display =
        paused
            ? "flex"
            : "none";


    if (
        paused
    ) {

        if (
            document.pointerLockElement
        ) {

            document.exitPointerLock();
        }

    } else {

        document.body
            .requestPointerLock()
            .catch(
                () => {}
            );
    }
}

/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    /*
       Load textures before creating the
       environment.
    */

    if (
        !wallTexture ||
        !floorTexture ||
        !ceilingTexture
    ) {

        await loadTextures();
    }


    clearWorld();


    /*
       Spawn position.
    */

    player.position.set(

        -92,

        17,

        -70
    );


    /*
       Start looking down the map without
       changing W/S semantics.
    */

    yaw =
        0;

    pitch =
        -.28;


    velocityY =
        0;

    grounded =
        false;


    /*
       Build complete world.
    */

    createFloor();

    createCeiling();

    buildOuterWalls();

    buildFloorPlan();

    createHoleRoom();

    createExit();

    buildLighting();

    await createEntity();


    /*
       Entity starts far away.
    */

    entity.position.set(

        55,

        .775,

        -48
    );


    entityDirection.set(
        1,
        0
    );


    entityVelocity.set(
        0,
        0
    );


    lastSeen =
        99;


    running =
        true;

    paused =
        false;

    dead =
        false;

    fallingIntoLevel =
        true;


    fallTimer =
        0;


    recordingTime =
        0;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    camera.position.set(

        0,

        EYE_HEIGHT,

        0
    );


    camera.rotation.x =
        pitch;


    camera.rotation.y =
        0;


    camera.rotation.z =
        0;


    player.rotation.y =
        yaw;


    showMessage(
        "ENTERING LEVEL 0..."
    );
}

function cycleMenuImage() {

    if (
        menuImages.length ===
        0
    ) {

        return;
    }


    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );


    menuIndex =
        (
            menuIndex +
            1
        ) %
        menuImages.length;


    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}


setInterval(
    cycleMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );


        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio ||
                1,

                1.35
            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock =
    new THREE.Clock();


let recordingTime =
    0;


function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;
    }


    recordingTime +=
        dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total /
            3600
        );


    const minutes =
        Math.floor(

            (
                total %
                3600
            ) /
            60
        );


    const seconds =
        total %
        60;


    const format =
        n =>
            String(n)
                .padStart(
                    2,
                    "0"
                );


    document.getElementById(
        "tapeTime"
    ).textContent =

        `${format(hours)}:` +
        `${format(minutes)}:` +
        `${format(seconds)}`;
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(

            clock.getDelta(),

            .05
        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        updateLights(
            dt
        );


        updateCamera(
            dt
        );


        updateEntityAudio();


        updateMessage(
            dt
        );


        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIAL LOAD
========================================================= */

/*
   Begin loading the three environment PNGs
   immediately.

   The menu can still appear while they load.
*/

loadTextures();


/*
   Start rendering immediately.
*/

animate();

</script>

</body>
</html>
