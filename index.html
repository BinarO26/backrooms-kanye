<script type="module">

import * as THREE from "./three.module.js";

/* =========================================================
   BASIC SETTINGS
========================================================= */

const TILE = 3;
const WALL_HEIGHT = 9;

const PLAYER_RADIUS = .38;

const EYE_HEIGHT = 5.25;
const CROUCH_HEIGHT = 3.25;

/*
    MUCH faster movement.
*/

const WALK_SPEED = 8.0;
const SPRINT_SPEED = 14.5;
const AIR_SPRINT_SPEED = 16.0;

const JUMP_SPEED = 8.0;
const GRAVITY = 22;

/*
    Entity does NOT exist immediately.
*/

const ENTITY_DELAY = 30;

/* =========================================================
   STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

let gameTime = 0;
let entitySpawnTimer = 0;

let entityActive = false;

/* =========================================================
   THREE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x39372a);

scene.fog =
    new THREE.FogExp2(
        0x39372a,
        .010
    );

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .05,
        250
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio || 1,
        1
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    .72;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   TEXTURES
========================================================= */

const loader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;

function configureTexture(
    texture
){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(path){

    return new Promise(
        (resolve,reject)=>{

            loader.load(

                path,

                texture=>{
                    console.log(
                        "LOADED:",
                        path
                    );

                    resolve(
                        configureTexture(
                            texture
                        )
                    );
                },

                undefined,

                error=>{
                    console.error(
                        "FAILED:",
                        path,
                        error
                    );

                    reject(
                        new Error(
                            "Could not load " +
                            path
                        )
                    );
                }

            );

        }
    );
}

/* =========================================================
   MATERIALS
========================================================= */

/*
    IMPORTANT:

    These are deliberately created with visible fallback
    colors first. That means the map can NEVER become
    completely invisible just because a PNG failed.
*/

const wallMaterial =
    new THREE.MeshStandardMaterial({
        color:0xc5b85d,
        roughness:.88,
        metalness:0,
        side:THREE.DoubleSide
    });

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color:0x57533c,
        roughness:.95,
        metalness:0,
        side:THREE.DoubleSide
    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({
        color:0x8d875f,
        roughness:.95,
        metalness:0,
        side:THREE.DoubleSide
    });

async function loadWorldTextures(){

    try{
        wallTexture =
            await loadTexture(
                "./textures/wall.png"
            );

        wallTexture.repeat.set(
            1,
            1
        );

        wallMaterial.map =
            wallTexture;

        wallMaterial.needsUpdate=true;

    }catch(error){

        console.warn(
            "WALL TEXTURE FALLBACK"
        );

    }

    try{
        floorTexture =
            await loadTexture(
                "./textures/floor.png"
            );

        floorTexture.repeat.set(
            1,
            1
        );

        floorMaterial.map =
            floorTexture;

        floorMaterial.needsUpdate=true;

    }catch(error){

        console.warn(
            "FLOOR TEXTURE FALLBACK"
        );

    }

    try{
        ceilingTexture =
            await loadTexture(
                "./textures/ceiling.png"
            );

        ceilingTexture.repeat.set(
            1,
            1
        );

        ceilingMaterial.map =
            ceilingTexture;

        ceilingMaterial.needsUpdate=true;

    }catch(error){

        console.warn(
            "CEILING TEXTURE FALLBACK"
        );

    }

}

/* =========================================================
   MAP
========================================================= */

let mapWidth=0;
let mapHeight=0;
let mapData=[];

let playerSpawn=null;
let entitySpawn=null;

const wallColliders=[];
const holeCells=[];
const hideCells=[];
const walkableCells=[];

/* =========================================================
   MAP CLASSIFICATION
========================================================= */

function classifyPixel(r,g,b,a){

    if(a<10)
        return "floor";

    /*
        BLACK / VERY DARK = WALL
    */

    if(
        r<65 &&
        g<65 &&
        b<65
    )
        return "wall";

    /*
        RED = PLAYER
    */

    if(
        r>150 &&
        r>g*1.4 &&
        r>b*1.4
    )
        return "spawn";

    /*
        BLUE = ENTITY
    */

    if(
        b>125 &&
        b>r*1.3 &&
        b>g*1.15
    )
        return "entity";

    /*
        PURPLE = LOCKER
    */

    if(
        r>100 &&
        b>100 &&
        g<120
    )
        return "hide";

    /*
        YELLOW = HOLE
    */

    if(
        r>130 &&
        g>100 &&
        b<130
    )
        return "hole";

    return "floor";
}

/* =========================================================
   COORDINATES
========================================================= */

function cellToWorld(x,y){

    return {

        x:
            (x+.5)*TILE -
            mapWidth*TILE*.5,

        z:
            (y+.5)*TILE -
            mapHeight*TILE*.5

    };
}

function worldToCell(x,z){

    return {

        x:
            Math.floor(
                (
                    x+
                    mapWidth*TILE*.5
                )/TILE
            ),

        y:
            Math.floor(
                (
                    z+
                    mapHeight*TILE*.5
                )/TILE
            )

    };
}

function insideMap(x,y){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );
}

function isHole(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]==="hole"
    );
}

function isWalkable(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]!=="wall"
    );
}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image =
        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();

                img.onload =
                    ()=>resolve(img);

                img.onerror =
                    ()=>reject(
                        new Error(
                            "textures/map1.png could not load."
                        )
                    );

                img.src =
                    "./textures/map1.png";
            }
        );

    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;

    const canvas =
        document.createElement("canvas");

    canvas.width=mapWidth;
    canvas.height=mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row=[];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i =
                (y*mapWidth+x)*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(type!=="wall")
                walkableCells.push({x,y});

            if(type==="hole")
                holeCells.push({x,y});

            if(type==="hide")
                hideCells.push({x,y});

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn =
                    cellToWorld(
                        x,
                        y
                    );
            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn =
                    cellToWorld(
                        x,
                        y
                    );
            }
        }

        mapData.push(row);
    }

    /*
        Guaranteed player spawn.
    */

    if(!playerSpawn){

        const center =
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        if(!center)
            throw new Error(
                "MAP HAS NO WALKABLE CELLS."
            );

        playerSpawn =
            cellToWorld(
                center.x,
                center.y
            );
    }

    /*
        Guaranteed entity spawn.
    */

    if(!entitySpawn){

        let best=null;
        let bestDistance=-1;

        const pc =
            worldToCell(
                playerSpawn.x,
                playerSpawn.z
            );

        for(
            const c of walkableCells
        ){

            const d =
                Math.hypot(
                    c.x-pc.x,
                    c.y-pc.y
                );

            if(d>bestDistance){

                bestDistance=d;
                best=c;

            }
        }

        if(best){

            entitySpawn =
                cellToWorld(
                    best.x,
                    best.y
                );
        }
    }

    console.log(
        "MAP SIZE:",
        mapWidth,
        mapHeight
    );

    console.log(
        "HOLES:",
        holeCells.length
    );

    console.log(
        "LOCKERS:",
        hideCells.length
    );
}

/* =========================================================
   COLLISION
========================================================= */

function addCollider(x,z){

    wallColliders.push({

        minX:x-TILE*.5,
        maxX:x+TILE*.5,

        minZ:z-TILE*.5,
        maxZ:z+TILE*.5

    });
}

function collides(
    x,
    z,
    radius=.38
){

    for(
        const w of wallColliders
    ){

        if(
            x+radius>w.minX &&
            x-radius<w.maxX &&
            z+radius>w.minZ &&
            z-radius<w.maxZ
        )
            return true;
    }

    return false;
}

/* =========================================================
   FLOOR
========================================================= */

function addFloor(x,z){

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            floorMaterial
        );

    mesh.rotation.x =
        -Math.PI*.5;

    mesh.position.set(
        x,
        0,
        z
    );

    mesh.frustumCulled=true;

    world.add(mesh);
}

/* =========================================================
   CEILING
========================================================= */

function addCeiling(x,z){

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            ceilingMaterial
        );

    mesh.rotation.x =
        Math.PI*.5;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    mesh.frustumCulled=true;

    world.add(mesh);
}

/* =========================================================
   WALL
========================================================= */

function addWall(x,z){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),
            wallMaterial
        );

    mesh.position.set(
        x,
        WALL_HEIGHT*.5,
        z
    );

    world.add(mesh);

    addCollider(
        x,
        z
    );
}

/* =========================================================
   3D HOLES
========================================================= */

const holeMaterial =
    new THREE.MeshStandardMaterial({
        color:0x14120d,
        roughness:1,
        metalness:0,
        side:THREE.DoubleSide
    });

const holeBottomMaterial =
    new THREE.MeshStandardMaterial({
        color:0x020201,
        roughness:1,
        metalness:0
    });

function addHole(x,y){

    const p =
        cellToWorld(
            x,
            y
        );

    /*
        No floor plane is created here.

        This is a REAL recessed opening.
    */

    const bottom =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE*.9,
                .12,
                TILE*.9

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                mapData[y][x];

            const p =
                cellToWorld(
                    x,
                    y
                );

            if(type==="wall"){

                addWall(
                    p.x,
                    p.z
                );

                continue;
            }

            /*
                Don't create a floor inside a hole.
            */

            if(type!=="hole"){

                addFloor(
                    p.x,
                    p.z
                );
            }

            /*
                Ceiling ALWAYS exists.
            */

            addCeiling(
                p.x,
                p.z
            );
        }
    }

    /*
        Actual recessed holes.
    */

    for(
        const h of holeCells
    ){

        addHole(
            h.x,
            h.y
        );
    }

    /*
        Visible lockers.
    */

    for(
        const h of hideCells
    ){

        const p =
            cellToWorld(
                h.x,
                h.y
            );

        addLocker(
            p.x,
            p.z
        );
    }
}

/* =========================================================
   MOVEMENT

function movePlayer(dx,dz){

    const nx =
        player.position.x+dx;

    const nz =
        player.position.z+dz;

    if(
        !collides(
            nx,
            player.position.z
        )
    ){

        player.position.x=nx;
    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){

        player.position.z=nz;
    }
}

/* =========================================================
   HOLE DETECTION
========================================================= */

function fullyOverHole(){

    const r =
        PLAYER_RADIUS;

    const points=[

        [0,0],

        [r,0],
        [-r,0],

        [0,r],
        [0,-r],

        [r*.7,r*.7],
        [-r*.7,r*.7],

        [r*.7,-r*.7],
        [-r*.7,-r*.7]

    ];

    /*
        EVERY point must be inside a hole.

        Therefore you can jump over one.
    */

    for(
        const p of points
    ){

        const cell =
            worldToCell(
                player.position.x+p[0],
                player.position.z+p[1]
            );

        if(
            !isHole(
                cell.x,
                cell.y
            )
        )
            return false;
    }

    return true;
}

function checkHole(){

    if(
        grounded &&
        !falling &&
        fullyOverHole()
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );
    }
}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest=null;
    let distance=Infinity;

    for(
        const locker of lockers
    ){

        const d =
            Math.hypot(
                player.position.x-locker.x,
                player.position.z-locker.z
            );

        if(d<distance){

            distance=d;
            closest=locker;
        }
    }

    const near =
        closest &&
        distance<1.8;

    hidden =
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near&&!hidden
        ?"1"
        :"0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ?"1"
        :"0";
}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const p =
            Math.min(
                fallTimer/1.35,
                1
            );

        player.position.y =
            -p*5;

        camera.position.y =
            EYE_HEIGHT-p*1.5;

        camera.rotation.z =
            Math.sin(
                fallTimer*20
            )*.04;

        if(
            fallTimer>=1.35
        ){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );
        }

        return;
    }

    crouching =
        !!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w)
        forward++;

    if(keys.s)
        forward--;

    if(keys.d)
        strafe++;

    if(keys.a)
        strafe--;

    const len =
        Math.hypot(
            forward,
            strafe
        );

    if(len>0){

        forward/=len;
        strafe/=len;

        const sprint =
            !!(
                keys.shift &&
                !crouching
            );

        let speed =
            sprint
            ? SPRINT_SPEED
            : WALK_SPEED;

        if(
            sprint &&
            !grounded
        ){

            speed=
                AIR_SPRINT_SPEED;
        }

        if(crouching)
            speed*=.55;

        const sin=
            Math.sin(yaw);

        const cos=
            Math.cos(yaw);

        const dx =
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz =
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );
    }

    velocityY -=
        GRAVITY*dt;

    player.position.y +=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;
    }

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;

        keys.spacePressed=false;
    }

    const targetHeight =
        crouching
        ?CROUCH_HEIGHT
        :EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();
    checkHole();
}

/* =========================================================
   SIMPLE PATHFINDING
========================================================= */

function findPath(start,goal){

    if(
        !isWalkable(
            goal.x,
            goal.y
        )
    ){

        let closest=null;
        let best=Infinity;

        for(
            const c of walkableCells
        ){

            const d=
                Math.abs(
                    c.x-goal.x
                )+
                Math.abs(
                    c.y-goal.y
                );

            if(d<best){

                best=d;
                closest=c;
            }
        }

        if(!closest)
            return [];

        goal=closest;
    }

    const queue=[start];

    const parents=
        new Map();

    const visited=
        new Set();

    function key(p){
        return p.x+","+p.y;
    }

    visited.add(
        key(start)
    );

    const directions=[

        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}

    ];

    let count=0;

    while(
        queue.length &&
        count<8000
    ){

        count++;

        const current=
            queue.shift();

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            const result=[];

            let p=current;

            while(p){

                result.push(p);

                p=
                    parents.get(
                        key(p)
                    );
            }

            result.reverse();

            return result;
        }

        for(
            const d of directions
        ){

            const next={
                x:current.x+d.x,
                y:current.y+d.y
            };

            const k=
                key(next);

            if(
                visited.has(k)
            )
                continue;

            if(
                !isWalkable(
                    next.x,
                    next.y
                )
            )
                continue;

            visited.add(k);

            parents.set(
                k,
                current
            );

            queue.push(next);
        }
    }

    return [];
}

/* =========================================================
   ENTITY AI
========================================================= */

let entityPath=[];
let entityPathIndex=0;
let repathTimer=0;

function updateEntity(dt){

    if(
        !entityActive ||
        !entity ||
        !gameStarted ||
        paused ||
        dead
    )
        return;

    repathTimer-=dt;

    if(
        repathTimer<=0
    ){

        repathTimer=
            difficulty==="nightmare"
            ?.15
            :.28;

        const start=
            worldToCell(
                entity.position.x,
                entity.position.z
            );

        const goal=
            worldToCell(
                player.position.x,
                player.position.z
            );

        entityPath=
            findPath(
                start,
                goal
            );

        entityPathIndex=1;
    }

    if(
        entityPath.length>1
    ){

        const targetCell=
            entityPath[
                Math.min(
                    entityPathIndex,
                    entityPath.length-1
                )
            ];

        const target=
            cellToWorld(
                targetCell.x,
                targetCell.y
            );

        let dx=
            target.x-
            entity.position.x;

        let dz=
            target.z-
            entity.position.z;

        const distance=
            Math.hypot(
                dx,
                dz
            );

        if(distance<.2){

            entityPathIndex++;

        }else{

            dx/=distance;
            dz/=distance;

            const speed=
                getEntitySpeed();

            const nx=
                entity.position.x+
                dx*speed*dt;

            const nz=
                entity.position.z+
                dz*speed*dt;

            if(
                !collides(
                    nx,
                    nz,
                    .35
                )
            ){

                entity.position.x=nx;
                entity.position.z=nz;
            }
        }
    }

    /*
        Always face camera.
    */

    entity.rotation.y=
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    const distance=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    if(
        distance<1.15 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );
    }
}

const entityAudio=
    new Audio(
        "./sounds/entity.mp3"
    );

entityAudio.loop=true;
entityAudio.preload="auto";
entityAudio.volume=0;

let audioStarted=false;
let currentEntityVolume=0;

function startAudio(){

    if(audioStarted)
        return;

    audioStarted=true;

    entityAudio
        .play()
        .catch(
            error=>{
                console.warn(
                    "Audio requires browser interaction.",
                    error
                );
            }
        );
}

function updateAudio(){

    if(
        !entityActive ||
        !entity ||
        !gameStarted ||
        dead
    ){

        currentEntityVolume=
            THREE.MathUtils.lerp(
                currentEntityVolume,
                0,
                .1
            );

        entityAudio.volume=
            currentEntityVolume;

        return;
    }

    const distance=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    /*
        Sound begins far away and smoothly
        increases instead of appearing suddenly.
    */

    const hearDistance=55;

    let volume=
        1-
        distance/hearDistance;

    volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    volume=
        Math.pow(
            volume,
            .75
        );

    currentEntityVolume=
        THREE.MathUtils.lerp(
            currentEntityVolume,
            volume,
            .055
        );

    entityAudio.volume=
        currentEntityVolume;

    if(
        audioStarted &&
        entityAudio.paused
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );
    }
}

                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();
                return;
            }

            if(gameStarted)
                togglePause();
        }
    }
);

document.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;
    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            event.movementX*.0022;

        pitch-=
            event.movementY*.0018;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;
    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(
                    ()=>{}
                );

            startAudio();
        }
    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick=
    startGame;

document.getElementById(
    "menuControlsBtn"
).onclick=
    showControls;

document.getElementById(
    "pauseControlsBtn"
).onclick=
    showControls;

document.getElementById(
    "controlsBackBtn"
).onclick=
    hideControls;

document.getElementById(
    "resumeBtn"
).onclick=
    ()=>{

        paused=false;

        document.getElementById(
            "pause"
        ).style.display="none";

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );
    };

document.getElementById(
    "restartBtn"
).onclick=
    startGame;

document.getElementById(
    "retryBtn"
).onclick=
    startGame;

document.getElementById(
    "menuBtn"
).onclick=
    returnToMenu;

document.getElementById(
    "deathMenuBtn"
).onclick=
    returnToMenu;

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )
};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );
    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();
}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(!menuImages.length)
            return;

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(dt){

    for(
        const item of lights
    ){

        /*
            Mostly stable fluorescent lighting.
        */

        if(
            Math.random()<.0008
        ){

            item.light.intensity=.35;

            item.fixture.material
                .emissiveIntensity=.35;

            setTimeout(
                ()=>{

                    item.light.intensity=
                        item.targetIntensity;

                    item.fixture.material
                        .emissiveIntensity=2;

                },
                40+Math.random()*100
            );
        }
    }
}

/* =========================================================
   TAPE TIMER
========================================================= */

function updateTape(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(
            gameTime
        );

    const h=
        Math.floor(
            total/3600
        );

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    function pad(n){

        return String(n)
            .padStart(
                2,
                "0"
            );
    }

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+
        pad(m)+":"+
        pad(s);
}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    /*
        Prevent giant physics jumps.
    */

    dt=
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);
    updateEntitySpawn(dt);
    updateEntity(dt);
    updateAudio();
    updateLights(dt);
    updateMessage(dt);
    updateTape(dt);

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

    try{

        console.log(
            "BACKROOMS STARTING..."
        );

        /*
            TEXTURES FIRST.
        */

        await loadWorldTextures();

        /*
            MAP SECOND.
        */

        await loadMap();

        /*
            GEOMETRY THIRD.
        */

        buildWorld();

        /*
            LIGHTING LAST.
        */

        buildLights();

        /*
            Entity image.
        */

        await loadEntity();

        /*
            Audio preload.
        */

        entityAudio.load();

        console.log(
            "================================"
        );

        console.log(
            "BACKROOMS READY"
        );

        console.log(
            "Wall texture:",
            !!wallTexture
        );

        console.log(
            "Floor texture:",
            !!floorTexture
        );

        console.log(
            "Ceiling texture:",
            !!ceilingTexture
        );

        console.log(
            "Entity texture:",
            !!entityTexture
        );

        console.log(
            "================================"
        );

    }catch(error){

        console.error(
            error
        );

        const errorBox=
            document.getElementById(
                "error"
            );

        errorBox.style.display=
            "block";

        errorBox.textContent=
            "BACKROOMS ERROR\n\n"+
            (
                error.stack ||
                error.message ||
                String(error)
            );
    }
}

initialize();

</script>
