<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {

}

.overlay {

    inset: 0;
    z-index: 100;

    align-items: center;

}

}

h1 {

}

button {

}

}

    margin-top: 20px;

#death {

}

#death h1 {

    letter-spacing: 12px;
}

.deathText {
    color: #777;

    letter-spacing: 3px;

}

#crosshair {

    z-index: 20;

    left: 50%;
    top: 50%;

    width: 7px;
    height: 7px;

    margin: -3px;

    border: 1px solid rgba(255,255,255,.85);

    border-radius: 50%;

    pointer-events: none;
}

#hud {
    position: fixed;

    left: 18px;
    bottom: 18px;

    z-index: 20;

    color: #eee;

    font-size: 13px;

    letter-spacing: 1px;
}

#rec {
    position: fixed;

    right: 20px;
    top: 18px;

    z-index: 20;

}

#recDot {
    display: inline-block;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    box-shadow: 0 0 8px #d00;
}

#message {
    position: fixed;

    z-index: 30;

#vhs {

#vignette {

    inset: 0;

    z-index: 16;

    pointer-events: none;

            transparent 48%,
            rgba(0,0,0,.12) 72%,
            rgba(0,0,0,.62) 100%

}

#danger {
    position: fixed;

    inset: 0;

}

#error {

    bottom: 10px;

<script>

"use strict";


/* =====================================================
   ERROR HANDLING
====================================================== */

window.addEventListener(
    "error",
    function(e) {

        const box =
            document.getElementById("error");

        if(box) {

            box.style.display = "block";

            box.textContent =
                "GAME ERROR:\n\n" +
                e.message +
                "\n\n" +
                (e.filename || "") +
                ":" +
                (e.lineno || "");
        }

        console.error(
            e.error || e.message
        );
    }
);


if(typeof THREE === "undefined") {

    throw new Error(
        "Three.js was not loaded. Make sure three.min.js is beside index.html."
    );
}


/* =====================================================
   THREE.JS
====================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        74,
        innerWidth / innerHeight,
        .04,
        350
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    .92;


document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   PLAYER
====================================================== */

/*
    Shorter player.

    The previous player was too tall.

    Player height:
        1.72

    Eye height:
        1.54

    Ceiling:
        4.10

    This leaves plenty of space above the player.
*/

const player =
    new THREE.Object3D();


scene.add(player);


player.add(camera);


const PLAYER_HEIGHT = 1.72;

const EYE_HEIGHT = 1.54;

const PLAYER_RADIUS = .30;


camera.position.set(
    0,
    EYE_HEIGHT,
    0
);


let yaw = 0;

let pitch = 0;


/* =====================================================
   MOVEMENT
====================================================== */

const WALK_SPEED = 4.4;

const SPRINT_SPEED = 8.0;

const GRAVITY = 20;

const JUMP_SPEED = 7.2;


/*
    There is intentionally NO stamina.

    Sprinting can be held forever.
*/

let velocityY = 0;

let grounded = true;


/* =====================================================
   GAME STATE
====================================================== */

let currentLevel = "level0";

let running = false;

let paused = false;

let dead = false;


/* =====================================================
   DIFFICULTIES
====================================================== */

let difficulty = "easy";


const DIFFICULTIES = {

    easy: {
        name: "EASY",
        speed: 2.0,
        peaceful: true
    },

    normal: {
        name: "NORMAL",
        speed: 7.25,
        peaceful: false
    },

    hard: {
        name: "HARD",
        speed: 8.0,
        peaceful: false
    },

    impossible: {
        name: "IMPOSSIBLE",
        speed: 9.2,
        peaceful: false
    }

};


/* =====================================================
   INPUT
====================================================== */

const keys = {};

let jumpPressed = false;


addEventListener(
    "keydown",
    function(e) {

        const k =
            e.key.toLowerCase();

        keys[k] = true;


        if(e.code === "Space") {

            e.preventDefault();

            if(!e.repeat) {

                jumpPressed = true;
            }
        }


        if(
            e.code === "Escape" ||
            k === "p"
        ) {

            if(
                running &&
                !dead
            ) {

                togglePause();
            }
        }

    }
);


addEventListener(
    "keyup",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   MOUSE LOOK
====================================================== */

addEventListener(
    "mousemove",
    function(e) {

        if(
            document.pointerLockElement !==
            document.body
        ) {

            return;
        }


        if(
            paused ||
            dead
        ) {

            return;
        }


        yaw -=
            e.movementX *
            .002;


        pitch -=
            e.movementY *
            .002;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.48,
                1.48
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* =====================================================
   WORLD STORAGE
====================================================== */

let objects = [];

let walls = [];

let floors = [];


/* =====================================================
   ENTITY
====================================================== */

let entity = null;

let entityStuckTime = 0;

let entityWanderTarget = null;

let entityWanderTimer = 0;


/* =====================================================
   MATERIAL HELPERS
====================================================== */

function addObject(object) {

    scene.add(object);

    objects.push(object);

    return object;
}


function material(
    color,
    roughness = 1,
    metalness = 0
) {

    return new THREE.MeshStandardMaterial({

        color: color,

        roughness: roughness,

        metalness: metalness

    });

}


/* =====================================================
   WALLS
====================================================== */

function addWall(
    w,
    h,
    d,
    x,
    y,
    z,
    mat
) {

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            mat
        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow = true;

    mesh.receiveShadow = true;


    addObject(mesh);


    walls.push({

        minX: x - w / 2,

        maxX: x + w / 2,

        minY: y - h / 2,

        maxY: y + h / 2,

        minZ: z - d / 2,

        maxZ: z + d / 2

    });


    return mesh;
}


/* =====================================================
   FLOORS
====================================================== */

function addFloor(
    w,
    d,
    x,
    y,
    z,
    mat
) {

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                w,
                d
            ),
            mat
        );


    mesh.rotation.x =
        -Math.PI / 2;


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.receiveShadow = true;


    addObject(mesh);


    floors.push({

        minX: x - w / 2,

        maxX: x + w / 2,

        minZ: z - d / 2,

        maxZ: z + d / 2,

        y: y

    });


    return mesh;
}


/* =====================================================
   CEILING
====================================================== */

function addCeiling(
    w,
    d,
    x,
    y,
    z,
    mat
) {

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                w,
                d
            ),
            mat
        );


    mesh.rotation.x =
        Math.PI / 2;


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.receiveShadow = true;


    addObject(mesh);

    return mesh;
}


/* =====================================================
   WALLPAPER TEXTURE
====================================================== */

function wallpaperTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 2048;

    canvas.height = 2048;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#b9ad43";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        Vertical wallpaper variation.
    */

    for(
        let x = 0;
        x < canvas.width;
        x +=
            Math.floor(
                40 +
                Math.random() *
                30
            )
    ) {

        const gradient =
            ctx.createLinearGradient(
                x,
                0,
                x + 30,
                0
            );


        gradient.addColorStop(
            0,
            "rgba(80,70,20,.05)"
        );


        gradient.addColorStop(
            .5,
            "rgba(255,240,110,.08)"
        );


        gradient.addColorStop(
            1,
            "rgba(50,45,15,.05)"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            x,
            0,
            30,
            canvas.height
        );
    }


    /*
        Tiny paper fibers.
    */

    for(
        let i = 0;
        i < 110000;
        i++
    ) {

        const n =
            60 +
            Math.random() *
            100;


        ctx.fillStyle =
            `rgba(${n},${n*.88},40,.075)`;


        ctx.fillRect(
            Math.random() *
                canvas.width,

            Math.random() *
                canvas.height,

            1 +
                Math.random() *
                2,

            1 +
                Math.random() *
                4
        );
    }


    /*
        Subtle stains.
    */

    for(
        let i = 0;
        i < 130;
        i++
    ) {

        const x =
            Math.random() *
            canvas.width;


        const y =
            Math.random() *
            canvas.height;


        const r =
            25 +
            Math.random() *
            100;


        const gradient =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                r
            );


        gradient.addColorStop(
            0,
            "rgba(70,58,18,.11)"
        );


        gradient.addColorStop(
            .7,
            "rgba(80,65,20,.035)"
        );


        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI * 2
        );


        ctx.fill();
    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        5.5,
        3.4
    );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;
}


/* =====================================================
   CARPET TEXTURE
====================================================== */

function carpetTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 2048;

    canvas.height = 2048;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#4d514d";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        Carpet fibers.
    */

    for(
        let i = 0;
        i < 180000;
        i++
    ) {

        const n =
            45 +
            Math.random() *
            65;


        ctx.fillStyle =
            `rgba(${n},${n},${n},.16)`;


        ctx.fillRect(
            Math.random() *
                canvas.width,

            Math.random() *
                canvas.height,

            1 +
                Math.random() *
                2,

            1 +
                Math.random() *
                3
        );
    }


    /*
        Aged carpet patches.
    */

    for(
        let i = 0;
        i < 100;
        i++
    ) {

        const x =
            Math.random() *
            canvas.width;


        const y =
            Math.random() *
            canvas.height;


        const r =
            30 +
            Math.random() *
            100;


        const gradient =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                r
            );


        gradient.addColorStop(
            0,
            "rgba(10,18,13,.20)"
        );


        gradient.addColorStop(
            1,
            "rgba(10,18,13,0)"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI * 2
        );


        ctx.fill();
    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        8,
        8
    );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;
}


/* =====================================================
   LIGHTING
====================================================== */

function addLight(
    x,
    z,
    intensity = 1.3,
    color = 0xffe9a5,
    range = 17
) {

    const fixture =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.5,
                .075,
                .42
            ),

            new THREE.MeshBasicMaterial({
                color: 0xffffd5
            })
        );


    fixture.position.set(
        x,
        4.02,
        z
    );


    addObject(fixture);


    const light =
        new THREE.PointLight(
            color,
            intensity,
            range
        );


    light.position.set(
        x,
        3.82,
        z
    );


    light.castShadow = true;


    light.shadow.mapSize.width =
        512;

    light.shadow.mapSize.height =
        512;


    light.shadow.camera.near =
        .1;

    light.shadow.camera.far =
        range;


    addObject(light);


    return light;
}


function addCeilingPanel(
    x,
    z,
    dark = false
) {

    const panel =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.0,
                .04,
                1.0
            ),

            new THREE.MeshBasicMaterial({
                color:
                    dark
                    ? 0x99936c
                    : 0xfff4c4
            })
        );


    panel.position.set(
        x,
        4.03,
        z
    );


    addObject(panel);
}


/* =====================================================
   LEVEL 0
====================================================== */

function buildLevel0() {

    currentLevel =
        "level0";


    document.getElementById(
        "levelName"
    ).textContent =
        "LEVEL 0 — BACKROOMS";


    scene.background =
        new THREE.Color(
            0x17150b
        );


    scene.fog =
        new THREE.Fog(
            0x17150b,
            18,
            118
        );


    addObject(
        new THREE.HemisphereLight(
            0xffe9a4,
            0x292817,
            1.25
        )
    );


    addObject(
        new THREE.AmbientLight(
            0xffe5a0,
            .55
        )
    );


    const wallpaper =
        new THREE.MeshStandardMaterial({

            map:
                wallpaperTexture(),

            roughness:
                .96,

            metalness:
                0

        });


    const carpet =
        new THREE.MeshStandardMaterial({

            map:
                carpetTexture(),

            roughness:
                1,

            metalness:
                0

        });


    const ceilingMat =
        material(
            0x8f8b4d,
            1,
            0
        );


    const darkYellow =
        material(
            0x817a32,
            1,
            0
        );


    /*
        Huge main room.
    */

    addFloor(
        180,
        160,
        0,
        0,
        0,
        carpet
    );


    /*
        Outer walls.
    */

    addWall(
        180,
        4.1,
        1,
        0,
        2.05,
        -80,
        wallpaper
    );


    addWall(
        180,
        4.1,
        1,
        0,
        2.05,
        80,
        wallpaper
    );


    addWall(
        1,
        4.1,
        160,
        -90,
        2.05,
        0,
        wallpaper
    );


    addWall(
        1,
        4.1,
        160,
        90,
        2.05,
        0,
        wallpaper
    );


    /*
        Ceiling.
    */

    addCeiling(
        180,
        160,
        0,
        4.1,
        0,
        ceilingMat
    );


    /*
        Major internal walls.
    */

    addWall(
        1,
        4.1,
        105,
        -55,
        2.05,
        0,
        wallpaper
    );


    addWall(
        1,
        4.1,
        105,
        55,
        2.05,
        0,
        wallpaper
    );


    addWall(
        52,
        4.1,
        1,
        -15,
        2.05,
        -42,
        wallpaper
    );


    addWall(
        30,
        4.1,
        1,
        32,

function createDeathGrid(
    startX,
    startZ,
    countX,
    countZ,
    size,
    mat
) {

    for(
        let x = 0;
        x < countX;
        x++
    ) {

        for(
            let z = 0;
            z < countZ;
            z++
        ) {

            const px =
                startX +
                x * size;


            const pz =
                startZ +
                z * size;


            const edge =
                .14;


            addFloor(
                size - edge * 2,
                edge,
                px,
                0,
                pz - size / 2 + edge / 2,
                mat
            );


            addFloor(
                size - edge * 2,
                edge,
                px,
                0,
                pz + size / 2 - edge / 2,
                mat
            );


            addFloor(
                edge,
                size - edge * 2,
                px - size / 2 + edge / 2,
                0,
                pz,
                mat
            );


            addFloor(
                edge,
                size - edge * 2,
                px + size / 2 - edge / 2,
                0,
                pz,
                mat
            );


            const bottom =
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        size,
                        size
                    ),

                    new THREE.MeshBasicMaterial({
                        color: 0x010101
                    })
                );


            bottom.rotation.x =
                -Math.PI / 2;


            bottom.position.set(
                px,
                -20,
                pz
            );


            addObject(bottom);
        }
    }
}

/* =====================================================
   PLAYER COLLISION
====================================================== */

function hitsWall(
    x,
    y,
    z
) {

    const bottom =
        y - EYE_HEIGHT;


    const top =
        bottom +
        PLAYER_HEIGHT;


    for(
        const wall of walls
    ) {

        if(
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {

            continue;
        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x - closestX;


        const dz =
            z - closestZ;


        if(
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }


    return false;
}


function floorBelow(
    x,
    z
) {

    let best =
        -Infinity;


    for(
        const floor of floors
    ) {

        if(
            x >= floor.minX &&
            x <= floor.maxX &&
            z >= floor.minZ &&
            z <= floor.maxZ
        ) {

            if(
                floor.y <=
                player.position.y -
                EYE_HEIGHT +
                .18
            ) {

                if(
                    floor.y > best
                ) {

                    best =
                        floor.y;
                }
            }
        }
    }


    return best;
}


/* =====================================================
   PLAYER MOVEMENT
====================================================== */

function updatePlayer(dt) {

    const direction =
        new THREE.Vector3();


    if(keys.w)
        direction.z -= 1;


    if(keys.s)
        direction.z += 1;


    if(keys.a)
        direction.x -= 1;


    if(keys.d)
        direction.x += 1;


    if(
        direction.lengthSq() > 0
    ) {

        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        /*
            No sprint cooldown.
            No stamina.
        */

        const speed =
            keys.shift
            ? SPRINT_SPEED
            : WALK_SPEED;


        const amount =
            speed * dt;


        const nextX =
            player.position.x +
            direction.x *
            amount;


        if(
            !hitsWall(
                nextX,
                player.position.y,
                player.position.z
            )
        ) {

            player.position.x =
                nextX;
        }


        const nextZ =
            player.position.z +
            direction.z *
            amount;


        if(
            !hitsWall(
                player.position.x,
                player.position.y,
                nextZ
            )
        ) {

            player.position.z =
                nextZ;
        }
    }


    if(
        jumpPressed &&
        grounded
    ) {

        velocityY =
            JUMP_SPEED;


        grounded =
            false;
    }


    jumpPressed =
        false;


    velocityY -=
        GRAVITY *
        dt;


    let nextY =
        player.position.y +
        velocityY *
        dt;


    const floor =
        floorBelow(
            player.position.x,
            player.position.z
        );


    if(
        floor === -Infinity
    ) {

        grounded = false;


        if(
            player.position.y < -8
        ) {

            killPlayer(
                "You fell."
            );


            return;
        }

    } else {

        const eyeFloor =
            floor +
            EYE_HEIGHT;


        if(
            nextY <= eyeFloor &&
            velocityY <= 0
        ) {

            nextY =
                eyeFloor;


            velocityY =
                0;


            grounded =
                true;

        } else {

            grounded =
                false;
        }
    }


    player.position.y =
        nextY;
}

/* =====================================================
   ENTITY COLLISION
====================================================== */

const ENTITY_RADIUS =
    .46;

const ENTITY_HEIGHT =
    3.5;


function entityHitsWall(
    x,
    y,
    z
) {

    const bottom =
        y -
        ENTITY_HEIGHT / 2;


    const top =
        y +
        ENTITY_HEIGHT / 2;


    for(
        const wall of walls
    ) {

        if(
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {

            continue;
        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if(
            dx * dx +
            dz * dz <
            ENTITY_RADIUS *
            ENTITY_RADIUS
        ) {

            return true;
        }
    }


    return false;
}


function entityCanMoveTo(
    x,
    z
) {

    return !entityHitsWall(
        x,
        entity.position.y,
        z
    );
}


/* =====================================================
   ENTITY WALL DETECTION
====================================================== */

function entityObstacleInfo() {

    if(!entity) {

        return {
            blocked: false,
            left: false,
            right: false
        };
    }


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance < .001
    ) {

        return {
            blocked: false,
            left: false,
            right: false
        };
    }


    const forwardX =
        dx / distance;


    const forwardZ =
        dz / distance;


    const sideX =
        -forwardZ;


    const sideZ =
        forwardX;


    const lookDistance =
        Math.min(
            5.5,
            Math.max(
                2,
                distance * .45
            )
        );


    const centerX =
        entity.position.x +
        forwardX *
        lookDistance;


    const centerZ =
        entity.position.z +
        forwardZ *
        lookDistance;


    const sideDistance =
        1.35;


    const leftX =
        centerX +
        sideX *
        sideDistance;


    const leftZ =
        centerZ +
        sideZ *
        sideDistance;


    const rightX =
        centerX -
        sideX *
        sideDistance;


    const rightZ =
        centerZ -
        sideZ *
        sideDistance;


    return {

        blocked:
            !entityCanMoveTo(
                centerX,
                centerZ
            ),

        left:
            !entityCanMoveTo(
                leftX,
                leftZ
            ),

        right:
            !entityCanMoveTo(
                rightX,
                rightZ
            ),

        forwardX,
        forwardZ,

        sideX,
        sideZ,

        lookDistance
    };
}


/* =====================================================
   ENTITY ROUTE SCORING
====================================================== */

function scoreEntityDirection(
    dirX,
    dirZ,
    targetX,
    targetZ
) {

    const distances = [
        .8,
        1.5,
        2.4,
        3.5,
        4.8
    ];


    let score = 0;


    for(
        const distance of distances
    ) {

        const x =
            entity.position.x +
            dirX *
            distance;


        const z =
            entity.position.z +
            dirZ *
            distance;


        if(
            !entityCanMoveTo(
                x,
                z
            )
        ) {

            score -=
                1000 /
                distance;


            break;
        }


        const playerDistance =
            Math.hypot(
                targetX - x,
                targetZ - z
            );


        score -=
            playerDistance *
            .75;


        score +=
            distance *
            .25;
    }


    return score;
}


/* =====================================================
   SMART PATH FINDING
====================================================== */

function findBestEntityDirection() {

    const targetX =
        player.position.x;


    const targetZ =
        player.position.z;


    const dx =
        targetX -
        entity.position.x;


    const dz =
        targetZ -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance < .001
    ) {

        return {
            x: 0,
            z: 0
        };
    }


    const forwardX =
        dx / distance;


    const forwardZ =
        dz / distance;


    const sideX =
        -forwardZ;


    const sideZ =
        forwardX;


    /*
        Several possible paths.

        The AI isn't restricted to simply
        "turn left" or "turn right."
    */

    const candidates = [

        [forwardX, forwardZ],

        [sideX, sideZ],

        [-sideX, -sideZ],

        [
            forwardX * .82 +
            sideX * .57,

            forwardZ * .82 +
            sideZ * .57
        ],

        [
            forwardX * .82 -
            sideX * .57,

            forwardZ * .82 -
            sideZ * .57
        ],

        [
            forwardX * .45 +
            sideX * .89,

            forwardZ * .45 +
            sideZ * .89
        ],

        [
            forwardX * .45 -
            sideX * .89,

            forwardZ * .45 -
            sideZ * .89
        ]

    ];


    let best =
        candidates[0];


    let bestScore =
        -Infinity;


    for(
        const candidate of candidates
    ) {

        const length =
            Math.hypot(
                candidate[0],
                candidate[1]
            );


        if(
            length < .001
        ) {

            continue;
        }


        const dirX =
            candidate[0] /
            length;


        const dirZ =
            candidate[1] /
            length;


        const score =
            scoreEntityDirection(
                dirX,
                dirZ,
                targetX,
                targetZ
            );


        if(
            score > bestScore
        ) {

            bestScore =
                score;


            best = [
                dirX,
                dirZ
            ];
        }
    }


    return {

        x: best[0],

        z: best[1]

    };
}


/* =====================================================
   ENTITY UNSTUCK
====================================================== */

function unstuckEntity() {

    if(!entity)
        return;


    const targetX =
        player.position.x;


    const targetZ =
        player.position.z;


    const directions = [];


    for(
        let i = 0;
        i < 32;
        i++
    ) {

        const angle =
            i *
            Math.PI *
            2 /
            32;


        directions.push([

            Math.cos(angle),

            Math.sin(angle)

        ]);
    }


    let best = null;

    let bestScore =
        -Infinity;


    for(
        const direction of directions
    ) {

        const distance =
            4;


        const x =
            entity.position.x +
            direction[0] *
            distance;


        const z =
            entity.position.z +
            direction[1] *
            distance;


        if(
            !entityCanMoveTo(
                x,
                z
            )
        ) {

            continue;
        }


        const playerDistance =
            Math.hypot(
                targetX - x,
                targetZ - z
            );


        const score =
            -playerDistance;


        if(
            score > bestScore
        ) {

            bestScore =
                score;


            best =
                direction;
        }
    }


    if(best) {

        entity.position.x +=
            best[0] *
            .8;


        entity.position.z +=
            best[1] *
            .8;
    }
}


/* =====================================================
   PEACEFUL WANDERING
====================================================== */

function chooseWanderTarget() {

    if(!entity)
        return;


    /*
        Find a random reachable location.

        It never intentionally targets the player.
    */

    for(
        let i = 0;
        i < 40;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            8 +
            Math.random() *
            25;


        const x =
            entity.position.x +
            Math.cos(angle) *
            distance;


        const z =
            entity.position.z +
            Math.sin(angle) *
            distance;


        if(
            entityCanMoveTo(
                x,
                z
            )
        ) {

            entityWanderTarget = {

                x: x,

                z: z

            };


            entityWanderTimer =
                15 +
                Math.random() *
                20;


            return;
        }
    }


    entityWanderTarget =
        null;


    entityWanderTimer =
        3;
}


function updatePeacefulEntity(dt) {

    if(!entity)
        return;


    entityWanderTimer -=
        dt;


    if(
        !entityWanderTarget ||
        entityWanderTimer <= 0
    ) {

        chooseWanderTarget();
    }


    if(!entityWanderTarget)
        return;


    const dx =
        entityWanderTarget.x -
        entity.position.x;


    const dz =
        entityWanderTarget.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance < 1.2
    ) {

        entityWanderTarget =
            null;


        entityWanderTimer =
            0;


        return;
    }


    const dirX =
        dx / distance;


    const dirZ =
        dz / distance;


    const speed =
        DIFFICULTIES.easy.speed;


    const amount =
        speed * dt;


    const nextX =
        entity.position.x +
        dirX *
        amount;


    const nextZ =
        entity.position.z +
        dirZ *
        amount;


    if(
        entityCanMoveTo(
            nextX,
            nextZ
        )
    ) {

        entity.position.x =
            nextX;


        entity.position.z =
            nextZ;

    } else {

        /*
            It found a wall.

            It doesn't chase the player.

            It simply picks another direction.
        */

        entityWanderTarget =
            null;


        entityWanderTimer =
            0;


        return;
    }


    /*
        Keep it on the floor.
    */

    const floor =
        floorBelow(
            entity.position.x,
            entity.position.z
        );


    if(
        floor !== -Infinity
    ) {

        entity.position.y =
            floor +
            ENTITY_HEIGHT / 2;
    }


    /*
        Face the direction of travel.
    */

    const targetRotation =
        Math.atan2(
            dirX,
            dirZ
        );


    let difference =
        targetRotation -
        entity.rotation.y;


    while(
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }


    while(
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }


    entity.rotation.y +=
        difference *
        Math.min(
            1,
            dt * 4
        );


    /*
        Easy mode audio is very quiet.
    */

    const playerDistance =
        Math.hypot(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );


    entityAudio.volume =
        Math.max(
            0,
            .12 -
            playerDistance *
            .003
        );


    /*
        No danger effect.
    */

    document.getElementById(
        "danger"
    ).style.boxShadow =
        "none";
}


/* =====================================================
   ENTITY CHASE AI
====================================================== */

function updateChasingEntity(dt) {

    if(!entity)
        return;


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    /*
        Detect wall.
    */

    const obstacle =
        entityObstacleInfo();


    let direction;


    if(
        obstacle.blocked
    ) {

        /*
            Wall detected.

            Find the quickest route around it.
        */

        direction =
            findBestEntityDirection();

    } else {

        if(
            distance > .001
        ) {

            direction = {

                x:
                    dx / distance,

                z:
                    dz / distance

            };

        } else {

            direction = {

                x: 0,

                z: 0

            };
        }
    }


    /*
        Difficulty determines speed.
    */

    const entitySpeed =
        DIFFICULTIES[
            difficulty
        ].speed;


    const amount =
        entitySpeed *
        dt;


    let moved =
        false;


    /*
        First attempt.
    */

    const nextX =
        entity.position.x +
        direction.x *
        amount;


    const nextZ =
        entity.position.z +
        direction.z *
        amount;


    if(
        entityCanMoveTo(
            nextX,
            nextZ
        )
    ) {

        entity.position.x =
            nextX;


        entity.position.z =
            nextZ;


        moved = true;

    } else {

        /*
            If blocked, recalculate immediately.
        */

        const alternative =
            findBestEntityDirection();


        const altX =
            entity.position.x +
            alternative.x *
            amount;


        const altZ =
            entity.position.z +
            alternative.z *
            amount;


        if(
            entityCanMoveTo(
                altX,
                altZ
            )
        ) {

            entity.position.x =
                altX;


            entity.position.z =
                altZ;


            moved = true;
        }
    }


    /*
        If it cannot move, remember that.
    */

    if(!moved) {

        entityStuckTime +=
            dt;

    } else {

        entityStuckTime =
            Math.max(
                0,
                entityStuckTime -
                dt
            );
    }


    /*
        Escape if somehow trapped.
    */

    if(
        entityStuckTime > .45
    ) {

        unstuckEntity();

        entityStuckTime = 0;
    }


    /*
        Keep entity on floor.
    */

    const floor =
        floorBelow(
            entity.position.x,
            entity.position.z
        );


    if(
        floor !== -Infinity
    ) {

        entity.position.y =
            floor +
            ENTITY_HEIGHT / 2;
    }


    /*
        Face player.

        The image itself is still unchanged.
    */

    entity.lookAt(
        player.position.x,
        entity.position.y,
        player.position.z
    );


    /*
        Entity audio.
    */

    const volume =
        THREE.MathUtils.clamp(
            1 -
            distance / 50,
            0,
            1
        );


    entityAudio.volume =
        volume *
        volume *
        .85;


    /*
        Danger effect.
    */

    if(
        distance < 18
    ) {

        const strength =
            1 -
            distance / 18;


        document.getElementById(
            "danger"
        ).style.boxShadow =
            `inset 0 0 180px rgba(140,0,0,${
                strength * .38
            })`;

    } else {

        document.getElementById(
            "danger"
        ).style.boxShadow =
            "none";
    }


    /*
        Entity catches player.
    */

    if(
        distance < 1.25 &&
        !dead
    ) {

        killPlayer(
            "Something found you."
        );
    }
}


/* =====================================================
   MAIN ENTITY UPDATE
====================================================== */

function updateEntity(dt) {

    if(!entity)
        return;


    /*
        EASY:

        Peaceful wandering.
    */

    if(
        DIFFICULTIES[
            difficulty
        ].peaceful
    ) {

        updatePeacefulEntity(
            dt
        );

        return;
    }


    /*
        NORMAL / HARD / IMPOSSIBLE:

        Smart chasing.
    */

    updateChasingEntity(
        dt
    );
}


/* =====================================================
   ENTITY AUDIO
====================================================== */

const entityAudio =
    new Audio(
        "./entity.mp3"
    );


entityAudio.loop =
    true;


entityAudio.volume =
    0;


/* =====================================================
   AMBIENT AUDIO
====================================================== */

let audioContext = null;

let ambientGain = null;

let ambientStarted = false;


function startAmbient() {

    if(
        ambientStarted
    ) {

        return;
    }


    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const master =
            audioContext.createGain();


        master.gain.value =
            .055;


        master.connect(
            audioContext.destination
        );


        const osc1 =
            audioContext.createOscillator();


        const osc2 =
            audioContext.createOscillator();


        const osc3 =
            audioContext.createOscillator();


        const gain1 =
            audioContext.createGain();


        const gain2 =
            audioContext.createGain();


        const gain3 =
            audioContext.createGain();


        osc1.type =
            "sine";


        osc2.type =
            "sine";


        osc3.type =
            "triangle";


        osc1.frequency.value =
            59;


        osc2.frequency.value =
            118;


        osc3.frequency.value =
            174;


        gain1.gain.value =
            .75;


        gain2.gain.value =
            .14;


        gain3.gain.value =
            .025;


        osc1.connect(
            gain1
        );


        osc2.connect(
            gain2
        );


        osc3.connect(
            gain3
        );


        gain1.connect(
            master
        );


        gain2.connect(
            master
        );


        gain3.connect(
            master
        );


        osc1.start();

        osc2.start();

        osc3.start();


        ambientGain =
            master;


        ambientStarted =
            true;

    } catch(err) {

        console.warn(
            "Ambient audio unavailable:",
            err
        );
    }
}


function stopAmbient() {

    if(
        ambientGain &&
        audioContext
    ) {

        ambientGain.gain.setTargetAtTime(
            0,
            audioContext.currentTime,
            .15
        );
    }
}


/* =====================================================
   DEATH
====================================================== */

function killPlayer(reason) {

    if(dead)
        return;


    dead =
        true;


    running =
        false;


    if(
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    entityAudio.pause();


    entityAudio.currentTime =
        0;


    stopAmbient();


    document.getElementById(
        "death"
    ).style.display =
        "flex";


    document.getElementById(
        "danger"
    ).style.boxShadow =
        "inset 0 0 250px rgba(120,0,0,.72)";
}


/* =====================================================
   CLEAR WORLD
====================================================== */

function clearWorld() {

    for(
        const object of objects
    ) {

        scene.remove(
            object
        );


        if(
            object.geometry
        ) {

            object.geometry.dispose();
        }


        if(
            object.material
        ) {

            if(
                Array.isArray(
                    object.material
                )
            ) {

                object.material.forEach(
                    m => m.dispose()
                );

            } else {

                object.material.dispose();
            }
        }
    }


    objects = [];

    walls = [];

    floors = [];


    entity =
        null;


    entityWanderTarget =
        null;


    entityWanderTimer =
        0;


    entityAudio.pause();


    entityAudio.currentTime =
        0;


    if(audioContext) {

        try {

            audioContext.close();

        } catch(e) {}
    }


    audioContext =
        null;


    ambientGain =
        null;


    ambientStarted =
        false;


    scene.fog =
        null;
}


/* =====================================================
   START LEVEL
====================================================== */

function startLevel(level) {

    try {

        clearWorld();


        document.getElementById(
            "death"
        ).style.display =
            "none";


        document.getElementById(
            "pause"
        ).style.display =
            "none";


        document.getElementById(
            "menu"
        ).style.display =
            "none";


        dead =
            false;


        paused =
            false;


        running =
            true;


        if(
            level === "hotel"
        ) {

            buildHotel();

        } else {

            buildLevel0();
        }


        /*
            Audio begins after the menu click.
        */

        startAmbient();


        if(
            audioContext &&
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }


        entityAudio.play().catch(
            () => {}
        );


        document.body.requestPointerLock();

    } catch(error) {

        console.error(
            error
        );


        const box =
            document.getElementById(
                "error"
            );


        box.style.display =
            "block";


        box.textContent =
            "LEVEL ERROR:\n\n" +
            error.stack;
    }
}


/* =====================================================
   RETRY
====================================================== */

function retryLevel() {

    startLevel(
        currentLevel
    );
}


/* =====================================================
   MAIN MENU
====================================================== */

function goToMenu() {

    running =
        false;


    paused =
        false;


    dead =
        false;


    if(
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";
}


/* =====================================================
   MESSAGE
====================================================== */

let messageTimer;


function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            function() {

                message.textContent =
                    "";

            },
            1800
        );
}


/* =====================================================
   PAUSE
====================================================== */

function pauseGame() {

    if(
        !running ||
        dead
    ) {

        return;
    }


    paused =
        true;


    document.getElementById(
        "pause"
    ).style.display =
        "flex";


    if(
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    entityAudio.pause();
}


function resumeGame() {

    if(
        !running ||
        dead
    ) {

        return;
    }


    paused =
        false;


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    startAmbient();


    if(
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }


    entityAudio.play().catch(
        () => {}
    );


    document.body.requestPointerLock();
}


function togglePause() {

    if(paused) {

        resumeGame();

    } else {

        pauseGame();
    }
}


/* =====================================================
   LEVEL BUTTONS
====================================================== */

document.getElementById(
    "level0"
).onclick =
    function() {

        startLevel(
            "level0"
        );
    };


document.getElementById(
    "hotel"
).onclick =
    function() {

        startLevel(
            "hotel"
        );
    };


/* =====================================================
   DIFFICULTY BUTTONS
====================================================== */

document
    .querySelectorAll(
        ".difficulty"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    difficulty =
                        button.dataset.difficulty;


                    document
                        .querySelectorAll(
                            ".difficulty"
                        )
                        .forEach(
                            function(b) {

                                b.classList.remove(
                                    "active"
                                );
                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    showMessage(
                        "DIFFICULTY: " +
                        DIFFICULTIES[
                            difficulty
                        ].name
                    );

                }
            );

        }
    );


/* =====================================================
   PAUSE BUTTONS
====================================================== */

document.getElementById(
    "resume"
).onclick =
    function() {

        resumeGame();
    };


document.getElementById(
    "restart"
).onclick =
    function() {

        startLevel(
            currentLevel
        );
    };


document.getElementById(
    "menuButton"
).onclick =
    function() {

        goToMenu();
    };


/* =====================================================
   DEATH BUTTONS
====================================================== */

document.getElementById(
    "retry"
).onclick =
    function() {

        retryLevel();
    };


document.getElementById(
    "deathMenu"
).onclick =
    function() {

        goToMenu();
    };


/* =====================================================
   POINTER LOCK
====================================================== */

document.addEventListener(
    "click",
    function() {

        if(
            running &&
            !paused &&
            !dead &&
            document.pointerLockElement !==
            document.body
        ) {

            document.body.requestPointerLock();


            startAmbient();


            if(
                audioContext &&
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();
            }


            entityAudio.play().catch(
                () => {}
            );
        }
    }
);


/* =====================================================
   GAME LOOP
====================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        /*
            Very subtle recording noise.

            This does NOT affect entity.png.
        */

        document.getElementById(
            "vhs"
        ).style.opacity =
            .065 +
            Math.random() *
            .025;
    }


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================================
   RESIZE
====================================================== */

addEventListener(
    "resize",
    function() {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
