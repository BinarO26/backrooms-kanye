<!-- =======================================================
     THREE.JS R160
======================================================= -->

<script type="module">

import * as THREE from "./three.module.js";

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted=false;
let paused=false;
let dead=false;

let difficulty="normal";

let gameTime=0;
let messageTimer=0;

let entitySpawned=false;
let entitySpawnTimer=30;

/* =========================================================
   THREE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x373426);

scene.fog=new THREE.FogExp2(
    0x373426,
    .018
);

const camera=new THREE.PerspectiveCamera(
    76,
    innerWidth/innerHeight,
    .05,
    260
);

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio||1,
        1.0
    )
);

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=
    .72;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   WORLD
========================================================= */

const world=new THREE.Group();

scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE=3;
const WALL_HEIGHT=9;

const PLAYER_RADIUS=.42;

const EYE_HEIGHT=5.25;
const CROUCH_EYE_HEIGHT=3.25;

/*
    Much faster movement.
*/

const WALK_SPEED=9.2;
const SPRINT_SPEED=15.5;
const JUMP_SPRINT_SPEED=17.2;

const GRAVITY=21;
const JUMP_SPEED=8.2;

/* =========================================================
   DARK HORROR LIGHTING
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0x9c8e5d,
        0x090807,
        .25
    )
);

scene.add(
    new THREE.AmbientLight(
        0x806f43,
        .055
    )
);

const fluorescentLights=[];

/* =========================================================
   TEXTURE SYSTEM
========================================================= */

const loader=new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;

function prepareTexture(
    texture,
    repeatX,
    repeatY
){

    /*
        The important part:

        Three.js R160 expects textures to have
        the correct color space explicitly assigned.
    */

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.minFilter=
        THREE.LinearMipmapLinearFilter;

    texture.magFilter=
        THREE.LinearFilter;

    texture.anisotropy=
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(
    path,
    repeatX,
    repeatY
){

    return new Promise(
        (resolve,reject)=>{

            loader.load(

                path,

                texture=>{

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            texture,
                            repeatX,
                            repeatY
                        )
                    );

                },

                undefined,

                error=>{

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    reject(
                        new Error(
                            "Could not load "+path
                        )
                    );

                }

            );

        }
    );

}

async function loadTextures(){

    wallTexture=
        await loadTexture(
            "./textures/wall.png",
            1,
            1
        );

    floorTexture=
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );

    ceilingTexture=
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

}

/* =========================================================
   TEXTURED MATERIALS
========================================================= */

const wallMaterial=
    new THREE.MeshStandardMaterial({
        map:null,
        color:0xffffff,
        roughness:.92,
        metalness:0,
        side:THREE.FrontSide
    });

const floorMaterial=
    new THREE.MeshStandardMaterial({
        map:null,
        color:0xffffff,
        roughness:1,
        metalness:0,
        side:THREE.FrontSide
    });

const ceilingMaterial=
    new THREE.MeshStandardMaterial({
        map:null,
        color:0xffffff,
        roughness:.95,
        metalness:0,
        side:THREE.FrontSide
    });

function applyTextures(){

    wallMaterial.map=wallTexture;
    floorMaterial.map=floorTexture;
    ceilingMaterial.map=ceilingTexture;

    wallMaterial.color.set(0xffffff);
    floorMaterial.color.set(0xffffff);
    ceilingMaterial.color.set(0xffffff);

    wallMaterial.needsUpdate=true;
    floorMaterial.needsUpdate=true;
    ceilingMaterial.needsUpdate=true;

    /*
        Force Three.js to recognize the texture data.
    */

    wallTexture.needsUpdate=true;
    floorTexture.needsUpdate=true;
    ceilingTexture.needsUpdate=true;

}

/* =========================================================
   MAP
========================================================= */

let mapWidth=0;
let mapHeight=0;

let mapData=[];

let playerSpawn=null;
let entitySpawn=null;

const wallColliders=[];
const holeCells=[];
const hideCells=[];
const walkableCells=[];

function insideMap(x,y){

    return(
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function isHole(x,y){

    return(
        insideMap(x,y) &&
        mapData[y][x]==="hole"
    );

}

function isWalkableCell(x,y){

    if(!insideMap(x,y))
        return false;

    return mapData[y][x]!=="wall";

}

/* =========================================================
   MAP PIXEL CLASSIFICATION
========================================================= */

function classifyPixel(
    r,
    g,
    b,
    a
){

    if(a<20)
        return"floor";

    if(
        r<70 &&
        g<70 &&
        b<70
    )
        return"wall";

    if(
        r>155 &&
        r>g*1.4 &&
        r>b*1.4
    )
        return"spawn";

    if(
        b>125 &&
        b>r*1.3 &&
        b>g*1.15
    )
        return"entity";

    if(
        r>105 &&
        b>105 &&
        g<115
    )
        return"hide";

    if(
        r>135 &&
        g>115 &&
        b<125
    )
        return"hole";

    return"floor";

}

/* =========================================================
   COORDINATES
========================================================= */

function cellToWorld(x,y){

    return{

        x:
            (x+.5)*TILE-
            mapWidth*TILE*.5,

        z:
            (y+.5)*TILE-
            mapHeight*TILE*.5

    };

}

function worldToCell(x,z){

    return{

        x:
            Math.floor(
                (
                    x+
                    mapWidth*TILE*.5
                )/TILE
            ),

        y:
            Math.floor(
                (
                    z+
                    mapHeight*TILE*.5
                )/TILE
            )

    };

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image=
        await new Promise(
            (resolve,reject)=>{

                const img=new Image();

                img.onload=
                    ()=>resolve(img);

                img.onerror=
                    ()=>reject(
                        new Error(
                            "textures/map1.png failed to load."
                        )
                    );

                img.src=
                    "./textures/map1.png";

            }
        );

    mapWidth=image.naturalWidth;
    mapHeight=image.naturalHeight;

    const canvas=
        document.createElement("canvas");

    canvas.width=mapWidth;
    canvas.height=mapHeight;

    const ctx=
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels=
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row=[];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i=
                (y*mapWidth+x)*4;

            const type=
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(type!=="wall")
                walkableCells.push({x,y});

            if(type==="hole")
                holeCells.push({x,y});

            if(type==="hide")
                hideCells.push({x,y});

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

        mapData.push(row);

    }

    if(!playerSpawn){

        const c=
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        playerSpawn=
            cellToWorld(
                c.x,
                c.y
            );

    }

    if(!entitySpawn){

        const pc=
            worldToCell(
                playerSpawn.x,
                playerSpawn.z
            );

        let farthest=null;
        let distance=-1;

        for(
            const c of walkableCells
        ){

            const d=
                Math.hypot(
                    c.x-pc.x,
                    c.y-pc.y
                );

            if(d>distance){

                distance=d;
                farthest=c;

            }

        }

        if(farthest){

            entitySpawn=
                cellToWorld(
                    farthest.x,
                    farthest.y
                );

        }

    }

    console.log(
        "MAP",
        mapWidth,
        "x",
        mapHeight
    );

    console.log(
        "TEXTURED FLOOR CELLS:",
        walkableCells.length
    );

    console.log(
        "HOLES:",
        holeCells.length
    );

    console.log(
        "LOCKERS:",
        hideCells.length
    );

}

/* =========================================================
   COLLISION
========================================================= */

function addWallCollider(x,z){

    wallColliders.push({

        minX:x-TILE*.5,
        maxX:x+TILE*.5,

        minZ:z-TILE*.5,
        maxZ:z+TILE*.5

    });

}

function collides(
    x,
    z,
    radius=PLAYER_RADIUS
){

    for(
        const wall of wallColliders
    ){

        if(
            x+radius>wall.minX &&
            x-radius<wall.maxX &&
            z+radius>wall.minZ &&
            z-radius<wall.maxZ
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   FLOOR
========================================================= */

function addFloor(x,z){

    /*
        PlaneGeometry automatically contains proper UVs.

        The texture is therefore actually sampled rather
        than replaced with a flat color.
    */

    const geometry=
        new THREE.PlaneGeometry(
            TILE,
            TILE,
            1,
            1
        );

    const mesh=
        new THREE.Mesh(
            geometry,
            floorMaterial
        );

    mesh.rotation.x=
        -Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    mesh.frustumCulled=true;

    world.add(mesh);

}

/* =========================================================
   CEILING
========================================================= */

function addCeiling(x,z){

    const geometry=
        new THREE.PlaneGeometry(
            TILE,
            TILE,
            1,
            1
        );

    const mesh=
        new THREE.Mesh(
            geometry,
            ceilingMaterial
        );

    mesh.rotation.x=
        Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    mesh.frustumCulled=true;

    world.add(mesh);

}

/* =========================================================
   WALL
========================================================= */

function addWall(x,z){

    const geometry=
        new THREE.BoxGeometry(
            TILE,
            WALL_HEIGHT,
            TILE
        );

    const mesh=
        new THREE.Mesh(
            geometry,
            wallMaterial
        );

    mesh.position.set(
        x,
        WALL_HEIGHT*.5,
        z
    );

    mesh.frustumCulled=true;

    world.add(mesh);

    addWallCollider(
        x,
        z
    );

}

/* =========================================================
   3D HOLES
========================================================= */

function addHoleCell(x,y){

    const p=
        cellToWorld(
            x,
            y
        );

    /*
        Absolutely NO floor texture here.

        The normal floor tile was skipped when the map
        was constructed.

        This is the actual opening.
    */

    const darkSide=
        new THREE.MeshStandardMaterial({

            color:0x15120d,

            roughness:.95,

            metalness:0

        });

    const blackBottom=
        new THREE.MeshBasicMaterial({
            color:0x020201
        });

    const depth=5;

    const bottom=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE-.10,
                .12,
                TILE-.10
            ),
            blackBottom
        );

    bottom.position.set(
        p.x,
        -depth,
        p.z
    );

    world.add(bottom);

    /*
        Four slanted-looking interior walls.

        They are deliberately visible so the hole
        reads as a deep opening rather than a black decal.
    */

    const back=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                depth,
                .12
            ),
            darkSide
        );

    back.position.set(
        p.x,
        -depth/2,
        p.z-TILE/2
    );

    world.add(back);

    const front=back.clone();

    front.position.z=
        p.z+TILE/2;

    world.add(front);

    const left=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .12,
                depth,

            ),
            darkSide
        );

    left.position.set(
        p.x-TILE/2,
        -depth/2,
        p.z
    );

    world.add(left);

    const right=left.clone();

    right.position.x=
        p.x+TILE/2;

    world.add(right);

    /*

    */

    const rimMaterial=
        new THREE.MeshBasicMaterial({
            color:0x4d4632
        });

    const rimThickness=.055;

    const rim1=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                .08,
                rimThickness
            ),
            rimMaterial
        );

    rim1.position.set(
        p.x,
        .025,
        p.z-TILE/2
    );

    world.add(rim1);

    const rim2=rim1.clone();

    rim2.position.z=
        p.z+TILE/2;

    world.add(rim2);

    const rim3=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                rimThickness,
                .08,
                TILE
            ),
            rimMaterial
        );

    rim3.position.set(
        p.x-TILE/2,
        .025,
        p.z
    );

    world.add(rim3);

    const rim4=rim3.clone();

    rim4.position.x=
        p.x+TILE/2;

    world.add(rim4);

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type=
                mapData[y][x];

            const p=
                cellToWorld(
                    x,
                    y
                );

            if(type==="wall"){

                addWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
                The floor texture is only absent
                inside actual holes.
            */

            if(type!=="hole"){

                addFloor(
                    p.x,
                    p.z
                );

            }

            /*
                Ceiling ALWAYS exists.
            */

            addCeiling(
                p.x,
                p.z
            );

        }

    }

    for(
        const hole of holeCells
    ){

        addHoleCell(
            hole.x,
            hole.y
        );

    }

    for(
        const spot of hideCells
    ){

        const p=
            cellToWorld(
                spot.x,
                spot.y
            );

        addLocker(
            p.x,
            p.z
        );

    }

}

function buildLights(){

    /*
        5x5 grid.

        One light at the center.
    */

    for(
        let y=2;
        y<mapHeight-2;
        y+=5
    ){

        for(
            let x=2;
            x<mapWidth-2;
            x+=5
        ){

            if(
                !mapData[y] ||
                mapData[y][x]==="wall"
            )
                continue;

            const p=
                cellToWorld(
                    x,
                    y
                );

            addCeilingLight(
                p.x,
                p.z
            );

        }

    }

}

/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(dx,dz){

    const nextX=
        player.position.x+dx;

    const nextZ=
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x=
            nextX;

    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z=
            nextZ;

    }

}

/* =========================================================
   HOLE HITBOX
========================================================= */

function playerFullyOverHole(){

    /*
        Player's ENTIRE footprint must be inside
        the same hole.

        Therefore you can jump over holes.
    */

    const r=PLAYER_RADIUS;

    const samples=[

        [0,0],

        [r,0],
        [-r,0],
        [0,r],
        [0,-r],

        [r*.707,r*.707],
        [-r*.707,r*.707],
        [r*.707,-r*.707],
        [-r*.707,-r*.707]

    ];

    for(
        const [ox,oz] of samples
    ){

        const cell=
            worldToCell(
                player.position.x+ox,
                player.position.z+oz
            );

        if(
            !insideMap(
                cell.x,
                cell.y
            )
        )
            return false;

        if(
            !isHole(
                cell.x,
                cell.y
            )
        )
            return false;

    }

    return true;

}

function checkHole(){

    if(
        falling ||
        !grounded
    )
        return;

    if(
        playerFullyOverHole()
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest=null;
    let closestDistance=Infinity;

    for(
        const spot of hidingObjects
    ){

        const d=
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(d<closestDistance){

            closestDistance=d;
            closest=spot;

        }

    }

    const near=
        closest &&
        closestDistance<2.0;

    hidden=
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity=
        near&&!hidden
        ?"1"
        :"0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity=
        hidden
        ?"1"
        :"0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted||
        paused||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const p=
            Math.min(
                fallTimer/1.5,
                1
            );

        player.position.y=
            -p*5;

        camera.position.y=
            EYE_HEIGHT-p*1.4;

        camera.rotation.z=
            Math.sin(
                fallTimer*18
            )*.035;

        if(fallTimer>=1.5){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching=
        !!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w)forward++;
    if(keys.s)forward--;
    if(keys.d)strafe++;
    if(keys.a)strafe--;

    const length=
        Math.hypot(
            forward,
            strafe
        );

    if(length>0){

        forward/=length;
        strafe/=length;

        const sprinting=
            !!(
                keys.shift &&
                !crouching
            );

        let speed=
            sprinting
            ?SPRINT_SPEED
            :WALK_SPEED;

        if(
            sprinting&&!grounded
        ){

            speed=
                JUMP_SPRINT_SPEED;

        }

        if(crouching)
            speed*=.55;

        const sin=Math.sin(yaw);
        const cos=Math.cos(yaw);

        const dx=
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz=
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    velocityY-=
        GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    if(
        keys.spacePressed&&
        grounded&&
        !crouching
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;

        keys.spacePressed=false;

    }

    if(!keys.space)
        keys.spacePressed=false;

    const targetHeight=
        crouching
        ?CROUCH_EYE_HEIGHT
        :EYE_HEIGHT;

    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();

    checkHole();

}

/* =========================================================
   PATHFINDING
========================================================= */

function findPath(start,goal){

    if(
        !insideMap(start.x,start.y)||
        !insideMap(goal.x,goal.y)
    )
        return[];

    const queue=[start];

    const parent=new Map();
    const visited=new Set();

    const key=
        p=>p.x+","+p.y;

    visited.add(
        key(start)
    );

    const dirs=[

        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}

    ];

    let iterations=0;

    while(
        queue.length&&
        iterations++<6000
    ){

        const current=
            queue.shift();

        if(
            current.x===goal.x&&
            current.y===goal.y
        ){

            const path=[];

            let p=current;

            while(p){

                path.push(p);

                p=
                    parent.get(
                        key(p)
                    );

            }

            path.reverse();

            return path;

        }

        for(
            const d of dirs
        ){

            const next={

                x:current.x+d.x,
                y:current.y+d.y

            };

            const k=key(next);

            if(visited.has(k))
                continue;

            if(
                !isWalkableCell(
                    next.x,
                    next.y
                )
            )
                continue;

            visited.add(k);

            parent.set(
                k,
                current
            );

            queue.push(next);

        }

    }

    return[];

}

function updateEntityPath(){

    if(!entity)
        return;

    const start=
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const goal=
        worldToCell(
            player.position.x,
            player.position.z
        );

    entityPath=
        findPath(
            start,
            goal
        );

    entityPathIndex=1;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    /*
        IMPORTANT:

        Entity does not exist until 30 seconds have passed.
    */

    if(
        !entitySpawned
    ){

        entitySpawnTimer-=dt;

        const timer=
            Math.max(
                0,
                Math.ceil(
                    entitySpawnTimer
                )
            );

        document.getElementById(
            "spawnTimer"
        ).textContent=
            "ENTITY INITIALIZING // "+
            timer+
            "s";

        if(
            entitySpawnTimer<=0
        ){

            spawnEntity();

        }

        return;

    }

    document.getElementById(
        "spawnTimer"
    ).textContent="";

    if(
        !entity||
        !gameStarted||
        paused||
        dead
    )
        return;

    entityRepathTimer-=dt;

    if(
        entityRepathTimer<=0
    ){

        entityRepathTimer=
            difficulty==="nightmare"
            ?.12
            :.22;

        updateEntityPath();

    }

    if(
        entityPath.length<=1
    )
        return;

    const targetCell=
        entityPath[
            Math.min(
                entityPathIndex,
                entityPath.length-1
            )
        ];

    const target=
        cellToWorld(
            targetCell.x,
            targetCell.y
        );

    let dx=
        target.x-
        entity.position.x;

    let dz=
        target.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    if(distance<.18){

        entityPathIndex++;

        return;

    }

    dx/=distance;
    dz/=distance;

    const speed=
        entitySpeed();

    const nx=
        entity.position.x+
        dx*speed*dt;

    const nz=
        entity.position.z+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz,
            .38
        )
    ){

        entity.position.x=nx;
        entity.position.z=nz;

    }

    /*
        Always face camera.
    */

    entity.rotation.y=
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    const playerDistance=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    if(
        playerDistance<1.35&&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

const entityAudio=
    new Audio(
        "./sounds/entity.mp3"
    );

entityAudio.loop=true;
entityAudio.preload="auto";
entityAudio.volume=0;

let audioStarted=false;

function startEntityAudio(){

    if(audioStarted)
        return;

    audioStarted=true;

    entityAudio
        .play()
        .catch(
            ()=>{}
        );

}

let entityVolume=0;

function updateEntityAudio(){

    if(
        !entity||
        !entitySpawned||
        !gameStarted||
        dead
    ){

        entityVolume=0;
        entityAudio.volume=0;

        return;

    }

    const distance=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    const HEAR_DISTANCE=55;

    let volume=
        1-
        distance/
        HEAR_DISTANCE;

    volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    /*
        Quiet from far away.

        Gradually ramps up instead of suddenly
        appearing.
    */

    volume=
        Math.pow(
            volume,
            1.45
        );

    entityVolume=
        THREE.MathUtils.lerp(
            entityVolume,
            volume,
            .055
        );

    entityAudio.volume=
        entityVolume;

    if(
        entityAudio.paused&&
        audioStarted
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    resetPlayer();

    /*
        Entity gets a fresh 30-second delay
        every time a new game starts.
    */

    entitySpawned=false;
    entitySpawnTimer=30;

    if(entity){

        world.remove(entity);

        entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;

    }

    entityPath=[];
    entityPathIndex=0;

    entityAudio.pause();
    entityAudio.currentTime=0;
    entityAudio.volume=0;

    audioStarted=false;

    startEntityAudio();

    renderer.domElement
        .requestPointerLock()
        .catch(
            ()=>{}
        );

}

/* =========================================================
   MAIN MENU
========================================================= */

function returnToMenu(){

    gameStarted=false;
    paused=false;
    dead=false;

    entityAudio.pause();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ?"flex"
        :"none";

    if(paused){

        if(
            document.pointerLockElement
        )
            document.exitPointerLock();

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="none";

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key=
            event.key.toLowerCase();

        keys[key]=true;

        if(
            event.code==="Space"
        ){

            event.preventDefault();

            keys.spacePressed=true;

        }

        if(key==="escape"){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();

                return;

            }

            if(gameStarted)
                togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;

        if(
            event.code==="Space"
        ){

            keys.space=false;

        }

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted||
            paused||
            dead||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            event.movementX*.002;

        pitch-=
            event.movementY*.0017;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted&&
            !paused&&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(
                    ()=>{}
                );

            startEntityAudio();

        }

    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick=startGame;

document.getElementById(
    "menuControlsBtn"
).onclick=showControls;

document.getElementById(
    "pauseControlsBtn"
).onclick=showControls;

document.getElementById(
    "controlsBackBtn"
).onclick=hideControls;

document.getElementById(
    "resumeBtn"
).onclick=()=>{

    paused=false;

    document.getElementById(
        "pause"
    ).style.display="none";

    renderer.domElement
        .requestPointerLock()
        .catch(
            ()=>{}
        );

};

document.getElementById(
    "restartBtn"
).onclick=startGame;

document.getElementById(
    "retryBtn"
).onclick=startGame;

document.getElementById(
    "menuBtn"
).onclick=returnToMenu;

document.getElementById(
    "deathMenuBtn"
).onclick=returnToMenu;

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(!menuImages.length)
            return;

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   LIGHT WARM-UP + FLICKER
========================================================= */

function updateLights(dt){

    for(
        const item of fluorescentLights
    ){

        /*
            Slowly go from 1% to 100%.

            Each light has its own timing so they don't
            all brighten at exactly the same moment.
        */

        if(
            item.warmup<1
        ){

            item.warmup+=
                dt/
                18;

            const p=
                THREE.MathUtils.clamp(
                    item.warmup,
                    0,
                    1
                );

            const smooth=
                p*p*(3-2*p);

            item.current=
                THREE.MathUtils.lerp(
                    .055,
                    item.target,
                    smooth
                );

        }

        item.flickerTimer-=dt;

        if(
            item.flickerTimer<=0
        ){

            item.flickerTimer=
                .6+
                Math.random()*6;

            if(
                Math.random()<.08&&
                item.warmup>.25
            ){

                item.light.intensity=
                    item.current*.18;

                item.fixture.material
                    .emissiveIntensity=
                    .08;

                setTimeout(
                    ()=>{

                        if(!item)
                            return;

                        item.light.intensity=
                            item.current;

                        item.fixture.material
                            .emissiveIntensity=
                            THREE.MathUtils.lerp(
                                .02,
                                2.0,
                                item.warmup
                            );

                    },
                    40+
                    Math.random()*120
                );

            }else{

                item.light.intensity=
                    item.current;

            }

        }

        item.fixture.material
            .emissiveIntensity=
            THREE.MathUtils.lerp(
                .02,
                2.0,
                item.warmup
            );

    }

}

/* =========================================================
   TAPE TIMER
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted||
        paused||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(
            gameTime
        );

    const h=
        Math.floor(
            total/3600
        );

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const pad=
        n=>
            String(n)
            .padStart(
                2,
                "0"
            );

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+
        pad(m)+":"+
        pad(s);

}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateEntityAudio();
    updateLights(dt);
    updateMessage(dt);
    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);
