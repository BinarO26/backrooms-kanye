<script src="./three.min.js"></script>

<script>
"use strict";

/* =====================================================
   THREE CHECK
===================================================== */

if(!window.THREE){

    const error=document.getElementById("error");

    error.style.display="block";

    error.textContent=
        "THREE.JS FAILED TO LOAD.\n\n"+
        "Make sure these two files are in the SAME folder:\n\n"+
        "index.html\n"+
        "three.min.js\n\n"+
        "Do NOT put three.min.js inside the textures folder.";

    throw new Error("Local Three.js failed to load.");
}

/* =====================================================
   SCENE
===================================================== */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x575238);

scene.fog=new THREE.FogExp2(
    0x575238,
    0.013
);

/* =====================================================
   CAMERA
===================================================== */

const camera=new THREE.PerspectiveCamera(
    78,
    innerWidth/innerHeight,
    .025,
    500
);

camera.rotation.order="YXZ";

/* =====================================================
   RENDERER
===================================================== */

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio||1,1.35)
);

if("outputColorSpace" in renderer){
    renderer.outputColorSpace=THREE.SRGBColorSpace;
}

renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.78;

document.body.appendChild(renderer.domElement);

/* =====================================================
   LIGHTING
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0x5d573c,
        .24
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xffe9a0,
        0x090806,
        .42
    )
);

/* =====================================================
   TEXTURES
===================================================== */

const textureLoader=new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;

function prepareTexture(texture){

    texture.colorSpace=THREE.SRGBColorSpace;

    texture.wrapS=THREE.RepeatWrapping;
    texture.wrapT=THREE.RepeatWrapping;

    texture.magFilter=THREE.LinearFilter;
    texture.minFilter=THREE.LinearMipmapLinearFilter;

    texture.anisotropy=
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            8
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(path){

    return new Promise(resolve=>{

        textureLoader.load(

            path,

            texture=>{
                console.log("Loaded:",path);
                resolve(prepareTexture(texture));
            },

            undefined,

            error=>{
                console.warn("Texture failed:",path,error);
                resolve(null);
            }
        );

    });
}

async function loadTextures(){

    wallTexture=await loadTexture("./textures/wall.png");
    floorTexture=await loadTexture("./textures/floor.png");
    ceilingTexture=await loadTexture("./textures/ceiling.png");

    const missing=[];

    if(!wallTexture)missing.push("./textures/wall.png");
    if(!floorTexture)missing.push("./textures/floor.png");
    if(!ceilingTexture)missing.push("./textures/ceiling.png");

    if(missing.length){

        const error=document.getElementById("error");

        error.style.display="block";

        error.textContent=
            "TEXTURE WARNING\n\n"+
            "These textures could not be loaded:\n\n"+
            missing.join("\n")+
            "\n\n"+
            "Check the filenames and make sure the textures folder is beside index.html.";
    }
}

/* =====================================================
   PLAYER
===================================================== */

const player=new THREE.Object3D();

scene.add(player);
player.add(camera);

const EYE_HEIGHT=1.18;
const PLAYER_HEIGHT=1.55;
const PLAYER_RADIUS=.28;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=false;

let running=false;
let paused=false;
let dead=false;

let fallingIntoLevel=false;
let fallTimer=0;

const FALL_DURATION=2.25;

let difficulty="normal";

/* =====================================================
   WORLD
===================================================== */

let worldObjects=[];
let wallColliders=[];
let deathHoles=[];
let lights=[];

function addWorldObject(object){

    scene.add(object);
    worldObjects.push(object);

    return object;
}

function disposeMaterial(material){

    if(!material)return;

    if(Array.isArray(material)){
        material.forEach(disposeMaterial);
        return;
    }

    /*
       Do NOT dispose the original global texture.
       Only dispose cloned material textures.
    */

    if(material.map){
        material.map.dispose();
    }

    material.dispose();
}

function clearWorld(){

    for(const object of worldObjects){

        scene.remove(object);

        object.traverse?.(child=>{

            if(child.geometry)
                child.geometry.dispose();

            if(child.material)
                disposeMaterial(child.material);
        });
    }

    worldObjects=[];
    wallColliders=[];
    deathHoles=[];
    lights=[];

    if(exitLight){
        scene.remove(exitLight);
        exitLight=null;
    }

    exitObject=null;
    entity=null;
}

/* =====================================================
   WALL MATERIAL
   Environment is LIT.
   Entity is the ONLY unshaded PNG.
===================================================== */

function makeWallMaterial(width,height){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({
            color:0xb0a84e,
            roughness:.88,
            metalness:0,
            side:THREE.DoubleSide
        });
    }

    const texture=wallTexture.clone();

    texture.wrapS=THREE.RepeatWrapping;
    texture.wrapT=THREE.ClampToEdgeWrapping;

    const imageWidth=texture.image?.width||1;
    const imageHeight=texture.image?.height||1;

    const aspect=imageWidth/imageHeight;

    const naturalWidth=height*aspect;

    texture.repeat.set(
        Math.max(width/naturalWidth,.001),
        1
    );

    texture.needsUpdate=true;

    return new THREE.MeshStandardMaterial({

        map:texture,

        color:0xffffff,

        roughness:.92,
        metalness:0,

        side:THREE.DoubleSide
    });
}

/* =====================================================
   WALL
===================================================== */

function createWall(x,z,width,depth=.32){

    const height=3.1;

    wallColliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minZ:z-depth/2,
        maxZ:z+depth/2,

        minY:0,
        maxY:height
    });

    const group=new THREE.Group();

    const front=new THREE.Mesh(
        new THREE.PlaneGeometry(width,height),
        makeWallMaterial(width,height)
    );

    front.position.set(
        0,
        height/2,
        depth/2
    );

    group.add(front);

    const back=new THREE.Mesh(
        new THREE.PlaneGeometry(width,height),
        makeWallMaterial(width,height)
    );

    back.rotation.y=Math.PI;

    back.position.set(
        0,
        height/2,
        -depth/2
    );

    group.add(back);

    const left=new THREE.Mesh(
        new THREE.PlaneGeometry(depth,height),
        makeWallMaterial(depth,height)
    );

    left.rotation.y=Math.PI/2;

    left.position.set(
        -width/2,
        height/2,
        0
    );

    group.add(left);

    const right=new THREE.Mesh(
        new THREE.PlaneGeometry(depth,height),
        makeWallMaterial(depth,height)
    );

    right.rotation.y=-Math.PI/2;

    right.position.set(
        width/2,
        height/2,
        0
    );

    group.add(right);

    group.position.set(x,0,z);

    addWorldObject(group);
}

/* =====================================================
   OUTER WALLS
   NO VOID
===================================================== */

function createOuterWalls(){

    /*
       These surround the entire playable area.
       They are normal textured walls, not invisible
       barriers and not a black void.
    */

    const minX=-122;
    const maxX=122;
    const minZ=-104;
    const maxZ=112;

    createWall(
        (minX+maxX)/2,
        minZ,
        maxX-minX,
        .5
    );

    createWall(
        (minX+maxX)/2,
        maxZ,
        maxX-minX,
        .5
    );

    createWall(
        minX,
        (minZ+maxZ)/2,
        .5,
        maxZ-minZ
    );

    createWall(
        maxX,
        (minZ+maxZ)/2,
        .5,
        maxZ-minZ
    );
}

/* =====================================================
   FLOOR
===================================================== */

function createFloor(){

    let material;

    if(floorTexture){

        const texture=floorTexture.clone();

        texture.wrapS=THREE.RepeatWrapping;
        texture.wrapT=THREE.RepeatWrapping;

        texture.repeat.set(122,108);

        texture.needsUpdate=true;

        material=new THREE.MeshStandardMaterial({

            map:texture,

            color:0xffffff,

            roughness:1,
            metalness:0
        });

    }else{

        material=new THREE.MeshStandardMaterial({

            color:0x82783c,

            roughness:1,
            metalness:0
        });
    }

    const floor=new THREE.Mesh(
        new THREE.PlaneGeometry(300,270),
        material
    );

    floor.rotation.x=-Math.PI/2;

    addWorldObject(floor);
}

/* =====================================================
   CEILING
===================================================== */

function createCeiling(){

    let material;

    if(ceilingTexture){

        const texture=ceilingTexture.clone();

        texture.wrapS=THREE.RepeatWrapping;
        texture.wrapT=THREE.RepeatWrapping;

        texture.repeat.set(120,105);

        texture.needsUpdate=true;

        material=new THREE.MeshStandardMaterial({

            map:texture,

            color:0xffffff,

            roughness:.96,
            metalness:0,

            side:THREE.DoubleSide
        });

    }else{

        material=new THREE.MeshStandardMaterial({

            color:0x777047,

            roughness:1,

            side:THREE.DoubleSide
        });
    }

    const ceiling=new THREE.Mesh(
        new THREE.PlaneGeometry(300,270),
        material
    );

    ceiling.rotation.x=Math.PI/2;
    ceiling.position.y=3.1;

    addWorldObject(ceiling);
}

/* =====================================================
   BACKROOMS MAP
===================================================== */

function buildFloorPlan(){

    /*
       Large rooms + narrow corridors.
       The map deliberately avoids looking like a
       regular dungeon.
    */

    /* ===== NORTH-WEST ===== */

    createWall(-103,-83,34);
    createWall(-72,-90,22);
    createWall(-47,-83,28);
    createWall(-17,-90,26);

    createWall(-104,-61,24);
    createWall(-77,-67,18);
    createWall(-53,-61,28);
    createWall(-22,-66,20);

    createWall(-101,-39,31);
    createWall(-68,-45,17);
    createWall(-45,-37,27);
    createWall(-15,-44,21);

    /* ===== NORTH CENTER ===== */

    createWall(10,-91,23);
    createWall(36,-84,25);
    createWall(64,-91,28);

    createWall(4,-67,19);
    createWall(27,-71,23);
    createWall(54,-65,27);
    createWall(83,-73,21);

    createWall(8,-47,29);
    createWall(40,-50,19);
    createWall(63,-43,28);
    createWall(94,-49,20);

    /* ===== NORTH-EAST ===== */

    createWall(99,-83,25);
    createWall(105,-58,.45,30);
    createWall(100,-29,28);

    /* ===== CENTRAL LARGE ROOMS ===== */

    createWall(-104,-13,27);
    createWall(-75,-11,24);
    createWall(-49,-15,22);
    createWall(-24,-10,28);

    createWall(8,-14,25);
    createWall(35,-10,27);
    createWall(65,-15,24);
    createWall(93,-9,25);

    /* ===== VERTICAL CORRIDORS ===== */

    createWall(-87,10,.45,42);
    createWall(-62,19,.45,30);
    createWall(-36,10,.45,39);
    createWall(-9,19,.45,31);
    createWall(19,10,.45,42);
    createWall(47,18,.45,30);
    createWall(75,10,.45,42);
    createWall(103,18,.45,35);

    /* ===== CENTRAL HORIZONTAL WALLS ===== */

    createWall(-75,33,22,.45);
    createWall(-48,27,17,.45);
    createWall(-22,35,25,.45);

    createWall(5,29,19,.45);
    createWall(31,37,27,.45);
    createWall(61,29,20,.45);
    createWall(88,36,25,.45);

    /* ===== SOUTH CENTER ===== */

    createWall(-108,52,29);
    createWall(-76,46,22);
    createWall(-51,55,28);
    createWall(-20,48,21);

    createWall(8,54,28);
    createWall(38,48,22);
    createWall(64,55,28);
    createWall(96,48,22);

    /* ===== SOUTHERN CORRIDORS ===== */

    createWall(-91,72,18);
    createWall(-69,65,23);
    createWall(-43,73,17);
    createWall(-22,66,24);

    createWall(5,72,20);
    createWall(28,65,24);
    createWall(55,73,19);
    createWall(78,66,26);

    /* ===== FAR SOUTH ===== */

    createWall(-105,94,31);
    createWall(-71,87,22);
    createWall(-46,98,29);
    createWall(-15,90,23);

    createWall(13,98,29);
    createWall(45,89,23);
    createWall(72,99,28);

function createHoleRoom(){

    const startX=-57;
    const startZ=53;

    const columns=18;
    const rows=8;
    const spacing=3.5;

    for(let z=0;z<rows;z++){

        for(let x=0;x<columns;x++){

            if((x+z)%5===0)continue;

            const px=startX+x*spacing;
            const pz=startZ+z*spacing;

            const hole=new THREE.Mesh(

                new THREE.PlaneGeometry(2.7,2.7),

                new THREE.MeshBasicMaterial({
                    color:0x010101,
                    side:THREE.DoubleSide
                })
            );

            hole.rotation.x=-Math.PI/2;

            hole.position.set(
                px,
                .006,
                pz
            );

            addWorldObject(hole);

            deathHoles.push({
                x:px,
                z:pz,
                radius:1.28
            });
        }
    }
}

function addLight(x,z,intensity=4,flicker=false){

    /*
       The fixture NEVER disappears.
       Flickering changes brightness only.
    */

    const fixture=new THREE.Mesh(

        new THREE.BoxGeometry(
            1.15,
            .055,
            1.15

        new THREE.MeshStandardMaterial({

            color:0xfff1bd,

    fixture.position.set(
        x,

    addWorldObject(fixture);

        0xffe7a4,
        intensity,
        12,
        1.7
    );

    light.position.set(
        x,
        2.65,

    );

    scene.add(light);

    lights.push({

        light,
        fixture,
        flicker,

        timer:Math.random()*2,

function buildLighting(){

    for(let x=-108;x<=108;x+=12){

        for(let z=-94;z<=101;z+=11){

            if(Math.random()<.13)continue;

            const roll=Math.random();

            addLight(

                x+(Math.random()-.5)*3,

                z+(Math.random()-.5)*3,

                roll<.25
                    ?2.0
                    :4.0+Math.random()*1.8,

                roll<.32
            );
        }
    }

    addLight(-18,-64,5.4);
    addLight(-7,-64,5.2);
    addLight(27,-9,5.2);
    addLight(6,19,5.3);
    addLight(31,59,5.4);

    addLight(-55,57,1.8,true);
    addLight(-32,67,2.0,true);
    addLight(-15,57,1.7,true);
}

function updateLights(dt){

    for(const item of lights){

        if(!item.flicker)continue;

        item.timer-=dt;

        if(item.timer<=0){

            item.timer=.08+Math.random()*.7;

            /*
               NEVER turn the fixture off.
               It only changes intensity.
            */

            const variation=
                .42+
                Math.random()*.58;

            item.light.intensity=
                item.base*variation;

            item.fixture.material.emissiveIntensity=
                .65+
                variation*.65;
        }
    }
}

/* =====================================================
   COLLISION
===================================================== */

function collides(x,z){

    const bottom=player.position.y;
    const top=bottom+PLAYER_HEIGHT;

    for(const wall of wallColliders){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        )continue;

        const closestX=Math.max(
            wall.minX,
            Math.min(x,wall.maxX)
        );

        const closestZ=Math.max(
            wall.minZ,
            Math.min(z,wall.maxZ)
        );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+dz*dz<
            PLAYER_RADIUS*PLAYER_RADIUS
        ){
            return true;
        }
    }

    return false;
}

function entityHitsWall(x,z){

    for(const wall of wallColliders){

        const closestX=Math.max(
            wall.minX,
            Math.min(x,wall.maxX)
        );

        const closestZ=Math.max(
            wall.minZ,
            Math.min(z,wall.maxZ)
        );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+dz*dz<
            .43*.43
        ){
            return true;
        }
    }

    return false;
}

function blocked(x1,z1,x2,z2){

    const dx=x2-x1;
    const dz=z2-z1;

    const distance=Math.hypot(dx,dz);

    const steps=Math.ceil(distance/.35);

    for(let i=1;i<steps;i++){

        const t=i/steps;

        if(
            entityHitsWall(
                x1+dx*t,
                z1+dz*t
            )
        ){
            return true;
        }
    }

    return false;
}

/* =====================================================
   HOLES
===================================================== */

function playerInHole(){

    for(const hole of deathHoles){

        const dx=
            player.position.x-hole.x;

        const dz=
            player.position.z-hole.z;

        if(
            dx*dx+dz*dz<
            hole.radius*hole.radius
        ){
            return true;
        }
    }

    return false;
}

const entityAudio=new Audio("./entity.mp3");

const SETTINGS={

        detection:52
    }
};

let entity=null;

let entityDirection=
    new THREE.Vector2(1,0);

let entityVelocity=
    new THREE.Vector2(0,0);

let lastKnown=
    new THREE.Vector2();

let lastSeen=99;

let wanderTimer=0;
let wanderAngle=0;

function createEntity(){

    return new Promise(resolve=>{

            "./entity.png",

                    )/

                    );

                /*
                   IMPORTANT:
                   MeshBasicMaterial means the entity PNG
                   is NOT affected by scene lighting.
                */

                const material=

                        map:texture,

                        transparent:true,

                        alphaTest:.01,

                );

/* =====================================================
   ENTITY AI
===================================================== */

function updateEntity(dt){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){
        return;
    }

    const settings=SETTINGS[difficulty];

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(dx,dz);

    lastSeen+=dt;

    const visible=
        distance<settings.detection&&
        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );

    let dx2=0;
    let dz2=0;

    if(visible){

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen=0;

        dx2=dx/Math.max(distance,.001);
        dz2=dz/Math.max(distance,.001);

    }else if(lastSeen<3.2){

        const lx=
            lastKnown.x-
            entity.position.x;

        const lz=
            lastKnown.y-
            entity.position.z;

        const len=Math.hypot(lx,lz);

        if(len>.1){

            dx2=lx/len;
            dz2=lz/len;
        }

    }else{

        wanderTimer-=dt;

        if(wanderTimer<=0){

            wanderTimer=
                .5+
                Math.random()*1.8;

            wanderAngle=
                Math.random()*
                Math.PI*2;
        }

        dx2=Math.cos(wanderAngle);
        dz2=Math.sin(wanderAngle);
    }

    const targetAngle=
        Math.atan2(dz2,dx2);

    const currentAngle=
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference=
        targetAngle-currentAngle;

    while(difference>Math.PI)
        difference-=Math.PI*2;

    while(difference<-Math.PI)
        difference+=Math.PI*2;

    difference=
        Math.max(
            -3.4*dt,
            Math.min(3.4*dt,difference)
        );

    const angle=currentAngle+difference;

    entityDirection.x=Math.cos(angle);
    entityDirection.y=Math.sin(angle);

    entityVelocity.x=
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x*settings.speed,
            Math.min(1,dt*4)
        );

    entityVelocity.y=
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y*settings.speed,
            Math.min(1,dt*4)
        );

    const moveX=entityVelocity.x*dt;
    const moveZ=entityVelocity.y*dt;

    const nextX=
        entity.position.x+moveX;

    const nextZ=
        entity.position.z+moveZ;

    /*
       JUKING:
       Try forward, then angled alternatives.
    */

    if(!entityHitsWall(nextX,entity.position.z)){

        entity.position.x=nextX;

    }else{

        const alternatives=[
            angle+Math.PI/2,
            angle-Math.PI/2,
            angle+Math.PI
        ];

        let found=false;

        for(const alt of alternatives){

            const ax=
                entity.position.x+
                Math.cos(alt)*
                settings.speed*
                dt;

            const az=
                entity.position.z+
                Math.sin(alt)*
                settings.speed*
                dt;

            if(
                !entityHitsWall(ax,az)
            ){

                entityDirection.set(
                    Math.cos(alt),
                    Math.sin(alt)
                );

                entity.position.x=ax;
                entity.position.z=az;

                found=true;
                break;
            }
        }

        if(!found)
            entityVelocity.x=0;
    }

    if(!entityHitsWall(entity.position.x,nextZ)){

        entity.position.z=nextZ;

    }else{

        entityVelocity.y=0;
        wanderAngle+=Math.PI/2;
    }

    entity.rotation.y=
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    const killDistance=
        difficulty==="nightmare"
            ?1.55
            :1.25;

    if(distance<killDistance)
        killPlayer();
}

/* =====================================================
   ENTITY AUDIO
===================================================== */

function updateEntityAudio(){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){

        entityAudio.volume=0;
        return;
    }

    const distance=Math.hypot(

        entity.position.x-
        player.position.x,

        entity.position.z-
        player.position.z
    );

    const maxDistance=34;

    if(distance>=maxDistance){

        entityAudio.volume=0;
        return;
    }

    let volume=
        Math.pow(
            1-distance/maxDistance,
            1.6
        )*.9;

    if(
        blocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    ){
        volume*=.2;
    }

    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if(
        entityAudio.paused&&
        volume>.01
    ){

        entityAudio.play().catch(()=>{});
    }
}

/* =====================================================
   INPUT
===================================================== */

const keys={
    w:false,
    a:false,
    s:false,
    d:false,
    shift:false
};

let jumpPressed=false;

addEventListener("keydown",event=>{

    /*
       W = FORWARD
       S = BACKWARD
    */

    if(event.code==="KeyW")
        keys.w=true;

    if(event.code==="KeyA")
        keys.a=true;

    if(event.code==="KeyS")
        keys.s=true;

    if(event.code==="KeyD")
        keys.d=true;

    if(
        event.code==="ShiftLeft"||
        event.code==="ShiftRight"
    ){
        keys.shift=true;
    }

    if(
        event.code==="Space"&&
        !event.repeat
    ){
        jumpPressed=true;
    }

    if(
        event.code==="Escape"&&
        running&&
        !dead&&
        !fallingIntoLevel
    ){
        togglePause();
    }
});

addEventListener("keyup",event=>{

    if(event.code==="KeyW")
        keys.w=false;

    if(event.code==="KeyA")
        keys.a=false;

    if(event.code==="KeyS")
        keys.s=false;

    if(event.code==="KeyD")
        keys.d=false;

    if(
        event.code==="ShiftLeft"||
        event.code==="ShiftRight"
    ){
        keys.shift=false;
    }
});

/* =====================================================
   MOUSE
===================================================== */

document.addEventListener("mousemove",event=>{

    if(
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){
        return;
    }

    if(
        document.pointerLockElement!==document.body
    ){
        return;
    }

    yaw-=event.movementX*.0022;
    pitch-=event.movementY*.0018;

    pitch=
        Math.max(
            -1.45,
            Math.min(1.45,pitch)
        );

    player.rotation.y=yaw;
    camera.rotation.x=pitch;
});

/* =====================================================
   PLAYER
===================================================== */

function updatePlayer(dt){

    if(fallingIntoLevel){

        updateFall(dt);
        return;
    }

    let forward=0;
    let side=0;

    /*
       FIXED:
       W increases forward.
       S decreases forward.
    */

    if(keys.w)forward++;
    if(keys.s)forward--;

    if(keys.d)side++;
    if(keys.a)side--;

    const length=Math.hypot(
        forward,
        side
    );

    if(length){

        forward/=length;
        side/=length;
    }

    let speed=
        keys.shift
            ?5.9
            :3.5;

    if(difficulty==="easy")
        speed=keys.shift?6.1:3.8;

    if(difficulty==="hard")
        speed=keys.shift?6.3:3.4;

    if(difficulty==="nightmare")
        speed=keys.shift?6.5:3.25;

    const sin=Math.sin(yaw);
    const cos=Math.cos(yaw);

    const dx=
        (
            side*cos+
            forward*sin
        )*
        speed*
        dt;

    const dz=
        (
            -side*sin+
            forward*cos
        )*
        speed*
        dt;

    const nextX=
        player.position.x+dx;

    const nextZ=
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){
        player.position.x=nextX;
    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){
        player.position.z=nextZ;
    }

    if(
        jumpPressed&&
        grounded
    ){

        velocityY=6.2;
        grounded=false;
    }

    jumpPressed=false;

    velocityY-=20*dt;

    player.position.y+=velocityY*dt;

    if(player.position.y<=0){

        player.position.y=0;
        velocityY=0;
        grounded=true;
    }

    if(playerInHole()){

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }

    checkExit();
}

/* =====================================================
   FALLING
===================================================== */

function updateFall(dt){

    fallTimer+=dt;

    const progress=
        Math.min(
            fallTimer/FALL_DURATION,
            1
        );

    const eased=
        1-Math.pow(
            1-progress,
            3
        );

    player.position.y=
        17-
        17*eased;

    camera.position.y=EYE_HEIGHT;

    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(progress*1.3,1)
        );

    camera.rotation.z=
        Math.sin(
            progress*Math.PI*9
        )*.025;

    if(progress>=1){

        fallingIntoLevel=false;

        player.position.y=0;

        camera.position.set(
            0,
            EYE_HEIGHT,
            0
        );

        camera.rotation.x=0;
        camera.rotation.z=0;

        document.body.requestPointerLock();
    }
}

/* =====================================================
   CAMERA HORROR MOVEMENT
===================================================== */

let cameraTime=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;

    cameraTime+=dt;

    const moving=
        keys.w||
        keys.a||
        keys.s||
        keys.d;

    const amount=
        moving?.011:.0035;

    camera.position.x=
        Math.sin(cameraTime*3.4)*
        amount;

    camera.position.y=
        EYE_HEIGHT+
        Math.sin(cameraTime*4.1)*
        amount;

    camera.position.z=
        Math.cos(cameraTime*3.1)*
        amount*.55;

    camera.rotation.z=
        Math.sin(cameraTime*.9)*
        .004;

    /*
       Occasional security-camera jolt.
    */

    if(Math.random()<.006){

        camera.position.x+=
            (Math.random()-.5)*.055;

        camera.position.y+=
            (Math.random()-.5)*.04;

        camera.rotation.z+=
            (Math.random()-.5)*.035;
    }
}

/* =====================================================
   EXIT
===================================================== */

function checkExit(){

    if(!exitObject||dead)
        return;

    const distance=Math.hypot(

        player.position.x-exitX,

        player.position.z-exitZ
    );

    if(distance<1.8)
        winGame();
}

    dead=true;

    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

        "deathTitle"

        "deathTitle"
    ).className="";

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "retryBtn"
    ).textContent="RETRY";

    document.getElementById(
        "death"
    ).style.display="flex";
}

/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    if(
        !running||
        dead||
        fallingIntoLevel
    ){
        return;
    }

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused?"flex":"none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        document.body.requestPointerLock();
    }
}

/* =====================================================
   MENU
===================================================== */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";
}

/* =====================================================
   START
===================================================== */

async function startGame(){

    if(
        !wallTexture||
        !floorTexture||
        !ceilingTexture
    ){
        await loadTextures();
    }

    clearWorld();

    player.position.set(
        -113,
        17,
        -98
    );

    yaw=.25;
    pitch=-.28;

    velocityY=0;
    grounded=false;

    createFloor();
    createCeiling();

    /*
       Outer walls FIRST.
       The map is completely enclosed.
    */

    createOuterWalls();

    buildFloorPlan();

    createHoleRoom();

    createExit();

    buildLighting();

    await createEntity();

    entity.position.set(
        55,
        .775,
        -48
    );

    entityDirection.set(1,0);
    entityVelocity.set(0,0);

    lastSeen=99;

    running=true;
    paused=false;
    dead=false;

    fallingIntoLevel=true;
    fallTimer=0;

    recordingTime=0;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x=pitch;
    camera.rotation.z=0;

    player.rotation.y=yaw;

    showMessage(
        "ENTERING LEVEL 0..."
    );
}

/* =====================================================
   DIFFICULTY
===================================================== */

function setDifficulty(value){

    difficulty=value;

    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(button=>{
            button.classList.remove("selected");
        });

    const id=
        value==="nightmare"
            ?"nightmareBtn"
            :value+"Btn";

    document.getElementById(id)
        .classList.add("selected");

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();
}

document.getElementById("easyBtn").onclick=
    ()=>setDifficulty("easy");

document.getElementById("normalBtn").onclick=
    ()=>setDifficulty("normal");

document.getElementById("hardBtn").onclick=
    ()=>setDifficulty("hard");

document.getElementById("nightmareBtn").onclick=
    ()=>setDifficulty("nightmare");

document.getElementById("startBtn").onclick=
    ()=>startGame();

document.getElementById("resumeBtn").onclick=
    ()=>togglePause();

document.getElementById("restartBtn").onclick=
    ()=>startGame();

document.getElementById("menuBtn").onclick=
    ()=>returnToMenu();

document.getElementById("retryBtn").onclick=
    ()=>startGame();

document.getElementById("deathMenuBtn").onclick=
    ()=>returnToMenu();

/* =====================================================
   POINTER LOCK
===================================================== */

document.addEventListener("click",()=>{

    if(
        running&&
        !paused&&
        !dead&&
        !fallingIntoLevel&&
        document.pointerLockElement!==document.body
    ){

        document.body.requestPointerLock();
    }
});

/* =====================================================
   MENU IMAGES
===================================================== */

const menuImages=
    Array.from(
        document.querySelectorAll(".menuImage")
    );

let menuIndex=0;

function cycleMenuImage(){

    if(!menuImages.length)
        return;

    menuImages[menuIndex]
        .classList.remove("active");

    menuIndex=
        (menuIndex+1)%
        menuImages.length;

    menuImages[menuIndex]
        .classList.add("active");
}

setInterval(
    cycleMenuImage,
    60000
);

/* =====================================================
   RESIZE
===================================================== */

addEventListener("resize",()=>{

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio||1,
            1.35
        )
    );
});

/* =====================================================
   TIMER
===================================================== */

const clock=new THREE.Clock();

let recordingTime=0;

function updateTimer(dt){

    if(!running||paused)
        return;

    recordingTime+=dt;

    const total=Math.floor(recordingTime);

    const hours=Math.floor(total/3600);

    const minutes=Math.floor(
        (total%3600)/60
    );

    const seconds=total%60;

    const format=
        n=>String(n).padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        `${format(hours)}:`+
        `${format(minutes)}:`+
        `${format(seconds)}`;
}

/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

    requestAnimationFrame(animate);

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running&&
        !paused&&
        !dead
    ){

        updatePlayer(dt);
        updateEntity(dt);
        updateLights(dt);
        updateCamera(dt);
        updateEntityAudio();
        updateMessage(dt);
        updateTimer(dt);

    }else{

        updateEntityAudio();
    }

    renderer.render(
        scene,
        camera
    );
}

/* =====================================================
   INITIAL LOAD
===================================================== */

loadTextures();

animate();

</script>

</body>
</html>
