<script src="./three.min.js"></script>

<script>
"use strict";

/* =========================================================
   THREE.JS CHECK
========================================================= */

if (!window.THREE) {

    const error = document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "ERROR: three.min.js could not be loaded.\n\n" +
        "Make sure three.min.js is in the SAME folder as index.html.\n\n" +
        "Required:\n" +
        "./three.min.js";

    throw new Error("Local Three.js missing");
}


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x191813);

scene.fog =
    new THREE.FogExp2(
        0x191813,
        0.014
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        0.025,
        500
    );

camera.rotation.order = "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: false,
        powerPreference: "high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.35
    )
);

if ("outputColorSpace" in renderer) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}

renderer.toneMapping =
    THREE.NoToneMapping;

renderer.toneMappingExposure = 1;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   DARK HORROR LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x625c3c,
        0.055
    )
);

scene.add(
    new THREE.HemisphereLight(
        0x827941,
        0x050403,
        0.075
    )
);


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;


function prepareTexture(texture) {

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            8
        );

    texture.needsUpdate = true;

    return texture;
}


function loadTexture(path) {

    return new Promise(resolve => {

        textureLoader.load(

            path,

            texture => {

                console.log(
                    "Loaded:",
                    path
                );

                resolve(
                    prepareTexture(texture)
                );
            },

            undefined,

            error => {

                console.warn(
                    "Texture failed:",
                    path,
                    error
                );

                resolve(null);
            }
        );

    });
}


async function loadTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing = [];

    if (!wallTexture)
        missing.push("./textures/wall.png");

    if (!floorTexture)
        missing.push("./textures/floor.png");

    if (!ceilingTexture)
        missing.push("./textures/ceiling.png");

    if (missing.length) {

        const error =
            document.getElementById("error");

        error.style.display = "block";

        error.textContent =
            "TEXTURE ERROR\n\n" +
            "Could not load:\n\n" +
            missing.join("\n") +
            "\n\n" +
            "Check that the filenames and folder names match EXACTLY.";
    }
}


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const EYE_HEIGHT = 1.18;
const PLAYER_HEIGHT = 1.55;
const PLAYER_RADIUS = 0.28;

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let grounded = false;

let running = false;
let paused = false;
let dead = false;

let fallingIntoLevel = false;
let fallTimer = 0;

const FALL_DURATION = 2.25;

let difficulty = "normal";


/* =========================================================
   WORLD
========================================================= */

let worldObjects = [];
let wallColliders = [];
let deathHoles = [];
let lights = [];

function addWorldObject(object) {

    scene.add(object);
    worldObjects.push(object);

    return object;
}


function disposeMaterial(material) {

    if (!material)
        return;

    if (Array.isArray(material)) {

        material.forEach(
            disposeMaterial
        );

        return;
    }

    /*
       Do NOT dispose the original shared
       entity/audio assets here.
    */

    if (material.map)
        material.map.dispose();

    material.dispose();
}


function clearWorld() {

    for (const object of worldObjects) {

        scene.remove(object);

        object.traverse?.(child => {

            if (child.geometry)
                child.geometry.dispose();

            if (child.material)
                disposeMaterial(
                    child.material
                );
        });
    }

    worldObjects = [];
    wallColliders = [];
    deathHoles = [];
    lights = [];

    if (exitLight) {

        scene.remove(exitLight);
        exitLight = null;
    }

    exitObject = null;
    entity = null;
}


/* =========================================================
   WALL MATERIAL
========================================================= */

function makeWallMaterial(width, height) {

    if (!wallTexture) {

        return new THREE.MeshStandardMaterial({

            color: 0x9d9551,

            roughness: 0.95,

            metalness: 0
        });
    }

    const texture =
        wallTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    texture.colorSpace =
        THREE.SRGBColorSpace;

    const imageWidth =
        texture.image?.width || 1;

    const imageHeight =
        texture.image?.height || 1;

    const aspect =
        imageWidth /
        imageHeight;

    const naturalWorldWidth =
        height * aspect;

    texture.repeat.set(

        Math.max(
            width /
            naturalWorldWidth,
            0.001
        ),

        1
    );

    texture.offset.set(0, 0);

    texture.needsUpdate = true;

    /*
       WALLS ARE SHADED.

       MeshStandardMaterial allows the fluorescent
       lighting and deep shadows to affect the PNG.
    */

    return new THREE.MeshStandardMaterial({

        map: texture,

        color: 0xffffff,

        roughness: 0.92,

        metalness: 0,

        side: THREE.DoubleSide,

        transparent: false
    });
}


/* =========================================================
   WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = 0.32
) {

    const height = 3.1;

    wallColliders.push({

        minX: x - width / 2,
        maxX: x + width / 2,

        minZ: z - depth / 2,
        maxZ: z + depth / 2,

        minY: 0,
        maxY: height
    });

    const group =
        new THREE.Group();


    const front =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            makeWallMaterial(
                width,
                height
            )
        );

    front.position.set(
        0,
        height / 2,
        depth / 2
    );

    group.add(front);


    const back =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            makeWallMaterial(
                width,
                height
            )
        );

    back.rotation.y =
        Math.PI;

    back.position.set(
        0,
        height / 2,
        -depth / 2
    );

    group.add(back);


    const left =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            makeWallMaterial(
                depth,
                height
            )
        );

    left.rotation.y =
        Math.PI / 2;

    left.position.set(
        -width / 2,
        height / 2,
        0
    );

    group.add(left);


    const right =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            makeWallMaterial(
                depth,
                height
            )
        );

    right.rotation.y =
        -Math.PI / 2;

    right.position.set(
        width / 2,
        height / 2,
        0
    );

    group.add(right);


    group.position.set(
        x,
        0,
        z
    );

    addWorldObject(group);
}


/* =========================================================
   OUTER WALLS
========================================================= */

function createOuterWalls() {

    const sizeX = 250;
    const sizeZ = 220;

    const wallHeight = 3.1;
    const thickness = 0.5;

    /*
       These are REAL walls, not invisible boundaries.
       They use the same wall texture as the interior.
    */

    createWall(
        0,
        -110,
        sizeX,
        thickness
    );

    createWall(
        0,
        110,
        sizeX,
        thickness
    );

    createWall(
        -125,
        0,
        thickness,
        sizeZ
    );

    createWall(
        125,
        0,
        thickness,
        sizeZ
    );
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    let material;

    if (floorTexture) {

        const texture =
            floorTexture.clone();

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        texture.colorSpace =
            THREE.SRGBColorSpace;

        texture.repeat.set(
            125,
            110
        );

        texture.needsUpdate = true;

        material =
            new THREE.MeshStandardMaterial({

                map: texture,

                color: 0xffffff,

                roughness: 1,

                metalness: 0
            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color: 0x514d28,

                roughness: 1
            });
    }


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                250,
                220
            ),

            material
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.position.y = 0;

    addWorldObject(floor);
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling() {

    let material;

    if (ceilingTexture) {

        const texture =
            ceilingTexture.clone();

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        texture.colorSpace =
            THREE.SRGBColorSpace;

        texture.repeat.set(
            125,
            110
        );

        texture.needsUpdate = true;

        material =
            new THREE.MeshStandardMaterial({

                map: texture,

                color: 0xffffff,

                roughness: .95,

                metalness: 0,

                side: THREE.DoubleSide
            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color: 0x3f3c25,

                roughness: 1,

                side: THREE.DoubleSide
            });
    }


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                250,
                220
            ),

            material
        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y = 3.1;

    addWorldObject(ceiling);
}


/* =========================================================
   BACKROOMS MAP
========================================================= */

function buildFloorPlan() {

    /*
       Large irregular maze.

       The layout deliberately uses:
       - long corridors
       - short corridors
       - offset rooms
       - dead ends
       - large open spaces
       - narrow passages
       - strange wall islands

       This creates the non-grid-like feeling of
       an actual Backrooms floor rather than a
       conventional game level.
    */


    /* =====================================================
       NORTHWEST
    ===================================================== */

    createWall(-105,-92,30);
    createWall(-73,-96,25);
    createWall(-45,-91,22);
    createWall(-20,-97,27);
    createWall(10,-91,20);
    createWall(34,-96,27);
    createWall(64,-90,23);
    createWall(92,-96,28);


    createWall(-112,-76,17);
    createWall(-93,-70,25);
    createWall(-66,-78,18);
    createWall(-44,-70,28);
    createWall(-13,-77,20);
    createWall(10,-70,24);
    createWall(37,-78,18);
    createWall(60,-70,26);
    createWall(91,-76,20);


    createWall(-105,-55,22);
    createWall(-80,-61,17);
    createWall(-60,-51,28);
    createWall(-29,-57,18);
    createWall(-7,-50,23);
    createWall(19,-58,20);
    createWall(43,-50,27);
    createWall(73,-57,18);
    createWall(95,-51,23);


    /* =====================================================
       NORTH INTERIOR
    ===================================================== */

    createWall(-102,-33,18);
    createWall(-81,-38,26);
    createWall(-52,-31,17);

/* =========================================================
   HOLE ROOM
========================================================= */

function createHoleRoom() {

    const startX = -56;
    const startZ = 53;

    const columns = 17;
    const rows = 8;

    const spacing = 3.6;

    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            if (
                (x + z) % 5 === 0 ||
                (x === 7 && z === 3) ||
                (x === 8 && z === 3)
            ) {
                continue;
            }

            const px =
                startX +
                x * spacing;

            const pz =
                startZ +
                z * spacing;

            const hole =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.7,
                        2.7
                    ),

                    new THREE.MeshBasicMaterial({

                        color: 0x010101,

                        side: THREE.DoubleSide
                    })
                );

            hole.rotation.x =
                -Math.PI / 2;

            hole.position.set(
                px,
                .006,
                pz
            );

            addWorldObject(hole);

            deathHoles.push({

                x: px,
                z: pz,
                radius: 1.28
            });
        }
    }
}


/* =========================================================
   FLUORESCENT LIGHTS
========================================================= */

function addLight(
    x,
    z,
    intensity = 4,
    flicker = false
) {

    /*
       Light fixture is physically small compared
       with a ceiling tile.
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.15,
                .055,
                1.15
            ),

            new THREE.MeshBasicMaterial({

                color: 0xfff1bd
            })
        );

    fixture.position.set(
        x,
        3.045,
        z
    );

    addWorldObject(fixture);


    /*
       PointLight illuminates nearby wall/floor
       textures and creates the dark falloff.
    */

    const light =
        new THREE.PointLight(

            0xffe7a3,

            intensity,

            15,
            1.8
        );

    light.position.set(
        x,
        2.62,
        z
    );

    scene.add(light);


    lights.push({

        light,
        fixture,

        flicker,

        timer:
            Math.random() * 2,

        base: intensity
    });
}


function buildLighting() {

    const positions = [];

    /*
       Dense ceiling lighting grid.
    */

    for (
        let x = -108;
        x <= 108;
        x += 11
    ) {

        for (
            let z = -98;
            z <= 98;
            z += 11
        ) {

            /*
               Random omissions create dark areas.
            */

            if (
                Math.random() < .27
            ) {
                continue;
            }

            positions.push([

                x +
                (Math.random() - .5) * 2.5,

                z +
                (Math.random() - .5) * 2.5
            ]);
        }
    }


    positions.forEach(p => {

        const roll =
            Math.random();

        addLight(

            p[0],
            p[1],

            roll < .2
                ? 1.7
                : 3.1 +
                  Math.random() * 1.8,

            roll < .13
        );
    });


    /*
       Important landmark lights.
    */

    addLight(-18,-64,5.1);
    addLight(9,-73,4.8);

    addLight(28,-8,5.2);
    addLight(4,19,5.1);

    addLight(33,59,5.3);

    /*
       Flickering lights remain physically present.
       They only change brightness.
    */

    addLight(-55,57,2.0,true);
    addLight(-32,68,2.2,true);
    addLight(-13,57,1.8,true);
    addLight(51,31,2.0,true);
}


function updateLights(dt) {

    for (
        const item of lights
    ) {

        if (!item.flicker)
            continue;

        item.timer -= dt;

        if (
            item.timer <= 0
        ) {

            item.timer =
                .06 +
                Math.random() * .55;

            /*
               NEVER hide the fixture.

               Instead the light becomes very dim
               for a moment, then returns.
            */

            if (
                Math.random() < .22
            ) {

                item.light.intensity =
                    item.base * .08;

                item.fixture.material.color
                    .setHex(0x4b482d);

            } else {

                const amount =
                    .58 +
                    Math.random() * .42;

                item.light.intensity =
                    item.base * amount;

                item.fixture.material.color
                    .setHex(0xfff1bd);
            }
        }
    }
}


/* =========================================================
   COLLISION
========================================================= */

function collides(x, z) {

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;

    for (
        const wall of wallColliders
    ) {

        if (
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {
            continue;
        }

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x - closestX;

        const dz =
            z - closestZ;

        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {
            return true;
        }
    }

    return false;
}


function entityHitsWall(x, z) {

    for (
        const wall of wallColliders
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x - closestX;

        const dz =
            z - closestZ;

        if (
            dx * dx +
            dz * dz <
            .43 * .43
        ) {
            return true;
        }
    }

    return false;
}


function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 - x1;

    const dz =
        z2 - z1;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    const steps =
        Math.max(
            1,
            Math.ceil(
                distance / .35
            )
        );

    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i / steps;

        if (
            entityHitsWall(
                x1 + dx * t,
                z1 + dz * t
            )
        ) {
            return true;
        }
    }

    return false;
}


/* =========================================================
   HOLES
========================================================= */

function playerInHole() {

    for (
        const hole of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;

        const dz =
            player.position.z -
            hole.z;

        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {
            return true;
        }
    }

    return false;
}

/* =========================================================
   ENTITY AI / JUKING
========================================================= */

function updateEntity(dt) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {
        return;
    }


    const settings =
        SETTINGS[difficulty];


    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );


    lastSeen += dt;


    const visible =
        distance <
        settings.detection &&
        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );


    let dx2 = 0;
    let dz2 = 0;


    if (visible) {

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen = 0;


        dx2 =
            dx /
            Math.max(
                distance,
                .001
            );

        dz2 =
            dz /
            Math.max(
                distance,
                .001
            );

    } else if (
        lastSeen < 3.2
    ) {

        const lx =
            lastKnown.x -
            entity.position.x;

        const lz =
            lastKnown.y -
            entity.position.z;

        const len =
            Math.hypot(
                lx,
                lz
            );

        if (len > .1) {

            dx2 = lx / len;
            dz2 = lz / len;
        }

    } else {

        wanderTimer -= dt;

        if (
            wanderTimer <= 0
        ) {

            wanderTimer =
                .5 +
                Math.random() * 1.8;

            wanderAngle =
                Math.random() *
                Math.PI *
                2;
        }

        dx2 =
            Math.cos(
                wanderAngle
            );

        dz2 =
            Math.sin(
                wanderAngle
            );
    }


    const targetAngle =
        Math.atan2(
            dz2,
            dx2
        );

    const currentAngle =
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference =
        targetAngle -
        currentAngle;


    while (
        difference > Math.PI
    ) {
        difference -=
            Math.PI * 2;
    }

    while (
        difference < -Math.PI
    ) {
        difference +=
            Math.PI * 2;
    }


    difference =
        Math.max(
            -3.4 * dt,
            Math.min(
                3.4 * dt,
                difference
            )
        );


    const angle =
        currentAngle +
        difference;


    entityDirection.x =
        Math.cos(angle);

    entityDirection.y =
        Math.sin(angle);


    entityVelocity.x =
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x *
            settings.speed,
            Math.min(
                1,
                dt * 4
            )
        );


    entityVelocity.y =
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y *
            settings.speed,
            Math.min(
                1,
                dt * 4
            )
        );


    /*
       JUKING / WALL AVOIDANCE
    */

    const moveX =
        entityVelocity.x * dt;

    const moveZ =
        entityVelocity.y * dt;


    const nextX =
        entity.position.x +
        moveX;

    const nextZ =
        entity.position.z +
        moveZ;


    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        entityVelocity.x = 0;

        wanderAngle +=
            Math.PI / 2;

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }


    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        entityVelocity.y = 0;

        wanderAngle +=
            Math.PI / 2;

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }


    /*
       Billboard toward player.
    */

    entity.rotation.y =
        Math.atan2(
            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );


    const killDistance =
        difficulty === "nightmare"
            ? 1.55
            : 1.25;


    if (
        distance <
        killDistance
    ) {

        killPlayer();
    }
}

    let volume =
        Math.pow(
            1 -
            distance /
            maxDistance,
            1.6
        ) * .9;


    if (
        blocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    ) {

        volume *= .2;
    }


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );


    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   PLAYER INPUT
========================================================= */

const keys = {

    w: false,
    a: false,
    s: false,
    d: false,
    shift: false
};

let jumpPressed = false;


addEventListener(
    "keydown",
    event => {

        /*
           W/S are deliberately correct here.

           W = forward
           S = backward
        */

        if (event.code === "KeyW")
            keys.w = true;

        if (event.code === "KeyA")
            keys.a = true;

        if (event.code === "KeyS")
            keys.s = true;

        if (event.code === "KeyD")
            keys.d = true;

        if (
            event.code === "ShiftLeft" ||
            event.code === "ShiftRight"
        ) {
            keys.shift = true;
        }


        if (
            event.code === "Space" &&
            !event.repeat
        ) {

            jumpPressed = true;
        }


        if (
            event.code === "Escape" &&
            running &&
            !dead &&
            !fallingIntoLevel
        ) {

            togglePause();
        }
    }
);


addEventListener(
    "keyup",
    event => {

        if (event.code === "KeyW")
            keys.w = false;

        if (event.code === "KeyA")
            keys.a = false;

        if (event.code === "KeyS")
            keys.s = false;

        if (event.code === "KeyD")
            keys.d = false;

        if (
            event.code === "ShiftLeft" ||
            event.code === "ShiftRight"
        ) {
            keys.shift = false;
        }
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ) {
            return;
        }


        if (
            document.pointerLockElement !==
            document.body
        ) {
            return;
        }


        yaw -=
            event.movementX *
            .0022;

        pitch -=
            event.movementY *
            .0018;


        pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );


        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;
    }
);


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt) {

    if (
        fallingIntoLevel
    ) {

        updateFall(dt);

        return;
    }


    let forward = 0;
    let side = 0;


    /*
       CORRECT:
       W = +forward
       S = -forward
    */

    if (keys.w)
        forward++;

    if (keys.s)
        forward--;

    if (keys.d)
        side++;

    if (keys.a)
        side--;


    const length =
        Math.hypot(
            forward,
            side
        );


    if (length) {

        forward /= length;
        side /= length;
    }


    let speed =
        keys.shift
            ? 5.9
            : 3.5;


    if (difficulty === "easy")
        speed =
            keys.shift
                ? 6.1
                : 3.8;

    if (difficulty === "hard")
        speed =
            keys.shift
                ? 6.3
                : 3.4;

    if (difficulty === "nightmare")
        speed =
            keys.shift
                ? 6.5
                : 3.25;


    const sin =
        Math.sin(yaw);

    const cos =
        Math.cos(yaw);


    const dx =
        (
            side * cos +
            forward * sin
        ) *
        speed *
        dt;


    const dz =
        (
            -side * sin +
            forward * cos
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        dx;

    const nextZ =
        player.position.z +
        dz;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    if (
        jumpPressed &&
        grounded
    ) {

        velocityY = 6.2;

        grounded = false;
    }


    jumpPressed = false;


    velocityY -=
        20 * dt;

    player.position.y +=
        velocityY * dt;


    if (
        player.position.y <= 0
    ) {

        player.position.y = 0;

        velocityY = 0;

        grounded = true;
    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }


    checkExit();
}


/* =========================================================
   FALLING INTRO
========================================================= */

function updateFall(dt) {

    fallTimer += dt;


    const progress =
        Math.min(
            fallTimer /
            FALL_DURATION,
            1
        );


    const eased =
        1 -
        Math.pow(
            1 - progress,
            3
        );


    player.position.y =
        17 -
        17 * eased;


    camera.position.y =
        EYE_HEIGHT;


    camera.rotation.x =
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                progress * 1.3,
                1
            )
        );


    camera.rotation.z =
        Math.sin(
            progress *
            Math.PI *
            9
        ) *
        .025;


    if (
        progress >= 1
    ) {

        fallingIntoLevel = false;

        player.position.y = 0;

        camera.position.x = 0;

        camera.position.y =
            EYE_HEIGHT;

        camera.position.z = 0;

        camera.rotation.x = 0;
        camera.rotation.z = 0;

        document.body.requestPointerLock();
    }
}


/* =========================================================
   HORROR CAMERA
========================================================= */

let cameraTime = 0;
let securityGlitch = 0;


function updateCamera(dt) {

    if (fallingIntoLevel)
        return;


    cameraTime += dt;

    securityGlitch -= dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    /*
       Stronger security-camera movement.
    */

    const amount =
        moving
            ? .014
            : .004;


    camera.position.x =
        Math.sin(
            cameraTime * 3.4
        ) *
        amount;


    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime * 4.1
        ) *
        amount;


    camera.position.z =
        Math.cos(
            cameraTime * 3.1
        ) *
        amount *
        .55;


    camera.rotation.z =
        Math.sin(
            cameraTime * .9
        ) *
        .005;


    /*
       Occasional aggressive security-camera
       shake / tracking glitch.
    */

    if (
        securityGlitch <= 0 &&
        Math.random() < .006
    ) {

        securityGlitch =
            .05 +
            Math.random() * .15;

        camera.position.x +=
            (
                Math.random() -
                .5
            ) * .07;

        camera.position.y +=
            (
                Math.random() -
                .5
            ) * .05;

        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) * .045;

        const noise =
            document.querySelector(
                ".cameraNoise"
            );

        noise.style.opacity =
            ".3";

        setTimeout(
            () => {
                noise.style.opacity = "0";
            },
            80
        );
    }
}


/* =========================================================
   EXIT CHECK
========================================================= */

function checkExit() {

    if (
        !exitObject ||
        dead
    ) {
        return;
    }


    const distance =
        Math.hypot(

            player.position.x -
            exitX,

            player.position.z -
            exitZ
        );


    if (
        distance < 1.8
    ) {

        winGame();
    }
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = 0;


function showMessage(text) {

    document.getElementById(
        "message"
    ).textContent =
        text;

    messageTimer = 2.2;
}


function updateMessage(dt) {

    if (
        messageTimer <= 0
    ) {
        return;
    }


    messageTimer -= dt;


    if (
        messageTimer <= 0
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "";
    }
}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason = "THE BACKROOMS GOT YOU"
) {

    if (
        dead ||
        !running
    ) {
        return;
    }


    dead = true;

    fallingIntoLevel = false;


    entityAudio.pause();
    entityAudio.volume = 0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU DIED";


    document.getElementById(
        "deathTitle"
    ).className =
        "";


    document.getElementById(
        "deathText"
    ).textContent =
        reason;


    document.getElementById(
        "retryBtn"
    ).textContent =
        "RETRY";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   WIN
========================================================= */

function winGame() {

    if (
        dead ||
        !running
    ) {
        return;
    }


    dead = true;


    entityAudio.pause();
    entityAudio.volume = 0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU ESCAPED";


    document.getElementById(
        "deathTitle"
    ).className =
        "win";


    document.getElementById(
        "deathText"
    ).textContent =
        "YOU FOUND THE EXIT";


    document.getElementById(
        "retryBtn"
    ).textContent =
        "PLAY AGAIN";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        dead ||
        fallingIntoLevel
    ) {
        return;
    }


    paused = !paused;


    document.getElementById(
        "pause"
    ).style.display =
        paused
            ? "flex"
            : "none";


    if (paused) {

        if (
            document.pointerLockElement
        ) {

            document.exitPointerLock();
        }

    } else {

        document.body.requestPointerLock();
    }
}


/* =========================================================
   RETURN TO MENU
========================================================= */

function returnToMenu() {

    running = false;
    paused = false;
    dead = false;
    fallingIntoLevel = false;


    entityAudio.pause();
    entityAudio.volume = 0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "block";
}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    /*
       Textures must finish loading before the
       environment is generated.
    */

    if (
        !wallTexture ||
        !floorTexture ||
        !ceilingTexture
    ) {

        await loadTextures();
    }


    clearWorld();


    /*
       Start inside the actual enclosed outer walls.
    */

    player.position.set(
        -104,
        17,
        -69
    );


    yaw = .25;
    pitch = -.28;

    velocityY = 0;

    grounded = false;


    createFloor();
    createCeiling();

    /*
       Outer walls FIRST.
       Interior walls remain inside them.
    */

    createOuterWalls();

    buildFloorPlan();

    createHoleRoom();

    createExit();

    buildLighting();

    await createEntity();


    entity.position.set(
        55,
        .775,
        -48
    );


    entityDirection.set(
        1,
        0
    );

    entityVelocity.set(
        0,
        0
    );

    lastSeen = 99;


    running = true;
    paused = false;
    dead = false;

    fallingIntoLevel = true;

    fallTimer = 0;

    recordingTime = 0;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );


    camera.rotation.x =
        pitch;

    camera.rotation.z = 0;

    player.rotation.y =
        yaw;


    showMessage(
        "ENTERING LEVEL 0..."
    );
}


/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(value) {

    difficulty = value;


    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );


    const id =
        value === "nightmare"
            ? "nightmareBtn"
            : value + "Btn";


    document.getElementById(
        id
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();
}


document.getElementById(
    "easyBtn"
).onclick =
    () => setDifficulty("easy");


document.getElementById(
    "normalBtn"
).onclick =
    () => setDifficulty("normal");


document.getElementById(
    "hardBtn"
).onclick =
    () => setDifficulty("hard");


document.getElementById(
    "nightmareBtn"
).onclick =
    () => setDifficulty("nightmare");


document.getElementById(
    "startBtn"
).onclick =
    () => startGame();


document.getElementById(
    "resumeBtn"
).onclick =
    () => togglePause();


document.getElementById(
    "restartBtn"
).onclick =
    () => startGame();


document.getElementById(
    "menuBtn"
).onclick =
    () => returnToMenu();


document.getElementById(
    "retryBtn"
).onclick =
    () => startGame();


document.getElementById(
    "deathMenuBtn"
).onclick =
    () => returnToMenu();


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    () => {

        if (
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement !==
            document.body
        ) {

            document.body.requestPointerLock();
        }
    }
);


/* =========================================================
   MENU IMAGE ROTATION
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex = 0;


function cycleMenuImage() {

    if (
        menuImages.length === 0
    ) {
        return;
    }


    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );


    menuIndex =
        (
            menuIndex + 1
        ) %
        menuImages.length;


    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}


setInterval(
    cycleMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.35
            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock =
    new THREE.Clock();

let recordingTime = 0;


function updateTimer(dt) {

    if (
        !running ||
        paused
    ) {
        return;
    }


    recordingTime += dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total / 3600
        );


    const minutes =
        Math.floor(
            (total % 3600) /
            60
        );


    const seconds =
        total % 60;


    const format =
        n =>
            String(n)
                .padStart(
                    2,
                    "0"
                );


    document.getElementById(
        "tapeTime"
    ).textContent =
        `${format(hours)}:` +
        `${format(minutes)}:` +
        `${format(seconds)}`;
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(dt);

        updateEntity(dt);

        updateLights(dt);

        updateCamera(dt);

        updateEntityAudio();

        updateMessage(dt);

        updateTimer(dt);

    } else {

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadTextures();

animate();

</script>
