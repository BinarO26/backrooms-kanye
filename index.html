<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>THE BACKROOMS — LEVEL 0</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#menu,#pause,#death{
    position:fixed;
    inset:0;
    z-index:20;
}

#menu{
    display:block;
    overflow:hidden;
    background:#111;
}

.menuImage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 2s ease;
}

.menuImage.active{
    opacity:1;
}

.menuDark{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            rgba(0,0,0,.25),
            rgba(0,0,0,.78)
        );
}

.menuNoise{
    position:absolute;
    inset:0;
    opacity:.08;
    pointer-events:none;
    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            #fff 0,
            #fff 1px,
            transparent 1px,
            transparent 4px
        );
    background-size:6px 6px;
}

.menuScan{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,

}

.menuContent{
    position:absolute;
    top:18%;

    transform:translateX(-50%);
    text-align:center;
    color:#fff;
    width:90%;
    text-shadow:0 3px 10px #000;

.menuContent h1{

}

.menuSubtitle{

.menuHint{

#hud{

}

/* =====================================================
   FNAF SECURITY CAMERA EFFECTS
===================================================== */

.securityScanlines{
    position:absolute;
    inset:0;
    opacity:.17;
    mix-blend-mode:screen;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 2px,
            rgba(255,255,255,.055) 3px,
            transparent 4px
        );
}

.securityNoise{
    position:absolute;
    inset:-10%;
    opacity:.055;
    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            #fff 0,
            #fff 1px,
            transparent 1px,
            transparent 4px
        );
    background-size:7px 7px;
    animation:noiseMove .12s steps(2) infinite;
}

@keyframes noiseMove{
    0%{transform:translate(0,0)}
    25%{transform:translate(-1%,1%)}
    50%{transform:translate(1%,-1%)}
    75%{transform:translate(1%,1%)}
    100%{transform:translate(-1%,-1%)}
}

.securityVignette{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.22) 72%,

        );
}

.securityBleed{
    position:absolute;
    inset:0;
    opacity:.13;
    mix-blend-mode:screen;
    background:
        linear-gradient(
            90deg,
            rgba(255,0,0,.09),
            transparent 13%,
            transparent 87%,
            rgba(0,80,255,.09)
        );
}

.securityTracking{
    position:absolute;
    left:0;
    width:100%;
    height:2px;
    top:-10px;
    opacity:0;
    background:rgba(255,255,255,.3);
    box-shadow:
        0 0 10px rgba(255,255,255,.25);
}

.securityTracking.active{
    animation:tracking .22s linear;
}

@keyframes tracking{
    0%{
        top:-5px;
        opacity:0;
    }
    20%{
        opacity:.5;
    }
    100%{
        top:105%;
        opacity:0;
    }
}

.securityTimestamp{

<!-- =====================================================
     LOCAL THREE.JS

     three.min.js is in the SAME folder as index.html.

<script src="./three.min.js"></script>

<script>
"use strict";

/* =====================================================
   THREE CHECK
===================================================== */

if (!window.THREE) {

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "THREE.JS FAILED TO LOAD.\n\n" +
        "The game is looking for:\n" +
        "./three.min.js\n\n" +
        "Make sure three.min.js is in the SAME " +
        "folder as index.html.";

    throw new Error(
        "Local Three.js failed to load."
    );
}


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x706a43);

scene.fog =
    new THREE.FogExp2(
        0x706a43,
        0.0075
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .025,
        500
    );

camera.rotation.order = "YXZ";


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:
            "high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio || 1,
        1.35
    )
);

if ("outputColorSpace" in renderer) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}

renderer.toneMapping =
    THREE.NoToneMapping;

renderer.toneMappingExposure = 1;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffe9a0,
        .34
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xffe9a0,
        0x18150d,
        .42
    )
);


/* =====================================================
   TEXTURES
===================================================== */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;

function prepareTexture(texture) {

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(path) {

    return new Promise(resolve => {

        textureLoader.load(

            path,

            texture => {

                console.log(
                    "Loaded:",
                    path
                );

                resolve(
                    prepareTexture(texture)
                );
            },

            undefined,

            error => {

                console.error(
                    "Failed:",
                    path,
                    error
                );

                resolve(null);
            }
        );
    });
}

async function loadTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing = [];

    if (!wallTexture)
        missing.push(
            "./textures/wall.png"
        );

    if (!floorTexture)
        missing.push(
            "./textures/floor.png"
        );

    if (!ceilingTexture)
        missing.push(
            "./textures/ceiling.png"
        );

    if (missing.length) {

        const error =
            document.getElementById(
                "error"
            );

        error.style.display =
            "block";

        error.textContent =
            "TEXTURE ERROR\n\n" +
            "Missing:\n\n" +
            missing.join("\n") +
            "\n\n" +
            "Check the textures folder.";
    }
}


/* =====================================================
   PLAYER
===================================================== */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const EYE_HEIGHT = 1.18;
const PLAYER_HEIGHT = 1.55;
const PLAYER_RADIUS = .28;

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let grounded = false;

let running = false;
let paused = false;
let dead = false;

let fallingIntoLevel = false;
let fallTimer = 0;

const FALL_DURATION = 2.25;

let difficulty = "normal";


/* =====================================================
   WORLD
===================================================== */

let worldObjects = [];
let wallColliders = [];
let deathHoles = [];
let lights = [];

function addWorldObject(object) {

    scene.add(object);

    worldObjects.push(object);

    return object;
}

function disposeMaterial(material) {

    if (!material)
        return;

    if (Array.isArray(material)) {

        material.forEach(
            disposeMaterial
        );

        return;
    }

    /*
       Do NOT dispose the original loaded
       textures. Only dispose cloned maps.
    */

    if (
        material.map &&
        material.map !== wallTexture &&
        material.map !== floorTexture &&
        material.map !== ceilingTexture
    ) {
        material.map.dispose();
    }

    material.dispose();
}

function clearWorld() {

    for (
        const object of worldObjects
    ) {

        scene.remove(object);

        object.traverse?.(
            child => {

                if (child.geometry)
                    child.geometry.dispose();

                if (child.material)
                    disposeMaterial(
                        child.material
                    );
            }
        );
    }

    worldObjects = [];
    wallColliders = [];
    deathHoles = [];
    lights = [];

    if (exitLight) {

        scene.remove(exitLight);

        exitLight = null;
    }

    exitObject = null;
    entity = null;
}


/* =====================================================
   WALL MATERIAL
     
   WORLD PNGS ARE SHADED.
===================================================== */

function makeWallMaterial(
    width,
    height
) {

    if (!wallTexture) {

        return new THREE.MeshStandardMaterial({

            color:0xb3a94e,

            roughness:.9,

            metalness:0,

            side:THREE.DoubleSide
        });
    }

    const texture =
        wallTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    const imageWidth =
        texture.image?.width || 1;

    const imageHeight =
        texture.image?.height || 1;

    const aspect =
        imageWidth /
        imageHeight;

    const naturalWidth =
        height * aspect;

    texture.repeat.set(
        Math.max(
            width /
            naturalWidth,
            .001
        ),
        1
    );

    texture.needsUpdate = true;

    /*
       MeshStandardMaterial intentionally used.
       Therefore wall.png receives real scene lighting.
    */

    return new THREE.MeshStandardMaterial({

        map:texture,

        color:0xffffff,

        roughness:.92,

        metalness:0,

        side:THREE.DoubleSide
    });
}


/* =====================================================
   WALL
===================================================== */

function createWall(
    x,
    z,
    width,
    depth=.32
) {

    const height=3.1;

    wallColliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minZ:z-depth/2,
        maxZ:z+depth/2,

        minY:0,
        maxY:height
    });

    const group =
        new THREE.Group();

    const front =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            makeWallMaterial(
                width,
                height
            )
        );

    front.position.set(
        0,
        height/2,
        depth/2
    );

    group.add(front);

    const back =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            makeWallMaterial(
                width,
                height
            )
        );

    back.rotation.y=Math.PI;

    back.position.set(
        0,
        height/2,
        -depth/2
    );

    group.add(back);

    const left =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            makeWallMaterial(
                depth,
                height
            )
        );

    left.rotation.y=
        Math.PI/2;

    left.position.set(
        -width/2,
        height/2,
        0
    );

    group.add(left);

    const right =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            makeWallMaterial(
                depth,
                height
            )
        );

    right.rotation.y=
        -Math.PI/2;

    right.position.set(
        width/2,
        height/2,
        0
    );

    group.add(right);

    group.position.set(
        x,
        0,
        z
    );

    addWorldObject(group);
}


/* =====================================================
   FLOOR
===================================================== */

function createFloor() {

    let material;

    if (floorTexture) {

        const texture =
            floorTexture.clone();

        texture.repeat.set(
            120,
            105
        );

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        texture.needsUpdate = true;

        material =
            new THREE.MeshStandardMaterial({

                map:texture,

                roughness:.95,

                metalness:0
            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color:0x968b43,

                roughness:.95
            });
    }

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                270
            ),

            material
        );

    floor.rotation.x=
        -Math.PI/2;

    addWorldObject(floor);
}


/* =====================================================
   CEILING
===================================================== */

function createCeiling() {

    let material;

    if (ceilingTexture) {

        const texture =
            ceilingTexture.clone();

        texture.repeat.set(
            120,
            105
        );

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        texture.needsUpdate = true;

        material =
            new THREE.MeshStandardMaterial({

                map:texture,

                roughness:.9,

                metalness:0,

                side:THREE.DoubleSide
            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color:0x888047,

                roughness:.9,

                side:THREE.DoubleSide
            });
    }

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                270
            ),

            material
        );

    ceiling.rotation.x=
        Math.PI/2;

    ceiling.position.y=3.1;

    addWorldObject(ceiling);
}


/* =====================================================
   FLOOR PLAN
===================================================== */

function buildFloorPlan(){

    createWall(5,10,.35,17);

    createWall(30,12,18,.35);

function createHoleRoom(){

    const startX=-57;
    const startZ=53;

    const columns=18;
    const rows=8;

    const spacing=3.5;

    for(let z=0;z<rows;z++){

        for(let x=0;x<columns;x++){

            if((x+z)%5===0)
                continue;

            const px=
                startX+x*spacing;

            const pz=
                startZ+z*spacing;

            const hole=
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.7,
                        2.7
                    ),

                    new THREE.MeshBasicMaterial({

                        color:0x020202,

                        side:
                            THREE.DoubleSide
                    })
                );

            hole.rotation.x=
                -Math.PI/2;

            hole.position.set(
                px,
                .006,
                pz
            );

            addWorldObject(hole);

            deathHoles.push({

                x:px,
                z:pz,
                radius:1.28
            });
        }
    }
}

function buildLighting(){

    const positions=[];

    for(
        let x=-95;
        x<=95;
        x+=12
    ){

        for(
            let z=-83;
            z<=88;
            z+=11
        ){

            if(
                Math.random()<.18
            )
                continue;

            positions.push([

                x+
                (Math.random()-.5)*3,

                z+
                (Math.random()-.5)*3
            ]);
        }
    }

    positions.forEach(p=>{

        const roll=Math.random();

        addLight(

            p[0],
            p[1],

            roll<.3
                ?2.1
                :4+
                 Math.random()*1.8,

            roll<.36
        );
    });

    addLight(-18,-64,5.4);
    addLight(-7,-64,5.2);
    addLight(27,-9,5.2);
    addLight(6,19,5.3);
    addLight(31,59,5.4);

    addLight(-55,57,1.8,true);
    addLight(-32,67,2,true);
    addLight(-15,57,1.7,true);
}

function updateLights(dt){

    for(const item of lights){

        if(!item.flicker)
            continue;

        item.timer-=dt;

        if(item.timer<=0){

            item.timer=
                .06+
                Math.random()*.65;

            if(Math.random()<.22){

                item.light.intensity=0;
                item.fixture.visible=false;

            }else{

                item.fixture.visible=true;

                item.light.intensity=
                    item.base*
                    (.65+
                     Math.random()*.4);
            }
        }
    }
}


/* =====================================================
   COLLISION
===================================================== */

function collides(x,z){

    const bottom=
        player.position.y;

    const top=
        bottom+PLAYER_HEIGHT;

    for(const wall of wallColliders){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        )
            continue;

        const closestX=
            Math.max(
                wall.minX,
                Math.min(x,wall.maxX)
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(z,wall.maxZ)
            );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+
            dz*dz<
            PLAYER_RADIUS*
            PLAYER_RADIUS
        )
            return true;
    }

    return false;
}

function entityHitsWall(x,z){

    for(const wall of wallColliders){

        const closestX=
            Math.max(
                wall.minX,
                Math.min(x,wall.maxX)
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(z,wall.maxZ)
            );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+
            dz*dz<
            .43*.43
        )
            return true;
    }

    return false;
}

function blocked(
    x1,z1,
    x2,z2
){

    const dx=x2-x1;
    const dz=z2-z1;

    const distance=
        Math.hypot(dx,dz);

    const steps=
        Math.ceil(distance/.35);

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        if(
            entityHitsWall(
                x1+dx*t,
                z1+dz*t
            )
        )
            return true;
    }

    return false;
}


/* =====================================================
   HOLES
===================================================== */

function playerInHole(){

    for(const hole of deathHoles){

        const dx=
            player.position.x-hole.x;

        const dz=
            player.position.z-hole.z;

        if(
            dx*dx+
            dz*dz<
            hole.radius*
            hole.radius
        )
            return true;
    }

    return false;
}

/* =====================================================
   ENTITY AI
===================================================== */

function updateEntity(dt){

    if(
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    )
        return;

    const settings=
        SETTINGS[difficulty];

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(dx,dz);

    lastSeen+=dt;

    const visible=
        distance<
        settings.detection &&
        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );

    let dx2=0;
    let dz2=0;

    if(visible){

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen=0;

        dx2=
            dx/
            Math.max(distance,.001);

        dz2=
            dz/
            Math.max(distance,.001);

    }else if(lastSeen<3.2){

        const lx=
            lastKnown.x-
            entity.position.x;

        const lz=
            lastKnown.y-
            entity.position.z;

        const len=
            Math.hypot(lx,lz);

        if(len>.1){

            dx2=lx/len;
            dz2=lz/len;
        }

    }else{

        wanderTimer-=dt;

        if(wanderTimer<=0){

            wanderTimer=
                .5+
                Math.random()*1.8;

            wanderAngle=
                Math.random()*
                Math.PI*2;
        }

        dx2=
            Math.cos(wanderAngle);

        dz2=
            Math.sin(wanderAngle);
    }

    const targetAngle=
        Math.atan2(dz2,dx2);

    const currentAngle=
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference=
        targetAngle-currentAngle;

    while(difference>Math.PI)
        difference-=Math.PI*2;

    while(difference<-Math.PI)
        difference+=Math.PI*2;

    difference=
        Math.max(
            -3.4*dt,
            Math.min(3.4*dt,difference)
        );

    const angle=
        currentAngle+difference;

    entityDirection.x=
        Math.cos(angle);

    entityDirection.y=
        Math.sin(angle);

    entityVelocity.x=
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x*
            settings.speed,
            Math.min(1,dt*4)
        );

    entityVelocity.y=
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y*
            settings.speed,
            Math.min(1,dt*4)
        );

    const moveX=
        entityVelocity.x*dt;

    const moveZ=
        entityVelocity.y*dt;

    const nextX=
        entity.position.x+moveX;

    const nextZ=
        entity.position.z+moveZ;

    if(
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ){

        entity.position.x=
            nextX;

    }else{

        entityVelocity.x=0;

        /*
           Juke instead of getting stuck.
        */

        wanderAngle+=
            Math.PI/2+
            (Math.random()-.5);

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }

    if(
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ){

        entity.position.z=
            nextZ;

    }else{

        entityVelocity.y=0;

        wanderAngle+=
            Math.PI/2+
            (Math.random()-.5);

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }

    entity.rotation.y=
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    const killDistance=
        difficulty==="nightmare"
            ?1.55
            :1.25;

    if(
        distance<
        killDistance
    )
        killPlayer();
}


/* =====================================================
   ENTITY AUDIO
===================================================== */

function updateEntityAudio(){

    if(
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ){

        entityAudio.volume=0;
        return;
    }

    const distance=
        Math.hypot(

            entity.position.x-
            player.position.x,

            entity.position.z-
            player.position.z
        );

    const maxDistance=34;

    if(distance>=maxDistance){

        entityAudio.volume=0;
        return;
    }

    let volume=
        Math.pow(
            1-
            distance/maxDistance,
            1.6
        )*.9;

    if(
        blocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    )
        volume*=.2;

    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if(
        entityAudio.paused &&
        volume>.01
    ){

        entityAudio
            .play()
            .catch(()=>{});
    }
}

const keys={

    s:false,

addEventListener(

        if(event.code==="KeyW")
            keys.w=true;

        if(event.code==="KeyA")
            keys.a=true;

        if(event.code==="KeyS")
            keys.s=true;

        if(event.code==="KeyD")
            keys.d=true;

        if(
            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        )
            keys.shift=true;

        if(
            event.code==="Space" &&
            !event.repeat
        )
            jumpPressed=true;

        if(
            event.code==="Escape" &&
            running &&
            !dead &&
            !fallingIntoLevel
        )
            togglePause();
    }
);

addEventListener(
    "keyup",
    event=>{

        if(event.code==="KeyW")
            keys.w=false;

        if(event.code==="KeyA")
            keys.a=false;

        if(event.code==="KeyS")
            keys.s=false;

        if(event.code==="KeyD")
            keys.d=false;

            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        )
            keys.shift=false;

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !running||
            paused||
            dead||
            fallingIntoLevel
        )
            return;

        if(
            document.pointerLockElement!==
            document.body
        )
            return;

        yaw-=
            event.movementX*.0022;

        pitch-=
            event.movementY*.0018;

        pitch=
            Math.max(
                -1.45,
                Math.min(1.45,pitch)
            );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;
    }
);


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(dt){

    if(fallingIntoLevel){

        updateFall(dt);

        return;
    }

    let forward=0;
    let side=0;

    if(keys.w)
        forward++;

    if(keys.s)
        forward--;

    if(keys.d)
        side++;

    if(keys.a)
        side--;

    const length=
        Math.hypot(
            forward,
            side
        );

    if(length){

        forward/=length;
        side/=length;
    }

    let speed=
        keys.shift
            ?5.9
            :3.5;

    if(difficulty==="easy")
        speed=
            keys.shift
                ?6.1
                :3.8;

    if(difficulty==="hard")
        speed=
            keys.shift
                ?6.3
                :3.4;

    if(difficulty==="nightmare")
        speed=
            keys.shift
                ?6.5
                :3.25;

    const sin=Math.sin(yaw);
    const cos=Math.cos(yaw);

    const dx=
        (
            side*cos+
            forward*sin
        )*
        speed*
        dt;

    const dz=
        (
            -side*sin+
            forward*cos
        )*
        speed*
        dt;

    const nextX=
        player.position.x+dx;

    const nextZ=
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    )
        player.position.x=nextX;

    if(
        !collides(
            player.position.x,
            nextZ
        )
    )
        player.position.z=nextZ;

    if(
        jumpPressed &&
        grounded
    ){

        velocityY=6.2;
        grounded=false;
    }

    jumpPressed=false;

    velocityY-=20*dt;

    player.position.y+=
        velocityY*dt;

    if(player.position.y<=0){

        player.position.y=0;
        velocityY=0;
        grounded=true;
    }

    if(playerInHole()){

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }

    checkExit();
}


/* =====================================================
   FALL INTRO
===================================================== */

function updateFall(dt){

    fallTimer+=dt;

    const progress=
        Math.min(
            fallTimer/
            FALL_DURATION,
            1
        );

    const eased=
        1-
        Math.pow(
            1-progress,
            3
        );

    player.position.y=
        17-
        17*eased;

    camera.position.y=
        EYE_HEIGHT;

    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                progress*1.3,
                1
            )
        );

    camera.rotation.z=
        Math.sin(
            progress*
            Math.PI*
            9
        )*.025;

    if(progress>=1){

        fallingIntoLevel=false;

        player.position.y=0;

        camera.position.set(
            0,
            EYE_HEIGHT,
            0
        );

        camera.rotation.set(
            0,
            0,
            0
        );

        requestPointerLock();
    }
}


/* =====================================================
   CAMERA MOVEMENT / SECURITY CAMERA
===================================================== */

let cameraTime=0;
let cameraShake=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;

    cameraTime+=dt;

    const moving=
        keys.w||
        keys.a||
        keys.s||
        keys.d;

    const amount=
        moving
            ?.009
            :.0025;

    /*
       Subtle handheld/security-camera motion.
    */

    camera.position.x=
        Math.sin(cameraTime*3.4)*
        amount;

    camera.position.y=
        EYE_HEIGHT+
        Math.sin(cameraTime*4.1)*
        amount;

    camera.position.z=
        Math.cos(cameraTime*3.1)*
        amount*.55;

    camera.rotation.z=
        Math.sin(cameraTime*.9)*
        .003;

    /*
       Rare CRT/security-camera bump.
    */

    if(Math.random()<.0035)
        cameraShake=
            .025+
            Math.random()*.035;

    if(cameraShake>0){

        cameraShake=
            Math.max(
                0,
                cameraShake-dt*.09
            );

        camera.position.x+=
            (Math.random()-.5)*
            cameraShake;

        camera.position.y+=
            (Math.random()-.5)*
            cameraShake;

        camera.rotation.z+=
            (Math.random()-.5)*
            cameraShake;
    }
}


/* =====================================================
   RANDOM TRACKING
===================================================== */

let trackingTimer=0;

function updateTracking(dt){

    trackingTimer-=dt;

    if(trackingTimer<=0){

        trackingTimer=
            4+
            Math.random()*12;

        if(Math.random()<.35){

            const bar=
                document.getElementById(
                    "tracking"
                );

            bar.classList.remove(
                "active"
            );

            void bar.offsetWidth;

            bar.classList.add(
                "active"
            );
        }
    }
}


/* =====================================================
   EXIT
===================================================== */

function checkExit(){

    if(
        !exitObject||
        dead
    )
        return;

    const distance=
        Math.hypot(

            player.position.x-exitX,

            player.position.z-exitZ
        );

    if(distance<1.8)
        winGame();
}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.2;
}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";
    }
}


/* =====================================================
   DEATH
===================================================== */

function killPlayer(
    reason="THE BACKROOMS GOT YOU"
){

    if(
        dead||
        !running
    )
        return;

    dead=true;

    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU DIED";

    document.getElementById(
        "deathTitle"
    ).className="";

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "retryBtn"
    ).textContent="RETRY";

    document.getElementById(
        "death"
    ).style.display="flex";
}


/* =====================================================
   WIN
===================================================== */

function winGame(){

    if(
        dead||
        !running
    )
        return;

    dead=true;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU ESCAPED";

    document.getElementById(
        "deathTitle"
    ).className="win";

    document.getElementById(
        "deathText"
    ).textContent=
        "YOU FOUND THE EXIT";

    document.getElementById(
        "retryBtn"
    ).textContent=
        "PLAY AGAIN";

    document.getElementById(
        "death"
    ).style.display="flex";
}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    if(
        !running||
        dead||
        fallingIntoLevel
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
            ?"flex"
            :"none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        requestPointerLock();
    }
}


/* =====================================================
   MENU
===================================================== */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";
}


/* =====================================================
   START
===================================================== */

async function startGame(){

    /*
       Load the textures first.
    */

    if(
        !wallTexture||
        !floorTexture||
        !ceilingTexture
    )
        await loadTextures();

    clearWorld();

    player.position.set(
        -92,
        17,
        -70
    );

    yaw=.25;
    pitch=-.28;

    velocityY=0;
    grounded=false;

    createFloor();
    createCeiling();

    buildFloorPlan();
    createHoleRoom();
    createExit();
    buildLighting();

    await createEntity();

    entity.position.set(
        55,
        .775,
        -48
    );

    entityDirection.set(
        1,
        0
    );

    entityVelocity.set(
        0,
        0
    );

    lastSeen=99;

    running=true;
    paused=false;
    dead=false;

    fallingIntoLevel=true;
    fallTimer=0;

    recordingTime=0;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x=pitch;
    camera.rotation.z=0;

    player.rotation.y=yaw;

    showMessage(
        "ENTERING LEVEL 0..."
    );
}


/* =====================================================
   DIFFICULTY
===================================================== */

function setDifficulty(value){

    difficulty=value;

    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(button=>{
            button.classList.remove(
                "selected"
            );
        });

    const id=
        value==="nightmare"
            ?"nightmareBtn"
            :value+"Btn";

    document.getElementById(
        id
    ).classList.add(
        "selected"
    );

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();
}

document.getElementById(
    "easyBtn"
).onclick=
    ()=>setDifficulty("easy");

document.getElementById(
    "normalBtn"
).onclick=
    ()=>setDifficulty("normal");

document.getElementById(
    "hardBtn"
).onclick=
    ()=>setDifficulty("hard");

document.getElementById(
    "nightmareBtn"
).onclick=
    ()=>setDifficulty("nightmare");

document.getElementById(
    "startBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "resumeBtn"
).onclick=
    ()=>togglePause();

document.getElementById(
    "restartBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "menuBtn"
).onclick=
    ()=>returnToMenu();

document.getElementById(
    "retryBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "deathMenuBtn"
).onclick=
    ()=>returnToMenu();


/* =====================================================
   POINTER LOCK
===================================================== */

function requestPointerLock(){

    if(
        running&&
        !paused&&
        !dead
    ){

        document.body
            .requestPointerLock?.();
    }
}

document.addEventListener(
    "click",
    event=>{

        /*
           Do not steal mouse control while
           clicking menu buttons.
        */

        if(
            event.target.closest(
                "button"
            )
        )
            return;

        if(
            running&&
            !paused&&
            !dead&&
            !fallingIntoLevel
        )
            requestPointerLock();
    }
);


/* =====================================================
   MENU IMAGES
===================================================== */

const menuImages=
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex=0;

function cycleMenuImage(){

    if(!menuImages.length)
        return;

    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );

    menuIndex=
        (
            menuIndex+1
        )%
        menuImages.length;

    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}

setInterval(
    cycleMenuImage,
    60000
);


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio||1,
                1.35
            )
        );
    }
);


/* =====================================================
   TIMER
===================================================== */

const clock=
    new THREE.Clock();

let recordingTime=0;

function updateTimer(dt){

    if(
        !running||
        paused
    )
        return;

    recordingTime+=dt;

    const total=
        Math.floor(
            recordingTime
        );

    const hours=
        Math.floor(
            total/3600
        );

    const minutes=
        Math.floor(
            (total%3600)/60
        );

    const seconds=
        total%60;

    const format=
        n=>
            String(n)
                .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        `${format(hours)}:`+
        `${format(minutes)}:`+
        `${format(seconds)}`;
}


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running&&
        !paused&&
        !dead
    ){

        updatePlayer(dt);
        updateEntity(dt);
        updateLights(dt);
        updateCamera(dt);
        updateEntityAudio();
        updateMessage(dt);
        updateTimer(dt);
        updateTracking(dt);

    }else{

        updateEntityAudio();
    }

    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadTextures();

animate();

</script>

</body>
</html>
