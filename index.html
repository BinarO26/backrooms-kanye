<script type="module">

import * as THREE
    from "./three.module.js";

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

let gameTime = 0;

let messageTimer = 0;

/*
    IMPORTANT:

    The entity is NOT created when the level starts.

    It waits 30 seconds.
*/

const ENTITY_SPAWN_DELAY = 30;

let entitySpawnTimer =
    ENTITY_SPAWN_DELAY;

let entityHasSpawned = false;

/* =========================================================
   RENDERER
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x3f3d2b
    );

/*
    Fog is darker than the world,
    but not so strong that it erases
    the textures.
*/

scene.fog =
    new THREE.Fog(
        0x29281e,
        28,
        115
    );

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .04,
        350
    );

const renderer =
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:
            "high-performance"

    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.25
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

/*
    Keep tone mapping relatively neutral.

    Too much exposure here was one of the
    reasons the previous environment became
    either completely dark or washed out.
*/

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.15;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE = 3;

const WALL_HEIGHT = 9;

const PLAYER_RADIUS = .42;

const EYE_HEIGHT = 5.25;

const CROUCH_EYE_HEIGHT = 3.25;

/*
    Faster player.

    This is deliberately much quicker than
    the old WALK_SPEED.
*/

const WALK_SPEED = 8.2;

const SPRINT_SPEED = 13.5;

const JUMP_SPRINT_SPEED = 15.0;

const GRAVITY = 21;

const JUMP_SPEED = 7.8;

/* =========================================================
   GLOBAL LIGHTING
========================================================= */

/*
    This gives the world enough base visibility
    to prevent textures from disappearing.

    The local fluorescent lights then provide
    the dramatic lighting.
*/

const hemi =
    new THREE.HemisphereLight(
        0xffdf9b,
        0x17160f,
        0.82
    );

scene.add(hemi);

const ambient =
    new THREE.AmbientLight(
        0xffd99a,
        0.22
    );

scene.add(ambient);

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;

function configureTexture(
    texture,
    repeatX,
    repeatY
){

    /*
        Explicitly tell Three.js these are
        color textures.

        This prevents the PNGs from becoming
        extremely dark or gray.
    */

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer
                .capabilities
                .getMaxAnisotropy(),
            4
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(
    path,
    repeatX,
    repeatY
){

    return new Promise(
        (resolve,reject)=>{

            textureLoader.load(

                path,

                texture=>{

                    console.log(
                        "LOADED:",
                        path
                    );

                    resolve(
                        configureTexture(
                            texture,
                            repeatX,
                            repeatY
                        )
                    );

                },

                undefined,

                error=>{

                    console.error(
                        "TEXTURE ERROR:",
                        path,
                        error
                    );

                    reject(
                        new Error(
                            "Could not load " +
                            path
                        )
                    );

                }

            );

        }
    );

}

async function loadTextures(){

    wallTexture =
        await loadTexture(
            "./textures/wall.png",
            1.1,
            1.1
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

}

/* =========================================================
   MATERIALS
========================================================= */

/*
    MeshStandardMaterial is used again.

    Unlike the previous version, the scene now has
    enough ambient illumination that these materials
    remain visible while still reacting to the lights.
*/

const wallMaterial =
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xffffff,

        roughness:.88,

        metalness:0,

        side:
            THREE.DoubleSide

    });

const floorMaterial =
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xffffff,

        roughness:.96,

        metalness:0,

        side:
            THREE.DoubleSide

    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xffffff,

        roughness:.88,

        metalness:0,

        side:
            THREE.DoubleSide

    });

function applyTextures(){

    wallMaterial.map =
        wallTexture;

    floorMaterial.map =
        floorTexture;

    ceilingMaterial.map =
        ceilingTexture;

    wallMaterial.needsUpdate=true;

    floorMaterial.needsUpdate=true;

    ceilingMaterial.needsUpdate=true;

}

/* =========================================================
   MAP
========================================================= */

let mapWidth = 0;
let mapHeight = 0;

let mapData = [];

let playerSpawn = null;
let entitySpawn = null;

const wallColliders = [];

const holeCells = [];

const hideCells = [];

const walkableCells = [];

/* =========================================================
   MAP HELPERS
========================================================= */

function insideMap(x,y){

    return (
        x >= 0 &&
        y >= 0 &&
        x < mapWidth &&
        y < mapHeight
    );

}

function isHole(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x] === "hole"
    );

}

function isWalkableCell(x,y){

    if(
        !insideMap(x,y)
    )
        return false;

    return (
        mapData[y][x] !== "wall"
    );

}

/* =========================================================
   MAP PIXEL CLASSIFICATION
========================================================= */

function classifyPixel(
    r,
    g,
    b,
    a
){

    if(a < 20)
        return "floor";

    /*
        BLACK / DARK = WALL
    */

    if(
        r < 80 &&
        g < 80 &&
        b < 80
    )
        return "wall";

    /*
        RED = PLAYER
    */

    if(
        r > 150 &&
        r > g * 1.4 &&
        r > b * 1.4
    )
        return "spawn";

    /*
        BLUE = ENTITY
    */

    if(
        b > 125 &&
        b > r * 1.3 &&
        b > g * 1.15
    )
        return "entity";

    /*
        PURPLE = LOCKER
    */

    if(
        r > 105 &&
        b > 105 &&
        g < 115
    )
        return "hide";

    /*
        YELLOW / ORANGE = HOLE
    */

    if(
        r > 135 &&
        g > 115 &&
        b < 125
    )
        return "hole";

    return "floor";

}

/* =========================================================
   COORDINATES
========================================================= */

function cellToWorld(
    x,
    y
){

    return {

        x:
            (x+.5)*TILE -
            mapWidth*TILE*.5,

        z:
            (y+.5)*TILE -
            mapHeight*TILE*.5

    };

}

function worldToCell(
    x,
    z
){

    return {

        x:
            Math.floor(
                (
                    x +
                    mapWidth*TILE*.5
                ) / TILE
            ),

        y:
            Math.floor(
                (
                    z +
                    mapHeight*TILE*.5
                ) / TILE
            )

    };

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image =
        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();

                img.onload =
                    ()=>resolve(img);

                img.onerror =
                    ()=>reject(
                        new Error(
                            "textures/map1.png failed."
                        )
                    );

                img.src =
                    "./textures/map1.png";

            }
        );

    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        mapWidth;

    canvas.height =
        mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row=[];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i =
                (
                    y*mapWidth+x
                )*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(
                type !== "wall"
            ){

                walkableCells.push({
                    x,
                    y
                });

            }

            if(
                type === "hole"
            ){

                holeCells.push({
                    x,
                    y
                });

            }

            if(
                type === "hide"
            ){

                hideCells.push({
                    x,
                    y
                });

            }

            if(
                type === "spawn" &&
                !playerSpawn
            ){

                playerSpawn =
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type === "entity" &&
                !entitySpawn
            ){

                entitySpawn =
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

        mapData.push(row);

    }

    /*
        Fallback player position.
    */

    if(!playerSpawn){

        const c =
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        if(!c){

            throw new Error(
                "map1.png has no walkable area."
            );

        }

        playerSpawn =
            cellToWorld(
                c.x,
                c.y
            );

    }

    /*
        Fallback entity position.

        The entity will still wait 30 seconds
        before actually appearing.
    */

    if(!entitySpawn){

        const pc =
            worldToCell(
                playerSpawn.x,
                playerSpawn.z
            );

        let farthest=null;

        let farthestDistance=-1;

        for(
            const c of walkableCells
        ){

            const d =
                Math.hypot(
                    c.x-pc.x,
                    c.y-pc.y
                );

            if(
                d >
                farthestDistance
            ){

                farthestDistance=d;
                farthest=c;

            }

        }

        if(farthest){

            entitySpawn =
                cellToWorld(
                    farthest.x,
                    farthest.y
                );

        }

    }

    console.log(
        "MAP SIZE:",
        mapWidth,
        "x",
        mapHeight
    );

    console.log(
        "HOLES:",
        holeCells.length
    );

    console.log(
        "LOCKERS:",
        hideCells.length
    );

}

/* =========================================================
   COLLISION
========================================================= */

function addWallCollider(
    x,
    z
){

    wallColliders.push({

        minX:
            x-TILE*.5,

        maxX:
            x+TILE*.5,

        minZ:
            z-TILE*.5,

        maxZ:
            z+TILE*.5

    });

}

function collides(
    x,
    z,
    radius=PLAYER_RADIUS
){

    for(
        const wall
        of wallColliders
    ){

        if(
            x+radius >
                wall.minX &&
            x-radius <
                wall.maxX &&
            z+radius >
                wall.minZ &&
            z-radius <
                wall.maxZ
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    wallColliders.length=0;

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                mapData[y][x];

            const p =
                cellToWorld(
                    x,
                    y
                );

            if(
                type==="wall"
            ){

                addWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
                NORMAL FLOOR.
            */

            if(
                type!=="hole"
            ){

                addFloor(
                    p.x,
                    p.z
                );

            }

            /*
                CEILING ALWAYS EXISTS.

                This means holes still have
                ceiling tiles above them.
            */

            addCeiling(
                p.x,
                p.z
            );

        }

    }

    /*
        3D holes.
    */

    for(
        const h of holeCells
    ){

        addHoleCell(
            h.x,
            h.y
        );

    }

    /*
        Visible lockers.
    */

    for(
        const h of hideCells
    ){

        const p =
            cellToWorld(
                h.x,
                h.y
            );

        addLocker(
            p.x,
            p.z
        );

    }

}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(
    dx,
    dz
){

    const nextX =
        player.position.x+dx;

    const nextZ =
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x=
            nextX;

    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z=
            nextZ;

    }

}

/* =========================================================
   HOLE DETECTION
========================================================= */

function playerFullyOverHole(){

    /*
        The entire player's footprint has
        to be inside the same hole area.

        This is why you can jump over them.
    */

    const r =
        PLAYER_RADIUS;

    const samples=[

        [0,0],

        [r,0],
        [-r,0],

        [0,r],
        [0,-r],

        [r*.707,r*.707],
        [-r*.707,r*.707],

        [r*.707,-r*.707],
        [-r*.707,-r*.707]

    ];

    for(
        const [ox,oz]
        of samples
    ){

        const c =
            worldToCell(
                player.position.x+ox,
                player.position.z+oz
            );

        if(
            !insideMap(
                c.x,
                c.y
            )
        )
            return false;

        if(
            !isHole(
                c.x,
                c.y
            )
        )
            return false;

    }

    return true;

}

function checkHole(){

    if(
        falling ||
        !grounded
    )
        return;

    if(
        playerFullyOverHole()
    ){

        falling=true;

        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest=null;

    let closestDistance=
        Infinity;

    for(
        const spot
        of hidingObjects
    ){

        const d =
            Math.hypot(

                player.position.x-
                spot.x,

                player.position.z-
                spot.z

            );

        if(
            d<closestDistance
        ){

            closestDistance=d;

            closest=spot;

        }

    }

    const near =
        closest &&
        closestDistance<1.9;

    hidden =
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near&&!hidden
        ? "1"
        : "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ? "1"
        : "0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    /*
        FALLING
    */

    if(falling){

        fallTimer+=dt;

        const p =
            Math.min(
                fallTimer/1.5,
                1
            );

        player.position.y=
            -p*5;

        camera.position.y=
            EYE_HEIGHT-p*1.4;

        camera.rotation.z=
            Math.sin(
                fallTimer*18
            )*.035;

        if(
            fallTimer>=1.5
        ){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching=
        !!keys.c;

    let forward=0;

    let strafe=0;

    if(keys.w)
        forward++;

    if(keys.s)
        forward--;

    if(keys.d)
        strafe++;

    if(keys.a)
        strafe--;

    const length =
        Math.hypot(
            forward,
            strafe
        );

    if(length>0){

        forward/=length;

        strafe/=length;

        const sprinting =
            !!(
                keys.shift &&
                !crouching
            );

        let speed =
            sprinting
            ? SPRINT_SPEED
            : WALK_SPEED;

        /*
            Jump sprint gets the largest speed.
        */

        if(
            sprinting &&
            !grounded
        ){

            speed=
                JUMP_SPRINT_SPEED;

        }

        if(crouching)
            speed*=.55;

        const sin=
            Math.sin(yaw);

        const cos=
            Math.cos(yaw);

        const dx=
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz=
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    /*
        Gravity.
    */

    velocityY-=
        GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;

        velocityY=0;

        grounded=true;

    }else{

        grounded=false;

    }

    /*
        Jump.
    */

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;

        keys.spacePressed=false;

    }

    if(!keys.space)
        keys.spacePressed=false;

    /*
        Smooth crouching.
    */

    const targetHeight=
        crouching
        ? CROUCH_EYE_HEIGHT
        : EYE_HEIGHT;

    camera.position.y=
        THREE.MathUtils.lerp(

            camera.position.y,

            targetHeight,

            Math.min(
                dt*12,
                1
            )

        );

    updateHiding();

    checkHole();

}

/* =========================================================
   PATHFINDING
========================================================= */

function findPath(
    start,
    goal
){

    if(
        !insideMap(
            start.x,
            start.y
        ) ||
        !insideMap(
            goal.x,
            goal.y
        )
    )
        return [];

    if(
        !isWalkableCell(
            goal.x,
            goal.y
        )
    ){

        let nearest=null;

        let best=Infinity;

        for(
            const c
            of walkableCells
        ){

            const d=
                Math.abs(
                    c.x-goal.x
                )+
                Math.abs(
                    c.y-goal.y
                );

            if(d<best){

                best=d;

                nearest=c;

            }

        }

        if(!nearest)
            return [];

        goal=nearest;

    }

    const queue=[start];

    const parent=
        new Map();

    const visited=
        new Set();

    const key=
        p=>
            p.x+","+p.y;

    visited.add(
        key(start)
    );

    const dirs=[

        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}

    ];

    let iterations=0;

    while(
        queue.length &&
        iterations++<6000
    ){

        const current=
            queue.shift();

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            const path=[];

            let p=current;

            while(p){

                path.push(p);

                p=
                    parent.get(
                        key(p)
                    );

            }

            path.reverse();

            return path;

        }

        for(
            const d
            of dirs
        ){

            const next={

                x:
                    current.x+d.x,

                y:
                    current.y+d.y

            };

            const k=
                key(next);

            if(
                visited.has(k)
            )
                continue;

            if(
                !isWalkableCell(
                    next.x,
                    next.y
                )
            )
                continue;

            visited.add(k);

            parent.set(
                k,
                current
            );

            queue.push(next);

        }

    }

    return [];

}

/* =========================================================
   ENTITY RECOVERY
========================================================= */

function teleportEntityNearPlayer(){

    if(!entity)
        return;

    const pc=
        worldToCell(

            player.position.x,

            player.position.z

        );

    let candidates=[];

    for(
        const c
        of walkableCells
    ){

        const distance=
            Math.hypot(

                c.x-pc.x,

                c.y-pc.y

            );

        if(
            distance>=20
        ){

            candidates.push({

                cell:c,

                distance

            });

        }

    }

    if(
        !candidates.length
    )
        return;

    candidates.sort(

        (a,b)=>
            Math.abs(
                a.distance-28
            )-
            Math.abs(
                b.distance-28
            )

    );

    const selected=
        candidates[
            Math.floor(

                Math.random()*
                Math.min(
                    candidates.length,
                    20
                )

            )
        ];

    const p=
        cellToWorld(

            selected.cell.x,

            selected.cell.y

        );

    entity.position.x=
        p.x;

    entity.position.z=
        p.z;

    entity.position.y=
        3.9;

    entityPath=[];

    entityPathIndex=0;

    entityStuckTimer=0;

    entityStuckChecks=0;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        !gameStarted ||
        paused ||
        dead
    )
        return;

    /*
        Constantly knows the player's location.
    */

    entityRepathTimer-=dt;

    if(
        entityRepathTimer<=0
    ){

        entityRepathTimer=
            difficulty==="nightmare"
            ? .18
            : .30;

        updateEntityPath();

    }

    if(
        entityPath.length<=1
    ){

        entityStuckTimer+=dt;

        if(
            entityStuckTimer>1.5
        ){

            teleportEntityNearPlayer();

        }

        return;

    }

    const targetCell=
        entityPath[
            Math.min(
                entityPathIndex,
                entityPath.length-1
            )
        ];

    const target=
        cellToWorld(

            targetCell.x,

            targetCell.y

        );

    let dx=
        target.x-
        entity.position.x;

    let dz=
        target.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    if(
        distance<.18
    ){

        entityPathIndex++;

        return;

    }

    dx/=distance;

    dz/=distance;

    const speed=
        entitySpeed();

    const nx=
        entity.position.x+
        dx*speed*dt;

    const nz=
        entity.position.z+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz,
            .38
        )
    ){

        entity.position.x=
            nx;

        entity.position.z=
            nz;

    }else{

        entityStuckTimer+=dt;

    }

    const moved=
        Math.hypot(

            entity.position.x-
            entityLastX,

            entity.position.z-
            entityLastZ

        );

    if(
        moved<.015
    )
        entityStuckChecks++;
    else
        entityStuckChecks=0;

    entityLastX=
        entity.position.x;

    entityLastZ=
        entity.position.z;

    if(
        entityStuckChecks>22 ||
        entityStuckTimer>1.8
    ){

        teleportEntityNearPlayer();

    }

    entityStuckTimer=
        Math.max(
            0,
            entityStuckTimer-dt
        );

    /*
        Billboard.

        The PNG remains a square.
    */

    entity.lookAt(
        camera.position.x,
        entity.position.y,
        camera.position.z
    );

    /*
        Entity catches the player.
    */

    const playerDistance=
        Math.hypot(

            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z

        );

    if(
        playerDistance<1.35 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   ENTITY AUDIO
========================================================= */

const entityAudio=
    new Audio(
        "./sounds/entity.mp3"
    );

entityAudio.loop=true;

entityAudio.preload="auto";

entityAudio.volume=0;

let audioStarted=false;

function startEntityAudio(){

    if(audioStarted)
        return;

    audioStarted=true;

    entityAudio
        .play()
        .catch(
            ()=>{}
        );

}

/*
    Gradually increases based on distance.
*/

let entityVolume=0;

function updateEntityAudio(){

    if(
        !entity ||
        !gameStarted ||
        dead
    ){

        entityVolume=0;

        entityAudio.volume=0;

        return;

    }

    const distance=
        Math.hypot(

            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z

        );

    const HEAR_DISTANCE=55;

    let volume=
        1-
        distance/
        HEAR_DISTANCE;

    volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    /*
        Makes it quiet from far away,
        then progressively much louder.
    */

    volume=
        Math.pow(
            volume,
            .70
        );

    entityVolume=
        THREE.MathUtils.lerp(
            entityVolume,
            volume,
            .075
        );

    entityAudio.volume=
        entityVolume;

    if(
        entityAudio.paused &&
        audioStarted
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text
){

    document.getElementById(
        "message"
    ).textContent=
        text;

    messageTimer=2.5;

}

function updateMessage(dt){

    if(
        messageTimer>0
    ){

        messageTimer-=dt;

        if(
            messageTimer<=0
        ){

            document.getElementById(
                "message"
            ).textContent="";

        }

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(
    reason
){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=
        reason;

    document.getElementById(
        "death"
    ).style.display=
        "flex";

    entityAudio.pause();

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   RESET
========================================================= */

function resetPlayer(){

    player.position.set(

        playerSpawn.x,

        0,

        playerSpawn.z

    );

    yaw=0;

    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y=
        EYE_HEIGHT;

    velocityY=0;

    grounded=true;

    falling=false;

    fallTimer=0;

    crouching=false;

    hidden=false;

}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display=
        "none";

    document.getElementById(
        "pause"
    ).style.display=
        "none";

    document.getElementById(
        "death"
    ).style.display=
        "none";

    gameStarted=true;

    paused=false;

    dead=false;

    gameTime=0;

    /*
        RESET THE 30 SECOND TIMER.
    */

    entitySpawnTimer=
        ENTITY_SPAWN_DELAY;

    entityHasSpawned=false;

    /*
        Remove previous entity.
    */

    if(entity){

        world.remove(
            entity
        );

        if(
            entity.geometry
        )
            entity.geometry.dispose();

        if(
            entity.material
        )
            entity.material.dispose();

        entity=null;

    }

    resetPlayer();

    entityAudio.currentTime=0;

    entityVolume=0;

    audioStarted=false;

    /*
        Audio exists but is silent until
        entity actually spawns.
    */

    entityAudio.volume=0;

    /*
        DO NOT spawn entity yet.
    */

    showMessage(
        "30 SECONDS."
    );

    renderer.domElement
        .requestPointerLock()
        .catch(
            ()=>{}
        );

}

/* =========================================================
   ENTITY SPAWN TIMER
========================================================= */

function updateEntitySpawn(
    dt
){

    if(
        !gameStarted ||
        paused ||
        dead ||
        entityHasSpawned
    )
        return;

    entitySpawnTimer-=dt;

    const remaining=
        Math.ceil(
            entitySpawnTimer
        );

    /*
        Small notification only near
        the end of the countdown.
    */

    if(
        remaining<=5 &&
        remaining>0
    ){

        document.getElementById(
            "message"
        ).textContent=
            "SOMETHING IS COMING... "+
            remaining;

    }

    if(
        entitySpawnTimer<=0
    ){

        entityHasSpawned=true;

        createEntity();

        entityAudio.currentTime=0;

        audioStarted=false;

        /*
            Start the MP3 now that the entity
            actually exists.

            It begins at volume 0 and gets louder
            as the entity approaches.
        */

        startEntityAudio();

        showMessage(
            "SOMETHING ENTERED LEVEL 0."
        );

    }

}

/* =========================================================
   RETURN MENU
========================================================= */

function returnToMenu(){

    gameStarted=false;

    paused=false;

    dead=false;

    entityAudio.pause();

    entityAudio.currentTime=0;

    document.getElementById(
        "pause"
    ).style.display=
        "none";

    document.getElementById(
        "death"
    ).style.display=
        "none";

    document.getElementById(
        "menu"
    ).style.display=
        "block";

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ? "flex"
        : "none";

    if(paused){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display=
        "flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display=
        "none";

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key=
            event.key.toLowerCase();

        keys[key]=true;

        if(
            event.code==="Space"
        ){

            event.preventDefault();

            keys.spacePressed=true;

        }

        if(
            key==="escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();

                return;

            }

            if(gameStarted)
                togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;

        if(
            event.code==="Space"
        ){

            keys.space=false;

        }

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            event.movementX*.002;

        pitch-=
            event.movementY*.0017;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;

    }
);

/* =========================================================
   CLICK TO LOCK
========================================================= */

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(
                    ()=>{}
                );

            /*
                Browser audio permission.
            */

            if(
                entityHasSpawned
            ){

                startEntityAudio();

            }

        }

    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).addEventListener(

);

document.getElementById(
    "menuControlsBtn"
).addEventListener(

);

document.getElementById(

);

);

);

document.getElementById(
    "restartBtn"
).addEventListener(

);

document.getElementById(
    "retryBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "menuBtn"
).addEventListener(

);

document.getElementById(
    "deathMenuBtn"
).addEventListener(

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function selectDifficulty(
    value
){

    difficulty=value;

    for(
        const name
        in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty(
        "easy"
    );

difficultyButtons.normal.onclick=
    ()=>selectDifficulty(
        "normal"
    );

difficultyButtons.hard.onclick=
    ()=>selectDifficulty(
        "hard"
    );

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty(
        "nightmare"
    );

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(
            !menuImages.length
        )
            return;

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   FLUORESCENT FLICKER
========================================================= */

function updateLights(dt){

    for(
        const item
        of fluorescentLights
    ){

        item.timer-=dt;

        if(
            item.timer<=0
        ){

            item.timer=
                .6+
                Math.random()*6;

            /*
                Occasional realistic flicker.
            */

            if(
                Math.random()<.10
            ){

                item.light.intensity=
                    item.base*.18;

                item.fixture
                    .material
                    .emissiveIntensity=
                    .5;

                setTimeout(
                    ()=>{

                        item.light.intensity=
                            item.base;

                        item.fixture
                            .material
                            .emissiveIntensity=
                            2.7;

                    },
                    35+
                    Math.random()*100
                );

            }

        }

    }

}

/* =========================================================
   TAPE TIMER
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(
            gameTime
        );

    const h=
        Math.floor(
            total/3600
        );

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const pad=
        n=>
            String(n)
            .padStart(
                2,
                "0"
            );

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+
        pad(m)+":"+
        pad(s);

}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    /*
        Prevent giant physics jumps after
        tab switching or lag spikes.
    */

    dt=
        Math.min(
            dt,
            .033
        );

    updateEntitySpawn(dt);

    updatePlayer(dt);

    updateEntity(dt);

    updateEntityAudio();

    updateLights(dt);

    updateMessage(dt);

    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

   INITIALIZE
========================================================= */

    try{

        console.log(
            "================================"
        );

        console.log(
            "BACKROOMS INITIALIZING"
        );

        console.log(
            "================================"
        );

        /*
            LOAD ACTUAL TEXTURES FIRST.
        */

        await loadTextures();

        applyTextures();

        /*
            LOAD MAP.
        */

        await loadMap();

        /*
            BUILD ENVIRONMENT.
        */

        buildWorld();

        /*
            BUILD CEILING LIGHT GRID.
        */

        buildLights();

        /*
            LOAD ENTITY PNG.
        */

        await loadEntityTexture();

        /*
            LOAD ENTITY AUDIO.
        */

        entityAudio.load();

        console.log(
            "================================"
        );

        console.log(
            "BACKROOMS READY"
        );

        console.log(
            "ENTITY SPAWN DELAY:",
            ENTITY_SPAWN_DELAY,
            "SECONDS"
        );

        console.log(

        );

    }catch(error){

        console.error(
            error
        );

        const box=
            document.getElementById(

            );

        box.style.display=

        box.textContent=

            );

    }

}

initialize();
