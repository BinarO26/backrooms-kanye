<script type="module">

import * as THREE from "./three.module.js";

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted=false;
let paused=false;
let dead=false;

let difficulty="normal";

let gameTime=0;
let messageTimer=0;

/*
    ENTITY DOES NOT EXIST FOR THE FIRST 30 SECONDS.
*/
const ENTITY_DELAY=30;

let entitySpawnTimer=0;
let entitySpawned=false;

/* =========================================================
   THREE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x29271c);

scene.fog=new THREE.FogExp2(
    0x29271c,
    .018
);

const camera=new THREE.PerspectiveCamera(
    78,
    innerWidth/innerHeight,
    .05,
    300
);

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio||1,
        1.15
    )
);

renderer.outputColorSpace=THREE.SRGBColorSpace;

renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.72;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   WORLD
========================================================= */

const world=new THREE.Group();
scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE=3;
const WALL_HEIGHT=9;

const PLAYER_RADIUS=.42;

const EYE_HEIGHT=5.25;
const CROUCH_EYE_HEIGHT=3.25;

/*
    Faster movement.
*/
const WALK_SPEED=8.0;
const SPRINT_SPEED=13.5;
const JUMP_SPRINT_SPEED=15.0;

const GRAVITY=21;
const JUMP_SPEED=8.4;

/* =========================================================
   LIGHTING
========================================================= */

/*
    Dark ambient illumination.
    This prevents the textures from disappearing while
    keeping the environment dramatically dark.
*/

scene.add(
    new THREE.HemisphereLight(
        0xffe3a0,
        0x080806,
        .34
    )
);

scene.add(
    new THREE.AmbientLight(
        0x776b42,
        .18
    )
);

const fluorescentLights=[];

/* =========================================================
   TEXTURES
========================================================= */

const loader=new THREE.TextureLoader();

function configureTexture(texture,repeatX=1,repeatY=1){

    texture.colorSpace=THREE.SRGBColorSpace;

    texture.wrapS=THREE.RepeatWrapping;
    texture.wrapT=THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter=THREE.LinearFilter;
    texture.minFilter=THREE.LinearMipmapLinearFilter;

    texture.anisotropy=
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(path,rx,ry){

    return new Promise(
        (resolve,reject)=>{

            loader.load(

                path,

                tex=>{
                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        configureTexture(
                            tex,
                            rx,
                            ry
                        )
                    );
                },

                undefined,

                err=>{
                    console.error(
                        "TEXTURE ERROR:",
                        path,
                        err
                    );

                    reject(
                        new Error(
                            "Could not load "+path
                        )
                    );
                }

            );

        }
    );

}

let wallTexture;
let floorTexture;
let ceilingTexture;

async function loadTextures(){

    wallTexture=
        await loadTexture(
            "./textures/wall.png",
            1,
            1
        );

    floorTexture=
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );

    ceilingTexture=
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

}

/* =========================================================
   MATERIALS
========================================================= */

/*
    Standard materials are used so lighting actually affects
    the textures.

    The maps themselves are always present.
*/

const wallMaterial=
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xffffff,

        roughness:.92,
        metalness:0,

        side:THREE.DoubleSide

    });

const floorMaterial=
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xffffff,

        roughness:.96,
        metalness:0,

        side:THREE.DoubleSide

    });

const ceilingMaterial=
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xffffff,

        roughness:.9,
        metalness:0,

        side:THREE.DoubleSide

    });

function applyTextures(){

    wallMaterial.map=wallTexture;
    floorMaterial.map=floorTexture;
    ceilingMaterial.map=ceilingTexture;

    wallMaterial.needsUpdate=true;
    floorMaterial.needsUpdate=true;
    ceilingMaterial.needsUpdate=true;

}

/* =========================================================
   MAP
========================================================= */

let mapWidth=0;
let mapHeight=0;
let mapData=[];

let playerSpawn=null;
let entitySpawn=null;

const wallColliders=[];
const holeCells=[];
const hideCells=[];
const walkableCells=[];

function insideMap(x,y){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function isHole(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]==="hole"
    );

}

function isWalkableCell(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]!=="wall"
    );

}

function classifyPixel(r,g,b,a){

    if(a<20)
        return "floor";

    if(
        r<75 &&
        g<75 &&
        b<75
    )
        return "wall";

    if(
        r>150 &&
        r>g*1.4 &&
        r>b*1.4
    )
        return "spawn";

    if(
        b>125 &&
        b>r*1.3 &&
        b>g*1.15
    )
        return "entity";

    if(
        r>105 &&
        b>105 &&
        g<115
    )
        return "hide";

    if(
        r>135 &&
        g>115 &&
        b<125
    )
        return "hole";

    return "floor";

}

function cellToWorld(x,y){

    return {

        x:
            (x+.5)*TILE-
            mapWidth*TILE*.5,

        z:
            (y+.5)*TILE-
            mapHeight*TILE*.5

    };

}

function worldToCell(x,z){

    return {

        x:
            Math.floor(
                (
                    x+
                    mapWidth*TILE*.5
                )/TILE
            ),

        y:
            Math.floor(
                (
                    z+
                    mapHeight*TILE*.5
                )/TILE
            )

    };

}

async function loadMap(){

    const image=
        await new Promise(
            (resolve,reject)=>{

                const img=new Image();

                img.onload=()=>{
                    resolve(img);
                };

                img.onerror=()=>{
                    reject(
                        new Error(
                            "textures/map1.png failed to load."
                        )
                    );
                };

                img.src="./textures/map1.png";

            }
        );

    mapWidth=image.naturalWidth;
    mapHeight=image.naturalHeight;

    const canvas=
        document.createElement("canvas");

    canvas.width=mapWidth;
    canvas.height=mapHeight;

    const ctx=
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels=
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(let y=0;y<mapHeight;y++){

        const row=[];

        for(let x=0;x<mapWidth;x++){

            const i=
                (y*mapWidth+x)*4;

            const type=
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(type!=="wall")
                walkableCells.push({x,y});

            if(type==="hole")
                holeCells.push({x,y});

            if(type==="hide")
                hideCells.push({x,y});

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

        mapData.push(row);

    }

    if(!playerSpawn){

        const c=
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        if(!c)
            throw new Error(
                "No walkable cells in map."
            );

        playerSpawn=
            cellToWorld(
                c.x,
                c.y
            );

    }

    if(!entitySpawn){

        let farthest=null;
        let best=-1;

        const pc=
            worldToCell(
                playerSpawn.x,
                playerSpawn.z
            );

        for(const c of walkableCells){

            const d=
                Math.hypot(
                    c.x-pc.x,
                    c.y-pc.y
                );

            if(d>best){

                best=d;
                farthest=c;

            }

        }

        if(farthest){

            entitySpawn=
                cellToWorld(
                    farthest.x,
                    farthest.y
                );

        }

    }

}

/* =========================================================
   COLLISION
========================================================= */

function addCollider(x,z){

    wallColliders.push({

        minX:x-TILE*.5,
        maxX:x+TILE*.5,

        minZ:z-TILE*.5,
        maxZ:z+TILE*.5

    });

}

function collides(x,z,r=.42){

    for(const w of wallColliders){

        if(
            x+r>w.minX &&
            x-r<w.maxX &&
            z+r>w.minZ &&
            z-r<w.maxZ
        )
            return true;

    }

    return false;

}

/* =========================================================
   FLOOR
========================================================= */

function addFloor(x,z){

    const mesh=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            floorMaterial
        );

    mesh.rotation.x=-Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    world.add(mesh);

}

/* =========================================================
   CEILING
========================================================= */

function addCeiling(x,z){

    const mesh=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            ceilingMaterial
        );

    mesh.rotation.x=Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    world.add(mesh);

}

/* =========================================================
   WALL
========================================================= */

function addWall(x,z){

    const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),
            wallMaterial
        );

    mesh.position.set(
        x,
        WALL_HEIGHT*.5,
        z
    );

    world.add(mesh);

    addCollider(x,z);

}

/* =========================================================
   3D HOLES
========================================================= */

function addHole(x,y){

    const p=
        cellToWorld(
            x,
            y
        );

    /*
        No floor texture is put over this cell.

        Instead there is a real dark shaft.
    */

    const shaftMaterial=
        new THREE.MeshStandardMaterial({
            color:0x080704,
            roughness:1
        });

    const bottom=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE*.92,
                TILE*.92
            ),
            shaftMaterial
        );

    bottom.rotation.x=-Math.PI/2;

    bottom.position.set(
        p.x,
        -5.5,
        p.z
    );

    world.add(bottom);

    /*
        Interior sides.
        These are slightly lighter near the top and
        become extremely dark farther down.
    */

    const sideMaterial=
        new THREE.MeshStandardMaterial({
            color:0x3d3727,
            roughness:1,
            side:THREE.DoubleSide
        });

    const sides=[
        {
            x:p.x,
            y:-2.7,
            z:p.z-TILE/2,
            sx:TILE,
            sy:5.4,
            sz:.08
        },
        {
            x:p.x,
            y:-2.7,
            z:p.z+TILE/2,
            sx:TILE,
            sy:5.4,
            sz:.08
        },
        {
            x:p.x-TILE/2,
            y:-2.7,
            z:p.z,
            sx:.08,
            sy:5.4,
            sz:TILE
        },
        {
            x:p.x+TILE/2,
            y:-2.7,
            z:p.z,
            sx:.08,
            sy:5.4,
            sz:TILE
        }
    ];

    for(const s of sides){

        const side=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    s.sx,
                    s.sy,
                    s.sz
                ),
                sideMaterial
            );

        side.position.set(
            s.x,
            s.y,
            s.z
        );

        world.add(side);

    }

}

/* =========================================================
   LOCKERS
========================================================= */

const hidingObjects=[];

function addLocker(x,z){

    const group=
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    /*
        Metallic gray exterior.
    */

    const metal=
        new THREE.MeshStandardMaterial({

            color:0x858585,

            roughness:.48,
            metalness:.7

        });

    /*
        Noticeably darker interior.
    */

    const interior=
        new THREE.MeshStandardMaterial({

            color:0x080807,

            roughness:1,
            metalness:.05

        });

    /*
        Bright edges.
    */

    const edge=
        new THREE.MeshStandardMaterial({

            color:0xd1d1c4,

            emissive:0x6d684b,
            emissiveIntensity:.28,

            roughness:.3,
            metalness:.8

        });

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.5,
                5.4,
                .7
            ),
            metal
        );

    body.position.y=2.7;

    group.add(body);

    /*
        Dark door panel.
    */

    const darkPanel=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.22,
                5.0,
                .055
            ),
            interior
        );

    darkPanel.position.set(
        0,
        2.7,
        -.38
    );

    group.add(darkPanel);

    /*
        Bright vertical edges.
    */

    for(const sx of [-.67,.67]){

        const bar=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .085,
                    5.35,
                    .10
                ),
                edge
            );

        bar.position.set(
            sx,
            2.7,
            -.43
        );

        group.add(bar);

    }

    /*
        Bright top and bottom.
    */

    for(const yy of [.18,5.22]){

        const bar=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.43,
                    .085,
                    .10
                ),
                edge
            );

        bar.position.set(
            0,
            yy,
            -.43
        );

        group.add(bar);

    }

    /*
        Handle.
    */

    const handle=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .09,
                .45,
                .08
            ),
            edge
        );

    handle.position.set(
        .43,
        2.7,
        -.48
    );

    group.add(handle);

    /*
        Ventilation slots.
    */

    for(let i=-2;i<=2;i++){

        const vent=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .14,
                    .035,
                    .025
                ),
                edge
            );

        vent.position.set(
            i*.18,
            4.8,
            -.48
        );

        group.add(vent);

    }

    world.add(group);

    hidingObjects.push({
        x,
        z,
        group
    });

}

/* =========================================================
   WORLD BUILD
========================================================= */

function buildWorld(){

    for(let y=0;y<mapHeight;y++){

        for(let x=0;x<mapWidth;x++){

            const type=
                mapData[y][x];

            const p=
                cellToWorld(
                    x,
                    y
                );

            if(type==="wall"){

                addWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
                Hole cells have NO floor texture.
            */

            if(type!=="hole"){

                addFloor(
                    p.x,
                    p.z
                );

            }

            /*
                Ceiling always remains loaded.
            */

            addCeiling(
                p.x,
                p.z
            );

        }

    }

    for(const h of holeCells){

        addHole(
            h.x,
            h.y
        );

    }

    for(const h of hideCells){

        const p=
            cellToWorld(
                h.x,
                h.y
            );

        addLocker(
            p.x,
            p.z
        );

    }

}

/* =========================================================
   LIGHT GRID
========================================================= */

/*
    Ceiling pattern:

    ooooo
    ooooo
    ooloo
    ooooo
    ooooo

    The center tile receives the fluorescent light.
*/

function addCeilingLight(x,z){

    /*
        Actual ceiling fixture.
    */

    const fixtureMaterial=
        new THREE.MeshStandardMaterial({

            color:0xfff7d0,

            emissive:0xffe6a0,
            emissiveIntensity:3.0,

            roughness:.25,
            metalness:.05

        });

    const fixture=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE*.86,
                .07,
                TILE*.86
            ),
            fixtureMaterial
        );

    fixture.position.set(
        x,
        WALL_HEIGHT-.055,
        z
    );

    world.add(fixture);

    /*
        Dramatic local light.
        Keep the number low to prevent the previous
        looking-at-floor performance problem.
    */

    const light=
        new THREE.PointLight(
            0xffdca0,
            4.2,
            15,
            1.7
        );

    light.position.set(
        x,
        WALL_HEIGHT-.35,
        z
    );

    scene.add(light);

    fluorescentLights.push({
        light,
        fixture,
        target:4.2,
        phase:Math.random()*10
    });

}

function buildLights(){

    /*
        One light approximately every 5x5 tiles.
    */

    for(
        let y=2;
        y<mapHeight-2;
        y+=5
    ){

        for(
            let x=2;
            x<mapWidth-2;
            x+=5
        ){

            if(
                mapData[y] &&
                mapData[y][x]!=="wall"
            ){

                /*
                    Center light.
                */

                const p=
                    cellToWorld(
                        x,
                        y
                    );

                addCeilingLight(
                    p.x,
                    p.z
                );

            }

        }

    }

}

   PLAYER
========================================================= */

const player=
    new THREE.Object3D();

scene.add(player);
player.add(camera);

camera.position.y=EYE_HEIGHT;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=true;

let crouching=false;
let hidden=false;

let falling=false;
let fallTimer=0;

const keys={};

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(dx,dz){

    const nx=
        player.position.x+dx;

    const nz=
        player.position.z+dz;

    if(
        !collides(
            nx,
            player.position.z
        )
    ){

        player.position.x=nx;

    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){

        player.position.z=nz;

    }

}

/* =========================================================
   HOLE DETECTION
========================================================= */

function fullyOverHole(){

    /*
        Entire player hitbox has to be inside hole.
    */

    const r=PLAYER_RADIUS;

    const samples=[
        [0,0],
        [r,0],
        [-r,0],
        [0,r],
        [0,-r],
        [r*.707,r*.707],
        [-r*.707,r*.707],
        [r*.707,-r*.707],
        [-r*.707,-r*.707]
    ];

    for(const [ox,oz] of samples){

        const c=
            worldToCell(
                player.position.x+ox,
                player.position.z+oz
            );

        if(!isHole(c.x,c.y))
            return false;

    }

    return true;

}

function checkHole(){

    if(
        falling ||
        !grounded
    )
        return;

    if(fullyOverHole()){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest=null;
    let best=Infinity;

    for(const spot of hidingObjects){

        const d=
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(d<best){

            best=d;
            closest=spot;

        }

    }

    const near=
        closest &&
        best<1.9;

    hidden=
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity=
        near&&!hidden
        ?"1"
        :"0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity=
        hidden
        ?"1"
        :"0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const p=
            Math.min(
                fallTimer/1.5,
                1
            );

        player.position.y=
            -p*5;

        camera.position.y=
            EYE_HEIGHT-p*1.4;

        if(fallTimer>=1.5){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching=!!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w)forward++;
    if(keys.s)forward--;
    if(keys.d)strafe++;
    if(keys.a)strafe--;

    const len=
        Math.hypot(
            forward,
            strafe
        );

    if(len>0){

        forward/=len;
        strafe/=len;

        const sprinting=
            keys.shift&&!crouching;

        let speed=
            sprinting
            ?SPRINT_SPEED
            :WALK_SPEED;

        if(
            sprinting&&!grounded
        ){

            speed=
                JUMP_SPRINT_SPEED;

        }

        if(crouching)
            speed*=.58;

        const sin=Math.sin(yaw);
        const cos=Math.cos(yaw);

        const dx=
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz=
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    velocityY-=GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(player.position.y<=0){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY=JUMP_SPEED;
        grounded=false;
        keys.spacePressed=false;

    }

    if(!keys.space)
        keys.spacePressed=false;

    const targetHeight=
        crouching
        ?CROUCH_EYE_HEIGHT
        :EYE_HEIGHT;

    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();
    checkHole();

}

let entityPathIndex=0;
let entityRepathTimer=0;

/* =========================================================
   ENTITY SPEED
========================================================= */

function getEntitySpeed(){

    if(difficulty==="easy")
        return 5.5;

    if(difficulty==="hard")
        return 10.5;

    if(difficulty==="nightmare")
        return JUMP_SPRINT_SPEED;

    return 8.2;

}

/* =========================================================
   PATHFINDING
========================================================= */

function findPath(start,goal){

    if(
        !insideMap(start.x,start.y)||
        !insideMap(goal.x,goal.y)
    )
        return [];

    const key=
        p=>p.x+","+p.y;

    const queue=[start];
    const parent=new Map();
    const visited=new Set();

    visited.add(key(start));

    const dirs=[
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
    ];

    let iterations=0;

    while(
        queue.length&&
        iterations++<5000
    ){

        const current=
            queue.shift();

        if(
            current.x===goal.x&&
            current.y===goal.y
        ){

            const path=[];
            let p=current;

            while(p){

                path.push(p);

                p=
                    parent.get(
                        key(p)
                    );

            }

            path.reverse();

            return path;

        }

        for(const d of dirs){

            const next={
                x:current.x+d.x,
                y:current.y+d.y
            };

            const k=key(next);

            if(visited.has(k))
                continue;

            if(
                !isWalkableCell(
                    next.x,
                    next.y
                )
            )
                continue;

            visited.add(k);

            parent.set(
                k,
                current
            );

            queue.push(next);

        }

    }

    return [];

}

function updateEntityPath(){

    if(!entity)
        return;

    const start=
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const goal=
        worldToCell(
            player.position.x,
            player.position.z
        );

    entityPath=
        findPath(
            start,
            goal
        );

    entityPathIndex=1;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    /*
        30 second delay.
    */

    if(
        gameStarted &&
        !entitySpawned
    ){

        entitySpawnTimer+=dt;

        if(
            entitySpawnTimer>=ENTITY_DELAY
        ){

            entitySpawned=true;

            createEntity();

            showMessage(
                "SOMETHING ENTERED THE LEVEL."
            );

        }

        return;

    }

    if(
        !entity||
        paused||
        dead
    )
        return;

    entityRepathTimer-=dt;

    if(entityRepathTimer<=0){

        entityRepathTimer=
            difficulty==="nightmare"
            ?.15
            :.28;

        updateEntityPath();

    }

    if(entityPath.length<=1){

        entityStuck+=dt;

        return;

    }

    const targetCell=
        entityPath[
            Math.min(
                entityPathIndex,
                entityPath.length-1
            )
        ];

    const target=
        cellToWorld(
            targetCell.x,
            targetCell.y
        );

    let dx=
        target.x-
        entity.position.x;

    let dz=
        target.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    if(distance<.18){

        entityPathIndex++;

        return;

    }

    dx/=distance;
    dz/=distance;

    const speed=getEntitySpeed();

    const nx=
        entity.position.x+
        dx*speed*dt;

    const nz=
        entity.position.z+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz,
            .38
        )
    ){

        entity.position.x=nx;
        entity.position.z=nz;
        entityStuck=0;

    }else{

        entityStuck+=dt;

    }

    /*
        Face the camera while preserving the full PNG.
    */

    entity.rotation.y=
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    const distanceToPlayer=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    if(
        distanceToPlayer<1.3&&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   ENTITY AUDIO
========================================================= */

const entityAudio=
    new Audio(
        "./sounds/entity.mp3"
    );

entityAudio.loop=true;
entityAudio.preload="auto";
entityAudio.volume=0;

let audioAllowed=false;

function startAudio(){

    audioAllowed=true;

    entityAudio
        .play()
        .catch(
            ()=>{}
        );

}

let entityVolume=0;

function updateAudio(){

    if(
        !entitySpawned||
        !entity||
        !gameStarted||
        dead
    ){

        entityVolume=0;
        entityAudio.volume=0;

        return;

    }

    const distance=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    /*
        Quiet from far away.
        Gradually increases as the entity approaches.
    */

    const maxDistance=55;

    let volume=
        1-
        distance/maxDistance;

    volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    volume=
        Math.pow(
            volume,
            .75
        );

    entityVolume=
        THREE.MathUtils.lerp(
            entityVolume,
            volume,
            .07
        );

    entityAudio.volume=
        entityVolume;

    if(
        audioAllowed&&
        entityAudio.paused
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   LIGHT UPDATE
========================================================= */

function updateLights(dt){

    for(const light of fluorescentLights){

        light.phase-=dt;

        if(light.phase<=0){

            light.phase=
                2+
                Math.random()*8;

            /*
                Occasional tiny fluorescent flicker.
            */

            if(
                Math.random()<.12
            ){

                light.light.intensity=
                    .25;

                light.fixture.material
                    .emissiveIntensity=
                    .25;

                setTimeout(
                    ()=>{

                        light.light.intensity=
                            light.target;

                        light.fixture.material
                            .emissiveIntensity=
                            3;

                    },
                    40+
                    Math.random()*90
                );

            }

        }

    }

}

    ).textContent=text;

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "death"
    ).style.display="flex";

    entityAudio.pause();

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   RESET
========================================================= */

function resetGame(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y=
        EYE_HEIGHT;

    yaw=0;
    pitch=0;

    velocityY=0;
    grounded=true;

    falling=false;
    fallTimer=0;

    crouching=false;
    hidden=false;

    gameTime=0;

    entitySpawnTimer=0;
    entitySpawned=false;

    entityPath=[];
    entityPathIndex=0;

    if(entity){

        world.remove(entity);

        entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;

    }

    entityVolume=0;

    entityAudio.pause();
    entityAudio.currentTime=0;

}

/* =========================================================
   START
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    resetGame();

    /*
        Entity deliberately does NOT spawn here.
        Timer starts at 0 and reaches 30 seconds.
    */

    showMessage(
        "FIND YOUR WAY THROUGH LEVEL 0."
    );

    startAudio();

    renderer.domElement
        .requestPointerLock()
        .catch(
            ()=>{}
        );

}

/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    gameStarted=false;
    paused=false;
    dead=false;

    entityAudio.pause();

    if(entity){

        world.remove(entity);

        entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;

    }

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

    if(document.pointerLockElement)
        document.exitPointerLock();

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ?"flex"
        :"none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   INPUT
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        const key=
            e.key.toLowerCase();

        keys[key]=true;

        if(e.code==="Space"){

            e.preventDefault();

            keys.spacePressed=true;

        }

        if(key==="escape"){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                document.getElementById(
                    "controlsBox"
                ).style.display="none";

                return;

            }

            togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

        if(e.code==="Space")
            keys.space=false;

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            !gameStarted||
            paused||
            dead||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            e.movementX*.002;

        pitch-=
            e.movementY*.0017;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted&&
            !paused&&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(
                    ()=>{}
                );

            startAudio();

        }

    }
);

    document.getElementById(
        "controlsBox"
    ).style.display="none";

};

document.getElementById(
    "resumeBtn"
).onclick=()=>{

    paused=false;

    document.getElementById(
        "pause"
    ).style.display="none";

    renderer.domElement
        .requestPointerLock()
        .catch(
            ()=>{}
        );

};

document.getElementById(
    "restartBtn"
).onclick=startGame;

document.getElementById(
    "retryBtn"
).onclick=startGame;

document.getElementById(
    "menuBtn"
).onclick=returnToMenu;

document.getElementById(
    "deathMenuBtn"
).onclick=returnToMenu;

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={
    easy:document.getElementById("easyBtn"),
    normal:document.getElementById("normalBtn"),
    hard:document.getElementById("hardBtn"),
    nightmare:document.getElementById("nightmareBtn")
};

function selectDifficulty(value){

    difficulty=value;

    for(const name in difficultyButtons){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(!menuImages.length)
            return;

        menuImages[
            menuIndex
        ].classList.remove("active");

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add("active");

    },
    6000
);

/* =========================================================
   TAPE TIME
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted||
        paused||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(gameTime);

    const h=
        Math.floor(total/3600);

    const m=
        Math.floor((total%3600)/60);

    const s=
        total%60;

    const pad=
        n=>String(n).padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+pad(m)+":"+pad(s);

}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateAudio();
    updateLights(dt);
    updateMessage(dt);
    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

    try{

        console.log(
            "BACKROOMS INITIALIZING..."
        );

        await loadTextures();

        /*
            Textures are assigned BEFORE geometry exists.
        */

        applyTextures();

        await loadMap();

        buildWorld();

        buildLights();

        await loadEntityTexture();

        entityAudio.load();

        console.log(
            "BACKROOMS READY"
        );

    }catch(error){

        console.error(error);

        const box=
            document.getElementById(
                "error"
            );

        box.style.display="block";

        box.textContent=
            "BACKROOMS INITIALIZATION ERROR\n\n"+
            (
                error.stack||
                error.message||
                String(error)
            );

    }

}

initialize();

</script>
