<script src="./three.min.js"></script>

<script>
"use strict";

/* =========================================================
   THREE CHECK
========================================================= */

if(!window.THREE){

    const error =
        document.getElementById("error");

    error.style.display="block";

    error.textContent =
        "THREE.JS FAILED TO LOAD.\n\n"+
        "This game expects:\n\n"+
        "index.html\n"+
        "three.min.js\n\n"+
        "to be in the SAME GitHub Pages folder.\n\n"+
        "Make sure the filename is exactly:\n"+
        "three.min.js";

    throw new Error("Local Three.js failed");
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x14130c);

scene.fog =
    new THREE.FogExp2(
        0x14130c,
        0.018
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        76,
        innerWidth/innerHeight,
        .03,
        300
    );

camera.rotation.order="YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:
            "high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio || 1,
        1.5
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

if("outputColorSpace" in renderer){

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=.72;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   DARK BASE LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x242014,
        .035
    )
);

scene.add(
    new THREE.HemisphereLight(
        0x665f35,
        0x030303,
        .045
    )
);


/* =========================================================
   TEXTURE LOADER
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;

function prepareTexture(texture){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(path){

    return new Promise(resolve=>{

        textureLoader.load(

            path,

            texture=>{

                console.log(
                    "TEXTURE LOADED:",
                    path
                );

                resolve(
                    prepareTexture(texture)
                );
            },

            undefined,

            error=>{

                console.error(
                    "TEXTURE FAILED:",
                    path,
                    error
                );

                resolve(null);
            }
        );

    });
}

async function loadTextures(){

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing=[];

    if(!wallTexture)
        missing.push(
            "./textures/wall.png"
        );

    if(!floorTexture)
        missing.push(
            "./textures/floor.png"
        );

    if(!ceilingTexture)
        missing.push(
            "./textures/ceiling.png"
        );

    if(missing.length){

        const error =
            document.getElementById(
                "error"
            );

        error.style.display="block";

        error.textContent =
            "TEXTURE FILE ERROR\n\n"+
            "These files could not be loaded:\n\n"+
            missing.join("\n")+
            "\n\n"+
            "GitHub Pages is case-sensitive.\n"+
            "Check the spelling and capitalization.";
    }
}


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const EYE_HEIGHT=1.18;
const PLAYER_HEIGHT=1.55;
const PLAYER_RADIUS=.28;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=false;

let running=false;
let paused=false;
let dead=false;

let fallingIntoLevel=false;
let fallTimer=0;

const FALL_DURATION=2.25;


/* =========================================================
   WORLD ARRAYS
========================================================= */

let worldObjects=[];
let wallColliders=[];
let deathHoles=[];
let lights=[];

function addWorldObject(object){

    scene.add(object);

    worldObjects.push(object);

    return object;
}

function disposeMaterial(material){

    if(!material)
        return;

    if(Array.isArray(material)){

        material.forEach(
            disposeMaterial
        );

        return;
    }

    /*
       DO NOT dispose the original
       shared textures.
    */

    material.dispose();
}

function clearWorld(){

    for(
        const object
        of worldObjects
    ){

        scene.remove(object);

        object.traverse(child=>{

            if(child.geometry)
                child.geometry.dispose();

            if(child.material)
                disposeMaterial(
                    child.material
                );
        });
    }

    for(
        const item
        of lights
    ){

        scene.remove(
            item.light
        );
    }

    worldObjects=[];
    wallColliders=[];
    deathHoles=[];
    lights=[];

    exitObject=null;
    exitLight=null;
    entity=null;
}


/* =========================================================
   WALL MATERIAL
========================================================= */

function wallMaterial(){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({

            color:0x80752e,

            roughness:.92,

            metalness:0
        });
    }

    return new THREE.MeshStandardMaterial({

        map:wallTexture,

        color:0xffffff,

        roughness:.95,

        metalness:0
    });
}


/* =========================================================
   FLOOR MATERIAL
========================================================= */

function floorMaterial(){

    if(!floorTexture){

        return new THREE.MeshStandardMaterial({

            color:0x776b31,

            roughness:1
        });
    }

    return new THREE.MeshStandardMaterial({

        map:floorTexture,

        color:0xffffff,

        roughness:1
    });
}


/* =========================================================
   CEILING MATERIAL
========================================================= */

function ceilingMaterial(){

    if(!ceilingTexture){

        return new THREE.MeshStandardMaterial({

            color:0x716b45,

            roughness:1,

            side:THREE.DoubleSide
        });
    }

    return new THREE.MeshStandardMaterial({

        map:ceilingTexture,

        color:0xffffff,

        roughness:1,

        side:THREE.DoubleSide
    });
}


/* =========================================================
   WALL
     
   BOX GEOMETRY IS INTENTIONAL.
   This prevents the previous invisible-wall problem.
========================================================= */

function createWall(
    x,
    z,
    width,
    depth=.32
){

    const height=3.1;

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        wallMaterial();

    const wall =
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,
        height/2,
        z
    );

    wall.castShadow=true;
    wall.receiveShadow=true;

    addWorldObject(wall);

    wallColliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minZ:z-depth/2,
        maxZ:z+depth/2,

        minY:0,
        maxY:height
    });

    return wall;
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor(){

    const material =
        floorMaterial();

    if(floorTexture){

        floorTexture.repeat.set(
            70,
            70
        );

        floorTexture.needsUpdate=true;
    }

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                220,
                220
            ),

            material
        );

    floor.rotation.x=
        -Math.PI/2;

    floor.receiveShadow=true;

    addWorldObject(floor);
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling(){

    const material =
        ceilingMaterial();

    if(ceilingTexture){

        ceilingTexture.repeat.set(
            70,
            70
        );

        ceilingTexture.needsUpdate=true;
    }

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                220,
                220
            ),

            material
        );

    ceiling.rotation.x=
        Math.PI/2;

    ceiling.position.y=3.1;

    ceiling.receiveShadow=true;

    addWorldObject(ceiling);
}

========================================================= */

function createHoleRoom(){

    const startX=-48;
    const startZ=48;

    for(let z=0;z<7;z++){

        for(let x=0;x<15;x++){

            if(
                (x*3+z*5)%7===0
            ){
                continue;
            }

            const px=
                startX+x*3.5;

            const pz=
                startZ+z*3.5;

            const hole =
                new THREE.Mesh(

                    new THREE.CircleGeometry(
                        1.18,
                        16
                    ),

                    new THREE.MeshBasicMaterial({

                        color:0x010101,

                        side:
                            THREE.DoubleSide
                    })
                );

            hole.rotation.x=
                -Math.PI/2;

            hole.position.set(
                px,
                .008,
                pz
            );

            addWorldObject(hole);

            deathHoles.push({

                x:px,
                z:pz,
                radius:1.08
            });
        }
    }
}

function addLight(
    x,
    z,
    intensity=4,
    flicker=false
){

    /*
       Fixture never disappears.
       Flickering changes intensity only.
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.25,
                .045,
                1.25
            ),

            new THREE.MeshBasicMaterial({

                color:0xffffd0
            })
        );

    fixture.position.set(
        x,
        3.035,
        z
    );

    addWorldObject(fixture);


    const light =
        new THREE.PointLight(
            0xffedb0,
            intensity,
            15,
            1.7
        );

    light.position.set(
        x,
        2.72,
        z
    );

    light.castShadow=true;

    light.shadow.mapSize.width=512;
    light.shadow.mapSize.height=512;

    light.shadow.camera.near=.1;
    light.shadow.camera.far=15;

    scene.add(light);

    lights.push({

        light,
        fixture,

        flicker,

        timer:
            .1+
            Math.random()*2,

        base:intensity
    });
}


function buildLighting(){

    /*
       Not every ceiling tile has a light.
       This creates dark stretches between
       fluorescent pools.
    */

    for(
        let x=-96;
        x<=96;
        x+=13
    ){

        for(
            let z=-94;
            z<=94;
            z+=14
        ){

            if(
                Math.random()<.32
            ){
                continue;
            }

            addLight(

                x+
                (Math.random()-.5)*2,

                z+
                (Math.random()-.5)*2,

                2.8+
                Math.random()*2.5,

                Math.random()<.16
            );
        }
    }

    /* important landmarks */

    addLight(-82,-82,4.8);
    addLight(-42,-9,4.5);
    addLight(8,-3,5);
    addLight(45,24,4.7);
    addLight(-24,61,4.5);
    addLight(55,65,4.8);
}


function updateLights(dt){

    for(
        const item
        of lights
    ){

        if(!item.flicker)
            continue;

        item.timer-=dt;

        if(item.timer<=0){

            item.timer=
                .08+
                Math.random()*.8;

            /*
               NEVER turn fixture off.
               NEVER set intensity to zero.
            */

            item.light.intensity=
                item.base*
                (
                    .28+
                    Math.random()*.72
                );
        }
    }
}


/* =========================================================
   COLLISION
========================================================= */

function collides(x,z){

    const bottom=
        player.position.y;

    const top=
        bottom+
        PLAYER_HEIGHT;

    for(
        const wall
        of wallColliders
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){
            continue;
        }

        const closestX=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=
            x-closestX;

        const dz=
            z-closestZ;

        if(
            dx*dx+
            dz*dz<
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){
            return true;
        }
    }

    return false;
}


function entityHitsWall(x,z){

    for(
        const wall
        of wallColliders
    ){

        const closestX=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=
            x-closestX;

        const dz=
            z-closestZ;

        if(
            dx*dx+
            dz*dz<
            .5*.5
        ){
            return true;
        }
    }

    return false;
}


function blocked(
    x1,
    z1,
    x2,
    z2
){

    const dx=x2-x1;
    const dz=z2-z1;

    const distance=
        Math.hypot(dx,dz);

    const steps=
        Math.max(
            1,
            Math.ceil(distance/.3)
        );

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        if(
            entityHitsWall(
                x1+dx*t,
                z1+dz*t
            )
        ){
            return true;
        }
    }

    return false;
}


/* =========================================================
   HOLES
========================================================= */

function playerInHole(){

    for(
        const hole
        of deathHoles
    ){

        const dx=
            player.position.x-
            hole.x;

        const dz=
            player.position.z-
            hole.z;

        if(
            dx*dx+
            dz*dz<
            hole.radius*
            hole.radius
        ){
            return true;
        }
    }

    return false;
}

const SETTINGS={

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){
        return;
    }

    const settings=
        SETTINGS[difficulty];

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(dx,dz);

    lastSeen+=dt;

    const visible=
        distance<
        settings.detection&&
        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );

    let dx2=0;
    let dz2=0;

    if(visible){

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen=0;

        dx2=
            dx/
            Math.max(distance,.001);

        dz2=
            dz/
            Math.max(distance,.001);

    }else if(lastSeen<3.2){

        const lx=
            lastKnown.x-
            entity.position.x;

        const lz=
            lastKnown.y-
            entity.position.z;

        const len=
            Math.hypot(lx,lz);

        if(len>.1){

            dx2=lx/len;
            dz2=lz/len;
        }

    }else{

        wanderTimer-=dt;

        if(wanderTimer<=0){

            wanderTimer=
                .6+
                Math.random()*1.7;

            wanderAngle=
                Math.random()*
                Math.PI*2;
        }

        dx2=
            Math.cos(wanderAngle);

        dz2=
            Math.sin(wanderAngle);
    }

    const targetAngle=
        Math.atan2(dz2,dx2);

    const currentAngle=
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference=
        targetAngle-
        currentAngle;

    while(difference>Math.PI)
        difference-=Math.PI*2;

    while(difference<-Math.PI)
        difference+=Math.PI*2;

    difference=
        Math.max(
            -3.4*dt,
            Math.min(
                3.4*dt,
                difference
            )
        );

    const angle=
        currentAngle+
        difference;

    entityDirection.x=
        Math.cos(angle);

    entityDirection.y=
        Math.sin(angle);

    entityVelocity.x=
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x*
            settings.speed,
            Math.min(1,dt*4)
        );

    entityVelocity.y=
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y*
            settings.speed,
            Math.min(1,dt*4)
        );

    const moveX=
        entityVelocity.x*dt;

    const moveZ=
        entityVelocity.y*dt;

    const nextX=
        entity.position.x+
        moveX;

    const nextZ=
        entity.position.z+
        moveZ;

    if(
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ){

        entity.position.x=
            nextX;

    }else{

        entityVelocity.x=0;

        /*
           Juke around corners.
        */

        wanderAngle+=
            Math.PI/2+
            (Math.random()-.5)*.7;
    }

    if(
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ){

        entity.position.z=
            nextZ;

    }else{

        entityVelocity.y=0;

        wanderAngle+=
            Math.PI/2+
            (Math.random()-.5)*.7;
    }

    /*
       Billboard toward camera.
       PNG remains completely unshaded.
    */

    entity.quaternion.copy(
        camera.quaternion
    );

    const killDistance=
        difficulty==="nightmare"
            ?1.55
            :1.25;

    if(
        distance<
        killDistance
    ){

        killPlayer();
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio(){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){

        entityAudio.volume=0;

        return;
    }

    const distance=
        Math.hypot(

            entity.position.x-
            player.position.x,

            entity.position.z-
            player.position.z
        );

    const maxDistance=34;

    if(distance>=maxDistance){

        entityAudio.volume=0;

        return;
    }

    let volume=
        Math.pow(
            1-distance/maxDistance,
            1.6
        )*.9;

    if(
        blocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    ){

        volume*=.2;
    }

    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if(
        entityAudio.paused&&
        volume>.01
    ){

        entityAudio
            .play()
            .catch(()=>{});
    }
}


/* =========================================================
   INPUT
========================================================= */

const keys={

    w:false,
    a:false,
    s:false,
    d:false,
    shift:false
};

let jumpPressed=false;

addEventListener(
    "keydown",
    event=>{

        /*
           W/S ARE EXPLICITLY DEFINED HERE.

           W = forward
           S = backward
        */

        if(event.code==="KeyW")
            keys.w=true;

        if(event.code==="KeyS")
            keys.s=true;

        if(event.code==="KeyA")
            keys.a=true;

        if(event.code==="KeyD")
            keys.d=true;

        if(
            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        ){
            keys.shift=true;
        }

        if(
            event.code==="Space"&&
            !event.repeat
        ){

            jumpPressed=true;
        }

        if(
            event.code==="Escape"&&
            running&&
            !dead&&
            !fallingIntoLevel
        ){

            togglePause();
        }
    }
);

addEventListener(
    "keyup",
    event=>{

        if(event.code==="KeyW")
            keys.w=false;

        if(event.code==="KeyS")
            keys.s=false;

        if(event.code==="KeyA")
            keys.a=false;

        if(event.code==="KeyD")
            keys.d=false;

        if(
            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        ){

            keys.shift=false;
        }
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !running||
            paused||
            dead||
            fallingIntoLevel
        ){
            return;
        }

        if(
            document.pointerLockElement!==
            document.body
        ){
            return;
        }

        yaw-=
            event.movementX*.0022;

        pitch-=
            event.movementY*.0018;

        pitch=
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;
    }
);


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(fallingIntoLevel){

        updateFall(dt);

        return;
    }

    /*
       Direct movement values.

       W = +forward
       S = -forward
       D = +strafe
       A = -strafe
    */

    let forward=0;
    let side=0;

    if(keys.w)
        forward+=1;

    if(keys.s)
        forward-=1;

    if(keys.d)
        side+=1;

    if(keys.a)
        side-=1;

    const length=
        Math.hypot(
            forward,
            side
        );

    if(length){

        forward/=length;
        side/=length;
    }

    let speed=
        keys.shift
            ?5.9
            :3.5;

    if(difficulty==="easy")
        speed=
            keys.shift?6.1:3.8;

    if(difficulty==="hard")
        speed=
            keys.shift?6.3:3.4;

    if(difficulty==="nightmare")
        speed=
            keys.shift?6.5:3.25;

    /*
       Camera looks toward -Z at yaw 0.

       Therefore W moves toward -Z.
    */

    const forwardX=
        -Math.sin(yaw);

    const forwardZ=
        -Math.cos(yaw);

    const rightX=
        Math.cos(yaw);

    const rightZ=
        -Math.sin(yaw);

    const dx=
        (
            forwardX*forward+
            rightX*side
        )*
        speed*
        dt;

    const dz=
        (
            forwardZ*forward+
            rightZ*side
        )*
        speed*
        dt;

    const nextX=
        player.position.x+dx;

    const nextZ=
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x=
            nextX;
    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z=
            nextZ;
    }

    if(
        jumpPressed&&
        grounded
    ){

        velocityY=6.2;
        grounded=false;
    }

    jumpPressed=false;

    velocityY-=20*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;

        velocityY=0;

        grounded=true;
    }

    if(playerInHole()){

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }

    checkExit();
}


/* =========================================================
   FALLING INTRO
========================================================= */

function updateFall(dt){

    fallTimer+=dt;

    const progress=
        Math.min(
            fallTimer/FALL_DURATION,
            1
        );

    const eased=
        1-
        Math.pow(
            1-progress,
            3
        );

    player.position.y=
        17-
        17*eased;

    camera.position.y=
        EYE_HEIGHT;

    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                progress*1.3,
                1
            )
        );

    camera.rotation.z=
        Math.sin(
            progress*Math.PI*9
        )*.025;

    if(progress>=1){

        fallingIntoLevel=false;

        player.position.y=0;

        camera.position.set(
            0,
            EYE_HEIGHT,
            0
        );

        camera.rotation.x=0;
        camera.rotation.z=0;

        document.body.requestPointerLock();
    }
}


/* =========================================================
   CAMERA MOTION
========================================================= */

let cameraTime=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;

    cameraTime+=dt;

    const moving=
        keys.w||
        keys.a||
        keys.s||
        keys.d;

    /*
       Slightly heavier movement than before.
    */

    const amount=
        moving
            ?.014
            :.004;

    camera.position.x=
        Math.sin(
            cameraTime*3.4
        )*
        amount;

    camera.position.y=
        EYE_HEIGHT+
        Math.sin(
            cameraTime*4.1
        )*
        amount;

    camera.position.z=
        Math.cos(
            cameraTime*3.1
        )*
        amount*.55;

    camera.rotation.z=
        Math.sin(
            cameraTime*.9
        )*.004;

    /*
       Random analog-camera interference.
    */

    if(
        Math.random()<.009
    ){

        camera.position.x+=
            (
                Math.random()-.5
            )*.055;

        camera.position.y+=
            (
                Math.random()-.5
            )*.04;

        camera.rotation.z+=
            (
                Math.random()-.5
            )*.035;
    }
}


/* =========================================================
   SECURITY CAMERA EFFECT UPDATE
========================================================= */

let securityTimer=0;

function updateSecurityCamera(dt){

    if(!running||paused){

        return;
    }

    securityTimer-=dt;

        );

        );

        Math.max(

                flicker.style.opacity||0
            )-

        );

    bar.style.opacity=
        Math.max(
            0,
            Number(
                bar.style.opacity||0
            )-
            dt*3
        );

    if(securityTimer<=0){

        securityTimer=
            .2+
            Math.random()*1.8;

        const roll=Math.random();

        if(roll<.07){

            flicker.style.opacity=
                .20+
                Math.random()*.35;
        }

        if(roll>.82){

            bar.style.top=
                Math.random()*100+
                "%";

            bar.style.opacity=
                .15+
                Math.random()*.3;
        }
    }
}


/* =========================================================
   EXIT CHECK
========================================================= */

function checkExit(){

    if(
        !exitObject||
        dead
    ){
        return;
    }

    const distance=
        Math.hypot(

            player.position.x-
            exitX,

            player.position.z-
            exitZ
        );

    if(distance<1.8){

        winGame();
    }
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.2;
}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";
    }
}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason="THE BACKROOMS GOT YOU"
){

    if(
        dead||
        !running
    ){
        return;
    }

    dead=true;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU DIED";

    document.getElementById(
        "deathTitle"
    ).className="";

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "retryBtn"
    ).textContent="RETRY";

    document.getElementById(
        "death"
    ).style.display="flex";
}


/* =========================================================
   WIN
========================================================= */

function winGame(){

    if(
        dead||
        !running
    ){
        return;
    }

    dead=true;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU ESCAPED";

    document.getElementById(
        "deathTitle"
    ).className="win";

    document.getElementById(
        "deathText"
    ).textContent="YOU FOUND THE EXIT";

    document.getElementById(
        "retryBtn"
    ).textContent="PLAY AGAIN";

    document.getElementById(
        "death"
    ).style.display="flex";
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !running||
        dead||
        fallingIntoLevel
    ){
        return;
    }

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
            ?"flex"
            :"none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        document.body.requestPointerLock();
    }
}


/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";
}


/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    if(
        !wallTexture||
        !floorTexture||
        !ceilingTexture
    ){

        await loadTextures();
    }

    clearWorld();

    /*
       Spawn inside the closed map.
    */

    player.position.set(
        -94,
        17,
        -96
    );

    yaw=.35;
    pitch=-.28;

    velocityY=0;
    grounded=false;

    createFloor();
    createCeiling();

    createOuterWalls();

    buildFloorPlan();

    createHoleRoom();

    createExit();

    buildLighting();

    await createEntity();

    entity.position.set(
        65,
        .85,
        -55
    );

    entityDirection.set(
        1,
        0
    );

    entityVelocity.set(
        0,
        0
    );

    lastSeen=99;

    running=true;
    paused=false;
    dead=false;

    fallingIntoLevel=true;

    fallTimer=0;

    recordingTime=0;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x=pitch;
    camera.rotation.z=0;

    player.rotation.y=yaw;

    showMessage(
        "ENTERING LEVEL 0..."
    );
}


/* =========================================================

function setDifficulty(value){

    document

        )
        .forEach(

                )

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            running&&
            !paused&&
            !dead&&
            !fallingIntoLevel&&
            document.pointerLockElement!==
            document.body
        ){

            document.body.requestPointerLock();
        }
    }
);


/* =========================================================
   MENU IMAGE ROTATION
========================================================= */

const menuImages=
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex=0;

function cycleMenuImage(){

    if(!menuImages.length)
        return;

    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );

    menuIndex=
        (
            menuIndex+1
        )%
        menuImages.length;

    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}

setInterval(
    cycleMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio||1,
                1.5
            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock=
    new THREE.Clock();

let recordingTime=0;

function updateTimer(dt){

    if(
        !running||
        paused
    ){
        return;
    }

    recordingTime+=dt;

    const total=
        Math.floor(
            recordingTime
        );

    const hours=
        Math.floor(
            total/3600
        );

    const minutes=
        Math.floor(
            (total%3600)/60
        );

    const seconds=
        total%60;

    const format=
        n=>
            String(n)
                .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        `${format(hours)}:`+
        `${format(minutes)}:`+
        `${format(seconds)}`;
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running&&
        !paused&&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateLights(dt);

        updateCamera(dt);

        updateSecurityCamera(dt);

        updateEntityAudio();

        updateMessage(dt);

        updateTimer(dt);

    }else{

        updateEntityAudio();
    }

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadTextures();

animate();

</script>
