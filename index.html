<script>
"use strict";

/* =========================================================
   BASIC STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

const keys = {};

/* =========================================================
   THREE
========================================================= */

if(typeof THREE === "undefined"){
    const error = document.getElementById("error");
    error.style.display = "block";
    error.textContent =
        "THREE.JS COULD NOT BE LOADED.\n\n" +
        "Make sure three.min.js is in the repository root.";
    throw new Error("Three.js missing");
}

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x77704b);

scene.fog = new THREE.FogExp2(
    0x77704b,
    .005
);

const camera = new THREE.PerspectiveCamera(
    78,
    innerWidth / innerHeight,
    .03,
    700
);

const renderer = new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
);

if("outputColorSpace" in renderer){
    renderer.outputColorSpace = THREE.SRGBColorSpace;
}

renderer.toneMapping = THREE.NoToneMapping;

renderer.domElement.style.position = "fixed";
renderer.domElement.style.inset = "0";
renderer.domElement.style.zIndex = "1";

document.body.appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        .28
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xfff1b5,
        0x16140d,
        .35
    )
);

/* =========================================================
   WORLD
========================================================= */

const world = new THREE.Group();
scene.add(world);

const TILE = 3;
const WALL_HEIGHT = 9;

const PLAYER_HEIGHT = 5.8;
const EYE_HEIGHT = 5.25;
const CROUCH_EYE_HEIGHT = 3.15;
const PLAYER_RADIUS = .48;

const WALK_SPEED = 3.25;
const SPRINT_SPEED = 5.6;

const GRAVITY = 22;
const JUMP_SPEED = 7;

let mapWidth = 0;
let mapHeight = 0;

let mapData = [];

let playerSpawn = null;
let entitySpawn = null;

const wallColliders = [];
const hidingSpots = [];
const holeSpots = [];
const lights = [];

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader = new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;
let entityTexture = null;

function prepareTexture(texture,x,y){

    if(!texture) return null;

    texture.colorSpace = THREE.SRGBColorSpace;

    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;

    texture.repeat.set(x,y);

    texture.magFilter = THREE.LinearFilter;
    texture.minFilter = THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            8
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(path,x,y){

    return new Promise(resolve=>{

        textureLoader.load(
            path,
            texture=>{
                console.log("LOADED:",path);
                resolve(
                    prepareTexture(
                        texture,
                        x,
                        y
                    )
                );
            },
            undefined,
            error=>{
                console.error(
                    "FAILED:",
                    path,
                    error
                );
                resolve(null);
            }
        );

    });
}

async function loadAllTextures(){

    wallTexture =
        await loadTexture(
            "./textures/wall.png",
            1.15,
            1.15
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

    /*
        Entity texture is optional.
        If entity.png exists in the root it will be used.
    */

    entityTexture =
        await loadTexture(
            "./entity.png",
            1,
            1
        );

}

/* =========================================================
   MATERIALS
========================================================= */

function wallMaterial(){

    return new THREE.MeshBasicMaterial({
        map:wallTexture || null,
        color:wallTexture ? 0xffffff : 0xff00ff,
        side:THREE.DoubleSide
    });

}

function floorMaterial(){

    return new THREE.MeshBasicMaterial({
        map:floorTexture || null,
        color:floorTexture ? 0xffffff : 0xff00ff,
        side:THREE.DoubleSide
    });

}

function ceilingMaterial(){

    return new THREE.MeshBasicMaterial({
        map:ceilingTexture || null,
        color:ceilingTexture ? 0xffffff : 0xff00ff,
        side:THREE.DoubleSide
    });

}

/* =========================================================
   MAP COLOR DETECTION
========================================================= */

function classifyPixel(r,g,b,a){

    if(a < 30)
        return "floor";

    /*
        BLACK / VERY DARK = WALL
    */

    if(
        Math.max(r,g,b) < 75
    ){
        return "wall";
    }

    /*
        RED = PLAYER SPAWN
    */

    if(
        r > 150 &&
        r > g * 1.4 &&
        r > b * 1.4
    ){
        return "spawn";
    }

    /*
        BLUE = ENTITY SPAWN
    */

    if(
        b > 120 &&
        b > r * 1.35 &&
        b > g * 1.15
    ){
        return "entity";
    }

    /*
        PURPLE / MAGENTA = HIDING SPOT
    */

    if(
        r > 100 &&
        b > 100 &&
        g < Math.min(r,b)*.75
    ){
        return "hide";
    }

    /*
        YELLOW / ORANGE = HOLE
    */

    if(
        r > 145 &&
        g > 105 &&
        b < 125 &&
        r > b*1.25
    ){
        return "hole";
    }

    /*
        WHITE / GREY / OTHER = FLOOR
    */

    return "floor";
}

/* =========================================================
   MAP COORDINATES
========================================================= */

function cellToWorld(x,y){

    return {
        x:
            (x+.5)*TILE -
            mapWidth*TILE/2,

        z:
            (y+.5)*TILE -
            mapHeight*TILE/2
    };

}

function worldToCell(x,z){

    return {
        x:
            Math.floor(
                (x + mapWidth*TILE/2) / TILE
            ),

        y:
            Math.floor(
                (z + mapHeight*TILE/2) / TILE
            )
    };

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image = await new Promise(
        (resolve,reject)=>{

            const img = new Image();

            img.onload = ()=>resolve(img);

            img.onerror = ()=>reject(
                new Error(
                    "textures/map1.png could not be loaded."
                )
            );

            img.src =
                "./textures/map1.png?v="+Date.now();

        }
    );

    mapWidth = image.naturalWidth;
    mapHeight = image.naturalHeight;

    console.log(
        "MAP SIZE:",
        mapWidth,
        "x",
        mapHeight
    );

    const canvas =
        document.createElement("canvas");

    canvas.width = mapWidth;
    canvas.height = mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData = [];

    playerSpawn = null;
    entitySpawn = null;

    hidingSpots.length = 0;
    holeSpots.length = 0;

    for(let y=0;y<mapHeight;y++){

        const row = [];

        for(let x=0;x<mapWidth;x++){

            const i =
                (y*mapWidth+x)*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            const p =
                cellToWorld(x,y);

            if(
                type === "spawn" &&
                !playerSpawn
            ){
                playerSpawn = p;
            }

            if(
                type === "entity" &&
                !entitySpawn
            ){
                entitySpawn = p;
            }

            if(type === "hide"){
                hidingSpots.push({
                    x:p.x,
                    z:p.z,
                    cellX:x,
                    cellY:y
                });
            }

            if(type === "hole"){
                holeSpots.push({
                    x:p.x,
                    z:p.z,
                    cellX:x,
                    cellY:y
                });
            }

        }

        mapData.push(row);
    }

    /*
        Fallback spawn if no red pixel exists.
    */

    if(!playerSpawn){

        const fallback =
            findNearestWalkableCell(
                Math.floor(mapWidth/2),
                Math.floor(mapHeight/2)
            );

        if(fallback){
            playerSpawn =
                cellToWorld(
                    fallback.x,
                    fallback.y
                );
        }

    }

    /*
        Fallback entity spawn.
    */

    if(!entitySpawn){

        const p =
            findEntityFallbackSpawn();

        if(p){
            entitySpawn = p;
        }else{
            entitySpawn = {
                x:playerSpawn.x+TILE*10,
                z:playerSpawn.z+TILE*10
            };
        }

    }

    console.log(
        "PLAYER SPAWN:",
        playerSpawn
    );

    console.log(
        "ENTITY SPAWN:",
        entitySpawn
    );

    console.log(
        "HIDING SPOTS:",
        hidingSpots.length
    );

    console.log(
        "HOLES:",
        holeSpots.length
    );
}

/* =========================================================
   WALKABLE CHECK
========================================================= */

function isWalkableCell(x,y){

    if(
        x<0 ||
        y<0 ||
        x>=mapWidth ||
        y>=mapHeight
    ){
        return false;
    }

    const t =
        mapData[y][x];

    return (
        t !== "wall"
    );

}

/* =========================================================
   FIND WALKABLE
========================================================= */

function findNearestWalkableCell(
    startX,
    startY,
    maxRadius=100
){

    for(
        let radius=0;
        radius<=maxRadius;
        radius++
    ){

        for(
            let y=startY-radius;
            y<=startY+radius;
            y++
        ){

            for(
                let x=startX-radius;
                x<=startX+radius;
                x++
            ){

                if(
                    Math.max(
                        Math.abs(x-startX),
                        Math.abs(y-startY)
                    ) !== radius
                ){
                    continue;
                }

                if(
                    isWalkableCell(x,y)
                ){
                    return {x,y};
                }

            }

        }

    }

    return null;
}

function findEntityFallbackSpawn(){

    if(!playerSpawn)
        return null;

    const playerCell =
        worldToCell(
            playerSpawn.x,
            playerSpawn.z
        );

    /*
        Search progressively farther away.
    */

    for(
        let radius=20;
        radius<Math.max(
            mapWidth,
            mapHeight
        );
        radius++
    ){

        const candidates = [];

        for(
            let angle=0;
            angle<Math.PI*2;
            angle+=Math.PI/12
        ){

            const x =
                Math.round(
                    playerCell.x +
                    Math.cos(angle)*radius
                );

            const y =
                Math.round(
                    playerCell.y +
                    Math.sin(angle)*radius
                );

            if(
                isWalkableCell(x,y)
            ){

                candidates.push({
                    x,
                    y
                });

            }

        }

        if(candidates.length){

            const chosen =
                candidates[
                    Math.floor(
                        Math.random()*
                        candidates.length
                    )
                ];

            return cellToWorld(
                chosen.x,
                chosen.y
            );

        }

    }

    return null;
}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    wallColliders.length = 0;

    for(let y=0;y<mapHeight;y++){

        for(let x=0;x<mapWidth;x++){

            const type =
                mapData[y][x];

            const p =
                cellToWorld(x,y);

            if(type !== "wall"){

                addFloor(
                    p.x,
                    p.z,
                    type
                );

                addCeiling(
                    p.x,
                    p.z
                );

            }else{

                addWall(
                    p.x,
                    p.z
                );

            }

        }

    }

    /*
        Build the visual holes AFTER floors.
    */

    for(const hole of holeSpots){
        createHoleVisual(hole);
    }

    /*
        Build the visual hiding locations.
    */

    for(const spot of hidingSpots){
        createHidingVisual(spot);
    }

}

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.y =
    EYE_HEIGHT;

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let grounded = true;

let falling = false;
let fallTimer = 0;

let crouching = false;
let hidden = false;

function collides(x,z){

    const r =
        PLAYER_RADIUS;

    for(const wall of wallColliders){

        if(
            x+r > wall.minX &&
            x-r < wall.maxX &&
            z+r > wall.minZ &&
            z-r < wall.maxZ
        ){
            return true;
        }

    }

    return false;
}

function movePlayer(dx,dz){

    const nextX =
        player.position.x+dx;

    const nextZ =
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){
        player.position.x =
            nextX;
    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){
        player.position.z =
            nextZ;
    }

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    ){
        return;
    }

    if(falling){

        fallTimer += dt;

        const progress =
            Math.min(
                fallTimer/2,
                1
            );

        player.position.y =
            -progress*5;

        camera.position.y =
            EYE_HEIGHT-progress*1.2;

        camera.rotation.z =
            Math.sin(
                fallTimer*16
            )*.025;

        if(fallTimer>=2){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;
    }

    crouching =
        !!keys["c"];

    let forward = 0;
    let strafe = 0;

    if(keys["w"])
        forward++;

    if(keys["s"])
        forward--;

    if(keys["d"])
        strafe++;

    if(keys["a"])
        strafe--;

    const length =
        Math.hypot(
            forward,
            strafe
        );

    if(length>0){

        forward/=length;
        strafe/=length;

        const speed =
            keys["shift"] && !crouching
            ?
            SPRINT_SPEED
            :
            crouching
            ?
            WALK_SPEED*.58
            :
            WALK_SPEED;

        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);

        const dx =
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz =
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    velocityY -=
        GRAVITY*dt;

    player.position.y +=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    if(
        grounded &&
        !crouching &&
        keys["spacePressed"]
    ){

        velocityY =
            JUMP_SPEED;

        grounded=false;

        keys["spacePressed"] =
            false;

    }

    const targetHeight =
        crouching
        ?
        CROUCH_EYE_HEIGHT
        :
        EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();

    checkHole();

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest = null;
    let closestDistance = Infinity;

    for(const spot of hidingSpots){

        const distance =
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(distance<closestDistance){

            closestDistance=distance;
            closest=spot;

        }

    }

    const near =
        closest &&
        closestDistance<TILE*.8;

    hidden =
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near&&!hidden
        ?
        "1"
        :
        "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ?
        "1"
        :
        "0";

}

/* =========================================================
   HOLES
========================================================= */

function checkHole(){

    if(falling)
        return;

    const cell =
        worldToCell(
            player.position.x,
            player.position.z
        );

    if(
        cell.x<0 ||
        cell.y<0 ||
        cell.x>=mapWidth ||
        cell.y>=mapHeight
    ){
        return;
    }

    if(
        mapData[cell.y][cell.x] === "hole"
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   ENTITY LINE OF SIGHT
========================================================= */

function entitySeesPlayer(){

    if(hidden)
        return false;

    const dx =
        player.position.x-
        entity.position.x;

    const dz =
        player.position.z-
        entity.position.z;

    const distance =
        Math.hypot(dx,dz);

    const detection =
        difficulty==="easy"
        ?
        7
        :
        difficulty==="hard"
        ?
        12
        :
        difficulty==="nightmare"
        ?
        15
        :
        9;

    if(distance>detection)
        return false;

    const steps =
        Math.ceil(distance/.25);

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        const x =
            entity.position.x+dx*t;

        const z =
            entity.position.z+dz*t;

        if(
            collides(
                x,
                z
            )
        ){
            return false;
        }

    }

    return true;
}

/* =========================================================
   ENTITY TELEPORT RECOVERY
========================================================= */

function teleportEntityAwayFromPlayer(){

    if(!entity || !playerSpawn)
        return;

    const playerCell =
        worldToCell(
            player.position.x,
            player.position.z
        );

    /*
        IMPORTANT:
        20 MAP PIXELS = 20 MAP CELLS.

        We search outward until we find a valid
        walkable position at least 20 cells away.
    */

    const candidates = [];

    const maxRadius =
        Math.max(
            mapWidth,
            mapHeight
        );

    for(
        let radius=20;
        radius<maxRadius;
        radius++
    ){

        candidates.length=0;

        for(
            let i=0;
            i<24;
            i++
        ){

            const angle =
                (i/24)*Math.PI*2;

            const x =
                Math.round(
                    playerCell.x+
                    Math.cos(angle)*radius
                );

            const y =
                Math.round(
                    playerCell.y+
                    Math.sin(angle)*radius
                );

            if(
                !isWalkableCell(
                    x,
                    y
                )
            ){
                continue;
            }

            /*
                Don't put the entity directly inside
                a hole.
            */

            if(
                mapData[y][x] === "hole"
            ){
                continue;
            }

            candidates.push({
                x,
                y,
                distance:
                    Math.hypot(
                        x-playerCell.x,
                        y-playerCell.y
                    )
            });

        }

        if(candidates.length){

            candidates.sort(
                (a,b)=>
                    b.distance-a.distance
            );

            /*
                Pick one of the farther candidates
                instead of always using the first one.
            */

            const pick =
                candidates[
                    Math.floor(
                        Math.random()*
                        Math.min(
                            candidates.length,
                            5
                        )
                    )
                ];

            const p =
                cellToWorld(
                    pick.x,
                    pick.y
                );

            entity.position.x=p.x;
            entity.position.z=p.z;
            entity.position.y=2.4;

            entityTarget=null;
            entityMemory=0;

            entityWanderTimer=0;

            entityLastX=p.x;
            entityLastZ=p.z;
            entityStuckTime=0;

            showMessage(
                "SOMETHING MOVES IN THE DISTANCE..."
            );

            console.log(
                "ENTITY RECOVERED AT:",
                pick.x,
                pick.y,
                "DISTANCE:",
                pick.distance
            );

            return;
        }

    }

    /*
        Extremely rare fallback.
    */

    const fallback =
        findEntityFallbackSpawn();

    if(fallback){

        entity.position.x =
            fallback.x;

        entity.position.z =
            fallback.z;

        entity.position.y=2.4;

    }

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        paused ||
        dead ||
        !gameStarted
    ){
        return;
    }

    if(
        entitySeesPlayer()
    ){

        entityTarget={
            x:player.position.x,
            z:player.position.z
        };

        entityMemory =
            difficulty==="nightmare"
            ?
            4
            :
            2.8;

    }else if(entityMemory>0){

        entityMemory-=dt;

    }else{

        entityTarget=null;

    }

    let dx=0;
    let dz=0;

    if(entityTarget){

        dx =
            entityTarget.x-
            entity.position.x;

        dz =
            entityTarget.z-
            entity.position.z;

        const distance =
            Math.hypot(
                dx,
                dz
            );

        if(distance>.15){

            dx/=distance;
            dz/=distance;

        }

    }else{

        entityWanderTimer-=dt;

        if(
            entityWanderTimer<=0
        ){

            entityWanderTimer =
                2+
                Math.random()*4;

            entityWanderAngle =
                Math.random()*
                Math.PI*2;

        }

        dx =
            Math.cos(
                entityWanderAngle
            );

        dz =
            Math.sin(
                entityWanderAngle
            );

    }

    const speed =
        entityTarget
        ?
        difficulty==="nightmare"
            ?
            2.6
            :
            difficulty==="hard"
                ?
                2.2
                :
                difficulty==="easy"
                    ?
                    1.35
                    :
                    1.8
        :
        .72;

    const oldX =
        entity.position.x;

    const oldZ =
        entity.position.z;

    const nx =
        oldX+
        dx*speed*dt;

    const nz =
        oldZ+
        dz*speed*dt;

    let moved=false;

    if(
        !collides(
            nx,
            oldZ
        )
    ){

        entity.position.x=nx;
        moved=true;

    }

    if(
        !collides(
            entity.position.x,
            nz
        )
    ){

        entity.position.z=nz;
        moved=true;

    }

    /*
        STUCK DETECTION.

        If the entity has been trying to move but barely
        changed position for 2 seconds, it gets recovered.
    */

    const actualMovement =
        Math.hypot(
            entity.position.x-entityLastX,
            entity.position.z-entityLastZ
        );

    if(actualMovement<.08){

        entityStuckTime+=dt;

    }else{

        entityStuckTime=0;

        entityLastX =
            entity.position.x;

        entityLastZ =
            entity.position.z;

    }

    if(
        entityStuckTime>2
    ){

        teleportEntityAwayFromPlayer();

        return;

    }

    if(!moved){

        entityWanderTimer=0;

        /*
            Give it a little time to attempt another
            direction before recovery.
        */

        entityStuckTime+=dt;

    }

    /*
        Billboard toward camera.
    */

    entity.rotation.y =
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    /*
        Kill distance.
    */

    const playerDistance =
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    if(
        playerDistance<.9 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "death"
    ).style.display="flex";

    if(document.pointerLockElement){

        document.exitPointerLock();

    }

}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.5;

}

function updateMessage(dt){

    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){

            document.getElementById(
                "message"
            ).textContent="";

        }

    }

}

/* =========================================================
   RESET PLAYER
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y =
        EYE_HEIGHT;

    velocityY=0;
    grounded=true;

    falling=false;
    fallTimer=0;

    hidden=false;
    crouching=false;

}

/* =========================================================
   START
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    resetPlayer();

    gameTime=0;

    if(entity){

        world.remove(entity);

        if(entity.geometry)
            entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;

    }

    createEntity();

    renderer.domElement.requestPointerLock();

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    ){
        return;
    }

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display =
        paused
        ?
        "flex"
        :
        "none";

    if(paused){

        if(document.pointerLockElement){
            document.exitPointerLock();
        }

    }else{

        renderer.domElement.requestPointerLock();

    }

}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="none";

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key =
            event.key.toLowerCase();

        keys[key]=true;

        if(
            event.code==="Space"
        ){

            event.preventDefault();

            if(
                grounded &&
                !crouching
            ){

                keys["spacePressed"]=true;

            }

        }

        if(
            key==="escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();
                return;

            }

            if(gameStarted){
                togglePause();
            }

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;

        if(
            event.code==="Space"
        ){
            keys["spacePressed"]=false;
        }

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        ){
            return;
        }

        yaw -=
            event.movementX*.0021;

        pitch -=
            event.movementY*.0018;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );

        player.rotation.y=yaw;

        camera.rotation.x=pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement.requestPointerLock();

        }

    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick=startGame;

document.getElementById(
    "menuControlsBtn"
).onclick=showControls;

document.getElementById(
    "pauseControlsBtn"
).onclick=showControls;

document.getElementById(
    "controlsBackBtn"
).onclick=hideControls;

document.getElementById(
    "resumeBtn"
).onclick=()=>{

    paused=false;

    document.getElementById(
        "pause"
    ).style.display="none";

    renderer.domElement.requestPointerLock();

};

document.getElementById(
    "restartBtn"
).onclick=startGame;

document.getElementById(
    "retryBtn"
).onclick=startGame;

document.getElementById(
    "menuBtn"
).onclick=()=>{

    gameStarted=false;
    paused=false;

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

    if(document.pointerLockElement){
        document.exitPointerLock();
    }

};

document.getElementById(
    "deathMenuBtn"
).onclick=()=>{

    dead=false;
    gameStarted=false;

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

};

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={
    easy:
        document.getElementById("easyBtn"),

    normal:
        document.getElementById("normalBtn"),

    hard:
        document.getElementById("hardBtn"),

    nightmare:
        document.getElementById("nightmareBtn")
};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU IMAGES
========================================================= */

const menuImages =
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        menuImages[
            menuIndex
        ].classList.remove("active");

        menuIndex =
            (menuIndex+1)%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add("active");

    },
    6000
);

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(dt){

    for(const item of lights){

        item.timer-=dt;

        if(item.timer<=0){

            item.timer =
                .4+
                Math.random()*5;

            if(Math.random()<.16){

                item.light.intensity =
                    .2+
                    Math.random()*2;

                setTimeout(
                    ()=>{
                        if(item.light){
                            item.light.intensity=4.2;
                        }
                    },
                    40+
                    Math.random()*120
                );

            }else{

                item.light.intensity=4.2;

            }

        }

    }

}

/* =========================================================
   TAPE TIME
========================================================= */

let gameTime=0;

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    ){
        return;
    }

    gameTime+=dt;

    const total =
        Math.floor(gameTime);

    const h =
        Math.floor(total/3600);

    const m =
        Math.floor((total%3600)/60);

    const s =
        total%60;

    const f =
        n=>String(n).padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        f(h)+":"+f(m)+":"+f(s);

}

/* =========================================================
   ANIMATION
========================================================= */

let lastTime=performance.now();

function animate(){

    requestAnimationFrame(animate);

    const now=performance.now();

    let dt =
        (now-lastTime)/1000;

    lastTime=now;

    dt=Math.min(dt,.05);

    updatePlayer(dt);
    updateEntity(dt);
    updateLights(dt);
    updateMessage(dt);
    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize(){

    try{

        console.log(
            "================================"
        );

        console.log(
            "BACKROOMS INITIALIZATION"
        );

        console.log(
            "================================"
        );

        console.log(
            "Loading wall.png..."
        );

        console.log(
            "Loading floor.png..."
        );

        console.log(
            "Loading ceiling.png..."
        );

        console.log(
            "Loading map1.png..."
        );

        await loadAllTextures();

        /*
            We allow the game to continue even if an
            optional texture is missing, but the three
            primary world textures are required.
        */

        if(
            !wallTexture ||
            !floorTexture ||
            !ceilingTexture
        ){

            throw new Error(
                "Required texture failed to load.\n\n"+
                "The repository must contain:\n"+
                "textures/wall.png\n"+
                "textures/floor.png\n"+
                "textures/ceiling.png"
            );

        }

        await loadMap();

        if(!playerSpawn){

            throw new Error(
                "No walkable player spawn could be found in map1.png."
            );

        }

        buildWorld();

        buildLights();

        selectDifficulty("normal");

        console.log(
            "================================"
        );

        console.log(
            "BACKROOMS READY"
        );

        console.log(
            "Hiding spots:",
            hidingSpots.length
        );

        console.log(
            "Holes:",
            holeSpots.length
        );

        console.log(
            "================================"
        );

    }catch(error){

        console.error(error);

        const errorBox =
            document.getElementById(
                "error"
            );

        errorBox.style.display="block";

        errorBox.textContent =
            "BACKROOMS INITIALIZATION ERROR\n\n"+
            (
                error &&
                error.stack
                ?
                error.stack
                :
                String(error)
            );

    }

}

initialize();

</script>
