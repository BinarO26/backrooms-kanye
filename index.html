<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Backrooms</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

button{
    width:340px;
    padding:15px;
    margin:6px;
    border:1px solid #777;
    background:#151515;
    color:#eee;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#403b17;
    border-color:#d9cc61;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:
        radial-gradient(
            ellipse at center,
            rgba(70,65,30,.8),
            rgba(0,0,0,.97)
        );
}

#pause,
#death{
    display:none;
}

#death{
    background:
        radial-gradient(
            ellipse at center,
            rgba(65,0,0,.55),
            rgba(0,0,0,.98)
        );
}

h1{
    margin:0 0 12px;
    color:#d8cb60;
    font-size:45px;
    letter-spacing:8px;
    text-shadow:0 0 25px #000;
}

.subtitle{
    color:#aaa;
    margin-bottom:20px;
}

.difficultyTitle{
    color:#aaa;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:6px;
}

.difficulty{
    display:flex;
    gap:6px;
    margin-bottom:16px;
}

.difficulty button{
    width:105px;
    padding:10px 4px;
    margin:0;
    font-size:12px;
}

.difficulty button.selected{
    background:#5a521f;
    border-color:#e0d36a;
}

.controls{
    color:#999;
    text-align:center;
    font-size:12px;
    line-height:1.8;
    margin-top:18px;
}

#crosshair{
    position:fixed;
    z-index:20;

    top:50%;

    margin:-2px;

    pointer-events:none;
}

#hud{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:20;
    color:#fff;
    font-size:13px;

}

#difficultyHud{
    margin-top:4px;
    color:#aaa;
    font-size:11px;
}

#rec{
    position:fixed;
    top:18px;
    right:18px;
    z-index:20;
    color:#fff;

    text-shadow:2px 2px 6px #000;
}

#recDot{
    display:inline-block;
    width:8px;
    height:8px;
    margin-right:5px;
    border-radius:50%;
    background:red;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%,45%{opacity:1}

}

#film{
    position:fixed;
    inset:0;
    z-index:15;
    pointer-events:none;

    background:
        repeating-linear-gradient(

            rgba(255,255,255,.04) 0,
            rgba(255,255,255,.04) 1px,

}

#vignette{
    position:fixed;
    inset:0;
    z-index:16;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 52%,
            rgba(0,0,0,.1) 75%,

        );
}

#message{
    position:fixed;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    color:white;
    font-size:16px;
    text-shadow:2px 2px 8px #000;
    pointer-events:none;
}

#error{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:500;
    display:none;
    padding:15px;
    background:#450000;
    border:1px solid red;
    color:white;
    font:13px monospace;
    white-space:pre-wrap;
}

.deathTitle{
    color:#b40000;
    font-size:55px;
    letter-spacing:9px;
    text-shadow:0 0 30px #000;
}

.deathText{
    color:#aaa;
    margin:8px 0 22px;
}

#textureStatus{
    margin-top:10px;
    color:#777;
    font:10px monospace;
}
</style>
</head>

<body>

     MAIN MENU
========================= -->

</div>

========================= -->

</div>


<div id="crosshair"></div>

<script src="./three.min.js"></script>

<script>
"use strict";


/* =========================================================
   BASIC CHECK
========================================================= */

if(typeof THREE === "undefined"){

    showError(
        "three.min.js could not be loaded."
    );

    throw new Error(
        "Three.js missing"
    );

}


/* =========================================================
   IMPORTANT PATH FIX
========================================================= */

/*
    Instead of assuming the browser's current URL,
    construct the texture URL relative to index.html.

    This works on:

    GitHub Pages:
    /backrooms-kanye/

    localhost:

    normal file hosting:
    /anything/
*/

const BASE =
    new URL(
        "./",
        document.baseURI
    );


/*
    Cache-busting is intentional.

    It prevents GitHub Pages/browser caching from
    continuing to use an older texture.
*/

const CACHE =
    "?v=20260808";


const TEXTURE_URLS = {

    floor:
        new URL(
            "textures/floor.png",
            BASE
        ).href +
        CACHE,

    wall:
        new URL(
            "textures/wall.png",
            BASE
        ).href +
        CACHE,

    ceiling:
        new URL(
            "textures/ceiling.png",
            BASE
        ).href +
        CACHE

};


const ENTITY_URL =
    new URL(
        "entity.png",
        BASE
    ).href +
    CACHE;


const AUDIO_URL =
    new URL(
        "entity.mp3",
        BASE
    ).href;


/* =========================================================
   RENDERER
========================================================= */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .03,
        250
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

/*
    Shorter player.

    Ceiling = 3.1

    Eyes = 1.18

    This leaves a large visible gap between
    the player's head and ceiling.
*/

const EYE_HEIGHT = 1.18;

const PLAYER_HEIGHT = 1.55;

const PLAYER_RADIUS = .27;

const WALK_SPEED = 3.8;

const SPRINT_SPEED = 6.5;

const GRAVITY = 20;

const JUMP_SPEED = 6.3;


const player =
    new THREE.Object3D();


scene.add(player);


player.add(camera);


camera.position.set(
    0,
    EYE_HEIGHT,
    0
);


let yaw = 0;

let pitch = 0;

let velocityY = 0;

let grounded = true;


/* =========================================================
   STATE
========================================================= */

let running = false;

let paused = false;

let dead = false;

let difficulty = "normal";


let entity = null;

let entityTexture = null;


let worldObjects = [];

let walls = [];

let ceilingPanels = [];

let lightObjects = [];


/* =========================================================
   DIFFICULTIES
========================================================= */

const DIFFICULTIES = {

    easy:{
        name:"EASY",
        speed:1.5,
        chase:false
    },

    normal:{
        name:"NORMAL",
        speed:5.5,
        chase:true
    },

    hard:{
        name:"HARD",
        speed:7.0,
        chase:true
    },

    impossible:{
        name:"IMPOSSIBLE",
        speed:9.0,
        chase:true
    }

};


/* =========================================================
   ENTITY AI STATE
========================================================= */

/*
    These values make the entity jukeable.

    It cannot instantly rotate toward the player.

    It has:

    acceleration
    turning speed
    momentum
    last known position
    short memory after LOS breaks
*/

let entityVelocity =
    new THREE.Vector2(
        0,
        0
    );


let entityDirection =
    new THREE.Vector2(
        1,
        0
    );


let lastKnownPlayer =
    new THREE.Vector2(
        0,
        0
    );


let hasLastKnownPosition =
    false;


let lastSeenTimer = 0;

const LAST_SEEN_TIME = 2.8;


let wanderTimer = 0;

let wanderAngle = 0;


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


function loadTexture(
    url,
    name
){

    return new Promise(
        (resolve,reject)=>{

            textureLoader.load(

                url,

                texture=>{

                    console.log(
                        "Loaded texture:",
                        name,
                        url
                    );


                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    texture.wrapS =
                        THREE.RepeatWrapping;


                    texture.wrapT =
                        THREE.RepeatWrapping;


                    texture.anisotropy =
                        renderer
                        .capabilities
                        .getMaxAnisotropy();


                    resolve(texture);

                },

                undefined,

                error=>{

                    console.error(
                        "Texture failed:",
                        name,
                        url,
                        error
                    );


                    reject(
                        new Error(
                            "Failed to load " +
                            name +
                            " texture:\n" +
                            url
                        )
                    );

                }

            );

        }
    );

}


/* =========================================================
   MATERIAL CREATION
========================================================= */

let floorMaterial;

let wallMaterial;

let ceilingMaterial;


async function loadEnvironmentTextures(){

    const status =
        document.getElementById(
            "textureStatus"
        );


    try{

        status.textContent =
            "Loading floor.png...";


        const floorTexture =
            await loadTexture(
                TEXTURE_URLS.floor,
                "floor.png"
            );


        status.textContent =
            "Loading wall.png...";


        const wallTexture =
            await loadTexture(
                TEXTURE_URLS.wall,
                "wall.png"
            );


        status.textContent =
            "Loading ceiling.png...";


        const ceilingTexture =
            await loadTexture(
                TEXTURE_URLS.ceiling,
                "ceiling.png"
            );


        /*
            IMPORTANT:

            The PNGs themselves are used.
            There is NO procedural replacement
            texture anymore.
        */


        floorTexture.repeat.set(
            1,
            1
        );


        wallTexture.repeat.set(
            1,
            1
        );


        ceilingTexture.repeat.set(
            1,
            1
        );


        floorMaterial =
            new THREE.MeshStandardMaterial({

                map:floorTexture,

                color:0xffffff,

                roughness:1,

                metalness:0,

                side:
                    THREE.DoubleSide

            });


        wallMaterial =
            new THREE.MeshStandardMaterial({

                map:wallTexture,

                color:0xffffff,

                roughness:.95,

                metalness:0,

                side:
                    THREE.DoubleSide

            });


        /*
            The ceiling PNG is white.

            A warm yellow multiplier gives
            it the classic yellow Backrooms
            appearance without replacing
            the actual image.
        */

        ceilingMaterial =
            new THREE.MeshStandardMaterial({

                map:ceilingTexture,

                color:0xffe79a,

                roughness:1,

                metalness:0,

                side:
                    THREE.DoubleSide

            });


        status.textContent =
            "TEXTURES LOADED";


        status.style.color =
            "#aaa";


        return true;

    }
    catch(error){

        status.textContent =
            "TEXTURE ERROR — check console";


        showError(
            error.message +
            "\n\nExpected files:\n\n"+
            TEXTURE_URLS.floor+
            "\n"+
            TEXTURE_URLS.wall+
            "\n"+
            TEXTURE_URLS.ceiling
        );


        return false;

    }

}


/* =========================================================
   OBJECT MANAGEMENT
========================================================= */

function addObject(
    object
){

    scene.add(object);

    worldObjects.push(
        object
    );

    return object;

}


function clearWorld(){

    for(
        const object of worldObjects
    ){

        scene.remove(
            object
        );


        if(
            object.geometry
        ){

            object.geometry.dispose();

        }

    }


    worldObjects = [];

    walls = [];

    ceilingPanels = [];

    lightObjects = [];

    entity = null;

}


/* =========================================================
   FLOOR
========================================================= */

function addFloor(){

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            floorMaterial

        );


    floor.rotation.x =
        -Math.PI/2;


    floor.position.y =
        0;


    floor.receiveShadow =
        true;


    addObject(
        floor
    );

}


/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
){

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            wallMaterial

        );


    wall.position.set(
        x,
        y,
        z
    );


    wall.castShadow =
        true;


    wall.receiveShadow =
        true;


    addObject(
        wall
    );


    walls.push({

        minX:
            x-width/2,

        maxX:
            x+width/2,

        minY:
            y-height/2,

        maxY:
            y+height/2,

        minZ:
            z-depth/2,

        maxZ:
            z+depth/2

    });

}


/* =========================================================
   CEILING PANELS
========================================================= */

/*
    Ceiling panel = 1 × 1

    Light fixture = 2 × 2

    Therefore the light takes up twice
    the width and twice the height of
    one ceiling square.
*/

const CEILING_PANEL_SIZE = 1;

const LIGHT_SIZE = 2;


function addCeiling(){

    const ceilingSizeX = 180;

    const ceilingSizeZ = 160;

    const y = 3.1;


    /*
        Build the ceiling out of actual
        square panels.

        This makes the individual squares
        visible rather than one giant flat
        surface.
    */

    for(
        let x =
            -ceilingSizeX/2;
        x <
            ceilingSizeX/2;
        x +=
            CEILING_PANEL_SIZE
    ){

        for(
            let z =
                -ceilingSizeZ/2;
            z <
                ceilingSizeZ/2;
            z +=
                CEILING_PANEL_SIZE
        ){

            const panel =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        CEILING_PANEL_SIZE,
                        CEILING_PANEL_SIZE
                    ),

                    ceilingMaterial

                );


            /*
                Ceiling faces downward.
            */

            panel.rotation.x =
                Math.PI/2;


            panel.position.set(
                x+.5,
                y,
                z+.5
            );


            panel.receiveShadow =
                true;


            addObject(
                panel
            );


            ceilingPanels.push(
                panel
            );

        }

    }

}


/* =========================================================
   LIGHTS
========================================================= */

function addLight(
    x,
    z
){

    /*
        2 × 2 square light.

        This is deliberately much larger
        than an individual 1 × 1 ceiling
        panel.
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                LIGHT_SIZE,
                .055,
                LIGHT_SIZE
            ),

            new THREE.MeshBasicMaterial({

                color:0xffffdc

            })

        );


    fixture.position.set(
        x,
        3.025,
        z
    );


    addObject(
        fixture
    );


    const light =
        new THREE.PointLight(
            0xffe8a8,
            1.15,
            15
        );


    light.position.set(
        x,
        2.85,
        z
    );


    light.castShadow =
        true;


    light.shadow.mapSize.width =
        512;


    light.shadow.mapSize.height =
        512;


    addObject(
        light
    );


    lightObjects.push(
        light
    );

}


/* =========================================================
   LEVEL
========================================================= */

function buildLevel(){

    clearWorld();


    scene.background =
        new THREE.Color(
            0x756d38
        );


    scene.fog =
        new THREE.Fog(
            0x756d38,
            45,
            150
        );


    /*
        Enough ambient light to see
        the actual textures clearly.
    */

    addObject(
        new THREE.HemisphereLight(
            0xffefb0,
            0x302b1c,
            1.65
        )
    );


    addObject(
        new THREE.AmbientLight(
            0xffe9a8,
            .65
        )
    );


    addFloor();


    addCeiling();


    const H = 3.1;


    /* OUTER WALLS */

    addWall(
        180,
        H,
        1,
        0,
        H/2,
        -80
    );


    addWall(
        180,
        H,
        1,
        0,
        H/2,
        80
    );


    addWall(
        1,
        H,
        160,
        -90,
        H/2,
        0
    );


    addWall(
        1,
        H,
        160,
        90,
        H/2,
        0
    );


    /* LARGE ROOMS */

    addWall(
        1,
        H,
        95,
        -55,
        H/2,
        0
    );


    addWall(
        1,
        H,
        95,
        55,
        H/2,
        0
    );


    addWall(
        75,
        H,
        1,
        0,
        H/2,
        -52
    );


    addWall(
        75,
        H,
        1,
        0,
        H/2,
        52
    );


    /* INTERIOR WALLS */

    addWall(
        35,
        H,
        1,
        -25,
        H/2,
        -25
    );


    addWall(
        35,
        H,
        1,
        25,
        H/2,
        25
    );


    addWall(
        1,
        H,
        30,
        -42,
        H/2,
        27
    );


    addWall(
        1,
        H,
        30,
        42,
        H/2,
        -27
    );


    /* CLAUSTROPHOBIC SECTION */

    for(
        let i=0;
        i<7;
        i++
    ){

        addWall(
            .8,
            H,
            25,
            -35+i*5,
            H/2,
            0
        );

    }


    /* MORE ROOMS */

    addWall(
        18,
        H,
        1,
        -68,
        H/2,
        -35
    );


    addWall(
        1,
        H,
        20,
        -77,
        H/2,
        -25
    );


    addWall(
        20,
        H,
        1,
        65,
        H/2,
        38
    );


    addWall(
        1,
        H,
        20,
        55,
        H/2,
        48
    );


    /*
        LIGHT GRID

        2×2 lights spaced farther apart
        so the ceiling panels remain visible.
    */

    for(
        let x=-80;
        x<=80;
        x+=10
    ){

        for(
            let z=-70;
            z<=70;
            z+=10
        ){

            addLight(
                x,
                z
            );

        }

    }


    /*
        Player spawn.
    */

    player.position.set(
        -70,
        0,
        -65
    );


    yaw = 0;

    pitch = 0;

    velocityY = 0;

    grounded = true;


    player.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;


    return true;

}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function playerCollides(
    x,
    z
){

    const bottom =
        player.position.y;


    const top =
        bottom+
        PLAYER_HEIGHT;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+
            dz*dz <
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY
========================================================= */

const ENTITY_HEIGHT =
    1.55;


const ENTITY_RADIUS =
    .43;


async function createEntity(){

    try{

        entityTexture =
            await loadTexture(
                ENTITY_URL,
                "entity.png"
            );


        /*
            Preserve the ACTUAL PNG aspect
            ratio.

            Nothing is cropped.
            Nothing is stretched vertically.
        */

        const image =
            entityTexture.image;


        const aspect =
            image.width/
            image.height;


        /*
            Entity is slightly taller than
            the player but nowhere near the
            ceiling.
        */

        const width =
            ENTITY_HEIGHT*
            aspect;


        const material =
            new THREE.MeshBasicMaterial({

                map:
                    entityTexture,

                transparent:true,

                alphaTest:.01,

                side:
                    THREE.DoubleSide,

                depthWrite:true,

                fog:false,

                toneMapped:false

            });


        entity =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    width,
                    ENTITY_HEIGHT
                ),

                material

            );


        entity.position.set(
            35,
            ENTITY_HEIGHT/2,
            35
        );


        addObject(
            entity
        );


        entityVelocity.set(
            0,
            0
        );


        entityDirection.set(
            1,
            0
        );


        hasLastKnownPosition =
            false;


        lastSeenTimer = 0;


        return true;

    }
    catch(error){

        showError(
            "entity.png failed to load.\n\n"+
            error.message
        );


        return false;

    }

}


/* =========================================================
   ENTITY WALL COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
){

    const bottom = 0;

    const top =
        ENTITY_HEIGHT;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+
            dz*dz <
            ENTITY_RADIUS*
            ENTITY_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   LINE OF SIGHT
========================================================= */

function lineBlocked(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2-x1;


    const dz =
        z2-z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance<.01
    ){

        return false;

    }


    const steps =
        Math.ceil(
            distance/.3
        );


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t =
            i/steps;


        const x =
            x1+
            dx*t;


        const z =
            z1+
            dz*t;


        if(
            entityHitsWall(
                x,
                z
            )
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY PATH DIRECTION
========================================================= */

function chooseEntityDirection(){

    if(!entity){
        return null;
    }


    /*
        If we can see the player,
        target the player directly.
    */

    const canSee =
        !lineBlocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z

        );


    let targetX;

    let targetZ;


    if(canSee){

        targetX =
            player.position.x;

        targetZ =
            player.position.z;


        lastKnownPlayer.set(
            targetX,
            targetZ
        );


        hasLastKnownPosition =
            true;


        lastSeenTimer =
            LAST_SEEN_TIME;

    }

    else if(
        hasLastKnownPosition &&
        lastSeenTimer>0
    ){

        /*
            The player juked around a wall.

            The entity only knows the last
            position it actually saw.
        */

        targetX =
            lastKnownPlayer.x;

        targetZ =
            lastKnownPlayer.y;

    }

    else{

        return null;

    }


    const dx =
        targetX-
        entity.position.x;


    const dz =
        targetZ-
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance<.05
    ){

        return null;

    }


    const targetAngle =
        Math.atan2(
            dz,
            dx
        );


    let best = null;


    /*
        Try many directions.

        This allows it to intelligently
        find a route around walls.
    */

    for(
        let i=0;
        i<48;
        i++
    ){

        const angle =
            i/
            48*
            Math.PI*2;


        const dirX =
            Math.cos(
                angle
            );


        const dirZ =
            Math.sin(
                angle
            );


        /*
            Look farther ahead.

            This prevents the entity from
            just repeatedly walking into
            the same wall.
        */

        const testDistance =
            2.4;


        const testX =
            entity.position.x+
            dirX*
            testDistance;


        const testZ =
            entity.position.z+
            dirZ*
            testDistance;


        if(
            entityHitsWall(
                testX,
                testZ
            )
        ){

            continue;

        }


        const remaining =
            Math.hypot(
                targetX-testX,
                targetZ-testZ
            );


        let angleDifference =
            Math.abs(
                angle-targetAngle
            );


        if(
            angleDifference>
            Math.PI
        ){

            angleDifference =
                Math.PI-
                angleDifference;

        }


        /*
            Prefer directions toward the
            target, but don't require a
            straight line.
        */

        const score =
            remaining+
            angleDifference*.55;


        if(
            best===null ||
            score<best.score
        ){

            best = {

                x:dirX,

                z:dirZ,

                score:score

            };

        }

    }


    return best;

}


/* =========================================================
   ANGLE HELPERS
========================================================= */

function normalizeAngle(
    angle
){

    while(
        angle>Math.PI
    ){

        angle-=Math.PI*2;

    }


    while(
        angle<-Math.PI
    ){

        angle+=Math.PI*2;

    }


    return angle;

}


/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        dead
    ){

        return;

    }


    const settings =
        DIFFICULTIES[
            difficulty
        ];


    const dx =
        player.position.x-
        entity.position.x;


    const dz =
        player.position.z-
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    /*
        =====================================================
        EASY
        =====================================================

        Peaceful wandering.
    */

    if(
        !settings.chase
    ){

        wanderTimer -= dt;


        if(
            wanderTimer<=0
        ){

            wanderTimer =
                1+
                Math.random()*4;


            wanderAngle =
                Math.random()*
                Math.PI*2;

        }


        const targetX =
            Math.cos(
                wanderAngle
            );


        const targetZ =
            Math.sin(
                wanderAngle
            );


        const targetSpeed =
            settings.speed;


        entityVelocity.x =
            THREE.MathUtils.lerp(
                entityVelocity.x,
                targetX*targetSpeed,
                Math.min(
                    1,
                    dt*1.8
                )
            );


        entityVelocity.y =
            THREE.MathUtils.lerp(
                entityVelocity.y,
                targetZ*targetSpeed,
                Math.min(
                    1,
                    dt*1.8
                )
            );

    }


    /*
        =====================================================
        CHASE
        =====================================================
    */

    else{

        const direction =
            chooseEntityDirection();


        /*
            Player is visible or the entity
            is moving toward the last position.
        */

        if(direction){

            const targetAngle =
                Math.atan2(
                    direction.z,
                    direction.x
                );


            const currentAngle =
                Math.atan2(
                    entityDirection.y,
                    entityDirection.x
                );


            let angleDifference =
                normalizeAngle(
                    targetAngle-
                    currentAngle
                );


            /*
                Limited turn rate.

                THIS is what makes the entity
                jukeable.

                It cannot instantly snap
                toward the player.
            */

            const maxTurn =
                2.2*
                dt;


            if(
                Math.abs(
                    angleDifference
                )>maxTurn
            ){

                angleDifference =
                    Math.sign(
                        angleDifference
                    )*
                    maxTurn;

            }


            const newAngle =
                currentAngle+
                angleDifference;


            entityDirection.x =
                Math.cos(
                    newAngle
                );


            entityDirection.y =
                Math.sin(
                    newAngle
                );


            /*
                Accelerate rather than instantly
                reaching maximum speed.
            */

            const targetSpeed =
                settings.speed;


            const desiredX =
                entityDirection.x*
                targetSpeed;


            const desiredZ =
                entityDirection.y*
                targetSpeed;


            entityVelocity.x =
                THREE.MathUtils.lerp(
                    entityVelocity.x,
                    desiredX,
                    Math.min(
                        1,
                        dt*2.6
                    )
                );


            entityVelocity.y =
                THREE.MathUtils.lerp(
                    entityVelocity.y,
                    desiredZ,
                    Math.min(
                        1,
                        dt*2.6
                    )
                );

        }

        else{

            /*
                No target.

                Slow down instead of
                magically knowing where the
                player is.
            */

            entityVelocity.x *=
                Math.pow(
                    .08,
                    dt
                );


            entityVelocity.y *=
                Math.pow(
                    .08,
                    dt
                );

        }

    }


    /*
        =====================================================
        MOVE ENTITY
        =====================================================
    */

    const nx =
        entity.position.x+
        entityVelocity.x*
        dt;


    const nz =
        entity.position.z+
        entityVelocity.y*
        dt;


    /*
        If a wall is directly ahead,
        try sliding along it.

        This makes corner behavior much
        more natural.
    */

    if(
        !entityHitsWall(
            nx,
            entity.position.z
        )
    ){

        entity.position.x =
            nx;

    }
    else{

        entityVelocity.x *=
            .15;

    }


    if(
        !entityHitsWall(
            entity.position.x,
            nz
        )
    ){

        entity.position.z =
            nz;

    }
    else{

        entityVelocity.y *=
            .15;

    }


    /*
        Last-known-position timer.
    */

    if(
        !lineBlocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        )
    ){

        lastKnownPlayer.set(
            player.position.x,
            player.position.z
        );


        hasLastKnownPosition =
            true;


        lastSeenTimer =
            LAST_SEEN_TIME;

    }
    else{

        lastSeenTimer -= dt;

    }


    /*
        Collision/death.

        Slightly tighter than before so
        the player can actually dodge
        around the entity.
    */

    if(
        distance<.82
    ){

        killPlayer();

    }


    /*
        Rotate the PNG toward the player.

        Rotation does NOT change its size.
    */

    entity.rotation.y =
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
){

    const direction =
        new THREE.Vector3();


    if(keys.w)
        direction.z -= 1;


    if(keys.s)
        direction.z += 1;


    if(keys.a)
        direction.x -= 1;


    if(keys.d)
        direction.x += 1;


    if(
        direction.lengthSq()>0
    ){

        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        /*
            NO SPRINT COOLDOWN.
        */

        const speed =
            keys.shift
                ? SPRINT_SPEED
                : WALK_SPEED;


        const amount =
            speed*
            dt;


        const nx =
            player.position.x+
            direction.x*
            amount;


        if(
            !playerCollides(
                nx,
                player.position.z
            )
        ){

            player.position.x =
                nx;

        }


        const nz =
            player.position.z+
            direction.z*
            amount;


        if(
            !playerCollides(
                player.position.x,
                nz
            )
        ){

            player.position.z =
                nz;

        }

    }


    /*
        Jump.
    */

    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;

        grounded =
            false;

    }


    jumpPressed = false;


    velocityY -=
        GRAVITY*
        dt;


    player.position.y +=
        velocityY*
        dt;


    if(
        player.position.y<=0
    ){

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;

    }

}


/* =========================================================
   CAMERA
========================================================= */

let cameraTime = 0;


function updateCamera(
    dt
){

    cameraTime += dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const strength =
        moving
            ? .005
            : .0015;


    camera.position.x =
        Math.sin(
            cameraTime*3
        )*
        strength;


    camera.position.y =
        EYE_HEIGHT+
        Math.sin(
            cameraTime*4
        )*
        strength;


    camera.rotation.z =
        Math.sin(
            cameraTime*1.3
        )*
        .0012;

}


/* =========================================================
   ENTITY AUDIO
========================================================= */

const entityAudio =
    new Audio(
        AUDIO_URL
    );


entityAudio.loop =
    true;


entityAudio.volume =
    0;


function updateEntityAudio(){

    if(
        !entity ||
        !running ||
        paused ||
        dead
    ){

        entityAudio.volume =
            0;

        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }

        return;

    }


    const dx =
        entity.position.x-
        player.position.x;


    const dz =
        entity.position.z-
        player.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const MAX_DISTANCE =
        30;


    if(
        distance>=MAX_DISTANCE
    ){

        entityAudio.volume =
            0;


        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }


        return;

    }


    let volume =
        1-
        distance/
        MAX_DISTANCE;


    volume =
        Math.pow(
            volume,
            1.8
        )*
        .85;


    /*
        Walls muffle the entity.
    */

    if(
        lineBlocked(
            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z
        )
    ){

        volume *= .18;

    }


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .85
        );


    if(
        entityAudio.paused &&
        volume>.01
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );

    }

}


/* =========================================================
   START
========================================================= */

async function startGame(){

    if(
        !floorMaterial ||
        !wallMaterial ||
        !ceilingMaterial
    ){

        const loaded =
            await loadEnvironmentTextures();


        if(!loaded){
            return;
        }

    }


    const levelBuilt =
        buildLevel();


    if(!levelBuilt){
        return;
    }


    await createEntity();


    running = true;

    paused = false;

    dead = false;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            difficulty
        ].name;


    entityAudio.pause();

    entityAudio.currentTime =
        0;

    entityAudio.volume =
        0;


    document.body.requestPointerLock();

}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(){

    if(dead){
        return;
    }


    dead = true;

    running = false;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    document.getElementById(
        "death"
    ).style.display =
        "flex";

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(paused){

        paused = false;


        document.getElementById(
            "pause"
        ).style.display =
            "none";


        document.body.requestPointerLock();

    }
    else{

        paused = true;


        document.getElementById(
            "pause"
        ).style.display =
            "flex";


        entityAudio.pause();


        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    }

}


/* =========================================================
   MAIN MENU
========================================================= */

function returnToMenu(){

    running = false;

    paused = false;

    dead = false;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";

}


/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(
    value
){

    difficulty =
        value;


    document
        .querySelectorAll(
            ".difficulty button"
        )
        .forEach(
            button=>{
                button.classList.remove(
                    "selected"
                );
            }
        );


    document.getElementById(
        value+
        "Btn"
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            value
        ].name;

}


document.getElementById(
    "easyBtn"
).onclick =
    ()=>setDifficulty(
        "easy"
    );


document.getElementById(
    "normalBtn"
).onclick =
    ()=>setDifficulty(
        "normal"
    );


document.getElementById(
    "hardBtn"
).onclick =
    ()=>setDifficulty(
        "hard"
    );


document.getElementById(
    "impossibleBtn"
).onclick =
    ()=>setDifficulty(
        "impossible"
    );


document.getElementById(
    "startBtn"
).onclick =
    ()=>startGame();


document.getElementById(
    "resumeBtn"
).onclick =
    ()=>togglePause();


document.getElementById(
    "restartBtn"
).onclick =
    ()=>startGame();


document.getElementById(
    "menuBtn"
).onclick =
    ()=>returnToMenu();


document.getElementById(
    "retryBtn"
).onclick =
    ()=>startGame();


document.getElementById(
    "deathMenuBtn"
).onclick =
    ()=>returnToMenu();


/* =========================================================
   CLICK TO RELOCK MOUSE
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            running &&
            !paused &&
            !dead &&
            document.pointerLockElement !==
            document.body
        ){

            document.body.requestPointerLock();

        }

    }
);


/* =========================================================
   ERROR
========================================================= */

function showError(
    text
){

    const error =
        document.getElementById(
            "error"
        );


    error.style.display =
        "block";


    error.textContent =
        text;

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   INITIAL TEXTURE LOAD
========================================================= */

loadEnvironmentTextures();


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateEntityAudio();

        updateCamera(dt);

    }
    else{

        updateEntityAudio();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
