<script>
"use strict";

/* =========================================================
   BASIC CHECK
========================================================= */

if(typeof THREE === "undefined"){
    const e=document.getElementById("error");
    e.style.display="block";
    e.textContent=
        "THREE.JS COULD NOT BE LOADED.\n\n"+
        "Make sure three.min.js is in the repository root.";
    throw new Error("Three.js missing");
}

/* =========================================================
   CONSTANTS
========================================================= */

const TILE=3;
const WALL_HEIGHT=8.8;

const PLAYER_RADIUS=.42;
const EYE_HEIGHT=5.25;
const CROUCH_EYE_HEIGHT=3.15;

const WALK_SPEED=4.15;
const SPRINT_SPEED=7.1;
const SPRINT_JUMP_SPEED=7.8;

const GRAVITY=22;
const JUMP_SPEED=7.2;

const MAP_PATH="./textures/map1.png";
const WALL_PATH="./textures/wall.png";
const FLOOR_PATH="./textures/floor.png";
const CEILING_PATH="./textures/ceiling.png";

const ENTITY_IMAGE="./entity.png";
const ENTITY_SOUND="./entity.mp3";

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted=false;
let paused=false;
let dead=false;

let difficulty="normal";

let mapWidth=0;
let mapHeight=0;
let mapData=[];

let playerSpawn=null;
let entitySpawn=null;

let playerCell={
    x:0,
    y:0
};

const wallColliders=[];
const hidingSpots=[];
const holeCells=[];
const holeComponents=[];

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=true;

let crouching=false;
let hidden=false;
let falling=false;
let fallTimer=0;

const keys={};

let messageTimer=0;
let gameTime=0;

/* =========================================================
   THREE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x6f6948);

scene.fog=new THREE.Fog(
    0x6f6948,
    22,
    92
);

const camera=new THREE.PerspectiveCamera(
    78,
    innerWidth/innerHeight,
    .05,
    160
);

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance",
    precision:"mediump"
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.15)
);

if("outputColorSpace" in renderer){
    renderer.outputColorSpace=THREE.SRGBColorSpace;
}

renderer.toneMapping=THREE.NoToneMapping;

document.body.appendChild(renderer.domElement);

const player=new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.y=EYE_HEIGHT;

const world=new THREE.Group();

scene.add(world);

/* =========================================================
   TEXTURES
========================================================= */

const loader=new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;
let entityTexture=null;

function configureTexture(tex,repeatX,repeatY){

    if(!tex)return null;

    tex.colorSpace=THREE.SRGBColorSpace;

    tex.wrapS=THREE.RepeatWrapping;
    tex.wrapT=THREE.RepeatWrapping;

    tex.repeat.set(repeatX,repeatY);

    tex.magFilter=THREE.LinearFilter;
    tex.minFilter=THREE.LinearMipmapLinearFilter;

    tex.anisotropy=Math.min(
        renderer.capabilities.getMaxAnisotropy(),
        4
    );

    tex.needsUpdate=true;

    return tex;
}

function loadTexture(path,rx,ry){

    return new Promise(resolve=>{

        loader.load(
            path,
            tex=>{
                console.log("Loaded:",path);
                resolve(configureTexture(tex,rx,ry));
            },
            undefined,
            err=>{
                console.error("Texture failed:",path,err);
                resolve(null);
            }
        );

    });
}

/* =========================================================
   MAP CLASSIFICATION
========================================================= */

function classifyPixel(r,g,b){

    /*
       WALL = dark
    */

    if(Math.max(r,g,b)<90){
        return "wall";
    }

    /*
       PLAYER SPAWN = red
    */

    if(
        r>150 &&
        r>g*1.45 &&
        r>b*1.35
    ){
        return "spawn";
    }

    /*
       ENTITY = blue
    */

    if(
        b>130 &&
        b>r*1.3 &&
        b>g*1.15
    ){
        return "entity";
    }

    /*
       HIDE = purple / magenta
    */

    if(
        r>115 &&
        b>100 &&
        g<105
    ){
        return "hide";
    }

    /*
       HOLE = yellow/orange
    */

    if(
        r>145 &&
        g>115 &&
        b<125 &&
        r>g*.9
    ){
        return "hole";
    }

    return "floor";
}

/* =========================================================
   MAP LOADING
========================================================= */

function cellToWorld(x,y){

    return {
        x:(x+.5)*TILE-mapWidth*TILE/2,
        z:(y+.5)*TILE-mapHeight*TILE/2
    };

}

function worldToCell(x,z){

    return {
        x:Math.floor(
            (x+mapWidth*TILE/2)/TILE
        ),
        y:Math.floor(
            (z+mapHeight*TILE/2)/TILE
        )
    };

}

async function loadMap(){

    const img=await new Promise((resolve,reject)=>{

        const i=new Image();

        i.onload=()=>resolve(i);

        i.onerror=()=>{
            reject(
                new Error(
                    "Could not load "+MAP_PATH
                )
            );
        };

        i.src=MAP_PATH+"?v="+Date.now();

    });

    mapWidth=img.naturalWidth;
    mapHeight=img.naturalHeight;

    const canvas=document.createElement("canvas");

    canvas.width=mapWidth;
    canvas.height=mapHeight;

    const ctx=canvas.getContext("2d",{
        willReadFrequently:true
    });

    ctx.drawImage(img,0,0);

    const pixels=ctx.getImageData(
        0,
        0,
        mapWidth,
        mapHeight
    ).data;

    mapData=new Array(mapHeight);

    for(let y=0;y<mapHeight;y++){

        mapData[y]=new Array(mapWidth);

        for(let x=0;x<mapWidth;x++){

            const i=(y*mapWidth+x)*4;

            const type=classifyPixel(
                pixels[i],
                pixels[i+1],
                pixels[i+2]
            );

            mapData[y][x]=type;

            const p=cellToWorld(x,y);

            if(type==="spawn"&&!playerSpawn){
                playerSpawn=p;
            }

            if(type==="entity"&&!entitySpawn){
                entitySpawn=p;
            }

            if(type==="hide"){
                hidingSpots.push({
                    x:p.x,
                    z:p.z,
                    cellX:x,
                    cellY:y
                });
            }

            if(type==="hole"){
                holeCells.push({
                    x:p.x,
                    z:p.z,
                    cellX:x,
                    cellY:y
                });
            }
        }
    }

    /*
       Fallback player position.
    */

    if(!playerSpawn){

        for(let y=0;y<mapHeight&&!playerSpawn;y++){

            for(let x=0;x<mapWidth;x++){

                if(
                    mapData[y][x]==="floor"
                ){
                    playerSpawn=cellToWorld(x,y);
                    break;
                }
            }
        }
    }

    if(!entitySpawn){

        entitySpawn={
            x:playerSpawn.x+TILE*10,
            z:playerSpawn.z+TILE*10
        };
    }

    buildHoleComponents();

    console.log(
        "MAP:",
        mapWidth,
        "x",
        mapHeight,
        "holes:",
        holeCells.length,
        "hiding spots:",
        hidingSpots.length
    );
}

/* =========================================================
   CONNECTED HOLE COMPONENTS
========================================================= */

function buildHoleComponents(){

    const visited=new Set();

    function key(x,y){
        return x+","+y;
    }

    const dirs=[
        [1,0],
        [-1,0],
        [0,1],
        [0,-1]
    ];

    for(const start of holeCells){

        const startKey=key(
            start.cellX,
            start.cellY
        );

        if(visited.has(startKey))
            continue;

        const queue=[start];
        const component=[];

        visited.add(startKey);

        while(queue.length){

            const current=queue.shift();

            component.push(current);

            for(const d of dirs){

                const nx=current.cellX+d[0];
                const ny=current.cellY+d[1];

                if(
                    nx<0||
                    ny<0||
                    nx>=mapWidth||
                    ny>=mapHeight
                )
                    continue;

                if(
                    mapData[ny][nx]!=="hole"
                )
                    continue;

                const k=key(nx,ny);

                if(visited.has(k))
                    continue;

                visited.add(k);

                const p=cellToWorld(nx,ny);

                queue.push({
                    x:p.x,
                    z:p.z,
                    cellX:nx,
                    cellY:ny
                });
            }
        }

        holeComponents.push(component);
    }
}

function wallMaterial(){

/* =========================================================
   OPTIMIZED WORLD BUILDING
========================================================= */

let floorMesh=null;
let ceilingMesh=null;
let wallMesh=null;

function makeInstancedMesh(
    geometry,
    material,
    positions
){

    if(!positions.length)
        return null;

    const mesh=new THREE.InstancedMesh(
        geometry,
        material,
        positions.length
    );

    const dummy=new THREE.Object3D();

    for(
        let i=0;
        i<positions.length;
        i++
    ){

        dummy.position.set(
            positions[i].x,
            positions[i].y,
            positions[i].z
        );

        dummy.rotation.set(
            positions[i].rx||0,
            positions[i].ry||0,
            positions[i].rz||0
        );

        dummy.scale.set(
            positions[i].sx||1,
            positions[i].sy||1,
            positions[i].sz||1
        );

        dummy.updateMatrix();

        mesh.setMatrixAt(
            i,
            dummy.matrix
        );
    }

    mesh.instanceMatrix.needsUpdate=true;

    world.add(mesh);

    return mesh;
}

function buildWorld(){

    const floors=[];
    const ceilings=[];
    const walls=[];

    for(let y=0;y<mapHeight;y++){

        for(let x=0;x<mapWidth;x++){

            const type=mapData[y][x];

            const p=cellToWorld(x,y);

            /*
               HOLE:
               NO FLOOR INSTANCE.

               This is the important part:
               hole cells do not receive floor.png.
            */

            if(
                type!=="wall" &&
                type!=="hole"
            ){

                floors.push({
                    x:p.x,
                    y:0,
                    z:p.z,
                    rx:-Math.PI/2
                });

                ceilings.push({
                    x:p.x,
                    y:WALL_HEIGHT,
                    z:p.z,
                    rx:Math.PI/2
                });

            }

            /*
               Holes still receive ceilings only when desired.
               For a real opening, leave the ceiling above it
               absent too.
            */

            if(type==="hole"){

                /*
                   No floor.
                   No ceiling.
                */

            }

            if(type==="wall"){

                walls.push({
                    x:p.x,
                    y:WALL_HEIGHT/2,
                    z:p.z
                });

            }

        }
    }

    const floorGeometry=new THREE.PlaneGeometry(
        TILE,
        TILE
    );

    const ceilingGeometry=new THREE.PlaneGeometry(
        TILE,
        TILE
    );

    const wallGeometry=new THREE.BoxGeometry(
        TILE,
        WALL_HEIGHT,
        TILE
    );

    floorMesh=makeInstancedMesh(
        floorGeometry,
        floorMaterial(),
        floors
    );

    ceilingMesh=makeInstancedMesh(
        ceilingGeometry,
        ceilingMaterial(),
        ceilings
    );

    wallMesh=makeInstancedMesh(
        wallGeometry,
        wallMaterial(),
        walls
    );

    /*
       Collision boxes only for walls.
    */

    for(const p of walls){

        wallColliders.push({
            minX:p.x-TILE/2,
            maxX:p.x+TILE/2,
            minZ:p.z-TILE/2,
            maxZ:p.z+TILE/2
        });
    }
}

/* =========================================================
   3D HOLES
========================================================= */

function buildHoles(){

    /*
       Each connected hole component gets a single
       large dark recessed volume.

       Individual hole cells do NOT get floor.png.
    */

    const holeMaterial=new THREE.MeshBasicMaterial({
        color:0x080706,
        side:THREE.DoubleSide
    });

    const innerMaterial=new THREE.MeshBasicMaterial({
        color:0x17130c,
        side:THREE.DoubleSide
    });

    for(const component of holeComponents){

        if(!component.length)
            continue;

        /*
           Each cell gets a dark bottom.
           This is still considerably cheaper than
           creating a complete floor mesh.
        */

        for(const p of component){

            const bottom=new THREE.Mesh(
                new THREE.PlaneGeometry(
                    TILE,
                    TILE
                ),
                holeMaterial
            );

            bottom.rotation.x=-Math.PI/2;

            bottom.position.set(
                p.x,
                -4.8,
                p.z
            );

            world.add(bottom);

            /*
               Inner shaft walls only where the neighboring
               cell is NOT another hole.
            */

            const neighbors=[
                [1,0],
                [-1,0],
                [0,1],
                [0,-1]
            ];

            for(const n of neighbors){

                const nx=p.cellX+n[0];
                const ny=p.cellY+n[1];

                if(
                    nx>=0 &&
                    ny>=0 &&
                    nx<mapWidth &&
                    ny<mapHeight &&
                    mapData[ny][nx]==="hole"
                )
                    continue;

                const wall=new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        TILE,
                        5
                    ),
                    innerMaterial
                );

                wall.position.set(
                    p.x+n[0]*TILE/2,
                    -2.4,
                    p.z+n[1]*TILE/2
                );

                if(n[0]!==0){
                    wall.rotation.y=Math.PI/2;
                }

                world.add(wall);
            }
        }
    }
}

/* =========================================================
   LOCKER HIDING PLACES
========================================================= */

const lockerGroup=new THREE.Group();

world.add(lockerGroup);

const lockerMaterial=new THREE.MeshStandardMaterial({

function addLocker(p){

    );

    body.position.y=2.6;

    group.add(body);

    /*
       Dark door opening
    */

    const opening=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.08,
            4.45,
            .035
        ),
        lockerDarkMaterial
    );

    opening.position.set(
        0,
        2.65,
        -.425
    );

    group.add(opening);

    /*
       Door frame bars
    */

    const barGeo=new THREE.BoxGeometry(
        .09,
        4.7,

    );

    const left=new THREE.Mesh(
        barGeo,
        lockerMaterial
    );

    left.position.set(
        -.59,
        2.65,
        -.46
    );

    const right=left.clone();

    right.position.x=.59;

    group.add(left);
    group.add(right);

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.27,
            .09,
            .07
        ),

    );

    top.position.set(

function buildLockers(){

    /*
       Use map hiding pixels.

       We deliberately make these visible objects instead
       of invisible "hide zones".
    */

    for(const p of hidingSpots){

        addLocker(p);
    }
}

/* =========================================================
   LIGHTING
========================================================= */

const fluorescentLights=[];

function buildLights(){

    /*
       Sparse lights instead of one light per map pixel.
       This dramatically improves FPS.
    */

    const spacing=5;

    const fixtureGeometry=new THREE.BoxGeometry(
        TILE*.46,
        .055,
        TILE*.46
    );

    const fixtureMaterial=new THREE.MeshBasicMaterial({
        color:0xfff7d0
    });

    const fixturePositions=[];

    for(
        let y=1;
        y<mapHeight-1;
        y+=spacing
    ){

        for(
            let x=1;
            x<mapWidth-1;
            x+=spacing
        ){

            if(
                mapData[y][x]!=="wall" &&
                mapData[y][x]!=="hole"
            ){

                const p=cellToWorld(x,y);

                fixturePositions.push({
                    x:p.x,
                    y:WALL_HEIGHT-.08,
                    z:p.z
                });
            }
        }
    }

    if(fixturePositions.length){

        makeInstancedMesh(
            fixtureGeometry,
            fixtureMaterial,
            fixturePositions
        );
    }

    /*
       Only a limited number of actual dynamic lights.
       This is much cheaper than hundreds of PointLights.
    */

    const lightPositions=fixturePositions.slice(
        0,
        Math.min(fixturePositions.length,55)
    );

    for(const p of lightPositions){

        const light=new THREE.PointLight(
            0xffeeb0,
            2.0,
            15,
            2
        );

        light.position.set(
            p.x,
            WALL_HEIGHT-.25,
            p.z
        );

        scene.add(light);

        fluorescentLights.push({
            light,
            base:2,
            timer:.5+Math.random()*5
        });
    }

    /*
       Ambient found-footage lighting.
    */

    scene.add(
        new THREE.HemisphereLight(
            0xfff0b5,
            0x15130c,
            .45
        )
    );

    scene.add(
        new THREE.AmbientLight(
            0xffedba,
            .28
        )
    );
}

/* =========================================================
   PLAYER COLLISION
========================================================= */

function collides(x,z){

    const r=PLAYER_RADIUS;

    for(const wall of wallColliders){

        if(
            x+r>wall.minX &&
            x-r<wall.maxX &&
            z+r>wall.minZ &&
            z-r<wall.maxZ
        ){
            return true;
        }
    }

    return false;
}

function movePlayer(dx,dz){

    const nx=player.position.x+dx;
    const nz=player.position.z+dz;

    if(
        !collides(
            nx,
            player.position.z
        )
    ){
        player.position.x=nx;
    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){
        player.position.z=nz;
    }
}

/* =========================================================
   HIDE SYSTEM
========================================================= */

function updateHiding(){

    let closest=null;
    let distance=Infinity;

    for(const spot of hidingSpots){

        const d=Math.hypot(
            player.position.x-spot.x,
            player.position.z-spot.z
        );

        if(d<distance){
            distance=d;
            closest=spot;
        }
    }

    const near=
        closest &&
        distance<TILE*.9;

    hidden=
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity=
        near&&!hidden?"1":"0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity=
        hidden?"1":"0";
}

/* =========================================================
   HOLES
========================================================= */

function isHoleCell(x,y){

    if(
        x<0||
        y<0||
        x>=mapWidth||
        y>=mapHeight
    )
        return false;

    return mapData[y][x]==="hole";
}

function checkHole(){

    if(falling)
        return;

    const cell=worldToCell(
        player.position.x,
        player.position.z
    );

    playerCell.x=cell.x;
    playerCell.y=cell.y;

    if(
        isHoleCell(
            cell.x,
            cell.y
        )
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );
    }
}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted||
        paused||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const progress=Math.min(
            fallTimer/1.65,
            1
        );

        player.position.y=
            -progress*5;

        camera.position.y=
            EYE_HEIGHT-
            progress*1.2;

        camera.rotation.z=
            Math.sin(
                fallTimer*18
            )*.035;

        if(fallTimer>=1.65){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );
        }

        return;
    }

    crouching=!!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w)forward++;
    if(keys.s)forward--;
    if(keys.d)strafe++;
    if(keys.a)strafe--;

    const len=Math.hypot(
        forward,
        strafe
    );

    if(len>0){

        forward/=len;
        strafe/=len;

        const sprint=
            keys.shift &&
            !crouching;

        const speed=
            sprint?
                SPRINT_SPEED:
            crouching?
                WALK_SPEED*.55:
                WALK_SPEED;

        const sin=Math.sin(yaw);
        const cos=Math.cos(yaw);

        const dx=
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz=
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(dx,dz);
    }

    /*
       Gravity
    */

    velocityY-=GRAVITY*dt;

    player.position.y+=velocityY*dt;

    if(player.position.y<=0){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;
    }

    /*
       Jump.
       Sprint jump gets a little extra speed through
       forward movement.
    */

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY=
            keys.shift?
                SPRINT_JUMP_SPEED:
                JUMP_SPEED;

        grounded=false;
        keys.spacePressed=false;
    }

    const target=
        crouching?
            CROUCH_EYE_HEIGHT:
            EYE_HEIGHT;

    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            target,
            Math.min(dt*14,1)
        );

    updateHiding();
    checkHole();
}

/* =========================================================
   ENTITY
========================================================= */

let entity=null;
let entityTarget=null;

let entityMemory=0;
let entityWanderAngle=0;
let entityWanderTimer=0;
let entityStuckTimer=0;

let entityAudio=null;

function createEntity(){

    const material=new THREE.MeshBasicMaterial({

        map:entityTexture,

        transparent:true,

        alphaTest:.015,

        side:THREE.DoubleSide,

        depthWrite:true
    });

    entity=new THREE.Mesh(
        new THREE.PlaneGeometry(
            2.7,
            7.1
        ),
        material
    );

    /*
       Bigger without stretching the image:
       preserve the PNG's original aspect ratio.
    */

    const imageAspect=
        entityTexture.image?
        entityTexture.image.width/
        entityTexture.image.height:
        .5;

    const height=7.1;
    const width=
        height*imageAspect;

    entity.geometry.dispose();

    entity.geometry=
        new THREE.PlaneGeometry(
            width,
            height
        );

    entity.position.set(
        entitySpawn.x,
        height/2,
        entitySpawn.z
    );

    world.add(entity);

    entityWanderAngle=
        Math.random()*Math.PI*2;

    entityWanderTimer=2;

    /*
       ENTITY AUDIO
    */

    entityAudio=new Audio(
        ENTITY_SOUND
    );

    entityAudio.loop=true;

    entityAudio.preload="auto";

    entityAudio.volume=0;

    /*
       Attempt playback after the player starts.
    */

    entityAudio.load();
}

/* =========================================================
   ENTITY AUDIO
========================================================= */

function startEntityAudio(){

    if(!entityAudio)
        return;

    entityAudio.volume=.01;

    const promise=entityAudio.play();

    if(promise){

        promise.catch(err=>{
            console.warn(
                "Entity audio waiting for browser permission:",
                err
            );
        });
    }
}

function updateEntityAudio(){

    if(
        !entityAudio||
        !entity
    )
        return;

    const distance=Math.hypot(
        player.position.x-entity.position.x,
        player.position.z-entity.position.z
    );

    /*
       Loud when close.

       0-3 blocks:
       very loud

       3-12:
       rapidly fades

       12+:
       barely audible
    */

    let volume;

    if(distance<=2.5){

        volume=.95;

    }else if(distance<=5){

        volume=
            THREE.MathUtils.lerp(
                .95,
                .65,
                (distance-2.5)/2.5
            );

    }else if(distance<=10){

        volume=
            THREE.MathUtils.lerp(
                .65,
                .20,
                (distance-5)/5
            );

    }else if(distance<=18){

        volume=
            THREE.MathUtils.lerp(
                .20,
                .025,
                (distance-10)/8
            );

    }else{

        volume=.008;
    }

    /*
       Hidden player should hear it more quietly.
    */

    if(hidden){
        volume*=.35;
    }

    entityAudio.volume=
        THREE.MathUtils.lerp(
            entityAudio.volume,
            volume,
            .08
        );
}

/* =========================================================
   ENTITY LINE OF SIGHT
========================================================= */

function entitySeesPlayer(){

    if(hidden)
        return false;

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=Math.hypot(dx,dz);

    const detection=
        difficulty==="easy"?13:
        difficulty==="hard"?18:
        difficulty==="nightmare"?22:
        15;

    if(distance>detection)
        return false;

    const steps=Math.ceil(distance/.45);

    for(let i=1;i<steps;i++){

        const t=i/steps;

        const x=
            entity.position.x+dx*t;

        const z=
            entity.position.z+dz*t;

        if(collides(x,z))
            return false;
    }

    return true;
}

/* =========================================================
   ENTITY RECOVERY / TELEPORT
========================================================= */

function findTeleportPosition(){

    const playerCell=worldToCell(
        player.position.x,
        player.position.z
    );

    /*
       At least 20 MAP PIXELS away.

       We search rings outward from the player.
    */

    const minDistance=20;

    const candidates=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            if(
                mapData[y][x]!=="floor" &&
                mapData[y][x]!=="spawn" &&
                mapData[y][x]!=="hide"
            )
                continue;

            const d=Math.hypot(
                x-playerCell.x,
                y-playerCell.y
            );

            if(d<minDistance)
                continue;

            const p=cellToWorld(x,y);

            if(
                collides(
                    p.x,
                    p.z
                )
            )
                continue;

            candidates.push({
                p,
                d
            });
        }
    }

    if(!candidates.length)
        return null;

    /*
       Prefer reasonably close valid locations
       rather than choosing a completely random
       point on a huge map.
    */

    candidates.sort(
        (a,b)=>a.d-b.d
    );

    const index=Math.min(
        Math.floor(Math.random()*12),
        candidates.length-1
    );

    return candidates[index].p;
}

function recoverEntity(){

    const p=findTeleportPosition();

    if(!p)
        return;

    entity.position.set(
        p.x,
        3.55,
        p.z
    );

    entityTarget=null;
    entityMemory=0;
    entityStuckTimer=0;

    entityWanderAngle=
        Math.random()*Math.PI*2;

    entityWanderTimer=2;

    console.log(
        "ENTITY RECOVERED:",
        p
    );
}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    if(
        !entity||
        paused||
        dead
    )
        return;

    if(entitySeesPlayer()){

        entityTarget={
            x:player.position.x,
            z:player.position.z
        };

        entityMemory=
            difficulty==="nightmare"?
            5:
            3;

    }else if(entityMemory>0){

        entityMemory-=dt;

    }else{

        entityTarget=null;
    }

    let dx=0;
    let dz=0;

    if(entityTarget){

        dx=
            entityTarget.x-
            entity.position.x;

        dz=
            entityTarget.z-
            entity.position.z;

        const len=Math.hypot(dx,dz);

        if(len>.15){

            dx/=len;
            dz/=len;
        }

    }else{

        entityWanderTimer-=dt;

        if(entityWanderTimer<=0){

            entityWanderTimer=
                2+
                Math.random()*4;

            entityWanderAngle=
                Math.random()*
                Math.PI*2;
        }

        dx=Math.cos(entityWanderAngle);
        dz=Math.sin(entityWanderAngle);
    }

    /*
       Nightmare speed is roughly sprint-jump speed.
    */

    const speed=
        entityTarget?
            difficulty==="nightmare"?
                SPRINT_JUMP_SPEED:
            difficulty==="hard"?
                6.5:
            difficulty==="easy"?
                3.5:
                5.1:
            1.1;

    const nx=
        entity.position.x+
        dx*speed*dt;

    const nz=
        entity.position.z+
        dz*speed*dt;

    const oldX=entity.position.x;
    const oldZ=entity.position.z;

    if(!collides(nx,nz)){

        entity.position.x=nx;
        entity.position.z=nz;

    }else{

        entityWanderAngle+=
            Math.PI/2+
            Math.random()*.8;

        entityTarget=null;
    }

    const movement=
        Math.hypot(
            entity.position.x-oldX,
            entity.position.z-oldZ
        );

    if(movement<.01){

        entityStuckTimer+=dt;

    }else{

        entityStuckTimer=
            Math.max(
                0,
                entityStuckTimer-dt*.5
            );
    }

    /*
       If the entity has been unable to make meaningful
       progress for 3 seconds, relocate it.
    */

    if(entityStuckTimer>3){

        recoverEntity();
    }

    /*
       Billboard.
    */

    entity.rotation.y=
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    /*
       Kill distance.
    */

    const distance=Math.hypot(
        player.position.x-
        entity.position.x,
        player.position.z-
        entity.position.z
    );

    const killDistance=
        difficulty==="nightmare"?
            1.15:
            .95;

    if(
        distance<killDistance &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );
    }

    updateEntityAudio();
}

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "death"
    ).style.display="flex";

    if(document.pointerLockElement){
        document.exitPointerLock();
    }
}

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.5;
}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";
    }
}

/* =========================================================
   RESET
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y=EYE_HEIGHT;

    velocityY=0;
    grounded=true;

    falling=false;
    fallTimer=0;

    hidden=false;
    crouching=false;

    gameTime=0;

    keys.spacePressed=false;
}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    resetPlayer();

    if(entity){

        world.remove(entity);

        if(entity.geometry)
            entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;
    }

    if(entityAudio){

        entityAudio.pause();

        entityAudio.currentTime=0;

        entityAudio=null;
    }

    createEntity();

    /*
       Browser audio policy:
       this call happens from the ENTER button click,
       so browsers normally permit playback.
    */

    startEntityAudio();

    renderer.domElement.requestPointerLock();
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused?"flex":"none";

    if(paused){

        if(document.pointerLockElement){
            document.exitPointerLock();
        }

    }else{

        renderer.domElement.requestPointerLock();
    }
}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="flex";
}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="none";
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        const key=e.key.toLowerCase();

        keys[key]=true;

        if(e.code==="Space"){

            e.preventDefault();

            if(!e.repeat){

                keys.spacePressed=true;
            }
        }

        if(key==="escape"){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();

                return;
            }

            if(gameStarted){
                togglePause();
            }
        }
    }
);

document.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;
    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            !gameStarted||
            paused||
            dead||
            document.pointerLockElement===null
        )
            return;

        yaw-=e.movementX*.0021;

        pitch-=e.movementY*.0018;

        pitch=THREE.MathUtils.clamp(
            pitch,
            -1.45,
            1.45
        );

        player.rotation.y=yaw;

        camera.rotation.x=pitch;
    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted&&
            !paused&&
            !dead
        ){

            renderer.domElement.requestPointerLock();
        }
    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick=startGame;

document.getElementById(
    "menuControlsBtn"
).onclick=showControls;

document.getElementById(
    "pauseControlsBtn"
).onclick=showControls;

document.getElementById(
    "controlsBackBtn"
).onclick=hideControls;

document.getElementById(
    "resumeBtn"
).onclick=()=>{

    paused=false;

    document.getElementById(
        "pause"
    ).style.display="none";

    renderer.domElement.requestPointerLock();
};

document.getElementById(
    "restartBtn"
).onclick=startGame;

document.getElementById(
    "retryBtn"
).onclick=startGame;

document.getElementById(
    "menuBtn"
).onclick=()=>{

    gameStarted=false;
    paused=false;

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

};

document.getElementById(
    "deathMenuBtn"
).onclick=()=>{

        "death"
    ).style.display="none";

        "menu"
    ).style.display="block";

    if(entityAudio){

};

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:document.getElementById("easyBtn"),

    normal:document.getElementById("normalBtn"),

    hard:document.getElementById("hardBtn"),

    nightmare:
        document.getElementById("nightmareBtn")
};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );
    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();
}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU ROTATION
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(()=>{

    menuImages[
        menuIndex
    ].classList.remove("active");

    menuIndex=
        (menuIndex+1)%
        menuImages.length;

    menuImages[
        menuIndex
    ].classList.add("active");

},6000);

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(dt){

    for(const item of fluorescentLights){

        item.timer-=dt;

        if(item.timer<=0){

            item.timer=
                .7+
                Math.random()*5;

            if(Math.random()<.13){

                item.light.intensity=
                    .15+
                    Math.random()*1.1;

            }else{

                item.light.intensity=
                    item.base+
                    Math.random()*.45;
            }
        }
    }
}

/* =========================================================
   TAPE TIME
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted||
        paused||
        dead
    )
        return;

    gameTime+=dt;

    const total=Math.floor(gameTime);

    const h=Math.floor(total/3600);

    const m=Math.floor(
        (total%3600)/60
    );

    const s=total%60;

    const f=n=>
        String(n).padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        f(h)+":"+f(m)+":"+f(s);
}

/* =========================================================
   ANIMATION
========================================================= */

let lastTime=performance.now();

function animate(){

    requestAnimationFrame(animate);

    const now=performance.now();

    let dt=(now-lastTime)/1000;

    lastTime=now;

    dt=Math.min(dt,.033);

    updatePlayer(dt);
    updateEntity(dt);
    updateLights(dt);
    updateMessage(dt);
    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );
}

animate();

========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=

        camera.updateProjectionMatrix();

        );
    }
);
