<script type="module">

/* =========================================================
   THREE.JS R160
========================================================= */

import * as THREE from "./three.module.js";

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

let gameTime = 0;
let messageTimer = 0;

let worldReady = false;

/* =========================================================
   THREE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x403d29);

scene.fog =
    new THREE.FogExp2(
        0x403d29,
        0.018
    );

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .05,
        350
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.25
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    0.72;

document.body.appendChild(
    renderer.domElement
);

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE = 3;

const WALL_HEIGHT = 9;

const PLAYER_RADIUS = .42;

const EYE_HEIGHT = 5.25;

const CROUCH_EYE_HEIGHT = 3.25;

/*
    MUCH FASTER PLAYER.
*/

const WALK_SPEED = 7.2;

const SPRINT_SPEED = 13.5;

const AIR_SPEED = 14.5;

const GRAVITY = 21;

const JUMP_SPEED = 7.8;

/* =========================================================
   LIGHTING
========================================================= */

/*
    Very dark ambient illumination.
    The fluorescent lights provide most of the visible light.
*/

const hemi =
    new THREE.HemisphereLight(
        0xffe9ae,
        0x080806,
        .24
    );

scene.add(hemi);

const ambient =
    new THREE.AmbientLight(
        0xffd98b,
        .10
    );

scene.add(ambient);

const fluorescentLights = [];

/* =========================================================
   TEXTURE SYSTEM
========================================================= */

const loader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;

function configureTexture(texture){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            4,
            renderer.capabilities.getMaxAnisotropy()
        );

    texture.needsUpdate = true;

    return texture;
}

/*
    IMPORTANT:

    These are loaded independently.

    If one fails, the game STILL builds.
*/

function loadTextureSafe(path){

    return new Promise(resolve=>{

        loader.load(

            path,

            texture=>{

                console.log(
                    "TEXTURE LOADED:",
                    path
                );

                resolve(
                    configureTexture(texture)
                );

            },

            undefined,

            error=>{

                console.error(
                    "TEXTURE FAILED:",
                    path,
                    error
                );

                resolve(null);

            }

        );

    });

}

async function loadTextures(){

    const results =
        await Promise.all([
            loadTextureSafe("./textures/floor.png"),
            loadTextureSafe("./textures/wall.png"),
            loadTextureSafe("./textures/ceiling.png")
        ]);

    floorTexture = results[0];
    wallTexture = results[1];
    ceilingTexture = results[2];

}

/* =========================================================
   MATERIALS
========================================================= */

/*
    MeshStandardMaterial lets the dramatic lighting
    actually affect the PNG textures.

    Fallback colors guarantee visible geometry even
    if a PNG cannot be loaded.
*/

const floorMaterial =
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xb5a95f,

        roughness:.88,

        metalness:0,

        side:THREE.DoubleSide

    });

const wallMaterial =
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xd4c96f,

        roughness:.82,

        metalness:0,

        side:THREE.DoubleSide

    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xc7bd7c,

        roughness:.92,

        metalness:0,

        side:THREE.DoubleSide

    });

function applyTextures(){

    if(floorTexture)
        floorMaterial.map =
            floorTexture;

    if(wallTexture)
        wallMaterial.map =
            wallTexture;

    if(ceilingTexture)
        ceilingMaterial.map =
            ceilingTexture;

    floorMaterial.needsUpdate=true;
    wallMaterial.needsUpdate=true;
    ceilingMaterial.needsUpdate=true;

}

/* =========================================================
   MAP
========================================================= */

let mapWidth=0;
let mapHeight=0;

let mapData=[];

const wallColliders=[];
const holeCells=[];
const hideCells=[];
const walkableCells=[];

let playerSpawn=null;
let entitySpawn=null;

function insideMap(x,y){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function isHole(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]==="hole"
    );

}

function isWalkableCell(x,y){

    if(!insideMap(x,y))
        return false;

    return mapData[y][x] !== "wall";

}

/* =========================================================
   MAP PIXEL CLASSIFICATION
========================================================= */

function classifyPixel(r,g,b,a){

    if(a<20)
        return "floor";

    /*
        Black/dark pixels = walls.
    */

    if(
        r<70 &&
        g<70 &&
        b<70
    )
        return "wall";

    /*
        Red = player spawn.
    */

    if(
        r>150 &&
        r>g*1.4 &&
        r>b*1.4
    )
        return "spawn";

    /*
        Blue = entity spawn.
    */

    if(
        b>125 &&
        b>r*1.3 &&
        b>g*1.15
    )
        return "entity";

    /*
        Purple = hiding spots.
    */

    if(
        r>105 &&
        b>105 &&
        g<120
    )
        return "hide";

    /*
        Yellow/orange = holes.
    */

    if(
        r>135 &&
        g>110 &&
        b<125
    )
        return "hole";

    return "floor";

}

/* =========================================================
   MAP COORDINATES
========================================================= */

function cellToWorld(x,y){

    return {

        x:
            (x+.5)*TILE -
            mapWidth*TILE*.5,

        z:
            (y+.5)*TILE -
            mapHeight*TILE*.5

    };

}

function worldToCell(x,z){

    return {

        x:
            Math.floor(
                (
                    x +
                    mapWidth*TILE*.5
                ) / TILE
            ),

        y:
            Math.floor(
                (
                    z +
                    mapHeight*TILE*.5
                ) / TILE
            )

    };

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image =
        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();

                img.onload =
                    ()=>resolve(img);

                img.onerror =
                    ()=>reject(
                        new Error(
                            "textures/map1.png could not load."
                        )
                    );

                img.src =
                    "./textures/map1.png";

            }
        );

    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;

    const canvas =
        document.createElement("canvas");

    canvas.width =
        mapWidth;

    canvas.height =
        mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row=[];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i =
                (y*mapWidth+x)*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(type!=="wall")
                walkableCells.push({x,y});

            if(type==="hole")
                holeCells.push({x,y});

            if(type==="hide")
                hideCells.push({x,y});

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn =
                    cellToWorld(x,y);

            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn =
                    cellToWorld(x,y);

            }

        }

        mapData.push(row);

    }

    /*
        Fallback player spawn.
    */

    if(!playerSpawn){

        const c =
            walkableCells[
                Math.floor(
                    walkableCells.length*.5
                )
            ];

        if(!c)
            throw new Error(
                "map1.png contains no walkable cells."
            );

        playerSpawn =
            cellToWorld(
                c.x,
                c.y
            );

    }

    /*
        Fallback entity spawn.
    */

    if(!entitySpawn){

        const pc =
            worldToCell(
                playerSpawn.x,
                playerSpawn.z
            );

        let farthest=null;
        let farthestDistance=-1;

        for(
            const c of walkableCells
        ){

            const d =
                Math.hypot(
                    c.x-pc.x,
                    c.y-pc.y
                );

            if(d>farthestDistance){

                farthestDistance=d;
                farthest=c;

            }

        }

        if(farthest){

            entitySpawn =
                cellToWorld(
                    farthest.x,
                    farthest.y
                );

        }

    }

    console.log(
        "MAP SIZE:",
        mapWidth,
        mapHeight
    );

}

/* =========================================================
   COLLISION
========================================================= */

function addWallCollider(x,z){

    wallColliders.push({

        minX:x-TILE*.5,
        maxX:x+TILE*.5,

        minZ:z-TILE*.5,
        maxZ:z+TILE*.5

    });

}

function collides(
    x,
    z,
    radius=PLAYER_RADIUS
){

    for(
        const wall of wallColliders
    ){

        if(
            x+radius>wall.minX &&
            x-radius<wall.maxX &&
            z+radius>wall.minZ &&
            z-radius<wall.maxZ
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   FLOOR
========================================================= */

function addFloor(x,z){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            floorMaterial

        );

    mesh.rotation.x =
        -Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    world.add(mesh);

}

/* =========================================================
   CEILING
========================================================= */

function addCeiling(x,z){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            ceilingMaterial

        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    world.add(mesh);

}

/* =========================================================
   WALL
========================================================= */

function addWall(x,z){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),

            wallMaterial

        );

    mesh.position.set(
        x,
        WALL_HEIGHT*.5,
        z
    );

    world.add(mesh);

    addWallCollider(
        x,
        z
    );

}

/* =========================================================
   3D HOLES
========================================================= */

function addHoleCell(x,y){

    const p =
        cellToWorld(
            x,
            y
        );

    /*
        DARK CENTER.
    */

    const bottom =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE*.84,
                .15,
                TILE*.84
            ),

            new THREE.MeshStandardMaterial({
                color:0x020201,
                roughness:1
            })

        );

    bottom.position.set(
        p.x,
        -5.5,
        p.z
    );

    world.add(bottom);

    /*
        Gradient-like sides.

        The upper part matches the floor while
        becoming almost black toward the bottom.
    */

    const sideMaterial =
        new THREE.MeshStandardMaterial({
            color:0x625c38,
            roughness:1,
            side:THREE.DoubleSide
        });

    const darkMaterial =
        new THREE.MeshStandardMaterial({
            color:0x11100a,
            roughness:1,
            side:THREE.DoubleSide
        });

    const depth=5;

    const north =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                depth,
                .12
            ),
            sideMaterial
        );

    north.position.set(
        p.x,
        -depth/2,
        p.z-TILE*.5
    );

    world.add(north);

    const south =
        north.clone();

    south.position.z =
        p.z+TILE*.5;

    world.add(south);

    const west =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .12,
                depth,
                TILE
            ),
            darkMaterial
        );

    west.position.set(
        p.x-TILE*.5,
        -depth/2,
        p.z
    );

    world.add(west);

    const east =
        west.clone();

    east.position.x =
        p.x+TILE*.5;

    world.add(east);

    /*
        Interior bottom darkness.
    */

    const darkness =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE*.92,
                .08,
                TILE*.92
            ),
            darkMaterial
        );

    darkness.position.set(
        p.x,
        -.03,
        p.z
    );

    world.add(darkness);

}

/* =========================================================
   LOCKERS
========================================================= */

const hidingObjects=[];

function addLocker(x,z){

    const group =

    group.position.set(

    );

    /*

    */

        );

        );

        2.75,
        -.355
    );

    group.add(recess);

    /*

    */

                    .09
                ),

            );

        );

    }

    /*

    */

    for(

    ){

                    .085,
                    .09
                ),
                edge
            );

        bar.position.set(
            0,
            sy,
            -.40
        );

        group.add(bar);

    }

    /*
        Door handle.
    */

    const handle =
        new THREE.Mesh(
            new THREE.BoxGeometry(

                .45,
                .09
            ),
            edge
        );

    handle.position.set(
        .42,

    );

    /*

/* =========================================================
   WORLD BUILD
========================================================= */

function buildWorld(){

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                mapData[y][x];

            const p =
                cellToWorld(x,y);

            if(type==="wall"){

                addWall(
                    p.x,
                    p.z
                );

                continue;

            }

            if(type!=="hole"){

                addFloor(
                    p.x,
                    p.z
                );

            }

            /*
                Ceiling everywhere.
            */

            addCeiling(
                p.x,
                p.z
            );

        }

    }

    /*
        3D holes.
    */

    for(
        const h of holeCells
    ){

        addHoleCell(
            h.x,
            h.y
        );

    }

    /*
        Visible hiding spots.
    */

    for(
        const h of hideCells
    ){

        const p =
            cellToWorld(
                h.x,
                h.y
            );

        addLocker(
            p.x,
            p.z
        );

    }

}

/* =========================================================
   CEILING LIGHT GRID
========================================================= */

function addCeilingLight(x,z){

    /*
        Bright physical ceiling panel.
    */

    const panelMaterial =
        new THREE.MeshStandardMaterial({

            color:0xffffdc,

            emissive:0xffe6a0,

            emissiveIntensity:.8,

            roughness:.25

        });

    const panel =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE*.72,
                .06,
                TILE*.72
            ),

            panelMaterial

        );

    panel.position.set(
        x,
        WALL_HEIGHT-.05,
        z
    );

    world.add(panel);

    /*
        Warm fluorescent point light.
    */

    const light =
        new THREE.PointLight(
            0xffe4a0,
            0,
            16,
            1.7
        );

    light.position.set(
        x,
        WALL_HEIGHT-.3,
        z
    );

    scene.add(light);

    fluorescentLights.push({

        light,
        panel,

        /*
            START AT 1%.
        */

        current:0.01,

        target:1,

        delay:
            Math.random()*4,

        flicker:
            Math.random()*8

    });

}

/* =========================================================
   BUILD LIGHT GRID
========================================================= */

function buildLights(){

    /*
        Every second/third usable cell gets a light.

        This produces the ceiling pattern rather than
        randomly scattering lights everywhere.
    */

    for(
        let y=2;
        y<mapHeight-2;
        y+=5
    ){

        for(
            let x=2;
            x<mapWidth-2;
            x+=5
        ){

            if(
                mapData[y] &&
                mapData[y][x]!=="wall"
            ){

                const p =
                    cellToWorld(
                        x,
                        y
                    );

                addCeilingLight(
                    p.x,
                    p.z
                );

            }

        }

    }

}

/* =========================================================
   LIGHT UPDATE
========================================================= */

function updateLights(dt){

    for(
        const item of fluorescentLights
    ){

        /*
            Lights gradually rise from 1% to 100%.
        */

        if(item.delay>0){

            item.delay-=dt;

            item.current=.01;

        }else{

            item.current =
                THREE.MathUtils.lerp(
                    item.current,
                    1,
                    Math.min(
                        dt*.22,
                        1
                    )
                );

        }

        /*
            Slight electrical flicker.
        */

        item.flicker-=dt;

        if(item.flicker<=0){

            item.flicker =
                2+
                Math.random()*8;

            if(
                Math.random()<.08
            ){

                item.current*=.55;

            }

        }

        item.light.intensity =
            7.0*
            item.current;

        item.panel.material.emissiveIntensity =
            1.5*
            item.current;

    }

}

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.y =
    EYE_HEIGHT;

let yaw=0;
let pitch=0;

let velocityY=0;

let grounded=true;

let crouching=false;
let hidden=false;

let falling=false;
let fallTimer=0;

const keys={};

/* =========================================================
   PLAYER COLLISION
========================================================= */

function movePlayer(dx,dz){

    const nextX =
        player.position.x+dx;

    const nextZ =
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x=
            nextX;

    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z=
            nextZ;

    }

}

/* =========================================================
   HOLE CHECK
========================================================= */

function playerOverHole(){

    const c =
        worldToCell(
            player.position.x,
            player.position.z
        );

    return isHole(
        c.x,
        c.y
    );

}

function checkHole(){

    if(
        falling ||
        !grounded ||
        crouching
    )
        return;

    if(playerOverHole()){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let nearest=null;
    let nearestDistance=Infinity;

    for(
        const spot of hidingObjects
    ){

        const d =
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(d<nearestDistance){

            nearestDistance=d;
            nearest=spot;

        }

    }

    const near =
        nearest &&
        nearestDistance<1.9;

    hidden =
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near&&!hidden
        ? "1"
        : "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ? "1"
        : "0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const p =
            Math.min(
                fallTimer/1.5,
                1
            );

        player.position.y=
            -p*5;

        camera.position.y=
            EYE_HEIGHT-
            p*1.5;

        camera.rotation.z=
            Math.sin(
                fallTimer*18
            )*.04;

        if(
            fallTimer>=1.5
        ){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching=
        !!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w)
        forward++;

    if(keys.s)
        forward--;

    if(keys.d)
        strafe++;

    if(keys.a)
        strafe--;

    const len =
        Math.hypot(
            forward,
            strafe
        );

    if(len>0){

        forward/=len;
        strafe/=len;

        const sprinting =
            !!(
                keys.shift &&
                !crouching
            );

        let speed =
            sprinting
            ? SPRINT_SPEED
            : WALK_SPEED;

        if(!grounded)
            speed =
                sprinting
                ? AIR_SPEED
                : WALK_SPEED;

        if(crouching)
            speed*=.62;

        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);

        const dx =
            (
                strafe*cos -
                forward*sin
            )*
            speed*
            dt;

        const dz =
            (
                -forward*cos -
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    velocityY -=
        GRAVITY*dt;

    player.position.y +=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;

        keys.spacePressed=false;

    }

    const targetHeight =
        crouching
        ? CROUCH_EYE_HEIGHT
        : EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();

    checkHole();

}

let entity=null;

let entityPathIndex=0;

let entityRepathTimer=0;

/* =========================================================
   ENTITY CREATION
========================================================= */

function createEntity(){

    if(!entitySpawn)
        return;

    let material;

    if(entityTexture){

        material =
            new THREE.MeshBasicMaterial({

                map:entityTexture,

                transparent:true,

                alphaTest:.01,

                side:THREE.DoubleSide,

                depthWrite:true

            });

    }else{

        material =
            new THREE.MeshBasicMaterial({

                color:0x080706

            });

    }

    /*
        BIG FULL-SIZE SQUARE IMAGE.

        The entire PNG is displayed.
    */

    entity =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                6.8,
                6.8
            ),

            material

        );

    entity.position.set(
        entitySpawn.x,
        3.4,
        entitySpawn.z
    );

}

/* =========================================================
   ENTITY SPEED
========================================================= */

function getEntitySpeed(){

    if(difficulty==="easy")
        return 4.8;

    if(difficulty==="hard")
        return 8.5;

    if(difficulty==="nightmare")
        return 11.5;

    return 6.8;

}

/* =========================================================
   PATHFINDING
========================================================= */

function findPath(start,goal){

    if(
        !insideMap(start.x,start.y) ||
        !insideMap(goal.x,goal.y)
    )
        return [];

    if(
        !isWalkableCell(
            goal.x,
            goal.y
        )
    )
        return [];

    const queue=[start];

    const parents=new Map();

    const visited=new Set();

    const key=
        p=>p.x+","+p.y;

    visited.add(
        key(start)
    );

    const dirs=[

        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}

    ];

    let iterations=0;

    while(
        queue.length &&
        iterations<8000
    ){

        iterations++;

        const current =
            queue.shift();

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            const result=[];

            let p=current;

            while(p){

                result.push(p);

                p=
                    parents.get(
                        key(p)
                    );

            }

            result.reverse();

            return result;

        }

        for(
            const d of dirs
        ){

            const next={
                x:current.x+d.x,
                y:current.y+d.y
            };

            const k=
                key(next);

            if(visited.has(k))
                continue;

            if(
                !isWalkableCell(
                    next.x,
                    next.y
                )
            )
                continue;

            visited.add(k);

            parents.set(
                k,
                current
            );

            queue.push(next);

        }

    }

    return [];

}

/* =========================================================
   ENTITY PATH UPDATE
========================================================= */

function updateEntityPath(){

    if(!entity)
        return;

    const start =
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const goal =
        worldToCell(
            player.position.x,
            player.position.z
        );

    entityPath =
        findPath(
            start,
            goal
        );

    entityPathIndex=1;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    /*
        30 SECOND SPAWN DELAY.
    */

    if(
        gameStarted &&
        !entityActive &&
        !dead &&
        !paused
    ){

        entitySpawnTimer-=dt;

        if(
            entitySpawnTimer<=0
        ){

            createEntity();

            showMessage(
                "SOMETHING IS IN THE BUILDING."
            );

        }

        return;

    }

    if(
        !entity ||
        !entityActive ||
        paused ||
        dead
    )
        return;

    /*
        Entity always updates its route.
    */

    entityRepathTimer-=dt;

    if(
        entityRepathTimer<=0
    ){

        entityRepathTimer=
            difficulty==="nightmare"
            ? .12
            : .22;

        updateEntityPath();

    }

    if(
        entityPath.length<=1
    )
        return;

    const targetCell =
        entityPath[
            Math.min(
                entityPathIndex,
                entityPath.length-1
            )
        ];

    const target =
        cellToWorld(
            targetCell.x,
            targetCell.y
        );

    let dx=
        target.x-
        entity.position.x;

    let dz=
        target.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    if(distance<.2){

        entityPathIndex++;

        return;

    }

    dx/=distance;
    dz/=distance;

    const speed=
        getEntitySpeed();

    const nx=
        entity.position.x+
        dx*speed*dt;

    const nz=
        entity.position.z+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz,
            .36
        )
    ){

        entity.position.x=nx;
        entity.position.z=nz;

    }else{

        updateEntityPath();

    }

    /*
        Entity is always facing the camera.
    */

    entity.rotation.y=
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    const distanceToPlayer=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    if(
        distanceToPlayer<1.15 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

========================================================= */

const entityAudio =
    new Audio(
        "./sounds/entity.mp3"
    );

entityAudio.loop=true;

entityAudio.preload="auto";

entityAudio.volume=0;

let audioStarted=false;

function startAudio(){

    if(audioStarted)
        return;

    audioStarted=true;

    entityAudio
        .play()
        .catch(
            ()=>{}
        );

}

/*
    The entity sound gradually becomes louder
    as the entity approaches.

    Far away = nearly silent.
    Close = loud.
*/

function updateAudio(){

    if(
        !gameStarted ||
        dead ||
        !entity ||
        !entityActive
    ){

        entityAudio.volume=0;

        return;

    }

    const distance=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    const MAX_DISTANCE=55;

    let volume=
        1-
        distance/MAX_DISTANCE;

    volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    /*
        Starts very quiet and ramps much more
        noticeably near the entity.
    */

    volume=
        Math.pow(
            volume,
            .55
        );

    entityAudio.volume=
        THREE.MathUtils.lerp(
            entityAudio.volume,
            volume,
            .06
        );

    if(
        entityAudio.paused &&
        audioStarted
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );

    }

}

function showMessage(text){

        "message"
    ).textContent=text;

    messageTimer=2.5;

}

function updateMessage(dt){

    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){

            document.getElementById(
                "message"
            ).textContent="";

        }

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "death"
    ).style.display="flex";

    entityAudio.pause();

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   RESET
========================================================= */

function resetGame(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y=
        EYE_HEIGHT;

    velocityY=0;

    grounded=true;

    falling=false;

    fallTimer=0;

    crouching=false;

    hidden=false;

    /*
        Entity DOES NOT appear immediately.
    */

    entitySpawnTimer=30;

    entityActive=false;

    entityPath=[];

    if(entity){

        world.remove(entity);

        if(entity.geometry)
            entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;

    }

    gameTime=0;

    entityAudio.pause();

    entityAudio.currentTime=0;

    audioStarted=false;

}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    if(!worldReady){

        showMessage(
            "WORLD IS STILL LOADING..."
        );

        return;

    }

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;

    paused=false;

    dead=false;

    resetGame();

    /*
        Audio is allowed to begin after the user's
        button click, satisfying browser autoplay rules.
    */

    startAudio();

    renderer.domElement
        .requestPointerLock()
        .catch(
            ()=>{}
        );

}

   MENU
========================================================= */

function returnToMenu(){

    gameStarted=false;

    paused=false;

    dead=false;

    entityAudio.pause();

    entityAudio.currentTime=0;

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ? "flex"
        : "none";

    if(paused){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

        startAudio();

    }

}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="none";

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key=
            event.key.toLowerCase();

        keys[key]=true;

        if(
            event.code==="Space"
        ){

            event.preventDefault();

            if(!keys.space)
                keys.spacePressed=true;

            keys.space=true;

        }

        if(
            key==="escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();

                return;

            }

            if(gameStarted)
                togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        const key=
            event.key.toLowerCase();

        keys[key]=false;

        if(
            event.code==="Space"
        ){

            keys.space=false;

        }

    }
);

/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            event.movementX*.002;

        pitch-=
            event.movementY*.0017;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;

    }
);

/* =========================================================
   CLICK TO RECAPTURE MOUSE
========================================================= */

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(
                    ()=>{}
                );

            startAudio();

        }

    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick=
    startGame;

document.getElementById(
    "menuControlsBtn"
).onclick=
    showControls;

document.getElementById(
    "pauseControlsBtn"
).onclick=
    showControls;

document.getElementById(
    "controlsBackBtn"
).onclick=
    hideControls;

document.getElementById(
    "resumeBtn"
).onclick=
    ()=>{

        paused=false;

        document.getElementById(
            "pause"
        ).style.display="none";

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

        startAudio();

    };

document.getElementById(
    "restartBtn"
).onclick=
    startGame;

document.getElementById(
    "retryBtn"
).onclick=
    startGame;

document.getElementById(
    "menuBtn"
).onclick=
    returnToMenu;

document.getElementById(
    "deathMenuBtn"
).onclick=
    returnToMenu;

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(!menuImages.length)
            return;

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   TAPE TIMER
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(gameTime);

    const h=
        Math.floor(
            total/3600
        );

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const pad=
        n=>
            String(n)
            .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+
        pad(m)+":"+
        pad(s);

}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);

    updateEntity(dt);

    updateAudio();

    updateLights(dt);

    updateMessage(dt);

    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize(){

    try{

        console.log(
            "BACKROOMS INITIALIZING..."
        );

        /*
            Load textures first, but NEVER make
            texture failure stop the world.
        */

        await loadTextures();

        applyTextures();

        /*
            Map is required because it determines
            the actual Level 0 layout.
        */

        await loadMap();

        /*
            Build immediately after map loads.
        */

        buildWorld();

        buildLights();

        /*
            Entity image is optional.
        */

        await loadEntity();

        worldReady=true;

        console.log(
            "BACKROOMS READY"
        );

        console.log(
            "floor texture:",
            !!floorTexture
        );

        console.log(
            "wall texture:",
            !!wallTexture
        );

        console.log(
            "ceiling texture:",
            !!ceilingTexture
        );

        showMessage(
            "TAPE READY"
        );

    }catch(error){

        console.error(error);

        /*
            Do NOT leave a permanent black screen.
        */

        const errorBox=
            document.getElementById(
                "error"
            );

        errorBox.style.display=
            "block";

        errorBox.textContent=
            "BACKROOMS ERROR\n\n"+
            (
                error.stack ||
                error.message ||
                String(error)
            );

    }

}

initialize();

</script>
