<!-- IMPORTANT:
     This uses the R160 module version.
     Keep three.module.js beside index.html.
-->
<script type="module">

import * as THREE from "./three.module.js";

/* =========================================================
   STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;
let difficulty = "normal";

let gameTime = 0;
let messageTimer = 0;

/* =========================================================
   THREE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x706a48);

scene.fog =
    new THREE.Fog(
        0x706a48,
        22,
        105
    );

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .04,
        350
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.15
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.05;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE = 3;
const WALL_HEIGHT = 9;

const PLAYER_RADIUS = .42;

const EYE_HEIGHT = 5.25;
const CROUCH_EYE_HEIGHT = 3.25;

const WALK_SPEED = 5.6;
const SPRINT_SPEED = 9.4;
const JUMP_SPRINT_SPEED = 10.3;

const GRAVITY = 21;
const JUMP_SPEED = 7.6;

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xffe9ad,
        0x11100b,
        .72
    )
);

scene.add(
    new THREE.AmbientLight(
        0xffdf99,
        .16
    )
);

const fluorescentLights = [];

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;

function prepareTexture(
    texture,
    repeatX,
    repeatY
){

    /*
        THIS IS THE IMPORTANT FIX.

        Textures are explicitly treated as sRGB,
        and are NOT dependent on lighting to be visible.
    */

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(
    path,
    repeatX,
    repeatY
){

    return new Promise(
        (resolve,reject)=>{

            textureLoader.load(

                path,

                texture=>{

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            texture,
                            repeatX,
                            repeatY
                        )
                    );

                },

                undefined,

                error=>{

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    reject(
                        new Error(
                            "Failed to load texture: " +
                            path
                        )
                    );

                }

            );

        }
    );

}

async function loadTextures(){

    /*
        EXACT repository paths.
    */

    wallTexture =
        await loadTexture(
            "./textures/wall.png",
            1.1,
            1.1
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

}

/* =========================================================
   MATERIALS

   MeshBasicMaterial makes the PNGs visible regardless
   of whether a light reaches the surface.
========================================================= */

const wallMaterial =
    new THREE.MeshBasicMaterial({
        map:null,
        side:THREE.DoubleSide
    });

const floorMaterial =
    new THREE.MeshBasicMaterial({
        map:null,
        side:THREE.DoubleSide
    });

const ceilingMaterial =
    new THREE.MeshBasicMaterial({
        map:null,
        side:THREE.DoubleSide
    });

function applyTextures(){

    wallMaterial.map =
        wallTexture;

    floorMaterial.map =
        floorTexture;

    ceilingMaterial.map =
        ceilingTexture;

    wallMaterial.needsUpdate = true;
    floorMaterial.needsUpdate = true;
    ceilingMaterial.needsUpdate = true;

}

/* =========================================================
   MAP
========================================================= */

let mapWidth = 0;
let mapHeight = 0;

let mapData = [];

let playerSpawn = null;
let entitySpawn = null;

const wallColliders = [];
const holeCells = [];
const hideCells = [];
const walkableCells = [];

function insideMap(x,y){

    return (
        x >= 0 &&
        y >= 0 &&
        x < mapWidth &&
        y < mapHeight
    );

}

function isHole(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x] === "hole"
    );

}

function isWalkableCell(x,y){

    if(!insideMap(x,y))
        return false;

    return mapData[y][x] !== "wall";

}

/* =========================================================
   MAP COLOR DETECTION
========================================================= */

function classifyPixel(
    r,g,b,a
){

    if(a < 20)
        return "floor";

    /* dark = wall */

    if(
        r < 80 &&
        g < 80 &&
        b < 80
    )
        return "wall";

    /* red = player */

    if(
        r > 150 &&
        r > g*1.4 &&
        r > b*1.4
    )
        return "spawn";

    /* blue = entity */

    if(
        b > 125 &&
        b > r*1.3 &&
        b > g*1.15
    )
        return "entity";

    /* purple = locker */

    if(
        r > 105 &&
        b > 105 &&
        g < 115
    )
        return "hide";

    /* yellow/orange = hole */

    if(
        r > 135 &&
        g > 115 &&
        b < 125
    )
        return "hole";

    return "floor";

}

/* =========================================================
   COORDINATES
========================================================= */

function cellToWorld(x,y){

    return {

        x:
            (x+.5)*TILE -
            mapWidth*TILE*.5,

        z:
            (y+.5)*TILE -
            mapHeight*TILE*.5

    };

}

function worldToCell(x,z){

    return {

        x:
            Math.floor(
                (
                    x +
                    mapWidth*TILE*.5
                ) / TILE
            ),

        y:
            Math.floor(
                (
                    z +
                    mapHeight*TILE*.5
                ) / TILE
            )

    };

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image =
        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();

                img.onload =
                    ()=>resolve(img);

                img.onerror =
                    ()=>reject(
                        new Error(
                            "textures/map1.png failed to load."
                        )
                    );

                img.src =
                    "./textures/map1.png";
            }
        );

    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;

    const canvas =
        document.createElement("canvas");

    canvas.width =
        mapWidth;

    canvas.height =
        mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData = [];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row = [];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i =
                (y*mapWidth+x)*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(
                type !== "wall"
            ){

                walkableCells.push({
                    x,
                    y
                });

            }

            if(
                type === "hole"
            ){

                holeCells.push({
                    x,
                    y
                });

            }

            if(
                type === "hide"
            ){

                hideCells.push({
                    x,
                    y
                });

            }

            if(
                type === "spawn" &&
                !playerSpawn
            ){

                playerSpawn =
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type === "entity" &&
                !entitySpawn
            ){

                entitySpawn =
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

        mapData.push(row);

    }

    if(!playerSpawn){

        const fallback =
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        if(!fallback)
            throw new Error(
                "map1.png contains no walkable area."
            );

        playerSpawn =
            cellToWorld(
                fallback.x,
                fallback.y
            );

    }

    if(!entitySpawn){

        const pc =
            worldToCell(
                playerSpawn.x,
                playerSpawn.z
            );

        let farthest = null;
        let farthestDistance = -1;

        for(
            const c of walkableCells
        ){

            const d =
                Math.hypot(
                    c.x-pc.x,
                    c.y-pc.y
                );

            if(d > farthestDistance){

                farthestDistance = d;
                farthest = c;

            }

        }

        if(farthest){

            entitySpawn =
                cellToWorld(
                    farthest.x,
                    farthest.y
                );

        }

    }

    console.log(
        "MAP:",
        mapWidth,
        "x",
        mapHeight
    );

    console.log(
        "HOLES:",
        holeCells.length
    );

    console.log(
        "LOCKERS:",
        hideCells.length
    );

}

/* =========================================================
   COLLISION
========================================================= */

function addWallCollider(x,z){

    wallColliders.push({

        minX:x-TILE*.5,
        maxX:x+TILE*.5,

        minZ:z-TILE*.5,
        maxZ:z+TILE*.5

    });

}

function collides(
    x,
    z,
    radius=PLAYER_RADIUS
){

    for(
        const wall of wallColliders
    ){

        if(
            x+radius > wall.minX &&
            x-radius < wall.maxX &&
            z+radius > wall.minZ &&
            z-radius < wall.maxZ
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   FLOOR
========================================================= */

function addFloor(x,z){

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            floorMaterial
        );

    mesh.rotation.x =
        -Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    world.add(mesh);

}

/* =========================================================
   CEILING
========================================================= */

function addCeiling(x,z){

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            ceilingMaterial
        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    world.add(mesh);

}

/* =========================================================
   WALL
========================================================= */

function addWall(x,z){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),
            wallMaterial
        );

    mesh.position.set(
        x,
        WALL_HEIGHT/2,
        z
    );

    world.add(mesh);

    addWallCollider(
        x,
        z
    );

}

/* =========================================================
   3D HOLES
========================================================= */

function addHoleCell(x,y){

    const p =
        cellToWorld(
            x,
            y
        );

    /*
        Deep black recessed shaft.

        No floor texture is placed here.
    */

    const bottom =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE*.92,
                .12,
                TILE*.92
            ),
            new THREE.MeshBasicMaterial({
                color:0x050403

function buildWorld(){

    wallColliders.length = 0;

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                mapData[y][x];

            const p =
                cellToWorld(
                    x,
                    y
                );

            if(
                type === "wall"
            ){

                addWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
                Normal floor.
            */

            if(
                type !== "hole"
            ){

                addFloor(
                    p.x,
                    p.z
                );

            }

            /*
                Ceiling ALWAYS exists,
                including over holes.
            */

            addCeiling(
                p.x,
                p.z
            );

        }

    }

    /*
        3D hole geometry.
    */

    for(
        const h of holeCells
    ){

        addHoleCell(
            h.x,
            h.y
        );

    }

    /*
        Visible lockers.
    */

    for(
        const h of hideCells
    ){

        const p =
            cellToWorld(
                h.x,
                h.y
            );

        addLocker(
            p.x,
            p.z
        );

    }

}

function movePlayer(dx,dz){

    const nextX =
        player.position.x+dx;

    const nextZ =
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x =
            nextX;

    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z =
            nextZ;

    }

}

/* =========================================================
   HOLE HITBOX
========================================================= */

function playerFullyOverHole(){

    /*
        All sampled points must be inside holes.

        This allows jumping over holes and prevents
        falling merely because one edge touches one.
    */

    const r =
        PLAYER_RADIUS;

    const samples = [

        [0,0],

        [r,0],
        [-r,0],
        [0,r],
        [0,-r],

        [r*.707,r*.707],
        [-r*.707,r*.707],
        [r*.707,-r*.707],
        [-r*.707,-r*.707]

    ];

    for(
        const [ox,oz] of samples
    ){

        const c =
            worldToCell(
                player.position.x+ox,
                player.position.z+oz
            );

        if(
            !insideMap(
                c.x,
                c.y
            )
        )
            return false;

        if(
            !isHole(
                c.x,
                c.y
            )
        )
            return false;

    }

    return true;

}

function checkHole(){

    if(
        falling ||
        !grounded
    )
        return;

    if(
        playerFullyOverHole()
    ){

        falling = true;
        fallTimer = 0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest = null;
    let closestDistance = Infinity;

    for(
        const spot of hidingObjects
    ){

        const d =
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(
            d < closestDistance
        ){

            closestDistance = d;
            closest = spot;

        }

    }

    const near =
        closest &&
        closestDistance < 1.9;

    hidden =
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near && !hidden
        ? "1"
        : "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ? "1"
        : "0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer += dt;

        const p =
            Math.min(
                fallTimer/1.5,
                1
            );

        player.position.y =
            -p*5;

        camera.position.y =
            EYE_HEIGHT-p*1.4;

        camera.rotation.z =
            Math.sin(
                fallTimer*18
            )*.035;

        if(
            fallTimer>=1.5
        ){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching =
        !!keys.c;

    let forward = 0;
    let strafe = 0;

    if(keys.w)
        forward++;

    if(keys.s)
        forward--;

    if(keys.d)
        strafe++;

    if(keys.a)
        strafe--;

    const length =
        Math.hypot(
            forward,
            strafe
        );

    if(length>0){

        forward/=length;
        strafe/=length;

        const sprinting =
            !!(
                keys.shift &&
                !crouching
            );

        let speed =
            sprinting
            ? SPRINT_SPEED
            : WALK_SPEED;

        /*
            Sprint-jumping gets a little boost.
        */

        if(
            sprinting &&
            !grounded
        ){

            speed =
                JUMP_SPRINT_SPEED;

        }

        if(crouching)
            speed*=.55;

        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);

        const dx =
            (
                strafe*cos -
                forward*sin
            ) *
            speed *
            dt;

        const dz =
            (
                -forward*cos -
                strafe*sin
            ) *
            speed *
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    velocityY -=
        GRAVITY*dt;

    player.position.y +=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY =
            JUMP_SPEED;

        grounded=false;

        keys.spacePressed=false;

    }

    if(!keys.space)
        keys.spacePressed=false;

    const targetHeight =
        crouching
        ? CROUCH_EYE_HEIGHT
        : EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();
    checkHole();

}

/* =========================================================
   PATHFINDING
========================================================= */

function findPath(start,goal){

    if(
        !insideMap(start.x,start.y) ||
        !insideMap(goal.x,goal.y)
    )
        return [];

    if(
        !isWalkableCell(
            goal.x,
            goal.y
        )
    ){

        let nearest = null;
        let best = Infinity;

        for(
            const c of walkableCells
        ){

            const d =
                Math.abs(c.x-goal.x)+
                Math.abs(c.y-goal.y);

            if(d<best){

                best=d;
                nearest=c;

            }

        }

        if(!nearest)
            return [];

        goal=nearest;

    }

    const queue = [start];

    const parent =
        new Map();

    const visited =
        new Set();

    const key =
        p => p.x+","+p.y;

    visited.add(
        key(start)
    );

    /*
        BFS is considerably cheaper than repeatedly
        scanning a huge A* Map.
    */

    const dirs = [

        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}

    ];

    let iterations=0;

    while(
        queue.length &&
        iterations++<6000
    ){

        const current =
            queue.shift();

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            const path=[];
            let p=current;

            while(p){

                path.push(p);
                p =
                    parent.get(
                        key(p)
                    );

            }

            path.reverse();

            return path;

        }

        for(
            const d of dirs
        ){

            const next = {

                x:current.x+d.x,
                y:current.y+d.y

            };

            const k =
                key(next);

            if(
                visited.has(k)
            )
                continue;

            if(
                !isWalkableCell(
                    next.x,
                    next.y
                )
            )
                continue;

            visited.add(k);

            parent.set(
                k,
                current
            );

            queue.push(next);

        }

    }

    return [];

}

function updateEntityPath(){

    if(!entity)
        return;

    const start =
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const goal =

        );

}

/* =========================================================
   ENTITY TELEPORT RECOVERY
========================================================= */

function teleportEntityNearPlayer(){

    if(!entity)
        return;

    const pc =
        worldToCell(
            player.position.x,
            player.position.z
        );

    let candidates=[];

    /*
        At least 20 MAP PIXELS/cells away.
    */

    for(
        const c of walkableCells
    ){

        const distance =
            Math.hypot(
                c.x-pc.x,
                c.y-pc.y
            );

        if(
            distance>=20
        ){

            candidates.push({
                cell:c,
                distance
            });

        }

    }

    if(!candidates.length)
        return;

    candidates.sort(
        (a,b)=>
            Math.abs(a.distance-28) -
            Math.abs(b.distance-28)
    );

    const selected =
        candidates[
            Math.floor(
                Math.random()*
                Math.min(
                    candidates.length,
                    20
                )
            )
        ];

    const p =
        cellToWorld(
            selected.cell.x,
            selected.cell.y
        );

    entity.position.x =
        p.x;

    entity.position.z =
        p.z;

    entity.position.y =
        3.9;

    entityPath=[];
    entityPathIndex=0;

    entityStuckTimer=0;
    entityStuckChecks=0;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        !gameStarted ||
        paused ||
        dead
    )
        return;

    /*
        Entity ALWAYS knows where player is.
    */

    entityRepathTimer-=dt;

    if(
        entityRepathTimer<=0
    ){

        entityRepathTimer =
            difficulty==="nightmare"
            ? .18
            : .30;

        updateEntityPath();

    }

    if(
        entityPath.length<=1
    ){

        entityStuckTimer+=dt;

        if(
            entityStuckTimer>1.5
        ){

            teleportEntityNearPlayer();

        }

        return;

    }

    const targetCell =
        entityPath[
            Math.min(
                entityPathIndex,
                entityPath.length-1
            )
        ];

    const target =
        cellToWorld(
            targetCell.x,
            targetCell.y
        );

    let dx =
        target.x-
        entity.position.x;

    let dz =
        target.z-
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    if(distance<.18){

        entityPathIndex++;

        return;

    }

    dx/=distance;
    dz/=distance;

    const speed =
        entitySpeed();

    const nx =
        entity.position.x+
        dx*speed*dt;

    const nz =
        entity.position.z+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz,
            .38
        )
    ){

        entity.position.x=nx;
        entity.position.z=nz;

    }else{

        entityStuckTimer+=dt;

    }

    const moved =
        Math.hypot(
            entity.position.x-entityLastX,
            entity.position.z-entityLastZ
        );

    if(moved<.015)
        entityStuckChecks++;
    else
        entityStuckChecks=0;

    entityLastX =
        entity.position.x;

    entityLastZ =
        entity.position.z;

    if(
        entityStuckChecks>22 ||
        entityStuckTimer>1.8
    ){

        teleportEntityNearPlayer();

    }

    entityStuckTimer =
        Math.max(
            0,
            entityStuckTimer-dt
        );

    /*
        Billboard without distorting the PNG itself.
    */

    entity.rotation.y =
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    const playerDistance =
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    if(
        playerDistance<1.15 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

let entityVolume=0;
let overlayVolume=1;

function updateEntityAudio(){

    if(
        !entity ||
        !gameStarted ||
        dead
    ){

        entityVolume=0;
        overlayVolume=1;

        entityAudio.volume=0;

        return;

    }

    const distance =
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    const HEAR_DISTANCE=45;

    let v =
        1-
        distance/HEAR_DISTANCE;

    v =
        THREE.MathUtils.clamp(
            v,
            0,
            1
        );

    /*
        Smooth gradual increase.
    */

    v =
        Math.pow(
            v,
            .65
        );

    entityVolume =
        THREE.MathUtils.lerp(
            entityVolume,
            v,
            .08
        );

    overlayVolume =
        1-entityVolume;

    entityAudio.volume =
        entityVolume;

    if(
        entityAudio.paused &&
        audioStarted
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   BLUE SCREEN VIDEO
========================================================= */

const video =
    document.getElementById(
        "overlayVideo"
    );

const videoCanvas =
    document.getElementById(
        "videoCanvas"
    );

const videoCtx =
    videoCanvas.getContext(
        "2d",
        {
            alpha:true,
            willReadFrequently:true
        }
    );

function resizeVideoCanvas(){

    const dpr =
        Math.min(
            devicePixelRatio||1,
            1
        );

    videoCanvas.width =
        Math.floor(
            innerWidth*dpr
        );

    videoCanvas.height =
        Math.floor(
            innerHeight*dpr
        );

}

function drawBlueKey(){

    if(
        !gameStarted ||
        video.readyState<2
    ){

        videoCtx.clearRect(
            0,
            0,
            videoCanvas.width,
            videoCanvas.height
        );

        return;

    }

    const w =
        video.videoWidth;

    const h =
        video.videoHeight;

    if(!w||!h)
        return;

    const cw =
        videoCanvas.width;

    const ch =
        videoCanvas.height;

    const scale =
        Math.max(
            cw/w,
            ch/h
        );

    const dw =
        w*scale;

    const dh =
        h*scale;

    const dx =
        (cw-dw)/2;

    const dy =
        (ch-dh)/2;

    videoCtx.clearRect(
        0,
        0,
        cw,
        ch
    );

    videoCtx.drawImage(
        video,
        dx,
        dy,
        dw,
        dh
    );

    const image =
        videoCtx.getImageData(
            0,
            0,
            cw,
            ch
        );

    const data =
        image.data;

    /*
        BLUE SCREEN KEY.

        Blue pixels become transparent.

        The game underneath remains completely visible.
    */

    for(
        let i=0;
        i<data.length;
        i+=4
    ){

        const r=data[i];
        const g=data[i+1];
        const b=data[i+2];

        const blue =
            b-
            Math.max(
                r,
                g
            );

        if(
            blue>25 &&
            b>70
        ){

            const alpha =
                THREE.MathUtils.clamp(
                    1-blue/100,
                    0,
                    1
                );

            data[i+3] =
                Math.floor(
                    data[i+3]*
                    alpha
                );

        }

    }

    videoCtx.putImageData(
        image,
        0,
        0
    );

}

function updateOverlay(){

    if(!gameStarted){

        videoCanvas.style.opacity="0";
        return;

    }

    videoCanvas.style.opacity =
        String(
            Math.max(
                0,
                Math.min(
                    1,
                    overlayVolume
                )
            )
        );

    /*
        Video itself remains muted.
        Its visible intensity is controlled
        by the entity distance.
    */

    video.volume=0;

    drawBlueKey();

}

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.5;

}

function updateMessage(dt){

    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){

            document.getElementById(
                "message"
            ).textContent="";

        }

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "death"
    ).style.display="flex";

    entityAudio.pause();

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   RESET
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y=
        EYE_HEIGHT;

    velocityY=0;
    grounded=true;

    falling=false;
    fallTimer=0;

    crouching=false;
    hidden=false;

}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    resetPlayer();

    if(entity){

        world.remove(entity);

        entity.geometry.dispose();

        entity.material.dispose();

        entity=null;

    }

    createEntity();

    entityAudio.currentTime=0;
    audioStarted=false;

    startEntityAudio();

    video.currentTime=0;

    video.play().catch(
        ()=>{}
    );

    renderer.domElement
        .requestPointerLock()
        .catch(
            ()=>{}
        );

}

/* =========================================================
   RETURN MENU
========================================================= */

function returnToMenu(){

    gameStarted=false;
    paused=false;
    dead=false;

    entityAudio.pause();

    video.pause();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display =
        paused
        ? "flex"
        : "none";

    if(paused){

        if(
            document.pointerLockElement
        )
            document.exitPointerLock();

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="none";

}

/* =========================================================
   INPUT
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key =
            event.key.toLowerCase();

        keys[key]=true;

        if(
            event.code==="Space"
        ){

            event.preventDefault();

            keys.spacePressed=true;

        }

        if(
            key==="escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();
                return;

            }

            if(gameStarted)
                togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;

        if(
            event.code==="Space"
        ){

            keys.space=false;

        }

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw -=
            event.movementX*.002;

        pitch -=
            event.movementY*.0017;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(
                    ()=>{}
                );

            startEntityAudio();

            video.play().catch(
                ()=>{}
            );

        }

    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "menuControlsBtn"
).addEventListener(
    "click",
    showControls
);

document.getElementById(
    "pauseControlsBtn"
).addEventListener(
    "click",
    showControls
);

document.getElementById(
    "controlsBackBtn"
).addEventListener(
    "click",
    hideControls
);

document.getElementById(
    "resumeBtn"
).addEventListener(
    "click",
    ()=>{
        paused=false;

        document.getElementById(
            "pause"
        ).style.display="none";

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    }
);

document.getElementById(
    "restartBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "retryBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "menuBtn"
).addEventListener(
    "click",
    returnToMenu
);

document.getElementById(
    "deathMenuBtn"
).addEventListener(
    "click",
    returnToMenu
);

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages =
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(!menuImages.length)
            return;

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex =
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(dt){

    for(
        const item of fluorescentLights
    ){

        item.timer-=dt;

        if(
            item.timer<=0
        ){

            item.timer =
                .5+
                Math.random()*5;

            if(
                Math.random()<.13
            ){

                item.light.intensity=.25;

                item.fixture.material
                    .emissiveIntensity=.35;

                setTimeout(
                    ()=>{

                        item.light.intensity=
                            item.base;

                        item.fixture.material
                            .emissiveIntensity=2.2;

                    },
                    35+
                    Math.random()*100
                );

            }else{

                item.light.intensity=
                    item.base;

            }

        }

    }

}

/* =========================================================
   TAPE TIMER
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total =
        Math.floor(
            gameTime
        );

    const h =
        Math.floor(
            total/3600
        );

    const m =
        Math.floor(
            (total%3600)/60
        );

    const s =
        total%60;

    const pad =
        n =>
            String(n)
            .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+
        pad(m)+":"+
        pad(s);

}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now =
        performance.now();

    let dt =
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateEntityAudio();
    updateLights(dt);
    updateMessage(dt);
    updateTapeTime(dt);
    updateOverlay();

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        resizeVideoCanvas();

    }
);

resizeVideoCanvas();

/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

    try{

        console.log(
            "BACKROOMS INITIALIZING..."
        );

        console.log(
            "Loading wall.png..."
        );

        await loadTextures();

        /*
            This happens BEFORE any geometry is created.
        */

        applyTextures();

        console.log(
            "Loading map1.png..."
        );

        await loadMap();

        console.log(
            "Building world..."
        );

        buildWorld();

        console.log(
            "Building lights..."
        );

        buildLights();

        console.log(
            "Loading entity.png..."
        );

        await loadEntityTexture();

        video.load();
        entityAudio.load();

        console.log(
            "BACKROOMS READY"
        );

    }catch(error){

        console.error(error);

        const box =
            document.getElementById(
                "error"
            );

        box.style.display="block";

        box.textContent=
            "BACKROOMS INITIALIZATION ERROR\n\n"+
            (
                error.stack||
                error.message||
                String(error)
            );

    }

}

initialize();

</script>
