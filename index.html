<script src="./three.min.js"></script>


<script>

    "use strict";


    /* =====================================================
       THREE CHECK
    ===================================================== */

    if (
        typeof THREE === "undefined"
    ) {

        const error =
            document.getElementById(
                "error"
            );

        error.style.display =
            "block";

        error.textContent =
            "THREE.JS COULD NOT LOAD.\n\n" +

            "index.html\n" +

            "three.min.js\n" +

            "entity.png\n" +

            "entity.mp3\n" +

            "textures/\n" +

            "    wall.png\n" +

            "    floor.png\n" +

            "    ceiling.png\n" +

            "    menu.jpg\n" +

            "    menu2.jpg\n" +

            "    menu3.jpg\n" +

            "    menu4.jpg\n" +

            "    menu5.jpg";

        throw new Error(
            "THREE.JS FAILED TO LOAD"
        );
    }


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x15130b
        );


    scene.fog =
        new THREE.FogExp2(
            0x17150c,
            0.014
        );


    /* =====================================================
       CAMERA
    ===================================================== */

    const camera =
        new THREE.PerspectiveCamera(
            78,
            window.innerWidth /
            window.innerHeight,
            0.03,
            500
        );


    camera.rotation.order =
        "YXZ";


    /* =====================================================
       RENDERER
    ===================================================== */

    const renderer =
        new THREE.WebGLRenderer({

            antialias: false,

            powerPreference:
                "high-performance"

        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );


    renderer.shadowMap.enabled =
        true;


    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    if (
        "outputColorSpace"
        in renderer
    ) {

        renderer.outputColorSpace =
            THREE.SRGBColorSpace;
    }


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        0.78;


    renderer.domElement.style.position =
        "fixed";


    renderer.domElement.style.inset =
        "0";


    document.body.appendChild(
        renderer.domElement
    );


    /* =====================================================
       GLOBAL LIGHTING
       
       VERY DARK.
       
       Most illumination should come from
       the fluorescent fixtures.
    ===================================================== */

    const ambientLight =
        new THREE.AmbientLight(
            0xffe8a0,
            0.055
        );


    scene.add(
        ambientLight
    );


    const hemisphere =
        new THREE.HemisphereLight(
            0xffe9a3,
            0x050505,
            0.08
        );


    scene.add(
        hemisphere
    );


    /* =====================================================
       TEXTURES
    ===================================================== */

    const textureLoader =
        new THREE.TextureLoader();


    let wallTexture = null;

    let floorTexture = null;

    let ceilingTexture = null;


    function configureTexture(
        texture
    ) {

        texture.colorSpace =
            THREE.SRGBColorSpace;


        texture.wrapS =
            THREE.RepeatWrapping;


        texture.wrapT =
            THREE.RepeatWrapping;


        texture.magFilter =
            THREE.LinearFilter;


        texture.minFilter =
            THREE.LinearMipmapLinearFilter;


        texture.anisotropy =
            Math.min(
                renderer
                    .capabilities
                    .getMaxAnisotropy(),

                8
            );


        texture.needsUpdate =
            true;


        return texture;
    }


    function loadTexture(
        path
    ) {

        return new Promise(
            resolve => {

                textureLoader.load(

                    path,

                    texture => {

                        console.log(
                            "TEXTURE LOADED:",
                            path
                        );

                        resolve(
                            configureTexture(
                                texture
                            )
                        );
                    },

                    undefined,

                    error => {

                        console.error(
                            "TEXTURE FAILED:",
                            path,
                            error
                        );

                        resolve(
                            null
                        );
                    }

                );

            }
        );
    }


    async function loadEnvironmentTextures() {

        wallTexture =
            await loadTexture(
                "./textures/wall.png"
            );


        floorTexture =
            await loadTexture(
                "./textures/floor.png"
            );


        ceilingTexture =
            await loadTexture(
                "./textures/ceiling.png"
            );


        const missing = [];


        if (!wallTexture) {

            missing.push(
                "./textures/wall.png"
            );
        }


        if (!floorTexture) {

            missing.push(
                "./textures/floor.png"
            );
        }


        if (!ceilingTexture) {

            missing.push(
                "./textures/ceiling.png"
            );
        }


        if (
            missing.length > 0
        ) {

            const error =
                document.getElementById(
                    "error"
                );


            error.style.display =
                "block";


            error.textContent =
                "ENVIRONMENT TEXTURE ERROR\n\n" +

                "These files could not be loaded:\n\n" +

                missing.join("\n") +

                "\n\n" +

                "Expected GitHub Pages structure:\n\n" +

                "index.html\n" +

                "three.min.js\n" +

                "entity.png\n" +

                "entity.mp3\n" +

                "textures/\n" +

                "    wall.png\n" +

                "    floor.png\n" +

                "    ceiling.png";
        }

    }


    /* =====================================================
       MATERIAL HELPERS
       
       IMPORTANT:
       
       Environment materials ARE affected by lighting.
       
       Entity is the ONLY unshaded PNG.
    ===================================================== */

    function createEnvironmentTexture(
        sourceTexture,
        repeatX,
        repeatY
    ) {

        if (
            !sourceTexture
        ) {

            return null;
        }


        const texture =
            sourceTexture.clone();


        texture.colorSpace =
            THREE.SRGBColorSpace;


        texture.wrapS =
            THREE.RepeatWrapping;


        texture.wrapT =
            THREE.RepeatWrapping;


        texture.repeat.set(
            repeatX,
            repeatY
        );


        texture.needsUpdate =
            true;


        return texture;
    }


    /* =====================================================
       PLAYER
    ===================================================== */

    const player =
        new THREE.Object3D();


    scene.add(
        player
    );


    const EYE_HEIGHT =
        1.18;


    const PLAYER_HEIGHT =
        1.55;


    const PLAYER_RADIUS =
        0.28;


    let yaw = 0;

    let pitch = 0;

    let velocityY = 0;

    let grounded = true;

    let running = false;

    let paused = false;

    let dead = false;

    let fallingIntoLevel =
        false;


    let fallTimer = 0;


    const FALL_DURATION =
        2.25;


    let difficulty =
        "normal";


    /* =====================================================
       WORLD DATA
    ===================================================== */

    let worldObjects = [];

    let wallColliders = [];

    let deathHoles = [];

    let fluorescentLights = [];


    function addWorldObject(
        object
    ) {

        scene.add(
            object
        );

        worldObjects.push(
            object
        );

        return object;
    }


    function disposeMaterial(
        material
    ) {

        if (!material)
            return;


        if (
            Array.isArray(
                material
            )
        ) {

            material.forEach(
                disposeMaterial
            );

            return;
        }


        if (
            material.map
        ) {

            material.map.dispose();
        }


        material.dispose();
    }


    function clearWorld() {

        for (
            const object
            of worldObjects
        ) {

            scene.remove(
                object
            );


            object.traverse(
                child => {

                    if (
                        child.geometry
                    ) {

                        child.geometry.dispose();
                    }


                    if (
                        child.material
                    ) {

                        disposeMaterial(
                            child.material
                        );
                    }

                }
            );
        }


        for (
            const item
            of fluorescentLights
        ) {

            scene.remove(
                item.light
            );
        }


        worldObjects = [];

        wallColliders = [];

        deathHoles = [];

        fluorescentLights = [];


        if (
            exitObject
        ) {

            exitObject = null;
        }


        if (
            exitLight
        ) {

            scene.remove(
                exitLight
            );

            exitLight = null;
        }


        entity = null;
    }


    /* =====================================================
       WALL MATERIAL
       
       Unlike the previous version, walls are complete
       boxes. This prevents disappearing surfaces.
    ===================================================== */

    function makeWallMaterial(
        width,
        depth,
        height
    ) {

        if (
            !wallTexture
        ) {

            return new THREE.MeshStandardMaterial({

                color:
                    0xb2a654,

                roughness:
                    0.88,

                metalness:
                    0.0
            });
        }


        const texture =
            createEnvironmentTexture(
                wallTexture,
                Math.max(
                    width / 2.4,
                    1
                ),
                Math.max(
                    height / 2.4,
                    1
                )
            );


        return new THREE.MeshStandardMaterial({

            map:
                texture,

            color:
                0xffffff,

            roughness:
                0.94,

            metalness:
                0.0
        });
    }


    /* =====================================================
       WALL
    ===================================================== */

    function createWall(
        x,
        z,
        width,
        depth = 0.30,
        height = 3.10
    ) {

        const geometry =
            new THREE.BoxGeometry(
                width,
                height,
                depth
            );


        const material =
            makeWallMaterial(
                width,
                depth,
                height
            );


        const wall =
            new THREE.Mesh(
                geometry,
                material
            );


        wall.position.set(
            x,
            height / 2,
            z
        );


        wall.castShadow =
            true;


        wall.receiveShadow =
            true;


        addWorldObject(
            wall
        );


        wallColliders.push({

            minX:
                x -
                width / 2,

            maxX:
                x +
                width / 2,

            minZ:
                z -
                depth / 2,

            maxZ:
                z +
                depth / 2,

            minY:
                0,

            maxY:
                height

        });


        return wall;
    }


    /* =====================================================
       FLOOR
    ===================================================== */

    function createFloor() {

        let material;


        if (
            floorTexture
        ) {

            const texture =
                createEnvironmentTexture(
                    floorTexture,
                    105,
                    95
                );


            material =
                new THREE.MeshStandardMaterial({

                    map:
                        texture,

                    color:

    function createHoleRoom() {

        const startX =
            -57;


        const startZ =
            54;


        const columns =
            18;


        const rows =
            8;


        const spacing =
            3.5;


        for (
            let z = 0;
            z < rows;
            z++
        ) {

            for (
                let x = 0;
                x < columns;
                x++
            ) {

                if (
                    (x + z) % 5 !== 0
                ) {

                    continue;
                }


                const px =
                    startX +
                    x *
                    spacing;


                const pz =
                    startZ +
                    z *
                    spacing;


                const hole =
                    new THREE.Mesh(

                        new THREE.PlaneGeometry(
                            2.6,
                            2.6
                        ),

                        new THREE.MeshBasicMaterial({

                            color:
                                0x010101,

                            side:
                                THREE.DoubleSide

                        })
                    );


                hole.rotation.x =
                    -Math.PI / 2;


                hole.position.set(
                    px,
                    0.008,
                    pz
                );


                addWorldObject(
                    hole
                );


                deathHoles.push({

                    x:
                        px,

                    z:
                        pz,

                    radius:
                        1.15

                });
            }
        }
    }


    /* =====================================================

       The fixture NEVER disappears.
       
       Flickering changes light intensity only.
    ===================================================== */

    function addFluorescentLight(
        x,
        z,
        intensity = 5,
        flicker = false

        const fixtureMaterial =
            new THREE.MeshBasicMaterial({

                color:
                    0xfff3c4

        const fixture =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    1.25,
                    0.055,

        fixture.position.set(

        );


        addWorldObject(
            fixture

        const light =
            new THREE.PointLight(

                0xffe9a5,

                intensity,

                15,

                1.55

            );


        light.position.set(
            x,
            2.62,
            z
        );


        light.castShadow =
            true;


        light.shadow.mapSize.width =

        light.shadow.mapSize.height =
            512;


        light.shadow.camera.near =

        fluorescentLights.push({

            fixture:

            flicker:

            timer:
                Math.random() *

        });
    }


    function buildLighting() {

        /*
           Regular fluorescent grid.
           
           Not every tile has a light.
           This produces dark stretches.
        */

        for (
            let x = -126;
            x <= 126;
            x += 12
        ) {

            for (
                let z = -111;
                z <= 111;
                z += 12
            ) {

                const roll =
                    Math.random();


                if (
                    roll < 0.24
                ) {

                    continue;
                }


                const flicker =
                    roll >
                    0.84;


                addFluorescentLight(

                    x +
                    (
                        Math.random() -
                        0.5
                    ) *
                    2,

                    z +
                    (
                        Math.random() -
                        0.5
                    ) *
                    2,

                    3.2 +
                    Math.random() *
                    2.1,

                    flicker

                );
            }
        }


        /*
           Landmark lights.
        */

        addFluorescentLight(
            -18,
            -64,
            5.5,
            false
        );


        addFluorescentLight(
            27,
            -9,
            5.2,
            true
        );


        addFluorescentLight(
            6,
            19,
            5.5,
            false
        );


        addFluorescentLight(
            31,
            59,
            5.1,
            true
        );


        addFluorescentLight(

            2.0,

        );


        addFluorescentLight(
            -32,

        );
    }


    function updateLights(
        dt
    ) {

        for (
            const item
            of fluorescentLights
        ) {

            if (
                !item.flicker
            ) {

                continue;
            }


            item.timer -=
                dt;


            if (
                item.timer <= 0
            ) {

                item.timer =
                    0.035 +
                    Math.random() *
                    0.45;


                const flickerAmount =
                    Math.random();


                if (
                    flickerAmount <
                    0.25
                ) {

                    /*
                       IMPORTANT:
                       We do NOT hide the fixture.
                    */

                    item.light.intensity =
                        item.base *
                        0.08;

                } else if (
                    flickerAmount <
                    0.5
                ) {

                    item.light.intensity =
                        item.base *
                        0.42;

                } else {

                    item.light.intensity =
                        item.base *
                        (
                            0.78 +
                            Math.random() *
                            0.22
                        );
                }
            }
        }
    }


    /* =====================================================
       COLLISION
    ===================================================== */

    function collides(
        x,
        z
    ) {

        const bottom =
            player.position.y;


        const top =
            bottom +
            PLAYER_HEIGHT;


        for (
            const wall
            of wallColliders
        ) {

            if (
                top <=
                wall.minY ||

                bottom >=
                wall.maxY
            ) {

                continue;
            }


            const closestX =
                Math.max(

                    wall.minX,

                    Math.min(
                        x,
                        wall.maxX
                    )

                );


            const closestZ =
                Math.max(

                    wall.minZ,

                    Math.min(
                        z,
                        wall.maxZ
                    )

                );


            const dx =
                x -
                closestX;


            const dz =
                z -
                closestZ;


            if (
                dx * dx +
                dz * dz <
                PLAYER_RADIUS *
                PLAYER_RADIUS
            ) {

                return true;
            }
        }


        return false;
    }


    function entityHitsWall(
        x,
        z
    ) {

        for (
            const wall
            of wallColliders
        ) {

            const closestX =
                Math.max(

                    wall.minX,

                    Math.min(
                        x,
                        wall.maxX
                    )

                );


            const closestZ =
                Math.max(

                    wall.minZ,

                    Math.min(
                        z,
                        wall.maxZ
                    )

                );


            const dx =
                x -
                closestX;


            const dz =
                z -
                closestZ;


            if (
                dx * dx +
                dz * dz <
                0.46 *
                0.46
            ) {

                return true;
            }
        }


        return false;
    }


    function blocked(
        x1,
        z1,
        x2,
        z2
    ) {

        const dx =
            x2 -
            x1;


        const dz =
            z2 -
            z1;


        const distance =
            Math.hypot(
                dx,
                dz
            );


        const steps =
            Math.ceil(
                distance /
                0.3
            );


        for (
            let i = 1;
            i < steps;
            i++
        ) {

            const t =
                i /
                steps;


            if (
                entityHitsWall(

                    x1 +
                    dx *
                    t,

                    z1 +
                    dz *
                    t

                )
            ) {

                return true;
            }
        }


        return false;
    }


    /* =====================================================
       HOLES
    ===================================================== */

    function playerInHole() {

        for (
            const hole
            of deathHoles
        ) {

            const dx =
                player.position.x -
                hole.x;


            const dz =
                player.position.z -
                hole.z;


            if (
                dx * dx +
                dz * dz <
                hole.radius *
                hole.radius
            ) {

                return true;
            }
        }


        return false;
    }

    /* =====================================================
       ENTITY AI
    ===================================================== */

    function updateEntity(
        dt
    ) {

        if (
            !entity ||
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ) {

            return;
        }


        const settings =
            SETTINGS[
                difficulty
            ];


        const dx =
            player.position.x -
            entity.position.x;


        const dz =
            player.position.z -
            entity.position.z;


        const distance =
            Math.hypot(
                dx,
                dz
            );


        lastSeen +=
            dt;


        const visible =

            distance <
            settings.detection &&

            !blocked(

                entity.position.x,

                entity.position.z,

                player.position.x,

                player.position.z

            );


        let targetX =
            0;


        let targetZ =
            0;


        if (
            visible
        ) {

            lastKnown.set(

                player.position.x,

                player.position.z

            );


            lastSeen =
                0;


            targetX =
                dx /
                Math.max(
                    distance,
                    0.001
                );


            targetZ =
                dz /
                Math.max(
                    distance,
                    0.001
                );

        } else if (
            lastSeen < 3.2
        ) {

            const lx =
                lastKnown.x -
                entity.position.x;


            const lz =
                lastKnown.y -
                entity.position.z;


            const length =
                Math.hypot(
                    lx,
                    lz
                );


            if (
                length > 0.1
            ) {

                targetX =
                    lx /
                    length;


                targetZ =
                    lz /
                    length;
            }

        } else {

            wanderTimer -=
                dt;


            if (
                wanderTimer <= 0
            ) {

                wanderTimer =
                    0.5 +
                    Math.random() *
                    1.8;


                wanderAngle =
                    Math.random() *
                    Math.PI *
                    2;
            }


            targetX =
                Math.cos(
                    wanderAngle
                );


            targetZ =
                Math.sin(
                    wanderAngle
                );
        }


        /*
           Juking:
           
           Instead of constantly walking directly
           toward the player, the entity steers toward
           the target while checking alternate paths.
        */

        const targetAngle =
            Math.atan2(
                targetZ,
                targetX
            );


        const currentAngle =
            Math.atan2(
                entityDirection.y,
                entityDirection.x
            );


        let difference =
            targetAngle -
            currentAngle;


        while (
            difference >
            Math.PI
        ) {

            difference -=
                Math.PI * 2;
        }


        while (
            difference <
            -Math.PI
        ) {

            difference +=
                Math.PI * 2;
        }


        difference =
            THREE.MathUtils.clamp(

                difference,

                -3.8 * dt,

                3.8 * dt

            );


        const angle =
            currentAngle +
            difference;


        entityDirection.x =
            Math.cos(
                angle
            );


        entityDirection.y =
            Math.sin(
                angle
            );


        entityVelocity.x =
            THREE.MathUtils.lerp(

                entityVelocity.x,

                entityDirection.x *
                settings.speed,

                Math.min(
                    1,
                    dt * 5
                )

            );


        entityVelocity.y =
            THREE.MathUtils.lerp(

                entityVelocity.y,

                entityDirection.y *
                settings.speed,

                Math.min(
                    1,
                    dt * 5
                )

            );


        const moveX =
            entityVelocity.x *
            dt;


        const moveZ =
            entityVelocity.y *
            dt;


        const nextX =
            entity.position.x +
            moveX;


        const nextZ =
            entity.position.z +
            moveZ;


        if (
            !entityHitsWall(
                nextX,
                entity.position.z
            )
        ) {

            entity.position.x =
                nextX;

        } else {

            entityVelocity.x =
                0;


            wanderAngle +=
                Math.PI *
                0.5;


            entityDirection.set(

                Math.cos(
                    wanderAngle
                ),

                Math.sin(
                    wanderAngle
                )

            );
        }


        if (
            !entityHitsWall(
                entity.position.x,
                nextZ
            )
        ) {

            entity.position.z =
                nextZ;

        } else {

            entityVelocity.y =
                0;


            wanderAngle +=
                Math.PI *
                0.5;


            entityDirection.set(

                Math.cos(
                    wanderAngle
                ),

                Math.sin(
                    wanderAngle
                )

            );
        }


        /*
           Face the player.
        */

        entity.rotation.y =
            Math.atan2(

                player.position.x -
                entity.position.x,

                player.position.z -
                entity.position.z

            );


        const killDistance =

            difficulty ===
            "nightmare"

                ? 1.55

                : 1.25;


        if (
            distance <
            killDistance
        ) {

            killPlayer();
        }
    }


    /* =====================================================
       ENTITY AUDIO
    ===================================================== */

    function updateEntityAudio() {

        if (
            !entity ||
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ) {

            entityAudio.volume =
                0;

            return;
        }


        const distance =
            Math.hypot(

                entity.position.x -
                player.position.x,

                entity.position.z -
                player.position.z

            );


        const maxDistance =
            34;


        if (
            distance >=
            maxDistance
        ) {

            entityAudio.volume =
                0;

            return;
        }


        let volume =

            Math.pow(

                1 -
                distance /
                maxDistance,

                1.6

            ) *
            0.9;


        if (
            blocked(

                player.position.x,

                player.position.z,

                entity.position.x,

                entity.position.z

            )
        ) {

            volume *=
                0.22;
        }


        entityAudio.volume =
            THREE.MathUtils.clamp(

                volume,

                0,

                0.9

            );


        if (
            entityAudio.paused &&
            volume > 0.01
        ) {

            entityAudio
                .play()
                .catch(
                    () => {}
                );
        }
    }

    /* =====================================================
       PLAYER UPDATE
    ===================================================== */

    function updatePlayer(
        dt
    ) {

        if (
            fallingIntoLevel
        ) {

            updateFall(
                dt
            );

            return;
        }


        let forward =
            0;


        let side =
            0;


        /*
           W = +forward
           S = -forward
        */

        if (
            keys.w
        ) {

            forward +=
                1;
        }


        if (
            keys.s
        ) {

            forward -=
                1;
        }


        if (
            keys.d
        ) {

            side +=
                1;
        }


        if (
            keys.a
        ) {

            side -=
                1;
        }


        const length =
            Math.hypot(
                forward,
                side
            );


        if (
            length > 0
        ) {

            forward /=
                length;


            side /=
                length;
        }


        let speed =
            keys.shift
                ? 5.9
                : 3.5;


        if (
            difficulty ===
            "easy"
        ) {

            speed =
                keys.shift
                    ? 6.1
                    : 3.8;
        }


        if (
            difficulty ===
            "hard"
        ) {

            speed =
                keys.shift
                    ? 6.3
                    : 3.4;
        }


        if (
            difficulty ===
            "nightmare"
        ) {

            speed =
                keys.shift
                    ? 6.5
                    : 3.25;
        }


        const sin =
            Math.sin(
                yaw
            );


        const cos =
            Math.cos(
                yaw
            );


        /*
           IMPORTANT:
           
           This is the corrected movement.
           
           At yaw = 0:
           
           W -> negative Z
           S -> positive Z
           
           Therefore W and S are no longer swapped.
        */

        const dx =

            (
                side *
                cos +

                forward *
                sin

            ) *
            speed *
            dt;


        const dz =

            (
                -side *
                sin -

                forward *
                cos

            ) *
            speed *
            dt;


        const nextX =
            player.position.x +
            dx;


        const nextZ =
            player.position.z +
            dz;


        if (
            !collides(
                nextX,
                player.position.z
            )
        ) {

            player.position.x =
                nextX;
        }


        if (
            !collides(
                player.position.x,
                nextZ
            )
        ) {

            player.position.z =
                nextZ;
        }


        if (
            jumpPressed &&
            grounded
        ) {

            velocityY =
                6.2;


            grounded =
                false;
        }


        jumpPressed =
            false;


        velocityY -=
            20 *
            dt;


        player.position.y +=
            velocityY *
            dt;


        if (
            player.position.y <=
            0
        ) {

            player.position.y =
                0;


            velocityY =
                0;


            grounded =
                true;
        }


        if (
            playerInHole()
        ) {

            killPlayer(
                "YOU FELL INTO THE FLOOR."
            );

            return;
        }


        checkExit();
    }


    /* =====================================================
       FALLING INTRO
    ===================================================== */

    function updateFall(
        dt
    ) {

        fallTimer +=
            dt;


        const progress =
            Math.min(

                fallTimer /
                FALL_DURATION,

                1

            );


        const eased =

            1 -
            Math.pow(

                1 -
                progress,

                3

            );


        player.position.y =

            17 -
            17 *
            eased;


        camera.position.y =
            EYE_HEIGHT;


        camera.rotation.x =

            THREE.MathUtils.lerp(

                -0.32,

                0,

                Math.min(
                    progress * 1.3,
                    1
                )

            );


        camera.rotation.z =

            Math.sin(

                progress *
                Math.PI *
                9

            ) *
            0.025;


        if (
            progress >=
            1
        ) {

            fallingIntoLevel =
                false;


            player.position.y =
                0;


            camera.position.set(
                0,
                EYE_HEIGHT,
                0
            );


            camera.rotation.x =
                0;


            camera.rotation.z =
                0;


            requestPointerLock();
        }
    }


    /* =====================================================
       CAMERA MOTION
    ===================================================== */

    let cameraTime =
        0;


    function updateCamera(
        dt
    ) {

        if (
            fallingIntoLevel
        ) {

            return;
        }


        cameraTime +=
            dt;


        const moving =

            keys.w ||
            keys.a ||
            keys.s ||
            keys.d;


        const amount =

            moving
                ? 0.011
                : 0.003;


        camera.position.x =

            Math.sin(
                cameraTime *
                3.4
            ) *
            amount;


        camera.position.y =

            EYE_HEIGHT +

            Math.sin(
                cameraTime *
                4.1
            ) *
            amount;


        camera.position.z =

            Math.cos(
                cameraTime *
                3.1
            ) *
            amount *
            0.55;


        camera.rotation.z =

            Math.sin(
                cameraTime *
                0.9
            ) *
            0.003;


        /*
           Occasional camera glitch.
        */

        if (
            Math.random() <
            0.004
        ) {

            camera.position.x +=

                (
                    Math.random() -
                    0.5
                ) *
                0.045;


            camera.position.y +=

                (
                    Math.random() -
                    0.5
                ) *
                0.03;


            camera.rotation.z +=

                (
                    Math.random() -
                    0.5
                ) *
                0.025;
        }
    }

        const distance =

        0;


    function cycleMenuImage() {

        if (
            menuImages.length ===
            0
        ) {

            return;
        }


        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );


        menuIndex =

            (
                menuIndex +
                1
            ) %
            menuImages.length;


        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );
    }

       RESIZE
    ===================================================== */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =

                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );


            renderer.setPixelRatio(

                Math.min(

                    window.devicePixelRatio ||
                    1,

                    1.5

                )

            );
        }
    );


    /* =====================================================
       TIMER
    ===================================================== */

    const clock =
        new THREE.Clock();


    let recordingTime =
        0;


    function updateTimer(
        dt
    ) {

        if (
            !running ||
            paused
        ) {

            return;
        }


        recordingTime +=
            dt;


        const total =
            Math.floor(
                recordingTime
            );


        const hours =
            Math.floor(
                total /
                3600
            );


        const minutes =
            Math.floor(

                (
                    total %
                    3600
                ) /
                60

            );


        const seconds =
            total %
            60;


        const format =
            number =>

                String(
                    number
                ).padStart(
                    2,
                    "0"
                );


        document.getElementById(
            "tapeTime"
        ).textContent =

            format(hours) +
            ":" +

            format(minutes) +
            ":" +

            format(seconds);
    }


    /* =====================================================
       GAME LOOP
    ===================================================== */

    function animate() {

        requestAnimationFrame(
            animate
        );


        const dt =
            Math.min(

                clock.getDelta(),

                0.05

            );


        if (
            running &&
            !paused &&
            !dead
        ) {

            updatePlayer(
                dt
            );


            updateEntity(
                dt
            );


            updateLights(
                dt
            );


            updateCamera(
                dt
            );


            updateEntityAudio();


            updateMessage(
                dt
            );


            updateTimer(
                dt
            );

        } else {

            updateEntityAudio();
        }


        renderer.render(
            scene,
            camera
        );
    }


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    loadEnvironmentTextures();

    animate();

</script>
