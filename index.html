<script src="./three.min.js"></script>

<script>

/* =========================================================
   THREE INITIALIZATION
========================================================= */

if(typeof THREE==="undefined"){

    const e=
        document.getElementById("error");

    e.style.display="block";

    e.textContent=
        "ERROR: three.min.js could not be loaded.";

    throw new Error(
        "Three.js missing"
    );
}

const scene=
    new THREE.Scene();

scene.background=
    new THREE.Color(
        0x706b45
    );

scene.fog=
    new THREE.FogExp2(
        0x706b45,
        .0105
    );

const camera=
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .025,
        450
    );

const renderer=
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:
            "high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.35
    )
);

if(
    "outputColorSpace"
    in renderer
)
    renderer.outputColorSpace=
        THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=
    .72;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING BASE
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x655f3c,
        .21
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xd5c879,
        0x11100c,
        .36
    )
);

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader=
    new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;

function setupTexture(t){

    t.colorSpace=
        THREE.SRGBColorSpace;

    t.wrapS=
        THREE.RepeatWrapping;

    t.wrapT=
        THREE.RepeatWrapping;

    t.magFilter=
        THREE.LinearFilter;

    t.minFilter=
        THREE.LinearMipmapLinearFilter;

    t.anisotropy=
        Math.min(
            renderer
                .capabilities
                .getMaxAnisotropy(),
            8
        );

    t.needsUpdate=true;

    return t;
}

function loadTexture(path){

    return new Promise(resolve=>{

        textureLoader.load(
            path,

            texture=>{
                resolve(
                    setupTexture(texture)
                );
            },

            undefined,

            ()=>{
                console.warn(
                    "Could not load:",
                    path
                );

                resolve(null);
            }
        );

    });
}

async function loadTextures(){

    wallTexture=
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture=
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture=
        await loadTexture(
            "./textures/ceiling.png"
        );
}

/* =========================================================
   PLAYER
========================================================= */

const player=
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const EYE_HEIGHT=1.18;

const PLAYER_HEIGHT=1.55;

const PLAYER_RADIUS=.28;

let yaw=0;
let pitch=0;

let velocityY=0;

let grounded=false;

let running=false;
let paused=false;
let dead=false;

let fallingIntoLevel=false;

let fallTimer=0;

const FALL_DURATION=
    2.25;

const WALK_SPEED=
    3.5;

const SPRINT_SPEED=
    5.9;

const GRAVITY=
    20;

const JUMP_SPEED=
    6.2;

let difficulty=
    "normal";

/* =========================================================
   WORLD ARRAYS
========================================================= */

let worldObjects=[];

let wallColliders=[];

let deathHoles=[];

let exitObject=null;

let exitLight=null;

let exitX=0;
let exitZ=0;

let entity=null;

let flickeringLights=[];

function addWorldObject(o){

    scene.add(o);

    worldObjects.push(o);

    return o;
}

function clearWorld(){

    for(
        const object
        of worldObjects
    ){

        scene.remove(
            object
        );

        if(object.geometry)
            object.geometry.dispose();

        if(object.material){

            if(
                Array.isArray(
                    object.material
                )
            ){

                object.material
                    .forEach(
                        m=>m.dispose()
                    );

            }else{

                object.material
                    .dispose();

            }
        }
    }

    worldObjects=[];

    wallColliders=[];

    deathHoles=[];

    entity=null;

    exitObject=null;

    flickeringLights=[];

    if(exitLight){

        scene.remove(
            exitLight
        );

        exitLight=null;
    }
}

/* =========================================================
   WALL MATERIAL

   One full vertical copy of wall.png.
   Horizontal repetition is based on the
   image's actual aspect ratio.
========================================================= */

function createWallMaterial(
    width,
    height
){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({
            color:0xb6a94d,
            roughness:1,
            side:THREE.DoubleSide
        });

    }

    const texture=
        wallTexture.clone();

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.ClampToEdgeWrapping;

    const aspect=
        texture.image.width/
        texture.image.height;

    const tileWidth=
        height*aspect;

    texture.repeat.set(
        width/tileWidth,
        1
    );

    texture.needsUpdate=true;

    return new THREE.MeshStandardMaterial({
        map:texture,
        color:0xffffff,
        roughness:1,
        metalness:0,
        side:THREE.DoubleSide
    });
}

/* =========================================================
   WALL
========================================================= */

function addWall(
    x,
    z,
    width,
    depth
){

    const height=3.1;

    wallColliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minY:0,
        maxY:height,

        minZ:z-depth/2,
        maxZ:z+depth/2

    });

    const group=
        new THREE.Group();

    /* FRONT */

    const front=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                height
            ),
            createWallMaterial(
                width,
                height
            )
        );

    front.position.set(
        0,
        height/2,
        depth/2
    );

    group.add(front);

    /* BACK */

    const back=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                height
            ),
            createWallMaterial(
                width,
                height
            )
        );

    back.rotation.y=
        Math.PI;

    back.position.set(
        0,
        height/2,
        -depth/2
    );

    group.add(back);

    /* LEFT */

    const left=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                depth,
                height
            ),
            createWallMaterial(
                depth,
                height
            )
        );

    left.rotation.y=
        Math.PI/2;

    left.position.set(
        -width/2,
        height/2,
        0
    );

    group.add(left);

    /* RIGHT */

    const right=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                depth,
                height
            ),
            createWallMaterial(
                depth,
                height
            )
        );

    right.rotation.y=
        -Math.PI/2;

    right.position.set(
        width/2,
        height/2,
        0
    );

    group.add(right);

    group.position.set(
        x,
        0,
        z
    );

    addWorldObject(
        group
    );
}

/* =========================================================
   FLOOR
========================================================= */

function createFloor(){

    if(!floorTexture){

        const mesh=
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    300,
                    260
                ),
                new THREE.MeshStandardMaterial({
                    color:0x9b9148,
                    roughness:1
                })
            );

        mesh.rotation.x=
            -Math.PI/2;

        addWorldObject(
            mesh
        );

        return;
    }

    const texture=
        floorTexture.clone();

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    /*
       Dense floor grid.
    */

    texture.repeat.set(
        150,
        130
    );

    texture.needsUpdate=true;

    const mesh=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                300,
                260
            ),
            new THREE.MeshStandardMaterial({
                map:texture,
                roughness:1,
                metalness:0
            })
        );

    mesh.rotation.x=
        -Math.PI/2;

    addWorldObject(
        mesh
    );
}

/* =========================================================
   CEILING
========================================================= */

function createCeiling(){

    if(!ceilingTexture){

        const mesh=
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    300,
                    260
                ),
                new THREE.MeshStandardMaterial({
                    color:0x8c854b,
                    roughness:1
                })
            );

        mesh.rotation.x=
            Math.PI/2;

        mesh.position.y=
            3.1;

        addWorldObject(
            mesh
        );

        return;
    }

    const texture=
        ceilingTexture.clone();

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(
        150,
        130
    );

    texture.needsUpdate=true;

    const mesh=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                300,
                260
            ),
            new THREE.MeshStandardMaterial({

function addLight(

    intensity=4.5,
    flicker=false
){

        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.0,
                .045,

            ),
            new THREE.MeshBasicMaterial({
                color:0xfff0b5
            })
        );

    );

    addWorldObject(

    );

            0xffe5a0,
            intensity,
            12,
            1.65
        );

    light.position.set(
        x,
        2.8,
        z
    );

    scene.add(light);

    if(flicker){

        flickeringLights.push({

            light,
            fixture,

            base:intensity,

            timer:
                Math.random()*2

        });
    }
}

function updateLights(dt){

    for(
        const f
        of flickeringLights
    ){

        f.timer-=dt;

        if(f.timer<=0){

            f.timer=
                .08+
                Math.random()*.5;

            if(
                Math.random()<.2
            ){

                f.light.intensity=0;

                f.fixture.visible=
                    false;

            }else{

                f.light.intensity=
                    f.base*
                    (
                        .68+
                        Math.random()*.38
                    );

                f.fixture.visible=
                    true;
            }
        }
    }
}

    This is deliberately constructed from sections

/* ---------------------------------------------------------
   ROOM HELPER

   Creates four walls but allows doors to be omitted.
--------------------------------------------------------- */

function room(
    x,
    z,
    width,
    depth,
    doors={}
){

    const thickness=.7;

    /*
       TOP
    */

    if(!doors.top){

        addWall(
            x,
            z-depth/2,
            width,
            thickness
        );

    }else{

        const gap=doors.top;

        const side=
            (width-gap)/2;

        addWall(
            x-side/2-gap/2,
            z-depth/2,
            side,
            thickness
        );

        addWall(
            x+side/2+gap/2,
            z-depth/2,
            side,
            thickness
        );
    }

    /*
       BOTTOM
    */

    if(!doors.bottom){

        addWall(
            x,
            z+depth/2,
            width,
            thickness
        );

    }else{

        const gap=doors.bottom;

        const side=
            (width-gap)/2;

        addWall(
            x-side/2-gap/2,
            z+depth/2,
            side,
            thickness
        );

        addWall(
            x+side/2+gap/2,
            z+depth/2,
            side,
            thickness
        );
    }

    /*
       LEFT
    */

    if(!doors.left){

        addWall(
            x-width/2,
            z,
            thickness,
            depth
        );

    }else{

        const gap=doors.left;

        const side=
            (depth-gap)/2;

        addWall(
            x-width/2,
            z-side/2-gap/2,
            thickness,
            side
        );

        addWall(
            x-width/2,
            z+side/2+gap/2,
            thickness,
            side
        );
    }

    /*
       RIGHT
    */

    if(!doors.right){

        addWall(
            x+width/2,
            z,
            thickness,
            depth
        );

    }else{

        const gap=doors.right;

        const side=
            (depth-gap)/2;

        addWall(
            x+width/2,
            z-side/2-gap/2,
            thickness,
            side
        );

        addWall(
            x+width/2,
            z+side/2+gap/2,
            thickness,
            side
        );
    }
}

function createImpossibleReturn(

function updateImpossibleReturns(
    dt
){

    for(
        const p
        of impossibleZones
    ){

        if(p.cooldown>0){

            p.cooldown-=dt;

            continue;
        }

        const distance=
            Math.hypot(
                player.position.x-p.x,
                player.position.z-p.z
            );

        if(distance<1.35){

            player.position.x=
                p.targetX;

            player.position.z=
                p.targetZ;

            /*
               Preserve player facing direction.

               This is important because it makes
               the destination feel like the same
               physical place rather than a teleport.
            */

            p.cooldown=2;

            camera.rotation.z=
                (Math.random()-.5)*.06;

            showMessage(
                p.message
            );

function createHoleRoom(){

    const cx=-72;

    const rows=8;
    const columns=8;

    const spacing=2.45;

    for(
        let row=0;
        row<rows;
        row++
    ){

        for(
            let column=0;
            column<columns;
            column++
        ){

            /*
               Some squares are safe.

               This makes the room more like a
               dangerous floor grid instead of one
               giant pit.
            */

            if(
                Math.random()<.22
            )
                continue;

            createHole(

                cx+
                (column-3.5)*
                spacing,

                cz+
                (row-3.5)*
                spacing,

                1.9,
                1.9
            );
        }
    }
}

function insideHole(
    x,
    z
){

    for(
        const hole
        of deathHoles
    ){

        if(

            x>
            hole.x-
            hole.width/2 &&

            x<
            hole.x+
            hole.width/2 &&

            z>
            hole.z-
            hole.depth/2 &&

            z<
            hole.z+
            hole.depth/2

        ){

            return true;
        }
    }

    return false;
}

/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
){

    const bottom=
        player.position.y;

    const top=
        bottom+
        PLAYER_HEIGHT;

    for(
        const wall
        of wallColliders
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        )
            continue;

        const closestX=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=
            x-closestX;

        const dz=
            z-closestZ;

        if(
            dx*dx+
            dz*dz<
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){

            return true;
        }
    }

    return false;
}

function entityHitsWall(
    x,
    z
){

    for(
        const wall
        of wallColliders
    ){

        const closestX=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=
            x-closestX;

        const dz=
            z-closestZ;

        if(
            dx*dx+
            dz*dz<
            .43*.43
        )
            return true;
    }

    return false;
}

function blocked(
    x1,
    z1,
    x2,
    z2
){

    const dx=
        x2-x1;

    const dz=
        z2-z1;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    const steps=
        Math.ceil(
            distance/.35
        );

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=
            i/steps;

        if(
            entityHitsWall(
                x1+dx*t,
                z1+dz*t
            )
        )
            return true;
    }

    return false;
}

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        dead ||
        paused ||
        fallingIntoLevel
    )
        return;

    const settings=
        SETTINGS[difficulty];

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    lastSeen+=dt;

    const visible=
        distance<
        settings.detection &&

        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );

    let dx2=0;
    let dz2=0;

    if(visible){

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen=0;

        dx2=
            dx/
            Math.max(
                distance,
                .001
            );

        dz2=
            dz/
            Math.max(
                distance,
                .001
            );

    }else if(
        lastSeen<3
    ){

        const lx=
            lastKnown.x-
            entity.position.x;

        const lz=
            lastKnown.y-
            entity.position.z;

        const len=
            Math.hypot(
                lx,
                lz
            );

        if(len>.1){

            dx2=
                lx/len;

            dz2=
                lz/len;
        }

    }else{

        wanderTimer-=dt;

        if(
            wanderTimer<=0
        ){

            wanderTimer=
                .5+
                Math.random()*
                1.5;

            wanderAngle=
                Math.random()*
                Math.PI*
                2;
        }

        dx2=
            Math.cos(
                wanderAngle
            );

        dz2=
            Math.sin(
                wanderAngle
            );
    }

    const targetAngle=
        Math.atan2(
            dz2,
            dx2
        );

    const currentAngle=
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference=
        targetAngle-
        currentAngle;

    while(
        difference>
        Math.PI
    )
        difference-=
            Math.PI*2;

    while(
        difference<
        -Math.PI
    )
        difference+=
            Math.PI*2;

    difference=
        Math.max(
            -3.4*dt,
            Math.min(
                3.4*dt,
                difference
            )
        );

    const angle=
        currentAngle+
        difference;

    entityDirection.x=
        Math.cos(angle);

    entityDirection.y=
        Math.sin(angle);

    entityVelocity.x=
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x*
            settings.speed,
            Math.min(
                1,
                dt*4
            )
        );

    entityVelocity.y=
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y*
            settings.speed,
            Math.min(
                1,
                dt*4
            )
        );

    const nextX=
        entity.position.x+
        entityVelocity.x*
        dt;

    const nextZ=
        entity.position.z+
        entityVelocity.y*
        dt;

    if(
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ){

        entity.position.x=
            nextX;

    }else{

        entityVelocity.x=0;

        wanderAngle+=
            Math.PI/2;
    }

    if(
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ){

        entity.position.z=
            nextZ;

    }else{

        entityVelocity.y=0;

        wanderAngle+=
            Math.PI/2;
    }

    entity.rotation.y=
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    if(
        distance<
        (
            difficulty===
            "impossible"
            ?
            1.55
            :
            1.25
        )
    ){

        killPlayer();
    }
}

/* =========================================================
   INPUT
========================================================= */

const keys={
    w:false,
    a:false,
    s:false,
    d:false,
    shift:false
};

let jumpPressed=false;

addEventListener(
    "keydown",
    event=>{

        if(
            event.code===
            "KeyW"
        )
            keys.w=true;

        if(
            event.code===
            "KeyA"
        )
            keys.a=true;

        if(
            event.code===
            "KeyS"
        )
            keys.s=true;

        if(
            event.code===
            "KeyD"
        )
            keys.d=true;

        if(
            event.code===
            "ShiftLeft" ||
            event.code===
            "ShiftRight"
        )
            keys.shift=true;

        if(
            event.code===
            "Space" &&
            !event.repeat
        )
            jumpPressed=true;

        if(
            (
                event.code===
                "Escape" ||

                event.code===
                "KeyP"
            ) &&

            running &&
            !dead &&
            !fallingIntoLevel
        ){

            togglePause();
        }
    }
);

addEventListener(
    "keyup",
    event=>{

        if(
            event.code===
            "KeyW"
        )
            keys.w=false;

        if(
            event.code===
            "KeyA"
        )
            keys.a=false;

        if(
            event.code===
            "KeyS"
        )
            keys.s=false;

        if(
            event.code===
            "KeyD"
        )
            keys.d=false;

        if(
            event.code===
            "ShiftLeft" ||
            event.code===
            "ShiftRight"
        )
            keys.shift=false;
    }
);

/* =========================================================
   MOUSE
========================================================= */

addEventListener(
    "mousemove",
    event=>{

        if(
            !running ||
            paused ||
            dead ||
            fallingIntoLevel ||
            document.pointerLockElement!==
            document.body
        )
            return;

        const sensitivity=
            .0021;

        yaw-=
            event.movementX*
            sensitivity;

        pitch-=
            event.movementY*
            sensitivity;

        const limit=
            Math.PI/2-
            .05;

        pitch=
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;
    }
);

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

    if(fallingIntoLevel){

        updateFall(dt);

        return;
    }

    const direction=
        new THREE.Vector3();

    if(keys.w)
        direction.z-=1;

    if(keys.s)
        direction.z+=1;

    if(keys.a)
        direction.x-=1;

    if(keys.d)
        direction.x+=1;

    if(
        direction.lengthSq()>0
    ){

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );

        const speed=
            keys.shift
            ?
            SPRINT_SPEED
            :
            WALK_SPEED;

        const amount=
            speed*dt;

        const nextX=
            player.position.x+
            direction.x*
            amount;

        if(
            !collides(
                nextX,
                player.position.z
            )
        ){

            player.position.x=
                nextX;
        }

        const nextZ=
            player.position.z+
            direction.z*
            amount;

        if(
            !collides(
                player.position.x,
                nextZ
            )
        ){

            player.position.z=
                nextZ;
        }
    }

    if(
        jumpPressed &&
        grounded
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;
    }

    jumpPressed=false;

    velocityY-=
        GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        insideHole(
            player.position.x,
            player.position.z
        )
    ){

        grounded=false;

        if(
            player.position.y<
            -2.5
        ){

            killPlayer();
        }

        return;
    }

    if(
        player.position.y<=0
    ){

        player.position.y=0;

        velocityY=0;

        grounded=true;
    }

    checkExit();
}

/* =========================================================
   FALLING START
========================================================= */

function updateFall(dt){

    fallTimer+=dt;

    const progress=
        Math.min(
            fallTimer/
            FALL_DURATION,
            1
        );

    const eased=
        progress*
        progress*
        (
            3-
            2*progress
        );

    player.position.y=
        THREE.MathUtils.lerp(
            18,
            0,
            eased
        );

    const shake=
        Math.sin(
            fallTimer*38
        )*
        .035*
        (1-progress);

    camera.position.x=
        shake;

    camera.position.y=
        EYE_HEIGHT+
        shake;

    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                progress*1.3,
                1
            )
        );

    if(
        progress>=1
    ){

        fallingIntoLevel=false;

        player.position.y=0;

        camera.position.x=0;

        camera.position.y=
            EYE_HEIGHT;

        camera.rotation.x=0;

        document.body
            .requestPointerLock();
    }
}

/* =========================================================
   CAMERA
========================================================= */

let cameraTime=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;

    cameraTime+=dt;

    const moving=
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;

    const amount=
        moving
        ?
        .009
        :
        .002;

    camera.position.x=
        Math.sin(
            cameraTime*3.4
        )*
        amount;

    camera.position.y=
        EYE_HEIGHT+
        Math.sin(
            cameraTime*4.1
        )*
        amount;

    camera.rotation.z=
        Math.sin(
            cameraTime*.9
        )*
        .003;

    /*
       Random analog camera instability.
    */

    if(
        Math.random()<.003
    ){

        camera.position.x+=
            (
                Math.random()-
                .5
            )*
            .035;

        camera.position.y+=
            (
                Math.random()-
                .5
            )*
            .025;

        camera.rotation.z+=
            (
                Math.random()-
                .5
            )*
            .025;
    }
}

/* =========================================================
   EXIT
========================================================= */

function checkExit(){

    if(
        !exitObject ||
        dead
    )
        return;

    const distance=
        Math.hypot(
            player.position.x-
            exitX,

            player.position.z-
            exitZ
        );

    if(
        distance<1.8
    )
        winGame();
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(
    text
){

    document.getElementById(
        "message"
    ).textContent=
        text;

    messageTimer=2.2;
}

function updateMessage(dt){

    if(
        messageTimer<=0
    )
        return;

    messageTimer-=dt;

    if(
        messageTimer<=0
    ){

        document.getElementById(
            "message"
        ).textContent="";
    }
}

/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateAudio(){

    if(
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ){

        entityAudio.volume=0;

        return;
    }

    const distance=
        Math.hypot(
            entity.position.x-
            player.position.x,

            entity.position.z-
            player.position.z
        );

    const maxDistance=34;

    if(
        distance>=maxDistance
    ){

        entityAudio.volume=0;

        return;
    }

    let volume=
        Math.pow(
            1-
            distance/
            maxDistance,
            1.6
        )*
        .9;

    if(
        blocked(
            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z
        )
    ){

        volume*=.2;
    }

    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if(
        entityAudio.paused &&
        volume>.01
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );
    }
}

/* =========================================================
   DEATH
========================================================= */

function killPlayer(){

    if(
        dead ||
        !running
    )
        return;

    dead=true;

    fallingIntoLevel=false;

    entityAudio.pause();

    entityAudio.volume=0;

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();
    }

    document.getElementById(
        "deathTitle"
    ).textContent=
        "YOU DIED";

    document.getElementById(
        "deathTitle"
    ).style.color=
        "#b40000";

    document.getElementById(
        "deathText"
    ).textContent=
        "THE BACKROOMS GOT YOU";

    document.getElementById(
        "retryBtn"
    ).textContent=
        "RETRY";

    document.getElementById(
        "death"
    ).style.display=
        "flex";
}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    dead=true;

    entityAudio.pause();

    entityAudio.volume=0;

    if(
        document.pointerLockElement
    )
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent=
        "YOU ESCAPED";

    document.getElementById(
        "deathTitle"
    ).style.color=
        "#69ff82";

    document.getElementById(
        "deathText"
    ).textContent=
        "YOU FOUND THE EXIT";

    document.getElementById(
        "retryBtn"
    ).textContent=
        "PLAY AGAIN";

    document.getElementById(
        "death"
    ).style.display=
        "flex";
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !running ||
        dead ||
        fallingIntoLevel
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ?
        "flex"
        :
        "none";

    if(paused){

        if(
            document.pointerLockElement
        )
            document.exitPointerLock();

    }else{

        document.body
            .requestPointerLock();
    }
}

/* =========================================================
   MAIN MENU
========================================================= */

function returnToMenu(){

    running=false;

    paused=false;

    dead=false;

    fallingIntoLevel=false;

    entityAudio.pause();

    entityAudio.volume=0;

    if(
        document.pointerLockElement
    )
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display=
        "none";

    document.getElementById(
        "death"
    ).style.display=
        "none";

    document.getElementById(
        "menu"
    ).style.display=
        "block";
}

/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    if(
        !wallTexture ||
        !floorTexture ||
        !ceilingTexture
    ){

        await loadTextures();
    }

    clearWorld();

    /*
       Spawn point.

       The player starts inside the first large section
       rather than at the edge of the map.
    */

    player.position.set(
        -72,
        18,
        -63
    );

    yaw=0;

    pitch=-.28;

    velocityY=0;

    grounded=false;

    createFloor();

    createCeiling();

    buildFloorplan();

    buildImpossibleRooms();

    createHoleRoom();

    for(
        const landmark
        of landmarks
    ){

        createLandmark(
            landmark
        );
    }

    for(
        const portal
        of impossibleReturns
    ){

        createImpossibleReturn(
            portal
        );
    }

    createExit();

    buildLighting();

    await createEntity();

    /*
       Entity begins far away.
    */

    entity.position.set(
        55,
        .775,
        -48
    );

    running=true;

    paused=false;

    dead=false;

    fallingIntoLevel=true;

    fallTimer=0;

    recordingTime=0;

    document.getElementById(
        "menu"
    ).style.display=
        "none";

    document.getElementById(
        "pause"
    ).style.display=
        "none";

    document.getElementById(
        "death"
    ).style.display=
        "none";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x=
        pitch;

    player.rotation.y=
        yaw;

    document.body
        .requestPointerLock();
}

/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(
    value
){

    difficulty=value;

    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button=>
                button.classList
                    .remove(
                        "selected"
                    )
        );

    document.getElementById(
        value+"Btn"
    ).classList.add(
        "selected"
    );

    document.getElementById(
        "difficultyHud"
    ).textContent=
        SETTINGS[value].name;
}

easyBtn.onclick=
    ()=>setDifficulty("easy");

normalBtn.onclick=
    ()=>setDifficulty("normal");

hardBtn.onclick=
    ()=>setDifficulty("hard");

impossibleBtn.onclick=
    ()=>setDifficulty(
        "impossible"
    );

startBtn.onclick=
    ()=>startGame();

resumeBtn.onclick=
    ()=>togglePause();

restartBtn.onclick=
    ()=>startGame();

menuBtn.onclick=
    ()=>returnToMenu();

retryBtn.onclick=
    ()=>startGame();

deathMenuBtn.onclick=
    ()=>returnToMenu();

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement!==
            document.body
        ){

            document.body
                .requestPointerLock();
        }
    }
);

/* =========================================================
   MENU IMAGE ROTATION
========================================================= */

const menuImages=
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex=0;

function cycleMenuImage(){

    if(
        menuImages.length===0
    )
        return;

    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );

    menuIndex=
        (
            menuIndex+1
        )%
        menuImages.length;

    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}

/*
   One minute per image.
*/

setInterval(
    cycleMenuImage,
    60000
);

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =========================================================
   TIMER
========================================================= */

const clock=
    new THREE.Clock();

let recordingTime=0;

function updateTimer(dt){

    if(
        !running ||
        paused
    )
        return;

    recordingTime+=dt;

    const total=
        Math.floor(
            recordingTime
        );

    const hours=
        Math.floor(
            total/3600
        );

    const minutes=
        Math.floor(
            (total%3600)/60
        );

    const seconds=
        total%60;

    const format=
        n=>
            String(n)
                .padStart(
                    2,
                    "0"
                );

    document.getElementById(
        "tapeTime"
    ).textContent=

        `${format(hours)}:`+
        `${format(minutes)}:`+
        `${format(seconds)}`;
}

/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateImpossibleReturns(dt);

        updateLights(dt);

        updateCamera(dt);

        updateAudio();

        updateMessage(dt);

        updateTimer(dt);

    }else{

        updateAudio();
    }

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   INITIAL LOAD
========================================================= */

loadTextures();

animate();

</script>
