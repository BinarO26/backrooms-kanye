<script type="module">

import * as THREE from "three";

/* =========================================================
   GLOBAL GAME STATE
========================================================= */

const menu = document.getElementById("menu");
const pauseScreen = document.getElementById("pause");
const deathScreen = document.getElementById("death");
const controlsBox = document.getElementById("controlsBox");
const errorBox = document.getElementById("error");

const overlayVideo = document.getElementById("overlayVideo");
const entityAudio = document.getElementById("entityAudio");

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

const keys = {};

let yaw = 0;
let pitch = 0;

let playerVelocityY = 0;
let grounded = true;

let falling = false;
let fallTimer = 0;

let crouching = false;
let hidden = false;

let gameTime = 0;
let messageTimer = 0;

/* =========================================================
   SPEED
========================================================= */

/*
    These are deliberately much faster than the previous
    version.

    Walking = normal human movement.
    Sprint = track-style running.
    Sprint jump = fastest player movement.
*/

const WALK_SPEED = 4.5;
const SPRINT_SPEED = 8.5;
const SPRINT_JUMP_SPEED = 9.2;

const JUMP_SPEED = 7.2;
const GRAVITY = 20;

const PLAYER_RADIUS = .48;

const PLAYER_HEIGHT = 5.8;
const EYE_HEIGHT = 5.15;
const CROUCH_EYE_HEIGHT = 3.1;

const TILE = 3;
const WALL_HEIGHT = 9;

/* =========================================================
   THREE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x77704b);

scene.fog = new THREE.FogExp2(
    0x77704b,
    .0035
);

const camera = new THREE.PerspectiveCamera(
    78,
    innerWidth / innerHeight,
    .05,
    350
);

const renderer = new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.25
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.05;

document.body.appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xffe7a0,
        0x19170f,
        .42
    )
);

scene.add(
    new THREE.AmbientLight(
        0xffe8a8,
        .18
    )
);

/* =========================================================
   WORLD
========================================================= */

const world = new THREE.Group();

scene.add(world);

/* =========================================================
   TEXTURES
========================================================= */

const loader = new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;

function prepareTexture(texture,repeatX,repeatY){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(path,rx,ry){

    return new Promise((resolve,reject)=>{

        loader.load(
            path,
            texture=>{
                console.log("Loaded:",path);
                resolve(
                    prepareTexture(
                        texture,
                        rx,
                        ry
                    )
                );
            },
            undefined,
            error=>{
                console.error("Failed:",path,error);
                reject(
                    new Error(
                        "Could not load "+path
                    )
                );
            }
        );

    });

}

/* =========================================================
   MAP
========================================================= */

let mapWidth = 0;
let mapHeight = 0;
let mapData = [];

let playerSpawn = null;

const wallColliders = [];
const hidingSpots = [];
const holeCells = [];

function worldPositionFromCell(x,y){

    return {
        x:
            (x+.5)*TILE -
            mapWidth*TILE/2,

        z:
            (y+.5)*TILE -
            mapHeight*TILE/2
    };

}

function worldToCell(x,z){

    return {
        x:Math.floor(
            (x+mapWidth*TILE/2)/TILE
        ),

        y:Math.floor(
            (z+mapHeight*TILE/2)/TILE
        )
    };

}

/* =========================================================
   MAP CLASSIFICATION
========================================================= */

function classifyPixel(r,g,b){

    /*
        BLACK = wall
    */

    if(
        r<75 &&
        g<75 &&
        b<75
    )
        return "wall";

    /*
        RED = spawn
    */

    if(
        r>150 &&
        r>g*1.4 &&
        r>b*1.4
    )
        return "spawn";

    /*
        BLUE = entity
    */

    if(
        b>120 &&
        b>r*1.35 &&
        b>g*1.2
    )
        return "entity";

    /*
        PURPLE = hiding
    */

    if(
        r>100 &&
        b>100 &&
        g<100
    )
        return "hide";

    /*
        YELLOW = hole
    */

    if(
        r>145 &&
        g>120 &&
        b<115
    )
        return "hole";

    return "floor";
}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image =
        await new Promise((resolve,reject)=>{

            const img = new Image();

            img.onload =
                ()=>resolve(img);

            img.onerror =
                ()=>reject(
                    new Error(
                        "textures/map1.png failed to load."
                    )
                );

            img.src =
                "./textures/map1.png?v="+Date.now();

        });

    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;

    const canvas =
        document.createElement("canvas");

    canvas.width = mapWidth;
    canvas.height = mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {willReadFrequently:true}
        );

    ctx.drawImage(image,0,0);

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    for(let y=0;y<mapHeight;y++){

        const row=[];

        for(let x=0;x<mapWidth;x++){

            const i =
                (y*mapWidth+x)*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2]
                );

            row.push(type);

            const p =
                worldPositionFromCell(x,y);

            if(
                type==="spawn" &&
                !playerSpawn
            ){
                playerSpawn=p;
            }

            if(type==="hole"){
                holeCells.push({x,y});
            }

            if(type==="hide"){
                hidingSpots.push({
                    x:p.x,
                    z:p.z
                });
            }

        }

        mapData.push(row);

    }

    if(!playerSpawn){

        outer:
        for(let y=0;y<mapHeight;y++){

            for(let x=0;x<mapWidth;x++){

                if(mapData[y][x]!=="wall"){

                    playerSpawn =
                        worldPositionFromCell(
                            x,
                            y
                        );

                    break outer;
                }

            }

        }

    }

}

/* =========================================================
   MATERIALS
========================================================= */

const wallMaterial =
    new THREE.MeshStandardMaterial({
        map:wallTexture,
        roughness:.92,
        metalness:0
    });

const floorMaterial =
    new THREE.MeshStandardMaterial({
        map:floorTexture,
        roughness:1,
        metalness:0
    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({
        map:ceilingTexture,
        roughness:.96,
        metalness:0
    });

/* =========================================================
   WORLD GEOMETRY
========================================================= */

function addFloor(x,z){

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            floorMaterial
        );

    mesh.rotation.x =
        -Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    world.add(mesh);

}

function addCeiling(x,z){

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            ceilingMaterial
        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    world.add(mesh);

}

function addWall(x,z){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),
            wallMaterial
        );

    mesh.position.set(
        x,
        WALL_HEIGHT/2,
        z
    );

    world.add(mesh);

    wallColliders.push({
        minX:x-TILE/2,
        maxX:x+TILE/2,
        minZ:z-TILE/2,
        maxZ:z+TILE/2
    });

}

/* =========================================================
   3D HOLES
========================================================= */

function isHole(x,y){

    if(
        x<0 ||
        y<0 ||
        x>=mapWidth ||
        y>=mapHeight
    )
        return false;

    return mapData[y][x]==="hole";
}

function buildHole(x,y){

    const p =
        worldPositionFromCell(x,y);

    /*
        The hole is a real recessed volume.

        No floor texture is rendered inside it.
    */

    const depth = 5;

    const sideMaterial =
        new THREE.MeshStandardMaterial({
            map:wallTexture,
            roughness:1
        });

    const bottomMaterial =
        new THREE.MeshStandardMaterial({
            color:0x17150f,
            roughness:1
        });

    /*
        Four connected side walls.
    */

    const sides = [
        {
            x:0,
            z:-TILE/2,
            sx:TILE,
            sz:.12
        },
        {
            x:0,
            z:TILE/2,
            sx:TILE,
            sz:.12
        },
        {
            x:-TILE/2,
            z:0,
            sx:.12,
            sz:TILE
        },
        {
            x:TILE/2,
            z:0,
            sx:.12,
            sz:TILE
        }
    ];

    for(const side of sides){

        const mesh =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    side.sx,
                    depth,
                    side.sz
                ),
                sideMaterial
            );

        mesh.position.set(
            p.x+side.x,
            -depth/2,
            p.z+side.z
        );

        world.add(mesh);

    }

    /*
        Dark bottom makes the hole visibly 3D.
    */

    const bottom =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                .18,
                TILE
            ),
            bottomMaterial
        );

    bottom.position.set(
        p.x,
        -depth,
        p.z
    );

    world.add(bottom);

    /*
        Black inner volume.
    */

    const darkness =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE*.94,
                depth,
                TILE*.94
            ),
            new THREE.MeshBasicMaterial({
                color:0x050403
            })
        );

    darkness.position.set(
        p.x,
        -depth/2,
        p.z
    );

    world.add(darkness);

}

/* =========================================================
   CONNECTED HOLES
========================================================= */

function buildHoleGroup(){

    /*
        Every connected yellow map region is treated as
        one connected opening visually.

        Individual cells still retain precise collision
        coordinates.
    */

    for(const hole of holeCells){
        buildHole(hole.x,hole.y);
    }

}

/* =========================================================

            })

    );

        );

    );

/*
    Only a subset of hiding pixels get lockers so the
    map doesn't become overloaded with geometry.
*/

function buildHidingSpots(){

    for(let i=0;i<hidingSpots.length;i++){

        if(i%2===0){

            createLocker(
                hidingSpots[i].x,
                hidingSpots[i].z
            );

        }

    }

}

function addFluorescent(x,z){

            ),

            })
        );

    );

function buildLighting(){

    /*
        Much fewer lights than before.
        This dramatically reduces GPU/CPU load.
    */

    for(
        let y=2;
        y<mapHeight-2;
        y+=5
    ){

        for(
            let x=2;
            x<mapWidth-2;
            x+=5
        ){

            if(
                mapData[y] &&
                mapData[y][x]!=="wall"
            ){

                const p =
                    worldPositionFromCell(
                        x,
                        y
                    );

                addFluorescent(
                    p.x,
                    p.z
                );

            }

        }

    }

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    /*
        Build only actual walkable cells.
    */

    for(let y=0;y<mapHeight;y++){

        for(let x=0;x<mapWidth;x++){

            const type =
                mapData[y][x];

            const p =
                worldPositionFromCell(
                    x,
                    y
                );

            if(type==="wall"){

                addWall(
                    p.x,
                    p.z
                );

            }else{

                /*
                    HOLES deliberately do NOT receive a
                    floor texture.
                */

                if(type!=="hole"){
                    addFloor(
                        p.x,
                        p.z
                    );
                }

                /*
                    Ceiling always exists, including above
                    holes.
                */

                addCeiling(
                    p.x,
                    p.z
                );

            }

        }

    }

    buildHoleGroup();
    buildHidingSpots();
    buildLighting();

}

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.y =
    EYE_HEIGHT;

function collides(x,z){

    const r =
        PLAYER_RADIUS;

    for(const wall of wallColliders){

        if(
            x+r>wall.minX &&
            x-r<wall.maxX &&
            z+r>wall.minZ &&
            z-r<wall.maxZ
        )
            return true;

    }

    return false;

}

function movePlayer(dx,dz){

    const nextX =
        player.position.x+dx;

    const nextZ =
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x =
            nextX;

    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z =
            nextZ;

    }

}

/* =========================================================
   FULL HITBOX HOLE CHECK
========================================================= */

function playerEntirelyOverHole(){

    const r =
        PLAYER_RADIUS*.92;

    const points = [

        [ r, r],
        [-r, r],
        [ r,-r],
        [-r,-r],
        [ 0, r],
        [ 0,-r],
        [ r, 0],
        [-r, 0],
        [ 0, 0]

    ];

    for(const [dx,dz] of points){

        const cell =
            worldToCell(
                player.position.x+dx,
                player.position.z+dz
            );

        if(
            cell.x<0 ||
            cell.y<0 ||
            cell.x>=mapWidth ||
            cell.y>=mapHeight
        )
            return false;

        if(
            mapData[cell.y][cell.x]!=="hole"
        )
            return false;

    }

    return true;

}

function checkHole(){

    if(falling)
        return;

    if(
        grounded &&
        playerEntirelyOverHole()
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let nearest=null;
    let nearestDistance=Infinity;

    for(const spot of hidingSpots){

        const distance =
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(distance<nearestDistance){

            nearestDistance=distance;
            nearest=spot;

        }

    }

    const near =
        nearest &&
        nearestDistance<1.45;

    hidden =
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near&&!hidden ? "1" : "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden ? "1" : "0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const p =
            Math.min(
                fallTimer/1.7,
                1
            );

        player.position.y =
            -p*6;

        camera.position.y =
            EYE_HEIGHT-p*1.4;

        camera.rotation.z =
            Math.sin(
                fallTimer*18
            )*.035;

        if(fallTimer>=1.7){

            die(
                "YOU FELL INTO THE DARK."
            );

        }

        return;

    }

    crouching=!!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w) forward++;
    if(keys.s) forward--;
    if(keys.d) strafe++;
    if(keys.a) strafe--;

    const length =
        Math.hypot(
            forward,
            strafe
        );

    let moving=false;

    if(length>0){

        moving=true;

        forward/=length;
        strafe/=length;

        const sprint =
            keys.shift &&
            !crouching;

        let speed =
            crouching
            ? WALK_SPEED*.58
            : sprint
                ? SPRINT_SPEED
                : WALK_SPEED;

        /*
            Jumping while sprinting gives a small
            parkour boost.
        */

        if(
            sprint &&
            !grounded
        ){

            speed =
                SPRINT_JUMP_SPEED;

        }

        const sin=Math.sin(yaw);
        const cos=Math.cos(yaw);

        const dx =
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz =
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(dx,dz);

    }

    playerVelocityY -=
        GRAVITY*dt;

    player.position.y +=
        playerVelocityY*dt;

    if(player.position.y<=0){

        player.position.y=0;
        playerVelocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    if(
        keys[" "] &&
        grounded &&
        !crouching
    ){

        playerVelocityY =
            JUMP_SPEED;

        grounded=false;

        keys[" "]=false;

    }

    const targetHeight =
        crouching
        ?
        CROUCH_EYE_HEIGHT
        :
        EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*14,
                1
            )
        );

    /*
        Subtle found-footage camera movement.
    */

    if(moving && grounded){

        const bob =
            Math.sin(
                performance.now()*.012*
                (keys.shift?1.6:1)
            )*
            (keys.shift?.025:.012);

        camera.position.y += bob;

    }

    updateHiding();
    checkHole();

}

/* =========================================================
   ENTITY
========================================================= */

let entity=null;

let entityTarget=null;

let entityStuckTime=0;

let entityLastX=0;
let entityLastZ=0;

let entityWanderTimer=0;
let entityWanderAngle=0;

/*
    Entity image stays at its natural aspect ratio.
*/

function createEntity(){

    const texture =
        loader.load(
            "./entity.png",
            texture=>{
                texture.colorSpace =
                    THREE.SRGBColorSpace;
                texture.needsUpdate=true;
            }
        );

    const material =
        new THREE.MeshBasicMaterial({
            map:texture,
            transparent:true,
            alphaTest:.03,
            side:THREE.DoubleSide,
            depthWrite:true
        });

    /*
        Large, proportional entity.
    */

    const geometry =
        new THREE.PlaneGeometry(
            2.9,
            7.2
        );

    entity =
        new THREE.Mesh(
            geometry,
            material
        );

    /*
        Put it somewhere away from spawn.
    */

    const angle =
        Math.random()*Math.PI*2;

    const distance =
        15;

    entity.position.set(
        player.position.x+
            Math.cos(angle)*distance,
        3.6,
        player.position.z+
            Math.sin(angle)*distance
    );

    world.add(entity);

    entityLastX=entity.position.x;
    entityLastZ=entity.position.z;

}

/* =========================================================
   ENTITY PATHING
========================================================= */

/*
    The entity always knows where the player is.

    It uses the map to select the best neighboring cell
    instead of simply walking into walls.
*/

function cellWalkable(x,y){

    if(
        x<0 ||
        y<0 ||
        x>=mapWidth ||
        y>=mapHeight
    )
        return false;

    return mapData[y][x]!=="wall" &&
           mapData[y][x]!=="hole";

}

function findNextPathCell(){

    const start =
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const goal =
        worldToCell(
            player.position.x,
            player.position.z
        );

    if(
        !cellWalkable(
            goal.x,
            goal.y
        )
    )
        return null;

    const queue=[start];

    const visited =
        new Set([
            start.x+","+start.y
        ]);

    const cameFrom =
        new Map();

    let found=false;

    const directions=[
        [1,0],
        [-1,0],
        [0,1],
        [0,-1]
    ];

    while(queue.length){

        const current =
            queue.shift();

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            found=true;
            break;

        }

        for(const [dx,dz] of directions){

            const nx=current.x+dx;
            const ny=current.y+dz;

            const key=nx+","+ny;

            if(
                !visited.has(key) &&
                cellWalkable(nx,ny)
            ){

                visited.add(key);

                cameFrom.set(
                    key,
                    current
                );

                queue.push({
                    x:nx,
                    y:ny
                });

            }

        }

        /*
            Prevent extremely expensive searches on
            huge maps.
        */

        if(visited.size>1800)
            break;

    }

    if(!found)
        return null;

    let current=goal;

    const path=[];

    while(
        current.x!==start.x ||
        current.y!==start.y
    ){

        path.unshift(current);

        const previous =
            cameFrom.get(
                current.x+","+current.y
            );

        if(!previous)
            break;

        current=previous;

    }

    return path[0] || null;

}

/* =========================================================
   ENTITY RECOVERY
========================================================= */

function teleportEntityNearPlayer(){

    const playerCell =
        worldToCell(
            player.position.x,
            player.position.z
        );

    /*
        At least 20 map pixels/cells away from the player.
    */

    const candidates=[];

    for(let y=0;y<mapHeight;y++){

        for(let x=0;x<mapWidth;x++){

            if(
                !cellWalkable(x,y)
            )
                continue;

            const distance =
                Math.hypot(
                    x-playerCell.x,
                    y-playerCell.y
                );

            if(distance>=20)
                candidates.push({
                    x,
                    y,
                    distance
                });

        }

    }

    if(!candidates.length)
        return;

    /*
        Prefer locations that are still reasonably close.
    */

    candidates.sort(
        (a,b)=>
            Math.abs(a.distance-24)-
            Math.abs(b.distance-24)
    );

    const chosen =
        candidates[0];

    const p =
        worldPositionFromCell(
            chosen.x,
            chosen.y
        );

    entity.position.set(
        p.x,
        3.6,
        p.z
    );

    entityStuckTime=0;

    showMessage(
        "SOMETHING MOVES IN THE DISTANCE."
    );

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

let pathTimer=0;

function updateEntity(dt){

    if(
        !entity ||
        paused ||
        dead
    )
        return;

    pathTimer-=dt;

    if(pathTimer<=0){

        pathTimer=.25;

        const next =
            findNextPathCell();

        if(next){

            const p =
                worldPositionFromCell(
                    next.x,
                    next.y
                );

            entityTarget={
                x:p.x,
                z:p.z
            };

        }

    }

    let dx=0;
    let dz=0;

    if(entityTarget){

        dx =
            entityTarget.x-
            entity.position.x;

        dz =
            entityTarget.z-
            entity.position.z;

        const length =
            Math.hypot(dx,dz);

        if(length>.1){

            dx/=length;
            dz/=length;

        }

    }

    /*
        Entity speed.
    */

    let speed;

    if(difficulty==="nightmare"){

        /*
            Matches the player's sprint-jump speed.
        */

        speed=SPRINT_JUMP_SPEED;

    }else if(difficulty==="hard"){

        speed=7.0;

    }else if(difficulty==="easy"){

        speed=3.7;

    }else{

        speed=5.7;

    }

    const oldX=entity.position.x;
    const oldZ=entity.position.z;

    const nx =
        oldX+
        dx*speed*dt;

    const nz =
        oldZ+
        dz*speed*dt;

    if(!collides(nx,nz)){

        entity.position.x=nx;
        entity.position.z=nz;

    }

    const moved =
        Math.hypot(
            entity.position.x-entityLastX,
            entity.position.z-entityLastZ
        );

    entityLastX=entity.position.x;
    entityLastZ=entity.position.z;

    if(moved<.01 && entityTarget){

        entityStuckTime+=dt;

    }else{

        entityStuckTime=
            Math.max(
                0,
                entityStuckTime-dt*.5
            );

    }

    if(entityStuckTime>2.0){

        teleportEntityNearPlayer();

    }

    /*
        Correct billboard rotation.
    */

    entity.rotation.y =
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    const distance =
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    /*
        Entity audio only plays near the entity.
    */

    updateEntityAudio(distance);

    if(
        distance<.95 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   ENTITY AUDIO + VIDEO
========================================================= */

function updateEntityAudio(distance){

    const MAX_DISTANCE=30;

    if(
        !gameStarted ||
        paused ||
        dead ||
        distance>MAX_DISTANCE
    ){

        if(!entityAudio.paused){

            entityAudio.pause();

        }

        entityAudio.volume=0;

        overlayVideo.volume=1;

        return;

    }

    if(entityAudio.paused){

        entityAudio.play()
            .catch(
                ()=>{}
            );

    }

    /*
        Close = loud.
        Farther = quieter.
    */

    const proximity =
        1-
        THREE.MathUtils.clamp(
            distance/MAX_DISTANCE,
            0,
            1
        );

    const audioVolume =
        THREE.MathUtils.clamp(
            proximity,
            0,
            1
        );

    entityAudio.volume=
        audioVolume;

    /*
        Exact inverse relationship:
        entity 25% -> overlay 75%
    */

    overlayVideo.volume =
        1-audioVolume;

}

   MESSAGE
========================================================= */

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.5;

}

function updateMessage(dt){

        messageTimer-=dt;

        if(messageTimer<=0){

                "message"
            ).textContent="";

        }

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)

    dead=true;

    entityAudio.pause();

    entityAudio.volume=0;

    document.getElementById(
        "deathText"
    ).textContent=reason;

    deathScreen.style.display="flex";

    if(document.pointerLockElement){

        document.exitPointerLock();

    }

}

   RESET
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y=
        EYE_HEIGHT;

    yaw=0;
    pitch=0;

    playerVelocityY=0;

    grounded=true;

    falling=false;

    fallTimer=0;

    crouching=false;
    hidden=false;

}

/* =========================================================
   START
========================================================= */

function startGame(){

    menu.style.display="none";
    pauseScreen.style.display="none";
    deathScreen.style.display="none";
    controlsBox.style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    gameTime=0;

    resetPlayer();

    if(entity){

        world.remove(entity);

        entity.geometry.dispose();

        entity.material.dispose();

        entity=null;

    }

    createEntity();

    overlayVideo.play()
        .catch(
            ()=>{}
        );

    renderer.domElement.requestPointerLock()
        .catch(
            ()=>{}
        );

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    pauseScreen.style.display=
        paused
        ?
        "flex"
        :
        "none";

    if(paused){

        entityAudio.pause();

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    gameStarted=false;
    paused=false;
    dead=false;

    pauseScreen.style.display="none";
    deathScreen.style.display="none";
    controlsBox.style.display="none";
    menu.style.display="block";

    entityAudio.pause();
    entityAudio.volume=0;

    overlayVideo.volume=1;

    if(document.pointerLockElement)
        document.exitPointerLock();

}

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "menuControlsBtn"
).addEventListener(
    "click",
    ()=>{
        controlsBox.style.display="flex";
    }
);

document.getElementById(
    "pauseControlsBtn"
).addEventListener(
    "click",
    ()=>{
        controlsBox.style.display="flex";
    }
);

document.getElementById(
    "controlsBackBtn"
).addEventListener(
    "click",

        controlsBox.style.display="none";
    }
);

document.getElementById(
    "resumeBtn"
).addEventListener(

);

document.getElementById(
    "restartBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "retryBtn"
).addEventListener(

);

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={
    easy:document.getElementById("easyBtn"),
    normal:document.getElementById("normalBtn"),
    hard:document.getElementById("hardBtn"),
    nightmare:document.getElementById("nightmareBtn")
};

function selectDifficulty(value){

    difficulty=value;

    for(const name in difficultyButtons){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event=>{

        const key=
            event.key.toLowerCase();

        keys[key]=true;

        if(event.code==="Space"){

            event.preventDefault();

        }

        if(key==="escape"){

            if(
                controlsBox.style.display==="flex"
            ){

                controlsBox.style.display="none";
                return;

            }

            if(gameStarted)
                togglePause();

        }

    }
);

window.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;

    }
);

/* =========================================================
   MOUSE
========================================================= */

window.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===
                null
        )
            return;

        yaw-=
            event.movementX*.0022;

        pitch-=
            event.movementY*.0018;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(
                    ()=>{}
                );

        }

    }
);

/* =========================================================
   FLUORESCENT FLICKER
========================================================= */

function updateLights(dt){

    for(const item of fluorescentLights){

        item.timer-=dt;

        if(item.timer<=0){

            item.timer=
                1.5+
                Math.random()*5;

            if(Math.random()<.11){

                item.light.intensity=
                    .5+
                    Math.random()*1.2;

                setTimeout(
                    ()=>{
                        item.light.intensity=2.2;
                    },
                    40+
                    Math.random()*100
                );

            }else{

                item.light.intensity=
                    2.2;

            }

        }

    }

}

/* =========================================================
   TAPE TIME
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(gameTime);

    const h=
        Math.floor(total/3600);

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const pad=
        n=>String(n).padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+pad(m)+":"+pad(s);

}

/* =========================================================
   MENU IMAGE ROTATION
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        menuImages[
            menuIndex
        ].classList.remove("active");

        menuIndex=
            (menuIndex+1)%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add("active");

    },
    6000
);

/* =========================================================
   RENDER LOOP
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .05
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateLights(dt);
    updateMessage(dt);
    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

    try{

        console.log(
            "Three.js:",
            THREE.REVISION
        );

        console.log(
            "Loading Backrooms..."
        );

        /*
            Load required textures.
        */

        wallTexture=
            await loadTexture(
                "./textures/wall.png",
                1.1,
                1.1
            );

        floorTexture=
            await loadTexture(
                "./textures/floor.png",
                1,
                1
            );

        ceilingTexture=
            await loadTexture(
                "./textures/ceiling.png",
                1,
                1
            );

        /*
            Create materials AFTER textures load.
        */

        wallMaterial.map=
            wallTexture;

        floorMaterial.map=
            floorTexture;

        ceilingMaterial.map=
            ceilingTexture;

        wallMaterial.needsUpdate=true;
        floorMaterial.needsUpdate=true;
        ceilingMaterial.needsUpdate=true;

        await loadMap();

        buildWorld();

        overlayVideo.volume=1;

        /*
            Start the video muted initially.
            Browser autoplay policies allow this.
            Audio is changed once gameplay begins.
        */

        overlayVideo.muted=true;

        await overlayVideo.play()
            .catch(
                ()=>{}
            );

        console.log(
            "BACKROOMS READY",
            mapWidth,
            mapHeight
        );

    }catch(error){

        console.error(error);

        errorBox.style.display="block";

        errorBox.textContent=
            "BACKROOMS INITIALIZATION ERROR\n\n"+
            (
                error.stack ||
                String(error)
            );

    }

}

initialize();

</script>
