<!-- =========================================================
     LOCAL THREE.JS
     
     IMPORTANT:
     
     three.min.js MUST BE BESIDE index.html.
     
     DO NOT USE A CDN.
========================================================= -->

<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   BASIC ERROR DISPLAY
========================================================= */

function showFatalError(message) {

    const errorBox =
        document.getElementById(
            "error"
        );

    errorBox.style.display =
        "block";

    errorBox.textContent =
        message;

}


/* =========================================================
   THREE.JS CHECK
========================================================= */

if (
    typeof THREE === "undefined"
) {

    showFatalError(
        "THREE.JS COULD NOT BE LOADED.\n\n" +
        "This version does NOT use a CDN.\n\n" +
        "Make sure this file exists:\n\n" +
        "./three.min.js\n\n" +
        "It must be in the SAME folder as index.html."
    );

    throw new Error(
        "Local three.min.js missing."
    );
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x8d8553
    );


/*
    The fog is intentionally subtle.

    It should add distance depth without
    making the environment disappear.
*/

scene.fog =
    new THREE.Fog(
        0x8d8553,
        42,
        170
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        window.innerWidth /
        window.innerHeight,
        0.03,
        500
    );

camera.rotation.order =
    "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        alpha: false,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.35
    )
);


/*
    Normal output color.

    No CRT shader.
    No post-processing shader.
    No environment shader.
*/

if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

}


renderer.toneMapping =
    THREE.NoToneMapping;


renderer.toneMappingExposure =
    1;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */


/*
    A modest ambient light prevents completely
    black corners while still allowing the
    fluorescent lights to dominate.
*/

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.20
    );

scene.add(
    ambientLight
);


/*
    Hemisphere light gives the floor and ceiling
    enough base visibility without washing out
    the fluorescent lighting.
*/

const hemisphere =
    new THREE.HemisphereLight(
        0xfff4bf,
        0x252018,
        0.35
    );

scene.add(
    hemisphere
);


/* =========================================================
   TEXTURE LOADER
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


let wallTexture =
    null;

let floorTexture =
    null;

let ceilingTexture =
    null;


/* =========================================================
   TEXTURE PREPARATION
========================================================= */

function prepareEnvironmentTexture(
    texture
) {

    if (!texture)
        return null;


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.magFilter =
        THREE.LinearFilter;


    texture.minFilter =
        THREE.LinearMipmapLinearFilter;


    texture.anisotropy =
        Math.min(
            renderer
                .capabilities
                .getMaxAnisotropy(),
            8
        );


    texture.needsUpdate =
        true;


    return texture;
}


/* =========================================================
   TEXTURE LOADING
========================================================= */

function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "Loaded:",
                        path
                    );

                    resolve(
                        prepareEnvironmentTexture(
                            texture
                        )
                    );

                },

                undefined,

                error => {

                    console.error(
                        "Texture failed:",
                        path,
                        error
                    );

                    resolve(null);

                }

            );

        }
    );

}


/* =========================================================
   LOAD ALL ENVIRONMENT TEXTURES
========================================================= */

async function loadEnvironmentTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );


    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );


    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );


    const missing = [];


    if (!wallTexture) {

        missing.push(
            "./textures/wall.png"
        );

    }


    if (!floorTexture) {

        missing.push(
            "./textures/floor.png"
        );

    }


    if (!ceilingTexture) {

        missing.push(
            "./textures/ceiling.png"
        );

    }


    if (missing.length) {

        showFatalError(
            "ENVIRONMENT TEXTURE ERROR\n\n" +
            "These files could not be loaded:\n\n" +
            missing.join("\n") +
            "\n\n" +
            "Expected structure:\n\n" +
            "index.html\n" +
            "three.min.js\n" +
            "entity.png\n" +
            "entity.mp3\n" +
            "textures/\n" +
            "  wall.png\n" +
            "  floor.png\n" +
            "  ceiling.png"
        );

    }

}


/* =========================================================
   WORLD STORAGE
========================================================= */

let worldObjects = [];

let wallColliders = [];

let deathHoles = [];

let fluorescentLights = [];


function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}


/* =========================================================
   MATERIAL DISPOSAL
========================================================= */

function disposeMaterial(
    material
) {

    if (!material)
        return;


    if (
        Array.isArray(material)
    ) {

        for (
            const item
            of material
        ) {

            disposeMaterial(
                item
            );

        }

        return;
    }


    /*
        Do not dispose the shared
        environment texture itself.

        The materials use cloned textures.
    */

    if (
        material.map
    ) {

        material.map.dispose();

    }


    material.dispose();

}


/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld() {

    for (
        const object
        of worldObjects
    ) {

        scene.remove(
            object
        );


        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();

                }


                if (
                    child.material
                ) {

                    disposeMaterial(
                        child.material
                    );

                }

            }
        );

    }


    worldObjects = [];

    wallColliders = [];

    deathHoles = [];

    fluorescentLights = [];


    if (
        exitLight
    ) {

        scene.remove(
            exitLight
        );

        exitLight =
            null;

    }


    exitObject =
        null;


    entity =
        null;

}


/* =========================================================
   WALL TEXTURE
========================================================= */


/*
    This is deliberately based on physical wall
    dimensions.

    The texture will repeat instead of stretching.
*/

function createWallTexture(
    width,
    height
) {

    if (
        !wallTexture
    ) {

        return null;

    }


    const texture =
        wallTexture.clone();


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    const imageWidth =
        texture.image &&
        texture.image.width
            ? texture.image.width
            : 1;


    const imageHeight =
        texture.image &&
        texture.image.height
            ? texture.image.height
            : 1;


    const aspect =
        imageWidth /
        imageHeight;


    /*
        One texture tile is approximately
        2.6 world units tall.

        This keeps the Backrooms wallpaper
        at a believable scale.
    */

    const tileHeight =
        2.6;


    const tileWidth =
        tileHeight *
        aspect;


    texture.repeat.set(

        Math.max(
            width /
            tileWidth,
            0.01
        ),

        Math.max(
            height /
            tileHeight,
            0.01
        )

    );


    texture.needsUpdate =
        true;


    return texture;

}


/* =========================================================
   WALL MATERIAL
========================================================= */

function createWallMaterial(
    width,
    height
) {

    const texture =
        createWallTexture(
            width,
            height
        );


    if (!texture) {

        return new THREE.MeshStandardMaterial({

            color:
                0xb9ad58,

            roughness:
                0.86,

            metalness:
                0

        });

    }


    /*
        StandardMaterial is used for the
        environment.

        Therefore the fluorescent lights
        actually illuminate the wallpaper.
    */

    return new THREE.MeshStandardMaterial({

        map:
            texture,

        color:
            0xffffff,

        roughness:
            0.94,

        metalness:
            0,

        side:
            THREE.DoubleSide

    });

}


/* =========================================================
   CREATE WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = 0.30
) {

    const height =
        3.10;


    wallColliders.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2,

        minY:
            0,

        maxY:
            height

    });


    const group =
        new THREE.Group();


    /*
        FRONT
    */

    const front =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                width,
                height
            )

        );


    front.position.set(

        0,

        height / 2,

        depth / 2

    );


    group.add(
        front
    );


    /*
        BACK
    */

    const back =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                width,
                height
            )

        );


    back.rotation.y =
        Math.PI;


    back.position.set(

        0,

        height / 2,

        -depth / 2

    );


    group.add(
        back
    );


    /*
        LEFT
    */

    const left =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

/* =========================================================

function createFloor() {

    let material;


    if (
        floorTexture
    ) {

        const texture =
            floorTexture.clone();


        texture.wrapS =
            THREE.RepeatWrapping;


        texture.wrapT =
            THREE.RepeatWrapping;


        /*
            Carpet scale was already working well,
            so this is kept relatively large.
        */

        texture.repeat.set(
            90,
            82
        );


        texture.needsUpdate =
            true;


        material =
            new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    1.0,

                metalness:
                    0

            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color:
                    0x9c9048,

                roughness:
                    1

            });

    }


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                280,
                250
            ),

            material

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    addWorldObject(
        floor
    );

}


/* =========================================================

========================================================= */

function createCeiling() {

    let material;


    if (
        ceilingTexture
    ) {

        const texture =
            ceilingTexture.clone();


        texture.wrapS =
            THREE.RepeatWrapping;


        texture.wrapT =
            THREE.RepeatWrapping;


        /*
            IMPORTANT:

            Ceiling texture is intentionally
            approximately 1/9 the previous
            world size.

        */

        texture.repeat.set(
            270,
            240
        );


        texture.needsUpdate =

                map:
                    texture,

                color:
                    0xffffff,

                metalness:
                    0,

/* =========================================================
   FLOOR HOLES
========================================================= */

function createHoleRoom() {

    /*
        A smaller unsettling section rather than
        covering a giant portion of the level.
    */

    const startX =
        -54;

    const startZ =
        57;

    const columns =
        15;

    const rows =
        7;

    const spacing =
        3.6;


    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            if (
                (
                    x * 3 +
                    z * 5
                ) % 7 === 0
            ) {

                continue;

            }


            const px =
                startX +
                x *
                spacing;


            const pz =
                startZ +
                z *
                spacing;


            const hole =
                new THREE.Mesh(

                    new THREE.CircleGeometry(
                        1.25,
                        32
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x090806,

                        side:
                            THREE.DoubleSide

                    })

                );


            hole.rotation.x =
                -Math.PI / 2;


            hole.position.set(
                px,
                0.008,
                pz
            );


            addWorldObject(
                hole
            );


            deathHoles.push({

                x:
                    px,

                z:
                    pz,

                radius:
                    1.12

            });

        }

    }

}

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(
    dt
) {

    for (
        const item
        of fluorescentLights
    ) {

        if (
            !item.flicker
        ) {

            continue;

        }


        item.timer -=
            dt;


        if (
            item.timer <= 0
        ) {

            item.timer =
                .08 +
                Math.random() *
                .55;


            /*
                NEVER turn the fixture off.

                Only the actual light intensity
                changes.

                This means the fluorescent tube
                remains visible.
            */

            if (
                Math.random() < .18
            ) {

                item.light.intensity =
                    item.base *
                    .18;

            } else {

                item.light.intensity =
                    item.base *
                    (
                        .65 +
                        Math.random() *
                        .42
                    );

            }

        }

    }

}


/* =========================================================
   COLLISION
========================================================= */

const PLAYER_RADIUS =
    0.30;

const PLAYER_HEIGHT =
    1.55;


function collides(
    x,
    z
) {

    const bottom =
        player.position.y;


    const top =
        bottom +
        PLAYER_HEIGHT;


    for (
        const wall
        of wallColliders
    ) {

        if (
            top <=
            wall.minY
        ) {

            continue;

        }


        if (
            bottom >=
            wall.maxY
        ) {

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
) {

    const radius =
        .46;


    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            radius *
            radius
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   LINE OF SIGHT
========================================================= */

function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 -
        x1;


    const dz =
        z2 -
        z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance /
            .32
        );


    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i /
            steps;


        const x =
            x1 +
            dx *
            t;


        const z =
            z1 +
            dz *
            t;


        if (
            entityHitsWall(
                x,
                z
            )
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   HOLE CHECK
========================================================= */

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;


        const dz =
            player.position.z -
            hole.z;


        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;

        }

    }


    return false;

}

/* =========================================================
   ENTITY CREATION
========================================================= */

function createEntity() {

    return new Promise(
        resolve => {

            textureLoader.load(

                "./entity.png",

                texture => {

                    /*
                        ENTITY IS THE ONLY COMPLETELY
                        UNSHADED PNG.

                        MeshBasicMaterial means the
                        fluorescent lights do not
                        darken it.
                    */

                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    texture.magFilter =
                        THREE.LinearFilter;


                    texture.minFilter =
                        THREE.LinearMipmapLinearFilter;


                    const aspect =
                        (
                            texture.image &&
                            texture.image.width
                        ) /
                        (
                            texture.image &&
                            texture.image.height
                        );


                    const height =
                        1.55;


                    const width =
                        height *
                        (
                            aspect ||
                            1
                        );


                    const material =
                        new THREE.MeshBasicMaterial({

                            map:
                                texture,

                            transparent:
                                true,

                            alphaTest:
                                .015,

                            side:
                                THREE.DoubleSide,

                            depthWrite:
                                true,

                            fog:
                                false,

                            color:
                                0xffffff

                        });


                    entity =
                        new THREE.Mesh(

                            new THREE.PlaneGeometry(
                                width,
                                height
                            ),

                            material

                        );


                    entity.position.set(
                        72,
                        .775,
                        -72
                    );


                    addWorldObject(
                        entity
                    );


                    resolve();

                },


                undefined,


                error => {

                    console.error(
                        "entity.png failed:",
                        error
                    );


                    /*
                        Fallback.
                    */

                    entity =
                        new THREE.Mesh(

                            new THREE.PlaneGeometry(
                                1,
                                1.55

                            new THREE.MeshBasicMaterial({

                                color:

                                    THREE.DoubleSide

                            })

                        );


                    entity.position.set(

                        -72
                    );


                    addWorldObject(
                        entity
                    );


                    resolve();

                }

            );

        }
    );

}


/* =========================================================
   ENTITY DIRECTION CHOICE
========================================================= */

function chooseEntityDirection() {

    if (!entity)
        return;


    const px =
        player.position.x;

    const pz =
        player.position.z;


    const ex =
        entity.position.x;

    const ez =
        entity.position.z;


    const directX =
        px -
        ex;


    const directZ =
        pz -
        ez;


    const distance =
        Math.hypot(
            directX,
            directZ
        );


    if (
        distance <
        .001
    ) {

        return;

    }


    const baseAngle =
        Math.atan2(
            directZ,
            directX
        );


    /*
        The entity always knows where the player is.

        It first attempts to move directly toward
        the player.

        If the direct route is blocked, it tries
        angled routes.
    */

    const candidates = [

        baseAngle,

        baseAngle +
            Math.PI / 4,

        baseAngle -
            Math.PI / 4,

        baseAngle +
            Math.PI / 2,

        baseAngle -
            Math.PI / 2,

        baseAngle +
            Math.PI * .75,

        baseAngle -
            Math.PI * .75

    ];


    let bestAngle =
        baseAngle;


    let bestScore =
        Infinity;


    for (
        const angle
        of candidates
    ) {

        const testDistance =
            2.4;


        const testX =
            ex +
            Math.cos(angle) *
            testDistance;


        const testZ =
            ez +
            Math.sin(angle) *
            testDistance;


        if (
            entityHitsWall(
                testX,
                testZ
            )
        ) {

            continue;

        }


        const remaining =
            Math.hypot(

                px -
                testX,

                pz -
                testZ

            );


        /*
            Prefer routes that actually reduce
            distance to the player.
        */

        if (
            remaining <
            bestScore
        ) {

            bestScore =
                remaining;

            bestAngle =
                angle;

        }

    }


    entityTarget.set(

        Math.cos(
            bestAngle
        ),

        Math.sin(
            bestAngle
        )

    );

}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;

    }


    const settings =
        ENTITY_SETTINGS[
            difficulty
        ];


    /*
        ALWAYS update the player's current
        location.

        There is no "lost player" state.
    */

    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    entityTarget.set(
        dx,
        dz
    );


    if (
        distance >
        .001
    ) {

        entityTarget.normalize();

    }


    entityPathTimer -=
        dt;


    if (
        entityPathTimer <= 0
    ) {

        entityPathTimer =
            .08;

        chooseEntityDirection();

    }


    const targetAngle =
        Math.atan2(
            entityTarget.y,
            entityTarget.x
        );


    const currentAngle =
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );


    let difference =
        targetAngle -
        currentAngle;


    while (
        difference >
        Math.PI
    ) {

        difference -=
            Math.PI * 2;

    }


    while (
        difference <
        -Math.PI
    ) {

        difference +=
            Math.PI * 2;

    }


    const turnSpeed =
        5.5 *
        dt;


    difference =
        THREE.MathUtils.clamp(
            difference,
            -turnSpeed,
            turnSpeed
        );


    const angle =
        currentAngle +
        difference;


    entityDirection.set(

        Math.cos(angle),

        Math.sin(angle)

    );


    const desiredVX =
        entityDirection.x *
        settings.speed;


    const desiredVZ =
        entityDirection.y *
        settings.speed;


    entityVelocity.x =
        THREE.MathUtils.lerp(

            entityVelocity.x,

            desiredVX,

            Math.min(
                1,
                settings.acceleration *
                dt
            )

        );


    entityVelocity.y =
        THREE.MathUtils.lerp(

            entityVelocity.y,

            desiredVZ,

            Math.min(
                1,
                settings.acceleration *
                dt
            )

        );


    const moveX =
        entityVelocity.x *
        dt;


    const moveZ =
        entityVelocity.y *
        dt;


    const nextX =
        entity.position.x +
        moveX;


    const nextZ =
        entity.position.z +
        moveZ;


    /*
        Separate X and Z collision lets the entity
        slide along walls instead of getting stuck.
    */

    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        entityVelocity.x =
            0;

        entityPathTimer =
            0;

    }


    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        entityVelocity.y =
            0;

        entityPathTimer =
            0;

    }


    /*
        Keep entity on the floor.
    */

    entity.position.y =
        .775;


    /*
        Billboard toward player.

        The PNG itself remains completely
        unshaded.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );


    /*
        Kill distance.
    */

    if (
        distance <
        settings.killDistance
    ) {

        killPlayer(
            "THE ENTITY FOUND YOU."
        );

    }

}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;

    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );


    const maxDistance =
        38;


    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;

    }


    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.5

        ) *
        .78;


    if (
        blocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z

        )
    ) {

        volume *=
            .30;

    }


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .85
        );


    if (
        entityAudio.paused &&
        volume > .015
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );

    }

}

        ) {

        /*

            .0019;

        player.rotation.y =

);


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;

    }


    let forward =
        0;

    let side =
        0;


    /*
        IMPORTANT:

        W = +forward
        S = -forward

        This is deliberately not swapped.
    */

    if (
        keys.w
    ) {

        forward +=
            1;

    }


    if (
        keys.s
    ) {

        forward -=
            1;

    }


    if (
        keys.d
    ) {

        side +=
            1;

    }


    if (
        keys.a
    ) {

        side -=
            1;

    }


    const inputLength =
        Math.hypot(
            forward,
            side
        );


    if (
        inputLength >
        0
    ) {

        forward /=
            inputLength;

        side /=
            inputLength;

    }


    let speed =
        3.7;


    if (
        keys.shift
    ) {

        speed =
            6.0;

    }


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.2
                : 4.0;

    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.3
                : 3.7;

    }


    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.6
                : 3.6;

    }


    /*
        This is the correct FPS movement basis.

        Camera forward direction is:

            sin(yaw)
            cos(yaw)

        Therefore W travels where the camera
        is looking.
    */

    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    const dx =
        (
            side *
            cos +

            forward *
            sin
        ) *
        speed *
        dt;


    const dz =
        (
            -side *
            sin +

            forward *
            cos
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        dx;


    const nextZ =
        player.position.z +
        dz;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;

    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;

    }


    /*
        Jump.
    */

    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;

    }


    jumpPressed =
        false;


    velocityY -=
        20 *
        dt;


    player.position.y +=
        velocityY *
        dt;


    if (
        player.position.y <=
        0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;

    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;

    }


    checkExit();

}


/* =========================================================
   FALLING INTRO
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;


    const progress =
        Math.min(

            fallTimer /
            FALL_DURATION,

            1

        );


    const eased =
        1 -
        Math.pow(
            1 - progress,
            3
        );


    player.position.y =
        17 -
        17 *
        eased;


    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );


    camera.rotation.x =
        THREE.MathUtils.lerp(

            -.34,

            0,

            Math.min(
                progress *
                1.35,
                1
            )

        );


    camera.rotation.z =
        Math.sin(

            progress *
            Math.PI *
            8

        ) *
        .025;


    if (
        progress >=
        1
    ) {

        fallingIntoLevel =
            false;


        player.position.y =
            0;


        camera.position.set(
            0,
            EYE_HEIGHT,
            0
        );


        camera.rotation.x =
            0;


        camera.rotation.z =
            0;


        requestPointerLock();

    }

}


/* =========================================================
   CAMERA MOTION
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;

    }


    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    /*
        Subtle handheld movement.

        This does NOT change the player's actual
        direction.
    */

    const bobAmount =
        moving
            ? .008
            : .002;


    camera.position.x =
        Math.sin(
            cameraTime *
            3.5
        ) *
        bobAmount;


    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime *
            4.2
        ) *
        bobAmount;


    camera.position.z =
        Math.cos(
            cameraTime *
            3.0
        ) *
        bobAmount *
        .55;


    camera.rotation.z =
        Math.sin(
            cameraTime *
            .85
        ) *
        .0025;


    /*
        Tiny found-footage instability.
    */

    if (
        Math.random() <
        .003
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) *
            .028;


        camera.position.y +=
            (
                Math.random() -
                .5
            ) *
            .020;


        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) *
            .012;

    }

}

    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "block";

}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    /*
        Textures must be loaded first.

        This prevents the world from being built
        before the PNGs are available.
    */

    if (
        !wallTexture ||
        !floorTexture ||
        !ceilingTexture
    ) {

        await loadEnvironmentTextures();

    }


    clearWorld();


    /*
        Reset controls.
    */

    keys.w =
        false;

    keys.a =
        false;

    keys.s =
        false;

    keys.d =
        false;

    keys.shift =
        false;


    jumpPressed =
        false;


    /*
        Spawn high above the actual level.
    */

    player.position.set(

        -96,

        17,

        -78

    );


    yaw =
        0.18;


    pitch =
        -0.28;


    velocityY =
        0;


    grounded =
        false;


    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );


    camera.rotation.set(
        pitch,
        0,
        0
    );


    player.rotation.y =
        yaw;


    /*
        Build environment.
    */

    createFloor();

    createCeiling();

    buildLevel0();

    createHoleRoom();

    createExit();

    buildLighting();


    /*
        Entity is deliberately created AFTER
        the environment.
    */

    await createEntity();


    entity.position.set(
        72,
        .775,
        -72
    );


    entityDirection.set(
        -1,
        0
    );


    entityVelocity.set(
        0,
        0
    );


    entityPathTimer =
        0;


    running =
        true;


    paused =
        false;


    dead =
        false;


    fallingIntoLevel =
        true;


    fallTimer =
        0;


    recordingTime =
        0;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    showMessage(
        "ENTERING LEVEL 0..."
    );


    /*
        Requesting audio playback here is allowed
        because this function was triggered by the
        player's button click.
    */

    entityAudio.volume =
        0;

}


/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(
    value
) {

    difficulty =
        value;


    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );

            }
        );


    const id =
        value ===
        "nightmare"

            ? "nightmareBtn"

            : value +
              "Btn";


    document.getElementById(
        id
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();

}


/* =========================================================
   MENU BUTTONS
========================================================= */

document.getElementById(
    "easyBtn"
).onclick =
    () => {

        setDifficulty(
            "easy"
        );

    };


document.getElementById(
    "normalBtn"
).onclick =

    };


document.getElementById(
    "hardBtn"
).onclick =

        );

    };


document.getElementById(
    "nightmareBtn"
).onclick =

        setDifficulty(
            "nightmare"
        );

document.getElementById(
    "startBtn"
).onclick =

    };


document.getElementById(

        togglePause();

    };


document.getElementById(

).onclick =

document.getElementById(
    "retryBtn"

document.getElementById(

    };


/* =========================================================
   POINTER LOCK CLICK
========================================================= */

document.addEventListener(
    "click",
    event => {

        if (
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ) {

            return;

        }


        /*
            Don't interfere with the CRT button.
        */

        if (
            event.target ===
            document.getElementById(
                "crtButton"
            )
        ) {

            return;

        }


        if (
            document.pointerLockElement !==
            document.body
        ) {

            requestPointerLock();

        }

    }
);


/* =========================================================
   CRT TOGGLE
========================================================= */

let crtEnabled =
    true;


function updateCRTButton() {

    const button =
        document.getElementById(
            "crtButton"
        );


    button.textContent =
        crtEnabled
            ? "CRT: ON"
            : "CRT: OFF";

}


function toggleCRT() {

    crtEnabled =
        !crtEnabled;


    const overlay =
        document.getElementById(
            "crtOverlay"
        );


    if (
        crtEnabled
    ) {

        overlay.classList.remove(
            "disabled"
        );

    } else {

        overlay.classList.add(
            "disabled"
        );

    }


    updateCRTButton();

}


document.getElementById(
    "crtButton"
).addEventListener(
    "click",
    event => {

        event.stopPropagation();

        toggleCRT();

    }
);


/* =========================================================
   MENU IMAGE RANDOMIZER
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );


let currentMenuIndex =
    -1;


function chooseRandomMenuImage() {

    if (
        menuImages.length ===
        0
    ) {

        return;

    }


    let newIndex =
        Math.floor(
            Math.random() *
            menuImages.length
        );


    /*
        Avoid immediately choosing the same image.
    */

    if (
        menuImages.length >
        1
    ) {

        while (
            newIndex ===
            currentMenuIndex
        ) {

            newIndex =
                Math.floor(
                    Math.random() *
                    menuImages.length
                );

        }

    }


    if (
        currentMenuIndex >=
        0
    ) {

        menuImages[
            currentMenuIndex
        ].classList.remove(
            "active"
        );

    }


    currentMenuIndex =
        newIndex;


    menuImages[
        currentMenuIndex
    ].classList.add(
        "active"
    );

}


/*
    Pick a random image immediately.
*/

chooseRandomMenuImage();


/*
    Pick another random image every minute.
*/

setInterval(
    chooseRandomMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio ||
                1,

                1.35

            )

        );

    }
);


/* =========================================================
   TIMER
========================================================= */

const clock =
    new THREE.Clock();


let recordingTime =
    0;


function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;

    }


    recordingTime +=
        dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total /
            3600
        );


    const minutes =
        Math.floor(
            (
                total %
                3600
            ) /
            60
        );


    const seconds =
        total %
        60;


    const format =
        value => {

            return String(
                value
            ).padStart(
                2,
                "0"
            );

        };


    document.getElementById(
        "tapeTime"
    ).textContent =

        format(hours) +
        ":" +
        format(minutes) +
        ":" +
        format(seconds);

}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        updateLights(
            dt
        );


        updateCamera(
            dt
        );


        updateEntityAudio();


        updateMessage(
            dt
        );


        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize() {

    try {

        await loadEnvironmentTextures();

    } catch (
        error
    ) {

        console.error(
            error
        );

    }


    updateCRTButton();


    animate();

}


initialize();

</script>
