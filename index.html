<script src="./three.min.js"></script>

<script>
"use strict";

/* =========================================================
   THREE CHECK
========================================================= */

if(!window.THREE){

    const error=document.getElementById("error");

    error.style.display="block";

    error.textContent=
        "THREE.JS FAILED TO LOAD.\n\n"+
        "Expected file:\n"+
        "./three.min.js\n\n"+
        "Make sure three.min.js is in the SAME folder as index.html.";

    throw new Error("Local Three.js missing");
}

/* =========================================================
   SCENE
========================================================= */

const scene=new THREE.Scene();

scene.background=
    new THREE.Color(0x11100b);

scene.fog=
    new THREE.FogExp2(
        0x211f16,
        .011
    );

/* =========================================================
   CAMERA
========================================================= */

const camera=
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .025,
        500
    );

camera.rotation.order="YXZ";

/* =========================================================
   RENDERER
========================================================= */

const renderer=
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio||1,
        1.35
    )
);

if("outputColorSpace" in renderer){

    renderer.outputColorSpace=
        THREE.SRGBColorSpace;
}

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=.72;

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

/*
   MUCH DARKER AMBIENT LIGHT.

   The fluorescent lights are now the main
   source of illumination.
*/

scene.add(
    new THREE.AmbientLight(
        0x393426,
        .075
    )
);

scene.add(
    new THREE.HemisphereLight(
        0x6d674d,
        0x050403,
        .10
    )
);

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader=
    new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;

function prepareTexture(texture){

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.magFilter=
        THREE.LinearFilter;

    texture.minFilter=
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy=
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            8
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(path){

    return new Promise(resolve=>{

        textureLoader.load(

            path,

            texture=>{
                console.log(
                    "TEXTURE LOADED:",
                    path
                );

                resolve(
                    prepareTexture(texture)
                );
            },

            undefined,

            error=>{

                console.error(
                    "TEXTURE FAILED:",
                    path,
                    error
                );

                resolve(null);
            }
        );
    });
}

async function loadTextures(){

    wallTexture=
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture=
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture=
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing=[];

    if(!wallTexture)
        missing.push("./textures/wall.png");

    if(!floorTexture)
        missing.push("./textures/floor.png");

    if(!ceilingTexture)
        missing.push("./textures/ceiling.png");

    if(missing.length){

        const error=
            document.getElementById("error");

        error.style.display="block";

        error.textContent=
            "TEXTURE ERROR\n\n"+
            missing.join("\n")+
            "\n\n"+
            "Check that the files exist exactly at those paths.";
    }
}

/* =========================================================
   PLAYER
========================================================= */

const player=
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const EYE_HEIGHT=1.18;
const PLAYER_HEIGHT=1.55;
const PLAYER_RADIUS=.28;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=false;

let running=false;
let paused=false;
let dead=false;

let fallingIntoLevel=false;
let fallTimer=0;

const FALL_DURATION=2.25;

let difficulty="normal";

/* =========================================================
   WORLD
========================================================= */

let worldObjects=[];
let wallColliders=[];
let deathHoles=[];
let lights=[];

function addWorldObject(object){

    scene.add(object);

    worldObjects.push(object);

    return object;
}

function disposeMaterial(material){

    if(!material)
        return;

    if(Array.isArray(material)){

        material.forEach(
            disposeMaterial
        );

        return;
    }

    /*
       Do NOT dispose the original shared
       PNG textures.
    */

    if(material.map &&
       material.map !== wallTexture &&
       material.map !== floorTexture &&
       material.map !== ceilingTexture){

        material.map.dispose();
    }

    material.dispose();
}

function clearWorld(){

    for(const object of worldObjects){

        scene.remove(object);

        object.traverse?.(
            child=>{

                if(child.geometry)
                    child.geometry.dispose();

                if(child.material)
                    disposeMaterial(
                        child.material
                    );
            }
        );
    }

    worldObjects=[];
    wallColliders=[];
    deathHoles=[];
    lights=[];

    if(exitLight){

        scene.remove(
            exitLight
        );

        exitLight=null;
    }

    exitObject=null;
    entity=null;
}

/* =========================================================
   WALL MATERIAL
========================================================= */

function makeWallMaterial(
    width,
    height
){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({

            color:0x746c39,

            roughness:.92,

            metalness:0,

            side:THREE.DoubleSide
        });
    }

    const texture=
        wallTexture.clone();

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.ClampToEdgeWrapping;

    const iw=
        texture.image?.width||1;

    const ih=
        texture.image?.height||1;

    const aspect=iw/ih;

    const naturalWidth=
        height*aspect;

    texture.repeat.set(
        Math.max(
            width/naturalWidth,
            .001
        ),
        1
    );

    texture.needsUpdate=true;

    /*
       IMPORTANT:

       Environment PNGs are SHADED.

       MeshStandardMaterial allows the fluorescent
       lights to illuminate them and dark areas
       to actually become dark.
    */

    return new THREE.MeshStandardMaterial({

        map:texture,

        color:0xffffff,

        roughness:.93,

        metalness:0,

        side:THREE.DoubleSide
    });
}

/* =========================================================
   WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth=.32
){

    const height=3.1;

    wallColliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minZ:z-depth/2,
        maxZ:z+depth/2,

        minY:0,
        maxY:height
    });

    const group=
        new THREE.Group();

    const front=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                height
            ),
            makeWallMaterial(
                width,
                height
            )
        );

    front.position.set(
        0,
        height/2,
        depth/2
    );

    front.castShadow=true;
    front.receiveShadow=true;

    group.add(front);

    const back=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                height
            ),
            makeWallMaterial(
                width,
                height
            )
        );

    back.rotation.y=Math.PI;

    back.position.set(
        0,
        height/2,
        -depth/2
    );

    back.castShadow=true;
    back.receiveShadow=true;

    group.add(back);

    const left=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                depth,
                height
            ),
            makeWallMaterial(
                depth,
                height
            )
        );

    left.rotation.y=
        Math.PI/2;

    left.position.set(
        -width/2,
        height/2,
        0
    );

    left.castShadow=true;
    left.receiveShadow=true;

    group.add(left);

    const right=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                depth,
                height
            ),
            makeWallMaterial(
                depth,
                height
            )
        );

    right.rotation.y=
        -Math.PI/2;

    right.position.set(
        width/2,
        height/2,
        0
    );

    right.castShadow=true;
    right.receiveShadow=true;

    group.add(right);

    group.position.set(
        x,
        0,
        z
    );

    addWorldObject(group);
}

/* =========================================================
   FLOOR
========================================================= */

function createFloor(){

    let material;

    if(floorTexture){

        const texture=
            floorTexture.clone();

        texture.wrapS=
            THREE.RepeatWrapping;

        texture.wrapT=
            THREE.RepeatWrapping;

        texture.repeat.set(
            150,
            135
        );

        texture.needsUpdate=true;

        material=
            new THREE.MeshStandardMaterial({

                map:texture,

                color:0xffffff,

                roughness:1,

                metalness:0
            });

    }else{

        material=
            new THREE.MeshStandardMaterial({

                color:0x756c38,

                roughness:1
            });
    }

    const floor=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                300,
                270
            ),
            material
        );

    floor.rotation.x=
        -Math.PI/2;

    floor.receiveShadow=true;

    addWorldObject(floor);
}

/* =========================================================
   CEILING
========================================================= */

function createCeiling(){

    let material;

    if(ceilingTexture){

        const texture=
            ceilingTexture.clone();

        texture.wrapS=
            THREE.RepeatWrapping;

        texture.wrapT=
            THREE.RepeatWrapping;

        texture.repeat.set(
            120,
            105
        );

        texture.needsUpdate=true;

        material=
            new THREE.MeshStandardMaterial({

                map:texture,

                color:0xffffff,

                roughness:.95,

                metalness:0,

                side:THREE.DoubleSide
            });

    }else{

        material=
            new THREE.MeshStandardMaterial({

                color:0x65603b,

                roughness:1,

                side:THREE.DoubleSide
            });
    }

    const ceiling=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                300,
                270
            ),
            material
        );

    ceiling.rotation.x=
        Math.PI/2;

    ceiling.position.y=3.1;

    ceiling.receiveShadow=true;

    addWorldObject(ceiling);
}

/* =========================================================
   OUTER WALLS
========================================================= */

/*
   These prevent the player from ever looking
   directly into the void.

   They use the EXACT SAME wall system as
   interior walls.
*/

function createOuterWalls(){

    const edge=136;
    const thickness=.8;

    createWall(
        0,
        -135,
        272,
        thickness
    );

    createWall(
        0,
        135,
        272,
        thickness
    );

    createWall(
        -135,
        0,
        thickness,
        270
    );

    createWall(
        135,
        0,
        thickness,
        270
    );
}

/* =========================================================
   BACKROOMS FLOOR PLAN
========================================================= */

function buildFloorPlan(){

    /*
       MAIN BACKROOMS GRID

       Large rooms
       Uneven corridors
       Long sightlines
       Dead ends
       Narrow passages
       Random-looking partitions
    */

    /* NORTHWEST */

    createWall(-112,-105,38);
    createWall(-91,-91,20);
    createWall(-68,-104,25);
    createWall(-43,-96,22);

    createWall(-116,-78,22);
    createWall(-94,-72,15);
    createWall(-76,-82,21);
    createWall(-53,-73,17);
    createWall(-32,-82,25);
    createWall(-7,-73,17);

    createWall(-116,-52,27);
    createWall(-88,-57,18);
    createWall(-68,-48,22);
    createWall(-45,-58,18);
    createWall(-24,-47,25);
    createWall(0,-56,18);

    /* NORTH CENTER */

    createWall(17,-101,24);
    createWall(43,-91,20);
    createWall(68,-103,31);
    createWall(98,-91,25);

    createWall(12,-77,18);
    createWall(34,-68,22);
    createWall(58,-78,18);
    createWall(79,-66,25);
    createWall(106,-73,18);

    createWall(15,-47,23);
    createWall(40,-54,18);
    createWall(60,-43,25);
    createWall(87,-52,20);
    createWall(111,-42,25);

    /* CENTRAL WEST */

    createWall(-111,-23,22);

/* =========================================================
   HOLE ROOM
========================================================= */

function createHoleRoom(){

    const startX=-57;
    const startZ=53;

    const columns=18;
    const rows=8;
    const spacing=3.5;

    for(let z=0;z<rows;z++){

        for(let x=0;x<columns;x++){

            if((x+z)%5===0)
                continue;

            const px=
                startX+x*spacing;

            const pz=
                startZ+z*spacing;

            const hole=
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.7,
                        2.7
                    ),

                    new THREE.MeshBasicMaterial({

                        color:0x010101,

                        side:THREE.DoubleSide
                    })
                );

            hole.rotation.x=
                -Math.PI/2;

            hole.position.set(
                px,
                .006,
                pz
            );

            addWorldObject(hole);

            deathHoles.push({
                x:px,
                z:pz,
                radius:1.28
            });
        }
    }
}

   LIGHTING
========================================================= */

function addLight(
    x,
    z,
    intensity=4,
    flicker=false
){

    /*
       Physical-looking fluorescent fixture.

       It NEVER becomes invisible.
       Flicker only changes intensity.
    */

    const fixture=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.35,
                .055,
                1.35
            ),

            new THREE.MeshBasicMaterial({

                color:0xfff1bd
            })
        );

    fixture.position.set(
        x,
        3.045,
        z
    );

    addWorldObject(fixture);

    const light=
        new THREE.PointLight(
            0xffd98a,
            intensity,
            15,
            1.65
        );

    light.position.set(
        x,
        2.72,
        z
    );

    /*
       Shadows make the environment MUCH darker
       outside the fluorescent pools.
    */

    light.castShadow=true;

    light.shadow.mapSize.width=256;
    light.shadow.mapSize.height=256;

    light.shadow.camera.near=.1;
    light.shadow.camera.far=15;

    scene.add(light);

    lights.push({

        light,
        fixture,
        flicker,

        timer:
            .2+
            Math.random()*2,

        base:intensity
    });
}

function buildLighting(){

    /*
       Regular ceiling grid.
    */

    for(
        let x=-120;
        x<=120;
        x+=12
    ){

        for(
            let z=-120;
            z<=120;
            z+=11
        ){

            if(
                Math.random()<.16
            ){
                continue;
            }

            addLight(

                x+
                (Math.random()-.5)*2,

                z+
                (Math.random()-.5)*2,

                3.2+
                Math.random()*1.8,

                Math.random()<.18
            );
        }
    }

    /*
       Important brighter areas.
    */

    addLight(-18,-64,5.8);
    addLight(-7,-64,5.5);
    addLight(27,-9,5.8);
    addLight(6,19,5.7);
    addLight(31,59,5.9);

    /*
       Broken fluorescent lights.
    */

    addLight(-55,57,2.1,true);
    addLight(-32,67,2.3,true);
    addLight(-15,57,1.9,true);
    addLight(61,-44,2.0,true);
    addLight(-83,-53,2.2,true);
}

function updateLights(dt){

    for(const item of lights){

        if(!item.flicker)
            continue;

        item.timer-=dt;

        if(item.timer<=0){

            item.timer=
                .08+
                Math.random()*.55;

            /*
               NEVER set intensity to zero.

               The fluorescent fixture remains visible.
            */

            const multiplier=
                Math.random()<.25
                    ? .28+
                      Math.random()*.15
                    : .68+
                      Math.random()*.35;

            item.light.intensity=
                item.base*
                multiplier;
        }
    }
}

/* =========================================================
   COLLISION
========================================================= */

function collides(x,z){

    const bottom=
        player.position.y;

    const top=
        bottom+
        PLAYER_HEIGHT;

    for(const wall of wallColliders){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){
            continue;
        }

        const closestX=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+
            dz*dz<
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){
            return true;
        }
    }

    return false;
}

function entityHitsWall(x,z){

    for(const wall of wallColliders){

        const closestX=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+
            dz*dz<
            .43*.43
        ){
            return true;
        }
    }

    return false;
}

function blocked(
    x1,
    z1,
    x2,
    z2
){

    const dx=x2-x1;
    const dz=z2-z1;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    const steps=
        Math.ceil(
            distance/.35
        );

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        if(
            entityHitsWall(
                x1+dx*t,
                z1+dz*t
            )
        ){
            return true;
        }
    }

    return false;
}

function playerInHole(){

    for(const hole of deathHoles){

        const dx=
            player.position.x-
            hole.x;

        const dz=
            player.position.z-
            hole.z;

        if(
            dx*dx+
            dz*dz<
            hole.radius*
            hole.radius
        ){
            return true;
        }
    }

    return false;
}

const SETTINGS={

let lastSeen=99;

let wanderTimer=0;
let wanderAngle=0;

/* =========================================================
   ENTITY CREATION
========================================================= */

function createEntity(){

    return new Promise(resolve=>{

        textureLoader.load(

            "./entity.png",

            texture=>{

                texture.colorSpace=
                    THREE.SRGBColorSpace;

                texture.magFilter=
                    THREE.LinearFilter;

                texture.minFilter=
                    THREE.LinearMipmapLinearFilter;

                const aspect=
                    (
                        texture.image.width||1
                    )/
                    (
                        texture.image.height||1
                    );

                const height=1.55;

                const width=
                    height*aspect;

                /*
                   ENTITY IS THE ONLY UNSHADED PNG.

                   MeshBasicMaterial means fluorescent
                   lighting DOES NOT affect it.
                */

                const material=
                    new THREE.MeshBasicMaterial({

                        map:texture,

                        transparent:true,

                        alphaTest:.01,

                        side:THREE.DoubleSide,

                        fog:false,

                        color:0xffffff
                    });

                entity=
                    new THREE.Mesh(

                        new THREE.PlaneGeometry(
                            width,
                            height
                        ),

                        material
                    );

                entity.position.set(
                    55,
                    .775,
                    -48
                );

                addWorldObject(entity);

                resolve();
            },

            undefined,

            error=>{

                console.warn(
                    "entity.png failed:",
                    error
                );

                entity=
                    new THREE.Mesh(

                        new THREE.PlaneGeometry(
                            1,
                            1.55
                        ),

                        new THREE.MeshBasicMaterial({

                            color:0x010101,

                            transparent:true
                        })

                entity.position.set(
                    55,
                    .775,

                );

                addWorldObject(entity);

                resolve();
            }
        );
    });
}

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){
        return;
    }

    const settings=
        SETTINGS[difficulty];

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(dx,dz);

    lastSeen+=dt;

    const visible=
        distance<
        settings.detection&&
        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );

    let dx2=0;
    let dz2=0;

    if(visible){

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen=0;

        dx2=
            dx/
            Math.max(
                distance,
                .001
            );

        dz2=
            dz/
            Math.max(
                distance,
                .001
            );

    }else if(lastSeen<3.2){

        const lx=
            lastKnown.x-
            entity.position.x;

        const lz=
            lastKnown.y-
            entity.position.z;

        const len=
            Math.hypot(lx,lz);

        if(len>.1){

            dx2=lx/len;
            dz2=lz/len;
        }

    }else{

        wanderTimer-=dt;

        if(wanderTimer<=0){

            wanderTimer=
                .5+
                Math.random()*1.8;

            wanderAngle=
                Math.random()*
                Math.PI*2;
        }

        dx2=
            Math.cos(
                wanderAngle
            );

        dz2=
            Math.sin(
                wanderAngle
            );
    }

    const targetAngle=
        Math.atan2(
            dz2,
            dx2
        );

    const currentAngle=
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference=
        targetAngle-
        currentAngle;

    while(difference>Math.PI)
        difference-=Math.PI*2;

    while(difference<-Math.PI)
        difference+=Math.PI*2;

    difference=
        Math.max(
            -3.4*dt,
            Math.min(
                3.4*dt,
                difference
            )
        );

    const angle=
        currentAngle+
        difference;

    entityDirection.x=
        Math.cos(angle);

    entityDirection.y=
        Math.sin(angle);

    entityVelocity.x=
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x*
            settings.speed,
            Math.min(1,dt*4)
        );

    entityVelocity.y=
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y*
            settings.speed,
            Math.min(1,dt*4)
        );

    const moveX=
        entityVelocity.x*dt;

    const moveZ=
        entityVelocity.y*dt;

    const nextX=
        entity.position.x+
        moveX;

    const nextZ=
        entity.position.z+
        moveZ;

    if(
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ){

        entity.position.x=
            nextX;

    }else{

        entityVelocity.x=0;

        wanderAngle+=
            Math.PI/2;
    }

    if(
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ){

        entity.position.z=
            nextZ;

    }else{

        entityVelocity.y=0;

        wanderAngle+=
            Math.PI/2;
    }

    /*
       Billboard toward player.
    */

    entity.rotation.y=
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    const killDistance=
        difficulty==="nightmare"
            ?1.55
            :1.25;

    if(
        distance<
        killDistance
    ){

        killPlayer();
    }
}

/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio(){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){

        entityAudio.volume=0;

        return;
    }

    const distance=
        Math.hypot(

            entity.position.x-
            player.position.x,

            entity.position.z-
            player.position.z
        );

    const maxDistance=34;

    if(distance>=maxDistance){

        entityAudio.volume=0;

        return;
    }

    let volume=
        Math.pow(
            1-distance/maxDistance,
            1.6
        )*.9;

    if(
        blocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    ){
        volume*=.2;
    }

    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if(
        entityAudio.paused&&
        volume>.01
    ){

        entityAudio
            .play()
            .catch(()=>{});
    }
}

const keys={

    a:false,
    s:false,
    d:false,

};

addEventListener(
    "keydown",
    event=>{

        /*
           FIXED:

           W = forward
           S = backward
        */

        if(event.code==="KeyW")
            keys.w=true;

        if(event.code==="KeyS")
            keys.s=true;

        if(event.code==="KeyA")
            keys.a=true;

        if(event.code==="KeyD")
            keys.d=true;

        if(
            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        ){
            keys.shift=true;
        }

        if(
            event.code==="Space"&&
            !event.repeat
        ){
            jumpPressed=true;
        }

        if(
            event.code==="Escape"&&
            running&&
            !dead&&
            !fallingIntoLevel
        ){
            togglePause();
        }
    }
);

addEventListener(
    "keyup",
    event=>{

        if(event.code==="KeyW")
            keys.w=false;

        if(event.code==="KeyS")
            keys.s=false;

        if(event.code==="KeyA")
            keys.a=false;

        if(event.code==="KeyD")
            keys.d=false;

        if(
            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        ){
            keys.shift=false;
        }
    }
);

========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !running||
            paused||
            dead||
            fallingIntoLevel
        ){
            return;
        }

        if(
            document.pointerLockElement!==
            document.body
        ){
            return;
        }

        yaw-=
            event.movementX*.0022;

        pitch-=
            event.movementY*.0018;

        pitch=
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;
    }
);

/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt){

    if(fallingIntoLevel){

        updateFall(dt);

        return;
    }

    let forward=0;
    let side=0;

    /*
       CORRECT MOVEMENT.

       W = +forward
       S = -forward

       Camera forward points toward -Z,
       so the final Z movement is inverted.
    */

    if(keys.w)
        forward++;

    if(keys.s)
        forward--;

    if(keys.d)
        side++;

    if(keys.a)
        side--;

    const length=
        Math.hypot(
            forward,
            side
        );

    if(length){

        forward/=length;
        side/=length;
    }

    let speed=
        keys.shift
            ?5.9
            :3.5;

    if(difficulty==="easy")
        speed=keys.shift?6.1:3.8;

    if(difficulty==="hard")
        speed=keys.shift?6.3:3.4;

    if(difficulty==="nightmare")
        speed=keys.shift?6.5:3.25;

    const sin=
        Math.sin(yaw);

    const cos=
        Math.cos(yaw);

    /*
       THIS IS THE IMPORTANT FIX.

       W now moves in the direction
       the camera is facing.
    */

    const dx=
        (
            side*cos+
            forward*sin
        )*
        speed*
        dt;

    const dz=
        (
            -side*sin-
            forward*cos
        )*
        speed*
        dt;

    const nextX=
        player.position.x+
        dx;

    const nextZ=
        player.position.z+
        dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x=
            nextX;
    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z=
            nextZ;
    }

    if(
        jumpPressed&&
        grounded
    ){

        velocityY=6.2;
        grounded=false;
    }

    jumpPressed=false;

    velocityY-=20*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;
    }

    if(playerInHole()){

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }

    checkExit();
}

/* =========================================================
   FALL
========================================================= */

function updateFall(dt){

    fallTimer+=dt;

    const progress=
        Math.min(
            fallTimer/FALL_DURATION,
            1
        );

    const eased=
        1-
        Math.pow(
            1-progress,
            3
        );

    player.position.y=
        17-
        17*eased;

    camera.position.y=
        EYE_HEIGHT;

    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                progress*1.3,
                1
            )
        );

    camera.rotation.z=
        Math.sin(
            progress*
            Math.PI*
            9
        )*.025;

    if(progress>=1){

        fallingIntoLevel=false;

        player.position.y=0;

        camera.position.x=0;
        camera.position.y=
            EYE_HEIGHT;
        camera.position.z=0;

        camera.rotation.x=0;
        camera.rotation.z=0;

        document.body.requestPointerLock();
    }
}

/* =========================================================
   CAMERA MOTION
========================================================= */

let cameraTime=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;

    cameraTime+=dt;

    const moving=
        keys.w||
        keys.a||
        keys.s||
        keys.d;

    const amount=
        moving
            ?.011
            :.003;

    camera.position.x=
        Math.sin(
            cameraTime*3.4
        )*
        amount;

    camera.position.y=
        EYE_HEIGHT+
        Math.sin(
            cameraTime*4.1
        )*
        amount;

    camera.position.z=
        Math.cos(
            cameraTime*3.1
        )*
        amount*.55;

    camera.rotation.z=
        Math.sin(
            cameraTime*.9
        )*.003;

    /*
       Occasional security-camera jitter.
    */

    if(
        Math.random()<.006
    ){

        camera.position.x+=
            (
                Math.random()-.5
            )*.05;

        camera.position.y+=
            (
                Math.random()-.5
            )*.035;

        camera.rotation.z+=
            (
                Math.random()-.5
            )*.035;
    }
}

/* =========================================================
   EXIT
========================================================= */

function checkExit(){

    if(
        !exitObject||
        dead
    ){
        return;
    }

    const distance=
        Math.hypot(

            player.position.x-
            exitX,

            player.position.z-
            exitZ
        );

    if(distance<1.8){

        winGame();
    }
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.2;
}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";
    }
}

/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason="THE BACKROOMS GOT YOU"
){

    if(
        dead||
        !running
    ){
        return;
    }

    dead=true;

    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU DIED";

    document.getElementById(
        "deathTitle"
    ).className="";

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "retryBtn"
    ).textContent="RETRY";

    document.getElementById(
        "death"
    ).style.display="flex";
}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    if(
        dead||
        !running
    ){
        return;
    }

    dead=true;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU ESCAPED";

    document.getElementById(
        "deathTitle"
    ).className="win";

    document.getElementById(
        "deathText"
    ).textContent="YOU FOUND THE EXIT";

    document.getElementById(
        "retryBtn"
    ).textContent="PLAY AGAIN";

    document.getElementById(
        "death"
    ).style.display="flex";
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !running||
        dead||
        fallingIntoLevel
    ){
        return;
    }

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
            ?"flex"
            :"none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        document.body.requestPointerLock();
    }
}

/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";
}

/* =========================================================
   START
========================================================= */

async function startGame(){

    if(
        !wallTexture||
        !floorTexture||
        !ceilingTexture
    ){

        await loadTextures();
    }

    clearWorld();

    player.position.set(
        -120,
        17,
        -112
    );

    yaw=0;
    pitch=-.28;

    velocityY=0;
    grounded=false;

    createFloor();
    createCeiling();

    /*
       OUTER WALLS FIRST.
    */

    createOuterWalls();

    /*
       MAIN BACKROOMS MAP.
    */

    buildFloorPlan();

    createHoleRoom();

    createExit();

    buildLighting();

    await createEntity();

    entity.position.set(
        55,
        .775,
        -48
    );

    entityDirection.set(
        1,
        0
    );

    entityVelocity.set(
        0,
        0
    );

    lastSeen=99;

    running=true;
    paused=false;
    dead=false;

    fallingIntoLevel=true;

    fallTimer=0;

    recordingTime=0;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x=pitch;
    camera.rotation.z=0;

    player.rotation.y=yaw;

    showMessage(
        "ENTERING LEVEL 0..."
    );
}

/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(value){

    difficulty=value;

    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button=>
                button.classList.remove(
                    "selected"
                )
        );

    const id=
        value==="nightmare"
            ?"nightmareBtn"
            :value+"Btn";

    document.getElementById(
        id
    ).classList.add("selected");

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();
}

document.getElementById(
    "easyBtn"
).onclick=
    ()=>setDifficulty("easy");

document.getElementById(
    "normalBtn"
).onclick=
    ()=>setDifficulty("normal");

document.getElementById(
    "hardBtn"
).onclick=
    ()=>setDifficulty("hard");

document.getElementById(
    "nightmareBtn"
).onclick=
    ()=>setDifficulty("nightmare");

document.getElementById(
    "startBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "resumeBtn"
).onclick=

document.getElementById(
    "restartBtn"
).onclick=

document.getElementById(
    "menuBtn"
).onclick=

document.getElementById(
    "retryBtn"
).onclick=

document.getElementById(

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            running&&
            !paused&&
            !dead&&
            !fallingIntoLevel&&
            document.pointerLockElement!==
            document.body
        ){

            document.body.requestPointerLock();
        }
    }
);

/* =========================================================
   MENU IMAGES
========================================================= */

const menuImages=
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex=0;

function cycleMenuImage(){

    if(!menuImages.length)
        return;

    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );

    menuIndex=
        (
            menuIndex+1
        )%
        menuImages.length;

    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}

setInterval(
    cycleMenuImage,
    60000
);

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio||1,
                1.35
            )
        );
    }
);

/* =========================================================
   TIMER
========================================================= */

const clock=
    new THREE.Clock();

let recordingTime=0;

function updateTimer(dt){

    if(
        !running||
        paused
    ){
        return;
    }

    recordingTime+=dt;

    const total=
        Math.floor(
            recordingTime
        );

    const hours=
        Math.floor(
            total/3600
        );

    const minutes=
        Math.floor(
            (total%3600)/60
        );

    const seconds=
        total%60;

    const format=
        n=>
            String(n)
                .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        `${format(hours)}:`+
        `${format(minutes)}:`+
        `${format(seconds)}`;
}

/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running&&
        !paused&&
        !dead
    ){

        updatePlayer(dt);
        updateEntity(dt);
        updateLights(dt);
        updateCamera(dt);
        updateEntityAudio();
        updateMessage(dt);
        updateTimer(dt);

    }else{

        updateEntityAudio();
    }

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   INITIAL LOAD
========================================================= */

loadTextures();

animate();

</script>
