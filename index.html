<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>THE BACKROOMS</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{display:block}

/* ================= MENU ================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    overflow:hidden;
    background:#000;
}

.menuImage{
    position:absolute;
    inset:-4%;
    width:108%;
    height:108%;
    object-fit:cover;
    opacity:0;

    filter:
        brightness(.48)
        contrast(1.18)
        saturate(.72)
        sepia(.10)
        blur(.4px);

    transform:scale(1.04);

    transition:
        opacity 1.8s ease,
        transform 9s ease;
}

.menuImage.active{
    opacity:1;
    transform:scale(1);
}

.menuDark{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.68),
            rgba(0,0,0,.20) 50%,
            rgba(0,0,0,.65)
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.82),
            transparent 55%,
            rgba(0,0,0,.35)
        );
}

.menuNoise{
    position:absolute;
    inset:-10%;
    pointer-events:none;
    opacity:.13;

    background:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.65) 0,
            transparent 1px,
            transparent 3px
        );

    animation:
        menuNoiseMove .07s steps(2) infinite;
}

@keyframes menuNoiseMove{
    0%{transform:translate(0,0)}
    25%{transform:translate(-3px,2px)}
    50%{transform:translate(2px,-3px)}
    75%{transform:translate(3px,1px)}
    100%{transform:translate(0,0)}
}

.menuScanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.12;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.08) 0px,
            rgba(255,255,255,.08) 1px,
            transparent 2px,
            transparent 5px
        );
}

.menuContent{
    position:absolute;
    left:8%;
    bottom:11%;
    color:white;

    text-shadow:
        2px 3px 8px #000,
        0 0 25px #000;
}

.menuContent h1{
    margin:0;

    font-size:
        clamp(42px,6vw,82px);

    letter-spacing:
        clamp(6px,1vw,15px);

    color:#d7cc75;
}

.menuSubtitle{
    margin-top:4px;
    color:#bbb;
    letter-spacing:4px;
    font-size:13px;
}

.menuHint{
    margin-top:14px;
    color:#999;
    font-size:11px;
    letter-spacing:2px;
}

.menuButtons{
    position:absolute;
    right:9%;
    bottom:12%;
    width:300px;
}

.menuButton{
    display:block;
    width:100%;
    margin:7px 0;
    padding:14px 18px;

    border:
        1px solid
        rgba(255,255,255,.35);

    background:
        rgba(0,0,0,.55);

    color:#eee;
    font-size:15px;
    text-align:left;
    cursor:pointer;

    transition:
        background .15s,
        border-color .15s,
        padding-left .15s;
}

.menuButton:hover{
    background:
        rgba(110,100,35,.72);

    border-color:
        rgba(230,220,120,.8);

    padding-left:24px;
}

.menuDifficulty{
    display:flex;
    gap:5px;
    margin-bottom:10px;
}

.menuDifficulty button{
    flex:1;
    padding:8px 2px;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.45);

    color:#aaa;
    cursor:pointer;
}

.menuDifficulty button.selected{
    color:white;
    border-color:#d7cc75;

    background:
        rgba(100,90,30,.65);
}

.menuLocation{
    position:absolute;
    right:18px;
    bottom:15px;

    color:rgba(255,255,255,.48);

    font:10px monospace;
    letter-spacing:1px;
}

/* ================= OVERLAYS ================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:white;

    background:
        radial-gradient(
            ellipse at center,
            rgba(75,70,35,.85),
            rgba(0,0,0,.97)
        );
}

#pause,
#death{
    display:none;
}

.overlay h1{
    margin:0 0 15px;

    color:#d8cb60;
    font-size:48px;
    letter-spacing:8px;

    text-shadow:
        0 0 25px #000;
}

.overlay button{
    width:330px;
    padding:14px;
    margin:5px;

    border:
        1px solid
        #666;

    background:#111;
    color:#eee;
    cursor:pointer;
}

.overlay button:hover{
    background:#423d18;
    border-color:#d9cc61;
}

.deathTitle{
    color:#b40000 !important;
    font-size:55px !important;
}

.deathText{
    color:#aaa;
    margin-bottom:20px;
}

/* ================= HUD ================= */

#crosshair{
    position:fixed;
    z-index:20;
    left:50%;
    top:50%;

    width:5px;
    height:5px;
    margin:-2px;

    border:
        1px solid
        rgba(255,255,255,.75);

    border-radius:50%;
    pointer-events:none;
}

#hud{
    position:fixed;
    left:18px;
    bottom:18px;

    z-index:40;

    color:white;
    font:12px monospace;

    text-shadow:
        2px 2px 6px #000;
}

#difficultyHud{
    color:#aaa;
    margin-top:5px;
}

#message{
    position:fixed;
    left:50%;
    top:45px;

    transform:translateX(-50%);

    z-index:40;

    color:white;
    font:14px monospace;

    text-shadow:
        2px 2px 8px #000;
}

#rec{
    position:fixed;
    right:18px;
    top:17px;

    z-index:50;

    color:#eee;
    font:13px monospace;

    text-shadow:
        2px 2px 6px #000;
}

#recDot{
    display:inline-block;

    width:9px;
    height:9px;
    margin-right:6px;

    border-radius:50%;
    background:#e00000;

    animation:
        recBlink .9s infinite;
}

@keyframes recBlink{
    0%,45%{opacity:1}
    46%,100%{opacity:.15}
}

#tapeTime{
    position:fixed;
    right:18px;
    top:39px;

    z-index:50;

    color:
        rgba(255,255,255,.75);

    font:11px monospace;

    text-shadow:
        2px 2px 5px #000;
}

#battery{
    position:fixed;
    right:18px;
    bottom:18px;

    z-index:50;

    color:
        rgba(255,255,255,.7);

    font:11px monospace;

    text-shadow:
        2px 2px 5px #000;
}

/* ================= VHS ================= */

#vhs{
    position:fixed;
    inset:0;

    z-index:30;
    pointer-events:none;
    overflow:hidden;
}

.vhsScanlines{
    position:absolute;
    inset:-10%;

    opacity:.22;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.13) 0px,
            rgba(255,255,255,.13) 1px,
            rgba(0,0,0,.15) 2px,
            transparent 4px,
            transparent 6px
        );

    animation:
        scanMove .16s linear infinite;
}

@keyframes scanMove{
    from{transform:translateY(0)}
    to{transform:translateY(6px)}
}

.vhsTracking{
    position:absolute;
    left:-10%;
    width:120%;
    height:11%;

    top:40%;

    opacity:.07;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            rgba(255,255,255,.8) 2px,
            transparent 4px,
            rgba(0,0,0,.8) 7px
        );

    animation:
        trackingMove 5s linear infinite;
}

@keyframes trackingMove{
    0%{top:-15%}
    45%{top:48%}
    48%{top:52%}
    100%{top:115%}
}

.vhsGrain{
    position:absolute;
    inset:-15%;

    opacity:.13;

    background:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.75) 0,
            rgba(255,255,255,.15) 1px,
            transparent 2px,
            transparent 4px
        );

    animation:
        grain .06s steps(3) infinite;
}

@keyframes grain{
    0%{transform:translate(0,0)}
    25%{transform:translate(-4px,2px)}
    50%{transform:translate(3px,-4px)}
    75%{transform:translate(4px,3px)}
    100%{transform:translate(0,0)}
}

.vhsVignette{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 32%,
            rgba(0,0,0,.08) 52%,
            rgba(0,0,0,.35) 78%,
            rgba(0,0,0,.72) 100%
        );
}

.vhsColorBleed{
    position:absolute;
    inset:-3px;

    opacity:.16;

    box-shadow:
        inset 5px 0 rgba(255,0,0,.45),
        inset -5px 0 rgba(0,100,255,.4);
}

.vhsExposure{
    position:absolute;
    inset:0;

    background:
        rgba(130,115,55,.10);

    mix-blend-mode:color;

    animation:
        exposure .7s infinite alternate;
}

@keyframes exposure{
    from{opacity:.55}
    to{opacity:.85}
}

.vhsDamage{
    position:absolute;
    left:0;
    width:100%;
    height:2px;

    background:
        rgba(255,255,255,.5);

    opacity:0;

    animation:
        damage 8s infinite;
}

@keyframes damage{
    0%,72%,100%{
        opacity:0;
        top:0;
    }

    73%{
        opacity:.8;
        top:31%;
    }

    74%{
        opacity:.15;
        top:33%;
    }

    75%{
        opacity:.7;
        top:32%;
    }

    76%{
        opacity:0;
        top:36%;
    }
}

#error{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;

    z-index:500;
    display:none;

    padding:15px;

    background:#450000;
    border:1px solid red;

    color:white;

    font:13px monospace;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

    <img class="menuImage active"
         src="./textures/menu1.jpg"
         onerror="this.style.display='none'">

    <img class="menuImage"
         src="./textures/menu2.jpg"
         onerror="this.style.display='none'">

    <img class="menuImage"
         src="./textures/menu3.jpg"
         onerror="this.style.display='none'">

    <img class="menuImage"
         src="./textures/menu4.jpg"
         onerror="this.style.display='none'">

    <img class="menuImage"
         src="./textures/menu5.jpg"
         onerror="this.style.display='none'">

    <div class="menuDark"></div>
    <div class="menuNoise"></div>
    <div class="menuScanlines"></div>

    <div class="menuContent">

        <h1>THE BACKROOMS</h1>

        <div class="menuSubtitle">
            LEVEL 0 // FOUND FOOTAGE
        </div>

        <div class="menuHint">
            THE BUILDING DOES NOT HAVE A MAP
        </div>

    </div>

    <div class="menuButtons">

        <div class="menuDifficulty">

            <button id="easyBtn">
                EASY
            </button>

            <button id="normalBtn"
                    class="selected">
                NORMAL
            </button>

            <button id="hardBtn">
                HARD
            </button>

            <button id="impossibleBtn">
                NIGHTMARE
            </button>

        </div>

        <button class="menuButton"
                id="startBtn">
            ENTER LEVEL 0
        </button>

    </div>

    <div class="menuLocation">
        CAMERA 01 // TAPE 0007
    </div>

</div>

<!-- ================= PAUSE ================= -->

<div id="pause" class="overlay">

    <h1>PAUSED</h1>

    <button id="resumeBtn">
        RESUME
    </button>

    <button id="restartBtn">
        RESTART
    </button>

    <button id="menuBtn">
        MAIN MENU
    </button>

</div>

<!-- ================= DEATH ================= -->

<div id="death" class="overlay">

    <div class="deathTitle">
        YOU DIED
    </div>

    <div id="deathText"
         class="deathText">
        THE BACKROOMS GOT YOU
    </div>

    <button id="retryBtn">
        RETRY
    </button>

    <button id="deathMenuBtn">
        MAIN MENU
    </button>

</div>

<div id="crosshair"></div>

<div id="hud">
    LEVEL 0

    <div id="difficultyHud">
        NORMAL
    </div>
</div>

<div id="message"></div>

<div id="rec">
    <span id="recDot"></span>
    REC
</div>

<div id="tapeTime">
    00:00:00
</div>

<div id="battery">
    BAT 87%
</div>

<!-- ================= VHS ================= -->

<div id="vhs">

    <div class="vhsScanlines"></div>

    <div class="vhsTracking"></div>

    <div class="vhsGrain"></div>

    <div class="vhsVignette"></div>

    <div class="vhsColorBleed"></div>

    <div class="vhsExposure"></div>

    <div class="vhsDamage"></div>

</div>

<div id="error"></div>

<script src="./three.min.js"></script>

<script>

if(typeof THREE==="undefined"){

    const error=
        document.getElementById("error");

    error.style.display="block";

    error.textContent=
        "ERROR: three.min.js could not be loaded.";

    throw new Error(
        "Three.js missing"
    );
}

/* ================= PATHS ================= */

const BASE=
    new URL(
        "./",
        document.baseURI
    );

const TEXTURES={

    floor:new URL(
        "textures/floor.png",
        BASE
    ).href,

    wall:new URL(
        "textures/wall.png",
        BASE
    ).href,

    ceiling:new URL(
        "textures/ceiling.png",
        BASE
    ).href
};

const ENTITY_URL=
    new URL(
        "entity.png",
        BASE
    ).href;

const AUDIO_URL=
    new URL(
        "entity.mp3",
        BASE
    ).href;

/* ================= SCENE ================= */

const scene=
    new THREE.Scene();

scene.background=
    new THREE.Color(
        0x716b45
    );

scene.fog=
    new THREE.FogExp2(
        0x716b45,
        .010
    );

/* ================= CAMERA ================= */

const camera=
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .025,
        260
    );

/* ================= RENDERER ================= */

const renderer=
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:
            "high-performance"

    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.35
    )
);

if(
    "outputColorSpace"
    in renderer
){

    renderer.outputColorSpace=
        THREE.SRGBColorSpace;
}

if(
    "toneMapping"
    in renderer
){

    renderer.toneMapping=
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure=
        .72;
}

document.body.appendChild(
    renderer.domElement
);

renderer.domElement.style.filter=
    "contrast(1.10) saturate(.72) brightness(.92)";

/* ================= LIGHTING ================= */

scene.add(
    new THREE.AmbientLight(
        0x655f38,
        .27
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xd4c779,
        0x11100b,
        .42
    )
);

/* ================= PLAYER ================= */

const player=
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const EYE_HEIGHT=1.18;
const PLAYER_HEIGHT=1.55;
const PLAYER_RADIUS=.28;

const WALK_SPEED=3.6;
const SPRINT_SPEED=6.1;
const GRAVITY=20;
const JUMP_SPEED=6.2;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=true;

let running=false;
let paused=false;
let dead=false;
let fallingIntoLevel=false;

let fallTimer=0;
const FALL_DURATION=2.25;

let difficulty="normal";

let entity=null;

let worldObjects=[];
let walls=[];
let deathHoles=[];

let exitObject=null;
let exitLight=null;

let exitX=0;
let exitZ=0;

let recordingTime=0;

/* ================= TEXTURES ================= */

const textureLoader=
    new THREE.TextureLoader();

let floorTexture=null;
let wallTexture=null;
let ceilingTexture=null;

function prepareTexture(texture){

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.magFilter=
        THREE.LinearFilter;

    texture.minFilter=
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy=
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            4
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(url){

    return new Promise(
        resolve=>{

            textureLoader.load(

                url,

                texture=>{
                    resolve(
                        prepareTexture(texture)
                    );
                },

                undefined,

                ()=>{
                    resolve(null);
                }

            );

        }
    );
}

async function loadTextures(){

    floorTexture=
        await loadTexture(
            TEXTURES.floor
        );

    wallTexture=
        await loadTexture(
            TEXTURES.wall
        );

    ceilingTexture=
        await loadTexture(
            TEXTURES.ceiling
        );
}

/* ================= MATERIALS ================= */

function makeMaterial(texture){

    return new THREE.MeshStandardMaterial({

        map:texture,

        side:
            THREE.DoubleSide,

        roughness:1,

        metalness:0

    });
}

/* ================= WORLD ================= */

function addObject(object){

    scene.add(object);

    worldObjects.push(object);

    return object;
}

function clearWorld(){

    for(
        const object
        of worldObjects
    ){

        scene.remove(object);

        if(object.geometry)
            object.geometry.dispose();

        if(object.material){

            if(
                Array.isArray(
                    object.material
                )
            ){

                object.material.forEach(
                    material=>
                        material.dispose()
                );

            }else{

                object.material.dispose();

            }
        }
    }

    worldObjects=[];

    walls=[];
    deathHoles=[];

    entity=null;
    exitObject=null;

    if(exitLight){

        scene.remove(
            exitLight
        );

        exitLight=null;
    }
}

/* ================= FLOOR ================= */

function addFloor(){

    let material;

    if(floorTexture){

        const texture=
            floorTexture.clone();

        texture.wrapS=
            THREE.RepeatWrapping;

        texture.wrapT=
            THREE.RepeatWrapping;

        texture.repeat.set(
            70,
            62
        );

        texture.needsUpdate=true;

        material=
            makeMaterial(texture);

    }else{

        material=
            new THREE.MeshStandardMaterial({

                color:0x9c914f,

                roughness:1

            });
    }

    const floor=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            material

        );

    floor.rotation.x=
        -Math.PI/2;

    addObject(floor);
}

/* ================= CEILING ================= */

const CEILING_Y=3.1;

function addCeiling(){

    let material;

    if(ceilingTexture){

        const texture=
            ceilingTexture.clone();

        texture.wrapS=
            THREE.RepeatWrapping;

        texture.wrapT=
            THREE.RepeatWrapping;

        texture.repeat.set(
            70,
            62
        );

        texture.needsUpdate=true;

        material=
            makeMaterial(texture);

    }else{

        material=
            new THREE.MeshStandardMaterial({

                color:0xc9c4ac,

                roughness:1

            });
    }

    const ceiling=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            material

        );

    ceiling.rotation.x=
        Math.PI/2;

    ceiling.position.y=
        CEILING_Y;

    addObject(ceiling);
}

/* ================= WALL TEXTURE ================= */

function wallMaterial(width,height){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({

            color:0xc7b94e,

            roughness:1,

            side:
                THREE.DoubleSide

        });
    }

    const texture=
        wallTexture.clone();

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.ClampToEdgeWrapping;

    const aspect=
        texture.image.width/
        texture.image.height;

    const tileWidth=
        height*aspect;

    texture.repeat.set(
        width/tileWidth,
        1
    );

    texture.needsUpdate=true;

    return makeMaterial(texture);
}

/* ================= WALL ================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
){

    const material=
        wallMaterial(
            width,
            height
        );

    const geometry=
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const wall=
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,
        y,
        z
    );

    addObject(wall);

    walls.push({

        minX:x-width/2,
        maxX:x+width/2,

        minY:y-height/2,
        maxY:y+height/2,

        minZ:z-depth/2,
        maxZ:z+depth/2

    });
}

/* ================= LIGHTS ================= */

function addLight(x,z){

    const fixture=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2,
                .055,
                2
            ),

            new THREE.MeshBasicMaterial({
                color:0xfff1b3
            })

        );

    fixture.position.set(
        x,
        3.025,
        z
    );

    addObject(fixture);

    const light=
        new THREE.PointLight(
            0xffe59a,
            9.2,
            14,
            1.8
        );

    light.position.set(
        x,
        2.85,
        z
    );

    scene.add(light);
}

/* ================= RANDOM MAZE ================= */

const GRID_X=18;
const GRID_Z=16;

const CELL_W=9;
const CELL_D=9;

const MAP_ORIGIN_X=
    -(GRID_X*CELL_W)/2;

const MAP_ORIGIN_Z=
    -(GRID_Z*CELL_D)/2;

function cellCenter(cx,cz){

    return{

        x:
            MAP_ORIGIN_X+
            cx*CELL_W+
            CELL_W/2,

        z:
            MAP_ORIGIN_Z+
            cz*CELL_D+
            CELL_D/2

    };
}

function cellKey(x,z){

    return x+","+z;
}

function generateMaze(){

    const visited=
        new Set();

    const passages=
        new Set();

    function key(x,z){

        return cellKey(
            x,
            z
        );
    }

    function addPassage(
        x1,z1,
        x2,z2
    ){

        passages.add(
            key(x1,z1)+
            "|" +
            key(x2,z2)
        );

        passages.add(
            key(x2,z2)+
            "|" +
            key(x1,z1)
        );
    }

    function visit(x,z){

        visited.add(
            key(x,z)
        );

        const directions=[

            [1,0],
            [-1,0],
            [0,1],
            [0,-1]

        ];

        for(
            let i=directions.length-1;
            i>0;
            i--
        ){

            const j=
                Math.floor(
                    Math.random()*(i+1)
                );

            [
                directions[i],
                directions[j]
            ]=[
                directions[j],
                directions[i]
            ];
        }

        for(
            const [dx,dz]
            of directions
        ){

            const nx=x+dx;
            const nz=z+dz;

            if(
                nx<0 ||
                nz<0 ||
                nx>=GRID_X ||
                nz>=GRID_Z
            )
                continue;

            if(
                visited.has(
                    key(nx,nz)
                )
            )
                continue;

            addPassage(
                x,z,
                nx,nz
            );

            visit(nx,nz);
        }
    }

    visit(
        Math.floor(GRID_X/2),
        Math.floor(GRID_Z/2)
    );

    for(
        let i=0;
        i<35;
        i++
    ){

        const x=
            Math.floor(
                Math.random()*GRID_X
            );

        const z=
            Math.floor(
                Math.random()*GRID_Z
            );

        const horizontal=
            Math.random()<.5;

        const nx=
            x+
            (horizontal?1:0);

        const nz=
            z+
            (horizontal?0:1);

        if(
            nx>=GRID_X ||
            nz>=GRID_Z
        )
            continue;

        addPassage(
            x,z,
            nx,nz
        );
    }

    return passages;
}

function buildRandomMap(){

    const passages=
        generateMaze();

    const H=
        CEILING_Y;

    addWall(
        180,
        H,
        1,
        0,
        H/2,
        -80
    );

    addWall(
        180,
        H,
        1,
        0,
        H/2,
        80
    );

    addWall(
        1,
        H,
        160,
        -90,
        H/2,
        0
    );

    addWall(
        1,
        H,
        160,
        90,
        H/2,
        0
    );

    for(
        let z=0;
        z<GRID_Z;
        z++
    ){

        for(
            let x=0;
            x<GRID_X;
            x++
        ){

            const center=
                cellCenter(x,z);

            if(x<GRID_X-1){

                const passage=
                    passages.has(
                        cellKey(x,z)+
                        "|" +
                        cellKey(x+1,z)
                    );

                if(!passage){

                    addWall(
                        1,
                        H,
                        CELL_D,

                        center.x+
                        CELL_W/2,

                        H/2,

                        center.z
                    );
                }
            }

            if(z<GRID_Z-1){

                const passage=
                    passages.has(
                        cellKey(x,z)+
                        "|" +
                        cellKey(x,z+1)
                    );

                if(!passage){

                    addWall(
                        CELL_W,
                        H,
                        1,

                        center.x,

                        H/2,

                        center.z+
                        CELL_D/2
                    );
                }
            }
        }
    }

    for(
        let i=0;
        i<10;
        i++
    ){

        const vertical=
            Math.random()<.5;

        const x=
            Math.floor(
                Math.random()*

            );

        const z=
            Math.floor(
                Math.random()*
                (GRID_Z-2)
            );

        const c=
            cellCenter(x,z);

        if(vertical){

            addWall(
                .8,

                CELL_D*1.5,

                c.x+

                H/2,

                c.z
            );

        }else{

            addWall(
                CELL_W*1.5,
                H,
                .8,

                c.x,

                H/2,

                c.z+
                CELL_D/4
            );
        }
    }
}

function createHoleGrid(){

    const centerX=
        -63+
        Math.floor(
            Math.random()*5
        )*3;

    const centerZ=
        47+
        Math.floor(
            Math.random()*4
        )*3;

    const rows=6;
    const columns=6;

    const spacing=2.5;
    const holeSize=1.8;

    for(
        let row=0;
        row<rows;
        row++
    ){

        for(
            let col=0;
            col<columns;
            col++
        ){

            const guaranteedSafe=
                row===col ||
                (
                    row===0 &&
                    col===0
                ) ||
                (
                    row===5 &&
                    col===5
                );

            const hole=
                !guaranteedSafe &&
                Math.random()<.72;

            if(!hole)
                continue;

            const x=
                centerX+
                (col-2.5)*spacing;

            const z=
                centerZ+
                (row-2.5)*spacing;

            createDeathHole(
                x,
                z,
                holeSize,
                holeSize
            );
        }
    }

    const size=
        columns*spacing+.8;

    addWall(
        size,
        CEILING_Y,
        .7,

        centerX,
        CEILING_Y/2,

        centerZ-size/2
    );

    addWall(
        size,
        CEILING_Y,
        .7,

        centerX,
        CEILING_Y/2,

        centerZ+size/2
    );

    addWall(
        .7,
        CEILING_Y,
        size,

        centerX-size/2,
        CEILING_Y/2,

        centerZ
    );

    addWall(
        .7,
        CEILING_Y,
        size,

        centerX+size/2,

/* ================= COLLISION ================= */

function playerCollides(x,z){

    const bottom=
        player.position.y;

    const top=
        bottom+
        PLAYER_HEIGHT;

    for(
        const wall
        of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        )
            continue;

        const closestX=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+dz*dz<
            PLAYER_RADIUS*
            PLAYER_RADIUS
        )
            return true;
    }

    return false;
}

function entityHitsWall(x,z){

    for(
        const wall
        of walls
    ){

        const closestX=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+dz*dz<
            .43*.43
        )
            return true;
    }

    return false;
}

/* ================= HOLES ================= */

function insideHole(x,z){

    for(
        const hole
        of deathHoles
    ){

        if(

            x>hole.x-hole.width/2 &&
            x<hole.x+hole.width/2 &&
            z>hole.z-hole.depth/2 &&
            z<hole.z+hole.depth/2

        )
            return true;
    }

    return false;
}

/* ================= LOS ================= */

function blocked(
    x1,z1,
    x2,z2
){

    const dx=x2-x1;
    const dz=z2-z1;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    const steps=
        Math.ceil(
            distance/.35
        );

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        const x=x1+dx*t;
        const z=z1+dz*t;

        if(
            entityHitsWall(
                x,
                z
            )
        )
            return true;
    }

    return false;
}

/* ================= ENTITY AI ================= */

function updateEntity(dt){

    if(
        !entity ||
        dead ||
        paused ||
        fallingIntoLevel
    )
        return;

    const settings=
        DIFFICULTIES[difficulty];

    lastSeenTimer+=dt;

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    const visible=
        distance<
        settings.detection &&
        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );

    let dirX=0;
    let dirZ=0;

    if(visible){

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeenTimer=0;

        dirX=
            dx/
            Math.max(
                distance,
                .001
            );

        dirZ=
            dz/
            Math.max(
                distance,
                .001
            );

    }else if(
        lastSeenTimer<3
    ){

        const lx=
            lastKnown.x-
            entity.position.x;

        const lz=
            lastKnown.y-
            entity.position.z;

        const len=
            Math.hypot(
                lx,
                lz
            );

        if(len>.1){

            dirX=lx/len;
            dirZ=lz/len;

        }

    }else{

        wanderTimer-=dt;

        if(wanderTimer<=0){

            wanderTimer=
                .5+
                Math.random()*1.5;

            wanderAngle=
                Math.random()*
                Math.PI*2;
        }

        dirX=
            Math.cos(wanderAngle);

        dirZ=
            Math.sin(wanderAngle);
    }

    const targetAngle=
        Math.atan2(
            dirZ,
            dirX
        );

    const currentAngle=
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference=
        targetAngle-
        currentAngle;

    while(
        difference>Math.PI
    )
        difference-=Math.PI*2;

    while(
        difference<-Math.PI
    )
        difference+=Math.PI*2;

    const turn=
        3.4*dt;

    difference=
        Math.max(
            -turn,
            Math.min(
                turn,
                difference
            )
        );

    const angle=
        currentAngle+
        difference;

    entityDirection.x=
        Math.cos(angle);

    entityDirection.y=
        Math.sin(angle);

    entityVelocity.x=
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x*
            settings.speed,
            Math.min(1,dt*4)
        );

    entityVelocity.y=
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y*
            settings.speed,
            Math.min(1,dt*4)
        );

    const nx=
        entity.position.x+
        entityVelocity.x*dt;

    const nz=
        entity.position.z+
        entityVelocity.y*dt;

    if(
        !entityHitsWall(
            nx,
            entity.position.z
        )
    ){

        entity.position.x=nx;

    }else{

        entityVelocity.x=0;
        wanderAngle+=Math.PI/2;
    }

    if(
        !entityHitsWall(
            entity.position.x,
            nz
        )
    ){

        entity.position.z=nz;

    }else{

        entityVelocity.y=0;
        wanderAngle+=Math.PI/2;
    }

    entity.rotation.y=
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    if(
        distance<
        (
            difficulty==="impossible"
            ?1.55
            :1.25
        )
    ){

        killPlayer();
    }
}

/* ================= MOUSE ================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !running||
            paused||
            dead||
            fallingIntoLevel
        )
            return;

        if(
            document.pointerLockElement!==
            document.body
        )
            return;

        const sensitivity=.0021;

        yaw-=
            event.movementX*
            sensitivity;

        pitch-=
            event.movementY*
            sensitivity;

        const limit=
            Math.PI/2-.05;

        pitch=
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;
    }
);

/* ================= PLAYER ================= */

function updatePlayer(dt){

    if(fallingIntoLevel){

        updateFall(dt);

        return;
    }

    const direction=
        new THREE.Vector3();

    if(keys.w)
        direction.z-=1;

    if(keys.s)
        direction.z+=1;

    if(keys.a)
        direction.x-=1;

    if(keys.d)
        direction.x+=1;

    if(
        direction.lengthSq()>0
    ){

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(
                0,1,0
            ),
            yaw
        );

        const speed=
            keys.shift
            ? SPRINT_SPEED
            : WALK_SPEED;

        const amount=
            speed*dt;

        const nx=
            player.position.x+
            direction.x*amount;

        if(
            !playerCollides(
                nx,
                player.position.z
            )
        )
            player.position.x=nx;

        const nz=
            player.position.z+
            direction.z*amount;

        if(
            !playerCollides(
                player.position.x,
                nz
            )
        )
            player.position.z=nz;
    }

    if(
        jumpPressed &&
        grounded
    ){

        velocityY=JUMP_SPEED;
        grounded=false;
    }

    jumpPressed=false;

    velocityY-=GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        insideHole(
            player.position.x,
            player.position.z
        )
    ){

        grounded=false;

        if(
            player.position.y<-2.5
        )
            killPlayer();

        return;
    }

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;
    }

    checkExit();
}

/* ================= FALL ================= */

function updateFall(dt){

    fallTimer+=dt;

    const raw=
        Math.min(
            fallTimer/FALL_DURATION,
            1
        );

    const eased=
        raw*raw*
        (3-2*raw);

    player.position.y=
        THREE.MathUtils.lerp(
            18,
            0,
            eased
        );

    const shake=
        Math.sin(
            fallTimer*38
        )*
        .035*
        (1-raw);

    camera.position.x=shake;

    camera.position.y=
        EYE_HEIGHT+shake;

    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                raw*1.3,
                1
            )
        );

    player.rotation.y=
        yaw+
        Math.sin(
            fallTimer*4
        )*
        .035*
        (1-raw);

    if(raw>=1){

        fallingIntoLevel=false;

        player.position.y=0;

        camera.position.x=0;

        camera.position.y=
            EYE_HEIGHT;

        camera.rotation.x=0;

        player.rotation.y=yaw;

        document.body.requestPointerLock();
    }
}

/* ================= CAMERA ================= */

let cameraTime=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;

    cameraTime+=dt;

    const moving=
        keys.w||
        keys.a||
        keys.s||
        keys.d;

    const amount=
        moving
        ? .009
        : .002;

    camera.position.x=
        Math.sin(
            cameraTime*3.4
        )*
        amount;

    camera.position.y=
        EYE_HEIGHT+
        Math.sin(
            cameraTime*4.1
        )*
        amount;

    camera.rotation.z=
        Math.sin(
            cameraTime*.9
        )*
        .003;

    if(
        Math.random()<.003
    ){

        camera.position.x+=
            (Math.random()-.5)*
            .035;

        camera.position.y+=
            (Math.random()-.5)*
            .025;

        camera.rotation.z+=
            (Math.random()-.5)*
            .025;
    }

    renderer.toneMappingExposure=
        .70+
        Math.sin(
            cameraTime*.9
        )*.025+
        Math.sin(
            cameraTime*6.7
        )*.008;
}

/* ================= AUDIO ================= */

function updateAudio(){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){

        entityAudio.volume=0;
        return;
    }

    const distance=
        Math.hypot(
            entity.position.x-
            player.position.x,

            entity.position.z-
            player.position.z
        );

    const maxDistance=
        difficulty==="impossible"
        ?42
        :34;

    if(
        distance>=maxDistance
    ){

        entityAudio.volume=0;
        return;
    }

    let volume=
        1-distance/maxDistance;

    volume=
        Math.pow(
            volume,
            1.6
        )*.9;

    if(
        blocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    )
        volume*=.2;

    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if(
        entityAudio.paused &&
        volume>.01
    ){

        entityAudio
            .play()
            .catch(()=>{});
    }
}

/* ================= TIMER ================= */

function updateTimer(dt){

    if(
        !running||
        paused
    )
        return;

    recordingTime+=dt;

    const total=
        Math.floor(
            recordingTime
        );

    const h=
        Math.floor(
            total/3600
        );

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const f=
        n=>
            String(n)
            .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        `${f(h)}:${f(m)}:${f(s)}`;
}

/* ================= START ================= */

async function startGame(){

    if(
        !floorTexture||
        !wallTexture||
        !ceilingTexture
    )
        await loadTextures();

    clearWorld();

    player.position.set(
        -72,
        18,
        -67
    );

    yaw=0;
    pitch=-.28;

    velocityY=0;
    grounded=false;

    addFloor();
    addCeiling();

    buildRandomMap();

    createHoleGrid();

    createExit();

    for(
        let z=-70;
        z<=70;
        z+=10
    ){

        for(
            let x=-80;
            x<=80;
            x+=11
        ){

            if(
                Math.random()<.13
            )
                continue;

            addLight(
                x,
                z
            );
        }
    }

    await createEntity();

    let attempts=0;

    do{

        entity.position.x=
            -65+
            Math.random()*130;

        entity.position.z=
            -55+
            Math.random()*110;

        attempts++;

    }while(

        Math.hypot(
            entity.position.x-
            player.position.x,

            entity.position.z-
            player.position.z
        )<35 &&
        attempts<100

    );

    running=true;
    paused=false;
    dead=false;

    fallingIntoLevel=true;
    fallTimer=0;

    recordingTime=0;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.querySelector(
        ".deathTitle"
    ).textContent="YOU DIED";

    document.querySelector(
        ".deathTitle"
    ).style.color="#b40000";

    document.getElementById(
        "deathText"
    ).textContent=
        "THE BACKROOMS GOT YOU";

    document.getElementById(
        "retryBtn"
    ).textContent="RETRY";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x=pitch;

    player.rotation.y=yaw;

    document.body.requestPointerLock();
}

/* ================= DEATH ================= */

function killPlayer(){

    if(
        dead||
        !running
    )
        return;

    dead=true;

    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "death"
    ).style.display="flex";
}

/* ================= PAUSE ================= */

function togglePause(){

    if(
        !running||
        dead||
        fallingIntoLevel
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ? "flex"
        : "none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        document.body.requestPointerLock();
    }
}

/* ================= MENU ================= */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";
}

/* ================= DIFFICULTY ================= */

function setDifficulty(value){

    difficulty=value;

    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button=>
                button.classList.remove(
                    "selected"
                )
        );

    document.getElementById(
        value+"Btn"
    ).classList.add(
        "selected"
    );

    document.getElementById(
        "difficultyHud"
    ).textContent=
        DIFFICULTIES[value].name;
}

document.getElementById(
    "easyBtn"
).onclick=
    ()=>setDifficulty("easy");

document.getElementById(
    "normalBtn"
).onclick=
    ()=>setDifficulty("normal");

document.getElementById(
    "hardBtn"
).onclick=
    ()=>setDifficulty("hard");

document.getElementById(
    "impossibleBtn"
).onclick=
    ()=>setDifficulty("impossible");

/* ================= BUTTONS ================= */

document.getElementById(
    "startBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "resumeBtn"
).onclick=
    ()=>togglePause();

document.getElementById(
    "restartBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "menuBtn"
).onclick=
    ()=>returnToMenu();

document.getElementById(
    "retryBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "deathMenuBtn"
).onclick=
    ()=>returnToMenu();

/* ================= POINTER LOCK ================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement!==
            document.body
        ){

            document.body.requestPointerLock();
        }
    }
);

/* ================= MENU CYCLER ================= */

const menuImages=
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex=0;

function cycleMenuImage(){

    if(
        menuImages.length===0
    )
        return;

    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );

    menuIndex=
        (menuIndex+1)%
        menuImages.length;

    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}

/*
    MENU IMAGE CHANGES EVERY 60 SECONDS.
*/

setInterval(
    cycleMenuImage,
    60000
);

/* ================= RESIZE ================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* ================= LOAD ================= */

loadTextures();

/* ================= LOOP ================= */

const clock=
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(dt);
        updateEntity(dt);
        updateAudio();
        updateCamera(dt);
        updateTimer(dt);

    }else{

        updateAudio();

    }

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</html>
