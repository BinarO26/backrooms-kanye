    <script src="./three.min.js"></script>


    <script>

        "use strict";


        /* =====================================================
           THREE.JS CHECK
        ===================================================== */

        if (
            typeof THREE === "undefined"
        ) {

            const error =
                document.getElementById(
                    "error"
                );


            error.style.display =
                "block";


            error.textContent =
                "THREE.JS FAILED TO LOAD.\n\n" +

                "The game expects:\n\n" +

                "./three.min.js\n\n" +

                "to be in the SAME folder as index.html.\n\n" +

                "GitHub Pages is case-sensitive, so make sure the file is named exactly:\n\n" +

                "three.min.js";

            throw new Error(
                "Local Three.js failed to load."
            );
        }


        /* =====================================================
           ERROR HANDLING
        ===================================================== */

        window.addEventListener(
            "error",
            function(event) {

                console.error(
                    event.error ||
                    event.message
                );

            }
        );


        /* =====================================================
           SCENE
        ===================================================== */

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(
                0x16150d
            );


        scene.fog =
            new THREE.FogExp2(
                0x16150d,
                0.012
            );


        /* =====================================================
           CAMERA
        ===================================================== */

        const camera =
            new THREE.PerspectiveCamera(
                78,
                window.innerWidth /
                window.innerHeight,
                0.025,
                500
            );


        camera.rotation.order =
            "YXZ";


        /* =====================================================
           RENDERER
        ===================================================== */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: false,

                powerPreference:
                    "high-performance"
            });


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.5
            )
        );


        renderer.shadowMap.enabled =
            true;


        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;


        if (
            "outputColorSpace"
            in renderer
        ) {

            renderer.outputColorSpace =
                THREE.SRGBColorSpace;
        }


        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;


        renderer.toneMappingExposure =
            0.72;


        document.body.appendChild(
            renderer.domElement
        );


        /* =====================================================
           GLOBAL LIGHTING
        ====================================================== */

        const ambientLight =
            new THREE.AmbientLight(
                0x514d35,
                0.11
            );


        scene.add(
            ambientLight
        );


        const hemisphereLight =
            new THREE.HemisphereLight(
                0xaaa16a,
                0x050504,
                0.12
            );


        scene.add(
            hemisphereLight
        );


        /* =====================================================
           TEXTURE LOADER
        ====================================================== */

        const textureLoader =
            new THREE.TextureLoader();


        let wallTexture = null;

        let floorTexture = null;

        let ceilingTexture = null;


        function configureTexture(
            texture,
            repeatX,
            repeatY
        ) {

            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.repeat.set(
                repeatX,
                repeatY
            );


            texture.magFilter =
                THREE.LinearFilter;


            texture.minFilter =
                THREE.LinearMipmapLinearFilter;


            texture.anisotropy =
                Math.min(
                    renderer.capabilities
                        .getMaxAnisotropy(),
                    8
                );


            texture.needsUpdate =
                true;


            return texture;
        }


        function loadTexture(
            path
        ) {

            return new Promise(
                function(resolve) {

                    textureLoader.load(

                        path,

                        function(texture) {

                            console.log(
                                "TEXTURE LOADED:",
                                path
                            );


                            resolve(
                                texture
                            );
                        },

                        undefined,

                        function(error) {

                            console.error(
                                "TEXTURE FAILED:",
                                path,
                                error
                            );


                            resolve(null);
                        }
                    );

                }
            );
        }


        async function loadTextures() {

            wallTexture =
                await loadTexture(
                    "./textures/wall.png"
                );


            floorTexture =
                await loadTexture(
                    "./textures/floor.png"
                );


            ceilingTexture =
                await loadTexture(
                    "./textures/ceiling.png"
                );


            if (wallTexture) {

                configureTexture(
                    wallTexture,
                    1,
                    1
                );
            }


            if (floorTexture) {

                configureTexture(
                    floorTexture,
                    1,
                    1
                );
            }


            if (ceilingTexture) {

                configureTexture(
                    ceilingTexture,
                    1,
                    1
                );
            }


            const missing = [];


            if (!wallTexture) {

                missing.push(
                    "./textures/wall.png"
                );
            }


            if (!floorTexture) {

                missing.push(
                    "./textures/floor.png"
                );
            }


            if (!ceilingTexture) {

                missing.push(
                    "./textures/ceiling.png"
                );
            }


            if (missing.length > 0) {

                const error =
                    document.getElementById(
                        "error"
                    );


                error.style.display =
                    "block";


                error.textContent =
                    "TEXTURE FILE ERROR\n\n" +

                    "These files could not be loaded:\n\n" +

                    missing.join("\n") +

                    "\n\n" +

                    "Expected structure:\n\n" +

                    "index.html\n" +

                    "three.min.js\n" +

                    "entity.png\n" +

                    "entity.mp3\n" +

                    "textures/\n" +

                    "    wall.png\n" +

                    "    floor.png\n" +

                    "    ceiling.png\n" +

                    "    menu.jpg\n" +

                    "    menu2.jpg\n" +

                    "    menu3.jpg\n" +

                    "    menu4.jpg\n" +

                    "    menu5.jpg";
            }
        }


        /* =====================================================
           WORLD ARRAYS
        ====================================================== */

        let worldObjects = [];

        let wallColliders = [];

        let deathHoles = [];

        let fluorescentLights = [];


        function addWorldObject(
            object
        ) {

            scene.add(
                object
            );


            worldObjects.push(
                object
            );


            return object;
        }


        function disposeMaterial(
            material
        ) {

            if (!material) {

                return;
            }


            if (
                Array.isArray(material)
            ) {

                material.forEach(
                    disposeMaterial
                );

                return;
            }


            if (material.map) {

                material.map.dispose();
            }


            material.dispose();
        }


        function clearWorld() {

            for (
                const object
                of worldObjects
            ) {

                scene.remove(
                    object
                );


                object.traverse(
                    function(child) {

                        if (
                            child.geometry
                        ) {

                            child.geometry.dispose();
                        }


                        if (
                            child.material
                        ) {

                            disposeMaterial(
                                child.material
                            );
                        }

                    }
                );
            }


            worldObjects = [];

            wallColliders = [];

            deathHoles = [];

            fluorescentLights = [];


            if (exitLight) {

                scene.remove(
                    exitLight
                );

                exitLight = null;
            }


            exitObject = null;

            entity = null;
        }


        /* =====================================================
           MATERIALS
        ====================================================== */

        function createWallMaterial(
            width,
            height
        ) {

            if (!wallTexture) {

                return new THREE.MeshStandardMaterial({

                    color:
                        0xb5aa5c,

                    roughness:
                        0.88,

                    metalness:
                        0.0,

                    side:
                        THREE.DoubleSide
                });
            }


            const texture =
                wallTexture.clone();


            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.ClampToEdgeWrapping;


            const imageWidth =
                texture.image &&
                texture.image.width
                    ? texture.image.width
                    : 1;


            const imageHeight =
                texture.image &&
                texture.image.height
                    ? texture.image.height
                    : 1;


            const aspect =
                imageWidth /
                imageHeight;


            const naturalWidth =
                height *
                aspect;


            texture.repeat.set(

                Math.max(
                    width /
                    naturalWidth,
                    0.001
                ),

                1
            );


            texture.needsUpdate =
                true;


            /*
                IMPORTANT:

                Walls use MeshStandardMaterial.

                This means the texture is REALISTICALLY
                affected by the fluorescent lights.

                The entity is the only PNG that remains
                completely unshaded.
            */

            return new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    0.92,

                metalness:
                    0.0,

                side:
                    THREE.DoubleSide
            });
        }


        function createFloorMaterial() {

            if (!floorTexture) {

                return new THREE.MeshStandardMaterial({

                    color:
                        0x8d8140,

                    roughness:
                        0.95,

                    metalness:
                        0
                });
            }


            const texture =
                floorTexture.clone();


            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.repeat.set(
                70,
                70
            );


            texture.needsUpdate =
                true;


            return new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    0.96,

                metalness:
                    0
            });
        }


        function createCeilingMaterial() {

            if (!ceilingTexture) {

                return new THREE.MeshStandardMaterial({

                    color:
                        0x777046,

                    roughness:
                        0.92,

                    metalness:
                        0,

                    side:
                        THREE.DoubleSide
                });
            }


            const texture =
                ceilingTexture.clone();


            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.repeat.set(
                90,
                90
            );


            texture.needsUpdate =
                true;


            return new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    0.92,

                metalness:
                    0,

                side:
                    THREE.DoubleSide
            });

        function createHoleRoom() {

        function updateLights(
            dt
        ) {

            for (
                const item
                of fluorescentLights
            ) {

                if (
                    !item.flicker
                ) {

                    continue;
                }


                item.timer -=
                    dt;


                if (
                    item.timer <= 0
                ) {

                    item.timer =
                        0.04 +
                        Math.random() *
                        0.70;


                    const roll =
                        Math.random();


                    if (
                        roll < 0.18
                    ) {

                        /*
                            Briefly almost dark,
                            but NEVER hide fixture.
                        */

                        item.light.intensity =
                            item.base *
                            0.05;


                        item.fixture.material
                            .emissiveIntensity =
                            0.25;

                    } else {

                        item.light.intensity =
                            item.base *
                            (
                                0.70 +
                                Math.random() *
                                0.35
                            );


                        item.fixture.material
                            .emissiveIntensity =
                            1.5 +
                            Math.random() *
                            0.8;
                    }
                }
            }
        }


        /* =====================================================
           COLLISION
        ====================================================== */

        function collides(
            x,
            z
        ) {

            const bottom =
                player.position.y;


            const top =
                bottom +
                PLAYER_HEIGHT;


            for (
                const wall
                of wallColliders
            ) {

                if (
                    top <= wall.minY ||
                    bottom >= wall.maxY
                ) {

                    continue;
                }


                const closestX =
                    Math.max(
                        wall.minX,
                        Math.min(
                            x,
                            wall.maxX
                        )
                    );


                const closestZ =
                    Math.max(
                        wall.minZ,
                        Math.min(
                            z,
                            wall.maxZ
                        )
                    );


                const dx =
                    x -
                    closestX;


                const dz =
                    z -
                    closestZ;


                if (
                    dx * dx +
                    dz * dz <
                    PLAYER_RADIUS *
                    PLAYER_RADIUS
                ) {

                    return true;
                }
            }


            return false;
        }


        function entityHitsWall(
            x,
            z
        ) {

            for (
                const wall
                of wallColliders
            ) {

                const closestX =
                    Math.max(
                        wall.minX,
                        Math.min(
                            x,
                            wall.maxX
                        )
                    );


                const closestZ =
                    Math.max(
                        wall.minZ,
                        Math.min(
                            z,
                            wall.maxZ
                        )
                    );


                const dx =
                    x -
                    closestX;


                const dz =
                    z -
                    closestZ;


                if (
                    dx * dx +
                    dz * dz <
                    0.43 *
                    0.43
                ) {

                    return true;
                }
            }


            return false;
        }


        function blocked(
            x1,
            z1,
            x2,
            z2
        ) {

            const dx =
                x2 -
                x1;


            const dz =
                z2 -
                z1;


            const distance =
                Math.hypot(
                    dx,
                    dz
                );


            const steps =
                Math.max(
                    1,
                    Math.ceil(
                        distance /
                        0.35
                    )
                );


            for (
                let i = 1;
                i < steps;
                i++
            ) {

                const t =
                    i /
                    steps;


                if (
                    entityHitsWall(

                        x1 +
                        dx * t,

                        z1 +
                        dz * t
                    )
                ) {

                    return true;
                }
            }


            return false;
        }


        /* =====================================================
           HOLES
        ====================================================== */

        function playerInHole() {

            for (
                const hole
                of deathHoles
            ) {

                const dx =
                    player.position.x -
                    hole.x;


                const dz =
                    player.position.z -
                    hole.z;


                if (
                    dx * dx +
                    dz * dz <
                    hole.radius *
                    hole.radius
                ) {

                    return true;
                }
            }


            return false;
        }

                speed:
                    6.5,

                detection:
                    38
            },


            nightmare: {

                speed:
                    8.0,

                detection:
                    52
            }
        };


        let entity =
            null;


        let entityDirection =
            new THREE.Vector2(
                1,
                0
            );


        let entityVelocity =
            new THREE.Vector2(
                0,
                0
            );


        let lastKnown =
            new THREE.Vector2();


        let lastSeen =
            99;


        let wanderTimer =
            0;


        let wanderAngle =
            0;


        function createEntity() {

            return new Promise(
                function(resolve) {

                    textureLoader.load(

                        "./entity.png",

                        function(texture) {

                            /*
                                ENTITY IS THE ONLY
                                UNSHADED PNG.

                                MeshBasicMaterial means
                                lights do NOT alter it.
                            */

                            texture.colorSpace =
                                THREE.SRGBColorSpace;


                            texture.magFilter =
                                THREE.LinearFilter;


                            texture.minFilter =
                                THREE.LinearMipmapLinearFilter;


                            const aspect =
                                (
                                    texture.image.width ||
                                    1
                                ) /
                                (
                                    texture.image.height ||
                                    1
                                );


                            const height =
                                1.55;


                            const width =
                                height *
                                aspect;


                            const material =
                                new THREE.MeshBasicMaterial({

                                    map:
                                        texture,

                                    transparent:
                                        true,

                                    alphaTest:
                                        0.01,

                                    side:
                                        THREE.DoubleSide,

                                    fog:
                                        false,

                                    color:
                                        0xffffff
                                });


                            entity =
                                new THREE.Mesh(

                                    new THREE.PlaneGeometry(
                                        width,
                                        height
                                    ),

                                    material
                                );


                            entity.position.set(
                                55,
                                0.775,
                                -48
                            );


                            addWorldObject(
                                entity
                            );


                            resolve();
                        },

                        undefined,

                        function(error) {

                            console.warn(
                                "entity.png failed:",
                                error
                            );


                            entity =
                                new THREE.Mesh(

                                    new THREE.PlaneGeometry(
                                        1,
                                        1.55
                                    ),

                                    new THREE.MeshBasicMaterial({

                                        color:
                                            0x010101,

                                        transparent:
                                            true,

                                        opacity:
                                            0.96
                                    })
                                );


                            entity.position.set(
                                55,
                                0.775,
                                -48
                            );


                            addWorldObject(
                                entity
                            );


                            resolve();
                        }
                    );
                }
            );
        }


        /* =====================================================
           ENTITY AI
        ====================================================== */

        function updateEntity(
            dt
        ) {

            if (
                !entity ||
                !running ||
                paused ||
                dead ||
                fallingIntoLevel
            ) {

                return;
            }


            const settings =
                SETTINGS[
                    difficulty
                ];


            const dx =
                player.position.x -
                entity.position.x;


            const dz =
                player.position.z -
                entity.position.z;


            const distance =
                Math.hypot(
                    dx,
                    dz
                );


            lastSeen +=
                dt;


            const visible =
                distance <
                settings.detection &&
                !blocked(

                    entity.position.x,
                    entity.position.z,

                    player.position.x,
                    player.position.z
                );


            let targetX = 0;

            let targetZ = 0;


            if (visible) {

                lastKnown.set(

                    player.position.x,
                    player.position.z
                );


                lastSeen =
                    0;


                targetX =
                    dx /
                    Math.max(
                        distance,
                        0.001
                    );


                targetZ =
                    dz /
                    Math.max(
                        distance,
                        0.001
                    );

            } else if (
                lastSeen < 3.2
            ) {

                const lx =
                    lastKnown.x -
                    entity.position.x;


                const lz =
                    lastKnown.y -
                    entity.position.z;


                const len =
                    Math.hypot(
                        lx,
                        lz
                    );


                if (
                    len > 0.1
                ) {

                    targetX =
                        lx /
                        len;


                    targetZ =
                        lz /
                        len;
                }

            } else {

                wanderTimer -=
                    dt;


                if (
                    wanderTimer <= 0
                ) {

                    wanderTimer =
                        0.5 +
                        Math.random() *
                        1.8;


                    wanderAngle =
                        Math.random() *
                        Math.PI *
                        2;
                }


                targetX =
                    Math.cos(
                        wanderAngle
                    );


                targetZ =
                    Math.sin(
                        wanderAngle
                    );
            }


            const targetAngle =
                Math.atan2(
                    targetZ,
                    targetX
                );


            const currentAngle =
                Math.atan2(
                    entityDirection.y,
                    entityDirection.x
                );


            let difference =
                targetAngle -
                currentAngle;


            while (
                difference >
                Math.PI
            ) {

                difference -=
                    Math.PI * 2;
            }


            while (
                difference <
                -Math.PI
            ) {

                difference +=
                    Math.PI * 2;
            }


            difference =
                Math.max(

                    -3.4 * dt,

                    Math.min(
                        3.4 * dt,
                        difference
                    )
                );


            const angle =
                currentAngle +
                difference;


            entityDirection.x =
                Math.cos(
                    angle
                );


            entityDirection.y =
                Math.sin(
                    angle
                );


            entityVelocity.x =
                THREE.MathUtils.lerp(

                    entityVelocity.x,

                    entityDirection.x *
                    settings.speed,

                    Math.min(
                        1,
                        dt * 4
                    )
                );


            entityVelocity.y =
                THREE.MathUtils.lerp(

                    entityVelocity.y,

                    entityDirection.y *
                    settings.speed,

                    Math.min(
                        1,
                        dt * 4
                    )
                );


            const moveX =
                entityVelocity.x *
                dt;


            const moveZ =
                entityVelocity.y *
                dt;


            const nextX =
                entity.position.x +
                moveX;


            const nextZ =
                entity.position.z +
                moveZ;


            if (
                !entityHitsWall(
                    nextX,
                    entity.position.z
                )
            ) {

                entity.position.x =
                    nextX;

            } else {

                entityVelocity.x =
                    0;


                /*
                    Juke around the wall.
                */

                wanderAngle +=
                    Math.PI / 2;


                entityDirection.set(

                    Math.cos(
                        wanderAngle
                    ),

                    Math.sin(
                        wanderAngle
                    )
                );
            }


            if (
                !entityHitsWall(
                    entity.position.x,
                    nextZ
                )
            ) {

                entity.position.z =
                    nextZ;

            } else {

                entityVelocity.y =
                    0;


                wanderAngle +=
                    Math.PI / 2;


                entityDirection.set(

                    Math.cos(
                        wanderAngle
                    ),

                    Math.sin(
                        wanderAngle
                    )
                );
            }


            /*
                Entity billboard.

                It always faces the player.
            */

            entity.rotation.y =
                Math.atan2(

                    player.position.x -
                    entity.position.x,

                    player.position.z -
                    entity.position.z
                );


            const killDistance =
                difficulty ===
                "nightmare"

                    ? 1.55

                    : 1.25;


            if (
                distance <
                killDistance
            ) {

                killPlayer();
            }
        }


        /* =====================================================
           ENTITY AUDIO
        ====================================================== */

        function updateEntityAudio() {

            if (
                !entity ||
                !running ||
                paused ||
                dead ||
                fallingIntoLevel
            ) {

                entityAudio.volume =
                    0;

                return;
            }


            const distance =
                Math.hypot(

                    entity.position.x -
                    player.position.x,

                    entity.position.z -
                    player.position.z
                );


            const maxDistance =
                34;


            if (
                distance >=
                maxDistance
            ) {

                entityAudio.volume =
                    0;

                return;
            }


            let volume =
                Math.pow(

                    1 -
                    distance /
                    maxDistance,

                    1.6

                ) * 0.9;


            if (
                blocked(

                    player.position.x,
                    player.position.z,

                    entity.position.x,
                    entity.position.z
                )
            ) {

                volume *=
                    0.20;
            }


            entityAudio.volume =
                THREE.MathUtils.clamp(
                    volume,
                    0,
                    0.9
                );


            if (
                entityAudio.paused &&
                volume > 0.01
            ) {

                entityAudio
                    .play()
                    .catch(
                        function() {}
                    );
            }
        }


        /* =====================================================
           INPUT
        ====================================================== */

        const keys = {

            w: false,

            a: false,

            s: false,

                ) {

                }


                if (

                ) {

                    keys.d =

                }


                if (
                    event.code ===
                    "ShiftLeft" ||
                    event.code ===
                    "ShiftRight"
                ) {

                    keys.shift =
                        true;
                }


                if (
                    event.code ===
                    "Space" &&
                    !event.repeat
                ) {

                    jumpPressed =
                        true;
                }


                if (

        );


        window.addEventListener(
            "keyup",
            function(event) {

                if (
                    event.code ===
                    "KeyW"
                ) {

                    keys.w =

                }


                if (
                    event.code ===
                    "KeyA"
                ) {

                    keys.a =
                        false;
                }


                if (
                    event.code ===
                    "KeyS"
                ) {

                    keys.s =
                        false;
                }


                if (
                    event.code ===
                    "KeyD"
                ) {

                    keys.d =
                        false;
                }


                if (
                    event.code ===
                    "ShiftLeft" ||
                    event.code ===
                    "ShiftRight"
                ) {

                    keys.shift =
                        false;
                }
            }
        );


        /* =====================================================
           MOUSE LOOK
        ====================================================== */

        document.addEventListener(
            "mousemove",
            function(event) {

                if (
                    !running ||
                    paused ||
                    dead ||
                    fallingIntoLevel
                ) {

                    return;
                }


                if (
                    document.pointerLockElement !==
                    document.body
                ) {

                    return;
                }


                yaw -=
                    event.movementX *
                    0.0022;


                pitch -=
                    event.movementY *
                    0.0018;


                pitch =
                    Math.max(

                        -1.45,

                        Math.min(
                            1.45,
                            pitch
                        )
                    );


                player.rotation.y =
                    yaw;


                camera.rotation.x =
                    pitch;
            }
        );


        /* =====================================================
           PLAYER
        ====================================================== */

        function updatePlayer(
            dt
        ) {

            if (
                fallingIntoLevel
            ) {

                updateFall(
                    dt
                );

                return;
            }


            let forward =
                0;


            let side =
                0;


            /*
                W FORWARD
                S BACKWARD
            */

            if (
                keys.w
            ) {

                forward +=
                    1;
            }


            if (
                keys.s
            ) {

                forward -=
                    1;
            }


            if (
                keys.d
            ) {

                side +=
                    1;
            }


            if (
                keys.a
            ) {

                side -=
                    1;
            }


            const length =
                Math.hypot(
                    forward,
                    side
                );


            if (
                length > 0
            ) {

                forward /=
                    length;


                side /=
                    length;
            }


            let speed =
                keys.shift
                    ? 5.9
                    : 3.5;


            if (
                difficulty ===
                "easy"
            ) {

                speed =
                    keys.shift
                        ? 6.1
                        : 3.8;
            }


            if (
                difficulty ===
                "hard"
            ) {

                speed =
                    keys.shift
                        ? 6.3
                        : 3.4;
            }


            if (
                difficulty ===
                "nightmare"
            ) {

                speed =
                    keys.shift
                        ? 6.5
                        : 3.25;
            }


            const sin =
                Math.sin(
                    yaw
                );


            const cos =
                Math.cos(
                    yaw
                );


            const dx =
                (
                    side * cos +
                    forward * sin
                ) *
                speed *
                dt;


            const dz =
                (
                    side * sin -
                    forward * cos
                ) *
                speed *
                dt;


            /*
                The formulas above are deliberately
                arranged so W moves toward the direction
                the camera is facing.
            */


            const nextX =
                player.position.x +
                dx;


            const nextZ =
                player.position.z +
                dz;


            if (
                !collides(
                    nextX,
                    player.position.z
                )
            ) {

                player.position.x =
                    nextX;
            }


            if (
                !collides(
                    player.position.x,
                    nextZ
                )
            ) {

                player.position.z =
                    nextZ;
            }


            if (
                jumpPressed &&
                grounded
            ) {

                velocityY =
                    6.2;


                grounded =
                    false;
            }


            jumpPressed =
                false;


            velocityY -=
                20 *
                dt;


            player.position.y +=
                velocityY *
                dt;


            if (
                player.position.y <=
                0
            ) {

                player.position.y =
                    0;


                velocityY =
                    0;


                grounded =
                    true;
            }


            if (
                playerInHole()
            ) {

                killPlayer(
                    "YOU FELL INTO THE FLOOR."
                );

                return;
            }


            checkExit();
        }


        /* =====================================================
           FALLING INTRO
        ====================================================== */

        function updateFall(
            dt
        ) {

            fallTimer +=
                dt;


            const progress =
                Math.min(

                    fallTimer /
                    FALL_DURATION,

                    1
                );


            const eased =
                1 -
                Math.pow(
                    1 - progress,
                    3
                );


            player.position.y =
                17 -
                17 *
                eased;


            camera.position.y =
                EYE_HEIGHT;


            camera.rotation.x =
                THREE.MathUtils.lerp(

                    -0.32,

                    0,

                    Math.min(
                        progress * 1.3,
                        1
                    )
                );


            camera.rotation.z =
                Math.sin(

                    progress *
                    Math.PI *
                    9

                ) * 0.025;


            if (
                progress >= 1
            ) {

                fallingIntoLevel =
                    false;


                player.position.y =
                    0;


                camera.position.x =
                    0;


                camera.position.y =
                    EYE_HEIGHT;


                camera.position.z =
                    0;


                camera.rotation.x =
                    0;


                camera.rotation.z =
                    0;


                requestPointerLock();
            }
        }


        /* =====================================================
           CAMERA MOVEMENT / HORROR EFFECTS
        ====================================================== */

        let cameraTime =
            0;


        function updateCamera(
            dt
        ) {

            if (
                fallingIntoLevel
            ) {

                return;
            }


            cameraTime +=
                dt;


            const moving =
                keys.w ||
                keys.a ||
                keys.s ||
                keys.d;


            const amount =
                moving
                    ? 0.010
                    : 0.003;


            camera.position.x =
                Math.sin(
                    cameraTime * 3.4
                ) *
                amount;


            camera.position.y =
                EYE_HEIGHT +

                Math.sin(
                    cameraTime * 4.1
                ) *
                amount;


            camera.position.z =
                Math.cos(
                    cameraTime * 3.1
                ) *
                amount *
                0.55;


            camera.rotation.z =
                Math.sin(
                    cameraTime * 0.9
                ) *
                0.004;


            /*
                Occasional analog-camera shake.
            */

            if (
                Math.random() <
                0.004
            ) {

                camera.position.x +=

                    (
                        Math.random() -
                        0.5
                    ) *
                    0.045;


                camera.position.y +=

                    (
                        Math.random() -
                        0.5
                    ) *
                    0.035;


                camera.rotation.z +=

                    (
                        Math.random() -
                        0.5
                    ) *
                    0.030;
            }
        }


        /* =====================================================
           EXIT
        ====================================================== */

        function checkExit() {

            if (
                !exitObject ||
                dead
            ) {

                return;
            }


            const distance =
                Math.hypot(

                    player.position.x -
                    exitX,

                    player.position.z -
                    exitZ
                );


            if (
                distance <
                1.8
            ) {

                winGame();
            }
        }

        /* =====================================================
           PAUSE
        ====================================================== */

        function togglePause() {

            if (
                !running ||
                dead ||
                fallingIntoLevel
            ) {

                return;
            }


            paused =
                !paused;


            document.getElementById(
                "pause"
            ).style.display =

            if (

                if (

                    document.exitPointerLock();

            } else {

                requestPointerLock();
            }

                    .requestPointerLock()
                    .catch(
                        function() {}
                    );

            };


        document.getElementById(
            "resumeBtn"
        ).onclick =
            function() {

                togglePause();
            };


        document.getElementById(
            "restartBtn"
        ).onclick =
            function() {

                startGame();
            };


        document.getElementById(
            "menuBtn"
        ).onclick =
            function() {

                returnToMenu();
            };


        document.getElementById(
            "retryBtn"
        ).onclick =
            function() {

                startGame();
            };


        document.getElementById(
            "deathMenuBtn"
        ).onclick =
            function() {

                returnToMenu();
            };


        /* =====================================================
           POINTER LOCK
        ====================================================== */

        document.addEventListener(
            "click",
            function() {

                if (

                    running &&

                    !paused &&

                    !dead &&

                    !fallingIntoLevel &&

                    document.pointerLockElement !==
                    document.body

                ) {

                    requestPointerLock();
                }
            }
        );


        /* =====================================================
           MENU IMAGE ROTATION
        ====================================================== */

        const menuImages =
            Array.from(
                document.querySelectorAll(
                    ".menuImage"
                )
            );


        let menuIndex =
            0;


        function cycleMenuImage() {

            if (
                menuImages.length ===
                0
            ) {

                return;
            }


            menuImages[
                menuIndex
            ].classList.remove(
                "active"
            );


            menuIndex =
                (
                    menuIndex +
                    1
                ) %
                menuImages.length;


            menuImages[
                menuIndex
            ].classList.add(
                "active"
            );
        }


        setInterval(
            cycleMenuImage,
            60000
        );


        /* =====================================================
           RESIZE
        ====================================================== */

        window.addEventListener(
            "resize",
            function() {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight
                );


                renderer.setPixelRatio(

                    Math.min(

                        window.devicePixelRatio ||
                        1,

                        1.5
                    )
                );
            }
        );


        /* =====================================================
           TIMER
        ====================================================== */

        const clock =
            new THREE.Clock();


        let recordingTime =
            0;


        function updateTimer(
            dt
        ) {

            if (
                !running ||
                paused
            ) {

                return;
            }


            recordingTime +=
                dt;


            const total =
                Math.floor(
                    recordingTime
                );


            const hours =
                Math.floor(
                    total / 3600
                );


            const minutes =
                Math.floor(
                    (
                        total %
                        3600
                    ) / 60
                );


            const seconds =
                total %
                60;


            function format(
                number
            ) {

                return String(
                    number
                ).padStart(
                    2,
                    "0"
                );
            }


            document.getElementById(
                "tapeTime"
            ).textContent =

                format(hours) +
                ":" +
                format(minutes) +
                ":" +
                format(seconds);
        }


        /* =====================================================
           GAME LOOP
        ====================================================== */

        function animate() {

            requestAnimationFrame(
                animate
            );


            const dt =
                Math.min(

                    clock.getDelta(),

                    0.05
                );


            if (
                running &&
                !paused &&
                !dead
            ) {

                updatePlayer(
                    dt
                );


                updateEntity(
                    dt
                );


                updateLights(
                    dt
                );


                updateCamera(
                    dt
                );


                updateEntityAudio();


                updateMessage(
                    dt
                );


                updateTimer(
                    dt
                );

            } else {

                updateEntityAudio();
            }


            renderer.render(
                scene,
                camera
            );
        }


        /* =====================================================
           INITIALIZATION
        ====================================================== */

        loadTextures();

        animate();

    </script>

</body>

</html>
