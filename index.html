html,

========================================================= */

.menuImage.active {

}

.menuDark {

.menuNoise {

/* =========================================================
   SECURITY CAMERA EFFECTS
========================================================= */

.camScanlines,
.camTracking,
.camGrain,
.camVignette,
.camBleed,
.camFlicker {

    position: absolute;

    inset: 0;

    pointer-events: none;
}

.camScanlines {

    opacity: .13;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 2px,
            rgba(255,255,255,.055) 3px,
            rgba(0,0,0,.10) 4px
        );
}

.camTracking {

    opacity: .09;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 12px,
            rgba(255,255,255,.15) 13px,
            transparent 15px
        );

    animation:
        trackingMove
        7s
        linear
        infinite;
}

@keyframes trackingMove {

    0% {
        transform:
            translateY(-20%);
    }

    50% {
        transform:
            translateY(20%);
    }

    100% {
        transform:
            translateY(-20%);
    }
}

.camGrain {

    opacity: .055;

    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.9) 0,
            rgba(255,255,255,.9) 1px,
            transparent 1px,
            transparent 4px
        );

    background-size: 5px 5px;

    animation:
        grainMove
        .18s
        steps(2)
        infinite;
}

@keyframes grainMove {

    0% {
        transform:
            translate(0,0);
    }

    25% {
        transform:
            translate(2px,-1px);
    }

    50% {
        transform:
            translate(-1px,2px);
    }

    75% {
        transform:
            translate(1px,1px);
    }

    100% {
        transform:
            translate(0,0);
    }
}

.camVignette {

    background:
        radial-gradient(
            ellipse at center,

            rgba(0,0,0,.22) 55%,

}

.camBleed {

        linear-gradient(

.camFlicker {

        rgba(255,255,255,.08);

}

@keyframes cameraFlicker {

    }

    96.5% {

    }

    97% {

}

<!-- =========================================================
     LOCAL THREE.JS
     
     IMPORTANT:
     three.min.js MUST be beside index.html.
     
     NO CDN IS USED.
========================================================= -->

<script src="./three.min.js"></script>

<script>

"use strict";

/* =========================================================
   THREE.JS CHECK
========================================================= */

if (
    typeof THREE === "undefined"
) {

    const error =
        document.getElementById(
            "error"
        );

    error.style.display =
        "block";

    error.textContent =
        "THREE.JS FAILED TO LOAD.\n\n" +

        "The game expects:\n\n" +

        "index.html\n" +
        "three.min.js\n\n" +

        "to be in the SAME folder.\n\n" +

        "Do not use a CDN.\n" +

        "Make sure GitHub Pages is serving both files.";

    throw new Error(
        "Local three.min.js failed to load."
    );
}

/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x050504
    );

scene.fog =
    new THREE.FogExp2(
        0x090805,
        0.017
    );

/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        76,
        window.innerWidth /
        window.innerHeight,
        0.03,
        350
    );

camera.rotation.order =
    "YXZ";

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        powerPreference:
            "high-performance",

        logarithmicDepthBuffer:
            false
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    0.72;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   TEXTURE LOADER
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

textureLoader.setCrossOrigin(
    "anonymous"
);

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;

/* =========================================================
   TEXTURE LOADING
========================================================= */

function prepareTexture(
    texture
) {

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer
                .capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate =
        true;

    return texture;
}

function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            texture
                        )
                    );
                },

                undefined,

                error => {

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    resolve(null);
                }
            );
        }
    );
}

async function loadAllTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing = [];

    if (!wallTexture) {

        missing.push(
            "wall.png"
        );
    }

    if (!floorTexture) {

        missing.push(
            "floor.png"
        );
    }

    if (!ceilingTexture) {

        missing.push(
            "ceiling.png"
        );
    }

    if (missing.length) {

        const error =
            document.getElementById(
                "error"
            );

        error.style.display =
            "block";

        error.textContent =
            "SOME ENVIRONMENT TEXTURES FAILED TO LOAD.\n\n" +

            missing.join("\n") +

            "\n\n" +

            "The game will continue using fallback materials.\n\n" +

            "Expected structure:\n\n" +

            "index.html\n" +
            "three.min.js\n" +
            "textures/\n" +
            "    wall.png\n" +
            "    floor.png\n" +
            "    ceiling.png";
    }
}

/* =========================================================
   WORLD STORAGE
========================================================= */

const worldObjects = [];

const wallColliders = [];

const lights = [];

const deathHoles = [];

function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}

function disposeMaterial(
    material
) {

    if (!material) {
        return;
    }

    if (
        Array.isArray(material)
    ) {

        material.forEach(
            disposeMaterial
        );

        return;
    }

    if (
        material.map
    ) {

        material.map.dispose();
    }

    material.dispose();
}

function clearWorld() {

    while (
        worldObjects.length
    ) {

        const object =
            worldObjects.pop();

        scene.remove(
            object
        );

        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();
                }

                if (
                    child.material
                ) {

                    disposeMaterial(
                        child.material
                    );
                }
            }
        );
    }

    wallColliders.length =
        0;

    deathHoles.length =
        0;

    for (
        const item
        of lights
    ) {

        scene.remove(
            item.light
        );
    }

    lights.length =
        0;

    if (exitLight) {

        scene.remove(
            exitLight
        );

        exitLight =
            null;
    }

    exitObject =
        null;

    entity =
        null;
}

/* =========================================================
   MATERIAL HELPERS
========================================================= */

function createWallMaterial(
    width,
    height
) {

    if (
        wallTexture
    ) {

        const texture =
            wallTexture.clone();

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        texture.repeat.set(

            Math.max(
                width / 3.5,
                1
            ),

            Math.max(
                height / 3.1,
                1
            )
        );

        texture.needsUpdate =
            true;

        return new THREE.MeshStandardMaterial({

            map:
                texture,

            roughness:
                0.92,

            metalness:
                0.0,

            side:
                THREE.FrontSide
        });
    }

    return new THREE.MeshStandardMaterial({

        color:
            0x81763d,

        roughness:
            1.0,

        metalness:
            0
    });
}

function createFloorMaterial() {

    if (
        floorTexture
    ) {

        const texture =
            floorTexture.clone();

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        texture.repeat.set(
            110,
            110
        );

        texture.needsUpdate =
            true;

        return new THREE.MeshStandardMaterial({

            map:
                texture,

            roughness:
                1.0,

            metalness:
                0
        });
    }

    return new THREE.MeshStandardMaterial({

        color:
            0x655c30,

        roughness:
            1
    });
}

function createCeilingMaterial() {

    if (
        ceilingTexture
    ) {

        const texture =
            ceilingTexture.clone();

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        texture.repeat.set(
            110,
            110
        );

        texture.needsUpdate =
            true;

        return new THREE.MeshStandardMaterial({

            map:
                texture,

            roughness:
                0.95,

            metalness:
                0
        });
    }

    return new THREE.MeshStandardMaterial({

        color:
            0x55523b,

        roughness:
            1
    });
}

/* =========================================================
   WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = 0.35
) {

    const height =
        3.1;

    wallColliders.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2,

        minY:
            0,

        maxY:
            height
    });

    const material =
        createWallMaterial(
            width,
            height
        );

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const wall =
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,
        height / 2,
        z
    );

    wall.castShadow =
        true;

    wall.receiveShadow =
        true;

    addWorldObject(
        wall
    );
}

/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                260,
                260
            ),

            createFloorMaterial()
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.position.y =
        0;

    floor.receiveShadow =
        true;

    addWorldObject(
        floor
    );
}

/* =========================================================
   CEILING
========================================================= */

function createCeiling() {

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                260,
                260
            ),

            createCeilingMaterial()
        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y =
        3.1;

    ceiling.receiveShadow =
        true;

    addWorldObject(
        ceiling
    );
}

/* =========================================================
   OUTER WALLS
========================================================= */

function createOuterWalls() {

    const size =
        250;

    const thickness =
        0.45;

    const half =
        size / 2;

    /*
       These are normal walls.

       There is NO open void around
       the outside of the map.
    */

    createWall(
        0,
        -half,
        size,
        thickness
    );

    createWall(
        0,
        half,
        size,
        thickness
    );

    createWall(
        -half,
        0,
        thickness,
        size
    );

    createWall(
        half,
        0,
        thickness,
        size
    );
}

/* =========================================================
   BACKROOMS MAP
========================================================= */

function buildBackroomsMap() {

    /*
       LONG OUTER CORRIDOR STRUCTURE
    */

    createWall(
        -82,
        -88,
        36
    );

    createWall(
        -40,
        -88,
        32
    );

    createWall(
        0,
        -88,
        34
    );

    createWall(
        40,
        -88,
        32
    );

    createWall(
        80,
        -88,
        36
    );

    /*
       UPPER ZIG-ZAG
    */

    createWall(
        -94,
        -67,
        18
    );

    createWall(
        -70,
        -64,
        27
    );

    createWall(
        -39,
        -68,
        21
    );

    createWall(
        -13,
        -63,
        28
    );

    createWall(
        18,
        -69,
        24
    );

    createWall(
        47,
        -63,
        31

function createHoleRoom() {

    const startX =
        -54;

    const startZ =
        46;

    const columns =
        17;

    const rows =
        7;

    const spacing =
        3.5;

    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            if (
                (
                    x +
                    z
                ) % 4 === 0
            ) {

                continue;
            }

            const px =
                startX +
                x *
                spacing;

            const pz =
                startZ +
                z *
                spacing;

            const hole =
                new THREE.Mesh(

                    new THREE.CircleGeometry(
                        1.2,
                        32
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x000000,

                        side:
                            THREE.DoubleSide
                    })
                );

            hole.rotation.x =
                -Math.PI / 2;

            hole.position.set(
                px,
                0.008,
                pz
            );

            addWorldObject(
                hole
            );

            deathHoles.push({

                x:
                    px,

                z:
                    pz,

                radius:
                    1.12
            });
        }
    }
}

function addFluorescent(
    x,
    z,
    intensity = 4,
    flicker = false
) {

    /*
       The fixture itself NEVER disappears.

       Only the actual light changes intensity.
    */

    const fixtureMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xfff4c4
        });

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.25,
                0.06,
                1.25
            ),

            fixtureMaterial
        );

    fixture.position.set(
        x,
        3.035,
        z
    );

    addWorldObject(
        fixture
    );

    const light =
        new THREE.PointLight(

            0xffe7a3,

            intensity,

            15,

            1.7
        );

    light.position.set(
        x,
        2.72,
        z
    );

    light.castShadow =
        true;

    light.shadow.mapSize.width =
        256;

    light.shadow.mapSize.height =
        256;

    light.shadow.camera.near =
        0.2;

    light.shadow.camera.far =
        15;

    scene.add(
        light
    );

    lights.push({

        light:
            light,

        fixture:
            fixture,

        flicker:
            flicker,

        timer:
            Math.random() *
            3,

        base:
            intensity
    });
}

function buildLighting() {

    for (
        let x = -96;
        x <= 96;
        x += 12
    ) {

        for (
            let z = -78;
            z <= 84;
            z += 12
        ) {

            const random =
                Math.random();

            if (
                random < .13
            ) {

                continue;
            }

            addFluorescent(

                x +
                (
                    Math.random() -
                    .5
                ) * 2,

                z +
                (
                    Math.random() -
                    .5
                ) * 2,

                random < .25
                    ? 2.4
                    : 3.8,

                random < .18
            );
        }
    }

    /*
       Landmark lights.
    */

    addFluorescent(
        -18,
        -64,
        5.2,
        true
    );

    addFluorescent(
        28,
        -42,
        4.8,
        false
    );

    addFluorescent(
        7,
        18,
        5.0,
        true
    );

    addFluorescent(
        38,
        58,
        5.2,
        false
    );
}

function updateLights(
    dt
) {

    for (
        const item
        of lights
    ) {

        if (
            !item.flicker
        ) {

            continue;
        }

        item.timer -=
            dt;

        if (
            item.timer <= 0
        ) {

            item.timer =
                .08 +
                Math.random() *
                .55;

            /*
               NEVER hide the fixture.

               It remains visibly mounted
               in the ceiling.
            */

            if (
                Math.random() <
                .18
            ) {

                item.light.intensity =
                    item.base *
                    .18;

            } else {

                item.light.intensity =
                    item.base *
                    (
                        .65 +
                        Math.random() *
                        .4
                    );
            }
        }
    }
}

/* =========================================================
   COLLISION
========================================================= */

const PLAYER_RADIUS =
    0.28;

const PLAYER_HEIGHT =
    1.55;

const EYE_HEIGHT =
    1.18;

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;

    for (
        const wall
        of wallColliders
    ) {

        if (
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {

            continue;
        }

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;

        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }

    return false;
}

function entityHitsWall(
    x,
    z
) {

    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;

        if (
            dx * dx +
            dz * dz <
            .42 *
            .42
        ) {

            return true;
        }
    }

    return false;
}

function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 -
        x1;

    const dz =
        z2 -
        z1;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    const steps =
        Math.max(
            1,
            Math.ceil(
                distance /
                .3
            )
        );

    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i /
            steps;

        if (
            entityHitsWall(

                x1 +
                dx * t,

                z1 +
                dz * t
            )
        ) {

            return true;
        }
    }

    return false;
}

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }

    const settings =
        SETTINGS[
            difficulty
        ];

    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    lastSeen +=
        dt;

    const visible =
        distance <
        settings.detection &&
        !blocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z
        );

    let directionX =
        0;

    let directionZ =
        0;

    if (
        visible
    ) {

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen =
            0;

        directionX =
            dx /
            Math.max(
                distance,
                .001
            );

        directionZ =
            dz /
            Math.max(
                distance,
                .001
            );

    } else if (
        lastSeen <
        3.2
    ) {

        const lx =
            lastKnown.x -
            entity.position.x;

        const lz =
            lastKnown.y -
            entity.position.z;

        const length =
            Math.hypot(
                lx,
                lz
            );

        if (
            length >
            .1
        ) {

            directionX =
                lx /
                length;

            directionZ =
                lz /
                length;
        }

    } else {

        wanderTimer -=
            dt;

        if (
            wanderTimer <= 0
        ) {

            wanderTimer =
                .5 +
                Math.random() *
                1.8;

            wanderAngle =
                Math.random() *
                Math.PI *
                2;
        }

        directionX =
            Math.cos(
                wanderAngle
            );

        directionZ =
            Math.sin(
                wanderAngle
            );
    }

    const targetAngle =
        Math.atan2(
            directionZ,
            directionX
        );

    const currentAngle =
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference =
        targetAngle -
        currentAngle;

    while (
        difference >
        Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }

    while (
        difference <
        -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }

    difference =
        THREE.MathUtils.clamp(

            difference,

            -3.4 * dt,

            3.4 * dt
        );

    const angle =
        currentAngle +
        difference;

    entityDirection.x =
        Math.cos(
            angle
        );

    entityDirection.y =
        Math.sin(
            angle
        );

    entityVelocity.x =
        THREE.MathUtils.lerp(

            entityVelocity.x,

            entityDirection.x *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );

    entityVelocity.y =
        THREE.MathUtils.lerp(

            entityVelocity.y,

            entityDirection.y *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );

    /*
       Juke / wall avoidance.
    */

    let moveX =
        entityVelocity.x *
        dt;

    let moveZ =
        entityVelocity.y *
        dt;

    let nextX =
        entity.position.x +
        moveX;

    let nextZ =
        entity.position.z +
        moveZ;

    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        entityVelocity.x =
            0;

        wanderAngle +=
            Math.PI / 2;

        entityDirection.set(

            Math.cos(
                wanderAngle
            ),

            Math.sin(
                wanderAngle
            )
        );
    }

    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        entityVelocity.y =
            0;

        wanderAngle +=
            Math.PI / 2;

        entityDirection.set(

            Math.cos(
                wanderAngle
            ),

            Math.sin(
                wanderAngle
            )
        );
    }

    /*
       Billboard toward player.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );

    const killDistance =
        difficulty ===
        "nightmare"
            ? 1.55
            : 1.25;

    if (
        distance <
        killDistance
    ) {

        killPlayer();
    }
}

/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;
    }

    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z
        );

    const maxDistance =
        34;

    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;
    }

    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.6

        ) * .9;

    if (
        blocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z
        )
    ) {

        volume *=
            .2;
    }

    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}

        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                true;
        }

        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                true;
        }

        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                true;
        }

        if (
            event.code ===
            "ShiftLeft" ||
            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                true;
        }

        if (
            event.code ===
            "Space" &&
            !event.repeat
        ) {

            jumpPressed =
                true;
        }

        if (
            event.code ===
            "Escape" &&
            running &&
            !dead &&
            !fallingIntoLevel
        ) {

            togglePause();
        }
    }
);

window.addEventListener(
    "keyup",
    event => {

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                false;
        }

        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                false;
        }

        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                false;
        }

        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                false;
        }

        if (
            event.code ===
            "ShiftLeft" ||
            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                false;
        }
    }
);

/* =========================================================
   MOUSE
========================================================= */

window.addEventListener(
    "mousemove",
    event => {

        if (
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ) {

            return;
        }

        if (
            document.pointerLockElement !==
            document.body
        ) {

            return;
        }

        yaw -=
            event.movementX *
            .0022;

        pitch -=
            event.movementY *
            .0018;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;
    }
);

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;
    }

    let forward =
        0;

    let side =
        0;

    /*
       IMPORTANT:

       W = FORWARD
       S = BACKWARD

       Forward is NEGATIVE Z
       relative to the player's
       starting orientation.
    */

    if (
        keys.w
    ) {

        forward +=
            1;
    }

    if (
        keys.s
    ) {

        forward -=
            1;
    }

    if (
        keys.d
    ) {

        side +=
            1;
    }

    if (
        keys.a
    ) {

        side -=
            1;
    }

    const length =
        Math.hypot(
            forward,
            side
        );

    if (
        length >
        0
    ) {

        forward /=
            length;

        side /=
            length;
    }

    let speed =
        keys.shift
            ? 5.9
            : 3.5;

    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.1
                : 3.8;
    }

    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.3
                : 3.4;
    }

    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.5
                : 3.25;
    }

    const sin =
        Math.sin(
            yaw
        );

    const cos =
        Math.cos(
            yaw
        );

    /*
       Correct forward direction.
    */

    const dx =
        (
            side * cos +
            forward * sin
        ) *
        speed *
        dt;

    const dz =
        (
            -side * sin +
            forward * cos
        ) *
        speed *
        dt;

    const nextX =
        player.position.x +
        dx;

    const nextZ =
        player.position.z +
        dz;

    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }

    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }

    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;
    }

    jumpPressed =
        false;

    velocityY -=
        20 *
        dt;

    player.position.y +=
        velocityY *
        dt;

    if (
        player.position.y <=
        0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;
    }

    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }

    checkExit();
}

/* =========================================================
   FALL
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;

    const progress =
        Math.min(
            fallTimer /
            FALL_DURATION,
            1
        );

    const eased =
        1 -
        Math.pow(
            1 -
            progress,
            3
        );

    player.position.y =
        17 -
        17 *
        eased;

    camera.position.y =
        EYE_HEIGHT;

    camera.rotation.x =
        THREE.MathUtils.lerp(

            -.32,

            0,

            Math.min(
                progress *
                1.3,
                1
            )
        );

    camera.rotation.z =
        Math.sin(

            progress *
            Math.PI *
            9

        ) * .025;

    if (
        progress >=
        1
    ) {

        fallingIntoLevel =
            false;

        player.position.y =
            0;

        camera.position.set(
            0,
            EYE_HEIGHT,
            0
        );

        camera.rotation.x =
            0;

        camera.rotation.z =
            0;

        document.body
            .requestPointerLock();
    }
}

/* =========================================================
   CAMERA MOTION
========================================================= */

let cameraTime =
    0;

function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;
    }

    cameraTime +=
        dt;

    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;

    const bob =
        moving
            ? .012
            : .003;

    camera.position.x =
        Math.sin(
            cameraTime *
            3.4
        ) *
        bob;

    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime *
            4.1
        ) *
        bob;

    camera.position.z =
        Math.cos(
            cameraTime *
            3.1
        ) *
        bob *
        .55;

    /*
       Security-camera instability.
    */

    camera.rotation.z =
        Math.sin(
            cameraTime *
            .9
        ) *
        .004;

    if (
        Math.random() <
        .0035
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) *
            .045;

        camera.position.y +=
            (
                Math.random() -
                .5
            ) *
            .035;

        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) *
            .035;
    }
}

/* =========================================================
   HOLES
========================================================= */

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;

        const dz =
            player.position.z -
            hole.z;

        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;
        }
    }

    return false;
}

/* =========================================================
   EXIT
========================================================= */

function checkExit() {

    if (
        !exitObject ||
        dead
    ) {

        return;
    }

    const distance =
        Math.hypot(

            player.position.x -
            exitX,

            player.position.z -
            exitZ
        );

    if (
        distance <
        1.8
    ) {

        winGame();
    }
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer =
    0;

function showMessage(
    text
) {

    document.getElementById(
        "message"
    ).textContent =
        text;

    messageTimer =
        2.2;
}

function updateMessage(
    dt
) {

    if (
        messageTimer <=
        0
    ) {

        return;
    }

    messageTimer -=
        dt;

    if (
        messageTimer <=
        0
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "";
    }
}

/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason =
        "THE BACKROOMS GOT YOU"
) {

    if (
        dead ||
        !running
    ) {

        return;
    }

    dead =
        true;

    fallingIntoLevel =
        false;

    entityAudio.pause();

    entityAudio.volume =
        0;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }

    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU DIED";

    document.getElementById(
        "deathTitle"
    ).className =
        "";

    document.getElementById(
        "deathText"
    ).textContent =
        reason;

    document.getElementById(
        "retryBtn"
    ).textContent =
        "RETRY";

    document.getElementById(
        "death"
    ).style.display =
        "flex";
}

/* =========================================================
   WIN
========================================================= */

function winGame() {

    if (
        dead ||
        !running
    ) {

        return;
    }

    dead =
        true;

    entityAudio.pause();

    entityAudio.volume =
        0;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }

    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU ESCAPED";

    document.getElementById(
        "deathTitle"
    ).className =
        "win";

    document.getElementById(
        "deathText"
    ).textContent =
        "YOU FOUND THE EXIT";

    document.getElementById(
        "retryBtn"
    ).textContent =
        "PLAY AGAIN";

    document.getElementById(
        "death"
    ).style.display =
        "flex";
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }

    paused =
        !paused;

    document.getElementById(
        "pause"
    ).style.display =
        paused
            ? "flex"
            : "none";

    if (
        paused
    ) {

        if (
            document.pointerLockElement
        ) {

            document.exitPointerLock();
        }

    } else {

        document.body
            .requestPointerLock();
    }
}

/* =========================================================
   MENU
========================================================= */

function returnToMenu() {

    running =
        false;

    paused =
        false;

    dead =
        false;

    fallingIntoLevel =
        false;

    entityAudio.pause();

    entityAudio.volume =
        0;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    document.getElementById(
        "menu"
    ).style.display =
        "block";
}

/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    /*
       The textures are loaded BEFORE
       any environment geometry is created.
    */

    if (
        !wallTexture ||
        !floorTexture ||
        !ceilingTexture
    ) {

        await loadAllTextures();
    }

    clearWorld();

    player.position.set(
        -92,
        17,
        -70
    );

    /*
       Correct initial orientation.
    */

    yaw =
        0;

    pitch =
        -.12;

    velocityY =
        0;

    grounded =
        false;

    createFloor();

    createCeiling();

    createOuterWalls();

    buildBackroomsMap();

    createHoleRoom();

    createExit();

    buildLighting();

    await createEntity();

    entity.position.set(
        55,
        .775,
        -48
    );

    entityDirection.set(
        1,
        0
    );

    entityVelocity.set(
        0,
        0
    );

    lastSeen =
        99;

    running =
        true;

    paused =
        false;

    dead =
        false;

    fallingIntoLevel =
        true;

    fallTimer =
        0;

    recordingTime =
        0;

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x =
        pitch;

    camera.rotation.y =
        0;

    camera.rotation.z =
        0;

    player.rotation.y =
        yaw;

    showMessage(
        "ENTERING LEVEL 0..."
    );
}

/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(
    value
) {

    difficulty =
        value;

    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );
            }
        );

    const id =
        value ===
        "nightmare"

            ? "nightmareBtn"

            : value +
              "Btn";

    document.getElementById(
        id
    ).classList.add(
        "selected"
    );

    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();
}

document.getElementById(
    "easyBtn"
).onclick =
    () =>
        setDifficulty(
            "easy"
        );

document.getElementById(
    "normalBtn"
).onclick =
    () =>
        setDifficulty(
            "normal"
        );

document.getElementById(
    "hardBtn"
).onclick =
    () =>
        setDifficulty(
            "hard"
        );

document.getElementById(
    "nightmareBtn"
).onclick =
    () =>
        setDifficulty(
            "nightmare"
        );

document.getElementById(
    "startBtn"
).onclick =
    () =>
        startGame();

document.getElementById(
    "resumeBtn"
).onclick =
    () =>
        togglePause();

document.getElementById(
    "restartBtn"
).onclick =
    () =>
        startGame();

document.getElementById(
    "menuBtn"
).onclick =
    () =>
        returnToMenu();

document.getElementById(
    "retryBtn"
).onclick =
    () =>
        startGame();

document.getElementById(
    "deathMenuBtn"
).onclick =
    () =>
        returnToMenu();

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    () => {

        if (
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement !==
            document.body
        ) {

            document.body
                .requestPointerLock();
        }
    }
);

/* =========================================================
   MENU IMAGES
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex =
    0;

function cycleMenuImage() {

    if (
        menuImages.length ===
        0
    ) {

        return;
    }

    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );

    menuIndex =
        (
            menuIndex +
            1
        ) %
        menuImages.length;

    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}

setInterval(
    cycleMenuImage,
    60000
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio ||
                1,
                1.5
            )
        );
    }
);

/* =========================================================
   TIMER
========================================================= */

const clock =
    new THREE.Clock();

let recordingTime =
    0;

function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;
    }

    recordingTime +=
        dt;

    const total =
        Math.floor(
            recordingTime
        );

    const hours =
        Math.floor(
            total /
            3600
        );

    const minutes =
        Math.floor(
            (
                total %
                3600
            ) /
            60
        );

    const seconds =
        total %
        60;

    const format =
        value =>
            String(
                value
            ).padStart(
                2,
                "0"
            );

    document.getElementById(
        "tapeTime"
    ).textContent =

        format(hours) +
        ":" +
        format(minutes) +
        ":" +
        format(seconds);
}

/* =========================================================
   MAIN LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );

        updateEntity(
            dt
        );

        updateLights(
            dt
        );

        updateCamera(
            dt
        );

        updateEntityAudio();

        updateMessage(
            dt
        );

        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();
    }

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize() {

    try {

        await loadAllTextures();

        console.log(
            "BACKROOMS INITIALIZED"
        );

    } catch (
        error
    ) {

        console.error(
            error
        );

        const errorBox =
            document.getElementById(
                "error"
            );

        errorBox.style.display =
            "block";

        errorBox.textContent =
            "INITIALIZATION ERROR\n\n" +
            error.stack;
    }
}

initialize();

animate();

</script>
