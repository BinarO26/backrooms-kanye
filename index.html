<script>

/* =========================================================
   BASIC THREE.JS CHECK
========================================================= */

if(typeof THREE==="undefined"){

    const error=document.getElementById("error");

    error.style.display="block";

    error.textContent=
        "ERROR: three.min.js could not be loaded.";

    throw new Error(
        "Three.js missing"
    );
}

/* =========================================================
   SCENE
========================================================= */

const scene=new THREE.Scene();

scene.background=
    new THREE.Color(0x706b45);

scene.fog=
    new THREE.FogExp2(
        0x706b45,
        .009
    );

/* =========================================================
   CAMERA
========================================================= */

const camera=
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .025,
        500
    );

/* =========================================================
   RENDERER

   IMPORTANT:
   Camcorder is CSS only.
   It does NOT touch the rendered texture materials.
========================================================= */

const renderer=
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.35
    )
);

if("outputColorSpace" in renderer){

    renderer.outputColorSpace=
        THREE.SRGBColorSpace;
}

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=
    .72;

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x655f3c,
        .24
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xd5c879,
        0x11100c,
        .38
    )
);

/* =========================================================
   TEXTURES

   EXACT PATHS:
   textures/wall.png
   textures/floor.png
   textures/ceiling.png
========================================================= */

const textureLoader=
    new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;

function setupTexture(texture){

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.magFilter=
        THREE.LinearFilter;

    texture.minFilter=
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy=
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(path){

    return new Promise(resolve=>{

        textureLoader.load(

            path,

            texture=>{

                resolve(
                    setupTexture(texture)
                );

            },

            undefined,

            error=>{

                console.error(
                    "Texture failed:",
                    path,
                    error
                );

                resolve(null);
            }

        );

    });
}

async function loadTextures(){

    wallTexture=
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture=
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture=
        await loadTexture(
            "./textures/ceiling.png"
        );

    if(!wallTexture ||
       !floorTexture ||
       !ceilingTexture){

        const error=
            document.getElementById("error");

        error.style.display="block";

        error.textContent=
            "One or more textures could not be loaded.\n\n"+
            "Make sure these files exist exactly:\n"+
            "textures/wall.png\n"+
            "textures/floor.png\n"+
            "textures/ceiling.png";
    }
}

/* =========================================================
   PLAYER
========================================================= */

const player=
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const PLAYER_HEIGHT=1.55;
const PLAYER_RADIUS=.28;
const EYE_HEIGHT=1.18;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=false;

let running=false;
let paused=false;
let dead=false;
let won=false;

let fallingIntoLevel=true;
let fallTimer=0;

const FALL_DURATION=2.25;

let difficulty="normal";

const WALK_SPEED=3.5;
const SPRINT_SPEED=5.9;
const GRAVITY=20;
const JUMP_SPEED=6.2;

/* =========================================================
   WORLD
========================================================= */

let worldObjects=[];
let wallColliders=[];
let deathHoles=[];
let flickeringLights=[];

let exitObject=null;
let exitLight=null;

let exitX=0;
let exitZ=0;

let entity=null;

function addWorldObject(object){

    scene.add(object);

    worldObjects.push(object);

    return object;
}

function clearWorld(){

    for(const object of worldObjects){

        scene.remove(object);

        if(object.geometry)
            object.geometry.dispose();

        if(object.material){

            if(Array.isArray(object.material)){

                object.material.forEach(
                    material=>{
                        if(material)
                            material.dispose();
                    }
                );

            }else{

                object.material.dispose();
            }
        }
    }

    worldObjects=[];

    wallColliders=[];
    deathHoles=[];
    flickeringLights=[];

    entity=null;
    exitObject=null;

    if(exitLight){

        scene.remove(
            exitLight
        );

        exitLight=null;
    }
}

/* =========================================================
   WALL MATERIAL

   THIS IS THE IMPORTANT FIX.

   wall.png:
   - appears exactly once vertically
   - keeps original aspect ratio
   - repeats horizontally
   - never squishes vertically
========================================================= */

function createWallMaterial(
    width,
    height
){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({

            color:0xb6a94d,

            roughness:1,

            side:THREE.DoubleSide

        });
    }

    const texture=
        wallTexture.clone();

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.ClampToEdgeWrapping;

    const imageWidth=
        texture.image.width || 1;

    const imageHeight=
        texture.image.height || 1;

    const aspect=
        imageWidth/imageHeight;

    /*
       One image from floor to ceiling.

       If the PNG is square and the wall is
       3.1 units tall, one tile is 3.1 units wide.
    */

    const tileWidth=
        height*aspect;

    /*
       Repeat horizontally.

       Fractional repeat at the end naturally
       cuts the texture off.
    */

    texture.repeat.set(
        Math.max(
            width/tileWidth,
            .001
        ),
        1
    );

    texture.offset.set(
        0,
        0
    );

    texture.needsUpdate=true;

    return new THREE.MeshStandardMaterial({

        map:texture,

        color:0xffffff,

        roughness:.98,

        metalness:0,

        side:THREE.DoubleSide
    });
}

/* =========================================================
   WALL

   Individual planes avoid the BoxGeometry UV layout
   causing the wall texture to stretch.
========================================================= */

function addWall(
    x,
    z,
    width,
    depth
){

    const height=3.1;

    /*
       Collision
    */

    wallColliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minZ:z-depth/2,
        maxZ:z+depth/2

    });

    const group=
        new THREE.Group();

    /*
       FRONT
    */

    const front=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                width,
                height
            )
        );

    front.position.set(
        0,
        height/2,
        depth/2
    );

    front.castShadow=true;
    front.receiveShadow=true;

    group.add(front);

    /*
       BACK
    */

    const back=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                width,
                height
            )
        );

    back.rotation.y=
        Math.PI;

    back.position.set(
        0,
        height/2,
        -depth/2
    );

    back.castShadow=true;
    back.receiveShadow=true;

    group.add(back);

    /*
       LEFT
    */

    const left=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            createWallMaterial(
                depth,
                height
            )
        );

    left.rotation.y=
        Math.PI/2;

    left.position.set(
        -width/2,
        height/2,
        0
    );

    left.castShadow=true;
    left.receiveShadow=true;

    group.add(left);

    /*
       RIGHT
    */

    const right=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            createWallMaterial(
                depth,
                height
            )
        );

    right.rotation.y=
        -Math.PI/2;

    right.position.set(
        width/2,
        height/2,
        0
    );

    right.castShadow=true;
    right.receiveShadow=true;

    group.add(right);

    group.position.set(
        x,
        0,
        z
    );

    addWorldObject(group);
}

/* =========================================================
   FLOOR
========================================================= */

function createFloor(){

    const sizeX=300;
    const sizeZ=260;

    let material;

    if(floorTexture){

        const texture=
            floorTexture.clone();

        texture.wrapS=
            THREE.RepeatWrapping;

        texture.wrapT=
            THREE.RepeatWrapping;

        /*
           GRID.

           This means the PNG itself is repeated,
           rather than being stretched over the map.
        */

        texture.repeat.set(
            90,
            78
        );

        texture.needsUpdate=true;

        material=
            new THREE.MeshStandardMaterial({

                map:texture,

                roughness:1,

                metalness:0
            });

    }else{

        material=
            new THREE.MeshStandardMaterial({

                color:0x9b9148,

                roughness:1
            });
    }

    const floor=
        new THREE.Mesh(

            new THREE.PlaneGeometry(

   LIGHTS
========================================================= */

function addLight(
    x,
    z,
    intensity=4.5,
    flicker=false,
    scale=1
){

    const fixture=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.0*scale,
                .045,
                .62*scale
            ),

            new THREE.MeshBasicMaterial({
                color:0xfff0b5
            })
        );

    fixture.position.set(
        x,
        3.035,
        z
    );

    addWorldObject(fixture);

    const light=
        new THREE.PointLight(
            0xffe5a0,
            intensity,
            12,
            1.65
        );

    light.position.set(
        x,
        2.8,
        z
    );

    scene.add(light);

    if(flicker){

        flickeringLights.push({

            light,
            fixture,

            base:intensity,

            timer:
                Math.random()*2
        });
    }
}

function updateLights(dt){

    for(const f of flickeringLights){

        f.timer-=dt;

        if(f.timer<=0){

            f.timer=
                .08+
                Math.random()*.5;

            if(Math.random()<.18){

                f.light.intensity=0;

                f.fixture.visible=false;

            }else{

                f.light.intensity=
                    f.base*
                    (
                        .68+
                        Math.random()*.38
                    );

                f.fixture.visible=true;
            }
        }
    }
}

/* =========================================================
   ROOM HELPER
========================================================= */

function room(
    x,
    z,
    width,
    depth,
    doors={}
){

    const thickness=.45;

    /*
       TOP
    */

    if(!doors.top){

        addWall(
            x,
            z-depth/2,
            width,
            thickness
        );

    }else{

        const gap=doors.top;

        const side=
            (width-gap)/2;

        addWall(
            x-side/2-gap/2,
            z-depth/2,
            side,
            thickness
        );

        addWall(
            x+side/2+gap/2,
            z-depth/2,
            side,
            thickness
        );
    }

    /*
       BOTTOM
    */

    if(!doors.bottom){

        addWall(
            x,
            z+depth/2,
            width,
            thickness
        );

    }else{

        const gap=doors.bottom;

        const side=
            (width-gap)/2;

        addWall(
            x-side/2-gap/2,
            z+depth/2,
            side,
            thickness
        );

        addWall(
            x+side/2+gap/2,
            z+depth/2,
            side,
            thickness
        );
    }

    /*
       LEFT
    */

    if(!doors.left){

        addWall(
            x-width/2,
            z,
            thickness,
            depth
        );

    }else{

        const gap=doors.left;

        const side=
            (depth-gap)/2;

        addWall(
            x-width/2,
            z-side/2-gap/2,
            thickness,
            side
        );

        addWall(
            x-width/2,
            z+side/2+gap/2,
            thickness,
            side
        );
    }

    /*
       RIGHT
    */

    if(!doors.right){

        addWall(
            x+width/2,
            z,
            thickness,
            depth
        );

    }else{

        const gap=doors.right;

        const side=
            (depth-gap)/2;

        addWall(
            x+width/2,
            z-side/2-gap/2,
            thickness,
            side
        );

        addWall(
            x+width/2,
            z+side/2+gap/2,
            thickness,
            side
        );
    }
}

function createHoleGrid(){

    const startX=-82;
    const startZ=49;

    const columns=5;
    const rows=5;

    const spacing=4.2;
    const holeSize=3.15;

    for(let z=0;z<rows;z++){

            const px=
                startX+
                x*spacing;

            const pz=
                startZ+
                z*spacing;

            const hole=
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        holeSize,
                        holeSize
                    ),

                    new THREE.MeshBasicMaterial({
                        color:0x030303,
                        side:THREE.DoubleSide

            hole.rotation.x=

            hole.position.set(
                px,
                .006,
                pz
            );

            addWorldObject(hole);

            deathHoles.push({

                x:px,
                z:pz,

                radius:
                    holeSize*.48
            });
        }
    }
}

/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
){

    const r=PLAYER_RADIUS;

    for(const wall of wallColliders){

        if(

            x+r>wall.minX &&
            x-r<wall.maxX &&
            z+r>wall.minZ &&
            z-r<wall.maxZ

        ){

            return true;
        }
    }

    return false;
}

/* =========================================================
   HOLE CHECK
========================================================= */

function inDeathHole(
    x,
    z
){

    for(const hole of deathHoles){

        const dx=
            x-hole.x;

        const dz=
            z-hole.z;

        if(
            Math.sqrt(
                dx*dx+
                dz*dz
            )
            <
            hole.radius
        ){

            return true;
        }
    }

    return false;
}

/* =========================================================
   EXIT CHECK
========================================================= */

function checkExit(){

    if(!exitObject)
        return;

    const dx=
        player.position.x-
        exitX;

    const dz=
        player.position.z-
        exitZ;

    if(
        Math.sqrt(
            dx*dx+
            dz*dz
        )<2.2
    ){

        winGame();
    }
}

========================================================= */

    "mousemove",
    event=>{

        if(
            !gameStarted ||

        )

            Math.max(

/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(dt){

    if(
        !gameStarted ||
        paused ||
        dead ||
        won ||
        fallingIntoLevel
    )
        return;

    let forward=0;
    let right=0;

    if(keys.KeyW)
        forward+=1;

    if(keys.KeyS)
        forward-=1;

    if(keys.KeyD)
        right+=1;

    if(keys.KeyA)
        right-=1;

    const length=
        Math.sqrt(
            forward*forward+
            right*right
        );

    if(length>0){

        forward/=length;
        right/=length;
    }

    running=
        keys.ShiftLeft ||
        keys.ShiftRight;

    const speed=
        running
        ? SPRINT_SPEED
        : WALK_SPEED;

    const sin=
        Math.sin(yaw);

    const cos=
        Math.cos(yaw);

    const dx=
        (
            right*cos+
            forward*sin
        )*
        speed*
        dt;

    const dz=
        (
            -right*sin+
            forward*cos
        )*
        speed*
        dt;

    const nextX=
        player.position.x+
        dx;

    const nextZ=
        player.position.z+
        dz;

    if(!collides(nextX,player.position.z))
        player.position.x=nextX;

    if(!collides(player.position.x,nextZ))
        player.position.z=nextZ;

    /*
       Jump.
    */

    if(
        keys.Space &&
        grounded
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;
    }

    velocityY-=
        GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=
        PLAYER_HEIGHT
    ){

        player.position.y=
            PLAYER_HEIGHT;

        velocityY=0;

        grounded=true;
    }

    /*
       Holes kill.
    */

    if(
        inDeathHole(
            player.position.x,
            player.position.z
        )
    ){

        die(
            "YOU FELL INTO THE LEVEL."
        );

        return;
    }

    checkExit();
}

/* =========================================================
   FALLING INTRO
========================================================= */

function updateFall(dt){

    if(!fallingIntoLevel)
        return;

    fallTimer+=dt;

    const t=
        Math.min(
            fallTimer/FALL_DURATION,
            1
        );

    /*
       Starts high and drops into the
       normal player position.
    */

    const ease=
        1-Math.pow(
            1-t,
            3
        );

    player.position.y=
        7-
        (
            7-PLAYER_HEIGHT
        )*
        ease;

    camera.rotation.x=
        .15-
        .55*ease;

    camera.position.y=
        Math.sin(
            t*Math.PI*8
        )*.035;

    if(t>=1){

        fallingIntoLevel=false;

        player.position.y=
            PLAYER_HEIGHT;

        camera.position.y=0;

        document.getElementById(
            "fallOverlay"
        ).style.transition=
            "opacity 1s";

        document.getElementById(
            "fallOverlay"
        ).style.opacity="0";

        setTimeout(
            ()=>{
                document.getElementById(
                    "fallOverlay"
                ).style.display="none";
            },
            1000
        );

        renderer.domElement.requestPointerLock();
    }
}

/* =========================================================
   ENTITY
========================================================= */

let entityTimer=0;

function updateEntity(dt){

    if(
        !entity ||
        dead ||
        won ||
        paused ||
        fallingIntoLevel
    )
        return;

    entityTimer+=dt;

    /*
       It moves slowly between familiar
       sections instead of constantly chasing.
    */

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.sqrt(
            dx*dx+
            dz*dz
        );

    if(
        distance<20 &&
        distance>2.5
    ){

        const speed=
            difficulty==="nightmare"
            ? .75
            : difficulty==="hard"
            ? .55
            : .35;

        entity.position.x+=
            dx/distance*
            speed*
            dt;

        entity.position.z+=
            dz/distance*
            speed*
            dt;

        entity.lookAt(
            player.position.x,
            1,
            player.position.z
        );
    }

    /*
       Keep entity from being instantly
       overwhelming.
    */

    if(distance<1.5){

        die(
            "SOMETHING FOUND YOU."
        );
    }
}

/* =========================================================
   TAPE TIMER
========================================================= */

let tapeTime=0;

function updateTape(dt){

    if(
        !gameStarted ||
        paused ||
        dead ||
        won
    )
        return;

    tapeTime+=dt;

    const total=
        Math.floor(tapeTime);

    const hours=
        Math.floor(total/3600);

    const minutes=
        Math.floor(
            (total%3600)/60
        );

    const seconds=
        total%60;

    document.getElementById(
        "tapeTime"
    ).textContent=
        String(hours).padStart(2,"0")+
        ":"+
        String(minutes).padStart(2,"0")+
        ":"+
        String(seconds).padStart(2,"0");
}

                    image.classList.remove(
                        "active"
                    );
                }
            );

            menuIndex=
                (menuIndex+1)%
                menuImages.length;

            menuImages[
                menuIndex
            ].classList.add(
                "active"
            );
        }

    },
    60000
);

/* =========================================================
   DIFFICULTY
========================================================= */

function selectDifficulty(value){

    difficulty=value;

    document.querySelectorAll(
        ".menuDifficulty button"
    ).forEach(
        button=>{
            button.classList.remove(
                "selected"
            );
        }
    );

    const id=
        value==="easy"
        ? "easyBtn"
        : value==="normal"
        ? "normalBtn"
        : value==="hard"
        ? "hardBtn"
        : "impossibleBtn";

    document.getElementById(
        id
    ).classList.add(
        "selected"
    );

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();
}

document.getElementById(

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.35
            )
        );

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(
    text,
    duration=3
){

    const element=
        document.getElementById(
            "message"
        );

    element.textContent=text;

    messageTimer=duration;
}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";
    }
}

/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .05
        );

    updateFall(dt);

    updateMovement(dt);

    updateEntity(dt);

    updateLights(dt);

    updateTape(dt);

    updateMessage(dt);

    /*
       Slight handheld camera movement.
       This affects only the camera.
       It does NOT modify textures.
    */

    if(
        gameStarted &&
        !paused &&
        !dead &&
        !won &&
        !fallingIntoLevel
    ){

        const movement=
            running
            ? .018
            : .010;

        camera.position.x=
            Math.sin(
                now*.006
            )*
            movement;

        camera.position.y=
            Math.sin(
                now*.009
            )*
            movement*.7;

        camera.position.z=
            Math.cos(
                now*.007
            )*
            movement;
    }

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   INITIALIZATION

   IMPORTANT:
   Textures are loaded BEFORE the game can start.
========================================================= */

async function initialize(){

    await loadTextures();

    /*
       Start the render loop immediately,
       but don't build the world until
       the player presses ENTER.
    */

    animate();
}

initialize();
