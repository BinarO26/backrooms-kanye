    <script src="./three.min.js"></script>


    <script>

        "use strict";


        /* =====================================================
           BASIC CHECK
        ===================================================== */

        const errorBox =
            document.getElementById(
                "error"
            );


        if (
            typeof THREE === "undefined"
        ) {

            errorBox.style.display =
                "block";

            errorBox.textContent =
                "THREE.JS FAILED TO LOAD.\n\n" +
                "This version expects:\n\n" +
                "index.html\n" +
                "three.min.js\n\n" +
                "to be in the SAME folder.\n\n" +
                "Do not use a CDN.";

            throw new Error(
                "Local three.min.js was not loaded."
            );
        }


        /* =====================================================
           RENDERER
        ===================================================== */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                alpha: false,

                powerPreference:
                    "high-performance"

            });


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.5
            )
        );


        renderer.shadowMap.enabled =
            true;


        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;


        if (
            "outputColorSpace"
            in renderer
        ) {

            renderer.outputColorSpace =
                THREE.SRGBColorSpace;
        }


        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;


        renderer.toneMappingExposure =
            1.12;


        document.body.appendChild(
            renderer.domElement
        );


        /* =====================================================
           SCENE
        ===================================================== */

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(
                0x7b7048
            );


        scene.fog =
            new THREE.Fog(
                0x7b7048,
                20,
                125
            );


        /* =====================================================
           CAMERA
        ===================================================== */

        const camera =
            new THREE.PerspectiveCamera(
                76,
                window.innerWidth /
                window.innerHeight,
                0.05,
                500
            );


        camera.rotation.order =
            "YXZ";


        /* =====================================================
           PLAYER
        ===================================================== */

        const player =
            new THREE.Object3D();


        scene.add(
            player
        );


        player.add(
            camera
        );


        const EYE_HEIGHT =
            1.18;


        const PLAYER_HEIGHT =
            1.55;


        const PLAYER_RADIUS =
            0.30;


        let yaw = 0;

        let pitch = 0;


        let velocityY = 0;

        let grounded = true;


        let running = false;

        let paused = false;

        let dead = false;


        /* =====================================================
           TEXTURES
        ===================================================== */

        const textureLoader =
            new THREE.TextureLoader();


        let wallTexture = null;

        let floorTexture = null;

        let ceilingTexture = null;


        function configureTexture(
            texture,
            repeatX,
            repeatY
        ) {

            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.repeat.set(
                repeatX,
                repeatY
            );


            texture.magFilter =
                THREE.LinearFilter;


            texture.minFilter =
                THREE.LinearMipmapLinearFilter;


            texture.anisotropy =
                Math.min(
                    renderer
                        .capabilities
                        .getMaxAnisotropy(),
                    8
                );


            texture.needsUpdate =
                true;


            return texture;
        }


        function loadTexture(
            path
        ) {

            return new Promise(
                resolve => {

                    textureLoader.load(

                        path,

                        texture => {

                            console.log(
                                "TEXTURE LOADED:",
                                path
                            );

                            resolve(
                                texture
                            );
                        },

                        undefined,

                        error => {

                            console.error(
                                "TEXTURE FAILED:",
                                path,
                                error
                            );

                            resolve(
                                null
                            );
                        }

                    );

                }
            );
        }


        async function loadAllTextures() {

            wallTexture =
                await loadTexture(
                    "./textures/wall.png"
                );


            floorTexture =
                await loadTexture(
                    "./textures/floor.png"
                );


            ceilingTexture =
                await loadTexture(
                    "./textures/ceiling.png"
                );


            const missing = [];


            if (!wallTexture) {

                missing.push(
                    "textures/wall.png"
                );
            }


            if (!floorTexture) {

                missing.push(
                    "textures/floor.png"
                );
            }


            if (!ceilingTexture) {

                missing.push(
                    "textures/ceiling.png"
                );
            }


            if (
                missing.length > 0
            ) {

                errorBox.style.display =
                    "block";

                errorBox.textContent =
                    "ENVIRONMENT TEXTURE ERROR\n\n" +
                    "Could not load:\n\n" +
                    missing.join("\n") +
                    "\n\n" +
                    "Required structure:\n\n" +
                    "index.html\n" +
                    "three.min.js\n" +
                    "entity.png\n" +
                    "entity.mp3\n" +
                    "textures/\n" +
                    "    wall.png\n" +
                    "    floor.png\n" +
                    "    ceiling.png";
            }

        }


        /* =====================================================
           WORLD
        ===================================================== */

        const worldObjects = [];

        const wallColliders = [];

        const lights = [];


        function addWorld(
            object
        ) {

            scene.add(
                object
            );

            worldObjects.push(
                object
            );

            return object;
        }


        function disposeMaterial(
            material
        ) {

            if (!material)
                return;


            if (
                Array.isArray(
                    material
                )
            ) {

                material.forEach(
                    disposeMaterial
                );

                return;
            }


            if (
                material.map
            ) {

                material.map.dispose();
            }


            material.dispose();
        }


        function clearWorld() {

            for (
                const object
                of worldObjects
            ) {

                scene.remove(
                    object
                );


                object.traverse(
                    child => {

                        if (
                            child.geometry
                        ) {

                            child.geometry.dispose();
                        }


                        if (
                            child.material
                        ) {

                            disposeMaterial(
                                child.material
                            );
                        }

                    }
                );

            }


            worldObjects.length = 0;

            wallColliders.length = 0;

            lights.length = 0;


            if (
                exitLight
            ) {

                scene.remove(
                    exitLight
                );

                exitLight = null;
            }


            exitObject = null;

            entity = null;

        }


        /* =====================================================
           MATERIAL HELPERS
        ===================================================== */

        function wallMaterial(
            width,
            height
        ) {

            if (
                !wallTexture
            ) {

                return new THREE.MeshStandardMaterial({

                    color:
                        0xc2b65d,

                    roughness:
                        0.88,

                    metalness:
                        0

                });

            }


            const tex =
                wallTexture.clone();


            /*
                This prevents the wall PNG from being
                stretched across huge walls.

                Roughly one texture section every
                3 world units.
            */

            const repeatX =
                Math.max(
                    width / 3,
                    0.25
                );


            const repeatY =
                Math.max(
                    height / 3,
                    0.5
                );


            configureTexture(
                tex,
                repeatX,
                repeatY
            );


            return new THREE.MeshStandardMaterial({

                map: tex,

                color:
                    0xffffff,

                roughness:
                    0.88,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });

        }


        function floorMaterial() {

            if (
                !floorTexture
            ) {

                return new THREE.MeshStandardMaterial({

                    color:
                        0x9b8e48,

                    roughness:
                        1

                });

            }


            const tex =
                floorTexture.clone();


            configureTexture(
                tex,
                75,
                68
            );


            return new THREE.MeshStandardMaterial({

                map: tex,

                color:
                    0xffffff,

                roughness:
                    1,

                metalness:
                    0

            });

        }


        function ceilingMaterial() {

            if (
                !ceilingTexture
            ) {

                return new THREE.MeshStandardMaterial({

                    color:
                        0x8f8858,

                    roughness:
                        0.95,

                    side:
                        THREE.DoubleSide

                });

            }


            const tex =
                ceilingTexture.clone();


            /*
                CEILING TILE SCALE

                The ceiling PNG is intentionally
                repeated 9 times more densely.
            */

            configureTexture(
                tex,
                675,
                612
            );


            return new THREE.MeshStandardMaterial({

                map: tex,

                color:
                    0xffffff,

                roughness:
                    0.92,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });

        }


        /* =====================================================
           FLOOR
        ===================================================== */

        function createFloor() {

            const floor =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        300,
                        270
                    ),

                    floorMaterial()

                );


            floor.rotation.x =
                -Math.PI / 2;


            floor.position.y =
                0;


            floor.receiveShadow =
                true;


            addWorld(
                floor
            );

        }


        /* =====================================================
           CEILING
        ===================================================== */

        function createCeiling() {

            const ceiling =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        300,
                        270
                    ),

                    ceilingMaterial()

                );


            ceiling.rotation.x =
                Math.PI / 2;


            ceiling.position.y =
                3.1;


            ceiling.receiveShadow =
                true;


            addWorld(
                ceiling
            );

        }


        /* =====================================================
           WALL
        ===================================================== */

        function createWall(
            x,
            z,
            width,
            depth = 0.32
        ) {

            const height =
                3.1;


            wallColliders.push({

                minX:
                    x -
                    width / 2,

                maxX:
                    x +
                    width / 2,

                minZ:
                    z -
                    depth / 2,

                maxZ:
                    z +
                    depth / 2,

                minY:
                    0,

                maxY:
                    height

            });


            const group =
                new THREE.Group();


            const front =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        width,
                        height
                    ),

                    wallMaterial(
                        width,
                        height
                    )

                );


            front.position.set(
                0,
                height / 2,
                depth / 2
            );


            front.castShadow =
                true;


            front.receiveShadow =
                true;


            group.add(
                front
            );


            const back =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        width,
                        height
                    ),

                    wallMaterial(
                        width,
                        height
                    )

                );


            back.rotation.y =
                Math.PI;


            back.position.set(
                0,
                height / 2,

        function updateLights(
            dt
        ) {

            for (
                const item
                of lights
            ) {

                if (
                    !item.flicker
                ) {
                    continue;
                }


                item.timer -= dt;


                if (
                    item.timer <= 0
                ) {

                    item.timer =
                        0.08 +
                        Math.random() *
                        0.75;


                    /*
                        The fixture remains visible.

                        Only illumination changes.
                    */

                    if (
                        Math.random() <
                        0.25
                    ) {

                        item.light.intensity =
                            item.base *
                            0.28;

                    } else {

                        item.light.intensity =
                            item.base *
                            (
                                0.78 +
                                Math.random() *
                                0.32
                            );

                    }

                }

            }

        }


        /* =====================================================
           COLLISION
        ===================================================== */

        function collides(
            x,
            z
        ) {

            const bottom =
                player.position.y;


            const top =
                bottom +
                PLAYER_HEIGHT;


            for (
                const wall
                of wallColliders
            ) {

                if (
                    top <=
                    wall.minY ||

                    bottom >=
                    wall.maxY
                ) {

                    continue;
                }


                const closestX =
                    Math.max(
                        wall.minX,
                        Math.min(
                            x,
                            wall.maxX
                        )
                    );


                const closestZ =
                    Math.max(
                        wall.minZ,
                        Math.min(
                            z,
                            wall.maxZ
                        )
                    );


                const dx =
                    x -
                    closestX;


                const dz =
                    z -
                    closestZ;


                if (
                    dx * dx +
                    dz * dz <
                    PLAYER_RADIUS *
                    PLAYER_RADIUS
                ) {

                    return true;
                }

            }


            return false;

        }


        function entityHitsWall(
            x,
            z
        ) {

            const radius =
                0.43;


            for (
                const wall
                of wallColliders
            ) {

                const closestX =
                    Math.max(
                        wall.minX,
                        Math.min(
                            x,
                            wall.maxX
                        )
                    );


                const closestZ =
                    Math.max(
                        wall.minZ,
                        Math.min(
                            z,
                            wall.maxZ
                        )
                    );


                const dx =
                    x -
                    closestX;


                const dz =
                    z -
                    closestZ;


                if (
                    dx * dx +
                    dz * dz <
                    radius *
                    radius
                ) {

                    return true;
                }

            }


            return false;

        }


        function lineBlocked(
            x1,
            z1,
            x2,
            z2
        ) {

            const dx =
                x2 -
                x1;


            const dz =
                z2 -
                z1;


            const distance =
                Math.hypot(
                    dx,
                    dz
                );


            const steps =
                Math.ceil(
                    distance /
                    0.35
                );


            for (
                let i = 1;
                i < steps;
                i++
            ) {

                const t =
                    i /
                    steps;


                const x =
                    x1 +
                    dx * t;


                const z =
                    z1 +
                    dz * t;


                if (
                    entityHitsWall(
                        x,
                        z
                    )
                ) {

                    return true;
                }

            }


            return false;

        }

        /* =====================================================
           ENTITY AI
        ===================================================== */

        let entityAngle = 0;


        function updateEntity(
            dt
        ) {

            if (
                !entity ||
                !running ||
                paused ||
                dead
            ) {

                return;
            }


            const dx =
                player.position.x -
                entity.position.x;


            const dz =
                player.position.z -
                entity.position.z;


            const distance =
                Math.hypot(
                    dx,
                    dz
                );


            /*
                ENTITY ALWAYS KNOWS
                EXACTLY WHERE THE PLAYER IS.

                No detection cone.
                No losing the player.
            */

            const desiredAngle =
                Math.atan2(
                    dz,
                    dx
                );


            let difference =
                desiredAngle -
                entityAngle;


            while (
                difference >
                Math.PI
            ) {

                difference -=
                    Math.PI * 2;

            }


            while (
                difference <
                -Math.PI
            ) {

                difference +=
                    Math.PI * 2;

            }


            const turn =
                Math.min(
                    Math.abs(
                        difference
                    ),
                    dt * 5
                );


            entityAngle +=
                Math.sign(
                    difference
                ) *
                turn;


            /*
                Look at the player.

                This makes the PNG remain visible.
            */

            entity.rotation.y =
                Math.atan2(
                    player.position.x -
                    entity.position.x,

                    player.position.z -
                    entity.position.z
                );


            const speed =
                ENTITY_SPEED[
                    difficulty
                ];


            let moveAngle =
                entityAngle;


            /*
                If directly blocked, test several
                alternate directions.

                This lets the entity juke around
                corners rather than permanently
                walking into a wall.
            */

            const candidates = [

                moveAngle,

                moveAngle +
                    Math.PI * 0.25,

                moveAngle -
                    Math.PI * 0.25,

                moveAngle +
                    Math.PI * 0.5,

                moveAngle -
                    Math.PI * 0.5,

                moveAngle +
                    Math.PI * 0.75,

                moveAngle -
                    Math.PI * 0.75,

                moveAngle +
                    Math.PI,

            ];


            let chosenAngle =
                moveAngle;


            let found =
                false;


            for (
                const angle
                of candidates
            ) {

                const testX =
                    entity.position.x +
                    Math.cos(angle) *
                    speed *
                    dt *
                    3;


                const testZ =
                    entity.position.z +
                    Math.sin(angle) *
                    speed *
                    dt *
                    3;


                if (
                    !entityHitsWall(
                        testX,
                        testZ
                    )
                ) {

                    chosenAngle =
                        angle;

                    found =
                        true;

                    break;

                }

            }


            if (
                !found
            ) {

                chosenAngle =
                    moveAngle +
                    Math.PI / 2;

            }


            const moveX =
                Math.cos(
                    chosenAngle
                ) *
                speed *
                dt;


            const moveZ =
                Math.sin(
                    chosenAngle
                ) *
                speed *
                dt;


            if (
                !entityHitsWall(
                    entity.position.x +
                    moveX,
                    entity.position.z
                )
            ) {

                entity.position.x +=
                    moveX;

            }


            if (
                !entityHitsWall(
                    entity.position.x,
                    entity.position.z +
                    moveZ
                )
            ) {

                entity.position.z +=
                    moveZ;

            }


            /*
                Kill distance.
            */

            const killDistance =
                difficulty ===
                "nightmare"
                    ? 1.6
                    : 1.3;


            if (
                distance <
                killDistance
            ) {

                killPlayer(
                    "THE ENTITY FOUND YOU."
                );

            }

        }


        /* =====================================================
           ENTITY AUDIO
        ===================================================== */

        function updateEntityAudio() {

            if (
                !entity ||
                !running ||
                paused ||
                dead
            ) {

                entityAudio.volume =
                    0;

                return;
            }


            const distance =
                Math.hypot(

                    entity.position.x -
                    player.position.x,

                    entity.position.z -
                    player.position.z

                );


            const maximum =
                40;


            if (
                distance >=
                maximum
            ) {

                entityAudio.volume =
                    0;

                return;
            }


            let volume =
                Math.pow(

                    1 -
                    distance /
                    maximum,

                    1.45

                ) *
                0.85;


            if (
                lineBlocked(

                    player.position.x,
                    player.position.z,

                    entity.position.x,
                    entity.position.z

                )
            ) {

                volume *=
                    0.28;

            }


            entityAudio.volume =
                THREE.MathUtils.clamp(
                    volume,
                    0,
                    0.9
                );


            if (
                entityAudio.paused &&
                volume >
                0.015
            ) {

                entityAudio
                    .play()
                    .catch(
                        () => {}
                    );

            }

        }


        /* =====================================================
           INPUT
        ===================================================== */

        const keys = {

            w: false,

            a: false,

            s: false,

            d: false,

            shift: false

        };


        window.addEventListener(
            "keydown",
            event => {

                if (
                    event.code ===
                    "KeyW"
                ) {

                    keys.w =
                        true;

                    event.preventDefault();

                }


                if (
                    event.code ===
                    "KeyS"
                ) {

                    keys.s =
                        true;

                    event.preventDefault();

                }


                if (
                    event.code ===

                ) {

                    keys.a =

                    event.preventDefault();

                }


                if (
                    event.code ===
                    "KeyD"
                ) {

                    keys.d =
                        true;

                    event.preventDefault();

                }


                if (
                    event.code ===
                    "ShiftLeft" ||

                    event.code ===
                    "ShiftRight"
                ) {

                    keys.shift =
                        true;

                }


                if (
                    event.code ===
                    "Escape"

                    if (

        );


        window.addEventListener(

                }

                }


                if (

                    "KeyA"

                }


                if (
                    event.code ===
                    "KeyD"

                    keys.d =
                        false;

                }


                if (
                    event.code ===
                    "ShiftLeft" ||

                    event.code ===
                    "ShiftRight"

                    keys.shift =

                }

            }
        );


        /* =====================================================
           MOUSE LOOK
        ===================================================== */

        document.addEventListener(
            "mousemove",
            event => {

                if (
                    !running ||
                    paused ||
                    dead
                ) {

                    return;
                }


                if (
                    document
                        .pointerLockElement !==
                    document.body
                ) {

                    return;
                }


                yaw -=
                    event.movementX *
                    0.0024;


                pitch -=
                    event.movementY *
                    0.0019;


                pitch =
                    Math.max(
                        -1.45,
                        Math.min(
                            1.45,
                            pitch
                        )
                    );


                player.rotation.y =
                    yaw;


                camera.rotation.x =
                    pitch;

            }
        );


        /* =====================================================
           POINTER LOCK
        ===================================================== */

        function lockPointer() {

            if (
                document.body
                    .requestPointerLock
            ) {

                document.body
                    .requestPointerLock()

                        () => {}

        }


        document.addEventListener(
            "click",
            event => {

                if (
                    event.target.tagName ===
                    "BUTTON"
                ) {

                }

                    running &&

                    !dead
                ) {

                    lockPointer();

                }

        /* =====================================================
           PLAYER MOVEMENT
        ===================================================== */

        function updatePlayer(
            dt
        ) {

            let forward =
                0;


            let strafe =
                0;


            /*
                IMPORTANT:

                W = +1 = FORWARD
                S = -1 = BACKWARD

                This is deliberately written
                explicitly so they cannot become
                accidentally swapped.
            */

            if (
                keys.w
            ) {

                forward +=
                    1;

            }


            if (
                keys.s
            ) {

                forward -=
                    1;

            }


            if (
                keys.d
            ) {

                strafe +=
                    1;

            }


            if (
                keys.a
            ) {

                strafe -=
                    1;

            }


            const length =
                Math.hypot(
                    forward,
                    strafe
                );


            if (
                length >
                0
            ) {

                forward /=
                    length;

                strafe /=
                    length;

            }


            let speed =
                3.7;


            if (
                keys.shift
            ) {

                speed =
                    6.0;

            }


            if (
                difficulty ===
                "easy"
            ) {

                speed =
                    keys.shift
                        ? 6.3
                        : 4.0;

            }


            if (
                difficulty ===
                "hard"
            ) {

                speed =
                    keys.shift
                        ? 6.3
                        : 3.6;

            }


            if (
                difficulty ===
                "nightmare"
            ) {

                speed =
                    keys.shift
                        ? 6.6
                        : 3.5;

            }


            /*
                THREE CAMERA LOOKS DOWN -Z.

                Therefore:

                W moves toward -Z
                S moves toward +Z

                relative to yaw = 0.
            */

            const sin =
                Math.sin(
                    yaw
                );


            const cos =
                Math.cos(
                    yaw
                );


            const dx =
                (
                    strafe *
                    cos +

                    forward *
                    sin

                ) *
                speed *
                dt;


            const dz =
                (
                    strafe *
                    sin -

                    forward *
                    cos

                ) *
                speed *
                dt;


            const nextX =
                player.position.x +
                dx;


            const nextZ =
                player.position.z +
                dz;


            if (
                !collides(
                    nextX,
                    player.position.z
                )
            ) {

                player.position.x =
                    nextX;

            }


            if (
                !collides(
                    player.position.x,
                    nextZ
                )
            ) {

                player.position.z =
                    nextZ;

            }


            /*
                No jump.

                Level 0 is intended to remain
                grounded like the found footage.
            */

            player.position.y =
                0;


            checkExit();

        }


        /* =====================================================
           CAMERA EFFECT
        ===================================================== */

        let cameraTime =
            0;


        function updateCamera(
            dt
        ) {

            cameraTime +=
                dt;


            const moving =
                keys.w ||
                keys.a ||
                keys.s ||
                keys.d;


            const bob =
                moving
                    ? 0.012
                    : 0.004;


            camera.position.x =
                Math.sin(
                    cameraTime *
                    3.2
                ) *
                bob;


            camera.position.y =
                EYE_HEIGHT +
                Math.sin(
                    cameraTime *
                    4.4
                ) *
                bob;


            camera.position.z =
                Math.cos(
                    cameraTime *
                    3.0
                ) *
                bob *
                0.5;


            /*
                Tiny handheld camera rotation.
            */

            camera.rotation.z =
                Math.sin(
                    cameraTime *
                    0.75
                ) *
                0.003;


            /*
                Occasional VHS camera bump.
            */

            if (
                Math.random() <
                0.003
            ) {

                camera.rotation.z +=
                    (
                        Math.random() -
                        0.5
                    ) *
                    0.035;

            }

        }


        /* =====================================================
           EXIT
        ===================================================== */

        function checkExit() {

            if (
                !exitObject ||
                dead
            ) {

                return;
            }


            const distance =
                Math.hypot(

                    player.position.x -
                    exitX,

                    player.position.z -
                    exitZ

                );


            if (
                distance <
                1.8
            ) {

                winGame();

            }

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        let messageTimer =
            0;


        function showMessage(
            text
        ) {

            document.getElementById(
                "message"
            ).textContent =
                text;


            messageTimer =
                2.5;

        }


        function updateMessage(
            dt
        ) {

            if (
                messageTimer <=
                0
            ) {

                return;
            }


            messageTimer -=
                dt;


            if (
                messageTimer <=
                0
            ) {

                document.getElementById(
                    "message"
                ).textContent =
                    "";

            }

        }


        /* =====================================================
           DEATH
        ===================================================== */

        function killPlayer(
            reason =
                "THE BACKROOMS GOT YOU."
        ) {

            if (
                dead ||
                !running
            ) {

                return;
            }


            dead =
                true;


            entityAudio.pause();

            entityAudio.volume =
                0;


            if (
                document.pointerLockElement
            ) {

                document.exitPointerLock();

            }


            const title =
                document.getElementById(
                    "deathTitle"
                );

            title.className =

        /* =====================================================
           WIN
        ===================================================== */

        function winGame() {

            if (
                dead ||
                !running
            ) {

                return;
            }


            dead =
                true;


            entityAudio.pause();

            entityAudio.volume =
                0;


            if (
                document.pointerLockElement

            const title =
                document.getElementById(
                    "deathTitle"

        /* =====================================================
           PAUSE
        ===================================================== */

        function togglePause() {

            if (
                !running ||
                dead
            ) {

                return;
            }


            paused =
                !paused;


            document.getElementById(
                "pause"

                    ? "flex"

            if (

                if (

                }

            }

        }


        /* =====================================================
           MENU RETURN
        ===================================================== */

        function returnToMenu() {

            running =

        /* =====================================================
           START
        ===================================================== */

        let starting =
            false;


        async function startGame() {

            if (
                starting
            ) {

                return;
            }


            starting =
                true;


            /*
                Browser audio permission.
            */

            entityAudio
                .load();


            if (
                !wallTexture ||
                !floorTexture ||
                !ceilingTexture
            ) {

                await loadAllTextures();

            }


            clearWorld();


            /*
                Spawn inside the map.

                The player does NOT start outside
                the outer walls.
            */

            player.position.set(
                -108,
                0,
                -108
            );


            yaw =
                0.35;


            pitch =
                -0.08;


            player.rotation.y =
                yaw;


            camera.rotation.x =
                pitch;


            camera.rotation.z =
                0;


            camera.position.set(
                0,
                EYE_HEIGHT,
                0
            );


            createFloor();

            createCeiling();

            buildOuterWalls();

            buildMap();

            createExit();

            buildLighting();

            await createEntity();


            /*
                Entity begins elsewhere in the maze.
            */

            entity.position.set(
                65,
                0.85,
                -45
            );


            entityAngle =
                Math.atan2(
                    player.position.z -
                    entity.position.z,

                    player.position.x -
                    entity.position.x
                );


            running =
                true;

            paused =

            dead =

            document.getElementById(

            );


            starting =
                false;

                Pointer lock happens after
                the button click.
            */

            );

        /* =====================================================
           DIFFICULTY
        ===================================================== */

        let difficulty =
            "normal";


        function setDifficulty(
            value
        ) {

            difficulty =

            document
                .querySelectorAll(

                )

        /* =====================================================

        let crtEnabled =

        /* =====================================================
           CRT RANDOM GLITCHES

                if (

                            0.04 +

                            ) *

                                0;

                                "none";

                        40 +
                        Math.random() *
                        120
                    );

                if (
                    Math.random() <

                ) {

                    crtTracking.style.top =
                        (
                            Math.random() *

                    );

        /* =====================================================
           MENU IMAGE ROTATION
        ===================================================== */

        const menuImages =
            Array.from(
                document.querySelectorAll(
                    ".menuImage"
                )
            );


        let menuIndex =
            Math.floor(
                Math.random() *
                menuImages.length
            );


        function showRandomMenuImage() {

            menuImages.forEach(
                image => {

                    image.classList.remove(
                        "active"
                    );

                }
            );


            /*
                Pick a random image,
                preferably not the current one.
            */

            let next =
                Math.floor(
                    Math.random() *
                    menuImages.length
                );


            if (
                menuImages.length >
                1
            ) {

                while (
                    next ===
                    menuIndex
                ) {

                    next =
                        Math.floor(
                            Math.random() *
                            menuImages.length
                        );

                }

            }


            menuIndex =
                next;


            const selected =
                menuImages[
                    menuIndex
                ];


            selected.classList.add(
                "active"
            );

        }


        showRandomMenuImage();


        setInterval(
            () => {

                showRandomMenuImage();

            },
            60000
        );


        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );


                renderer.setPixelRatio(
                    Math.min(
                        window.devicePixelRatio ||
                        1,
                        1.5
                    )
                );

            }
        );


        /* =====================================================
           TIMER
        ===================================================== */

        let recordingTime =
            0;


        function updateTimer(
            dt
        ) {

            if (
                !running ||
                paused ||
                dead
            ) {

                return;
            }


            recordingTime +=
                dt;


            const total =
                Math.floor(
                    recordingTime
                );


            const hours =
                Math.floor(
                    total /
                    3600
                );


            const minutes =
                Math.floor(
                    (
                        total %
                        3600
                    ) /
                    60
                );


            const seconds =
                total %
                60;


            const format =
                number =>
                    String(
                        number
                    ).padStart(
                        2,
                        "0"
                    );


            document.getElementById(
                "tapeTime"
            ).textContent =

                format(hours) +
                ":" +
                format(minutes) +
                ":" +
                format(seconds);

        }


        /* =====================================================
           GAME LOOP
        ===================================================== */

        const clock =
            new THREE.Clock();


        function animate() {

            requestAnimationFrame(
                animate
            );


            const dt =
                Math.min(
                    clock.getDelta(),
                    0.05
                );


            if (
                running &&
                !paused &&
                !dead
            ) {

                updatePlayer(
                    dt
                );


                updateEntity(
                    dt
                );


                updateLights(
                    dt
                );


                updateCamera(
                    dt
                );


                updateEntityAudio();


                updateMessage(
                    dt
                );


                updateTimer(
                    dt
                );

            } else {

                updateEntityAudio();

            }


            renderer.render(
                scene,
                camera
            );

        }


        /* =====================================================
           INITIALIZE
        ===================================================== */

        async function initialize() {

            /*
                Load local textures immediately.

                The game can still display the menu
                while they load.
            */

            await loadAllTextures();


            animate();

        }


        initialize();

    </script>
