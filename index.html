/* =========================================================

========================================================= */

#menu {

}

.menuImage {

    height: 100%;

        opacity 2s ease;

}

.menuImage.active {

}

.menuDark {

}

.menuContent {

/* =========================================================
   CRT / SECURITY CAMERA EFFECT
========================================================= */

.crt {

    position: absolute;

    inset: 0;

    pointer-events: none;

}


/* horizontal scanlines */

.crtScanlines {

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            transparent 2px,
            transparent 4px
        );

    opacity: .75;

}


/* darker CRT lines */

.crtDarkLines {

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 7px,
            rgba(0,0,0,.14) 8px
        );

}


/* screen flicker */

.crtFlicker {

    position: absolute;

    inset: 0;

    background:
        rgba(255,255,255,.025);

    animation:
        screenFlicker
        .12s
        infinite;

}

@keyframes screenFlicker {

    0% {
        opacity: .2;
    }

    25% {
        opacity: .55;
    }

    50% {
        opacity: .15;
    }

    75% {
        opacity: .45;
    }

    100% {
        opacity: .2;
    }

}


/* noise */

.crtNoise {

    position: absolute;

    inset: -20%;

    opacity: .075;

    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            #fff 0px,
            #fff 1px,
            transparent 1px,
            transparent 4px
        );

    background-size:
        5px 5px;

    animation:
        noiseMove
        .18s
        steps(2)
        infinite;

}

@keyframes noiseMove {

    0% {
        transform:
            translate(0,0);
    }

    25% {
        transform:
            translate(-2%,1%);
    }

    50% {
        transform:
            translate(1%,-2%);
    }

    75% {
        transform:
            translate(2%,2%);
    }

    100% {
        transform:
            translate(0,0);
    }

}


/* vignette */

.crtVignette {

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 28%,
            rgba(0,0,0,.18) 55%,
            rgba(0,0,0,.78) 100%

}


/* CRT curved dark edges */

.crtEdges {

    position: absolute;

    inset: 0;

    box-shadow:
        inset 0 0 100px

        inset 0 0 30px

}


/* slight color separation */

.crtChromatic {

    position: absolute;

    inset: 0;

        linear-gradient(

            rgba(255,0,0,.025),

}


/* occasional tracking line */

.crtTracking {

    position: absolute;

    left: 0;
    right: 0;

    height: 2px;

    top: 45%;

    background:
        rgba(255,255,255,.08);

    box-shadow:
        0 0 12px
        rgba(255,255,255,.08);

    animation:

        infinite;

}

@keyframes tracking {

    0% {
        top: -5%;
    }

    100% {

    }

}

<!-- =========================================================
     LOCAL THREE.JS
     
     IMPORTANT:
     three.min.js MUST be beside index.html
========================================================= -->

<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   THREE CHECK
========================================================= */

if (
    typeof THREE === "undefined"
) {

    const error =
        document.getElementById(
            "error"
        );

    error.style.display =
        "block";

    error.textContent =
        "THREE.JS FAILED TO LOAD.\n\n" +

        "This version expects:\n\n" +

        "index.html\n" +
        "three.min.js\n\n" +

        "to be in the SAME folder.\n\n" +

        "Your environment textures should be:\n\n" +

        "textures/wall.png\n" +
        "textures/floor.png\n" +
        "textures/ceiling.png\n\n" +

        "Open the GitHub Pages site again after committing both files.";

    throw new Error(
        "Local Three.js could not be loaded."
    );

}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x080806
    );


scene.fog =
    new THREE.FogExp2(
        0x17150c,
        0.018
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        window.innerWidth /
        window.innerHeight,
        0.05,
        400
    );


camera.rotation.order =
    "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.35
    )
);


if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

}


renderer.toneMapping =
    THREE.NoToneMapping;


renderer.toneMappingExposure =
    1;


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */


/*
    VERY DARK GLOBAL LIGHT.

    The fluorescent fixtures provide
    most of the actual illumination.
*/

const ambient =
    new THREE.AmbientLight(
        0x39382e,
        0.035
    );

scene.add(
    ambient
);


const hemisphere =
    new THREE.HemisphereLight(
        0x29291f,
        0x020201,
        0.05
    );

scene.add(
    hemisphere
);


/* =========================================================
   TEXTURE LOADING
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


let wallTexture = null;

let floorTexture = null;

let ceilingTexture = null;


function prepareTexture(
    texture
) {

    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.magFilter =
        THREE.LinearFilter;


    texture.minFilter =
        THREE.LinearMipmapLinearFilter;


    texture.anisotropy =
        Math.min(
            renderer
                .capabilities
                .getMaxAnisotropy(),

            8
        );


    texture.needsUpdate =
        true;


    return texture;

}


function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            texture
                        )
                    );

                },

                undefined,

                error => {

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    resolve(
                        null
                    );

                }

            );

        }
    );

}


async function loadTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );


    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );


    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );


    const missing = [];


    if (!wallTexture) {

        missing.push(
            "textures/wall.png"
        );

    }


    if (!floorTexture) {

        missing.push(
            "textures/floor.png"
        );

    }


    if (!ceilingTexture) {

        missing.push(
            "textures/ceiling.png"
        );

    }


    if (
        missing.length > 0
    ) {

        const error =
            document.getElementById(
                "error"
            );


        error.style.display =
            "block";


        error.textContent =
            "ENVIRONMENT TEXTURE ERROR\n\n" +

            "Missing or failed to load:\n\n" +

            missing.join("\n") +

            "\n\n" +

            "Expected structure:\n\n" +

            "index.html\n" +
            "three.min.js\n" +
            "entity.png\n" +
            "entity.mp3\n" +
            "textures/\n" +
            "    wall.png\n" +
            "    floor.png\n" +
            "    ceiling.png";

    }

}


/* =========================================================
   WORLD STORAGE
========================================================= */

const worldObjects = [];

const wallColliders = [];

const deathHoles = [];

const fluorescentLights = [];


function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;

}


/* =========================================================
   MATERIAL HELPERS
========================================================= */


/*
    IMPORTANT:

    Environment textures ARE NOT MeshBasicMaterial.

    This allows the fluorescent lights to illuminate
    the walls, floor and ceiling naturally.

    ENTITY is the only PNG using MeshBasicMaterial.
*/


function createWallMaterial(
    width,
    height
) {

    if (
        !wallTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0xb4aa5d,

            roughness:
                1,

            metalness:
                0

        });

    }


    const texture =
        wallTexture.clone();


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    const imageWidth =
        texture.image.width ||
        1;


    const imageHeight =
        texture.image.height ||
        1;


    const aspect =
        imageWidth /
        imageHeight;


    const naturalWidth =
        height *
        aspect;


    texture.repeat.set(

        Math.max(
            width /
            naturalWidth,

            0.01
        ),

        1

    );


    texture.needsUpdate =
        true;


    return new THREE.MeshStandardMaterial({

        map:
            texture,

        color:
            0xffffff,

        roughness:
            0.93,

        metalness:
            0,

        side:
            THREE.FrontSide

    });

}


function createFloorMaterial() {

    if (
        !floorTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0x756b3e,

            roughness:
                1

        });

    }


    const texture =
        floorTexture.clone();


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        80,
        80
    );


    texture.needsUpdate =
        true;


    return new THREE.MeshStandardMaterial({

        map:
            texture,

        color:
            0xffffff,

        roughness:
            1,

        metalness:
            0

    });

}


function createCeilingMaterial() {

    if (
        !ceilingTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0x68623f,

            roughness:
                1,

            side:
                THREE.DoubleSide

        });

    }


    const texture =
        ceilingTexture.clone();


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        80,
        80
    );


    texture.needsUpdate =
        true;


    return new THREE.MeshStandardMaterial({

        map:
            texture,

        color:
            0xffffff,

        roughness:
            1,

        metalness:
            0,

        side:
            THREE.DoubleSide

    });

}


/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                260,
                240
            ),

            createFloorMaterial()

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    floor.receiveShadow =
        true;


    addWorldObject(
        floor
    );

}


/* =========================================================
   CEILING
========================================================= */

function createCeiling() {

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                260,
                240
            ),

            createCeilingMaterial()

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        3.1;


    ceiling.receiveShadow =
        true;


    addWorldObject(
        ceiling
    );

}


/* =========================================================
   WALL
========================================================= */


/*
    THIS IS THE BIG CHANGE.

    Walls are now actual BOX GEOMETRY.

    That means the texture is visible regardless
    of which direction the player approaches from.
*/

function createWall(
    x,
    z,
    width,
    depth = 0.32
) {

    const height =
        3.1;


    const material =
        createWallMaterial(
            width,
            height
        );


    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                width,

                height,

                depth

            ),

            material

        );


    wall.position.set(

        x,

        height / 2,

        z

    );


    wall.castShadow =
        true;


    wall.receiveShadow =
        true;


    addWorldObject(
        wall
    );


    wallColliders.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2,

        minY:
            0,

        maxY:
            height

    });

}


/* =========================================================
   BACKROOMS MAP
========================================================= */


/*
    The map deliberately uses:

    - long corridors
    - repeating yellow walls
    - strange turns
    - rooms inside rooms
    - dead ends
    - narrow passages
    - larger open areas
    - claustrophobic sections

    There are NO outer walls leading directly
    into the void.

    The outside boundary is made from normal
    Backrooms wall segments.
*/


function buildMap() {


    /* =====================================================
       OUTER BOUNDARY
    ===================================================== */

    createWall(
        -120,
        -90,
        50
    );

    createWall(
        -70,
        -90,
        45
    );

    createWall(
        -25,
        -90,
        45
    );

    createWall(
        20,
        -90,
        45
    );

    createWall(
        65,
        -90,
        45
    );

    createWall(
        110,
        -90,
        45
    );

function createHoleRoom() {

    const startX =
        -55;

    const startZ =
        60;

    const columns =
        14;

    const rows =
        6;

    const spacing =
        4;


    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            if (
                (x + z) % 4 !== 0
            ) {

                continue;

            }


            const px =
                startX +
                x *
                spacing;


            const pz =
                startZ +
                z *
                spacing;


            const hole =
                new THREE.Mesh(

                    new THREE.CircleGeometry(
                        1.25,
                        24
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x020202,

                        side:
                            THREE.DoubleSide

                    })

                );


            hole.rotation.x =
                -Math.PI / 2;


            hole.position.set(

                px,

                0.008,

                pz

            );


            addWorldObject(
                hole
            );


            deathHoles.push({

                x:
                    px,

                z:
                    pz,

                radius:
                    1.18

            });

        }

    }

}

function updateLights(
    dt
) {

    for (
        const item
        of fluorescentLights
    ) {

        if (
            !item.flicker
        ) {

            continue;

        }


        item.timer -=
            dt;


        if (
            item.timer <= 0
        ) {

            item.timer =
                .04 +
                Math.random() *
                .55;


            /*
                NEVER turn the light off.

                Instead, temporarily lower
                its brightness.
            */

            const multiplier =
                Math.random() <
                .35

                    ? .30 +
                      Math.random() *
                      .25

                    : .78 +
                      Math.random() *
                      .25;


            item.light.intensity =
                item.base *
                multiplier;


            item.fixture
                .material
                .emissiveIntensity =
                1.8 +
                multiplier *
                1.2;

        }

    }

}

/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;


    const top =
        bottom +
        PLAYER_HEIGHT;


    for (
        const wall
        of wallColliders
    ) {

        if (
            top <=
            wall.minY ||

            bottom >=
            wall.maxY
        ) {

            continue;

        }


        const closestX =
            Math.max(

                wall.minX,

                Math.min(
                    x,
                    wall.maxX
                )

            );


        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(
                    z,
                    wall.maxZ
                )

            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   HOLES
========================================================= */

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;


        const dz =
            player.position.z -
            hole.z;


        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;

        }

    }


    return false;

}

/* =========================================================
   ENTITY WALL TEST
========================================================= */

function entityHitsWall(
    x,
    z
) {

    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(

                wall.minX,

                Math.min(
                    x,
                    wall.maxX
                )

            );


        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(
                    z,
                    wall.maxZ
                )

            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            .42 *
            .42
        ) {

            return true;

        }

    }


    return false;

}


function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 -
        x1;


    const dz =
        z2 -
        z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance /
            .3
        );


    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i /
            steps;


        if (
            entityHitsWall(

                x1 +
                dx * t,

                z1 +
                dz * t

            )
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;

    }


    const settings =
        SETTINGS[
            difficulty
        ];


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    lastSeen +=
        dt;


    const visible =
        distance <
        settings.detection &&

        !blocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z

        );


    let targetX = 0;

    let targetZ = 0;


    if (
        visible
    ) {

        lastKnown.set(

            player.position.x,
            player.position.z

        );


        lastSeen =
            0;


        targetX =
            dx /
            Math.max(
                distance,
                .001
            );


        targetZ =
            dz /
            Math.max(
                distance,
                .001
            );

    }

    else if (
        lastSeen < 3.2
    ) {

        const lx =
            lastKnown.x -
            entity.position.x;


        const lz =
            lastKnown.y -
            entity.position.z;


        const len =
            Math.hypot(
                lx,
                lz
            );


        if (
            len > .1
        ) {

            targetX =
                lx / len;

            targetZ =
                lz / len;

        }

    }

    else {

        wanderTimer -=
            dt;


        if (
            wanderTimer <= 0
        ) {

            wanderTimer =
                .5 +
                Math.random() *
                1.8;


            wanderAngle =
                Math.random() *
                Math.PI *
                2;

        }


        targetX =
            Math.cos(
                wanderAngle
            );


        targetZ =
            Math.sin(
                wanderAngle
            );

    }


    const targetAngle =
        Math.atan2(
            targetZ,
            targetX
        );


    const currentAngle =
        Math.atan2(

            entityDirection.y,

            entityDirection.x

        );


    let difference =
        targetAngle -
        currentAngle;


    while (
        difference >
        Math.PI
    ) {

        difference -=
            Math.PI * 2;

    }


    while (
        difference <
        -Math.PI
    ) {

        difference +=
            Math.PI * 2;

    }


    difference =
        THREE.MathUtils.clamp(

            difference,

            -3.4 * dt,

            3.4 * dt

        );


    const angle =
        currentAngle +
        difference;


    entityDirection.x =
        Math.cos(
            angle
        );


    entityDirection.y =
        Math.sin(
            angle
        );


    entityVelocity.x =
        THREE.MathUtils.lerp(

            entityVelocity.x,

            entityDirection.x *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )

        );


    entityVelocity.y =
        THREE.MathUtils.lerp(

            entityVelocity.y,

            entityDirection.y *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )

        );


    const moveX =
        entityVelocity.x *
        dt;


    const moveZ =
        entityVelocity.y *
        dt;


    const nextX =
        entity.position.x +
        moveX;


    const nextZ =
        entity.position.z +
        moveZ;


    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    }

    else {

        entityVelocity.x =
            0;

        wanderAngle +=
            Math.PI / 2;

    }


    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    }

    else {

        entityVelocity.y =
            0;

        wanderAngle +=
            Math.PI / 2;

    }


    /*
        Billboard entity toward player.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );


    const killDistance =
        difficulty ===
        "nightmare"

            ? 1.55

            : 1.25;


    if (
        distance <
        killDistance
    ) {

        killPlayer();

    }

}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;

    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );


    const maxDistance =
        34;


    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;

    }


    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.6

        ) *
        .9;


    if (
        blocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z

        )
    ) {

        volume *=
            .2;

    }


    entityAudio.volume =
        THREE.MathUtils.clamp(

            volume,

            0,

            .9

        );


    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );

    }

}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;

    }


    let forward =
        0;


    let side =
        0;


    /*
        W = +forward

        S = -forward
    */

    if (
        keys.w
    ) {

        forward +=
            1;

    }


    if (
        keys.s
    ) {

        forward -=
            1;

    }


    if (
        keys.d
    ) {

        side +=
            1;

    }


    if (
        keys.a
    ) {

        side -=
            1;

    }


    const length =
        Math.hypot(
            forward,
            side
        );


    if (
        length > 0
    ) {

        forward /=
            length;

        side /=
            length;

    }


    let speed =
        keys.shift
            ? 5.9
            : 3.5;


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.1
                : 3.8;

    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.3
                : 3.4;

    }


    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.5
                : 3.25;

    }


    /*
        Correct forward vector.

        Camera/player faces -Z
        when yaw = 0.

        Therefore:

        W -> -Z
        S -> +Z
    */

    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    const dx =
        (
            side * cos +
            forward * sin
        ) *
        speed *
        dt;


    const dz =
        (
            -side * sin -
            forward * cos
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        dx;


    const nextZ =
        player.position.z +
        dz;


    if (
        !collides(

            nextX,

            player.position.z

        )
    ) {

        player.position.x =
            nextX;

    }


    if (
        !collides(

            player.position.x,

            nextZ

        )
    ) {

        player.position.z =
            nextZ;

    }


    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;

    }


    jumpPressed =
        false;


    velocityY -=
        20 *
        dt;


    player.position.y +=
        velocityY *
        dt;


    if (
        player.position.y <=
        0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;

    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;

    }


    checkExit();

}


/* =========================================================
   FALL INTRO
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;


    const progress =
        Math.min(

            fallTimer /
            FALL_DURATION,

            1

        );


    const eased =
        1 -
        Math.pow(

            1 -
            progress,

            3

        );


    player.position.y =
        17 -
        17 *
        eased;


    camera.position.y =
        EYE_HEIGHT;


    camera.rotation.x =
        THREE.MathUtils.lerp(

            -.32,

            0,

            Math.min(

                progress *
                1.3,

                1

            )

        );


    camera.rotation.z =
        Math.sin(

            progress *
            Math.PI *
            9

        ) *
        .025;


    if (
        progress >=
        1
    ) {

        fallingIntoLevel =
            false;


        player.position.y =
            0;


        camera.position.set(

            0,

            EYE_HEIGHT,

            0

        );


        camera.rotation.set(
            0,
            0,
            0
        );


        document.body
            .requestPointerLock();

    }

}


/* =========================================================
   CAMERA BOB
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;

    }


    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const amount =
        moving
            ? .009
            : .0025;


    camera.position.x =
        Math.sin(
            cameraTime *
            3.4
        ) *
        amount;


    camera.position.y =
        EYE_HEIGHT +

        Math.sin(
            cameraTime *
            4.1
        ) *
        amount;


    camera.position.z =
        Math.cos(
            cameraTime *
            3.1
        ) *
        amount *
        .55;


    /*
        Tiny handheld security-camera
        instability.
    */

    camera.rotation.z =
        Math.sin(
            cameraTime *
            .9
        ) *
        .003;


    if (
        Math.random() <
        .003
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) *
            .035;


        camera.position.y +=
            (
                Math.random() -
                .5
            ) *
            .025;


        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) *
            .025;

    }

}

/* =========================================================
   WORLD CLEAR
========================================================= */

function clearWorld() {

    while (
        worldObjects.length
    ) {

        const object =
            worldObjects.pop();


        scene.remove(
            object
        );


        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();

                }


                if (
                    child.material
                ) {

                    const materials =
                        Array.isArray(
                            child.material
                        )

                            ? child.material

                            : [
                                child.material
                            ];


                    for (
                        const material
                        of materials
                    ) {

                        if (
                            material.map
                        ) {

                            material.map.dispose();

                        }


                        material.dispose();

                    }

                }

            }
        );

    }


    for (
        const item
        of fluorescentLights
    ) {

        scene.remove(
            item.light
        );

    }


    fluorescentLights.length =
        0;


    wallColliders.length =
        0;


    deathHoles.length =
        0;


    if (
        exitLight
    ) {

        scene.remove(
            exitLight
        );

        exitLight =
            null;

    }


    exitObject =
        null;


    entity =
        null;

}

        format(minutes) +
        ":" +
        format(seconds);

}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(

            clock.getDelta(),

            .05

        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        updateLights(
            dt
        );


        updateCamera(
            dt
        );


        updateEntityAudio();


        updateMessage(
            dt
        );


        updateTimer(
            dt
        );

    }

    else {

        updateEntityAudio();

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

loadTextures();

animate();

</script>
