<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>THE BACKROOMS</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:rgba(0,0,0,.94);
}

#pause,
#death{
    display:none;
}

h1{
    margin:0 0 12px;
    color:#d8cb61;
    font-size:46px;
    letter-spacing:8px;
    text-shadow:0 0 25px #000;
}

.subtitle{
    color:#aaa;
    margin-bottom:22px;
}

.difficultyTitle{
    color:#999;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:7px;
}

.difficulty{
    display:flex;
    gap:5px;
    margin-bottom:15px;
}

button{
    width:320px;
    padding:14px;
    margin:5px;
    border:1px solid #666;
    background:#151515;
    color:#eee;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#403b19;
    border-color:#d8ca62;
}

.difficulty button{
    width:95px;
    padding:10px 4px;
    margin:0;
    font-size:11px;
}

.difficulty button.selected{
    background:#5a521e;
    border-color:#e1d36b;
}

.controls{
    margin-top:18px;
    color:#888;
    text-align:center;
    line-height:1.8;
    font-size:12px;
}

#crosshair{
    position:fixed;
    z-index:20;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    margin:-2px;
    border:1px solid rgba(255,255,255,.8);
    border-radius:50%;
    pointer-events:none;
}

#hud{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:20;
    color:#fff;
    font-size:13px;
    text-shadow:2px 2px 6px #000;
}

#difficultyHud{
    margin-top:4px;
    color:#aaa;
    font-size:11px;
}

#rec{
    position:fixed;
    top:18px;
    right:18px;
    z-index:20;
    color:#fff;
    font:12px monospace;
    text-shadow:2px 2px 5px #000;
}

#recDot{
    display:inline-block;
    width:8px;
    height:8px;
    margin-right:5px;
    border-radius:50%;
    background:red;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%,45%{opacity:1}
    46%,100%{opacity:.25}
}

#film{
    position:fixed;
    inset:0;
    z-index:15;
    pointer-events:none;
    opacity:.09;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            transparent 2px,
            transparent 5px
        );
}

#vignette{
    position:fixed;
    inset:0;
    z-index:16;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0,0,0,.08) 70%,
            rgba(0,0,0,.48) 100%
        );
}

#death{
    background:
        radial-gradient(
            ellipse at center,
            rgba(70,0,0,.45),
            rgba(0,0,0,.98)
        );
}

.deathTitle{
    color:#b00000;
    font-size:55px;
    letter-spacing:9px;
    text-shadow:0 0 30px #000;
}

.deathText{
    color:#aaa;
    margin:8px 0 22px;
}

#error{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:500;
    display:none;
    padding:15px;
    background:#430000;
    border:1px solid red;
    color:#fff;
    font:13px monospace;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<!-- MENU -->

<div id="menu" class="overlay">

    <h1>THE BACKROOMS</h1>

    <div class="subtitle">
        There is no exit.
    </div>

    <div class="difficultyTitle">
        ENTITY DIFFICULTY
    </div>

    <div class="difficulty">
        <button id="easyBtn">EASY</button>
        <button id="normalBtn" class="selected">NORMAL</button>
        <button id="hardBtn">HARD</button>

    </div>

    <button id="startBtn">
        ENTER LEVEL 0
    </button>

    <div class="controls">
        WASD — Move<br>

</div>


<!-- PAUSE -->

<div id="pause" class="overlay">

    <h1>PAUSED</h1>

    <button id="resumeBtn">
        RESUME
    </button>

    <button id="restartBtn">
        RESTART
    </button>

    <button id="menuBtn">
        MAIN MENU
    </button>

</div>


<!-- DEATH -->

<div id="death" class="overlay">

    <div class="deathTitle">
        YOU DIED
    </div>

    <div class="deathText">
        THE ENTITY FOUND YOU
    </div>

    <button id="retryBtn">
        RETRY
    </button>

    <button id="deathMenuBtn">
        MAIN MENU
    </button>

</div>


<div id="crosshair"></div>

<div id="hud">
    LEVEL 0
    <div id="difficultyHud">NORMAL</div>
</div>

<div id="rec">
    <span id="recDot"></span>REC
</div>

<div id="film"></div>
<div id="vignette"></div>

<div id="error"></div>


<script src="./three.min.js"></script>

<script>
"use strict";


/* =========================================================
   FILES
========================================================= */

const TEXTURES = {
    floor:"./textures/floor.png",
    wall:"./textures/wall.png",
    ceiling:"./textures/ceiling.png"
};

const ENTITY_IMAGE =
    "./entity.png";

const ENTITY_AUDIO =
    "./entity.mp3";


/* =========================================================
   THREE
========================================================= */

if(typeof THREE === "undefined"){
    showError(
        "three.min.js failed to load."
    );
    throw new Error(
        "Three.js missing"
    );
}

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .03,
        250
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

/*
   MUCH SHORTER PLAYER

   Ceiling = 3.1
   Player eyes = 1.05

   This makes the player clearly
   shorter than the lights/ceiling.
*/

const PLAYER_HEIGHT = 1.35;
const EYE_HEIGHT = 1.02;
const PLAYER_RADIUS = .28;

const WALK_SPEED = 3.8;
const SPRINT_SPEED = 6.5;

const GRAVITY = 20;
const JUMP_SPEED = 6.3;

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    EYE_HEIGHT,
    0
);

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let grounded = true;


/* =========================================================
   STATE
========================================================= */

let running = false;
let paused = false;
let dead = false;

let difficulty = "normal";

let entity = null;
let entityTexture = null;

let entitySpeed = 5.8;

let worldObjects = [];
let walls = [];

let wanderTimer = 0;
let wanderAngle = 0;

let entityStuckTime = 0;


/* =========================================================
   DIFFICULTIES
========================================================= */

const DIFFICULTIES = {

    easy:{
        name:"EASY",
        speed:1.5,
        chase:false
    },

    normal:{
        name:"NORMAL",
        speed:5.8,
        chase:true
    },

    hard:{
        name:"HARD",
        speed:7.5,
        chase:true
    },

    impossible:{
        name:"IMPOSSIBLE",
        speed:9.2,
        chase:true
    }

};


/* =========================================================
   INPUT
========================================================= */

const keys = {};
let jumpPressed = false;

window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

        if(e.code === "Space"){

            e.preventDefault();

            if(!e.repeat){
                jumpPressed = true;
            }

        }

        if(
            e.key === "Escape" ||
            e.key.toLowerCase() === "p"
        ){

            if(
                running &&
                !dead
            ){

                togglePause();

            }

        }

    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   MOUSE
========================================================= */

window.addEventListener(
    "mousemove",
    e => {

        if(
            document.pointerLockElement !==
            document.body
        ){
            return;
        }

        yaw -=
            e.movementX*.0021;

        pitch -=
            e.movementY*.0021;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.48,
                1.48
            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);


/* =========================================================
   TEXTURE LOADING
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


function loadTexture(path){

    return new Promise(
        (resolve,reject) => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    texture.colorSpace =
                        THREE.SRGBColorSpace;

                    texture.wrapS =
                        THREE.RepeatWrapping;

                    texture.wrapT =
                        THREE.RepeatWrapping;

                    texture.anisotropy =
                        renderer
                        .capabilities
                        .getMaxAnisotropy();

                    resolve(texture);

                },

                undefined,

                () => {

                    reject(
                        new Error(
                            "Could not load " +
                            path
                        )
                    );

                }

            );

        }
    );

}


/* =========================================================
   MATERIALS
========================================================= */

let floorMaterial;
let wallMaterial;
let ceilingMaterial;


async function createMaterials(){

    try{

        const [
            floorTexture,
            wallTexture,
            ceilingTexture
        ] = await Promise.all([

            loadTexture(
                TEXTURES.floor
            ),

            loadTexture(
                TEXTURES.wall
            ),

            loadTexture(
                TEXTURES.ceiling
            )

        ]);


        /*
            FLOOR

            Smaller repeat makes the carpet
            look like a real large carpet,
            rather than one gigantic image.
        */

        floorTexture.repeat.set(
            18,
            18
        );


        /*
            WALL

            Your wall PNG is already a
            complete wallpaper texture.
        */

        wallTexture.repeat.set(
            12,
            4
        );


        /*
            CEILING

            Repeat across the entire ceiling.
        */

        ceilingTexture.repeat.set(
            14,
            12
        );


        /*
            Use MeshStandardMaterial for
            realistic environmental lighting.
        */

        floorMaterial =
            new THREE.MeshStandardMaterial({

                map:floorTexture,

                color:0xffffff,

                roughness:1,

                metalness:0,

                side:THREE.DoubleSide

            });


        wallMaterial =
            new THREE.MeshStandardMaterial({

                map:wallTexture,

                color:0xffffff,

                roughness:.95,

                metalness:0,

                side:THREE.DoubleSide

            });


        /*
            Your ceiling image is white.

            The color multiplier gives it
            the classic Backrooms yellow.
        */

        ceilingMaterial =
            new THREE.MeshStandardMaterial({

                map:ceilingTexture,

                color:0xffe991,

                roughness:1,

                metalness:0,

                side:THREE.DoubleSide

            });

        return true;

    }
    catch(error){

        showError(
            error.message +
            "\n\nMake sure these files exist:\n" +
            "./textures/floor.png\n" +
            "./textures/wall.png\n" +
            "./textures/ceiling.png"
        );

        return false;

    }

}


/* =========================================================
   OBJECT HELPERS
========================================================= */

function addObject(
    object
){

    scene.add(object);

    worldObjects.push(object);

    return object;

}


function clearWorld(){

    for(
        const object of worldObjects
    ){

        scene.remove(object);

        if(object.geometry){
            object.geometry.dispose();
        }

    }

    worldObjects = [];
    walls = [];

    entity = null;

}


/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            wallMaterial

        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    addObject(mesh);


    walls.push({

        minX:x-width/2,
        maxX:x+width/2,

        minY:y-height/2,
        maxY:y+height/2,

        minZ:z-depth/2,
        maxZ:z+depth/2

    });

}


/* =========================================================
   FLOOR
========================================================= */

function addFloor(){

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            floorMaterial

        );

    floor.rotation.x =
        -Math.PI/2;

    floor.position.y =
        0;

    floor.receiveShadow =
        true;

    addObject(floor);

}


/* =========================================================
   CEILING
========================================================= */

function addCeiling(){

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            ceilingMaterial

        );

    /*
        IMPORTANT:

        DoubleSide is also enabled on
        the material, so the ceiling
        cannot disappear because its
        normal is facing the wrong way.
    */

    ceiling.rotation.x =
        Math.PI/2;

    ceiling.position.y =
        3.1;

    ceiling.receiveShadow =
        true;

    addObject(ceiling);

}


/* =========================================================
   FLUORESCENT LIGHT
========================================================= */

function addLight(
    x,
    z
){

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.7,
                .06,
                .45
            ),

            new THREE.MeshBasicMaterial({

                color:0xffffdc

            })

        );

    fixture.position.set(
        x,
        3.02,
        z
    );

    addObject(fixture);


    const light =
        new THREE.PointLight(
            0xffedb0,
            .85,
            15
        );

    light.position.set(
        x,
        2.85,
        z
    );

    light.castShadow = true;

    light.shadow.mapSize.width =
        512;

    light.shadow.mapSize.height =
        512;

    addObject(light);

}


/* =========================================================
   BUILD LEVEL
========================================================= */

async function buildLevel(){

    const materialsLoaded =
        await createMaterials();

    if(!materialsLoaded){
        return false;
    }


    clearWorld();


    scene.background =
        new THREE.Color(
            0x756c30
        );


    scene.fog =
        new THREE.Fog(
            0x756c30,
            55,
            180
        );


    /*
        Strong enough lighting to make
        the actual textures visible.
    */

    addObject(
        new THREE.HemisphereLight(
            0xfff0b0,
            0x35301d,
            2.0
        )
    );

    addObject(
        new THREE.AmbientLight(
            0xffe8a0,
            .75
        )
    );


    addFloor();
    addCeiling();


    const H = 3.1;


    /* OUTER WALLS */

    addWall(
        180,H,1,
        0,H/2,-80
    );

    addWall(
        180,H,1,
        0,H/2,80
    );

    addWall(
        1,H,160,
        -90,H/2,0
    );

    addWall(
        1,H,160,
        90,H/2,0
    );


    /* LARGE INTERNAL ROOMS */

    addWall(
        1,H,95,
        -55,H/2,0
    );

    addWall(
        1,H,95,
        55,H/2,0
    );

    addWall(
        75,H,1,
        0,H/2,-52
    );

    addWall(
        75,H,1,
        0,H/2,52
    );


    /* RANDOM INTERNAL WALLS */

    addWall(
        35,H,1,
        -25,H/2,-25
    );

    addWall(
        35,H,1,
        25,H/2,25
    );

    addWall(
        1,H,30,
        -42,H/2,27
    );

    addWall(
        1,H,30,
        42,H/2,-27
    );


    /* CLAUSTROPHOBIC SECTION */

    for(
        let i=0;
        i<7;
        i++
    ){

        addWall(
            .8,
            H,
            25,
            -35+i*5,
            H/2,
            0
        );

    }


    /* MORE SMALL AREAS */

    addWall(
        18,H,1,
        -68,H/2,-35
    );

    addWall(
        1,H,20,
        -77,H/2,-25
    );

    addWall(
        20,H,1,
        65,H/2,38
    );

    addWall(
        1,H,20,
        55,H/2,48
    );


    /* LIGHT GRID */

    for(
        let x=-80;
        x<=80;
        x+=10
    ){

        for(
            let z=-70;
            z<=70;
            z+=12
        ){

            addLight(
                x,z
            );

        }

    }


    /*
        SPAWN

        Far enough from walls that
        the player isn't stuck inside one.
    */

    player.position.set(
        -70,
        0,
        -65
    );

    yaw = 0;
    pitch = 0;

    player.rotation.y = yaw;
    camera.rotation.x = pitch;

    velocityY = 0;
    grounded = true;


    await createEntity(
        35,
        35
    );


    return true;

}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function playerCollides(
    x,
    z
){

    const bottom =
        player.position.y;

    const top =
        bottom+
        PLAYER_HEIGHT;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){
            continue;
        }


        const cx =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const cz =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-cx;

        const dz =
            z-cz;


        if(
            dx*dx+
            dz*dz <
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   ENTITY COLLISION
========================================================= */

const ENTITY_RADIUS =
    .45;

const ENTITY_HEIGHT =
    1.7;


function entityHitsWall(
    x,
    z
){

    const bottom = 0;
    const top = ENTITY_HEIGHT;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){
            continue;
        }


        const cx =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const cz =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-cx;

        const dz =
            z-cz;


        if(
            dx*dx+
            dz*dz <
            ENTITY_RADIUS*
            ENTITY_RADIUS
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   ENTITY LINE OF SIGHT
========================================================= */

function lineBlocked(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2-x1;

    const dz =
        z2-z1;

    const distance =
        Math.hypot(
            dx,dz
        );

    const steps =
        Math.ceil(
            distance/.3
        );


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t =
            i/steps;

        const x =
            x1+dx*t;

        const z =
            z1+dz*t;


        if(
            entityHitsWall(
                x,z
            )
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   ENTITY PNG
========================================================= */

async function createEntity(
    x,
    z
){

    try{

        entityTexture =
            await loadTexture(
                ENTITY_IMAGE
            );


        /*
            NO SHADER.

            MeshBasicMaterial means the
            PNG is completely unaffected
            by environmental lighting.
        */

        const material =
            new THREE.MeshBasicMaterial({

                map:entityTexture,

                transparent:true,

                alphaTest:.01,

                side:THREE.DoubleSide,

                depthWrite:true,

                toneMapped:false,

                fog:false

            });


        const image =
            entityTexture.image;


        const aspect =
            image.width/
            image.height;


        /*
            Full PNG.

            Height is fixed.

            Width is calculated from the
            actual PNG aspect ratio.

            Nothing is cropped.
        */

        const geometry =
            new THREE.PlaneGeometry(
                ENTITY_HEIGHT*aspect,
                ENTITY_HEIGHT
            );


        entity =
            new THREE.Mesh(
                geometry,
                material
            );


        entity.position.set(
            x,
            ENTITY_HEIGHT/2,
            z
        );


        addObject(entity);

    }
    catch(error){

        showError(
            "Could not load entity.png"
        );

    }

}


/* =========================================================
   ENTITY AI
========================================================= */

function chooseDirection(){

    if(!entity){
        return null;
    }


    const dx =
        player.position.x-
        entity.position.x;

    const dz =
        player.position.z-
        entity.position.z;


    const distance =
        Math.hypot(
            dx,dz
        );


    if(distance<.01){
        return null;
    }


    /*
        Direct route is possible.
    */

    if(
        !lineBlocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        )
    ){

        return {

            x:dx/distance,
            z:dz/distance

        };

    }


    /*
        WALL DETECTED.

        Test many directions and choose
        the one that gets closest to
        the player without hitting
        the wall.
    */

    let best = null;


    for(
        let i=0;
        i<64;
        i++
    ){

        const angle =
            i/64*
            Math.PI*2;


        const dirX =
            Math.cos(angle);

        const dirZ =
            Math.sin(angle);


        const testDistance =
            2.2;


        const testX =
            entity.position.x+
            dirX*testDistance;

        const testZ =
            entity.position.z+
            dirZ*testDistance;


        if(
            entityHitsWall(
                testX,
                testZ
            )
        ){
            continue;
        }


        const remaining =
            Math.hypot(
                player.position.x-testX,
                player.position.z-testZ
            );


        /*
            Penalize directions that
            go extremely far sideways.
        */

        const targetAngle =
            Math.atan2(
                dz,
                dx
            );

        let angleDifference =
            Math.abs(
                angle-targetAngle
            );

        if(
            angleDifference>Math.PI
        ){

            angleDifference =
                Math.PI-
                angleDifference;

        }


        const score =
            remaining+
            angleDifference*.45;


        if(
            best===null ||
            score<best.score
        ){

            best = {

                x:dirX,
                z:dirZ,
                score:score

            };

        }

    }


    return best;

}


function updateEntity(
    dt
){

    if(
        !entity ||
        dead
    ){
        return;
    }


    const settings =
        DIFFICULTIES[
            difficulty
        ];


    entitySpeed =
        settings.speed;


    const dx =
        player.position.x-
        entity.position.x;

    const dz =
        player.position.z-
        entity.position.z;


    const distance =
        Math.hypot(
            dx,dz
        );


    /* =====================================================
       EASY
    ===================================================== */

    if(!settings.chase){

        wanderTimer -= dt;


        if(wanderTimer<=0){

            wanderTimer =
                1+
                Math.random()*4;

            wanderAngle =
                Math.random()*
                Math.PI*2;

        }


        const dirX =
            Math.cos(
                wanderAngle
            );

        const dirZ =
            Math.sin(
                wanderAngle
            );


        const nx =
            entity.position.x+
            dirX*
            settings.speed*
            dt;

        const nz =
            entity.position.z+
            dirZ*
            settings.speed*
            dt;


        if(
            !entityHitsWall(
                nx,nz
            )
        ){

            entity.position.x =
                nx;

            entity.position.z =
                nz;

        }
        else{

            wanderTimer = 0;

        }

    }


    /* =====================================================
       CHASE
    ===================================================== */

    else{

        const direction =
            chooseDirection();


        if(direction){

            const amount =
                settings.speed*
                dt;


            const nx =
                entity.position.x+
                direction.x*
                amount;

            const nz =
                entity.position.z+
                direction.z*
                amount;


            if(
                !entityHitsWall(
                    nx,nz
                )
            ){

                entity.position.x =
                    nx;

                entity.position.z =
                    nz;

                entityStuckTime = 0;

            }
            else{

                entityStuckTime += dt;

            }

        }


        /*
            Emergency unstuck.
        */

        if(
            entityStuckTime>.7
        ){

            for(
                let i=0;
                i<32;
                i++
            ){

                const angle =
                    i/32*
                    Math.PI*2;


                const nx =
                    entity.position.x+
                    Math.cos(angle)*2;

                const nz =
                    entity.position.z+
                    Math.sin(angle)*2;


                if(
                    !entityHitsWall(
                        nx,nz
                    )
                ){

                    entity.position.x =
                        nx;

                    entity.position.z =
                        nz;

                    break;

                }

            }

            entityStuckTime = 0;

        }


        if(
            distance<1.1
        ){

            killPlayer();

        }

    }


    /*
        Make the PNG face the player.

        This DOES NOT change its
        width/height.
    */

    entity.rotation.y =
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(
    dt
){

    const direction =
        new THREE.Vector3();


    if(keys.w)
        direction.z -= 1;

    if(keys.s)
        direction.z += 1;

    if(keys.a)
        direction.x -= 1;

    if(keys.d)
        direction.x += 1;


    if(
        direction.lengthSq()>0
    ){

        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(
                0,1,0
            ),
            yaw
        );


        /*
            NO SPRINT COOLDOWN.

            Holding SHIFT immediately
            gives sprint speed.
        */

        const speed =
            keys.shift
                ? SPRINT_SPEED
                : WALK_SPEED;


        const amount =
            speed*dt;


        const nx =
            player.position.x+
            direction.x*amount;


        if(
            !playerCollides(
                nx,
                player.position.z
            )
        ){

            player.position.x =
                nx;

        }


        const nz =
            player.position.z+
            direction.z*amount;


        if(
            !playerCollides(
                player.position.x,
                nz
            )
        ){

            player.position.z =
                nz;

        }

    }


    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;

        grounded = false;

    }

    jumpPressed = false;


    velocityY -=
        GRAVITY*dt;


    player.position.y +=
        velocityY*dt;


    if(
        player.position.y<=0
    ){

        player.position.y=0;

        velocityY=0;

        grounded=true;

    }

}


/* =========================================================
   AUDIO
========================================================= */

const audio =
    new Audio(
        ENTITY_AUDIO
    );

audio.loop = true;

audio.volume = 0;


/*
    This is the important part.

    The audio is NOT permanently
    audible.

    It gets updated every frame based
    on the entity's actual distance.
*/

function updateEntityAudio(){

    if(
        !entity ||
        !running ||
        paused ||
        dead
    ){

        audio.volume = 0;

        return;

    }


    const dx =
        entity.position.x-
        player.position.x;

    const dz =
        entity.position.z-
        player.position.z;


    const distance =
        Math.hypot(
            dx,dz
        );


    /*
        30+ blocks = SILENT.
    */

    const MAX_DISTANCE = 30;


    if(
        distance>=MAX_DISTANCE
    ){

        audio.volume = 0;

        /*
            Actually stop playback so
            it isn't doing anything in
            the background.
        */

        if(!audio.paused){
            audio.pause();
        }

        return;

    }


    /*
        Make walls muffle the sound.
    */

    const blocked =
        lineBlocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        );


    /*
        Distance falloff.

        0 blocks = 0.85
        30 blocks = 0
    */

    let volume =
        1-
        distance/MAX_DISTANCE;


    /*
        Make falloff less linear so
        nearby sounds are stronger.
    */

    volume =
        Math.pow(
            volume,
            1.7
        )*.85;


    /*
        Wall muffling.
    */

    if(blocked){
        volume *= .22;
    }


    audio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .85
        );


    if(
        audio.paused &&
        volume>.01
    ){

        audio.play().catch(
            ()=>{}
        );

    }

}


/* =========================================================
   CAMERA MOVEMENT
========================================================= */

let cameraTime=0;

function updateCamera(
    dt
){

    cameraTime += dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    /*
        Very subtle handheld camera
        movement for found footage.
    */

    const strength =
        moving
            ? .006
            : .002;


    camera.position.x =
        Math.sin(
            cameraTime*3.1
        )*
        strength;


    camera.position.y =
        EYE_HEIGHT+
        Math.sin(
            cameraTime*4.2
        )*
        strength;


    camera.rotation.z =
        Math.sin(
            cameraTime*1.4
        )*
        .0015;

}


/* =========================================================
   START
========================================================= */

async function startGame(){

    const success =
        await buildLevel();


    if(!success){
        return;
    }


    running = true;
    paused = false;
    dead = false;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            difficulty
        ].name;


    audio.pause();
    audio.currentTime=0;
    audio.volume=0;


    document.body.requestPointerLock();

}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(){

    if(dead){
        return;
    }


    dead = true;
    running = false;


    audio.pause();
    audio.volume=0;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    document.getElementById(
        "death"
    ).style.display =
        "flex";

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(paused){

        paused=false;

        document.getElementById(
            "pause"
        ).style.display =
            "none";

        document.body.requestPointerLock();

    }
    else{

        paused=true;

        document.getElementById(
            "pause"
        ).style.display =
            "flex";

        audio.pause();

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    }

}


/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;

    audio.pause();
    audio.volume=0;

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";

}


/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(
    value
){

    difficulty=value;


    document
    .querySelectorAll(
        ".difficulty button"
    )
    .forEach(
        button =>
            button.classList.remove(
                "selected"
            )
    );


    document.getElementById(
        value+"Btn"
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            value
        ].name;

}


document.getElementById(
    "easyBtn"
).onclick =
    () => setDifficulty("easy");


document.getElementById(
    "normalBtn"
).onclick =
    () => setDifficulty("normal");


document.getElementById(
    "hardBtn"
).onclick =
    () => setDifficulty("hard");


document.getElementById(
    "impossibleBtn"
).onclick =
    () => setDifficulty("impossible");


document.getElementById(
    "startBtn"
).onclick =
    () => startGame();


document.getElementById(
    "resumeBtn"
).onclick =
    () => togglePause();


document.getElementById(
    "restartBtn"
).onclick =
    () => startGame();


document.getElementById(
    "menuBtn"
).onclick =
    () => returnToMenu();


document.getElementById(
    "retryBtn"
).onclick =
    () => startGame();


document.getElementById(
    "deathMenuBtn"
).onclick =
    () => returnToMenu();


/* =========================================================
   MOUSE RELOCK
========================================================= */

document.addEventListener(
    "click",
    () => {

        if(
            running &&
            !paused &&
            !dead &&
            document.pointerLockElement !==
            document.body
        ){

            document.body.requestPointerLock();

        }

    }
);


/* =========================================================
   ERROR
========================================================= */

function showError(
    text
){

    const box =
        document.getElementById(
            "error"
        );

    box.style.display =
        "block";

    box.textContent =
        text;

}


window.addEventListener(
    "error",
    e => {

        console.error(
            e.error ||
            e.message
        );

        showError(
            "GAME ERROR:\n\n"+
            e.message
        );

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateEntityAudio();

        updateCamera(dt);

    }
    else{

        updateEntityAudio();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
