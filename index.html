<script type="module">

/* =========================================================
   THREE.JS R160
========================================================= */

import * as THREE from "./three.module.js";

/* =========================================================
   STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

let gameTime = 0;
let messageTimer = 0;

/*
    IMPORTANT:

    The entity does NOT spawn when the game begins.

    It waits exactly 30 seconds.
*/

let entitySpawned = false;
let entitySpawnTimer = 30;

/* =========================================================
   RENDERER
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x403e2b);

scene.fog =
    new THREE.FogExp2(
        0x403e2b,
        0.018
    );

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        0.05,
        350
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.35
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    0.72;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE = 3;

const WALL_HEIGHT = 9;

const PLAYER_RADIUS = 0.42;

const EYE_HEIGHT = 5.25;

const CROUCH_HEIGHT = 3.25;

/*
    MUCH FASTER.

    Previous walking speed was effectively feeling
    like sprinting.

    These values are intentionally high.
*/

const WALK_SPEED = 8.2;

const SPRINT_SPEED = 14.5;

const AIR_SPRINT_SPEED = 15.8;

const JUMP_SPEED = 8.8;

const GRAVITY = 22;

/* =========================================================
   MAP
========================================================= */

let mapWidth = 0;
let mapHeight = 0;

let mapData = [];

const wallColliders = [];

const holeCells = [];

const hideCells = [];

const walkableCells = [];

let playerSpawn = null;
let entitySpawn = null;

/* =========================================================
   TEXTURES
========================================================= */

const loader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;

function configureTexture(
    texture,
    repeatX,
    repeatY
){

    /*
        THIS IS IMPORTANT FOR R160.

        Explicit sRGB prevents the textures from
        becoming extremely dark / appearing invisible.
    */

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(path){

    return new Promise(
        (resolve,reject)=>{

            console.log(
                "[TEXTURE] Loading:",
                path
            );

            loader.load(

                path,

                texture=>{

                    console.log(
                        "[TEXTURE] SUCCESS:",
                        path
                    );

                    resolve(texture);

                },

                undefined,

                error=>{

                    console.error(
                        "[TEXTURE] FAILED:",
                        path,
                        error
                    );

                    reject(
                        new Error(
                            "Could not load " + path
                        )
                    );

                }

            );

        }
    );

}

/*
    Load the three actual textures separately.

    If one fails, initialization reports the exact file.
*/

async function loadAllTextures(){

    wallTexture =
        configureTexture(
            await loadTexture(
                "./textures/wall.png"
            ),
            1.25,
            1.25
        );

    floorTexture =
        configureTexture(
            await loadTexture(
                "./textures/floor.png"
            ),
            1.0,
            1.0
        );

    ceilingTexture =
        configureTexture(
            await loadTexture(
                "./textures/ceiling.png"
            ),
            1.0,
            1.0
        );

}

/* =========================================================
   MATERIALS
========================================================= */

/*
    MeshStandardMaterial is used for the actual world.

    Unlike the previous version, the lighting is deliberately
    strong enough that the texture cannot disappear into black.
*/

const wallMaterial =
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xffffff,

        roughness:.92,

        metalness:0,

        side:THREE.FrontSide

    });

const floorMaterial =
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xffffff,

        roughness:.9,

        metalness:0,

        side:THREE.FrontSide

    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({

        map:null,

        color:0xffffff,

        roughness:.9,

        metalness:0,

        side:THREE.DoubleSide

    });

function applyTextures(){

    wallMaterial.map =
        wallTexture;

    floorMaterial.map =
        floorTexture;

    ceilingMaterial.map =
        ceilingTexture;

    wallMaterial.needsUpdate=true;
    floorMaterial.needsUpdate=true;
    ceilingMaterial.needsUpdate=true;

    console.log(
        "[TEXTURE] Materials assigned."
    );

}

/* =========================================================
   MAP IMAGE
========================================================= */

function cellToWorld(x,y){

    return {

        x:
            (x + .5) * TILE -
            mapWidth * TILE * .5,

        z:
            (y + .5) * TILE -
            mapHeight * TILE * .5

    };

}

function worldToCell(x,z){

    return {

        x:
            Math.floor(
                (
                    x +
                    mapWidth*TILE*.5
                ) / TILE
            ),

        y:
            Math.floor(
                (
                    z +
                    mapHeight*TILE*.5
                ) / TILE
            )

    };

}

function insideMap(x,y){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function isHole(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]==="hole"
    );

}

function isWalkable(x,y){

    if(!insideMap(x,y))
        return false;

    return mapData[y][x]!=="wall";

}

/* =========================================================
   MAP PIXEL CLASSIFICATION
========================================================= */

function classifyPixel(
    r,
    g,
    b,
    a
){

    if(a<20)
        return "floor";

    /*
        Very dark pixels = walls.
    */

    if(
        r<65 &&
        g<65 &&
        b<65
    ){

        return "wall";

    }

    /*
        Red = player spawn.
    */

    if(
        r>145 &&
        r>g*1.35 &&
        r>b*1.35
    ){

        return "spawn";

    }

    /*
        Blue = entity spawn.
    */

    if(
        b>125 &&
        b>r*1.25 &&
        b>g*1.15
    ){

        return "entity";

    }

    /*
        Purple = hiding spot.
    */

    if(
        r>100 &&
        b>100 &&
        g<120
    ){

        return "hide";

    }

    /*
        Orange/yellow = hole.
    */

    if(
        r>135 &&
        g>105 &&
        b<120
    ){

        return "hole";

    }

    return "floor";

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const img =
        await new Promise(
            (resolve,reject)=>{

                const image =
                    new Image();

                image.onload =
                    ()=>resolve(image);

                image.onerror =
                    ()=>reject(
                        new Error(
                            "Could not load ./textures/map1.png"
                        )
                    );

                image.src =
                    "./textures/map1.png";

            }
        );

    mapWidth =
        img.naturalWidth;

    mapHeight =
        img.naturalHeight;

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        mapWidth;

    canvas.height =
        mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        img,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row=[];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i =
                (y*mapWidth+x)*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(type!=="wall"){

                walkableCells.push({
                    x,
                    y
                });

            }

            if(type==="hole"){

                holeCells.push({
                    x,
                    y
                });

            }

            if(type==="hide"){

                hideCells.push({
                    x,
                    y
                });

            }

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn =
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn =
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

        mapData.push(row);

    }

    /*
        If the map doesn't contain a red spawn,
        use the first walkable cell.
    */

    if(!playerSpawn){

        const c =
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        if(!c){

            throw new Error(
                "map1.png contains no walkable cells."
            );

        }

        playerSpawn =
            cellToWorld(
                c.x,
                c.y
            );

    }

    /*
        Entity spawn is deliberately NOT used immediately.

        If map1 has no entity marker, choose a distant
        walkable cell.
    */

    if(!entitySpawn){

        let best=null;
        let bestDistance=-1;

        const pc =
            worldToCell(
                playerSpawn.x,
                playerSpawn.z
            );

        for(
            const c of walkableCells
        ){

            const distance =
                Math.hypot(
                    c.x-pc.x,
                    c.y-pc.y
                );

            if(
                distance>bestDistance
            ){

                bestDistance=distance;
                best=c;

            }

        }

        if(best){

            entitySpawn =
                cellToWorld(
                    best.x,
                    best.y
                );

        }

    }

    console.log(
        "[MAP]",
        mapWidth,
        "x",
        mapHeight
    );

    console.log(
        "[MAP] holes:",
        holeCells.length
    );

    console.log(
        "[MAP] hiding spots:",
        hideCells.length
    );

}

/* =========================================================
   COLLISION
========================================================= */

function addCollider(
    x,
    z
){

    wallColliders.push({

        minX:x-TILE*.5,
        maxX:x+TILE*.5,

        minZ:z-TILE*.5,
        maxZ:z+TILE*.5

    });

}

function collides(
    x,
    z,
    radius=PLAYER_RADIUS
){

    for(
        const wall of wallColliders
    ){

        if(
            x+radius>wall.minX &&
            x-radius<wall.maxX &&
            z+radius>wall.minZ &&
            z-radius<wall.maxZ
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   WORLD GEOMETRY
========================================================= */

function addFloor(x,z){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            floorMaterial

        );

    mesh.rotation.x =
        -Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    mesh.receiveShadow=true;

    world.add(mesh);

}

function addCeiling(x,z){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            ceilingMaterial

        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    mesh.receiveShadow=false;

    world.add(mesh);

}

function addWall(x,z){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),

            wallMaterial

        );

    mesh.position.set(
        x,
        WALL_HEIGHT*.5,
        z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    world.add(mesh);

    addCollider(
        x,
        z
    );

}

/* =========================================================
   3D HOLES
========================================================= */

function addHole(
    x,
    y
){

    const p =
        cellToWorld(
            x,
            y
        );

    /*
        NO FLOOR TEXTURE HERE.

        Instead we create a real recessed opening.
    */

    const darkMaterial =
        new THREE.MeshStandardMaterial({

            color:0x080704,

            roughness:1,

            metalness:0

        });

    const sideMaterial =
        new THREE.MeshStandardMaterial({

            color:0x262419,

            roughness:1

        });

    const bottom =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE*.88,
                .12,
                TILE*.88
            ),

            darkMaterial

        );

    bottom.position.set(
        p.x,
        -4.8,
        p.z
    );

    world.add(bottom);

    /*
        Interior sides.

        They gradually get darker toward the bottom.
    */

    const depth=5;

    const back =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE,
                depth,
                .10
            ),

            sideMaterial

        );

    back.position.set(
        p.x,
        -2.4,
        p.z-TILE*.5
    );

    world.add(back);

    const front =
        back.clone();

    front.position.z =
        p.z+TILE*.5;

    world.add(front);

    const left =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .10,
                depth,
                TILE
            ),

            sideMaterial

        );

    left.position.set(
        p.x-TILE*.5,
        -2.4,
        p.z
    );

    world.add(left);

    const right =
        left.clone();

    right.position.x =
        p.x+TILE*.5;

    world.add(right);

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                mapData[y][x];

            const p =
                cellToWorld(
                    x,
                    y
                );

            if(type==="wall"){

                addWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
                Normal floor.

                Hole cells deliberately do NOT receive
                a floor mesh.
            */

            if(type!=="hole"){

                addFloor(
                    p.x,
                    p.z
                );

            }

            /*
                Ceiling ALWAYS loads.
            */

            addCeiling(
                p.x,
                p.z
            );

        }

    }

    for(
        const h of holeCells
    ){

        addHole(
            h.x,
            h.y
        );

    }

    /*
        Visible lockers.
    */

    for(
        const h of hideCells
    ){

        const p =
            cellToWorld(
                h.x,
                h.y
            );

        addLocker(
            p.x,
            p.z
        );

    }

}

========================================================= */

const player =
    new THREE.Object3D();

player.add(camera);

camera.position.y =
    EYE_HEIGHT;

let yaw=0;
let pitch=0;

let velocityY=0;

let grounded=true;

let crouching=false;

let hidden=false;

let falling=false;

let fallTimer=0;

const keys={};

/* =========================================================
   PLAYER COLLISION
========================================================= */

function movePlayer(
    dx,
    dz
){

    const nx =
        player.position.x+dx;

    const nz =
        player.position.z+dz;

    /*
        Separate X/Z collision allows sliding along walls.
    */

    if(
        !collides(
            nx,
            player.position.z
        )
    ){

        player.position.x=nx;

    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){

        player.position.z=nz;

    }

}

/* =========================================================
   WHOLE HITBOX HOLE TEST
========================================================= */

function entireHitboxOverHole(){

    /*
        The entire circular-ish player footprint
        must be inside hole cells.

        This prevents falling when only an edge
        touches the hole.
    */

    const r =
        PLAYER_RADIUS;

    const samples=[

        [0,0],

        [r,0],
        [-r,0],

        [0,r],
        [0,-r],

        [r*.707,r*.707],
        [-r*.707,r*.707],

        [r*.707,-r*.707],
        [-r*.707,-r*.707]

    ];

    for(
        const sample of samples
    ){

        const c =
            worldToCell(
                player.position.x+
                sample[0],

                player.position.z+
                sample[1]
            );

        if(
            !isHole(
                c.x,
                c.y
            )
        ){

            return false;

        }

    }

    return true;

}

function checkHole(){

    if(
        falling ||
        !grounded
    )
        return;

    if(
        entireHitboxOverHole()
    ){

        falling=true;

        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest=null;

    let closestDistance=Infinity;

    for(
        const spot of hidingObjects
    ){

        const distance =
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(
            distance<closestDistance
        ){

            closestDistance=distance;

            closest=spot;

        }

    }

    const nearby =
        closest &&
        closestDistance<2.0;

    hidden =
        !!(
            nearby &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        nearby && !hidden
        ? "1"
        : "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ? "1"
        : "0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    /*
        FALLING INTO HOLE.
    */

    if(falling){

        fallTimer+=dt;

        const progress =
            Math.min(
                fallTimer/1.25,
                1
            );

        player.position.y =
            -progress*6;

        camera.position.y =
            EYE_HEIGHT-
            progress*1.5;

        camera.rotation.z =
            Math.sin(
                fallTimer*17
            )*.045;

        if(
            fallTimer>=1.25
        ){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching =
        !!keys.c;

    let forward=0;

    let strafe=0;

    if(keys.w)
        forward++;

    if(keys.s)
        forward--;

    if(keys.d)
        strafe++;

    if(keys.a)
        strafe--;

    const length =
        Math.hypot(
            forward,
            strafe
        );

    if(length>0){

        forward/=length;
        strafe/=length;

        const sprinting =
            keys.shift &&
            !crouching;

        let speed =
            sprinting
            ? SPRINT_SPEED
            : WALK_SPEED;

        /*
            Sprint jumping gets the
            track-star movement boost.
        */

        if(
            sprinting &&
            !grounded
        ){

            speed=
                AIR_SPRINT_SPEED;

        }

        if(crouching)
            speed*=.55;

        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);

        const dx =
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz =
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    /*
        Gravity.
    */

    velocityY -=
        GRAVITY*dt;

    player.position.y +=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;

        velocityY=0;

        grounded=true;

    }else{

        grounded=false;

    }

    /*
        Jump.
    */

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;

        keys.spacePressed=false;

    }

    if(!keys.space)
        keys.spacePressed=false;

    /*
        Smooth crouching.
    */

    const targetHeight =
        crouching
        ? CROUCH_HEIGHT
        : EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*14,
                1
            )
        );

    updateHiding();

    checkHole();

}

/* =========================================================
   ENTITY SPEED
========================================================= */

function getEntitySpeed(){

    if(difficulty==="easy")
        return 6.0;

    if(difficulty==="hard")
        return 13.0;

    if(difficulty==="nightmare"){

        /*
            Nightmare = approximately sprint-jump speed.
        */

        return AIR_SPRINT_SPEED;

    }

    return 9.0;

}

/* =========================================================
   ENTITY PATHFINDING
========================================================= */

function findPath(
    start,
    goal
){

    if(
        !insideMap(start.x,start.y) ||
        !insideMap(goal.x,goal.y)
    )
        return [];

    if(
        !isWalkable(
            goal.x,
            goal.y
        )
    ){

        let nearest=null;

        let nearestDistance=Infinity;

        for(
            const c of walkableCells
        ){

            const distance =
                Math.abs(
                    c.x-goal.x
                )+
                Math.abs(
                    c.y-goal.y
                );

            if(
                distance<nearestDistance
            ){

                nearestDistance=distance;

                nearest=c;

            }

        }

        if(!nearest)
            return [];

        goal=nearest;

    }

    const queue=[start];

    const visited =
        new Set();

    const parents =
        new Map();

    const key =
        p =>
            p.x+","+p.y;

    visited.add(
        key(start)
    );

    const dirs=[

        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}

    ];

    let iterations=0;

    while(
        queue.length &&
        iterations++<8000
    ){

        const current =
            queue.shift();

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            const path=[];

            let currentPoint=current;

            while(currentPoint){

                path.push(
                    currentPoint
                );

                currentPoint =
                    parents.get(
                        key(currentPoint)
                    );

            }

            path.reverse();

            return path;

        }

        for(
            const direction of dirs
        ){

            const next={

                x:
                    current.x+
                    direction.x,

                y:
                    current.y+
                    direction.y

            };

            const nextKey =
                key(next);

            if(
                visited.has(nextKey)
            )
                continue;

            if(
                !isWalkable(
                    next.x,
                    next.y
                )
            )
                continue;

            visited.add(
                nextKey
            );

            parents.set(
                nextKey,
                current
            );

            queue.push(next);

        }

    }

    return [];

}

function updateEntityPath(){

    if(!entity)
        return;

    const start =
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const goal =
        worldToCell(
            player.position.x,
            player.position.z
        );

    entityPath =
        findPath(
            start,
            goal
        );

    entityPathIndex=1;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    /*
        30 second delay.
    */

    if(
        gameStarted &&
        !entitySpawned &&
        !dead &&
        !paused
    ){

        entitySpawnTimer-=dt;

        if(
            entitySpawnTimer<=0
        ){

            spawnEntity();

        }

    }

    if(
        !entity ||
        !gameStarted ||
        paused ||
        dead
    )
        return;

    /*
        Entity always knows player's current cell.
    */

    entityPathTimer-=dt;

    if(
        entityPathTimer<=0
    ){

        entityPathTimer =
            difficulty==="nightmare"
            ? .15
            : .25;

        updateEntityPath();

    }

    if(
        entityPath.length<=1
    )
        return;

    const targetCell =
        entityPath[
            Math.min(
                entityPathIndex,
                entityPath.length-1
            )
        ];

    const target =
        cellToWorld(
            targetCell.x,
            targetCell.y
        );

    let dx =
        target.x-
        entity.position.x;

    let dz =
        target.z-
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    if(distance<.2){

        entityPathIndex++;

        return;

    }

    dx/=distance;

    dz/=distance;

    const speed =
        getEntitySpeed();

    const nx =
        entity.position.x+
        dx*speed*dt;

    const nz =
        entity.position.z+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz,
            .38
        )
    ){

        entity.position.x=nx;

        entity.position.z=nz;

        entityStuck=0;

    }else{

        entityStuck+=dt;

        /*
            Immediately recalculate if it hits a corner.
        */

        entityPathTimer=0;

    }

    /*
        Always face camera.
    */

    entity.rotation.y =
        Math.atan2(
            camera.position.x-
            entity.position.x,

            camera.position.z-
            entity.position.z
        );

    const playerDistance =
        Math.hypot(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    if(
        playerDistance<1.25 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   ENTITY AUDIO
========================================================= */

/*
    entity.mp3 is the sound from Lights.

    It is NOT constantly loud.

    It starts at essentially zero and gradually rises
    as the entity gets closer.
*/

const entityAudio =
    new Audio(
        "./sounds/entity.mp3"
    );

entityAudio.loop=true;

entityAudio.preload="auto";

entityAudio.volume=0;

let audioAllowed=false;

function startAudio(){

    if(audioAllowed)
        return;

    audioAllowed=true;

    entityAudio
        .play()
        .catch(
            error=>{
                console.warn(
                    "[AUDIO] Browser blocked autoplay:",
                    error
                );
            }
        );

}

let entityAudioVolume=0;

function updateEntityAudio(){

    if(
        !entity ||
        !gameStarted ||
        dead
    ){

        entityAudioVolume =
            THREE.MathUtils.lerp(
                entityAudioVolume,
                0,
                .1
            );

        entityAudio.volume =
            entityAudioVolume;

        return;

    }

    const distance =
        Math.hypot(

            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z

        );

    /*
        55 world units of hearing distance.
    */

    const maxDistance=55;

    let volume =
        1-
        distance/maxDistance;

    volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    /*
        This curve makes it:

        very quiet far away
        increasingly audible nearby
        loud when close
    */

    volume =
        Math.pow(
            volume,
            .72
        );

    /*
        Smooth changes so it doesn't suddenly jump.
    */

    entityAudioVolume =
        THREE.MathUtils.lerp(
            entityAudioVolume,
            volume,
            .055
        );

    entityAudio.volume =
        entityAudioVolume;

    if(
        entityAudio.paused &&
        audioAllowed
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );

    }

}

    messageTimer=3;

}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "death"
    ).style.display="flex";

    entityAudio.pause();

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   RESET
========================================================= */

function resetGame(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw=0;

    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y=
        EYE_HEIGHT;

    velocityY=0;

    grounded=true;

    crouching=false;

    hidden=false;

    falling=false;

    fallTimer=0;

    gameTime=0;

    /*
        RESET THE 30 SECOND ENTITY TIMER.
    */

    entitySpawned=false;

    entitySpawnTimer=30;

    if(entity){

        world.remove(entity);

        entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;

    }

    entityPath=[];

    entityPathIndex=0;

    entityAudio.pause();

    entityAudio.currentTime=0;

    entityAudio.volume=0;

    audioAllowed=false;

}

/* =========================================================
   START
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;

    paused=false;

    dead=false;

    resetGame();

    /*
        Audio is unlocked by the user clicking
        ENTER LEVEL 0.

        The MP3 itself remains silent until the
        entity gets close.
    */

    startAudio();

    renderer.domElement
        .requestPointerLock()
        .catch(
            ()=>{}
        );

    showMessage(
        "30 SECONDS."
    );

}

/* =========================================================
   MAIN MENU
========================================================= */

function returnToMenu(){

    gameStarted=false;

    paused=false;

    dead=false;

    entityAudio.pause();

    entityAudio.currentTime=0;

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display =
        paused
        ? "flex"
        : "none";

    if(paused){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    }

}

/* =========================================================
   INPUT
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key =
            event.key.toLowerCase();

        keys[key]=true;

        if(
            event.code==="Space"
        ){

            event.preventDefault();

            keys.spacePressed=true;

        }

        if(
            key==="escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                document.getElementById(
                    "controlsBox"
                ).style.display="none";

                return;

            }

            if(gameStarted)
                togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        const key =
            event.key.toLowerCase();

        keys[key]=false;

        if(
            event.code==="Space"
        ){

            keys.space=false;

        }

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw -=
            event.movementX*.0022;

        pitch -=
            event.movementY*.0018;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(
                    ()=>{}
                );

            startAudio();

        }

    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick=
    startGame;

document.getElementById(
    "menuControlsBtn"
).onclick=
    ()=>{
        document.getElementById(
            "controlsBox"
        ).style.display="flex";
    };

document.getElementById(
    "pauseControlsBtn"
).onclick=
    ()=>{
        document.getElementById(
            "controlsBox"
        ).style.display="flex";
    };

document.getElementById(
    "controlsBackBtn"
).onclick=
    ()=>{
        document.getElementById(
            "controlsBox"
        ).style.display="none";
    };

document.getElementById(
    "resumeBtn"
).onclick=
    ()=>{
        paused=false;

        document.getElementById(
            "pause"
        ).style.display="none";

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    };

document.getElementById(
    "restartBtn"
).onclick=
    startGame;

document.getElementById(
    "retryBtn"
).onclick=
    startGame;

document.getElementById(
    "menuBtn"
).onclick=
    returnToMenu;

document.getElementById(
    "deathMenuBtn"
).onclick=
    returnToMenu;

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages =
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(
            !menuImages.length
        )
            return;

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(){

    /*
        Subtle irregular fluorescent flicker.

        Not enough to make the environment unreadable.
    */

    const time =
        performance.now()*.001;

    for(
        let i=0;
        i<ceilingLights.length;
        i++
    ){

        const item =
            ceilingLights[i];

        const flicker =
            Math.sin(
                time*7+i*2.31
            )*.035;

        item.light.intensity =
            2.6+
            flicker;

        item.fixture.material
            .emissiveIntensity=
                .8+
                flicker*.15;

    }

}

/* =========================================================
   TAPE TIMER
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total =
        Math.floor(
            gameTime
        );

    const h =
        Math.floor(
            total/3600
        );

    const m =
        Math.floor(
            (total%3600)/60
        );

    const s =
        total%60;

    const pad =
        n=>
            String(n)
            .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+
        pad(m)+":"+
        pad(s);

}

/* =========================================================
   AMBIENT CAMERA EFFECT
========================================================= */

function updateCameraEffect(){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    /*
        Tiny found-footage movement.
    */

    const t =
        performance.now()*.001;

    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;

    const amount =
        moving
        ? .012
        : .004;

    camera.position.x =
        Math.sin(t*2.1)*
        amount;

    camera.position.z =
        Math.cos(t*1.7)*
        amount;

}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    /*
        Prevent huge physics jumps when the browser
        gets temporarily busy.
    */

    dt=
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);

    updateEntity(dt);

    updateEntityAudio();

    updateLights();

    updateCameraEffect();

    updateMessage(dt);

    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);
