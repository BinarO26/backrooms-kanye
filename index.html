<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   THREE CHECK
========================================================= */

if (
    typeof THREE === "undefined"
) {

    const error =
        document.getElementById(
            "error"
        );

    error.style.display = "block";

    error.textContent =
        "THREE.JS COULD NOT LOAD.\n\n" +
        "This version does NOT use a CDN.\n\n" +
        "Make sure this exact file exists:\n\n" +
        "./three.min.js\n\n" +
        "It must be in the SAME folder as index.html.";

    throw new Error(
        "Local three.min.js was not found."
    );
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x7b7044
    );


/*
    Intentionally mild fog.

    This is not used to hide the textures.
*/

scene.fog =
    new THREE.Fog(
        0x7b7044,
        75,
        185
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        window.innerWidth /
        window.innerHeight,
        0.05,
        300
    );

camera.rotation.order =
    "YXZ";


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(
    player
);

player.add(
    camera
);


const PLAYER_HEIGHT =
    1.55;

const EYE_HEIGHT =
    1.18;

const PLAYER_RADIUS =
    0.28;


let yaw = 0;

let pitch = 0;

let grounded = true;

let velocityY = 0;


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);


/*
    Important:

    No post-processing shader is being applied
    to the environment.

    The CRT is just an overlay.
*/

if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}


renderer.toneMapping =
    THREE.NoToneMapping;


renderer.toneMappingExposure =
    1;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0xffefbd,
        0.42
    );

scene.add(
    ambient
);


const hemisphere =
    new THREE.HemisphereLight(
        0xfff2b0,
        0x302b19,
        0.30
    );

scene.add(
    hemisphere
);


/* =========================================================
   TEXTURES
========================================================= */

const loader =
    new THREE.TextureLoader();


let wallTexture =
    null;

let floorTexture =
    null;

let ceilingTexture =
    null;


function configureTexture(
    texture,
    repeatX,
    repeatY
) {

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer
                .capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate =
        true;

    return texture;
}


function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            loader.load(

                path,

                texture => {

                    console.log(
                        "Texture loaded:",
                        path
                    );

                    resolve(
                        texture
                    );

                },

                undefined,

                error => {

                    console.error(
                        "Texture failed:",
                        path,
                        error
                    );

                    resolve(
                        null
                    );

                }

            );

        }
    );
}


async function loadTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );


    if (wallTexture) {

        configureTexture(
            wallTexture,
            1,
            1
        );

    }

    if (floorTexture) {

        configureTexture(
            floorTexture,
            1,
            1
        );

    }

    if (ceilingTexture) {

        configureTexture(
            ceilingTexture,
            1,
            1
        );

    }


    const missing = [];


    if (!wallTexture) {
        missing.push(
            "textures/wall.png"
        );
    }

    if (!floorTexture) {
        missing.push(
            "textures/floor.png"
        );
    }

    if (!ceilingTexture) {
        missing.push(
            "textures/ceiling.png"
        );
    }


    if (missing.length) {

        const error =
            document.getElementById(
                "error"
            );

        error.style.display =
            "block";

        error.textContent =
            "ENVIRONMENT TEXTURE ERROR\n\n" +
            missing.join("\n") +
            "\n\n" +
            "The game is still running using fallback materials.";
    }
}


/* =========================================================
   WORLD ARRAYS
========================================================= */

const worldObjects = [];

const colliders = [];

const lights = [];


let exitObject =
    null;

let exitLight =
    null;


function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}


function disposeMaterial(
    material
) {

    if (!material)
        return;


    if (
        Array.isArray(
            material
        )
    ) {

        material.forEach(
            disposeMaterial
        );

        return;
    }


    if (
        material.map
    ) {

        material.map.dispose();
    }


    material.dispose();
}


function clearWorld() {

    while (
        worldObjects.length
    ) {

        const object =
            worldObjects.pop();


        scene.remove(
            object
        );


        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();
                }


                if (
                    child.material
                ) {

                    disposeMaterial(
                        child.material
                    );
                }

            }
        );
    }


    colliders.length = 0;

    lights.length = 0;


    if (exitLight) {

        scene.remove(
            exitLight
        );

        exitLight =
            null;
    }


    exitObject =
        null;
}


/* =========================================================
   MATERIALS
========================================================= */

function wallMaterial() {

    if (
        !wallTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0xb9ad58,

            roughness:
                0.92,

            metalness:
                0

        });
    }


    const texture =
        wallTexture.clone();


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        1,
        1
    );


    texture.needsUpdate =
        true;


    /*
        Standard material is used for
        the environment.

        Therefore the fluorescent lights
        actually create shadows and shading.
    */

    return new THREE.MeshStandardMaterial({

        map:
            texture,

        roughness:
            0.94,

        metalness:
            0,

        side:
            THREE.DoubleSide

    });
}


function floorMaterial() {

    if (
        !floorTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0x9a8e47,

            roughness:
                1

        });
    }


    const texture =
        floorTexture.clone();


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        45,
        45
    );


    texture.needsUpdate =
        true;


    return new THREE.MeshStandardMaterial({

        map:
            texture,

        roughness:
            1,

        metalness:
            0

    });
}


function ceilingMaterial() {

    if (
        !ceilingTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0xd0c67c,

            roughness:
                1,

            side:
                THREE.DoubleSide

        });
    }


    const texture =
        ceilingTexture.clone();


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        45,
        45
    );


    texture.needsUpdate =
        true;


    return new THREE.MeshStandardMaterial({

        map:
            texture,

        roughness:
            1,

        metalness:
            0,

        side:
            THREE.DoubleSide

    });
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                240,
                210
            ),

            floorMaterial()

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    addWorldObject(
        floor
    );
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling() {

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                240,
                210
            ),

            ceilingMaterial()

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        3.1;


    addWorldObject(
        ceiling
    );
}


/* =========================================================
   WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = 0.32
) {

    const height =
        3.1;


    /*
        The collider represents the entire wall.
    */

    colliders.push({

        minX:
            x - width / 2,

        maxX:
            x + width / 2,

        minZ:
            z - depth / 2,

        maxZ:
            z + depth / 2,

        minY:
            0,

        maxY:
            height

    });


    const material =
        wallMaterial();


    /*
        Use a BOX instead of four independently
        textured planes.

        This is much more reliable and prevents
        invisible wall faces.
    */

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material

        );


    wall.position.set(
        x,
        height / 2,
        z
    );


    addWorldObject(
        wall
    );
}


/* =========================================================
   BACKROOMS MAP
========================================================= */

function buildMap() {

    /*
        Overall dimensions:

        X:
        -112 to +112

        Z:
        -96 to +96

        The map is surrounded by actual walls.
        There is no visible void around the edges.
    */


    /* =====================================================
       OUTER WALLS
    ===================================================== */

/* =========================================================
   FLUORESCENT LIGHT
========================================================= */

function addFluorescentLight(
    x,
    z,
    intensity = 3.4,
    flicker = false
) {

    /*
        The fixture is always visible.

        Flickering changes brightness only.
        It never makes the fixture disappear.
    */

    const fixtureMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xfff5c4

        });


    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.5,
                0.06,
                0.48
            ),

            fixtureMaterial

        );


    fixture.position.set(
        x,
        3.045,
        z
    );


    addWorldObject(
        fixture
    );


    const light =
        new THREE.PointLight(

            0xffe8a8,

            intensity,

            13,

            1.65

        );


    light.position.set(
        x,
        2.68,
        z
    );


    scene.add(
        light
    );


    lights.push({

        light:
            light,

        fixture:
            fixture,

        base:
            intensity,

        flicker:
            flicker,

        timer:
            Math.random() * 2,

        flickerStrength:
            0

    });
}


/* =========================================================
   LIGHTING GRID
========================================================= */

function buildLighting() {

    const xs = [
        -94,
        -70,
        -46,
        -22,
        2,
        26,
        50,
        74,
        98
    ];


    const zs = [
        -86,
        -61,
        -36,
        -11,
        14,
        39,
        64,
        89
    ];


    for (
        let zIndex = 0;
        zIndex < zs.length;
        zIndex++
    ) {

        for (
            let xIndex = 0;
            xIndex < xs.length;
            xIndex++
        ) {

            const x =
                xs[xIndex];

            const z =
                zs[zIndex];


            /*
                Some lights are intentionally
                skipped to make the environment
                feel irregular.
            */

            if (
                Math.random() < 0.08
            ) {
                continue;
            }


            const flicker =
                Math.random() < 0.12;


            const intensity =
                flicker
                    ? 2.8
                    : 3.8;


            addFluorescentLight(
                x,
                z,
                intensity,
                flicker
            );
        }
    }
}


/* =========================================================
   LIGHT UPDATE
========================================================= */

function updateLights(
    dt
) {

    for (
        const item
        of lights
    ) {

        if (
            !item.flicker
        ) {
            continue;
        }


        item.timer -=
            dt;


        if (
            item.timer <= 0
        ) {

            item.timer =
                0.04 +
                Math.random() * 0.8;


            /*
                Never completely turns the light
                off.

                This prevents the room from suddenly
                becoming pitch black.
            */

            const factor =
                0.55 +
                Math.random() * 0.55;


            item.light.intensity =
                item.base *
                factor;


            item.fixture.material.color
                .setRGB(
                    1,
                    0.94 +
                    Math.random() * 0.06,
                    0.72 +
                    Math.random() * 0.18
                );
        }
    }
}


/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;


    for (
        const wall
        of colliders
    ) {

        if (
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {
            continue;
        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }


    return false;
}

async function createEntity() {

    return new Promise(
        resolve => {

            loader.load(

                "./entity.png",

                texture => {

                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    texture.magFilter =
                        THREE.LinearFilter;


                    texture.minFilter =
                        THREE.LinearFilter;


                    const aspect =
                        (
                            texture.image.width ||
                            1
                        ) /
                        (
                            texture.image.height ||
                            1
                        );


                    const height =
                        1.55;


                    const width =
                        height *
                        aspect;


                    /*
                        ENTITY IS THE ONLY
                        UNSHADED ENVIRONMENT IMAGE.

                        MeshBasicMaterial means
                        the fluorescent lighting
                        does not affect it.
                    */

                    const material =
                        new THREE.MeshBasicMaterial({

                            map:
                                texture,

                            transparent:
                                true,

                            alphaTest:
                                0.01,

                            side:
                                THREE.DoubleSide,

                            fog:
                                false,

                            color:
                                0xffffff

                        });


                    entity =
                        new THREE.Mesh(

                            new THREE.PlaneGeometry(
                                width,
                                height
                            ),

                            material

                        );


                    entity.position.set(
                        55,
                        0.775,
                        -48
                    );


                    addWorldObject(
                        entity
                    );


                    resolve();

                },

                undefined,

                error => {

                    console.error(
                        "entity.png failed:",
                        error
                    );


                    const material =
                        new THREE.MeshBasicMaterial({

                            color:
                                0x050505,

                            transparent:
                                true,

                            opacity:
                                0.9

                        });


                    entity =
                        new THREE.Mesh(

                            new THREE.PlaneGeometry(
                                1,
                                1.55
                            ),

                            material

                        );


                    entity.position.set(
                        55,
                        0.775,
                        -48
                    );


                    addWorldObject(
                        entity
                    );


                    resolve();
                }

            );

        }
    );
}


/* =========================================================
   ENTITY AI
========================================================= */

const settings = {

    easy: {

        speed:
            3.7,

        detection:
            20

    },

    normal: {

        speed:
            5.2,

        detection:
            29

    },

    hard: {

        speed:
            6.5,

        detection:
            38

    },

    nightmare: {

        speed:
            8.0,

        detection:
            52

    }

};


let entityDirection =
    new THREE.Vector2(
        1,
        0
    );


let entityVelocity =
    new THREE.Vector2(
        0,
        0
    );


let lastKnown =
    new THREE.Vector2();


let lastSeen =
    99;


let wanderTimer =
    0;


let wanderAngle =
    0;


function entityBlocked(
    x,
    z
) {

    for (
        const wall
        of colliders
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            0.48 *
            0.48
        ) {

            return true;
        }
    }


    return false;
}


function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead
    ) {

        return;
    }


    const difficultySettings =
        settings[
            difficulty
        ];


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    lastSeen +=
        dt;


    const visible =
        distance <
        difficultySettings.detection;


    let targetX =
        0;

    let targetZ =
        0;


    if (
        visible
    ) {

        lastKnown.set(
            player.position.x,
            player.position.z
        );


        lastSeen =
            0;


        targetX =
            dx /
            Math.max(
                distance,
                0.001
            );


        targetZ =
            dz /
            Math.max(
                distance,
                0.001
            );

    } else if (
        lastSeen < 3.2
    ) {

        const lx =
            lastKnown.x -
            entity.position.x;


        const lz =
            lastKnown.y -
            entity.position.z;


        const length =
            Math.hypot(
                lx,
                lz
            );


        if (
            length > 0.1
        ) {

            targetX =
                lx /
                length;

            targetZ =
                lz /
                length;
        }

    } else {

        wanderTimer -=
            dt;


        if (
            wanderTimer <= 0
        ) {

            wanderTimer =
                0.5 +
                Math.random() * 1.8;


            wanderAngle =
                Math.random() *
                Math.PI *
                2;
        }


        targetX =
            Math.cos(
                wanderAngle
            );


        targetZ =
            Math.sin(
                wanderAngle
            );
    }


    const targetAngle =
        Math.atan2(
            targetZ,
            targetX
        );


    const currentAngle =
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );


    let difference =
        targetAngle -
        currentAngle;


    while (
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }


    while (
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }


    const maximumTurn =
        3.4 * dt;


    difference =
        THREE.MathUtils.clamp(
            difference,
            -maximumTurn,
            maximumTurn
        );


    const angle =
        currentAngle +
        difference;


    entityDirection.set(
        Math.cos(angle),
        Math.sin(angle)
    );


    entityVelocity.x =
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x *
            difficultySettings.speed,
            Math.min(
                1,
                dt * 4
            )
        );


    entityVelocity.y =
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y *
            difficultySettings.speed,
            Math.min(
                1,
                dt * 4
            )
        );


    const moveX =
        entityVelocity.x *
        dt;


    const moveZ =
        entityVelocity.y *
        dt;


    const nextX =
        entity.position.x +
        moveX;


    const nextZ =
        entity.position.z +
        moveZ;


    /*
        X movement.

        If the entity hits a wall, rotate it
        instead of getting permanently stuck.
    */

    if (
        !entityBlocked(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        entityVelocity.x =
            0;

        wanderAngle +=
            Math.PI *
            0.5;
    }


    /*
        Z movement.
    */

    if (
        !entityBlocked(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        entityVelocity.y =
            0;

        wanderAngle +=
            Math.PI *
            0.5;
    }


    /*
        Face the player.
    */

    entity.rotation.y =
        Math.atan2(
            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );


    const killDistance =
        difficulty ===
        "nightmare"
            ? 1.55
            : 1.25;


    if (
        distance <
        killDistance
    ) {

        killPlayer();
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead
    ) {

        entityAudio.volume =
            0;

        return;
    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );


    const maximum =
        34;


    if (
        distance >=
        maximum
    ) {

        entityAudio.volume =
            0;

        return;
    }


    let volume =
        Math.pow(
            1 -
            distance /
            maximum,
            1.6
        ) *
        0.9;


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            0.9
        );


    if (
        entityAudio.paused &&
        volume > 0.01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}

const keys = {

    w:
        false,

    a:
        false,

    s:
        false,

    d:
        false,

    shift:
        false

};


let jumpPressed =
    false;


window.addEventListener(
    "keydown",
    event => {

        /*
            W = FORWARD

            S = BACKWARD

            These are explicitly assigned here
            so they cannot accidentally be swapped.
        */

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                true;
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                true;
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                true;
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                true;
        }


        if (
            event.code ===
            "ShiftLeft" ||
            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                true;
        }


        if (
            event.code ===
            "Space" &&
            !event.repeat
        ) {

            jumpPressed =
                true;
        }


        /*
            C toggles the CRT.
        */

        if (
            event.code ===
            "KeyC" &&
            !event.repeat
        ) {

            toggleCRT();
        }


        if (
            event.code ===
            "Escape" &&
            running &&
            !dead
        ) {

            togglePause();
        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                false;
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                false;
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                false;
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                false;
        }


        if (
            event.code ===
            "ShiftLeft" ||
            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                false;
        }

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (
            !running ||
            paused ||
            dead
        ) {

            return;
        }


        if (
            document.pointerLockElement !==
            document.body
        ) {

            return;
        }


        /*
            Horizontal camera rotation.

            This is the part that makes the player
            able to look LEFT and RIGHT.
        */

        yaw -=
            event.movementX *
            0.0024;


        /*
            Vertical camera rotation.
        */

        pitch -=
            event.movementY *
            0.002;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(
    dt
) {

    let forward =
        0;

    let strafe =
        0;


    /*
        W forward.
        S backward.

        This is deliberately not inverted.
    */

    if (
        keys.w
    ) {

        forward +=
            1;
    }


    if (
        keys.s
    ) {

        forward -=
            1;
    }


    if (
        keys.d
    ) {

        strafe +=
            1;
    }


    if (
        keys.a
    ) {

        strafe -=
            1;
    }


    const length =
        Math.hypot(
            forward,
            strafe
        );


    if (
        length > 0
    ) {

        forward /=
            length;

        strafe /=
            length;
    }


    let speed =
        3.8;


    if (
        keys.shift
    ) {

        speed =
            6.0;
    }


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.2
                : 4.0;
    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.4
                : 3.7;
    }


    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.7
                : 3.5;
    }


    /*
        Correct FPS-style movement.

        Forward follows the direction the
        player is facing.
    */

    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    const moveX =
        (
            forward * sin +
            strafe * cos
        ) *
        speed *
        dt;


    const moveZ =
        (
            forward * cos -
            strafe * sin
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        moveX;


    const nextZ =
        player.position.z +
        moveZ;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;
    }


    jumpPressed =
        false;


    velocityY -=
        20 *
        dt;


    player.position.y +=
        velocityY *
        dt;


    if (
        player.position.y <=
        0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;
    }


    checkExit();
}


/* =========================================================
   CAMERA MOVEMENT EFFECT
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
) {

    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const bob =
        moving
            ? 0.012
            : 0.003;


    camera.position.x =
        Math.sin(
            cameraTime *
            (
                moving
                    ? 7
                    : 2.5
            )
        ) *
        bob;


    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime *
            (
                moving
                    ? 10
                    : 3
            )
        ) *
        bob;


    camera.position.z =
        Math.cos(
            cameraTime *
            6
        ) *
        bob *
        0.5;


    /*
        Tiny handheld security-camera drift.
    */

    camera.rotation.z =
        Math.sin(
            cameraTime *
            0.8
        ) *
        0.0025;
}


/* =========================================================
   EXIT
========================================================= */

let exitX =
    0;

let exitZ =
    0;


function createExit() {

    const locations = [

        [-96, -84],

        [-73, -46],

        [-45, -60],

        [-18, -42],

        [12, -72],

        [40, -54],

        [66, -34],

        [-76, 12],

        [-48, 34],

        [-20, 4],

        [12, 30],

        [38, 8],

        [68, 28],

        [-92, 66],

        [-62, 86],

        [-30, 70],

        [2, 88],

        [32, 70],

        [64, 88],

        [94, 62]

    ];


    const selected =
        locations[
            Math.floor(
                Math.random() *
                locations.length
            )
        ];


    exitX =
        selected[0];

    exitZ =
        selected[1];


    const group =
        new THREE.Group();


    const frameMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x3c3c35

        });


    const left =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.28,
                2.7,
                0.28
            ),

            frameMaterial

        );


    left.position.set(
        -1.1,
        1.35,
        0
    );


    group.add(
        left
    );


    const right =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.28,
                2.7,
                0.28
            ),

            frameMaterial

        );


    right.position.set(
        1.1,
        1.35,
        0
    );


    group.add(
        right
    );


    const top =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.5,
                0.28,
                0.28
            ),

            frameMaterial

        );


    top.position.y =
        2.7;


    group.add(
        top
    );


    const green =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1.9,
                2.35
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x35b952,

                transparent:
                    true,

                opacity:
                    0.85,

                side:
                    THREE.DoubleSide

            })

        );


    green.position.y =
        1.25;


    group.add(
        green
    );


    group.position.set(
        exitX,
        0,
        exitZ
    );


    addWorldObject(
        group
    );


    exitObject =
        group;


    exitLight =
        new THREE.PointLight(
            0x35ff5c,
            7,
            16,
            1.7
        );


    exitLight.position.set(
        exitX,
        1.8,
        exitZ
    );


    scene.add(
        exitLight
    );
}


function checkExit() {

    if (
        !exitObject ||
        dead
    ) {

        return;
    }


    const distance =
        Math.hypot(

            player.position.x -
            exitX,

            player.position.z -
            exitZ

        );


    if (
        distance <
        1.8
    ) {

        winGame();
    }
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer =
    0;


function showMessage(
    text
) {

    document.getElementById(
        "message"
    ).textContent =
        text;


    messageTimer =
        2.5;
}


function updateMessage(
    dt
) {

    if (
        messageTimer <=
        0
    ) {

        return;
    }


    messageTimer -=
        dt;


    if (
        messageTimer <=
        0
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "";
    }
}


/* =========================================================
   DEATH
========================================================= */

let running =
    false;

let paused =
    false;

let dead =
    false;


function killPlayer(
    reason =
        "THE BACKROOMS GOT YOU"
) {

    if (
        dead ||
        !running
    ) {

        return;
    }


    dead =
        true;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    const title =
        document.getElementById(
            "deathTitle"
        );


    title.textContent =
        "YOU DIED";


    title.className =
        "";


    document.getElementById(
        "deathText"
    ).textContent =
        reason;


    document.getElementById(
        "retryBtn"
    ).textContent =
        "RETRY";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   WIN
========================================================= */

function winGame() {

    if (
        dead ||
        !running
    ) {

        return;
    }


    dead =
        true;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    const title =
        document.getElementById(
            "deathTitle"
        );


    title.textContent =
        "YOU ESCAPED";


    title.className =
        "win";


    document.getElementById(
        "deathText"
    ).textContent =
        "YOU FOUND THE EXIT";


    document.getElementById(
        "retryBtn"
    ).textContent =
        "PLAY AGAIN";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        dead
    ) {

        return;
    }


    paused =
        !paused;


    document.getElementById(
        "pause"
    ).style.display =
        paused
            ? "flex"
            : "none";


    if (
        paused
    ) {

        if (
            document.pointerLockElement
        ) {

            document.exitPointerLock();
        }

    } else {

        requestPointerLock();
    }
}


/* =========================================================
   POINTER LOCK
========================================================= */

function requestPointerLock() {

    if (
        !running ||
        paused ||
        dead
    ) {

        return;
    }


    document.body
        .requestPointerLock()
        .catch(
            () => {}
        );
}


document.addEventListener(
    "click",
    () => {

        if (
            running &&
            !paused &&
            !dead &&
            document.pointerLockElement !==
            document.body
        ) {

            requestPointerLock();
        }

    }
);


/* =========================================================
   CRT TOGGLE
========================================================= */

let crtEnabled =
    true;


function toggleCRT() {

    crtEnabled =
        !crtEnabled;


    const crt =
        document.getElementById(
            "crt"
        );


    crt.classList.toggle(
        "disabled",
        !crtEnabled
    );
}


/* =========================================================
   DIFFICULTY
========================================================= */

let difficulty =
    "normal";


function setDifficulty(
    value
) {

    difficulty =
        value;


    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );

            }
        );


    const button =
        document.getElementById(

            value ===
            "nightmare"

                ? "nightmareBtn"

                : value +
                  "Btn"

        );


    button.classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();
}


document.getElementById(
    "easyBtn"
).onclick =
    () =>
        setDifficulty(
            "easy"
        );


document.getElementById(
    "normalBtn"
).onclick =
    () =>
        setDifficulty(
            "normal"
        );


document.getElementById(
    "hardBtn"
).onclick =
    () =>
        setDifficulty(
            "hard"
        );


document.getElementById(
    "nightmareBtn"
).onclick =
    () =>
        setDifficulty(
            "nightmare"
        );


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    const startButton =
        document.getElementById(
            "startBtn"
        );


    startButton.disabled =
        true;


    startButton.textContent =
        "LOADING LEVEL 0...";


    try {

        if (
            !wallTexture ||
            !floorTexture ||
            !ceilingTexture
        ) {

            await loadTextures();
        }


        clearWorld();


        /*
            Player spawn.
        */

        player.position.set(
            -98,
            0,
            -88
        );


        yaw =
            0.3;

        pitch =
            -0.08;


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;


        camera.rotation.z =
            0;


        camera.position.set(
            0,
            EYE_HEIGHT,
            0
        );


        velocityY =
            0;


        grounded =
            true;


        createFloor();

        createCeiling();

        buildMap();

        buildLighting();

        createExit();

        await createEntity();


        entity.position.set(
            58,
            0.775,
            -40
        );


        entityDirection.set(
            1,
            0
        );


        entityVelocity.set(
            0,
            0
        );


        lastSeen =
            99;


        running =
            true;

        paused =
            false;

        dead =
            false;


        recordingTime =
            0;


        document.getElementById(
            "menu"
        ).style.display =
            "none";


        document.getElementById(
            "pause"
        ).style.display =
            "none";


        document.getElementById(
            "death"
        ).style.display =
            "none";


        showMessage(
            "LEVEL 0 // FIND THE EXIT"
        );


        startButton.textContent =
            "ENTER LEVEL 0";


        startButton.disabled =
            false;


        /*
            Pointer lock begins after the click.
        */

        requestPointerLock();

    } catch (
        error
    ) {

        console.error(
            error
        );


        const errorBox =
            document.getElementById(
                "error"
            );


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "GAME START ERROR\n\n" +
            error.message;


        startButton.textContent =
            "ENTER LEVEL 0";


        startButton.disabled =
            false;
    }
}


/* =========================================================
   RETURN TO MENU
========================================================= */

function returnToMenu() {

    running =
        false;

    paused =
        false;

    dead =
        false;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick =
    startGame;


document.getElementById(
    "resumeBtn"
).onclick =
    togglePause;


document.getElementById(
    "restartBtn"
).onclick =
    startGame;


document.getElementById(
    "menuBtn"
).onclick =
    returnToMenu;


document.getElementById(
    "retryBtn"
).onclick =
    startGame;


document.getElementById(
    "deathMenuBtn"
).onclick =
    returnToMenu;


/* =========================================================
   MENU IMAGE RANDOMIZER
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );


let menuIndex =
    Math.floor(
        Math.random() *
        menuImages.length
    );


function showMenuImage(
    index
) {

    menuImages.forEach(
        image => {

            image.classList.remove(
                "active"
            );

        }
    );


    if (
        menuImages[index]
    ) {

        menuImages[index]
            .classList.add(
                "active"
            );
    }
}


/*
    Start with a random image
    rather than always menu.jpg.
*/

showMenuImage(
    menuIndex
);


/*
    Change to another random image
    every minute.
*/

setInterval(
    () => {

        if (
            menuImages.length <= 1
        ) {

            return;
        }


        let nextIndex;


        do {

            nextIndex =
                Math.floor(
                    Math.random() *
                    menuImages.length
                );

        } while (
            nextIndex ===
            menuIndex
        );


        menuIndex =
            nextIndex;


        showMenuImage(
            menuIndex
        );

    },
    60000
);


/* =========================================================
   TIMER
========================================================= */

let recordingTime =
    0;


function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;
    }


    recordingTime +=
        dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total / 3600
        );


    const minutes =
        Math.floor(
            (
                total %
                3600
            ) / 60
        );


    const seconds =
        total %
        60;


    const format =
        number =>
            String(
                number
            ).padStart(
                2,
                "0"
            );


    document.getElementById(
        "tapeTime"
    ).textContent =

        format(hours) +
        ":" +
        format(minutes) +
        ":" +
        format(seconds);
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.5
            )
        );

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );

        updateEntity(
            dt
        );

        updateLights(
            dt
        );

        updateCamera(
            dt
        );

        updateEntityAudio();

        updateMessage(
            dt
        );

        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIALIZATION
========================================================= */

loadTextures();

animate();

</script>
