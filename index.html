<script>

/* =========================================================
   IMPORTANT:
   MENU INITIALIZATION IS COMPLETELY INDEPENDENT.
   A GAME LOADING ERROR CANNOT BREAK THE MENU.
========================================================= */

(function(){

"use strict";

const $ = id => document.getElementById(id);

let gameStarted = false;
let paused = false;
let dead = false;
let difficulty = "normal";

let controlsOpen = false;

/* =========================================================
   SAFE MENU FUNCTIONS
========================================================= */

function showControls(){
    controlsOpen = true;
    $("controlsBox").style.display = "flex";
}

function hideControls(){
    controlsOpen = false;
    $("controlsBox").style.display = "none";
}

function showMenu(){
    gameStarted = false;
    paused = false;
    dead = false;

    $("menu").style.display = "block";
    $("pause").style.display = "none";
    $("death").style.display = "none";

    if(document.pointerLockElement){
        document.exitPointerLock();
    }
}

function safeStart(){

    if(typeof window.startBackrooms === "function"){
        window.startBackrooms();
        return;
    }

    /*
        The game may still be loading.
        Start button remains functional and waits.
    */

    $("message").textContent = "LOADING LEVEL 0...";

    window.pendingStart = true;
}

/* =========================================================
   DIFFICULTY
========================================================= */

function selectDifficulty(value){

    difficulty = value;

    [
        ["easyBtn","easy"],
        ["normalBtn","normal"],
        ["hardBtn","hard"],
        ["nightmareBtn","nightmare"]
    ].forEach(pair=>{
        $(pair[0]).classList.toggle(
            "selected",
            pair[1] === value
        );
    });

    $("difficultyHud").textContent =
        value.toUpperCase();

}

/* =========================================================
   BUTTON EVENTS
   ATTACHED IMMEDIATELY
========================================================= */

$("startBtn").addEventListener(
    "click",
    safeStart
);

$("menuControlsBtn").addEventListener(
    "click",
    showControls
);

$("controlsBackBtn").addEventListener(
    "click",
    hideControls
);

$("easyBtn").addEventListener(
    "click",
    ()=>selectDifficulty("easy")
);

$("normalBtn").addEventListener(
    "click",
    ()=>selectDifficulty("normal")
);

$("hardBtn").addEventListener(
    "click",
    ()=>selectDifficulty("hard")
);

$("nightmareBtn").addEventListener(
    "click",
    ()=>selectDifficulty("nightmare")
);

$("resumeBtn").addEventListener(
    "click",
    ()=>{
        if(typeof window.resumeBackrooms === "function")
            window.resumeBackrooms();
    }
);

$("pauseControlsBtn").addEventListener(
    "click",
    showControls
);

$("restartBtn").addEventListener(
    "click",
    safeStart
);

$("menuBtn").addEventListener(
    "click",
    showMenu
);

$("retryBtn").addEventListener(
    "click",
    safeStart
);

$("deathMenuBtn").addEventListener(
    "click",
    showMenu
);

/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Escape"){

            if(controlsOpen){
                hideControls();
                return;
            }

            if(
                gameStarted &&
                !dead &&
                typeof window.toggleBackroomsPause === "function"
            ){

                window.toggleBackroomsPause();

            }

        }

    }
);

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages =
    document.querySelectorAll(".menuImage");

let menuIndex = 0;

setInterval(
    ()=>{

        if(!menuImages.length)
            return;

        menuImages[menuIndex]
            .classList.remove("active");

        menuIndex =
            (menuIndex + 1) %
            menuImages.length;

        menuImages[menuIndex]
            .classList.add("active");

    },
    6000
);

/* =========================================================
   EXPOSE STATE
========================================================= */

window.getDifficulty =
    ()=>difficulty;

window.setGameStarted =
    value=>{
        gameStarted = value;
    };

window.setPaused =
    value=>{
        paused = value;
    };

window.setDead =
    value=>{
        dead = value;
    };

window.showGameMenu =
    showMenu;

})();

/* =========================================================
   GAME
========================================================= */

(function(){

"use strict";

/* =========================================================
   THREE CHECK
========================================================= */

if(typeof THREE === "undefined"){

    const e =
        document.getElementById("error");

    e.style.display = "block";

    e.textContent =
        "THREE.JS COULD NOT BE LOADED.\n\n" +
        "Make sure three.min.js is in the repository root.";

    return;
}

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

let gameTime = 0;

let initialized = false;

/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x80764c);

scene.fog =
    new THREE.Fog(
        0x80764c,
        35,
        115
    );

/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .05,
        500
    );

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:
            "high-performance"

    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.15
    )
);

if("outputColorSpace" in renderer){

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

}

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    .72;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

/*
   Very low ambient illumination.
   Most illumination comes from the ceiling fixtures.
*/

scene.add(
    new THREE.AmbientLight(
        0xffe8a0,
        .13
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xffe8b0,
        0x11100d,
        .16
    )
);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE = 3;
const WALL_HEIGHT = 9;

const PLAYER_RADIUS = .46;

const EYE_HEIGHT = 5.25;
const CROUCH_EYE_HEIGHT = 3.05;

const WALK_SPEED = 5.6;
const SPRINT_SPEED = 8.8;

const JUMP_SPEED = 8.8;
const GRAVITY = 23;

/*
   Nightmare entity is roughly as fast as
   sprint-jumping.
*/

const ENTITY_SPEED = {

    easy:5.2,
    normal:6.5,
    hard:7.8,
    nightmare:9.0

};

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;
let entityTexture = null;

function configureTexture(
    texture,
    repeatX,
    repeatY
){

    if(!texture)
        return null;

    if("colorSpace" in texture){

        texture.colorSpace =
            THREE.SRGBColorSpace;

    }

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            2
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(
    path,
    repeatX,
    repeatY
){

    return new Promise(resolve=>{

        textureLoader.load(

            path,

            texture=>{

                console.log(
                    "TEXTURE LOADED:",
                    path
                );

                resolve(
                    configureTexture(
                        texture,
                        repeatX,
                        repeatY
                    )
                );

            },

            undefined,

            error=>{

                console.error(
                    "TEXTURE FAILED:",
                    path,
                    error
                );

                resolve(null);

            }

        );

    });

}

/* =========================================================
   MAP
========================================================= */

let mapWidth = 0;
let mapHeight = 0;

let mapData = [];

let playerSpawn = null;
let entitySpawn = null;

const wallColliders = [];
const hidingSpots = [];
const holeCells = [];
const walkableCells = [];

/* =========================================================
   MAP CLASSIFICATION
========================================================= */

function classifyPixel(
    r,
    g,
    b
){

    /*
       BLACK = WALL
    */

    if(
        Math.max(r,g,b) < 75
    ){

        return "wall";

    }

    /*
       RED = PLAYER SPAWN
    */

    if(
        r > 150 &&
        r > g * 1.45 &&
        r > b * 1.45
    ){

        return "spawn";

    }

    /*
       BLUE = ENTITY SPAWN
    */

    if(
        b > 130 &&
        b > r * 1.35 &&
        b > g * 1.2
    ){

        return "entity";

    }

    /*
       PURPLE/MAGENTA = HIDING
    */

    if(
        r > 105 &&
        b > 105 &&
        g < 120
    ){

        return "hide";

    }

    /*
       YELLOW = HOLE
    */

    if(
        r > 145 &&
        g > 120 &&
        b < 125
    ){

        return "hole";

    }

    return "floor";

}

/* =========================================================
   CELL/WORLD
========================================================= */

function cellToWorld(
    x,
    y
){

    return {

        x:
            (x+.5)*TILE -
            mapWidth*TILE/2,

        z:
            (y+.5)*TILE -
            mapHeight*TILE/2

    };

}

function worldToCell(
    x,
    z
){

    return {

        x:
            Math.floor(
                (x +
                mapWidth*TILE/2) /
                TILE
            ),

        y:
            Math.floor(
                (z +
                mapHeight*TILE/2) /
                TILE
            )

    };

}

function cellValid(
    x,
    y
){

    return (
        x >= 0 &&
        y >= 0 &&
        x < mapWidth &&
        y < mapHeight
    );

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image =
        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();

                img.onload =
                    ()=>resolve(img);

                img.onerror =
                    ()=>reject(
                        new Error(
                            "textures/map1.png could not be loaded."
                        )
                    );

                img.src =
                    "./textures/map1.png?v=" +
                    Date.now();

            }
        );

    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;

    if(
        mapWidth < 2 ||
        mapHeight < 2
    ){

        throw new Error(
            "map1.png loaded but has invalid dimensions."
        );

    }

    const canvas =
        document.createElement("canvas");

    canvas.width =
        mapWidth;

    canvas.height =
        mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData = [];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row = [];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i =
                (y*mapWidth+x)*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2]
                );

            row.push(type);

            const p =
                cellToWorld(
                    x,
                    y
                );

            if(type !== "wall"){

                walkableCells.push({
                    x,
                    y
                });

            }

            if(type === "hole"){

                holeCells.push({
                    x,
                    y
                });

            }

            if(type === "hide"){

                hidingSpots.push({
                    x:p.x,
                    z:p.z,
                    cellX:x,
                    cellY:y
                });

            }

            if(
                type === "spawn" &&
                !playerSpawn
            ){

                playerSpawn = p;

            }

            if(
                type === "entity" &&
                !entitySpawn
            ){

                entitySpawn = p;

            }

        }

        mapData.push(row);

    }

    /*
       Fallback player spawn.
    */

    if(!playerSpawn){

        const candidate =
            walkableCells.find(
                c =>
                    mapData[c.y][c.x] ===
                    "floor"
            );

        if(candidate){

            playerSpawn =
                cellToWorld(
                    candidate.x,
                    candidate.y
                );

        }

    }

    if(!playerSpawn){

        throw new Error(
            "map1.png contains no usable player spawn."
        );

    }

    /*
       Fallback entity spawn.
    */

    if(!entitySpawn){

        const candidate =
            walkableCells[
                Math.floor(
                    walkableCells.length*.65
                )
            ];

        if(candidate){

            entitySpawn =
                cellToWorld(
                    candidate.x,
                    candidate.y
                );

        }else{

            entitySpawn = {

                x:
                    playerSpawn.x + 24,

                z:
                    playerSpawn.z + 24

            };

        }

    }

    console.log(
        "MAP:",
        mapWidth,
        "x",
        mapHeight,
        "holes:",
        holeCells.length,
        "hiding:",
        hidingSpots.length
    );

}

/* =========================================================
   MATERIALS
========================================================= */

function wallMaterial(){

    return new THREE.MeshBasicMaterial({

        map:wallTexture,

        color:
            wallTexture
            ? 0xffffff
            : 0xff00ff,

        side:
            THREE.DoubleSide

    });

}

function floorMaterial(){

    return new THREE.MeshBasicMaterial({

        map:floorTexture,

        color:
            floorTexture
            ? 0xffffff
            : 0xff00ff,

        side:
            THREE.DoubleSide

    });

}

function ceilingMaterial(){

    return new THREE.MeshBasicMaterial({

        map:ceilingTexture,

        color:
            ceilingTexture
            ? 0xffffff
            : 0xff00ff,

        side:
            THREE.DoubleSide

    });

}

/* =========================================================
   WORLD BUILD
========================================================= */

function addFloor(
    x,
    z
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            floorMaterial()

        );

    mesh.rotation.x =
        -Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    world.add(mesh);

}

function addCeiling(
    x,
    z
){

    /*
       Ceiling ALWAYS exists,
       including above holes.
    */

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            ceilingMaterial()

        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    world.add(mesh);

}

function addWall(
    x,
    z
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),

            wallMaterial()

        );

    mesh.position.set(
        x,
        WALL_HEIGHT/2,
        z
    );

    world.add(mesh);

    wallColliders.push({

        minX:
            x-TILE/2,

        maxX:
            x+TILE/2,

        minZ:
            z-TILE/2,

        maxZ:
            z+TILE/2

    });

}

/* =========================================================
   3D HOLES
========================================================= */

function addHole(
    x,
    z
){

    /*
       No floor texture is loaded here.

       Instead this is a REAL opening with:
       - dark depth
       - interior walls
       - rim
       - bottom darkness

       This makes holes actually look 3D.
    */

    const holeGroup =
        new THREE.Group();

    holeGroup.position.set(
        x,
        0,
        z
    );

    /*
       Deep interior.
    */

    const pit =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE*.88,
                5.5,
                TILE*.88
            ),

            new THREE.MeshBasicMaterial({
                color:0x030303,
                side:THREE.BackSide
            })

        );

    pit.position.y =
        -2.75;

    holeGroup.add(pit);

    /*
       Four interior sides.
    */

    const darkMaterial =
        new THREE.MeshBasicMaterial({
            color:0x16130d
        });

    const sideA =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                5.5,
                .10
            ),
            darkMaterial
        );

    sideA.position.set(
        0,
        -2.75,
        -TILE/2
    );

    holeGroup.add(sideA);

    const sideB =
        sideA.clone();

    sideB.position.z =
        TILE/2;

    holeGroup.add(sideB);

    const sideC =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .10,
                5.5,
                TILE
            ),
            darkMaterial
        );

    sideC.position.set(
        -TILE/2,
        -2.75,
        0
    );

    holeGroup.add(sideC);

    const sideD =
        sideC.clone();

    sideD.position.x =
        TILE/2;

    holeGroup.add(sideD);

    /*
       Slightly raised rim so the opening
       has visible thickness.
    */

    const rimMaterial =
        new THREE.MeshBasicMaterial({
            color:0x4b4531
        });

    const rim1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                .12,
                .10
            ),
            rimMaterial
        );

    rim1.position.set(
        0,
        -.04,
        -TILE/2
    );

    holeGroup.add(rim1);

    const rim2 =
        rim1.clone();

    rim2.position.z =
        TILE/2;

    holeGroup.add(rim2);

    const rim3 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .10,
                .12,
                TILE
            ),
            rimMaterial
        );

    rim3.position.set(
        -TILE/2,
        -.04,
        0
    );

    holeGroup.add(rim3);

    const rim4 =
        rim3.clone();

    rim4.position.x =
        TILE/2;

    holeGroup.add(rim4);

    world.add(holeGroup);

}

const ceilingLights = [];

function addCeilingLight(
    x,
    z
){

    /*
       Light fixture is exactly one ceiling tile.
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE*.96,
                .07,
                TILE*.96
            ),

            new THREE.MeshBasicMaterial({

                color:0xfff5ce

            })

        );

    fixture.position.set(
        x,
        WALL_HEIGHT-.07,
        z
    );

    world.add(fixture);

    const light =
        new THREE.PointLight(
            0xffe8a8,
            4.0,
            15,
            1.7
        );

    light.position.set(
        x,
        WALL_HEIGHT-.25,
        z
    );

    world.add(light);

    ceilingLights.push({
        light,
        base:4.0,
        timer:
            Math.random()*4
    });

}

function buildLighting(){

    /*
       Only place lights on ordinary floor cells.
       This greatly reduces light count.
    */

    for(
        let i=0;
        i<walkableCells.length;
        i+=10
    ){

        const c =
            walkableCells[i];

        if(
            mapData[c.y][c.x] ===
            "wall"
        )
            continue;

        const p =
            cellToWorld(
                c.x,
                c.y
            );

        addCeilingLight(
            p.x,
            p.z
        );

    }

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                mapData[y][x];

            const p =
                cellToWorld(
                    x,
                    y
                );

            if(type === "wall"){

                addWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
               NORMAL FLOOR
            */

            if(type !== "hole"){

                addFloor(
                    p.x,
                    p.z
                );

            }

            /*
               HOLE:
               intentionally NO FLOOR.
            */

            if(type === "hole"){

                addHole(
                    p.x,
                    p.z
                );

            }

            /*
               Ceiling remains regardless.
            */

            addCeiling(
                p.x,
                p.z
            );

            /*
               Visible locker.
            */

            if(type === "hide"){

                addLocker(
                    p.x,
                    p.z
                );

            }

        }

    }

    buildLighting();

}

/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
){

    const r =
        PLAYER_RADIUS;

    for(
        const wall of wallColliders
    ){

        if(
            x+r > wall.minX &&
            x-r < wall.maxX &&
            z+r > wall.minZ &&
            z-r < wall.maxZ
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(
    dx,
    dz
){

    const nx =
        player.position.x + dx;

    const nz =
        player.position.z + dz;

    if(
        !collides(
            nx,
            player.position.z
        )
    ){

        player.position.x =
            nx;

    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){

        player.position.z =
            nz;

    }

}

/* =========================================================
   HOLE HITBOX
========================================================= */

function entirePlayerOverHole(){

    /*
       Four corners of the player's hitbox
       must all be inside hole cells.

       This means you can run/jump over an opening.
    */

    const r =
        PLAYER_RADIUS;

    const points = [

        [
            player.position.x-r,
            player.position.z-r
        ],

        [
            player.position.x+r,
            player.position.z-r
        ],

        [
            player.position.x-r,
            player.position.z+r
        ],

        [
            player.position.x+r,
            player.position.z+r
        ]

    ];

    for(
        const p of points
    ){

        const c =
            worldToCell(
                p[0],
                p[1]
            );

        if(
            !cellValid(
                c.x,
                c.y
            )
        ){

            return false;

        }

        if(
            mapData[c.y][c.x] !==
            "hole"
        ){

            return false;

        }

    }

    return true;

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer += dt;

        const p =
            Math.min(
                fallTimer/1.8,
                1
            );

        player.position.y =
            -p*6;

        camera.position.y =
            EYE_HEIGHT -
            p*1.5;

        camera.rotation.z =
            Math.sin(
                fallTimer*18
            )*.035;

        if(
            fallTimer >= 1.8
        ){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching =
        !!keys.c;

    let forward = 0;
    let strafe = 0;

    if(keys.w)
        forward += 1;

    if(keys.s)
        forward -= 1;

    if(keys.d)
        strafe += 1;

    if(keys.a)
        strafe -= 1;

    const len =
        Math.hypot(
            forward,
            strafe
        );

    if(len > 0){

        forward /= len;
        strafe /= len;

        let speed =
            WALK_SPEED;

        if(
            keys.shift &&
            !crouching
        ){

            speed =
                SPRINT_SPEED;

        }

        if(crouching){

            speed *= .58;

        }

        /*
           Sprint-jumping gives a slight speed boost.
        */

        if(
            !grounded &&
            keys.shift
        ){

            speed *= 1.08;

        }

        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);

        const dx =
            (
                strafe*cos -
                forward*sin
            ) *
            speed *
            dt;

        const dz =
            (
                -forward*cos -
                strafe*sin
            ) *
            speed *
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    /*
       Gravity.
    */

    velocityY -=
        GRAVITY*dt;

    player.position.y +=
        velocityY*dt;

    if(
        player.position.y <= 0
    ){

        player.position.y = 0;
        velocityY = 0;
        grounded = true;

    }else{

        grounded = false;

    }

    /*
       Jump.
    */

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY =
            JUMP_SPEED;

        grounded = false;

    }

    keys.spacePressed = false;

    /*
       Camera height.
    */

    const targetHeight =
        crouching
        ?
        CROUCH_EYE_HEIGHT
        :
        EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();

    /*
       Entire hitbox must be over hole.
    */

    if(
        grounded &&
        entirePlayerOverHole()
    ){

        falling = true;
        fallTimer = 0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let nearest = null;
    let nearestDistance = Infinity;

    for(
        const spot of hidingSpots
    ){

        const d =
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(
            d < nearestDistance
        ){

            nearestDistance = d;
            nearest = spot;

        }

    }

    const near =
        nearest &&
        nearestDistance < 2.1;

    hidden =
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near && !hidden
        ?
        "1"
        :
        "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ?
        "1"
        :
        "0";

}

/* =========================================================
   ENTITY IMAGE
========================================================= */

async function loadEntityTexture(){

    return new Promise(resolve=>{

        textureLoader.load(

            "./entity.png",

            texture=>{

                entityTexture =
                    texture;

                if(
                    "colorSpace"
                    in texture
                ){

                    texture.colorSpace =
                        THREE.SRGBColorSpace;

                }

                texture.wrapS =
                    THREE.ClampToEdgeWrapping;

                texture.wrapT =
                    THREE.ClampToEdgeWrapping;

                texture.magFilter =
                    THREE.LinearFilter;

                texture.minFilter =
                    THREE.LinearFilter;

                entityTextureReady =
                    true;

                resolve(texture);

            },

            undefined,

            ()=>{
                console.warn(
                    "entity.png could not load."
                );

                resolve(null);

            }

        );

    });

}

/* =========================================================
   ENTITY CREATION
========================================================= */

function createEntity(){

    if(entity){

        world.remove(entity);

    }

    /*
       Preserve the actual PNG aspect ratio.
       This prevents stretching.
    */

    let aspect = .5;

    if(
        entityTexture &&
        entityTexture.image
    ){

        const iw =
            entityTexture.image.naturalWidth ||
            entityTexture.image.width ||
            1;

        const ih =
            entityTexture.image.naturalHeight ||
            entityTexture.image.height ||
            2;

        aspect =
            iw / ih;

    }

    /*
       Large entity.
    */

    const height = 6.8;

    const width =
        Math.max(
            1.8,
            height * aspect
        );

    const material =
        new THREE.MeshBasicMaterial({

            map:
                entityTexture,

            color:
                entityTexture
                ? 0xffffff
                : 0x080808,

            transparent:true,

            alphaTest:.02,

            side:THREE.DoubleSide,

            depthWrite:true

        });

    entity =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            material

        );

    entity.position.set(
        entitySpawn.x,
        height/2,
        entitySpawn.z
    );

    world.add(entity);

    lastEntityX =
        entity.position.x;

    lastEntityZ =
        entity.position.z;

}

/* =========================================================
   ENTITY PATHFINDING
========================================================= */

function isEntityWalkable(
    x,
    y
){

    if(
        !cellValid(x,y)
    )
        return false;

    const type =
        mapData[y][x];

    /*
       Entity can use floors and lockers.
       It avoids holes.
    */

    return (
        type !== "wall" &&
        type !== "hole"
    );

}

function findNearestWalkable(
    cell
){

    if(
        isEntityWalkable(
            cell.x,
            cell.y
        )
    ){

        return cell;

    }

    for(
        let radius=1;
        radius<15;
        radius++
    ){

        for(
            let dy=-radius;
            dy<=radius;
            dy++
        ){

            for(
                let dx=-radius;
                dx<=radius;
                dx++
            ){

                const x =
                    cell.x+dx;

                const y =
                    cell.y+dy;

                if(
                    isEntityWalkable(
                        x,
                        y
                    )
                ){

                    return {
                        x,
                        y
                    };

                }

            }

        }

    }

    return null;

}

/*
   Fast BFS pathfinder.
   It runs only a few times per second,
   not every frame.
*/

function findPath(){

    if(!entity)
        return;

    const start =
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const target =
        worldToCell(
            player.position.x,
            player.position.z
        );

    const s =
        findNearestWalkable(start);

    const t =
        findNearestWalkable(target);

    if(!s || !t)
        return;

    const queue = [];

    const visited =
        new Set();

    const parent =
        new Map();

    const key =
        (x,y)=>
            x + "," + y;

    queue.push(s);

    visited.add(
        key(s.x,s.y)
    );

    const dirs = [

        [1,0],
        [-1,0],
        [0,1],
        [0,-1]

    ];

    let found = false;

    while(
        queue.length &&
        visited.size < 12000
    ){

        const current =
            queue.shift();

        if(
            current.x === t.x &&
            current.y === t.y
        ){

            found = true;
            break;

        }

        for(
            const d of dirs
        ){

            const nx =
                current.x+d[0];

            const ny =
                current.y+d[1];

            const k =
                key(nx,ny);

            if(
                visited.has(k)
            )
                continue;

            if(
                !isEntityWalkable(
                    nx,
                    ny
                )
            )
                continue;

            visited.add(k);

            parent.set(
                k,
                current
            );

            queue.push({
                x:nx,
                y:ny
            });

        }

    }

    if(!found){

        entityPath = [];

        return;

    }

    const path = [];

    let current = t;

    while(
        current.x !== s.x ||
        current.y !== s.y
    ){

        path.push(current);

        const p =
            parent.get(
                key(
                    current.x,
                    current.y
                )
            );

        if(!p)
            break;

        current = p;

    }

    path.push(s);

    path.reverse();

    entityPath = path;

    /*
       Skip the cell we're already standing in.
    */

    entityPathIndex =
        Math.min(
            1,
            entityPath.length-1
        );

}

/* =========================================================
   ENTITY STUCK RECOVERY
========================================================= */

function teleportEntityNearPlayer(){

    const playerCell =
        worldToCell(
            player.position.x,
            player.position.z
        );

    /*
       At least 20 MAP PIXELS away.

       We interpret "pixels on the map" literally
       as map cells.
    */

    const MIN_DISTANCE = 20;

    const candidates = [];

    for(
        let i=0;
        i<walkableCells.length;
        i++
    ){

        const c =
            walkableCells[i];

        if(
            mapData[c.y][c.x] ===
            "hole"
        )
            continue;

        const dx =
            c.x-playerCell.x;

        const dy =
            c.y-playerCell.y;

        const distance =
            Math.hypot(
                dx,
                dy
            );

        if(
            distance >= MIN_DISTANCE
        ){

            candidates.push({
                cell:c,
                distance
            });

        }

    }

    if(!candidates.length)
        return;

    /*
       Prefer a place that is not directly visible.
    */

    candidates.sort(
        (a,b)=>
            Math.abs(a.distance-25) -
            Math.abs(b.distance-25)
    );

    const chosen =
        candidates[
            Math.floor(
                Math.random()*
                Math.min(
                    candidates.length,
                    12
                )
            )
        ];

    const p =
        cellToWorld(
            chosen.cell.x,
            chosen.cell.y
        );

    entity.position.x =
        p.x;

    entity.position.z =
        p.z;

    entityPath = [];

    entityPathIndex = 0;

    stuckTimer = 0;

    pathTimer = 0;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        !gameStarted ||
        paused ||
        dead
    )
        return;

    /*
       Always knows player position.
       Recalculate path frequently enough
       to follow a moving target.
    */

    pathTimer -= dt;

    if(
        pathTimer <= 0
    ){

        pathTimer =
            difficulty === "nightmare"
            ? .22
            : .35;

        findPath();

    }

    let targetX =
        player.position.x;

    let targetZ =
        player.position.z;

    if(
        entityPath.length &&
        entityPathIndex <
        entityPath.length
    ){

        const node =
            entityPath[
                entityPathIndex
            ];

        const p =
            cellToWorld(
                node.x,
                node.y
            );

        targetX = p.x;
        targetZ = p.z;

        const distanceToNode =
            Math.hypot(
                entity.position.x-targetX,
                entity.position.z-targetZ
            );

        if(
            distanceToNode < .55
        ){

            entityPathIndex++;

        }

    }

    let dx =
        targetX -
        entity.position.x;

    let dz =
        targetZ -
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    if(distance > .05){

        dx /= distance;
        dz /= distance;

    }

    const speed =
        ENTITY_SPEED[
            difficulty
        ] || 6.5;

    const nx =
        entity.position.x +
        dx*speed*dt;

    const nz =
        entity.position.z +
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz
        )
    ){

        entity.position.x =
            nx;

        entity.position.z =
            nz;

    }else{

        /*
           Try sliding around corners.
        */

        const slideX =
            entity.position.x +
            dx*speed*dt;

        const slideZ =
            entity.position.z +
            dz*speed*dt;

        if(
            !collides(
                slideX,
                entity.position.z
            )
        ){

            entity.position.x =
                slideX;

        }else if(
            !collides(
                entity.position.x,
                slideZ
            )
        ){

            entity.position.z =
                slideZ;

        }

    }

    /*
       Stuck detection.
    */

    const movement =
        Math.hypot(
            entity.position.x-lastEntityX,
            entity.position.z-lastEntityZ
        );

    if(
        movement < .025 &&
        distance > 2
    ){

        stuckTimer += dt;

    }else{

        stuckTimer =
            Math.max(
                0,
                stuckTimer-dt*.5
            );

    }

    lastEntityX =
        entity.position.x;

    lastEntityZ =
        entity.position.z;

    if(
        stuckTimer > 2.0
    ){

        teleportEntityNearPlayer();

    }

    /*
       Billboard toward camera.
    */

    entity.rotation.y =
        Math.atan2(
            camera.position.x -
            entity.position.x,
            camera.position.z -
            entity.position.z
        );

    /*
       Death range.
    */

    const playerDistance =
        Math.hypot(
            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );

    if(
        playerDistance < 1.15 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   AUDIO
========================================================= */

const entityAudio =
    new Audio(
        "./sounds/entity.mp3"
    );

entityAudio.loop = true;
entityAudio.preload = "auto";
entityAudio.volume = 0;

let audioStarted = false;

function startEntityAudio(){

    /*
       Browser autoplay requires a user interaction.
       Start it from ENTER LEVEL 0.
    */

    if(audioStarted)
        return;

    entityAudio.volume = 0;

    const promise =
        entityAudio.play();

    if(promise){

        promise
            .then(()=>{
                audioStarted = true;
            })
            .catch(
                error=>{
                    console.warn(
                        "Entity audio waiting for interaction.",
                        error
                    );
                }
            );

    }

}

function updateAudio(){

    if(
        !entity ||
        !gameStarted ||
        dead
    ){

        entityAudio.volume = 0;

        return;

    }

    const distance =
        Math.hypot(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );

    /*
       Silent beyond 35 units.

       Maximum volume around 7 units.
    */

    const minDistance = 7;
    const maxDistance = 35;

    let entityVolume =
        1 -
        (
            (distance-minDistance) /
            (maxDistance-minDistance)
        );

    entityVolume =
        THREE.MathUtils.clamp(
            entityVolume,
            0,
            1
        );

    /*
       Smoother distance curve.
    */

    entityVolume =
        entityVolume *
        entityVolume;

    entityVolume *= .95;

    entityAudio.volume =
        entityVolume;

    /*
       Video is inverse volume.

       Entity audio 0.25 = video 0.75
       Entity audio 0.75 = video 0.25
    */

    updateOverlayVideo(
        entityVolume
    );

    if(
        entityVolume > .01 &&
        !audioStarted
    ){

        startEntityAudio();

    }

}

/* =========================================================
   VIDEO
========================================================= */

const overlayVideo =
    document.getElementById(
        "overlayVideo"
    );

let videoStarted = false;

function startOverlayVideo(){

    if(videoStarted)
        return;

    overlayVideo.muted = true;

    const p =
        overlayVideo.play();

    if(p){

        p.then(
            ()=>{
                videoStarted = true;
            }
        ).catch(
            ()=>{
                /*
                   Browser may require another interaction.
                */
            }
        );

    }

}

function updateOverlayVideo(
    entityVolume
){

    /*
       Inverse relationship.
    */

    const videoVolume =
        1 - entityVolume;

    /*
       The MP4 is muted for autoplay compatibility,
       but the visual opacity follows the same
       inverse relationship.

       This prevents a browser from blocking the
       actual game because of video audio autoplay.
    */

    overlayVideo.volume =
        videoVolume;

    overlayVideo.style.opacity =
        .25 +
        videoVolume*.55;

}

/* =========================================================
   DEATH
========================================================= */

function die(
    reason
){

    if(dead)
        return;

    dead = true;

    document.getElementById(
        "deathText"
    ).textContent =
        reason;

    document.getElementById(
        "death"
    ).style.display =
        "flex";

    entityAudio.pause();
    entityAudio.volume = 0;

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = 0;

function showMessage(
    text
){

    document.getElementById(
        "message"
    ).textContent =
        text;

    messageTimer = 2.5;

}

function updateMessage(dt){

    if(
        messageTimer > 0
    ){

        messageTimer -= dt;

        if(
            messageTimer <= 0
        ){

            document.getElementById(
                "message"
            ).textContent =
                "";

        }

    }

}

/* =========================================================
   RESET
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw = 0;
    pitch = 0;

    player.rotation.y = 0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y =
        EYE_HEIGHT;

    velocityY = 0;

    grounded = true;

    falling = false;

    fallTimer = 0;

    crouching = false;
    hidden = false;

}

/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    if(!initialized){

        showMessage(
            "LOADING LEVEL 0..."
        );

        window.pendingStart = true;

        return;

    }

    difficulty =
        window.getDifficulty
        ? window.getDifficulty()
        : "normal";

    gameStarted = true;
    paused = false;
    dead = false;

    window.setGameStarted(true);
    window.setPaused(false);
    window.setDead(false);

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    resetPlayer();

    /*
       Recreate entity every run.
    */

    createEntity();

    startEntityAudio();
    startOverlayVideo();

    gameTime = 0;

    if(
        renderer.domElement.requestPointerLock
    ){

        renderer.domElement.requestPointerLock();

    }

}

window.startBackrooms =
    startGame;

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused =
        !paused;

    window.setPaused(
        paused
    );

    document.getElementById(
        "pause"
    ).style.display =
        paused
        ?
        "flex"
        :
        "none";

    if(paused){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

        entityAudio.volume = 0;

    }else{

        renderer.domElement
            .requestPointerLock();

    }

}

window.toggleBackroomsPause =
    togglePause;

window.resumeBackrooms =
    ()=>{
        if(paused)
            togglePause();
    };

/* =========================================================
   INPUT
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key =
            event.key.toLowerCase();

        if(
            key === " " ||
            event.code === "Space"
        ){

            event.preventDefault();

            if(
                !event.repeat
            ){

                keys.spacePressed =
                    true;

            }

        }else{

            keys[key] = true;

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        const key =
            event.key.toLowerCase();

        keys[key] = false;

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement !==
            renderer.domElement
        )
            return;

        yaw -=
            event.movementX*.0021;

        pitch -=
            event.movementY*.0018;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock();

        }

    }
);

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(dt){

    /*
       Only update occasionally.
       Saves CPU.
    */

    for(
        const fixture of ceilingLights
    ){

        fixture.timer -= dt;

        if(
            fixture.timer <= 0
        ){

            fixture.timer =
                .7 +
                Math.random()*5;

            if(
                Math.random() < .12
            ){

                fixture.light.intensity =
                    fixture.base *
                    (.25 +
                    Math.random()*.35);

            }else{

                fixture.light.intensity =
                    fixture.base;

            }

        }

    }

}

/* =========================================================
   TAPE TIME
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime += dt;

    const total =
        Math.floor(
            gameTime
        );

    const h =
        Math.floor(
            total/3600
        );

    const m =
        Math.floor(
            (total%3600)/60
        );

    const s =
        total%60;

    const f =
        n =>
            String(n)
            .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent =
        f(h)+":"+
        f(m)+":"+
        f(s);

}

/* =========================================================
   ANIMATION
========================================================= */

let lastTime =
    performance.now();

let audioAccumulator = 0;

function animate(){

    requestAnimationFrame(
        animate
    );

    const now =
        performance.now();

    let dt =
        (now-lastTime)/1000;

    lastTime =
        now;

    dt =
        Math.min(
            dt,
            .05
        );

    updatePlayer(dt);

    updateEntity(dt);

    updateLights(dt);

    updateMessage(dt);

    updateTapeTime(dt);

    /*
       Audio doesn't need updating every frame.
       20 updates/sec is enough and reduces work.
    */

    audioAccumulator += dt;

    if(
        audioAccumulator >= .05
    ){

        audioAccumulator = 0;

        updateAudio();

    }

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

   INITIALIZATION
========================================================= */

async function initialize(){

    try{

        console.log(
            "BACKROOMS INITIALIZATION"
        );

        /*
           Load textures independently.
           A failed optional texture doesn't destroy
           the menu.
        */

        const results =
            await Promise.all([

                loadTexture(
                    "./textures/wall.png",
                    1.1,
                    1.1
                ),

                loadTexture(
                    "./textures/floor.png",
                    1,
                    1
                ),

                loadTexture(
                    "./textures/ceiling.png",
                    1,
                    1
                ),

                loadEntityTexture(),

                loadMap()

            ]);

        wallTexture =
            results[0];

        floorTexture =
            results[1];

        ceilingTexture =
            results[2];

        /*
           Don't abort because entity.png failed.
        */

        buildWorld();

        createEntity();

        initialized = true;

        /*
           Menu remains usable even if a noncritical
           asset failed.
        */

        if(
            window.pendingStart
        ){

            window.pendingStart =
                false;

            startGame();

        }

        console.log(
            "BACKROOMS READY"
        );

    }catch(error){

        console.error(
            error
        );

        /*
           Crucial:
           Do NOT throw here.

           The menu remains functional.
        */

        const errorBox =
            document.getElementById(
                "error"
            );

        errorBox.style.display =
            "block";

        errorBox.textContent =
            "LEVEL LOADING ERROR\n\n" +
            (
                error &&
                error.stack
                ?
                error.stack
                :
                String(error)
            );

    }

}

/* =========================================================
   START
========================================================= */

initialize();

})();
