<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>THE BACKROOMS — LEVEL 0</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    user-select:none;
}

canvas{
    display:block;
}

/* =========================================================
   MAIN MENU
========================================================= */

#menu{
    position:fixed;
    inset:0;
    z-index:1000;
    overflow:hidden;
    background:#080807;
}

.menuImage{
    position:absolute;
    inset:-4%;
    width:108%;
    height:108%;
    object-fit:cover;

    opacity:0;

    filter:
        brightness(.55)
        contrast(1.15)
        saturate(.72)
        sepia(.08);

    transform:scale(1.04);

    transition:
        opacity 1.5s ease,
        transform 12s ease;
}

.menuImage.active{
    opacity:1;
    transform:scale(1);
}

.menuDark{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.82),
            rgba(0,0,0,.15) 58%,
            rgba(0,0,0,.72)
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.95),
            transparent 70%
        );
}

.menuNoise{
    position:absolute;
    inset:-20%;

    pointer-events:none;
    opacity:.09;

    background:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.7) 0,
            transparent 1px,
            transparent 4px
        );

    animation:
        menuNoise .08s steps(2) infinite;
}

@keyframes menuNoise{
    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(-3px,2px);
    }

    50%{
        transform:translate(2px,-3px);
    }

    75%{
        transform:translate(3px,1px);
    }

    100%{
        transform:translate(0,0);
    }
}

.menuScanlines{
    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.045) 0,
            rgba(255,255,255,.045) 1px,
            transparent 2px,
            transparent 5px
        );

    opacity:.18;
}

.menuContent{
    position:absolute;

    left:7%;
    bottom:12%;

    color:white;

    text-shadow:
        2px 3px 8px #000,
        0 0 25px #000;
}

.menuContent h1{
    margin:0;

    color:#d8ce82;

    font-size:
        clamp(42px,6vw,82px);

    letter-spacing:
        clamp(5px,1vw,14px);
}

.menuSubtitle{
    margin-top:5px;

    color:#aaa;

    font-size:13px;
    letter-spacing:4px;
}

.menuHint{
    margin-top:14px;

    color:#777;

    font-size:11px;
    letter-spacing:2px;
}

.menuButtons{
    position:absolute;

    right:8%;
    bottom:10%;

    width:330px;
}

.menuDifficulty{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:5px;

    margin-bottom:10px;
}

.menuDifficulty button{
    padding:9px 2px;

    border:1px solid
        rgba(255,255,255,.24);

    background:
        rgba(0,0,0,.58);

    color:#888;

    cursor:pointer;
}

.menuDifficulty button.selected{
    color:#fff;

    border-color:#d8cc70;

    background:
        rgba(90,80,30,.68);
}

.menuButton{
    display:block;

    width:100%;

    margin:7px 0;
    padding:14px 18px;

    border:1px solid
        rgba(255,255,255,.30);

    background:
        rgba(0,0,0,.58);

    color:#eee;

    font-size:15px;

    text-align:left;

    cursor:pointer;

    transition:
        background .15s,
        border-color .15s,
        padding-left .15s;
}

.menuButton:hover{
    background:
        rgba(100,90,35,.75);

    border-color:#d9ce70;

    padding-left:25px;
}

.menuLocation{
    position:absolute;

    right:18px;
    bottom:15px;

    color:
        rgba(255,255,255,.42);

    font:
        10px monospace;
}

/* =========================================================
   OVERLAYS
========================================================= */

.overlay{
    position:fixed;
    inset:0;

    z-index:900;

    display:none;

    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:white;

    background:
        radial-gradient(
            ellipse at center,
            rgba(72,66,34,.84),
            rgba(0,0,0,.97)
        );
}

.overlay h1{
    margin:0 0 18px;

    color:#d8cb60;

    font-size:50px;

    letter-spacing:8px;
}

.overlay button{
    width:330px;

    margin:5px;
    padding:14px;

    border:1px solid #666;

    background:#111;

    color:#eee;

    cursor:pointer;
}

.overlay button:hover{
    background:#423d18;
    border-color:#d9cc61;
}

.deathTitle{
    color:#b40000!important;

    font-size:55px!important;
}

.deathText{
    margin-bottom:20px;

    color:#aaa;

    text-align:center;
}

/* =========================================================
   CONTROLS
========================================================= */

#controlsBox{
    position:fixed;
    inset:0;

    z-index:1500;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.82);
}

.controlsPanel{
    width:min(620px,90vw);

    padding:28px;

    border:
        1px solid
        rgba(220,210,120,.55);

    background:
        rgba(12,12,10,.96);

    box-shadow:
        0 0 50px
        rgba(0,0,0,.8);
}

.controlsPanel h2{
    margin:0 0 20px;

    color:#d8cc72;

    letter-spacing:4px;
}

.controlRow{
    display:flex;

    justify-content:space-between;

    padding:10px 4px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    color:#bbb;

    font:
        14px monospace;
}

.controlKey{
    color:#eee;
}

.controlsPanel button{
    width:100%;

    margin-top:20px;

    padding:12px;

    border:1px solid #555;

    background:#111;

    color:#ddd;

    cursor:pointer;
}

.controlsPanel button:hover{
    border-color:#d9ce70;
    background:#312e18;
}

/* =========================================================
   HUD
========================================================= */

#crosshair{
    position:fixed;

    left:50%;
    top:50%;

    z-index:100;

    width:5px;
    height:5px;

    margin:-2px;

    border:
        1px solid
        rgba(255,255,255,.75);

    border-radius:50%;

    pointer-events:none;
}

#hud{
    position:fixed;

    left:18px;
    bottom:18px;

    z-index:100;

    color:#fff;

    font:
        12px monospace;

    text-shadow:
        2px 2px 6px #000;
}

#difficultyHud{
    margin-top:5px;

    color:#aaa;
}

#hideIndicator{
    position:fixed;

    left:50%;
    bottom:25%;

    z-index:100;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.85);

    font:
        13px monospace;

    text-shadow:
        2px 2px 7px #000;

    opacity:0;
}

#hiddenIndicator{
    position:fixed;

    left:50%;
    bottom:18%;

    z-index:100;

    transform:
        translateX(-50%);

    color:
        rgba(190,180,105,.85);

    font:
        11px monospace;

    letter-spacing:2px;

    opacity:0;
}

#message{
    position:fixed;

    left:50%;
    top:45px;

    z-index:100;

    transform:
        translateX(-50%);

    color:white;

    font:
        14px monospace;

    text-shadow:
        2px 2px 8px #000;
}

#rec{
    position:fixed;

    right:18px;
    top:17px;

    z-index:100;

    color:#eee;

    font:
        13px monospace;

    text-shadow:
        2px 2px 6px #000;
}

#recDot{
    display:inline-block;

    width:9px;
    height:9px;

    margin-right:6px;

    border-radius:50%;

    background:#e00000;

    animation:
        blink .9s infinite;
}

@keyframes blink{
    0%,45%{
        opacity:1;
    }

    46%,100%{
        opacity:.15;
    }
}

#tapeTime{
    position:fixed;

    right:18px;
    top:39px;

    z-index:100;

    color:
        rgba(255,255,255,.75);

    font:
        11px monospace;

    text-shadow:
        2px 2px 5px #000;
}

#battery{
    position:fixed;

    right:18px;
    bottom:18px;

    z-index:100;

    color:
        rgba(255,255,255,.7);

    font:
        11px monospace;

    text-shadow:
        2px 2px 5px #000;
}

/* =========================================================
   FOUND FOOTAGE EFFECT
========================================================= */

#camcorder{
    position:fixed;
    inset:0;

    z-index:80;

    pointer-events:none;

    overflow:hidden;
}

.camScanlines{
    position:absolute;
    inset:-10%;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.08) 0,
            rgba(255,255,255,.08) 1px,
            rgba(0,0,0,.08) 2px,
            transparent 4px,
            transparent 6px
        );

    opacity:.20;

    animation:
        scan .16s linear infinite;
}

@keyframes scan{
    to{
        transform:translateY(6px);
    }
}

.camTracking{
    position:absolute;

    left:-10%;

    width:120%;
    height:10%;

    top:-15%;

    opacity:.08;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            rgba(255,255,255,.8) 2px,
            transparent 4px,
            rgba(0,0,0,.8) 7px
        );

    animation:
        tracking 7s linear infinite;
}

@keyframes tracking{
    0%{
        top:-15%;
    }

    45%{
        top:45%;
    }

    48%{
        top:51%;
    }

    100%{
        top:115%;
    }
}

.camGrain{
    position:absolute;
    inset:-15%;

    opacity:.12;

    background:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.65) 0,
            rgba(255,255,255,.08) 1px,
            transparent 2px,
            transparent 4px
        );

    animation:
        grain .06s steps(3) infinite;
}

@keyframes grain{
    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(-4px,2px);
    }

    50%{
        transform:translate(3px,-4px);
    }

    75%{
        transform:translate(4px,3px);
    }

    100%{
        transform:translate(0,0);
    }
}

.camVignette{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.10) 52%,
            rgba(0,0,0,.32) 78%,
            rgba(0,0,0,.72) 100%
        );
}

.camBleed{
    position:absolute;
    inset:-4px;

    opacity:.10;

    box-shadow:
        inset 5px 0 rgba(255,0,0,.4),
        inset -5px 0 rgba(0,80,255,.35);
}

.camExposure{
    position:absolute;
    inset:0;

    background:
        rgba(130,115,55,.045);

    animation:
        exposure .7s infinite alternate;
}

@keyframes exposure{
    from{
        opacity:.55;
    }

    to{
        opacity:.9;
    }
}

.camDamage{
    position:absolute;

    left:0;
    width:100%;
    height:2px;

    opacity:0;

    background:
        rgba(255,255,255,.7);

    animation:
        damage 8s infinite;
}

@keyframes damage{
    0%,72%,100%{
        opacity:0;
        top:0;
    }

    73%{
        opacity:.7;
        top:31%;
    }

    74%{
        opacity:.15;
        top:33%;
    }

    75%{
        opacity:.65;
        top:32%;
    }

    76%{
        opacity:0;
        top:36%;
    }
}

/* =========================================================
   ERROR
========================================================= */

#error{
    position:fixed;

    left:10px;
    right:10px;
    bottom:10px;

    z-index:3000;

    display:none;

    padding:15px;

    background:#450000;

    border:1px solid red;

    color:white;

    font:
        13px monospace;

    white-space:pre-wrap;
}
</style>
</head>

======================================================= -->

<script src="./three.min.js"></script>

<script>
"use strict";

/* =========================================================
   CHECK THREE.JS
========================================================= */

if(typeof THREE === "undefined"){

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "ERROR: three.min.js could not be loaded.\n\n" +
        "Make sure three.min.js is in the same folder as index.html.";

    throw new Error("Three.js missing");
}

/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x716b47);

scene.fog =
    new THREE.FogExp2(
        0x716b47,
        0.0055
    );

/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        0.03,
        500
    );

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.35)
);

if("outputColorSpace" in renderer){

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

}

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.15;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x9a8f55,
        0.52
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xf4e19b,
        0x17140d,
        0.52
    )
);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   MAP SCALE
========================================================= */

const TILE = 3;

const WALL_HEIGHT = 9;

const PLAYER_HEIGHT = 5.8;

const EYE_HEIGHT = 5.25;

const CROUCH_EYE_HEIGHT = 3.15;

const PLAYER_RADIUS = 0.58;

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;
let entityTexture = null;

function configureTexture(
    texture,
    repeatX = 1,
    repeatY = 1
){

    if(!texture)
        return null;

    if("colorSpace" in texture){

        texture.colorSpace =
            THREE.SRGBColorSpace;

    }

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            8
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(
    path,
    repeatX = 1,
    repeatY = 1
){

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    resolve(
                        configureTexture(
                            texture,
                            repeatX,
                            repeatY
                        )
                    );

                },

                undefined,

                () => {

                    console.warn(
                        "Could not load texture:",
                        path
                    );

                    resolve(null);

                }

            );

        }
    );

}

async function loadTextures(){

    wallTexture =
        await loadTexture(
            "./textures/wall.png",
            1.35,
            1.35
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png",
            1.15,
            1.15
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

    /*
        Entity texture intentionally does not
        use lighting.
    */

    entityTexture =
        await loadTexture(
            "./entity.png",
            1,
            1
        );

}

/* =========================================================
   MATERIALS
========================================================= */

function wallMaterial(){

    if(wallTexture){

        return new THREE.MeshStandardMaterial({

            map:wallTexture,

            color:0xf1e6a6,

            roughness:0.94,

            metalness:0,

            side:THREE.FrontSide

        });

    }

    return new THREE.MeshStandardMaterial({

        color:0xd3c46c,

        roughness:1

    });

}

function floorMaterial(){

    if(floorTexture){

        return new THREE.MeshStandardMaterial({

            map:floorTexture,

            color:0xf0e5ad,

            roughness:1,

            metalness:0

        });

    }

    return new THREE.MeshStandardMaterial({

        color:0xb8ad76,

        roughness:1

    });

}

function ceilingMaterial(){

    if(ceilingTexture){

        return new THREE.MeshStandardMaterial({

            map:ceilingTexture,

            color:0xf0e9c6,

            roughness:0.96,

            metalness:0,

            side:THREE.DoubleSide

        });

    }

    return new THREE.MeshStandardMaterial({

        color:0xded8bb,

        roughness:1,

        side:THREE.DoubleSide

    });

}

/* =========================================================
   MAP DATA
========================================================= */

let mapWidth = 0;

let mapHeight = 0;

let mapData = [];

let playerSpawn = null;

let entitySpawn = null;

let exitCell = null;

const wallColliders = [];

const holeCells = new Set();

const hidingSpots = [];

/* =========================================================
   COLOR RECOGNITION
========================================================= */

function colorDistance(
    r,g,b,
    tr,tg,tb
){

    return Math.sqrt(

        Math.pow(r-tr,2) +
        Math.pow(g-tg,2) +
        Math.pow(b-tb,2)

    );

}

function classifyPixel(
    r,g,b
){

    /*
        BLACK = WALL
    */

    if(
        colorDistance(
            r,g,b,
            0,0,0
        ) < 105
    ){

        return "wall";

    }

    /*
        YELLOW = HOLE
    */

    if(
        colorDistance(
            r,g,b,
            255,255,0
        ) < 155
    ){

        return "hole";

    }

    /*
        BLUE = ENTITY
    */

    if(
        colorDistance(
            r,g,b,
            0,0,255
        ) < 170
    ){

        return "entity";

    }

    /*
        RED = PLAYER
    */

    if(
        colorDistance(
            r,g,b,
            255,0,0
        ) < 175
    ){

        return "spawn";

    }

    /*
        PURPLE = HIDING
    */

    if(
        colorDistance(
            r,g,b,
            255,0,255
        ) < 190
    ){

        return "hide";

    }

    /*
        GREEN = EXIT
    */

    if(
        colorDistance(
            r,g,b,
            0,255,0
        ) < 190
    ){

        return "exit";

    }

    return "floor";

}

/* =========================================================
   MAP HELPERS
========================================================= */

function cellKey(
    x,y
){

    return x + "_" + y;

}

function isInsideMap(
    x,y
){

    return (
        x >= 0 &&
        y >= 0 &&
        x < mapWidth &&
        y < mapHeight
    );

}

function isWalkableCell(
    x,y
){

    if(
        !isInsideMap(x,y)
    )
        return false;

    return (
        mapData[y][x] !== "wall"
    );

}

function cellToWorld(
    x,y
){

    return {

        x:
            (x + 0.5) * TILE -
            mapWidth * TILE / 2,

        z:
            (y + 0.5) * TILE -
            mapHeight * TILE / 2

    };

}

function worldToCell(
    x,z
){

    return {

        x:
            Math.floor(
                (x +
                 mapWidth * TILE / 2) /
                TILE
            ),

        y:
            Math.floor(
                (z +
                 mapHeight * TILE / 2) /
                TILE
            )

    };

}

/* =========================================================
   LOAD THE REAL MAP
========================================================= */

async function loadMapImage(){

    /*
        IMPORTANT:
        map 1.png is in /textures/
    */

    const path =
        "./textures/map 1.png";

    const image =
        await new Promise(
            (resolve,reject) => {

                const img =
                    new Image();

                img.onload =
                    () => resolve(img);

                img.onerror =
                    () => reject(
                        new Error(
                            "Could not load ./textures/map 1.png"
                        )
                    );

                img.src =
                    path +
                    "?v=" +
                    Date.now();

            }
        );

    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        mapWidth;

    canvas.height =
        mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.imageSmoothingEnabled =
        false;

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData = [];

    playerSpawn = null;

    entitySpawn = null;

    exitCell = null;

    for(
        let y = 0;
        y < mapHeight;
        y++
    ){

        const row = [];

        for(
            let x = 0;
            x < mapWidth;
            x++
        ){

            const index =
                (y * mapWidth + x) * 4;

            const r =
                pixels[index];

            const g =
                pixels[index + 1];

            const b =
                pixels[index + 2];

            const type =
                classifyPixel(
                    r,g,b
                );

            row.push(type);

            if(
                type === "spawn" &&
                !playerSpawn
            ){

                playerSpawn =
                    cellToWorld(
                        x,y
                    );

            }

            if(
                type === "entity" &&
                !entitySpawn
            ){

                entitySpawn =
                    cellToWorld(
                        x,y
                    );

            }

            if(
                type === "exit" &&
                !exitCell
            ){

                exitCell = {
                    x,
                    y
                };

            }

        }

        mapData.push(row);

    }

    /*
        Make sure a player spawn exists.
    */

    if(!playerSpawn){

        outer:
        for(
            let y = 0;
            y < mapHeight;
            y++
        ){

            for(
                let x = 0;
                x < mapWidth;
                x++
            ){

                if(
                    isWalkableCell(x,y) &&
                    mapData[y][x] !== "hole"
                ){

                    playerSpawn =
                        cellToWorld(
                            x,y
                        );

                    break outer;

                }

            }

        }

    }

    /*
        Make sure the entity has somewhere to start.
    */

    if(!entitySpawn){

        entitySpawn = {

            x:
                playerSpawn.x +
                TILE * 8,

            z:
                playerSpawn.z +
                TILE * 8

        };

    }

    console.log(
        "Loaded map 1.png:",
        mapWidth,
        "x",
        mapHeight
    );

    console.log(
        "Player spawn:",
        playerSpawn
    );

    console.log(
        "Entity spawn:",
        entitySpawn
    );

}

function addWall(

){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                TILE
            ),

            wallMaterial()

        );

    mesh.position.set(
        x,
        WALL_HEIGHT / 2,
        z
    );

    world.add(mesh);

    wallColliders.push({

        minX:
            x - TILE / 2,

        maxX:
            x + TILE / 2,

        minZ:
            z - TILE / 2,

        maxZ:
            z + TILE / 2

    });

}

function addFloorTile(
    x,z
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            floorMaterial()

        );

    mesh.rotation.x =
        -Math.PI / 2;

    mesh.position.set(
        x,
        0,
        z
    );

    world.add(mesh);

}

function addCeilingTile(
    x,z
){

    /*
        Each ceiling square is exactly one map tile.
        This keeps the ceiling panels visible and
        properly sized relative to the lights.
    */

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            ceilingMaterial()

        );

    mesh.rotation.x =
        Math.PI / 2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    world.add(mesh);

}

/* =========================================================
   HOLES
========================================================= */

function buildHole(
    cellX,
    cellY
){

    const p =
        cellToWorld(
            cellX,
            cellY
        );

    holeCells.add(
        cellKey(
            cellX,
            cellY
        )
    );

    const depth =
        TILE * 1.7;

    /*
        Dark bottom.
    */

    const bottom =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE * .82,
                TILE * .82
            ),

            new THREE.MeshBasicMaterial({
                color:0x030201
            })

        );

    bottom.rotation.x =
        -Math.PI / 2;

    bottom.position.set(
        p.x,
        -depth,
        p.z
    );

    world.add(bottom);

    /*
        Textured sides.
    */

    const sideGeometry =
        new THREE.PlaneGeometry(
            TILE * .82,
            depth
        );

    const sideMaterial =
        floorTexture

        ?

        new THREE.MeshStandardMaterial({

            map:floorTexture,

            color:0xd4c98c,

            roughness:1,

            side:THREE.DoubleSide

        })

        :

        new THREE.MeshStandardMaterial({

            color:0x877a4b,

            roughness:1,

            side:THREE.DoubleSide

        });

    const left =
        new THREE.Mesh(
            sideGeometry.clone(),
            sideMaterial.clone()
        );

    left.position.set(
        p.x - TILE*.41,
        -depth/2,
        p.z
    );

    left.rotation.y =
        Math.PI / 2;

    world.add(left);

    const right =
        new THREE.Mesh(
            sideGeometry.clone(),
            sideMaterial.clone()
        );

    right.position.set(
        p.x + TILE*.41,
        -depth/2,
        p.z
    );

    right.rotation.y =
        Math.PI / 2;

    world.add(right);

    const front =
        new THREE.Mesh(
            sideGeometry.clone(),
            sideMaterial.clone()
        );

    front.position.set(
        p.x,
        -depth/2,
        p.z - TILE*.41
    );

    world.add(front);

    const back =
        new THREE.Mesh(
            sideGeometry.clone(),
            sideMaterial.clone()
        );

    back.position.set(
        p.x,
        -depth/2,
        p.z + TILE*.41
    );

    world.add(back);

}

const fluorescentLights = [];

function addFluorescentLight(
    x,
    z,
    horizontal = true
){

    const length =
        TILE * 1.85;

    const width =
        TILE * .34;

    /*
        Outer fixture.
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                horizontal
                    ? length
                    : width,

                .055,

                horizontal
                    ? width
                    : length

            ),

            new THREE.MeshBasicMaterial({

                color:0xffffdf

            })

        );

    fixture.position.set(
        x,
        WALL_HEIGHT-.10,
        z
    );

    world.add(fixture);

    /*
        Inner fluorescent tube.
    */

    const strip =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                horizontal
                    ? length*.82
                    : width*.72,

                .018,

                horizontal
                    ? width*.72
                    : length*.82

            ),

            new THREE.MeshBasicMaterial({

                color:0xffffff

            })

        );

    strip.position.set(
        x,
        WALL_HEIGHT-.14,
        z
    );

    world.add(strip);

    /*
        Actual light.
    */

    const light =
        new THREE.PointLight(
            0xffefb0,
            5.5,
            15,
            1.35
        );

    light.position.set(
        x,
        WALL_HEIGHT-.28,
        z
    );

    scene.add(light);

    fluorescentLights.push({

        light,
        fixture,
        strip,

        base:5.5,

        timer:
            Math.random()*3

    });

}

function buildLightGrid(){

    const spacing = 6;

    for(
        let y = 1;
        y < mapHeight-1;
        y += spacing
    ){

        for(
            let x = 1;
            x < mapWidth-1;
            x += spacing
        ){

            if(
                isWalkableCell(x,y) &&
                isWalkableCell(x+1,y) &&
                mapData[y][x] !== "hole" &&
                mapData[y][x+1] !== "hole"
            ){

                const p =
                    cellToWorld(
                        x,y
                    );

                addFluorescentLight(
                    p.x + TILE*.5,
                    p.z,
                    true
                );

                continue;

            }

            if(
                isWalkableCell(x,y) &&
                isWalkableCell(x,y+1) &&
                mapData[y][x] !== "hole" &&
                mapData[y+1][x] !== "hole"
            ){

                const p =
                    cellToWorld(
                        x,y
                    );

                addFluorescentLight(
                    p.x,
                    p.z + TILE*.5,
                    false
                );

            }

        }

    }

    /*
        Safety fallback if the blueprint is very small.
    */

    if(
        fluorescentLights.length < 4
    ){

        for(
            let y=1;
            y<mapHeight-1 &&
            fluorescentLights.length<8;
            y+=3
        ){

            for(
                let x=1;
                x<mapWidth-1 &&
                fluorescentLights.length<8;
                x+=3
            ){

                if(
                    isWalkableCell(x,y) &&
                    mapData[y][x] !== "hole"
                ){

                    const p =
                        cellToWorld(
                            x,y
                        );

                    addFluorescentLight(
                        p.x,
                        p.z,
                        true
                    );

                }

            }

        }

    }

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    /*
        Floor, ceiling, walls, holes and hiding spots.
    */

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                mapData[y][x];

            const p =
                cellToWorld(
                    x,y
                );

            if(
                type !== "wall"
            ){

                addFloorTile(
                    p.x,
                    p.z
                );

                addCeilingTile(
                    p.x,
                    p.z
                );

            }

            if(
                type === "wall"
            ){

                addWall(
                    p.x,
                    p.z
                );

            }

            if(
                type === "hole"
            ){

                buildHole(
                    x,y
                );

            }

            if(
                type === "hide"
            ){

                hidingSpots.push({

                    x:p.x,
                    z:p.z

                });

            }

        }

    }

    buildLightGrid();

    buildExit();

}

   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

let yaw = 0;

let pitch = 0;

let velocityY = 0;

let grounded = true;

let falling = false;

let fallTimer = 0;

let crouching = false;

let hidden = false;

let gameStarted = false;

let paused = false;

let dead = false;

const keys = {};

const WALK_SPEED = 3.25;

const SPRINT_SPEED = 5.55;

const GRAVITY = 22;

const JUMP_SPEED = 7;

const FALL_DURATION = 2.2;

camera.position.y =
    EYE_HEIGHT;

/* =========================================================
   COLLISION
========================================================= */

function collidesAt(
    x,z
){

    const r =
        PLAYER_RADIUS;

    for(
        const wall of wallColliders
    ){

        if(

            x+r > wall.minX &&

            x-r < wall.maxX &&

            z+r > wall.minZ &&

            z-r < wall.maxZ

        ){

            return true;

        }

    }

    return false;

}

function movePlayer(
    dx,dz
){

    const nextX =
        player.position.x + dx;

    const nextZ =
        player.position.z + dz;

    /*
        Separate X and Z collision allows the player
        to slide along corners instead of getting stuck.
    */

    if(
        !collidesAt(
            nextX,
            player.position.z
        )
    ){

        player.position.x =
            nextX;

    }

    if(
        !collidesAt(
            player.position.x,
            nextZ
        )
    ){

        player.position.z =
            nextZ;

    }

}

/* =========================================================
   HOLE FALL
========================================================= */

function checkForHole(){

    if(falling)
        return;

    if(
        player.position.y > .2
    )
        return;

    const cell =
        worldToCell(
            player.position.x,
            player.position.z
        );

    if(
        !isInsideMap(
            cell.x,
            cell.y
        )
    )
        return;

    if(
        mapData[cell.y][cell.x] !== "hole"
    )
        return;

    falling = true;

    fallTimer = 0;

    velocityY = 0;

    showMessage(
        "THE FLOOR GIVES WAY..."
    );

}

function updateFall(
    dt
){

    fallTimer += dt;

    const progress =
        Math.min(
            fallTimer / FALL_DURATION,
            1
        );

    player.position.y =
        -progress *
        TILE *
        1.35;

    camera.position.y =
        EYE_HEIGHT -
        progress * 1.1;

    camera.rotation.z =
        Math.sin(
            fallTimer * 15
        ) *
        .025 *
        progress;

    camera.rotation.x =
        pitch +
        Math.sin(
            fallTimer * 11
        ) *
        .025 *
        progress;

    if(
        fallTimer >= FALL_DURATION
    ){

        falling = false;

        camera.rotation.z = 0;

        die(
            "YOU FELL THROUGH THE FLOOR."
        );

    }

}

/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        !gameStarted ||
        paused ||
        dead ||
        falling
    )
        return;

    if(
        grounded &&
        !crouching
    ){

        velocityY =
            JUMP_SPEED;

        grounded = false;

    }

}

/* =========================================================
   HIDING
========================================================= */

function getNearestHidingSpot(){

    let nearest = null;

    let nearestDistance =
        Infinity;

    for(
        const spot of hidingSpots
    ){

        const d =
            Math.hypot(

                player.position.x -
                spot.x,

                player.position.z -
                spot.z

            );

        if(
            d < nearestDistance
        ){

            nearestDistance = d;

            nearest = spot;

        }

    }

    return {

        spot:nearest,

        distance:nearestDistance

    };

}

function updateHideState(){

    const nearest =
        getNearestHidingSpot();

    const near =
        nearest.spot &&
        nearest.distance <
        TILE*.48;

    hidden =
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near && !hidden
        ?
        "1"
        :
        "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ?
        "1"
        :
        "0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        updateFall(dt);

        return;

    }

    crouching =
        !!keys.c;

    /*
        Sprint has NO cooldown.
    */

    const speed =
        keys.shift &&
        !crouching

        ?

        SPRINT_SPEED

        :

        (
            crouching
            ?
            WALK_SPEED*.58
            :
            WALK_SPEED
        );

    let forward = 0;

    let strafe = 0;

    if(keys.w)
        forward += 1;

    if(keys.s)
        forward -= 1;

    if(keys.d)
        strafe += 1;

    if(keys.a)
        strafe -= 1;

    const length =
        Math.hypot(
            forward,
            strafe
        );

    if(length > 0){

        forward /= length;

        strafe /= length;

        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);

        const dx =
            (
                strafe*cos -
                forward*sin
            ) *
            speed *
            dt;

        const dz =
            (
                -forward*cos -
                strafe*sin
            ) *
            speed *
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    /*
        Gravity.
    */

    velocityY -=
        GRAVITY * dt;

    player.position.y +=
        velocityY * dt;

    if(
        player.position.y <= 0
    ){

        player.position.y = 0;

        velocityY = 0;

        grounded = true;

    }else{

        grounded = false;

    }

    /*
        Smooth crouching.
    */

    const targetEye =
        crouching
        ?
        CROUCH_EYE_HEIGHT
        :
        EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetEye,
            Math.min(
                dt*13,
                1
            )
        );

    checkForHole();

    updateHideState();

}

let entity = null;

function chooseEntityDirection(){

function getEntityDetectionDistance(){

    switch(difficulty){

        case "easy":
            return 6.5;

        case "hard":
            return 11;

        case "nightmare":
            return 14;

        default:
            return 8.5;

    }

}

/* =========================================================
   ENTITY LINE OF SIGHT
========================================================= */

function entityCanSeePlayer(){

    if(hidden)
        return false;

    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    if(
        distance >
        getEntityDetectionDistance()
    ){

        return false;

    }

    const direction =
        new THREE.Vector3(
            dx,
            0,
            dz
        ).normalize();

    const origin =
        new THREE.Vector3(
            entity.position.x,
            1.7,
            entity.position.z
        );

    const ray =
        new THREE.Raycaster(
            origin,
            direction,
            .1,
            Math.max(
                distance-.4,
                .1
            )
        );

    for(
        const wall of wallColliders
    ){

        const box =
            new THREE.Box3(

                new THREE.Vector3(
                    wall.minX,
                    0,
                    wall.minZ
                ),

                new THREE.Vector3(
                    wall.maxX,
                    WALL_HEIGHT,
                    wall.maxZ
                )

            );

        if(
            ray.ray.intersectBox(
                box,
                new THREE.Vector3()
            )
        ){

            return false;

        }

    }

    return true;

}

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        paused ||
        dead ||
        falling
    )
        return;

    const sees =
        entityCanSeePlayer();

    if(sees){

        /*
            The entity remembers where it saw the
            player instead of magically tracking them
            through walls.

            This is what makes it jukeable.
        */

        entityTarget = {

            x:
                player.position.x,

            z:
                player.position.z

        };

        lastSeenTimer = 2.2;

    }else if(
        lastSeenTimer > 0
    ){

        lastSeenTimer -= dt;

    }else{

        entityTarget = null;

    }

    let dx = 0;

    let dz = 0;

    if(entityTarget){

        dx =
            entityTarget.x -
            entity.position.x;

        dz =
            entityTarget.z -
            entity.position.z;

        const length =
            Math.hypot(
                dx,
                dz
            );

        if(
            length > .35
        ){

            dx /= length;

            dz /= length;

        }else{

            entityTarget = null;

            chooseEntityDirection();

        }

    }

    if(!entityTarget){

        entityTimer -= dt;

        if(
            entityTimer <= 0
        ){

            chooseEntityDirection();

        }

        dx =
            Math.cos(
                entityDirection
            );

        dz =
            Math.sin(
                entityDirection
            );

    }

    const speed =
        entityTarget

        ?

        (
            difficulty === "nightmare"
            ?
            2.25
            :
            difficulty === "hard"
            ?
            1.9
            :
            difficulty === "easy"
            ?
            1.25
            :
            1.6
        )

        :

        .72;

    const nextX =
        entity.position.x +
        dx *
        speed *
        dt;

    const nextZ =
        entity.position.z +
        dz *
        speed *
        dt;

    if(
        !collidesAt(
            nextX,
            nextZ
        )
    ){

        entity.position.x =
            nextX;

        entity.position.z =
            nextZ;

    }else{

        entityTarget = null;

        chooseEntityDirection();

    }

    /*
        Billboard entity.
    */

    const cameraPosition =
        camera.getWorldPosition(
            new THREE.Vector3()
        );

    entity.rotation.y =
        Math.atan2(

            cameraPosition.x -
            entity.position.x,

            cameraPosition.z -
            entity.position.z

        );

    /*
        Tiny movement.
    */

    entity.position.y =
        2.45 +
        Math.sin(
            performance.now()*.003
        )*.045;

    /*
        Kill distance.
    */

    const distanceToPlayer =
        Math.hypot(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );

    if(
        distanceToPlayer < .95 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   ENTITY SOUND
========================================================= */

function loadEntityAudio(){

    entityAudio =
        new Audio(
            "./entity.mp3"
        );

    entityAudio.loop = true;

    entityAudio.volume = .28;

}

function updateEntityAudio(){

    if(
        !entityAudio ||
        !entity
    )
        return;

    const distance =
        Math.hypot(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );

    if(
        distance < 24 &&
        !hidden &&
        gameStarted &&
        !paused &&
        !dead
    ){

        if(
            entityAudio.paused
        ){

            entityAudio
                .play()
                .catch(
                    ()=>{}
                );

        }

        entityAudio.volume =
            THREE.MathUtils.clamp(
                1 - distance/24,
                .05,
                .38
            );

    }else{

        entityAudio.pause();

    }

}

/* =========================================================
   EXIT
========================================================= */

function updateExit(){

    if(
        !exitObject ||
        dead ||
        falling
    )
        return;

    const distance =
        Math.hypot(

            player.position.x -
            exitObject.position.x,

            player.position.z -
            exitObject.position.z

        );

    if(
        distance < 1.1
    ){

        showMessage(
            "THE TRAPDOOR IS LOCKED."
        );

    }

}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = 0;

function showMessage(
    text
){

    document.getElementById(
        "message"
    ).textContent =
        text;

    messageTimer = 2.5;

}

function updateMessage(
    dt
){

    if(
        messageTimer > 0
    ){

        messageTimer -= dt;

        if(
            messageTimer <= 0
        ){

            document.getElementById(
                "message"
            ).textContent =
                "";

        }

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(
    reason
){

    if(dead)
        return;

    dead = true;

    if(entityAudio){

        entityAudio.pause();

    }

    document.getElementById(
        "deathText"
    ).textContent =
        reason;

    document.getElementById(
        "death"
    ).style.display =
        "flex";

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   RESET
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    player.rotation.y = 0;

    camera.position.y =
        EYE_HEIGHT;

    camera.rotation.set(
        0,
        0,
        0
    );

    yaw = 0;

    pitch = 0;

    velocityY = 0;

    grounded = true;

    falling = false;

    fallTimer = 0;

    crouching = false;

    hidden = false;

}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    paused = false;

    dead = false;

    gameStarted = true;

    resetPlayer();

    /*
        Remove previous entity.
    */

    if(entity){

        world.remove(entity);

        if(entity.geometry)
            entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity = null;

    }

    createEntity();

    if(entityAudio){

        entityAudio.pause();

        entityAudio.currentTime = 0;

    }

    renderer.domElement
        .requestPointerLock();

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused = !paused;

    document.getElementById(
        "pause"
    ).style.display =
        paused
        ?
        "flex"
        :
        "none";

    if(
        paused &&
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

    if(!paused){

        renderer.domElement
            .requestPointerLock();

    }

}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display =
        "flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display =
        "none";

}

/* =========================================================
   MENU BACKGROUND
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuImageIndex = 0;

function setupMenuImages(){

    for(
        const image of menuImages
    ){

        image.addEventListener(
            "error",
            ()=>{

                /*
                    Hide missing menu images instead of
                    generating a giant broken-image icon.
                */

                image.style.display =
                    "none";

            }
        );

    }

    if(
        menuImages.length > 1
    ){

        setInterval(
            ()=>{

                menuImages[
                    menuImageIndex
                ].classList.remove(
                    "active"
                );

                menuImageIndex =
                    (
                        menuImageIndex + 1
                    ) %
                    menuImages.length;

                menuImages[
                    menuImageIndex
                ].classList.add(
                    "active"
                );

            },
            6500
        );

    }

}

setupMenuImages();

/* =========================================================
   DIFFICULTY
========================================================= */

let difficulty =
    "normal";

const difficultyButtons = {

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function selectDifficulty(
    value
){

    difficulty = value;

    for(
        const [
            name,
            button
        ]
        of Object.entries(
            difficultyButtons
        )
    ){

        button.classList.toggle(
            "selected",
            name === value
        );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();

}

/* =========================================================
   KEYBOARD INPUT
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        keys[key] = true;

        if(
            event.code === "Space"
        ){

            event.preventDefault();

            jump();

        }

        if(
            key === "escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display === "flex"
            ){

                hideControls();

                return;

            }

            if(gameStarted){

                togglePause();

            }

        }

    }
);

document.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement === null
        )
            return;

        yaw -=
            event.movementX *
            .0021;

        pitch -=
            event.movementY *
            .0018;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock();

        }

    }
);

/* =========================================================
   BUTTON EVENTS
========================================================= */

document.getElementById(
    "startBtn"
).onclick =
    startGame;

document.getElementById(
    "menuControlsBtn"
).onclick =
    showControls;

document.getElementById(
    "pauseControlsBtn"
).onclick =
    showControls;

document.getElementById(
    "controlsBackBtn"
).onclick =
    hideControls;

document.getElementById(
    "resumeBtn"
).onclick =
    ()=>{

        paused = false;

        document.getElementById(
            "pause"
        ).style.display =
            "none";

        renderer.domElement
            .requestPointerLock();

    };

document.getElementById(
    "restartBtn"
).onclick =
    startGame;

document.getElementById(
    "retryBtn"
).onclick =
    startGame;

document.getElementById(
    "menuBtn"
).onclick =
    ()=>{

        paused = false;

        gameStarted = false;

        document.getElementById(
            "pause"
        ).style.display =
            "none";

        document.getElementById(
            "menu"
        ).style.display =
            "block";

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    };

document.getElementById(
    "deathMenuBtn"
).onclick =
    ()=>{

        dead = false;

        gameStarted = false;

        document.getElementById(
            "death"
        ).style.display =
            "none";

        document.getElementById(
            "menu"
        ).style.display =
            "block";

    };

difficultyButtons.easy.onclick =
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick =
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick =
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick =
    ()=>selectDifficulty("nightmare");

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(
    dt
){

    for(
        const item of fluorescentLights
    ){

        item.timer -= dt;

        if(
            item.timer <= 0
        ){

            item.timer =
                .18 +
                Math.random()*4;

            const shouldFlicker =
                Math.random() < .18;

            if(shouldFlicker){

                item.light.intensity =
                    item.base *
                    (
                        .20 +
                        Math.random()*.65
                    );

                item.fixture.material.color
                    .setHex(
                        0xcfcaa8
                    );

                setTimeout(
                    ()=>{

                        if(item.light){

                            item.light.intensity =
                                item.base;

                            item.fixture
                                .material
                                .color
                                .setHex(
                                    0xffffdf
                                );

                        }

                    },
                    40 +
                    Math.random()*100
                );

            }else{

                item.light.intensity =
                    item.base;

            }

        }

    }

}

/* =========================================================
   TAPE TIMER
========================================================= */

let gameTime = 0;

function updateTapeTime(
    dt
){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime += dt;

    const total =
        Math.floor(
            gameTime
        );

    const hours =
        Math.floor(
            total / 3600
        );

    const minutes =
        Math.floor(
            (total % 3600) / 60
        );

    const seconds =
        total % 60;

    const format =
        n =>
            String(n)
            .padStart(
                2,
                "0"
            );

    document.getElementById(
        "tapeTime"
    ).textContent =
        format(hours) +
        ":" +
        format(minutes) +
        ":" +
        format(seconds);

}

/* =========================================================
   ANIMATION
========================================================= */

let previousTime =
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now =
        performance.now();

    let dt =
        (now - previousTime) /
        1000;

    previousTime = now;

    dt =
        Math.min(
            dt,
            .05
        );

    updatePlayer(dt);

    updateEntity(dt);

    updateEntityAudio();

    updateExit();

    updateLights(dt);

    updateMessage(dt);

    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize(){

    try{

        /*
            Textures first.
        */

        await loadTextures();

        /*
            REAL MAP:
            ./textures/map 1.png
        */

        await loadMapImage();

        /*
            Build the world from the blueprint.
        */

        buildWorld();

        /*
            Entity audio.
        */

        loadEntityAudio();

        document.getElementById(
            "difficultyHud"
        ).textContent =
            difficulty.toUpperCase();

        console.log(
            "BACKROOMS INITIALIZED"
        );

        console.log(
            "Map:",
            mapWidth,
            "x",
            mapHeight
        );

    }catch(error){

        console.error(error);

        const element =
            document.getElementById(
                "error"
            );

        element.style.display =
            "block";

        element.textContent =
            "INITIALIZATION ERROR:\n\n" +
            (
                error.stack ||
                String(error)
            );

    }

}

initialize();

</script>
