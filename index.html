<script src="./three.min.js"></script>


<script>

"use strict";


/* =========================================================
   BASIC CHECK
========================================================= */

if(
    typeof THREE === "undefined"
){

    document.getElementById(
        "error"
    ).style.display =
        "block";

    document.getElementById(
        "error"
    ).textContent =
        "ERROR: three.min.js could not be loaded.";

    throw new Error(
        "Three.js missing."
    );

}


/* =========================================================
   PATHS
========================================================= */

/*
    These paths are deliberately relative to
    index.html.

    Repository layout:

    backrooms-kanye/
        index.html
        three.min.js
        entity.png
        entity.mp3
        textures/
            floor.png
            wall.png
            ceiling.png
*/

const BASE =
    new URL(
        "./",
        document.baseURI
    );


/*
    Change this number whenever textures are
    changed in GitHub.

    It prevents GitHub Pages from continuing
    to serve an old cached image.
*/

const CACHE =
    "?textureVersion=5";


const PATHS = {

    floor:
        new URL(
            "textures/floor.png",
            BASE
        ).href +
        CACHE,

    wall:
        new URL(
            "textures/wall.png",
            BASE
        ).href +
        CACHE,

    ceiling:
        new URL(
            "textures/ceiling.png",
            BASE
        ).href +
        CACHE,

    entity:
        new URL(
            "entity.png",
            BASE
        ).href +
        CACHE,

    audio:
        new URL(
            "entity.mp3",
            BASE
        ).href

};


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x756d38
    );


scene.fog =
    new THREE.Fog(
        0x756d38,
        45,
        125
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth /
        innerHeight,
        .03,
        250
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/*
    Modern Three.js color handling.
*/

if(
    "outputColorSpace"
    in renderer
){

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

}
else{

    renderer.outputEncoding =
        THREE.sRGBEncoding;

}


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

/*
    The player is intentionally shorter.

    Ceiling:
        3.10

    Player:
        1.55

    Eye:
        1.18
*/

const CEILING_HEIGHT =
    3.10;


const PLAYER_HEIGHT =
    1.55;


const EYE_HEIGHT =
    1.18;


const PLAYER_RADIUS =
    .27;


const WALK_SPEED =
    3.8;


const SPRINT_SPEED =
    6.5;


const GRAVITY =
    20;


const JUMP_SPEED =
    6.3;


const player =
    new THREE.Object3D();


scene.add(
    player
);


player.add(
    camera
);


camera.position.set(
    0,
    EYE_HEIGHT,
    0
);


/* =========================================================
   PLAYER ROTATION
========================================================= */

let yaw =
    0;


let pitch =
    0;


/* =========================================================
   PLAYER PHYSICS
========================================================= */

let velocityY =
    0;


let grounded =
    true;


/* =========================================================
   GAME STATE
========================================================= */

let running =
    false;


let paused =
    false;


let dead =
    false;


let difficulty =
    "normal";


let entity =
    null;


let worldObjects =
    [];


let collisionWalls =
    [];


/* =========================================================
   DIFFICULTIES
========================================================= */

const DIFFICULTIES = {

    easy:{
        name:"EASY",
        speed:1.6,
        chase:false
    },

    normal:{
        name:"NORMAL",
        speed:5.0,
        chase:true
    },

    hard:{
        name:"HARD",
        speed:6.0,
        chase:true
    },

    impossible:{
        name:"IMPOSSIBLE",
        speed:7.7,
        chase:true
    }

};


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {

    w:false,
    a:false,
    s:false,
    d:false,
    shift:false

};


let jumpPressed =
    false;


window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if(
            key === "w"
        )
            keys.w = true;


        if(
            key === "a"
        )
            keys.a = true;


        if(
            key === "s"
        )
            keys.s = true;


        if(
            key === "d"
        )
            keys.d = true;


        if(
            key === "shift"
        )
            keys.shift = true;


        if(
            key === " "
        ){

            event.preventDefault();

            jumpPressed =
                true;

        }


        if(
            key === "p" &&
            running &&
            !dead
        ){

            togglePause();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();


        if(
            key === "w"
        )
            keys.w = false;


        if(
            key === "a"
        )
            keys.a = false;


        if(
            key === "s"
        )
            keys.s = false;


        if(
            key === "d"
        )
            keys.d = false;


        if(
            key === "shift"
        )
            keys.shift = false;

    }
);


window.addEventListener(
    "blur",
    () => {

        keys.w = false;
        keys.a = false;
        keys.s = false;
        keys.d = false;
        keys.shift = false;

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !running ||
            paused ||
            dead
        ){

            return;

        }


        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }


        const sensitivity =
            .0022;


        yaw -=
            event.movementX *
            sensitivity;


        pitch -=
            event.movementY *
            sensitivity;


        const limit =
            Math.PI / 2 -
            .08;


        pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* =========================================================
   TEXTURE SYSTEM
========================================================= */

/*
    THIS IS THE IMPORTANT PART.

    Instead of giving Three.js the raw PNG
    and hoping WebGL accepts its dimensions
    with RepeatWrapping, we:

        1. Load the PNG.
        2. Put it into a canvas.
        3. Resize the canvas to the nearest
           power-of-two dimensions.
        4. Create a CanvasTexture.
        5. Enable RepeatWrapping.

    This means the actual PNG is still being
    used, but WebGL gets a texture format that
    is safe for repeating.

    This is much more reliable on GitHub Pages.
*/


const imageLoader =
    new THREE.ImageLoader();


function nextPowerOfTwo(
    value
){

    let result =
        1;


    while(
        result < value
    ){

        result *= 2;

    }


    return result;

}


function createSafeTexture(
    url,
    name
){

    return new Promise(
        (
            resolve,
            reject
        ) => {

            imageLoader.load(

                url,

                image => {

                    try{

                        console.log(
                            "PNG loaded:",
                            name,
                            image.width,
                            image.height,
                            url
                        );


                        /*
                            Make sure the browser
                            actually decoded the PNG.
                        */

                        if(
                            !image.width ||
                            !image.height
                        ){

                            throw new Error(
                                name +
                                " loaded with invalid dimensions."
                            );

                        }


                        /*
                            Find safe POT dimensions.
                        */

                        const width =
                            nextPowerOfTwo(
                                image.width
                            );


                        const height =
                            nextPowerOfTwo(
                                image.height
                            );


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            width;


                        canvas.height =
                            height;


                        const context =
                            canvas.getContext(
                                "2d"
                            );


                        /*
                            Use high quality scaling.
                        */

                        context.imageSmoothingEnabled =
                            true;


                        context.imageSmoothingQuality =
                            "high";


                        /*
                            Draw the ENTIRE PNG.

                            Nothing is cropped.
                        */

                        context.drawImage(
                            image,
                            0,
                            0,
                            width,
                            height
                        );


                        const texture =
                            new THREE.CanvasTexture(
                                canvas
                            );


                        /*
                            The image is an sRGB
                            color texture.
                        */

                        if(
                            "colorSpace"
                            in texture
                        ){

                            texture.colorSpace =
                                THREE.SRGBColorSpace;

                        }
                        else{

                            texture.encoding =
                                THREE.sRGBEncoding;

                        }


                        /*
                            NOW repeating is safe.
                        */

                        texture.wrapS =
                            THREE.RepeatWrapping;


                        texture.wrapT =
                            THREE.RepeatWrapping;


                        texture.minFilter =
                            THREE.LinearMipmapLinearFilter;


                        texture.magFilter =
                            THREE.LinearFilter;


                        texture.anisotropy =
                            Math.min(

                                renderer
                                    .capabilities
                                    .getMaxAnisotropy(),

                                8

                            );


                        texture.needsUpdate =
                            true;


                        console.log(
                            "Safe texture created:",
                            name,
                            width,
                            height
                        );


                        resolve(
                            texture
                        );

                    }
                    catch(error){

                        reject(
                            error
                        );

                    }

                },

                undefined,

                error => {

                    console.error(
                        "PNG FAILED:",
                        name,
                        url,
                        error
                    );


                    reject(
                        new Error(
                            "FAILED TO LOAD " +
                            name +
                            "\n\n" +
                            url
                        )
                    );

                }

            );

        }
    );

}


/* =========================================================
   MATERIALS
========================================================= */

let floorMaterial =
    null;


let wallMaterial =
    null;


let ceilingMaterial =
    null;


/* =========================================================
   LOAD ENVIRONMENT TEXTURES
========================================================= */

async function loadEnvironmentTextures(){

    const status =
        document.getElementById(
            "textureStatus"
        );


    try{

        status.textContent =
            "Loading floor.png...";


        const floorTexture =
            await createSafeTexture(
                PATHS.floor,
                "floor.png"
            );


        status.textContent =
            "Loading wall.png...";


        const wallTexture =
            await createSafeTexture(
                PATHS.wall,
                "wall.png"
            );


        status.textContent =
            "Loading ceiling.png...";


        const ceilingTexture =
            await createSafeTexture(
                PATHS.ceiling,
                "ceiling.png"
            );


        /*
            =================================================
            FLOOR
            =================================================

            Tile the actual floor PNG.
        */

        floorTexture.repeat.set(
            12,
            10
        );


        /*
            =================================================
            WALL
            =================================================

            Repeat horizontally and vertically.
        */

        wallTexture.repeat.set(
            1,
            1
        );


        /*
            =================================================
            CEILING
            =================================================
        */

        ceilingTexture.repeat.set(
            14,
            12
        );


        /*
            =================================================
            FLOOR MATERIAL
            =================================================

            MeshStandardMaterial is used for realistic
            lighting.

            The actual PNG is still the map.
        */

        floorMaterial =
            new THREE.MeshStandardMaterial({

                map:
                    floorTexture,

                color:
                    0xffffff,

                roughness:
                    .92,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });


        /*
            =================================================
            WALL MATERIAL
            =================================================
        */

        wallMaterial =
            new THREE.MeshStandardMaterial({

                map:
                    wallTexture,

                color:
                    0xffffff,

                roughness:
                    .90,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });


        /*
            =================================================
            CEILING MATERIAL
            =================================================

            The warm multiplier makes the original
            Backrooms yellow without replacing the PNG.
        */

        ceilingMaterial =
            new THREE.MeshStandardMaterial({

                map:
                    ceilingTexture,

                color:
                    0xffdf91,

                roughness:
                    1,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });


        /*
            IMPORTANT:

            Force the materials to update.
        */

        floorMaterial.needsUpdate =
            true;


        wallMaterial.needsUpdate =
            true;


        ceilingMaterial.needsUpdate =
            true;


        status.textContent =
            "✓ FLOOR + WALL + CEILING TEXTURES LOADED";


        status.style.color =
            "#b9b36d";


        return true;

    }
    catch(error){

        console.error(
            error
        );


        status.textContent =
            "✗ TEXTURE ERROR";


        status.style.color =
            "#ff5555";


        showError(
            error.message +
            "\n\nExpected:\n" +
            PATHS.floor +
            "\n" +
            PATHS.wall +
            "\n" +
            PATHS.ceiling
        );


        return false;

    }

}


/* =========================================================
   OBJECT MANAGEMENT
========================================================= */

function addObject(
    object
){

    scene.add(
        object
    );


    worldObjects.push(
        object
    );


    return object;

}


function clearWorld(){

    for(
        const object
        of worldObjects
    ){

        scene.remove(
            object
        );


        if(
            object.geometry
        ){

            object.geometry.dispose();

        }

    }


    worldObjects = [];


    collisionWalls = [];


    entity = null;

}


/* =========================================================
   FLOOR
========================================================= */

function addFloor(){

    /*
        ONE floor.

        No giant collection of tiny meshes.
    */

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            floorMaterial

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    floor.receiveShadow =
        true;


    addObject(
        floor
    );

}


/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
){

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            wallMaterial

        );


    wall.position.set(
        x,
        y,
        z
    );


    wall.castShadow =
        true;


    wall.receiveShadow =
        true;


    addObject(
        wall
    );


    collisionWalls.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minY:
            y -
            height / 2,

        maxY:
            y +
            height / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2

    });

}


/* =========================================================
   CEILING
========================================================= */

function addCeiling(){

    /*
        ONE actual textured ceiling.

        This is the major performance fix.

        The previous version made 28,800 separate
        ceiling meshes.
    */

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            ceilingMaterial

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.set(
        0,
        CEILING_HEIGHT,
        0
    );


    ceiling.receiveShadow =
        true;


    addObject(
        ceiling
    );


    /*
        =================================================
        CEILING GRID
        =================================================

        This is only visual.

        The PNG remains underneath it.
    */

    const gridMaterial =
        new THREE.LineBasicMaterial({

            color:
                0x8f835c,

            transparent:
                true,

            opacity:
                .13

        });


    const points = [];


    const minX =
        -90;


    const maxX =
        90;


    const minZ =
        -80;


    const maxZ =
        80;


    /*
        Larger grid cells than before.

        This keeps the ceiling readable
        without creating 30,000 objects.
    */

    const cell =
        1;


    for(
        let x = minX;
        x <= maxX;
        x += cell
    ){

        points.push(

            new THREE.Vector3(
                x,
                CEILING_HEIGHT + .004,
                minZ
            ),

            new THREE.Vector3(
                x,
                CEILING_HEIGHT + .004,
                maxZ
            )

        );

    }


    for(
        let z = minZ;
        z <= maxZ;
        z += cell
    ){

        points.push(

            new THREE.Vector3(
                minX,
                CEILING_HEIGHT + .004,
                z
            ),

            new THREE.Vector3(
                maxX,
                CEILING_HEIGHT + .004,
                z
            )

        );

    }


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                points
            );


    const grid =
        new THREE.LineSegments(
            geometry,
            gridMaterial
        );


    addObject(
        grid
    );

}

/* =========================================================
   PLAYER COLLISION
========================================================= */

function playerCollides(
    x,
    z
){

    const bottom =
        player.position.y;


    const top =
        bottom +
        PLAYER_HEIGHT;


    for(
        const wall
        of collisionWalls
    ){

        if(
            top <= wall.minY ||
            bottom >= wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if(
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY
========================================================= */

let entityVelocity =
    new THREE.Vector2(
        0,
        0
    );


let entityDirection =
    new THREE.Vector2(
        1,
        0
    );


let lastKnownPlayer =
    new THREE.Vector2(
        0,
        0
    );


let hasLastKnownPosition =
    false;


let lastSeenTimer =
    0;


const LAST_SEEN_TIME =
    2.5;


let wanderTimer =
    0;


let wanderAngle =
    0;


const ENTITY_HEIGHT =
    1.65;


const ENTITY_RADIUS =
    .40;


async function createEntity(){

    try{

        /*
            Use the actual entity PNG.

            No shader.

            No lighting.

            No cropping.
        */

        const image =
            await new Promise(
                (
                    resolve,
                    reject
                ) => {

                    imageLoader.load(

                        PATHS.entity,

                        resolve,

                        undefined,

                        reject

                    );

                }
            );


        if(
            !image.width ||
            !image.height
        ){

            throw new Error(
                "entity.png has invalid dimensions."
            );

        }


        const texture =
            new THREE.Texture(
                image
            );


        if(
            "colorSpace"
            in texture
        ){

            texture.colorSpace =
                THREE.SRGBColorSpace;

        }
        else{

            texture.encoding =
                THREE.sRGBEncoding;

        }


        texture.needsUpdate =
            true;


        const aspect =
            image.width /
            image.height;


        /*
            Full image.

            The aspect ratio is preserved.
        */

        const width =
            ENTITY_HEIGHT *
            aspect;


        /*
            MeshBasicMaterial is intentional.

            The entity is NOT affected by:
                lights
                shadows
                room shading
        */

        const material =
            new THREE.MeshBasicMaterial({

                map:
                    texture,

                transparent:
                    true,

                alphaTest:
                    .01,

                side:
                    THREE.DoubleSide,

                depthWrite:
                    true,

                fog:
                    false,

                toneMapped:
                    false

            });


        entity =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    width,
                    ENTITY_HEIGHT
                ),

                material

            );


        entity.position.set(
            25,
            ENTITY_HEIGHT / 2,
            25
        );


        addObject(
            entity
        );


        entityVelocity.set(
            0,
            0
        );


        entityDirection.set(
            1,
            0
        );


        hasLastKnownPosition =
            false;


        lastSeenTimer =
            0;


        console.log(
            "ENTITY PNG LOADED:",
            image.width,
            image.height
        );


        return true;

    }
    catch(error){

        showError(
            "ENTITY ERROR\n\n" +
            error.message +
            "\n\nExpected:\n" +
            PATHS.entity
        );


        return false;

    }

}


/* =========================================================
   ENTITY WALL COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
){

    for(
        const wall
        of collisionWalls
    ){

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if(
            dx * dx +
            dz * dz <
            ENTITY_RADIUS *
            ENTITY_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   LINE OF SIGHT
========================================================= */

function lineBlocked(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2 -
        x1;


    const dz =
        z2 -
        z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance < .01
    ){

        return false;

    }


    const steps =
        Math.ceil(
            distance / .35
        );


    for(
        let i = 1;
        i <= steps;
        i++
    ){

        const t =
            i /
            steps;


        const x =
            x1 +
            dx * t;


        const z =
            z1 +
            dz * t;


        if(
            entityHitsWall(
                x,
                z
            )
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY PATHFINDING
========================================================= */

function chooseEntityDirection(){

    if(
        !entity
    ){

        return null;

    }


    const visible =
        !lineBlocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z

        );


    let targetX;

    let targetZ;


    if(
        visible
    ){

        targetX =
            player.position.x;


        targetZ =
            player.position.z;


        lastKnownPlayer.set(
            targetX,
            targetZ
        );


        hasLastKnownPosition =
            true;


        lastSeenTimer =
            LAST_SEEN_TIME;

    }

    else if(
        hasLastKnownPosition &&
        lastSeenTimer > 0
    ){

        targetX =
            lastKnownPlayer.x;


        targetZ =
            lastKnownPlayer.y;

    }

    else{

        return null;

    }


    const dx =
        targetX -
        entity.position.x;


    const dz =
        targetZ -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance < .1
    ){

        return null;

    }


    const targetAngle =
        Math.atan2(
            dz,
            dx
        );


    let best =
        null;


    /*
        Test many possible directions.

        This lets the entity detect that a
        wall is blocking it and choose a
        route around it.
    */

    for(
        let i = 0;
        i < 48;
        i++
    ){

        const angle =
            i /
            48 *
            Math.PI *
            2;


        const directionX =
            Math.cos(
                angle
            );


        const directionZ =
            Math.sin(
                angle
            );


        const testDistance =
            2.5;


        const testX =
            entity.position.x +
            directionX *
            testDistance;


        const testZ =
            entity.position.z +
            directionZ *
            testDistance;


        if(
            entityHitsWall(
                testX,
                testZ
            )
        ){

            continue;

        }


        const remaining =
            Math.hypot(

                targetX -
                testX,

                targetZ -
                testZ

            );


        let angleDifference =
            Math.abs(
                angle -
                targetAngle
            );


        if(
            angleDifference >
            Math.PI
        ){

            angleDifference =
                Math.PI -
                angleDifference;

        }


        const score =
            remaining +
            angleDifference *
            .55;


        if(
            best === null ||
            score <
            best.score
        ){

            best = {

                x:
                    directionX,

                z:
                    directionZ,

                score

            };

        }

    }


    return best;

}


/* =========================================================
   ANGLE
========================================================= */

function normalizeAngle(
    angle
){

    while(
        angle >
        Math.PI
    ){

        angle -=
            Math.PI * 2;

    }


    while(
        angle <
        -Math.PI
    ){

        angle +=
            Math.PI * 2;

    }


    return angle;

}


/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        dead
    ){

        return;

    }


    const settings =
        DIFFICULTIES[
            difficulty
        ];


    /* =====================================================
       EASY
    ===================================================== */

    if(
        !settings.chase
    ){

        wanderTimer -=
            dt;


        if(
            wanderTimer <= 0
        ){

            wanderTimer =
                1 +
                Math.random() *
                4;


            wanderAngle =
                Math.random() *
                Math.PI *
                2;

        }


        const targetX =
            Math.cos(
                wanderAngle
            );


        const targetZ =
            Math.sin(
                wanderAngle
            );


        entityVelocity.x =
            THREE.MathUtils.lerp(

                entityVelocity.x,

                targetX *
                settings.speed,

                Math.min(
                    1,
                    dt * 1.5
                )

            );


        entityVelocity.y =
            THREE.MathUtils.lerp(

                entityVelocity.y,

                targetZ *
                settings.speed,

                Math.min(
                    1,
                    dt * 1.5
                )

            );

    }


    /* =====================================================
       CHASE
    ===================================================== */

    else{

        const direction =
            chooseEntityDirection();


        if(
            direction
        ){

            const targetAngle =
                Math.atan2(
                    direction.z,
                    direction.x
                );


            const currentAngle =
                Math.atan2(
                    entityDirection.y,
                    entityDirection.x
                );


            let difference =
                normalizeAngle(
                    targetAngle -
                    currentAngle
                );


            /*
                Turning is limited.

                This is what makes the entity
                possible to juke.
            */

            const maxTurn =
                2.05 *
                dt;


            if(
                Math.abs(
                    difference
                ) >
                maxTurn
            ){

                difference =
                    Math.sign(
                        difference
                    ) *
                    maxTurn;

            }


            const newAngle =
                currentAngle +
                difference;


            entityDirection.x =
                Math.cos(
                    newAngle
                );


            entityDirection.y =
                Math.sin(
                    newAngle
                );


            const desiredX =
                entityDirection.x *
                settings.speed;


            const desiredZ =
                entityDirection.y *
                settings.speed;


            entityVelocity.x =
                THREE.MathUtils.lerp(

                    entityVelocity.x,

                    desiredX,

                    Math.min(
                        1,
                        dt * 2.5
                    )

                );


            entityVelocity.y =
                THREE.MathUtils.lerp(

                    entityVelocity.y,

                    desiredZ,

                    Math.min(
                        1,
                        dt * 2.5
                    )

                );

        }

        else{

            entityVelocity.x *=
                Math.pow(
                    .08,
                    dt
                );


            entityVelocity.y *=
                Math.pow(
                    .08,
                    dt
                );

        }

    }


    /* =====================================================
       MOVE ENTITY
    ===================================================== */

    const nextX =
        entity.position.x +
        entityVelocity.x *
        dt;


    const nextZ =
        entity.position.z +
        entityVelocity.y *
        dt;


    if(
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ){

        entity.position.x =
            nextX;

    }
    else{

        entityVelocity.x *=
            .12;

    }


    if(
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ){

        entity.position.z =
            nextZ;

    }
    else{

        entityVelocity.y *=
            .12;

    }


    /* =====================================================
       PLAYER DETECTION
    ===================================================== */

    const visible =
        !lineBlocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z

        );


    if(
        visible
    ){

        lastKnownPlayer.set(
            player.position.x,
            player.position.z
        );


        hasLastKnownPosition =
            true;


        lastSeenTimer =
            LAST_SEEN_TIME;

    }
    else{

        lastSeenTimer -=
            dt;

    }


    /* =====================================================
       ENTITY KILLS PLAYER
    ===================================================== */

    const distance =
        Math.hypot(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );


    if(
        distance < .78
    ){

        killPlayer();

    }


    /*
        Keep the full PNG facing the player.

        Only rotation changes.

        Image size NEVER changes.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
){

    const direction =
        new THREE.Vector3(
            0,
            0,
            0
        );


    if(
        keys.w
    )
        direction.z -= 1;


    if(
        keys.s
    )
        direction.z += 1;


    if(
        keys.a
    )
        direction.x -= 1;


    if(
        keys.d
    )
        direction.x += 1;


    if(
        direction.lengthSq() >
        0
    ){

        direction.normalize();


        direction.applyAxisAngle(

            new THREE.Vector3(
                0,
                1,
                0
            ),

            yaw

        );


        /*
            NO SPRINT COOLDOWN.

            You can hold SHIFT indefinitely.
        */

        const speed =
            keys.shift
                ? SPRINT_SPEED
                : WALK_SPEED;


        const movement =
            speed *
            dt;


        const nextX =
            player.position.x +
            direction.x *
            movement;


        if(
            !playerCollides(
                nextX,
                player.position.z
            )
        ){

            player.position.x =
                nextX;

        }


        const nextZ =
            player.position.z +
            direction.z *
            movement;


        if(
            !playerCollides(
                player.position.x,
                nextZ
            )
        ){

            player.position.z =
                nextZ;

        }

    }


    /* =====================================================
       JUMP
    ===================================================== */

    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;


        grounded =
            false;

    }


    jumpPressed =
        false;


    velocityY -=
        GRAVITY *
        dt;


    player.position.y +=
        velocityY *
        dt;


    if(
        player.position.y <= 0
    ){

        player.position.y =
            0;


        velocityY =
            0;


        grounded =
            true;

    }

}


/* =========================================================
   CAMERA
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
){

    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    if(
        moving
    ){

        camera.position.x =
            Math.sin(
                cameraTime * 5
            ) *
            .008;


        camera.position.y =
            EYE_HEIGHT +
            Math.sin(
                cameraTime * 8
            ) *
            .006;

    }
    else{

        camera.position.x =
            0;


        camera.position.y =
            EYE_HEIGHT;

    }


    camera.rotation.z =
        Math.sin(
            cameraTime * 1.2
        ) *
        .001;

}


/* =========================================================
   ENTITY AUDIO
========================================================= */

const entityAudio =
    new Audio(
        PATHS.audio
    );


entityAudio.loop =
    true;


entityAudio.volume =
    0;


function updateEntityAudio(){

    if(
        !entity ||
        !running ||
        paused ||
        dead
    ){

        entityAudio.volume =
            0;


        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }


        return;

    }


    const dx =
        entity.position.x -
        player.position.x;


    const dz =
        entity.position.z -
        player.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const MAX_DISTANCE =
        32;


    /*
        Completely silent when far away.
    */

    if(
        distance >=
        MAX_DISTANCE
    ){

        entityAudio.volume =
            0;


        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }


        return;

    }


    let volume =
        1 -
        distance /
        MAX_DISTANCE;


    volume =
        Math.pow(
            volume,
            1.8
        ) *
        .8;


    /*
        Walls muffle the sound.
    */

    if(
        lineBlocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z

        )
    ){

        volume *=
            .15;

    }


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .8
        );


    if(
        entityAudio.paused &&
        volume > .01
    ){

        entityAudio
            .play()
            .catch(
                () => {}
            );

    }

}


/* =========================================================
   START
========================================================= */

async function startGame(){

    /*
        Do not start the world until all
        three environment PNGs are confirmed.
    */

    if(
        !floorMaterial ||
        !wallMaterial ||
        !ceilingMaterial
    ){

        const loaded =
            await loadEnvironmentTextures();


        if(
            !loaded
        ){

            return;

        }

    }


    buildLevel();


    const entityCreated =
        await createEntity();


    if(
        !entityCreated
    ){

        return;

    }


    running =
        true;


    paused =
        false;


    dead =
        false;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            difficulty
        ].name;


    entityAudio.pause();


    entityAudio.currentTime =
        0;


    entityAudio.volume =
        0;


    /*
        Browser audio is now allowed because
        the game was started by a button click.
    */

    entityAudio
        .play()
        .then(
            () => {

                entityAudio.pause();

                entityAudio.currentTime =
                    0;

                entityAudio.volume =
                    0;

            }
        )
        .catch(
            () => {}
        );


    try{

        await document.body.requestPointerLock();

    }
    catch(error){

        console.log(
            "Pointer lock:",
            error
        );

    }

}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(){

    if(
        dead
    ){

        return;

    }


    dead =
        true;


    running =
        false;


    entityAudio.pause();


    entityAudio.volume =
        0;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    document.getElementById(
        "death"
    ).style.display =
        "flex";

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !running &&
        !paused
    ){

        return;

    }


    if(
        paused
    ){

        paused =
            false;


        document.getElementById(
            "pause"
        ).style.display =
            "none";


        document.body.requestPointerLock();

    }
    else{

        paused =
            true;


        document.getElementById(
            "pause"
        ).style.display =
            "flex";


        entityAudio.pause();


        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    }

}


/* =========================================================
   MAIN MENU
========================================================= */

function returnToMenu(){

    running =
        false;


    paused =
        false;


    dead =
        false;


    entityAudio.pause();


    entityAudio.volume =
        0;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";

}

function setDifficulty(
    value
){

    difficulty =
        value;


    document
        .querySelectorAll(
            ".difficulty button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );

            }
        );


    document.getElementById(
        value + "Btn"
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            value
        ].name;

}

        ){

document.addEventListener(

    () => {

        if(

        ){

            if(

            ){

                paused =

window.addEventListener(

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

   START TEXTURE LOADING
========================================================= */

loadEnvironmentTextures();


/* =========================================================
   GAME CLOCK
========================================================= */

const clock =
    new THREE.Clock();


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        updateEntityAudio();


        updateCamera(
            dt
        );

    }
    else{

        updateEntityAudio();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();
