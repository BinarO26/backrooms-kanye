<head>

<style>
*{box-sizing:border-box}

html,body{

}

canvas{display:block}

/* =========================================================
   MENU
========================================================= */

#menu{

}

.menuImage{
    position:absolute;

}

.menuImage.active{opacity:1}

.menuDark{
    position:absolute;
    inset:0;

        linear-gradient(
            0deg,

}

.menuScanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.13;

}

.menuContent{

    bottom:12%;

}

.menuContent h1{

}

.menuSubtitle{

}

.menuHint{

}

.menuButtons{

}

.menuDifficulty{
    display:grid;

}

button{

<!-- =======================================================
     THREE.JS R160 MODULE
======================================================= -->

<script type="module">

import * as THREE from "./three.module.js";

"use strict";

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

let gameTime = 0;
let messageTimer = 0;

/* =========================================================
   THREE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x6d6846);

scene.fog =
    new THREE.Fog(
        0x6d6846,
        22,
        105
    );

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .04,
        350
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.15
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.12;

renderer.shadowMap.enabled = false;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   PLAYER CONSTANTS
========================================================= */

const TILE = 3;

const WALL_HEIGHT = 9;

const PLAYER_RADIUS = .42;

const EYE_HEIGHT = 5.25;
const CROUCH_EYE_HEIGHT = 3.25;

const WALK_SPEED = 4.8;
const SPRINT_SPEED = 8.0;
const SPRINT_JUMP_SPEED = 9.0;

const GRAVITY = 21;
const JUMP_SPEED = 7.6;

/* =========================================================
   LIGHTING
========================================================= */

const hemisphere =
    new THREE.HemisphereLight(
        0xffe9ad,
        0x14120d,
        .55
    );

scene.add(hemisphere);

const warmAmbient =
    new THREE.AmbientLight(
        0xffdda0,
        .16
    );

scene.add(warmAmbient);

const ceilingLights = [];

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;
let entityTexture = null;

function configureTexture(
    texture,
    repeatX,
    repeatY
){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(
    path,
    repeatX,
    repeatY
){

    return new Promise(
        (resolve,reject)=>{

            textureLoader.load(

                path,

                texture=>{

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        configureTexture(
                            texture,
                            repeatX,
                            repeatY
                        )
                    );

                },

                undefined,

                error=>{

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    reject(
                        new Error(
                            "Failed to load " + path
                        )
                    );

                }

            );

        }
    );

}

async function loadTextures(){

    wallTexture =
        await loadTexture(
            "./textures/wall.png",
            1.1,
            1.1
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

    /*
        Entity is optional.
        If it doesn't exist, the game still loads.
    */

    try{

        entityTexture =
            await loadTexture(
                "./entity.png",
                1,
                1
            );

    }catch{

        entityTexture = null;

    }

}

/* =========================================================
   MATERIALS
========================================================= */

const wallMaterial =
    new THREE.MeshStandardMaterial({
        roughness:.92,
        metalness:0,
        side:THREE.DoubleSide
    });

const floorMaterial =
    new THREE.MeshStandardMaterial({
        roughness:.97,
        metalness:0,
        side:THREE.DoubleSide
    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({
        roughness:.93,
        metalness:0,
        side:THREE.DoubleSide
    });

const holeBottomMaterial =
    new THREE.MeshStandardMaterial({
        color:0x030303,
        roughness:1,
        metalness:0
    });

const holeWallMaterial =
    new THREE.MeshStandardMaterial({
        color:0x15120c,
        roughness:1,
        metalness:0
    });

function applyTextures(){

    wallMaterial.map =
        wallTexture;

    floorMaterial.map =
        floorTexture;

    ceilingMaterial.map =
        ceilingTexture;

    wallMaterial.needsUpdate = true;
    floorMaterial.needsUpdate = true;
    ceilingMaterial.needsUpdate = true;

}

/* =========================================================
   MAP
========================================================= */

let mapWidth = 0;
let mapHeight = 0;

let mapData = [];

let playerSpawn = null;
let entitySpawn = null;

const wallColliders = [];

const holeCells = [];
const hideCells = [];
const walkableCells = [];

/* =========================================================
   MAP PIXEL TYPES
========================================================= */

function classifyPixel(
    r,g,b,a
){

    if(a < 20)
        return "floor";

    /* BLACK = WALL */

    if(
        r < 80 &&
        g < 80 &&
        b < 80
    ){
        return "wall";
    }

    /* RED = PLAYER */

    if(
        r > 150 &&
        r > g*1.4 &&
        r > b*1.4
    ){
        return "spawn";
    }

    /* BLUE = ENTITY */

    if(
        b > 125 &&
        b > r*1.3 &&
        b > g*1.15
    ){
        return "entity";
    }

    /* PURPLE = HIDE */

    if(
        r > 105 &&
        b > 105 &&
        g < 115
    ){
        return "hide";
    }

    /* YELLOW / ORANGE = HOLE */

    if(
        r > 135 &&
        g > 115 &&
        b < 125
    ){
        return "hole";
    }

    return "floor";
}

/* =========================================================
   MAP COORDINATES
========================================================= */

function cellToWorld(x,y){

    return {

        x:
            (x+.5)*TILE -
            mapWidth*TILE*.5,

        z:
            (y+.5)*TILE -
            mapHeight*TILE*.5

    };

}

function worldToCell(x,z){

    return {

        x:
            Math.floor(
                (
                    x +
                    mapWidth*TILE*.5
                ) / TILE
            ),

        y:
            Math.floor(
                (
                    z +
                    mapHeight*TILE*.5
                ) / TILE
            )

    };

}

function insideMap(x,y){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function cellType(x,y){

    if(!insideMap(x,y))
        return "wall";

    return mapData[y][x];

}

function isWalkable(x,y){

    if(!insideMap(x,y))
        return false;

    return cellType(x,y) !== "wall";

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image =
        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();

                img.onload =
                    ()=>resolve(img);

                img.onerror =
                    ()=>reject(
                        new Error(
                            "textures/map1.png failed to load."
                        )
                    );

                img.src =
                    "./textures/map1.png?v=2";

            }
        );

    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;

    const canvas =
        document.createElement("canvas");

    canvas.width =
        mapWidth;

    canvas.height =
        mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData = [];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row=[];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i =
                (y*mapWidth+x)*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(
                type !== "wall"
            ){

                walkableCells.push({
                    x,
                    y
                });

            }

            if(
                type === "hole"
            ){

                holeCells.push({
                    x,
                    y
                });

            }

            if(
                type === "hide"
            ){

                hideCells.push({
                    x,
                    y
                });

            }

            if(
                type === "spawn" &&
                !playerSpawn
            ){

                playerSpawn =
                    cellToWorld(x,y);

            }

            if(
                type === "entity" &&
                !entitySpawn
            ){

                entitySpawn =
                    cellToWorld(x,y);

            }

        }

        mapData.push(row);

    }

    /* FALLBACK PLAYER SPAWN */

    if(!playerSpawn){

        const cell =
            walkableCells.find(
                c =>
                    cellType(c.x,c.y) !== "hole"
            );

        if(cell){

            playerSpawn =
                cellToWorld(
                    cell.x,
                    cell.y
                );

        }else{

            playerSpawn = {
                x:0,
                z:0
            };

        }

    }

    /* FALLBACK ENTITY SPAWN */

    if(!entitySpawn){

        const cell =
            walkableCells.find(
                c => {

                    if(
                        cellType(c.x,c.y)==="hole"
                    )
                        return false;

                    const p =
                        cellToWorld(
                            c.x,
                            c.y
                        );

                    return (
                        Math.hypot(
                            p.x-playerSpawn.x,
                            p.z-playerSpawn.z
                        ) > 20
                    );

                }
            );

        if(cell){

            entitySpawn =
                cellToWorld(
                    cell.x,
                    cell.y
                );

        }else{

            entitySpawn = {
                x:playerSpawn.x+30,
                z:playerSpawn.z+30
            };

        }

    }

}

/* =========================================================
   FLOOR
========================================================= */

function addFloor(x,z){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            floorMaterial

        );

    mesh.rotation.x =
        -Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    world.add(mesh);

}

/* =========================================================
   CEILING
========================================================= */

function addCeiling(x,z){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            ceilingMaterial

        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    world.add(mesh);

}

/* =========================================================
   WALL
========================================================= */

function addWall(x,z){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),

            wallMaterial

        );

    mesh.position.set(
        x,
        WALL_HEIGHT*.5,
        z
    );

    world.add(mesh);

    wallColliders.push({

        minX:x-TILE*.5,
        maxX:x+TILE*.5,

        minZ:z-TILE*.5,
        maxZ:z+TILE*.5

    });

}

/* =========================================================
   3D HOLES
========================================================= */

/*
    Hole cells have NO FLOOR TEXTURE.

    The ceiling is intentionally still created.

    Connected hole pixels visually merge because:
    - there is no floor between them
    - the same dark pit material is used
    - inner walls are only created around the outside
*/

function addHoleCell(x,y){

    const p =
        cellToWorld(x,y);

    /*
        Deep bottom.
    */

    const bottom =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            holeBottomMaterial

        );

    bottom.rotation.x =
        -Math.PI/2;

    bottom.position.set(
        p.x,
        -4.5,
        p.z
    );

    world.add(bottom);

    /*
        Very dark inner walls.
    */

    const neighbors = [
        [x-1,y,"left"],
        [x+1,y,"right"],
        [x,y-1,"top"],
        [x,y+1,"bottom"]
    ];

    for(
        const [nx,ny,side]
        of neighbors
    ){

        if(
            insideMap(nx,ny) &&
            cellType(nx,ny)==="hole"
        )
            continue;

        const wall =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    TILE,
                    4.5,
                    .08
                ),

                holeWallMaterial

            );

        if(
            side==="left" ||
            side==="right"
        ){

            wall.geometry.dispose();

            wall.geometry =
                new THREE.BoxGeometry(
                    .08,
                    4.5,
                    TILE
                );

        }

        if(side==="left"){

            wall.position.set(
                p.x-TILE*.5,
                -2.25,
                p.z
            );

        }

        if(side==="right"){

            wall.position.set(
                p.x+TILE*.5,
                -2.25,
                p.z
            );

        }

        if(side==="top"){

            wall.position.set(
                p.x,
                -2.25,
                p.z-TILE*.5
            );

        }

        if(side==="bottom"){

            wall.position.set(
                p.x,
                -2.25,
                p.z+TILE*.5
            );

        }

        world.add(wall);

    }

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                cellType(x,y);

            const p =
                cellToWorld(x,y);

            if(type==="wall"){

                addWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
                HOLES:
                NO FLOOR.
            */

            if(type==="hole"){

                addHoleCell(
                    x,
                    y
                );

                /*
                    Ceiling remains.
                */

                addCeiling(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
                Every normal walkable tile.
            */

            addFloor(
                p.x,
                p.z
            );

            addCeiling(
                p.x,
                p.z
            );

            /*
                Hide cells become visible lockers.
            */

            if(type==="hide"){

                createLocker(
                    x,
                    y
                );

            }

        }

    }

}

/* =========================================================
   LIGHTING
========================================================= */

function addCeilingLight(x,z){

    /*
        Full one-tile fluorescent panel.
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE*.92,
                .055,
                TILE*.92
            ),

            new THREE.MeshStandardMaterial({
                color:0xfff8d0,
                emissive:0xffe9a0,
                emissiveIntensity:2.5,
                roughness:.45
            })

        );

    fixture.position.set(
        x,
        WALL_HEIGHT-.07,
        z
    );

    world.add(fixture);

    /*
        No shadows.
        This keeps performance much better.
    */

    const light =
        new THREE.PointLight(
            0xffe7a3,
            3.1,
            15,
            1.7
        );

    light.position.set(
        x,
        WALL_HEIGHT-.35,
        z
    );

    scene.add(light);

    ceilingLights.push({
        light,
        timer:
            Math.random()*5
    });

}

/* =========================================================
   BUILD LIGHTS
========================================================= */

function buildLights(){

    /*
        Deliberately sparse lighting.

        More realistic than hundreds of lights,
        while being much faster.
    */

    const spacing = 5;

    let count = 0;

    for(
        let y=2;
        y<mapHeight-2;
        y+=spacing
    ){

        for(
            let x=2;
            x<mapWidth-2;
            x+=spacing
        ){

            if(
                cellType(x,y)!=="wall" &&
                cellType(x,y)!=="hole"
            ){

                const p =
                    cellToWorld(
                        x,
                        y
                    );

                addCeilingLight(
                    p.x,
                    p.z
                );

                count++;

                if(count>=80)
                    return;

            }

        }

    }

}

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.y =
    EYE_HEIGHT;

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let grounded = true;

let crouching = false;
let hidden = false;
let falling = false;

let fallTimer = 0;

const keys = {};

/* =========================================================
   COLLISION
========================================================= */

function collides(x,z){

    const r =
        PLAYER_RADIUS;

    for(
        const wall
        of wallColliders
    ){

        if(
            x+r > wall.minX &&
            x-r < wall.maxX &&
            z+r > wall.minZ &&
            z-r < wall.maxZ
        ){

            return true;

        }

    }

    return false;

}

/* =========================================================
   FULL HITBOX HOLE CHECK
========================================================= */

/*
    The entire circular player hitbox has to be
    inside a hole before falling begins.
*/

function playerFullyOverHole(){

    const offsets = [
        [0,0],
        [PLAYER_RADIUS,0],
        [-PLAYER_RADIUS,0],
        [0,PLAYER_RADIUS],
        [0,-PLAYER_RADIUS],
        [.7*PLAYER_RADIUS,.7*PLAYER_RADIUS],
        [-.7*PLAYER_RADIUS,.7*PLAYER_RADIUS],
        [.7*PLAYER_RADIUS,-.7*PLAYER_RADIUS],
        [-.7*PLAYER_RADIUS,-.7*PLAYER_RADIUS]
    ];

    for(
        const [ox,oz]
        of offsets
    ){

        const cell =
            worldToCell(
                player.position.x+ox,
                player.position.z+oz
            );

        if(
            !insideMap(
                cell.x,
                cell.y
            )
        )
            return false;

        if(
            cellType(
                cell.x,
                cell.y
            ) !== "hole"
        ){

            return false;

        }

    }

    return true;

}

/* =========================================================
   MOVE PLAYER
========================================================= */

function movePlayer(dx,dz){

    const nx =
        player.position.x+dx;

    const nz =
        player.position.z+dz;

    if(
        !collides(
            nx,
            player.position.z
        )
    ){

        player.position.x =
            nx;

    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){

        player.position.z =
            nz;

    }

}

/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer += dt;

        player.position.y =
            -Math.min(
                fallTimer*3,
                5
            );

        camera.position.y =
            EYE_HEIGHT -
            Math.min(
                fallTimer*.8,
                1.2
            );

        if(
            fallTimer>1.5
        ){

            die(
                "YOU FELL INTO THE FLOOR."
            );

        }

        return;

    }

    crouching =
        !!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w) forward++;
    if(keys.s) forward--;
    if(keys.d) strafe++;
    if(keys.a) strafe--;

    const length =
        Math.hypot(
            forward,
            strafe
        );

    const sprinting =
        !!keys.shift &&
        !crouching &&
        length>0;

    if(length>0){

        forward/=length;
        strafe/=length;

        let speed =
            sprinting
            ?
            SPRINT_SPEED
            :
            crouching
            ?
            WALK_SPEED*.58
            :
            WALK_SPEED;

        /*
            Jumping while sprinting gets a small
            track-star style boost.
        */

        if(
            sprinting &&
            !grounded
        ){

            speed =
                SPRINT_JUMP_SPEED;

        }

        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);

        const dx =
            (
                strafe*cos -
                forward*sin
            ) *
            speed *
            dt;

        const dz =
            (
                -forward*cos -
                strafe*sin
            ) *
            speed *
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    /* GRAVITY */

    velocityY -=
        GRAVITY*dt;

    player.position.y +=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    /* JUMP */

    if(
        grounded &&
        keys.spacePressed &&
        !crouching
    ){

        velocityY =
            JUMP_SPEED;

        grounded=false;

        keys.spacePressed=false;

    }

    const targetHeight =
        crouching
        ?
        CROUCH_EYE_HEIGHT
        :
        EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();

    /*
        Full hitbox must be inside hole.
    */

    if(
        playerFullyOverHole()
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest=null;
    let distance=Infinity;

    for(
        const locker
        of lockers
    ){

        const d =
            Math.hypot(
                player.position.x-locker.x,
                player.position.z-locker.z
            );

        if(d<distance){

            distance=d;
            closest=locker;

        }

    }

    const near =
        closest &&
        distance<1.5;

    hidden =
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near&&!hidden
        ?
        "1"
        :
        "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ?
        "1"
        :
        "0";

}

/* =========================================================
   ENTITY
========================================================= */

let entity=null;

let entityPath=[];
let entityPathIndex=0;

let entityRepathTimer=0;
let entityStuckTimer=0;

let lastEntityX=0;
let lastEntityZ=0;

let entityAudio=null;

function createEntity(){

        })

        });

    /*

        1.8 x 4.8 box anymore.

    );

        );

}

/* =========================================================
   ENTITY PATHFINDING
========================================================= */

function cellKey(x,y){

    return x+","+y;

}

function findPath(startX,startY,endX,endY){

    if(
        !insideMap(
            endX,
            endY
        )
    )
        return [];

    /*
        Holes are technically traversable for the
        entity, but walls are not.
    */

    const open=[];

    const cameFrom =
        new Map();

    const gScore =
        new Map();

    const fScore =
        new Map();

    const startKey =
        cellKey(
            startX,
            startY
        );

    gScore.set(
        startKey,
        0
    );

    fScore.set(
        startKey,
        Math.abs(
            startX-endX
        )+
        Math.abs(
            startY-endY
        )
    );

    open.push({
        x:startX,
        y:startY
    });

    const maxIterations =
        3500;

    let iterations=0;

    while(
        open.length &&
        iterations<maxIterations
    ){

        iterations++;

        let best=0;

        for(
            let i=1;
            i<open.length;
            i++
        ){

            const a =
                fScore.get(
                    cellKey(
                        open[i].x,
                        open[i].y
                    )
                ) ??
                Infinity;

            const b =
                fScore.get(
                    cellKey(
                        open[best].x,
                        open[best].y
                    )
                ) ??
                Infinity;

            if(a<b)
                best=i;

        }

        const current =
            open.splice(
                best,
                1
            )[0];

        if(
            current.x===endX &&
            current.y===endY
        ){

            const path=[];

            let key =
                cellKey(
                    current.x,
                    current.y
                );

            while(key){

                const parts =
                    key.split(",").map(Number);

                path.push({
                    x:parts[0],
                    y:parts[1]
                });

                key =
                    cameFrom.get(key);

            }

            path.reverse();

            return path;

        }

        const neighbors=[
            [1,0],
            [-1,0],
            [0,1],
            [0,-1]
        ];

        for(
            const [dx,dy]
            of neighbors
        ){

            const nx =
                current.x+dx;

            const ny =
                current.y+dy;

            if(
                !insideMap(
                    nx,
                    ny
                )
            )
                continue;

            if(
                cellType(
                    nx,
                    ny
                )==="wall"
            )
                continue;

            const currentKey =
                cellKey(
                    current.x,
                    current.y
                );

            const neighborKey =
                cellKey(
                    nx,
                    ny
                );

            const tentative =
                (
                    gScore.get(
                        currentKey
                    ) ??
                    Infinity
                )+1;

            if(
                tentative <
                (
                    gScore.get(
                        neighborKey
                    ) ??
                    Infinity
                )
            ){

                cameFrom.set(
                    neighborKey,
                    currentKey
                );

                gScore.set(
                    neighborKey,
                    tentative
                );

                fScore.set(
                    neighborKey,
                    tentative+
                    Math.abs(
                        nx-endX
                    )+
                    Math.abs(
                        ny-endY
                    )
                );

                if(
                    !open.some(
                        p =>
                            p.x===nx &&
                            p.y===ny
                    )
                ){

                    open.push({
                        x:nx,
                        y:ny
                    });

                }

            }

        }

    }

    return [];

}

/* =========================================================
   ENTITY TARGET
========================================================= */

function getEntityTargetCell(){

    const cell =
        worldToCell(
            player.position.x,
            player.position.z
        );

    if(
        insideMap(
            cell.x,
            cell.y
        )
    ){

        return cell;

    }

    return null;

}

/* =========================================================
   ENTITY TELEPORT RECOVERY
========================================================= */

function teleportEntityNearPlayer(){

    if(!entity)
        return;

    const playerCell =
        worldToCell(
            player.position.x,
            player.position.z
        );

    /*
        Search for a walkable location at least
        20 MAP PIXELS away.

        This is based on map cells, not world units.
    */

    const candidates=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            if(
                cellType(x,y)==="wall"
            )
                continue;

            const distance =
                Math.hypot(
                    x-playerCell.x,
                    y-playerCell.y
                );

            if(
                distance>=20
            ){

                candidates.push({
                    x,
                    y,
                    distance
                });

            }

        }

    }

    if(!candidates.length)
        return;

    /*
        Prefer places reasonably close to the player,
        while still respecting the 20-pixel minimum.
    */

    candidates.sort(
        (a,b) =>
            a.distance-b.distance
    );

    const chosen =
        candidates[
            Math.floor(
                Math.random()*
                Math.min(
                    candidates.length,
                    12
                )
            )
        ];

    const p =
        cellToWorld(
            chosen.x,
            chosen.y
        );

    entity.position.x =
        p.x;

    entity.position.z =
        p.z;

    entityPath=[];
    entityPathIndex=0;
    entityStuckTimer=0;

    showMessage(
        "SOMETHING MOVED..."
    );

}

/* =========================================================
   ENTITY PATH UPDATE
========================================================= */

function updateEntityPath(){

    if(!entity)
        return;

    const from =
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const target =
        getEntityTargetCell();

    if(
        !target ||
        !insideMap(
            from.x,
            from.y
        )
    )
        return;

    entityPath =
        findPath(
            from.x,
            from.y,
            target.x,
            target.y
        );

    entityPathIndex=1;

}

/* =========================================================
   ENTITY SPEED
========================================================= */

function getEntitySpeed(){

    if(
        difficulty==="easy"
    )
        return 4.5;

    if(
        difficulty==="hard"
    )
        return 7.3;

    if(
        difficulty==="nightmare"
    )
        return SPRINT_JUMP_SPEED;

    return 6.2;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        paused ||
        dead
    )
        return;

    entityRepathTimer -= dt;

    if(
        entityRepathTimer<=0
    ){

        entityRepathTimer =
            difficulty==="nightmare"
            ?
            .15
            :
            .28;

        updateEntityPath();

    }

    let targetPoint=null;

    if(
        entityPath.length &&
        entityPathIndex<
        entityPath.length
    ){

        const cell =
            entityPath[
                entityPathIndex
            ];

        const p =
            cellToWorld(
                cell.x,
                cell.y
            );

        targetPoint=p;

        if(
            Math.hypot(
                entity.position.x-p.x,
                entity.position.z-p.z
            )<.45
        ){

            entityPathIndex++;

        }

    }

    if(targetPoint){

        let dx =
            targetPoint.x-
            entity.position.x;

        let dz =
            targetPoint.z-
            entity.position.z;

        const len =
            Math.hypot(
                dx,
                dz
            );

        if(len>.01){

            dx/=len;
            dz/=len;

            const speed =
                getEntitySpeed();

            entity.position.x +=
                dx*speed*dt;

            entity.position.z +=
                dz*speed*dt;

        }

    }

    /*
        Stuck detection.
    */

    const moved =
        Math.hypot(
            entity.position.x-lastEntityX,
            entity.position.z-lastEntityZ
        );

    if(moved<.04){

        entityStuckTimer += dt;

    }else{

        entityStuckTimer=0;

    }

    lastEntityX =
        entity.position.x;

    lastEntityZ =
        entity.position.z;

    /*
        If stuck for a while:
        teleport at least 20 map pixels away.
    */

    if(
        entityStuckTimer>2.5
    ){

        teleportEntityNearPlayer();

    }

    /*
        Billboard.

        This keeps the PNG facing the camera
        without changing its proportions.
    */

    entity.lookAt(
        camera.position.x,
        entity.position.y,
        camera.position.z
    );

    /*
        Entity catches player.
    */

    const distance =
        Math.hypot(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    if(
        distance<1.25 &&
        !hidden &&
        !falling
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

    updateEntityAudio(
        distance
    );

}

/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio(distance){

    if(!entityAudio)
        return;

    /*
        Sound starts when the entity gets within
        this range.
    */

    const AUDIO_RANGE = 35;

    let entityVolume=0;

    if(
        distance<AUDIO_RANGE
    ){

        entityVolume =
            1 -
            distance/AUDIO_RANGE;

        /*
            Smooth distance curve so it gets
            noticeably louder near the player.
        */

        entityVolume =
            Math.pow(
                entityVolume,
                .72
            );

    }

    entityVolume =
        THREE.MathUtils.clamp(
            entityVolume,
            0,
            1
        );

    /*
        The overlay gets quieter as entity audio
        gets louder.

        Far away:
        entity = 0
        overlay = 1

        Close:
        entity = 1
        overlay = 0
    */

    const videoVolume =
        1-entityVolume;

    entityAudio.volume =
        entityVolume;

    overlayVideo.volume =
        videoVolume;

    if(
        entityVolume>.01 &&
        entityAudio.paused &&
        gameStarted &&
        !paused &&
        !dead
    ){

        entityAudio.play()
            .catch(()=>{});

    }

    if(
        entityVolume<=.005 &&
        !entityAudio.paused
    ){

        /*
            Stop it when sufficiently far away.
        */

        entityAudio.pause();

        try{
            entityAudio.currentTime=0;
        }catch{}

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent =
        reason;

    document.getElementById(
        "death"
    ).style.display =
        "flex";

    stopEntityAudio();

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   ENTITY AUDIO STOP
========================================================= */

function stopEntityAudio(){

    if(!entityAudio)
        return;

    entityAudio.pause();

    try{
        entityAudio.currentTime=0;
    }catch{}

    entityAudio.volume=0;

}

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent =
        text;

    messageTimer=2.5;

}

function updateMessage(dt){

    if(messageTimer>0){

        messageTimer-=dt;

        if(
            messageTimer<=0
        ){

            document.getElementById(
                "message"
            ).textContent="";

        }

    }

}

/* =========================================================
   RESET PLAYER
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y =
        EYE_HEIGHT;

    velocityY=0;

    grounded=true;

    crouching=false;
    hidden=false;

    falling=false;
    fallTimer=0;

}

/* =========================================================
   VIDEO CHROMA KEY
========================================================= */

const overlayVideo =
    document.getElementById(
        "overlayVideo"
    );

const videoCanvas =
    document.getElementById(
        "videoCanvas"
    );

const videoContext =
    videoCanvas.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );

/*
    Low-resolution processing makes the blue
    key much less expensive.

    It is then scaled to the entire screen by CSS.
*/

const VIDEO_WIDTH=640;
const VIDEO_HEIGHT=360;

videoCanvas.width =
    VIDEO_WIDTH;

videoCanvas.height =
    VIDEO_HEIGHT;

/*
    Blue key threshold.

    Adjust these if your particular video uses
    a slightly different blue.
*/

function isBluePixel(
    r,g,b
){

    /*
        Strong blue / cyan.
    */

    return (
        b>95 &&
        b>r*1.25 &&
        b>g*1.05
    );

}

let lastVideoProcess=0;

function processOverlayVideo(){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(
        overlayVideo.readyState<
        HTMLMediaElement.HAVE_CURRENT_DATA
    )
        return;

    const now =
        performance.now();

    /*
        Process at about 30 FPS rather than
        processing unnecessarily every frame.
    */

    if(
        now-lastVideoProcess<33
    )
        return;

    lastVideoProcess=now;

    videoContext.drawImage(
        overlayVideo,
        0,
        0,
        VIDEO_WIDTH,
        VIDEO_HEIGHT
    );

    const image =
        videoContext.getImageData(
            0,
            0,
            VIDEO_WIDTH,
            VIDEO_HEIGHT
        );

    const data =
        image.data;

    for(
        let i=0;
        i<data.length;
        i+=4
    ){

        const r=data[i];
        const g=data[i+1];
        const b=data[i+2];

        if(
            isBluePixel(
                r,g,b
            )
        ){

            data[i+3]=0;

        }else{

            /*
                Slight transparency so the
                footage feels like a camera layer.
            */

            data[i+3]=225;

        }

    }

    videoContext.putImageData(
        image,
        0,
        0
    );

}

/* =========================================================
   START VIDEO
========================================================= */

async function startOverlayVideo(){

    videoCanvas.style.display =
        "block";

    overlayVideo.currentTime=0;

    /*
        Start muted first so browsers don't
        reject playback.

        Then enable audio.
    */

    overlayVideo.muted=true;

    try{

        await overlayVideo.play();

        overlayVideo.muted=false;

        overlayVideo.volume=1;

    }catch(error){

        console.warn(
            "Overlay video could not autoplay:",
            error
        );

    }

}

/* =========================================================
   STOP VIDEO
========================================================= */

function stopOverlayVideo(){

    videoCanvas.style.display =
        "none";

    overlayVideo.pause();

    try{
        overlayVideo.currentTime=0;
    }catch{}

}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    gameStarted=true;
    paused=false;
    dead=false;

    gameTime=0;

    resetPlayer();

    /*
        Remove old entity.
    */

    if(entity){

        world.remove(entity);

        if(entity.geometry)
            entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;

    }

    stopEntityAudio();

    createEntity();

    startOverlayVideo();

    renderer.domElement.requestPointerLock();

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display =
        paused
        ?
        "flex"
        :
        "none";

    if(paused){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

        if(entityAudio)
            entityAudio.pause();

        overlayVideo.pause();

    }else{

        renderer.domElement
            .requestPointerLock();

        overlayVideo.play()
            .catch(()=>{});

    }

}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display =
        "flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display =
        "none";

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key =
            event.key.toLowerCase();

        if(
            key===" " ||
            event.code==="Space"
        ){

            if(
                !event.repeat
            ){

                keys.spacePressed=true;

            }

            event.preventDefault();

        }

        keys[key]=true;

        if(
            key==="escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();
                return;

            }

            if(gameStarted){

                togglePause();

            }

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        const key =
            event.key.toLowerCase();

        keys[key]=false;

        if(
            event.code==="Space"
        ){

            keys.spacePressed=false;

        }

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw -=
            event.movementX*.0021;

        pitch -=
            event.movementY*.0018;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock();

        }

    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "menuControlsBtn"
).addEventListener(
    "click",
    showControls
);

document.getElementById(
    "pauseControlsBtn"
).addEventListener(
    "click",
    showControls
);

document.getElementById(
    "controlsBackBtn"
).addEventListener(
    "click",
    hideControls
);

document.getElementById(
    "resumeBtn"
).addEventListener(
    "click",
    ()=>{

        paused=false;

        document.getElementById(
            "pause"
        ).style.display="none";

        renderer.domElement
            .requestPointerLock();

        overlayVideo.play()
            .catch(()=>{});

    }
);

document.getElementById(
    "restartBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "retryBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "menuBtn"
).addEventListener(
    "click",
    ()=>{

        gameStarted=false;
        paused=false;

        stopEntityAudio();
        stopOverlayVideo();

        document.getElementById(
            "pause"
        ).style.display="none";

        document.getElementById(
            "menu"
        ).style.display="block";

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    }
);

document.getElementById(
    "deathMenuBtn"
).addEventListener(
    "click",
    ()=>{

        dead=false;
        gameStarted=false;

        stopEntityAudio();
        stopOverlayVideo();

        document.getElementById(
            "death"
        ).style.display="none";

        document.getElementById(
            "menu"
        ).style.display="block";

    }
);

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();

}

difficultyButtons.easy.onclick =
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick =
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick =
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick =
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU IMAGE ROTATION
========================================================= */

const menuImages =
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex =
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(dt){

    for(
        const item
        of ceilingLights
    ){

        item.timer-=dt;

        if(
            item.timer<=0
        ){

            item.timer =
                1+
                Math.random()*6;

            if(
                Math.random()<.11
            ){

                item.light.intensity=
                    .4+
                    Math.random()*1.4;

                setTimeout(
                    ()=>{

                        if(item.light){

                            item.light.intensity=
                                3.1;

                        }

                    },
                    40+
                    Math.random()*100
                );

            }else{

                item.light.intensity=3.1;

            }

        }

    }

}

/* =========================================================
   TAPE TIME
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total =
        Math.floor(
            gameTime
        );

    const h =
        Math.floor(
            total/3600
        );

    const m =
        Math.floor(
            (total%3600)/60
        );

    const s =
        total%60;

    const pad =
        n =>
            String(n)
            .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent =
        pad(h)+":"+
        pad(m)+":"+
        pad(s);

}

/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime =
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now =
        performance.now();

    let dt =
        (now-lastTime)/1000;

    lastTime=now;

    /*
        Prevent huge physics jumps if the browser
        is temporarily busy.
    */

    dt =
        Math.min(
            dt,
            .05
        );

    updatePlayer(dt);

    updateEntity(dt);

    updateLights(dt);

    updateMessage(dt);

    updateTapeTime(dt);

    processOverlayVideo();

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize(){

    try{

        console.log(
            "BACKROOMS INITIALIZING..."
        );

        console.log(
            "THREE MODULE:",
            THREE.REVISION
        );

        console.log(
            "Loading textures..."
        );

        await loadTextures();

        applyTextures();

        console.log(
            "Loading map..."
        );

        await loadMap();

        console.log(
            "MAP:",
            mapWidth,
            "x",
            mapHeight
        );

        console.log(
            "Building world..."
        );

        buildWorld();

        console.log(
            "Building lighting..."
        );

        buildLights();

        document.getElementById(
            "difficultyHud"
        ).textContent =
            difficulty.toUpperCase();

        console.log(
            "BACKROOMS READY."
        );

    }catch(error){

        console.error(
            error
        );

        const errorBox =
            document.getElementById(
                "error"
            );

        errorBox.style.display="block";

        errorBox.textContent =
            "BACKROOMS INITIALIZATION ERROR\n\n"+
            (
                error &&
                error.stack
                ?
                error.stack
                :
                String(error)
            );

    }

}

initialize();

</script>
