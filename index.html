<script src="./three.min.js"></script>

<script>

if(typeof THREE === "undefined"){

    const error =
        document.getElementById("error");

    error.style.display="block";

    error.textContent =
        "three.min.js could not be loaded.";

    throw new Error("Three.js missing");
}

/* =========================================================
   FILE PATHS
========================================================= */

const BASE =
    new URL("./",document.baseURI);

const TEXTURE_PATHS = {

    floor:new URL(
        "textures/floor.png",
        BASE
    ).href,

    wall:new URL(
        "textures/wall.png",
        BASE
    ).href,

    ceiling:new URL(
        "textures/ceiling.png",
        BASE
    ).href
};

const ENTITY_URL =
    new URL(
        "entity.png",
        BASE
    ).href;

const AUDIO_URL =
    new URL(
        "entity.mp3",
        BASE
    ).href;

/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x70683a);

scene.fog =
    new THREE.FogExp2(
        0x70683a,
        .009
    );

/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        76,
        innerWidth/innerHeight,
        .03,
        260
    );

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.75)
);

if("outputColorSpace" in renderer)
    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

if("toneMapping" in renderer){

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        .82;
}

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x6f673b,
        .35
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xd7cb78,
        0x17150f,
        .55
    )
);

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const EYE_HEIGHT=1.18;
const PLAYER_HEIGHT=1.55;
const PLAYER_RADIUS=.28;

const WALK_SPEED=3.8;
const SPRINT_SPEED=6.5;

const GRAVITY=20;
const JUMP_SPEED=6.3;

let yaw=0;
let pitch=0;
let velocityY=0;
let grounded=true;

/* =========================================================
   GAME STATE
========================================================= */

let running=false;
let paused=false;
let dead=false;
let fallingIntoLevel=false;

let fallTimer=0;

const FALL_DURATION=2.25;

let difficulty="normal";

let entity=null;

let worldObjects=[];
let walls=[];
let deathHoles=[];
let ladders=[];

/* =========================================================
   NEW EXIT SYSTEM
========================================================= */

let exitObject=null;
let exitLight=null;

let exitX=0;
let exitZ=0;

let exitSpawnIndex=0;

/*
    Possible locations are deliberately spread around
    the Backrooms instead of simply choosing anywhere.

    This keeps the exit from spawning inside a wall.
*/

const EXIT_LOCATIONS=[

    [-72,66],
    [-55,70],
    [-35,58],
    [-10,67],
    [15,62],
    [39,69],
    [62,57],

    [-70,35],
    [-45,40],
    [-18,31],
    [8,43],
    [34,36],
    [61,31],

    [-70,5],
    [-48,-5],
    [-20,8],
    [8,-5],
    [36,5],
    [65,0],

    [-68,-25],
    [-44,-30],
    [-15,-34],
    [14,-27],
    [40,-34],
    [66,-27],

    [-66,-55],
    [-38,-58],
    [-10,-51],
    [18,-57],
    [45,-52],
    [69,-60]

];

/* =========================================================
   TEXTURES
========================================================= */

let floorTexture=null;
let wallTexture=null;
let ceilingTexture=null;

const textureLoader =
    new THREE.TextureLoader();

function prepareTexture(texture){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            8
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(url,name){

    return new Promise(resolve=>{

        textureLoader.load(

            url,

            texture=>{
                console.log(
                    "Loaded:",
                    name
                );

                resolve(
                    prepareTexture(texture)
                );
            },

            undefined,

            error=>{
                console.error(
                    "Failed:",
                    name,
                    error
                );

                resolve(null);
            }

        );

    });

}

async function loadEnvironmentTextures(){

    const status =
        document.getElementById(
            "textureStatus"
        );

    status.textContent =
        "Loading floor.png...";

    floorTexture =
        await loadTexture(
            TEXTURE_PATHS.floor,
            "floor.png"
        );

    status.textContent =
        "Loading wall.png...";

    wallTexture =
        await loadTexture(
            TEXTURE_PATHS.wall,
            "wall.png"
        );

    status.textContent =
        "Loading ceiling.png...";

    ceilingTexture =
        await loadTexture(
            TEXTURE_PATHS.ceiling,
            "ceiling.png"
        );

    if(
        !floorTexture ||
        !wallTexture ||
        !ceilingTexture
    ){

        status.textContent =
            "WARNING: texture failed to load.";

        status.style.color="#ff7777";

    }else{

        status.textContent =
            "TEXTURES READY";

    }
}

/* =========================================================
   MATERIAL
========================================================= */

function makeMaterial(texture){

    return new THREE.MeshStandardMaterial({

        map:texture,

        side:THREE.DoubleSide,

        roughness:1,

        metalness:0,

        fog:true

    });
}

/* =========================================================
   WORLD
========================================================= */

function addObject(object){

    scene.add(object);

    worldObjects.push(object);

    return object;
}

function clearWorld(){

    for(
        const object
        of worldObjects
    ){

        scene.remove(object);

        if(object.geometry)
            object.geometry.dispose();

        if(object.material){

            if(Array.isArray(object.material)){

                object.material.forEach(
                    material=>{
                        material.dispose();
                    }
                );

            }else{

                object.material.dispose();

            }
        }
    }

    worldObjects=[];
    walls=[];
    deathHoles=[];
    ladders=[];

    entity=null;
    exitObject=null;
    exitLight=null;
}

/* =========================================================
   FLOOR
========================================================= */

function createFloorMaterial(){

    if(!floorTexture){

        return new THREE.MeshStandardMaterial({
            color:0x9a8e4c,
            roughness:1
        });

    }

    const texture =
        floorTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        60,
        53.33
    );

    texture.needsUpdate=true;

    return makeMaterial(texture);
}

function addFloor(){

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            createFloorMaterial()

        );

    floor.rotation.x=
        -Math.PI/2;

    floor.position.set(
        0,0,0
    );

    addObject(floor);
}

/* =========================================================
   CEILING
========================================================= */

const CEILING_Y=3.1;

function createCeilingMaterial(){

    if(!ceilingTexture){

        return new THREE.MeshStandardMaterial({
            color:0xd7d1b7,
            roughness:1
        });

    }

    const texture =
        ceilingTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        60,
        53.33
    );

    texture.needsUpdate=true;

    return makeMaterial(texture);
}

function addCeiling(){

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            createCeilingMaterial()

        );

    ceiling.rotation.x=
        Math.PI/2;

    ceiling.position.set(
        0,
        CEILING_Y,
        0
    );

    addObject(ceiling);
}

/* =========================================================
   WALL TEXTURE
========================================================= */

function createWallMaterial(width,height){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({

            color:0xc8bb48,
            roughness:1,
            side:THREE.DoubleSide

        });

    }

    const texture =
        wallTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    const aspect =
        texture.image.width /
        texture.image.height;

    const tileWidth =
        height*aspect;

    texture.repeat.set(
        width/tileWidth,
        1
    );

    texture.needsUpdate=true;

    return makeMaterial(texture);
}

function addWallPlane(
    width,
    height,
    x,
    y,
    z,
    rotationY
){

    const wall =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                width,
                height
            )

        );

    wall.position.set(
        x,y,z
    );

    wall.rotation.y=
        rotationY;

    addObject(wall);

    return wall;
}

/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
){

    addWallPlane(
        width,
        height,
        x,
        y,
        z-depth/2,
        0
    );

    addWallPlane(
        width,
        height,
        x,
        y,
        z+depth/2,
        Math.PI
    );

    addWallPlane(
        depth,
        height,
        x-width/2,
        y,
        z,
        Math.PI/2
    );

    addWallPlane(
        depth,
        height,
        x+width/2,
        y,
        z,
        -Math.PI/2
    );

    walls.push({

        minX:x-width/2,
        maxX:x+width/2,

        minY:y-height/2,
        maxY:y+height/2,

        minZ:z-depth/2,
        maxZ:z+depth/2

    });
}

/* =========================================================
   LIGHTS
========================================================= */

function addLight(
    x,
    z,
    intensity=10.5
){

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2,
                .055,
                2
            ),

            new THREE.MeshBasicMaterial({
                color:0xfff3bd,
                side:THREE.DoubleSide
            })

        );

    fixture.position.set(
        x,
        3.025,
        z
    );

    addObject(fixture);

    const light =
        new THREE.PointLight(
            0xffe89a,
            intensity,
            15,
            1.7
        );

    light.position.set(
        x,
        2.9,
        z
    );

    scene.add(light);
}

/* =========================================================
   GRID OF HOLES
========================================================= */

function createDeathHole(
    x,
    z,
    width,
    depth
){

    deathHoles.push({
        x,
        z,
        width,
        depth
    });

    /*
        Dark interior makes the holes visibly deep.
    */

    const pit =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                10,
                depth
            ),

            new THREE.MeshBasicMaterial({
                color:0x020201,
                side:THREE.DoubleSide
            })

        );

    pit.position.set(
        x,
        -5,
        z
    );

    addObject(pit);
}

/*
    Creates a room containing many individual holes.

    The player can walk across the safe tiles,
    but stepping onto one of the holes makes them fall.
*/

function createHoleGrid(
    centerX,
    centerZ
){

    const rows=5;
    const columns=5;

    const spacing=2.7;
    const holeSize=2.05;

    /*
        Some tiles remain safe so the player has
        to navigate through the room.
    */

    const safeTiles = new Set([

        "0,0",
        "1,0",
        "1,1",
        "2,1",
        "2,2",
        "3,2",
        "3,3",
        "4,3",
        "4,4",

        "0,4",
        "1,4",

        "4,0",
        "3,0"

    ]);

    for(
        let row=0;
        row<rows;
        row++
    ){

        for(
            let col=0;
            col<columns;
            col++
        ){

            const key =
                `${row},${col}`;

            if(
                safeTiles.has(key)
            ){

                continue;

            }

            const x =
                centerX +
                (col-2)*spacing;

            const z =
                centerZ +
                (row-2)*spacing;

            createDeathHole(
                x,
                z,
                holeSize,
                holeSize
            );

        }

    }

    /*
        Put a border around the room.
    */

    const H=3.1;

    addWall(
        18,
        H,
        1,
        centerX,
        H/2,
        centerZ-9
    );

    addWall(
        18,
        H,
        1,
        centerX,
        H/2,
        centerZ+9
    );

    addWall(
        1,
        H,
        18,
        centerX-9,
        H/2,
        centerZ
    );

    addWall(
        1,
        H,
        18,
        centerX+9,
        H/2,
        centerZ
    );
}

/* =========================================================
   LADDER
========================================================= */

function addLadder(
    x,
    y,
    z,
    rotationY=0
){

    const group =
        new THREE.Group();

    group.position.set(
        x,y,z
    );

    group.rotation.y=
        rotationY;

    const material =
        new THREE.MeshStandardMaterial({

            color:0x6a624b,
            roughness:.9,
            metalness:.15

        });

    const railGeometry =
        new THREE.BoxGeometry(
            .09,
            2.7,
            .09
        );

    const left =
        new THREE.Mesh(
            railGeometry,
            material
        );

    left.position.x=-.42;

    group.add(left);

    const right =
        new THREE.Mesh(
            railGeometry,
            material
        );

    right.position.x=.42;

    group.add(right);

    for(
        let i=0;
        i<8;
        i++
    ){

        const rung =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .92,
                    .08,
                    .08
                ),

                material

            );

        rung.position.set(
            0,
            -1.1+i*.31,

        );

        group.add(rung);
    }

    addObject(group);

    ladders.push(group);
}

/* =========================================================
   PLAYER COLLISION
========================================================= */

function playerCollides(x,z){

    const bottom=
        player.position.y;

    const top=
        bottom+PLAYER_HEIGHT;

    for(
        const wall
        of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        )
            continue;

        const closestX=
            Math.max(
                wall.minX,
                Math.min(x,wall.maxX)
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(z,wall.maxZ)
            );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+dz*dz <
            PLAYER_RADIUS*PLAYER_RADIUS
        )
            return true;
    }

    return false;
}

/* =========================================================
   HOLE CHECK
========================================================= */

function isInsideDeathHole(x,z){

    for(
        const hole
        of deathHoles
    ){

        if(

            x >
            hole.x-hole.width/2 &&

            x <
            hole.x+hole.width/2 &&

            z >
            hole.z-hole.depth/2 &&

            z <
            hole.z+hole.depth/2

        ){

            return true;
        }
    }

    return false;
}

let hasLastKnownPosition=false;

/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(x,z){

    for(
        const wall
        of walls
    ){

        const closestX=
            Math.max(
                wall.minX,
                Math.min(x,wall.maxX)
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(z,wall.maxZ)
            );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+dz*dz <
            ENTITY_RADIUS*ENTITY_RADIUS
        )
            return true;
    }

    return false;
}

/* =========================================================
   LINE OF SIGHT
========================================================= */

function lineBlocked(
    x1,z1,
    x2,z2
){

    const dx=x2-x1;
    const dz=z2-z1;

    const distance=
        Math.hypot(dx,dz);

    const steps=
        Math.ceil(distance/.35);

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        const x=x1+dx*t;
        const z=z1+dz*t;

        if(
            entityHitsWall(x,z)
        )
            return true;
    }

    return false;
}

/* =========================================================
   ENTITY AI
========================================================= */

function chooseEntityDirection(){

    if(!entity)
        return null;

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(dx,dz);

    const visible=
        !lineBlocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );

    if(visible){

        lastKnownPlayer.set(
            player.position.x,
            player.position.z
        );

        hasLastKnownPosition=true;
        lastSeenTimer=0;

        return{
            x:dx/Math.max(distance,.001),
            z:dz/Math.max(distance,.001)
        };
    }

    if(
        hasLastKnownPosition &&
        lastSeenTimer<2.8
    ){

        const lx=
            lastKnownPlayer.x-
            entity.position.x;

        const lz=
            lastKnownPlayer.y-
            entity.position.z;

        const length=
            Math.hypot(lx,lz);

        if(length>.1){

            return{
                x:lx/length,
                z:lz/length
            };
        }
    }

    wanderTimer-=.016;

    if(wanderTimer<=0){

        wanderTimer=
            1+Math.random()*3;

        wanderAngle=
            Math.random()*
            Math.PI*2;
    }

    return{
        x:Math.cos(wanderAngle),
        z:Math.sin(wanderAngle)
    };
}

const DIFFICULTIES={

    easy:{
        name:"EASY",
        speed:1.5
    },

    normal:{
        name:"NORMAL",
        speed:5.5
    },

    hard:{
        name:"HARD",
        speed:7
    },

    impossible:{
        name:"IMPOSSIBLE",
        speed:9
    }
};

function normalizeAngle(angle){

    while(angle>Math.PI)
        angle-=Math.PI*2;

    while(angle<-Math.PI)
        angle+=Math.PI*2;

    return angle;
}

function updateEntity(dt){

    if(
        !entity ||
        dead ||
        fallingIntoLevel
    )
        return;

    const settings=
        DIFFICULTIES[difficulty];

    lastSeenTimer+=dt;

    const direction=
        chooseEntityDirection();

    if(direction){

        const targetAngle=
            Math.atan2(
                direction.z,
                direction.x
            );

        const currentAngle=
            Math.atan2(
                entityDirection.y,
                entityDirection.x
            );

        let difference=
            normalizeAngle(
                targetAngle-currentAngle
            );

        const maxTurn=
            2.2*dt;

        difference=
            Math.max(
                -maxTurn,
                Math.min(
                    maxTurn,
                    difference
                )
            );

        const angle=
            currentAngle+difference;

        entityDirection.x=
            Math.cos(angle);

        entityDirection.y=
            Math.sin(angle);

        entityVelocity.x=
            THREE.MathUtils.lerp(
                entityVelocity.x,
                entityDirection.x*
                settings.speed,
                Math.min(1,dt*2.6)
            );

        entityVelocity.y=
            THREE.MathUtils.lerp(
                entityVelocity.y,
                entityDirection.y*
                settings.speed,
                Math.min(1,dt*2.6)
            );
    }

    const nx=
        entity.position.x+
        entityVelocity.x*dt;

    const nz=
        entity.position.z+
        entityVelocity.y*dt;

    if(
        !entityHitsWall(
            nx,
            entity.position.z
        )
    )
        entity.position.x=nx;
    else
        entityVelocity.x*=.15;

    if(
        !entityHitsWall(
            entity.position.x,
            nz
        )
    )
        entity.position.z=nz;
    else
        entityVelocity.y*=.15;

    entity.rotation.y=
        Math.atan2(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    const distance=
        Math.hypot(
            entity.position.x-
            player.position.x,
            entity.position.z-
            player.position.z
        );

    if(distance<1.15)
        killPlayer();
}

const keys={

    d:false,

window.addEventListener(

                break;

            case "KeyA":
                keys.a=true;
                break;

            case "KeyS":
                keys.s=true;
                break;

            case "KeyD":
                keys.d=true;
                break;

            case "ShiftLeft":
            case "ShiftRight":
                keys.shift=true;
                break;

            case "Space":

                if(!event.repeat)
                    jumpPressed=true;

                break;

            case "KeyP":

                if(
                    running &&
                    !dead &&
                    !fallingIntoLevel
                )
                    togglePause();

                break;

            case "Escape":

                if(
                    running &&
                    !dead &&
                    !fallingIntoLevel
                )
                    togglePause();

                break;
        }
    }
);

window.addEventListener(
    "keyup",

        switch(event.code){

            case "KeyW":

                break;

            case "KeyA":
                keys.a=false;
                break;

            case "KeyS":
                keys.s=false;
                break;

            case "KeyD":
                keys.d=false;
                break;

            case "ShiftLeft":
            case "ShiftRight":

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        )
            return;

        if(
            document.pointerLockElement !==
            document.body
        )
            return;

        const sensitivity=.0022;

        yaw-=
            event.movementX*
            sensitivity;

        pitch-=
            event.movementY*
            sensitivity;

        const limit=
            Math.PI/2-.05;

        pitch=
            Math.max(
                -limit,
                Math.min(limit,pitch)
            );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;
    }
);

/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt){

    if(fallingIntoLevel){

        updateFallSequence(dt);

        return;
    }

    const direction=
        new THREE.Vector3();

    if(keys.w) direction.z-=1;
    if(keys.s) direction.z+=1;
    if(keys.a) direction.x-=1;
    if(keys.d) direction.x+=1;

    if(direction.lengthSq()>0){

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );

        const speed=
            keys.shift?
            SPRINT_SPEED:
            WALK_SPEED;

        const amount=
            speed*dt;

        const nx=
            player.position.x+
            direction.x*amount;

        if(
            !playerCollides(
                nx,
                player.position.z
            )
        )
            player.position.x=nx;

        const nz=
            player.position.z+
            direction.z*amount;

        if(
            !playerCollides(
                player.position.x,
                nz
            )
        )
            player.position.z=nz;
    }

    if(
        jumpPressed &&
        grounded
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;
    }

    jumpPressed=false;

    velocityY-=
        GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    /*
        Hole detection.
    */

    if(
        isInsideDeathHole(
            player.position.x,
            player.position.z
        )
    ){

        grounded=false;

        if(
            player.position.y<-2.5
        )
            killPlayer();

        return;
    }

    /*
        Exit detection.
    */

    checkExit();

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;
    }
}

/* =========================================================
   FALLING OPENING
========================================================= */

function updateFallSequence(dt){

    fallTimer+=dt;

    const raw=
        Math.min(
            fallTimer/FALL_DURATION,
            1
        );

    const eased=
        raw*raw*(3-2*raw);

    player.position.y=
        THREE.MathUtils.lerp(
            18,
            0,
            eased
        );

    const shake=
        Math.sin(
            fallTimer*31
        )*
        .025*
        (1-raw);

    camera.position.x=shake;

    camera.position.y=
        EYE_HEIGHT+shake;

    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.28,
            0,
            Math.min(raw*1.3,1)
        );

    player.rotation.y=
        yaw+
        Math.sin(
            fallTimer*3.5
        )*
        .025*
        (1-raw);

    const fade=
        document.getElementById(
            "fallFade"
        );

    if(raw>.12){

        fade.style.opacity=
            String(
                1-
                Math.min(
                    1,
                    (raw-.12)/.55
                )
            );
    }

    if(raw>=1){

        fallingIntoLevel=false;

        player.position.y=0;
        velocityY=0;
        grounded=true;

        camera.position.x=0;
        camera.position.y=EYE_HEIGHT;
        camera.rotation.x=0;

        player.rotation.y=yaw;

        document.body.requestPointerLock();
    }
}

/* =========================================================
   CAMCORDER CAMERA
========================================================= */

let cameraTime=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;

    cameraTime+=dt;

    const moving=
        keys.w||
        keys.a||
        keys.s||
        keys.d;

    /*
        Tiny handheld movement.
    */

    const movementAmount=
        moving?.004:.0012;

    camera.position.x=
        Math.sin(cameraTime*3)*
        movementAmount;

    camera.position.y=
        EYE_HEIGHT+
        Math.sin(cameraTime*3.7)*
        movementAmount;

    /*
        Tiny camcorder roll.
    */

    camera.rotation.z=
        Math.sin(cameraTime*1.25)*
        .0015;

    /*
        Occasional handheld bump.
    */

    if(
        Math.random()<.002
    ){

        camera.rotation.z+=
            (Math.random()-.5)*
            .012;

        camera.position.x+=
            (Math.random()-.5)*
            .018;
    }

    /*
        Simulated autofocus/exposure breathing.
    */

    const pulse=
        Math.sin(cameraTime*.73)*
        .008;

    renderer.toneMappingExposure=
        .82+
        pulse;
}

/* =========================================================
   AUDIO
========================================================= */

const entityAudio=
    new Audio(AUDIO_URL);

entityAudio.loop=true;
entityAudio.volume=0;

function updateEntityAudio(){

    if(
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ){

        entityAudio.volume=0;

        if(!entityAudio.paused)
            entityAudio.pause();

        return;
    }

    const distance=
        Math.hypot(
            entity.position.x-
            player.position.x,
            entity.position.z-
            player.position.z
        );

    const MAX_DISTANCE=30;

    if(distance>=MAX_DISTANCE){

        entityAudio.volume=0;

        if(!entityAudio.paused)
            entityAudio.pause();

        return;
    }

    let volume=
        1-distance/MAX_DISTANCE;

    volume=
        Math.pow(volume,1.8)*.85;

    if(
        lineBlocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    )
        volume*=.18;

    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .85
        );

    if(
        entityAudio.paused &&
        volume>.01
    ){

        entityAudio
            .play()
            .catch(()=>{});
    }
}

/* =========================================================
   CAMCORDER TIMER
========================================================= */

let recordingTime=0;

function updateCamcorder(dt){

    if(
        !running ||
        paused
    )
        return;

    recordingTime+=dt;

    const total=
        Math.floor(recordingTime);

    const hours=
        Math.floor(total/3600);

    const minutes=
        Math.floor(
            (total%3600)/60
        );

    const seconds=
        total%60;

    const format=
        n=>String(n).padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        `${format(hours)}:${format(minutes)}:${format(seconds)}`;
}

/* =========================================================
   START
========================================================= */

async function startGame(){

    if(
        !floorTexture||
        !wallTexture||
        !ceilingTexture
    )
        await loadEnvironmentTextures();

    buildLevel();

    await createEntity();

    running=true;
    paused=false;
    dead=false;
    fallingIntoLevel=true;

    fallTimer=0;

    recordingTime=0;

    player.position.set(
        -70,
        18,
        -65
    );

    yaw=0;
    pitch=-.28;

    velocityY=0;
    grounded=false;

    player.rotation.y=yaw;
    camera.rotation.x=pitch;

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    document.querySelector(
        ".deathTitle"
    ).textContent="YOU DIED";

    document.querySelector(
        ".deathTitle"
    ).style.color="#b40000";

    document.getElementById(
        "deathText"
    ).textContent=
        "THE BACKROOMS GOT YOU";

    document.getElementById(
        "retryBtn"
    ).textContent="RETRY";

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "fallFade"
    ).style.opacity="1";

    document.body.requestPointerLock();
}

/* =========================================================
   DEATH
========================================================= */

function killPlayer(){

    if(
        dead||
        !running
    )
        return;

    dead=true;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathText"
    ).textContent=
        "THE BACKROOMS GOT YOU";

    document.querySelector(
        ".deathTitle"
    ).textContent="YOU DIED";

    document.querySelector(
        ".deathTitle"
    ).style.color="#b40000";

    document.getElementById(
        "death"
    ).style.display="flex";
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !running||
        dead||
        fallingIntoLevel
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused?"flex":"none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        document.body.requestPointerLock();
    }
}

/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="flex";
}

/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(value){

    difficulty=value;

    document
        .querySelectorAll(
            ".difficulty button"
        )
        .forEach(button=>{
            button.classList.remove(
                "selected"
            );
        });

    document.getElementById(
        value+"Btn"
    ).classList.add("selected");

    document.getElementById(
        "difficultyHud"
    ).textContent=
        DIFFICULTIES[value].name;
}

document.getElementById(
    "easyBtn"
).onclick=
    ()=>setDifficulty("easy");

document.getElementById(
    "normalBtn"
).onclick=
    ()=>setDifficulty("normal");

document.getElementById(
    "hardBtn"
).onclick=
    ()=>setDifficulty("hard");

document.getElementById(
    "impossibleBtn"
).onclick=
    ()=>setDifficulty("impossible");

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "resumeBtn"
).onclick=
    ()=>togglePause();

document.getElementById(
    "restartBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "menuBtn"
).onclick=
    ()=>returnToMenu();

document.getElementById(
    "retryBtn"
).onclick=
    ()=>startGame();

document.getElementById(
    "deathMenuBtn"
).onclick=
    ()=>returnToMenu();

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement !==
            document.body
        )
            document.body.requestPointerLock();
    }
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =========================================================
   INITIAL LOAD
========================================================= */

loadEnvironmentTextures();

/* =========================================================
   GAME LOOP
========================================================= */

const clock=
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(dt);
        updateEntity(dt);
        updateEntityAudio();
        updateCamera(dt);
        updateCamcorder(dt);

    }else{

        updateEntityAudio();
    }

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>
