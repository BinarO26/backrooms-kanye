<script src="./three.min.js"></script>

<script>
"use strict";

/* =========================================================
   THREE CHECK
========================================================= */

if(!window.THREE){

    const error=document.getElementById("error");

    error.style.display="block";

    error.textContent=
        "THREE.JS FAILED TO LOAD.\n\n"+
        "GitHub Pages is looking for:\n\n"+
        "./three.min.js\n\n"+
        "Make sure three.min.js is in the SAME folder as index.html.\n\n"+
        "Expected structure:\n"+
        "index.html\n"+
        "three.min.js\n"+
        "textures/";

    throw new Error("Local three.min.js missing");
}

/* =========================================================
   SCENE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x77704a);

scene.fog=new THREE.FogExp2(
    0x77704a,
    .007
);

/* =========================================================
   CAMERA
========================================================= */

const camera=new THREE.PerspectiveCamera(
    78,
    innerWidth/innerHeight,
    .025,
    500
);

camera.rotation.order="YXZ";

/* =========================================================
   RENDERER
========================================================= */

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio||1,
        1.35
    )
);

if("outputColorSpace" in renderer){
    renderer.outputColorSpace=THREE.SRGBColorSpace;
}

renderer.toneMapping=THREE.NoToneMapping;
renderer.toneMappingExposure=1;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        .22
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xffefad,
        0x17150d,
        .28
    )
);

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader=new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;

function prepareTexture(texture){

    texture.colorSpace=THREE.SRGBColorSpace;

    texture.wrapS=THREE.RepeatWrapping;
    texture.wrapT=THREE.RepeatWrapping;

    texture.magFilter=THREE.LinearFilter;
    texture.minFilter=THREE.LinearMipmapLinearFilter;

    texture.anisotropy=
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            8
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(path){

    return new Promise(resolve=>{

        textureLoader.load(

            path,

            texture=>{
                console.log("Loaded:",path);
                resolve(
                    prepareTexture(texture)
                );
            },

            undefined,

            error=>{
                console.warn(
                    "Texture failed:",
                    path,
                    error
                );

                resolve(null);
            }

        );
    });
}

async function loadTextures(){

    wallTexture=
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture=
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture=
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing=[];

    if(!wallTexture)
        missing.push("./textures/wall.png");

    if(!floorTexture)
        missing.push("./textures/floor.png");

    if(!ceilingTexture)
        missing.push("./textures/ceiling.png");

    if(missing.length){

        const error=
            document.getElementById("error");

        error.style.display="block";

        error.textContent=
            "TEXTURE ERROR\n\n"+
            missing.join("\n")+
            "\n\nCheck that the names and capitalization "+
            "exactly match your files.";
    }
}

/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Object3D();

scene.add(player);
player.add(camera);

const EYE_HEIGHT=1.18;
const PLAYER_HEIGHT=1.55;
const PLAYER_RADIUS=.28;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=false;

let running=false;
let paused=false;
let dead=false;

let fallingIntoLevel=false;
let fallTimer=0;

const FALL_DURATION=2.25;

let difficulty="normal";

/* =========================================================
   WORLD
========================================================= */

let worldObjects=[];
let wallColliders=[];
let deathHoles=[];
let lights=[];

function addWorldObject(object){

    scene.add(object);
    worldObjects.push(object);

    return object;
}

function disposeMaterial(material){

    if(!material)return;

    if(Array.isArray(material)){
        material.forEach(
            disposeMaterial
        );
        return;
    }

    if(material.map)
        material.map.dispose();

    material.dispose();
}

function clearWorld(){

    for(const object of worldObjects){

        scene.remove(object);

        object.traverse?.(
            child=>{

                if(child.geometry)
                    child.geometry.dispose();

                if(child.material)
                    disposeMaterial(
                        child.material
                    );
            }
        );
    }

    worldObjects=[];
    wallColliders=[];
    deathHoles=[];
    lights=[];

    if(exitLight){
        scene.remove(exitLight);
        exitLight=null;
    }

    exitObject=null;
    entity=null;
}

/* =========================================================
   WALL MATERIAL
   NORMAL LIGHTING — NOT UNSHADED
========================================================= */

function makeWallMaterial(
    width,
    height
){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({
            color:0xb3a94e,
            roughness:.92,
            metalness:0
        });
    }

    const texture=wallTexture.clone();

    texture.wrapS=THREE.RepeatWrapping;
    texture.wrapT=THREE.ClampToEdgeWrapping;

    const iw=texture.image?.width||1;
    const ih=texture.image?.height||1;

    const aspect=iw/ih;

    const naturalWidth=height*aspect;

    texture.repeat.set(
        Math.max(
            width/naturalWidth,
            .001
        ),
        1
    );

    texture.needsUpdate=true;

    return new THREE.MeshStandardMaterial({

        map:texture,

        color:0xffffff,

        roughness:.9,
        metalness:0,

        side:THREE.DoubleSide
    });
}

/* =========================================================
   WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth=.32
){

    const height=3.1;

    wallColliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minZ:z-depth/2,
        maxZ:z+depth/2,

        minY:0,
        maxY:height
    });

    const group=new THREE.Group();

    const front=new THREE.Mesh(
        new THREE.PlaneGeometry(
            width,
            height
        ),
        makeWallMaterial(
            width,
            height
        )
    );

    front.position.set(
        0,
        height/2,
        depth/2
    );

    group.add(front);

    const back=new THREE.Mesh(
        new THREE.PlaneGeometry(
            width,
            height
        ),
        makeWallMaterial(
            width,
            height
        )
    );

    back.rotation.y=Math.PI;

    back.position.set(
        0,
        height/2,
        -depth/2
    );

    group.add(back);

    const left=new THREE.Mesh(
        new THREE.PlaneGeometry(
            depth,
            height
        ),
        makeWallMaterial(
            depth,
            height
        )
    );

    left.rotation.y=Math.PI/2;

    left.position.set(
        -width/2,
        height/2,
        0
    );

    group.add(left);

    const right=new THREE.Mesh(
        new THREE.PlaneGeometry(
            depth,
            height
        ),
        makeWallMaterial(
            depth,
            height
        )
    );

    right.rotation.y=-Math.PI/2;

    right.position.set(
        width/2,
        height/2,
        0
    );

    group.add(right);

    group.position.set(
        x,
        0,
        z
    );

    addWorldObject(group);
}

/* =========================================================
   FLOOR
   NORMAL LIGHTING
========================================================= */

function createFloor(){

    let material;

    if(floorTexture){

        const texture=floorTexture.clone();

        texture.wrapS=THREE.RepeatWrapping;
        texture.wrapT=THREE.RepeatWrapping;

        texture.repeat.set(
            150,
            135
        );

        texture.needsUpdate=true;

        material=new THREE.MeshStandardMaterial({

            map:texture,

            color:0xffffff,

            roughness:1,
            metalness:0
        });

    }else{

        material=new THREE.MeshStandardMaterial({

            color:0x968b43,

            roughness:1,
            metalness:0
        });
    }

    const floor=new THREE.Mesh(
        new THREE.PlaneGeometry(
            300,
            270
        ),
        material
    );

    floor.rotation.x=-Math.PI/2;

    addWorldObject(floor);
}

/* =========================================================
   CEILING
========================================================= */

function createCeiling(){

    let material;

    if(ceilingTexture){

        const texture=ceilingTexture.clone();

        texture.wrapS=THREE.RepeatWrapping;
        texture.wrapT=THREE.RepeatWrapping;

        texture.repeat.set(
            150,
            135
        );

        texture.needsUpdate=true;

        material=new THREE.MeshStandardMaterial({

            map:texture,

            color:0xffffff,

            roughness:.95,
            metalness:0,

            side:THREE.DoubleSide
        });

    }else{

        material=new THREE.MeshStandardMaterial({

            color:0x858047,

            roughness:.95,
            metalness:0,

            side:THREE.DoubleSide
        });
    }

    const ceiling=new THREE.Mesh(
        new THREE.PlaneGeometry(
            300,
            270
        ),
        material
    );

    ceiling.rotation.x=Math.PI/2;
    ceiling.position.y=3.1;

    addWorldObject(ceiling);
}

/* =========================================================
   LEVEL 0 FLOOR PLAN
   MORE IRREGULAR / BACKROOMS-LIKE
========================================================= */

function buildFloorPlan(){

    /*
       Long outer walls and irregular rooms.
    */

    createWall(-105,-83,31);
    createWall(-73,-91,25);
    createWall(-45,-86,20);
    createWall(-20,-94,30);

    createWall(12,-91,22);
    createWall(39,-86,27);
    createWall(69,-92,31);
    createWall(101,-82,25);

    createWall(-111,-62,20);
    createWall(-90,-68,15);
    createWall(-70,-61,22);
    createWall(-45,-66,17);
    createWall(-25,-59,24);
    createWall(2,-67,18);
    createWall(24,-60,26);
    createWall(53,-67,20);
    createWall(77,-60,28);
    createWall(105,-53,18);

    /*
       Offset middle rooms.
    */

    createWall(-109,-38,17);
    createWall(-88,-45,24);
    createWall(-61,-38,16);
    createWall(-40,-47,22);
    createWall(-15,-38,28);
    createWall(15,-45,18);
    createWall(37,-38,24);
    createWall(64,-45,19);
    createWall(87,-35,27);

    /*
       Central large maze.

/* =========================================================
   HOLE ROOM
========================================================= */

function createHoleRoom(){

    const startX=-57;
    const startZ=53;

    const columns=18;
    const rows=8;
    const spacing=3.5;

    for(let z=0;z<rows;z++){

        for(let x=0;x<columns;x++){

            const px=
                startX+x*spacing;

            const pz=
                startZ+z*spacing;

            if((x+z)%5===0)
                continue;

            const hole=new THREE.Mesh(

                new THREE.PlaneGeometry(
                    2.7,
                    2.7
                ),

                new THREE.MeshBasicMaterial({
                    color:0x020202,
                    side:THREE.DoubleSide
                })
            );

            hole.rotation.x=-Math.PI/2;

            hole.position.set(
                px,
                .006,
                pz
            );

            addWorldObject(hole);

            deathHoles.push({
                x:px,
                z:pz,
                radius:1.28
            });
        }
    }
}

function addLight(
    x,
    z,
    intensity=4,
    flicker=false
){

    /*
       Ceiling fixture stays visible.
       Flickering ONLY changes light intensity.
    */

    const fixture=new THREE.Mesh(

        new THREE.BoxGeometry(
            1.15,
            .055,
            1.15
        ),

        new THREE.MeshStandardMaterial({

            color:0xfff0b7,

            emissive:0xffe39a,
            emissiveIntensity:.35,

            roughness:.6,
            metalness:0
        })
    );

    fixture.position.set(
        x,
        3.045,
        z
    );

    addWorldObject(fixture);

    const light=new THREE.PointLight(
        0xffe8a5,
        intensity,
        12,
        1.7
    );

    light.position.set(
        x,
        2.65,
        z
    );

    scene.add(light);

    lights.push({

        light,
        fixture,
        flicker,

        timer:
            Math.random()*2,

        base:intensity,

        current:intensity
    });
}

function buildLighting(){

    const positions=[];

    for(
        let x=-96;
        x<=96;
        x+=12
    ){

        for(
            let z=-84;
            z<=88;
            z+=11
        ){

            if(Math.random()<.16)
                continue;

            positions.push([

                x+
                (Math.random()-.5)*3,

                z+
                (Math.random()-.5)*3
            ]);
        }
    }

    positions.forEach(p=>{

        const roll=Math.random();

        addLight(

            p[0],
            p[1],

            roll<.28
                ?2.1
                :4+
                 Math.random()*1.7,

            roll<.42
        );
    });

    addLight(-18,-64,5.4);
    addLight(-7,-64,5.2);
    addLight(27,-9,5.2);
    addLight(6,19,5.3);
    addLight(31,59,5.4);

    addLight(-55,57,1.8,true);
    addLight(-32,67,2,true);
    addLight(-15,57,1.7,true);
}

/*
   IMPORTANT:
   Fixture NEVER turns off.
   Only brightness changes.
*/

function updateLights(dt){

    for(const item of lights){

        if(!item.flicker)
            continue;

        item.timer-=dt;

        if(item.timer<=0){

            item.timer=
                .05+
                Math.random()*.55;

            const target=
                item.base*
                (
                    .48+
                    Math.random()*.62
                );

            item.current=target;

            item.light.intensity=
                target;

            /*
               Keep fixture visible.
            */

            item.fixture.visible=true;
        }
    }
}

/* =========================================================
   COLLISION
========================================================= */

function collides(x,z){

    const bottom=player.position.y;
    const top=bottom+PLAYER_HEIGHT;

    for(const wall of wallColliders){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){
            continue;
        }

        const closestX=Math.max(
            wall.minX,
            Math.min(x,wall.maxX)
        );

        const closestZ=Math.max(
            wall.minZ,
            Math.min(z,wall.maxZ)
        );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+dz*dz<
            PLAYER_RADIUS*PLAYER_RADIUS
        ){
            return true;
        }
    }

    return false;
}

function entityHitsWall(x,z){

    for(const wall of wallColliders){

        const closestX=Math.max(
            wall.minX,
            Math.min(x,wall.maxX)
        );

        const closestZ=Math.max(
            wall.minZ,
            Math.min(z,wall.maxZ)
        );

        const dx=x-closestX;
        const dz=z-closestZ;

        if(
            dx*dx+dz*dz<
            .43*.43
        ){
            return true;
        }
    }

    return false;
}

function blocked(
    x1,z1,
    x2,z2
){

    const dx=x2-x1;
    const dz=z2-z1;

    const distance=Math.hypot(
        dx,dz
    );

    const steps=Math.ceil(
        distance/.35
    );

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        if(
            entityHitsWall(
                x1+dx*t,
                z1+dz*t
            )
        ){
            return true;
        }
    }

    return false;
}

/* =========================================================
   HOLES
========================================================= */

function playerInHole(){

    for(const hole of deathHoles){

        const dx=
            player.position.x-hole.x;

        const dz=
            player.position.z-hole.z;

        if(
            dx*dx+dz*dz<
            hole.radius*hole.radius
        ){
            return true;
        }
    }

    return false;
}

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){
        return;
    }

    const settings=SETTINGS[difficulty];

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=Math.hypot(
        dx,dz
    );

    lastSeen+=dt;

    const visible=
        distance<
        settings.detection&&
        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );

    let dx2=0;
    let dz2=0;

    if(visible){

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen=0;

        dx2=
            dx/
            Math.max(distance,.001);

        dz2=
            dz/
            Math.max(distance,.001);

    }else if(lastSeen<3.2){

        const lx=
            lastKnown.x-
            entity.position.x;

        const lz=
            lastKnown.y-
            entity.position.z;

        const len=Math.hypot(
            lx,lz
        );

        if(len>.1){

            dx2=lx/len;
            dz2=lz/len;
        }

    }else{

        wanderTimer-=dt;

        if(wanderTimer<=0){

            wanderTimer=
                .5+
                Math.random()*1.8;

            wanderAngle=
                Math.random()*
                Math.PI*2;
        }

        dx2=Math.cos(wanderAngle);
        dz2=Math.sin(wanderAngle);
    }

    const targetAngle=
        Math.atan2(
            dz2,
            dx2
        );

    const currentAngle=
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference=
        targetAngle-
        currentAngle;

    while(difference>Math.PI)
        difference-=Math.PI*2;

    while(difference<-Math.PI)
        difference+=Math.PI*2;

    difference=Math.max(
        -3.4*dt,
        Math.min(
            3.4*dt,
            difference
        )
    );

    const angle=
        currentAngle+
        difference;

    entityDirection.x=
        Math.cos(angle);

    entityDirection.y=
        Math.sin(angle);

    entityVelocity.x=
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x*
            settings.speed,
            Math.min(1,dt*4)
        );

    entityVelocity.y=
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y*
            settings.speed,
            Math.min(1,dt*4)
        );

    /*
       JUKING / WALL AVOIDANCE
    */

    const moveX=
        entityVelocity.x*dt;

    const moveZ=
        entityVelocity.y*dt;

    const nextX=
        entity.position.x+
        moveX;

    const nextZ=
        entity.position.z+
        moveZ;

    if(
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ){

        entity.position.x=nextX;

    }else{

        entityVelocity.x=0;

        wanderAngle+=
            Math.PI/2;

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }

    if(
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ){

        entity.position.z=nextZ;

    }else{

        entityVelocity.y=0;

        wanderAngle+=
            Math.PI/2;

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }

    /*
       Face player.
    */

    entity.rotation.y=
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    const killDistance=
        difficulty==="nightmare"
            ?1.55
            :1.25;

    if(
        distance<
        killDistance
    ){
        killPlayer();
    }
}

/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio(){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){

        entityAudio.volume=0;

        return;
    }

    const distance=Math.hypot(

        entity.position.x-
        player.position.x,

        entity.position.z-
        player.position.z
    );

    const maxDistance=34;

    if(distance>=maxDistance){

        entityAudio.volume=0;

        return;
    }

    let volume=
        Math.pow(
            1-distance/maxDistance,
            1.6
        )*.9;

    if(
        blocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    ){
        volume*=.2;
    }

    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if(
        entityAudio.paused&&
        volume>.01
    ){

        entityAudio.play().catch(
            ()=>{}
        );
    }
}

const keys={

    a:false,
    s:false,
    d:false,

};

let jumpPressed=false;

addEventListener(
    "keydown",
    event=>{

        if(event.code==="KeyW")
            keys.w=true;

        if(event.code==="KeyA")
            keys.a=true;

        if(event.code==="KeyS")
            keys.s=true;

        if(event.code==="KeyD")
            keys.d=true;

        if(
            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        ){
            keys.shift=true;
        }

        if(
            event.code==="Space"&&
            !event.repeat
        ){
            jumpPressed=true;
        }

        if(
            event.code==="Escape"&&
            running&&
            !dead&&
            !fallingIntoLevel
        ){
            togglePause();
        }
    }
);

addEventListener(
    "keyup",
    event=>{

        if(event.code==="KeyW")
            keys.w=false;

        if(event.code==="KeyA")
            keys.a=false;

        if(event.code==="KeyS")
            keys.s=false;

        if(event.code==="KeyD")
            keys.d=false;

        if(
            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        ){
            keys.shift=false;
        }
    }
);

/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !running||
            paused||
            dead||
            fallingIntoLevel
        ){
            return;
        }

        if(
            document.pointerLockElement!==
            document.body
        ){
            return;
        }

        yaw-=
            event.movementX*.0022;

        pitch-=
            event.movementY*.0018;

        pitch=Math.max(
            -1.45,
            Math.min(
                1.45,
                pitch
            )
        );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;
    }
);

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(fallingIntoLevel){

        updateFall(dt);

        return;
    }

    let forward=0;
    let side=0;

    if(keys.w)forward++;
    if(keys.s)forward--;
    if(keys.d)side++;
    if(keys.a)side--;

    const length=
        Math.hypot(
            forward,
            side
        );

    if(length){

        forward/=length;
        side/=length;
    }

    let speed=
        keys.shift
            ?5.9
            :3.5;

    if(difficulty==="easy")
        speed=keys.shift?6.1:3.8;

    if(difficulty==="hard")
        speed=keys.shift?6.3:3.4;

    if(difficulty==="nightmare")
        speed=keys.shift?6.5:3.25;

    const sin=Math.sin(yaw);
    const cos=Math.cos(yaw);

    const dx=
        (
            side*cos+
            forward*sin
        )*
        speed*
        dt;

    const dz=
        (
            -side*sin+
            forward*cos
        )*
        speed*
        dt;

    const nextX=
        player.position.x+dx;

    const nextZ=
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){
        player.position.x=nextX;
    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){
        player.position.z=nextZ;
    }

    if(
        jumpPressed&&
        grounded
    ){

        velocityY=6.2;
        grounded=false;
    }

    jumpPressed=false;

    velocityY-=20*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;
    }

    if(playerInHole()){

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }

    checkExit();
}

/* =========================================================
   FALL
========================================================= */

function updateFall(dt){

    fallTimer+=dt;

    const progress=
        Math.min(
            fallTimer/FALL_DURATION,
            1
        );

    const eased=
        1-Math.pow(
            1-progress,
            3
        );

    player.position.y=
        17-
        17*eased;

    camera.position.y=EYE_HEIGHT;

    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                progress*1.3,
                1
            )
        );

    camera.rotation.z=
        Math.sin(
            progress*
            Math.PI*
            9
        )*.025;

    if(progress>=1){

        fallingIntoLevel=false;

        player.position.y=0;

        camera.position.x=0;
        camera.position.y=EYE_HEIGHT;
        camera.position.z=0;

        camera.rotation.x=0;
        camera.rotation.z=0;

        document.body.requestPointerLock();
    }
}

/* =========================================================
   CAMERA MOVEMENT / VHS MOTION
========================================================= */

let cameraTime=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;

    cameraTime+=dt;

    const moving=
        keys.w||
        keys.a||
        keys.s||
        keys.d;

    /*
       Security camera sway.
       Stronger while moving.
    */

    const amount=
        moving
            ?.012
            :.0035;

    camera.position.x=
        Math.sin(
            cameraTime*3.4
        )*amount;

    camera.position.y=
        EYE_HEIGHT+
        Math.sin(
            cameraTime*4.1
        )*amount;

    camera.position.z=
        Math.cos(
            cameraTime*3.1
        )*
        amount*
        .55;

    camera.rotation.z=
        Math.sin(
            cameraTime*.9
        )*.004;

    /*
       Tiny camera instability.
    */

    if(Math.random()<.008){

        camera.position.x+=
            (Math.random()-.5)*.045;

        camera.position.y+=
            (Math.random()-.5)*.035;

        camera.rotation.z+=
            (Math.random()-.5)*.035;
    }
}

/* =========================================================
   CAMERA INTERFERENCE
========================================================= */

let interferenceTimer=0;

function updateCameraEffects(dt){

    interferenceTimer-=dt;

    const tracking=
        document.getElementById(
            "trackingBand"
        );

    const interference=
        document.getElementById(
            "interference"
        );

    if(interferenceTimer<=0){

        interferenceTimer=
            1.2+
            Math.random()*5;

        /*
           Occasionally produce a stronger
           old security-camera tracking event.
        */

        if(Math.random()<.28){

            tracking.style.top=
                (
                    -25+
                    Math.random()*125
                )+"%";

            tracking.style.opacity=
                (.16+
                Math.random()*.18).toFixed(2);

            setTimeout(()=>{

                tracking.style.opacity="0";

            },180+Math.random()*400);
        }

        /*
           Rare horizontal interference.
        */

        if(Math.random()<.12){

            interference.style.opacity=
                (.12+
                Math.random()*.16).toFixed(2);

            setTimeout(()=>{

                interference.style.opacity="0";

            },70+Math.random()*160);
        }
    }
}

/* =========================================================
   EXIT
========================================================= */

function checkExit(){

    if(
        !exitObject||
        dead
    ){
        return;
    }

    const distance=Math.hypot(

        player.position.x-exitX,

        player.position.z-exitZ
    );

    if(distance<1.8)
        winGame();
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.2;
}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";
    }
}

/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason="THE BACKROOMS GOT YOU"
){

    if(
        dead||
        !running
    ){
        return;
    }

    dead=true;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU DIED";

    document.getElementById(
        "deathTitle"
    ).className="";

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "retryBtn"
    ).textContent="RETRY";

    document.getElementById(
        "death"
    ).style.display="flex";
}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    if(
        dead||
        !running
    ){
        return;
    }

    dead=true;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "deathTitle"
    ).textContent="YOU ESCAPED";

    document.getElementById(
        "deathTitle"
    ).className="win";

    document.getElementById(
        "deathText"
    ).textContent="YOU FOUND THE EXIT";

    document.getElementById(
        "retryBtn"
    ).textContent="PLAY AGAIN";

    document.getElementById(
        "death"
    ).style.display="flex";
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !running||
        dead||
        fallingIntoLevel
    ){
        return;
    }

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
            ?"flex"
            :"none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        document.body.requestPointerLock();
    }
}

/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;
    fallingIntoLevel=false;

    entityAudio.pause();
    entityAudio.volume=0;

    if(document.pointerLockElement)
        document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";
}

/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    if(
        !wallTexture||
        !floorTexture||
        !ceilingTexture
    ){
        await loadTextures();
    }

    clearWorld();

    player.position.set(
        -92,
        17,
        -70
    );

    yaw=.25;
    pitch=-.28;

    velocityY=0;
    grounded=false;

    createFloor();
    createCeiling();

    buildFloorPlan();
    createHoleRoom();
    createExit();
    buildLighting();

    await createEntity();

    entity.position.set(
        55,
        .775,
        -48
    );

    entityDirection.set(
        1,
        0
    );

    entityVelocity.set(
        0,
        0
    );

    lastSeen=99;

    running=true;
    paused=false;
    dead=false;

    fallingIntoLevel=true;

    fallTimer=0;
    recordingTime=0;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x=pitch;
    camera.rotation.z=0;

    player.rotation.y=yaw;

    showMessage(
        "ENTERING LEVEL 0..."
    );
}

/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(value){

    difficulty=value;

    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            running&&
            !paused&&
            !dead&&
            !fallingIntoLevel&&
            document.pointerLockElement!==
            document.body
        ){

            document.body.requestPointerLock();
        }
    }
);

/* =========================================================
   MENU IMAGES
========================================================= */

const menuImages=
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex=0;

function cycleMenuImage(){

    if(!menuImages.length)
        return;

    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );

    menuIndex=
        (menuIndex+1)%
        menuImages.length;

    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}

setInterval(
    cycleMenuImage,
    60000
);

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio||1,
                1.35
            )
        );
    }
);

/* =========================================================
   TIMER
========================================================= */

const clock=new THREE.Clock();

let recordingTime=0;

function updateTimer(dt){

    if(
        !running||
        paused
    ){
        return;
    }

    recordingTime+=dt;

    const total=Math.floor(
        recordingTime
    );

    const hours=Math.floor(
        total/3600
    );

    const minutes=Math.floor(
        (total%3600)/60
    );

    const seconds=total%60;

    const format=
        n=>
            String(n).padStart(
                2,
                "0"
            );

    document.getElementById(
        "tapeTime"
    ).textContent=
        `${format(hours)}:`+
        `${format(minutes)}:`+
        `${format(seconds)}`;
}

/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    updateCameraEffects(dt);

    if(
        running&&
        !paused&&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateLights(dt);

        updateCamera(dt);

        updateEntityAudio();

        updateMessage(dt);

        updateTimer(dt);

    }else{

        updateEntityAudio();
    }

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   INITIAL LOAD
========================================================= */

loadTextures();

animate();

</script>
