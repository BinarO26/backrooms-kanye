@keyframes scanMove {

.camTracking {

<script src="./three.min.js"></script>

<script>

/* =========================================================
   CHECK THREE.JS
========================================================= */

if (typeof THREE === "undefined") {

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "ERROR: three.min.js could not be loaded.";

    throw new Error(
        "Three.js missing"
    );
}

/* =========================================================
   EXACT TEXTURE PATHS
========================================================= */

const TEXTURE_PATHS = {

    wall:
        "./textures/wall.png",

    floor:
        "./textures/floor.png",

    ceiling:
        "./textures/ceiling.png"

};

/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x706b45
    );

scene.fog =
    new THREE.FogExp2(
        0x706b45,
        0.010
    );

/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        window.innerWidth /
        window.innerHeight,
        0.025,
        300
    );

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        powerPreference:
            "high-performance"

    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.35
    )
);

/*
    IMPORTANT:

    No post-processing shader is used here.

    The camcorder effect is purely HTML/CSS,
    meaning the PNG textures remain untouched.
*/

if ("outputColorSpace" in renderer) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    0.72;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x625d39,
        0.25
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xd5c979,
        0x12110d,
        0.42
    )
);

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

const EYE_HEIGHT = 1.18;

const PLAYER_HEIGHT = 1.55;

const PLAYER_RADIUS = 0.28;

const WALK_SPEED = 3.6;

const SPRINT_SPEED = 6.1;

const GRAVITY = 20;

const JUMP_SPEED = 6.2;

let yaw = 0;

let pitch = 0;

let velocityY = 0;

let grounded = false;

let running = false;

let paused = false;

let dead = false;

let fallingIntoLevel = false;

let fallTimer = 0;

const FALL_DURATION = 2.25;

let difficulty = "normal";

/* =========================================================
   WORLD ARRAYS
========================================================= */

let worldObjects = [];

let walls = [];

let deathHoles = [];

let exitObject = null;

let exitLight = null;

let exitX = 0;

let exitZ = 0;

let entity = null;

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;

let floorTexture = null;

let ceilingTexture = null;

/*
    This function prepares the actual PNG texture.

    No shader.
    No color filter.
    No displacement.
    No stretching.

    Just ordinary Three.js texture mapping.
*/

function prepareTexture(texture) {

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            8
        );

    texture.needsUpdate = true;

    return texture;
}

/* =========================================================
   LOAD TEXTURE
========================================================= */

function loadTexture(path) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    resolve(
                        prepareTexture(texture)
                    );

                },

                undefined,

                error => {

                    console.error(
                        "Could not load texture:",
                        path,
                        error
                    );

                    resolve(null);
                }

            );

        }
    );
}

/* =========================================================
   LOAD ALL THREE TEXTURES
========================================================= */

async function loadTextures() {

    wallTexture =
        await loadTexture(
            TEXTURE_PATHS.wall
        );

    floorTexture =
        await loadTexture(
            TEXTURE_PATHS.floor
        );

    ceilingTexture =
        await loadTexture(
            TEXTURE_PATHS.ceiling
        );

    console.log(
        "Textures loaded:",
        {
            wall: !!wallTexture,
            floor: !!floorTexture,
            ceiling: !!ceilingTexture
        }
    );
}

/* =========================================================
   MATERIAL HELPERS
========================================================= */

function textureMaterial(texture) {

    if (!texture) {

        return new THREE.MeshStandardMaterial({

            color: 0xb8aa50,

            roughness: 1,

            metalness: 0,

            side: THREE.DoubleSide

        });
    }

    /*
        No special shader.

        The PNG itself is the material map.
    */

    return new THREE.MeshStandardMaterial({

        map: texture,

        color: 0xffffff,

        roughness: 1,

        metalness: 0,

        side: THREE.DoubleSide

    });
}

/* =========================================================
   ADD OBJECT
========================================================= */

function addObject(object) {

    scene.add(object);

    worldObjects.push(object);

    return object;
}

/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld() {

    for (
        const object of worldObjects
    ) {

        scene.remove(object);

        if (object.geometry) {

            object.geometry.dispose();
        }

        if (object.material) {

            if (
                Array.isArray(
                    object.material
                )
            ) {

                object.material.forEach(
                    material =>
                        material.dispose()
                );

            } else {

                object.material.dispose();

            }
        }
    }

    worldObjects = [];

    walls = [];

    deathHoles = [];

    entity = null;

    exitObject = null;

    if (exitLight) {

        scene.remove(
            exitLight
        );

        exitLight = null;
    }
}

/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    let material;

    if (floorTexture) {

        /*
            Clone the texture so its repeat
            settings are independent.

            This creates an actual tiled grid.
        */

        const texture =
            floorTexture.clone();

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        /*
            Higher number = smaller repeated tiles.
        */

        texture.repeat.set(
            72,
            64
        );

        texture.needsUpdate = true;

        material =
            textureMaterial(
                texture
            );

    } else {

        material =
            textureMaterial(null);
    }

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            material

        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.position.y = 0;

    addObject(floor);
}

/* =========================================================
   CEILING
========================================================= */

const CEILING_HEIGHT = 3.1;

function createCeiling() {

    let material;

    if (ceilingTexture) {

        const texture =
            ceilingTexture.clone();

        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;

        /*
            Same idea as the floor:
            actual repeating image tiles.
        */

        texture.repeat.set(
            72,
            64
        );

        texture.needsUpdate = true;

        material =
            textureMaterial(
                texture
            );

    } else {

        material =
            textureMaterial(null);
    }

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            material

        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y =
        CEILING_HEIGHT;

    addObject(ceiling);
}

/* =========================================================
   WALL MATERIAL
========================================================= */

function createWallMaterial(
    width,
    height
) {

    if (!wallTexture) {

        return textureMaterial(
            null
        );
    }

    /*
        IMPORTANT:

        The wall texture is NOT squished.

        Its original aspect ratio determines
        how wide each vertical tile is.

        Vertical repeat is exactly 1,
        so one texture goes from floor to ceiling.

        Horizontal repeat is calculated from
        the actual image aspect ratio.
    */

    const texture =
        wallTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    const imageWidth =
        texture.image.width;

    const imageHeight =
        texture.image.height;

    const aspect =
        imageWidth /
        imageHeight;

    /*
        One texture tile has this physical width
        when its height equals the wall height.
    */

    const tileWidth =
        height * aspect;

    const horizontalRepeats =
        width / tileWidth;

    texture.repeat.set(
        Math.max(
            horizontalRepeats,
            0.01
        ),
        1
    );

    texture.offset.set(
        0,
        0
    );

    texture.needsUpdate = true;

    return textureMaterial(
        texture
    );
}

/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
) {

    const material =
        createWallMaterial(
            width,
            height
        );

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    /*
        BoxGeometry has UVs on every face.

        The wall texture therefore repeats
        across the wall instead of stretching.
    */

    const wall =
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,
        y,
        z
    );

    addObject(wall);

    walls.push({

        minX:
            x - width / 2,

        maxX:
            x + width / 2,

        minY:
            y - height / 2,

        maxY:
            y + height / 2,

        minZ:
            z - depth / 2,

        maxZ:
            z + depth / 2

    });
}

/* =========================================================
   RANDOM MAZE
========================================================= */

const GRID_X = 18;

const GRID_Z = 16;

const CELL_W = 9;

const CELL_D = 9;

const MAP_ORIGIN_X =
    -(GRID_X * CELL_W) / 2;

const MAP_ORIGIN_Z =
    -(GRID_Z * CELL_D) / 2;

function cellCenter(
    x,
    z
) {

    return {

        x:
            MAP_ORIGIN_X +
            x * CELL_W +
            CELL_W / 2,

        z:
            MAP_ORIGIN_Z +
            z * CELL_D +
            CELL_D / 2

    };
}

function cellKey(
    x,
    z
) {

    return x + "," + z;
}

function generateMaze() {

    const visited =
        new Set();

    const passages =
        new Set();

    function key(x,z) {
        return cellKey(x,z);
    }

    function connect(
        x1,z1,
        x2,z2
    ) {

        passages.add(
            key(x1,z1) +
            "|" +
            key(x2,z2)
        );

        passages.add(
            key(x2,z2) +
            "|" +
            key(x1,z1)
        );
    }

    function visit(x,z) {

        visited.add(
            key(x,z)
        );

        const directions = [

            [1,0],
            [-1,0],
            [0,1],
            [0,-1]

        ];

        for (
            let i =
                directions.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );

            [
                directions[i],
                directions[j]
            ] = [
                directions[j],
                directions[i]
            ];
        }

        for (
            const direction
            of directions
        ) {

            const nx =
                x + direction[0];

            const nz =
                z + direction[1];

            if (
                nx < 0 ||
                nz < 0 ||
                nx >= GRID_X ||
                nz >= GRID_Z
            )
                continue;

            if (
                visited.has(
                    key(nx,nz)
                )
            )
                continue;

            connect(
                x,z,
                nx,nz
            );

            visit(
                nx,nz
            );
        }
    }

    visit(
        Math.floor(GRID_X / 2),
        Math.floor(GRID_Z / 2)
    );

    /*
        Add extra connections so it isn't
        a perfect maze.
    */

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const x =
            Math.floor(
                Math.random() *
                (GRID_X - 1)
            );

        const z =
            Math.floor(
                Math.random() *
                (GRID_Z - 1)
            );

        if (
            Math.random() < .5
        ) {

            connect(
                x,z,
                x+1,z
            );

        } else {

            connect(
                x,z,
                x,z+1
            );
        }
    }

    return passages;
}

/* =========================================================
   BUILD MAP
========================================================= */

function buildMap() {

    const passages =
        generateMaze();

    const H =
        CEILING_HEIGHT;

    /*
        Outer walls.
    */

    addWall(
        180,
        H,
        1,
        0,
        H/2,
        -80
    );

    addWall(
        180,
        H,
        1,
        0,
        H/2,
        80
    );

    addWall(
        1,
        H,
        160,
        -90,
        H/2,
        0
    );

    addWall(
        1,
        H,
        160,
        90,
        H/2,
        0
    );

    /*
        Interior walls.
    */

    for (
        let z = 0;
        z < GRID_Z;
        z++
    ) {

        for (
            let x = 0;
            x < GRID_X;
            x++
        ) {

            const center =
                cellCenter(
                    x,z
                );

            if (
                x < GRID_X - 1
            ) {

                const open =
                    passages.has(
                        cellKey(x,z) +
                        "|" +
                        cellKey(x+1,z)
                    );

                if (!open) {

                    addWall(
                        1,
                        H,
                        CELL_D,

                        center.x +
                        CELL_W / 2,

                        H / 2,

                        center.z
                    );
                }
            }

            if (
                z < GRID_Z - 1
            ) {

                const open =
                    passages.has(
                        cellKey(x,z) +
                        "|" +
                        cellKey(x,z+1)
                    );

                if (!open) {

                    addWall(
                        CELL_W,
                        H,
                        1,

                        center.x,

                        H / 2,

                        center.z +
                        CELL_D / 2
                    );
                }
            }
        }
    }

    /*
        Additional strange walls create
        claustrophobic sections.
    */

    for (
        let i = 0;
        i < 16;
        i++
    ) {

        const x =
            -65 +
            Math.random() * 130;

        const z =
            -55 +
            Math.random() * 110;

        if (
            Math.random() < .5
        ) {

            addWall(
                7,
                H,
                .75,
                x,
                H/2,
                z
            );

        } else {

            addWall(
                .75,
                H,
                7,
                x,
                H/2,
                z
            );
        }
    }
}

/* =========================================================
   HOLE ROOM
========================================================= */

function createDeathHole(
    x,
    z,
    width,
    depth
) {

    deathHoles.push({

        x,
        z,
        width,
        depth

    });

    /*
        The black volume is below the floor.
        Falling into it kills the player.
    */

    const pit =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                10,
                depth
            ),

            new THREE.MeshBasicMaterial({
                color: 0x000000
            })

        );

    pit.position.set(
        x,
        -5,
        z
    );

    addObject(pit);
}

function createHoleRoom() {

    const centerX =
        -55;

    const centerZ =
        45;

    const rows = 7;

    const columns = 7;

    const spacing = 2.5;

    const holeSize = 1.85;

    /*
        Grid of holes.
    */

    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < columns;
            col++
        ) {

            /*
                Some squares are left safe
                so the player has to navigate
                rather than instantly die.
            */

            const safe =
                Math.random() < .22;

            if (safe)
                continue;

            const x =
                centerX +
                (col - 3) *
                spacing;

            const z =
                centerZ +
                (row - 3) *
                spacing;

            createDeathHole(
                x,
                z,
                holeSize,
                holeSize
            );
        }
    }

    const size =
        columns *
        spacing +
        1;

    /*
        Hole-room walls.
    */

    addWall(
        size,
        CEILING_HEIGHT,
        .7,
        centerX,
        CEILING_HEIGHT/2,
        centerZ - size/2
    );

    addWall(
        size,
        CEILING_HEIGHT,
        .7,
        centerX,
        CEILING_HEIGHT/2,
        centerZ + size/2
    );

    addWall(
        .7,
        CEILING_HEIGHT,
        size,
        centerX - size/2,
        CEILING_HEIGHT/2,
        centerZ
    );

    addWall(
        .7,
        CEILING_HEIGHT,
        size,
        centerX + size/2,
        CEILING_HEIGHT/2,
        centerZ
    );
}

function createExit() {

    /*

    */

    let attempts = 0;

    do {

        const cellX =
            2 +
            Math.floor(
                Math.random() *
                (GRID_X - 4)
            );

        const cellZ =
            2 +
            Math.floor(
                Math.random() *
                (GRID_Z - 4)
            );

        const center =
            cellCenter(
                cellX,
                cellZ
            );

        exitX =
            center.x;

        exitZ =
            center.z;

        attempts++;

    } while (

        Math.hypot(
            exitX -
            player.position.x,

            exitZ -
            player.position.z
        ) < 35 &&

        attempts < 100
    );

    const group =
        new THREE.Group();

    );

        );

    left.position.set(

    );

            ),

        );

        );

/* =========================================================
   HOLE CHECK
========================================================= */

function insideHole(x,z) {

    for (
        const hole
        of deathHoles
    ) {

        if (

            x >
            hole.x -
            hole.width / 2 &&

            x <
            hole.x +
            hole.width / 2 &&

            z >
            hole.z -
            hole.depth / 2 &&

            z <
            hole.z +
            hole.depth / 2

        ) {

            return true;
        }
    }

    return false;
}

/* =========================================================
   EXIT CHECK
========================================================= */

function checkExit() {

    if (
        !exitObject ||
        dead
    )
        return;

    const distance =
        Math.hypot(
            player.position.x -
            exitX,

            player.position.z -
            exitZ
        );

    if (
        distance < 1.8
    ) {

        winGame();
    }
}

/* =========================================================
   COLLISION
========================================================= */

function playerCollides(x,z) {

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;

    for (
        const wall
        of walls
    ) {

        if (
            top <= wall.minY ||
            bottom >= wall.maxY
        )
            continue;

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x - closestX;

        const dz =
            z - closestZ;

        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }

    return false;
}

let entityDirection =
    new THREE.Vector2(
        1,
        0
    );

let entityVelocity =
    new THREE.Vector2(
        0,
        0
    );

let lastSeenTimer = 0;

let lastKnown =
    new THREE.Vector2();

let wanderTimer = 0;

let wanderAngle = 0;

const DIFFICULTIES = {

    easy: {
        name: "EASY",
        speed: 4.2,
        detection: 20
    },

    normal: {
        name: "NORMAL",
        speed: 6.0,
        detection: 29

    },

    }

};

/* =========================================================
   ENTITY WALL CHECK
========================================================= */

function entityHitsWall(x,z) {

    for (
        const wall
        of walls
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x - closestX;

        const dz =
            z - closestZ;

        if (
            dx * dx +
            dz * dz <
            .43 * .43
        ) {

            return true;
        }
    }

    return false;
}

/* =========================================================
   LINE OF SIGHT
========================================================= */

function blocked(
    x1,z1,
    x2,z2
) {

    const dx =
        x2 - x1;

    const dz =
        z2 - z1;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    const steps =
        Math.ceil(
            distance / .35
        );

    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i / steps;

        const x =
            x1 + dx * t;

        const z =
            z1 + dz * t;

        if (
            entityHitsWall(
                x,z
            )
        ) {

            return true;
        }
    }

    return false;
}

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt) {

    if (
        !entity ||
        dead ||
        paused ||
        fallingIntoLevel
    )
        return;

    const settings =
        DIFFICULTIES[
            difficulty
        ];

    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    lastSeenTimer += dt;

    const visible =
        distance <
        settings.detection &&

        !blocked(
            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z
        );

    let dirX = 0;
    let dirZ = 0;

    if (visible) {

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeenTimer = 0;

        dirX =
            dx /
            Math.max(
                distance,
                .001
            );

        dirZ =
            dz /
            Math.max(
                distance,
                .001
            );

    } else if (
        lastSeenTimer < 3
    ) {

        const lx =
            lastKnown.x -
            entity.position.x;

        const lz =
            lastKnown.y -
            entity.position.z;

        const length =
            Math.hypot(
                lx,
                lz
            );

        if (length > .1) {

            dirX =
                lx / length;

            dirZ =
                lz / length;
        }

    } else {

        wanderTimer -= dt;

        if (
            wanderTimer <= 0
        ) {

            wanderTimer =
                .5 +
                Math.random() * 1.5;

            wanderAngle =
                Math.random() *
                Math.PI * 2;
        }

        dirX =
            Math.cos(
                wanderAngle
            );

        dirZ =
            Math.sin(
                wanderAngle
            );
    }

    const targetAngle =
        Math.atan2(
            dirZ,
            dirX
        );

    const currentAngle =
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );

    let difference =
        targetAngle -
        currentAngle;

    while (
        difference > Math.PI
    )
        difference -= Math.PI * 2;

    while (
        difference < -Math.PI
    )
        difference += Math.PI * 2;

    const turn =
        3.4 * dt;

    difference =
        Math.max(
            -turn,
            Math.min(
                turn,
                difference
            )
        );

    const angle =
        currentAngle +
        difference;

    entityDirection.x =
        Math.cos(angle);

    entityDirection.y =
        Math.sin(angle);

    entityVelocity.x =
        THREE.MathUtils.lerp(
            entityVelocity.x,

            entityDirection.x *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );

    entityVelocity.y =
        THREE.MathUtils.lerp(
            entityVelocity.y,

            entityDirection.y *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );

    const newX =
        entity.position.x +
        entityVelocity.x * dt;

    const newZ =
        entity.position.z +
        entityVelocity.y * dt;

    if (
        !entityHitsWall(
            newX,
            entity.position.z
        )
    ) {

        entity.position.x =
            newX;

    } else {

        entityVelocity.x = 0;

        wanderAngle +=
            Math.PI / 2;
    }

    if (
        !entityHitsWall(
            entity.position.x,
            newZ
        )
    ) {

        entity.position.z =
            newZ;

    } else {

        entityVelocity.y = 0;

        wanderAngle +=
            Math.PI / 2;
    }

    /*
        Billboard the entity toward
        the player.
    */

    entity.rotation.y =
        Math.atan2(
            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );

    if (
        distance <
        (
            difficulty === "impossible"
            ? 1.55
            : 1.25
        )
    ) {

        killPlayer();
    }
}

/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        )
            return;

        if (
            document.pointerLockElement !==
            document.body
        )
            return;

        const sensitivity =
            .0021;

        yaw -=
            event.movementX *
            sensitivity;

        pitch -=
            event.movementY *
            sensitivity;

        const limit =
            Math.PI / 2 -
            .05;

        pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;
    }
);

/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt) {

    if (
        fallingIntoLevel
    ) {

        updateFall(dt);

        return;
    }

    const direction =
        new THREE.Vector3();

    if (keys.w)
        direction.z -= 1;

    if (keys.s)
        direction.z += 1;

    if (keys.a)
        direction.x -= 1;

    if (keys.d)
        direction.x += 1;

    if (
        direction.lengthSq() > 0
    ) {

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );

        const speed =
            keys.shift
            ? SPRINT_SPEED
            : WALK_SPEED;

        const amount =
            speed * dt;

        const newX =
            player.position.x +
            direction.x *
            amount;

        if (
            !playerCollides(
                newX,
                player.position.z
            )
        ) {

            player.position.x =
                newX;
        }

        const newZ =
            player.position.z +
            direction.z *
            amount;

        if (
            !playerCollides(
                player.position.x,
                newZ
            )
        ) {

            player.position.z =
                newZ;
        }
    }

    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            JUMP_SPEED;

        grounded = false;
    }

    jumpPressed = false;

    velocityY -=
        GRAVITY * dt;

    player.position.y +=
        velocityY * dt;

    /*
        Hole detection happens before
        normal floor collision.
    */

    if (
        insideHole(
            player.position.x,
            player.position.z
        )
    ) {

        grounded = false;

        if (
            player.position.y < -2.5
        ) {

            killPlayer();
        }

        return;
    }

    if (
        player.position.y <= 0
    ) {

        player.position.y = 0;

        velocityY = 0;

        grounded = true;
    }

    checkExit();
}

/* =========================================================
   FALLING SPAWN
========================================================= */

function updateFall(dt) {

    fallTimer += dt;

    const raw =
        Math.min(
            fallTimer /
            FALL_DURATION,
            1
        );

    const eased =
        raw * raw *
        (3 - 2 * raw);

    player.position.y =
        THREE.MathUtils.lerp(
            18,
            0,
            eased
        );

    const shake =
        Math.sin(
            fallTimer * 38
        ) *
        .035 *
        (1 - raw);

    camera.position.x =
        shake;

    camera.position.y =
        EYE_HEIGHT +
        shake;

    camera.rotation.x =
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                raw * 1.3,
                1
            )
        );

    player.rotation.y =
        yaw +
        Math.sin(
            fallTimer * 4
        ) *
        .035 *
        (1 - raw);

    if (
        raw >= 1
    ) {

        fallingIntoLevel =
            false;

        player.position.y =
            0;

        camera.position.x =
            0;

        camera.position.y =
            EYE_HEIGHT;

        camera.rotation.x =
            0;

        player.rotation.y =
            yaw;

        document.body.requestPointerLock();
    }
}

/* =========================================================
   CAMERA SHAKE
========================================================= */

let cameraTime = 0;

function updateCamera(dt) {

    if (
        fallingIntoLevel
    )
        return;

    cameraTime += dt;

    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;

    const amount =
        moving
        ? .009
        : .002;

    camera.position.x =
        Math.sin(
            cameraTime * 3.4
        ) *
        amount;

    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime * 4.1
        ) *
        amount;

    camera.rotation.z =
        Math.sin(
            cameraTime * .9
        ) *
        .003;

    /*
        Tiny analog camera instability.
    */

    if (
        Math.random() < .003
    ) {

        camera.position.x +=
            (Math.random() - .5) *
            .035;

        camera.position.y +=
            (Math.random() - .5) *
            .025;

        camera.rotation.z +=
            (Math.random() - .5) *
            .025;
    }
}

/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume = 0;

        return;
    }

    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );

    const maxDistance =
        difficulty === "impossible"
        ? 42
        : 34;

    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume = 0;

        return;
    }

    let volume =
        1 -
        distance /
        maxDistance;

    volume =
        Math.pow(
            volume,
            1.6
        ) * .9;

    if (
        blocked(
            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z
        )
    ) {

        volume *= .2;
    }

    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );

    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(() => {});
    }
}

/* =========================================================
   TIMER
========================================================= */

let recordingTime = 0;

function updateTimer(dt) {

    if (
        !running ||
        paused
    )
        return;

    recordingTime += dt;

    const total =
        Math.floor(
            recordingTime
        );

    const hours =
        Math.floor(
            total / 3600
        );

    const minutes =
        Math.floor(
            (total % 3600) / 60
        );

    const seconds =
        total % 60;

    const format =
        number =>
            String(number)
                .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent =
        `${format(hours)}:${format(minutes)}:${format(seconds)}`;
}

/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    /*
        Make absolutely sure the PNG textures
        have finished loading before constructing
        the walls/floor/ceiling.
    */

    if (
        !wallTexture ||
        !floorTexture ||
        !ceilingTexture
    ) {

        await loadTextures();
    }

    clearWorld();

    /*
        Spawn position.
    */

    player.position.set(
        -72,
        18,
        -67
    );

    yaw = 0;

    pitch = -.28;

    velocityY = 0;

    grounded = false;

    /*
        Build the world AFTER textures are loaded.
    */

    createFloor();

    createCeiling();

    buildMap();

    createHoleRoom();

    createExit();

    /*
        Ceiling lights.
    */

    for (
        let z = -70;
        z <= 70;
        z += 10
    ) {

        for (
            let x = -80;
            x <= 80;
            x += 11
        ) {

            if (
                Math.random() < .13
            )
                continue;

            addCeilingLight(
                x,
                z
            );
        }
    }

    await createEntity();

    /*
        Spawn entity away from player.
    */

    let attempts = 0;

    do {

        entity.position.x =
            -65 +
            Math.random() *
            130;

        entity.position.z =
            -55 +
            Math.random() *
            110;

        attempts++;

    } while (

        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        ) < 35 &&

        attempts < 100
    );

    running = true;

    paused = false;

    dead = false;

    fallingIntoLevel = true;

    fallTimer = 0;

    recordingTime = 0;

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "pause"
    ).style.display = "none";

    document.getElementById(
        "death"
    ).style.display = "none";

    document.querySelector(
        ".deathTitle"
    ).textContent =
        "YOU DIED";

    document.querySelector(
        ".deathTitle"
    ).style.color =
        "#b40000";

    document.getElementById(
        "deathText"
    ).textContent =
        "THE BACKROOMS GOT YOU";

    document.getElementById(
        "retryBtn"
    ).textContent =
        "RETRY";

    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );

    camera.rotation.x =
        pitch;

    player.rotation.y =
        yaw;

    document.body.requestPointerLock();
}

/* =========================================================
   DEATH
========================================================= */

function killPlayer() {

    if (
        dead ||
        !running
    )
        return;

    dead = true;

    fallingIntoLevel =
        false;

    entityAudio.pause();

    entityAudio.volume = 0;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }

    document.getElementById(
        "death"
    ).style.display =
        "flex";
}

/* =========================================================
   WIN
========================================================= */

function winGame() {

    dead = true;

    entityAudio.pause();

    entityAudio.volume = 0;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }

    document.querySelector(
        ".deathTitle"
    ).textContent =
        "YOU ESCAPED";

    document.querySelector(
        ".deathTitle"
    ).style.color =
        "#69ff82";

    document.getElementById(
        "deathText"
    ).textContent =
        "YOU FOUND THE EXIT";

    document.getElementById(
        "retryBtn"
    ).textContent =
        "PLAY AGAIN";

    document.getElementById(
        "death"
    ).style.display =
        "flex";
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        dead ||
        fallingIntoLevel
    )
        return;

    paused =
        !paused;

    document.getElementById(
        "pause"
    ).style.display =
        paused
        ? "flex"
        : "none";

    if (paused) {

        if (
            document.pointerLockElement
        ) {

            document.exitPointerLock();
        }

    } else {

        document.body.requestPointerLock();
    }
}

/* =========================================================
   MAIN MENU
========================================================= */

function returnToMenu() {

    running = false;

    paused = false;

    dead = false;

    fallingIntoLevel = false;

    entityAudio.pause();

    entityAudio.volume = 0;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    document.getElementById(
        "menu"
    ).style.display =
        "block";
}

/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(value) {

    difficulty = value;

    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );

    document.getElementById(
        value + "Btn"
    ).classList.add(
        "selected"
    );

    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[value].name;
}

document.getElementById(
    "easyBtn"
).onclick =
    () => setDifficulty("easy");

document.getElementById(
    "normalBtn"
).onclick =
    () => setDifficulty("normal");

document.getElementById(
    "hardBtn"
).onclick =
    () => setDifficulty("hard");

document.getElementById(
    "impossibleBtn"
).onclick =
    () => setDifficulty("impossible");

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick =
    () => startGame();

document.getElementById(
    "resumeBtn"
).onclick =
    () => togglePause();

document.getElementById(
    "restartBtn"
).onclick =
    () => startGame();

document.getElementById(
    "menuBtn"
).onclick =
    () => returnToMenu();

document.getElementById(
    "retryBtn"
).onclick =
    () => startGame();

document.getElementById(
    "deathMenuBtn"
).onclick =
    () => returnToMenu();

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    () => {

        if (
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement !==
            document.body
        ) {

            document.body.requestPointerLock();
        }
    }
);

/* =========================================================
   MENU IMAGE ROTATION
   EXACTLY ONE MINUTE
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex = 0;

function cycleMenuImage() {

    if (
        menuImages.length === 0
    )
        return;

    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );

    menuIndex =
        (
            menuIndex + 1
        ) %
        menuImages.length;

    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}

/*
    60,000 milliseconds = 60 seconds = 1 minute.
*/

setInterval(
    cycleMenuImage,
    60000
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

/* =========================================================
   INITIAL TEXTURE LOAD
========================================================= */

loadTextures();

/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(dt);

        updateEntity(dt);

        updateAudio();

        updateCamera(dt);

        updateTimer(dt);

    } else {

        updateAudio();
    }

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>
