<script src="./three.min.js"></script>

<script>

"use strict";

/* =========================================================
   BASIC CHECK
========================================================= */

if(typeof THREE === "undefined"){

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "three.min.js could not be loaded.";

    throw new Error(
        "Three.js missing"
    );
}

/* =========================================================
   PATHS
========================================================= */

const BASE =
    new URL(
        "./",
        document.baseURI
    );

const TEXTURE_PATHS = {

    floor:
        new URL(
            "textures/floor.png",
            BASE
        ).href,

    wall:
        new URL(
            "textures/wall.png",
            BASE
        ).href,

    ceiling:
        new URL(
            "textures/ceiling.png",
            BASE
        ).href

};

const ENTITY_URL =
    new URL(
        "entity.png",
        BASE
    ).href;

const AUDIO_URL =
    new URL(
        "entity.mp3",
        BASE
    ).href;

/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x77703c
    );

scene.fog =
    new THREE.Fog(
        0x77703c,
        65,
        180
    );

/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth /
        innerHeight,
        .03,
        250
    );

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

if(
    "outputColorSpace"
    in renderer
){

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

}

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(
    player
);

player.add(
    camera
);

const EYE_HEIGHT = 1.18;
const PLAYER_HEIGHT = 1.55;
const PLAYER_RADIUS = .28;

const WALK_SPEED = 3.8;
const SPRINT_SPEED = 6.5;

const GRAVITY = 20;
const JUMP_SPEED = 6.3;

camera.position.set(
    0,
    EYE_HEIGHT,
    0
);

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let grounded = true;

/* =========================================================
   STATE
========================================================= */

let running = false;
let paused = false;
let dead = false;

let difficulty = "normal";

let entity = null;

let worldObjects = [];
let walls = [];

let entityVelocity =
    new THREE.Vector2(
        0,
        0
    );

let entityDirection =
    new THREE.Vector2(
        1,
        0
    );

let lastKnownPlayer =
    new THREE.Vector2(
        0,
        0
    );

let hasLastKnownPosition =
    false;

let lastSeenTimer = 0;

let wanderTimer = 0;
let wanderAngle = 0;

/* =========================================================
   TEXTURES
========================================================= */

let floorTexture = null;
let wallTexture = null;
let ceilingTexture = null;

/* =========================================================
   TEXTURE LOADER
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

/*
    Configure all textures for crisp,
    proportional repeating.
*/

function prepareTexture(
    texture
){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate =
        true;

    return texture;
}

/* =========================================================
   LOAD TEXTURE
========================================================= */

function loadTexture(
    url,
    name
){

    return new Promise(
        resolve => {

            textureLoader.load(

                url,

                texture => {

                    console.log(
                        "Loaded:",
                        name
                    );

                    resolve(
                        prepareTexture(
                            texture
                        )
                    );

                },

                undefined,

                error => {

                    console.error(
                        "Failed:",
                        name,
                        error
                    );

                    resolve(null);
                }

            );

        }
    );

}

/* =========================================================
   LOAD ENVIRONMENT
========================================================= */

async function loadEnvironmentTextures(){

    const status =
        document.getElementById(
            "textureStatus"
        );

    status.textContent =
        "Loading floor.png...";

    floorTexture =
        await loadTexture(
            TEXTURE_PATHS.floor,
            "floor.png"
        );

    status.textContent =
        "Loading wall.png...";

    wallTexture =
        await loadTexture(
            TEXTURE_PATHS.wall,
            "wall.png"
        );

    status.textContent =
        "Loading ceiling.png...";

    ceilingTexture =
        await loadTexture(
            TEXTURE_PATHS.ceiling,
            "ceiling.png"
        );

    if(
        !floorTexture ||
        !wallTexture ||
        !ceilingTexture
    ){

        status.textContent =
            "WARNING: One or more textures failed to load.";

        status.style.color =
            "#ff7777";

    }else{

        status.textContent =
            "TEXTURES READY";

    }

}

/* =========================================================
   MATERIAL HELPERS
========================================================= */

/*
    MeshBasicMaterial is intentional.

    The PNG is displayed directly.
    Scene lighting does NOT darken or recolor it.
*/

function makeMaterial(
    texture
){

    return new THREE.MeshBasicMaterial({

        map:texture,

        side:
            THREE.DoubleSide,

        fog:true,

        toneMapped:false

    });

}

/* =========================================================
   WORLD OBJECT
========================================================= */

function addObject(
    object
){

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}

/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld(){

    for(
        const object
        of worldObjects
    ){

        scene.remove(
            object
        );

        if(
            object.geometry
        ){

            object.geometry.dispose();

        }

        if(
            object.material
        ){

            if(
                Array.isArray(
                    object.material
                )
            ){

                object.material
                    .forEach(
                        m => {

                            if(
                                m.map
                            ){
                                m.map.dispose();
                            }

                            m.dispose();
                        }
                    );

            }else{

                if(
                    object.material.map
                ){

                    /*
                        Don't dispose the
                        original loaded texture.
                    */

                }

                object.material.dispose();

            }

        }

    }

    worldObjects = [];
    walls = [];
    entity = null;
}

/* =========================================================
   FLOOR TEXTURE
========================================================= */

function createFloorMaterial(){

    if(!floorTexture){

        return new THREE.MeshBasicMaterial({
            color:0x9a8e4c,
            side:THREE.DoubleSide
        });

    }

    const texture =
        floorTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    /*
        ONE TILE = 2 x 2 world units.

        Therefore the image repeats as a
        real square grid instead of stretching
        across the entire floor.
    */

    const WORLD_WIDTH = 180;
    const WORLD_DEPTH = 160;
    const TILE_SIZE = 2;

    texture.repeat.set(

        WORLD_WIDTH /
        TILE_SIZE,

        WORLD_DEPTH /
        TILE_SIZE

    );

    texture.offset.set(
        0,
        0
    );

    texture.needsUpdate =
        true;

    return makeMaterial(
        texture
    );
}

/* =========================================================
   CEILING TEXTURE
========================================================= */

function createCeilingMaterial(){

    if(!ceilingTexture){

        return new THREE.MeshBasicMaterial({
            color:0xd7d1b7,
            side:THREE.DoubleSide
        });

    }

    const texture =
        ceilingTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    /*
        Same square grid as the floor.
    */

    const WORLD_WIDTH = 180;
    const WORLD_DEPTH = 160;
    const TILE_SIZE = 2;

    texture.repeat.set(

        WORLD_WIDTH /
        TILE_SIZE,

        WORLD_DEPTH /
        TILE_SIZE

    );

    texture.offset.set(
        0,
        0
    );

    texture.needsUpdate =
        true;

    return makeMaterial(
        texture
    );
}

/* =========================================================
   FLOOR
========================================================= */

function addFloor(){

    const material =
        createFloorMaterial();

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            material

        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.position.set(
        0,
        0,
        0
    );

    addObject(
        floor
    );
}

/* =========================================================
   CEILING
========================================================= */

const CEILING_Y = 3.1;

function addCeiling(){

    const material =
        createCeilingMaterial();

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            material

        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.set(
        0,
        CEILING_Y,
        0
    );

    addObject(
        ceiling
    );
}

/* =========================================================
   WALL TEXTURE MAPPING
========================================================= */

/*
    THIS IS THE IMPORTANT PART.

    A wall is made from separate planes.

    This gives us complete control over the
    texture dimensions.

    Vertical:

        floor
          |
          |
          |
        ceiling

    = exactly ONE texture height.

    Horizontal:

        [PNG][PNG][PNG][PNG][partial]

    The final tile is clipped naturally.
*/

function createWallMaterial(
    width,
    height
){

    if(!wallTexture){

        return new THREE.MeshBasicMaterial({
            color:0xc8bb48,
            side:THREE.DoubleSide
        });

    }

    const texture =
        wallTexture.clone();

    texture.wrapS =
        THREE.RepeatWrapping;

    /*
        Clamp vertically.

        This guarantees that the texture
        does NOT stretch vertically.
    */

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    texture.colorSpace =
        THREE.SRGBColorSpace;

    /*
        Preserve original PNG aspect ratio.

        Example:

        If PNG is 512x512,
        one tile is H x H.

        If PNG is 1024x512,
        one tile is 2H x H.
    */

    const imageWidth =
        texture.image.width;

    const imageHeight =
        texture.image.height;

    const imageAspect =
        imageWidth /
        imageHeight;

    /*
        Width of ONE proportional texture tile.
    */

    const tileWidth =
        height *
        imageAspect;

    /*
        Number of complete/partial tiles
        needed across this wall.
    */

    const repeatX =
        width /
        tileWidth;

    texture.repeat.set(

        repeatX,

        1

    );

    texture.offset.set(
        0,
        0
    );

    texture.needsUpdate =
        true;

    return makeMaterial(
        texture
    );
}

/* =========================================================
   WALL PLANE
========================================================= */

function addWallPlane(
    width,
    height,
    x,
    y,
    z,
    rotationY
){

    const material =
        createWallMaterial(
            width,
            height
        );

    const wall =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            material

        );

    wall.position.set(
        x,
        y,
        z
    );

    wall.rotation.y =
        rotationY;

    addObject(
        wall
    );

    return wall;
}

/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
){

    /*
        Four individually mapped wall faces.

        The geometry is slightly thicker than
        the visible texture plane, preventing
        the player from seeing through corners.
    */

    const front =
        addWallPlane(
            width,
            height,
            x,
            y,
            z - depth/2,
            0
        );

    const back =
        addWallPlane(
            width,
            height,
            x,
            y,
            z + depth/2,
            Math.PI
        );

    const side1 =
        addWallPlane(
            depth,
            height,
            x - width/2,
            y,
            z,
            Math.PI/2
        );

    const side2 =
        addWallPlane(
            depth,
            height,
            x + width/2,
            y,
            z,
            -Math.PI/2
        );

    /*
        Invisible collision box.

        This means visual texture geometry
        doesn't affect collision.
    */

    walls.push({

        minX:
            x -
            width/2,

        maxX:
            x +
            width/2,

        minY:
            y -
            height/2,

        maxY:
            y +
            height/2,

        minZ:
            z -
            depth/2,

        maxZ:
            z +
            depth/2

    });

    return {
        front,
        back,
        side1,
        side2
    };
}

/* =========================================================
   LIGHT FIXTURE
========================================================= */

const LIGHT_SIZE = 2;

function addLight(
    x,
    z
){

    /*
        White square fixture.

        Exactly 2x2 world units.
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                LIGHT_SIZE,
                .055,
                LIGHT_SIZE
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xffffdc,

                side:
                    THREE.DoubleSide

            })

        );

    fixture.position.set(
        x,
        3.025,
        z
    );

    addObject(
        fixture
    );

}

/* =========================================================
   LEVEL
========================================================= */

function buildLevel(){

    clearWorld();

    addFloor();

    addCeiling();

    const H = 3.1;

    /* =====================================================
       OUTER WALLS
    ===================================================== */

    addWall(
        180,
        H,
        1,
        0,
        H/2,
        -80
    );

    addWall(
        180,
        H,
        1,
        0,
        H/2,
        80
    );

    addWall(
        1,
        H,
        160,
        -90,
        H/2,
        0
    );

    addWall(
        1,
        H,
        160,
        90,
        H/2,
        0
    );

    /* =====================================================
       LARGE ROOMS
    ===================================================== */

    addWall(
        1,
        H,
        95,
        -55,
        H/2,
        0
    );

    addWall(
        1,
        H,
        95,
        55,
        H/2,
        0
    );

    addWall(
        75,
        H,
        1,
        0,
        H/2,
        -52
    );

    addWall(
        75,
        H,
        1,
        0,
        H/2,
        52
    );

    /* =====================================================
       INTERIOR WALLS
    ===================================================== */

    addWall(
        35,
        H,
        1,
        -25,
        H/2,
        -25
    );

    addWall(
        35,
        H,
        1,
        25,
        H/2,
        25
    );

    addWall(
        1,
        H,
        30,
        -42,
        H/2,
        27
    );

    addWall(
        1,
        H,
        30,
        42,
        H/2,
        -27
    );

    /* =====================================================
       CLAUSTROPHOBIC AREA
    ===================================================== */

    for(
        let i = 0;
        i < 7;
        i++
    ){

        addWall(
            .8,
            H,
            25,
            -35 +
            i * 5,
            H/2,
            0
        );

    }

    /* =====================================================
       MORE ROOMS
    ===================================================== */

    addWall(
        18,
        H,
        1,
        -68,
        H/2,
        -35
    );

    addWall(
        1,
        H,
        20,
        -77,
        H/2,
        -25
    );

    addWall(
        20,
        H,
        1,
        65,
        H/2,
        38
    );

    addWall(
        1,
        H,
        20,
        55,
        H/2,
        48
    );

    /* =====================================================
       CEILING LIGHT GRID
    ===================================================== */

    for(
        let x = -80;
        x <= 80;
        x += 10
    ){

        for(
            let z = -70;
            z <= 70;
            z += 10
        ){

            addLight(
                x,
                z
            );

        }

    }

    /* =====================================================
       PLAYER SPAWN
    ===================================================== */

    player.position.set(
        -70,
        0,
        -65
    );

    yaw = 0;
    pitch = 0;

    velocityY = 0;
    grounded = true;

    player.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;
}

/* =========================================================
   PLAYER COLLISION
========================================================= */

function playerCollides(
    x,
    z
){

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;

    for(
        const wall of walls
    ){

        if(
            top <= wall.minY ||
            bottom >= wall.maxY
        ){
            continue;
        }

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;

        if(
            dx*dx +
            dz*dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ){

            return true;

        }

    }

    return false;
}

/* =========================================================
   ENTITY
========================================================= */

const ENTITY_HEIGHT =
    1.55;

const ENTITY_RADIUS =
    .43;

async function createEntity(){

    return new Promise(
        resolve => {

            textureLoader.load(

                ENTITY_URL,

                texture => {

                    texture.colorSpace =
                        THREE.SRGBColorSpace;

                    const aspect =
                        texture.image.width /
                        texture.image.height;

                    const width =
                        ENTITY_HEIGHT *
                        aspect;

                    const material =
                        new THREE.MeshBasicMaterial({

                            map:texture,

                            transparent:true,

                            alphaTest:.01,

                            side:
                                THREE.DoubleSide,

                            depthWrite:true,

                            fog:false,

                            toneMapped:false

                        });

                    entity =
                        new THREE.Mesh(

                            new THREE.PlaneGeometry(
                                width,
                                ENTITY_HEIGHT
                            ),

                            material

                        );

                    entity.position.set(
                        35,
                        ENTITY_HEIGHT/2,
                        35
                    );

                    addObject(
                        entity
                    );

                    entityVelocity.set(
                        0,
                        0
                    );

                    entityDirection.set(
                        1,
                        0
                    );

                    hasLastKnownPosition =
                        false;

                    lastSeenTimer = 0;

                    resolve(true);

                },

                undefined,

                () => {

                    const material =
                        new THREE.MeshBasicMaterial({
                            color:0x111111,
                            side:THREE.DoubleSide
                        });

                    entity =
                        new THREE.Mesh(

                            new THREE.PlaneGeometry(
                                1,
                                ENTITY_HEIGHT
                            ),

                            material

                        );

                    entity.position.set(
                        35,
                        ENTITY_HEIGHT/2,
                        35
                    );

                    addObject(
                        entity
                    );

                    resolve(true);

                }

            );

        }
    );

}

/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
){

    for(
        const wall of walls
    ){

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;

        if(
            dx*dx +
            dz*dz <
            ENTITY_RADIUS *
            ENTITY_RADIUS
        ){

            return true;

        }

    }

    return false;
}

/* =========================================================
   LINE OF SIGHT
========================================================= */

function lineBlocked(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2 - x1;

    const dz =
        z2 - z1;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    const steps =
        Math.ceil(
            distance /
            .35
        );

    for(
        let i = 1;
        i < steps;
        i++
    ){

        const t =
            i / steps;

        const x =
            x1 + dx*t;

        const z =
            z1 + dz*t;

        if(
            entityHitsWall(
                x,
                z
            )
        ){

            return true;

        }

    }

    return false;
}

/* =========================================================
   ENTITY DIRECTION
========================================================= */

function chooseEntityDirection(){

    if(!entity){
        return null;
    }

    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    const visible =
        !lineBlocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z

        );

    if(visible){

        lastKnownPlayer.set(
            player.position.x,
            player.position.z
        );

        hasLastKnownPosition =
            true;

        lastSeenTimer = 0;

        return {

            x:
                dx /
                Math.max(
                    distance,
                    .001
                ),

            z:
                dz /
                Math.max(
                    distance,
                    .001
                )

        };

    }

    if(
        hasLastKnownPosition &&
        lastSeenTimer < 2.8
    ){

        const lx =
            lastKnownPlayer.x -
            entity.position.x;

        const lz =
            lastKnownPlayer.y -
            entity.position.z;

        const length =
            Math.hypot(
                lx,
                lz
            );

        if(
            length > .1
        ){

            return {

                x:
                    lx /
                    length,

                z:
                    lz /
                    length

            };

        }

    }

    let best = null;

    const targetAngle =
        Math.atan2(
            dz,
            dx
        );

    for(
        let i = 0;
        i < 32;
        i++
    ){

        const angle =
            i /
            32 *
            Math.PI *
            2;

        const dirX =
            Math.cos(
                angle
            );

        const dirZ =
            Math.sin(
                angle
            );

        const testDistance =
            2.4;

        const testX =
            entity.position.x +
            dirX *
            testDistance;

        const testZ =
            entity.position.z +
            dirZ *
            testDistance;

        if(
            entityHitsWall(
                testX,
                testZ
            )
        ){
            continue;
        }

        let angleDifference =
            Math.abs(
                angle -
                targetAngle
            );

        if(
            angleDifference >
            Math.PI
        ){

            angleDifference =
                Math.PI -
                angleDifference;

        }

        const remaining =
            Math.hypot(

                player.position.x -
                testX,

                player.position.z -
                testZ

            );

        const score =
            remaining +
            angleDifference *
            .55;

        if(
            best === null ||
            score < best.score
        ){

            best = {

                x:dirX,
                z:dirZ,
                score:score

            };

        }

    }

    return best;
}

/* =========================================================
   DIFFICULTY
========================================================= */

const DIFFICULTIES = {

    easy:{
        name:"EASY",
        speed:1.5,
        chase:false
    },

    normal:{
        name:"NORMAL",
        speed:5.5,
        chase:true
    },

    hard:{
        name:"HARD",
        speed:7,
        chase:true
    },

    impossible:{
        name:"IMPOSSIBLE",
        speed:9,
        chase:true
    }

};

/* =========================================================
   ANGLE
========================================================= */

function normalizeAngle(
    angle
){

    while(
        angle > Math.PI
    ){

        angle -=
            Math.PI *
            2;

    }

    while(
        angle < -Math.PI
    ){

        angle +=
            Math.PI *
            2;

    }

    return angle;
}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        dead
    ){
        return;
    }

    const settings =
        DIFFICULTIES[
            difficulty
        ];

    lastSeenTimer += dt;

    let direction = null;

    if(
        settings.chase
    ){

        direction =
            chooseEntityDirection();

    }else{

        wanderTimer -= dt;

        if(
            wanderTimer <= 0
        ){

            wanderTimer =
                1 +
                Math.random()*4;

            wanderAngle =
                Math.random() *
                Math.PI *
                2;

        }

        direction = {

            x:
                Math.cos(
                    wanderAngle
                ),

            z:
                Math.sin(
                    wanderAngle
                )

        };

    }

    if(direction){

        const targetAngle =
            Math.atan2(
                direction.z,
                direction.x
            );

        const currentAngle =
            Math.atan2(
                entityDirection.y,
                entityDirection.x
            );

        let difference =
            normalizeAngle(
                targetAngle -
                currentAngle
            );

        const maxTurn =
            2.2 * dt;

        if(
            Math.abs(
                difference
            ) > maxTurn
        ){

            difference =
                Math.sign(
                    difference
                ) *
                maxTurn;

        }

        const newAngle =
            currentAngle +
            difference;

        entityDirection.x =
            Math.cos(
                newAngle
            );

        entityDirection.y =
            Math.sin(
                newAngle
            );

        const desiredX =
            entityDirection.x *
            settings.speed;

        const desiredZ =
            entityDirection.y *
            settings.speed;

        entityVelocity.x =
            THREE.MathUtils.lerp(

                entityVelocity.x,

                desiredX,

                Math.min(
                    1,
                    dt * 2.6
                )

            );

        entityVelocity.y =
            THREE.MathUtils.lerp(

                entityVelocity.y,

                desiredZ,

                Math.min(
                    1,
                    dt * 2.6
                )

            );

    }else{

        entityVelocity.x *=
            Math.pow(
                .08,
                dt
            );

        entityVelocity.y *=
            Math.pow(
                .08,
                dt
            );

    }

    const nx =
        entity.position.x +
        entityVelocity.x *
        dt;

    const nz =
        entity.position.z +
        entityVelocity.y *
        dt;

    if(
        !entityHitsWall(
            nx,
            entity.position.z
        )
    ){

        entity.position.x =
            nx;

    }else{

        entityVelocity.x *=
            .15;

    }

    if(
        !entityHitsWall(
            entity.position.x,
            nz
        )
    ){

        entity.position.z =
            nz;

    }else{

        entityVelocity.y *=
            .15;

    }

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );

    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );

    if(
        distance < 1.15
    ){

        killPlayer();

    }

}

/* =========================================================
   INPUT
========================================================= */

const keys = {

    w:false,
    a:false,
    s:false,
    d:false,
    shift:false

};

let jumpPressed = false;

window.addEventListener(
    "keydown",
    event => {

        switch(
            event.code
        ){

            case "KeyW":
                keys.w = true;
                break;

            case "KeyA":
                keys.a = true;
                break;

            case "KeyS":
                keys.s = true;
                break;

            case "KeyD":
                keys.d = true;
                break;

            case "ShiftLeft":
            case "ShiftRight":
                keys.shift = true;
                break;

            case "Space":

                if(
                    !event.repeat
                ){

                    jumpPressed =
                        true;

                }

                break;

            case "KeyP":

                if(
                    running &&
                    !dead
                ){

                    togglePause();

                }

                break;

            case "Escape":

                if(
                    running &&
                    !dead
                ){

                    togglePause();

                }

                break;

        }

    }
);

window.addEventListener(
    "keyup",
    event => {

        switch(
            event.code
        ){

            case "KeyW":
                keys.w = false;
                break;

            case "KeyA":
                keys.a = false;
                break;

            case "KeyS":
                keys.s = false;
                break;

            case "KeyD":
                keys.d = false;
                break;

            case "ShiftLeft":
            case "ShiftRight":
                keys.shift = false;
                break;

        }

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !running ||
            paused ||
            dead
        ){
            return;
        }

        if(
            document.pointerLockElement !==
            document.body
        ){
            return;
        }

        const sensitivity =
            .0022;

        yaw -=
            event.movementX *
            sensitivity;

        pitch -=
            event.movementY *
            sensitivity;

        const limit =
            Math.PI/2 -
            .05;

        pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);

/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(
    dt
){

    const direction =
        new THREE.Vector3();

    if(keys.w)
        direction.z -= 1;

    if(keys.s)
        direction.z += 1;

    if(keys.a)
        direction.x -= 1;

    if(keys.d)
        direction.x += 1;

    if(
        direction.lengthSq() >
        0
    ){

        direction.normalize();

        direction.applyAxisAngle(

            new THREE.Vector3(
                0,
                1,
                0
            ),

            yaw

        );

        const speed =
            keys.shift
                ? SPRINT_SPEED
                : WALK_SPEED;

        const amount =
            speed * dt;

        const nx =
            player.position.x +
            direction.x *
            amount;

        if(
            !playerCollides(
                nx,
                player.position.z
            )
        ){

            player.position.x =
                nx;

        }

        const nz =
            player.position.z +
            direction.z *
            amount;

        if(
            !playerCollides(
                player.position.x,
                nz
            )
        ){

            player.position.z =
                nz;

        }

    }

    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;

        grounded =
            false;

    }

    jumpPressed =
        false;

    velocityY -=
        GRAVITY *
        dt;

    player.position.y +=
        velocityY *
        dt;

    if(
        player.position.y <= 0
    ){

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;

    }

}

/* =========================================================
   CAMERA
========================================================= */

let cameraTime = 0;

function updateCamera(
    dt
){

    cameraTime += dt;

    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;

    const strength =
        moving
            ? .005
            : .0015;

    camera.position.x =
        Math.sin(
            cameraTime * 3
        ) *
        strength;

    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime * 4
        ) *
        strength;

    camera.rotation.z =
        Math.sin(
            cameraTime * 1.3
        ) *
        .0012;

}

/* =========================================================
   AUDIO
========================================================= */

const entityAudio =
    new Audio(
        AUDIO_URL
    );

entityAudio.loop =
    true;

entityAudio.volume =
    0;

function updateEntityAudio(){

    if(
        !entity ||
        !running ||
        paused ||
        dead
    ){

        entityAudio.volume =
            0;

        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }

        return;
    }

    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );

    const MAX_DISTANCE =
        30;

    if(
        distance >=
        MAX_DISTANCE
    ){

        entityAudio.volume =
            0;

        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }

        return;

    }

    let volume =
        1 -
        distance /
        MAX_DISTANCE;

    volume =
        Math.pow(
            volume,
            1.8
        ) *
        .85;

    if(
        lineBlocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z

        )
    ){

        volume *=
            .18;

    }

    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .85
        );

    if(
        entityAudio.paused &&
        volume > .01
    ){

        entityAudio
            .play()
            .catch(
                () => {}
            );

    }

}
