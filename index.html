<script>
"use strict";

/* =========================================================
   BASIC CHECK
========================================================= */

if(typeof THREE === "undefined"){

    const e =
        document.getElementById("error");

    e.style.display="block";

    e.textContent =
        "THREE.JS IS MISSING.\n\n" +
        "Put three.min.js in the repository root.";

    throw new Error("Three.js missing");

}

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted=false;
let paused=false;
let dead=false;

let difficulty="normal";

let gameTime=0;

/* =========================================================
   RENDERER
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x80774d);

scene.fog =
    new THREE.Fog(
        0x80774d,
        25,
        95
    );

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .04,
        450
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.25
    )
);

if("outputColorSpace" in renderer)
    renderer.outputColorSpace=
        THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.NoToneMapping;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffedb0,
        .38
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xffefb0,
        0x15130e,
        .3
    )
);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE=3;

const WALL_HEIGHT=9;

const PLAYER_RADIUS=.46;

const EYE_HEIGHT=5.25;
const CROUCH_EYE_HEIGHT=3.1;

/*
    The previous sprint speed is now normal walking speed.
*/

const WALK_SPEED=5.6;
const SPRINT_SPEED=8.8;

/*
    Stronger jump lets the player actually clear holes.
*/

const JUMP_SPEED=8.8;

const GRAVITY=23;

/*
    The entity is intentionally very fast on Nightmare.
*/

const ENTITY_SPEED={
    easy:5.3,
    normal:6.4,
    hard:7.7,
    nightmare:9.5
};

/* =========================================================
   TEXTURES
========================================================= */

const loader =
    new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;
let entityTexture=null;

function prepareTexture(
    tex,
    rx,
    ry
){

    tex.colorSpace=
        THREE.SRGBColorSpace;

    tex.wrapS=
        THREE.RepeatWrapping;

    tex.wrapT=
        THREE.RepeatWrapping;

    tex.repeat.set(
        rx,
        ry
    );

    tex.magFilter=
        THREE.LinearFilter;

    tex.minFilter=
        THREE.LinearMipmapLinearFilter;

    tex.anisotropy=
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            4
        );

    tex.needsUpdate=true;

    return tex;
}

function loadTexture(
    path,
    rx,
    ry
){

    return new Promise(
        resolve=>{

            loader.load(
                path,

                tex=>{
                    console.log(
                        "LOADED:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            tex,
                            rx,
                            ry
                        )
                    );
                },

                undefined,

                ()=>{
                    console.warn(
                        "FAILED:",
                        path
                    );

                    resolve(null);
                }
            );

        }
    );

}

async function loadTextures(){

    wallTexture=
        await loadTexture(
            "./textures/wall.png",
            1.1,
            1.1
        );

    floorTexture=
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );

    ceilingTexture=
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

    entityTexture=
        await loadTexture(
            "./entity.png",
            1,
            1
        );

}

/* =========================================================
   MATERIALS
========================================================= */

function wallMaterial(){

    return new THREE.MeshBasicMaterial({

        map:wallTexture,

        color:
            wallTexture
            ?0xffffff
            :0xff00ff,

        side:THREE.DoubleSide

    });

}

function floorMaterial(){

    return new THREE.MeshBasicMaterial({

        map:floorTexture,

        color:
            floorTexture
            ?0xffffff
            :0xff00ff,

        side:THREE.DoubleSide

    });

}

function ceilingMaterial(){

    return new THREE.MeshBasicMaterial({

        map:ceilingTexture,

        color:
            ceilingTexture
            ?0xffffff
            :0xff00ff,

        side:THREE.DoubleSide

    });

}

/* =========================================================
   MAP DATA
========================================================= */

let mapWidth=0;
let mapHeight=0;

let mapData=[];

let playerSpawn=null;
let entitySpawn=null;

const wallColliders=[];

const hidingSpots=[];

const holeCells=[];

const walkableCells=[];

/* =========================================================
   MAP PIXEL CLASSIFICATION
========================================================= */

function classifyPixel(
    r,g,b
){

    if(
        Math.max(r,g,b)<90
    )
        return "wall";

    /*
       RED = PLAYER
    */

    if(
        r>150 &&
        r>g*1.45 &&
        r>b*1.45
    )
        return "spawn";

    /*
       BLUE = ENTITY
    */

    if(
        b>130 &&
        b>r*1.35 &&
        b>g*1.2
    )
        return "entity";

    /*
       PURPLE = HIDE
    */

    if(
        r>120 &&
        b>100 &&
        g<110
    )
        return "hide";

    /*
       YELLOW = HOLE
    */

    if(
        r>150 &&
        g>125 &&
        b<120
    )
        return "hole";

    return "floor";

}

/* =========================================================
   GRID CONVERSION
========================================================= */

function cellToWorld(
    x,y
){

    return {

        x:
            (x+.5)*TILE -
            mapWidth*TILE/2,

        z:
            (y+.5)*TILE -
            mapHeight*TILE/2

    };

}

function worldToCell(
    x,z
){

    return {

        x:
            Math.floor(
                (
                    x+
                    mapWidth*TILE/2
                )/TILE
            ),

        y:
            Math.floor(
                (
                    z+
                    mapHeight*TILE/2
                )/TILE
            )

    };

}

function inBounds(
    x,y
){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function isWalkable(
    x,y
){

    if(!inBounds(x,y))
        return false;

    return (
        mapData[y][x]!=="wall"
    );

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const img=
        await new Promise(
            (resolve,reject)=>{

                const i=
                    new Image();

                i.onload=
                    ()=>resolve(i);

                i.onerror=
                    ()=>reject(
                        new Error(
                            "textures/map1.png failed to load."
                        )
                    );

                i.src=
                    "./textures/map1.png?v="+
                    Date.now();

            }
        );

    mapWidth=
        img.naturalWidth;

    mapHeight=
        img.naturalHeight;

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=
        mapWidth;

    canvas.height=
        mapHeight;

    const ctx=
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        img,
        0,
        0
    );

    const pixels=
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row=[];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i=
                (y*mapWidth+x)*4;

            const type=
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2]
                );

            row.push(type);

            if(
                type!=="wall"
            ){

                walkableCells.push({
                    x,
                    y
                });

            }

            if(
                type==="hole"
            ){

                holeCells.push({
                    x,
                    y
                });

            }

            if(
                type==="hide"
            ){

                hidingSpots.push({
                    x,
                    y
                });

            }

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

        mapData.push(row);

    }

    /*
       Find fallback player spawn.
    */

    if(!playerSpawn){

        const c=
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        playerSpawn=
            cellToWorld(
                c.x,
                c.y
            );

    }

    if(!entitySpawn){

        /*
           Start far away.
        */

        entitySpawn=
            cellToWorld(
                Math.min(
                    mapWidth-1,
                    Math.max(
                        0,
                        Math.floor(
                            mapWidth*.8
                        )
                    )
                ),
                Math.min(
                    mapHeight-1,
                    Math.max(
                        0,
                        Math.floor(
                            mapHeight*.8
                        )
                    )
            );

    }

}

/*
    Each hole cell is a real recessed shaft.

    IMPORTANT:
    There is NO floor plane at y=0 for a hole.

    The ceiling is still created above it.
*/

const HOLE_DEPTH=7;

function addHole(
    x,z
){

    /*
       Dark shaft bottom.
    */

    const bottom=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            new THREE.MeshBasicMaterial({
                map:floorTexture,
                color:0x55503b,
                side:THREE.DoubleSide
            })

        );

    bottom.rotation.x=
        -Math.PI/2;

    bottom.position.set(
        x,
        -HOLE_DEPTH,
        z
    );

    world.add(bottom);

    /*
       Four vertical sides make the opening visibly 3D.
    */

    const sideMaterial=
        wallMaterial();

    const sideThickness=.12;

    const north=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                HOLE_DEPTH,
                sideThickness
            ),
            sideMaterial
        );

    north.position.set(
        x,
        -HOLE_DEPTH/2,
        z-TILE/2
    );

    world.add(north);

    const south=
        north.clone();

    south.position.z=
        z+TILE/2;

    world.add(south);

    const east=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sideThickness,
                HOLE_DEPTH,
                TILE
            ),
            sideMaterial
        );

    east.position.set(
        x+TILE/2,
        -HOLE_DEPTH/2,
        z
    );

    world.add(east);

    const west=
        east.clone();

    west.position.x=
        x-TILE/2;

    world.add(west);

    /*
       Slight dark lip around the opening.
    */

    const lipMaterial=
        new THREE.MeshBasicMaterial({
            color:0x292619
        });

    const lip=[
        [TILE,.08,.08,x,z-TILE/2],
        [TILE,.08,.08,x,z+TILE/2],
        [.08,.08,TILE,x-TILE/2,z],
        [.08,.08,TILE,x+TILE/2,z]
    ];

    for(
        const l of lip
    ){

        const m=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    l[0],
                    l[1],
                    l[2]
                ),
                lipMaterial
            );

        m.position.set(
            l[3],
            .01,
            l[4]
        );

        world.add(m);

    }

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type=
                mapData[y][x];

            const p=
                cellToWorld(
                    x,
                    y
                );

            if(type==="wall"){

                addWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
               Ceiling ALWAYS exists.
            */

            addCeiling(
                p.x,
                p.z
            );

            /*
               Holes have no normal floor.
            */

            if(type==="hole"){

                addHole(
                    p.x,
                    p.z
                );

                continue;

            }

            addFloor(
                p.x,
                p.z
            );

        }

    }

    /*
       Add lockers only after the normal geometry.
    */

    for(
        const spot of hidingSpots
    ){

        const p=
            cellToWorld(
                spot.x,
                spot.y
            );

        addLocker(
            p.x,
            p.z
        );

    }

}

/* =========================================================
   PLAYER
========================================================= */

const player=
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.y=
    EYE_HEIGHT;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=true;
let falling=false;
let fallTimer=0;

let crouching=false;
let hidden=false;

const keys={};

/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,z
){

    const r=
        PLAYER_RADIUS;

    for(
        const wall of wallColliders
    ){

        if(
            x+r>wall.minX &&
            x-r<wall.maxX &&
            z+r>wall.minZ &&
            z-r<wall.maxZ
        )
            return true;

    }

    return false;

}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(
    dx,dz
){

    const nx=
        player.position.x+dx;

    const nz=
        player.position.z+dz;

    if(
        !collides(
            nx,
            player.position.z
        )
    ){

        player.position.x=
            nx;

    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){

        player.position.z=
            nz;

    }

}

/* =========================================================
   HOLE HITBOX
========================================================= */

function footprintIsOverHole(){

    /*
       Entire hitbox must be inside hole cells.

       Four corners are checked.
    */

    const r=
        PLAYER_RADIUS*.92;

    const points=[
        [r,r],
        [r,-r],
        [-r,r],
        [-r,-r]
    ];

    for(
        const p of points
    ){

        const c=
            worldToCell(
                player.position.x+p[0],
                player.position.z+p[1]
            );

        if(
            !inBounds(
                c.x,
                c.y
            )
        )
            return false;

        if(
            mapData[c.y][c.x]!=="hole"
        )
            return false;

    }

    return true;

}

function checkHole(){

    /*
       Never fall while jumping.

       This lets the player clear holes.
    */

    if(
        falling ||
        !grounded
    )
        return;

    if(
        footprintIsOverHole()
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest=null;
    let closestDistance=Infinity;

    for(
        const spot of hidingSpots
    ){

        const p=
            cellToWorld(
                spot.x,
                spot.y
            );

        const d=
            Math.hypot(
                player.position.x-p.x,
                player.position.z-p.z
            );

        if(
            d<closestDistance
        ){

            closestDistance=d;
            closest=spot;

        }

    }

    /*
       Locker interaction.

       Crouching near one makes you hidden.
    */

    const near=
        closest &&
        closestDistance<
        TILE*.7;

    hidden=
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity=
        near&&!hidden
        ?"1"
        :"0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity=
        hidden
        ?"1"
        :"0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted||
        paused||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const p=
            Math.min(
                fallTimer/1.7,
                1
            );

        player.position.y=
            -p*7;

        camera.position.y=
            EYE_HEIGHT-p*1.5;

        camera.rotation.z=
            Math.sin(
                fallTimer*13
            )*.035;

        if(
            fallTimer>=1.7
        ){

            die(
                "YOU FELL INTO THE LEVEL."
            );

        }

        return;

    }

    crouching=
        !!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w)
        forward++;

    if(keys.s)
        forward--;

    if(keys.d)
        strafe++;

    if(keys.a)
        strafe--;

    const length=
        Math.hypot(
            forward,
            strafe
        );

    if(length>0){

        forward/=length;
        strafe/=length;

        const sprinting=
            keys.shift &&
            !crouching;

        const speed=
            sprinting
            ?SPRINT_SPEED
            :crouching
            ?WALK_SPEED*.55
            :WALK_SPEED;

        const sin=
            Math.sin(yaw);

        const cos=
            Math.cos(yaw);

        const dx=
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz=
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    /*
       Gravity.
    */

    velocityY-=
        GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;

        velocityY=0;

        grounded=true;

    }else{

        grounded=false;

    }

    /*
       Jumping works while sprinting.
    */

    if(
        keys.space &&
        !keys.spaceUsed &&
        grounded &&
        !crouching
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;

        keys.spaceUsed=true;

    }

    const targetEye=
        crouching
        ?CROUCH_EYE_HEIGHT
        :EYE_HEIGHT;

    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            targetEye,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();

    checkHole();

}

/* =========================================================
   A* PATHFINDING
========================================================= */

function heuristic(a,b){

    return Math.abs(
        a.x-b.x
    )+
    Math.abs(
        a.y-b.y
    );

}

function findBestPath(
    start,
    goal
){

    if(
        !isWalkable(
            goal.x,
            goal.y
        )
    )
        return [];

    const open=[];

    const came=
        new Map();

    const gScore=
        new Map();

    const fScore=
        new Map();

    const key=
        (x,y)=>
            x+","+y;

    const startKey=
        key(
            start.x,
            start.y
        );

    gScore.set(
        startKey,
        0
    );

    fScore.set(
        startKey,
        heuristic(
            start,
            goal
        )
    );

    open.push({
        x:start.x,
        y:start.y
    });

    /*
       Four-direction movement is intentional.

       It gives the entity the same corridor-style
       movement as the map.
    */

    const dirs=[
        [1,0],
        [-1,0],
        [0,1],
        [0,-1]
    ];

    let iterations=0;

    while(
        open.length &&
        iterations<12000
    ){

        iterations++;

        let bestIndex=0;

        for(
            let i=1;
            i<open.length;
            i++
        ){

            const a=
                fScore.get(
                    key(
                        open[i].x,
                        open[i].y
                    )
                )??Infinity;

            const b=
                fScore.get(
                    key(
                        open[bestIndex].x,
                        open[bestIndex].y
                    )
                )??Infinity;

            if(a<b)
                bestIndex=i;

        }

        const current=
            open.splice(
                bestIndex,
                1
            )[0];

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            const path=[];

            let c=current;

            while(c){

                path.unshift(c);

                c=
                    came.get(
                        key(
                            c.x,
                            c.y
                        )
                    );

            }

            return path;

        }

        for(
            const d of dirs
        ){

            const nx=
                current.x+d[0];

            const ny=
                current.y+d[1];

            if(
                !isWalkable(
                    nx,
                    ny
                )
            )
                continue;

            const neighborKey=
                key(
                    nx,
                    ny
                );

            const tentative=
                (
                    gScore.get(
                        key(
                            current.x,
                            current.y
                        )
                    )??Infinity
                )+1;

            if(
                tentative<
                (
                    gScore.get(
                        neighborKey
                    )??Infinity
                )
            ){

                came.set(
                    neighborKey,
                    current
                );

                gScore.set(
                    neighborKey,
                    tentative
                );

                fScore.set(
                    neighborKey,
                    tentative+
                    heuristic(
                        {
                            x:nx,
                            y:ny
                        },
                        goal
                    )
                );

                if(
                    !open.some(
                        p=>
                            p.x===nx &&
                            p.y===ny
                    )
                ){

                    open.push({
                        x:nx,
                        y:ny
                    });

                }

            }

        }

    }

    return [];

}

/* =========================================================
   ENTITY
========================================================= */

let entity=null;

let entityPath=[];

let entityPathIndex=0;

let entityPathTimer=0;

let entityLastX=0;
let entityLastZ=0;

let entityStuckTimer=0;

let entityAudio=null;

function createEntity(){

    const material=
        new THREE.MeshBasicMaterial({

            map:entityTexture,

            transparent:true,

            alphaTest:.01,

            side:THREE.DoubleSide,

            depthWrite:true

        });

    /*
       IMPORTANT:
       No shrinking/stretching.

       The PNG is displayed using a fixed aspect
       ratio based on the actual image.
    */

    let aspect=1;

    if(
        entityTexture &&
        entityTexture.image
    ){

        const w=
            entityTexture.image.width;

        const h=
            entityTexture.image.height;

        if(
            w&&h
        )
            aspect=
                w/h;

    }

    const height=6.4;

    const width=
        height*aspect;

    entity=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            material

        );

    entity.position.set(
        entitySpawn.x,
        height/2,
        entitySpawn.z
    );

    world.add(entity);

    entityLastX=
        entity.position.x;

    entityLastZ=
        entity.position.z;

}

/* =========================================================
   ENTITY PATH UPDATE
========================================================= */

function updateEntityPath(){

    if(
        !entity||
        !player
    )
        return;

    const start=
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const goal=
        worldToCell(
            player.position.x,
            player.position.z
        );

    if(
        !inBounds(
            start.x,
            start.y
        )||
        !inBounds(
            goal.x,
            goal.y
        )
    )
        return;

    entityPath=
        findBestPath(
            start,
            goal
        );

    /*
       Start moving toward the next cell.
    */

    entityPathIndex=
        entityPath.length>1
        ?1
        :0;

}

/* =========================================================
   ENTITY TELEPORT RECOVERY
========================================================= */

function teleportEntityNearPlayer(){

    const playerCell=
        worldToCell(
            player.position.x,
            player.position.z
        );

    /*
       "20 pixels" refers to map pixels.

       The entity must be at least 20 map pixels
       from the player's map cell.
    */

    const MIN_MAP_DISTANCE=20;

    let best=null;
    let bestDistance=-Infinity;

    /*
       Search a bounded set of walkable cells.
    */

    for(
        let i=0;
        i<walkableCells.length;
        i+=3
    ){

        const c=
            walkableCells[i];

        const dx=
            c.x-playerCell.x;

        const dy=
            c.y-playerCell.y;

        const distance=
            Math.hypot(
                dx,
                dy
            );

        if(
            distance<
            MIN_MAP_DISTANCE
        )
            continue;

        if(
            distance>
            bestDistance
        ){

            bestDistance=
                distance;

            best=c;

        }

    }

    if(!best)
        return;

    const p=
        cellToWorld(
            best.x,
            best.y
        );

    entity.position.set(
        p.x,
        3.2,
        p.z
    );

    entityStuckTimer=0;

    updateEntityPath();

    showMessage(
        "SOMETHING MOVED."
    );

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    if(
        !entity||
        paused||
        dead
    )
        return;

    /*
       The entity ALWAYS knows the player.

       Recalculate every .25 sec rather than every frame.
       This saves a lot of CPU.
    */

    entityPathTimer-=dt;

    if(
        entityPathTimer<=0
    ){

        entityPathTimer=.25;

        updateEntityPath();

    }

    if(
        entityPath.length<=1||
        entityPathIndex>=entityPath.length
    ){

        updateEntityPath();

        return;

    }

    const targetCell=
        entityPath[
            entityPathIndex
        ];

    const target=
        cellToWorld(
            targetCell.x,
            targetCell.y
        );

    let dx=
        target.x-
        entity.position.x;

    let dz=
        target.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    if(
        distance<.18
    ){

        entityPathIndex++;

        return;

    }

    dx/=distance;
    dz/=distance;

    const speed=
        ENTITY_SPEED[
            difficulty
        ];

    const oldX=
        entity.position.x;

    const oldZ=
        entity.position.z;

    const nx=
        oldX+
        dx*speed*dt;

    const nz=
        oldZ+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz
        )
    ){

        entity.position.x=nx;
        entity.position.z=nz;

    }else{

        /*
           Path became invalid.

           Immediately calculate another route.
        */

        entityPathTimer=0;

    }

    /*
       Stuck detector.
    */

    const movement=
        Math.hypot(
            entity.position.x-
            entityLastX,

            entity.position.z-
            entityLastZ
        );

    if(
        movement<.015
    ){

        entityStuckTimer+=dt;

    }else{

        entityStuckTimer=0;

    }

    entityLastX=
        entity.position.x;

    entityLastZ=
        entity.position.z;

    if(
        entityStuckTimer>2.2
    ){

        teleportEntityNearPlayer();

    }

    /*
       Billboard toward camera.

       The PNG itself is not stretched.
    */

    entity.lookAt(
        camera.position.x,
        entity.position.y,
        camera.position.z
    );

    /*
       Kill distance.
    */

    const playerDistance=
        Math.hypot(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    if(
        playerDistance<1.05 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

    updateEntityAudio(
        playerDistance
    );

}

/* =========================================================
   ENTITY AUDIO
========================================================= */

function initializeEntityAudio(){

    entityAudio=
        new Audio(
            "./sounds/entity.mp3"
        );

    entityAudio.loop=true;

    entityAudio.preload="auto";

    /*
       Start muted until the game begins.
    */

    entityAudio.volume=0;

}

function updateEntityAudio(
    distance
){

    if(!entityAudio)
        return;

    /*
       Sound begins when relatively close.

       Far away = silent.

       Very close = loud.
    */

    const HEAR_DISTANCE=28;

    let volume=
        1-
        (
            distance/
            HEAR_DISTANCE
        );

    volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    /*
       Slightly smoother curve.
    */

    volume=
        volume*volume;

    entityAudio.volume=
        volume;

    /*
       Video is the exact inverse.
    */

    const overlayVolume=
        1-volume;

    overlayVideo.volume=
        THREE.MathUtils.clamp(
            overlayVolume,
            0,
            1
        );

    /*
       Don't continuously call play().
    */

    if(
        volume>.01 &&
        entityAudio.paused
    ){

        entityAudio.play()
            .catch(
                ()=>{}
            );

    }

    if(
        volume<=.01 &&
        !entityAudio.paused
    ){

        entityAudio.pause();

    }

}

/* =========================================================
   VIDEO
========================================================= */

const overlayVideo=
    document.getElementById(
        "overlayVideo"
    );

/*
   The MP4 is intentionally muted at the HTML level
   and controlled manually.
*/

overlayVideo.muted=false;

overlayVideo.volume=1;

function startOverlayVideo(){

    overlayVideo.volume=1;

    overlayVideo.play()
        .catch(
            ()=>{
                /*
                   Browsers may require the first
                   playback to happen after a user click.
                   startGame() is called by a click, so
                   this normally succeeds.
                */
            }
        );

}

function stopOverlayVideo(){

    overlayVideo.pause();

    overlayVideo.currentTime=0;

}

   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"

        "death"

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=
        text;

    messageTimer=2.5;

}

function updateMessage(dt){

    if(
        messageTimer>0
    ){

        messageTimer-=dt;

        if(
            messageTimer<=0
        ){

            document.getElementById(
                "message"
            ).textContent="";

        }

    }

}

/* =========================================================
   RESET
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

        EYE_HEIGHT;

    velocityY=0;

/* =========================================================
   START
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    gameTime=0;

    resetPlayer();

    if(entity){

        world.remove(entity);

        if(entity.geometry)
            entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;

    }

    createEntity();

    entityPathTimer=0;

    /*
       Start the video at full volume.

       As the entity approaches,
       entity audio takes over.
    */

    overlayVideo.volume=1;

    startOverlayVideo();

    if(entityAudio){

        entityAudio.volume=0;

        /*
           The audio is allowed to start silently,
           then volume increases based on distance.
        */

        entityAudio.play()
            .catch(
                ()=>{}
            );

    }

    renderer.domElement
        .requestPointerLock();

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ?"flex"
        :"none";

    if(paused){

        if(
            document.pointerLockElement
        )
            document.exitPointerLock();

        /*
           Keep video/audio state but don't
           update proximity while paused.
        */

    }else{

        renderer.domElement
            .requestPointerLock();

    }

}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="none";

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        const key=
            e.key.toLowerCase();

        keys[key]=true;

        if(
            e.code==="Space"
        ){

            e.preventDefault();

            keys.space=true;

        }

        if(
            key==="escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();

                return;

            }

            if(gameStarted)
                togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    e=>{

        const key=
            e.key.toLowerCase();

        keys[key]=false;

        if(
            e.code==="Space"
        ){

            keys.space=false;
            keys.spaceUsed=false;

        }

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            !gameStarted||
            paused||
            dead||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            e.movementX*.0021;

        pitch-=
            e.movementY*.0018;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted&&
            !paused&&
            !dead
        ){

            renderer.domElement
                .requestPointerLock();

        }

    }
);

const difficultyButtons={

/* =========================================================
   MENU IMAGES
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(!menuImages.length)
            return;

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%

        menuImages[

        ].classList.add(

        );

    },

/* =========================================================
   TAPE TIME
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted||
        paused||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(
            gameTime
        );

    const h=
        Math.floor(
            total/3600
        );

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const f=
        n=>
            String(n)
                .padStart(
                    2,
                    "0"
                );

    document.getElementById(
        "tapeTime"
    ).textContent=
        f(h)+":"+f(m)+":"+f(s);

}

/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .05
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateLights(dt);
    updateMessage(dt);
    updateTapeTime(dt);

    /*
       Video volume is continuously matched to
       entity distance.

       This also makes the overlay become quieter
       naturally as the entity approaches.
    */

    if(
        gameStarted&&
        entity
    ){

        const distance=
            Math.hypot(

                player.position.x-
                entity.position.x,

                player.position.z-
                entity.position.z

            );

        updateEntityAudio(
            distance
        );

    }

    renderer.render(
        scene,
        camera
    );

}

animate();
