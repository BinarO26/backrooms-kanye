<script type="module">

import * as THREE from "three";


/* =========================================================
   THREE.JS
========================================================= */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    .05,
    350
);

camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Object3D();

scene.add(player);
player.add(camera);

camera.position.set(
    0,
    0,
    0
);

let yaw=0;
let pitch=0;

const PLAYER_RADIUS=.38;
const EYE_HEIGHT=1.65;
const HEAD_HEIGHT=.30;

const WALK_SPEED=4.5;
const SPRINT_SPEED=7.5;
const JUMP_SPEED=7.5;
const GRAVITY=20;

let velocityY=0;
let grounded=true;
let falling=false;

let stamina=100;


/* =========================================================
   GAME STATE
========================================================= */

let currentLevel="backrooms";
let gameStarted=false;
let paused=false;

let world=[];
let wallColliders=[];
let floorAreas=[];

let entity=null;
let entityStuck=0;

const clock=new THREE.Clock();


/* =========================================================
   INPUT
========================================================= */

const keys={};
let jumpPressed=false;

addEventListener("keydown",e=>{

    const k=e.key.toLowerCase();

    keys[k]=true;

    if(e.code==="Space"){

        e.preventDefault();

        /*
           Important:
           only one jump for each press.
        */

        if(!e.repeat)
            jumpPressed=true;
    }

    if(
        e.code==="Escape" ||
        k==="p"
    ){

        if(gameStarted)
            togglePause();
    }
});


addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;
});


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement !==
            document.body
        ){
            return;
        }

        yaw-=e.movementX*.002;
        pitch-=e.movementY*.002;

        pitch=THREE.MathUtils.clamp(
            pitch,
            -Math.PI/2.1,
            Math.PI/2.1
        );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;
    }
);


/* =========================================================
   MATERIAL
========================================================= */

function material(
    color,
    roughness=1
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness
    });
}


/* =========================================================
   WORLD MANAGEMENT
========================================================= */

function addWorld(obj){

    scene.add(obj);
    world.push(obj);

    return obj;
}


function addWallCollider(obj){

    wallColliders.push(
        new THREE.Box3().setFromObject(obj)
    );
}


function makeBox(
    w,
    h,
    d,
    x,
    y,
    z,
    mat,
    solid=true
){

    const obj=new THREE.Mesh(
        new THREE.BoxGeometry(
            w,
            h,
            d
        ),
        mat
    );

    obj.position.set(
        x,
        y,
        z
    );

    addWorld(obj);

    if(solid)
        addWallCollider(obj);

    return obj;
}


/*
   Floors are NOT added to wallColliders.

   This is the important fix that allows WASD
   movement to work correctly.
*/

function makeFloor(
    w,
    d,
    y,
    mat
){

    const obj=new THREE.Mesh(
        new THREE.PlaneGeometry(
            w,
            d
        ),
        mat
    );

    obj.rotation.x=-Math.PI/2;
    obj.position.y=y;

    addWorld(obj);

    floorAreas.push({
        minX:-w/2,
        maxX:w/2,
        minZ:-d/2,
        maxZ:d/2,
        y:y
    });

    return obj;
}


/* =========================================================
   FLOOR CHECK
========================================================= */

function getFloorY(
    x,
    z,
    currentY
){

    let best=0;

    for(
        const floor of floorAreas
    ){

        if(
            x>=floor.minX &&
            x<=floor.maxX &&
            z>=floor.minZ &&
            z<=floor.maxZ &&
            floor.y<=currentY+.8
        ){

            best=Math.max(
                best,
                floor.y
            );
        }
    }

    return best;
}


/* =========================================================
   PLAYER WALL COLLISION
========================================================= */

function playerHitsWall(pos){

    /*
       Player's vertical body range.
    */

    const bottom=
        pos.y-EYE_HEIGHT;

    const top=
        pos.y+HEAD_HEIGHT;


    for(
        const b of wallColliders
    ){

        /*
           Ignore things that are not
           vertically touching the player.
        */

        if(
            top<=b.min.y ||
            bottom>=b.max.y
        ){
            continue;
        }


        /*
           Circle vs rectangle.
        */

        const closestX=
            Math.max(
                b.min.x,
                Math.min(
                    pos.x,
                    b.max.x
                )
            );

        const closestZ=
            Math.max(
                b.min.z,
                Math.min(
                    pos.z,
                    b.max.z
                )
            );

        const dx=
            pos.x-closestX;

        const dz=
            pos.z-closestZ;


        if(
            dx*dx+dz*dz <
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){

            return true;
        }
    }

    return false;
}


/* =========================================================
   CEILING
========================================================= */

function getCeiling(
    x,
    z,
    headHeight
){

    let closest=null;

    for(
        const b of wallColliders
    ){

        if(
            x>=b.min.x-PLAYER_RADIUS &&
            x<=b.max.x+PLAYER_RADIUS &&
            z>=b.min.z-PLAYER_RADIUS &&
            z<=b.max.z+PLAYER_RADIUS &&
            b.min.y>headHeight
        ){

            if(
                closest===null ||
                b.min.y<closest
            ){

                closest=b.min.y;
            }
        }
    }

    return closest;
}


/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(pos){

    const radius=.42;

    const bottom=
        pos.y-1.7;

    const top=
        pos.y+1.7;


    for(
        const b of wallColliders
    ){

        if(
            top<=b.min.y ||
            bottom>=b.max.y
        ){
            continue;
        }


        const closestX=
            Math.max(
                b.min.x,
                Math.min(
                    pos.x,
                    b.max.x
                )
            );

        const closestZ=
            Math.max(
                b.min.z,
                Math.min(
                    pos.z,
                    b.max.z
                )
            );

        const dx=
            pos.x-closestX;

        const dz=
            pos.z-closestZ;


        if(
            dx*dx+dz*dz <
            radius*radius
        ){
            return true;
        }
    }

    return false;
}


/* =========================================================
   TEXTURES
========================================================= */

function createWallpaper(){

    const canvas=
        document.createElement("canvas");

    canvas.width=1024;
    canvas.height=1024;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle="#c5b64c";
    ctx.fillRect(
        0,0,1024,1024
    );


    /*
       Old dirty wallpaper texture.
    */

    for(let i=0;i<65000;i++){

        const v=
            Math.random()*35;

        ctx.fillStyle=
            `rgba(
                ${115+v},
                ${105+v},
                35,
                .12
            )`;

        ctx.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            1+Math.random()*3,
            1+Math.random()*3
        );
    }


    /*
       Vertical seams / imperfections.
    */

    for(let i=0;i<70;i++){

        const x=
            Math.random()*1024;

        ctx.strokeStyle=
            "rgba(55,45,5,.14)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x+
            Math.random()*30-
            15,
            1024
        );

        ctx.stroke();
    }


    const texture=
        new THREE.CanvasTexture(
            canvas
        );

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(
        3,
        3
    );

    return texture;
}


function createCarpet(){

    const canvas=
        document.createElement("canvas");

    canvas.width=1024;
    canvas.height=1024;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle="#555753";

    ctx.fillRect(
        0,0,1024,1024
    );


    for(let i=0;i<90000;i++){

        const v=
            60+
            Math.random()*55;

        ctx.fillStyle=
            `rgba(
                ${v},
                ${v},
                ${v},
                .10
            )`;

        ctx.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            1+Math.random()*3,
            1+Math.random()*2
        );
    }


    /*
       Damp-looking patches.
    */

    for(let i=0;i<100;i++){

        const x=
            Math.random()*1024;

        const y=
            Math.random()*1024;

        const r=
            15+
            Math.random()*60;

        const gradient=
            ctx.createRadialGradient(
                x,y,0,
                x,y,r
            );

        gradient.addColorStop(
            0,
            "rgba(20,25,22,.30)"
        );

        gradient.addColorStop(
            1,
            "rgba(20,25,22,0)"
        );

        ctx.fillStyle=gradient;

        ctx.beginPath();

        ctx.arc(
            x,y,r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    const texture=
        new THREE.CanvasTexture(
            canvas
        );

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(
        4,
        4
    );

    return texture;
}


/* =========================================================
   LIGHT
========================================================= */

function fluorescent(
    x,
    y,
    z
){

    makeBox(
        2.4,
        .07,
        .38,
        x,
        y,
        z,
        new THREE.MeshBasicMaterial({
            color:0xffffd2
        }),
        false
    );

    const light=
        new THREE.PointLight(
            0xffe9a0,
            2.3,
            17
        );

    light.position.set(
        x,
        y-.15,
        z
    );

    addWorld(light);
}


/* =========================================================
   LEVEL 0
========================================================= */

function buildBackrooms(){

    currentLevel="backrooms";

    document.getElementById(
        "level"
    ).textContent=
        "LEVEL 0 — BACKROOMS";


    scene.background=
        new THREE.Color(
            0x18160b
        );

    scene.fog=
        new THREE.Fog(
            0x18160b,
            12,
            100
        );


    scene.add(
        new THREE.AmbientLight(
            0xffe8a0,
            1.55
        )
    );


    const wallpaper=
        new THREE.MeshStandardMaterial({
            map:createWallpaper(),
            roughness:1
        });


    const carpet=
        new THREE.MeshStandardMaterial({
            map:createCarpet(),
            roughness:1
        });


    /*
       Huge Level 0 floor.

       IMPORTANT:
       This is a floor, NOT a wall collider.
    */

    makeFloor(
        180,
        160,
        0,
        carpet
    );


    /*
       Outer walls.
    */

    makeBox(
        180,4.2,1,
        0,2.1,-80,
        wallpaper
    );

    makeBox(
        180,4.2,1,
        0,2.1,80,
        wallpaper
    );

    makeBox(
        1,4.2,160,
        -90,2.1,0,
        wallpaper
    );

    makeBox(
        1,4.2,160,
        90,2.1,0,
        wallpaper
    );


    /*
       Ceiling.
    */

    makeBox(
        180,.15,160,
        0,4.2,0,
        material(0x999045),
        false
    );


    /*
       ICONIC LONG HALLS
    */

    const halls=[
        [-55,0,1,100],
        [55,0,1,100],

        [-25,-25,1,65],
        [25,25,1,65],

        [0,-52,65,1],
        [0,52,65,1],

        [-55,32,45,1],
        [55,-32,45,1],

        [-38,-10,30,1],
        [38,10,30,1],

        [-70,-48,1,35],
        [70,48,1,35]
    ];


    for(
        const h of halls
    ){

        makeBox(
            h[2],
            4.2,
            h[3],
            h[0],
            2.1,
            h[1],
            wallpaper
        );
    }


    /*
       LARGE OPEN SPACE.
    */

    makeOpenRoom(
        -25,
        28,
        48,
        38,
        wallpaper
    );


    /*
       FOUND-FOOTAGE STYLE COLUMN GRID.

       Columns are positioned at the corners
       of repeating square spaces.
    */

    makeColumnGrid(
        -47,
        -7,
        6,
        6,
        7,
        wallpaper
    );


    /*
       SECOND COLUMN AREA.
    */

    makeColumnGrid(
        40,
        30,
        5,
        5,
        7,
        wallpaper
    );


    /*
       Iconic long corridor area.
    */

    makeBox(
        1,
        4.2,
        50,
        -72,
        2.1,
        25,
        wallpaper
    );


    makeBox(
        50,
        4.2,
        1,
        -47,
        2.1,
        49,
        wallpaper
    );


    /*
       DEADLY GRID.

       This is placed inside the map.
    */

    makeDeathGrid(
        57,
        -62,
        4,
        4,
        carpet
    );


    /*
       Fluorescent ceiling lights.
    */

    for(
        let x=-80;
        x<=80;
        x+=10
    ){

        for(
            let z=-70;
            z<=70;
            z+=12
        ){

            fluorescent(
                x,
                4.03,
                z
            );
        }
    }


    /*
       Player spawn.
    */

    player.position.set(
        -70,
        EYE_HEIGHT,
        -62
    );

    yaw=0;
    pitch=0;

    player.rotation.y=yaw;
    camera.rotation.x=pitch;


    createEntity(
        45,
        45
    );
}


/* =========================================================
   COLUMN GRID
========================================================= */

function makeColumnGrid(
    startX,
    startZ,
    countX,
    countZ,
    spacing,
    mat
){

    for(
        let x=0;
        x<countX;
        x++
    ){

        for(
            let z=0;
            z<countZ;
            z++
        ){

            makeBox(
                .8,
                4,
                .8,
                startX+x*spacing,
                2,
                startZ+z*spacing,
                mat
            );
        }
    }
}


/* =========================================================
   OPEN ROOM
========================================================= */

function makeOpenRoom(
    x,
    z,
    width,
    depth,
    mat
){

    makeBox(
        width,
        4.2,
        1,
        x,
        2.1,
        z-depth/2,
        mat
    );

    makeBox(
        width,
        4.2,
        1,
        x,
        2.1,
        z+depth/2,
        mat
    );

    makeBox(
        1,
        4.2,
        depth,
        x-width/2,
        2.1,
        z,
        mat
    );

    makeBox(
        1,
        4.2,
        depth,
        x+width/2,
        2.1,
        z,
        mat
    );
}


/* =========================================================
   DEATH GRID
========================================================= */

const deathHoles=[];

function makeDeathGrid(
    startX,
    startZ,
    countX,
    countZ,
    carpet
){

    const tile=3.5;
    const gap=.65;


    /*
       Make the grid visually obvious.
    */

    for(
        let x=0;
        x<countX;
        x++
    ){

        for(
            let z=0;
            z<countZ;
            z++
        ){

            const px=
                startX+
                x*(tile+gap)+
                tile/2;

            const pz=
                startZ+
                z*(tile+gap)+
                tile/2;


            /*
               Raised carpet island.
            */

            makeBox(
                tile,
                .16,
                tile,
                px,
                .08,
                pz,
                carpet,
                false
            );


            /*
               Black square below the opening.
            */

            const hole=
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        tile-.15,
                        tile-.15
                    ),
                    new THREE.MeshBasicMaterial({
                        color:0x000000
                    })
                );

            hole.rotation.x=
                -Math.PI/2;

            hole.position.set(
                px,
                -.15,
                pz
            );

            addWorld(hole);


            deathHoles.push({
                x:px,
                z:pz,
                size:tile-.15
            });
        }
    }
}


/* =========================================================

========================================================= */

function buildHotel(){

    currentLevel="hotel";

    document.getElementById(

    scene.background=
        new THREE.Color(

        );

    scene.fog=
        new THREE.Fog(
            0x090c0e,
            18,
            150
        );


    scene.add(
        new THREE.AmbientLight(
            0x9ba5ad,
            .8
        )
    );


    const concrete=
        material(
            0x77746e,
            .95
        );

    const dark=
        material(
            0x363735,
            .9
        );

    const grass=
        material(
            0x263a20,
            1
        );

    const courtyard=
        material(
            0x615e57,
            1
        );

    const roomFloor=
        material(
            0x4d4b47,
            1
        );


    /*

/* =========================================================
   ENTITY
========================================================= */

const entityTexture=
    new THREE.TextureLoader().load(
        "./entity.png"
    );

entityTexture.colorSpace=
    THREE.SRGBColorSpace;


const entitySound=
    new Audio(
        "./entity.mp3"
    );

entitySound.loop=true;
entitySound.volume=0;


function createEntity(
    x,
    z
){

    if(entity)
        scene.remove(entity);


    entity=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                1.8,
                3.4
            ),
            new THREE.MeshBasicMaterial({
                map:entityTexture,
                transparent:true,
                side:THREE.DoubleSide
            })
        );


    entity.position.set(
        x,
        1.7,
        z
    );


    addWorld(entity);

    entityStuck=0;
}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(delta){

    if(!entity)
        return;


    const target=
        new THREE.Vector3(
            player.position.x,
            entity.position.y,
            player.position.z
        );


    const direction=
        target.sub(
            entity.position
        );

    direction.y=0;


    const distance=
        direction.length();


    if(distance>.2){

        direction.normalize();


        /*
           Entity speed is exactly sprint speed.
        */

        const speed=
            SPRINT_SPEED;


        const movement=
            direction.clone()
            .multiplyScalar(
                speed*delta
            );


        const next=
            entity.position.clone()
            .add(movement);


        if(
            !entityHitsWall(next)
        ){

            entity.position.copy(
                next
            );

            entityStuck=0;

        }else{

            /*
               Slide left.
            */

            const left=
                new THREE.Vector3(
                    -direction.z,
                    0,
                    direction.x
                );


            const leftPos=
                entity.position.clone()
                .add(
                    left.multiplyScalar(
                        speed*delta
                    )
                );


            /*
               Slide right.
            */

            const right=
                left.clone().negate();


            const rightPos=
                entity.position.clone()
                .add(
                    right.multiplyScalar(
                        speed*delta
                    )
                );


            if(
                !entityHitsWall(leftPos)
            ){

                entity.position.copy(
                    leftPos
                );

                entityStuck=0;

            }else if(
                !entityHitsWall(rightPos)
            ){

                entity.position.copy(
                    rightPos
                );

                entityStuck=0;

            }else{

                entityStuck+=delta;
            }
        }
    }


    /*
       If trapped, teleport forward.
    */

    if(entityStuck>1.2){

        unstuckEntity();

        entityStuck=0;
    }


    entity.lookAt(
        player.position.x,
        entity.position.y,
        player.position.z
    );


    /*
       Sound gets louder as it gets closer.
    */

    const d=
        entity.position.distanceTo(
            player.position
        );


    const volume=
        THREE.MathUtils.clamp(
            1-d/40,
            0,
            1
        );


    entitySound.volume=
        volume*volume;


    /*
       Danger effect.
    */

    if(d<15){

        const intensity=
            1-d/15;

        document.getElementById(
            "danger"
        ).style.boxShadow=
            `inset 0 0 180px
             rgba(
                180,
                0,
                0,
                ${intensity*.65}
             )`;

    }else{

        document.getElementById(
            "danger"
        ).style.boxShadow=
            "none";
    }


    if(
        d<1.25 &&
        !falling
    ){

        document.getElementById(
            "message"
        ).textContent=
            "THE ENTITY FOUND YOU";


        respawn();


        setTimeout(()=>{
            document.getElementById(
                "message"
            ).textContent="";
        },1800);
    }
}


/* =========================================================
   ENTITY UNSTUCK
========================================================= */

function unstuckEntity(){

    /*
       Find direction the entity is facing.
    */

    const forward=
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        entity.quaternion
    );

    forward.y=0;
    forward.normalize();


    /*
       Search forward first.
    */

    const distances=[
        2,
        3,
        4,
        5,
        6,
        8,
        10,
        12,
        15
    ];


    for(
        const d of distances
    ){

        const candidate=
            entity.position.clone()
            .add(
                forward.clone()
                .multiplyScalar(d)
            );


        if(
            !entityHitsWall(
                candidate
            )
        ){

            entity.position.copy(
                candidate
            );

            return;
        }
    }


    /*
       If completely blocked,
       search around itself.
    */

    for(
        let angle=0;
        angle<Math.PI*2;
        angle+=Math.PI/12
    ){

        const dir=
            new THREE.Vector3(
                Math.sin(angle),
                0,
                Math.cos(angle)
            );


        const candidate=
            entity.position.clone()
            .add(
                dir.multiplyScalar(6)
            );


        if(
            !entityHitsWall(
                candidate
            )
        ){

            entity.position.copy(
                candidate
            );

            return;
        }
    }
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(delta){

    if(falling){

        velocityY-=
            GRAVITY*delta;

        player.position.y+=
            velocityY*delta;


        if(
            player.position.y<-10
        ){

            respawn();
        }

        jumpPressed=false;

        return;
    }


    /*
       WASD direction.
    */

    const direction=
        new THREE.Vector3();


    if(keys.w)
        direction.z-=1;

    if(keys.s)
        direction.z+=1;

    if(keys.a)
        direction.x-=1;

    if(keys.d)
        direction.x+=1;


    if(
        direction.lengthSq()>0
    ){

        direction.normalize();


        /*
           Move relative to camera yaw.
        */

        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        const sprint=
            keys.shift &&
            stamina>0;


        const speed=
            sprint
            ? SPRINT_SPEED
            : WALK_SPEED;


        if(sprint){

            stamina-=
                27*delta;

        }else{

            stamina+=
                18*delta;
        }


        stamina=
            THREE.MathUtils.clamp(
                stamina,
                0,
                100
            );


        const movement=
            direction.clone()
            .multiplyScalar(
                speed*delta
            );


        /*
           X movement.

           Test X separately so the player
           slides along walls.
        */

        const nextX=
            player.position.clone();

        nextX.x+=
            movement.x;


        if(
            !playerHitsWall(nextX)
        ){

            player.position.x=
                nextX.x;
        }


        /*
           Z movement.
        */

        const nextZ=
            player.position.clone();

        nextZ.z+=
            movement.z;


        if(
            !playerHitsWall(nextZ)
        ){

            player.position.z=
                nextZ.z;
        }

    }else{

        stamina+=
            18*delta;

        stamina=
            Math.min(
                stamina,
                100
            );
    }


    /*
       Jump.

       Only fires once for each
       SPACE press.
    */

    if(
        jumpPressed &&
        grounded
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;
    }


    jumpPressed=false;


    /*
       Gravity.
    */

    velocityY-=
        GRAVITY*delta;


    let nextY=
        player.position.y+
        velocityY*delta;


    /*
       Ceiling collision.
    */

    if(
        velocityY>0
    ){

        const ceiling=
            getCeiling(
                player.position.x,
                player.position.z,
                nextY+HEAD_HEIGHT
            );


        if(
            ceiling!==null &&
            nextY+HEAD_HEIGHT>=ceiling
        ){

            nextY=
                ceiling-
                HEAD_HEIGHT;

            velocityY=0;
        }
    }


    /*
       Floor collision.
    */

    const floor=
        getFloorY(
            player.position.x,
            player.position.z,
            player.position.y
        );


    if(
        nextY<=floor+EYE_HEIGHT
    ){

        nextY=
            floor+EYE_HEIGHT;

        velocityY=0;
        grounded=true;

    }else{

        grounded=false;
    }


    player.position.y=
        nextY;


    checkDeathHoles();


    document.getElementById(
        "stamina"
    ).style.width=
        stamina+"%";
}


/* =========================================================
   DEATH HOLES
========================================================= */

function checkDeathHoles(){

    if(
        currentLevel!=="backrooms" ||
        falling
    ){
        return;
    }


    for(
        const hole of deathHoles
    ){

        if(
            Math.abs(
                player.position.x-
                hole.x
            )<
            hole.size/2
        &&
            Math.abs(
                player.position.z-
                hole.z
            )<
            hole.size/2
        ){

            /*
               Make the player actually fall.
            */

            falling=true;
            velocityY=-1;

            return;
        }
    }
}


/* =========================================================
   RESPAWN
========================================================= */

function respawn(){

    falling=false;
    grounded=true;
    velocityY=0;
    stamina=100;


    if(
        currentLevel==="hotel"
    ){

        player.position.set(
            0,
            EYE_HEIGHT,
            29
        );

        yaw=Math.PI;

    }else{

        player.position.set(
            -70,
            EYE_HEIGHT,
            -62
        );

        yaw=0;
    }


    pitch=0;

    player.rotation.y=yaw;
    camera.rotation.x=pitch;
}


/* =========================================================
   CLEAR LEVEL
========================================================= */

function clearWorld(){

    for(
        const obj of world
    ){

        scene.remove(obj);
    }


    world=[];
    wallColliders=[];
    floorAreas=[];
    deathHoles=[];

    entity=null;


    entitySound.pause();
    entitySound.currentTime=0;


    scene.fog=null;
}


/* =========================================================
   START
========================================================= */

function startLevel(
    level
){

    clearWorld();


    currentLevel=level;


    if(
        level==="hotel"
    ){

        buildHotel();

    }else{

        buildBackrooms();
    }


    gameStarted=true;
    paused=false;


    document.getElementById(
        "menu"
    ).style.display="none";


    document.getElementById(
        "pause"
    ).style.display="none";


    document.body.requestPointerLock();


    entitySound.currentTime=0;

    entitySound.play().catch(
        ()=>{}
    );
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    paused=true;


    document.getElementById(
        "pause"
    ).style.display="flex";


    document.exitPointerLock();


    entitySound.pause();
}


function resumeGame(){

    paused=false;


    document.getElementById(
        "pause"
    ).style.display="none";


    document.body.requestPointerLock();


    entitySound.play().catch(
        ()=>{}
    );
}


function togglePause(){

    if(paused)
        resumeGame();
    else
        pauseGame();
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "backroomsButton"
).onclick=()=>{

    startLevel(
        "backrooms"
    );
};


document.getElementById(
    "hotelButton"
).onclick=()=>{

    startLevel(
        "hotel"
    );
};


document.getElementById(
    "resume"
).onclick=()=>{

    resumeGame();
};


document.getElementById(
    "restart"
).onclick=()=>{

    startLevel(
        currentLevel
    );
};


document.getElementById(
    "levels"
).onclick=()=>{

    gameStarted=false;
    paused=false;


    document.exitPointerLock();


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display="none";


    document.getElementById(
        "menu"
    ).style.display="flex";
};


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            document.pointerLockElement !==
            document.body
        ){

            document.body.requestPointerLock();


            entitySound.play().catch(
                ()=>{}
            );
        }
    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        gameStarted &&
        !paused
    ){

        updatePlayer(delta);

        updateEntity(delta);


        document.getElementById(
            "vhs"
        ).style.opacity=
            .28+
            Math.random()*.08;
    }


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
