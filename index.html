<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Backrooms</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

button{
    width:340px;
    padding:15px 18px;
    margin:6px;
    border:1px solid #777;
    background:#151515;
    color:#eee;
    font-size:16px;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    background:#383517;
    border-color:#d5c85b;
}

button:active{
    transform:scale(.98);
}

/* =========================
   MAIN MENU
========================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    background:
        radial-gradient(
            ellipse at center,
            rgba(71,67,30,.78),
            rgba(0,0,0,.96)
        );
}

#pause{
    display:none;
}

#death{
    display:none;
    background:
        radial-gradient(
            ellipse at center,
            rgba(45,0,0,.65),
            rgba(0,0,0,.98)
        );
}

h1{
    margin:0 0 12px;
    color:#d7c95b;
    letter-spacing:7px;
    font-size:44px;
    text-shadow:0 0 25px #000;
}

.subtitle{
    color:#aaa;
    margin-bottom:20px;
}

.difficultyTitle{
    margin-top:8px;
    margin-bottom:4px;
    color:#aaa;
    font-size:13px;
    letter-spacing:2px;
}

.difficulty{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.difficulty button{
    width:110px;
    padding:11px 5px;
    margin:0;
    font-size:13px;
}

.difficulty button.selected{
    background:#5b5220;
    border-color:#e0d267;
    color:#fff;
}

.controls{
    color:#999;
    text-align:center;
    margin-top:18px;
    line-height:1.8;
    font-size:13px;
}

.warning{
    color:#8e8e8e;
    margin-top:12px;
    font-size:11px;
}

/* =========================
   HUD
========================= */

#crosshair{
    position:fixed;
    z-index:20;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    margin:-2px;
    border:1px solid rgba(255,255,255,.85);
    border-radius:50%;
    pointer-events:none;
}

#hud{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:20;
    color:white;
    text-shadow:2px 2px 5px #000;
    font-size:14px;
}

#difficultyHud{
    margin-top:4px;
    color:#bbb;
    font-size:11px;
}

#rec{
    position:fixed;
    right:20px;
    top:18px;
    z-index:20;
    color:white;
    font:12px monospace;
    text-shadow:2px 2px 5px #000;
}

#recDot{
    display:inline-block;
    width:8px;
    height:8px;
    margin-right:5px;
    border-radius:50%;
    background:red;
    box-shadow:0 0 8px red;
}

#message{
    position:fixed;
    z-index:30;
    top:38px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:19px;
    text-shadow:2px 2px 8px #000;
    pointer-events:none;
}

#danger{
    position:fixed;
    inset:0;
    z-index:17;
    pointer-events:none;
    transition:box-shadow .1s linear;
}

/*
    Very subtle film effect.
    It does NOT affect the entity itself.
*/
#film{
    position:fixed;
    inset:0;
    z-index:15;
    pointer-events:none;
    opacity:.075;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.04) 0px,
            rgba(255,255,255,.04) 1px,
            rgba(0,0,0,.05) 2px,
            rgba(0,0,0,.05) 4px
        );
}

#vignette{
    position:fixed;
    inset:0;
    z-index:16;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 55%,
            rgba(0,0,0,.12) 78%,
            rgba(0,0,0,.42) 100%
        );
}

#error{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:500;
    display:none;
    padding:15px;
    color:white;
    background:#450000;
    border:1px solid red;
    font-family:monospace;
    white-space:pre-wrap;
}

/* =========================
   DEATH SCREEN
========================= */

.deathTitle{
    color:#b40000;
    font-size:52px;
    letter-spacing:9px;
    text-shadow:
        0 0 15px #000,
        0 0 35px rgba(150,0,0,.45);
}

.deathText{
    color:#aaa;
    margin:5px 0 20px;
}

/* =========================
   MOBILE / SMALL SCREEN
========================= */

@media(max-width:600px){
    h1{
        font-size:30px;
        letter-spacing:4px;
    }

    button{
        width:280px;
    }

    .difficulty button{
        width:82px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MAIN MENU
========================= -->

<div id="menu" class="overlay">

    <h1>THE BACKROOMS</h1>

    <div class="subtitle">
        There is no exit.
    </div>

    <div class="difficultyTitle">

    </div>

    <div class="difficulty">
        <button id="easyBtn">EASY</button>

    <button id="hotel">

</div>


<!-- =========================
     PAUSE
========================= -->

<div id="pause" class="overlay">

    <button id="resume">

    </button>

    <button id="restart">

     DEATH
========================= -->

<div id="death" class="overlay">

    </div>

    </div>

    <button id="retry">

    </button>

    <button id="deathMenu">

    </button>

</div>


<div id="crosshair"></div>

<div id="hud">

    <div id="levelName">
        LEVEL 0
    </div>

    <div id="difficultyHud">
        NORMAL
    </div>

</div>

<div id="rec">
    <span id="recDot"></span>REC
</div>

<div id="message"></div>

<div id="danger"></div>

<div id="film"></div>

<div id="vignette"></div>

<div id="error"></div>


<!--
    Keep these files beside index.html:

    three.min.js
    entity.png
    entity.mp3
-->

<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   ERROR HANDLING
========================================================= */

window.addEventListener("error",function(e){

    const box=document.getElementById("error");

    if(box){

        box.style.display="block";

        box.textContent=
            "GAME ERROR:\n\n"+
            e.message+
            "\n\n"+
            (e.filename||"")+
            ":"+
            (e.lineno||"");

    }

    console.error(e.error||e.message);

});


if(typeof THREE==="undefined"){

    throw new Error(
        "Three.js was not loaded. Make sure three.min.js is beside index.html."
    );

}


/* =========================================================
   RENDERER
========================================================= */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
    76,
    innerWidth/innerHeight,
    .03,
    220
);

const renderer=new THREE.WebGLRenderer({

    antialias:true,

    /*
        Important:
        the entity is not rendered through lighting.
        Its material is MeshBasicMaterial.
    */

    powerPreference:"high-performance"

});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.outputColorSpace=THREE.SRGBColorSpace;

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

/*
    The old camera was 1.65m high.

    This is deliberately lower so the player feels
    like a normal human instead of being almost as tall
    as the Backrooms ceiling.
*/

const EYE_HEIGHT=1.45;

const PLAYER_HEIGHT=1.72;

const PLAYER_RADIUS=.32;

const WALK_SPEED=3.9;

const SPRINT_SPEED=6.5;

const GRAVITY=20;

const JUMP_SPEED=6.7;

const player=new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    EYE_HEIGHT,
    0
);

let yaw=0;
let pitch=0;

let velocityY=0;

let grounded=true;


/* =========================================================
   GAME STATE
========================================================= */

let currentLevel="level0";

let running=false;

let paused=false;

let dead=false;

let selectedDifficulty="normal";


/*
    Entity speeds.

    Normal = slightly slower than the old version.
    Hard = old speed.
    Impossible = faster.
*/

const DIFFICULTIES={

    easy:{
        name:"EASY",
        speed:1.45,
        chase:false,
        wander:true
    },

    normal:{
        name:"NORMAL",
        speed:5.8,
        chase:true,
        wander:false
    },

    hard:{
        name:"HARD",
        speed:7.5,
        chase:true,
        wander:false
    },

    impossible:{
        name:"IMPOSSIBLE",
        speed:9.2,
        chase:true,
        wander:false
    }

};


let objects=[];

let walls=[];

let floors=[];

let entity=null;

let entityTexture=null;

let entityStuckTime=0;

let wanderDirection=new THREE.Vector2(1,0);

let wanderTimer=0;


/* =========================================================
   INPUT
========================================================= */

const keys={};

let jumpPressed=false;

window.addEventListener(
    "keydown",
    function(e){

        const k=e.key.toLowerCase();

        keys[k]=true;

        if(e.code==="Space"){

            e.preventDefault();

            if(!e.repeat)
                jumpPressed=true;

        }

        if(
            e.code==="Escape"||
            k==="p"
        ){

            if(running && !dead)
                togglePause();

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

window.addEventListener(
    "mousemove",
    function(e){

        if(
            document.pointerLockElement !==
            document.body
        )
            return;

        yaw-=e.movementX*.0021;

        pitch-=e.movementY*.0021;

        pitch=THREE.MathUtils.clamp(
            pitch,
            -1.48,
            1.48
        );

        player.rotation.y=yaw;

        camera.rotation.x=pitch;

    }
);


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function realisticMaterial(
    color,
    roughness=1,
    metalness=0
){

    return new THREE.MeshStandardMaterial({

        color:color,

        roughness:roughness,

        metalness:metalness

    });

}


function addObject(o){

    scene.add(o);

    objects.push(o);

    return o;

}


/* =========================================================
   WALLS
========================================================= */

function addWall(
    w,
    h,
    d,
    x,
    y,
    z,
    mat
){

    const mesh=new THREE.Mesh(

        new THREE.BoxGeometry(
            w,
            h,
            d
        ),

        mat

    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow=true;

    mesh.receiveShadow=true;

    addObject(mesh);

    walls.push({

        minX:x-w/2,

        maxX:x+w/2,

        minY:y-h/2,

        maxY:y+h/2,

        minZ:z-d/2,

        maxZ:z+d/2

    });

    return mesh;

}


/* =========================================================
   FLOORS
========================================================= */

function addFloor(
    w,
    d,
    x,
    y,
    z,
    mat
){

    const mesh=new THREE.Mesh(

        new THREE.PlaneGeometry(
            w,
            d
        ),

        mat

    );

    mesh.rotation.x=-Math.PI/2;

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.receiveShadow=true;

    addObject(mesh);

    floors.push({

        minX:x-w/2,

        maxX:x+w/2,

        minZ:z-d/2,

        maxZ:z+d/2,

        y:y

    });

    return mesh;

}


/* =========================================================
   CEILING
========================================================= */

function addCeiling(
    w,
    d,
    x,
    y,
    z,
    mat
){

    const mesh=new THREE.Mesh(

        new THREE.PlaneGeometry(
            w,
            d
        ),

        mat

    );

    mesh.rotation.x=Math.PI/2;

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.receiveShadow=true;

    addObject(mesh);

    return mesh;

}


/* =========================================================
   PROCEDURAL WALLPAPER
========================================================= */

function wallpaperTexture(){

    const canvas=
        document.createElement("canvas");

    canvas.width=2048;
    canvas.height=2048;

    const ctx=
        canvas.getContext("2d");

    /*
        Warm aged yellow wallpaper.
    */

    ctx.fillStyle="#b9ae52";

    ctx.fillRect(
        0,
        0,
        2048,
        2048
    );


    /*
        Subtle unevenness.
    */

    for(let i=0;i<90000;i++){

        const x=
            Math.random()*2048;

        const y=
            Math.random()*2048;

        const n=
            Math.random()*45;

        ctx.fillStyle=
            `rgba(${80+n},${75+n},${25+n*.5},${.025+Math.random()*.05})`;

        ctx.fillRect(
            x,
            y,
            1+Math.random()*4,
            1+Math.random()*4
        );

    }


    /*
        Very subtle vertical wallpaper variation.
    */

    for(let x=0;x<2048;x+=5){

        ctx.fillStyle=
            `rgba(70,65,25,${.008+Math.random()*.012})`;

        ctx.fillRect(
            x,
            0,
            1,
            2048
        );

    }


    const texture=
        new THREE.CanvasTexture(canvas);

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(
        5,
        4
    );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    return texture;

}


/* =========================================================
   CARPET TEXTURE
========================================================= */

function carpetTexture(){

    const canvas=
        document.createElement("canvas");

    canvas.width=2048;
    canvas.height=2048;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle="#50524c";

    ctx.fillRect(
        0,
        0,
        2048,
        2048
    );


    /*
        Carpet fibers.
    */

    for(let i=0;i<180000;i++){

        const x=
            Math.random()*2048;

        const y=
            Math.random()*2048;

        const shade=
            45+
            Math.random()*55;

        ctx.fillStyle=
            `rgba(${shade},${shade},${shade*.92},${.06+Math.random()*.12})`;

        ctx.fillRect(
            x,
            y,
            1+Math.random()*2,
            1+Math.random()*3
        );

    }


    /*
        Slight stains and wear.
    */

    for(let i=0;i<100;i++){

        const x=
            Math.random()*2048;

        const y=
            Math.random()*2048;

        const r=
            20+
            Math.random()*90;

        const gradient=
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                r
            );

        gradient.addColorStop(
            0,
            "rgba(20,24,20,.18)"
        );

        gradient.addColorStop(
            1,
            "rgba(20,24,20,0)"
        );

        ctx.fillStyle=gradient;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    const texture=
        new THREE.CanvasTexture(canvas);

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(
        7,
        7
    );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    return texture;

}


/* =========================================================
   CEILING TEXTURE
========================================================= */

function ceilingTexture(){

    const canvas=
        document.createElement("canvas");

    canvas.width=1024;
    canvas.height=1024;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle="#d0c889";

    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );


    /*
        Ceiling panel lines.
    */

    for(let x=0;x<1024;x+=128){

        ctx.fillStyle=
            "rgba(70,65,45,.12)";

        ctx.fillRect(
            x,
            0,
            2,
            1024
        );

    }

    for(let y=0;y<1024;y+=128){

        ctx.fillStyle=
            "rgba(70,65,45,.10)";

        ctx.fillRect(
            0,
            y,
            1024,
            2
        );

    }


    for(let i=0;i<30000;i++){

        const x=
            Math.random()*1024;

        const y=
            Math.random()*1024;

        ctx.fillStyle=
            "rgba(80,75,50,.035)";

        ctx.fillRect(
            x,
            y,
            2,
            2
        );

    }


    const texture=
        new THREE.CanvasTexture(canvas);

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(
        6,
        5
    );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    return texture;

}


/* =========================================================
   LIGHTING
========================================================= */

function addFluorescentLight(
    x,
    z,
    intensity=1.15
){

    /*
        Actual fixture.
    */

    const fixture=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.8,
                .07,
                .45
            ),

            new THREE.MeshBasicMaterial({

                color:0xfff5c9

            })

        );

    fixture.position.set(
        x,
        3.03,
        z
    );

    addObject(fixture);


    /*
        Real point light.
    */

    const light=
        new THREE.PointLight(
            0xffeab0,
            intensity,
            15
        );

    light.position.set(
        x,
        2.9,
        z
    );

    light.castShadow=true;

    light.shadow.mapSize.width=512;
    light.shadow.mapSize.height=512;

    light.shadow.camera.near=.1;
    light.shadow.camera.far=16;

    addObject(light);

}


/* =========================================================
   LEVEL 0
========================================================= */

function buildLevel0(){

    currentLevel="level0";

    document.getElementById(
        "levelName"
    ).textContent=
        "LEVEL 0 — BACKROOMS";

    scene.background=
        new THREE.Color(
            0x34301b
        );

    /*
        Much farther fog so walls don't disappear.
    */

    scene.fog=
        new THREE.Fog(
            0x34301b,
            24,
            145
        );


    /*
        Warm global lighting.
    */

    addObject(
        new THREE.HemisphereLight(
            0xffefb0,
            0x292719,
            1.8
        )
    );


    addObject(
        new THREE.AmbientLight(
            0xffe7a0,
            .8
        )
    );


    const wallpaper=
        new THREE.MeshStandardMaterial({

            map:wallpaperTexture(),

            roughness:.96,

            metalness:0

        });


    const carpet=
        new THREE.MeshStandardMaterial({

            map:carpetTexture(),

            roughness:1,

            metalness:0

        });


    const ceiling=
        new THREE.MeshStandardMaterial({

            map:ceilingTexture(),

            roughness:.92

        });


    /*
        3.1m ceiling.
        This is deliberately lower than the old
        4.1m ceiling.
    */

    const CEILING_HEIGHT=3.1;


    /*
        Main floor.
    */

    addFloor(
        180,
        160,
        0,
        0,
        0,
        carpet
    );


    /*
        Outer walls.
    */

    addWall(
        180,
        CEILING_HEIGHT,
        1,
        0,
        CEILING_HEIGHT/2,
        -80,
        wallpaper
    );

    addWall(
        180,
        CEILING_HEIGHT,
        1,
        0,
        CEILING_HEIGHT/2,
        80,
        wallpaper
    );

    addWall(
        1,
        CEILING_HEIGHT,
        160,
        -90,
        CEILING_HEIGHT/2,
        0,
        wallpaper
    );

    addWall(
        1,
        CEILING_HEIGHT,
        160,
        90,
        CEILING_HEIGHT/2,
        0,
        wallpaper
    );


    /*
        Ceiling.
    */

    addCeiling(
        180,
        160,
        0,
        CEILING_HEIGHT,
        0,
        ceiling
    );


    /*
        Main corridor structure.
    */

    addWall(
        1,
        CEILING_HEIGHT,
        95,
        -55,
        CEILING_HEIGHT/2,
        0,
        wallpaper
    );

    addWall(
        1,
        CEILING_HEIGHT,
        95,
        55,
        CEILING_HEIGHT/2,
        0,
        wallpaper
    );


    addWall(
        75,
        CEILING_HEIGHT,
        1,
        0,
        CEILING_HEIGHT/2,
        -52,
        wallpaper
    );

    addWall(
        75,
        CEILING_HEIGHT,
        1,
        0,
        CEILING_HEIGHT/2,
        52,
        wallpaper
    );


    /*
        Irregular walls.
    */

    addWall(
        35,
        CEILING_HEIGHT,
        1,
        -25,
        CEILING_HEIGHT/2,
        -25,
        wallpaper
    );

    addWall(
        35,
        CEILING_HEIGHT,

/* =========================================================
   SPAWN
========================================================= */

function spawn(
    x,
    z,
    rotation=0
){

    player.position.set(
        x,
        EYE_HEIGHT,
        z
    );

    yaw=rotation;

    pitch=0;

    player.rotation.y=yaw;

    camera.rotation.x=pitch;

    velocityY=0;

    grounded=true;

}


/* =========================================================
   PLAYER WALL COLLISION
========================================================= */

function hitsWall(
    x,
    y,
    z
){

    const bottom=
        y-EYE_HEIGHT;

    const top=
        bottom+PLAYER_HEIGHT;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        )
            continue;


        const cx=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const cz=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx=x-cx;

        const dz=z-cz;


        if(
            dx*dx+
            dz*dz<
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   FLOOR DETECTION
========================================================= */

function floorBelow(
    x,
    z,
    currentY
){

    let best=-Infinity;


    for(
        const floor of floors
    ){

        if(
            x>=floor.minX &&
            x<=floor.maxX &&
            z>=floor.minZ &&
            z<=floor.maxZ
        ){

            if(
                floor.y<=
                currentY-EYE_HEIGHT+.12
            ){

                if(
                    floor.y>best
                )
                    best=floor.y;

            }

        }

    }


    return best;

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

    const dir=
        new THREE.Vector3();


    if(keys.w)
        dir.z-=1;

    if(keys.s)
        dir.z+=1;

    if(keys.a)
        dir.x-=1;

    if(keys.d)
        dir.x+=1;


    if(dir.lengthSq()>0){

        dir.normalize();


        dir.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );


        /*
            Unlimited sprint.
            There is deliberately NO stamina system
            and NO cooldown.
        */

        const sprint=
            keys.shift;


        const speed=
            sprint
                ? SPRINT_SPEED
                : WALK_SPEED;


        const amount=
            speed*dt;


        const nx=
            player.position.x+
            dir.x*amount;


        if(
            !hitsWall(
                nx,
                player.position.y,
                player.position.z
            )
        ){

            player.position.x=nx;

        }


        const nz=
            player.position.z+
            dir.z*amount;


        if(
            !hitsWall(
                player.position.x,
                player.position.y,
                nz
            )
        ){

            player.position.z=nz;

        }

    }


    /*
        Jump.
    */

    if(
        jumpPressed &&
        grounded
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;

    }


    jumpPressed=false;


    velocityY-=
        GRAVITY*dt;


    let nextY=
        player.position.y+
        velocityY*dt;


    const fy=
        floorBelow(
            player.position.x,
            player.position.z,
            player.position.y
        );


    if(
        fy===-Infinity
    ){

        grounded=false;


        if(
            player.position.y<
            -12
        ){

            killPlayer();

            return;

        }

    }
    else{

        const eyeFloor=
            fy+EYE_HEIGHT;


        if(
            nextY<=eyeFloor &&
            velocityY<=0
        ){

            nextY=eyeFloor;

            velocityY=0;

            grounded=true;

        }
        else{

            grounded=false;

        }

    }


    player.position.y=nextY;

}

/* =========================================================
   ENTITY CREATION
========================================================= */

function createEntity(
    x,
    z
){

    /*
        The source image is 4:3.

        1.8 x 1.35 preserves that exact ratio.

        It is NOT stretched into a tall rectangle.
    */

/* =========================================================
   ENTITY COLLISION
========================================================= */

const ENTITY_RADIUS=.52;

const ENTITY_HEIGHT=1.35;


function entityHitsWall(
    x,
    y,
    z
){

    const bottom=
        y-ENTITY_HEIGHT/2;

    const top=
        y+ENTITY_HEIGHT/2;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        )
            continue;


        const cx=
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const cz=
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx=x-cx;

        const dz=z-cz;


        if(
            dx*dx+
            dz*dz<
            ENTITY_RADIUS*
            ENTITY_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY LINE-OF-SIGHT / WALL DETECTION
========================================================= */

/*
    This checks multiple points between the entity
    and player.

    If a wall blocks the straight path, the AI knows
    that it needs to go around it.
*/

function lineBlocked(
    x1,
    z1,
    x2,
    z2
){

    const dx=x2-x1;

    const dz=z2-z1;

    const distance=
        Math.hypot(
            dx,
            dz
        );


    if(distance<.01)
        return false;


    const steps=
        Math.ceil(
            distance/.35
        );


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t=i/steps;

        const x=
            x1+
            dx*t;

        const z=
            z1+
            dz*t;


        if(
            entityHitsWall(
                x,
                entity.position.y,
                z
            )
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY PATH CHOICE
========================================================= */

/*
    Instead of simply trying left/right, the entity
    evaluates many possible directions.

    It prefers:

    1. Directions that aren't blocked.
    2. Directions that reduce distance to player.
    3. Directions requiring less turning.
    4. Directions that don't scrape walls.

    This makes it behave more like it is deliberately
    going around the wall instead of getting stuck.
*/

function chooseEntityDirection(){

    if(!entity)
        return null;


    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;


    const distance=
        Math.hypot(
            dx,
            dz
        );


    if(distance<.01)
        return null;


    const targetAngle=
        Math.atan2(
            dz,
            dx
        );


    let best=null;


    /*
        32 possible directions around the entity.
    */

    for(
        let i=0;
        i<32;
        i++
    ){

        const angle=
            i/32*
            Math.PI*2;


        const dirX=
            Math.cos(angle);

        const dirZ=
            Math.sin(angle);


        /*
            Look several meters ahead.
        */

        const testDistance=1.8;


        const testX=
            entity.position.x+
            dirX*
            testDistance;


        const testZ=
            entity.position.z+
            dirZ*
            testDistance;


        if(
            entityHitsWall(
                testX,
                entity.position.y,
                testZ
            )
        )
            continue;


        /*
            Test a second point too.
            This prevents choosing a direction that
            immediately curves into a wall.
        */

        const testX2=
            entity.position.x+
            dirX*
            3.0;

        const testZ2=
            entity.position.z+
            dirZ*
            3.0;


        if(
            entityHitsWall(
                testX2,
                entity.position.y,
                testZ2
            )
        )
            continue;


        /*
            New distance to player.
        */

        const newDistance=
            Math.hypot(
                player.position.x-testX,
                player.position.z-testZ
            );


        /*
            Turning penalty.
        */

        let angleDifference=
            Math.abs(
                angle-targetAngle
            );


        if(
            angleDifference>
            Math.PI
        ){

            angleDifference=
                Math.PI-
                angleDifference;

        }


        /*
            Lower score is better.
        */

        let score=
            newDistance+
            angleDifference*.65;


        /*
            If there is direct line of sight,
            strongly prefer directly chasing.
        */

        if(
            !lineBlocked(
                entity.position.x,
                entity.position.z,
                player.position.x,
                player.position.z
            )
        ){

            score=
                newDistance+
                angleDifference*1.7;

        }


        if(
            !best ||
            score<best.score
        ){

            best={

                x:dirX,

                z:dirZ,

                score:score

            };

        }

    }


    return best;

}


/* =========================================================
   ENTITY UNSTUCK
========================================================= */

function unstuckEntity(){

    if(!entity)
        return;


    const directions=[];


    for(
        let i=0;
        i<24;
        i++
    ){

        const angle=
            i/24*
            Math.PI*2;


        directions.push({

            x:Math.cos(angle),

            z:Math.sin(angle)

        });

    }


    let best=null;


    for(
        const dir of directions
    ){

        const distance=2.5;


        const x=
            entity.position.x+
            dir.x*distance;

        const z=
            entity.position.z+
            dir.z*distance;


        if(
            entityHitsWall(
                x,
                entity.position.y,
                z
            )
        )
            continue;


        const playerDistance=
            Math.hypot(
                player.position.x-x,
                player.position.z-z
            );


        if(
            !best ||
            playerDistance<
            best.distance
        ){

            best={

                x:x,

                z:z,

                distance:playerDistance

            };

        }

    }


    if(best){

        entity.position.x=
            best.x;

        entity.position.z=
            best.z;

    }

}

const entityAudio=
    new Audio(
        "./entity.mp3"
    );

entityAudio.loop=true;

entityAudio.volume=0;


/* =========================================================
   EASY MODE WANDERING
========================================================= */

function updateWander(dt){

    if(!entity)
        return;


    wanderTimer-=dt;


    if(wanderTimer<=0){

        wanderTimer=
            2+
            Math.random()*4;


        const angle=
            Math.random()*
            Math.PI*2;


        wanderDirection.set(
            Math.cos(angle),
            Math.sin(angle)
        );

    }


    const amount=
        DIFFICULTIES.easy.speed*
        dt;


    let nx=
        entity.position.x+
        wanderDirection.x*
        amount;

    let nz=
        entity.position.z+
        wanderDirection.y*
        amount;


    if(
        entityHitsWall(
            nx,
            entity.position.y,
            nz
        )
    ){

        /*
            Hit a wall:
            immediately choose a new direction.
        */

        wanderTimer=0;

        return;

    }


    entity.position.x=nx;

    entity.position.z=nz;

}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        dead
    )
        return;


    const difficulty=
        DIFFICULTIES[
            selectedDifficulty
        ];


    /*
        EASY MODE:
        Peaceful wandering only.
    */

    if(!difficulty.chase){

        updateWander(dt);

    }
    else{

        const dx=
            player.position.x-
            entity.position.x;

        const dz=
            player.position.z-
            entity.position.z;


        const distance=
            Math.hypot(
                dx,
                dz
            );


        if(distance>.15){

            /*
                First check whether the direct
                path is blocked.
            */

            const blocked=
                lineBlocked(
                    entity.position.x,
                    entity.position.z,
                    player.position.x,
                    player.position.z
                );


            let direction=null;


            if(!blocked){

                /*
                    Nothing is blocking it.
                    Run directly toward player.
                */

                direction={

                    x:dx/distance,

                    z:dz/distance

                };

            }
            else{

                /*
                    Wall detected.
                    Find the quickest route around it.
                */

                direction=
                    chooseEntityDirection();

            }


            if(direction){

                const amount=
                    difficulty.speed*
                    dt;


                const nx=
                    entity.position.x+
                    direction.x*
                    amount;

                const nz=
                    entity.position.z+
                    direction.z*
                    amount;


                if(
                    !entityHitsWall(
                        nx,
                        entity.position.y,
                        nz
                    )
                ){

                    entity.position.x=
                        nx;

                    entity.position.z=
                        nz;

                    entityStuckTime=0;

                }
                else{

                    /*
                        It unexpectedly hit a wall.
                    */

                    entityStuckTime+=dt;

                }

            }
            else{

                entityStuckTime+=dt;

            }

        }


        /*
            If stuck for too long, forcibly search
            for an open area.
        */

        if(
            entityStuckTime>1.0
        ){

            unstuckEntity();

            entityStuckTime=0;

        }

    }


    /*
        Keep the image facing the player.

        Y-axis rotation only means the image stays
        upright instead of tilting.
    */

    const lookX=
        player.position.x-
        entity.position.x;

    const lookZ=
        player.position.z-
        entity.position.z;


    entity.rotation.y=
        Math.atan2(
            lookX,
            lookZ
        );


    /*
        Audio distance.
    */

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );


    const volume=
        THREE.MathUtils.clamp(
            1-distance/50,
            0,
            1
        );


    entityAudio.volume=
        volume*.75;


    /*
        Danger effect.

        This does NOT modify the entity image.
    */

    if(
        difficulty.chase &&
        distance<16
    ){

        const strength=
            1-distance/16;


        document.getElementById(
            "danger"
        ).style.boxShadow=
            `inset 0 0 180px rgba(180,0,0,${strength*.45})`;

    }
    else{

        document.getElementById(
            "danger"
        ).style.boxShadow=
            "none";

    }


    /*
        Catch player.
    */

    if(
        difficulty.chase &&
        distance<1.05
    ){

        killPlayer();

    }

}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(){

    if(dead)
        return;


    dead=true;

    running=false;

    paused=false;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    entityAudio.pause();

    entityAudio.currentTime=0;


    document.getElementById(
        "death"
    ).style.display="flex";


    document.getElementById(
        "danger"
    ).style.boxShadow="none";

}

   CLEAR WORLD

function clearWorld(){

    for(
        const object of objects
    ){

        scene.remove(object);


        if(object.geometry){

            object.geometry.dispose();

        }


        if(object.material){

            if(
                Array.isArray(
                    object.material
                )
            ){

                object.material.forEach(
                    m=>{

                        if(m.map!==entityTexture)
                            m.dispose();

                    }
                );

            }
            else{

                /*
                    Do not dispose the shared
                    entity texture.
                */

                object.material.dispose();

            }

        }

    }


    objects=[];

    walls=[];

    floors=[];

    entity=null;

    entityStuckTime=0;

    entityAudio.pause();

    entityAudio.currentTime=0;

    scene.fog=null;

}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(level){

    try{

        clearWorld();


        if(level==="hotel"){

            buildHotel();

        }
        else{

            buildLevel0();

        }


        running=true;

        paused=false;

        dead=false;


        document.getElementById(
            "menu"
        ).style.display="none";


        document.getElementById(
            "pause"
        ).style.display="none";


        document.getElementById(
            "death"
        ).style.display="none";


        document.getElementById(
            "difficultyHud"
        ).textContent=
            DIFFICULTIES[
                selectedDifficulty
            ].name;


        entityAudio.play().catch(
            ()=>{}
        );


        document.body.requestPointerLock();


    }
    catch(error){

        console.error(error);


        const box=
            document.getElementById(
                "error"
            );


        box.style.display="block";


        box.textContent=
            "LEVEL ERROR:\n\n"+
            error.stack;

    }

}


/* =========================================================
   RESPawn
========================================================= */

function respawn(){

    if(
        currentLevel==="hotel"
    ){

        spawn(
            0,
            30,
            Math.PI
        );

    }
    else{

        spawn(
            -70,
            -65,
            0
        );

    }

}


/* =========================================================
   MESSAGES
========================================================= */

let messageTimer=null;


function showMessage(text){

    const message=
        document.getElementById(
            "message"
        );


    message.textContent=text;


    clearTimeout(
        messageTimer
    );


    messageTimer=
        setTimeout(
            function(){

                message.textContent="";

            },
            1800
        );

}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(
        !running ||
        dead
    )
        return;


    paused=true;


    document.getElementById(
        "pause"
    ).style.display="flex";


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    entityAudio.pause();

}


function resumeGame(){

    if(
        !running ||
        dead
    )
        return;


    paused=false;


    document.getElementById(
        "pause"
    ).style.display="none";


    document.body.requestPointerLock();


    entityAudio.play().catch(
        ()=>{}
    );

}


function togglePause(){

    if(paused)
        resumeGame();
    else
        pauseGame();

}


/* =========================================================
   MAIN MENU
========================================================= */

function returnToMenu(){

    running=false;

    paused=false;

    dead=false;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display="none";


    document.getElementById(
        "death"
    ).style.display="none";


    document.getElementById(
        "menu"
    ).style.display="flex";


    document.getElementById(
        "danger"
    ).style.boxShadow="none";

}


/* =========================================================
   DIFFICULTY BUTTONS
========================================================= */

function selectDifficulty(
    difficulty
){

    selectedDifficulty=
        difficulty;


    document
        .querySelectorAll(
            ".difficulty button"
        )
        .forEach(
            button=>{
                button.classList.remove(
                    "selected"
                );
            }
        );


    const buttonMap={

        easy:"easyBtn",

        normal:"normalBtn",

        hard:"hardBtn",

        impossible:"impossibleBtn"

    };


    document.getElementById(
        buttonMap[difficulty]
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent=
        DIFFICULTIES[
            difficulty
        ].name;

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "easyBtn"
).onclick=function(){

    selectDifficulty("easy");

};


document.getElementById(
    "normalBtn"
).onclick=function(){

    selectDifficulty("normal");

};


document.getElementById(
    "hardBtn"
).onclick=function(){

    selectDifficulty("hard");

};


document.getElementById(
    "impossibleBtn"
).onclick=function(){

    selectDifficulty("impossible");

};


document.getElementById(
    "level0"
).onclick=function(){

    startLevel("level0");

};


document.getElementById(
    "hotel"
).onclick=function(){

    startLevel("hotel");

};


document.getElementById(
    "resume"
).onclick=function(){

    resumeGame();

};


document.getElementById(
    "restart"
).onclick=function(){

    startLevel(
        currentLevel
    );

};


document.getElementById(
    "menuButton"
).onclick=function(){

    returnToMenu();

};


document.getElementById(
    "retry"
).onclick=function(){

    startLevel(
        currentLevel
    );

};


document.getElementById(
    "deathMenu"
).onclick=function(){

    returnToMenu();

};


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    function(){

        if(
            running &&
            !paused &&
            !dead &&
            document.pointerLockElement!==
            document.body
        ){

            document.body.requestPointerLock();

            entityAudio.play().catch(
                ()=>{}
            );

        }

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock=
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect=
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
