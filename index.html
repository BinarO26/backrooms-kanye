<script type="module">

import * as THREE from "three";

/* =========================================================
   BASIC THREE.JS SETUP
========================================================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    .05,
    300
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

const player = new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    1.65,
    0
);

let yaw = 0;
let pitch = 0;

const PLAYER_RADIUS = .38;
const PLAYER_HEIGHT = 1.8;

const WALK_SPEED = 4.5;
const SPRINT_SPEED = 7.5;
const JUMP_SPEED = 7.5;
const GRAVITY = 20;

let velocityY = 0;
let grounded = true;

let stamina = 100;


/* =========================================================
   GAME STATE
========================================================= */

let currentLevel = "level0";
let gameRunning = false;
let paused = false;

let worldObjects = [];

/*
   Every actual wall is represented by one
   simple Box3 here.

   Floors are NOT in this array.
*/
let walls = [];

/*
   Floors are stored separately.
*/
let floors = [];

/*
   Actual deadly holes.
*/
let holes = [];


/* =========================================================
   INPUT
========================================================= */

const keys = {};

let jumpPressed = false;

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        keys[key] = true;

        if(event.code === "Space"){

            event.preventDefault();

            if(!event.repeat){
                jumpPressed = true;
            }
        }

        if(
            event.code === "Escape" ||
            key === "p"
        ){

            if(gameRunning){
                togglePause();
            }
        }
    }
);

window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);


/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            document.pointerLockElement !==
            document.body
        ){
            return;
        }

        yaw -= event.movementX * .002;
        pitch -= event.movementY * .002;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.5,
                1.5
            );

        player.rotation.y = yaw;
        camera.rotation.x = pitch;
    }
);


/* =========================================================
   MATERIALS
========================================================= */

function mat(
    color,
    roughness = 1
){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:roughness
    });
}


/* =========================================================
   WORLD HELPERS
========================================================= */

function addObject(object){

    scene.add(object);
    worldObjects.push(object);

    return object;
}


function addWall(
    width,
    height,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    addObject(mesh);

    /*
       Store the collider directly.
       This avoids constantly calculating it.
    */

    walls.push(
        new THREE.Box3(
            new THREE.Vector3(
                x-width/2,
                y-height/2,
                z-depth/2
            ),
            new THREE.Vector3(
                x+width/2,
                y+height/2,
                z+depth/2
            )
        )
    );

    return mesh;
}


function addFloor(
    width,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                depth
            ),
            material
        );

    mesh.rotation.x =
        -Math.PI / 2;

    mesh.position.set(
        x,
        y,
        z
    );

    addObject(mesh);

    floors.push({
        minX:x-width/2,
        maxX:x+width/2,
        minZ:z-depth/2,
        maxZ:z+depth/2,
        y:y
    });

    return mesh;
}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function collidesWithWall(
    x,
    y,
    z
){

    /*
       Player body is approximately
       from feet to head.
    */

    const bottom =
        y - 1.65;

    const top =
        y + .25;

    for(
        const wall of walls
    ){

        /*
           No vertical overlap.
        */

        if(
            top <= wall.min.y ||
            bottom >= wall.max.y
        ){
            continue;
        }

        /*
           Closest point on wall rectangle.
        */

        const closestX =
            Math.max(
                wall.min.x,
                Math.min(
                    x,
                    wall.max.x
                )
            );

        const closestZ =
            Math.max(
                wall.min.z,
                Math.min(
                    z,
                    wall.max.z
                )
            );

        const dx =
            x - closestX;

        const dz =
            z - closestZ;

        if(
            dx*dx + dz*dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ){

            return true;
        }
    }

    return false;
}


/* =========================================================
   FIND FLOOR
========================================================= */

function findFloor(
    x,
    z
){

    let best = -Infinity;

    for(
        const floor of floors
    ){

        if(
            x >= floor.minX &&
            x <= floor.maxX &&
            z >= floor.minZ &&
            z <= floor.maxZ
        ){

            if(
                floor.y > best
            ){

                best = floor.y;
            }
        }
    }

    return best;
}


/* =========================================================
   TEXTURES
========================================================= */

function makeWallpaperTexture(){

    const canvas =
        document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 1024;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#c3b54b";

    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );

    /*
       Dirt/noise.
    */

    for(
        let i=0;
        i<70000;
        i++
    ){

        const value =
            70 + Math.random()*80;

        ctx.fillStyle =
            `rgba(
                ${value},
                ${value*.92},
                25,
                .10
            )`;

        ctx.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            1+Math.random()*3,
            1+Math.random()*3
        );
    }

    /*
       Wallpaper seams.
    */

    for(
        let i=0;
        i<55;
        i++
    ){

        const x =
            Math.random()*1024;

        ctx.strokeStyle =
            "rgba(45,40,10,.18)";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x + Math.random()*20 - 10,
            1024
        );

        ctx.stroke();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        4,
        3
    );

    return texture;
}


function makeCarpetTexture(){

    const canvas =
        document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 1024;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#555653";

    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );

    for(
        let i=0;
        i<100000;
        i++
    ){

        const c =
            45 +
            Math.random()*70;

        ctx.fillStyle =
            `rgba(
                ${c},
                ${c},
                ${c},
                .12
            )`;

        ctx.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            1+Math.random()*3,
            1+Math.random()*2
        );
    }

    /*
       Damp patches.
    */

    for(
        let i=0;
        i<130;
        i++
    ){

        const x =
            Math.random()*1024;

        const y =
            Math.random()*1024;

        const r =
            20+Math.random()*80;

        const gradient =
            ctx.createRadialGradient(
                x,y,0,
                x,y,r
            );

        gradient.addColorStop(
            0,
            "rgba(20,25,22,.35)"
        );

        gradient.addColorStop(
            1,
            "rgba(20,25,22,0)"
        );

        ctx.fillStyle =
            gradient;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        5,
        5
    );

    return texture;
}


/* =========================================================
   LEVEL 0
========================================================= */

function buildLevel0(){

    currentLevel = "level0";

    document.getElementById(

        )
    );

        });

    const carpet =

    /*

    );

    );

    addWall(

    );

    addWall(

/* =========================================================
   COLUMNS
========================================================= */

function createColumns(
    startX,
    startZ,
    countX,
    countZ,
    spacing,
    material
){

    for(
        let x=0;
        x<countX;
        x++
    ){

        for(
            let z=0;
            z<countZ;
            z++
        ){

            addWall(
                .8,
                4,
                .8,
                startX+x*spacing,
                2,
                startZ+z*spacing,
                material
            );
        }
    }
}


/* =========================================================
   DEATH GRID
========================================================= */

function createHoleGrid(
    startX,
    startZ,
    countX,
    countZ,
    size,
    carpet
){

    /*
       Create floor tiles instead of putting
       holes on top of a giant floor.
    */

    for(
        let x=0;
        x<countX;
        x++
    ){

        for(
            let z=0;
            z<countZ;
            z++
        ){

            const px =
                startX +
                x*size;

            const pz =
                startZ +
                z*size;


            /*
               Four thin carpet strips around
               every opening.
            */

            addFloor(
                size-.18,
                .22,
                px,
                0,
                pz-size/2+.11,
                carpet
            );

            addFloor(
                size-.18,
                .22,
                px,
                0,
                pz+size/2-.11,
                carpet
            );

            addFloor(
                .22,
                size-.18,
                px-size/2+.11,
                0,
                pz,
                carpet
            );

            addFloor(
                .22,
                size-.18,
                px+size/2-.11,
                0,
                pz,
                carpet
            );


            /*
               Actual hole.
            */

            holes.push({
                x:px,
                z:pz,
                half:size/2-.12
            });


            /*
               Dark bottom far below.
            */

            const bottom =
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        size,
                        size
                    ),
                    new THREE.MeshBasicMaterial({
                        color:0x050505
                    })
                );

            bottom.rotation.x =
                -Math.PI/2;

            bottom.position.set(
                px,
                -12,
                pz
            );

            addObject(bottom);
        }
    }
}


/* =========================================================
   LIGHTS
========================================================= */

function createLight(
    x,
    z
){

    const fixture =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.4,
                .08,
                .4
            ),
            new THREE.MeshBasicMaterial({
                color:0xffffd0
            })
        );

    fixture.position.set(
        x,
        4,
        z
    );

    addObject(fixture);


    const light =
        new THREE.PointLight(
            0xffeaa5,
            1.8,
            17
        );

    light.position.set(
        x,
        3.8,
        z
    );

    addObject(light);
}


/* =========================================================
   LEVEL 188 / HOTEL
========================================================= */

function buildHotel(){

    currentLevel = "hotel";

    document.getElementById(
        "level"
    ).textContent =
        "LEVEL 188 — HOTEL";

    scene.background =
        new THREE.Color(
            0x080b0d
        );

    scene.fog =
        new THREE.Fog(
            0x080b0d,
            15,
            150
        );

    scene.add(
        new THREE.AmbientLight(
            0x9ca5ad,
            .8
        )
    );


    const concrete =
        mat(0x77746d);

    const dark =
        mat(0x30312f);

    const floorMat =
        mat(0x55534e);

    const grass =
        mat(0x273b22);


    /*
       Ground courtyard.
    */

    addFloor(
        80,
        90,
        0,
        0,
        0,
        grass
    );


    /*
       Hotel has five levels.
    */

    const floorHeight = 4.3;

    for(
        let floor=0;
        floor<5;
        floor++
    ){

        const y =
            floor*floorHeight;

        createHotelFloor(
            y,
            concrete,
            dark,
            floorMat
        );
    }


    /*
       Bridges over the courtyard.
    */

    createBridge(
        floorHeight*2,
        dark
    );

    createBridge(
        floorHeight*4,
        dark
    );


    /*
       Side stairs.
    */

    createStairs(
        -31,
        -20,
        floorHeight,
        dark
    );

    createStairs(
        31,
        20,
        floorHeight,
        dark
    );


    /*
       Spawn.
    */

    player.position.set(
        0,
        1.65,
        30
    );

    yaw =
        Math.PI;

    pitch = 0;

    player.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;


    createEntity(
        -30,
        -30
    );
}


/* =========================================================
   HOTEL FLOOR
========================================================= */

function createHotelFloor(
    y,
    concrete,
    dark,
    floorMat
){

    /*
       Four building wings.
    */

    addWall(
        82,
        4,
        6,
        0,
        y+2,

/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityBlocked(
    x,
    y,
    z
){

    const radius = .42;

    const bottom =
        y-1.7;

    const top =
        y+1.7;

    for(
        const wall of walls
    ){

        if(
            top <= wall.min.y ||
            bottom >= wall.max.y
        ){
            continue;
        }

        const closestX =
            Math.max(
                wall.min.x,
                Math.min(
                    x,
                    wall.max.x
                )
            );

        const closestZ =
            Math.max(
                wall.min.z,
                Math.min(
                    z,
                    wall.max.z
                )
            );

        const dx =
            x-closestX;

        const dz =
            z-closestZ;

        if(
            dx*dx+dz*dz <
            radius*radius
        ){

            return true;
        }
    }

    return false;
}


/* =========================================================
   ENTITY AI
========================================================= */

let entityStuckTime = 0;

function updateEntity(
    delta
){

    if(!entity)
        return;


    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;

    const distance =
        Math.sqrt(
            dx*dx+dz*dz
        );


    /*
       Always exactly sprint speed.
    */

    if(distance>.2){

        const dirX =
            dx/distance;

        const dirZ =
            dz/distance;

        const speed =
            SPRINT_SPEED;

        const amount =
            speed*delta;


        /*
           Try forward.
        */

        let nx =
            entity.position.x +
            dirX*amount;

        let nz =
            entity.position.z +
            dirZ*amount;


        if(
            !entityBlocked(
                nx,
                entity.position.y,
                nz
            )
        ){

            entity.position.x = nx;
            entity.position.z = nz;

            entityStuckTime = 0;

        }else{

            /*
               Try sliding sideways.
            */

            const sideX = -dirZ;
            const sideZ = dirX;


            nx =
                entity.position.x +
                sideX*amount;

            nz =
                entity.position.z +
                sideZ*amount;


            if(
                !entityBlocked(
                    nx,
                    entity.position.y,
                    nz
                )
            ){

                entity.position.x = nx;
                entity.position.z = nz;

                entityStuckTime = 0;

            }else{

                nx =
                    entity.position.x -
                    sideX*amount;

                nz =
                    entity.position.z -
                    sideZ*amount;


                if(
                    !entityBlocked(
                        nx,
                        entity.position.y,
                        nz
                    )
                ){

                    entity.position.x = nx;
                    entity.position.z = nz;

                    entityStuckTime = 0;

                }else{

                    entityStuckTime += delta;
                }
            }
        }
    }


    /*
       Entity stuck for too long.
    */

    if(
        entityStuckTime > 1
    ){

        unstuckEntity();

        entityStuckTime = 0;
    }


    /*
       Face the player.
    */

    entity.lookAt(
        player.position.x,
        entity.position.y,
        player.position.z
    );


    /*
       Proximity effect.
    */

    const volume =
        THREE.MathUtils.clamp(
            1-distance/45,
            0,
            1
        );


    entityAudio.volume =
        volume*volume;


    /*
       Red screen when close.
    */

    if(distance < 15){

        const strength =
            1-distance/15;

        document.getElementById(
            "danger"
        ).style.boxShadow =
            `inset 0 0 180px
             rgba(
                 180,
                 0,
                 0,
                 ${strength*.6}
             )`;

    }else{

        document.getElementById(
            "danger"
        ).style.boxShadow =
            "none";
    }


    /*
       Entity catches player.
    */

    if(
        distance < 1.25
    ){

        document.getElementById(
            "message"
        ).textContent =
            "THE ENTITY FOUND YOU";

        respawn();

        setTimeout(
            ()=>{
                document.getElementById(
                    "message"
                ).textContent="";
            },
            1500
        );
    }
}


/* =========================================================
   ENTITY UNSTUCK
========================================================= */

function unstuckEntity(){

    if(!entity)
        return;


    /*
       Direction toward player.
    */

    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;

    const length =
        Math.sqrt(
            dx*dx+dz*dz
        );


    if(length<.001)
        return;


    const fx =
        dx/length;

    const fz =
        dz/length;


    /*
       First try locations directly ahead.
    */

    for(
        const distance of
        [2,3,4,5,6,8,10]
    ){

        const x =
            entity.position.x +
            fx*distance;

        const z =
            entity.position.z +
            fz*distance;


        if(
            !entityBlocked(
                x,
                entity.position.y,
                z
            )
        ){

            entity.position.x = x;
            entity.position.z = z;

            return;
        }
    }


    /*
       Then search around the entity.
    */

    for(
        let angle=0;
        angle<Math.PI*2;
        angle+=Math.PI/12
    ){

        const x =
            entity.position.x +
            Math.cos(angle)*5;

        const z =
            entity.position.z +
            Math.sin(angle)*5;


        if(
            !entityBlocked(
                x,
                entity.position.y,
                z
            )
        ){

            entity.position.x = x;
            entity.position.z = z;

            return;
        }
    }
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    delta
){

    /*
       Horizontal movement.
    */

    const movement =
        new THREE.Vector3();


    if(keys.w)
        movement.z -= 1;

    if(keys.s)
        movement.z += 1;

    if(keys.a)
        movement.x -= 1;

    if(keys.d)
        movement.x += 1;


    if(
        movement.lengthSq()>0
    ){

        movement.normalize();


        /*
           Rotate movement by camera yaw.
        */

        movement.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        const sprinting =
            keys.shift &&
            stamina>0;


        const speed =
            sprinting
            ? SPRINT_SPEED
            : WALK_SPEED;


        if(sprinting){

            stamina -=
                25*delta;

        }else{

            stamina +=
                18*delta;
        }


        stamina =
            THREE.MathUtils.clamp(
                stamina,
                0,
                100
            );


        const amount =
            speed*delta;


        /*
           X separately.
        */

        const nextX =
            player.position.x +
            movement.x*amount;


        if(
            !collidesWithWall(
                nextX,
                player.position.y,
                player.position.z
            )
        ){

            player.position.x =
                nextX;
        }


        /*
           Z separately.
        */

        const nextZ =
            player.position.z +
            movement.z*amount;


        if(
            !collidesWithWall(
                player.position.x,
                player.position.y,
                nextZ
            )
        ){

            player.position.z =
                nextZ;
        }

    }else{

        stamina +=
            18*delta;

        stamina =
            Math.min(
                stamina,
                100
            );
    }


    /*
       Jump.
    */

    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;

        grounded = false;
    }

    jumpPressed = false;


    /*
       Gravity.
    */

    velocityY -=
        GRAVITY*delta;


    let nextY =
        player.position.y +
        velocityY*delta;


    /*
       Find floor.
    */

    const floor =
        findFloor(
            player.position.x,
            player.position.z
        );


    /*
       If there is no floor beneath
       the player, fall.
    */

    if(
        floor === -Infinity
    ){

        if(
            player.position.y < -10
        ){

            respawn();
        }

    }else if(
        nextY <= floor+1.65
    ){

        nextY =
            floor+1.65;

        velocityY = 0;
        grounded = true;

    }else{

        grounded = false;
    }


    /*
       Ceiling.

       Look for a wall above the player.
    */

    if(
        velocityY>0
    ){

        for(
            const wall of walls
        ){

            const horizontal =
                player.position.x >
                wall.min.x-PLAYER_RADIUS &&
                player.position.x <
                wall.max.x+PLAYER_RADIUS &&
                player.position.z >
                wall.min.z-PLAYER_RADIUS &&
                player.position.z <
                wall.max.z+PLAYER_RADIUS;


            if(
                horizontal &&
                nextY+.25 >
                wall.min.y
            ){

                nextY =
                    wall.min.y-.25;

                velocityY=0;

                break;
            }
        }
    }


    player.position.y =
        nextY;


    checkHoles();


    document.getElementById(
        "stamina"
    ).style.width =
        stamina+"%";
}


/* =========================================================
   HOLES
========================================================= */

function checkHoles(){

    if(
        currentLevel !== "level0" ||
        !grounded
    ){
        return;
    }


    for(
        const hole of holes
    ){

        if(
            Math.abs(
                player.position.x -
                hole.x
            ) < hole.half &&

            Math.abs(
                player.position.z -
                hole.z
            ) < hole.half
        ){

            /*
               Remove grounded state and
               allow the player to fall.
            */

            grounded = false;

            return;
        }
    }
}


/* =========================================================
   RESPAWN
========================================================= */

function respawn(){

    velocityY = 0;
    grounded = true;
    stamina = 100;


    if(
        currentLevel === "hotel"
    ){

        player.position.set(
            0,
            1.65,
            30
        );

        yaw =
            Math.PI;

    }else{

        player.position.set(
            -70,
            1.65,
            -60
        );

        yaw = 0;
    }


    pitch = 0;

    player.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

const entityAudio =
    new Audio(
        "./entity.mp3"
    );

entityAudio.loop = true;
entityAudio.volume = 0;


/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld(){

    for(
        const object of worldObjects
    ){

        scene.remove(
            object
        );
    }

    worldObjects = [];
    walls = [];
    floors = [];
    holes = [];


    if(entity){

        scene.remove(
            entity
        );

        entity = null;
    }


    entityAudio.pause();

    entityAudio.currentTime = 0;

    scene.fog = null;
}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(
    level
){

    clearWorld();


    if(
        level === "hotel"
    ){

        buildHotel();

    }else{

        buildLevel0();
    }


    gameRunning = true;
    paused = false;


    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "pause"
    ).style.display =
        "none";


    /*
       Browser allows audio after
       the button click.
    */

    entityAudio.play().catch(
        ()=>{}
    );


    document.body.requestPointerLock();
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    paused = true;

    document.getElementById(
        "pause"
    ).style.display =
        "flex";

    document.exitPointerLock();

    entityAudio.pause();
}


function resumeGame(){

    paused = false;

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.body.requestPointerLock();

    entityAudio.play().catch(
        ()=>{}
    );
}


function togglePause(){

    if(paused){

        resumeGame();

    }else{

        pauseGame();
    }
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "level0"
).onclick = ()=>{

    startLevel(
        "level0"
    );
};


document.getElementById(
    "hotel"
).onclick = ()=>{

    startLevel(
        "hotel"
    );
};


document.getElementById(
    "resume"
).onclick = ()=>{

    resumeGame();
};


document.getElementById(
    "restart"
).onclick = ()=>{

    startLevel(
        currentLevel
    );
};


document.getElementById(
    "changeLevel"
).onclick = ()=>{

    gameRunning = false;
    paused = false;

    document.exitPointerLock();

    clearWorld();

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "menu"
    ).style.display =
        "flex";
};


/* =========================================================
   CLICK TO RECAPTURE MOUSE
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            gameRunning &&
            !paused &&
            document.pointerLockElement !==
            document.body
        ){

            document.body.requestPointerLock();

            entityAudio.play().catch(
                ()=>{}
            );
        }
    }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        gameRunning &&
        !paused
    ){

        updatePlayer(delta);

        updateEntity(delta);


        /*
           Camcorder flicker.
        */

        document.getElementById(
            "vhs"
        ).style.opacity =
            .25 +
            Math.random()*.08;
    }


    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
