<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Backrooms — Level 0</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
}

body{
    cursor:default;
}

canvas{
    display:block;
}

/* =========================================================
   MENU
========================================================= */

#menu{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#050505;
    overflow:hidden;
}

.menuImage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 1.4s ease;
    filter:brightness(.55) contrast(1.15) saturate(.8);
}

.menuImage.active{
    opacity:1;
}

.menuDark{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.82),
            rgba(0,0,0,.15) 65%,
            rgba(0,0,0,.7)
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.95),
            transparent 70%
        );
}

.menuScanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.12;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.08) 0px,
            rgba(255,255,255,.08) 1px,
            transparent 2px,
            transparent 5px
        );
}

.menuContent{
    position:absolute;
    left:7%;
    bottom:12%;
    color:white;
    text-shadow:2px 3px 10px #000;
}

.menuContent h1{
    margin:0;
    color:#d9ce83;
    font-size:clamp(42px,6vw,82px);
    letter-spacing:10px;
}

.menuSubtitle{
    margin-top:5px;
    color:#aaa;
    letter-spacing:4px;
    font-size:13px;
}

.menuHint{
    margin-top:14px;
    color:#777;
    font-size:11px;
    letter-spacing:2px;
}

.menuButtons{
    position:absolute;
    right:8%;
    bottom:10%;
    width:330px;
}

.menuDifficulty{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    margin-bottom:10px;
}

.menuDifficulty button,
.menuButton,
.overlay button,
.controlsPanel button{
    border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.65);
    color:#ddd;
    cursor:pointer;
}

.menuDifficulty button{
    padding:9px 2px;
}

.menuDifficulty button:hover,
.menuDifficulty button.selected{
    border-color:#d8cc70;
    background:rgba(80,70,25,.8);
    color:#fff;
}

.menuButton{
    display:block;
    width:100%;
    padding:14px 18px;
    margin:7px 0;
    text-align:left;
    font-size:15px;
}

.menuButton:hover{
    background:rgba(90,80,30,.8);
    border-color:#d8cc70;
}

/* =========================================================
   OVERLAYS
========================================================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:900;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(
            ellipse at center,
            rgba(65,60,32,.85),
            rgba(0,0,0,.98)
        );

    color:white;
}

.overlay h1{
    margin:0 0 20px;
    color:#d7cb69;
    letter-spacing:8px;
    font-size:52px;
}

.overlay button{
    width:330px;
    padding:14px;
    margin:5px;
}

.overlay button:hover{
    border-color:#d8cc70;
    background:#3c381c;
}

.deathTitle{
    color:#b00000!important;
    font-size:58px!important;
}

.deathText{
    color:#aaa;
    margin-bottom:20px;
    text-align:center;
}

/* =========================================================
   CONTROLS
========================================================= */

#controlsBox{
    position:fixed;
    inset:0;
    z-index:1500;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.85);
}

.controlsPanel{
    width:min(620px,90vw);
    padding:28px;
    background:rgba(10,10,8,.98);
    border:1px solid rgba(220,210,120,.5);
}

.controlsPanel h2{
    margin:0 0 20px;
    color:#d8cc72;
    letter-spacing:4px;
}

.controlRow{
    display:flex;
    justify-content:space-between;
    padding:10px 4px;
    border-bottom:1px solid rgba(255,255,255,.08);
    color:#aaa;
    font:14px monospace;
}

.controlKey{
    color:#fff;
}

.controlsPanel button{
    width:100%;
    padding:12px;
    margin-top:20px;
}

/* =========================================================
   HUD
========================================================= */

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    z-index:100;
    width:5px;
    height:5px;
    margin:-2px;
    border:1px solid rgba(255,255,255,.8);
    border-radius:50%;
    pointer-events:none;
}

#hud{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:100;
    color:#fff;
    font:12px monospace;
    text-shadow:2px 2px 7px #000;
}

#difficultyHud{
    margin-top:5px;
    color:#aaa;
}

#message{
    position:fixed;
    left:50%;
    top:45px;
    transform:translateX(-50%);
    z-index:100;
    color:white;
    font:14px monospace;
    text-shadow:2px 2px 8px #000;
}

#hideIndicator,
#hiddenIndicator{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    color:white;
    font:12px monospace;
    text-shadow:2px 2px 8px #000;
    opacity:0;
    pointer-events:none;
}

#hideIndicator{
    bottom:25%;
}

#hiddenIndicator{
    bottom:18%;
    color:#d4c96f;
    letter-spacing:2px;
}

#rec{
    position:fixed;
    top:17px;
    right:18px;
    z-index:100;
    color:#eee;
    font:13px monospace;
    text-shadow:2px 2px 6px #000;
}

#recDot{
    display:inline-block;
    width:9px;
    height:9px;
    margin-right:6px;
    border-radius:50%;
    background:#d00000;
    animation:blink .9s infinite;
}

@keyframes blink{
    0%,45%{opacity:1}
    46%,100%{opacity:.15}
}

#tapeTime{
    position:fixed;
    top:39px;
    right:18px;
    z-index:100;
    color:rgba(255,255,255,.7);
    font:11px monospace;
    text-shadow:2px 2px 6px #000;
}

/* =========================================================
   CRT
========================================================= */

.crt{
    position:fixed;
    inset:0;
    z-index:80;
    pointer-events:none;
    overflow:hidden;
    animation:textShadow 1.6s infinite;
}

.crt::after{
    content:" ";
    display:block;
    position:absolute;
    top:0;
    left:0;
    bottom:0;
    right:0;

    background:rgba(18,16,16,.06);

    opacity:0;

    z-index:2;
    pointer-events:none;

    animation:flicker .15s infinite;
}

.crt::before{
    content:" ";
    display:block;
    position:absolute;
    top:0;
    left:0;
    bottom:0;
    right:0;

    background:
        linear-gradient(
            rgba(18,16,16,0) 50%,
            rgba(0,0,0,.25) 50%
        ),
        linear-gradient(
            90deg,
            rgba(255,0,0,.06),
            rgba(0,255,0,.02),
            rgba(0,0,255,.06)
        );

    z-index:2;

    background-size:
        100% 3px,
        3px 100%;

    pointer-events:none;

    backdrop-filter:blur(.25px);

    mix-blend-mode:color-burn;
}

@keyframes flicker{
    0%{opacity:.27861}
    5%{opacity:.34769}
    10%{opacity:.23604}
    15%{opacity:.90626}
    20%{opacity:.18128}
    25%{opacity:.83891}
    30%{opacity:.65583}
    35%{opacity:.67807}
    40%{opacity:.26559}
    45%{opacity:.84693}
    50%{opacity:.96019}
    55%{opacity:.08594}
    60%{opacity:.20313}
    65%{opacity:.71988}
    70%{opacity:.53455}
    75%{opacity:.37288}
    80%{opacity:.71428}
    85%{opacity:.70419}
    90%{opacity:.7003}
    95%{opacity:.36108}
    100%{opacity:.24387}
}

@keyframes textShadow{
    0%{
        text-shadow:
            .438px 0 1px rgba(0,30,255,.5),
            -.438px 0 1px rgba(255,0,80,.3),
            0 0 3px;
    }

    20%{
        text-shadow:
            3.479px 0 1px rgba(0,30,255,.5),
            -3.479px 0 1px rgba(255,0,80,.3),
            0 0 3px;
    }

    40%{
        text-shadow:
            3.871px 0 1px rgba(0,30,255,.5),
            -3.871px 0 1px rgba(255,0,80,.3),
            0 0 3px;
    }

    60%{
        text-shadow:
            2.202px 0 1px rgba(0,30,255,.5),
            -2.202px 0 1px rgba(255,0,80,.3),
            0 0 3px;
    }

    80%{
        text-shadow:
            .083px 0 1px rgba(0,30,255,.5),
            -.083px 0 1px rgba(255,0,80,.3),
            0 0 3px;
    }

    100%{
        text-shadow:
            2.621px 0 1px rgba(0,30,255,.5),
            -2.621px 0 1px rgba(255,0,80,.3),
            0 0 3px;
    }
}

/* =========================================================
   ERROR
========================================================= */

#error{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:3000;
    display:none;
    padding:15px;
    background:#420000;
    border:1px solid red;
    color:white;
    font:13px monospace;
    white-space:pre-wrap;
}
</style>
</head>

<script src="./three.min.js"></script>

<script>
"use strict";

/* =========================================================
   SETTINGS
========================================================= */

/*
    CHANGE THIS ONLY IF YOUR MP3 HAS A DIFFERENT NAME.

    Recommended repository structure:

    /index.html
    /three.min.js

    /textures/
        wall.png
        floor.png
        ceiling.png
        map1.png
        menu1.jpg
        menu2.jpg
        menu3.jpg
        menu4.jpg
        menu5.jpg

    /sounds/
        entity.mp3
*/

const ENTITY_AUDIO_PATH =
    "./sounds/entity.mp3";


/* =========================================================
   GLOBAL STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

const keys = {};

let gameTime = 0;

let yaw = 0;
let pitch = 0;

let lastTime =
    performance.now();


/* =========================================================
   THREE.JS CHECK
========================================================= */

if(typeof THREE === "undefined"){

    const error =
        document.getElementById("error");

    error.style.display =
        "block";

    error.textContent =
        "THREE.JS COULD NOT BE LOADED.\n\n" +
        "Make sure three.min.js is in the repository root.";

    throw new Error(
        "Three.js missing"
    );
}


/* =========================================================
   RENDERER
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x7d7652
    );

/*
    Much lighter fog than before.

    This keeps the atmosphere without making
    the game feel like you're walking through mud.
*/

scene.fog =
    new THREE.Fog(
        0x7d7652,
        18,
        90
    );


const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .03,
        180
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:
            "high-performance",

        stencil:false,

        depth:true

    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.25
    )
);


if(
    "outputColorSpace"
    in renderer
){

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

}


renderer.toneMapping =
    THREE.NoToneMapping;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

/*
    We use mostly ambient lighting instead of thousands
    of expensive point lights.

    The actual fluorescent fixtures are bright emissive
    meshes. This gives the visual impression of the lights
    without destroying performance.
*/

scene.add(
    new THREE.AmbientLight(
        0xffefb0,
        .78
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xffefb0,
        0x272217,
        .38
    )
);


/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);


/* =========================================================
   PLAYER CONSTANTS
========================================================= */

const TILE = 3;

const WALL_HEIGHT = 9;

const PLAYER_HEIGHT = 5.8;

const EYE_HEIGHT = 5.25;

const CROUCH_EYE_HEIGHT = 3.15;

const PLAYER_RADIUS = .52;


/*
    NEW SPEEDS

    The old sprint speed was around 5.6.

    That is now normal walking speed.

    Sprint is considerably faster.

    Sprint jumping gets a little extra speed.
*/

const WALK_SPEED = 5.6;

const SPRINT_SPEED = 8.25;

const SPRINT_JUMP_SPEED = 9.25;

const CROUCH_SPEED =
    WALK_SPEED * .55;


const GRAVITY = 22;

const JUMP_SPEED = 7.4;


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;
let entityTexture = null;


function prepareTexture(
    texture,
    repeatX,
    repeatY
){

    if(!texture)
        return null;

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            4
        );

    texture.needsUpdate =
        true;

    return texture;
}


function loadTexture(
    path,
    repeatX,
    repeatY
){

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            texture,
                            repeatX,
                            repeatY
                        )
                    );

                },

                undefined,

                error => {

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    resolve(null);

                }

            );

        }
    );

}


async function loadAllTextures(){

    wallTexture =
        await loadTexture(
            "./textures/wall.png",
            1.15,
            1.15
        );


    floorTexture =
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );


    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );


    /*
        Entity PNG.

        IMPORTANT:
        We don't modify its aspect ratio.
    */

    entityTexture =
        await loadTexture(
            "./entity.png",
            1,
            1
        );

}


/* =========================================================
   MATERIALS
========================================================= */

function makeWallMaterial(){

    if(wallTexture){

        return new THREE.MeshBasicMaterial({

            map:wallTexture,

            side:
                THREE.DoubleSide

        });

    }

    return new THREE.MeshBasicMaterial({
        color:0xff00ff
    });

}


function makeFloorMaterial(){

    if(floorTexture){

        return new THREE.MeshBasicMaterial({

            map:floorTexture,

            side:
                THREE.DoubleSide

        });

    }

    return new THREE.MeshBasicMaterial({
        color:0xff00ff
    });

}


function makeCeilingMaterial(){

    if(ceilingTexture){

        return new THREE.MeshBasicMaterial({

            map:ceilingTexture,

            side:
                THREE.DoubleSide

        });

    }

    return new THREE.MeshBasicMaterial({
        color:0xff00ff
    });

}


/* =========================================================
   MAP
========================================================= */

let mapWidth = 0;
let mapHeight = 0;

let mapData = [];

let playerSpawn = null;

let entitySpawn = null;


/*
    Static collision boxes.
*/

const wallColliders = [];


/*
    Hiding spots.

    These are generated from the map's hiding pixels.
*/

const hidingSpots = [];


/*
    Hole cells.

    We keep these separately so checking the entire
    player hitbox is easy.
*/

const holeCells = [];


/* =========================================================
   MAP CLASSIFICATION
========================================================= */

function classifyPixel(
    r,
    g,
    b
){

    /*
        BLACK = WALL
    */

    if(
        Math.max(
            r,
            g,
            b
        ) < 90
    ){

        return "wall";

    }


    /*
        RED = PLAYER
    */

    if(
        r > 150 &&
        r > g * 1.45 &&
        r > b * 1.45
    ){

        return "spawn";

    }


    /*
        BLUE = ENTITY
    */

    if(
        b > 130 &&
        b > r * 1.35 &&
        b > g * 1.2
    ){

        return "entity";

    }


    /*
        PURPLE = HIDING
    */

    if(
        r > 120 &&
        b > 100 &&
        g < 100
    ){

        return "hide";

    }


    /*
        YELLOW = HOLE
    */

    if(
        r > 150 &&
        g > 130 &&
        b < 120
    ){

        return "hole";

    }


    return "floor";

}


/* =========================================================
   MAP COORDINATES
========================================================= */

function cellToWorld(
    x,
    y
){

    return {

        x:
            (x+.5)*TILE -
            mapWidth*TILE/2,

        z:
            (y+.5)*TILE -
            mapHeight*TILE/2

    };

}


function worldToCell(
    x,
    z
){

    return {

        x:
            Math.floor(
                (
                    x +
                    mapWidth*TILE/2
                ) / TILE
            ),

        y:
            Math.floor(
                (
                    z +
                    mapHeight*TILE/2
                ) / TILE
            )

    };

}


/* =========================================================
   MAP LOADING
========================================================= */

async function loadMap(){

    const image =
        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();

                img.onload =
                    ()=>resolve(img);

                img.onerror =
                    ()=>reject(
                        new Error(
                            "textures/map1.png could not be loaded."
                        )
                    );

                img.src =
                    "./textures/map1.png?v=" +
                    Date.now();

            }
        );


    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;


    console.log(
        "MAP:",
        mapWidth,
        "x",
        mapHeight
    );


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        mapWidth;

    canvas.height =
        mapHeight;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.drawImage(
        image,
        0,
        0
    );


    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;


    mapData = [];

    holeCells.length = 0;

    hidingSpots.length = 0;


    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row = [];


        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i =
                (
                    y*mapWidth+x
                )*4;


            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2]
                );


            row.push(type);


            const p =
                cellToWorld(
                    x,
                    y
                );


            if(
                type === "spawn" &&
                !playerSpawn
            ){

                playerSpawn = p;

            }


            if(
                type === "entity" &&
                !entitySpawn
            ){

                entitySpawn = p;

            }


            if(
                type === "hole"
            ){

                holeCells.push({
                    x,
                    y
                });

            }


            if(
                type === "hide"
            ){

                hidingSpots.push({
                    x:p.x,
                    z:p.z,
                    cellX:x,
                    cellY:y
                });

            }

        }


        mapData.push(row);

    }


    /*
        Fallback player spawn.
    */

    if(!playerSpawn){

        outer:
        for(
            let y=0;
            y<mapHeight;
            y++
        ){

            for(
                let x=0;
                x<mapWidth;
                x++
            ){

                if(
                    mapData[y][x] === "floor"
                ){

                    playerSpawn =
                        cellToWorld(
                            x,
                            y
                        );

                    break outer;

                }

            }

        }

    }


    /*
        Fallback entity spawn.
    */

    if(!entitySpawn){

        entitySpawn = {

            x:
                playerSpawn.x +
                TILE*8,

            z:
                playerSpawn.z +
                TILE*8

        };

    }

}


/* =========================================================
   WORLD GEOMETRY
========================================================= */

function addFloor(
    x,
    z
){

    /*
        IMPORTANT:

        Holes DO NOT call this function.

        Therefore they do not receive the floor PNG.
    */

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            makeFloorMaterial()

        );


    mesh.rotation.x =
        -Math.PI/2;


    mesh.position.set(
        x,
        0,
        z
    );


    world.add(mesh);

}


function addCeiling(
    x,
    z
){

    /*
        Ceilings ARE still created above holes.
    */

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            makeCeilingMaterial()

        );


    mesh.rotation.x =
        Math.PI/2;


    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );


    world.add(mesh);

}


/* =========================================================
   WALLS

function addWall(

    z
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE,

/* =========================================================
   3D HOLES
========================================================= */

const holeMaterial =
    new THREE.MeshBasicMaterial({

        color:0x020202,

        side:
            THREE.DoubleSide

    });


const holeInnerMaterial =
    new THREE.MeshBasicMaterial({

        color:0x000000,

        side:
            THREE.DoubleSide

    });


function buildHole(
    x,
    z
){

    /*
        The hole is actually below the floor.

        This makes it look 3D instead of being a flat
        yellow/black pixel.
    */

    const depth = 5;


    /*
        Inner dark box.
    */

    const inner =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE*.96,
                depth,
                TILE*.96
            ),

            holeInnerMaterial

        );


    inner.position.set(
        x,
        -depth/2,
        z
    );


    world.add(inner);


    /*
        Four inner walls give the hole depth.
    */

    const wallThickness = .08;


    const back =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE,
                depth,
                wallThickness
            ),

            holeMaterial

        );


    back.position.set(
        x,
        -depth/2,
        z-TILE/2
    );


    world.add(back);


    const front =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE,
                depth,
                wallThickness
            ),

            holeMaterial

        );


    front.position.set(
        x,
        -depth/2,
        z+TILE/2
    );


    world.add(front);


    const left =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                wallThickness,
                depth,
                TILE
            ),

            holeMaterial

        );


    left.position.set(
        x-TILE/2,
        -depth/2,
        z
    );


    world.add(left);


    const right =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                wallThickness,
                depth,
                TILE
            ),

            holeMaterial

        );


    right.position.set(
        x+TILE/2,
        -depth/2,
        z
    );


    world.add(right);

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    /*
        Prevent accidental duplicate builds.
    */

    while(
        world.children.length
    ){

        const obj =
            world.children.pop();

        if(
            obj.geometry
        ){

            obj.geometry.dispose();

        }

        if(
            obj.material
        ){

            if(
                Array.isArray(
                    obj.material
                )
            ){

                obj.material.forEach(
                    m=>m.dispose()
                );

            }else{

                obj.material.dispose();

            }

        }

    }


    wallColliders.length = 0;


    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                mapData[y][x];


            const p =
                cellToWorld(
                    x,
                    y
                );


            /*
                WALKABLE CELLS

                Floor is skipped on holes.
            */

            if(
                type !== "wall" &&
                type !== "hole"
            ){

                addFloor(
                    p.x,
                    p.z
                );

            }


            /*
                Ceiling remains over EVERYTHING
                including holes.
            */

            if(
                type !== "wall"
            ){

                addCeiling(
                    p.x,
                    p.z
                );

            }


            if(
                type === "wall"
            ){

                addWall(
                    p.x,
                    p.z
                );

            }


            if(
                type === "hole"
            ){

                buildHole(
                    p.x,
                    p.z
                );

            }


            /*
                Hide cells get visible lockers.
            */

            if(
                type === "hide"
            ){

                buildLocker(
                    p.x,
                    p.z
                );

            }

        }

    }

}

/* =========================================================
   BUILD LIGHT GRID
========================================================= */

function buildLights(){

    /*
        Instead of thousands of actual PointLights,
        we use visible ceiling fixtures.

        The ambient/hemisphere lights illuminate the scene.

        This is MUCH cheaper.
    */

    const spacing = 5;


    for(
        let y=2;
        y<mapHeight-2;
        y+=spacing
    ){

        for(
            let x=2;
            x<mapWidth-2;
            x+=spacing
        ){

            if(
                mapData[y] &&
                mapData[y][x] !== "wall"
            ){

                const p =
                    cellToWorld(
                        x,
                        y
                    );


                addFluorescentLight(
                    p.x,
                    p.z
                );

            }

        }

    }

}

/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
){

    const r =
        PLAYER_RADIUS;


    for(
        const wall of wallColliders
    ){

        if(
            x+r > wall.minX &&
            x-r < wall.maxX &&
            z+r > wall.minZ &&
            z-r < wall.maxZ
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   MOVE PLAYER
========================================================= */

function movePlayer(
    dx,
    dz
){

    const nextX =
        player.position.x +
        dx;


    const nextZ =
        player.position.z +
        dz;


    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x =
            nextX;

    }


    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z =
            nextZ;

    }

}


/* =========================================================
   ENTIRE HITBOX OVER HOLE
========================================================= */

/*
    This is important.

    Previously, touching a hole could make you fall.

    Now ALL FOUR corners of the player's hitbox need
    to be inside the hole cell.

    This lets you jump over holes and lets you stand
    partially over the edge safely.
*/

function entirePlayerHitboxOverHole(){

    const r =
        PLAYER_RADIUS;


    const corners = [

        {
            x:
                player.position.x-r,

            z:
                player.position.z-r
        },

        {
            x:
                player.position.x+r,

            z:
                player.position.z-r
        },

        {
            x:
                player.position.x-r,

            z:
                player.position.z+r
        },

        {
            x:
                player.position.x+r,

            z:
                player.position.z+r
        }

    ];


    for(
        const corner of corners
    ){

        const cell =
            worldToCell(
                corner.x,
                corner.z
            );


        if(
            cell.x < 0 ||
            cell.y < 0 ||
            cell.x >= mapWidth ||
            cell.y >= mapHeight
        ){

            return false;

        }


        if(
            mapData[cell.y][cell.x] !==
            "hole"
        ){

            return false;

        }

    }


    return true;

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
){

    if(
        !gameStarted ||
        paused ||
        dead
    ){

        return;

    }


    /*
        FALLING
    */

    if(falling){

        fallTimer += dt;


        const progress =
            Math.min(
                fallTimer/1.4,
                1
            );


        player.position.y =
            -progress*7;


        camera.position.y =
            EYE_HEIGHT -
            progress*1.6;


        camera.rotation.z =
            Math.sin(
                fallTimer*18
            )*.035;


        if(
            fallTimer >= 1.4
        ){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }


        return;

    }


    crouching =
        !!keys.c;


    let forward = 0;

    let strafe = 0;


    if(keys.w)
        forward += 1;

    if(keys.s)
        forward -= 1;

    if(keys.d)
        strafe += 1;

    if(keys.a)
        strafe -= 1;


    const length =
        Math.hypot(
            forward,
            strafe
        );


    if(length > 0){

        forward /= length;

        strafe /= length;


        let speed;


        /*
            NORMAL WALKING
        */

        if(crouching){

            speed =
                CROUCH_SPEED;

        }

        /*
            SPRINT
        */

        else if(
            keys.shift
        ){

            speed =
                SPRINT_SPEED;

            /*
                Small bonus while airborne
                from sprint jumping.
            */

            if(
                !grounded &&
                jumpBoostTimer > 0
            ){

                speed =
                    SPRINT_JUMP_SPEED;

            }

        }

        /*
            NORMAL WALK
        */

        else{

            speed =
                WALK_SPEED;

        }


        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);


        const dx =
            (
                strafe*cos -
                forward*sin
            ) *
            speed *
            dt;


        const dz =
            (
                -forward*cos -
                strafe*sin
            ) *
            speed *
            dt;


        movePlayer(
            dx,
            dz
        );

    }


    /*
        Jump boost timer.
    */

    if(
        jumpBoostTimer > 0
    ){

        jumpBoostTimer -= dt;

    }


    /*
        Gravity.
    */

    velocityY -=
        GRAVITY*dt;


    player.position.y +=
        velocityY*dt;


    if(
        player.position.y <= 0
    ){

        player.position.y = 0;

        velocityY = 0;

        grounded = true;

    }else{

        grounded = false;

    }


    /*
        Jumping.

        Sprint jumping is slightly faster.
    */

    if(
        grounded &&
        keys[" "] &&
        !keys.spaceUsed
    ){

        velocityY =
            JUMP_SPEED;


        grounded = false;


        if(keys.shift){

            jumpBoostTimer =
                .75;

        }


        keys.spaceUsed = true;

    }


    /*
        Camera crouching.
    */

    const targetHeight =
        crouching
        ?
        CROUCH_EYE_HEIGHT
        :
        EYE_HEIGHT;


    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );


    updateHiding();


    /*
        Only fall when the COMPLETE
        hitbox is over a hole.
    */

    if(
        grounded &&
        entirePlayerHitboxOverHole()
    ){

        falling = true;

        fallTimer = 0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}


/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest = null;

    let closestDistance =
        Infinity;


    for(
        const spot of hidingSpots
    ){

        const dx =
            player.position.x -
            spot.x;


        const dz =
            player.position.z -
            spot.z;


        const distance =
            Math.hypot(
                dx,
                dz
            );


        if(
            distance <
            closestDistance
        ){

            closestDistance =
                distance;

            closest =
                spot;

        }

    }


    const near =
        closest &&
        closestDistance <
        TILE*.7;


    hidden =
        !!(
            near &&
            crouching
        );


    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near && !hidden
        ?
        "1"
        :
        "0";


    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ?
        "1"
        :
        "0";

}

/* =========================================================
   ENTITY AUDIO
========================================================= */

let entityAudio = null;

let entityAudioReady = false;


function createEntityAudio(){

    entityAudio =
        new Audio(
            ENTITY_AUDIO_PATH
        );


    entityAudio.loop =
        true;


    entityAudio.preload =
        "auto";


    entityAudio.volume =
        0;


    entityAudio.addEventListener(
        "canplaythrough",
        ()=>{
            entityAudioReady =
                true;
        }
    );


    entityAudio.addEventListener(
        "error",
        ()=>{
            console.warn(
                "Entity MP3 could not be loaded:",
                ENTITY_AUDIO_PATH
            );
        }
    );

}


function updateEntityAudio(){

    if(
        !entityAudio ||
        !gameStarted ||
        paused ||
        dead
    ){

        return;

    }


    if(!entity)
        return;


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    /*
        Sound begins when entity is close.

        32 blocks/rough world units is the
        maximum audible distance.
    */

    const maxDistance = 32;


    if(
        distance >
        maxDistance
    ){

        entityAudio.volume =
            0;


        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }


        return;

    }


    /*
        Closer = louder.

        Non-linear curve makes the sound become
        noticeably louder when the entity gets close.
    */

    let volume =
        1 -
        distance/maxDistance;


    volume =
        volume*volume;


    volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .95
        );


    entityAudio.volume =
        volume;


    if(
        entityAudio.paused
    ){

        entityAudio.play()
            .catch(
                ()=>{
                    /*
                        Browser autoplay protection.

                        The first mouse click/start button
                        normally unlocks this.
                    */
                }
            );

    }

}


/* =========================================================
   CREATE ENTITY
========================================================= */

function createEntity(){

    let material;


    if(entityTexture){

        /*
            IMPORTANT:

            No forced width/height distortion.

            We calculate the real PNG aspect ratio.
        */

        const image =
            entityTexture.image;


        let aspect = 1;


        if(
            image &&
            image.width &&
            image.height
        ){

            aspect =
                image.width /
                image.height;

        }


        /*
            BIGGER entity.

            Height is intentionally large.

            Width follows PNG's actual proportions.
        */

        const height =
            7.2;


        const width =
            height *
            aspect;


        material =
            new THREE.MeshBasicMaterial({

                map:
                    entityTexture,

                transparent:true,

                alphaTest:.01,

                side:
                    THREE.DoubleSide,

                depthWrite:true

            });


        entity =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    width,
                    height
                ),

                material

            );


        entity.userData.width =
            width;


        entity.userData.height =
            height;

    }else{

        material =
            new THREE.MeshBasicMaterial({

                color:0x090909

            });


        entity =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    3.2,
                    7.2
                ),

                material

            );

    }


    entity.position.set(
        entitySpawn.x,
        3.6,
        entitySpawn.z
    );


    world.add(
        entity
    );


    entityWanderAngle =
        Math.random() *
        Math.PI*2;


    entityWanderTimer =
        2;


    entityLastX =
        entity.position.x;


    entityLastZ =
        entity.position.z;


    entityStuckTimer = 0;

}


/* =========================================================
   ENTITY VISION
========================================================= */

function entitySeesPlayer(){

    if(hidden)
        return false;


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    let detection;


    if(
        difficulty === "easy"
    ){

        detection = 9;

    }else if(
        difficulty === "hard"
    ){

        detection = 15;

    }else if(
        difficulty === "nightmare"
    ){

        detection = 19;

    }else{

        detection = 12;

    }


    if(
        distance >
        detection
    ){

        return false;

    }


    /*
        Cheap line-of-sight check.

        We only sample every .45 world units.
    */

    const steps =
        Math.ceil(
            distance/.45
        );


    for(
        let i=1;
        i<steps;
        i++
    ){

        const t =
            i/steps;


        const x =
            entity.position.x +
            dx*t;


        const z =
            entity.position.z +
            dz*t;


        if(
            collides(
                x,
                z
            )
        ){

            return false;

        }

    }


    return true;

}


/* =========================================================
   FIND TELEPORT POSITION
========================================================= */

/*
    If the entity gets genuinely stuck, teleport it into
    the player's GENERAL AREA.

    But NEVER directly next to the player.

    The minimum distance is approximately 20 map pixels.
*/

function teleportEntityNearPlayer(){

    const playerCell =
        worldToCell(
            player.position.x,
            player.position.z
        );


    const minimumMapDistance =
        20;


    let best = null;


    /*
        Try many random points around the player's area.
    */

    for(
        let attempt=0;
        attempt<100;
        attempt++
    ){

        const angle =
            Math.random() *
            Math.PI*2;


        const distance =
            minimumMapDistance +
            Math.random()*20;


        const cellX =
            Math.round(
                playerCell.x +
                Math.cos(angle)*distance
            );


        const cellY =
            Math.round(
                playerCell.y +
                Math.sin(angle)*distance
            );


        if(
            cellX < 0 ||
            cellY < 0 ||
            cellX >= mapWidth ||
            cellY >= mapHeight
        ){

            continue;

        }


        if(
            mapData[cellY][cellX] ===
            "wall"
        ){

            continue;

        }


        const p =
            cellToWorld(
                cellX,
                cellY
            );


        /*
            Make absolutely sure it isn't
            too close in actual world distance.
        */

        const actualDistance =
            Math.hypot(

                p.x -
                player.position.x,

                p.z -
                player.position.z

            );


        if(
            actualDistance <
            minimumMapDistance*TILE
        ){

            continue;

        }


        if(
            collides(
                p.x,
                p.z
            )
        ){

            continue;

        }


        best = p;

        break;

    }


    /*
        If no suitable point was found,
        search the map for a random walkable cell.
    */

    if(!best){

        for(
            let attempt=0;
            attempt<200;
            attempt++
        ){

            const x =
                Math.floor(
                    Math.random()*mapWidth
                );


            const y =
                Math.floor(
                    Math.random()*mapHeight
                );


            if(
                mapData[y][x] ===
                "wall"
            ){

                continue;

            }


            const p =
                cellToWorld(
                    x,
                    y
                );


            const d =
                Math.hypot(

                    p.x -
                    player.position.x,

                    p.z -
                    player.position.z

                );


            if(
                d >=
                minimumMapDistance*TILE
            ){

                best = p;

                break;

            }

        }

    }


    if(best){

        entity.position.x =
            best.x;

        entity.position.z =
            best.z;


        entityTarget = null;

        entityMemory = 0;

        entityStuckTimer = 0;


        entityWanderAngle =
            Math.random()*
            Math.PI*2;


        entityWanderTimer =
            1;


        showMessage(
            "SOMETHING MOVED..."
        );

    }

}


/* =========================================================
   ENTITY SPEED
========================================================= */

function getEntitySpeed(){

    if(
        difficulty === "easy"
    ){

        return 3.6;

    }


    if(
        difficulty === "hard"
    ){

        return 7.2;

    }


    if(
        difficulty === "nightmare"
    ){

        /*
            Nightmare is approximately as fast as
            the player's sprint-jumping speed.
        */

        return 9.15;

    }


    return 5.7;

}


/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        paused ||
        dead
    ){

        return;

    }


    /*
        Detect player.
    */

    if(
        entitySeesPlayer()
    ){

        entityTarget = {

            x:
                player.position.x,

            z:
                player.position.z

        };


        entityMemory =
            difficulty === "nightmare"
            ?
            4.5
            :
            2.5;

    }else if(
        entityMemory > 0
    ){

        entityMemory -= dt;

    }else{

        entityTarget = null;

    }


    let dx = 0;

    let dz = 0;


    /*
        CHASE
    */

    if(entityTarget){

        dx =
            entityTarget.x -
            entity.position.x;


        dz =
            entityTarget.z -
            entity.position.z;


        const length =
            Math.hypot(
                dx,
                dz
            );


        if(length > .15){

            dx /= length;

            dz /= length;

        }

    }


    /*
        WANDER
    */

    else{

        entityWanderTimer -= dt;


        if(
            entityWanderTimer <= 0
        ){

            entityWanderTimer =
                1.5 +
                Math.random()*3;


            entityWanderAngle =
                Math.random() *
                Math.PI*2;

        }


        dx =
            Math.cos(
                entityWanderAngle
            );


        dz =
            Math.sin(
                entityWanderAngle
            );

    }


    const speed =
        entityTarget
        ?
        getEntitySpeed()
        :
        1.2;


    const nx =
        entity.position.x +
        dx*speed*dt;


    const nz =
        entity.position.z +
        dz*speed*dt;


    const oldX =
        entity.position.x;


    const oldZ =
        entity.position.z;


    if(
        !collides(
            nx,
            nz
        )
    ){

        entity.position.x =
            nx;

        entity.position.z =
            nz;

    }else{

        /*
            Try sliding around the obstacle.
        */

        if(
            !collides(
                nx,
                oldZ
            )
        ){

            entity.position.x =
                nx;

        }else if(
            !collides(
                oldX,
                nz
            )
        ){

            entity.position.z =
                nz;

        }else{

            entityWanderAngle +=
                Math.PI/2 +
                Math.random();


            entityWanderTimer =
                0;

        }

    }


    /*
        Detect whether it is actually moving.

        If it doesn't move for a few seconds,
        teleport it.
    */

    const moved =
        Math.hypot(

            entity.position.x -
            entityLastX,

            entity.position.z -
            entityLastZ

        );


    if(
        moved < .05
    ){

        entityStuckTimer += dt;

    }else{

        entityStuckTimer = 0;

    }


    entityLastX =
        entity.position.x;


    entityLastZ =
        entity.position.z;


    /*
        STUCK TELEPORT
    */

    if(
        entityStuckTimer >
        4
    ){

        teleportEntityNearPlayer();

    }


    /*
        Billboard entity toward camera.

        This keeps the PNG upright and preserves
        its original aspect ratio.
    */

    entity.lookAt(
        camera.position.x,
        entity.position.y,
        camera.position.z
    );


    /*
        Kill player.
    */

    const distance =
        Math.hypot(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );


    if(
        distance < 1.15 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }


    updateEntityAudio();

}


/* =========================================================
   DEATH
========================================================= */

function die(
    reason
){

    if(dead)
        return;


    dead = true;


    if(entityAudio){

        entityAudio.pause();

        entityAudio.currentTime = 0;

        entityAudio.volume = 0;

    }


    document.getElementById(
        "deathText"
    ).textContent =
        reason;


    document.getElementById(
        "death"
    ).style.display =
        "flex";


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = 0;


function showMessage(
    text
){

    document.getElementById(
        "message"
    ).textContent =
        text;


    messageTimer = 2.5;

}


function updateMessage(
    dt
){

    if(
        messageTimer > 0
    ){

        messageTimer -= dt;


        if(
            messageTimer <= 0
        ){

            document.getElementById(
                "message"
            ).textContent =
                "";

        }

    }

}


/* =========================================================
   RESET PLAYER
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );


    yaw = 0;

    pitch = 0;


    player.rotation.y =
        0;


    camera.rotation.set(
        0,
        0,
        0
    );


    camera.position.y =
        EYE_HEIGHT;


    velocityY = 0;

    grounded = true;

    falling = false;

    fallTimer = 0;

    hidden = false;

    crouching = false;

    jumpBoostTimer = 0;

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    gameStarted = true;

    paused = false;

    dead = false;


    gameTime = 0;


    resetPlayer();


    /*
        Reset entity.
    */

    if(entity){

        world.remove(
            entity
        );


        if(entity.geometry){

            entity.geometry.dispose();

        }


        if(entity.material){

            entity.material.dispose();

        }


        entity = null;

    }


    createEntity();


    /*
        Start audio after user interaction.

        The browser is much more likely to allow
        this because startGame comes from a button.
    */

    if(entityAudio){

        entityAudio.volume = 0;

        entityAudio.play()
            .then(
                ()=>{
                    entityAudio.pause();

                    entityAudio.currentTime = 0;

                }
            )
            .catch(
                ()=>{
                    /*
                        It will start automatically when
                        the player gets close enough.
                    */
                }
            );

    }


    renderer.domElement
        .requestPointerLock();

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    ){

        return;

    }


    paused =
        !paused;


    document.getElementById(
        "pause"
    ).style.display =
        paused
        ?
        "flex"
        :
        "none";


    if(paused){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }


        if(entityAudio){

            entityAudio.pause();

        }

    }else{

        renderer.domElement
            .requestPointerLock();

    }

}


/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display =
        "flex";

}


function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display =
        "none";

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        keys[key] = true;


        if(
            event.code === "Space"
        ){

            event.preventDefault();


            if(
                grounded &&
                !crouching
            ){

                velocityY =
                    JUMP_SPEED;


                grounded = false;


                if(keys.shift){

                    jumpBoostTimer =
                        .75;

                }

            }

        }


        if(
            key === "escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display ===
                "flex"
            ){

                hideControls();

                return;

            }


            if(gameStarted){

                togglePause();

            }

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();


        keys[key] = false;


        if(
            event.code === "Space"
        ){

            keys.spaceUsed =
                false;

        }

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement === null
        ){

            return;

        }


        yaw -=
            event.movementX *
            .0021;


        pitch -=
            event.movementY *
            .0018;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock();

        }

    }
);


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick =
    startGame;


document.getElementById(
    "menuControlsBtn"
).onclick =
    showControls;


document.getElementById(
    "pauseControlsBtn"
).onclick =
    showControls;


document.getElementById(
    "controlsBackBtn"
).onclick =
    hideControls;


document.getElementById(
    "resumeBtn"
).onclick =

        paused = false;


        document.getElementById(
            "pause"
        ).style.display =
            "none";


        renderer.domElement
            .requestPointerLock();

    };


document.getElementById(
    "restartBtn"
).onclick =
    startGame;


document.getElementById(
    "retryBtn"
).onclick =
    startGame;


document.getElementById(
    "menuBtn"
).onclick =
    ()=>{

        gameStarted = false;

        paused = false;


        if(entityAudio){

            entityAudio.pause();

            entityAudio.volume = 0;

        }


        document.getElementById(
            "pause"
        ).style.display =
            "none";


        document.getElementById(
            "menu"
        ).style.display =
            "block";


        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    };


document.getElementById(
    "deathMenuBtn"
).onclick =
    ()=>{

        dead = false;

        gameStarted = false;


        if(entityAudio){

            entityAudio.pause();

            entityAudio.volume = 0;

        }


        document.getElementById(
            "death"
        ).style.display =
            "none";


        document.getElementById(
            "menu"
        ).style.display =
            "block";

    };


/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons = {

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};


function selectDifficulty(
    value
){

    difficulty =
        value;


    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name === value
            );

    }


    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();

}


difficultyButtons.easy.onclick =
    ()=>selectDifficulty("easy");


difficultyButtons.normal.onclick =
    ()=>selectDifficulty("normal");


difficultyButtons.hard.onclick =
    ()=>selectDifficulty("hard");


difficultyButtons.nightmare.onclick =
    ()=>selectDifficulty("nightmare");


/* =========================================================
   MENU ROTATION
========================================================= */

const menuImages =
    document.querySelectorAll(
        ".menuImage"
    );


let menuIndex = 0;


setInterval(
    ()=>{

        if(
            menuImages.length === 0
        ){

            return;

        }


        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );


        menuIndex =
            (
                menuIndex+1
            ) %
            menuImages.length;


        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);


/* =========================================================
   FLUORESCENT FLICKER
========================================================= */

let flickerAccumulator = 0;


function updateLights(
    dt
){

    flickerAccumulator += dt;


    /*
        Don't update every light every frame.

        This saves CPU time.
    */

    if(
        flickerAccumulator <
        .08
    ){

        return;

    }


    flickerAccumulator = 0;


    for(
        const item of fluorescentLights
    ){

        item.timer -= .08;


        if(
            item.timer <= 0
        ){

            item.timer =
                .4 +
                Math.random()*6;


            /*
                Occasional fluorescent flicker.
            */

            if(
                Math.random() <
                .13
            ){

                item.fixture.visible =
                    false;


                setTimeout(
                    ()=>{
                        if(
                            item.fixture
                        ){

                            item.fixture.visible =
                                true;

                        }
                    },
                    25 +
                    Math.random()*100
                );

            }else{

                item.fixture.visible =
                    true;

            }

        }

    }

}


/* =========================================================
   TAPE TIME
========================================================= */

function updateTapeTime(
    dt
){

    if(
        !gameStarted ||
        paused ||
        dead
    ){

        return;

    }


    gameTime += dt;


    const total =
        Math.floor(
            gameTime
        );


    const h =
        Math.floor(
            total/3600
        );


    const m =
        Math.floor(
            (total%3600)/60
        );


    const s =
        total%60;


    const f =
        n =>
            String(n)
                .padStart(
                    2,
                    "0"
                );


    document.getElementById(
        "tapeTime"
    ).textContent =
        f(h)+":"+
        f(m)+":"+
        f(s);

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    let dt =
        (now-lastTime)/1000;


    lastTime =
        now;


    /*
        Prevent huge physics jumps after
        tab switching / lag spikes.
    */

    dt =
        Math.min(
            dt,
            .04
        );


    updatePlayer(dt);

    updateEntity(dt);

    updateLights(dt);

    updateMessage(dt);

    updateTapeTime(dt);


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

   INITIALIZATION
========================================================= */

    try{

        console.log(
            "Loading Backrooms..."
        );


        console.log(
            "Wall:",
            "./textures/wall.png"
        );


        console.log(
            "Floor:",
            "./textures/floor.png"
        );


        console.log(
            "Ceiling:",
            "./textures/ceiling.png"
        );


        console.log(
            "Map:",
            "./textures/map1.png"
        );


        console.log(
            "Entity:",
            "./entity.png"
        );


        console.log(
            "Entity audio:",
            ENTITY_AUDIO_PATH
        );


        /*
            Load textures.
        */

        await loadAllTextures();


        /*
            Core textures must exist.
        */

        if(
            !wallTexture ||
            !floorTexture ||
            !ceilingTexture
        ){

            throw new Error(

                "A required texture failed to load.\n\n" +

                "Expected:\n" +

                "./textures/wall.png\n" +

                "./textures/floor.png\n" +

                "./textures/ceiling.png\n\n" +

                "Make sure the filenames are lowercase " +
                "and exactly match."

            );

        }


        /*
            Load map.
        */

        await loadMap();


        /*
            Build world.
        */

        buildWorld();


        /*
            Add cheap full-tile lights.
        */

        buildLights();


        /*
            Entity audio.
        */

        createEntityAudio();


        document.getElementById(
            "difficultyHud"
        ).textContent =
            difficulty.toUpperCase();


        console.log(
            "BACKROOMS READY."
        );


        console.log(
            "Holes:",
            holeCells.length
        );


        console.log(
            "Hiding spots:",
            hidingSpots.length
        );


        console.log(
            "Lights:",
            fluorescentLights.length
        );

    }catch(error){

            error
        );


        const errorBox =

            );


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "BACKROOMS INITIALIZATION ERROR\n\n" +
            (
                error &&
                error.stack
                ?
                error.stack
                :
                String(error)
            );

    }

}


initialize();
