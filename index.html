<script>

"use strict";


/* =========================================================
   ERROR HANDLING
========================================================= */

window.addEventListener(
    "error",
    function(e){

        const box =
            document.getElementById("error");

        box.style.display =
            "block";

        box.textContent =
            "GAME ERROR:\\n\\n"+
            e.message+
            "\\n\\n"+
            (e.filename||"")+
            ":"+
            (e.lineno||"");

        console.error(
            e.error || e.message
        );

    }
);


if(typeof THREE==="undefined"){

    throw new Error(
        "three.min.js was not loaded."
    );

}


/* =========================================================
   RENDERER
========================================================= */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .03,
        220
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.18;


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

/*
    MUCH shorter than the previous version.

    Old:
        1.45 eye height

    New:
        0.98 eye height

    This puts the lights clearly above the
    player's head.
*/

const EYE_HEIGHT = 0.98;

const PLAYER_HEIGHT = 1.25;

const PLAYER_RADIUS = 0.30;

const WALK_SPEED = 3.8;

const SPRINT_SPEED = 6.7;

const GRAVITY = 20;

const JUMP_SPEED = 6.3;


const player =
    new THREE.Object3D();


scene.add(player);


player.add(camera);


camera.position.set(
    0,
    EYE_HEIGHT,
    0
);


let yaw = 0;

let pitch = 0;

let velocityY = 0;

/* =========================================================
   GAME STATE
========================================================= */

let running = false;

let paused = false;

let dead = false;

let currentLevel = "level0";

    },

        chase:true
    },

        name:"IMPOSSIBLE",

        chase:true
    }

};


let objects = [];

let walls = [];

let floors = [];

let entity = null;

let entityTexture = null;

let entityStuckTime = 0;

    new THREE.Vector2(

    );


/* =========================================================
   INPUT
========================================================= */

const keys = {};

let jumpPressed = false;


window.addEventListener(
    "keydown",
    function(e){

        const key =
            e.key.toLowerCase();


        keys[key] = true;


        if(e.code==="Space"){

            e.preventDefault();

            if(!e.repeat){

                jumpPressed = true;

            }

);


window.addEventListener(

        ] = false;

    }
);


/* =========================================================
   MOUSE
========================================================= */

window.addEventListener(
    "mousemove",
    function(e){

        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }


        yaw -=
            e.movementX*.0021;

            );

        camera.rotation.x =

    }
);


/* =========================================================
   OBJECT MANAGEMENT
========================================================= */

function addObject(
    object
){

    scene.add(
        object
    );

    objects.push(
        object
    );

    return object;

}


/* =========================================================
   TEXTURE LOADING
========================================================= */

/*
    The loader tries several names.

    This means you don't have to rename your
    images if they use one of these common names.
*/

const textureCandidates = {

    wall:[
        "./wall.png",
        "./wall.jpg",
        "./wall.jpeg",
        "./textures/wall.png",
        "./textures/wall.jpg",
        "./textures/wall.jpeg",
        "./textures/wallpaper.png",
        "./textures/wallpaper.jpg",
        "./Wall.png",
        "./Wallpaper.png"
    ],

    floor:[
        "./floor.png",
        "./floor.jpg",
        "./floor.jpeg",
        "./textures/floor.png",
        "./textures/floor.jpg",
        "./textures/floor.jpeg",
        "./textures/carpet.png",
        "./textures/carpet.jpg",
        "./Floor.png",
        "./Carpet.png"
    ],

    ceiling:[
        "./ceiling.png",
        "./ceiling.jpg",
        "./ceiling.jpeg",
        "./textures/ceiling.png",
        "./textures/ceiling.jpg",
        "./textures/ceiling.jpeg",
        "./textures/roof.png",
        "./textures/roof.jpg",
        "./Ceiling.png"
    ]

};


const textureLoader =
    new THREE.TextureLoader();


function tryTexture(
    paths,
    fallback,
    repeatX,
    repeatY,
    callback
){

    let index = 0;


    function next(){

        if(
            index >= paths.length
        ){

            callback(
                fallback
            );

            return;

        }


        const path =
            paths[index++];


        textureLoader.load(

            path,

            function(texture){

                texture.colorSpace =
                    THREE.SRGBColorSpace;


                texture.wrapS =
                    THREE.RepeatWrapping;


                texture.wrapT =
                    THREE.RepeatWrapping;


                texture.repeat.set(
                    repeatX,
                    repeatY
                );


                texture.anisotropy =
                    renderer
                        .capabilities
                        .getMaxAnisotropy();


                console.log(
                    "Loaded texture:",
                    path
                );


                callback(
                    texture
                );

            },

            undefined,

            function(){

                next();

            }

        );

    }


    next();

}


/* =========================================================
   PROCEDURAL FALLBACKS
========================================================= */

function createWallFallback(){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 1024;

    canvas.height = 1024;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#b9ad52";


    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );


    for(
        let i=0;
        i<30000;
        i++
    ){

        const x =
            Math.random()*1024;

        const y =
            Math.random()*1024;

        const shade =
            70+
            Math.random()*45;


        ctx.fillStyle =
            `rgba(${shade},${shade-5},35,.035)`;


        ctx.fillRect(
            x,
            y,
            1+Math.random()*3,
            1+Math.random()*5
        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        5,
        4
    );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


function createFloorFallback(){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 1024;

    canvas.height = 1024;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#55564f";


    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );


    for(
        let i=0;
        i<100000;
        i++
    ){

        const x =
            Math.random()*1024;

        const y =
            Math.random()*1024;

        const brightness =
            45+
            Math.random()*55;


        ctx.fillStyle =
            `rgba(${brightness},${brightness},${brightness},.12)`;


        ctx.fillRect(
            x,
            y,
            1,
            1+Math.random()*3
        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        8,
        8
    );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


function createCeilingFallback(){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 1024;

    canvas.height = 1024;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#d6c96f";


    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );


    for(
        let x=0;
        x<1024;
        x+=128
    ){

        ctx.fillStyle =
            "rgba(65,60,35,.12)";


        ctx.fillRect(
            x,
            0,
            2,
            1024
        );

    }


    for(
        let y=0;
        y<1024;
        y+=128
    ){

        ctx.fillStyle =
            "rgba(65,60,35,.10)";


        ctx.fillRect(
            0,
            y,
            1024,
            2
        );

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        6,
        5
    );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


/* =========================================================
   BUILD MATERIALS
========================================================= */

function createLevel0Materials(){

    const wallFallback =
        createWallFallback();


    const floorFallback =
        createFloorFallback();


    const ceilingFallback =
        createCeilingFallback();


    const wall =
        new THREE.MeshStandardMaterial({

            map:wallFallback,

            color:0xffffff,

            roughness:.96,

            metalness:0

        });


    const floor =
        new THREE.MeshStandardMaterial({

            map:floorFallback,

            color:0xffffff,

            roughness:1,

            metalness:0

        });


    const ceiling =
        new THREE.MeshStandardMaterial({

            map:ceilingFallback,

            color:0xffffff,

            roughness:.92,

            metalness:0

        });


    /*
        Replace the fallbacks if actual images
        are found in the repository.
    */

    tryTexture(
        textureCandidates.wall,
        wallFallback,
        5,
        4,
        function(texture){

            wall.map =
                texture;

            wall.needsUpdate =
                true;

        }
    );


    tryTexture(
        textureCandidates.floor,
        floorFallback,
        8,
        8,
        function(texture){

            floor.map =
                texture;

            floor.needsUpdate =
                true;

        }
    );


    tryTexture(
        textureCandidates.ceiling,
        ceilingFallback,
        6,
        5,
        function(texture){

            ceiling.map =
                texture;

            /*
                Warm yellow correction.
            */

            ceiling.color.set(
                0xfff1a0
            );

            ceiling.needsUpdate =
                true;

        }
    );


    return {
        wall,
        floor,
        ceiling
    };

}


/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material

        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    addObject(
        mesh
    );


    walls.push({

        minX:x-width/2,

        maxX:x+width/2,

        minY:y-height/2,

        maxY:y+height/2,

        minZ:z-depth/2,

        maxZ:z+depth/2

    });


    return mesh;

}


/* =========================================================
   FLOOR
========================================================= */

function addFloor(
    width,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                depth
            ),

            material

        );


    mesh.rotation.x =
        -Math.PI/2;


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.receiveShadow =
        true;


    addObject(
        mesh
    );


    floors.push({

        minX:x-width/2,

        maxX:x+width/2,

        minZ:z-depth/2,

        maxZ:z+depth/2,

        y:y

    });


    return mesh;

}


/* =========================================================
   CEILING
========================================================= */

function addCeiling(
    width,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,

            ),

            material

        );


    mesh.rotation.x =
        Math.PI/2;


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.receiveShadow =
        true;


    addObject(
        mesh
    );


    return mesh;

}


/* =========================================================
   LIGHTING
========================================================= */

function addFluorescentLight(
    x,
    z,
    intensity=.85
){

    /*
        These remain HIGH above the player.

        Ceiling = 3.1
        Light   = 3.03
        Player  = 0.98
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.8,
                .07,
                .45
            ),

            new THREE.MeshBasicMaterial({

                color:0xfff3c4

            })

        );


    fixture.position.set(

        3.03,
        z
    );


    addObject(
        fixture
    );


    const light =
        new THREE.PointLight(
            0xffe9ad,
            intensity,
            19
        );


    light.position.set(
        x,
        2.88,
        z
    );


    light.castShadow =
        true;


    light.shadow.mapSize.width =
        512;


    light.shadow.mapSize.height =
        512;


    addObject(
        light
    );

}

/* =========================================================
   SPAWN
========================================================= */

function spawn(
    x,
    z,
    rotation
){

    player.position.set(
        x,
        EYE_HEIGHT,
        z
    );


    yaw =
        rotation;


    pitch =
        0;


    player.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;


    velocityY =
        0;


    grounded =
        true;

}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function hitsWall(
    x,
    y,
    z
){

    const bottom =
        y-EYE_HEIGHT;


    const top =
        bottom+PLAYER_HEIGHT;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+dz*dz <
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   FLOOR
========================================================= */

function getFloor(
    x,
    z,
    currentY
){

    let best =
        -Infinity;


    for(
        const floor of floors
    ){

        if(
            x>=floor.minX &&
            x<=floor.maxX &&
            z>=floor.minZ &&
            z<=floor.maxZ
        ){

            if(
                floor.y <=
                currentY-EYE_HEIGHT+.2
            ){

                if(
                    floor.y>best
                ){

                    best =
                        floor.y;

                }

            }

        }

    }


    return best;

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

    const direction =
        new THREE.Vector3();


    if(keys.w)
        direction.z -= 1;


    if(keys.s)
        direction.z += 1;


    if(keys.a)
        direction.x -= 1;


    if(keys.d)
        direction.x += 1;


    if(
        direction.lengthSq()>0
    ){

        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );


        /*
            Sprint has NO cooldown.
        */

        const speed =
            keys.shift
                ? SPRINT_SPEED
                : WALK_SPEED;


        const amount =
            speed*dt;


        const nextX =
            player.position.x+
            direction.x*amount;


        if(
            !hitsWall(
                nextX,
                player.position.y,
                player.position.z
            )
        ){

            player.position.x =
                nextX;

        }


        const nextZ =
            player.position.z+
            direction.z*amount;


        if(
            !hitsWall(
                player.position.x,
                player.position.y,
                nextZ
            )
        ){

            player.position.z =
                nextZ;

        }

    }


    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;


        grounded =
            false;

    }


    jumpPressed =
        false;


    velocityY -=
        GRAVITY*dt;


    let nextY =
        player.position.y+
        velocityY*dt;


    const floor =
        getFloor(
            player.position.x,
            player.position.z,
            player.position.y
        );


    if(
        floor!==-Infinity
    ){

        const target =
            floor+EYE_HEIGHT;


        if(
            nextY<=target &&
            velocityY<=0
        ){

            nextY =
                target;


            velocityY =
                0;


            grounded =
                true;

        }
        else{

            grounded =
                false;

        }

    }


    player.position.y =
        nextY;


    if(
        player.position.y < -15
    ){

        killPlayer();

    }

}


/* =========================================================
   CAMERA
========================================================= */

let cameraTime = 0;


function updateCamera(dt){

    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const movementAmount =
        moving
            ? .0028
            : .001;


    let danger =
        0;


    if(entity){

        const dx =
            entity.position.x-
            player.position.x;


        const dz =
            entity.position.z-
            player.position.z;


        const distance =
            Math.hypot(
                dx,
                dz
            );


        danger =
            THREE.MathUtils.clamp(
                1-distance/22,
                0,
                1
            );

    }


    const shake =
        movementAmount+
        danger*.003;


    camera.position.x =
        Math.sin(
            cameraTime*2.6
        )*shake;


    camera.position.y =
        EYE_HEIGHT+
        Math.sin(
            cameraTime*3.7
        )*shake*.75;


    camera.rotation.z =
        Math.sin(
            cameraTime*1.5
        )*shake*.8;


    renderer.toneMappingExposure =
        1.16+
        Math.sin(
            cameraTime*.6
        )*.018;

}

/* =========================================================
   ENTITY
========================================================= */

function setEntityTexture(
    texture
){

    if(!entity)
        return;


    entity.material.map =
        texture;


    entity.material.needsUpdate =
        true;


    /*
        FULL IMAGE.

        The PNG's native aspect ratio is used.
        Nothing is cropped.
    */

    if(
        texture.image &&
        texture.image.width &&
        texture.image.height
    ){

        const aspect =
            texture.image.width/
            texture.image.height;


        const height =
            2.0;


        const width =
            height*aspect;


        entity.scale.set(
            width/2,
            height/2,
            1
        );

    }

}


/* =========================================================
   CREATE ENTITY
========================================================= */

function createEntity(
    x,
    z
){

    /*
        Start with a square plane.

        It is resized automatically after
        entity.png loads so the entire image
        remains visible.
    */

    const geometry =
        new THREE.PlaneGeometry(
            1,
            1
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:0xffffff,

            map:entityTexture,

            transparent:true,

            side:THREE.DoubleSide,

            /*
                NO lighting.
            */

            fog:false,

            toneMapped:false

        });


    entity =
        new THREE.Mesh(
            geometry,
            material
        );


    entity.position.set(
        x,
        1.0,
        z
    );


    /*
        Billboard height starts at 2m.
    */

    entity.scale.set(
        1,
        2,
        1
    );


    addObject(
        entity
    );


    if(entityTexture){

        setEntityTexture(
            entityTexture
        );

    }

}


/* =========================================================
   ENTITY COLLISION
========================================================= */

const ENTITY_RADIUS =
    .50;


const ENTITY_HEIGHT =
    2.0;


function entityHitsWall(
    x,
    y,
    z
){

    const bottom =
        y-ENTITY_HEIGHT/2;


    const top =
        y+ENTITY_HEIGHT/2;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+dz*dz <
            ENTITY_RADIUS*
            ENTITY_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY WALL DETECTION
========================================================= */

function wallBetween(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2-x1;


    const dz =
        z2-z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance/.35
        );


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t =
            i/steps;


        const x =
            x1+dx*t;


        const z =
            z1+dz*t;


        if(
            entityHitsWall(
                x,
                entity.position.y,
                z
            )
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY PATHFINDING
========================================================= */

function findBestDirection(){

    const dx =
        player.position.x-
        entity.position.x;


    const dz =
        player.position.z-
        entity.position.z;


    const targetAngle =
        Math.atan2(
            dz,
            dx
        );


    let best =
        null;


    /*
        Check 48 possible directions.

        The entity chooses the shortest clear
        direction around the wall.
    */

    for(
        let i=0;
        i<48;
        i++
    ){

        const angle =
            i/48*
            Math.PI*
            2;


        const dirX =
            Math.cos(angle);


        const dirZ =
            Math.sin(angle);


        const test1 =
            1.5;


        const test2 =
            3.5;


        const x1 =
            entity.position.x+
            dirX*test1;


        const z1 =
            entity.position.z+
            dirZ*test1;


        const x2 =
            entity.position.x+
            dirX*test2;


        const z2 =
            entity.position.z+
            dirZ*test2;


        if(
            entityHitsWall(
                x1,
                entity.position.y,
                z1
            )
        ){

            continue;

        }


        if(
            entityHitsWall(
                x2,
                entity.position.y,
                z2
            )
        ){

            continue;

        }


        const distance =
            Math.hypot(
                player.position.x-x2,
                player.position.z-z2
            );


        let turn =
            Math.abs(
                angle-targetAngle
            );


        if(turn>Math.PI){

            turn =
                Math.PI-turn;

        }


        const score =
            distance+
            turn*.5;


        if(
            !best ||
            score<best.score
        ){

            best = {

                x:dirX,

                z:dirZ,

                score:score

            };

        }

    }


    return best;

}


/* =========================================================
   ENTITY WANDER
========================================================= */

function updateWander(
    dt
){

    wanderTimer -=
        dt;


    if(
        wanderTimer<=0
    ){

        wanderTimer =
            1.5+
            Math.random()*4;


        const angle =
            Math.random()*
            Math.PI*
            2;


        wanderDirection.set(
            Math.cos(angle),
            Math.sin(angle)
        );

    }


    const speed =
        DIFFICULTIES.easy.speed;


    const amount =
        speed*dt;


    const x =
        entity.position.x+
        wanderDirection.x*
        amount;


    const z =
        entity.position.z+
        wanderDirection.y*
        amount;


    if(
        !entityHitsWall(
            x,
            entity.position.y,
            z
        )
    ){

        entity.position.x =
            x;


        entity.position.z =
            z;

    }
    else{

        wanderTimer =
            0;

    }

}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        dead
    ){

        return;

    }


    const difficulty =
        DIFFICULTIES[
            selectedDifficulty
        ];


    if(
        !difficulty.chase
    ){

        updateWander(
            dt
        );

    }
    else{

        const dx =
            player.position.x-
            entity.position.x;


        const dz =
            player.position.z-
            entity.position.z;


        const distance =
            Math.hypot(
                dx,
                dz
            );


        if(
            distance>.2
        ){

            const blocked =
                wallBetween(
                    entity.position.x,
                    entity.position.z,
                    player.position.x,
                    player.position.z
                );


            let direction;


            if(!blocked){

                direction = {

                    x:dx/distance,

                    z:dz/distance

                };

            }
            else{

                /*
                    WALL DETECTED.

                    Find the fastest route around it.
                */

                direction =
                    findBestDirection();

            }


            if(direction){

                const amount =
                    difficulty.speed*
                    dt;


                const x =
                    entity.position.x+
                    direction.x*
                    amount;


                const z =
                    entity.position.z+
                    direction.z*
                    amount;


                if(
                    !entityHitsWall(
                        x,
                        entity.position.y,
                        z
                    )
                ){

                    entity.position.x =
                        x;


                    entity.position.z =
                        z;


                    entityStuckTime =
                        0;

                }
                else{

                    entityStuckTime +=
                        dt;

                }

            }
            else{

                entityStuckTime +=
                    dt;

            }

        }


        if(
            entityStuckTime>1
        ){

            /*
                Emergency unstuck.
            */

            for(
                let i=0;
                i<30;
                i++
            ){

                const angle =
                    Math.random()*
                    Math.PI*
                    2;


                const x =
                    entity.position.x+
                    Math.cos(angle)*3;


                const z =
                    entity.position.z+
                    Math.sin(angle)*3;


                if(
                    !entityHitsWall(
                        x,
                        entity.position.y,
                        z
                    )
                ){

                    entity.position.x =
                        x;


                    entity.position.z =
                        z;


                    break;

                }

            }


            entityStuckTime =
                0;

        }


        if(
            distance<1.15
        ){

            killPlayer();

            return;

        }

    }


    /*
        Entity faces the player.

        This does NOT change its texture.
    */

    const lookX =
        player.position.x-
        entity.position.x;


    const lookZ =
        player.position.z-
        entity.position.z;


    entity.rotation.y =
        Math.atan2(
            lookX,
            lookZ
        );


    /*
        Danger effect.
    */

    const dx =
        player.position.x-
        entity.position.x;


    const dz =
        player.position.z-
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        difficulty.chase &&
        distance<20
    ){

        const amount =
            1-distance/20;


        document.getElementById(
            "danger"
        ).style.boxShadow =
            `inset 0 0 180px rgba(130,0,0,${amount*.42})`;

    }
    else{

        document.getElementById(
            "danger"
        ).style.boxShadow =
            "none";

    }

}

/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld(){

    for(
        const object of objects
    ){

        scene.remove(
            object
        );


        if(
            object.geometry
        ){

            object.geometry.dispose();

        }


        if(
            object.material
        ){

            if(
                Array.isArray(
                    object.material
                )
            ){

                object.material.forEach(
                    material =>
                        material.dispose()
                );

            }
            else{

                object.material.dispose();

            }

        }

    }


    objects = [];

    walls = [];

    floors = [];

    entity = null;

    entityStuckTime = 0;

    scene.fog = null;

    entityAudio.pause();

    entityAudio.currentTime = 0;

}

        }

        paused =
            false;


        dead =
            false;


        document.getElementById(
            "menu"
        ).style.display =
            "none";


        document.getElementById(
            "pause"
        ).style.display =
            "none";


        document.getElementById(
            "death"
        ).style.display =
            "none";


        document.getElementById(
            "difficultyHud"
        ).textContent =
            DIFFICULTIES[
                selectedDifficulty
            ].name;


        document.body.requestPointerLock();


        entityAudio.play().catch(
            ()=>{}
        );

    }
    catch(error){

        const box =
            document.getElementById(
                "error"
            );


        box.style.display =
            "block";


        box.textContent =
            "GAME ERROR:\\n\\n"+
            error.stack;

        console.error(
            error
        );

    }

}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(
        !running ||
        dead
    )
        return;


    paused =
        true;


    document.getElementById(
        "pause"
    ).style.display =
        "flex";


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    entityAudio.pause();

}


function resumeGame(){

    if(
        !running ||
        dead
    )
        return;


    paused =
        false;


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.body.requestPointerLock();


    entityAudio.play().catch(
        ()=>{}
    );

}


function togglePause(){

    if(paused){

        resumeGame();

    }
    else{

        pauseGame();

    }

}


/* =========================================================
   MAIN MENU
========================================================= */

function returnToMenu(){

    running =
        false;


    paused =
        false;


    dead =
        false;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";

}


/* =========================================================
   DIFFICULTY
========================================================= */

function selectDifficulty(
    difficulty
){

    selectedDifficulty =
        difficulty;


    document
        .querySelectorAll(
            ".difficulty button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );


    const ids = {

        easy:"easyBtn",

        normal:"normalBtn",

        hard:"hardBtn",

        impossible:"impossibleBtn"

    };


    document.getElementById(
        ids[difficulty]
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            difficulty
        ].name;

}

/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateCamera(dt);

    }


    renderer.render(
        scene,
        camera
    );

}
