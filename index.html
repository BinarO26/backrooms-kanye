<script src="./three.min.js"></script>

<script>

/* =========================================================
   TEXTURES
========================================================= */

const TEXTURES = {

    wall:"./textures/wall.png",

    floor:"./textures/floor.png",

    ceiling:"./textures/ceiling.png"

};


const FALLBACK_COLORS = {

    wall:0xb5aa55,

    floor:0x56574f,

    /*
        Warm original Backrooms ceiling color.
    */

    ceiling:0xd2c46c

};


/* =========================================================
   THREE
========================================================= */

if(typeof THREE === "undefined"){

    throw new Error(
        "three.min.js could not be loaded."
    );

}


const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        76,
        innerWidth/innerHeight,
        .03,
        250
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


/*
    Slightly brighter than before so textures
    don't disappear into the darkness.
*/

renderer.toneMappingExposure =
    1.12;


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();


scene.add(player);


/*
    Shorter player.

    The ceiling remains around 3m high,
    but the player's viewpoint is much lower.
*/

const EYE_HEIGHT = 1.30;

const PLAYER_HEIGHT = 1.60;

const PLAYER_RADIUS = .30;


const WALK_SPEED = 3.8;

const SPRINT_SPEED = 6.6;

const GRAVITY = 20;

const JUMP_SPEED = 6.5;


player.add(camera);


camera.position.set(
    0,
    EYE_HEIGHT,
    0
);


let yaw = 0;

let pitch = 0;

let velocityY = 0;

let grounded = true;


/* =========================================================
   CAMERA FOUND FOOTAGE
========================================================= */

let cameraTime = 0;

let shakeStrength = 0;

let lastCameraX = 0;

let lastCameraY = 0;


/*
    Small natural handheld camera movement.
*/

function updateCameraEffect(dt){

    cameraTime += dt;


    let dangerAmount = 0;


    if(entity){

        const dx =
            player.position.x -
            entity.position.x;

        const dz =
            player.position.z -
            entity.position.z;


        const distance =
            Math.hypot(dx,dz);


        dangerAmount =
            THREE.MathUtils.clamp(
                1-distance/25,
                0,
                1
            );

    }


    const walking =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const movementShake =
        walking ? .0025 : .001;


    const dangerShake =
        dangerAmount*.0035;


    shakeStrength =
        movementShake +
        dangerShake;


    /*
        Low-frequency handheld movement.
    */

    const swayX =
        Math.sin(cameraTime*2.7) *
        shakeStrength;


    const swayY =
        Math.sin(cameraTime*3.9) *
        shakeStrength*.75;


    /*
        Very subtle random analog camera movement.
    */

    const jitterX =
        (Math.random()-.5) *
        shakeStrength*.45;


    const jitterY =
        (Math.random()-.5) *
        shakeStrength*.45;


    camera.position.x =
        swayX +
        jitterX;


    camera.position.y =
        EYE_HEIGHT +
        swayY +
        jitterY;


    /*
        Slight handheld roll.
    */

    camera.rotation.z =
        Math.sin(cameraTime*1.7) *
        shakeStrength*.9;


    /*
        Slight focus/exposure-like fluctuation.
    */

    const exposureNoise =
        Math.sin(cameraTime*.55)*.025 +
        Math.sin(cameraTime*1.31)*.012;


    renderer.toneMappingExposure =
        1.10 +
        exposureNoise +
        dangerAmount*.04;

}


/* =========================================================
   WORLD
========================================================= */

let objects = [];

let walls = [];

let floors = [];

let entity = null;

let entityTexture = null;

let currentLevel = "level0";

let selectedDifficulty = "normal";

let running = false;

let paused = false;

let dead = false;

let entityStuckTime = 0;

let wanderTimer = 0;

let wanderDirection =
    new THREE.Vector2(1,0);


/* =========================================================
   DIFFICULTIES
========================================================= */

const DIFFICULTIES = {

    easy:{
        name:"EASY",
        speed:1.4,
        chase:false
    },

    normal:{
        name:"NORMAL",
        speed:5.25,
        chase:true
    },

    hard:{
        name:"HARD",
        speed:7.0,
        chase:true
    },

    impossible:{
        name:"IMPOSSIBLE",
        speed:9.0,
        chase:true
    }

};


/* =========================================================
   INPUT
========================================================= */

const keys = {};

let jumpPressed = false;


window.addEventListener(
    "keydown",
    function(e){

        const key =
            e.key.toLowerCase();


        keys[key] = true;


        if(e.code === "Space"){

            e.preventDefault();


            if(!e.repeat){

                jumpPressed = true;

            }

        }


        if(
            e.code === "Escape" ||
            key === "p"
        ){

            if(
                running &&
                !dead
            ){

                togglePause();

            }

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   MOUSE
========================================================= */

window.addEventListener(
    "mousemove",
    function(e){

        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }


        yaw -=
            e.movementX*.0021;


        pitch -=
            e.movementY*.0021;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.48,
                1.48
            );


        player.rotation.y =
            yaw;


        /*
            Keep normal pitch control.
        */

        camera.rotation.x =
            pitch;

    }
);


/* =========================================================
   OBJECTS
========================================================= */

function addObject(object){

    scene.add(object);

    objects.push(object);

    return object;

}


/* =========================================================
   TEXTURE LOADER
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


function loadTexture(
    path,
    fallbackColor,
    repeatX,
    repeatY,
    warmCeiling=false
){

    const material =
        new THREE.MeshStandardMaterial({

            color:fallbackColor,

            roughness:.96,

            metalness:0

        });


    textureLoader.load(

        path,

        function(texture){

            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.repeat.set(
                repeatX,
                repeatY
            );


            texture.anisotropy =
                renderer
                    .capabilities
                    .getMaxAnisotropy();


            /*
                For the ceiling, multiply the
                uploaded texture by a warm yellow.
            */

            if(warmCeiling){

                material.color.set(
                    0xe2d276
                );

            }
            else{

                material.color.set(
                    0xffffff
                );

            }


            material.map =
                texture;


            material.needsUpdate =
                true;

        },

        undefined,

        function(){

            console.warn(
                "Texture failed:",
                path
            );

        }

    );


    return material;

}


/* =========================================================
   MATERIALS
========================================================= */

function createEnvironmentMaterials(){

    return {

        wall:loadTexture(
            TEXTURES.wall,
            FALLBACK_COLORS.wall,
            5,
            4
        ),

        floor:loadTexture(
            TEXTURES.floor,
            FALLBACK_COLORS.floor,
            8,
            8
        ),

        ceiling:loadTexture(
            TEXTURES.ceiling,
            FALLBACK_COLORS.ceiling,
            6,
            5,
            true
        )

    };

}


/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material

        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    addObject(mesh);


    walls.push({

        minX:x-width/2,

        maxX:x+width/2,

        minY:y-height/2,

        maxY:y+height/2,

        minZ:z-depth/2,

        maxZ:z+depth/2

    });


    return mesh;

}


/* =========================================================
   FLOOR
========================================================= */

function addFloor(
    width,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                depth
            ),

            material

        );


    mesh.rotation.x =
        -Math.PI/2;


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.receiveShadow =
        true;


    addObject(mesh);


    floors.push({

        minX:x-width/2,

        maxX:x+width/2,

        minZ:z-depth/2,

        maxZ:z+depth/2,

        y:y

    });


    return mesh;

}


/* =========================================================
   CEILING
========================================================= */

function addCeiling(
    width,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                depth
            ),

            material

        );


    mesh.rotation.x =
        Math.PI/2;


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.receiveShadow =
        true;


    addObject(mesh);


    return mesh;

}


/* =========================================================
   LIGHT
========================================================= */

function addFluorescentLight(
    x,
    z,
    intensity=1
){

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.6,
                .06,
                .42
            ),

            new THREE.MeshBasicMaterial({

                color:0xfff1bd

            })

        );


    fixture.position.set(
        x,
        3.02,
        z
    );


    addObject(fixture);


    const light =
        new THREE.PointLight(
            0xffe6a1,
            intensity,
            18
        );


    light.position.set(
        x,
        2.84,
        z
    );


    light.castShadow =
        true;


    light.shadow.mapSize.width =
        512;


    light.shadow.mapSize.height =
        512;


    addObject(light);

}


/* =========================================================
   LEVEL 0
========================================================= */

function buildLevel0(){

    currentLevel =
        "level0";


    document.getElementById(
        "levelName"
    ).textContent =
        "LEVEL 0 — BACKROOMS";


    /*
        Original warm yellow-brown
        Backrooms color.
    */

    scene.background =
        new THREE.Color(
            0x625c32
        );


    scene.fog =
        new THREE.Fog(
            0x625c32,
            38,
            180
        );


    /*
        Warm ambient light.
    */

    addObject(
        new THREE.HemisphereLight(
            0xffefb2,
            0x292715,
            2.15
        )
    );


    addObject(
        new THREE.AmbientLight(
            0xffe9a6,
            .9
        )
    );


    const materials =
        createEnvironmentMaterials();


    const CEILING =
        3.05;

    addFloor(
        180,

        materials.floor
    );


    /* OUTER WALLS */

    addWall(
        180,

        0,

    );

        180,
        CEILING,
        1,

        CEILING/2,
        80,

    );


    addWall(
        1,
        CEILING,
        160,

        0,

    );

    );


    addWall(
        1,
        CEILING,
        18,

/* =========================================================
   SPAWN
========================================================= */

function spawn(
    x,
    z,
    rotation
){

    player.position.set(
        x,
        EYE_HEIGHT,
        z
    );


    yaw =
        rotation;


    pitch =
        0;


    player.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;


    velocityY =
        0;


    grounded =
        true;

}


/* =========================================================
   COLLISION
========================================================= */

function hitsWall(
    x,
    y,
    z
){

    const bottom =
        y-EYE_HEIGHT;


    const top =
        bottom+PLAYER_HEIGHT;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+dz*dz <
            PLAYER_RADIUS*PLAYER_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   FLOOR
========================================================= */

function floorBelow(
    x,
    z,
    currentY
){

    let best =
        -Infinity;


    for(
        const floor of floors
    ){

        if(
            x>=floor.minX &&
            x<=floor.maxX &&
            z>=floor.minZ &&
            z<=floor.maxZ
        ){

            if(
                floor.y<=
                currentY-EYE_HEIGHT+.15
            ){

                if(
                    floor.y>best
                ){

                    best =
                        floor.y;

                }

            }

        }

    }


    return best;

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt){

    const direction =
        new THREE.Vector3();


    if(keys.w)
        direction.z-=1;


    if(keys.s)
        direction.z+=1;


    if(keys.a)
        direction.x-=1;


    if(keys.d)
        direction.x+=1;


    if(
        direction.lengthSq()>0
    ){

        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );


        /*
            No sprint cooldown.
        */

        const speed =
            keys.shift
                ? SPRINT_SPEED
                : WALK_SPEED;


        const amount =
            speed*dt;


        const newX =
            player.position.x+
            direction.x*amount;


        if(
            !hitsWall(
                newX,
                player.position.y,
                player.position.z
            )
        ){

            player.position.x =
                newX;

        }


        const newZ =
            player.position.z+
            direction.z*amount;


        if(
            !hitsWall(
                player.position.x,
                player.position.y,
                newZ
            )
        ){

            player.position.z =
                newZ;

        }

    }


    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;


        grounded =
            false;

    }


    jumpPressed =
        false;


    velocityY -=
        GRAVITY*dt;


    let nextY =
        player.position.y+
        velocityY*dt;


    const floor =
        floorBelow(
            player.position.x,
            player.position.z,
            player.position.y
        );


    if(
        floor===-Infinity
    ){

        grounded =
            false;

    }
    else{

        const targetY =
            floor+EYE_HEIGHT;


        if(
            nextY<=targetY &&
            velocityY<=0
        ){

            nextY =
                targetY;


            velocityY =
                0;


            grounded =
                true;

        }
        else{

            grounded =
                false;

        }

    }


    player.position.y =
        nextY;


    if(
        player.position.y<-15
    ){

        killPlayer();

    }

}

/* =========================================================
   ENTITY
========================================================= */

function createEntity(
    x,
    z
){

    /*
        Preserve the PNG aspect ratio.

        Nothing stretches it to the room.
    */

    const width =
        1.8;


    const height =
        1.35;


    const material =
        new THREE.MeshBasicMaterial({

            color:0xffffff,

            map:entityTexture,

            side:THREE.DoubleSide,

            fog:false,

            toneMapped:false,

            transparent:true

        });


    /*
        IMPORTANT:

        MeshBasicMaterial means the room's lights
        do NOT shade the entity.

        fog:false means room fog doesn't affect it.

        toneMapped:false keeps the original PNG
        colors much closer to the source.
    */

    entity =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            material

        );


    entity.position.set(
        x,
        height/2,
        z
    );


    addObject(entity);

}


/* =========================================================
   ENTITY COLLISION
========================================================= */

const ENTITY_RADIUS =
    .50;


const ENTITY_HEIGHT =
    1.35;


function entityHitsWall(
    x,
    y,
    z
){

    const bottom =
        y-ENTITY_HEIGHT/2;


    const top =
        y+ENTITY_HEIGHT/2;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+dz*dz <
            ENTITY_RADIUS*ENTITY_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   LINE OF SIGHT
========================================================= */

function lineBlocked(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2-x1;


    const dz =
        z2-z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance/.35
        );


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t =
            i/steps;


        const x =
            x1+dx*t;


        const z =
            z1+dz*t;


        if(
            entityHitsWall(
                x,
                entity.position.y,
                z
            )
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY PATHFINDING
========================================================= */

function chooseEntityDirection(){

    const dx =
        player.position.x-
        entity.position.x;


    const dz =
        player.position.z-
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance<.01
    ){

        return null;

    }


    const targetAngle =
        Math.atan2(
            dz,
            dx
        );


    let best =
        null;


    /*
        36 possible directions.

        The AI checks several distances ahead
        before choosing a route.
    */

    for(
        let i=0;
        i<36;
        i++
    ){

        const angle =
            i/36*Math.PI*2;


        const dirX =
            Math.cos(angle);


        const dirZ =
            Math.sin(angle);


        const testDistance =
            2.0;


        const testX =
            entity.position.x+
            dirX*testDistance;


        const testZ =
            entity.position.z+
            dirZ*testDistance;


        if(
            entityHitsWall(
                testX,
                entity.position.y,
                testZ
            )
        ){

            continue;

        }


        const testX2 =
            entity.position.x+
            dirX*3.5;


        const testZ2 =
            entity.position.z+
            dirZ*3.5;


        if(
            entityHitsWall(
                testX2,
                entity.position.y,
                testZ2
            )
        ){

            continue;

        }


        const newDistance =
            Math.hypot(
                player.position.x-testX,
                player.position.z-testZ
            );


        let turn =
            Math.abs(
                angle-targetAngle
            );


        if(
            turn>Math.PI
        ){

            turn =
                Math.PI-turn;

        }


        let score =
            newDistance+
            turn*.65;


        if(
            !lineBlocked(
                entity.position.x,
                entity.position.z,
                player.position.x,
                player.position.z
            )
        ){

            score =
                newDistance+
                turn*1.5;

        }


        if(
            !best ||
            score<best.score
        ){

            best = {

                x:dirX,

                z:dirZ,

                score:score

            };

        }

    }


    return best;

}


/* =========================================================
   UNSTUCK
========================================================= */

function unstuckEntity(){

    for(
        let i=0;
        i<24;
        i++
    ){

        const angle =
            Math.random()*
            Math.PI*2;


        const x =
            entity.position.x+
            Math.cos(angle)*2.5;


        const z =
            entity.position.z+
            Math.sin(angle)*2.5;


        if(
            !entityHitsWall(
                x,
                entity.position.y,
                z
            )
        ){

            entity.position.x =
                x;


            entity.position.z =
                z;


            return;

        }

    }

}

/* =========================================================
   EASY WANDER
========================================================= */

function updateWander(dt){

    wanderTimer -=
        dt;


    if(
        wanderTimer<=0
    ){

        wanderTimer =
            2+
            Math.random()*4;


        const angle =
            Math.random()*
            Math.PI*2;


        wanderDirection.set(
            Math.cos(angle),
            Math.sin(angle)
        );

    }


    const speed =
        DIFFICULTIES.easy.speed;


    const amount =
        speed*dt;


    const newX =
        entity.position.x+
        wanderDirection.x*amount;


    const newZ =
        entity.position.z+
        wanderDirection.y*amount;


    if(
        entityHitsWall(
            newX,
            entity.position.y,
            newZ
        )
    ){

        wanderTimer =
            0;


        return;

    }


    entity.position.x =
        newX;


    entity.position.z =
        newZ;

}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        dead
    ){

        return;

    }


    const difficulty =
        DIFFICULTIES[
            selectedDifficulty
        ];


    if(
        !difficulty.chase
    ){

        updateWander(dt);

    }
    else{

        const dx =
            player.position.x-
            entity.position.x;


        const dz =
            player.position.z-
            entity.position.z;


        const distance =
            Math.hypot(
                dx,
                dz
            );


        if(
            distance>.15
        ){

            const blocked =
                lineBlocked(
                    entity.position.x,
                    entity.position.z,
                    player.position.x,
                    player.position.z
                );


            let direction;


            if(!blocked){

                direction = {

                    x:dx/distance,

                    z:dz/distance

                };

            }
            else{

                direction =
                    chooseEntityDirection();

            }


            if(direction){

                const amount =
                    difficulty.speed*dt;


                const newX =
                    entity.position.x+
                    direction.x*amount;


                const newZ =
                    entity.position.z+
                    direction.z*amount;


                if(
                    !entityHitsWall(
                        newX,
                        entity.position.y,
                        newZ
                    )
                ){

                    entity.position.x =
                        newX;


                    entity.position.z =
                        newZ;


                    entityStuckTime =
                        0;

                }
                else{

                    entityStuckTime +=
                        dt;

                }

            }
            else{

                entityStuckTime +=
                    dt;

            }

        }


        if(
            entityStuckTime>1
        ){

            unstuckEntity();

            entityStuckTime =
                0;

        }


        if(
            distance<1.0
        ){

            killPlayer();

            return;

        }

    }


    /*
        Make the entity face the player.

        This does not affect its texture.
    */

    const lookX =
        player.position.x-
        entity.position.x;


    const lookZ =
        player.position.z-
        entity.position.z;


    entity.rotation.y =
        Math.atan2(
            lookX,
            lookZ
        );


    /*
        Audio.
    */

    const dx =
        player.position.x-
        entity.position.x;


    const dz =
        player.position.z-
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    entityAudio.volume =
        THREE.MathUtils.clamp(
            1-distance/55,
            0,
            1
        )*.75;


    /*
        Danger effect.
    */

    if(
        difficulty.chase &&
        distance<18
    ){

        const strength =
            1-distance/18;


        document.getElementById(
            "danger"
        ).style.boxShadow =
            `inset 0 0 180px rgba(150,0,0,${strength*.45})`;

    }
    else{

        document.getElementById(
            "danger"
        ).style.boxShadow =
            "none";

    }

}

/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld(){

    for(
        const object of objects
    ){

        scene.remove(object);


        if(object.geometry){

            object.geometry.dispose();

        }


        if(object.material){

            if(
                Array.isArray(
                    object.material
                )
            ){

                object.material.forEach(
                    material => {

                        material.dispose();

                    }
                );

            }
            else{

                object.material.dispose();

            }

        }

    }


    objects =
        [];


    walls =
        [];


    floors =
        [];


    entity =
        null;


    entityStuckTime =
        0;


    entityAudio.pause();


    entityAudio.currentTime =
        0;


    scene.fog =
        null;

}

            !paused &&
            !dead &&
            document.pointerLockElement !==
            document.body
        ){

            document.body.requestPointerLock();


            entityAudio.play().catch(
                function(){}
            );

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateCameraEffect(dt);

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
