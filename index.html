<script type="module">

import * as THREE from "./three.module.js";

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted=false;
let paused=false;
let dead=false;
let difficulty="normal";

let gameTime=0;
let messageTimer=0;

/* =========================================================
   THREE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x272619);

scene.fog=new THREE.FogExp2(
    0x272619,
    0.021
);

const camera=new THREE.PerspectiveCamera(
    78,
    innerWidth/innerHeight,
    .04,
    300
);

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio||1,
        1.0
    )
);

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=.78;

document.body.appendChild(
    renderer.domElement
);

const world=new THREE.Group();

scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE=3;
const WALL_HEIGHT=9;

const PLAYER_RADIUS=.42;

const EYE_HEIGHT=5.25;
const CROUCH_HEIGHT=3.25;

/*
    Faster movement.
*/

const WALK_SPEED=8.2;
const SPRINT_SPEED=13.8;
const JUMP_SPRINT_SPEED=15.5;

const GRAVITY=21;
const JUMP_SPEED=8.2;

/* =========================================================
   LIGHTING
========================================================= */

/*
    Dark base environment.
    Real point lights create the dramatic pools of light.
*/

scene.add(
    new THREE.HemisphereLight(
        0x655d42,
        0x050504,
        .18
    )
);

scene.add(
    new THREE.AmbientLight(
        0x5b5438,
        .08
    )
);

const fluorescentLights=[];

/* =========================================================
   TEXTURES
========================================================= */

const loader=new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;

function configureTexture(tex,rx,ry){

    if(!tex) return null;

    tex.colorSpace=
        THREE.SRGBColorSpace;

    tex.wrapS=
        THREE.RepeatWrapping;

    tex.wrapT=
        THREE.RepeatWrapping;

    tex.repeat.set(
        rx,
        ry
    );

    tex.magFilter=
        THREE.LinearFilter;

    tex.minFilter=
        THREE.LinearMipmapLinearFilter;

    tex.anisotropy=
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    tex.needsUpdate=true;

    return tex;
}

/*
    IMPORTANT:

    Texture failure no longer stops the game.

    The world is built first and each texture is
    attached if it successfully loads.
*/

function optionalTexture(
    path,
    rx,
    ry
){

    return new Promise(resolve=>{

        loader.load(

            path,

            tex=>{

                console.log(
                    "LOADED:",
                    path
                );

                resolve(
                    configureTexture(
                        tex,
                        rx,
                        ry
                    )
                );

            },

            undefined,

            err=>{

                console.warn(
                    "Texture unavailable:",
                    path
                );

                resolve(null);

            }

        );

    });

}

/* =========================================================
   MATERIALS
========================================================= */

/*
    MeshStandardMaterial is used for the actual environment.

    The textures remain visible while dramatic lighting
    affects them.
*/

const wallMaterial=
    new THREE.MeshStandardMaterial({

        color:0xd0bf72,

        roughness:.88,
        metalness:0,

        side:THREE.DoubleSide

    });

const floorMaterial=
    new THREE.MeshStandardMaterial({

        color:0x827b55,

        roughness:.96,
        metalness:0,

        side:THREE.DoubleSide

    });

const ceilingMaterial=
    new THREE.MeshStandardMaterial({

        color:0xbab89e,

        roughness:.9,

        side:THREE.DoubleSide

    });

/* =========================================================
   MAP DATA
========================================================= */

let mapWidth=0;
let mapHeight=0;

let mapData=[];

let playerSpawn=null;
let entitySpawn=null;

const wallColliders=[];
const holeCells=[];
const hideCells=[];
const walkableCells=[];

/* =========================================================
   MAP CLASSIFICATION
========================================================= */

function classifyPixel(r,g,b,a){

    if(a<20)
        return "floor";

    if(
        r<80 &&
        g<80 &&
        b<80
    )
        return "wall";

    if(
        r>150 &&
        r>g*1.4 &&
        r>b*1.4
    )
        return "spawn";

    if(
        b>125 &&
        b>r*1.3 &&
        b>g*1.15
    )
        return "entity";

    if(
        r>105 &&
        b>105 &&
        g<115
    )
        return "hide";

    if(
        r>135 &&
        g>115 &&
        b<125
    )
        return "hole";

    return "floor";
}

function insideMap(x,y){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function isHole(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]==="hole"
    );

}

function isWalkable(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]!=="wall"
    );

}

/* =========================================================
   COORDINATES
========================================================= */

function cellToWorld(x,y){

    return {

        x:
            (x+.5)*TILE-
            mapWidth*TILE*.5,

        z:
            (y+.5)*TILE-
            mapHeight*TILE*.5

    };

}

function worldToCell(x,z){

    return {

        x:
            Math.floor(
                (
                    x+
                    mapWidth*TILE*.5
                )/TILE
            ),

        y:
            Math.floor(
                (
                    z+
                    mapHeight*TILE*.5
                )/TILE
            )

    };

}

/* =========================================================
   MAP LOADING
========================================================= */

async function loadMap(){

    const image=
        await new Promise(
            (resolve,reject)=>{

                const img=new Image();

                img.onload=
                    ()=>resolve(img);

                img.onerror=
                    ()=>reject(
                        new Error(
                            "textures/map1.png could not be loaded."
                        )
                    );

                img.src=
                    "./textures/map1.png";

            }
        );

    mapWidth=
        image.naturalWidth;

    mapHeight=
        image.naturalHeight;

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=mapWidth;
    canvas.height=mapHeight;

    const ctx=
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels=
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row=[];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i=
                (y*mapWidth+x)*4;

            const type=
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(type!=="wall")
                walkableCells.push({x,y});

            if(type==="hole")
                holeCells.push({x,y});

            if(type==="hide")
                hideCells.push({x,y});

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

        mapData.push(row);

    }

    if(!playerSpawn){

        const c=
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        if(!c)
            throw new Error(
                "map1.png has no walkable cells."
            );

        playerSpawn=
            cellToWorld(
                c.x,
                c.y
            );

    }

    if(!entitySpawn){

        let best=null;
        let bestDistance=-1;

        const pc=
            worldToCell(
                playerSpawn.x,
                playerSpawn.z
            );

        for(
            const c of walkableCells
        ){

            const d=
                Math.hypot(
                    c.x-pc.x,
                    c.y-pc.y
                );

            if(d>bestDistance){

                bestDistance=d;
                best=c;

            }

        }

        if(best){

            entitySpawn=
                cellToWorld(
                    best.x,
                    best.y
                );

        }

    }

}

/* =========================================================
   COLLISION
========================================================= */

function addCollider(x,z){

    wallColliders.push({

        minX:x-TILE*.5,
        maxX:x+TILE*.5,

        minZ:z-TILE*.5,
        maxZ:z+TILE*.5

    });

}

function collides(
    x,
    z,
    radius=PLAYER_RADIUS
){

    for(
        const w of wallColliders
    ){

        if(
            x+radius>w.minX &&
            x-radius<w.maxX &&
            z+radius>w.minZ &&
            z-radius<w.maxZ
        )
            return true;

    }

    return false;

}

/* =========================================================
   FLOOR
========================================================= */

function createFloor(x,z){

    const mesh=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            floorMaterial

        );

    mesh.rotation.x=
        -Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    world.add(mesh);

}

/* =========================================================
   CEILING
========================================================= */

function createCeiling(x,z){

    const mesh=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),

            ceilingMaterial

        );

    mesh.rotation.x=
        Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    world.add(mesh);

}

/* =========================================================
   WALL
========================================================= */

function createWall(x,z){

    const mesh=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),

            wallMaterial

        );

    mesh.position.set(
        x,
        WALL_HEIGHT/2,
        z
    );

    world.add(mesh);

    addCollider(
        x,
        z
    );

}

/* =========================================================
   3D HOLES
========================================================= */

function createHole(x,y){

    const p=
        cellToWorld(
            x,
            y
        );

    /*
        The floor itself is NOT created.

        The ceiling IS still created.

        This gives the hole a real opening.
    */

    const darkWall=
        new THREE.MeshStandardMaterial({

            color:0x26231a,

            roughness:1,

            metalness:0

        });

    const gradientWall=
        new THREE.MeshStandardMaterial({

            color:0x100f0b,

            roughness:1

        });

    const depth=6;

    /*
        Interior walls.
    */

    const north=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                depth,
                .08
            ),
            darkWall
        );

    north.position.set(
        p.x,
        -depth/2,
        p.z-TILE/2
    );

    world.add(north);

    const south=
        north.clone();

    south.position.z=
        p.z+TILE/2;

    world.add(south);

    const west=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .08,
                depth,
                TILE
            ),
            gradientWall
        );

    west.position.set(
        p.x-TILE/2,
        -depth/2,
        p.z
    );

    world.add(west);

    const east=
        west.clone();

    east.position.x=
        p.x+TILE/2;

    world.add(east);

    /*
        Deep bottom.
    */

    const bottom=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                .15,
                TILE
            ),
            new THREE.MeshStandardMaterial({
                color:0x020201,
                roughness:1
            })
        );

    bottom.position.set(
        p.x,
        -depth,
        p.z
    );

    world.add(bottom);

    /*
        Subtle lip around the opening.

        This makes the hole visibly 3D from above.
    */

    const lipMaterial=
        new THREE.MeshStandardMaterial({
            color:0x625b3d,
            roughness:.95
        });

    const lipSize=.10;

    const lip1=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                lipSize,
                .11
            ),
            lipMaterial
        );

    lip1.position.set(
        p.x,
        .025,
        p.z-TILE/2
    );

    world.add(lip1);

    const lip2=

    );

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type=
                mapData[y][x];

            const p=
                cellToWorld(
                    x,
                    y
                );

            if(type==="wall"){

                createWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
                DO NOT create a floor inside holes.
            */

            if(type!=="hole"){

                createFloor(
                    p.x,
                    p.z
                );

            }

            /*
                Ceiling ALWAYS exists.
            */

            createCeiling(
                p.x,
                p.z
            );

        }

    }

    for(
        const h of holeCells
    ){

        createHole(
            h.x,
            h.y
        );

    }

    for(
        const h of hideCells
    ){

        const p=
            cellToWorld(
                h.x,
                h.y
            );

        createLocker(
            p.x,
            p.z
        );

    }

}

/*
    Ceiling layout:

    ooooo
    ooooo
    ooloo
    ooooo
    ooooo

    A light every 5 cells.
*/

function createLight(x,z){

    const fixture=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                TILE*.86,
                .055,
                TILE*.86
            ),

            new THREE.MeshStandardMaterial({

                color:0xe7e1bd,

                emissive:0xffe6a0,

                emissiveIntensity:0

            })

        );

    fixture.position.set(
        x,
        WALL_HEIGHT-.045,
        z
    );

    world.add(fixture);

    const light=
        new THREE.PointLight(
            0xffd98a,
            0,
            16,
            1.8
        );

    light.position.set(
        x,
        WALL_HEIGHT-.35,
        z
    );

    scene.add(light);

    fluorescentLights.push({

        light,
        fixture,

        /*
            Start at 1%.
        */

        progress:.01,

        /*
            Every light ramps independently.
        */

        speed:
            .035+
            Math.random()*.035,

        flicker:
            Math.random()

    });

}

function buildLights(){

    for(
        let y=2;
        y<mapHeight-2;
        y+=5
    ){

        for(
            let x=2;
            x<mapWidth-2;
            x+=5
        ){

            if(
                mapData[y] &&
                mapData[y][x] &&
                mapData[y][x]!=="wall"
            ){

                const p=
                    cellToWorld(
                        x,
                        y
                    );

                createLight(
                    p.x,
                    p.z
                );

            }

        }

    }

}

/* =========================================================
   LIGHT UPDATE
========================================================= */

function updateLights(dt){

    for(
        const l of fluorescentLights
    ){

        /*
            Gradually rise from 1% to 100%.
        */

        l.progress=
            Math.min(
                1,
                l.progress+
                dt*l.speed
            );

        const smooth=
            l.progress*
            l.progress*
            (3-2*l.progress);

        /*
            Dramatic but believable light level.
        */

        const target=
            2.8*smooth;

        l.light.intensity=
            target;

        l.fixture.material
            .emissiveIntensity=
            2.5*smooth;

        /*
            Occasional tiny fluorescent flicker.
        */

        if(
            l.progress>.65 &&
            Math.random()<dt*.18
        ){

            l.light.intensity=
                target*
                (.35+
                Math.random()*.65);

        }

    }

}

const player=

    EYE_HEIGHT;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=true;

let crouching=false;
let hidden=false;

let falling=false;
let fallTimer=0;

const keys={};

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(dx,dz){

    const nx=
        player.position.x+dx;

    const nz=
        player.position.z+dz;

    if(
        !collides(
            nx,
            player.position.z
        )
    ){

        player.position.x=nx;

    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){

        player.position.z=nz;

    }

}

/* =========================================================
   HOLE HITBOX
========================================================= */

function fullyOverHole(){

    const r=
        PLAYER_RADIUS;

    /*
        Every sample must be in a hole.

        Therefore the player can jump over the edge.
    */

    const samples=[

        [0,0],

        [r,0],
        [-r,0],
        [0,r],
        [0,-r],

        [r*.707,r*.707],
        [-r*.707,r*.707],
        [r*.707,-r*.707],
        [-r*.707,-r*.707]

    ];

    for(
        const s of samples
    ){

        const c=
            worldToCell(
                player.position.x+s[0],
                player.position.z+s[1]
            );

        if(
            !isHole(
                c.x,
                c.y
            )
        )
            return false;

    }

    return true;

}

function checkHole(){

    if(
        falling ||
        !grounded
    )
        return;

    if(
        fullyOverHole()
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let closest=null;
    let distance=Infinity;

    for(
        const spot of hidingObjects
    ){

        const d=
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(d<distance){

            distance=d;
            closest=spot;

        }

    }

    const near=
        closest &&
        distance<1.9;

    hidden=
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity=
        near&&!hidden
        ? "1"
        : "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity=
        hidden
        ? "1"
        : "0";

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const p=
            Math.min(
                fallTimer/1.5,
                1
            );

        player.position.y=
            -p*6;

        camera.position.y=
            EYE_HEIGHT-p*1.4;

        if(
            fallTimer>=1.5
        ){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching=
        !!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w) forward++;
    if(keys.s) forward--;
    if(keys.d) strafe++;
    if(keys.a) strafe--;

    const len=
        Math.hypot(
            forward,
            strafe
        );

    if(len>0){

        forward/=len;
        strafe/=len;

        const sprint=
            !!(
                keys.shift &&
                !crouching
            );

        let speed=
            sprint
            ? SPRINT_SPEED
            : WALK_SPEED;

        if(
            sprint &&
            !grounded
        ){

            speed=
                JUMP_SPRINT_SPEED;

        }

        if(crouching)
            speed*=.55;

        const sin=
            Math.sin(yaw);

        const cos=
            Math.cos(yaw);

        const dx=
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz=
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    velocityY-=
        GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;
        keys.spacePressed=false;

    }

    if(!keys.space)
        keys.spacePressed=false;

    const target=
        crouching
        ? CROUCH_HEIGHT
        : EYE_HEIGHT;

    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            target,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();
    checkHole();

}

/* =========================================================
   PATHFINDING
========================================================= */

function findPath(start,goal){

    if(
        !insideMap(start.x,start.y) ||
        !insideMap(goal.x,goal.y)
    )
        return [];

    if(
        !isWalkable(
            goal.x,
            goal.y
        )
    )
        return [];

    const queue=[start];

    const parent=
        new Map();

    const visited=
        new Set();

    const key=
        p=>p.x+","+p.y;

    visited.add(
        key(start)
    );

    const dirs=[

        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}

    ];

    let count=0;

    while(
        queue.length &&
        count++<7000
    ){

        const current=
            queue.shift();

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            const path=[];

            let p=current;

            while(p){

                path.push(p);

                p=
                    parent.get(
                        key(p)
                    );

            }

            return path.reverse();

        }

        for(
            const d of dirs
        ){

            const n={

                x:current.x+d.x,
                y:current.y+d.y

            };

            const k=key(n);

            if(visited.has(k))
                continue;

            if(
                !isWalkable(
                    n.x,
                    n.y
                )
            )
                continue;

            visited.add(k);

            parent.set(
                k,
                current
            );

            queue.push(n);

        }

    }

    return [];

}

function updateEntityPath(){

    if(!entity)
        return;

    const start=
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const goal=
        worldToCell(
            player.position.x,
            player.position.z
        );

    entityPath=
        findPath(
            start,
            goal
        );

    entityPathIndex=1;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    /*
        30 SECOND DELAY.
    */

    if(
        !entityActive
    ){

        entitySpawnTimer-=dt;

        if(
            entitySpawnTimer<=0
        ){

            entityActive=true;

            entity.visible=true;

            showMessage(
                "SOMETHING IS IN THE BUILDING."
            );

            startEntityAudio();

        }

        return;

    }

    if(
        !gameStarted ||
        paused ||
        dead ||
        !entity
    )
        return;

    entityRepathTimer-=dt;

    if(
        entityRepathTimer<=0
    ){

        entityRepathTimer=
            difficulty==="nightmare"
            ? .12
            : .25;

        updateEntityPath();

    }

    if(
        entityPath.length<=1
    )
        return;

    const targetCell=
        entityPath[
            Math.min(
                entityPathIndex,
                entityPath.length-1
            )
        ];

    const target=
        cellToWorld(
            targetCell.x,
            targetCell.y
        );

    let dx=
        target.x-
        entity.position.x;

    let dz=
        target.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    if(distance<.15){

        entityPathIndex++;

        return;

    }

    dx/=distance;
    dz/=distance;

    const speed=
        getEntitySpeed();

    const nx=
        entity.position.x+
        dx*speed*dt;

    const nz=
        entity.position.z+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz,
            .38
        )
    ){

        entity.position.x=nx;
        entity.position.z=nz;

    }

    /*
        Always face the camera.
    */

    entity.rotation.y=
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    const playerDistance=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    if(
        playerDistance<1.35 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   ENTITY AUDIO
========================================================= */

const entityAudio=
    new Audio(
        "./sounds/entity.mp3"
    );

entityAudio.loop=true;
entityAudio.preload="auto";
entityAudio.volume=0;

let audioReady=false;

function startEntityAudio(){

    if(!entityActive)
        return;

    entityAudio
        .play()
        .then(()=>{
            audioReady=true;
        })
        .catch(()=>{
            /*
                Browser autoplay restriction.

                Clicking the game canvas will retry it.
            */
        });

}

function updateEntityAudio(){

    if(
        !entityActive ||
        !entity ||
        !gameStarted ||
        dead
    ){

        entityAudio.volume=0;

        return;

    }

    const distance=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    /*
        Quiet from far away,
        progressively louder as it approaches.
    */

    const HEARING_DISTANCE=55;

    let volume=
        1-
        distance/HEARING_DISTANCE;

    volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    /*
        Makes the first part quiet and
        the last part dramatically louder.
    */

    volume=
        Math.pow(
            volume,
            .72
        );

    entityAudio.volume=
        THREE.MathUtils.lerp(
            entityAudio.volume,
            volume,
            .07
        );

    if(
        entityAudio.paused
    )
        startEntityAudio();

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ?"flex"
        :"none";

    if(paused){

        if(
            document.pointerLockElement
        )
            document.exitPointerLock();

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(()=>{});

    }

}

    }
);

document.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

        if(e.code==="Space")
            keys.space=false;

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            e.movementX*.0022;

        pitch-=
            e.movementY*.0018;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;

    }
);

========================================================= */

renderer.domElement.addEventListener(
    "click",
    ()=>{

            startEntityAudio();

        }

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function setDifficulty(value){

    difficulty=value;

    for(
        const key in difficultyButtons
    ){

        difficultyButtons[key]
            .classList.toggle(
                "selected",
                key===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>setDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>setDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>setDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>setDifficulty("nightmare");

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(!menuImages.length)
            return;

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   TAPE TIMER
========================================================= */

function updateTape(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(
            gameTime
        );

    const h=
        Math.floor(
            total/3600
        );

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const pad=
        n=>
            String(n)
            .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+
        pad(m)+":"+
        pad(s);

}

/* =========================================================
   GAME LOOP
========================================================= */

let last=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-last)/1000;

    last=now;

    /*
        Prevent huge physics jumps if
        the browser freezes for a moment.
    */

    dt=
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateEntityAudio();
    updateLights(dt);
    updateMessage(dt);
    updateTape(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize(){

    try{

        console.log(
            "BACKROOMS INITIALIZING..."
        );

        /*
            Load textures independently.

            NONE of these are allowed to stop
            the world from being generated.
        */

        const results=
            await Promise.all([

                optionalTexture(
                    "./textures/wall.png",
                    1.1,
                    1.1
                ),

                optionalTexture(
                    "./textures/floor.png",
                    1,
                    1
                ),

                optionalTexture(
                    "./textures/ceiling.png",
                    1,
                    1
                ),

                loadMap(),

                loadEntity()

            ]);

        wallTexture=results[0];
        floorTexture=results[1];
        ceilingTexture=results[2];

        /*
            Apply textures only when they actually exist.
        */

        if(wallTexture)
            wallMaterial.map=wallTexture;

        if(floorTexture)
            floorMaterial.map=floorTexture;

        if(ceilingTexture)
            ceilingMaterial.map=ceilingTexture;

        wallMaterial.needsUpdate=true;
        floorMaterial.needsUpdate=true;
        ceilingMaterial.needsUpdate=true;

        /*
            BUILD THE WORLD AFTER MAP LOAD.
        */

        buildWorld();

        /*
            Build the ceiling-light grid.
        */

        buildLights();

        /*
            Create the entity, but hide it for 30 seconds.
        */

        createEntity();

        entity.visible=false;

        entityAudio.load();

        console.log(
            "BACKROOMS READY"
        );

        console.log(
            "Entity spawn delay: 30 seconds"
        );

        console.log(
            "Wall texture:",
            !!wallTexture
        );

        console.log(
            "Floor texture:",
            !!floorTexture
        );

        console.log(
            "Ceiling texture:",
            !!ceilingTexture
        );

    }catch(error){

        console.error(error);

        const box=
            document.getElementById(
                "error"
            );

        box.style.display="block";

        box.textContent=
            "BACKROOMS INITIALIZATION ERROR\n\n"+
            (
                error.stack||
                error.message||
                String(error)
            );

    }

}

initialize();

</script>
