<style>
*{box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    margin:0;

/* =========================================================
   MENU
========================================================= */

#menu{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#050505;
    overflow:hidden;
}

.menuImage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;

    filter:brightness(.52) contrast(1.16) saturate(.78);
}

.menuImage.active{opacity:1}

.menuDark{

    background:

            90deg,
            rgba(0,0,0,.84),

.menuButtons{

button{

/* =========================================================

   CRT
========================================================= */

@keyframes flicker{
    0%{opacity:.27861}
    5%{opacity:.34769}
    10%{opacity:.23604}
    15%{opacity:.90626}
    20%{opacity:.18128}
    25%{opacity:.83891}
    30%{opacity:.65583}
    35%{opacity:.67807}
    40%{opacity:.26559}

}

@keyframes textShadow{
    0%{text-shadow:.44px 0 1px rgba(0,30,255,.5),-.44px 0 1px rgba(255,0,80,.3),0 0 3px}
    5%{text-shadow:2.79px 0 1px rgba(0,30,255,.5),-2.79px 0 1px rgba(255,0,80,.3),0 0 3px}

    25%{text-shadow:1.61px 0 1px rgba(0,30,255,.5),-1.61px 0 1px rgba(255,0,80,.3),0 0 3px}

    35%{text-shadow:3.90px 0 1px rgba(0,30,255,.5),-3.90px 0 1px rgba(255,0,80,.3),0 0 3px}
    40%{text-shadow:3.87px 0 1px rgba(0,30,255,.5),-3.87px 0 1px rgba(255,0,80,.3),0 0 3px}
    45%{text-shadow:2.23px 0 1px rgba(0,30,255,.5),-2.23px 0 1px rgba(255,0,80,.3),0 0 3px}
    50%{text-shadow:.08px 0 1px rgba(0,30,255,.5),-.08px 0 1px rgba(255,0,80,.3),0 0 3px}
    55%{text-shadow:2.38px 0 1px rgba(0,30,255,.5),-2.38px 0 1px rgba(255,0,80,.3),0 0 3px}
    60%{text-shadow:2.20px 0 1px rgba(0,30,255,.5),-2.20px 0 1px rgba(255,0,80,.3),0 0 3px}
    65%{text-shadow:2.86px 0 1px rgba(0,30,255,.5),-2.86px 0 1px rgba(255,0,80,.3),0 0 3px}
    70%{text-shadow:.49px 0 1px rgba(0,30,255,.5),-.49px 0 1px rgba(255,0,80,.3),0 0 3px}
    75%{text-shadow:1.89px 0 1px rgba(0,30,255,.5),-1.89px 0 1px rgba(255,0,80,.3),0 0 3px}
    80%{text-shadow:.08px 0 1px rgba(0,30,255,.5),-.08px 0 1px rgba(255,0,80,.3),0 0 3px}
    85%{text-shadow:.10px 0 1px rgba(0,30,255,.5),-.10px 0 1px rgba(255,0,80,.3),0 0 3px}
    90%{text-shadow:3.44px 0 1px rgba(0,30,255,.5),-3.44px 0 1px rgba(255,0,80,.3),0 0 3px}
    95%{text-shadow:2.18px 0 1px rgba(0,30,255,.5),-2.18px 0 1px rgba(255,0,80,.3),0 0 3px}
    100%{text-shadow:2.62px 0 1px rgba(0,30,255,.5),-2.62px 0 1px rgba(255,0,80,.3),0 0 3px}
}

.crt{
    position:fixed;
    inset:0;
    z-index:80;
    pointer-events:none;
    animation:textShadow 1.6s infinite;
}

.crt::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(18,16,16,.06);
    opacity:0;
    z-index:2;
    pointer-events:none;
    animation:flicker .15s infinite;
}

.crt::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            rgba(18,16,16,0) 50%,
            rgba(0,0,0,.25) 50%
        ),
        linear-gradient(
            90deg,
            rgba(255,0,0,.06),
            rgba(0,255,0,.02),
            rgba(0,0,255,.06)
        );
    z-index:2;
    background-size:100% 3px,3px 100%;
    pointer-events:none;
    backdrop-filter:blur(.4px);
    mix-blend-mode:color-burn;
}

<script src="./three.min.js"></script>

<script>
"use strict";

/* =========================================================
   STATE
========================================================= */

let gameStarted=false;
let paused=false;
let dead=false;

let difficulty="normal";

const keys={};

let gameTime=0;
let messageTimer=0;

/* =========================================================
   THREE.JS
========================================================= */

if(typeof THREE==="undefined"){
    const e=document.getElementById("error");
    e.style.display="block";
    e.textContent=
        "THREE.JS COULD NOT BE LOADED.\n\n"+
        "Make sure three.min.js is in the repository root.";
    throw new Error("Three.js missing");
}

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x696544);

scene.fog=new THREE.FogExp2(
    0x696544,
    .0042
);

const camera=new THREE.PerspectiveCamera(
    78,
    innerWidth/innerHeight,
    .04,
    650
);

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.25)
);

if("outputColorSpace" in renderer){
    renderer.outputColorSpace=THREE.SRGBColorSpace;
}

renderer.toneMapping=THREE.NoToneMapping;

renderer.domElement.style.position="fixed";
renderer.domElement.style.inset="0";
renderer.domElement.style.zIndex="1";

document.body.appendChild(renderer.domElement);

/* =========================================================
   FOUND FOOTAGE LIGHTING
========================================================= */

/*
    Very little dynamic lighting is used.

    This is intentional:
    it keeps the game fast while giving the environment
    the flat, ugly fluorescent-camera appearance.
*/

scene.add(
    new THREE.AmbientLight(
        0xffefbf,
        .42
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xfff2c4,
        0x15130c,
        .38
    )
);

const world=new THREE.Group();
scene.add(world);

/* =========================================================
   MAP CONSTANTS
========================================================= */

const TILE=3.0;
const WALL_HEIGHT=8.8;

const PLAYER_RADIUS=.42;

const EYE_HEIGHT=5.15;
const CROUCH_HEIGHT=3.0;

const GRAVITY=22;
const JUMP_SPEED=7.8;

const WALK_SPEED=5.5;
const SPRINT_SPEED=9.5;

/*
    Sprint jumping gives only a small advantage.
*/
const SPRINT_JUMP_BONUS=1.15;

/*
    Nightmare entity speed is approximately sprint-jump speed.
*/
const NIGHTMARE_ENTITY_SPEED=
    SPRINT_SPEED*
    SPRINT_JUMP_BONUS;

/* =========================================================
   MAP DATA
========================================================= */

let mapWidth=0;
let mapHeight=0;

let mapData=[];

let playerSpawn=null;
let entitySpawn=null;

const wallColliders=[];
const hidingRegions=[];
const holeRegions=[];

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader=
    new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;
let entityTexture=null;

let entityAspect=1;

function loadTexture(
    path,
    repeatX=1,
    repeatY=1
){

    return new Promise(
        resolve=>{

            textureLoader.load(

                path,

                texture=>{

                    /*
                        This is important.

                        Textures are prepared only AFTER
                        the image has actually loaded.
                    */

                    if(
                        "colorSpace" in texture
                    ){
                        texture.colorSpace=
                            THREE.SRGBColorSpace;
                    }

                    texture.wrapS=
                        THREE.RepeatWrapping;

                    texture.wrapT=
                        THREE.RepeatWrapping;

                    texture.repeat.set(
                        repeatX,
                        repeatY
                    );

                    texture.magFilter=
                        THREE.LinearFilter;

                    texture.minFilter=
                        THREE.LinearMipmapLinearFilter;

                    texture.anisotropy=2;

                    texture.needsUpdate=true;

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(texture);

                },

                undefined,

                error=>{

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    resolve(null);

                }

            );

        }
    );

}

async function loadTextures(){

    /*
        EXACT repository paths.
    */

    wallTexture=
        await loadTexture(
            "./textures/wall.png",
            1.15,
            1.15
        );

    floorTexture=
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );

    ceilingTexture=
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

    /*
        Entity PNG is in repository root.
    */

    entityTexture=
        await loadTexture(
            "./entity.png",
            1,
            1
        );

    if(entityTexture){

        const img=
            entityTexture.image;

        if(
            img &&
            img.width &&
            img.height
        ){

            entityAspect=
                img.width/
                img.height;

        }

    }

}

/* =========================================================
   MATERIALS
========================================================= */

let wallMaterial;
let floorMaterial;
let ceilingMaterial;

function createMaterials(){

    /*
        These materials are deliberately created AFTER
        loadTextures() finishes.
    */

    wallMaterial=
        new THREE.MeshBasicMaterial({

            map:wallTexture,

            color:
                wallTexture
                ?
                0xffffff
                :
                0xff00ff,

            side:THREE.DoubleSide

        });

    floorMaterial=
        new THREE.MeshBasicMaterial({

            map:floorTexture,

            color:
                floorTexture
                ?
                0xffffff
                :
                0xff00ff,

            side:THREE.DoubleSide

        });

    ceilingMaterial=
        new THREE.MeshBasicMaterial({

            map:ceilingTexture,

            color:
                ceilingTexture
                ?
                0xffffff
                :
                0xff00ff,

            side:THREE.DoubleSide

        });

}

/* =========================================================
   MAP CLASSIFICATION
========================================================= */

function classifyPixel(r,g,b,a){

    if(a<30)
        return "floor";

    /*
        BLACK = WALL
    */

    if(
        Math.max(r,g,b)<75
    ){
        return "wall";
    }

    /*
        RED = PLAYER SPAWN
    */

    if(
        r>150 &&
        r>g*1.4 &&
        r>b*1.4
    ){
        return "spawn";
    }

    /*
        BLUE = ENTITY
    */

    if(
        b>120 &&
        b>r*1.35 &&
        b>g*1.15
    ){
        return "entity";
    }

    /*
        PURPLE / MAGENTA = HIDING
    */

    if(
        r>100 &&
        b>100 &&
        g<Math.min(r,b)*.75
    ){
        return "hide";
    }

    /*
        YELLOW / ORANGE = HOLE
    */

    if(
        r>145 &&
        g>105 &&
        b<125 &&
        r>b*1.25
    ){
        return "hole";
    }

    return "floor";
}

/* =========================================================
   MAP COORDINATES
========================================================= */

function cellToWorld(x,y){

    return {

        x:
            (x+.5)*TILE-
            mapWidth*TILE/2,

        z:
            (y+.5)*TILE-
            mapHeight*TILE/2

    };

}

function worldToCell(x,z){

    return {

        x:
            Math.floor(
                (x+mapWidth*TILE/2)/
                TILE
            ),

        y:
            Math.floor(
                (z+mapHeight*TILE/2)/
                TILE
            )

    };

}

/* =========================================================
   MAP HELPERS
========================================================= */

function insideMap(x,y){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function walkableCell(x,y){

    if(!insideMap(x,y))
        return false;

    const t=mapData[y][x];

    return (
        t!=="wall" &&
        t!=="hole"
    );

}

/* =========================================================
   MAP LOADING
========================================================= */

async function loadMap(){

    const image=
        await new Promise(
            (resolve,reject)=>{

                const img=new Image();

                img.onload=
                    ()=>resolve(img);

                img.onerror=
                    ()=>reject(
                        new Error(
                            "textures/map1.png could not be loaded."
                        )
                    );

                img.src=
                    "./textures/map1.png?v="+
                    Date.now();

            }
        );

    mapWidth=image.naturalWidth;
    mapHeight=image.naturalHeight;

    const canvas=
        document.createElement("canvas");

    canvas.width=mapWidth;
    canvas.height=mapHeight;

    const ctx=
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels=
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=
        new Array(mapHeight);

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        mapData[y]=
            new Array(mapWidth);

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i=
                (y*mapWidth+x)*4;

            const type=
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            mapData[y][x]=type;

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

    }

    /*
        Fallback player spawn.
    */

    if(!playerSpawn){

        outer:
        for(
            let y=0;
            y<mapHeight;
            y++
        ){

            for(
                let x=0;
                x<mapWidth;
                x++
            ){

                if(
                    walkableCell(x,y)
                ){

                    playerSpawn=
                        cellToWorld(
                            x,
                            y
                        );

                    break outer;

                }

            }

        }

    }

    if(!playerSpawn){

        throw new Error(
            "No walkable spawn was found in map1.png."
        );

    }

    /*
        Build connected hole and hiding regions.
    */

    findRegions("hole",holeRegions);
    findRegions("hide",hidingRegions);

    /*
        If no entity marker exists, place it at least
        20 map pixels from the player.
    */

    if(!entitySpawn){

        const p=
            findFarWalkablePosition(
                playerSpawn,
                20
            );

        entitySpawn=
            p ||
            {
                x:playerSpawn.x+60,
                z:playerSpawn.z+60
            };

    }

    console.log(
        "MAP SIZE:",
        mapWidth,
        "x",
        mapHeight
    );

    console.log(
        "HOLE REGIONS:",
        holeRegions.length
    );

    console.log(
        "HIDING REGIONS:",
        hidingRegions.length
    );

}

/* =========================================================
   CONNECTED REGIONS
========================================================= */

function findRegions(
    type,
    output
){

    const visited=
        new Uint8Array(
            mapWidth*mapHeight
        );

    const dirs=[
        [1,0],
        [-1,0],
        [0,1],
        [0,-1]
    ];

    for(
        let sy=0;
        sy<mapHeight;
        sy++
    ){

        for(
            let sx=0;
            sx<mapWidth;
            sx++
        ){

            const start=
                sy*mapWidth+sx;

            if(
                visited[start] ||
                mapData[sy][sx]!==type
            ){
                continue;
            }

            const queue=[
                [sx,sy]
            ];

            const cells=[];

            visited[start]=1;

            for(
                let q=0;
                q<queue.length;
                q++
            ){

                const x=queue[q][0];
                const y=queue[q][1];

                cells.push({
                    x,
                    y
                });

                for(
                    const d of dirs
                ){

                    const nx=x+d[0];
                    const ny=y+d[1];

                    if(
                        !insideMap(nx,ny)
                    )
                        continue;

                    const index=
                        ny*mapWidth+nx;

                    if(
                        visited[index]
                    )
                        continue;

                    if(
                        mapData[ny][nx]!==type
                    )
                        continue;

                    visited[index]=1;

                    queue.push([
                        nx,
                        ny
                    ]);

                }

            }

            /*
                Tiny accidental pixels are ignored.
            */

            if(cells.length<2)
                continue;

            let minX=Infinity;
            let maxX=-Infinity;
            let minY=Infinity;
            let maxY=-Infinity;

            let sxTotal=0;
            let syTotal=0;

            for(
                const c of cells
            ){

                minX=Math.min(minX,c.x);
                maxX=Math.max(maxX,c.x);

                minY=Math.min(minY,c.y);
                maxY=Math.max(maxY,c.y);

                sxTotal+=c.x;
                syTotal+=c.y;

            }

            const cx=
                sxTotal/cells.length;

            const cy=
                syTotal/cells.length;

            output.push({

                type,
                cells,
                minX,
                maxX,
                minY,
                maxY,
                center:cellToWorld(
                    cx,
                    cy
                )

            });

        }

    }

}

/* =========================================================
   FIND FAR WALKABLE POSITION
========================================================= */

function findFarWalkablePosition(
    origin,
    minimumPixels
){

    const start=
        worldToCell(
            origin.x,
            origin.z
        );

    /*
        Search outward in rings.

        The candidate must be at least
        minimumPixels map cells away.
    */

    const maxRadius=
        Math.max(
            40,
            minimumPixels+25
        );

    let best=null;
    let bestDistance=Infinity;

    for(
        let radius=minimumPixels;
        radius<=maxRadius;
        radius++
    ){

        for(
            let angle=0;
            angle<Math.PI*2;
            angle+=Math.PI/16
        ){

            const x=
                Math.round(
                    start.x+
                    Math.cos(angle)*radius
                );

            const y=
                Math.round(
                    start.y+
                    Math.sin(angle)*radius
                );

            if(
                !walkableCell(x,y)
            )
                continue;

            const dx=x-start.x;
            const dy=y-start.y;

            const distance=
                Math.hypot(
                    dx,
                    dy
                );

            if(
                distance>=minimumPixels &&
                distance<bestDistance
            ){

                bestDistance=distance;

                best=
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

        if(best)
            return best;

    }

    return null;

}

/* =========================================================
   INSTANCED WORLD
========================================================= */

let floorMesh=null;
let ceilingMesh=null;
let wallMesh=null;

function buildWorld(){

    let floorCount=0;
    let wallCount=0;

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type=
                mapData[y][x];

            if(type==="wall")
                wallCount++;
            else
                floorCount++;

        }

    }

    /*
        One draw call per major surface instead of
        one mesh per map pixel.
    */

    const floorGeometry=
        new THREE.PlaneGeometry(
            TILE,
            TILE
        );

    floorGeometry.rotateX(
        -Math.PI/2
    );

    floorMesh=
        new THREE.InstancedMesh(
            floorGeometry,
            floorMaterial,
            floorCount
        );

    floorMesh.frustumCulled=false;

    const ceilingGeometry=
        new THREE.PlaneGeometry(
            TILE,
            TILE
        );

    ceilingGeometry.rotateX(
        Math.PI/2
    );

    ceilingMesh=
        new THREE.InstancedMesh(
            ceilingGeometry,
            ceilingMaterial,
            floorCount
        );

    ceilingMesh.frustumCulled=false;

    const wallGeometry=
        new THREE.BoxGeometry(
            TILE,
            WALL_HEIGHT,
            TILE
        );

    wallMesh=
        new THREE.InstancedMesh(
            wallGeometry,
            wallMaterial,
            wallCount
        );

    wallMesh.frustumCulled=false;

    const dummy=
        new THREE.Object3D();

    let fi=0;
    let wi=0;

    wallColliders.length=0;

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type=
                mapData[y][x];

            const p=
                cellToWorld(
                    x,
                    y
                );

            if(type!=="wall"){

                dummy.position.set(
                    p.x,
                    0,
                    p.z
                );

                dummy.rotation.set(
                    0,
                    0,
                    0
                );

                dummy.updateMatrix();

                floorMesh.setMatrixAt(
                    fi,
                    dummy.matrix
                );

                dummy.position.y=
                    WALL_HEIGHT;

                dummy.updateMatrix();

                ceilingMesh.setMatrixAt(
                    fi,
                    dummy.matrix
                );

                fi++;

            }else{

                dummy.position.set(
                    p.x,
                    WALL_HEIGHT/2,
                    p.z
                );

                dummy.updateMatrix();

                wallMesh.setMatrixAt(
                    wi++,
                    dummy.matrix
                );

                wallColliders.push({

                    minX:p.x-TILE/2,
                    maxX:p.x+TILE/2,
                    minZ:p.z-TILE/2,
                    maxZ:p.z+TILE/2

                });

            }

        }

    }

    floorMesh.instanceMatrix.needsUpdate=true;
    ceilingMesh.instanceMatrix.needsUpdate=true;
    wallMesh.instanceMatrix.needsUpdate=true;

    world.add(
        floorMesh,
        ceilingMesh,
        wallMesh
    );

}

/* =========================================================
   3D CONNECTED HOLES
========================================================= */

const holeBottomMaterial=
    new THREE.MeshBasicMaterial({
        color:0x060504,
        side:THREE.DoubleSide
    });

const holeWallMaterial=
    new THREE.MeshBasicMaterial({
        color:0x18140d,
        side:THREE.DoubleSide
    });

function buildHoleRegion(
    region
){

    const group=
        new THREE.Group();

    group.name=
        "ConnectedHole";

    /*
        ONE connected bottom geometry.

        Every pixel/cell belonging to the same connected
        map region is part of this single mesh.
    */

    const vertices=[];
    const indices=[];

    let vertex=0;

    const depth=4.4;

    for(
        const cell of region.cells
    ){

        const p=
            cellToWorld(
                cell.x,
                cell.y
            );

        const x0=
            p.x-TILE/2;

        const x1=
            p.x+TILE/2;

        const z0=
            p.z-TILE/2;

        const z1=
            p.z+TILE/2;

        const y=-depth;

        vertices.push(

            x0,y,z0,
            x1,y,z0,
            x1,y,z1,
            x0,y,z1

        );

        indices.push(

            vertex,
            vertex+1,
            vertex+2,

            vertex,
            vertex+2,
            vertex+3

        );

        vertex+=4;

    }

    const bottomGeometry=
        new THREE.BufferGeometry();

    bottomGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );

    bottomGeometry.setIndex(
        indices
    );

    bottomGeometry.computeVertexNormals();

    const bottom=
        new THREE.Mesh(
            bottomGeometry,
            holeBottomMaterial
        );

    group.add(bottom);

    /*
        Build only the OUTER walls of the connected region.

        This is what makes a large connected pixel shape
        look like one actual hole.
    */

    const set=
        new Set(
            region.cells.map(
                c=>c.x+","+c.y
            )
        );

    const edgeVertices=[];

    function edge(
        x0,z0,
        x1,z1
    ){

        edgeVertices.push(

            x0,0,z0,
            x1,0,z1,
            x1,-depth,z1,

            x0,0,z0,
            x1,-depth,z1,
            x0,-depth,z0

        );

    }

    for(
        const cell of region.cells
    ){

        const p=
            cellToWorld(
                cell.x,
                cell.y
            );

        const x0=
            p.x-TILE/2;

        const x1=
            p.x+TILE/2;

        const z0=
            p.z-TILE/2;

        const z1=
            p.z+TILE/2;

        if(
            !set.has(
                (cell.x-1)+","+cell.y
            )
        ){

            edge(
                x0,z1,
                x0,z0
            );

        }

        if(
            !set.has(
                (cell.x+1)+","+cell.y
            )
        ){

            edge(
                x1,z0,
                x1,z1
            );

        }

        if(
            !set.has(
                cell.x+","+(cell.y-1)
            )
        ){

            edge(
                x1,z0,
                x0,z0
            );

        }

        if(
            !set.has(
                cell.x+","+(cell.y+1)
            )
        ){

            edge(
                x0,z1,
                x1,z1
            );

        }

    }

    const edgeGeometry=
        new THREE.BufferGeometry();

    edgeGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            edgeVertices,
            3
        )
    );

    edgeGeometry.computeVertexNormals();

    const edgeMesh=
        new THREE.Mesh(
            edgeGeometry,
            holeWallMaterial
        );

    edgeMesh.name="HoleWalls";

    group.add(edgeMesh);

    /*
        Dark rim around the opening.
    */

    const rimGeometry=
        new THREE.RingGeometry(
            TILE*.28,
            TILE*.48,
            16
        );

    const rimMaterial=
        new THREE.MeshBasicMaterial({
            color:0x090806,
            transparent:true,
            opacity:.9,
            side:THREE.DoubleSide
        });

    const rim=
        new THREE.Mesh(
            rimGeometry,
            rimMaterial
        );

    rim.rotation.x=
        -Math.PI/2;

    rim.position.set(
        region.center.x,
        .018,
        region.center.z
    );

    group.add(rim);

    /*
        Thin yellow-brown edge gives the hole enough
        visual contrast to actually be seen.
    */

    const edgeRing=
        new THREE.Mesh(
            new THREE.RingGeometry(
                TILE*.47,
                TILE*.51,
                16
            ),
            new THREE.MeshBasicMaterial({
                color:0x66572f,
                transparent:true,
                opacity:.6,
                side:THREE.DoubleSide
            })
        );

    edgeRing.rotation.x=
        -Math.PI/2;

    edgeRing.position.set(
        region.center.x,
        .025,
        region.center.z
    );

    group.add(edgeRing);

    world.add(group);

}

/* =========================================================
   LOCKERS
========================================================= */

const lockerBodyMaterial=
    new THREE.MeshBasicMaterial({
        color:0x55534a
    });

const lockerDarkMaterial=
    new THREE.MeshBasicMaterial({
        color:0x11100d
    });

const lockerHandleMaterial=
    new THREE.MeshBasicMaterial({
        color:0xb3ad95
    });

function buildLocker(
    region
){

    /*
        The hiding pixels now become actual locker-like
        objects instead of invisible map markers.
    */

    const p=region.center;

    const width=
        Math.max(
            2.0,
            Math.min(
                region.maxX-region.minX+1,
                3
            )*TILE*.75
        );

    const height=6.3;
    const depth=1.25;

    const group=
        new THREE.Group();

    group.name="HidingLocker";

    /*
        Body.
    */

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            lockerBodyMaterial
        );

    body.position.y=
        height/2;

    group.add(body);

    /*
        Front door dark panel.
    */

    const front=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width*.91,
                height*.91,
                .055
            ),
            lockerDarkMaterial
        );

    front.position.set(
        0,
        height/2,
        -depth/2-.03
    );

    group.add(front);

    /*
        Vertical door seam.
    */

    const seam=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .035,
                height*.87,
                .06
            ),
            lockerBodyMaterial
        );

    seam.position.set(
        0,
        height/2,
        -depth/2-.065
    );

    group.add(seam);

    /*
        Handles.
    */

    for(
        const side of [-1,1]
    ){

        const handle=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .06,
                    .42,
                    .08
                ),
                lockerHandleMaterial
            );

        handle.position.set(
            side*.12,
            height*.53,
            -depth/2-.11
        );

        group.add(handle);

    }

    /*
        Vent slots.
    */

    for(
        let i=-2;
        i<=2;
        i++
    ){

        const vent=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    width*.42,
                    .035,
                    .035
                ),
                lockerHandleMaterial
            );

        vent.position.set(
            0,
            height*.82+i*.14,
            -depth/2-.09
        );

        group.add(vent);

    }

    group.position.set(
        p.x,
        0,
        p.z
    );

    /*
        Rotate locker toward a nearby open cell.
    */

    const cx=
        Math.round(
            region.center.x/
            TILE+
            mapWidth/2
        );

    const cy=
        Math.round(
            region.center.z/
            TILE+
            mapHeight/2
        );

    let rotation=0;

    if(
        walkableCell(cx-1,cy)
    ){
        rotation=0;
    }else if(
        walkableCell(cx+1,cy)
    ){
        rotation=Math.PI;
    }else if(
        walkableCell(cx,cy-1)
    ){
        rotation=Math.PI/2;
    }else{
        rotation=-Math.PI/2;
    }

    group.rotation.y=rotation;

    world.add(group);

    /*
        Store a hiding point slightly inside the locker.
    */

    region.hidePoint={
        x:p.x,
        z:p.z,
        radius:
            Math.max(
                1.0,
                Math.min(
                    width*.32,
                    1.8
                )
            )
    };

}

   BUILD SPECIAL OBJECTS
========================================================= */

function buildSpecialObjects(){

    for(
        const region of holeRegions
    ){

        buildHoleRegion(
            region
        );

    }

    for(
        const region of hidingRegions
    ){

        buildLocker(

        );

    }

}

/* =========================================================
   PLAYER
========================================================= */

const player=
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.y=
    EYE_HEIGHT;

let yaw=0;
let pitch=0;

let velocityY=0;
let grounded=true;

let falling=false;
let fallTimer=0;

let crouching=false;
let hidden=false;

function collides(
    x,
    z
){

    const r=
        PLAYER_RADIUS;

    /*
        Only nearby colliders are checked.

        This avoids scanning the entire map every frame.
    */

    const cell=
        worldToCell(
            x,
            z
        );

    const range=2;

    for(
        let y=cell.y-range;
        y<=cell.y+range;
        y++
    ){

        for(
            let cx=cell.x-range;
            cx<=cell.x+range;
            cx++
        ){

            if(
                !insideMap(cx,y)
            )
                continue;

            if(
                mapData[y][cx]!=="wall"
            )
                continue;

            const p=
                cellToWorld(
                    cx,
                    y
                );

            const minX=
                p.x-TILE/2;

            const maxX=
                p.x+TILE/2;

            const minZ=
                p.z-TILE/2;

            const maxZ=
                p.z+TILE/2;

            if(
                x+r>minX &&
                x-r<maxX &&
                z+r>minZ &&
                z-r<maxZ
            ){

                return true;

            }

        }

    }

    return false;

}

function movePlayer(
    dx,
    dz
){

    const nextX=
        player.position.x+dx;

    const nextZ=
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x=
            nextX;

    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z=
            nextZ;

    }

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    /*
        FALLING THROUGH A HOLE.
    */

    if(falling){

        fallTimer+=dt;

        const progress=
            Math.min(
                fallTimer/1.4,
                1
            );

        player.position.y=
            -progress*7;

        camera.position.y=
            EYE_HEIGHT-
            progress*1.6;

        camera.rotation.z=
            Math.sin(
                fallTimer*14
            )*.035;

        if(
            fallTimer>=1.4
        ){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching=
        !!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w)
        forward+=1;

    if(keys.s)
        forward-=1;

    if(keys.d)
        strafe+=1;

    if(keys.a)
        strafe-=1;

    const length=
        Math.hypot(
            forward,
            strafe
        );

    if(length>0){

        forward/=length;
        strafe/=length;

        let speed;

        if(crouching){

            speed=
                WALK_SPEED*.56;

        }else if(
            keys.shift
        ){

            speed=
                SPRINT_SPEED;

        }else{

            speed=
                WALK_SPEED;

        }

        const sin=
            Math.sin(yaw);

        const cos=
            Math.cos(yaw);

        const dx=
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz=
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    /*
        Gravity.
    */

    velocityY-=
        GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    /*
        Jump.

        Sprint jumping is a little faster.
    */

    if(
        keys.jumpPressed &&
        grounded &&
        !crouching
    ){

        velocityY=
            JUMP_SPEED*
            (
                keys.shift
                ?
                SPRINT_JUMP_BONUS
                :
                1
            );

        grounded=false;

    }

    keys.jumpPressed=false;

    const target=
        crouching
        ?
        CROUCH_HEIGHT
        :
        EYE_HEIGHT;

    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            target,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();

    checkHole();

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    let nearest=null;
    let distance=Infinity;

    for(
        const region of hidingRegions
    ){

        if(!region.hidePoint)
            continue;

        const d=
            Math.hypot(
                player.position.x-
                region.hidePoint.x,

                player.position.z-
                region.hidePoint.z
            );

        if(d<distance){

            distance=d;
            nearest=region;

        }

    }

    const near=
        nearest &&
        distance<
        Math.max(
            1.8,
            nearest.hidePoint.radius+1
        );

    hidden=
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity=
        near&&!hidden
        ?
        "1"
        :
        "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity=
        hidden
        ?
        "1"
        :
        "0";

}

/* =========================================================
   HOLES
========================================================= */

function checkHole(){

    if(falling)
        return;

    const cell=
        worldToCell(
            player.position.x,
            player.position.z
        );

    if(
        !insideMap(
            cell.x,
            cell.y
        )
    )
        return;

    if(
        mapData[cell.y][cell.x]==="hole"
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

/* =========================================================
   ENTITY
========================================================= */

let entity=null;

let entityTarget=null;

let entityMemory=0;

let entityWanderAngle=
    Math.random()*Math.PI*2;

let entityWanderTimer=0;

let entityStuckTime=0;

let entityLastX=0;
let entityLastZ=0;

function createEntity(){

    let material;

    if(entityTexture){

        /*
            Preserve the PNG's original aspect ratio.

            No arbitrary 1.8x4.8 stretching.
        */

        const height=6.8;

        const width=
            height*
            entityAspect;

        material=
            new THREE.MeshBasicMaterial({

                map:entityTexture,

                transparent:true,

                alphaTest:.01,

                side:THREE.DoubleSide,

                depthWrite:true

            });

        entity=
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    width,
                    height
                ),

                material

            );

        /*
            If the PNG has transparent padding,
            the visible character remains its natural
            proportions rather than being squashed.
        */

    }else{

        material=
            new THREE.MeshBasicMaterial({
                color:0x080808
            });

        entity=
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    3.2,
                    6.8
                ),

                material

            );

    }

    entity.position.set(
        entitySpawn.x,
        3.4,
        entitySpawn.z
    );

    entity.name="Entity";

    world.add(entity);

    entityWanderAngle=
        Math.random()*Math.PI*2;

    entityWanderTimer=2;

    entityLastX=
        entity.position.x;

    entityLastZ=
        entity.position.z;

}

/* =========================================================
   ENTITY LINE OF SIGHT
========================================================= */

function entitySeesPlayer(){

    if(hidden)
        return false;

    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    const detection=
        difficulty==="easy"
        ?
        9
        :
        difficulty==="hard"
        ?
        14
        :
        difficulty==="nightmare"
        ?
        18
        :
        11;

    if(
        distance>detection
    )
        return false;

    /*
        Sample the line.

        This is much cheaper than testing every collider.
    */

    const steps=
        Math.ceil(
            distance/.7
        );

    for(
        let i=1;
        i<steps;
        i++
    ){

        const t=i/steps;

        const x=
            entity.position.x+
            dx*t;

        const z=
            entity.position.z+
            dz*t;

        if(
            collides(
                x,
                z
            )
        ){

            return false;

        }

    }

    return true;

}

/* =========================================================
   ENTITY TELEPORT RECOVERY
========================================================= */

function recoverEntity(){

    /*
        Find a walkable position around the player's
        current map area.

        It MUST be at least 20 map pixels away.
    */

    const destination=
        findFarWalkablePosition(
            player.position,
            20
        );

    if(!destination)
        return;

    entity.position.set(
        destination.x,
        3.4,
        destination.z
    );

    entityTarget=null;
    entityMemory=0;
    entityStuckTime=0;

    entityWanderAngle=
        Math.atan2(
            player.position.z-
            entity.position.z,

            player.position.x-
            entity.position.x
        );

    showMessage(
        "SOMETHING MOVES SOMEWHERE IN THE BUILDING..."
    );

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        paused ||
        dead
    )
        return;

    if(
        entitySeesPlayer()
    ){

        entityTarget={
            x:player.position.x,
            z:player.position.z
        };

        entityMemory=
            difficulty==="nightmare"
            ?
            4.5
            :
            3;

    }else if(
        entityMemory>0
    ){

        entityMemory-=dt;

    }else{

        entityTarget=null;

    }

    let dx=0;
    let dz=0;

    if(entityTarget){

        dx=
            entityTarget.x-
            entity.position.x;

        dz=
            entityTarget.z-
            entity.position.z;

        const length=
            Math.hypot(
                dx,
                dz
            );

        if(length>.1){

            dx/=length;
            dz/=length;

        }

    }else{

        entityWanderTimer-=dt;

        if(
            entityWanderTimer<=0
        ){

            entityWanderTimer=
                2+
                Math.random()*4;

            entityWanderAngle=
                Math.random()*
                Math.PI*2;

        }

        dx=
            Math.cos(
                entityWanderAngle
            );

        dz=
            Math.sin(
                entityWanderAngle
            );

    }

    let speed;

    if(entityTarget){

        if(
            difficulty==="nightmare"
        ){

            /*
                Nightmare = approximately sprint-jump speed.
            */

            speed=
                NIGHTMARE_ENTITY_SPEED;

        }else if(
            difficulty==="hard"
        ){

            speed=
                8.2;

        }else if(
            difficulty==="easy"
        ){

            speed=
                4.8;

        }else{

            speed=
                6.7;

        }

    }else{

        speed=1.1;

    }

    const oldX=
        entity.position.x;

    const oldZ=
        entity.position.z;

    const nx=
        oldX+
        dx*speed*dt;

    const nz=
        oldZ+
        dz*speed*dt;

    if(
        !collides(
            nx,
            oldZ
        )
    ){

        entity.position.x=nx;

    }

    if(
        !collides(
            entity.position.x,
            nz
        )
    ){

        entity.position.z=nz;

    }

    const moved=
        Math.hypot(
            entity.position.x-oldX,
            entity.position.z-oldZ
        );

    if(
        moved<.02 &&
        entityTarget
    ){

        entityStuckTime+=dt;

    }else{

        entityStuckTime=
            Math.max(
                0,
                entityStuckTime-dt*.5
            );

    }

    /*
        If it is stuck long enough, relocate it.
    */

    if(
        entityStuckTime>1.2
    ){

        recoverEntity();

    }

    /*
        Billboard.
    */

    entity.rotation.y=
        Math.atan2(
            camera.position.x-
            entity.position.x,

            camera.position.z-
            entity.position.z
        );

    /*
        Entity catches player.
    */

    const distance=
        Math.hypot(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );

    if(
        distance<1.05 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=
        reason;

    document.getElementById(
        "death"
    ).style.display=
        "flex";

    stopEntityAudio();

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.5;

}

function updateMessage(dt){

    if(
        messageTimer>0
    ){

        messageTimer-=dt;

        if(
            messageTimer<=0
        ){

            document.getElementById(
                "message"
            ).textContent="";

        }

    }

}

/* =========================================================
   ENTITY AUDIO
========================================================= */

/*
    The repository's MP3 is:

        ./entity.mp3

    The audio element is created in JavaScript so it can
    be started directly from the ENTER LEVEL button.
*/

const entityAudio=
    new Audio(
        "./entity.mp3"
    );

entityAudio.loop=true;
entityAudio.preload="auto";
entityAudio.volume=.38;

let audioStarted=false;

function startEntityAudio(){

    /*
        Browser autoplay policy allows this because this
        function is called from the user's button click.
    */

    entityAudio.currentTime=0;

    const promise=
        entityAudio.play();

    if(promise){

        promise.then(
            ()=>{
                audioStarted=true;
                console.log(
                    "ENTITY AUDIO PLAYING"
                );
            }
        ).catch(
            error=>{
                console.warn(
                    "ENTITY AUDIO BLOCKED:",
                    error
                );

                /*
                    Try again after pointer lock.
                */
            }
        );

    }

}

function stopEntityAudio(){

    entityAudio.pause();

}

document.addEventListener(
    "pointerlockchange",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead &&
            !audioStarted
        ){

            startEntityAudio();

        }

    }
);

/* =========================================================
   RESET PLAYER
========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y=
        EYE_HEIGHT;

    velocityY=0;

    grounded=true;

    falling=false;
    fallTimer=0;

    hidden=false;
    crouching=false;

}

/* =========================================================
   RESET ENTITY
========================================================= */

function resetEntity(){

    if(!entity)
        return;

    const spawn=
        findFarWalkablePosition(
            playerSpawn,
            20
        ) ||
        entitySpawn;

    entity.position.set(
        spawn.x,
        3.4,
        spawn.z
    );

    entityTarget=null;
    entityMemory=0;
    entityStuckTime=0;

}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    gameTime=0;

    resetPlayer();

    if(entity){

        resetEntity();

    }else{

        createEntity();

    }

    /*
        IMPORTANT:
        Start MP3 from the user click.
    */

    startEntityAudio();

    renderer.domElement.requestPointerLock();

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ?
        "flex"
        :
        "none";

    if(paused){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

        entityAudio.pause();

    }else{

        renderer.domElement.requestPointerLock();

        if(!audioStarted){

            startEntityAudio();

        }else{

            entityAudio.play().catch(()=>{});

        }

    }

}

/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display=
        "flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display=
        "none";

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key=
            event.key.toLowerCase();

        keys[key]=true;

        if(
            event.code==="Space"
        ){

            event.preventDefault();

            if(
                !event.repeat
            ){

                keys.jumpPressed=true;

            }

        }

        if(
            key==="escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();

                return;

            }

            if(gameStarted){

                togglePause();

            }

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;

    }
);

/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            event.movementX*.0021;

        pitch-=
            event.movementY*.0018;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement.requestPointerLock();

            if(!audioStarted){

                startEntityAudio();

            }

        }

    }
);

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startBtn"
).onclick=()=>{

    startGame();

};

document.getElementById(
    "menuControlsBtn"
).onclick=
    showControls;

document.getElementById(
    "pauseControlsBtn"
).onclick=
    showControls;

document.getElementById(
    "controlsBackBtn"
).onclick=
    hideControls;

document.getElementById(
    "resumeBtn"
).onclick=()=>{

    paused=false;

    document.getElementById(
        "pause"
    ).style.display="none";

    renderer.domElement.requestPointerLock();

    entityAudio.play().catch(()=>{});

};

document.getElementById(
    "restartBtn"
).onclick=
    startGame;

document.getElementById(
    "retryBtn"
).onclick=
    startGame;

document.getElementById(
    "menuBtn"
).onclick=()=>{

    gameStarted=false;
    paused=false;

    stopEntityAudio();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

};

document.getElementById(
    "deathMenuBtn"
).onclick=()=>{

    dead=false;
    gameStarted=false;

    stopEntityAudio();

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

};

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>selectDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>selectDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>selectDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>selectDifficulty("nightmare");

/* =========================================================
   MENU ROTATION
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   TAPE TIMER
========================================================= */

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(
            gameTime
        );

    const h=
        Math.floor(
            total/3600
        );

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const f=
        n=>
            String(n)
                .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        f(h)+":"+f(m)+":"+f(s);

}

/* =========================================================
   ANIMATION
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .05
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateMessage(dt);
    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize(){

    try{

        document.getElementById(
            "loadingText"
        ).textContent=
            "LOADING TEXTURES...";

        await loadTextures();

        /*
            Do NOT create materials until textures
            have finished loading.
        */

        createMaterials();

        document.getElementById(
            "loadingText"
        ).textContent=
            "LOADING MAP...";

        await loadMap();

        document.getElementById(
            "loadingText"
        ).textContent=
            "BUILDING LEVEL 0...";

        buildWorld();

        buildSpecialObjects();

        document.getElementById(
            "loading"
        ).style.display="none";

        console.log(
            "BACKROOMS READY"
        );

        console.log(
            "Wall:",
            !!wallTexture
        );

        console.log(
            "Floor:",
            !!floorTexture
        );

        console.log(
            "Ceiling:",
            !!ceilingTexture
        );

        console.log(
            "Entity:",
            !!entityTexture
        );

        console.log(
            "Entity audio:",
            "./entity.mp3"
        );

    }catch(error){

        console.error(error);

        document.getElementById(
            "loading"
        ).style.display="none";

        const errorBox=
            document.getElementById(
                "error"
            );

        errorBox.style.display="block";

        errorBox.textContent=
            "BACKROOMS INITIALIZATION ERROR\n\n"+
            (
                error &&
                error.stack
                ?
                error.stack
                :
                String(error)
            );

    }

}

initialize();

</script>
