<!-- Normal Three.js script.
     This is intentionally NOT a module so GitHub Pages
     does not have to resolve an import map. -->

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

"use strict";

/* =========================================================
   THREE.JS
========================================================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.05,
    300
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

const player = new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    1.65,
    0
);

let yaw = 0;
let pitch = 0;

const PLAYER_RADIUS = 0.38;
const PLAYER_EYE_HEIGHT = 1.65;
const PLAYER_BODY_HEIGHT = 1.8;

const WALK_SPEED = 4.5;
const SPRINT_SPEED = 7.5;

const GRAVITY = 20;
const JUMP_SPEED = 7.5;

let verticalVelocity = 0;
let grounded = true;

let stamina = 100;


/* =========================================================
   GAME STATE
========================================================= */

let currentLevel = "level0";

let gameRunning = false;
let paused = false;

let worldObjects = [];

let walls = [];

let floors = [];

let holes = [];

let entity = null;


/* =========================================================
   INPUT
========================================================= */

const keys = {};

let jumpPressed = false;

window.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = true;

        if(event.code === "Space") {

            event.preventDefault();

            if(!event.repeat) {
                jumpPressed = true;
            }
        }

        if(
            event.code === "Escape" ||
            key === "p"
        ) {

            if(gameRunning) {
                togglePause();
            }
        }
    }
);

window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    function(event) {

        if(
            document.pointerLockElement !==
            document.body
        ) {
            return;
        }

        yaw -=
            event.movementX * 0.002;

        pitch -=
            event.movementY * 0.002;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.5,
                1.5
            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;
    }
);


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function simpleMaterial(color) {

    return new THREE.MeshStandardMaterial({
        color: color,
        roughness: 1
    });
}


/* =========================================================
   WORLD OBJECT
========================================================= */

function addWorldObject(object) {

    scene.add(object);

    worldObjects.push(object);

    return object;
}


/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z,
    material
) {

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    addWorldObject(mesh);

    walls.push({
        minX: x - width / 2,
        maxX: x + width / 2,

        minY: y - height / 2,
        maxY: y + height / 2,

        minZ: z - depth / 2,
        maxZ: z + depth / 2
    });

    return mesh;
}


/* =========================================================
   FLOOR
========================================================= */

function addFloor(
    width,
    depth,
    x,
    y,
    z,
    material
) {

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                depth
            ),
            material
        );

    mesh.rotation.x =
        -Math.PI / 2;

    mesh.position.set(
        x,
        y,
        z
    );

    addWorldObject(mesh);

    floors.push({
        minX: x - width / 2,
        maxX: x + width / 2,

        minZ: z - depth / 2,
        maxZ: z + depth / 2,

        y: y
    });

    return mesh;
}


/* =========================================================
   CEILING
========================================================= */

function addCeiling(
    width,
    depth,
    x,
    y,
    z,
    material
) {

    const ceiling =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                depth
            ),
            material
        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.set(
        x,
        y,
        z
    );

    addWorldObject(
        ceiling
    );
}


/* =========================================================
   LEVEL 0 TEXTURE
========================================================= */

function makeWallpaperTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 1024;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#c2b448";

    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );

    /*
       Dirty yellow wallpaper.
    */

    for(let i = 0; i < 70000; i++) {

        const c =
            60 + Math.random() * 80;

        ctx.fillStyle =
            "rgba(" +
            c + "," +
            (c * .9) + "," +
            "25,.10)";

        ctx.fillRect(
            Math.random() * 1024,
            Math.random() * 1024,
            1 + Math.random() * 3,
            1 + Math.random() * 3
        );
    }

    /*
       Wallpaper seams.
    */

    for(let i = 0; i < 55; i++) {

        const x =
            Math.random() * 1024;

        ctx.strokeStyle =
            "rgba(45,40,10,.18)";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(
            x + Math.random() * 20 - 10,
            1024
        );

        ctx.stroke();
    }

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        4,
        3
    );

    return texture;
}


/* =========================================================
   LEVEL 0 CARPET
========================================================= */

function makeCarpetTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 1024;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#555653";

    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );

    for(let i = 0; i < 100000; i++) {

        const c =
            45 + Math.random() * 70;

        ctx.fillStyle =
            "rgba(" +
            c + "," +
            c + "," +
            c + ",.12)";

        ctx.fillRect(
            Math.random() * 1024,
            Math.random() * 1024,
            1 + Math.random() * 3,
            1 + Math.random() * 2
        );
    }

    /*
       Damp-looking patches.
    */

    for(let i = 0; i < 130; i++) {

        const x =
            Math.random() * 1024;

        const y =
            Math.random() * 1024;

        const r =
            20 + Math.random() * 80;

        const gradient =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                r
            );

        gradient.addColorStop(
            0,
            "rgba(15,20,18,.35)"
        );

        gradient.addColorStop(
            1,
            "rgba(15,20,18,0)"
        );

        ctx.fillStyle =
            gradient;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        5,
        5
    );

    return texture;
}


/* =========================================================
   LIGHT
========================================================= */

function addLight(
    x,
    z,
    intensity = 1.6,
    distance = 17
) {

    const fixture =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.4,
                .08,
                .4
            ),
            new THREE.MeshBasicMaterial({
                color: 0xffffd0
            })
        );

    fixture.position.set(
        x,
        4,
        z
    );

    addWorldObject(
        fixture
    );

    const light =
        new THREE.PointLight(
            0xffeaa5,
            intensity,
            distance
        );

    light.position.set(
        x,
        3.8,
        z
    );

    addWorldObject(
        light
    );
}


/* =========================================================
   LEVEL 0
========================================================= */

function buildLevel0() {

    currentLevel =
        "level0";

    document.getElementById(
        "levelName"
    ).textContent =
        "LEVEL 0 — BACKROOMS";

    scene.background =
        new THREE.Color(
            0x17150b
        );

    scene.fog =
        new THREE.Fog(
            0x17150b,
            12,
            105
        );

    /*
       Lighting.
    */

    scene.add(
        new THREE.AmbientLight(
            0xffe9a0,
            1.4
        )
    );


    const wallpaper =
        new THREE.MeshStandardMaterial({
            map: makeWallpaperTexture(),
            roughness: 1
        });


    const carpet =
        new THREE.MeshStandardMaterial({
            map: makeCarpetTexture(),
            roughness: 1
        });


    /*
       Main floor.

       We intentionally DO NOT cover the
       death-hole section with one giant floor.
    */

    addFloor(
        180,
        115,
        0,
        0,
        22.5,
        carpet
    );

    addFloor(
        180,
        35,
        0,
        0,
        -62.5,
        carpet
    );


    /*
       Outer walls.
    */

    addWall(
        180,
        4,
        1,
        0,
        2,
        -80,
        wallpaper
    );

    addWall(
        180,
        4,
        1,
        0,
        2,
        80,
        wallpaper
    );

    addWall(
        1,
        4,
        160,
        -90,
        2,
        0,
        wallpaper
    );

    addWall(
        1,
        4,
        160,
        90,
        2,
        0,
        wallpaper
    );


    /*
       Ceiling.
    */

    addCeiling(
        180,
        160,
        0,
        4.1,
        0,
        new THREE.MeshStandardMaterial({
            color: 0x96904c,
            roughness: 1
        })
    );


    /*
       Hall walls.
    */

    addWall(
        1,
        4,
        95,
        -55,
        2,
        0,
        wallpaper
    );

    addWall(
        1,
        4,
        95,
        55,
        2,
        0,
        wallpaper
    );

    addWall(
        75,
        4,
        1,
        0,
        2,
        -52,
        wallpaper
    );

    addWall(
        75,
        4,
        1,
        0,
        2,
        52,
        wallpaper
    );


    /*
       Extra irregular rooms/halls.
    */

    addWall(
        35,
        4,
        1,
        -25,
        2,
        -25,
        wallpaper
    );

    addWall(
        35,
        4,
        1,
        25,
        2,
        25,
        wallpaper
    );

    addWall(
        1,
        4,
        30,
        -42,
        2,
        27,
        wallpaper
    );

    addWall(
        1,
        4,
        30,
        42,
        2,
        -27,
        wallpaper
    );


    /*
       Iconic column section.
    */

    createColumns(
        -40,
        -5,
        6,
        6,
        6,
        wallpaper
    );

    createColumns(
        38,
        27,
        5,
        5,
        7,
        wallpaper
    );


    /*
       Actual grid of deadly square holes.
    */

    createDeathGrid(
        58,
        -63,
        5,
        5,
        3.5,
        carpet
    );


    /*
       Fluorescent lights.
    */

    for(
        let x = -80;
        x <= 80;
        x += 10
    ) {

        for(
            let z = -70;
            z <= 70;
            z += 12
        ) {

            addLight(
                x,
                z
            );
        }
    }


    /*
       Spawn.
    */

    setSpawn(
        -70,
        1.65,
        -60,
        0
    );


    createEntity(
        42,
        42
    );
}


/* =========================================================
   COLUMNS
========================================================= */

function createColumns(
    startX,
    startZ,
    countX,
    countZ,
    spacing,
    material
) {

    for(
        let x = 0;
        x < countX;
        x++
    ) {

        for(
            let z = 0;
            z < countZ;
            z++
        ) {

            addWall(
                .8,
                4,
                .8,
                startX + x * spacing,
                2,
                startZ + z * spacing,
                material
            );
        }
    }
}


/* =========================================================
   DEATH GRID
========================================================= */

function createDeathGrid(
    startX,
    startZ,
    countX,
    countZ,
    size,
    carpet
) {

    /*
       The hole itself is empty.

       Four small floor pieces surround
       every square opening.
    */

    for(
        let x = 0;
        x < countX;
        x++
    ) {

        for(
            let z = 0;
            z < countZ;
            z++
        ) {

            const px =
                startX + x * size;

            const pz =
                startZ + z * size;


            const edge = .14;


            /*
               Top.
            */

            addFloor(
                size - edge * 2,
                edge,
                px,
                0,
                pz - size / 2 + edge / 2,
                carpet
            );


            /*
               Bottom.
            */

            addFloor(
                size - edge * 2,
                edge,
                px,
                0,
                pz + size / 2 - edge / 2,
                carpet
            );


            /*
               Left.
            */

            addFloor(
                edge,
                size - edge * 2,
                px - size / 2 + edge / 2,
                0,
                pz,
                carpet
            );


            /*
               Right.
            */

            addFloor(
                edge,
                size - edge * 2,
                px + size / 2 - edge / 2,
                0,
                pz,
                carpet
            );


            holes.push({
                x: px,
                z: pz,
                half: size / 2 - edge
            });


            /*
               Deep darkness.
            */

            const bottom =
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        size,
                        size
                    ),
                    new THREE.MeshBasicMaterial({
                        color: 0x030303
                    })
                );

            bottom.rotation.x =
                -Math.PI / 2;

            bottom.position.set(
                px,
                -15,
                pz
            );

            addWorldObject(
                bottom
            );
        }
    }
}


/* =========================================================
   LEVEL 188 HOTEL
========================================================= */

function buildHotel() {

    currentLevel =
        "hotel";

    document.getElementById(
        "levelName"
    ).textContent =
        "LEVEL 188 — HOTEL";

    scene.background =
        new THREE.Color(
            0x080b0d
        );

    scene.fog =
        new THREE.Fog(
            0x080b0d,
            15,
            150
        );

    scene.add(
        new THREE.AmbientLight(
            0x9ca5ad,
            .9
        )
    );


    const concrete =
        simpleMaterial(
            0x77746d
        );

    const dark =
        simpleMaterial(
            0x30312f
        );

    const floorMaterial =
        simpleMaterial(
            0x55534e
        );

    const grass =
        simpleMaterial(
            0x273b22
        );


    /*
       Courtyard grass.
    */

    addFloor(
        80,
        90,
        0,
        0,
        0,
        grass
    );


    /*
       Five floors.
    */

    const floorHeight =
        4.3;

    for(
        let floor = 0;
        floor < 5;
        floor++
    ) {

        createHotelFloor(
            floor * floorHeight,
            concrete,
            dark,
            floorMaterial
        );
    }


    /*
       Bridges crossing the grassy
       courtyard.
    */

    createBridge(
        floorHeight * 2,
        dark
    );

    createBridge(
        floorHeight * 4,
        dark
    );


    /*
       Main courtyard lights.
    */

    for(
        let x = -30;
        x <= 30;
        x += 15
    ) {

        for(
            let z = -30;
            z <= 30;
            z += 15
        ) {

            addLight(
                x,
                z,
                .35,
                12
            );
        }
    }


    setSpawn(
        0,
        1.65,
        30,
        Math.PI
    );


    createEntity(
        -30,
        -30
    );
}


/* =========================================================
   HOTEL FLOOR
========================================================= */

function createHotelFloor(
    y,
    concrete,
    dark,
    floorMaterial
) {

    /*
       Outer structure.
    */

    addWall(
        82,
        4,
        6,
        0,
        y + 2,
        -39,
        concrete
    );

    addWall(
        82,
        4,
        6,
        0,
        y + 2,
        39,
        concrete
    );

    addWall(
        6,
        4,
        72,
        -39,
        y + 2,
        0,
        concrete
    );

    addWall(
        6,
        4,
        72,
        39,
        y + 2,
        0,
        concrete
    );


    /*
       Walkways.
    */

    addFloor(
        68,
        5,
        0,
        y,
        -33,

/* =========================================================
   SPAWN
========================================================= */

function setSpawn(
    x,
    y,
    z,
    rotation
) {

    player.position.set(
        x,
        y,
        z
    );

    yaw =
        rotation;

    pitch = 0;

    camera.rotation.x =
        pitch;

    verticalVelocity = 0;

    grounded = true;

    stamina = 100;
}


/* =========================================================
   WALL COLLISION
========================================================= */

function playerHitsWall(
    x,
    eyeY,
    z
) {

    const playerBottom =
        eyeY - PLAYER_EYE_HEIGHT;

    const playerTop =
        playerBottom +
        PLAYER_BODY_HEIGHT;


    for(
        const wall of walls
    ) {

        /*
           Vertical overlap.
        */

        if(
            playerTop <= wall.minY ||
            playerBottom >= wall.maxY
        ) {
            continue;
        }


        /*
           Closest point on wall.
        */

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );

        const dx =
            x - closestX;

        const dz =
            z - closestZ;


        if(
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }

    return false;
}


/* =========================================================
   FLOOR DETECTION
========================================================= */

function findFloor(
    x,
    z,
    currentEyeY
) {

    const currentFeet =
        currentEyeY -
        PLAYER_EYE_HEIGHT;

    let best =
        -Infinity;


    for(
        const floor of floors
    ) {

        if(
            x >= floor.minX &&
            x <= floor.maxX &&
            z >= floor.minZ &&
            z <= floor.maxZ
        ) {

            /*
               Only use floors that are
               currently beneath the player.

               This prevents an upper hotel
               floor from teleporting the player
               upward from the courtyard.
            */

            if(
                floor.y <=
                currentFeet + .12
            ) {

                if(
                    floor.y > best
                ) {

                    best =
                        floor.y;
                }
            }
        }
    }

    return best;
}


/* =========================================================
   CEILING COLLISION
========================================================= */

function hitCeiling(
    x,
    eyeY,
    z
) {

    const head =
        eyeY + .2;


    for(
        const wall of walls
    ) {

        if(
            x >= wall.minX - PLAYER_RADIUS &&
            x <= wall.maxX + PLAYER_RADIUS &&
            z >= wall.minZ - PLAYER_RADIUS &&
            z <= wall.maxZ + PLAYER_RADIUS
        ) {

            if(
                head >= wall.minY &&
                head <= wall.maxY
            ) {

                return wall.minY;
            }
        }
    }

    return Infinity;
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(delta) {

    const direction =
        new THREE.Vector3();


    if(keys.w)
        direction.z -= 1;

    if(keys.s)
        direction.z += 1;

    if(keys.a)
        direction.x -= 1;

    if(keys.d)
        direction.x += 1;


    if(
        direction.lengthSq() > 0
    ) {

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        const sprinting =
            keys.shift &&
            stamina > 0;


        const speed =
            sprinting
            ? SPRINT_SPEED
            : WALK_SPEED;


        if(sprinting) {

            stamina -=
                25 * delta;

        } else {

            stamina +=
                18 * delta;
        }


        stamina =
            THREE.MathUtils.clamp(
                stamina,
                0,
                100
            );


        const distance =
            speed * delta;


        /*
           X movement separately.
        */

        const nextX =
            player.position.x +
            direction.x * distance;


        if(
            !playerHitsWall(
                nextX,
                player.position.y,
                player.position.z
            )
        ) {

            player.position.x =
                nextX;
        }


        /*
           Z movement separately.
        */

        const nextZ =
            player.position.z +
            direction.z * distance;


        if(
            !playerHitsWall(
                player.position.x,
                player.position.y,
                nextZ
            )
        ) {

            player.position.z =
                nextZ;
        }

    } else {

        stamina +=
            18 * delta;

        stamina =
            Math.min(
                stamina,
                100
            );
    }


    /*
       Jump.
    */

    if(
        jumpPressed &&
        grounded
    ) {

        verticalVelocity =
            JUMP_SPEED;

        grounded = false;
    }

    jumpPressed = false;


    /*
       Gravity.
    */

    verticalVelocity -=
        GRAVITY * delta;


    let nextY =
        player.position.y +
        verticalVelocity * delta;


    /*
       Find floor beneath us.
    */

    const floorY =
        findFloor(
            player.position.x,
            player.position.z,
            player.position.y
        );


    /*
       Falling through an area with
       no floor.
    */

    if(
        floorY === -Infinity
    ) {

        grounded = false;

        if(
            player.position.y < -8
        ) {

            respawn();
            return;
        }

    } else {

        const landingEyeY =
            floorY +
            PLAYER_EYE_HEIGHT;


        if(
            nextY <= landingEyeY &&
            verticalVelocity <= 0
        ) {

            nextY =
                landingEyeY;

            verticalVelocity = 0;

            grounded = true;

        } else {

            grounded = false;
        }
    }


    /*
       Ceiling.
    */

    if(
        verticalVelocity > 0
    ) {

        const ceilingY =
            hitCeiling(
                player.position.x,
                nextY,
                player.position.z
            );


        if(
            ceilingY !== Infinity &&
            nextY + .2 >= ceilingY
        ) {

            nextY =
                ceilingY - .21;

            verticalVelocity = 0;
        }
    }


    player.position.y =
        nextY;


    /*
       Death holes.
    */

    checkDeathHoles();


    /*
       UI.
    */

    document.getElementById(
        "stamina"
    ).style.width =
        stamina + "%";
}


/* =========================================================
   DEATH HOLES
========================================================= */

function checkDeathHoles() {

    if(
        currentLevel !== "level0"
    ) {
        return;
    }


    /*
       Don't instantly kill the player
       while merely standing beside a hole.
    */

    if(
        player.position.y < -3
    ) {

        respawn();

        showMessage(
            "YOU FELL"
        );

        return;
    }
}

/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(
    x,
    y,
    z
) {

    const radius =
        .42;

    const bottom =
        y - 1.7;

    const top =
        y + 1.7;


    for(
        const wall of walls
    ) {

        if(
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {
            continue;
        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );

        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x - closestX;

        const dz =
            z - closestZ;


        if(
            dx * dx +
            dz * dz <
            radius * radius
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   ENTITY AI
========================================================= */

let entityStuckTimer = 0;

function updateEntity(delta) {

    if(!entity) {
        return;
    }


    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    if(
        distance > .2
    ) {

        const dirX =
            dx / distance;

        const dirZ =
            dz / distance;


        /*
           Same speed as player sprint.
        */

        const speed =
            SPRINT_SPEED;


        const amount =
            speed * delta;


        /*
           Try directly toward player.
        */

        let nx =
            entity.position.x +
            dirX * amount;

        let nz =
            entity.position.z +
            dirZ * amount;


        if(
            !entityHitsWall(
                nx,
                entity.position.y,
                nz
            )
        ) {

            entity.position.x =
                nx;

            entity.position.z =
                nz;

            entityStuckTimer = 0;

        } else {

            /*
               Try sideways.
            */

            const sideX =
                -dirZ;

            const sideZ =
                dirX;


            nx =
                entity.position.x +
                sideX * amount;

            nz =
                entity.position.z +
                sideZ * amount;


            if(
                !entityHitsWall(
                    nx,
                    entity.position.y,
                    nz
                )
            ) {

                entity.position.x =
                    nx;

                entity.position.z =
                    nz;

                entityStuckTimer = 0;

            } else {

                /*
                   Try opposite side.
                */

                nx =
                    entity.position.x -
                    sideX * amount;

                nz =
                    entity.position.z -
                    sideZ * amount;


                if(
                    !entityHitsWall(
                        nx,
                        entity.position.y,
                        nz
                    )
                ) {

                    entity.position.x =
                        nx;

                    entity.position.z =
                        nz;

                    entityStuckTimer = 0;

                } else {

                    entityStuckTimer +=
                        delta;
                }
            }
        }
    }


    /*
       Entity has been stuck.

       Search in the direction it is
       facing/toward the player first,
       then search around itself.
    */

    if(
        entityStuckTimer > 1
    ) {

        unstuckEntity();

        entityStuckTimer = 0;
    }


    /*
       Face player.
    */

    entity.lookAt(
        player.position.x,
        entity.position.y,
        player.position.z
    );


    /*
       Distance-based sound.
    */

    const volume =
        THREE.MathUtils.clamp(
            1 - distance / 45,
            0,
            1
        );


    entityAudio.volume =
        volume * volume;


    /*
       Red danger effect.
    */

    if(
        distance < 15
    ) {

        const strength =
            1 - distance / 15;

        document.getElementById(
            "danger"
        ).style.boxShadow =
            "inset 0 0 180px rgba(180,0,0," +
            (strength * .6) +
            ")";

    } else {

        document.getElementById(
            "danger"
        ).style.boxShadow =
            "none";
    }


    /*
       Entity catches player.
    */

    if(
        distance < 1.25
    ) {

        showMessage(
            "THE ENTITY FOUND YOU"
        );

        respawn();
    }
}


/* =========================================================
   ENTITY UNSTUCK
========================================================= */

function unstuckEntity() {

    if(!entity) {
        return;
    }


    const dx =
        player.position.x -
        entity.position.x;

    const dz =
        player.position.z -
        entity.position.z;


    const length =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    if(
        length < .001
    ) {
        return;
    }


    const forwardX =
        dx / length;

    const forwardZ =
        dz / length;


    /*
       Search ahead.
    */

    const distances = [
        2,
        3,
        4,
        5,
        7,
        9,
        12
    ];


    for(
        const distance of distances
    ) {

        const x =
            entity.position.x +
            forwardX * distance;

        const z =
            entity.position.z +
            forwardZ * distance;


        if(
            !entityHitsWall(
                x,
                entity.position.y,
                z
            )
        ) {

            entity.position.x =
                x;

            entity.position.z =
                z;

            return;
        }
    }


    /*
       Search in a circle if the
       forward direction is blocked.
    */

    for(
        let angle = 0;
        angle < Math.PI * 2;
        angle += Math.PI / 16
    ) {

        const x =
            entity.position.x +
            Math.cos(angle) * 5;

        const z =
            entity.position.z +
            Math.sin(angle) * 5;


        if(
            !entityHitsWall(
                x,
                entity.position.y,
                z
            )
        ) {

            entity.position.x =
                x;

            entity.position.z =
                z;

            return;
        }
    }
}

/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld() {

    /*
       Remove every generated object.
    */

    for(
        const object of worldObjects
    ) {

        scene.remove(
            object
        );
    }


    worldObjects = [];

    walls = [];

    floors = [];

    holes = [];


    /*
       Remove generated entity.
    */

    entity = null;


    /*
       Remove lights from scene that were
       added separately.
    */

    const lightsToRemove = [];

    scene.traverse(
        function(object) {

            if(
                object instanceof
                THREE.Light
            ) {

                lightsToRemove.push(
                    object
                );
            }
        }
    );


    for(
        const light of lightsToRemove
    ) {

        scene.remove(
            light
        );
    }


    /*
       Remove ambient lights too.
    */

    entityAudio.pause();

    entityAudio.currentTime = 0;

    scene.fog = null;
}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(level) {

    try {

        document.getElementById(
            "loading"
        ).style.display =
            "flex";


        clearWorld();


        if(level === "hotel") {

            buildHotel();

        } else {

            buildLevel0();
        }


        gameRunning = true;

        paused = false;


        document.getElementById(
            "menu"
        ).style.display =
            "none";

        document.getElementById(
            "pauseMenu"
        ).style.display =
            "none";


        /*
           Start sound.

           Browsers allow this because this
           function is called from the button
           click.
        */

        entityAudio.play().catch(
            function(error) {

                console.warn(
                    "Entity audio could not start:",
                    error
                );
            }
        );


        document.body.requestPointerLock();


        document.getElementById(
            "loading"
        ).style.display =
            "none";

    } catch(error) {

        console.error(
            "LEVEL ERROR:",
            error
        );

        document.getElementById(
            "loading"
        ).style.display =
            "none";

        showMessage(
            "LEVEL ERROR — PRESS F12 TO SEE ERROR"
        );
    }
}


/* =========================================================
   RESPAWN
========================================================= */

function respawn() {

    verticalVelocity = 0;

    grounded = true;

    stamina = 100;


    if(
        currentLevel === "hotel"
    ) {

        setSpawn(
            0,
            1.65,
            30,
            Math.PI
        );

    } else {

        setSpawn(
            -70,
            1.65,
            -60,
            0
        );
    }
}

   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;


    if(messageTimer) {

        clearTimeout(
            messageTimer
        );
    }


    messageTimer =
        setTimeout(
            function() {

                message.textContent =
                    "";

            },
            1800
        );
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame() {

    if(!gameRunning) {
        return;
    }


    paused = true;


    document.getElementById(
        "pauseMenu"
    ).style.display =
        "flex";


    if(
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    entityAudio.pause();
}


function resumeGame() {

    if(!gameRunning) {
        return;
    }


    paused = false;


    document.getElementById(
        "pauseMenu"
    ).style.display =
        "none";


    document.body.requestPointerLock();


    entityAudio.play().catch(
        function() {}
    );
}


function togglePause() {

    if(paused) {

        resumeGame();

    } else {

        pauseGame();
    }
}

/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        gameRunning &&
        !paused
    ) {

        updatePlayer(
            delta
        );

        updateEntity(
            delta
        );


        /*
           Slight camcorder flicker.
        */

        document.getElementById(
            "vhs"
        ).style.opacity =
            .24 +
            Math.random() * .08;
    }


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
