<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   THREE CHECK
========================================================= */

if (
    typeof THREE === "undefined"
) {

    const error =
        document.getElementById(
            "error"
        );

    error.style.display = "block";

    error.textContent =
        "THREE.JS DID NOT LOAD.\n\n" +

        "Expected:\n" +
        "./three.min.js\n\n" +

        "Make sure three.min.js is in the SAME folder as index.html.";

    throw new Error(
        "Local Three.js failed to load."
    );
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x716c48
    );


scene.fog =
    new THREE.Fog(
        0x716c48,
        34,
        145
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        0.025,
        500
    );

camera.rotation.order =
    "YXZ";


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(
    player
);

player.add(
    camera
);

const EYE_HEIGHT =
    1.18;

const PLAYER_HEIGHT =
    1.55;

const PLAYER_RADIUS =
    0.28;


let yaw = 0;

let pitch = 0;

let velocityY = 0;

let grounded = false;

let running = false;

let paused = false;

let dead = false;

let fallingIntoLevel = false;

let fallTimer = 0;

const FALL_DURATION =
    2.25;

let difficulty =
    "normal";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        alpha: false,

        powerPreference:
            "high-performance"
    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.35
    )
);


if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}


renderer.toneMapping =
    THREE.NoToneMapping;

renderer.toneMappingExposure =
    1;


renderer.domElement.style.position =
    "fixed";

renderer.domElement.style.left =
    "0";

renderer.domElement.style.top =
    "0";

renderer.domElement.style.width =
    "100%";

renderer.domElement.style.height =
    "100%";


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   BASIC LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.32
    )
);


scene.add(
    new THREE.HemisphereLight(
        0xfff1a0,
        0x17140b,
        0.25
    )
);


/* =========================================================
   TEXTURE SYSTEM
     
   THIS IS THE IMPORTANT FIX.
     
   The source textures are NEVER directly modified.
   Every surface receives its own texture instance.
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


textureLoader.setCrossOrigin(
    "anonymous"
);


let wallSourceTexture = null;

let floorSourceTexture = null;

let ceilingSourceTexture = null;


/* ---------------------------------------------------------
   Load one image and verify it
--------------------------------------------------------- */

function loadTextureSafely(
    path
) {

    return new Promise(
        resolve => {

            const loader =
                new THREE.TextureLoader();


            loader.load(

                path,

                texture => {

                    if (
                        !texture ||
                        !texture.image
                    ) {

                        console.error(
                            "Invalid texture:",
                            path
                        );

                        resolve(null);

                        return;
                    }


                    console.log(
                        "TEXTURE LOADED:",
                        path,
                        texture.image.width,
                        texture.image.height
                    );


                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    texture.wrapS =
                        THREE.RepeatWrapping;

                    texture.wrapT =
                        THREE.RepeatWrapping;


                    texture.magFilter =
                        THREE.LinearFilter;

                    texture.minFilter =
                        THREE.LinearMipmapLinearFilter;


                    texture.anisotropy =
                        Math.min(
                            renderer
                                .capabilities
                                .getMaxAnisotropy(),

                            8
                        );


                    texture.needsUpdate =
                        true;


                    resolve(
                        texture
                    );
                },


                undefined,


                error => {

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    resolve(null);
                }
            );

        }
    );
}


/* ---------------------------------------------------------
   Load all environment textures
--------------------------------------------------------- */

async function loadEnvironmentTextures() {

    wallSourceTexture =
        await loadTextureSafely(
            "./textures/wall.png"
        );


    floorSourceTexture =
        await loadTextureSafely(
            "./textures/floor.png"
        );


    ceilingSourceTexture =
        await loadTextureSafely(
            "./textures/ceiling.png"
        );


    const missing = [];


    if (!wallSourceTexture) {

        missing.push(
            "./textures/wall.png"
        );
    }


    if (!floorSourceTexture) {

        missing.push(
            "./textures/floor.png"
        );
    }


    if (!ceilingSourceTexture) {

        missing.push(
            "./textures/ceiling.png"
        );
    }


    if (
        missing.length > 0
    ) {

        const error =
            document.getElementById(
                "error"
            );

        error.style.display =
            "block";


        error.textContent =
            "ENVIRONMENT TEXTURE ERROR\n\n" +

            "The game could not decode:\n\n" +

            missing.join("\n") +

            "\n\nExpected structure:\n" +

            "index.html\n" +
            "three.min.js\n" +
            "entity.png\n" +
            "entity.mp3\n" +
            "textures/\n" +
            "    wall.png\n" +
            "    floor.png\n" +
            "    ceiling.png";
    }

}


/* =========================================================
   CREATE A FRESH TEXTURE INSTANCE
========================================================= */

function createTextureInstance(
    source,
    repeatX,
    repeatY
) {

    if (
        !source ||
        !source.image
    ) {

        return null;
    }


    const texture =
        source.clone();


    texture.image =
        source.image;


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        repeatX,
        repeatY
    );


    texture.offset.set(
        0,
        0
    );


    texture.center.set(
        0,
        0
    );


    texture.rotation =
        0;


    texture.magFilter =
        THREE.LinearFilter;


    texture.minFilter =
        THREE.LinearMipmapLinearFilter;


    texture.anisotropy =
        Math.min(
            renderer
                .capabilities
                .getMaxAnisotropy(),

            8
        );


    texture.needsUpdate =
        true;


    return texture;
}


/* =========================================================
   WALL MATERIAL
     
   MeshBasicMaterial means the PNG itself is displayed.
   Lighting cannot turn the texture black.
========================================================= */

function makeWallMaterial(
    width,
    height
) {

    if (
        !wallSourceTexture
    ) {

        return new THREE.MeshBasicMaterial({

            color:
                0xb7ad55,

            side:
                THREE.DoubleSide
        });
    }


    const image =
        wallSourceTexture.image;


    const imageWidth =
        image.naturalWidth ||
        image.width ||
        1;


    const imageHeight =
        image.naturalHeight ||
        image.height ||
        1;


    const aspect =
        imageWidth /
        imageHeight;


    /*
       This preserves the PNG's
       natural proportions.

       The texture is NOT stretched
       over the entire wall.
    */

    const worldWidthPerTexture =
        height * aspect;


    const repeatX =
        Math.max(
            width /
            worldWidthPerTexture,

            0.001
        );


    const texture =
        createTextureInstance(
            wallSourceTexture,
            repeatX,
            1
        );


    return new THREE.MeshBasicMaterial({

        map:
            texture,

        color:
            0xffffff,

        side:
            THREE.DoubleSide,

        transparent:
            false,

        fog:
            true
    });
}


/* =========================================================
   WORLD
========================================================= */

let worldObjects = [];

let wallColliders = [];

let deathHoles = [];

let lights = [];


function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}


function disposeMaterial(
    material
) {

    if (!material)
        return;


    if (
        Array.isArray(
            material
        )
    ) {

        material.forEach(
            disposeMaterial
        );

        return;
    }


    /*
       We deliberately do NOT dispose
       the three source textures.
    */

    material.dispose();
}


function clearWorld() {

    for (
        const object
        of worldObjects
    ) {

        scene.remove(
            object
        );


        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();
                }


                if (
                    child.material
                ) {

                    disposeMaterial(
                        child.material
                    );
                }

            }
        );
    }


    worldObjects = [];

    wallColliders = [];

    deathHoles = [];

    lights = [];


    if (
        exitLight
    ) {

        scene.remove(
            exitLight
        );

        exitLight =
            null;
    }


    exitObject =
        null;


    entity =
        null;
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    let material;


    if (
        floorSourceTexture
    ) {

        /*
           Large repeat count gives the carpet
           the small repeating scale expected
           in Level 0.
        */

        const texture =
            createTextureInstance(
                floorSourceTexture,
                72,
                72
            );


        material =
            new THREE.MeshBasicMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                side:
                    THREE.DoubleSide,

                fog:
                    true
            });

    } else {

        material =
            new THREE.MeshBasicMaterial({

                color:
                    0x9a9048,

                side:
                    THREE.DoubleSide
            });
    }


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                270
            ),

            material
        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    addWorldObject(
        floor
    );
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling() {

    let material;


    if (
        ceilingSourceTexture
    ) {

        /*
           The ceiling texture is intentionally
           MUCH smaller than before.

           9x the repeat density means each
           texture tile is approximately 1/9
           the previous size.
        */

        const texture =
            createTextureInstance(
                ceilingSourceTexture,
                108,
                96
            );


        material =
            new THREE.MeshBasicMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                side:
                    THREE.DoubleSide,

                fog:
                    true
            });

    } else {

        material =
            new THREE.MeshBasicMaterial({

                color:
                    0x817a45,

                side:
                    THREE.DoubleSide
            });
    }


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                270
            ),

            material
        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        3.1;


    addWorldObject(
        ceiling
    );
}


/* =========================================================
   WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = 0.32
) {

    const height =
        3.1;


    wallColliders.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2,

        minY:
            0,

function createHoleRoom() {

    const startX =
        -57;

    const startZ =
        53;

    const columns =
        18;

    const rows =
        8;

    const spacing =
        3.5;


    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            const px =
                startX +
                x * spacing;

            const pz =
                startZ +
                z * spacing;


            if (
                (x + z) % 5 === 0
            ) {

                continue;
            }


            const hole =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.7,
                        2.7

                    new THREE.MeshBasicMaterial({

                        color:

                        side:

            hole.rotation.x =

            hole.position.set(
                px,

            addWorldObject(

            deathHoles.push({

                x:

function updateLights(
    dt
) {

    for (
        const item
        of lights
    ) {

        if (
            !item.flicker
        ) {

            continue;
        }


        item.timer -=
            dt;


        if (
            item.timer <= 0
        ) {

            item.timer =
                .06 +
                Math.random() * .65;


            /*
               The physical fluorescent panel
               stays visible.

               ONLY the light intensity changes.
            */

            const variation =
                .35 +
                Math.random() * .65;


            item.light.intensity =
                item.base *
                variation;


            /*
               Very short blackout,
               but the fixture remains visible.
            */

            if (
                Math.random() < .08
            ) {

                item.light.intensity =
                    item.base * .05;
            }
        }
    }
}


/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;

    const top =
        bottom +
        PLAYER_HEIGHT;


    for (
        const wall
        of wallColliders
    ) {

        if (
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {

            continue;
        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }


    return false;
}


function entityHitsWall(
    x,
    z
) {

    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            .43 * .43
        ) {

            return true;
        }
    }


    return false;
}


function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 -
        x1;

    const dz =
        z2 -
        z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance / .35
        );


    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i /
            steps;


        if (
            entityHitsWall(

                x1 +
                dx * t,

                z1 +
                dz * t
            )
        ) {

            return true;
        }
    }


    return false;
}

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;

        const dz =
            player.position.z -
            hole.z;


        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;
        }
    }


    return false;
}

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    const settings =
        SETTINGS[
            difficulty
        ];


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    lastSeen +=
        dt;


    /*
       The entity ALWAYS knows where
       the player is.

       Visibility only changes how
       aggressively it chooses its route.
    */

    const visible =
        distance <
        settings.detection &&
        !blocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z
        );


    let dx2 = 0;

    let dz2 = 0;


    if (
        visible
    ) {

        lastKnown.set(
            player.position.x,
            player.position.z
        );


        lastSeen =
            0;


        dx2 =
            dx /
            Math.max(
                distance,
                .001
            );


        dz2 =
            dz /
            Math.max(
                distance,
                .001
            );

    } else {

        /*
           Still chase the player's
           actual current position.

           This prevents the entity from
           wandering forever after losing sight.
        */

        const targetX =
            player.position.x -
            entity.position.x;


        const targetZ =
            player.position.z -
            entity.position.z;


        const targetLength =
            Math.hypot(
                targetX,
                targetZ
            );


        if (
            targetLength > .1
        ) {

            dx2 =
                targetX /
                targetLength;

            dz2 =
                targetZ /
                targetLength;
        }
    }


    const targetAngle =
        Math.atan2(
            dz2,
            dx2
        );


    const currentAngle =
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );


    let difference =
        targetAngle -
        currentAngle;


    while (
        difference >
        Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }


    while (
        difference <
        -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }


    difference =
        Math.max(

            -3.4 * dt,

            Math.min(
                3.4 * dt,
                difference
            )
        );


    const angle =
        currentAngle +
        difference;


    entityDirection.x =
        Math.cos(
            angle
        );


    entityDirection.y =
        Math.sin(
            angle
        );


    entityVelocity.x =
        THREE.MathUtils.lerp(

            entityVelocity.x,

            entityDirection.x *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );


    entityVelocity.y =
        THREE.MathUtils.lerp(

            entityVelocity.y,

            entityDirection.y *
            settings.speed,

            Math.min(
                1,
                dt * 4
            )
        );


    const moveX =
        entityVelocity.x *
        dt;


    const moveZ =
        entityVelocity.y *
        dt;


    const nextX =
        entity.position.x +
        moveX;


    const nextZ =
        entity.position.z +
        moveZ;


    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        entityVelocity.x =
            0;


        /*
           Juke around the wall.
        */

        wanderAngle +=
            Math.PI / 2;


        entityDirection.set(

            Math.cos(
                wanderAngle
            ),

            Math.sin(
                wanderAngle
            )
        );
    }


    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        entityVelocity.y =
            0;


        wanderAngle +=
            Math.PI / 2;


        entityDirection.set(

            Math.cos(
                wanderAngle
            ),

            Math.sin(
                wanderAngle
            )
        );
    }


    /*
       Billboard toward player.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );


    const killDistance =
        difficulty ===
        "nightmare"

            ? 1.55

            : 1.25;


    if (
        distance <
        killDistance
    ) {

        killPlayer();
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;
    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z
        );


    const maxDistance =
        34;


    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;
    }


    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.6

        ) * .9;


    if (
        blocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z
        )
    ) {

        volume *=
            .2;
    }


    entityAudio.volume =
        THREE.MathUtils.clamp(

            volume,

            0,

            .9
        );


    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   INPUT
========================================================= */

const keys = {

    w:
        false,

    a:
        false,

    s:
        false,

    d:
        false,

    shift:
        false
};


let jumpPressed =
    false;


addEventListener(
    "keydown",
    event => {

        /*
           IMPORTANT:

           W = FORWARD
           S = BACKWARD

           There is no inversion here.
        */

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                true;
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                true;
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                true;
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                true;
        }


        if (
            event.code ===
            "ShiftLeft" ||
            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                true;
        }


        if (
            event.code ===
            "Space" &&
            !event.repeat
        ) {

            jumpPressed =
                true;
        }


        if (
            event.code ===
            "Escape" &&
            running &&
            !dead &&
            !fallingIntoLevel
        ) {

            togglePause();
        }
    }
);


addEventListener(
    "keyup",
    event => {

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                false;
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                false;
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                false;
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                false;
        }


        if (
            event.code ===
            "ShiftLeft" ||
            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                false;
        }
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ) {

            return;
        }


        if (
            document.pointerLockElement !==
            document.body
        ) {

            return;
        }


        yaw -=
            event.movementX *
            .0022;


        pitch -=
            event.movementY *
            .0018;


        pitch =
            Math.max(

                -1.45,

                Math.min(
                    1.45,
                    pitch
                )
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;
    }
);


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;
    }


    let forward =
        0;

    let side =
        0;


    if (
        keys.w
    ) {

        forward++;
    }


    if (
        keys.s
    ) {

        forward--;
    }


    if (
        keys.d
    ) {

        side++;
    }


    if (
        keys.a
    ) {

        side--;
    }


    const length =
        Math.hypot(
            forward,
            side
        );


    if (
        length
    ) {

        forward /=
            length;

        side /=
            length;
    }


    let speed =
        keys.shift
            ? 5.9
            : 3.5;


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.1
                : 3.8;
    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.3
                : 3.4;
    }


    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.5
                : 3.25;
    }


    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    /*
       W = FORWARD.
       S = BACKWARD.

       This is deliberately explicit.
    */

    const dx =
        (
            side * cos +
            forward * sin
        ) *
        speed *
        dt;


    const dz =
        (
            -side * sin +
            forward * cos
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        dx;


    const nextZ =
        player.position.z +
        dz;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;
    }


    jumpPressed =
        false;


    velocityY -=
        20 *
        dt;


    player.position.y +=
        velocityY *
        dt;


    if (
        player.position.y <=
        0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;
    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }


    checkExit();
}


/* =========================================================
   FALL
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;


    const progress =
        Math.min(

            fallTimer /
            FALL_DURATION,

            1
        );


    const eased =
        1 -
        Math.pow(
            1 - progress,
            3
        );


    player.position.y =
        17 -
        17 *
        eased;


    camera.position.y =
        EYE_HEIGHT;


    camera.rotation.x =
        THREE.MathUtils.lerp(

            -.32,

            0,

            Math.min(
                progress * 1.3,
                1
            )
        );


    camera.rotation.z =
        Math.sin(

            progress *
            Math.PI *
            9

        ) * .025;


    if (
        progress >=
        1
    ) {

        fallingIntoLevel =
            false;


        player.position.y =
            0;


        camera.position.x =
            0;

        camera.position.y =
            EYE_HEIGHT;

        camera.position.z =
            0;


        camera.rotation.x =
            0;

        camera.rotation.z =
            0;


        document.body
            .requestPointerLock()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   CAMERA
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;
    }


    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const amount =
        moving
            ? .009
            : .0025;


    camera.position.x =
        Math.sin(
            cameraTime * 3.4
        ) *
        amount;


    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime * 4.1
        ) *
        amount;


    camera.position.z =
        Math.cos(
            cameraTime * 3.1
        ) *
        amount *
        .55;


    camera.rotation.z =
        Math.sin(
            cameraTime * .9
        ) *
        .003;


    if (
        Math.random() <
        .003
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) * .035;


        camera.position.y +=
            (
                Math.random() -
                .5
            ) * .025;


        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) * .025;
    }
}


/* =========================================================
   EXIT
========================================================= */

function checkExit() {

    if (
        !exitObject ||
        dead
    ) {

        return;
    }


    const distance =
        Math.hypot(

            player.position.x -
            exitX,

            player.position.z -
            exitZ
        );


    if (
        distance <
        1.8
    ) {

        winGame();
    }
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer =
    0;


function showMessage(
    text
) {

    document.getElementById(
        "message"
    ).textContent =
        text;


    messageTimer =
        2.2;
}


function updateMessage(
    dt
) {

    if (
        messageTimer <=
        0
    ) {

        return;
    }


    messageTimer -=
        dt;


    if (
        messageTimer <=
        0
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "";
    }
}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason =
        "THE BACKROOMS GOT YOU"
) {

    if (
        dead ||
        !running
    ) {

        return;
    }


    dead =
        true;


    fallingIntoLevel =
        false;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU DIED";


    document.getElementById(
        "deathTitle"
    ).className =
        "";


    document.getElementById(
        "deathText"
    ).textContent =
        reason;


    document.getElementById(
        "retryBtn"
    ).textContent =
        "RETRY";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   WIN
========================================================= */

function winGame() {

    if (
        dead ||
        !running
    ) {

        return;
    }


    dead =
        true;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU ESCAPED";


    document.getElementById(
        "deathTitle"
    ).className =
        "win";


    document.getElementById(
        "deathText"
    ).textContent =
        "YOU FOUND THE EXIT";


    document.getElementById(
        "retryBtn"
    ).textContent =
        "PLAY AGAIN";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    paused =
        !paused;


    document.getElementById(
        "pause"
    ).style.display =
        paused
            ? "flex"
            : "none";


    if (
        paused
    ) {

        if (
            document.pointerLockElement
        ) {

            document.exitPointerLock();
        }

    } else {

        document.body
            .requestPointerLock()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   MENU
========================================================= */

function returnToMenu() {

    running =
        false;

    paused =
        false;

    dead =
        false;

    fallingIntoLevel =
        false;


    entityAudio.pause();

    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "block";


    document.getElementById(
        "crtButton"
    ).style.display =
        "none";
}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    /*
       Make absolutely sure the PNGs have
       finished loading before geometry exists.
    */

    if (
        !wallSourceTexture ||
        !floorSourceTexture ||
        !ceilingSourceTexture
    ) {

        await loadEnvironmentTextures();
    }


    clearWorld();


    player.position.set(

        -92,

        17,

        -70
    );


    yaw =
        .25;


    pitch =
        -.28;


    velocityY =
        0;


    grounded =
        false;


    createFloor();

    createCeiling();

    buildFloorPlan();

    createHoleRoom();

    createExit();

    buildLighting();


    await createEntity();


    entity.position.set(
        55,
        .775,
        -48
    );


    entityDirection.set(
        1,
        0
    );


    entityVelocity.set(
        0,
        0
    );


    lastSeen =
        99;


    running =
        true;

    paused =
        false;

    dead =
        false;

    fallingIntoLevel =
        true;


    fallTimer =
        0;


    recordingTime =
        0;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "crtButton"
    ).style.display =
        "block";


    camera.position.set(

        0,

        EYE_HEIGHT,

        0
    );


    camera.rotation.x =
        pitch;


    camera.rotation.z =
        0;


    player.rotation.y =
        yaw;


    showMessage(
        "ENTERING LEVEL 0..."
    );
}


/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(
    value
) {

    difficulty =
        value;


    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );
            }
        );


    const id =
        value ===
        "nightmare"

            ? "nightmareBtn"

            : value +
              "Btn";


    document.getElementById(
        id
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();
}


document.getElementById(
    "easyBtn"
).onclick =
    () =>
        setDifficulty(
            "easy"
        );


document.getElementById(
    "normalBtn"
).onclick =
    () =>
        setDifficulty(
            "normal"
        );


document.getElementById(
    "hardBtn"
).onclick =
    () =>
        setDifficulty(
            "hard"
        );


document.getElementById(
    "nightmareBtn"
).onclick =
    () =>
        setDifficulty(
            "nightmare"
        );


document.getElementById(
    "startBtn"
).onclick =
    () =>
        startGame();


document.getElementById(
    "resumeBtn"
).onclick =
    () =>
        togglePause();


document.getElementById(
    "restartBtn"
).onclick =
    () =>
        startGame();


document.getElementById(
    "menuBtn"
).onclick =
    () =>
        returnToMenu();


document.getElementById(
    "retryBtn"
).onclick =
    () =>
        startGame();


document.getElementById(
    "deathMenuBtn"
).onclick =
    () =>
        returnToMenu();


/* =========================================================
   CRT TOGGLE
========================================================= */

let crtEnabled =
    false;


const crtOverlay =
    document.getElementById(
        "crtOverlay"
    );


const crtButton =
    document.getElementById(
        "crtButton"
    );


crtButton.onclick =
    event => {

        event.stopPropagation();


        crtEnabled =
            !crtEnabled;


        crtOverlay.classList.toggle(
            "enabled",
            crtEnabled
        );


        crtButton.textContent =
            crtEnabled
                ? "CRT: ON"
                : "CRT: OFF";
    };


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    () => {

        if (
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement !==
            document.body
        ) {

            document.body
                .requestPointerLock()
                .catch(
                    () => {}
                );
        }
    }
);


/* =========================================================
   RANDOM MENU IMAGE
========================================================= */

let menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );


let menuIndex =
    Math.floor(
        Math.random() *
        Math.max(
            menuImages.length,
            1
        )
    );


function chooseRandomMenuImage() {

    menuImages =
        Array.from(
            document.querySelectorAll(
                ".menuImage"
            )
        );


    if (
        menuImages.length === 0
    ) {

        return;
    }


    menuImages.forEach(
        image => {

            image.classList.remove(
                "active"
            );
        }
    );


    let next =
        Math.floor(
            Math.random() *
            menuImages.length
        );


    if (
        menuImages.length > 1 &&
        next === menuIndex
    ) {

        next =
            (
                next + 1
            ) %
            menuImages.length;
    }


    menuIndex =
        next;


    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}


chooseRandomMenuImage();


setInterval(
    chooseRandomMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.35
            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock =
    new THREE.Clock();


let recordingTime =
    0;


function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;
    }


    recordingTime +=
        dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total /
            3600
        );


    const minutes =
        Math.floor(
            (total % 3600) /
            60
        );


    const seconds =
        total %
        60;


    const format =
        n =>
            String(n)
                .padStart(
                    2,
                    "0"
                );


    document.getElementById(
        "tapeTime"
    ).textContent =

        `${format(hours)}:` +
        `${format(minutes)}:` +
        `${format(seconds)}`;
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(

            clock.getDelta(),

            .05
        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        updateLights(
            dt
        );


        updateCamera(
            dt
        );


        updateEntityAudio();


        updateMessage(
            dt
        );


        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadEnvironmentTextures();

animate();

</script>
