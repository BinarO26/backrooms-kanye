<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>THE BACKROOMS — LEVEL 0</title>


<style>

* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

canvas {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    image-rendering: auto;
}


/* =========================================================
   MENU
========================================================= */

#menu {

    position: fixed;

    inset: 0;

    z-index: 50;

    overflow: hidden;

    background: #111;
}

.menuImage {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0;

    transition:
        opacity 2.5s ease;

    pointer-events: none;
}

.menuImage.active {

    opacity: 1;
}

.menuDark {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            rgba(0,0,0,.18),
            rgba(0,0,0,.72)
        );
}

.menuNoise {

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .08;

    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            #fff 0,
            #fff 1px,
            transparent 1px,
            transparent 4px
        );

    background-size: 7px 7px;
}

.menuScan {

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(0,0,0,.14) 4px
        );
}

.menuContent {

    position: absolute;

    top: 18%;

    left: 50%;

    transform:
        translateX(-50%);

    width: 92%;

    text-align: center;

    color: white;

    text-shadow:
        0 3px 12px #000;
}

.menuContent h1 {

    margin: 0;

    font-size:
        clamp(
            42px,
            7vw,
            92px
        );

    letter-spacing: .12em;

    font-weight: 900;
}

.menuSubtitle {

    margin-top: 12px;

    font-size:
        clamp(
            14px,
            2vw,
            23px
        );

    letter-spacing: .3em;
}

.menuHint {

    margin-top: 32px;

    font-size: 12px;

    letter-spacing: .25em;

    opacity: .7;
}

.menuButtons {

    position: absolute;

    left: 50%;
    bottom: 10%;

    transform:
        translateX(-50%);

    width:
        min(
            500px,
            88vw
        );

    text-align: center;
}

.menuDifficulty {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 18px;
}

button {

    border:
        1px solid
        rgba(255,255,255,.5);

    background:
        rgba(0,0,0,.58);

    color: white;

    padding:
        12px 17px;

    font-weight: bold;

    letter-spacing: .12em;

    cursor: pointer;

    transition:
        background .15s,
        border .15s,
        transform .15s;
}

button:hover {

    background:
        rgba(255,255,255,.18);

    transform:
        translateY(-1px);
}

.menuDifficulty button.selected {

    background:
        rgba(220,210,120,.38);

    border-color:
        #e7db83;
}

.menuButton {

    width: 100%;

    font-size: 18px;

    padding: 17px;

    background:
        rgba(0,0,0,.72);
}


/* =========================================================
   PAUSE / DEATH
========================================================= */

#pause,
#death {

    position: fixed;

    inset: 0;

    z-index: 60;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:
        rgba(0,0,0,.78);

    color: white;

    text-align: center;
}

#pause h1 {

    font-size: 60px;

    letter-spacing: .15em;

    margin:
        0 0 30px;
}

#pause button,
#death button {

    width:
        min(
            300px,
            80vw
        );

    margin: 6px;

    font-size: 16px;
}

#deathTitle {

    font-size:
        clamp(
            48px,
            8vw,
            100px
        );

    font-weight: 900;

    letter-spacing: .12em;
}

#deathTitle.win {

    color:
        #5dff72;
}

#deathText {

    margin:
        15px 0 30px;

    font-size: 14px;

    letter-spacing: .2em;
}


/* =========================================================
   HUD
========================================================= */

#hud {

    position: fixed;

    inset: 0;

    z-index: 20;

    pointer-events: none;
}

#difficultyHud {

    position: absolute;

    top: 18px;
    left: 20px;

    color:
        rgba(255,255,255,.68);

    font-size: 12px;

    letter-spacing: .18em;

    font-family: monospace;
}

#tapeTime {

    position: absolute;

    top: 18px;
    right: 20px;

    color:
        rgba(255,255,255,.68);

    font-family: monospace;

    font-size: 13px;
}

#message {

    position: absolute;

    left: 50%;
    bottom: 15%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 13px;

    letter-spacing: .18em;

    text-align: center;

    text-shadow:
        0 2px 7px #000;
}

#crosshair {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 3px;
    height: 3px;

    transform:
        translate(
            -50%,
            -50%
        );

    background:
        rgba(255,255,255,.38);
}


/* =========================================================
   CRT CAMERA OVERLAY
========================================================= */

#crt {

    position: fixed;

    inset: 0;

    z-index: 25;

    pointer-events: none;

    opacity: .78;
}


/*
    Fine horizontal scanlines
*/

.crtScanlines {

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            transparent 2px,
            transparent 4px
        );

    mix-blend-mode:
        screen;
}


/*
    Stronger VHS tracking bands
*/

.crtTracking {

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 47px,
            rgba(255,255,255,.035) 48px,
            rgba(255,255,255,.01) 54px,
            transparent 60px
        );

    opacity: .7;

    animation:
        trackingMove
        7s
        linear
        infinite;
}

@keyframes trackingMove {

    0% {

        transform:
            translateY(-40px);
    }

    100% {

        transform:
            translateY(40px);
    }
}


/*
    VHS grain
*/

.crtNoise {

    position: absolute;

    inset: -20%;

    opacity: .10;

    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.9) 0px,
            rgba(255,255,255,.9) 1px,
            transparent 1px,
            transparent 5px
        );

    background-size:
        7px 7px;

    animation:
        noiseShift
        .18s
        steps(2)
        infinite;
}

@keyframes noiseShift {

    0% {

        transform:
            translate(
                0,
                0
            );
    }

    25% {

        transform:
            translate(
                -2%,
                1%
            );
    }

    50% {

        transform:
            translate(
                1%,
                -1%
            );
    }

    75% {

        transform:
            translate(
                2%,
                2%
            );
    }

    100% {

        transform:
            translate(
                0,
                0
            );
    }
}


/*
    Camera color bleed
*/

.crtBleed {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(255,0,0,.035),
            transparent 15%,
            transparent 85%,
            rgba(0,90,255,.04)
        );

    mix-blend-mode:
        screen;
}


/*
    Strong vignette
*/

.crtVignette {

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 43%,
            rgba(0,0,0,.18) 68%,
            rgba(0,0,0,.72) 100%
        );
}


/*
    Occasional horizontal interference
*/

.crtGlitch {

    position: absolute;

    left: 0;
    right: 0;

    height: 3px;

    top: 30%;

    background:
        rgba(255,255,255,.13);

    opacity: 0;

    animation:
        glitchLine
        5.7s
        infinite;
}

@keyframes glitchLine {

    0%,
    87%,
    100% {

        opacity: 0;
    }

    88% {

        opacity: .8;

        transform:
            translateX(-3%);
    }

    89% {

        opacity: .2;

        transform:
            translateX(4%);
    }

    90% {

        opacity: .65;

        transform:
            translateX(-1%);
    }

    91% {

        opacity: 0;
    }
}


/* =========================================================
   ERROR
========================================================= */

#error {

    display: none;

    position: fixed;

    z-index: 100;

    left: 20px;
    right: 20px;
    bottom: 20px;

    padding: 18px;

    color: white;

    background:
        rgba(120,0,0,.92);

    border:
        1px solid
        #f66;

    white-space:
        pre-wrap;

    font-family:
        monospace;
}

</style>

<!-- =========================================================
     LOCAL THREE.JS
========================================================= -->

<script src="./three.min.js"></script>


<script>

"use strict";


/* =========================================================
   THREE CHECK
========================================================= */

if (
    typeof THREE ===
    "undefined"
) {

    const error =
        document.getElementById(
            "error"
        );

    error.style.display =
        "block";

    error.textContent =
        "THREE.JS FAILED TO LOAD.\n\n" +
        "Expected:\n" +
        "./three.min.js\n\n" +
        "Make sure three.min.js is in the SAME folder as index.html.";

    throw new Error(
        "Local Three.js failed to load."
    );
}


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
            "high-performance",

        alpha: false
    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);


if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.08;


renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x504b32
    );


scene.fog =
    new THREE.FogExp2(
        0x504b32,
        0.009
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        76,

        innerWidth /
        innerHeight,

        0.035,

        500
    );


camera.rotation.order =
    "YXZ";


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();


scene.add(
    player
);


player.add(
    camera
);


const EYE_HEIGHT =
    1.18;


const PLAYER_HEIGHT =
    1.55;


const PLAYER_RADIUS =
    .28;


let yaw =
    0;


let pitch =
    0;


let velocityY =
    0;


let grounded =
    true;


let running =
    false;


let paused =
    false;


let dead =
    false;


let fallingIntoLevel =
    false;


let fallTimer =
    0;


const FALL_DURATION =
    2.25;


let difficulty =
    "normal";


/* =========================================================
   WORLD ARRAYS
========================================================= */

let worldObjects = [];

let wallColliders = [];

let deathHoles = [];

let lights = [];

let pillars = [];


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


let wallTexture =
    null;


let floorTexture =
    null;


let ceilingTexture =
    null;


/* =========================================================
   TEXTURE PREPARATION
========================================================= */

function prepareTexture(
    texture
) {

    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.magFilter =
        THREE.LinearFilter;


    texture.minFilter =
        THREE.LinearMipmapLinearFilter;


    texture.anisotropy =
        Math.min(

            renderer
                .capabilities
                .getMaxAnisotropy(),

            8
        );


    texture.needsUpdate =
        true;


    return texture;
}


function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "Loaded:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            texture
                        )
                    );
                },

                undefined,

                error => {

                    console.warn(
                        "Texture failed:",
                        path,
                        error
                    );

                    resolve(
                        null
                    );
                }
            );

        }
    );
}


async function loadTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );


    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );


    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );


    const missing = [];


    if (!wallTexture)
        missing.push(
            "./textures/wall.png"
        );


    if (!floorTexture)
        missing.push(
            "./textures/floor.png"
        );


    if (!ceilingTexture)
        missing.push(
            "./textures/ceiling.png"
        );


    if (
        missing.length
    ) {

        const error =
            document.getElementById(
                "error"
            );


        error.style.display =
            "block";


        error.textContent =
            "TEXTURE ERROR\n\n" +
            "Could not load:\n\n" +
            missing.join(
                "\n"
            ) +
            "\n\n" +
            "Expected folder:\n" +
            "./textures/";
    }
}


/* =========================================================
   WORLD MANAGEMENT
========================================================= */

function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}


function disposeMaterial(
    material
) {

    if (!material)
        return;


    if (
        Array.isArray(
            material
        )
    ) {

        material.forEach(
            disposeMaterial
        );

        return;
    }


    if (
        material.map
    ) {

        material.map.dispose();
    }


    material.dispose();
}


function clearWorld() {

    for (
        const object
        of worldObjects
    ) {

        scene.remove(
            object
        );


        object.traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry.dispose();
                }


                if (
                    child.material
                ) {

                    disposeMaterial(
                        child.material
                    );
                }
            }
        );
    }


    worldObjects = [];

    wallColliders = [];

    deathHoles = [];

    pillars = [];

    lights = [];


    if (
        exitLight
    ) {

        scene.remove(
            exitLight
        );

        exitLight =
            null;
    }


    exitObject =
        null;


    entity =
        null;
}


/* =========================================================
   WALL MATERIAL
========================================================= */

function makeWallMaterial(
    width,
    height
) {

    if (
        !wallTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0xb9ad55,

            roughness:
                .88,

            metalness:
                0
        });
    }


    const texture =
        wallTexture.clone();


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.ClampToEdgeWrapping;


    const imageWidth =
        texture.image &&
        texture.image.width
            ? texture.image.width
            : 1;


    const imageHeight =
        texture.image &&
        texture.image.height
            ? texture.image.height
            : 1;


    const aspect =
        imageWidth /
        imageHeight;


    /*
       IMPORTANT:

       The wall texture is scaled according
       to the actual wall width.

       This prevents the wallpaper from
       stretching across huge walls.
    */

    const worldTextureWidth =
        height *
        aspect;


    texture.repeat.set(

        Math.max(
            width /
            worldTextureWidth,
            .01
        ),

        1
    );


    texture.offset.set(
        0,
        0
    );


    texture.needsUpdate =
        true;


    return new THREE.MeshStandardMaterial({

        map:
            texture,

        color:
            0xffffff,

        roughness:
            .92,

        metalness:
            0,

        side:
            THREE.DoubleSide
    });
}


/* =========================================================
   WALL CREATION
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = .28
) {

    const height =
        3.05;


    wallColliders.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2,

        minY:
            0,

        maxY:
            height
    });


    const group =
        new THREE.Group();


    const front =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            makeWallMaterial(
                width,
                height
            )
        );


    front.position.set(

        0,

        height / 2,

        depth / 2
    );


    front.castShadow =
        true;


    front.receiveShadow =
        true;


    group.add(
        front
    );


    const back =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            makeWallMaterial(
                width,
                height
            )
        );


    back.rotation.y =
        Math.PI;


    back.position.set(

        0,

        height / 2,

        -depth / 2
    );


    back.castShadow =
        true;


    back.receiveShadow =
        true;


    group.add(
        back
    );


    /*
       End caps
    */

    const capMaterial =
        makeWallMaterial(
            depth,
            height
        );


    const left =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            capMaterial
        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(

        -width / 2,

        height / 2,

        0
    );


    left.castShadow =
        true;


    left.receiveShadow =
        true;


    group.add(
        left
    );


    const right =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            makeWallMaterial(
                depth,
                height
            )
        );


    right.rotation.y =
        -Math.PI / 2;


    right.position.set(

        width / 2,

        height / 2,

        0
    );


    right.castShadow =
        true;


    right.receiveShadow =
        true;


    group.add(
        right
    );


    group.position.set(

        x,

        0,

        z
    );


    addWorldObject(
        group
    );
}


/* =========================================================
   WALL SEGMENT HELPER
========================================================= */

function wallSegment(
    x,
    z,
    length,
    horizontal = true
) {

    if (
        horizontal
    ) {

        createWall(
            x,
            z,
            length,
            .28
        );

    } else {

        createWall(
            x,
            z,
            .28,
            length
        );
    }
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    let material;


    if (
        floorTexture
    ) {

        const texture =
            floorTexture.clone();


        texture.wrapS =
            THREE.RepeatWrapping;


        texture.wrapT =
            THREE.RepeatWrapping;


        /*
           Carpet remains relatively large.

           Approximately one carpet tile / texture
           every 2.5 world units.
        */

        texture.repeat.set(
            72,
            58
        );


        texture.needsUpdate =
            true;


        material =
            new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    1,

                metalness:
                    0
            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color:
                    0x806f43,

                roughness:
                    1
            });
    }


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                360,
                290
            ),

            material
        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    floor.receiveShadow =
        true;


    addWorldObject(
        floor
    );
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling() {

    let material;


    if (
        ceilingTexture
    ) {

        const texture =
            ceilingTexture.clone();


        texture.wrapS =
            THREE.RepeatWrapping;


        texture.wrapT =
            THREE.RepeatWrapping;


        /*
           Ceiling texture is intentionally
           1/9 the previous visual size.

           Repeating 3x in each direction means
           each visual tile occupies about 1/9
           of the old tile area.
        */

        texture.repeat.set(
            216,
            174
        );


        texture.needsUpdate =
            true;


        material =
            new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    .96,

                metalness:
                    0,

                side:
                    THREE.DoubleSide
            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color:
                    0x9a967c,

                roughness:
                    1,

                side:
                    THREE.DoubleSide
            });
    }


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                360,
                290
            ),

            material
        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        3.05;


    ceiling.receiveShadow =
        true;


    addWorldObject(
        ceiling
    );
}

/* =========================================================
   OUTER WALLS
========================================================= */

function buildOuterWalls() {

    /*
       The map is enclosed.

       There is no exposed "void" beyond
       the playable area.
    */

    const minX =
        -135;


    const maxX =
        135;


    const minZ =
        -108;


    const maxZ =
        108;


    const segment =
        12;


    for (
        let x = minX;
        x < maxX;
        x += segment
    ) {

        const width =
            Math.min(
                segment,
                maxX - x
            );


        createWall(
            x + width / 2,
            minZ,
            width,
            .35
        );


        createWall(
            x + width / 2,
            maxZ,
            width,
            .35
        );
    }


    for (
        let z = minZ;
        z < maxZ;
        z += segment
    ) {

        const depth =
            Math.min(
                segment,
                maxZ - z
            );


        createWall(
            minX,
            z + depth / 2,
            .35,
            depth
        );


        createWall(
            maxX,
            z + depth / 2,
            .35,
            depth
        );
    }
}

function createPillar(

    const height =

    const material =
        makeWallMaterial(
            .48,
            height

    const pillar =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .48,
                height,
                .48

            material

    pillar.position.set(

        x,

        height / 2,

        z
    );


    pillar.castShadow =
        true;


    pillar.receiveShadow =
        true;


    addWorldObject(
        pillar
    );


    wallColliders.push({

        minX:
            x - .24,

        maxX:
            x + .24,

        minZ:
            z - .24,

        maxZ:
            z + .24,

        minY:
            0,

        maxY:
            height
    });


    pillars.push(
        pillar
    );
}

/* =========================================================
   HOLE ROOM
========================================================= */

function createHoleRoom() {

    const startX =
        -58;


    const startZ =
        54;


    const columns =
        18;


    const rows =
        8;


    const spacing =
        3.5;


    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            /*
               Keep enough carpet between holes
               so the room is actually traversable.
            */

            if (
                (x + z) % 5 === 0
            ) {

                continue;
            }


            const px =
                startX +
                x *
                spacing;


            const pz =
                startZ +
                z *
                spacing;


            const hole =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.65,
                        2.65
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x010101,

                        side:
                            THREE.DoubleSide
                    })
                );


            hole.rotation.x =
                -Math.PI / 2;


            hole.position.set(

                px,

                .008,

                pz
            );


            addWorldObject(
                hole
            );


            deathHoles.push({

                x:
                    px,

                z:
                    pz,

                radius:
                    1.22
            });
        }
    }
}


/* =========================================================
   LIGHTS
========================================================= */

function addLight(
    x,
    z,
    intensity = 4,
    flicker = false
) {

    /*
       The fixture NEVER disappears.

       Only the light intensity changes.
    */

    const fixtureMaterial =
        new THREE.MeshStandardMaterial({

            color:
                0xffffd5,

            emissive:
                0xfff2a5,

            emissiveIntensity:
                2.6,

            roughness:
                .4
        });


    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.25,
                .06,
                1.25
            ),

            fixtureMaterial
        );


    fixture.position.set(

        x,

        3.005,

        z
    );


    addWorldObject(
        fixture
    );


    const light =
        new THREE.PointLight(

            0xffe9a4,

            intensity,

            13,

            1.7
        );


    light.position.set(

        x,

        2.68,

        z
    );


    light.castShadow =
        false;


    scene.add(
        light
    );


    lights.push({

        light:
            light,

        fixture:
            fixture,

        flicker:
            flicker,

        timer:
            Math.random() *
            2,

        base:
            intensity
    });
}


/* =========================================================
   LIGHTING GRID
========================================================= */

function buildLighting() {

    /*
       Less perfectly uniform than before.

       The lights are intentionally inconsistent.
    */

    for (
        let x = -126;
        x <= 126;
        x += 10
    ) {

        for (
            let z = -99;
            z <= 99;
            z += 10
        ) {

            const distanceFromCenter =
                Math.hypot(
                    x,
                    z
                );


            /*
               Some areas have fewer lights.
            */

            let chance =
                .76;


            if (
                distanceFromCenter >
                100
            ) {

                chance =
                    .55;
            }


            if (
                Math.random() >
                chance
            ) {

                continue;
            }


            const offsetX =
                (
                    Math.random() -
                    .5
                ) * 2.5;


            const offsetZ =
                (
                    Math.random() -
                    .5
                ) * 2.5;


            const flicker =
                Math.random() <
                .14;


            const intensity =
                3.4 +
                Math.random() *
                1.7;


            addLight(

                x +
                offsetX,

                z +
                offsetZ,

                intensity,

                flicker
            );
        }
    }


    /*
       Strong landmark lights.
    */

    addLight(
        -42,
        -2,
        5.6,
        false
    );


    addLight(
        -30,
        10,
        5.1,
        true
    );


    addLight(
        30,
        -43,
        5.5,
        false
    );


    addLight(
        64,
        48,
        5.2,
        true
    );
}


/* =========================================================
   FLICKER
========================================================= */

function updateLights(
    dt
) {

    for (
        const item
        of lights
    ) {

        if (
            !item.flicker
        ) {

            continue;
        }


        item.timer -=
            dt;


        if (
            item.timer <= 0
        ) {

            item.timer =
                .06 +
                Math.random() *
                .65;


            /*
               NEVER hide fixture.

               It stays visible even when
               the electrical output drops.
            */

            const randomFactor =
                Math.random();


            if (
                randomFactor <
                .18
            ) {

                item.light.intensity =
                    item.base *
                    .18;

            } else {

                item.light.intensity =
                    item.base *
                    (
                        .70 +
                        Math.random() *
                        .32
                    );
            }
        }
    }
}


/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;


    const top =
        bottom +
        PLAYER_HEIGHT;


    for (
        const wall
        of wallColliders
    ) {

        if (
            top <=
            wall.minY ||

            bottom >=
            wall.maxY
        ) {

            continue;
        }


        const closestX =
            Math.max(

                wall.minX,

                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
) {

    const radius =
        .45;


    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(

                wall.minX,

                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(

                wall.minZ,

                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            radius *
            radius
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   LINE BLOCKING
========================================================= */

function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 -
        x1;


    const dz =
        z2 -
        z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance /
            .35
        );


    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i /
            steps;


        if (
            entityHitsWall(

                x1 +
                dx *
                t,

                z1 +
                dz *
                t
            )
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   HOLES
========================================================= */

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;


        const dz =
            player.position.z -
            hole.z;


        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;
        }
    }


    return false;
}

function createEntity() {

        resolve => {

                "./entity.png",

                    */

                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    texture.magFilter =

                    const aspect =
                        (
                            texture.image.width ||
                            1
                        ) /
                        (
                            texture.image.height ||
                            1
                        );


                    const height =
                        1.55;


                    const width =

                        aspect;

/* =========================================================
   ENTITY SMART STEERING
========================================================= */

function getEntityDirection() {

    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if (
        distance <
        .01
    ) {

        return new THREE.Vector2(
            0,
            0
        );
    }


    const directX =
        dx /
        distance;


    const directZ =
        dz /
        distance;


    /*
       The entity ALWAYS knows the player's
       current location.

       If there is a direct path, use it.

       If a wall blocks the direct path,
       test multiple alternate directions.
    */

    if (
        !blocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z
        )
    ) {

        return new THREE.Vector2(
            directX,
            directZ
        );
    }


    const directAngle =
        Math.atan2(
            directZ,
            directX
        );


    const candidates = [

        0,

        .25,
        -.25,

        .50,
        -.50,

        .80,
        -.80,

        1.15,
        -1.15,

        1.57,
        -1.57,

        2.0,
        -2.0,

        2.5,
        -2.5
    ];


    let best =
        null;


    let bestScore =
        Infinity;


    for (
        const offset
        of candidates
    ) {

        const angle =
            directAngle +
            offset;


        const dirX =
            Math.cos(
                angle
            );


        const dirZ =
            Math.sin(
                angle
            );


        const probeDistance =
            3.8;


        const probeX =
            entity.position.x +
            dirX *
            probeDistance;


        const probeZ =
            entity.position.z +
            dirZ *
            probeDistance;


        if (
            entityHitsWall(
                probeX,
                probeZ
            )
        ) {

            continue;
        }


        /*
           Favor directions that eventually
           point toward the player.

           Also reward long unobstructed probes.
        */

        const targetDistance =
            Math.hypot(

                player.position.x -
                probeX,

                player.position.z -
                probeZ
            );


        const alignment =
            (
                dirX *
                directX
            ) +
            (
                dirZ *
                directZ
            );


        let score =
            targetDistance -
            alignment *
            8;


        /*
           Small wall-clearance bonus.
        */

        const clearanceProbe =
            1.5;


        const leftX =
            probeX -
            dirZ *
            clearanceProbe;


        const leftZ =
            probeZ +
            dirX *
            clearanceProbe;


        const rightX =
            probeX +
            dirZ *
            clearanceProbe;


        const rightZ =
            probeZ -
            dirX *
            clearanceProbe;


        if (
            !entityHitsWall(
                leftX,
                leftZ
            )
        ) {

            score -=
                .8;
        }


        if (
            !entityHitsWall(
                rightX,
                rightZ
            )
        ) {

            score -=
                .8;
        }


        if (
            score <
            bestScore
        ) {

            bestScore =
                score;


            best =
                new THREE.Vector2(
                    dirX,
                    dirZ
                );
        }
    }


    if (
        best
    ) {

        return best;
    }


    /*
       If trapped, rotate until a free
       direction is found.
    */

    for (
        let i = 0;
        i < 16;
        i++
    ) {

        const angle =
            directAngle +
            i *
            Math.PI /
            8;


        const dirX =
            Math.cos(
                angle
            );


        const dirZ =
            Math.sin(
                angle
            );


        const probeX =
            entity.position.x +
            dirX *
            2;


        const probeZ =
            entity.position.z +
            dirZ *
            2;


        if (
            !entityHitsWall(
                probeX,
                probeZ
            )
        ) {

            return new THREE.Vector2(
                dirX,
                dirZ
            );
        }
    }


    return new THREE.Vector2(
        directX,
        directZ
    );
}


/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    const settings =
        SETTINGS[difficulty];


    /*
       Always update the player's position.

       There is no detection cone.

       The entity knows where the player is
       at all times.
    */

    lastKnown.set(

        player.position.x,

        player.position.z
    );


    const direction =
        getEntityDirection();


    const currentAngle =
        Math.atan2(

            entityDirection.y,

            entityDirection.x
        );


    const targetAngle =
        Math.atan2(

            direction.y,

            direction.x
        );


    let difference =
        targetAngle -
        currentAngle;


    while (
        difference >
        Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }


    while (
        difference <
        -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }


    const turnSpeed =
        4.5;


    difference =
        THREE.MathUtils.clamp(

            difference,

            -turnSpeed * dt,

            turnSpeed * dt
        );


    const newAngle =
        currentAngle +
        difference;


    entityDirection.x =
        Math.cos(
            newAngle
        );


    entityDirection.y =
        Math.sin(
            newAngle
        );


    const targetSpeed =
        settings.speed;


    entityVelocity.x =
        THREE.MathUtils.lerp(

            entityVelocity.x,

            entityDirection.x *
            targetSpeed,

            Math.min(
                1,
                dt * 4
            )
        );


    entityVelocity.y =
        THREE.MathUtils.lerp(

            entityVelocity.y,

            entityDirection.y *
            targetSpeed,

            Math.min(
                1,
                dt * 4
            )
        );


    const moveX =
        entityVelocity.x *
        dt;


    const moveZ =
        entityVelocity.y *
        dt;


    let moved =
        false;


    const nextX =
        entity.position.x +
        moveX;


    const nextZ =
        entity.position.z +
        moveZ;


    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

        moved =
            true;
    }


    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

        moved =
            true;
    }


    if (
        moved
    ) {

        entityStuckTimer =
            0;

    } else {

        entityStuckTimer +=
            dt;


        /*
           Emergency juke.

           Rotate aggressively if the entity
           has been pinned against geometry.
        */

        if (
            entityStuckTimer >
            .35
        ) {

            wanderAngle +=
                Math.PI *
                (
                    .5 +
                    Math.random()
                );


            entityDirection.set(

                Math.cos(
                    wanderAngle
                ),

                Math.sin(
                    wanderAngle
                )
            );


            entityVelocity.set(
                0,
                0
            );


            entityStuckTimer =
                0;
        }
    }


    /*
       Billboard toward player.

       This keeps the entity PNG readable.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z
        );


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z
        );


    const killDistance =
        difficulty ===
        "nightmare"
            ? 1.65
            : 1.35;


    if (
        distance <
        killDistance
    ) {

        killPlayer(
            "IT FOUND YOU."
        );
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;
    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z
        );


    const maxDistance =
        42;


    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;
    }


    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.6
        ) *
        .9;


    if (
        blocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z
        )
    ) {

        volume *=
            .25;
    }


    entityAudio.volume =
        THREE.MathUtils.clamp(

            volume,

            0,

            .9
        );


    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}

        */

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                true;
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                true;
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                true;
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                true;
        }


        if (
            event.code ===
            "ShiftLeft" ||

            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                true;
        }


        if (
            event.code ===
            "Space" &&
            !event.repeat
        ) {

            jumpPressed =
                true;
        }


        if (
            event.code ===
            "Escape" &&

            running &&

            !dead &&

            !fallingIntoLevel
        ) {

            togglePause();
        }
    }
);


addEventListener(
    "keyup",
    event => {

        if (
            event.code ===
            "KeyW"
        ) {

            keys.w =
                false;
        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s =
                false;
        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a =
                false;
        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d =
                false;
        }


        if (
            event.code ===
            "ShiftLeft" ||

            event.code ===
            "ShiftRight"
        ) {

            keys.shift =
                false;
        }
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (
            !running ||
            paused ||
            dead ||
            fallingIntoLevel
        ) {

            return;
        }


        if (
            document.pointerLockElement !==
            document.body
        ) {

            return;
        }


        yaw -=
            event.movementX *
            .0022;


        pitch -=
            event.movementY *
            .0018;


        pitch =
            THREE.MathUtils.clamp(

                pitch,

                -1.45,

                1.45
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;
    }
);


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;
    }


    let forward =
        0;


    let side =
        0;


    /*
       W = +forward

       S = -forward
    */

    if (
        keys.w
    ) {

        forward +=
            1;
    }


    if (
        keys.s
    ) {

        forward -=
            1;
    }


    if (
        keys.d
    ) {

        side +=
            1;
    }


    if (
        keys.a
    ) {

        side -=
            1;
    }


    const length =
        Math.hypot(
            forward,
            side
        );


    if (
        length > 0
    ) {

        forward /=
            length;

        side /=
            length;
    }


    let speed;


    if (
        keys.shift
    ) {

        speed =
            5.9;

    } else {

        speed =
            3.5;
    }


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.1
                : 3.8;
    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.3
                : 3.4;
    }


    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.5
                : 3.25;
    }


    const sin =
        Math.sin(
            yaw
        );


    const cos =
        Math.cos(
            yaw
        );


    /*
       Forward is based directly on yaw.

       This is the corrected mapping:

       W -> camera forward
       S -> camera backward
    */

    const dx =
        (
            side *
            cos +

            forward *
            sin
        ) *
        speed *
        dt;


    const dz =
        (
            -side *
            sin +

            forward *
            cos
        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        dx;


    const nextZ =
        player.position.z +
        dz;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;
    }


    jumpPressed =
        false;


    velocityY -=
        20 *
        dt;


    player.position.y +=
        velocityY *
        dt;


    if (
        player.position.y <=
        0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;
    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }


    checkExit();
}


/* =========================================================
   FALL
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;


    const progress =
        Math.min(

            fallTimer /
            FALL_DURATION,

            1
        );


    const eased =
        1 -
        Math.pow(

            1 -
            progress,

            3
        );


    player.position.y =
        17 -
        17 *
        eased;


    camera.position.y =
        EYE_HEIGHT;


    camera.rotation.x =
        THREE.MathUtils.lerp(

            -.32,

            0,

            Math.min(
                progress *
                1.3,

                1
            )
        );


    camera.rotation.z =
        Math.sin(

            progress *
            Math.PI *
            9
        ) *
        .025;


    if (
        progress >=
        1
    ) {

        fallingIntoLevel =
            false;


        player.position.y =
            0;


        camera.position.x =
            0;


        camera.position.y =
            EYE_HEIGHT;


        camera.position.z =
            0;


        camera.rotation.x =
            0;


        camera.rotation.z =
            0;


        requestPointerLock();
    }
}


/* =========================================================
   CAMERA MOTION
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;
    }


    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const amount =
        moving
            ? .011
            : .003;


    /*
       Found-footage handheld camera movement.
    */

    camera.position.x =
        Math.sin(
            cameraTime *
            3.4
        ) *
        amount;


    camera.position.y =
        EYE_HEIGHT +

        Math.sin(
            cameraTime *
            4.1
        ) *
        amount;


    camera.position.z =
        Math.cos(
            cameraTime *
            3.1
        ) *
        amount *
        .55;


    camera.rotation.z =
        Math.sin(
            cameraTime *
            .9
        ) *
        .004;


    /*
       Occasional tiny camera instability.
    */

    if (
        Math.random() <
        .004
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) *
            .04;


        camera.position.y +=
            (
                Math.random() -
                .5
            ) *
            .03;


        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) *
            .018;
    }
}


/* =========================================================
   EXIT
========================================================= */

function checkExit() {

    if (
        !exitObject ||
        dead
    ) {

        return;
    }


    const distance =
        Math.hypot(

            player.position.x -
            exitX,

            player.position.z -
            exitZ
        );


    if (
        distance <
        1.8
    ) {

        winGame();
    }
}

/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason =
        "THE BACKROOMS GOT YOU"
) {

    if (
        dead ||
        !running
    ) {

        return;
    }


    dead =
        true;


    fallingIntoLevel =
        false;


    entityAudio.pause();


    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU DIED";


    document.getElementById(
        "deathTitle"
    ).className =
        "";


    document.getElementById(
        "deathText"
    ).textContent =
        reason;


    document.getElementById(
        "retryBtn"
    ).textContent =
        "RETRY";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   WIN
========================================================= */

function winGame() {

    if (
        dead ||
        !running
    ) {

        return;
    }


    dead =
        true;


    entityAudio.pause();


    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    document.getElementById(
        "deathTitle"
    ).textContent =
        "YOU ESCAPED";


    document.getElementById(
        "deathTitle"
    ).className =
        "win";


    document.getElementById(
        "deathText"
    ).textContent =
        "YOU FOUND THE EXIT";


    document.getElementById(
        "retryBtn"
    ).textContent =
        "PLAY AGAIN";


    document.getElementById(
        "death"
    ).style.display =
        "flex";
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    paused =
        !paused;


    document.getElementById(
        "pause"
    ).style.display =
        paused
            ? "flex"
            : "none";


    if (
        paused
    ) {

        if (
            document.pointerLockElement
        ) {

            document.exitPointerLock();
        }

    } else {

        requestPointerLock();
    }
}


/* =========================================================
   POINTER LOCK
========================================================= */

function requestPointerLock() {

    if (
        document.body.requestPointerLock
    ) {

        document.body
            .requestPointerLock()
            .catch(
                () => {}
            );
    }
}


/* =========================================================
   RETURN MENU
========================================================= */

function returnToMenu() {

    running =
        false;


    paused =
        false;


    dead =
        false;


    fallingIntoLevel =
        false;


    entityAudio.pause();


    entityAudio.volume =
        0;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "block";
}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    if (
        !wallTexture ||
        !floorTexture ||
        !ceilingTexture
    ) {

        await loadTextures();
    }


    clearWorld();


    player.position.set(

        -122,

        17,

        -94
    );


    yaw =
        .25;


    pitch =
        -.28;


    velocityY =
        0;


    grounded =
        false;


    createFloor();


    createCeiling();


    buildOuterWalls();


    buildFloorPlan();


    buildPillars();


    createHoleRoom();


    createExit();


    buildLighting();


    await createEntity();


    entity.position.set(

        70,

        .775,

        -48
    );


    entityDirection.set(

        -1,

        0
    );


    entityVelocity.set(
        0,
        0
    );


    lastKnown.set(
        player.position.x,
        player.position.z
    );


    entityStuckTimer =
        0;


    running =
        true;


    paused =
        false;


    dead =
        false;


    fallingIntoLevel =
        true;


    fallTimer =
        0;


    recordingTime =
        0;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    camera.position.set(

        0,

        EYE_HEIGHT,

        0
    );


    camera.rotation.x =
        pitch;


    camera.rotation.z =
        0;


    player.rotation.y =
        yaw;


    showMessage(
        "ENTERING LEVEL 0..."
    );
}


/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(
    value
) {

    difficulty =
        value;


    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );
            }
        );


    const id =
        value ===
        "nightmare"

            ? "nightmareBtn"

            : value +
              "Btn";


    document.getElementById(
        id
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        value.toUpperCase();
}


document.getElementById(
    "easyBtn"
).onclick =
    () => {

        setDifficulty(
            "easy"
        );
    };


document.getElementById(
    "normalBtn"
).onclick =
    () => {

        setDifficulty(
            "normal"
        );
    };


document.getElementById(
    "hardBtn"
).onclick =
    () => {

        setDifficulty(
            "hard"
        );
    };


document.getElementById(
    "nightmareBtn"
).onclick =
    () => {

        setDifficulty(
            "nightmare"
        );
    };


document.getElementById(
    "startBtn"
).onclick =
    () => {

        startGame();
    };


document.getElementById(
    "resumeBtn"
).onclick =
    () => {

        togglePause();
    };


document.getElementById(
    "restartBtn"
).onclick =
    () => {

        startGame();
    };


document.getElementById(
    "menuBtn"
).onclick =
    () => {

        returnToMenu();
    };


document.getElementById(
    "retryBtn"
).onclick =
    () => {

        startGame();
    };


document.getElementById(
    "deathMenuBtn"
).onclick =
    () => {

        returnToMenu();
    };


/* =========================================================
   POINTER LOCK CLICK
========================================================= */

document.addEventListener(
    "click",
    () => {

        if (
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement !==
            document.body
        ) {

            requestPointerLock();
        }
    }
);


/* =========================================================
   MENU IMAGE CYCLING
========================================================= */

const menuImages =
    Array.from(

        document.querySelectorAll(
            ".menuImage"
        )
    );


let menuIndex =
    Math.floor(
        Math.random() *
        menuImages.length
    );


menuImages.forEach(
    image => {

        image.classList.remove(
            "active"
        );
    }
);


if (
    menuImages[menuIndex]
) {

    menuImages[menuIndex]
        .classList.add(
            "active"
        );
}


function cycleMenuImage() {

    if (
        menuImages.length ===
        0
    ) {

        return;
    }


    menuImages[
        menuIndex
    ].classList.remove(
        "active"
    );


    menuIndex =
        Math.floor(

            Math.random() *
            menuImages.length
        );


    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}


/*
   New random menu image every minute.
*/

setInterval(
    cycleMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            innerWidth,

            innerHeight
        );


        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio ||
                1,

                1.5
            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock =
    new THREE.Clock();


let recordingTime =
    0;


function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;
    }


    recordingTime +=
        dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total /
            3600
        );


    const minutes =
        Math.floor(

            (
                total %
                3600
            ) /
            60
        );


    const seconds =
        total %
        60;


    const format =
        n =>

            String(n)
                .padStart(
                    2,
                    "0"
                );


    document.getElementById(
        "tapeTime"
    ).textContent =

        `${format(hours)}:` +

        `${format(minutes)}:` +

        `${format(seconds)}`;
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(

            clock.getDelta(),

            .05
        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        updateLights(
            dt
        );


        updateCamera(
            dt
        );


        updateEntityAudio();


        updateMessage(
            dt
        );


        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadTextures();

animate();

</script>

</body>

</html>
