<script type="module">

import * as THREE from "./three.module.js";

/* =========================================================
   BASIC SETTINGS
========================================================= */

const TILE = 3;
const WALL_HEIGHT = 9;

const PLAYER_RADIUS = .42;

const EYE_HEIGHT = 5.25;
const CROUCH_HEIGHT = 3.25;

/*
    Faster movement.

    This is deliberately much faster than the previous
    version so sprinting actually feels like running.
*/

const WALK_SPEED = 7.5;
const SPRINT_SPEED = 13.5;
const JUMP_SPRINT_SPEED = 15.5;

const JUMP_SPEED = 8.5;
const GRAVITY = 22;

/*
    Entity does not appear immediately.
*/

const ENTITY_DELAY = 30;

let difficulty = "normal";

let gameStarted = false;
let paused = false;
let dead = false;

let gameTime = 0;
let entitySpawnTimer = 0;

const keys = {};

/* =========================================================
   THREE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x373521);

scene.fog =
    new THREE.FogExp2(
        0x373521,
        .0085
    );

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .05,
        350
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.25
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    .78;

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   HORROR LIGHTING
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xc8bb79,
        0x050504,
        .30
    )
);

scene.add(
    new THREE.AmbientLight(
        0x7b714b,
        .12
    )
);

/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);

let mapWidth = 0;
let mapHeight = 0;
let mapData = [];

const wallColliders = [];
const holeCells = [];
const hideCells = [];
const walkableCells = [];

let playerSpawn = null;
let entitySpawn = null;

/* =========================================================
   TEXTURE LOADER
========================================================= */

const loader =
    new THREE.TextureLoader();

function prepareTexture(texture){

    /*
        THIS IS IMPORTANT.

        The PNG is explicitly treated as an sRGB
        color texture.

        The image is NOT made transparent.
        The image is NOT color-keyed.
        The image is NOT altered.
    */

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(path){

    return new Promise(
        (resolve,reject)=>{

            loader.load(

                path,

                texture=>{

                    console.log(
                        "TEXTURE LOADED:",
                        path,
                        texture.image.width,
                        texture.image.height
                    );

                    resolve(
                        prepareTexture(texture)
                    );

                },

                undefined,

                error=>{

                    console.error(
                        "TEXTURE ERROR:",
                        path,
                        error
                    );

                    reject(
                        new Error(
                            "Could not load " + path
                        )
                    );

                }

            );

        }
    );

}

let floorTexture;
let wallTexture;
let ceilingTexture;

async function loadEnvironmentTextures(){

    /*
        Exact paths supplied by you.
    */

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );

    /*
        Repeat values AFTER loading.
    */

    floorTexture.repeat.set(
        1,
        1
    );

    wallTexture.repeat.set(
        1.15,
        1.15
    );

    ceilingTexture.repeat.set(
        1,
        1
    );

}

/* =========================================================
   MATERIALS
========================================================= */

/*
    MeshStandardMaterial gives the environment real
    lighting while preserving the actual PNG textures.

    The textures themselves are never replaced with colors.
*/

const floorMaterial =
    new THREE.MeshStandardMaterial({
        map:null,
        roughness:1,
        metalness:0,
        side:THREE.FrontSide
    });

const wallMaterial =
    new THREE.MeshStandardMaterial({
        map:null,
        roughness:.92,
        metalness:0,
        side:THREE.FrontSide
    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({
        map:null,
        roughness:.95,
        metalness:0,
        side:THREE.DoubleSide
    });

function assignTextures(){

    floorMaterial.map =
        floorTexture;

    wallMaterial.map =
        wallTexture;

    ceilingMaterial.map =
        ceilingTexture;

    floorMaterial.needsUpdate=true;
    wallMaterial.needsUpdate=true;
    ceilingMaterial.needsUpdate=true;

    console.log(
        "ENVIRONMENT MATERIALS ASSIGNED"
    );

}

/* =========================================================
   MAP
========================================================= */

function cellToWorld(x,y){

    return {
        x:(x+.5)*TILE-mapWidth*TILE*.5,
        z:(y+.5)*TILE-mapHeight*TILE*.5
    };

}

function worldToCell(x,z){

    return {
        x:Math.floor(
            (x+mapWidth*TILE*.5)/TILE
        ),
        y:Math.floor(
            (z+mapHeight*TILE*.5)/TILE
        )
    };

}

function insideMap(x,y){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function isHole(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]==="hole"
    );

}

function isWalkable(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]!=="wall"
    );

}

/* =========================================================
   MAP PIXEL CLASSIFICATION
========================================================= */

function classifyPixel(r,g,b,a){

    if(a<20)
        return "floor";

    /*
        Very dark pixels = walls.
    */

    if(
        r<65 &&
        g<65 &&
        b<65
    )
        return "wall";

    /*
        Red = player spawn.
    */

    if(
        r>150 &&
        r>g*1.35 &&
        r>b*1.35
    )
        return "spawn";

    /*
        Blue = entity spawn.
    */

    if(
        b>125 &&
        b>r*1.25 &&
        b>g*1.1
    )
        return "entity";

    /*
        Purple = hiding spot.
    */

    if(
        r>105 &&
        b>105 &&
        g<120
    )
        return "hide";

    /*
        Yellow/orange = hole.
    */

    if(
        r>135 &&
        g>105 &&
        b<130
    )
        return "hole";

    return "floor";

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image =
        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();

                img.onload=
                    ()=>resolve(img);

                img.onerror=
                    ()=>reject(
                        new Error(
                            "textures/map1.png could not load."
                        )
                    );

                img.src=
                    "./textures/map1.png";

            }
        );

    mapWidth=
        image.naturalWidth;

    mapHeight=
        image.naturalHeight;

    const canvas =
        document.createElement("canvas");

    canvas.width=
        mapWidth;

    canvas.height=
        mapHeight;

    const ctx=
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const data=
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row=[];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i=
                (y*mapWidth+x)*4;

            const type=
                classifyPixel(
                    data[i],
                    data[i+1],
                    data[i+2],
                    data[i+3]
                );

            row.push(type);

            if(type!=="wall")
                walkableCells.push({x,y});

            if(type==="hole")
                holeCells.push({x,y});

            if(type==="hide")
                hideCells.push({x,y});

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn=
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

        mapData.push(row);

    }

    /*
        Fallback player position.
    */

    if(!playerSpawn){

        const c=
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        playerSpawn=
            cellToWorld(
                c.x,
                c.y
            );

    }

    /*
        Fallback entity position.
    */

    if(!entitySpawn){

        let farthest=
            walkableCells[0];

        let best=-1;

        for(
            const c of walkableCells
        ){

            const d=
                Math.hypot(
                    c.x-
                    worldToCell(
                        playerSpawn.x,
                        playerSpawn.z
                    ).x,

                    c.y-
                    worldToCell(
                        playerSpawn.x,
                        playerSpawn.z
                    ).y
                );

            if(d>best){

                best=d;
                farthest=c;

            }

        }

        if(farthest){

            entitySpawn=
                cellToWorld(
                    farthest.x,
                    farthest.y
                );

        }

    }

    console.log(
        "MAP LOADED:",
        mapWidth,
        "x",
        mapHeight
    );

}

/* =========================================================
   COLLISION
========================================================= */

function addCollider(x,z){

    wallColliders.push({
        minX:x-TILE*.5,
        maxX:x+TILE*.5,
        minZ:z-TILE*.5,
        maxZ:z+TILE*.5
    });

}

function collides(x,z,r=.42){

    for(
        const w of wallColliders
    ){

        if(
            x+r>w.minX &&
            x-r<w.maxX &&
            z+r>w.minZ &&
            z-r<w.maxZ
        )
            return true;

    }

    return false;

}

/* =========================================================
   FLOOR
========================================================= */

function createFloor(x,z){

    const mesh=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            floorMaterial
        );

    mesh.rotation.x=
        -Math.PI/2;

    mesh.position.set(
        x,
        0,
        z
    );

    world.add(mesh);

}

/* =========================================================
   CEILING
========================================================= */

function createCeiling(x,z){

    const mesh=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                TILE,
                TILE
            ),
            ceilingMaterial
        );

    mesh.rotation.x=
        Math.PI/2;

    mesh.position.set(
        x,
        WALL_HEIGHT,
        z
    );

    world.add(mesh);

}

/* =========================================================
   WALL
========================================================= */

function createWall(x,z){

    const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                WALL_HEIGHT,
                TILE
            ),
            wallMaterial
        );

    mesh.position.set(
        x,
        WALL_HEIGHT/2,
        z
    );

    world.add(mesh);

    addCollider(
        x,
        z
    );

}

/* =========================================================
   3D HOLES
========================================================= */

function createHole(x,y){

    const p=
        cellToWorld(
            x,
            y
        );

    /*
        NO FLOOR TEXTURE HERE.

        The hole is physically recessed.
    */

    const darkSide=
        new THREE.MeshStandardMaterial({
            color:0x252116,
            roughness:1,
            metalness:0
        });

    const blackBottom=
        new THREE.MeshStandardMaterial({
            color:0x030302,
            roughness:1
        });

    const bottom=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE*.9,
                .15,
                TILE*.9
            ),
            blackBottom
        );

    bottom.position.set(
        p.x,
        -5,
        p.z
    );

    world.add(bottom);

    const depth=5;

    /*
        Recessed walls.
    */

    const north=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE,
                depth,
                .12
            ),
            darkSide
        );

    north.position.set(
        p.x,
        -depth/2,
        p.z-TILE/2+.05
    );

    world.add(north);

    const south=
        north.clone();

    south.position.z=
        p.z+TILE/2-.05;

    world.add(south);

    const west=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .12,
                depth,
                TILE
            ),
            darkSide
        );

    west.position.set(
        p.x-TILE/2+.05,
        -depth/2,
        p.z
    );

    world.add(west);

    const east=
        west.clone();

    east.position.x=
        p.x+TILE/2-.05;

    world.add(east);

}

/* =========================================================
   LOCKERS
========================================================= */

const hidingObjects=[];

function createLocker(x,z){

    const group=
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    /*
        METALLIC GRAY.
    */

    const metal=
        new THREE.MeshStandardMaterial({
            color:0x77766f,
            roughness:.45,
            metalness:.65
        });

    /*
        NOTICEABLY DARK INTERIOR.
    */

    const darkInterior=
        new THREE.MeshStandardMaterial({
            color:0x080807,
            roughness:1,
            metalness:.05
        });

    /*
        BRIGHT EDGES.
    */

    const brightEdge=
        new THREE.MeshStandardMaterial({
            color:0xb9b7a9,
            roughness:.28,
            metalness:.8,
            emissive:0x211f16,
            emissiveIntensity:.5
        });

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.55,
                5.5,
                .72
            ),
            metal
        );

    body.position.y=
        2.75;

    group.add(body);

    /*
        Deep black door/interior.
    */

    const interior=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.27,
                5.1,
                .045
            ),
            darkInterior
        );

    interior.position.set(
        0,
        2.75,
        -.385
    );

    group.add(interior);

    /*
        Bright outer frame.
    */

    for(
        const sx of [-.69,.69]
    ){

        const edge=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .075,
                    5.35,
                    .08
                ),
                brightEdge
            );

        edge.position.set(
            sx,
            2.75,
            -.42
        );

        group.add(edge);

    }

    const top=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.45,
                .075,
                .08
            ),
            brightEdge
        );

    top.position.set(
        0,
        5.42,
        -.42
    );

    group.add(top);

    const bottom=
        top.clone();

    bottom.position.y=
        .08;

    group.add(bottom);

    /*
        Door handle.
    */

    const handle=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .08,
                .4,
                .09
            ),
            brightEdge
        );

    handle.position.set(
        .42,
        2.75,
        -.46
    );

    group.add(handle);

    /*
        Vent slots.
    */

    for(
        let i=-2;
        i<=2;
        i++
    ){

        const vent=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .16,
                    .035,
                    .025
                ),
                brightEdge
            );

        vent.position.set(
            i*.18,
            4.82,
            -.46
        );

        group.add(vent);

    }

    world.add(group);

    hidingObjects.push({
        x,
        z,
        group
    });

}

/* =========================================================
   BUILD WORLD
========================================================= */

function buildWorld(){

    /*
        WORLD IS ONLY BUILT AFTER ALL TEXTURES
        HAVE FINISHED LOADING.
    */

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type=
                mapData[y][x];

            const p=
                cellToWorld(
                    x,
                    y
                );

            if(type==="wall"){

                createWall(
                    p.x,
                    p.z
                );

                continue;

            }

            /*
                Floor exists everywhere except
                actual hole cells.
            */

            if(type!=="hole"){

                createFloor(
                    p.x,
                    p.z
                );

            }

            /*
                Ceiling ALWAYS exists.
            */

            createCeiling(
                p.x,
                p.z
            );

        }

    }

    /*
        Actual recessed holes.
    */

    for(
        const h of holeCells
    ){

        createHole(
            h.x,
            h.y
        );

    }

    /*
        Visible lockers.
    */

    for(
        const h of hideCells
    ){

        const p=
            cellToWorld(
                h.x,
                h.y
            );

        createLocker(
            p.x,
            p.z
        );

    }

}

/* =========================================================
   CEILING LIGHT GRID
========================================================= */

const lights=[];

/*
    Your desired pattern:

    ooooo
    ooooo
    ooloo
    ooooo
    ooooo

    In other words, most ceiling tiles are normal
    and selected tiles receive a fluorescent fixture.
*/

function addCeilingLight(x,z){

    const fixtureMaterial=
        new THREE.MeshStandardMaterial({
            color:0xfff8d5,
            emissive:0xffd86d,
            emissiveIntensity:1.7,
            roughness:.3,
            metalness:.05
        });

    const fixture=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                TILE*.82,
                .07,
                TILE*.82
            ),
            fixtureMaterial
        );

    fixture.position.set(
        x,
        WALL_HEIGHT-.06,
        z
    );

    world.add(fixture);

    /*
        Dramatic warm-white point light.
    */

    const light=
        new THREE.PointLight(
            0xffe3a0,
            0,
            18,
            1.7
        );

    light.position.set(
        x,
        WALL_HEIGHT-.35,
        z
    );

    scene.add(light);

    lights.push({
        light,
        fixture,
        elapsed:0,
        duration:3+Math.random()*5
    });

}

/*
    Lights are spaced across the map rather than
    putting one on every tile, which keeps performance
    reasonable.
*/

function buildLights(){

    for(
        let y=2;
        y<mapHeight-2;
        y+=5
    ){

        for(
            let x=2;
            x<mapWidth-2;
            x+=5
        ){

            if(
                mapData[y] &&
                mapData[y][x]!=="wall"
            ){

                const p=
                    cellToWorld(
                        x,
                        y
                    );

                addCeilingLight(
                    p.x,
                    p.z
                );

            }

        }

    }

}

/* =========================================================
   LIGHT RAMP
========================================================= */

function updateLights(dt){

    for(
        const l of lights
    ){

        l.elapsed+=dt;

        /*
            Every light starts at 1% and gradually
            ramps to 100%.
        */

        const progress=
            Math.min(
                l.elapsed/l.duration,
                1
            );

        const smooth=
            progress*
            progress*
            (3-2*progress);

        const intensity=
            .06+
            smooth*4.4;

        l.light.intensity=
            intensity;

        l.fixture.material
            .emissiveIntensity=
            .15+
            smooth*1.8;

    }

}

/* =========================================================
   HOLE DETECTION
========================================================= */

function completelyOverHole(){

    const r=
        PLAYER_RADIUS;

    const points=[
        [0,0],
        [r,0],
        [-r,0],
        [0,r],
        [0,-r],
        [r*.7,r*.7],
        [-r*.7,r*.7],
        [r*.7,-r*.7],
        [-r*.7,-r*.7]
    ];

    /*
        EVERY point has to be over a hole.
        Therefore merely touching a hole does not
        make the player fall.
    */

    for(
        const [ox,oz] of points
    ){

        const c=
            worldToCell(
                player.position.x+ox,
                player.position.z+oz
            );

        if(!isHole(c.x,c.y))
            return false;

    }

    return true;

}

/* =========================================================
   HIDING
========================================================= */

let hidden=false;

function updateHiding(){

    let nearest=null;
    let distance=Infinity;

    for(
        const h of hidingObjects
    ){

        const d=
            Math.hypot(
                player.position.x-h.x,
                player.position.z-h.z
            );

        if(d<distance){

            distance=d;
            nearest=h;

        }

    }

    const near=
        nearest &&
        distance<1.8;

    const crouching=
        !!keys.c;

    hidden=
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity=
        near&&!hidden
        ? "1"
        : "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity=
        hidden
        ? "1"
        : "0";

}

/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(dx,dz){

    const nx=
        player.position.x+dx;

    const nz=
        player.position.z+dz;

    /*
        Separate axis collision lets the player slide
        smoothly around corners.
    */

    if(
        !collides(
            nx,
            player.position.z
        )
    ){

        player.position.x=
            nx;

    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){

        player.position.z=
            nz;

    }

}

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const p=
            Math.min(
                fallTimer/1.35,
                1
            );

        player.position.y=
            -p*6;

        camera.position.y=
            EYE_HEIGHT-p*1.4;

        camera.rotation.z=
            Math.sin(
                fallTimer*18
            )*.04;

        if(fallTimer>=1.35){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    let forward=0;
    let strafe=0;

    if(keys.w) forward++;
    if(keys.s) forward--;
    if(keys.d) strafe++;
    if(keys.a) strafe--;

    const length=
        Math.hypot(
            forward,
            strafe
        );

    if(length>0){

        forward/=length;
        strafe/=length;

        const sprint=
            keys.shift &&
            !keys.c;

        let speed=
            sprint
            ? SPRINT_SPEED
            : WALK_SPEED;

        /*
            Faster sprint jump.
        */

        if(
            sprint &&
            !grounded
        ){

            speed=
                JUMP_SPRINT_SPEED;

        }

        if(keys.c)
            speed*=.6;

        const sin=
            Math.sin(yaw);

        const cos=
            Math.cos(yaw);

        const dx=
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz=
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    velocityY-=
        GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    if(
        keys.spacePressed &&
        grounded &&
        !keys.c
    ){

        velocityY=
            JUMP_SPEED;

        grounded=false;

        keys.spacePressed=false;

    }

    if(!keys.space)
        keys.spacePressed=false;

    const targetHeight=
        keys.c
        ? CROUCH_HEIGHT
        : EYE_HEIGHT;

    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();

    if(
        grounded &&
        completelyOverHole()
    ){

        falling=true;
        fallTimer=0;

        showMessage(
            "THE FLOOR GIVES WAY..."
        );

    }

}

let entity=null;

async function loadEntity(){

    try{

        entityTexture=
            await loadTexture(
                "./entity.png"

function spawnEntity(){

    if(entity)
        return;

    const material=
        new THREE.MeshBasicMaterial({

            map:entityTexture||null,

            color:entityTexture
                ? 0xffffff
                : 0x050505,

            transparent:true,

            alphaTest:.015,

            side:THREE.DoubleSide,

            depthWrite:true

        });

    /*
        FULL PNG.
        Large square, with the original image
        occupying the entire plane.
    */

    entity=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                6,
                6
            ),
            material
        );

    entity.position.set(
        entitySpawn.x,
        3,
        entitySpawn.z
    );

    world.add(entity);

    showMessage(
        "SOMETHING IS HERE."
    );

}

/* =========================================================
   ENTITY PATHFINDING
========================================================= */

let entityPath=[];
let entityPathIndex=0;
let repathTimer=0;

function findPath(start,goal){

    if(
        !isWalkable(start.x,start.y) ||
        !insideMap(goal.x,goal.y)
    )
        return [];

    if(!isWalkable(goal.x,goal.y)){

        return [];

    }

    const queue=[start];

    const visited=
        new Set();

    const parent=
        new Map();

    const key=
        p=>p.x+","+p.y;

    visited.add(
        key(start)
    );

    const dirs=[
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
    ];

    let iterations=0;

    while(
        queue.length &&
        iterations++<7000
    ){

        const current=
            queue.shift();

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            const path=[];

            let p=current;

            while(p){

                path.push(p);

                p=
                    parent.get(
                        key(p)
                    );

            }

            path.reverse();

            return path;

        }

        for(
            const d of dirs
        ){

            const next={
                x:current.x+d.x,
                y:current.y+d.y
            };

            const k=
                key(next);

            if(visited.has(k))
                continue;

            if(!isWalkable(next.x,next.y))
                continue;

            visited.add(k);

            parent.set(
                k,
                current
            );

            queue.push(next);

        }

    }

    return [];

}

function updateEntityPath(){

    if(!entity)
        return;

    const start=
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const goal=
        worldToCell(
            player.position.x,
            player.position.z
        );

    entityPath=
        findPath(
            start,
            goal
        );

    entityPathIndex=1;

}

/* =========================================================
   ENTITY SPEED
========================================================= */

function getEntitySpeed(){

    if(difficulty==="easy")
        return 5.5;

    if(difficulty==="hard")
        return 10.5;

    /*
        Nightmare catches a sprint jumper.
    */

    if(difficulty==="nightmare")
        return JUMP_SPRINT_SPEED;

    return 8;

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(dt){

    if(
        !entity ||
        !gameStarted ||
        paused ||
        dead
    )
        return;

    repathTimer-=dt;

    if(repathTimer<=0){

        repathTimer=
            difficulty==="nightmare"
            ? .12
            : .25;

        updateEntityPath();

    }

    if(entityPath.length<=1)
        return;

    const targetCell=
        entityPath[
            Math.min(
                entityPathIndex,
                entityPath.length-1
            )
        ];

    const target=
        cellToWorld(
            targetCell.x,
            targetCell.y
        );

    let dx=
        target.x-
        entity.position.x;

    let dz=
        target.z-
        entity.position.z;

    const distance=
        Math.hypot(
            dx,
            dz
        );

    if(distance<.18){

        entityPathIndex++;
        return;

    }

    dx/=distance;
    dz/=distance;

    const speed=
        getEntitySpeed();

    const nx=
        entity.position.x+
        dx*speed*dt;

    const nz=
        entity.position.z+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz,
            .38
        )
    ){

        entity.position.x=nx;
        entity.position.z=nz;

    }

    /*
        Entity always faces the camera,
        preserving the square PNG.
    */

    entity.lookAt(
        camera.position.x,
        entity.position.y,
        camera.position.z
    );

    const distanceToPlayer=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    if(
        distanceToPlayer<1.35 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

/* =========================================================
   ENTITY AUDIO
========================================================= */

const entityAudio=
    new Audio(
        "./sounds/entity.mp3"
    );

entityAudio.loop=true;
entityAudio.preload="auto";
entityAudio.volume=0;

let audioUnlocked=false;

function unlockAudio(){

    if(audioUnlocked)
        return;

    audioUnlocked=true;

    entityAudio
        .play()
        .then(()=>{
            entityAudio.pause();
            entityAudio.currentTime=0;
        })
        .catch(()=>{});

}

function updateAudio(){

    if(
        !entity ||
        !gameStarted ||
        dead
    ){

        entityAudio.volume=0;
        return;

    }

    if(entityAudio.paused){

        entityAudio
            .play()
            .catch(()=>{});

    }

    const d=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    const hearDistance=55;

    let volume=
        1-d/hearDistance;

    volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    /*
        Quiet far away,
        increasingly loud nearby.
    */

    volume=
        Math.pow(
            volume,
            .72
        );

    entityAudio.volume=
        THREE.MathUtils.lerp(
            entityAudio.volume,
            volume,
            .1
        );

}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.5;

}

function updateMessage(dt){

    if(messageTimer>0){

        messageTimer-=dt;

        if(messageTimer<=0){

            document.getElementById(
                "message"
            ).textContent="";

        }

    }

}

/* =========================================================
   DEATH
========================================================= */

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "death"
    ).style.display="flex";

    entityAudio.pause();

    if(document.pointerLockElement)
        document.exitPointerLock();

}

/* =========================================================
   START
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    gameTime=0;

    /*
        IMPORTANT:
        Entity does NOT spawn until 30 seconds.
    */

    entitySpawnTimer=0;

    if(entity){

        world.remove(entity);

        entity.geometry.dispose();

        entity.material.dispose();

        entity=null;

    }

    resetPlayer();

    unlockAudio();

    renderer.domElement
        .requestPointerLock()
        .catch(()=>{});

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ? "flex"
        : "none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(()=>{});

    }

}

/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    gameStarted=false;
    paused=false;
    dead=false;

    entityAudio.pause();

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

}

/* =========================================================
   INPUT
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        const key=
            e.key.toLowerCase();

        keys[key]=true;

        if(e.code==="Space"){

            e.preventDefault();

            keys.spacePressed=true;

        }

        if(key==="escape"){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                document.getElementById(
                    "controlsBox"
                ).style.display="none";

                return;

            }

            togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

        if(e.code==="Space")
            keys.space=false;

    }
);

/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            e.movementX*.002;

        pitch-=
            e.movementY*.0017;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=
            yaw;

        camera.rotation.x=
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(()=>{});

            unlockAudio();

        }

    }
);

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="none";

}

document.getElementById(
    "controlsBtn"
).onclick=
    showControls;

document.getElementById(
    "pauseControlsBtn"
).onclick=
    showControls;

document.getElementById(
    "controlsBackBtn"
).onclick=

/* =========================================================
   DIFFICULTY
========================================================= */

const difficultyButtons={
    easy:document.getElementById("easyBtn"),
    normal:document.getElementById("normalBtn"),
    hard:document.getElementById("hardBtn"),
    nightmare:document.getElementById("nightmareBtn")
};

function setDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

difficultyButtons.easy.onclick=
    ()=>setDifficulty("easy");

difficultyButtons.normal.onclick=
    ()=>setDifficulty("normal");

difficultyButtons.hard.onclick=
    ()=>setDifficulty("hard");

difficultyButtons.nightmare.onclick=
    ()=>setDifficulty("nightmare");

/* =========================================================
   MENU SLIDESHOW
========================================================= */

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/* =========================================================
   TAPE TIMER + ENTITY DELAY
========================================================= */

function updateGameTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    /*
        Entity delay.
    */

    if(
        !entity &&
        gameTime>=ENTITY_DELAY
    ){

        spawnEntity();

    }

    const total=
        Math.floor(gameTime);

    const h=
        Math.floor(total/3600);

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const pad=
        n=>
            String(n)
            .padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+
        pad(m)+":"+
        pad(s);

}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    /*
        Prevent giant physics jumps if the browser
        temporarily freezes.
    */

    dt=
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateAudio();
    updateLights(dt);
    updateGameTime(dt);
    updateMessage(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);
