<style>
*{box-sizing:border-box}

html,body{
    width:100%;

/* =========================================================
   MENU
========================================================= */

#menu{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#050505;
    overflow:hidden;
}

.menuImage{
    position:absolute;

}

.menuImage.active{

}

.menuDark{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.82),

.menuSubtitle{

}

.menuButton{

========================================================= */

/* =========================================================

========================================================= */

#controlsBox{

}

.controlsPanel button{

/* =========================================================

========================================================= */

#crosshair{

}

}

    font:12px monospace;

.crt{
    position:fixed;
    inset:0;
    z-index:80;
    pointer-events:none;
    animation:textShadow 1.6s infinite;
}

.crt::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(18,16,16,.06);
    opacity:0;
    z-index:2;
    pointer-events:none;
    animation:flicker .15s infinite;
}

.crt::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            rgba(18,16,16,0) 50%,
            rgba(0,0,0,.25) 50%

            90deg,
            rgba(255,0,0,.06),
            rgba(0,255,0,.02),

<script>
"use strict";

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;
let paused = false;
let dead = false;

let difficulty = "normal";

const keys = {};

let lastTime = performance.now();
let gameTime = 0;

/* =========================================================
   THREE
========================================================= */

if(typeof THREE === "undefined"){

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "THREE.JS COULD NOT BE LOADED.\n\n" +
        "Make sure three.min.js is in the repository root.";

    throw new Error("Three.js missing");
}

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x77704b);

scene.fog =
    new THREE.FogExp2(
        0x77704b,
        0.0048
    );

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .03,
        500
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.15
    )
);

if("outputColorSpace" in renderer)
    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.NoToneMapping;

renderer.domElement.style.position = "fixed";
renderer.domElement.style.inset = "0";
renderer.domElement.style.zIndex = "1";

document.body.appendChild(
    renderer.domElement
);

/* =========================================================
   LIGHTING
========================================================= */

/*
    Deliberately use very few dynamic lights.

    The previous version created a PointLight at nearly
    every section of the map. That gets expensive quickly.

    This gives the scene the warm, ugly fluorescent base
    while keeping the GPU load much lower.
*/

scene.add(
    new THREE.AmbientLight(
        0xffe9a8,
        .34
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xffe7a1,
        0x17140c,
        .28
    )
);

const world =
    new THREE.Group();

scene.add(world);

/* =========================================================
   CONSTANTS
========================================================= */

const TILE = 3;

const WALL_HEIGHT = 9;

const EYE_HEIGHT = 5.25;
const CROUCH_EYE_HEIGHT = 3.15;

const PLAYER_RADIUS = .48;

const WALK_SPEED = 3.25;
const SPRINT_SPEED = 5.6;

const GRAVITY = 22;
const JUMP_SPEED = 7;

/*
    Entity teleport distance in MAP PIXELS.
*/
const ENTITY_TELEPORT_DISTANCE = 20;

/* =========================================================
   MAP
========================================================= */

let mapWidth = 0;
let mapHeight = 0;

let mapData = [];

let playerSpawn = null;
let entitySpawn = null;

const wallColliders = [];
const hidingSpots = [];
const holeCells = [];

let playerComponent = null;

/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

let wallTexture = null;
let floorTexture = null;
let ceilingTexture = null;
let entityTexture = null;

function prepareTexture(
    texture,
    repeatX,
    repeatY
){

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.magFilter =
        THREE.LinearFilter;

    /*
        Anisotropy is intentionally low.

        High anisotropy across a huge map can become
        surprisingly expensive on weaker hardware.
    */

    texture.anisotropy = 2;

    texture.needsUpdate = true;

    return texture;
}

function loadTexture(
    path,
    repeatX,
    repeatY
){

    return new Promise(
        resolve => {

            textureLoader.load(
                path,

                texture => {

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        prepareTexture(
                            texture,
                            repeatX,
                            repeatY
                        )
                    );

                },

                undefined,

                error => {

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    resolve(null);

                }
            );

        }
    );

}

async function loadAllTextures(){

    wallTexture =
        await loadTexture(
            "./textures/wall.png",
            1.15,
            1.15
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png",
            1,
            1
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png",
            1,
            1
        );

    /*
        Optional entity texture.
        If entity.png does not exist, the entity still works.
    */

    entityTexture =
        await loadTexture(
            "./entity.png",
            1,
            1
        );

}

/* =========================================================
   MATERIALS
========================================================= */

const wallMaterial =
    new THREE.MeshBasicMaterial({
        map:null,
        side:THREE.DoubleSide
    });

const floorMaterial =
    new THREE.MeshBasicMaterial({
        map:null,
        side:THREE.DoubleSide
    });

const ceilingMaterial =
    new THREE.MeshBasicMaterial({
        map:null,
        side:THREE.DoubleSide
    });

function configureMaterials(){

    wallMaterial.map =
        wallTexture;

    floorMaterial.map =
        floorTexture;

    ceilingMaterial.map =
        ceilingTexture;

    wallMaterial.needsUpdate = true;
    floorMaterial.needsUpdate = true;
    ceilingMaterial.needsUpdate = true;

}

/* =========================================================
   MAP PIXEL CLASSIFICATION
========================================================= */

function classifyPixel(
    r,
    g,
    b
){

    /*
        BLACK = wall
    */

    if(
        Math.max(r,g,b) < 90
    )
        return "wall";

    /*
        RED = player spawn
    */

    if(
        r > 150 &&
        r > g * 1.45 &&
        r > b * 1.45
    )
        return "spawn";

    /*
        BLUE = entity spawn
    */

    if(
        b > 130 &&
        b > r * 1.35 &&
        b > g * 1.2
    )
        return "entity";

    /*
        PURPLE = hiding spot
    */

    if(
        r > 120 &&
        b > 100 &&
        g < 110
    )
        return "hide";

    /*
        YELLOW = hole
    */

    if(
        r > 150 &&
        g > 130 &&
        b < 125
    )
        return "hole";

    return "floor";
}

/* =========================================================
   COORDINATES
========================================================= */

function cellToWorld(
    x,
    y
){

    return {

        x:
            (x + .5) * TILE -
            mapWidth * TILE / 2,

        z:
            (y + .5) * TILE -
            mapHeight * TILE / 2

    };

}

function worldToCell(
    x,
    z
){

    return {

        x:
            Math.floor(
                (
                    x +
                    mapWidth*TILE/2
                ) / TILE
            ),

        y:
            Math.floor(
                (
                    z +
                    mapHeight*TILE/2
                ) / TILE
            )

    };

}

function validCell(
    x,
    y
){

    return (
        x >= 0 &&
        y >= 0 &&
        x < mapWidth &&
        y < mapHeight
    );

}

function isWalkable(
    x,
    y
){

    if(!validCell(x,y))
        return false;

    return mapData[y][x] !== "wall";

}

/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    const image =
        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();

                img.onload =
                    ()=>resolve(img);

                img.onerror =
                    ()=>reject(
                        new Error(
                            "textures/map1.png could not be loaded."
                        )
                    );

                img.src =
                    "./textures/map1.png?v=" +
                    Date.now();

            }
        );

    mapWidth =
        image.naturalWidth;

    mapHeight =
        image.naturalHeight;

    if(
        !mapWidth ||
        !mapHeight
    ){

        throw new Error(
            "map1.png has no readable dimensions."
        );

    }

    const canvas =
        document.createElement("canvas");

    canvas.width =
        mapWidth;

    canvas.height =
        mapHeight;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(
        image,
        0,
        0
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData = [];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        const row = [];

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const i =
                (y*mapWidth+x)*4;

            const type =
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2]
                );

            row.push(type);

            if(
                type === "spawn" &&
                !playerSpawn
            ){

                playerSpawn =
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(
                type === "entity" &&
                !entitySpawn
            ){

                entitySpawn =
                    cellToWorld(
                        x,
                        y
                    );

            }

            if(type === "hole"){

                holeCells.push({
                    x,
                    y
                });

            }

            if(type === "hide"){

                const p =
                    cellToWorld(
                        x,
                        y
                    );

                hidingSpots.push({
                    x:p.x,
                    z:p.z,
                    cellX:x,
                    cellY:y
                });

            }

        }

        mapData.push(row);

    }

    /*
        Fallback spawn.
    */

    if(!playerSpawn){

        outer:
        for(
            let y=0;
            y<mapHeight;
            y++
        ){

            for(
                let x=0;
                x<mapWidth;
                x++
            ){

                if(
                    isWalkable(x,y)
                ){

                    playerSpawn =
                        cellToWorld(
                            x,
                            y
                        );

                    break outer;

                }

            }

        }

    }

    if(!entitySpawn){

        entitySpawn =
            findEntitySpawnFallback();

    }

    if(!playerSpawn){

        throw new Error(
            "No walkable player spawn could be found."
        );

    }

    console.log(
        "MAP:",
        mapWidth,
        "x",
        mapHeight
    );

    console.log(
        "HOLE PIXELS:",
        holeCells.length
    );

    console.log(
        "HIDING SPOTS:",
        hidingSpots.length
    );

}

/* =========================================================
   ENTITY SPAWN FALLBACK
========================================================= */

function findEntitySpawnFallback(){

    const player =
        worldToCell(
            playerSpawn.x,
            playerSpawn.z
        );

    let best = null;
    let bestDistance = 0;

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            if(!isWalkable(x,y))
                continue;

            const d =
                Math.hypot(
                    x-player.x,
                    y-player.y
                );

            if(d > bestDistance){

                bestDistance = d;

                best =
                    cellToWorld(
                        x,
                        y
                    );

            }

        }

    }

    return best || playerSpawn;

}

/* =========================================================
   BUILD CONNECTED COMPONENTS
========================================================= */

/*
    This is used by the entity.

    Instead of blindly trying to walk through walls,
    the entity knows which floor region the player
    actually occupies.
*/

const componentMap = [];

function buildWalkableComponent(){

    componentMap.length = 0;

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        componentMap[y] =
            new Int32Array(
                mapWidth
            );

        componentMap[y].fill(-1);

    }

    let componentId = 0;

    const queueX =
        new Int32Array(
            mapWidth*mapHeight
        );

    const queueY =
        new Int32Array(
            mapWidth*mapHeight
        );

    const directions = [
        [1,0],
        [-1,0],
        [0,1],
        [0,-1]
    ];

    for(
        let sy=0;
        sy<mapHeight;
        sy++
    ){

        for(
            let sx=0;
            sx<mapWidth;
            sx++
        ){

            if(
                !isWalkable(sx,sy) ||
                componentMap[sy][sx] !== -1
            )
                continue;

            let head = 0;
            let tail = 0;

            queueX[tail] = sx;
            queueY[tail] = sy;
            tail++;

            componentMap[sy][sx] =
                componentId;

            while(head < tail){

                const x =
                    queueX[head];

                const y =
                    queueY[head];

                head++;

                for(
                    const [dx,dy]
                    of directions
                ){

                    const nx =
                        x+dx;

                    const ny =
                        y+dy;

                    if(
                        validCell(nx,ny) &&
                        isWalkable(nx,ny) &&
                        componentMap[ny][nx] === -1
                    ){

                        componentMap[ny][nx] =
                            componentId;

                        queueX[tail] = nx;
                        queueY[tail] = ny;

                        tail++;

                    }

                }

            }

            componentId++;

        }

    }

    const playerCell =
        worldToCell(
            playerSpawn.x,
            playerSpawn.z
        );

    if(
        validCell(
            playerCell.x,
            playerCell.y
        )
    ){

        playerComponent =
            componentMap[
                playerCell.y
            ][
                playerCell.x
            ];

    }

    console.log(
        "WALKABLE COMPONENTS:",
        componentId
    );

}

/* =========================================================
   BATCHED WORLD GEOMETRY
========================================================= */

/*
    This is the biggest performance improvement.

    The old approach created a THREE.Mesh for every
    floor tile, every ceiling tile, and every wall.

    This version creates:

      1 floor mesh
      1 ceiling mesh
      1 wall mesh
      1 hole mesh

    instead.

    That dramatically reduces draw calls.
*/

function createBatchedGeometry(){

    const floorPositions = [];
    const floorUVs = [];
    const floorIndices = [];

    const ceilingPositions = [];
    const ceilingUVs = [];
    const ceilingIndices = [];

    const wallPositions = [];
    const wallUVs = [];
    const wallIndices = [];

    let floorVertex = 0;
    let ceilingVertex = 0;
    let wallVertex = 0;

    function addQuad(
        positions,
        uvs,
        indices,
        vertexCounter,
        a,b,c,d,
        uvA,uvB,uvC,uvD
    ){

        positions.push(
            ...a,
            ...b,
            ...c,
            ...d
        );

        uvs.push(
            ...uvA,
            ...uvB,
            ...uvC,
            ...uvD
        );

        indices.push(
            vertexCounter,
            vertexCounter+1,
            vertexCounter+2,

            vertexCounter,
            vertexCounter+2,
            vertexCounter+3
        );

        return vertexCounter+4;

    }

    /*
        FLOOR + CEILING
    */

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            const type =
                mapData[y][x];

            if(type === "wall")
                continue;

            const p =
                cellToWorld(
                    x,
                    y
                );

            const h =
                TILE/2;

            floorVertex =
                addQuad(

                    floorPositions,
                    floorUVs,
                    floorIndices,
                    floorVertex,

                    [
                        p.x-h,0,p.z-h
                    ],
                    [
                        p.x+h,0,p.z-h
                    ],
                    [
                        p.x+h,0,p.z+h
                    ],
                    [
                        p.x-h,0,p.z+h
                    ],

                    [0,0],
                    [1,0],
                    [1,1],
                    [0,1]

                );

            ceilingVertex =
                addQuad(

                    ceilingPositions,
                    ceilingUVs,
                    ceilingIndices,
                    ceilingVertex,

                    [
                        p.x-h,WALL_HEIGHT,p.z+h
                    ],
                    [
                        p.x+h,WALL_HEIGHT,p.z+h
                    ],
                    [
                        p.x+h,WALL_HEIGHT,p.z-h
                    ],
                    [
                        p.x-h,WALL_HEIGHT,p.z-h
                    ],

                    [0,0],
                    [1,0],
                    [1,1],
                    [0,1]

                );

        }

    }

    /*
        WALLS

        Only exposed wall sides are generated.

        This prevents us from rendering hidden faces
        between adjacent wall pixels.
    */

    const dirs = [

        {
            dx:1,
            dz:0,

            a:[1,0],
            b:[1,1]
        },

        {
            dx:-1,
            dz:0,

            a:[0,1],
            b:[0,0]
        },

        {
            dx:0,
            dz:1,

            a:[1,1],
            b:[0,1]
        },

        {
            dx:0,
            dz:-1,

            a:[0,0],
            b:[1,0]
        }

    ];

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            if(
                mapData[y][x] !== "wall"
            )
                continue;

            const p =
                cellToWorld(
                    x,
                    y
                );

            const half =
                TILE/2;

            wallColliders.push({

                minX:
                    p.x-half,

                maxX:
                    p.x+half,

                minZ:
                    p.z-half,

                maxZ:
                    p.z+half,

                cellX:x,
                cellY:y

            });

            for(
                const dir of dirs
            ){

                const nx =
                    x+dir.dx;

                const ny =
                    y+dir.dz;

                /*
                    Only expose a face when the
                    neighboring cell is not a wall.
                */

                if(
                    validCell(nx,ny) &&
                    mapData[ny][nx] === "wall"
                )
                    continue;

                let a,b,c,d;

                if(dir.dx !== 0){

                    const xx =
                        p.x +
                        dir.dx*half;

                    a = [
                        xx,
                        0,
                        p.z-half
                    ];

                    b = [
                        xx,
                        WALL_HEIGHT,
                        p.z-half
                    ];

                    c = [
                        xx,
                        WALL_HEIGHT,
                        p.z+half
                    ];

                    d = [
                        xx,
                        0,
                        p.z+half
                    ];

                }else{

                    const zz =
                        p.z +
                        dir.dz*half;

                    a = [
                        p.x-half,
                        0,
                        zz
                    ];

                    b = [
                        p.x-half,
                        WALL_HEIGHT,
                        zz
                    ];

                    c = [
                        p.x+half,
                        WALL_HEIGHT,
                        zz
                    ];

                    d = [
                        p.x+half,
                        0,
                        zz
                    ];

                }

                wallVertex =
                    addQuad(

                        wallPositions,
                        wallUVs,
                        wallIndices,
                        wallVertex,

                        a,b,c,d,

                        [0,0],
                        [0,1],
                        [1,1],
                        [1,0]

                    );

            }

        }

    }

    function makeGeometry(
        positions,
        uvs,
        indices
    ){

        const geometry =
            new THREE.BufferGeometry();

        geometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(
                positions,
                3
            )
        );

        geometry.setAttribute(
            "uv",
            new THREE.Float32BufferAttribute(
                uvs,
                2
            )
        );

        geometry.setIndex(indices);

        geometry.computeBoundingSphere();

        return geometry;

    }

    const floorGeometry =
        makeGeometry(
            floorPositions,
            floorUVs,
            floorIndices
        );

    const ceilingGeometry =
        makeGeometry(
            ceilingPositions,
            ceilingUVs,
            ceilingIndices
        );

    const wallGeometry =
        makeGeometry(
            wallPositions,
            wallUVs,
            wallIndices
        );

    const floorMesh =
        new THREE.Mesh(
            floorGeometry,
            floorMaterial
        );

    const ceilingMesh =
        new THREE.Mesh(
            ceilingGeometry,
            ceilingMaterial
        );

    const wallMesh =
        new THREE.Mesh(
            wallGeometry,
            wallMaterial
        );

    floorMesh.frustumCulled = true;
    ceilingMesh.frustumCulled = true;
    wallMesh.frustumCulled = true;

    world.add(floorMesh);
    world.add(ceilingMesh);
    world.add(wallMesh);

}

/* =========================================================
   3D CONNECTED HOLES
========================================================= */

/*
    Holes are NOT individual flat yellow squares.

    Every connected group of hole pixels becomes one
    continuous recessed structure.

    The upper rim follows the exact pixel shape.
    The bottom is several units below the floor.

    Because the geometry is generated as one group,
    a connected cluster looks like one actual opening.
*/

const holeRegions = [];

function findHoleRegions(){

    holeRegions.length = 0;

    const visited =
        new Uint8Array(
            mapWidth*mapHeight
        );

    function id(x,y){
        return y*mapWidth+x;
    }

    for(
        const start of holeCells
    ){

        const startId =
            id(
                start.x,
                start.y
            );

        if(visited[startId])
            continue;

        const cells = [];

        const queue = [start];

        visited[startId] = 1;

        while(queue.length){

            const cell =
                queue.shift();

            cells.push(cell);

            const neighbors = [

                [cell.x+1,cell.y],
                [cell.x-1,cell.y],
                [cell.x,cell.y+1],
                [cell.x,cell.y-1]

            ];

            for(
                const [nx,ny]
                of neighbors
            ){

                if(
                    !validCell(nx,ny) ||
                    mapData[ny][nx] !== "hole"
                )
                    continue;

                const nId =
                    id(nx,ny);

                if(visited[nId])
                    continue;

                visited[nId] = 1;

                queue.push({
                    x:nx,
                    y:ny
                });

            }

        }

        holeRegions.push(cells);

    }

}

/* =========================================================
   BUILD 3D HOLE GEOMETRY
========================================================= */

function buildHoleGeometry(){

    findHoleRegions();

    const positions = [];
    const uvs = [];
    const indices = [];

    let vertex = 0;

    const TOP = -.04;
    const BOTTOM = -3.3;

    function quad(
        a,b,c,d
    ){

        positions.push(
            ...a,
            ...b,
            ...c,
            ...d
        );

        uvs.push(
            0,0,
            1,0,
            1,1,
            0,1
        );

        indices.push(
            vertex,
            vertex+1,
            vertex+2,

            vertex,
            vertex+2,
            vertex+3
        );

        vertex += 4;

    }

    for(
        const region of holeRegions
    ){

        const holeSet =
            new Set(
                region.map(
                    p =>
                        p.x+","+p.y
                )
            );

        /*
            Bottom surface.

            Each hole cell contributes to the same
            connected recessed floor.
        */

        for(
            const cell of region
        ){

            const p =
                cellToWorld(
                    cell.x,
                    cell.y
                );

            const h =
                TILE/2;

            quad(

                [
                    p.x-h,
                    BOTTOM,
                    p.z-h
                ],

                [
                    p.x+h,
                    BOTTOM,
                    p.z-h
                ],

                [
                    p.x+h,
                    BOTTOM,
                    p.z+h
                ],

                [
                    p.x-h,
                    BOTTOM,
                    p.z+h
                ]

            );

        }

        /*
            Walls around the outside edge of the hole.

            Interior edges between connected pixels are
            deliberately skipped.
        */

        for(
            const cell of region
        ){

            const p =
                cellToWorld(
                    cell.x,
                    cell.y
                );

            const h =
                TILE/2;

            const edges = [

                {
                    nx:cell.x+1,
                    ny:cell.y,
                    a:[
                        p.x+h,
                        TOP,
                        p.z-h
                    ],
                    b:[
                        p.x+h,
                        TOP,
                        p.z+h
                    ],
                    c:[
                        p.x+h,
                        BOTTOM,
                        p.z+h
                    ],
                    d:[
                        p.x+h,
                        BOTTOM,
                        p.z-h
                    ]
                },

                {
                    nx:cell.x-1,
                    ny:cell.y,
                    a:[
                        p.x-h,
                        TOP,
                        p.z+h
                    ],
                    b:[
                        p.x-h,
                        TOP,
                        p.z-h
                    ],
                    c:[
                        p.x-h,
                        BOTTOM,
                        p.z-h
                    ],
                    d:[
                        p.x-h,
                        BOTTOM,
                        p.z+h
                    ]
                },

                {
                    nx:cell.x,
                    ny:cell.y+1,
                    a:[
                        p.x+h,
                        TOP,
                        p.z+h
                    ],
                    b:[
                        p.x-h,
                        TOP,
                        p.z+h
                    ],
                    c:[
                        p.x-h,
                        BOTTOM,
                        p.z+h
                    ],
                    d:[
                        p.x+h,
                        BOTTOM,
                        p.z+h
                    ]
                },

                {
                    nx:cell.x,
                    ny:cell.y-1,
                    a:[
                        p.x-h,
                        TOP,
                        p.z-h
                    ],
                    b:[
                        p.x+h,
                        TOP,
                        p.z-h
                    ],
                    c:[
                        p.x+h,
                        BOTTOM,
                        p.z-h
                    ],
                    d:[
                        p.x-h,
                        BOTTOM,
                        p.z-h
                    ]
                }

            ];

            for(
                const edge of edges
            ){

                if(
                    holeSet.has(
                        edge.nx+","+edge.ny
                    )
                )
                    continue;

                quad(
                    edge.a,
                    edge.b,
                    edge.c,
                    edge.d
                );

            }

        }

    }

    if(!positions.length)
        return;

    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );

    geometry.setIndex(indices);

    geometry.computeBoundingSphere();

    /*
        Very dark, slightly yellow/brown hole material.
        It isn't a flat marker anymore.
    */

    const material =
        new THREE.MeshBasicMaterial({

            color:0x15120a,

            side:THREE.DoubleSide

        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    world.add(mesh);

}

/* =========================================================
   HIDING SPOTS
========================================================= */

/*
    Hiding spots get a visible recessed opening.

    The actual hiding detection still uses the map pixels.
*/

function buildHidingGeometry(){

    if(!hidingSpots.length)
        return;

    const positions = [];
    const indices = [];

    let vertex = 0;

    for(
        const spot of hidingSpots
    ){

        const x =
            spot.x;

        const z =
            spot.z;

        const w =
            TILE*.72;

        const h =
            WALL_HEIGHT*.48;

        const bottom =
            WALL_HEIGHT*.28;

        const top =
            bottom+h;

        const depth =
            .12;

        /*
            Dark recessed rectangle.
        */

        positions.push(

            x-w/2,
            bottom,
            z-depth,

            x+w/2,
            bottom,
            z-depth,

            x+w/2,
            top,
            z-depth,

            x-w/2,
            top,
            z-depth

        );

        indices.push(
            vertex,
            vertex+1,
            vertex+2,

            vertex,
            vertex+2,
            vertex+3
        );

        vertex += 4;

    }

    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setIndex(indices);

    geometry.computeBoundingSphere();

    const material =
        new THREE.MeshBasicMaterial({
            color:0x090806,
            side:THREE.DoubleSide
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    world.add(mesh);

}

/* =========================================================
   FLUORESCENT LIGHTS
========================================================= */

const fluorescentLights = [];

function buildLights(){

    /*
        Only place lights periodically.

        This gives the characteristic repeating fluorescent
        ceiling pattern without hundreds of dynamic lights.
    */

    const spacing = 8;

    for(
        let y=2;
        y<mapHeight-2;
        y+=spacing
    ){

        for(
            let x=2;
            x<mapWidth-2;
            x+=spacing
        ){

            if(
                !isWalkable(x,y)
            )
                continue;

            const p =
                cellToWorld(
                    x,
                    y
                );

            const fixture =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        TILE*.48,
                        .035,
                        TILE*.48
                    ),

                    new THREE.MeshBasicMaterial({
                        color:0xfff8dc
                    })

                );

            fixture.position.set(
                p.x,
                WALL_HEIGHT-.035,
                p.z
            );

            world.add(fixture);

            /*
                Only a small number of actual dynamic lights.
            */

            if(
                fluorescentLights.length < 32
            ){

                const light =
                    new THREE.PointLight(
                        0xffedb0,
                        2.0,
                        11,
                        2
                    );

                light.position.set(
                    p.x,
                    WALL_HEIGHT-.35,
                    p.z
                );

                scene.add(light);

                fluorescentLights.push({
                    light,
                    timer:
                        Math.random()*4,
                    base:2.0
                });

            }

        }

    }

}

/* =========================================================
   COLLISION
========================================================= */

/*
    Instead of checking EVERY wall on every movement frame,
    collision only checks the map cells around the player.

    This fixes the huge slowdown on larger maps.
*/

function collides(
    x,
    z
){

    const center =
        worldToCell(
            x,
            z
        );

    const radiusCells = 2;

    for(
        let y=
            center.y-radiusCells;
        y<=
            center.y+radiusCells;
        y++
    ){

        for(
            let cx=
                center.x-radiusCells;
            cx<=
                center.x+radiusCells;
            cx++
        ){

            if(
                !validCell(cx,y) ||
                mapData[y][cx] !== "wall"
            )
                continue;

            const p =
                cellToWorld(
                    cx,
                    y
                );

            const half =
                TILE/2;

            const closestX =
                Math.max(
                    p.x-half,
                    Math.min(
                        x,
                        p.x+half
                    )
                );

            const closestZ =
                Math.max(
                    p.z-half,
                    Math.min(
                        z,
                        p.z+half
                    )
                );

            const dx =
                x-closestX;

            const dz =
                z-closestZ;

            if(
                dx*dx+
                dz*dz
                <
                PLAYER_RADIUS*
                PLAYER_RADIUS
            )
                return true;

        }

    }

    return false;

}

/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.y =
    EYE_HEIGHT;

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let grounded = true;

let crouching = false;
let hidden = false;

function movePlayer(
    dx,
    dz
){

    const nextX =
        player.position.x+dx;

    const nextZ =
        player.position.z+dz;

    if(
        !collides(
            nextX,
            player.position.z
        )
    ){

        player.position.x =
            nextX;

    }

    if(
        !collides(
            player.position.x,
            nextZ
        )
    ){

        player.position.z =
            nextZ;

    }

}

function updatePlayer(
    dt
){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    crouching =
        !!keys.c;

    let forward = 0;
    let strafe = 0;

    if(keys.w)
        forward++;

    if(keys.s)
        forward--;

    if(keys.d)
        strafe++;

    if(keys.a)
        strafe--;

    const len =
        Math.hypot(
            forward,
            strafe
        );

    if(len > 0){

        forward/=len;
        strafe/=len;

        const speed =
            keys.shift && !crouching
            ?
            SPRINT_SPEED
            :
            crouching
            ?
            WALK_SPEED*.58
            :
            WALK_SPEED;

        const sin =
            Math.sin(yaw);

        const cos =
            Math.cos(yaw);

        const dx =
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz =
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    /*
        Jumping.
    */

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY =
            JUMP_SPEED;

        grounded = false;

    }

    keys.spacePressed = false;

    velocityY -=
        GRAVITY*dt;

    player.position.y +=
        velocityY*dt;

    if(
        player.position.y <= 0
    ){

        player.position.y = 0;
        velocityY = 0;
        grounded = true;

    }else{

        grounded = false;

    }

    const targetHeight =
        crouching
        ?
        CROUCH_EYE_HEIGHT
        :
        EYE_HEIGHT;

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetHeight,
            Math.min(
                dt*12,
                1
            )
        );

    updateHiding();

}

/* =========================================================
   HIDING
========================================================= */

function updateHiding(){

    const cell =
        worldToCell(
            player.position.x,
            player.position.z
        );

    let near = false;

    /*
        Check only nearby hiding cells.
    */

    for(
        let y=cell.y-2;
        y<=cell.y+2;
        y++
    ){

        for(
            let x=cell.x-2;
            x<=cell.x+2;
            x++
        ){

            if(
                !validCell(x,y)
            )
                continue;

            if(
                mapData[y][x] !== "hide"
            )
                continue;

            const p =
                cellToWorld(
                    x,
                    y
                );

            const distance =
                Math.hypot(
                    player.position.x-p.x,
                    player.position.z-p.z
                );

            if(
                distance < TILE*.72
            ){

                near = true;
                break;

            }

        }

        if(near)
            break;

    }

    hidden =
        near &&
        crouching;

    document.getElementById(
        "hideIndicator"
    ).style.opacity =
        near && !hidden
        ?
        "1"
        :
        "0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity =
        hidden
        ?
        "1"
        :
        "0";

}

/* =========================================================
   ENTITY
========================================================= */

let entity = null;

let entityTarget = null;

let entityPath = [];

let entityPathIndex = 0;

let entityRepathTimer = 0;

let entityStuckTimer = 0;

let lastEntityX = 0;
let lastEntityZ = 0;

function createEntity(){

    let material;

    if(entityTexture){

        material =
            new THREE.MeshBasicMaterial({

                map:entityTexture,

                transparent:true,

                alphaTest:.02,

                side:THREE.DoubleSide,

                depthWrite:true

            });

    }else{

        material =
            new THREE.MeshBasicMaterial({
                color:0x080808
            });

    }

    entity =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1.8,
                4.8
            ),

            material

        );

    entity.position.set(
        entitySpawn.x,
        2.4,
        entitySpawn.z
    );

    world.add(entity);

    lastEntityX =
        entity.position.x;

    lastEntityZ =
        entity.position.z;

}

/* =========================================================
   ENTITY PATHFINDING
========================================================= */

function buildEntityPath(){

    if(!entity)
        return;

    const start =
        worldToCell(
            entity.position.x,
            entity.position.z
        );

    const target =
        worldToCell(
            player.position.x,
            player.position.z
        );

    if(
        !isWalkable(
            start.x,
            start.y
        ) ||
        !isWalkable(
            target.x,
            target.y
        )
    )
        return;

    /*
        If entity and player aren't in the same connected
        floor region, the teleport recovery will eventually
        fix it.
    */

    if(
        componentMap[start.y][start.x] !==
        componentMap[target.y][target.x]
    ){

        entityPath = [];

        return;

    }

    const size =
        mapWidth*mapHeight;

    const cameFrom =
        new Int32Array(size);

    cameFrom.fill(-1);

    const visited =
        new Uint8Array(size);

    const queueX =
        new Int32Array(size);

    const queueY =
        new Int32Array(size);

    let head = 0;
    let tail = 0;

    const startId =
        start.y*mapWidth+
        start.x;

    const targetId =
        target.y*mapWidth+
        target.x;

    queueX[tail] = start.x;
    queueY[tail] = start.y;
    tail++;

    visited[startId] = 1;

    const directions = [

        [1,0],
        [-1,0],
        [0,1],
        [0,-1]

    ];

    /*
        Limit pathfinding work so a giant map cannot
        freeze the browser.
    */

    let nodes = 0;

    const MAX_NODES = 5000;

    while(
        head < tail &&
        nodes < MAX_NODES
    ){

        const x =
            queueX[head];

        const y =
            queueY[head];

        head++;

        nodes++;

        const currentId =
            y*mapWidth+x;

        if(
            currentId === targetId
        )
            break;

        for(
            const [dx,dy]
            of directions
        ){

            const nx =
                x+dx;

            const ny =
                y+dy;

            if(
                !validCell(nx,ny) ||
                !isWalkable(nx,ny)
            )
                continue;

            const id =
                ny*mapWidth+nx;

            if(visited[id])
                continue;

            visited[id] = 1;

            cameFrom[id] =
                currentId;

            queueX[tail] = nx;
            queueY[tail] = ny;

            tail++;

        }

    }

    if(!visited[targetId]){

        entityPath = [];

        return;

    }

    const reversed = [];

    let current =
        targetId;

    while(
        current !== startId &&
        current !== -1
    ){

        const x =
            current%mapWidth;

        const y =
            Math.floor(
                current/mapWidth
            );

        reversed.push({
            x,
            y
        });

        current =
            cameFrom[current];

    }

    reversed.reverse();

    entityPath =
        reversed;

    entityPathIndex = 0;

}

/* =========================================================
   ENTITY TELEPORT RECOVERY
========================================================= */

function teleportEntityToPlayerArea(){

    if(!entity || !playerSpawn)
        return;

    const playerCell =
        worldToCell(
            player.position.x,
            player.position.z
        );

    const possible = [];

    /*
        Search outward through the player's connected
        map region.

        Minimum distance = 20 MAP PIXELS.
    */

    const minDistance =
        ENTITY_TELEPORT_DISTANCE;

    const maxDistance =
        Math.max(
            minDistance+10,
            Math.floor(
                Math.min(
                    mapWidth,
                    mapHeight
                )*.45
            )
        );

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            if(
                !isWalkable(x,y)
            )
                continue;

            if(
                componentMap[y][x] !==
                playerComponent
            )
                continue;

            const distance =
                Math.hypot(
                    x-playerCell.x,
                    y-playerCell.y
                );

            if(
                distance < minDistance ||
                distance > maxDistance
            )
                continue;

            possible.push({
                x,
                y,
                distance
            });

        }

    }

    if(!possible.length){

        /*
            Fallback: find any point in the same
            component farther than 20 pixels if possible.
        */

        for(
            let y=0;
            y<mapHeight;
            y++
        ){

            for(
                let x=0;
                x<mapWidth;
                x++
            ){

                if(
                    !isWalkable(x,y)
                )
                    continue;

                if(
                    componentMap[y][x] !==
                    playerComponent
                )
                    continue;

                const distance =
                    Math.hypot(
                        x-playerCell.x,
                        y-playerCell.y
                    );

                if(
                    distance >= minDistance
                ){

                    possible.push({
                        x,
                        y,
                        distance
                    });

                }

            }

        }

    }

    if(!possible.length)
        return;

    /*
        Prefer a reasonably distant location.
    */

    possible.sort(
        (a,b)=>
            Math.abs(
                a.distance-32
            )-
            Math.abs(
                b.distance-32
            )
    );

    const chosen =
        possible[
            Math.floor(
                Math.random()*
                Math.min(
                    possible.length,
                    15
                )
            )
        ];

    const p =
        cellToWorld(
            chosen.x,
            chosen.y
        );

    entity.position.x =
        p.x;

    entity.position.z =
        p.z;

    entity.position.y =
        2.4;

    entityPath = [];

    entityPathIndex = 0;

    entityStuckTimer = 0;

    entityRepathTimer = .1;

    showMessage(
        "SOMETHING MOVED..."
    );

}

/* =========================================================
   ENTITY UPDATE
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        paused ||
        dead
    )
        return;

    /*
        Recalculate path periodically instead of every frame.
    */

    entityRepathTimer -= dt;

    if(
        entityRepathTimer <= 0
    ){

        entityRepathTimer =
            difficulty === "nightmare"
            ?
            .18
            :
            .28;

        /*
            Hidden players aren't actively targeted.
        */

        if(!hidden){

            buildEntityPath();

        }else{

            entityPath = [];

        }

    }

    /*
        Follow path.
    */

    if(
        entityPath.length &&
        entityPathIndex <
        entityPath.length
    ){

        const targetCell =
            entityPath[
                entityPathIndex
            ];

        const target =
            cellToWorld(
                targetCell.x,
                targetCell.y
            );

        let dx =
            target.x-
            entity.position.x;

        let dz =
            target.z-
            entity.position.z;

        const distance =
            Math.hypot(
                dx,
                dz
            );

        if(distance < .22){

            entityPathIndex++;

        }else{

            dx/=distance;
            dz/=distance;

            const speed =
                difficulty === "nightmare"
                ?
                2.7
                :
                difficulty === "hard"
                ?
                2.35
                :
                difficulty === "easy"
                ?
                1.65
                :
                2.05;

            const move =
                speed*dt;

            const nx =
                entity.position.x+
                dx*move;

            const nz =
                entity.position.z+
                dz*move;

            if(
                isWalkable(
                    worldToCell(
                        nx,
                        nz
                    ).x,
                    worldToCell(
                        nx,
                        nz
                    ).y
                )
            ){

                entity.position.x =
                    nx;

                entity.position.z =
                    nz;

            }else{

                entityStuckTimer += dt;

            }

        }

    }else{

        /*
            No route = entity is stuck or separated.
        */

        entityStuckTimer += dt;

    }

    /*
        Detect actual movement.
    */

    const moved =
        Math.hypot(
            entity.position.x-
            lastEntityX,

            entity.position.z-
            lastEntityZ
        );

    if(moved < .01){

        entityStuckTimer += dt;

    }else{

        entityStuckTimer =
            Math.max(
                0,
                entityStuckTimer-.25*dt
            );

    }

    lastEntityX =
        entity.position.x;

    lastEntityZ =
        entity.position.z;

    /*
        TELEPORT IF STUCK.

        This is the requested recovery behavior.
    */

    if(
        entityStuckTimer > 2.4 &&
        !hidden
    ){

        teleportEntityToPlayerArea();

    }

    /*
        Billboard toward the camera.
    */

    entity.rotation.y =
        Math.atan2(
            camera.position.x-
            entity.position.x,

            camera.position.z-
            entity.position.z
        );

    /*
        Catch the player.
    */

    const playerDistance =
        Math.hypot(

            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z

        );

    const killDistance =
        difficulty === "easy"
        ?
        .72
        :
        .9;

    if(
        playerDistance <
        killDistance &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

){

========================================================= */

function resetPlayer(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw = 0;
    pitch = 0;

    player.rotation.y = 0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y =
        EYE_HEIGHT;

    velocityY = 0;

    grounded = true;

    crouching = false;
    hidden = false;

    gameTime = 0;

}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "pause"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    gameStarted = true;
    paused = false;
    dead = false;

    resetPlayer();

    if(entity){

        world.remove(entity);

        entity.geometry.dispose();

        entity.material.dispose();

        entity = null;

    }

    createEntity();

    renderer.domElement.requestPointerLock();

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused =
        !paused;

    document.getElementById(
        "pause"
    ).style.display =
        paused
        ?
        "flex"
        :
        "none";

    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        renderer.domElement.requestPointerLock();

    }

}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if(
            event.code === "Space"
        ){

            event.preventDefault();

            if(!keys.space)
                keys.spacePressed = true;

            keys.space = true;

        }else{

            keys[key] = true;

        }

        if(
            key === "escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display === "flex"
            ){

                hideControls();

                return;

            }

            if(gameStarted)
                togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    event => {

        if(
            event.code === "Space"
        ){

            keys.space = false;

        }else{

            keys[
                event.key.toLowerCase()
            ] = false;

        }

    }
);

/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement === null
        )
            return;

        yaw -=
            event.movementX*.0021;

        pitch -=
            event.movementY*.0018;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.45,
                1.45
            );

        player.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement.requestPointerLock();

        }

    }
);

/* =========================================================
   LIGHT FLICKER
========================================================= */

function updateLights(
    dt
){

    for(
        const item of fluorescentLights
    ){

        item.timer -= dt;

        if(
            item.timer <= 0
        ){

            item.timer =
                .8+
                Math.random()*5;

            /*
                Most of the time the light stays stable.
                Occasionally it flickers.
            */

            if(
                Math.random()<.12
            ){

                item.light.intensity =
                    .15+
                    Math.random()*.7;

                setTimeout(
                    ()=>{

                        if(item.light)
                            item.light.intensity =
                                item.base;

                    },
                    35+
                    Math.random()*100
                );

            }else{

                item.light.intensity =
                    item.base;

            }

        }

    }

}

/* =========================================================
   TAPE TIMER
========================================================= */

function updateTapeTime(
    dt
){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime += dt;

    const total =
        Math.floor(gameTime);

    const h =
        Math.floor(total/3600);

    const m =
        Math.floor(
            (total%3600)/60
        );

    const s =
        total%60;

    const f =
        n =>
            String(n).padStart(
                2,
                "0"
            );

    document.getElementById(
        "tapeTime"
    ).textContent =
        f(h)+":"+f(m)+":"+f(s);

}

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const now =
        performance.now();

    let dt =
        (now-lastTime)/1000;

    lastTime = now;

    /*
        Prevent a browser tab switch from producing
        a giant physics step.
    */

    dt =
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateLights(dt);
    updateMessage(dt);
    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

async function initialize(){

    try{

        console.log(
            "Loading Backrooms..."
        );

        await loadAllTextures();

        if(
            !wallTexture ||
            !floorTexture ||
            !ceilingTexture
        ){

            throw new Error(
                "Required texture missing.\n\n" +
                "Expected:\n" +
                "./textures/wall.png\n" +
                "./textures/floor.png\n" +
                "./textures/ceiling.png"
            );

        }

        configureMaterials();

        await loadMap();

        buildWalkableComponent();

        createBatchedGeometry();

        /*
            These are intentionally separate from the
            main world mesh because they are much smaller.
        */

        buildHoleGeometry();

        buildHidingGeometry();

        buildLights();

        document.getElementById(
            "difficultyHud"
        ).textContent =
            difficulty.toUpperCase();

        console.log(
            "BACKROOMS READY."
        );

    }catch(error){

        console.error(error);

        const errorBox =
            document.getElementById(
                "error"
            );

        errorBox.style.display =
            "block";

        errorBox.textContent =
            "BACKROOMS INITIALIZATION ERROR\n\n"+
            (
                error.stack ||
                String(error)
            );

    }

}

initialize();
</script>

</body>
</html>
