<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   THREE CHECK
========================================================= */

if (
    typeof THREE === "undefined"
) {

    const error =
        document.getElementById("error");

    error.style.display =
        "block";

    error.textContent =
        "THREE.JS FAILED TO LOAD.\n\n" +

        "The game expects:\n\n" +

        "index.html\n" +
        "three.min.js\n" +
        "entity.png\n" +
        "entity.mp3\n" +
        "textures/wall.png\n" +
        "textures/floor.png\n" +
        "textures/ceiling.png\n\n" +

        "Make sure three.min.js is in the SAME folder as index.html.";

    throw new Error(
        "Local three.min.js could not be loaded."
    );
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x827a4b
    );


/*
   This fog is intentionally subtle.

   The original Level 0 should still feel
   relatively bright and yellow.
*/

scene.fog =
    new THREE.Fog(
        0x827a4b,
        55,
        150
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        78,
        window.innerWidth /
        window.innerHeight,
        0.03,
        500
    );

camera.rotation.order =
    "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: false,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.25
    )
);


/*
   IMPORTANT:

   We use normal sRGB output.

   No aggressive tone mapping is used.
*/

if (
    "outputColorSpace"
    in renderer
) {

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;
}


renderer.toneMapping =
    THREE.NoToneMapping;


renderer.toneMappingExposure =
    1;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0xffe9a7,
        0.58
    );

scene.add(
    ambient
);


const hemisphere =
    new THREE.HemisphereLight(
        0xfff0ae,
        0x242014,
        0.42
    );

scene.add(
    hemisphere
);


/* =========================================================
   TEXTURE LOADER
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


let wallTexture =
    null;

let floorTexture =
    null;

let ceilingTexture =
    null;


/* =========================================================
   TEXTURE PREPARATION
========================================================= */

function prepareEnvironmentTexture(
    texture
) {

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy =
        Math.min(
            renderer.capabilities
                .getMaxAnisotropy(),
            8
        );

    texture.needsUpdate =
        true;

    return texture;
}


/* =========================================================
   LOAD TEXTURE
========================================================= */

function loadTexture(
    path
) {

    return new Promise(
        resolve => {

            textureLoader.load(

                path,

                texture => {

                    console.log(
                        "TEXTURE LOADED:",
                        path
                    );

                    resolve(
                        prepareEnvironmentTexture(
                            texture
                        )
                    );
                },

                undefined,

                error => {

                    console.error(
                        "TEXTURE FAILED:",
                        path,
                        error
                    );

                    resolve(
                        null
                    );
                }

            );

        }
    );
}


/* =========================================================
   LOAD ALL TEXTURES
========================================================= */

async function loadEnvironmentTextures() {

    wallTexture =
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture =
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture =
        await loadTexture(
            "./textures/ceiling.png"
        );


    const missing = [];


    if (!wallTexture) {

        missing.push(
            "textures/wall.png"
        );
    }


    if (!floorTexture) {

        missing.push(
            "textures/floor.png"
        );
    }


    if (!ceilingTexture) {

        missing.push(
            "textures/ceiling.png"
        );
    }


    if (
        missing.length
    ) {

        const error =
            document.getElementById(
                "error"
            );

        error.style.display =
            "block";

        error.textContent =
            "ENVIRONMENT TEXTURE ERROR\n\n" +

            "Could not load:\n\n" +

            missing.join("\n") +

            "\n\n" +

            "Expected structure:\n\n" +

            "index.html\n" +
            "three.min.js\n" +
            "entity.png\n" +
            "entity.mp3\n" +
            "textures/wall.png\n" +
            "textures/floor.png\n" +
            "textures/ceiling.png";
    }
}


/* =========================================================
   WORLD STORAGE
========================================================= */

let worldObjects = [];

let wallColliders = [];

let lights = [];

let deathHoles = [];


function addWorldObject(
    object
) {

    scene.add(
        object
    );

    worldObjects.push(
        object
    );

    return object;
}


/* =========================================================
   MATERIAL DISPOSAL
========================================================= */

function disposeMaterial(
    material
) {

    if (!material) {
        return;
    }


    if (
        Array.isArray(material)
    ) {

        material.forEach(
            disposeMaterial
        );

        return;
    }


    if (
        material.map
    ) {

        /*
           Do NOT dispose the original
           environment textures here.

           Only cloned textures are used
           by generated materials.
        */

        material.map.dispose();
    }


    material.dispose();
}


/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld() {

    worldObjects.forEach(
        object => {

            scene.remove(
                object
            );


            object.traverse(
                child => {

                    if (
                        child.geometry
                    ) {

                        child.geometry.dispose();
                    }


                    if (
                        child.material
                    ) {

                        disposeMaterial(
                            child.material
                        );
                    }

                }
            );

        }
    );


    worldObjects = [];

    wallColliders = [];

    deathHoles = [];

    lights = [];


    if (
        exitLight
    ) {

        scene.remove(
            exitLight
        );

        exitLight =
            null;
    }


    exitObject =
        null;


    if (
        entity
    ) {

        entity =
            null;
    }
}


/* =========================================================
   WALL TEXTURE MATERIAL
========================================================= */

/*
   The important change here is that the wall texture
   is NOT stretched based on the whole wall width.

   Instead, it repeats at a fixed world size.

   That prevents giant walls from becoming one giant
   stretched image.
*/

function createWallMaterial(
    width,
    height
) {

    if (
        !wallTexture
    ) {

        return new THREE.MeshStandardMaterial({

            color:
                0xb5aa61,

            roughness:
                0.94,

            metalness:
                0,

            side:
                THREE.DoubleSide

        });
    }


    const texture =
        wallTexture.clone();


    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;


    /*
       Roughly one texture tile every
       3 world units horizontally and
       3 world units vertically.

       This keeps the wallpaper from
       stretching across huge walls.
    */

    const repeatX =
        Math.max(
            width / 3.0,
            1
        );


    const repeatY =
        Math.max(
            height / 3.0,
            1
        );


    texture.repeat.set(
        repeatX,
        repeatY
    );


    texture.needsUpdate =
        true;


    return new THREE.MeshStandardMaterial({

        map:
            texture,

        color:
            0xffffff,

        roughness:
            0.88,

        metalness:
            0,

        side:
            THREE.DoubleSide
    });
}


/* =========================================================
   CREATE WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth = 0.28
) {

    const height =
        3.1;


    /*
       Collision box.
    */

    wallColliders.push({

        minX:
            x - width / 2,

        maxX:
            x + width / 2,

        minZ:
            z - depth / 2,

        maxZ:
            z + depth / 2,

        minY:
            0,

        maxY:
            height

    });


    const group =
        new THREE.Group();


    /*
       FRONT
    */

    const front =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                width,
                height
            )

        );


    front.position.set(
        0,
        height / 2,
        depth / 2
    );


    group.add(
        front
    );


    /*
       BACK
    */

    const back =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                height
            ),

            createWallMaterial(
                width,
                height
            )

        );


    back.rotation.y =
        Math.PI;


    back.position.set(
        0,
        height / 2,
        -depth / 2
    );


    group.add(
        back
    );


    /*
       LEFT
    */

    const left =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            createWallMaterial(
                depth,
                height
            )

        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(
        -width / 2,
        height / 2,
        0
    );


    group.add(
        left
    );


    /*
       RIGHT
    */

    const right =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                depth,
                height
            ),

            createWallMaterial(
                depth,
                height
            )

        );


    right.rotation.y =
        -Math.PI / 2;


    right.position.set(
        width / 2,
        height / 2,
        0
    );


    group.add(
        right
    );


    group.position.set(

/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    let material;


    if (
        floorTexture
    ) {

        const texture =
            floorTexture.clone();


        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;


        /*
           Carpet keeps a relatively
           natural scale.
        */

        texture.repeat.set(
            65,
            60
        );


        texture.needsUpdate =
            true;


        material =
            new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    1.0,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color:
                    0x958a42,

                roughness:
                    1

            });
    }


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                240,
                220
            ),

            material
        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    addWorldObject(
        floor
    );
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling() {

    let material;


    if (
        ceilingTexture
    ) {

        const texture =
            ceilingTexture.clone();


        texture.wrapS =
            THREE.RepeatWrapping;

        texture.wrapT =
            THREE.RepeatWrapping;


        /*
           Ceiling texture is intentionally
           MUCH smaller.

           Previous scale was effectively 120/105.

           This uses 3x as many repeats,
           making each tile about 1/9 the
           visual area.
        */

        texture.repeat.set(
            360,
            315
        );


        texture.needsUpdate =
            true;


        material =
            new THREE.MeshStandardMaterial({

                map:
                    texture,

                color:
                    0xffffff,

                roughness:
                    .95,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });

    } else {

        material =
            new THREE.MeshStandardMaterial({

                color:
                    0x878047,

                roughness:
                    .95,

                side:
                    THREE.DoubleSide

            });
    }


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                240,
                220
            ),

            material

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        3.1;


    addWorldObject(
        ceiling
    );
}

/* =========================================================
   HOLE ROOM
========================================================= */

function createHoleRoom() {

    const startX =
        -57;

    const startZ =
        53;

    const columns =
        17;

    const rows =
        8;

    const spacing =
        3.6;


    for (
        let z = 0;
        z < rows;
        z++
    ) {

        for (
            let x = 0;
            x < columns;
            x++
        ) {

            if (
                (x + z) % 5 === 0
            ) {

                continue;
            }


            const px =
                startX +
                x * spacing;


            const pz =
                startZ +
                z * spacing;


            const hole =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        2.65,
                        2.65
                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x010101,

                        side:
                            THREE.DoubleSide

                    })

                );


            hole.rotation.x =
                -Math.PI / 2;


            hole.position.set(
                px,
                .008,
                pz
            );


            addWorldObject(
                hole
            );


            deathHoles.push({

                x:
                    px,

                z:
                    pz,

                radius:
                    1.2

            });
        }
    }
}

/* =========================================================
   LIGHTING GRID
========================================================= */

function buildLighting() {

    /*
       Regular fluorescent grid.

       This is what makes the environment read
       like the classic Level 0 found footage.
    */

    for (
        let x = -105;
        x <= 105;
        x += 10
    ) {

        for (
            let z = -95;
            z <= 95;
            z += 10
        ) {

            /*
               Most lights remain present.

               A few gaps create darker sections
               without making the entire map dark.
            */

            if (
                Math.random() < .12
            ) {

                continue;
            }


            const flicker =
                Math.random() < .10;


            addFluorescentLight(

                x +
                (Math.random() - .5) * 1.5,

                z +
                (Math.random() - .5) * 1.5,

                3.4 +
                Math.random() * 1.5,

                flicker

            );
        }
    }


    /*
       Important landmark lights.
    */

    addFluorescentLight(
        -18,
        -64,
        5.2
    );

    addFluorescentLight(
        28,
        -55,
        5.0
    );

    addFluorescentLight(
        8,
        12,
        5.1
    );

    addFluorescentLight(
        35,
        59,

    );

    addFluorescentLight(

    );
}


/* =========================================================
   LIGHT FLICKER
========================================================= */

let flickerFlash =
    document.getElementById(
        "flickerFlash"
    );


let flickerFlashTimer =
    0;


function updateLights(
    dt
) {

    flickerFlashTimer =
        Math.max(
            0,
            flickerFlashTimer - dt
        );


    flickerFlash.style.opacity =
        flickerFlashTimer > 0
            ? ".12"
            : "0";


    lights.forEach(
        item => {

            if (
                !item.flicker
            ) {

                return;
            }


            item.timer -= dt;


            if (
                item.timer <= 0
            ) {

                item.timer =
                    .08 +
                    Math.random() * .75;


                /*
                   NEVER hide the fixture.

                   The light changes brightness
                   instead of disappearing.
                */

                const multiplier =
                    Math.random() < .22
                        ? .35
                        : .72 +
                          Math.random() * .35;


                item.light.intensity =
                    item.base *
                    multiplier;


                /*
                   Very occasional short camera
                   exposure flash.
                */

                if (
                    Math.random() < .05
                ) {

                    flickerFlashTimer =
                        .035;
                }
            }
        }
    );
}

/* =========================================================

function createEntity() {

    return new Promise(
        resolve => {

            textureLoader.load(

                "./entity.png",

                texture => {

                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    texture.magFilter =
                        THREE.LinearFilter;


                    texture.minFilter =
                        THREE.LinearFilter;


                    const aspect =
                        (
                            texture.image.width ||
                            1
                        ) /
                        (
                            texture.image.height ||
                            1
                        );


                    const height =
                        1.55;


                    const width =
                        height *
                        aspect;


                    /*
                       ENTITY ONLY:

                       MeshBasicMaterial means the
                       PNG remains completely unshaded.
                    */

                    const material =
                        new THREE.MeshBasicMaterial({

                            map:
                                texture,

                            transparent:
                                true,

                            alphaTest:
                                .02,

                            side:
                                THREE.DoubleSide,

                            depthWrite:
                                true,

                            fog:
                                false,

                            color:
                                0xffffff

                        });


                    entity =
                        new THREE.Mesh(

                            new THREE.PlaneGeometry(
                                width,
                                height
                            ),

                            material

                        );


                    entity.position.set(
                        55,
                        .775,
                        -48
                    );


                    addWorldObject(
                        entity
                    );


                    resolve();

                },

                undefined,

                error => {

                    console.error(
                        "ENTITY PNG FAILED:",
                        error
                    );

                       Fallback entity.

                    entity =

                    resolve();
                }

            );

        }
    );
}


/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const bottom =
        player.position.y;


    const top =
        bottom +
        PLAYER_HEIGHT;


    for (
        const wall
        of wallColliders
    ) {

        if (
            top <= wall.minY ||
            bottom >= wall.maxY
        ) {

            continue;
        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   ENTITY WALL COLLISION
========================================================= */

function entityHitsWall(
    x,
    z
) {

    const radius =
        .42;


    for (
        const wall
        of wallColliders
    ) {

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            radius * radius
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   LINE OF SIGHT
========================================================= */

function blocked(
    x1,
    z1,
    x2,
    z2
) {

    const dx =
        x2 -
        x1;


    const dz =
        z2 -
        z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.max(
            1,
            Math.ceil(
                distance /
                .35
            )
        );


    for (
        let i = 1;
        i < steps;
        i++
    ) {

        const t =
            i /
            steps;


        if (
            entityHitsWall(

                x1 +
                dx * t,

                z1 +
                dz * t

            )
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   ENTITY PATH DIRECTION
========================================================= */

/*
   Instead of allowing the entity to simply
   run directly into walls, test several
   directions around its current direction.

   This makes it capable of juking through
   the maze.
*/

function chooseEntityDirection(
    desiredX,
    desiredZ
) {

    const desiredLength =
        Math.hypot(
            desiredX,
            desiredZ
        );


    if (
        desiredLength < .001
    ) {

        return;
    }


    desiredX /=
        desiredLength;

    desiredZ /=
        desiredLength;


    const baseAngle =
        Math.atan2(
            desiredZ,
            desiredX
        );


    const testAngles = [

        0,

        Math.PI / 8,
        -Math.PI / 8,

        Math.PI / 4,
        -Math.PI / 4,

        Math.PI / 2,
        -Math.PI / 2,

        Math.PI * .75,
        -Math.PI * .75,

        Math.PI

    ];


    const testDistance =
        1.6;


    for (
        const offset
        of testAngles
    ) {

        const angle =
            baseAngle +
            offset;


        const dx =
            Math.cos(
                angle
            );


        const dz =
            Math.sin(
                angle
            );


        const testX =
            entity.position.x +
            dx *
            testDistance;


        const testZ =
            entity.position.z +
            dz *
            testDistance;


        if (
            !entityHitsWall(
                testX,
                testZ
            )
        ) {

            entityDirection.set(
                dx,
                dz
            );

            return;
        }
    }


    /*
       If absolutely everything is blocked,
       turn around.
    */

    entityDirection.set(
        -desiredX,
        -desiredZ
    );
}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
) {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    const settings =
        SETTINGS[difficulty];


    const dx =
        player.position.x -
        entity.position.x;


    const dz =
        player.position.z -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    /*
       The entity ALWAYS knows where the player is.

       No detection cone.

       No hiding mechanic.

       It continuously hunts.
    */

    if (
        distance > .05
    ) {

        chooseEntityDirection(
            dx,
            dz
        );
    }


    /*
       Smooth movement.
    */

    entityVelocity.x =
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x *
            settings.speed,
            Math.min(
                1,
                dt * 5
            )
        );


    entityVelocity.y =
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y *
            settings.speed,
            Math.min(
                1,
                dt * 5
            )
        );


    const moveX =
        entityVelocity.x *
        dt;


    const moveZ =
        entityVelocity.y *
        dt;


    const nextX =
        entity.position.x +
        moveX;


    const nextZ =
        entity.position.z +
        moveZ;


    if (
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ) {

        entity.position.x =
            nextX;

    } else {

        /*
           Force a new direction when
           touching a wall.
        */

        chooseEntityDirection(
            dx,
            dz
        );
    }


    if (
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ) {

        entity.position.z =
            nextZ;

    } else {

        chooseEntityDirection(
            dx,
            dz
        );
    }


    /*
       Billboard toward player.

       The entity PNG remains unshaded.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );


    const killDistance =
        difficulty === "nightmare"
            ? 1.65
            : 1.3;


    if (
        distance <
        killDistance
    ) {

        killPlayer(
            "THE ENTITY FOUND YOU."
        );
    }
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio() {

    if (
        !entity ||
        !running ||
        paused ||
        dead ||
        fallingIntoLevel
    ) {

        entityAudio.volume =
            0;

        return;
    }


    const distance =
        Math.hypot(

            entity.position.x -
            player.position.x,

            entity.position.z -
            player.position.z

        );


    const maxDistance =
        42;


    if (
        distance >=
        maxDistance
    ) {

        entityAudio.volume =
            0;

        return;
    }


    let volume =
        Math.pow(

            1 -
            distance /
            maxDistance,

            1.5

        ) *
        .8;


    if (
        blocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z

        )
    ) {

        volume *=
            .35;
    }


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .85
        );


    if (
        entityAudio.paused &&
        volume > .01
    ) {

        entityAudio
            .play()
            .catch(
                () => {}
            );
    }
}

========================================================= */

document.addEventListener(
    "mousemove",
    event => {

            !running ||

        ) {

            return;
        }

        ) {

            );

);


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        updateFall(
            dt
        );

        return;
    }


    let forward =
        0;


    let strafe =
        0;


    /*
       W = +forward
       S = -forward

       This is intentionally explicit.
    */

    if (
        keys.w
    ) {

        forward +=
            1;
    }


    if (
        keys.s
    ) {

        forward -=
            1;
    }


    if (
        keys.d
    ) {

        strafe +=
            1;
    }


    if (
        keys.a
    ) {

        strafe -=
            1;
    }


    const length =
        Math.hypot(
            forward,
            strafe
        );


    if (
        length > 0
    ) {

        forward /=
            length;

        strafe /=
            length;
    }


    /*
       No sprint cooldown.
    */

    let speed =
        keys.shift
            ? 5.9
            : 3.5;


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            keys.shift
                ? 6.1
                : 3.8;
    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            keys.shift
                ? 6.4
                : 3.5;
    }


    if (
        difficulty ===
        "nightmare"
    ) {

        speed =
            keys.shift
                ? 6.7
                : 3.3;
    }


    /*
       CAMERA-DIRECTION MOVEMENT

       This completely eliminates the old W/S
       swap problem.

       We get the camera's actual forward
       vector and use it directly.
    */

    const forwardVector =
        new THREE.Vector3();


    camera.getWorldDirection(
        forwardVector
    );


    forwardVector.y =
        0;


    if (
        forwardVector.lengthSq() <
        .0001
    ) {

        forwardVector.set(
            0,
            0,
            -1
        );
    }


    forwardVector.normalize();


    const rightVector =
        new THREE.Vector3(
            -forwardVector.z,
            0,
            forwardVector.x
        );


    const moveX =
        (
            forwardVector.x *
            forward +

            rightVector.x *
            strafe

        ) *
        speed *
        dt;


    const moveZ =
        (
            forwardVector.z *
            forward +

            rightVector.z *
            strafe

        ) *
        speed *
        dt;


    const nextX =
        player.position.x +
        moveX;


    const nextZ =
        player.position.z +
        moveZ;


    /*
       Separate X and Z collision allows
       smooth sliding along walls.
    */

    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    /*
       Jump.
    */

    if (
        jumpPressed &&
        grounded
    ) {

        velocityY =
            6.2;

        grounded =
            false;
    }


    jumpPressed =
        false;


    velocityY -=
        20 *
        dt;


    player.position.y +=
        velocityY *
        dt;


    if (
        player.position.y <= 0
    ) {

        player.position.y =
            0;

        velocityY =
            0;

        grounded =
            true;
    }


    if (
        playerInHole()
    ) {

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }


    checkExit();
}


/* =========================================================
   HOLE CHECK
========================================================= */

function playerInHole() {

    for (
        const hole
        of deathHoles
    ) {

        const dx =
            player.position.x -
            hole.x;


        const dz =
            player.position.z -
            hole.z;


        if (
            dx * dx +
            dz * dz <
            hole.radius *
            hole.radius
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================================
   FALL INTRO
========================================================= */

function updateFall(
    dt
) {

    fallTimer +=
        dt;


    const progress =
        Math.min(
            fallTimer /
            FALL_DURATION,
            1
        );


    const eased =
        1 -
        Math.pow(
            1 - progress,
            3
        );


    player.position.y =
        17 -
        17 *
        eased;


    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );


    camera.rotation.x =
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                progress * 1.3,
                1
            )
        );


    camera.rotation.z =
        Math.sin(
            progress *
            Math.PI *
            9
        ) *
        .025;


    if (
        progress >= 1
    ) {

        fallingIntoLevel =
            false;


        player.position.y =
            0;


        camera.position.set(
            0,
            EYE_HEIGHT,
            0
        );


        camera.rotation.x =
            0;

        camera.rotation.z =
            0;


        player.rotation.y =
            yaw;


        requestPointerLockSafe();
    }
}


/* =========================================================
   CAMERA EFFECT
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
) {

    if (
        fallingIntoLevel
    ) {

        return;
    }


    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const amount =
        moving
            ? .008
            : .0023;


    camera.position.x =
        Math.sin(
            cameraTime * 3.4
        ) *
        amount;


    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime * 4.1
        ) *
        amount;


    camera.position.z =
        Math.cos(
            cameraTime * 3.1
        ) *
        amount *
        .55;


    /*
       Tiny found-footage camera roll.
    */

    camera.rotation.z =
        Math.sin(
            cameraTime * .85
        ) *
        .003;


    /*
       Occasional tiny camera instability.
    */

    if (
        Math.random() <
        .002
    ) {

        camera.position.x +=
            (
                Math.random() -
                .5
            ) *
            .025;


        camera.position.y +=
            (
                Math.random() -
                .5
            ) *
            .02;


        camera.rotation.z +=
            (
                Math.random() -
                .5
            ) *
            .012;
    }
}

        dead

        return;

            player.position.x -
            exitX,

            player.position.z -

    ) {

        winGame();

function requestPointerLockSafe() {

    if (
        !document.body.requestPointerLock
    ) {

        return;
    }


    document.body.requestPointerLock()
        .catch(
            () => {}
        );
}


function exitPointerLockSafe() {

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (
        !running ||
        dead ||
        fallingIntoLevel
    ) {

        return;
    }


    paused =
        !paused;


    document.getElementById(
        "pause"
    ).style.display =
        paused
            ? "flex"
            : "none";


    if (
        paused
    ) {

        exitPointerLockSafe();

    } else {

        requestPointerLockSafe();
    }
}

    );


    document.getElementById(

        value.toUpperCase();
}

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    event => {

        if (
            event.target.tagName ===
            "BUTTON"
        ) {

            return;
        }


        if (
            running &&
            !paused &&
            !dead &&
            !fallingIntoLevel &&
            document.pointerLockElement !==
            document.body
        ) {

            requestPointerLockSafe();
        }
    }
);


/* =========================================================
   CRT TOGGLE
========================================================= */

let crtEnabled =
    true;


const crtOverlay =
    document.getElementById(
        "crtOverlay"
    );


const crtToggle =
    document.getElementById(
        "crtToggle"
    );


crtToggle.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        crtEnabled =
            !crtEnabled;


        if (
            crtEnabled
        ) {

            crtOverlay.classList.remove(
                "disabled"
            );

            crtToggle.textContent =
                "CRT: ON";

        } else {

            crtOverlay.classList.add(
                "disabled"
            );

            crtToggle.textContent =
                "CRT: OFF";
        }
    }
);


/* =========================================================
   MENU IMAGE SYSTEM
========================================================= */

const menuImages =
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );


let menuIndex =
    -1;


function chooseRandomMenuImage() {

    if (
        menuImages.length === 0
    ) {

        return;
    }


    let next =
        Math.floor(
            Math.random() *
            menuImages.length
        );


    /*
       Avoid immediately showing the
       same image again.
    */

    if (
        menuImages.length > 1 &&
        next === menuIndex
    ) {

        next =
            (
                next +
                1
            ) %
            menuImages.length;
    }


    if (
        menuIndex >= 0
    ) {

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );
    }


    menuIndex =
        next;


    menuImages[
        menuIndex
    ].classList.add(
        "active"
    );
}


/*
   Random image immediately.
*/

chooseRandomMenuImage();


/*
   New random image every minute.
*/

setInterval(
    chooseRandomMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.25
            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock =
    new THREE.Clock();


let recordingTime =
    0;


function updateTimer(
    dt
) {

    if (
        !running ||
        paused
    ) {

        return;
    }


    recordingTime +=
        dt;


    const total =
        Math.floor(
            recordingTime
        );


    const hours =
        Math.floor(
            total /
            3600
        );


    const minutes =
        Math.floor(
            (
                total %
                3600
            ) /
            60
        );


    const seconds =
        total %
        60;


    const format =
        number => {

            return String(
                number
            ).padStart(
                2,
                "0"
            );
        };


    document.getElementById(
        "tapeTime"
    ).textContent =

        format(hours) +
        ":" +
        format(minutes) +
        ":" +
        format(seconds);
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        running &&
        !paused &&
        !dead
    ) {

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        updateLights(
            dt
        );


        updateCamera(
            dt
        );


        updateEntityAudio();


        updateMessage(
            dt
        );


        updateTimer(
            dt
        );

    } else {

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadEnvironmentTextures();

animate();

</script>
