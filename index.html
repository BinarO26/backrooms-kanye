<script type="module">

/*
============================================================
THREE.JS R160
============================================================
*/

import * as THREE from "./three.module.js";

/*
============================================================
STATE
============================================================
*/

let gameStarted=false;
let paused=false;
let dead=false;

let difficulty="normal";

let gameTime=0;
let messageTimer=0;

let mapWidth=0;
let mapHeight=0;
let mapData=[];

let playerSpawn=null;
let entitySpawn=null;

const walkableCells=[];
const holeCells=[];
const hideCells=[];

/*
============================================================
RENDERER
============================================================
*/

const scene=new THREE.Scene();

scene.background=
    new THREE.Color(0x4c4830);

scene.fog=
    new THREE.FogExp2(
        0x4c4830,
        0.018
    );

const camera=
    new THREE.PerspectiveCamera(
        78,
        innerWidth/innerHeight,
        .05,
        350
    );

const renderer=
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio||1,
        1.25
    )
);

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=
    .78;

document.body.appendChild(
    renderer.domElement
);

const world=new THREE.Group();
scene.add(world);

/*
============================================================
CONSTANTS
============================================================
*/

const TILE=3;
const WALL_HEIGHT=9;

const EYE_HEIGHT=5.25;
const CROUCH_HEIGHT=3.25;

const PLAYER_RADIUS=.40;

const WALK_SPEED=7.2;
const SPRINT_SPEED=14.0;
const JUMP_SPRINT_SPEED=15.5;

const GRAVITY=21;
const JUMP_SPEED=7.6;

/*
============================================================
TEXTURES
============================================================
*/

const loader=
    new THREE.TextureLoader();

let floorTexture=null;
let wallTexture=null;
let ceilingTexture=null;

function configureTexture(tex){

    /*
        This is deliberately explicit.

        Three.js R160 uses colorSpace instead
        of the old encoding property.
    */

    tex.colorSpace=
        THREE.SRGBColorSpace;

    tex.wrapS=
        THREE.RepeatWrapping;

    tex.wrapT=
        THREE.RepeatWrapping;

    tex.magFilter=
        THREE.LinearFilter;

    tex.minFilter=
        THREE.LinearMipmapLinearFilter;

    tex.anisotropy=
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            4
        );

    tex.needsUpdate=true;

    return tex;
}

function loadTexture(path){

    return new Promise(
        (resolve,reject)=>{

            loader.load(

                path,

                tex=>{

                    console.log(
                        "TEXTURE OK:",
                        path,
                        tex.image.width,
                        tex.image.height
                    );

                    resolve(
                        configureTexture(tex)
                    );

                },

                xhr=>{

                    if(xhr.total){

                        console.log(
                            path,
                            Math.round(
                                xhr.loaded/xhr.total*100
                            )+"%"
                        );

                    }

                },

                err=>{

                    console.error(
                        "TEXTURE ERROR:",
                        path,
                        err
                    );

                    reject(
                        new Error(
                            "Could not load "+path
                        )
                    );

                }

            );

        }
    );

}

/*
============================================================
MATERIALS

MeshBasicMaterial is intentional.

The texture cannot become black because a light
is missing.
============================================================
*/

let floorMaterial;
let wallMaterial;
let ceilingMaterial;

function createMaterials(){

    floorMaterial=
        new THREE.MeshBasicMaterial({
            map:floorTexture,
            side:THREE.DoubleSide
        });

    wallMaterial=
        new THREE.MeshBasicMaterial({
            map:wallTexture,
            side:THREE.DoubleSide
        });

    ceilingMaterial=
        new THREE.MeshBasicMaterial({
            map:ceilingTexture,
            side:THREE.DoubleSide
        });

}

/*
============================================================
MAP
============================================================
*/

function cellToWorld(x,y){

    return {

        x:
            (x+.5)*TILE-
            mapWidth*TILE*.5,

        z:
            (y+.5)*TILE-
            mapHeight*TILE*.5

    };

}

function worldToCell(x,z){

    return {

        x:
            Math.floor(
                (x+
                 mapWidth*TILE*.5)/
                TILE
            ),

        y:
            Math.floor(
                (z+
                 mapHeight*TILE*.5)/
                TILE
            )

    };

}

function insideMap(x,y){

    return (
        x>=0 &&
        y>=0 &&
        x<mapWidth &&
        y<mapHeight
    );

}

function isHole(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]==="hole"
    );

}

function isWalkable(x,y){

    return (
        insideMap(x,y) &&
        mapData[y][x]!=="wall"
    );

}

/*
============================================================
MAP PIXEL CLASSIFICATION
============================================================
*/

function classifyPixel(r,g,b,a){

    if(a<20)
        return "floor";

    if(
        r<65 &&
        g<65 &&
        b<65
    )
        return "wall";

    if(
        r>155 &&
        r>g*1.4 &&
        r>b*1.4
    )
        return "spawn";

    if(
        b>130 &&
        b>r*1.25 &&
        b>g*1.1
    )
        return "entity";

    if(
        r>105 &&
        b>105 &&
        g<120
    )
        return "hide";

    if(
        r>135 &&
        g>110 &&
        b<125
    )
        return "hole";

    return "floor";
}

/*
============================================================
LOAD MAP IMAGE
============================================================
*/

async function loadMap(){

    const image=
        await new Promise(
            (resolve,reject)=>{

                const img=new Image();

                img.onload=()=>{
                    console.log(
                        "MAP OK:",
                        img.naturalWidth,
                        "x",
                        img.naturalHeight
                    );

                    resolve(img);
                };

                img.onerror=()=>{
                    reject(
                        new Error(
                            "Could not load ./textures/map1.png"
                        )
                    );
                };

                img.src="./textures/map1.png";

            }
        );

    mapWidth=image.naturalWidth;
    mapHeight=image.naturalHeight;

    const canvas=
        document.createElement("canvas");

    canvas.width=mapWidth;
    canvas.height=mapHeight;

    const ctx=
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.drawImage(image,0,0);

    const pixels=
        ctx.getImageData(
            0,
            0,
            mapWidth,
            mapHeight
        ).data;

    mapData=[];

    for(let y=0;y<mapHeight;y++){

        const row=[];

        for(let x=0;x<mapWidth;x++){

            const i=
                (y*mapWidth+x)*4;

            const type=
                classifyPixel(
                    pixels[i],
                    pixels[i+1],
                    pixels[i+2],
                    pixels[i+3]
                );

            row.push(type);

            if(type!=="wall")
                walkableCells.push({x,y});

            if(type==="hole")
                holeCells.push({x,y});

            if(type==="hide")
                hideCells.push({x,y});

            if(
                type==="spawn" &&
                !playerSpawn
            ){

                playerSpawn=
                    cellToWorld(x,y);

            }

            if(
                type==="entity" &&
                !entitySpawn
            ){

                entitySpawn=
                    cellToWorld(x,y);

            }

        }

        mapData.push(row);

    }

    if(!playerSpawn){

        const c=
            walkableCells[
                Math.floor(
                    walkableCells.length/2
                )
            ];

        if(!c)
            throw new Error(
                "map1.png has no usable floor."
            );

        playerSpawn=
            cellToWorld(
                c.x,
                c.y
            );

    }

    if(!entitySpawn){

        let best=null;
        let bestDistance=-1;

        const pc=
            worldToCell(
                playerSpawn.x,
                playerSpawn.z
            );

        for(
            const c of walkableCells
        ){

            const d=
                Math.hypot(
                    c.x-pc.x,
                    c.y-pc.y
                );

            if(d>bestDistance){

                bestDistance=d;
                best=c;

            }

        }

        if(best)
            entitySpawn=
                cellToWorld(
                    best.x,
                    best.y
                );

    }

}

/*
============================================================
COMBINED GEOMETRY BUILDING
============================================================

Instead of creating a THREE.Mesh for every tile,
we make ONE floor mesh, ONE wall mesh and ONE ceiling mesh.

This is the major performance fix.
============================================================
*/

function makeFloorGeometry(){

    const positions=[];
    const uvs=[];
    const indices=[];

    let vertex=0;

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            if(mapData[y][x]==="wall")
                continue;

            if(mapData[y][x]==="hole")
                continue;

            const p=
                cellToWorld(x,y);

            const x0=p.x-TILE/2;
            const x1=p.x+TILE/2;
            const z0=p.z-TILE/2;
            const z1=p.z+TILE/2;

            positions.push(
                x0,0,z0,
                x1,0,z0,
                x1,0,z1,
                x0,0,z1
            );

            uvs.push(
                0,0,
                1,0,
                1,1,
                0,1
            );

            indices.push(
                vertex,
                vertex+1,
                vertex+2,

                vertex,
                vertex+2,
                vertex+3
            );

            vertex+=4;

        }

    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );

    geometry.setIndex(indices);

    geometry.computeVertexNormals();

    return geometry;

}

function makeCeilingGeometry(){

    const positions=[];
    const uvs=[];
    const indices=[];

    let vertex=0;

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            if(mapData[y][x]==="wall")
                continue;

            const p=
                cellToWorld(x,y);

            const x0=p.x-TILE/2;
            const x1=p.x+TILE/2;
            const z0=p.z-TILE/2;
            const z1=p.z+TILE/2;

            positions.push(
                x0,WALL_HEIGHT,z0,
                x0,WALL_HEIGHT,z1,
                x1,WALL_HEIGHT,z1,
                x1,WALL_HEIGHT,z0
            );

            uvs.push(
                0,0,
                0,1,
                1,1,
                1,0
            );

            indices.push(
                vertex,
                vertex+1,
                vertex+2,

                vertex,
                vertex+2,
                vertex+3
            );

            vertex+=4;

        }

    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );

    geometry.setIndex(indices);

    geometry.computeVertexNormals();

    return geometry;

}

/*
============================================================
WALL GEOMETRY

Only exposed sides are generated.
This greatly reduces polygons.
============================================================
*/

function makeWallGeometry(){

    const positions=[];
    const uvs=[];
    const indices=[];

    let vertex=0;

    function quad(
        ax,ay,az,
        bx,by,bz,
        cx,cy,cz,
        dx,dy,dz
    ){

        positions.push(
            ax,ay,az,
            bx,by,bz,
            cx,cy,cz,
            dx,dy,dz
        );

        uvs.push(
            0,0,
            1,0,
            1,1,
            0,1
        );

        indices.push(
            vertex,
            vertex+1,
            vertex+2,

            vertex,
            vertex+2,
            vertex+3
        );

        vertex+=4;

    }

    for(
        let y=0;
        y<mapHeight;
        y++
    ){

        for(
            let x=0;
            x<mapWidth;
            x++
        ){

            if(mapData[y][x]!=="wall")
                continue;

            const p=
                cellToWorld(x,y);

            const x0=p.x-TILE/2;
            const x1=p.x+TILE/2;
            const z0=p.z-TILE/2;
            const z1=p.z+TILE/2;

            /*
                FRONT
            */

            if(
                !insideMap(x,y+1) ||
                mapData[y+1][x]==="wall"
            ){

                quad(
                    x0,0,z1,
                    x1,0,z1,
                    x1,WALL_HEIGHT,z1,
                    x0,WALL_HEIGHT,z1
                );

            }

            /*
                BACK
            */

            if(
                !insideMap(x,y-1) ||
                mapData[y-1][x]==="wall"
            ){

                quad(
                    x1,0,z0,
                    x0,0,z0,
                    x0,WALL_HEIGHT,z0,
                    x1,WALL_HEIGHT,z0
                );

            }

            /*
                RIGHT
            */

            if(
                !insideMap(x+1,y) ||
                mapData[y][x+1]==="wall"
            ){

                quad(
                    x1,0,z1,
                    x1,0,z0,
                    x1,WALL_HEIGHT,z0,
                    x1,WALL_HEIGHT,z1
                );

            }

            /*
                LEFT
            */

            if(
                !insideMap(x-1,y) ||
                mapData[y][x-1]==="wall"
            ){

                quad(
                    x0,0,z0,
                    x0,0,z1,
                    x0,WALL_HEIGHT,z1,
                    x0,WALL_HEIGHT,z0
                );

            }

        }

    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );

    geometry.setIndex(indices);

    geometry.computeVertexNormals();

    return geometry;

}

function updateLights(dt){

    for(
        const item of lights
    ){

        /*

        */

        item.age+=dt;
        item.flicker-=dt;

        if(item.flicker<=0){

            item.flicker=
                .8+

                    .emissiveIntensity=.08;

                setTimeout(
                    ()=>{

                        if(!item.light)

                        item.light.intensity=

                        item.fixture.material
                            .emissiveIntensity=.75;

                    },
                    30+

                );

            }

        const pulse=

                item.age*2.1

/*
============================================================
COLLISION
============================================================
*/

function collides(x,z,r=.4){

    const c=
        worldToCell(
            x,
            z
        );

    /*
        Check current cell and neighbors.

        Walls are handled directly from the map,
        avoiding thousands of collider objects.
    */

    for(let oy=-1;oy<=1;oy++){

        for(let ox=-1;ox<=1;ox++){

            const cx=c.x+ox;
            const cy=c.y+oy;

            if(
                !insideMap(cx,cy)
            )
                continue;

            if(
                mapData[cy][cx]!=="wall"
            )
                continue;

            const p=
                cellToWorld(
                    cx,
                    cy
                );

            const minX=
                p.x-TILE/2;

            const maxX=
                p.x+TILE/2;

            const minZ=
                p.z-TILE/2;

            const maxZ=
                p.z+TILE/2;

            const closestX=
                Math.max(
                    minX,
                    Math.min(x,maxX)
                );

            const closestZ=
                Math.max(
                    minZ,
                    Math.min(z,maxZ)
                );

            const dx=
                x-closestX;

            const dz=
                z-closestZ;

            if(
                dx*dx+
                dz*dz<
                r*r
            )
                return true;

        }

    }

    return false;

}

function playerOverHole(){

    const r=.30;

    const points=[
        [0,0],
        [r,0],
        [-r,0],
        [0,r],
        [0,-r]
    ];

    for(
        const p of points
    ){

        const c=
            worldToCell(
                player.position.x+p[0],
                player.position.z+p[1]
            );

        if(
            !isHole(c.x,c.y)
        )
            return false;

    }

    return true;

}

function updateHiding(){

    let closest=null;
    let distance=Infinity;

    for(
        const spot of hidingObjects
    ){

        const d=
            Math.hypot(
                player.position.x-spot.x,
                player.position.z-spot.z
            );

        if(d<distance){

            distance=d;
            closest=spot;

        }

    }

    const near=
        closest &&
        distance<2;

    hidden=
        !!(
            near &&
            crouching
        );

    document.getElementById(
        "hideIndicator"
    ).style.opacity=
        near&&!hidden
        ?"1"
        :"0";

    document.getElementById(
        "hiddenIndicator"
    ).style.opacity=
        hidden
        ?"1"
        :"0";

}

/*
============================================================
PLAYER UPDATE
============================================================
*/

function movePlayer(dx,dz){

    const nx=
        player.position.x+dx;

    const nz=
        player.position.z+dz;

    if(
        !collides(
            nx,
            player.position.z
        )
    ){

        player.position.x=nx;

    }

    if(
        !collides(
            player.position.x,
            nz
        )
    ){

        player.position.z=nz;

    }

}

function updatePlayer(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    if(falling){

        fallTimer+=dt;

        const p=
            Math.min(
                fallTimer/1.5,
                1
            );

        player.position.y=
            -p*5;

        camera.position.y=
            EYE_HEIGHT-
            p*1.5;

        camera.rotation.z=
            Math.sin(
                fallTimer*18
            )*.04;

        if(fallTimer>=1.5){

            die(
                "YOU FELL THROUGH THE FLOOR."
            );

        }

        return;

    }

    crouching=!!keys.c;

    let forward=0;
    let strafe=0;

    if(keys.w) forward++;
    if(keys.s) forward--;
    if(keys.d) strafe++;
    if(keys.a) strafe--;

    const length=
        Math.hypot(
            forward,
            strafe
        );

    if(length>0){

        forward/=length;
        strafe/=length;

        const sprint=
            keys.shift&&!crouching;

        let speed=
            sprint
            ?SPRINT_SPEED
            :WALK_SPEED;

        if(crouching)
            speed*=.55;

        if(
            sprint&&!grounded
        )
            speed=JUMP_SPRINT_SPEED;

        const sin=Math.sin(yaw);
        const cos=Math.cos(yaw);

        const dx=
            (
                strafe*cos-
                forward*sin
            )*
            speed*
            dt;

        const dz=
            (
                -forward*cos-
                strafe*sin
            )*
            speed*
            dt;

        movePlayer(
            dx,
            dz
        );

    }

    velocityY-=GRAVITY*dt;

    player.position.y+=
        velocityY*dt;

    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }else{

        grounded=false;

    }

    if(
        keys.spacePressed &&
        grounded &&
        !crouching
    ){

        velocityY=JUMP_SPEED;
        grounded=false;
        keys.spacePressed=false;

    }

    if(!keys.space)
        keys.spacePressed=false;

    const target=
        crouching
        ?CROUCH_HEIGHT
        :EYE_HEIGHT;

    camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            target,
            Math.min(dt*12,1)
        );

    updateHiding();
    checkHole();

}

/*
============================================================
ENTITY PATH
============================================================
*/

function findPath(start,goal){

    if(
        !isWalkable(start.x,start.y)||
        !isWalkable(goal.x,goal.y)
    )
        return [];

    const queue=[start];

    const visited=
        new Set();

    const parents=
        new Map();

    const key=
        p=>p.x+","+p.y;

    visited.add(key(start));

    const dirs=[
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
    ];

    let loops=0;

    while(
        queue.length &&
        loops++<5000
    ){

        const current=
            queue.shift();

        if(
            current.x===goal.x &&
            current.y===goal.y
        ){

            const result=[];

            let p=current;

            while(p){

                result.push(p);

                p=
                    parents.get(
                        key(p)
                    );

            }

            result.reverse();

            return result;

        }

        for(
            const d of dirs
        ){

            const next={
                x:current.x+d.x,
                y:current.y+d.y
            };

            const k=key(next);

            if(visited.has(k))
                continue;

            if(
                !isWalkable(
                    next.x,
                    next.y
                )
            )
                continue;

            visited.add(k);

            parents.set(
                k,
                current
            );

            queue.push(next);

        }

    }

    return [];

}

function updateEntityPath(){

    if(!entity)
        return;

    const start=
        worldToCell(
            entity.position.x,
            entity.position.z

    const goal=

            player.position.x,
            player.position.z
        );

    entityPath=
        findPath(
            start,
            goal
        );

    entityPathIndex=1;

}

/*
============================================================
ENTITY UPDATE
============================================================
*/

function updateEntity(dt){

    /*
        30 SECOND SPAWN DELAY
    */

    if(
        gameStarted &&
        !dead &&
        !entitySpawned
    ){

        entitySpawnTimer+=dt;

        if(
            entitySpawnTimer>=30
        ){

            spawnEntity();
            entitySpawned=true;

        }

        return;

    }

    if(
        !entity ||
        paused ||
        dead
    )
        return;

    entityPathTimer-=dt;

    if(entityPathTimer<=0){

        entityPathTimer=.35;

        updateEntityPath();

    }

    if(
        entityPath.length<=1
    )
        return;

    const cell=
        entityPath[
            Math.min(
                entityPathIndex,
                entityPath.length-1
            )
        ];

    const target=
        cellToWorld(
            cell.x,
            cell.y
        );

    let dx=
        target.x-
        entity.position.x;

    let dz=
        target.z-
        entity.position.z;

    const distance=
        Math.hypot(dx,dz);

    if(distance<.2){

        entityPathIndex++;

        return;

    }

    dx/=distance;
    dz/=distance;

    const speed=
        getEntitySpeed();

    const nx=
        entity.position.x+
        dx*speed*dt;

    const nz=
        entity.position.z+
        dz*speed*dt;

    if(
        !collides(
            nx,
            nz,
            .35
        )
    ){

        entity.position.x=nx;
        entity.position.z=nz;

    }

    /*
        Keep entity upright.
    */

    entity.position.y=3.25;

    /*
        Face camera.

        This keeps the entire image visible.
    */

    entity.rotation.y=
        Math.atan2(
            camera.position.x-
            entity.position.x,
            camera.position.z-
            entity.position.z
        );

    const distanceToPlayer=
        Math.hypot(
            player.position.x-
            entity.position.x,
            player.position.z-
            entity.position.z
        );

    if(
        distanceToPlayer<1.25 &&
        !hidden
    ){

        die(
            "SOMETHING FOUND YOU."
        );

    }

}

        );

    /*
        Makes distant audio quieter while
        still making the approach gradual.
    */

    target=
        Math.pow(
            target,
            1.65
        );

    /*
        Smooth audio ramp.
    */

    entityVolume=
        THREE.MathUtils.lerp(
            entityVolume,
            target,
            1-
            Math.pow(
                .0005,
                dt
            )
        );

    entityAudio.volume=
        THREE.MathUtils.clamp(
            entityVolume*.8,
            0,
            .8
        );

    if(
        audioStarted &&
        entityAudio.paused
    ){

        entityAudio
            .play()
            .catch(
                ()=>{}
            );

    }

}

/*
============================================================
MESSAGES
============================================================
*/

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.5;

}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";

    }

}

/*
============================================================
DEATH
============================================================
*/

function die(reason){

    if(dead)
        return;

    dead=true;

    document.getElementById(
        "deathText"
    ).textContent=reason;

    document.getElementById(
        "death"
    ).style.display="flex";

    entityAudio.pause();

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/*
============================================================
RESET
============================================================
*/

function resetGame(){

    player.position.set(
        playerSpawn.x,
        0,
        playerSpawn.z
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.position.y=
        EYE_HEIGHT;

    velocityY=0;
    grounded=true;

    falling=false;
    fallTimer=0;

    crouching=false;
    hidden=false;

    entitySpawnTimer=0;
    entitySpawned=false;

    if(entity){

        world.remove(entity);

        if(entity.geometry)
            entity.geometry.dispose();

        if(entity.material)
            entity.material.dispose();

        entity=null;

    }

    entityPath=[];
    entityPathIndex=0;
    entityPathTimer=0;

}

/*
============================================================
START
============================================================
*/

function startGame(){

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    gameStarted=true;
    paused=false;
    dead=false;

    gameTime=0;

    resetGame();

    entityAudio.currentTime=0;
    entityAudio.volume=0;
    audioStarted=false;

    /*
        Start the MP3 silently.

        It will remain silent until the entity
        actually spawns and approaches.
    */

    startEntityAudio();

    renderer.domElement
        .requestPointerLock()
        .catch(
            ()=>{}
        );

}

/*
============================================================
MENU
============================================================
*/

function returnToMenu(){

    gameStarted=false;
    paused=false;
    dead=false;

    entityAudio.pause();
    entityAudio.currentTime=0;

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }

}

/*
============================================================
PAUSE
============================================================
*/

function togglePause(){

    if(
        !gameStarted ||
        dead
    )
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ?"flex"
        :"none";

    if(paused){

        if(
            document.pointerLockElement
        )
            document.exitPointerLock();

    }else{

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    }

}

/*
============================================================
CONTROLS
============================================================
*/

function showControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="flex";

}

function hideControls(){

    document.getElementById(
        "controlsBox"
    ).style.display="none";

}

/*
============================================================
KEYBOARD
============================================================
*/

document.addEventListener(
    "keydown",
    event=>{

        const key=
            event.key.toLowerCase();

        keys[key]=true;

        if(
            event.code==="Space"
        ){

            event.preventDefault();

            keys.spacePressed=true;
            keys.space=true;

        }

        if(
            key==="escape"
        ){

            if(
                document.getElementById(
                    "controlsBox"
                ).style.display==="flex"
            ){

                hideControls();

                return;

            }

            if(gameStarted)
                togglePause();

        }

    }
);

document.addEventListener(
    "keyup",
    event=>{

        const key=
            event.key.toLowerCase();

        keys[key]=false;

        if(
            event.code==="Space"
        ){

            keys.space=false;

        }

    }
);

/*
============================================================
MOUSE
============================================================
*/

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !gameStarted ||
            paused ||
            dead ||
            document.pointerLockElement===null
        )
            return;

        yaw-=
            event.movementX*.0022;

        pitch-=
            event.movementY*.0018;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.43,
                1.43
            );

        player.rotation.y=yaw;
        camera.rotation.x=pitch;

    }
);

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(
            gameStarted &&
            !paused &&
            !dead
        ){

            renderer.domElement
                .requestPointerLock()
                .catch(
                    ()=>{}
                );

            startEntityAudio();

        }

    }
);

/*
============================================================
BUTTONS
============================================================
*/

document.getElementById(
    "startBtn"
).onclick=startGame;

document.getElementById(
    "menuControlsBtn"
).onclick=showControls;

document.getElementById(
    "pauseControlsBtn"
).onclick=showControls;

document.getElementById(
    "controlsBackBtn"
).onclick=hideControls;

document.getElementById(
    "resumeBtn"
).onclick=
    ()=>{

        paused=false;

        document.getElementById(
            "pause"
        ).style.display="none";

        renderer.domElement
            .requestPointerLock()
            .catch(
                ()=>{}
            );

    };

document.getElementById(
    "restartBtn"
).onclick=startGame;

document.getElementById(
    "retryBtn"
).onclick=startGame;

document.getElementById(
    "menuBtn"
).onclick=returnToMenu;

document.getElementById(
    "deathMenuBtn"
).onclick=returnToMenu;

/*
============================================================
DIFFICULTY
============================================================
*/

const difficultyButtons={

    easy:
        document.getElementById(
            "easyBtn"
        ),

    normal:
        document.getElementById(
            "normalBtn"
        ),

    hard:
        document.getElementById(
            "hardBtn"
        ),

    nightmare:
        document.getElementById(
            "nightmareBtn"
        )

};

function selectDifficulty(value){

    difficulty=value;

    for(
        const name in difficultyButtons
    ){

        difficultyButtons[name]
            .classList.toggle(
                "selected",
                name===value
            );

    }

    document.getElementById(
        "difficultyHud"
    ).textContent=
        value.toUpperCase();

}

for(
    const name in difficultyButtons
){

    difficultyButtons[name].onclick=
        ()=>selectDifficulty(name);

}

/*
============================================================
MENU SLIDESHOW
============================================================
*/

const menuImages=
    document.querySelectorAll(
        ".menuImage"
    );

let menuIndex=0;

setInterval(
    ()=>{

        if(!menuImages.length)
            return;

        menuImages[
            menuIndex
        ].classList.remove(
            "active"
        );

        menuIndex=
            (
                menuIndex+1
            )%
            menuImages.length;

        menuImages[
            menuIndex
        ].classList.add(
            "active"
        );

    },
    6000
);

/*
============================================================
TAPE TIMER
============================================================
*/

function updateTapeTime(dt){

    if(
        !gameStarted ||
        paused ||
        dead
    )
        return;

    gameTime+=dt;

    const total=
        Math.floor(gameTime);

    const h=
        Math.floor(total/3600);

    const m=
        Math.floor(
            (total%3600)/60
        );

    const s=
        total%60;

    const pad=
        n=>String(n).padStart(2,"0");

    document.getElementById(
        "tapeTime"
    ).textContent=
        pad(h)+":"+
        pad(m)+":"+
        pad(s);

}

/*
============================================================
GAME LOOP
============================================================
*/

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .033
        );

    updatePlayer(dt);
    updateEntity(dt);
    updateEntityAudio(dt);
    updateLights(dt);
    updateMessage(dt);
    updateTapeTime(dt);

    renderer.render(
        scene,
        camera
    );

}

animate();

/*
============================================================
RESIZE
============================================================
*/

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

/*
============================================================
INITIALIZATION
============================================================
*/

async function initialize(){

    const loading=
        document.getElementById(
            "loading"
        );

    const progress=
        document.getElementById(
            "loadingProgress"
        );

    try{

        console.log(
            "=============================="
        );

        console.log(
            "BACKROOMS STARTING"
        );

        console.log(
            "=============================="
        );

        /*
            Load the THREE textures FIRST.
        */

        progress.style.width="10%";

        floorTexture=
            await loadTexture(
                "./textures/floor.png"
            );

        progress.style.width="25%";

        wallTexture=
            await loadTexture(
                "./textures/wall.png"
            );

        progress.style.width="40%";

        ceilingTexture=
            await loadTexture(
                "./textures/ceiling.png"
            );

        progress.style.width="55%";

        createMaterials();

        /*
            Load map.
        */

        await loadMap();

        progress.style.width="70%";

        /*
            Build combined meshes.
        */

        buildTexturedWorld();

        progress.style.width="82%";

        /*
            Holes.
        */

        for(
            const h of holeCells
        ){

            addHole(
                h.x,
                h.y
            );

        }

        /*
            Lockers.
        */

        for(
            const h of hideCells
        ){

            const p=
                cellToWorld(
                    h.x,
                    h.y
                );

            addLocker(
                p.x,
                p.z
            );

        }

        /*
            Lights.
        */

        buildLights();

        progress.style.width="90%";

        /*
            Entity image is optional.

            If it fails, the game still loads.
        */

        await loadEntityTexture();

        entityAudio.load();

        progress.style.width="100%";

        console.log(
            "=============================="
        );

        console.log(
            "BACKROOMS READY"
        );

        console.log(
            "FLOOR TEXTURE:",
            floorTexture?.image
        );

        console.log(
            "WALL TEXTURE:",
            wallTexture?.image
        );

        console.log(
            "CEILING TEXTURE:",
            ceilingTexture?.image
        );

        console.log(
            "MAP:",
            mapWidth,
            "x",
            mapHeight
        );

        console.log(
            "ENTITY SPAWN DELAY: 30 SECONDS"
        );

        console.log(
            "=============================="
        );

        /*
            Give the loading screen a moment
            to finish visually.
        */

        setTimeout(
            ()=>{
                loading.style.display="none";
            },
            300
        );

    }catch(error){

        console.error(
            "BACKROOMS ERROR:",
            error
        );

        loading.style.display="none";

        const box=
            document.getElementById(
                "error"
            );

        box.style.display="block";

        box.textContent=
            "BACKROOMS ERROR\n\n"+
            (
                error.stack||
                error.message||
                String(error)
            );

    }

}

initialize();

</script>
