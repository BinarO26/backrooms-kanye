<script src="./three.min.js"></script>

<script>
"use strict";

/* =========================================================
   THREE CHECK
========================================================= */

if(!window.THREE){

    const error=document.getElementById("error");

    error.style.display="block";

    error.textContent=
        "THREE.JS FAILED TO LOAD.\n\n"+
        "GitHub Pages is looking for:\n"+
        "./three.min.js\n\n"+
        "Make sure three.min.js is in the SAME folder as index.html.\n\n"+
        "The filename must be exactly:\n"+
        "three.min.js";

    throw new Error("Local Three.js failed to load.");
}


/* =========================================================
   SCENE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x17150e);

scene.fog=new THREE.FogExp2(
    0x17150e,
    0.020
);


/* =========================================================
   CAMERA
========================================================= */

const camera=new THREE.PerspectiveCamera(
    78,
    innerWidth/innerHeight,
    .025,
    500
);

camera.rotation.order="YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio||1,
        1.35
    )
);

if("outputColorSpace" in renderer){
    renderer.outputColorSpace=
        THREE.SRGBColorSpace;
}

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=.72;

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   BASE LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffe8a0,
        .045
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xffd978,
        0x020202,
        .075
    )
);


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader=
    new THREE.TextureLoader();

let wallTexture=null;
let floorTexture=null;
let ceilingTexture=null;

function prepareTexture(texture){

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.magFilter=
        THREE.LinearFilter;

    texture.minFilter=
        THREE.LinearMipmapLinearFilter;

    texture.anisotropy=
        Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            8
        );

    texture.needsUpdate=true;

    return texture;
}

function loadTexture(path){

    return new Promise(resolve=>{

        textureLoader.load(

            path,

            texture=>{
                console.log(
                    "TEXTURE LOADED:",
                    path
                );

                resolve(
                    prepareTexture(texture)
                );
            },

            undefined,

            error=>{

                console.error(
                    "TEXTURE FAILED:",
                    path,
                    error
                );

                resolve(null);
            }
        );
    });
}

async function loadTextures(){

    wallTexture=
        await loadTexture(
            "./textures/wall.png"
        );

    floorTexture=
        await loadTexture(
            "./textures/floor.png"
        );

    ceilingTexture=
        await loadTexture(
            "./textures/ceiling.png"
        );

    const missing=[];

    if(!wallTexture)
        missing.push(
            "./textures/wall.png"
        );

    if(!floorTexture)
        missing.push(
            "./textures/floor.png"
        );

    if(!ceilingTexture)
        missing.push(
            "./textures/ceiling.png"
        );

    if(missing.length){

        const error=
            document.getElementById("error");

        error.style.display="block";

        error.textContent=
            "TEXTURE FILES NOT FOUND.\n\n"+
            missing.join("\n")+
            "\n\n"+
            "Your GitHub repository should look like:\n\n"+
            "index.html\n"+
            "three.min.js\n"+
            "textures/\n"+
            "    wall.png\n"+
            "    floor.png\n"+
            "    ceiling.png\n"+
            "    menu.jpg\n"+
            "    menu2.jpg\n"+
            "    menu3.jpg\n"+
            "    menu4.jpg\n"+
            "    menu5.jpg";
    }
}


/* =========================================================
   WORLD MANAGEMENT
========================================================= */

let worldObjects=[];
let wallColliders=[];
let deathHoles=[];
let lights=[];

function addWorldObject(object){

    scene.add(object);

    worldObjects.push(object);

    return object;
}

function disposeMaterial(material){

    if(!material)
        return;

    if(Array.isArray(material)){

        material.forEach(
            disposeMaterial
        );

        return;
    }

    /*
       Do NOT dispose the original
       global textures.
    */

    material.dispose();
}

function clearWorld(){

    for(const object of worldObjects){

        scene.remove(object);

        object.traverse?.(
            child=>{

                if(child.geometry)
                    child.geometry.dispose();

                if(child.material)
                    disposeMaterial(
                        child.material
                    );
            }
        );
    }

    worldObjects=[];
    wallColliders=[];
    deathHoles=[];
    lights=[];

    if(exitLight){

        scene.remove(exitLight);

        exitLight=null;
    }

    exitObject=null;
    entity=null;
}


/* =========================================================
   WALL TEXTURE MATERIAL
========================================================= */

function wallMaterial(
    repeatX,
    repeatY=1
){

    if(!wallTexture){

        return new THREE.MeshStandardMaterial({

            color:0x9b913c,

            roughness:.92,
            metalness:0,

            side:THREE.DoubleSide
        });
    }

    const texture=
        wallTexture.clone();

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(
        repeatX,
        repeatY
    );

    texture.needsUpdate=true;

    return new THREE.MeshStandardMaterial({

        map:texture,

        color:0xffffff,

        roughness:.95,
        metalness:0,

        side:THREE.DoubleSide
    });
}


/* =========================================================
   WALL
========================================================= */

function createWall(
    x,
    z,
    width,
    depth=.32
){

    const height=3.1;

    wallColliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minZ:z-depth/2,
        maxZ:z+depth/2,

        minY:0,
        maxY:height
    });

    /*
       Four real faces.

       This avoids the old issue where large
       planes could appear invisible from
       particular directions.
    */

    const group=new THREE.Group();

    const front=new THREE.Mesh(
        new THREE.PlaneGeometry(
            width,
            height
        ),
        wallMaterial(
            Math.max(width/4,1),
            1
        )
    );

    front.position.z=
        depth/2;

    front.position.y=
        height/2;

    group.add(front);


    const back=new THREE.Mesh(
        new THREE.PlaneGeometry(
            width,
            height
        ),
        wallMaterial(
            Math.max(width/4,1),
            1
        )
    );

    back.rotation.y=
        Math.PI;

    back.position.z=
        -depth/2;

    back.position.y=
        height/2;

    group.add(back);


    const left=new THREE.Mesh(
        new THREE.PlaneGeometry(
            depth,
            height
        ),
        wallMaterial(
            1,
            1
        )
    );

    left.rotation.y=
        Math.PI/2;

    left.position.x=
        -width/2;

    left.position.y=
        height/2;

    group.add(left);


    const right=new THREE.Mesh(
        new THREE.PlaneGeometry(
            depth,
            height
        ),
        wallMaterial(
            1,
            1
        )
    );

    right.rotation.y=
        -Math.PI/2;

    right.position.x=
        width/2;

    right.position.y=
        height/2;

    group.add(right);


    group.position.set(
        x,
        0,
        z
    );

    group.traverse(child=>{

        if(child.isMesh){

            child.castShadow=true;
            child.receiveShadow=true;
        }
    });

    addWorldObject(group);
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor(){

    let material;

    if(floorTexture){

        const texture=
            floorTexture.clone();

        texture.wrapS=
            THREE.RepeatWrapping;

        texture.wrapT=
            THREE.RepeatWrapping;

        /*
           Smaller repeat values make the texture
           look like actual carpet instead of
           one enormous stretched image.
        */

        texture.repeat.set(
            75,
            75
        );

        texture.needsUpdate=true;

        material=
            new THREE.MeshStandardMaterial({

                map:texture,

                color:0xffffff,

                roughness:1,
                metalness:0
            });

    }else{

        material=
            new THREE.MeshStandardMaterial({

                color:0x776b2c,

                roughness:1
            });
    }

    const floor=new THREE.Mesh(
        new THREE.PlaneGeometry(
            260,
            230
        ),
        material
    );

    floor.rotation.x=
        -Math.PI/2;

    floor.receiveShadow=true;

    addWorldObject(floor);
}


/* =========================================================
   CEILING
========================================================= */

function createCeiling(){

    let material;

    if(ceilingTexture){

        const texture=
            ceilingTexture.clone();

        texture.wrapS=
            THREE.RepeatWrapping;

        texture.wrapT=
            THREE.RepeatWrapping;

        texture.repeat.set(
            86,
            76
        );

        texture.needsUpdate=true;

        material=
            new THREE.MeshStandardMaterial({

                map:texture,

                color:0xffffff,

                roughness:.88,
                metalness:0,

                side:THREE.DoubleSide
            });

    }else{

        material=
            new THREE.MeshStandardMaterial({

                color:0x5e5938,

                roughness:1,

                side:THREE.DoubleSide
            });
    }

    const ceiling=new THREE.Mesh(
        new THREE.PlaneGeometry(
            260,
            230
        ),
        material
    );

    ceiling.rotation.x=
        Math.PI/2;

    ceiling.position.y=
        3.1;

    ceiling.receiveShadow=true;

    addWorldObject(ceiling);
}


/* =========================================================
   BACKROOMS MAP
========================================================= */

function buildFloorPlan(){

    /*
       OUTER SHELL

       These are actual walls, not an invisible
       boundary. The player can see the same
       yellow wall texture around the perimeter.
    */

    createWall(0,-111,220,.4);
    createWall(0,111,220,.4);
    createWall(-110,0,.4,222);
    createWall(110,0,.4,222);

    /*

    createWall(-94,-34,.35,29);

    createWall(-51,-35,.35,22);

    /*

    createWall(-91,15,31);

    createWall(5,15,24);
    createWall(34,15,27);

    /*

    */

    createWall(-79,33,.35,31);

    /*

    createWall(-91,57,25);
    createWall(-62,57,19);

    createWall(-4,57,20);

    createWall(-36,82,18);
    createWall(-12,77,29);

function createPillar(x,z){

    const size=.7;
    const height=3.1;

    const material=
        wallMaterial(.7,1);

    const pillar=new THREE.Mesh(
        new THREE.BoxGeometry(
            size,
            height,
            size
        ),
        material
    );

    pillar.position.set(
        x,
        height/2,
        z
    );

    pillar.castShadow=true;
    pillar.receiveShadow=true;

    wallColliders.push({

        minX:x-size/2,
        maxX:x+size/2,

        minZ:z-size/2,
        maxZ:z+size/2,

        minY:0,
        maxY:height
    });

    addWorldObject(pillar);
}

   HOLES
========================================================= */

function createHoleRoom(){

    const startX=-52;
    const startZ=60;

    const columns=14;
    const rows=7;
    const spacing=3.6;

    for(let z=0;z<rows;z++){

        for(let x=0;x<columns;x++){

            if((x+z)%5===0)
                continue;

            const px=
                startX+x*spacing;

            const pz=
                startZ+z*spacing;

            const hole=new THREE.Mesh(

                new THREE.PlaneGeometry(
                    2.6,
                    2.6
                ),

                new THREE.MeshBasicMaterial({

                    color:0x010101,

                    side:THREE.DoubleSide
                })
            );

            hole.rotation.x=
                -Math.PI/2;

            hole.position.set(
                px,
                .008,
                pz
            );

            addWorldObject(hole);

            deathHoles.push({
                x:px,
                z:pz,
                radius:1.25
            });
        }
    }
}

function addLight(
    x,
    z,
    intensity=4,
    flicker=false
){

    /*
       Fixture NEVER disappears.

       Only the actual illumination changes.
    */

    const fixture=new THREE.Mesh(

        new THREE.BoxGeometry(
            1.25,
            .055,
            1.25
        ),

        new THREE.MeshBasicMaterial({
            color:0xfff2c0
        })
    );

    fixture.position.set(
        x,
        3.045,
        z
    );

    addWorldObject(fixture);


    const light=new THREE.PointLight(
        0xffdca0,
        intensity,
        13,
        1.8
    );

    light.position.set(
        x,
        2.65,
        z
    );

    light.castShadow=true;

    light.shadow.mapSize.width=256;
    light.shadow.mapSize.height=256;

    light.shadow.camera.near=.1;
    light.shadow.camera.far=14;

    scene.add(light);


    lights.push({

        light,
        fixture,

        flicker,

        timer:
            Math.random()*2,

        base:intensity
    });
}


function buildLighting(){

    /*
       Regular fluorescent grid.
    */

    for(
        let x=-96;
        x<=96;
        x+=12
    ){

        for(
            let z=-96;
            z<=96;
            z+=12
        ){

            /*
               Some missing lights create the
               dark horror-game areas.
            */

            if(Math.random()<.18)
                continue;

            addLight(

                x+
                (Math.random()-.5)*2,

                z+
                (Math.random()-.5)*2,

                2.8+
                Math.random()*1.5,

                Math.random()<.15
            );
        }
    }


    /*
       Important areas.
    */

    addLight(-18,-64,5.2);
    addLight(20,-64,4.8);
    addLight(42,-9,5);
    addLight(5,18,5.2);
    addLight(30,58,5.2);

    /*
       More unreliable lights.
    */

    addLight(-55,60,2,true);
    addLight(-28,72,2,true);
    addLight(2,60,1.7,true);
    addLight(62,75,1.9,true);
}


function updateLights(dt){

    for(const item of lights){

        if(!item.flicker)
            continue;

        item.timer-=dt;

        if(item.timer<=0){

            item.timer=
                .08+
                Math.random()*.65;

            /*
               Fixture stays visible.
            */

            const amount=
                Math.random()<.22
                    ? .12
                    : .55+
                      Math.random()*.55;

            item.light.intensity=
                item.base*amount;
        }
    }
}

/* =========================================================
   COLLISION
========================================================= */

function collides(x,z){

    const bottom=
        player.position.y;

    const top=
        bottom+
        PLAYER_HEIGHT;

    for(const wall of wallColliders){

        if(
            top<=wall.minY||
            bottom>=wall.maxY
        )
            continue;

        const closestX=
            Math.max(
                wall.minX,
                Math.min(x,wall.maxX)
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(z,wall.maxZ)
            );

        const dx=
            x-closestX;

        const dz=
            z-closestZ;

        if(
            dx*dx+
            dz*dz<
            PLAYER_RADIUS*
            PLAYER_RADIUS
        )
            return true;
    }

    return false;
}


function entityHitsWall(x,z){

    for(const wall of wallColliders){

        const closestX=
            Math.max(
                wall.minX,
                Math.min(x,wall.maxX)
            );

        const closestZ=
            Math.max(
                wall.minZ,
                Math.min(z,wall.maxZ)
            );

        const dx=
            x-closestX;

        const dz=
            z-closestZ;

        if(
            dx*dx+
            dz*dz<
            .43*.43
        )
            return true;
    }

    return false;
}


function blocked(
    x1,
    z1,
    x2,
    z2
){

    const dx=x2-x1;
    const dz=z2-z1;

    const distance=
        Math.hypot(dx,dz);

    const steps=
        Math.ceil(distance/.35);

    for(let i=1;i<steps;i++){

        const t=i/steps;

        if(
            entityHitsWall(
                x1+dx*t,
                z1+dz*t
            )
        )
            return true;
    }

    return false;
}


/* =========================================================
   HOLES
========================================================= */

function playerInHole(){

    for(const hole of deathHoles){

        const dx=
            player.position.x-hole.x;

        const dz=
            player.position.z-hole.z;

        if(
            dx*dx+
            dz*dz<
            hole.radius*
            hole.radius
        )
            return true;
    }

    return false;
}

let lastSeen=99;

let wanderAngle=0;

/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(dt){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    )
        return;


    const settings=
        SETTINGS[difficulty];


    const dx=
        player.position.x-
        entity.position.x;

    const dz=
        player.position.z-
        entity.position.z;

    const distance=
        Math.hypot(dx,dz);


    lastSeen+=dt;


    const visible=
        distance<
        settings.detection&&
        !blocked(
            entity.position.x,
            entity.position.z,
            player.position.x,
            player.position.z
        );


    let dx2=0;
    let dz2=0;


    if(visible){

        lastKnown.set(
            player.position.x,
            player.position.z
        );

        lastSeen=0;


        dx2=
            dx/
            Math.max(distance,.001);

        dz2=
            dz/
            Math.max(distance,.001);

    }else if(lastSeen<3.2){

        const lx=
            lastKnown.x-
            entity.position.x;

        const lz=
            lastKnown.y-
            entity.position.z;

        const len=
            Math.hypot(lx,lz);

        if(len>.1){

            dx2=lx/len;
            dz2=lz/len;
        }

    }else{

        wanderTimer-=dt;

        if(wanderTimer<=0){

            wanderTimer=
                .5+
                Math.random()*1.8;

            wanderAngle=
                Math.random()*
                Math.PI*2;
        }

        dx2=
            Math.cos(wanderAngle);

        dz2=
            Math.sin(wanderAngle);
    }


    const targetAngle=
        Math.atan2(dz2,dx2);

    const currentAngle=
        Math.atan2(
            entityDirection.y,
            entityDirection.x
        );


    let difference=
        targetAngle-currentAngle;


    while(difference>Math.PI)
        difference-=Math.PI*2;

    while(difference<-Math.PI)
        difference+=Math.PI*2;


    difference=
        Math.max(
            -3.4*dt,
            Math.min(
                3.4*dt,
                difference
            )
        );


    const angle=
        currentAngle+
        difference;


    entityDirection.x=
        Math.cos(angle);

    entityDirection.y=
        Math.sin(angle);


    entityVelocity.x=
        THREE.MathUtils.lerp(
            entityVelocity.x,
            entityDirection.x*
            settings.speed,
            Math.min(1,dt*4)
        );

    entityVelocity.y=
        THREE.MathUtils.lerp(
            entityVelocity.y,
            entityDirection.y*
            settings.speed,
            Math.min(1,dt*4)
        );


    const moveX=
        entityVelocity.x*dt;

    const moveZ=
        entityVelocity.y*dt;


    const nextX=
        entity.position.x+moveX;

    const nextZ=
        entity.position.z+moveZ;


    /*
       JUKING / WALL AVOIDANCE
    */

    if(
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ){

        entity.position.x=nextX;

    }else{

        entityVelocity.x=0;

        wanderAngle+=
            Math.PI/2;

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }


    if(
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ){

        entity.position.z=nextZ;

    }else{

        entityVelocity.y=0;

        wanderAngle+=
            Math.PI/2;

        entityDirection.set(
            Math.cos(wanderAngle),
            Math.sin(wanderAngle)
        );
    }


    /*
       Billboard toward player.
    */

    entity.rotation.y=
        Math.atan2(
            player.position.x-
            entity.position.x,

            player.position.z-
            entity.position.z
        );


    const killDistance=
        difficulty==="nightmare"
            ?1.55
            :1.25;


    if(distance<killDistance)
        killPlayer();
}


/* =========================================================
   ENTITY AUDIO
========================================================= */

function updateEntityAudio(){

    if(
        !entity||
        !running||
        paused||
        dead||
        fallingIntoLevel
    ){

        entityAudio.volume=0;

        return;
    }


    const distance=
        Math.hypot(

            entity.position.x-
            player.position.x,

            entity.position.z-
            player.position.z
        );


    const maxDistance=34;


    if(distance>=maxDistance){

        entityAudio.volume=0;

        return;
    }


    let volume=
        Math.pow(
            1-
            distance/maxDistance,
            1.6
        )*.9;


    if(
        blocked(
            player.position.x,
            player.position.z,
            entity.position.x,
            entity.position.z
        )
    ){

        volume*=.2;
    }


    entityAudio.volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            .9
        );


    if(
        entityAudio.paused&&
        volume>.01
    ){

        entityAudio.play().catch(
            ()=>{}
        );
    }
}

   INPUT

const keys={

    w:false,
    a:false,
    s:false,
    d:false,
    shift:false
};

let jumpPressed=false;


addEventListener(
    "keydown",
    event=>{

        /*
           FIXED:
           W = forward
           S = backward
        */

        if(event.code==="KeyW")
            keys.w=true;

        if(event.code==="KeyS")
            keys.s=true;

        if(event.code==="KeyA")
            keys.a=true;

        if(event.code==="KeyD")
            keys.d=true;

        if(
            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        )
            keys.shift=true;


        if(
            event.code==="Space"&&
            !event.repeat
        )
            jumpPressed=true;


        if(
            event.code==="Escape"&&
            running&&
            !dead&&
            !fallingIntoLevel
        )
            togglePause();
    }
);


addEventListener(
    "keyup",
    event=>{

        if(event.code==="KeyW")
            keys.w=false;

        if(event.code==="KeyS")
            keys.s=false;

        if(event.code==="KeyA")
            keys.a=false;

        if(event.code==="KeyD")
            keys.d=false;

        if(
            event.code==="ShiftLeft"||
            event.code==="ShiftRight"
        )
            keys.shift=false;
    }
);


/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event=>{

        if(
            !running||
            paused||
            dead||
            fallingIntoLevel
        )
            return;

        if(
            document.pointerLockElement!==
            document.body
        )
            return;


        yaw-=
            event.movementX*.0022;

        pitch-=
            event.movementY*.0018;


        pitch=
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );


        player.rotation.y=yaw;
        camera.rotation.x=pitch;
    }
);


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

    if(fallingIntoLevel){

        updateFall(dt);

        return;
    }


    /*
       W = +forward
       S = -forward

       Camera forward direction:
       +X = sin(yaw)
       -Z = cos(yaw)

       This is intentionally explicit so W/S
       cannot accidentally become reversed.
    */

    let forward=0;
    let side=0;


    if(keys.w)
        forward+=1;

    if(keys.s)
        forward-=1;

    if(keys.d)
        side+=1;

    if(keys.a)
        side-=1;


    const length=
        Math.hypot(
            forward,
            side
        );


    if(length){

        forward/=length;
        side/=length;
    }


    let speed=
        keys.shift
            ?5.9
            :3.5;


    if(difficulty==="easy")
        speed=
            keys.shift
                ?6.1
                :3.8;

    if(difficulty==="hard")
        speed=
            keys.shift
                ?6.3
                :3.4;

    if(difficulty==="nightmare")
        speed=
            keys.shift
                ?6.5
                :3.25;


    const sin=Math.sin(yaw);
    const cos=Math.cos(yaw);


    /*
       FORWARD:
       X = +sin
       Z = -cos

       BACKWARD:
       X = -sin
       Z = +cos
    */

    const dx=
        (
            forward*sin+
            side*cos
        )*
        speed*
        dt;

    const dz=
        (
            -forward*cos+
            side*sin
        )*
        speed*
        dt;


    const nextX=
        player.position.x+dx;

    const nextZ=
        player.position.z+dz;


    if(
        !collides(
            nextX,
            player.position.z
        )
    )
        player.position.x=nextX;


    if(
        !collides(
            player.position.x,
            nextZ
        )
    )
        player.position.z=nextZ;


    if(
        jumpPressed&&
        grounded
    ){

        velocityY=6.2;
        grounded=false;
    }


    jumpPressed=false;


    velocityY-=20*dt;

    player.position.y+=
        velocityY*dt;


    if(player.position.y<=0){

        player.position.y=0;

        velocityY=0;

        grounded=true;
    }


    if(playerInHole()){

        killPlayer(
            "YOU FELL INTO THE FLOOR."
        );

        return;
    }


    checkExit();
}


/* =========================================================
   FALLING INTRO
========================================================= */

function updateFall(dt){

    fallTimer+=dt;

    const progress=
        Math.min(
            fallTimer/FALL_DURATION,
            1
        );

    const eased=
        1-
        Math.pow(
            1-progress,
            3
        );


    player.position.y=
        17-
        17*eased;


    camera.position.y=
        EYE_HEIGHT;


    camera.rotation.x=
        THREE.MathUtils.lerp(
            -.32,
            0,
            Math.min(
                progress*1.3,
                1
            )
        );


    camera.rotation.z=
        Math.sin(
            progress*
            Math.PI*
            9
        )*.025;


    if(progress>=1){

        fallingIntoLevel=false;

        player.position.y=0;

        camera.position.set(
            0,
            EYE_HEIGHT,
            0
        );

        camera.rotation.x=0;
        camera.rotation.z=0;

        document.body.requestPointerLock();
    }
}


/* =========================================================
   CAMERA MOTION
========================================================= */

let cameraTime=0;

function updateCamera(dt){

    if(fallingIntoLevel)
        return;


    cameraTime+=dt;


    const moving=
        keys.w||
        keys.a||
        keys.s||
        keys.d;


    const amount=
        moving
            ?.012
            :.003;


    camera.position.x=
        Math.sin(
            cameraTime*3.4
        )*amount;


    camera.position.y=
        EYE_HEIGHT+
        Math.sin(
            cameraTime*4.1
        )*amount;


    camera.position.z=
        Math.cos(
            cameraTime*3.1
        )*amount*.55;


    camera.rotation.z=
        Math.sin(
            cameraTime*.9
        )*.004;


    /*
       Security camera micro-jitters.
    */

    if(Math.random()<.009){

        camera.position.x+=
            (
                Math.random()-.5
            )*.045;

        camera.position.y+=
            (
                Math.random()-.5
            )*.035;

        camera.rotation.z+=
            (
                Math.random()-.5
            )*.035;
    }
}


/* =========================================================
   HORROR CAMERA GLITCHES
========================================================= */

let glitchTimer=0;

function updateCameraEffects(dt){

    glitchTimer-=dt;

    const staticLayer=
        document.querySelector(
            ".camStatic"
        );

    if(glitchTimer<=0){

        glitchTimer=
            2+
            Math.random()*8;

        if(Math.random()<.35){

            staticLayer.style.opacity=
                String(
                    .08+
                    Math.random()*.16
                );

            setTimeout(
                ()=>{
                    staticLayer.style.opacity="0";
                },
                60+
                Math.random()*140
            );
        }
    }
}


/* =========================================================
   EXIT
========================================================= */

function checkExit(){

    if(!exitObject||dead)
        return;


    const distance=
        Math.hypot(

            player.position.x-
            exitX,

            player.position.z-
            exitZ
        );


    if(distance<1.8)
        winGame();
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=0;

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;

    messageTimer=2.2;
}

function updateMessage(dt){

    if(messageTimer<=0)
        return;

    messageTimer-=dt;

    if(messageTimer<=0){

        document.getElementById(
            "message"
        ).textContent="";
    }
}


/* =========================================================
   DEATH
========================================================= */

function killPlayer(
    reason="THE BACKROOMS GOT YOU"
){

    if(dead||!running)
        return;


    dead=true;

    fallingIntoLevel=false;


    entityAudio.pause();
    entityAudio.volume=0;


    if(document.pointerLockElement)
        document.exitPointerLock();


    document.getElementById(
        "deathTitle"
    ).textContent=
        "YOU DIED";


    document.getElementById(
        "deathTitle"
    ).className="";


    document.getElementById(
        "deathText"
    ).textContent=reason;


    document.getElementById(
        "retryBtn"
    ).textContent="RETRY";


    document.getElementById(
        "death"
    ).style.display="flex";
}


/* =========================================================
   WIN
========================================================= */

function winGame(){

    if(dead||!running)
        return;


    dead=true;


    entityAudio.pause();
    entityAudio.volume=0;


    if(document.pointerLockElement)
        document.exitPointerLock();


    document.getElementById(
        "deathTitle"
    ).textContent=
        "YOU ESCAPED";


    document.getElementById(
        "deathTitle"
    ).className="win";


    document.getElementById(
        "deathText"
    ).textContent=
        "YOU FOUND THE EXIT";


    document.getElementById(
        "retryBtn"
    ).textContent=
        "PLAY AGAIN";


    document.getElementById(
        "death"
    ).style.display=
        "flex";
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(
        !running||
        dead||
        fallingIntoLevel
    )
        return;


    paused=!paused;


    document.getElementById(
        "pause"
    ).style.display=
        paused
            ?"flex"
            :"none";


    if(paused){

        if(document.pointerLockElement)
            document.exitPointerLock();

    }else{

        document.body.requestPointerLock();
    }
}


/* =========================================================
   MENU
========================================================= */

function returnToMenu(){

    running=false;
    paused=false;
    dead=false;
    fallingIntoLevel=false;


    entityAudio.pause();
    entityAudio.volume=0;


    if(document.pointerLockElement)
        document.exitPointerLock();


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display="none";


    document.getElementById(
        "death"
    ).style.display="none";


    document.getElementById(
        "menu"
    ).style.display="block";
}


/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    if(
        !wallTexture||
        !floorTexture||
        !ceilingTexture
    ){

        await loadTextures();
    }


    clearWorld();


    player.position.set(
        -96,
        17,
        -101
    );


    yaw=0;
    pitch=-.28;

    velocityY=0;
    grounded=false;


    createFloor();
    createCeiling();

    buildFloorPlan();
    createHoleRoom();
    createExit();
    buildLighting();

    await createEntity();


    entity.position.set(
        55,
        .775,
        -48
    );


    entityDirection.set(
        1,
        0
    );

    entityVelocity.set(
        0,
        0
    );

    lastSeen=99;


    running=true;
    paused=false;
    dead=false;

    fallingIntoLevel=true;

    fallTimer=0;

    recordingTime=0;


    document.getElementById(
        "menu"
    ).style.display="none";


    document.getElementById(
        "pause"
    ).style.display="none";


    document.getElementById(
        "death"
    ).style.display="none";


    camera.position.set(
        0,
        EYE_HEIGHT,
        0
    );


    camera.rotation.x=pitch;
    camera.rotation.z=0;

    player.rotation.y=yaw;


    showMessage(
        "ENTERING LEVEL 0..."
    );
}


/* =========================================================
   DIFFICULTY
========================================================= */

function setDifficulty(value){

    difficulty=value;


    document
        .querySelectorAll(
            ".menuDifficulty button"
        )
        .forEach(
            button=>
                button.classList.remove(
                    "selected"
                )
        );


    const id=

    ).classList.add("selected");

}


document.getElementById(

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    ()=>{

        if(
            running&&
            !paused&&
            !dead&&
            !fallingIntoLevel&&
            document.pointerLockElement!==
            document.body
        ){

            document.body.requestPointerLock();
        }
    }
);


/* =========================================================
   MENU IMAGES
========================================================= */

const menuImages=
    Array.from(
        document.querySelectorAll(
            ".menuImage"
        )
    );

let menuIndex=0;

function cycleMenuImage(){

    if(!menuImages.length)
        return;


    menuImages[
        menuIndex
    ].classList.remove("active");


    menuIndex=
        (
            menuIndex+1
        )%
        menuImages.length;


    menuImages[
        menuIndex
    ].classList.add("active");
}

setInterval(
    cycleMenuImage,
    60000
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio||1,
                1.35
            )
        );
    }
);


/* =========================================================
   TIMER
========================================================= */

const clock=
    new THREE.Clock();

let recordingTime=0;

function updateTimer(dt){

    if(!running||paused)
        return;


    recordingTime+=dt;


    const total=
        Math.floor(
            recordingTime
        );


    const hours=
        Math.floor(
            total/3600
        );

    const minutes=
        Math.floor(
            (total%3600)/60
        );

    const seconds=
        total%60;


    const format=
        n=>
            String(n)
                .padStart(2,"0");


    document.getElementById(
        "tapeTime"
    ).textContent=
        `${format(hours)}:`+
        `${format(minutes)}:`+
        `${format(seconds)}`;
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running&&
        !paused&&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateLights(dt);

        updateCamera(dt);

        updateCameraEffects(dt);

        updateEntityAudio();

        updateMessage(dt);

        updateTimer(dt);

    }else{

        updateEntityAudio();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIALIZE
========================================================= */

loadTextures();

animate();

</script>
