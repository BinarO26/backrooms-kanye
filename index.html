<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BACKROOMS</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

button{
    width:340px;
    padding:15px;
    margin:6px;
    border:1px solid #777;
    background:#151515;
    color:#eee;
    font-size:16px;
    cursor:pointer;
    transition:.12s;
}

button:hover{
    background:#403b17;
    border-color:#ddd16b;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;

    background:
        radial-gradient(
            ellipse at center,
            rgba(75,70,35,.82),
            rgba(0,0,0,.98)
        );
}

#pause,
#death{
    display:none;
}

#death{
    background:
        radial-gradient(
            ellipse at center,
            rgba(70,0,0,.65),
            rgba(0,0,0,.98)
        );
}

h1{
    margin:0 0 12px;
    color:#d8cb60;
    font-size:45px;
    letter-spacing:8px;
    text-shadow:
        0 0 12px #000,
        0 0 35px #000;
}

.subtitle{
    color:#aaa;
    margin-bottom:20px;
}

.difficultyTitle{
    color:#999;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:7px;
}

.difficulty{
    display:flex;
    gap:5px;
    margin-bottom:16px;
}

.difficulty button{
    width:108px;
    padding:10px 3px;
    margin:0;
    font-size:11px;
}

.difficulty button.selected{
    background:#5a521f;
    border-color:#e2d36b;
    color:#fff;
}

.controls{
    color:#999;
    text-align:center;
    font-size:12px;
    line-height:1.8;
    margin-top:18px;
}

#textureStatus{
    margin-top:13px;
    color:#777;
    font:10px monospace;
}

#crosshair{
    position:fixed;
    z-index:20;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    margin:-2px;
    border:1px solid rgba(255,255,255,.8);
    border-radius:50%;
    pointer-events:none;
}

#hud{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:20;
    color:#fff;
    font-size:13px;
    text-shadow:2px 2px 7px #000;
    pointer-events:none;
}

#difficultyHud{
    margin-top:4px;
    color:#aaa;
    font-size:11px;
}

#rec{
    position:fixed;
    top:18px;
    right:18px;
    z-index:20;
    color:#fff;
    font:12px monospace;
    text-shadow:2px 2px 6px #000;
    pointer-events:none;
}

#recDot{
    display:inline-block;
    width:8px;
    height:8px;
    margin-right:5px;
    border-radius:50%;
    background:red;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%,45%{
        opacity:1;
    }

    46%,100%{
        opacity:.2;
    }
}

#film{
    position:fixed;
    inset:0;
    z-index:15;
    pointer-events:none;
    opacity:.045;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.045) 0,
            rgba(255,255,255,.045) 1px,
            transparent 2px,
            transparent 5px
        );
}

#vignette{
    position:fixed;
    inset:0;
    z-index:16;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 50%,
            rgba(0,0,0,.10) 72%,
            rgba(0,0,0,.48) 100%
        );
}

#message{
    position:fixed;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    color:#fff;
    font-size:14px;
    text-shadow:2px 2px 8px #000;
    pointer-events:none;
}

#error{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:500;
    display:none;
    padding:15px;
    background:#450000;
    border:1px solid #f00;
    color:#fff;
    font:13px monospace;
    white-space:pre-wrap;
}

.deathTitle{
    color:#b40000;
    font-size:55px;
    letter-spacing:9px;
    text-shadow:0 0 30px #000;
}

.deathText{
    color:#aaa;
    margin:8px 0 22px;
}
</style>
</head>

<body>

<!-- =====================================================
     MAIN MENU
===================================================== -->

<div id="menu" class="overlay">

    <h1>THE BACKROOMS</h1>

    <div class="subtitle">
        There is no exit.
    </div>

    <div class="difficultyTitle">
        ENTITY DIFFICULTY
    </div>

    <div class="difficulty">

        <button id="easyBtn">
            EASY
        </button>

        <button id="normalBtn" class="selected">
            NORMAL
        </button>

        <button id="hardBtn">
            HARD
        </button>

        <button id="impossibleBtn">
            IMPOSSIBLE
        </button>

    </div>

    <button id="startBtn">
        ENTER LEVEL 0
    </button>

    <div class="controls">
        WASD — Move<br>
        SHIFT — Sprint — No cooldown<br>
        SPACE — Jump<br>
        Mouse — Look<br>
        ESC / P — Pause
    </div>

    <div id="textureStatus">
        Loading environment textures...
    </div>

</div>


<!-- =====================================================
     PAUSE
===================================================== -->

<div id="pause" class="overlay">

    <h1>PAUSED</h1>

    <button id="resumeBtn">
        RESUME
    </button>

    <button id="restartBtn">
        RESTART
    </button>

    <button id="menuBtn">
        MAIN MENU
    </button>

</div>


<!-- =====================================================
     DEATH
===================================================== -->

<div id="death" class="overlay">

    <div class="deathTitle">
        YOU DIED
    </div>

    <div class="deathText">
        THE ENTITY FOUND YOU
    </div>

    <button id="retryBtn">
        RETRY
    </button>

    <button id="deathMenuBtn">
        MAIN MENU
    </button>

</div>


<div id="crosshair"></div>

<div id="hud">
    LEVEL 0

    <div id="difficultyHud">
        NORMAL
    </div>
</div>

<div id="rec">
    <span id="recDot"></span>REC
</div>

<div id="message"></div>

<div id="film"></div>
<div id="vignette"></div>

<div id="error"></div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script src="./three.min.js"></script>


<script>

"use strict";


/* =====================================================
   THREE CHECK
===================================================== */

if(
    typeof THREE === "undefined"
){

    document.getElementById(
        "error"
    ).style.display = "block";

    document.getElementById(
        "error"
    ).textContent =
        "three.min.js could not be loaded.";

    throw new Error(
        "THREE is missing."
    );

}


/* =====================================================
   FILE PATHS
===================================================== */

/*
    Everything is relative to index.html.

    This is important for GitHub Pages because
    the project is hosted under:

    /backrooms-kanye/
*/

const BASE =
    new URL(
        "./",
        document.baseURI
    );


/*
    Change this whenever you update the
    textures so the browser doesn't keep
    an old cached version.
*/

const CACHE =
    "?v=4";


const PATHS = {

    floor:
        new URL(
            "textures/floor.png",
            BASE
        ).href + CACHE,

    wall:
        new URL(
            "textures/wall.png",
            BASE
        ).href + CACHE,

    ceiling:
        new URL(
            "textures/ceiling.png",
            BASE
        ).href + CACHE,

    entity:
        new URL(
            "entity.png",
            BASE
        ).href + CACHE,

    entityAudio:
        new URL(
            "entity.mp3",
            BASE
        ).href

};


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x77703d
    );


scene.fog =
    new THREE.Fog(
        0x77703d,
        35,
        120
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        0.03,
        250
    );


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


/*
    Correct color handling.
*/

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


/*
    Shadows are kept for the environment
    lighting, but the entity itself uses
    MeshBasicMaterial so it isn't shaded.
*/

renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   PLAYER
===================================================== */

/*
    Ceiling:
        3.10 units

    Player:
        1.55 units

    Eyes:
        1.18 units

    This should make the player visibly
    shorter than the room.
*/

const PLAYER_HEIGHT =
    1.55;


const EYE_HEIGHT =
    1.18;


const PLAYER_RADIUS =
    0.27;


const WALK_SPEED =
    3.8;


const SPRINT_SPEED =
    6.5;


const GRAVITY =
    20;


const JUMP_SPEED =
    6.2;


const player =
    new THREE.Object3D();


scene.add(
    player
);


player.add(
    camera
);


camera.position.set(
    0,
    EYE_HEIGHT,
    0
);


/* =====================================================
   PLAYER ROTATION
===================================================== */

let yaw =
    0;


let pitch =
    0;


/* =====================================================
   PLAYER PHYSICS
===================================================== */

let velocityY =
    0;


let grounded =
    true;


let jumpPressed =
    false;


/* =====================================================
   KEYBOARD INPUT
===================================================== */

const keys = {

    w:false,

    a:false,

    s:false,

    d:false,

    shift:false

};


window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if(
            key === "w"
        )
            keys.w = true;


        if(
            key === "a"
        )
            keys.a = true;


        if(
            key === "s"
        )
            keys.s = true;


        if(
            key === "d"
        )
            keys.d = true;


        if(
            key === "shift"
        )
            keys.shift = true;


        if(
            key === " "
        ){

            event.preventDefault();

            jumpPressed = true;

        }


        if(
            key === "p" &&
            running &&
            !dead
        ){

            togglePause();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();


        if(
            key === "w"
        )
            keys.w = false;


        if(
            key === "a"
        )
            keys.a = false;


        if(
            key === "s"
        )
            keys.s = false;


        if(
            key === "d"
        )
            keys.d = false;


        if(
            key === "shift"
        )
            keys.shift = false;

    }
);


/*
    Prevent stuck keys if the browser
    loses focus.
*/

window.addEventListener(
    "blur",
    () => {

        keys.w = false;
        keys.a = false;
        keys.s = false;
        keys.d = false;
        keys.shift = false;

    }
);


/* =====================================================
   MOUSE LOOK
===================================================== */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !running ||
            paused ||
            dead
        ){

            return;

        }


        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }


        const sensitivity =
            0.0022;


        yaw -=
            event.movementX *
            sensitivity;


        pitch -=
            event.movementY *
            sensitivity;


        const limit =
            Math.PI / 2 -
            0.08;


        pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );


        /*
            IMPORTANT:

            Player rotates horizontally.

            Camera rotates vertically.

            This fixes WASD and mouse
            movement being disconnected.
        */

        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* =====================================================
   GAME STATE
===================================================== */

let running =
    false;


let paused =
    false;


let dead =
    false;


let difficulty =
    "normal";


let entity =
    null;


let entityTexture =
    null;


/* =====================================================
   WORLD ARRAYS
===================================================== */

let worldObjects =
    [];


let walls =
    [];


/* =====================================================
   ENTITY DIFFICULTIES
===================================================== */

const DIFFICULTIES = {

    easy:{

        name:"EASY",

        speed:1.5,

        chase:false

    },

    normal:{

        name:"NORMAL",

        /*
            Slightly slower than the
            original chase speed.
        */

        speed:5.0,

        chase:true

    },

    hard:{

        name:"HARD",

        speed:6.0,

        chase:true

    },

    impossible:{

        name:"IMPOSSIBLE",

        speed:7.7,

        chase:true

    }

};


/* =====================================================
   ENTITY AI
===================================================== */

const ENTITY_HEIGHT =
    1.65;


const ENTITY_RADIUS =
    0.40;


let entityVelocity =
    new THREE.Vector2(
        0,
        0
    );


let entityDirection =
    new THREE.Vector2(
        1,
        0
    );


let lastKnownPlayer =
    new THREE.Vector2(
        0,
        0
    );


let hasLastKnownPosition =
    false;


let lastSeenTimer =
    0;


const LAST_SEEN_TIME =
    2.5;


let wanderTimer =
    0;


let wanderAngle =
    0;


/* =====================================================
   TEXTURE LOADER
===================================================== */

const textureLoader =
    new THREE.TextureLoader();


function loadTexture(
    url,
    name
){

    return new Promise(
        (
            resolve,
            reject
        ) => {

            textureLoader.load(

                url,

                texture => {

                    console.log(
                        "Loaded:",
                        name,
                        url
                    );


                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    texture.wrapS =
                        THREE.RepeatWrapping;


                    texture.wrapT =
                        THREE.RepeatWrapping;


                    texture.anisotropy =
                        Math.min(
                            renderer
                                .capabilities
                                .getMaxAnisotropy(),
                            8
                        );


                    resolve(
                        texture
                    );

                },

                undefined,

                error => {

                    console.error(
                        "Failed:",
                        name,
                        url,
                        error
                    );


                    reject(
                        new Error(
                            "Could not load " +
                            name +
                            "\n\n" +
                            url
                        )
                    );

                }

            );

        }
    );

}


/* =====================================================
   MATERIALS
===================================================== */

let floorMaterial =
    null;


let wallMaterial =
    null;


let ceilingMaterial =
    null;


/* =====================================================
   LOAD ENVIRONMENT
===================================================== */

async function loadEnvironmentTextures(){

    const status =
        document.getElementById(
            "textureStatus"
        );


    try{

        status.textContent =
            "Loading floor.png...";


        const floorTexture =
            await loadTexture(
                PATHS.floor,
                "floor.png"
            );


        status.textContent =
            "Loading wall.png...";


        const wallTexture =
            await loadTexture(
                PATHS.wall,
                "wall.png"
            );


        status.textContent =
            "Loading ceiling.png...";


        const ceilingTexture =
            await loadTexture(
                PATHS.ceiling,
                "ceiling.png"
            );


        /*
            -------------------------------------------------
            FLOOR
            -------------------------------------------------

            Repeating rather than stretching one
            tiny PNG over the entire floor.
        */

        floorTexture.wrapS =
            THREE.RepeatWrapping;


        floorTexture.wrapT =
            THREE.RepeatWrapping;


        floorTexture.repeat.set(
            32,
            28
        );


        /*
            -------------------------------------------------
            WALL
            -------------------------------------------------

            Repeat enough times to make the wallpaper
            look like real wallpaper instead of one
            enormous stretched image.
        */

        wallTexture.wrapS =
            THREE.RepeatWrapping;


        wallTexture.wrapT =
            THREE.RepeatWrapping;


        /*
            The source wall image is 1000×1000.
            It is repeated naturally across walls.
        */

        wallTexture.repeat.set(
            1,
            1
        );


        /*
            -------------------------------------------------
            CEILING
            -------------------------------------------------

            Repeat the actual ceiling PNG.
        */

        ceilingTexture.wrapS =
            THREE.RepeatWrapping;


        ceilingTexture.wrapT =
            THREE.RepeatWrapping;


        ceilingTexture.repeat.set(
            45,
            40
        );


        /*
            -------------------------------------------------
            MATERIALS
            -------------------------------------------------
        */

        floorMaterial =
            new THREE.MeshStandardMaterial({

                map:
                    floorTexture,

                color:
                    0xffffff,

                roughness:
                    1,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });


        wallMaterial =
            new THREE.MeshStandardMaterial({

                map:
                    wallTexture,

                color:
                    0xffffff,

                roughness:
                    0.92,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });


        /*
            Warm color correction for the
            original yellow Backrooms ceiling.
        */

        ceilingMaterial =
            new THREE.MeshStandardMaterial({

                map:
                    ceilingTexture,

                color:
                    0xffe29a,

                roughness:
                    1,

                metalness:
                    0,

                side:
                    THREE.DoubleSide

            });


        status.textContent =
            "TEXTURES LOADED";


        status.style.color =
            "#aaa";


        return true;

    }
    catch(error){

        status.textContent =
            "TEXTURE ERROR";


        showError(
            error.message +
            "\n\nExpected files:\n\n" +
            PATHS.floor +
            "\n" +
            PATHS.wall +
            "\n" +
            PATHS.ceiling
        );


        return false;

    }

}


/* =====================================================
   WORLD OBJECT MANAGEMENT
===================================================== */

function addObject(
    object
){

    scene.add(
        object
    );


    worldObjects.push(
        object
    );


    return object;

}


function clearWorld(){

    for(
        const object
        of worldObjects
    ){

        scene.remove(
            object
        );


        if(
            object.geometry
        ){

            object.geometry.dispose();

        }

    }


    worldObjects = [];

    walls = [];

    entity = null;

}


/* =====================================================
   FLOOR
===================================================== */

function addFloor(){

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            floorMaterial

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    floor.receiveShadow =
        true;


    addObject(
        floor
    );

}


/* =====================================================
   WALL
===================================================== */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
){

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            wallMaterial

        );


    wall.position.set(
        x,
        y,
        z
    );


    wall.castShadow =
        true;


    wall.receiveShadow =
        true;


    addObject(
        wall
    );


    walls.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minY:
            y -
            height / 2,

        maxY:
            y +
            height / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2

    });

}


/* =====================================================
   CEILING
===================================================== */

/*
    Instead of thousands of meshes, use ONE
    textured ceiling.

    Then use a lightweight grid to visually
    divide it into square panels.

    Ceiling panel:
        1 × 1

    Light:
        2 × 2
*/

const CEILING_HEIGHT =
    3.1;


const CEILING_PANEL_SIZE =
    1;


const LIGHT_SIZE =
    2;


function addCeiling(){

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            ceilingMaterial

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.set(
        0,
        CEILING_HEIGHT,
        0
    );


    ceiling.receiveShadow =
        true;


    addObject(
        ceiling
    );


    /*
        Subtle panel seams.

        These don't replace the PNG.
        They simply make the square ceiling
        panels visible.
    */

    const gridMaterial =
        new THREE.LineBasicMaterial({

            color:
                0xb6a978,

            transparent:
                true,

            opacity:
                0.18

        });


    const points = [];


    const minX =
        -90;


    const maxX =
        90;


    const minZ =
        -80;


    const maxZ =
        80;


    for(
        let x =
            minX;
        x <= maxX;
        x += CEILING_PANEL_SIZE
    ){

        points.push(
            new THREE.Vector3(
                x,
                CEILING_HEIGHT + .003,
                minZ
            ),

            new THREE.Vector3(
                x,
                CEILING_HEIGHT + .003,
                maxZ
            )
        );

    }


    for(
        let z =
            minZ;
        z <= maxZ;
        z += CEILING_PANEL_SIZE
    ){

        points.push(
            new THREE.Vector3(
                minX,
                CEILING_HEIGHT + .003,
                z
            ),

            new THREE.Vector3(
                maxX,
                CEILING_HEIGHT + .003,
                z
            )
        );

    }


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                points
            );


    const grid =
        new THREE.LineSegments(
            geometry,
            gridMaterial
        );


    addObject(
        grid
    );

}


/* =====================================================
   LIGHTS
===================================================== */

function addLight(
    x,
    z
){

    /*
        2 × 2 square fixture.
    */

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                LIGHT_SIZE,
                .055,
                LIGHT_SIZE
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xffffdf

            })

        );


    fixture.position.set(
        x,
        CEILING_HEIGHT - .035,
        z
    );


    addObject(
        fixture
    );


    /*
        Warm fluorescent-style light.
    */

    const light =
        new THREE.PointLight(
            0xffe7aa,
            1.05,
            17
        );


    light.position.set(
        x,
        CEILING_HEIGHT - .18,
        z
    );


    light.castShadow =
        true;


    light.shadow.mapSize.width =

/* =====================================================
   PLAYER COLLISION
===================================================== */

function playerCollides(
    x,
    z
){

    const bottom =
        player.position.y;


    const top =
        bottom +
        PLAYER_HEIGHT;


    for(
        const wall
        of walls
    ){

        if(
            top <= wall.minY ||
            bottom >= wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if(
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =====================================================
   ENTITY
===================================================== */

async function createEntity(){

    try{

        entityTexture =
            await loadTexture(
                PATHS.entity,
                "entity.png"
            );


        const image =
            entityTexture.image;


        const aspect =
            image.width /
            image.height;


        /*
            Full image.

            No cropping.

            No shader.

            No MeshStandardMaterial.

            MeshBasicMaterial means the entity
            is NOT affected by the room lighting.
        */

        const width =
            ENTITY_HEIGHT *
            aspect;


        const material =
            new THREE.MeshBasicMaterial({

                map:
                    entityTexture,

                transparent:
                    true,

                alphaTest:
                    0.01,

                side:
                    THREE.DoubleSide,

                depthWrite:
                    true,

                fog:
                    false,

                toneMapped:
                    false

            });


        entity =
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    width,
                    ENTITY_HEIGHT
                ),

                material

            );


        /*
            Slightly taller than the player,
            but still well below the ceiling.
        */

        entity.position.set(
            25,
            ENTITY_HEIGHT / 2,
            25
        );


        addObject(
            entity
        );


        entityVelocity.set(
            0,
            0
        );


        entityDirection.set(
            1,
            0
        );


        hasLastKnownPosition =
            false;


        lastSeenTimer =
            0;


        return true;

    }
    catch(error){

        showError(
            "ENTITY ERROR\n\n" +
            error.message +
            "\n\nMake sure entity.png is in the same folder as index.html."
        );


        return false;

    }

}


/* =====================================================
   ENTITY COLLISION
===================================================== */

function entityHitsWall(
    x,
    z
){

    for(
        const wall
        of walls
    ){

        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x -
            closestX;


        const dz =
            z -
            closestZ;


        if(
            dx * dx +
            dz * dz <
            ENTITY_RADIUS *
            ENTITY_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =====================================================
   LINE OF SIGHT
===================================================== */

function lineBlocked(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2 -
        x1;


    const dz =
        z2 -
        z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance < .01
    ){

        return false;

    }


    const steps =
        Math.ceil(
            distance / .35
        );


    for(
        let i = 1;
        i <= steps;
        i++
    ){

        const t =
            i / steps;


        const x =
            x1 +
            dx * t;


        const z =
            z1 +
            dz * t;


        if(
            entityHitsWall(
                x,
                z
            )
        ){

            return true;

        }

    }


    return false;

}


/* =====================================================
   ENTITY PATHFINDING
===================================================== */

function chooseEntityDirection(){

    if(
        !entity
    ){

        return null;

    }


    const canSee =
        !lineBlocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z

        );


    let targetX;

    let targetZ;


    if(
        canSee
    ){

        targetX =
            player.position.x;


        targetZ =
            player.position.z;


        lastKnownPlayer.set(
            targetX,
            targetZ
        );


        hasLastKnownPosition =
            true;


        lastSeenTimer =
            LAST_SEEN_TIME;

    }

    else if(
        hasLastKnownPosition &&
        lastSeenTimer > 0
    ){

        /*
            He only knows the last location
            where he actually saw the player.
        */

        targetX =
            lastKnownPlayer.x;


        targetZ =
            lastKnownPlayer.y;

    }

    else{

        return null;

    }


    const dx =
        targetX -
        entity.position.x;


    const dz =
        targetZ -
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        distance < .1
    ){

        return null;

    }


    const targetAngle =
        Math.atan2(
            dz,
            dx
        );


    let best =
        null;


    /*
        Test many directions.

        This lets the entity go around
        walls rather than endlessly
        walking directly into them.
    */

    for(
        let i = 0;
        i < 48;
        i++
    ){

        const angle =
            i /
            48 *
            Math.PI *
            2;


        const dx2 =
            Math.cos(
                angle
            );


        const dz2 =
            Math.sin(
                angle
            );


        const testDistance =
            2.5;


        const testX =
            entity.position.x +
            dx2 *
            testDistance;


        const testZ =
            entity.position.z +
            dz2 *
            testDistance;


        if(
            entityHitsWall(
                testX,
                testZ
            )
        ){

            continue;

        }


        const remaining =
            Math.hypot(
                targetX - testX,
                targetZ - testZ
            );


        let difference =
            Math.abs(
                angle -
                targetAngle
            );


        if(
            difference > Math.PI
        ){

            difference =
                Math.PI -
                difference;

        }


        /*
            Lower score = better path.
        */

        const score =
            remaining +
            difference *
            .55;


        if(
            best === null ||
            score < best.score
        ){

            best = {

                x:
                    dx2,

                z:
                    dz2,

                score

            };

        }

    }


    return best;

}


/* =====================================================
   NORMALIZE ANGLE
===================================================== */

function normalizeAngle(
    angle
){

    while(
        angle > Math.PI
    ){

        angle -=
            Math.PI * 2;

    }


    while(
        angle < -Math.PI
    ){

        angle +=
            Math.PI * 2;

    }


    return angle;

}


/* =====================================================
   ENTITY UPDATE
===================================================== */

function updateEntity(
    dt
){

    if(
        !entity ||
        dead
    ){

        return;

    }


    const settings =
        DIFFICULTIES[
            difficulty
        ];


    /*
        =================================================
        EASY
        =================================================

        Entity exists but peacefully wanders.
    */

    if(
        !settings.chase
    ){

        wanderTimer -=
            dt;


        if(
            wanderTimer <= 0
        ){

            wanderTimer =
                1 +
                Math.random() * 4;


            wanderAngle =
                Math.random() *
                Math.PI *
                2;

        }


        const targetX =
            Math.cos(
                wanderAngle
            );


        const targetZ =
            Math.sin(
                wanderAngle
            );


        entityVelocity.x =
            THREE.MathUtils.lerp(
                entityVelocity.x,
                targetX *
                settings.speed,
                Math.min(
                    1,
                    dt * 1.5
                )
            );


        entityVelocity.y =
            THREE.MathUtils.lerp(
                entityVelocity.y,
                targetZ *
                settings.speed,
                Math.min(
                    1,
                    dt * 1.5
                )
            );

    }


    /*
        =================================================
        CHASE MODES
        =================================================
    */

    else{

        const direction =
            chooseEntityDirection();


        if(
            direction
        ){

            const targetAngle =
                Math.atan2(
                    direction.z,
                    direction.x
                );


            const currentAngle =
                Math.atan2(
                    entityDirection.y,
                    entityDirection.x
                );


            let difference =
                normalizeAngle(
                    targetAngle -
                    currentAngle
                );


            /*
                Limited turning.

                This is what allows the player
                to juke around corners.
            */

            const maxTurn =
                2.05 *
                dt;


            if(
                Math.abs(
                    difference
                ) > maxTurn
            ){

                difference =
                    Math.sign(
                        difference
                    ) *
                    maxTurn;

            }


            const newAngle =
                currentAngle +
                difference;


            entityDirection.x =
                Math.cos(
                    newAngle
                );


            entityDirection.y =
                Math.sin(
                    newAngle
                );


            const desiredX =
                entityDirection.x *
                settings.speed;


            const desiredZ =
                entityDirection.y *
                settings.speed;


            /*
                Acceleration prevents
                instantaneous speed changes.
            */

            entityVelocity.x =
                THREE.MathUtils.lerp(
                    entityVelocity.x,
                    desiredX,
                    Math.min(
                        1,
                        dt * 2.5
                    )
                );


            entityVelocity.y =
                THREE.MathUtils.lerp(
                    entityVelocity.y,
                    desiredZ,
                    Math.min(
                        1,
                        dt * 2.5
                    )
                );

        }

        else{

            entityVelocity.x *=
                Math.pow(
                    .08,
                    dt
                );


            entityVelocity.y *=
                Math.pow(
                    .08,
                    dt
                );

        }

    }


    /*
        =================================================
        ENTITY MOVEMENT
        =================================================
    */

    const nextX =
        entity.position.x +
        entityVelocity.x *
        dt;


    const nextZ =
        entity.position.z +
        entityVelocity.y *
        dt;


    /*
        X collision.
    */

    if(
        !entityHitsWall(
            nextX,
            entity.position.z
        )
    ){

        entity.position.x =
            nextX;

    }
    else{

        entityVelocity.x *=
            .12;

    }


    /*
        Z collision.
    */

    if(
        !entityHitsWall(
            entity.position.x,
            nextZ
        )
    ){

        entity.position.z =
            nextZ;

    }
    else{

        entityVelocity.y *=
            .12;

    }


    /*
        Update last known player position.
    */

    const currentlyVisible =
        !lineBlocked(

            entity.position.x,
            entity.position.z,

            player.position.x,
            player.position.z

        );


    if(
        currentlyVisible
    ){

        lastKnownPlayer.set(
            player.position.x,
            player.position.z
        );


        hasLastKnownPosition =
            true;


        lastSeenTimer =
            LAST_SEEN_TIME;

    }
    else{

        lastSeenTimer -=
            dt;

    }


    /*
        Entity collision.

        The slightly smaller distance allows
        the player to dodge more easily.
    */

    const distance =
        Math.hypot(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );


    if(
        distance < .78
    ){

        killPlayer();

    }


    /*
        Billboard the PNG toward the player.

        This changes rotation only.
        It does NOT change the image size.
    */

    entity.rotation.y =
        Math.atan2(

            player.position.x -
            entity.position.x,

            player.position.z -
            entity.position.z

        );

}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(
    dt
){

    const direction =
        new THREE.Vector3();


    if(
        keys.w
    )
        direction.z -= 1;


    if(
        keys.s
    )
        direction.z += 1;


    if(
        keys.a
    )
        direction.x -= 1;


    if(
        keys.d
    )
        direction.x += 1;


    if(
        direction.lengthSq() > 0
    ){

        direction.normalize();


        /*
            Apply player's horizontal
            camera direction.
        */

        direction.applyAxisAngle(

            new THREE.Vector3(
                0,
                1,
                0
            ),

            yaw

        );


        /*
            NO SPRINT COOLDOWN.

            Hold SHIFT and sprint continuously.
        */

        const speed =
            keys.shift
                ? SPRINT_SPEED
                : WALK_SPEED;


        const movement =
            speed *
            dt;


        const nextX =
            player.position.x +
            direction.x *
            movement;


        if(
            !playerCollides(
                nextX,
                player.position.z
            )
        ){

            player.position.x =
                nextX;

        }


        const nextZ =
            player.position.z +
            direction.z *
            movement;


        if(
            !playerCollides(
                player.position.x,
                nextZ
            )
        ){

            player.position.z =
                nextZ;

        }

    }


    /*
        Jump.
    */

    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;


        grounded =
            false;

    }


    jumpPressed =
        false;


    /*
        Gravity.
    */

    velocityY -=
        GRAVITY *
        dt;


    player.position.y +=
        velocityY *
        dt;


    /*
        Floor.
    */

    if(
        player.position.y <= 0
    ){

        player.position.y =
            0;


        velocityY =
            0;


        grounded =
            true;

    }

}


/* =====================================================
   CAMERA BOB
===================================================== */

let cameraTime =
    0;


function updateCamera(
    dt
){

    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const amount =
        moving
            ? .004
            : .0012;


    camera.position.x =
        Math.sin(
            cameraTime * 3
        ) *
        amount;


    camera.position.y =
        EYE_HEIGHT +
        Math.sin(
            cameraTime * 4
        ) *
        amount;


    camera.rotation.z =
        Math.sin(
            cameraTime * 1.2
        ) *
        .001;

}


/* =====================================================
   ENTITY AUDIO
===================================================== */

const entityAudio =
    new Audio(
        PATHS.entityAudio
    );


entityAudio.loop =
    true;


entityAudio.volume =
    0;


function updateEntityAudio(){

    if(
        !entity ||
        !running ||
        paused ||
        dead
    ){

        entityAudio.volume =
            0;


        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }


        return;

    }


    const dx =
        entity.position.x -
        player.position.x;


    const dz =
        entity.position.z -
        player.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    /*
        No sound once the entity is
        sufficiently far away.
    */

    const MAX_DISTANCE =
        32;


    if(
        distance >=
        MAX_DISTANCE
    ){

        entityAudio.volume =
            0;


        if(
            !entityAudio.paused
        ){

            entityAudio.pause();

        }


        return;

    }


    let volume =
        1 -
        distance /
        MAX_DISTANCE;


    volume =
        Math.pow(
            volume,
            1.8
        ) *
        .8;


    /*
        Walls make the sound much quieter.
    */

    if(
        lineBlocked(

            player.position.x,
            player.position.z,

            entity.position.x,
            entity.position.z

        )
    ){

        volume *=
            .16;

    }


    entityAudio.volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            .8
        );


    if(
        entityAudio.paused &&
        volume > .01
    ){

        entityAudio
            .play()
            .catch(
                () => {}
            );

    }

}


/* =====================================================
   START GAME
===================================================== */

async function startGame(){

    /*
        Make absolutely sure textures have
        finished loading before creating the
        level.
    */

    if(
        !floorMaterial ||
        !wallMaterial ||
        !ceilingMaterial
    ){

        const loaded =
            await loadEnvironmentTextures();


        if(
            !loaded
        ){

            return;

        }

    }


    buildLevel();


    const entityCreated =
        await createEntity();


    if(
        !entityCreated
    ){

        return;

    }


    running =
        true;


    paused =
        false;


    dead =
        false;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            difficulty
        ].name;


    /*
        Reset audio.
    */

    entityAudio.pause();


    entityAudio.currentTime =
        0;


    entityAudio.volume =
        0;


    /*
        Lock mouse.
    */

    try{

        await document.body.requestPointerLock();

    }
    catch(error){

        console.log(
            "Pointer lock request:",
            error
        );

    }

}


/* =====================================================
   DEATH
===================================================== */

function killPlayer(){

    if(
        dead
    ){

        return;

    }


    dead =
        true;


    running =
        false;


    entityAudio.pause();


    entityAudio.volume =
        0;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    document.getElementById(
        "death"
    ).style.display =
        "flex";

}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    if(
        !running &&
        !paused
    ){

        return;

    }


    if(
        paused
    ){

        paused =
            false;


        document.getElementById(
            "pause"
        ).style.display =
            "none";


        document.body.requestPointerLock();

    }

    else{

        paused =
            true;


        document.getElementById(
            "pause"
        ).style.display =
            "flex";


        entityAudio.pause();


        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();

        }

    }

}


/* =====================================================
   RETURN TO MENU
===================================================== */

function returnToMenu(){

    running =
        false;


    paused =
        false;


    dead =
        false;


    entityAudio.pause();


    entityAudio.volume =
        0;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";

}

){

        .querySelectorAll(

        )

    "easyBtn"

/* =====================================================
   POINTER LOCK
===================================================== */

document.addEventListener(
    "click",
    () => {

        if(
            running &&
            !paused &&
            !dead &&
            document.pointerLockElement !==
            document.body
        ){

            document.body.requestPointerLock();

        }

    }
);


/* =====================================================
   ESC POINTER LOCK
===================================================== */

document.addEventListener(
    "pointerlockchange",
    () => {

        if(
            running &&
            !dead &&
            document.pointerLockElement !==
            document.body
        ){

            /*
                If the user presses ESC while
                playing, treat it as pause.
            */

            if(
                !paused
            ){

                paused =
                    true;


                document.getElementById(
                    "pause"
                ).style.display =
                    "flex";


                entityAudio.pause();

            }

        }

    }
);


/* =====================================================
   ERROR DISPLAY
===================================================== */

function showError(
    text
){

    const element =
        document.getElementById(
            "error"
        );


    element.style.display =
        "block";


    element.textContent =
        text;

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   LOAD TEXTURES
===================================================== */

loadEnvironmentTextures();


/* =====================================================
   CLOCK
===================================================== */

const clock =
    new THREE.Clock();


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(
            dt
        );


        updateEntity(
            dt
        );


        updateEntityAudio();


        updateCamera(
            dt
        );

    }
    else{

        updateEntityAudio();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
