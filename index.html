<script src="./three.min.js"></script>

<script>

"use strict";


/* =========================================================
   GAME SETTINGS
========================================================= */

/*
    EXACT FILE PATHS IN YOUR REPOSITORY:

    backrooms-kanye/
        index.html
        entity.png
        entity.mp3
        three.min.js
        textures/
            floor.png
            wall.png
            ceiling.png
*/

const TEXTURE_PATHS = {

    floor:"./textures/floor.png",

    wall:"./textures/wall.png",

    ceiling:"./textures/ceiling.png"

};


const ENTITY_PATH =
    "./entity.png";


const AUDIO_PATH =
    "./entity.mp3";


/*
    Short player.

    The ceiling is 3.1 units high.

    Player eye:
        .95

    Player total height:
        1.25

    This should make the player
    clearly shorter than the lights.
*/

const PLAYER_HEIGHT =
    1.25;

const PLAYER_EYE =
    .95;

const PLAYER_RADIUS =
    .28;


/*
    Kanye is around 1.55x
    the player's height.
*/

const ENTITY_HEIGHT =
    1.94;

const ENTITY_RADIUS =
    .48;


/* =========================================================
   THREE
========================================================= */

if(typeof THREE === "undefined"){

    showError(
        "three.min.js could not be loaded."
    );

    throw new Error(
        "THREE is missing"
    );

}


const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .03,
        250
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


/*
    Lighting is only used for the
    environment.

    The entity uses MeshBasicMaterial
    and therefore is NOT affected by
    this lighting.
*/

renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   STATE
========================================================= */

let running = false;

let paused = false;

let dead = false;

let difficulty =
    "easy";

let playerYaw = 0;

let playerPitch = 0;

let velocityY = 0;

let grounded = true;

let jumpPressed = false;

let entity = null;

let entityTexture = null;

let entitySpeed = 1.9;

let wanderTimer = 0;

let wanderAngle = 0;

let entityStuckTime = 0;

let worldObjects = [];

let wallBoxes = [];


/* =========================================================
   DIFFICULTY
========================================================= */

const DIFFICULTY_DATA = {

    easy:{
        speed:1.9,
        chase:false,
        name:"EASY"
    },

    normal:{
        speed:4.7,
        chase:true,
        name:"NORMAL"
    },

    hard:{
        speed:5.6,
        chase:true,
        name:"HARD"
    },

    impossible:{
        speed:7.0,
        chase:true,
        name:"IMPOSSIBLE"
    }

};


/* =========================================================
   INPUT
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        keys[key] = true;


        if(
            event.code === "Space" &&
            !event.repeat
        ){

            jumpPressed = true;

        }


        if(
            event.key === "Escape" ||
            key === "p"
        ){

            if(
                running &&
                !dead
            ){

                togglePause();

            }

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }


        playerYaw -=
            event.movementX*.0021;


        playerPitch -=
            event.movementY*.0021;


        playerPitch =
            THREE.MathUtils.clamp(
                playerPitch,
                -1.48,
                1.48
            );


        player.rotation.y =
            playerYaw;


        camera.rotation.x =
            playerPitch;

    }
);


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();


scene.add(
    player
);


player.add(
    camera
);


camera.position.set(
    0,
    PLAYER_EYE,
    0
);


/* =========================================================
   TEXTURE LOADING
========================================================= */

/*
    IMPORTANT:

    There are NO procedural fallback
    textures here.

    The game uses the PNG files
    directly.

    If one is missing, the error
    panel tells you exactly which
    file failed.
*/


const loader =
    new THREE.TextureLoader();


function loadGameTexture(
    path
){

    return new Promise(
        (resolve,reject) => {

            loader.load(

                path,

                texture => {

                    console.log(
                        "Loaded texture:",
                        path
                    );


                    texture.colorSpace =
                        THREE.SRGBColorSpace;


                    texture.wrapS =
                        THREE.RepeatWrapping;


                    texture.wrapT =
                        THREE.RepeatWrapping;


                    texture.anisotropy =
                        renderer
                            .capabilities
                            .getMaxAnisotropy();


                    resolve(texture);

                },

                undefined,

                error => {

                    console.error(
                        "Texture failed:",
                        path,
                        error
                    );


                    reject(
                        new Error(
                            "Failed to load: "+
                            path
                        )
                    );

                }

            );

        }
    );

}


/* =========================================================
   MATERIAL CREATION
========================================================= */

let materials = null;


async function loadMaterials(){

    try{

        /*
            Promise.all makes sure all three
            images are loaded before the level
            is created.
        */

        const textures =
            await Promise.all([

                loadGameTexture(
                    TEXTURE_PATHS.floor
                ),

                loadGameTexture(
                    TEXTURE_PATHS.wall
                ),

                loadGameTexture(
                    TEXTURE_PATHS.ceiling
                )

            ]);


        const floorTexture =
            textures[0];


        const wallTexture =
            textures[1];


        const ceilingTexture =
            textures[2];


        /*
            FLOOR
        */

        floorTexture.repeat.set(
            8,
            8
        );


        /*
            WALL

            Repeating rather than stretching
            one tiny PNG over the whole level.
        */

        wallTexture.repeat.set(
            5,
            4
        );


        /*
            CEILING
        */

        ceilingTexture.repeat.set(
            6,
            5
        );


        materials = {

            floor:
                new THREE.MeshStandardMaterial({

                    map:floorTexture,

                    color:0xffffff,

                    roughness:1,

                    metalness:0

                }),


            wall:
                new THREE.MeshStandardMaterial({

                    map:wallTexture,

                    color:0xffffff,

                    roughness:.96,

                    metalness:0

                }),


            ceiling:
                new THREE.MeshStandardMaterial({

                    map:ceilingTexture,

                    /*
                        Warm yellow correction
                        without destroying the PNG.
                    */

                    color:0xffefad,

                    roughness:.94,

                    metalness:0

                })

        };


        return true;

    }
    catch(error){

        showError(
            error.message+
            "\\n\\n"+
            "Make sure your repository contains exactly:\\n"+
            "./textures/floor.png\\n"+
            "./textures/wall.png\\n"+
            "./textures/ceiling.png"
        );


        return false;

    }

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
){

    const box =
        document.getElementById(
            "error"
        );


    box.style.display =
        "block";


    box.textContent =
        message;

}


/* =========================================================
   ADD OBJECT
========================================================= */

function addObject(
    object
){

    scene.add(
        object
    );


    worldObjects.push(
        object
    );


    return object;

}


/* =========================================================
   FLOOR
========================================================= */

function addFloor(
    width,
    depth,
    x,
    z
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                depth
            ),

            materials.floor

        );


    mesh.rotation.x =
        -Math.PI/2;


    mesh.position.set(
        x,
        0,
        z
    );


    mesh.receiveShadow =
        true;


    addObject(
        mesh
    );

}


/* =========================================================
   CEILING
========================================================= */

function addCeiling(){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                180,
                160
            ),

            materials.ceiling

        );


    mesh.rotation.x =
        Math.PI/2;


    mesh.position.y =
        3.1;


    mesh.receiveShadow =
        true;


    addObject(
        mesh
    );

}


/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            materials.wall

        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    addObject(
        mesh
    );


    wallBoxes.push({

        minX:x-width/2,

        maxX:x+width/2,

        minY:y-height/2,

        maxY:y+height/2,

        minZ:z-depth/2,

        maxZ:z+depth/2

    });

}


/* =========================================================
   LIGHT
========================================================= */

function addLight(
    x,
    z
){

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.7,
                .06,
                .45
            ),

            new THREE.MeshBasicMaterial({

                color:0xffffdc

            })

        );


    fixture.position.set(
        x,
        3.03,
        z
    );


    addObject(
        fixture
    );


    const light =
        new THREE.PointLight(
            0xffedb1,
            .75,
            18
        );


    light.position.set(
        x,
        2.85,
        z
    );


    light.castShadow =
        true;


    addObject(
        light
    );

}


/* =========================================================
   BUILD LEVEL
========================================================= */

async function buildLevel(){

    const loaded =
        await loadMaterials();


    if(!loaded){

        return false;

    }


    clearWorld();


    scene.background =
        new THREE.Color(
            0x67612d
        );


    scene.fog =
        new THREE.Fog(
            0x67612d,
            45,
            180
        );


    /*
        General environment lighting.
    */

    addObject(
        new THREE.HemisphereLight(
            0xffefb0,
            0x292718,
            1.8
        )
    );


    addObject(
        new THREE.AmbientLight(
            0xffe5a0,
            .65
        )
    );


    /*
        FLOOR
    */

    addFloor(
        180,
        160,
        0,
        0
    );


    /*
        CEILING
    */

    addCeiling();


    const H =
        3.1;


    /*
        OUTER WALLS
    */

    addWall(
        180,
        H,
        1,
        0,
        H/2,
        -80
    );


    addWall(
        180,
        H,
        1,
        0,
        H/2,
        80
    );


    addWall(
        1,
        H,
        160,
        -90,
        H/2,
        0
    );


    addWall(
        1,
        H,
        160,
        90,
        H/2,
        0
    );


    /*
        BIG ROOMS
    */

    addWall(
        1,
        H,
        95,
        -55,
        H/2,
        0
    );


    addWall(
        1,
        H,
        95,
        55,
        H/2,
        0
    );


    addWall(
        75,
        H,
        1,
        0,
        H/2,
        -52
    );


    addWall(
        75,
        H,
        1,
        0,
        H/2,
        52
    );


    /*
        IRREGULAR WALLS
    */

    addWall(
        35,
        H,
        1,
        -25,
        H/2,
        -25
    );


    addWall(
        35,
        H,
        1,
        25,
        H/2,
        25
    );


    addWall(
        1,
        H,
        30,
        -42,
        H/2,
        27
    );


    addWall(
        1,
        H,
        30,
        42,
        H/2,
        -27
    );


    /*
        CLAUSTROPHOBIC AREA
    */

    for(
        let i=0;
        i<7;
        i++
    ){

        addWall(
            .8,
            H,
            25,
            -35+i*5,
            H/2,
            0
        );

    }


    /*
        MORE RANDOM-LOOKING WALLS
    */

    addWall(
        18,
        H,
        1,
        -68,
        H/2,
        -35
    );


    addWall(
        1,
        H,
        20,
        -77,
        H/2,
        -25
    );


    addWall(
        20,
        H,
        1,
        65,
        H/2,
        38
    );


    addWall(
        1,
        H,
        20,
        55,
        H/2,
        48
    );


    /*
        LIGHT GRID
    */

    for(
        let x=-80;
        x<=80;
        x+=10
    ){

        for(
            let z=-70;
            z<=70;
            z+=12
        ){

            addLight(
                x,
                z
            );

        }

    }


    /*
        PLAYER SPAWN
    */

    player.position.set(
        -70,
        PLAYER_EYE,
        -65
    );


    playerYaw =
        0;


    playerPitch =
        0;


    player.rotation.y =
        playerYaw;


    camera.rotation.x =
        playerPitch;


    velocityY =
        0;


    grounded =
        true;


    /*
        ENTITY
    */

    await createEntity(
        40,
        40
    );


    return true;

}


/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld(){

    for(
        const object of worldObjects
    ){

        scene.remove(
            object
        );


        if(object.geometry)
            object.geometry.dispose();


        /*
            Don't dispose the shared
            texture materials here.
        */

    }


    worldObjects = [];

    wallBoxes = [];

    entity = null;

}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function playerCollides(
    x,
    z
){

    const y =
        player.position.y;


    const bottom =
        y-PLAYER_EYE;


    const top =
        bottom+PLAYER_HEIGHT;


    for(
        const wall of wallBoxes
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+
            dz*dz <
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityCollides(
    x,
    z
){

    const y =
        ENTITY_HEIGHT/2;


    for(
        const wall of wallBoxes
    ){

        if(
            y+ENTITY_HEIGHT/2<=
            wall.minY ||
            y-ENTITY_HEIGHT/2>=
            wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+
            dz*dz <
            ENTITY_RADIUS*
            ENTITY_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   LINE OF SIGHT
========================================================= */

function wallBetween(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2-x1;


    const dz =
        z2-z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance/.35
        );


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t =
            i/steps;


        const x =
            x1+dx*t;


        const z =
            z1+dz*t;


        if(
            entityCollides(
                x,
                z
            )
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(
    dt
){

    const direction =
        new THREE.Vector3();


    if(keys.w)
        direction.z-=1;


    if(keys.s)
        direction.z+=1;


    if(keys.a)
        direction.x-=1;


    if(keys.d)
        direction.x+=1;


    if(
        direction.lengthSq()>0
    ){

        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            playerYaw
        );


        /*
            NO SPRINT COOLDOWN.

            You can sprint whenever
            SHIFT is held.
        */

        const speed =
            keys.shift
                ? 6.7
                : 3.8;


        const amount =
            speed*dt;


        const nextX =
            player.position.x+
            direction.x*amount;


        if(
            !playerCollides(
                nextX,
                player.position.z
            )
        ){

            player.position.x =
                nextX;

        }


        const nextZ =
            player.position.z+
            direction.z*amount;


        if(
            !playerCollides(
                player.position.x,
                nextZ
            )
        ){

            player.position.z =
                nextZ;

        }

    }


    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            6.2;


        grounded =
            false;

    }


    jumpPressed =
        false;


    velocityY -=
        20*dt;


    player.position.y +=
        velocityY*dt;


    if(
        player.position.y<=PLAYER_EYE
    ){

        player.position.y =
            PLAYER_EYE;


        velocityY =
            0;


        grounded =
            true;

    }


    if(
        player.position.y<-10
    ){

        killPlayer();

    }

}


/* =========================================================
   ENTITY TEXTURE
========================================================= */

async function loadEntityTexture(){

    try{

        entityTexture =
            await loadGameTexture(
                ENTITY_PATH
            );


        /*
            Entity texture should NOT
            repeat.
        */

        entityTexture.wrapS =
            THREE.ClampToEdgeWrapping;


        entityTexture.wrapT =
            THREE.ClampToEdgeWrapping;


        return true;

    }
    catch(error){

        showError(
            "Could not load entity.png"
        );


        return false;

    }

}


/* =========================================================
   CREATE ENTITY
========================================================= */

async function createEntity(
    x,
    z
){

    const loaded =
        await loadEntityTexture();


    if(!loaded)
        return;


    /*
        IMPORTANT:

        PlaneGeometry is used only as
        a container for the PNG.

        MeshBasicMaterial means the
        image is not affected by
        environmental lighting.
    */

    const material =
        new THREE.MeshBasicMaterial({

            map:entityTexture,

            transparent:true,

            alphaTest:.015,

            side:THREE.DoubleSide,

            depthWrite:true,

            fog:false,

            toneMapped:false

        });


    entity =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1,
                1
            ),

            material

        );


    /*
        Read the actual PNG dimensions.

        This prevents the image from
        being stretched or cropped.
    */

    const image =
        entityTexture.image;


    const aspect =
        image.width/
        image.height;


    entity.scale.set(
        ENTITY_HEIGHT*aspect,
        ENTITY_HEIGHT,
        1
    );


    /*
        Feet are exactly on the floor.
    */

    entity.position.set(
        x,
        ENTITY_HEIGHT/2,
        z
    );


    addObject(
        entity
    );

}


/* =========================================================
   ENTITY MOVEMENT
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        dead
    ){

        return;

    }


    const data =
        DIFFICULTY_DATA[
            difficulty
        ];


    entitySpeed =
        data.speed;


    /*
        EASY MODE

        Entity exists, but does NOT
        chase the player.
    */

    if(
        !data.chase
    ){

        wanderTimer -=
            dt;


        if(
            wanderTimer<=0
        ){

            wanderTimer =
                1+
                Math.random()*3;


            wanderAngle =
                Math.random()*
                Math.PI*2;

        }


        const dx =
            Math.cos(
                wanderAngle
            );


        const dz =
            Math.sin(
                wanderAngle
            );


        const nx =
            entity.position.x+
            dx*
            entitySpeed*
            dt;


        const nz =
            entity.position.z+
            dz*
            entitySpeed*
            dt;


        if(
            !entityCollides(
                nx,
                nz
            )
        ){

            entity.position.x =
                nx;


            entity.position.z =
                nz;

        }
        else{

            wanderTimer =
                0;

        }

    }


    /*
        NORMAL / HARD / IMPOSSIBLE
    */

    else{

        const dx =
            player.position.x-
            entity.position.x;


        const dz =
            player.position.z-
            entity.position.z;


        const distance =
            Math.hypot(
                dx,
                dz
            );


        if(
            distance>.2
        ){

            let dirX =
                dx/distance;


            let dirZ =
                dz/distance;


            /*
                If there is a clear path,
                move directly toward player.
            */

            if(
                !wallBetween(
                    entity.position.x,
                    entity.position.z,
                    player.position.x,
                    player.position.z
                )
            ){

                /*
                    direct path
                */

            }

            /*
                Wall detected.

                Find the quickest direction
                around it.
            */

            else{

                const best =
                    findAroundWall();


                if(best){

                    dirX =
                        best.x;


                    dirZ =
                        best.z;

                }

            }


            const amount =
                entitySpeed*
                dt;


            const nx =
                entity.position.x+
                dirX*amount;


            const nz =
                entity.position.z+
                dirZ*amount;


            if(
                !entityCollides(
                    nx,
                    nz
                )
            ){

                entity.position.x =
                    nx;


                entity.position.z =
                    nz;


                entityStuckTime =
                    0;

            }
            else{

                entityStuckTime +=
                    dt;

            }

        }


        /*
            If trapped, try several
            escape directions.
        */

        if(
            entityStuckTime>.7
        ){

            for(
                let i=0;
                i<32;
                i++
            ){

                const angle =
                    i/32*
                    Math.PI*2;


                const nx =
                    entity.position.x+
                    Math.cos(angle)*2;


                const nz =
                    entity.position.z+
                    Math.sin(angle)*2;


                if(
                    !entityCollides(
                        nx,
                        nz
                    )
                ){

                    entity.position.x =
                        nx;


                    entity.position.z =
                        nz;


                    break;

                }

            }


            entityStuckTime =
                0;

        }


        /*
            Catch player.
        */

        if(
            distance<1.15
        ){

            killPlayer();

        }

    }


    /*
        Make the PNG face the player.

        This rotates the flat image,
        but does not change its
        proportions.
    */

    const lookX =
        player.position.x-
        entity.position.x;


    const lookZ =
        player.position.z-
        entity.position.z;


    entity.rotation.y =
        Math.atan2(
            lookX,
            lookZ
        );

}


/* =========================================================
   FIND QUICKEST ROUTE AROUND WALL
========================================================= */

function findAroundWall(){

    const dx =
        player.position.x-
        entity.position.x;


    const dz =
        player.position.z-
        entity.position.z;


    const targetAngle =
        Math.atan2(
            dz,
            dx
        );


    let best =
        null;


    for(
        let i=0;
        i<64;
        i++
    ){

        const angle =
            i/64*
            Math.PI*2;


        const dirX =
            Math.cos(angle);


        const dirZ =
            Math.sin(angle);


        const nearX =
            entity.position.x+
            dirX*1.5;


        const nearZ =
            entity.position.z+
            dirZ*1.5;


        const farX =
            entity.position.x+
            dirX*3.5;


        const farZ =
            entity.position.z+
            dirZ*3.5;


        if(
            entityCollides(
                nearX,
                nearZ
            )
        ){

            continue;

        }


        if(
            entityCollides(
                farX,
                farZ
            )
        ){

            continue;

        }


        const remaining =
            Math.hypot(
                player.position.x-
                farX,
                player.position.z-
                farZ
            );


        let angleDifference =
            Math.abs(
                angle-
                targetAngle
            );


        if(
            angleDifference>
            Math.PI
        ){

            angleDifference =
                Math.PI-
                angleDifference;

        }


        const score =
            remaining+
            angleDifference*.35;


        if(
            !best ||
            score<best.score
        ){

            best = {

                x:dirX,

                z:dirZ,

                score:score

            };

        }

    }


    return best;

}


/* =========================================================
   CAMERA EFFECT
========================================================= */

let cameraTime =
    0;


function updateCamera(
    dt
){

    cameraTime +=
        dt;


    const movement =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const amount =
        movement
            ? .003
            : .001;


    camera.position.x =
        Math.sin(
            cameraTime*3
        )*
        amount;


    camera.position.y =
        PLAYER_EYE+
        Math.sin(
            cameraTime*4
        )*
        amount;


    camera.rotation.z =
        Math.sin(
            cameraTime*1.5
        )*
        amount;

}

    if(

            false;


        document.getElementById(
            "pause"
        ).style.display =
