<script>

"use strict";


/* =========================================================
   BASIC ERROR DISPLAY
========================================================= */

window.addEventListener(
    "error",
    function(event){

        const box =
            document.getElementById("error");

        box.style.display =
            "block";

        box.textContent =
            "ERROR:\\n\\n"+
            event.message+
            "\\n\\n"+
            "If this is a texture error, check that the files are exactly:\\n"+
            "./textures/wall.png\\n"+
            "./textures/floor.png\\n"+
            "./textures/ceiling.png";

        console.error(
            event.error || event.message
        );

    }
);


if(typeof THREE === "undefined"){

    throw new Error(
        "three.min.js could not be loaded."
    );

}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        78,
        innerWidth / innerHeight,
        .03,
        250
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.15;


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

/*
    The player is intentionally short.

    Eye height:
        0.98

    Total player height:
        1.25

    Ceiling:
        3.10

    This leaves plenty of visible space above
    the player's head.
*/

const PLAYER_EYE_HEIGHT = 0.98;

const PLAYER_HEIGHT = 1.25;

const PLAYER_RADIUS = 0.30;

const WALK_SPEED = 3.8;

const SPRINT_SPEED = 6.7;

const GRAVITY = 20;

const JUMP_SPEED = 6.3;


const player =
    new THREE.Object3D();


scene.add(
    player
);


player.add(
    camera
);


camera.position.set(
    0,
    PLAYER_EYE_HEIGHT,
    0
);


let yaw = 0;

let pitch = 0;

let velocityY = 0;

let grounded = true;


/* =========================================================
   GAME STATE
========================================================= */

let running = false;

let paused = false;

let dead = false;

let currentLevel = "level0";

let selectedDifficulty = "normal";


const DIFFICULTIES = {

    easy:{
        name:"EASY",
        speed:1.7,
        chase:false
    },

    normal:{
        name:"NORMAL",
        speed:5.4,
        chase:true
    },

    hard:{
        name:"HARD",
        speed:6.6,
        chase:true
    },

    impossible:{
        name:"IMPOSSIBLE",
        speed:8.4,
        chase:true
    }

};


let objects = [];

let walls = [];

let floors = [];

let entity = null;

let entityTexture = null;

let entityStuckTime = 0;

let wanderTimer = 0;

let wanderDirection =
    new THREE.Vector2(
        1,
        0
    );


/* =========================================================
   INPUT
========================================================= */

const keys = {};

let jumpPressed = false;


window.addEventListener(
    "keydown",
    function(event){

        const key =
            event.key.toLowerCase();


        keys[key] = true;


        if(event.code === "Space"){

            event.preventDefault();

            if(!event.repeat){

                jumpPressed = true;

            }

        }


        if(
            event.code === "Escape" ||
            key === "p"
        ){

            if(
                running &&
                !dead
            ){

                togglePause();

            }

        }

    }
);


window.addEventListener(
    "keyup",
    function(event){

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

window.addEventListener(
    "mousemove",
    function(event){

        if(
            document.pointerLockElement !==
            document.body
        ){

            return;

        }


        yaw -=
            event.movementX * .0021;


        pitch -=
            event.movementY * .0021;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.48,
                1.48
            );


        player.rotation.y =
            yaw;


        camera.rotation.x =
            pitch;

    }
);


/* =========================================================
   OBJECT TRACKING
========================================================= */

function addObject(
    object
){

    scene.add(
        object
    );

    objects.push(
        object
    );

    return object;

}


/* =========================================================
   EXACT TEXTURE PATHS
========================================================= */

/*
    THESE ARE THE EXACT FILES FROM YOUR REPO.

    Do not change these unless the GitHub
    filenames change.
*/

const WALL_TEXTURE =
    "./textures/wall.png";

const FLOOR_TEXTURE =
    "./textures/floor.png";

const CEILING_TEXTURE =
    "./textures/ceiling.png";


const textureLoader =
    new THREE.TextureLoader();


/* =========================================================
   LOAD TEXTURE
========================================================= */

function loadTexture(
    path,
    repeatX,
    repeatY,
    onSuccess
){

    textureLoader.load(

        path,

        function(texture){

            console.log(
                "TEXTURE LOADED:",
                path
            );


            texture.colorSpace =
                THREE.SRGBColorSpace;


            texture.wrapS =
                THREE.RepeatWrapping;


            texture.wrapT =
                THREE.RepeatWrapping;


            texture.repeat.set(
                repeatX,
                repeatY
            );


            texture.anisotropy =
                renderer
                    .capabilities
                    .getMaxAnisotropy();


            onSuccess(
                texture
            );

        },

        undefined,

        function(error){

            console.error(
                "TEXTURE FAILED:",
                path,
                error
            );

            const box =
                document.getElementById(
                    "error"
                );

            box.style.display =
                "block";

            box.textContent =
                "COULD NOT LOAD TEXTURE:\\n\\n"+
                path+
                "\\n\\n"+
                "Make sure the file exists at that exact location in GitHub.";

        }

    );

}


/* =========================================================
   FALLBACK TEXTURES
========================================================= */

function makeWallFallback(){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 512;

    canvas.height = 512;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#b7ab50";


    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        5,
        4
    );


    return texture;

}


function makeFloorFallback(){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 512;

    canvas.height = 512;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#55564e";


    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        8,
        8
    );


    return texture;

}


function makeCeilingFallback(){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 512;

    canvas.height = 512;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.fillStyle =
        "#d3c66b";


    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        6,
        5
    );


    return texture;

}


/* =========================================================
   MATERIALS
========================================================= */

function createMaterials(){

    const wallTexture =
        makeWallFallback();


    const floorTexture =
        makeFloorFallback();


    const ceilingTexture =
        makeCeilingFallback();


    const wallMaterial =
        new THREE.MeshStandardMaterial({

            map:wallTexture,

            color:0xffffff,

            roughness:.95,

            metalness:0

        });


    const floorMaterial =
        new THREE.MeshStandardMaterial({

            map:floorTexture,

            color:0xffffff,

            roughness:1,

            metalness:0

        });


    const ceilingMaterial =
        new THREE.MeshStandardMaterial({

            map:ceilingTexture,

            color:0xffffff,

            roughness:.92,

            metalness:0

        });


    /*
        IMPORTANT:
        These are the exact paths.
    */

    loadTexture(
        WALL_TEXTURE,
        5,
        4,
        function(texture){

            wallMaterial.map =
                texture;

            wallMaterial.color.set(
                0xffffff
            );

            wallMaterial.needsUpdate =
                true;

        }
    );


    loadTexture(
        FLOOR_TEXTURE,
        8,
        8,
        function(texture){

            floorMaterial.map =
                texture;

            floorMaterial.color.set(
                0xffffff
            );

            floorMaterial.needsUpdate =
                true;

        }
    );


    loadTexture(
        CEILING_TEXTURE,
        6,
        5,
        function(texture){

            ceilingMaterial.map =
                texture;

            /*
                Warm original Backrooms yellow.
            */

            ceilingMaterial.color.set(
                0xffef9c
            );

            ceilingMaterial.needsUpdate =
                true;

        }
    );


    return {

        wall:wallMaterial,

        floor:floorMaterial,

        ceiling:ceilingMaterial

    };

}


/* =========================================================
   WALL
========================================================= */

function addWall(
    width,
    height,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material

        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    addObject(
        mesh
    );


    walls.push({

        minX:x-width/2,

        maxX:x+width/2,

        minY:y-height/2,

        maxY:y+height/2,

        minZ:z-depth/2,

        maxZ:z+depth/2

    });


    return mesh;

}


/* =========================================================
   FLOOR
========================================================= */

function addFloor(
    width,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                depth
            ),

            material

        );


    mesh.rotation.x =
        -Math.PI/2;


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.receiveShadow =
        true;


    addObject(
        mesh
    );


    floors.push({

        minX:x-width/2,

        maxX:x+width/2,

        minZ:z-depth/2,

        maxZ:z+depth/2,

        y:y

    });


    return mesh;

}


/* =========================================================
   CEILING
========================================================= */

function addCeiling(
    width,
    depth,
    x,
    y,
    z,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                depth
            ),

            material

        );


    mesh.rotation.x =
        Math.PI/2;


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.receiveShadow =
        true;


    addObject(
        mesh
    );


    return mesh;

}


/* =========================================================
   LIGHTS
========================================================= */

function addFluorescentLight(
    x,
    z,
    intensity=.8
){

    const fixture =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.8,
                .07,
                .45
            ),

            new THREE.MeshBasicMaterial({

                color:0xfff1bd

            })

        );


    fixture.position.set(
        x,
        3.03,
        z
    );


    addObject(
        fixture
    );


    const light =
        new THREE.PointLight(
            0xffe9ad,
            intensity,
            19
        );


    light.position.set(
        x,
        2.88,
        z
    );


    light.castShadow =
        true;


    light.shadow.mapSize.width =
        512;


    light.shadow.mapSize.height =
        512;


    addObject(
        light
    );

}

/* =========================================================
   SPAWN
========================================================= */

function spawn(
    x,
    z,
    rotation
){

    player.position.set(
        x,
        PLAYER_EYE_HEIGHT,
        z
    );


    yaw =
        rotation;


    pitch =
        0;


    player.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;


    velocityY =
        0;


    grounded =
        true;

}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function hitsWall(
    x,
    y,
    z
){

    const bottom =
        y-PLAYER_EYE_HEIGHT;


    const top =
        bottom+PLAYER_HEIGHT;


    for(
        const wall of walls
    ){

        if(
            top <= wall.minY ||
            bottom >= wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+dz*dz <
            PLAYER_RADIUS*
            PLAYER_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   FLOOR DETECTION
========================================================= */

function getFloor(
    x,
    z,
    currentY
){

    let best =
        -Infinity;


    for(
        const floor of floors
    ){

        if(
            x>=floor.minX &&
            x<=floor.maxX &&
            z>=floor.minZ &&
            z<=floor.maxZ
        ){

            if(
                floor.y <=
                currentY-
                PLAYER_EYE_HEIGHT+
                .2
            ){

                if(
                    floor.y>best
                ){

                    best =
                        floor.y;

                }

            }

        }

    }


    return best;

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(
    dt
){

    const direction =
        new THREE.Vector3();


    if(keys.w)
        direction.z -= 1;


    if(keys.s)
        direction.z += 1;


    if(keys.a)
        direction.x -= 1;


    if(keys.d)
        direction.x += 1;


    if(
        direction.lengthSq()>0
    ){

        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        /*
            Sprint has NO cooldown.
        */

        const speed =
            keys.shift
                ? SPRINT_SPEED
                : WALK_SPEED;


        const amount =
            speed*dt;


        const nextX =
            player.position.x+
            direction.x*amount;


        if(
            !hitsWall(
                nextX,
                player.position.y,
                player.position.z
            )
        ){

            player.position.x =
                nextX;

        }


        const nextZ =
            player.position.z+
            direction.z*amount;


        if(
            !hitsWall(
                player.position.x,
                player.position.y,
                nextZ
            )
        ){

            player.position.z =
                nextZ;

        }

    }


    if(
        jumpPressed &&
        grounded
    ){

        velocityY =
            JUMP_SPEED;


        grounded =
            false;

    }


    jumpPressed =
        false;


    velocityY -=
        GRAVITY*dt;


    let nextY =
        player.position.y+
        velocityY*dt;


    const floor =
        getFloor(
            player.position.x,
            player.position.z,
            player.position.y
        );


    if(
        floor!==-Infinity
    ){

        const target =
            floor+
            PLAYER_EYE_HEIGHT;


        if(
            nextY<=target &&
            velocityY<=0
        ){

            nextY =
                target;


            velocityY =
                0;


            grounded =
                true;

        }
        else{

            grounded =
                false;

        }

    }


    player.position.y =
        nextY;


    if(
        player.position.y<-15
    ){

        killPlayer();

    }

}


/* =========================================================
   CAMERA / FOUND FOOTAGE
========================================================= */

let cameraTime = 0;


function updateCamera(
    dt
){

    cameraTime +=
        dt;


    const moving =
        keys.w ||
        keys.a ||
        keys.s ||
        keys.d;


    const movementShake =
        moving
            ? .0028
            : .0008;


    let danger =
        0;


    if(entity){

        const dx =
            entity.position.x-
            player.position.x;


        const dz =
            entity.position.z-
            player.position.z;


        const distance =
            Math.hypot(
                dx,
                dz
            );


        danger =
            THREE.MathUtils.clamp(
                1-distance/22,
                0,
                1
            );

    }


    const shake =
        movementShake+
        danger*.003;


    camera.position.x =
        Math.sin(
            cameraTime*2.7
        )*shake;


    camera.position.y =
        PLAYER_EYE_HEIGHT+
        Math.sin(
            cameraTime*3.6
        )*shake*.7;


    camera.rotation.z =
        Math.sin(
            cameraTime*1.4
        )*shake*.7;

}

/* =========================================================
   ENTITY
========================================================= */

/*
    Player visible height is about 1.25m.

    Entity visible height:
        1.90m

    Therefore Kanye is roughly:
        1.5× player height

    The entire PNG is preserved.
*/

const ENTITY_HEIGHT =
    1.90;


const ENTITY_RADIUS =
    .50;


function createEntity(
    x,
    z
){

    const geometry =
        new THREE.PlaneGeometry(
            1,
            1
        );


    /*
        MeshBasicMaterial is deliberate.

        It is NOT affected by:
        - scene lights
        - shadows
        - normal lighting
        - environmental shaders
    */

    const material =
        new THREE.MeshBasicMaterial({

            color:0xffffff,

            map:entityTexture,

            transparent:true,

            alphaTest:.01,

            side:THREE.DoubleSide,

            fog:false,

            toneMapped:false

        });


    entity =
        new THREE.Mesh(
            geometry,
            material
        );


    entity.position.set(
        x,
        ENTITY_HEIGHT/2,
        z
    );


    addObject(
        entity
    );


    applyEntityTexture();

}


/* =========================================================
   ENTITY IMAGE SCALING
========================================================= */

function applyEntityTexture(){

    if(
        !entity ||
        !entityTexture ||
        !entityTexture.image
    ){

        return;

    }


    const image =
        entityTexture.image;


    if(
        !image.width ||
        !image.height
    ){

        return;

    }


    const aspect =
        image.width/
        image.height;


    /*
        EXACTLY ONE HEIGHT.

        Width is calculated from the
        PNG's original aspect ratio.

        Nothing is cropped.
    */

    const height =
        ENTITY_HEIGHT;


    const width =
        height*
        aspect;


    entity.scale.set(
        width,
        height,
        1
    );


    /*
        Keep the feet on the floor.
    */

    entity.position.y =
        height/2;


    console.log(
        "Entity size:",
        width,
        "x",
        height
    );

}


/* =========================================================
   ENTITY COLLISION
========================================================= */

function entityHitsWall(
    x,
    y,
    z
){

    const bottom =
        y-ENTITY_HEIGHT/2;


    const top =
        y+ENTITY_HEIGHT/2;


    for(
        const wall of walls
    ){

        if(
            top<=wall.minY ||
            bottom>=wall.maxY
        ){

            continue;

        }


        const closestX =
            Math.max(
                wall.minX,
                Math.min(
                    x,
                    wall.maxX
                )
            );


        const closestZ =
            Math.max(
                wall.minZ,
                Math.min(
                    z,
                    wall.maxZ
                )
            );


        const dx =
            x-closestX;


        const dz =
            z-closestZ;


        if(
            dx*dx+dz*dz <
            ENTITY_RADIUS*
            ENTITY_RADIUS
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   ENTITY WALL DETECTION
========================================================= */

function wallBetween(
    x1,
    z1,
    x2,
    z2
){

    const dx =
        x2-x1;


    const dz =
        z2-z1;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    const steps =
        Math.ceil(
            distance/.35
        );


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t =
            i/steps;


        const x =
            x1+
            dx*t;


        const z =
            z1+
            dz*t;


        if(
            entityHitsWall(
                x,
                ENTITY_HEIGHT/2,
                z
            )
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   FASTEST WAY AROUND WALL
========================================================= */

function findBestDirection(){

    const dx =
        player.position.x-
        entity.position.x;


    const dz =
        player.position.z-
        entity.position.z;


    const targetAngle =
        Math.atan2(
            dz,
            dx
        );


    let best = null;


    /*
        Check many directions around the entity.

        The entity picks a direction that:
        - isn't blocked
        - gets closer to the player
        - doesn't make a huge turn
    */

    for(
        let i=0;
        i<48;
        i++
    ){

        const angle =
            i/48*
            Math.PI*
            2;


        const dirX =
            Math.cos(angle);


        const dirZ =
            Math.sin(angle);


        const test1 =
            1.5;


        const test2 =
            3.5;


        const x1 =
            entity.position.x+
            dirX*test1;


        const z1 =
            entity.position.z+
            dirZ*test1;


        const x2 =
            entity.position.x+
            dirX*test2;


        const z2 =
            entity.position.z+
            dirZ*test2;


        if(
            entityHitsWall(
                x1,
                ENTITY_HEIGHT/2,
                z1
            )
        ){

            continue;

        }


        if(
            entityHitsWall(
                x2,
                ENTITY_HEIGHT/2,
                z2
            )
        ){

            continue;

        }


        const distance =
            Math.hypot(
                player.position.x-x2,
                player.position.z-z2
            );


        let turn =
            Math.abs(
                angle-targetAngle
            );


        if(turn>Math.PI){

            turn =
                Math.PI-turn;

        }


        const score =
            distance+
            turn*.5;


        if(
            !best ||
            score<best.score
        ){

            best = {

                x:dirX,

                z:dirZ,

                score:score

            };

        }

    }


    return best;

}


/* =========================================================
   EASY MODE WANDERING
========================================================= */

function updateWander(
    dt
){

    wanderTimer -=
        dt;


    if(
        wanderTimer<=0
    ){

        wanderTimer =
            1.5+
            Math.random()*4;


        const angle =
            Math.random()*
            Math.PI*
            2;


        wanderDirection.set(
            Math.cos(angle),
            Math.sin(angle)
        );

    }


    const amount =
        DIFFICULTIES.easy.speed*
        dt;


    const x =
        entity.position.x+
        wanderDirection.x*
        amount;


    const z =
        entity.position.z+
        wanderDirection.y*
        amount;


    if(
        !entityHitsWall(
            x,
            ENTITY_HEIGHT/2,
            z
        )
    ){

        entity.position.x =
            x;


        entity.position.z =
            z;

    }
    else{

        wanderTimer =
            0;

    }

}


/* =========================================================
   ENTITY AI
========================================================= */

function updateEntity(
    dt
){

    if(
        !entity ||
        dead
    ){

        return;

    }


    const difficulty =
        DIFFICULTIES[
            selectedDifficulty
        ];


    /* EASY */

    if(
        !difficulty.chase
    ){

        updateWander(
            dt
        );

    }


    /* CHASING */

    else{

        const dx =
            player.position.x-
            entity.position.x;


        const dz =
            player.position.z-
            entity.position.z;


        const distance =
            Math.hypot(
                dx,
                dz
            );


        if(
            distance>.2
        ){

            const blocked =
                wallBetween(
                    entity.position.x,
                    entity.position.z,
                    player.position.x,
                    player.position.z
                );


            let direction;


            if(!blocked){

                direction = {

                    x:dx/distance,

                    z:dz/distance

                };

            }
            else{

                direction =
                    findBestDirection();

            }


            if(direction){

                const amount =
                    difficulty.speed*
                    dt;


                const nextX =
                    entity.position.x+
                    direction.x*
                    amount;


                const nextZ =
                    entity.position.z+
                    direction.z*
                    amount;


                if(
                    !entityHitsWall(
                        nextX,
                        ENTITY_HEIGHT/2,
                        nextZ
                    )
                ){

                    entity.position.x =
                        nextX;


                    entity.position.z =
                        nextZ;


                    entityStuckTime =
                        0;

                }
                else{

                    entityStuckTime +=
                        dt;

                }

            }
            else{

                entityStuckTime +=
                    dt;

            }

        }


        /*
            If it somehow gets stuck,
            search for an escape position.
        */

        if(
            entityStuckTime>1
        ){

            for(
                let i=0;
                i<40;
                i++
            ){

                const angle =
                    Math.random()*
                    Math.PI*
                    2;


                const distance =
                    2+
                    Math.random()*3;


                const x =
                    entity.position.x+
                    Math.cos(angle)*
                    distance;


                const z =
                    entity.position.z+
                    Math.sin(angle)*
                    distance;


                if(
                    !entityHitsWall(
                        x,
                        ENTITY_HEIGHT/2,
                        z
                    )
                ){

                    entity.position.x =
                        x;


                    entity.position.z =
                        z;


                    break;

                }

            }


            entityStuckTime =
                0;

        }


        /*
            Catch distance.
        */

        if(
            distance<1.15
        ){

            killPlayer();

            return;

        }

    }


    /*
        Rotate the entity toward the player.

        This doesn't affect its texture.
    */

    const lookX =
        player.position.x-
        entity.position.x;


    const lookZ =
        player.position.z-
        entity.position.z;


    entity.rotation.y =
        Math.atan2(
            lookX,
            lookZ
        );


    /*
        Danger vignette.
    */

    const dx =
        player.position.x-
        entity.position.x;


    const dz =
        player.position.z-
        entity.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if(
        difficulty.chase &&
        distance<22
    ){

        const amount =
            1-distance/22;


        document.getElementById(
            "danger"
        ).style.boxShadow =
            `inset 0 0 180px rgba(130,0,0,${amount*.42})`;

    }
    else{

        document.getElementById(
            "danger"
        ).style.boxShadow =
            "none";

    }

}

/* =========================================================
   CLEAR LEVEL
========================================================= */

function clearWorld(){

    for(
        const object of objects
    ){

        scene.remove(
            object
        );


        if(object.geometry){

            object.geometry.dispose();

        }


        if(object.material){

            if(
                Array.isArray(
                    object.material
                )
            ){

                object.material.forEach(
                    material =>
                        material.dispose()
                );

            }
            else{

                object.material.dispose();

            }

        }

    }


    objects = [];

    walls = [];

    floors = [];

    entity = null;

    entityStuckTime = 0;

    scene.fog = null;

    entityAudio.pause();

    entityAudio.currentTime = 0;

}

    if(paused){

        resumeGame();

    }
    else{

        pauseGame();

    }

}


/* =========================================================
   RETURN TO MENU
========================================================= */

function returnToMenu(){

    running =
        false;


    paused =
        false;


    dead =
        false;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    clearWorld();


    document.getElementById(
        "pause"
    ).style.display =
        "none";


    document.getElementById(
        "death"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";

}


/* =========================================================
   DIFFICULTY
========================================================= */

function selectDifficulty(
    difficulty
){

    selectedDifficulty =
        difficulty;


    document
        .querySelectorAll(
            ".difficulty button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );


    const ids = {

        easy:"easyBtn",

        normal:"normalBtn",

        hard:"hardBtn",

        impossible:"impossibleBtn"

    };


    document.getElementById(
        ids[difficulty]
    ).classList.add(
        "selected"
    );


    document.getElementById(
        "difficultyHud"
    ).textContent =
        DIFFICULTIES[
            difficulty
        ].name;

}

/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "click",
    function(){

        if(
            running &&
            !paused &&
            !dead &&
            document.pointerLockElement !==
            document.body
        ){

            document.body.requestPointerLock();


            entityAudio.play().catch(
                function(){}
            );

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running &&
        !paused &&
        !dead
    ){

        updatePlayer(dt);

        updateEntity(dt);

        updateCamera(dt);

    }


    renderer.render(
        scene,
        camera
    );

}


animate();
