function makeWallTexture(){

    const canvas =
        document.createElement("canvas");

    canvas.width=1024;
    canvas.height=1024;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle="#c5b344";
    ctx.fillRect(0,0,1024,1024);

    /*
        Stronger vertical wallpaper pattern.
    */

    for(let x=0;x<1024;x+=30){

        ctx.fillStyle=
            "rgba(85,70,15,.10)";

        ctx.fillRect(
            x,
            0,
            2,
            1024
        );
    }

    /*
        Dirt and age.
    */

    for(let i=0;i<50000;i++){

        ctx.fillStyle =
            Math.random()>.5
            ? "rgba(255,235,100,.07)"
            : "rgba(50,40,5,.08)";

        const size =
            Math.random()*3+1;

        ctx.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            size,
            size
        );
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(2.5,2.5);

    return texture;
}


function makeFloorTexture(){

    const canvas =
        document.createElement("canvas");

    canvas.width=1024;
    canvas.height=1024;

    const ctx =
        canvas.getContext("2d");

    /*
        Damp gray carpet.
    */

    ctx.fillStyle="#555754";

    ctx.fillRect(
        0,
        0,
        1024,
        1024
    );

    /*
        Carpet fibers.
    */

    for(let i=0;i<65000;i++){

        const brightness =
            Math.floor(
                Math.random()*35
            );

        ctx.fillStyle=
            `rgba(
                ${120+brightness},
                ${120+brightness},
                ${115+brightness},
                .055
            )`;

        const size=
            Math.random()*3+1;

        ctx.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            size,
            size
        );
    }

    /*
        Damp stains.
    */

    for(let i=0;i<70;i++){

        const x=
            Math.random()*1024;

        const y=
            Math.random()*1024;

        const radius=
            Math.random()*50+15;

        const gradient=
            ctx.createRadialGradient(
                x,y,0,
                x,y,radius
            );

        gradient.addColorStop(
            0,
            "rgba(20,25,22,.25)"
        );

        gradient.addColorStop(
            .6,
            "rgba(30,35,32,.10)"
        );

        gradient.addColorStop(
            1,
            "rgba(20,25,22,0)"
        );

        ctx.fillStyle=gradient;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    const texture =
        new THREE.CanvasTexture(canvas);

    texture.wrapS=
        THREE.RepeatWrapping;

    texture.wrapT=
        THREE.RepeatWrapping;

    texture.repeat.set(3,3);

    return texture;
}

/* =========================================================
   MAP HELPERS
========================================================= */

function cellToWorld(row,col){

    const width=
        MAP[0].length;

    return new THREE.Vector3(
        (col-width/2+.5)*CELL_SIZE,
        0,
        (row-MAP.length/2+.5)*CELL_SIZE
    );
}


function isWall(row,col){

    if(
        row<0 ||
        row>=MAP.length ||
        col<0 ||
        col>=MAP[0].length
    )
        return true;

    return MAP[row][col]==="#";
}


function worldToCell(position){

    return {
        row:Math.floor(
            position.z/CELL_SIZE+
            MAP.length/2
        ),

        col:Math.floor(
            position.x/CELL_SIZE+
            MAP[0].length/2
        )
    };
}

function createLevel0Floor(){

        r++

            c++

            const pos=

            const tile=
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        CELL_SIZE*.92,
                        CELL_SIZE*.92
                    ),
                    floorMaterial
                );

            tile.rotation.x=
                -Math.PI/2;

            tile.position.set(
                pos.x,
                0,
                pos.z
            );

            scene.add(tile);

            floorTiles.push(tile);
        }
    }
}


/* =========================================================
   LEVEL 0 GRID OF REAL HOLES
========================================================= */

function createHoleGrid(){

    /*
        Large square-grid section.

        Every other square is removed.
    */

    const startRow=8;
    const endRow=28;

    const startCol=27;
    const endCol=46;

    for(
        let r=startRow;
        r<=endRow;
        r++
    ){

        for(
            let c=startCol;
            c<=endCol;
            c++
        ){

            if(MAP[r][c]==="#")
                continue;

            if(
                (r+c)%2!==0
            )
                continue;

            holeCells.add(
                `${r},${c}`
            );

            /*
                Find/remove normal tile.
            */

            for(
                let i=floorTiles.length-1;
                i>=0;
                i--
            ){

                const tile=
                    floorTiles[i];

                const cell=
                    worldToCell(
                        tile.position
                    );

                if(
                    cell.row===r &&
                    cell.col===c
                ){

                    scene.remove(tile);

                    floorTiles.splice(
                        i,
                        1
                    );

                    break;
                }
            }

            /*
                Deep darkness below hole.
            */

            const pos=
                cellToWorld(r,c);

            const bottom=
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        CELL_SIZE,
                        CELL_SIZE
                    ),
                    new THREE.MeshBasicMaterial({
                        color:0x030403
                    })
                );

            bottom.rotation.x=
                -Math.PI/2;

            bottom.position.set(
                pos.x,
                -18,
                pos.z
            );

            scene.add(bottom);
        }
    }
}

                            : 0xffffcf
                    })
                );

            fixture.position.copy(
                light.position
            );

            scene.add(fixture);
        }
    }
}

/* =========================================================
   COLLISION
========================================================= */

function circleHitsWall(
    position,
    radius
){

    for(
        const box of wallBoxes
    ){

        const closestX=
            Math.max(
                box.min.x,
                Math.min(
                    position.x,
                    box.max.x
                )
            );

        const closestZ=
            Math.max(
                box.min.z,
                Math.min(
                    position.z,
                    box.max.z
                )
            );

        const dx=
            position.x-closestX;

        const dz=
            position.z-closestZ;

        if(
            dx*dx+dz*dz<
            radius*radius
        )
            return true;
    }

    return false;
}


function moveWithCollision(
    object,
    direction,
    speed,
    radius,
    delta
){

    const movement=
        direction.clone()
        .multiplyScalar(
            speed*delta
        );

    const nextX=
        object.position.clone();

    nextX.x+=movement.x;

    if(
        !circleHitsWall(
            nextX,
            radius
        )
    ){

        object.position.x=
            nextX.x;
    }


    const nextZ=
        object.position.clone();

    nextZ.z+=movement.z;

    if(
        !circleHitsWall(
            nextZ,
            radius
        )
    ){

        object.position.z=
            nextZ.z;
    }
}

/* =========================================================
   ENTITY PATHFINDING
========================================================= */

function findPath(
    start,
    target
){

    const queue=[start];

    const cameFrom={};

    const key=
        (r,c)=>
            `${r},${c}`;

    cameFrom[
        key(
            start.row,
            start.col
        )
    ]=null;

    while(queue.length){

        const current=
            queue.shift();

        if(
            current.row===
            target.row &&
            current.col===
            target.col
        )
            break;

        const neighbors=[

            {
                row:current.row-1,
                col:current.col
            },

            {
                row:current.row+1,
                col:current.col
            },

            {
                row:current.row,
                col:current.col-1
            },

            {
                row:current.row,
                col:current.col+1
            }
        ];

        for(
            const next of neighbors
        ){

            if(
                isWall(
                    next.row,
                    next.col
                )
            )
                continue;

            if(
                currentLevel==="level0" &&
                holeCells.has(
                    key(
                        next.row,
                        next.col
                    )
                )
            )
                continue;

            const k=
                key(
                    next.row,
                    next.col
                );

            if(
                k in cameFrom
            )
                continue;

            cameFrom[k]=current;

            queue.push(next);
        }
    }

    const targetKey=
        key(
            target.row,
            target.col
        );

    if(
        !(targetKey in cameFrom)
    )
        return [];

    const path=[];

    let current=target;

    while(current){

        path.unshift(current);

        current=
            cameFrom[
                key(
                    current.row,
                    current.col
                )
            ];
    }

    return path;
}

const clock=
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    /* =====================================================
       FALLING
    ===================================================== */

    if(isFalling){

        verticalVelocity+=
            GRAVITY*delta;

        player.position.y-=
            verticalVelocity*delta;

        camera.rotation.z+=
            delta*.8;

        if(
            player.position.y<
            -10
        ){

            isFalling=false;

            player.position.copy(
                cellToWorld(1,1)
            );

            player.position.y=1.65;

            verticalVelocity=0;

            grounded=true;

            camera.rotation.z=0;

            stamina=MAX_STAMINA;

            document
                .getElementById("message")
                .textContent=
                    "YOU FELL.";

            setTimeout(
                ()=>{
                    document
                        .getElementById(
                            "message"
                        )
                        .textContent="";
                },
                1500
            );
        }

    }else{


        /* =================================================
           MOVEMENT
        ================================================= */

        const direction=
            new THREE.Vector3();

        if(keys["w"])
            direction.z-=1;

        if(keys["s"])
            direction.z+=1;

        if(keys["a"])
            direction.x-=1;

        if(keys["d"])
            direction.x+=1;


        let sprinting=false;

        if(
            direction.lengthSq()>0
        ){

            direction.normalize();

            direction.applyAxisAngle(
                new THREE.Vector3(
                    0,1,0
                ),
                yaw
            );

            sprinting=
                keys["shift"] &&
                stamina>0;

            if(sprinting){

                stamina-=
                    SPRINT_DRAIN*
                    delta;

                stamina=
                    Math.max(
                        stamina,
                        0
                    );

            }else{

                stamina+=
                    STAMINA_REGEN*
                    delta;

                stamina=
                    Math.min(
                        stamina,
                        MAX_STAMINA
                    );
            }

            const speed=
                sprinting
                ? SPRINT_SPEED
                : WALK_SPEED;

            moveWithCollision(
                player,
                direction,
                speed,
                PLAYER_RADIUS,
                delta
            );
        }else{

            stamina+=
                STAMINA_REGEN*
                delta;

            stamina=
                Math.min(
                    stamina,
                    MAX_STAMINA
                );
        }


        /* ================================================
           JUMP GRAVITY
        ================================================= */

        verticalVelocity-=
            GRAVITY*delta;

        player.position.y+=
            verticalVelocity*delta;

        if(
            player.position.y<=1.65
        ){

            player.position.y=1.65;

            verticalVelocity=0;

            grounded=true;
        }


        checkForHole();
    }


    /* =====================================================
       STAMINA
    ===================================================== */

    const staminaBar=
        document.getElementById(
            "stamina"
        );

    staminaBar.style.width=
        `${stamina}%`;

    staminaBar.style.background=
        stamina<25
        ? "#d33"
        : "#e1d143";


    /* =====================================================
       ENTITY PATH
    ===================================================== */

    pathTimer-=delta;

    if(
        pathTimer<=0 &&
        !isFalling
    ){

        pathTimer=.3;

        const start=
            worldToCell(
                entity.position
            );

        const target=
            worldToCell(
                player.position
            );

        entityPath=
            findPath(
                start,
                target
            );
    }


    /* =====================================================
       ENTITY MOVEMENT
    ===================================================== */

    if(
        entityPath.length>1
    ){

        const next=
            entityPath[1];

        const target=
            cellToWorld(
                next.row,
                next.col
            );

        const direction=
            new THREE.Vector3(
                target.x-
                    entity.position.x,
                0,
                target.z-
                    entity.position.z
            );

        if(
            direction.length()>.12
        ){

            direction.normalize();

            moveWithCollision(
                entity,
                direction,
                ENTITY_SPEED,
                ENTITY_RADIUS,
                delta
            );
        }
    }


    /* =====================================================
       ENTITY LOOK
    ===================================================== */

    entity.lookAt(
        player.position.x,
        entity.position.y,
        player.position.z
    );


    /* =====================================================
       ENTITY AUDIO
    ===================================================== */

    const distance=
        entity.position.distanceTo(
            player.position
        );

    const maxSoundDistance=28;

    let volume=
        1-
        distance/maxSoundDistance;

    volume=
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    entitySound.volume=
        volume*volume;


    /* =====================================================
       DANGER EFFECT
    ===================================================== */

    const danger=
        document.getElementById(
            "danger"
        );

    if(distance<12){

        const intensity=
            Math.max(
                0,
                1-distance/12
            );

        danger.style.boxShadow=
            `inset 0 0 160px
             rgba(
                255,
                0,
                0,
                ${intensity*.65}
             )`;

    }else{

        danger.style.boxShadow=
            "none";
    }


    /* =====================================================
       CAMCORDER FLICKER
    ===================================================== */

    const cam=
        document.getElementById(
            "camcorder"
        );

    cam.style.opacity=
        .38+
        Math.random()*.08;


    /* =====================================================
       ENTITY CATCH
    ===================================================== */

    if(
        distance<1.2 &&
        !isFalling
    ){

        document
            .getElementById(
                "message"
            )
            .textContent=
                "THE ENTITY FOUND YOU.";

        player.position.copy(
            cellToWorld(1,1)
        );

        player.position.y=1.65;

        entity.position.copy(
            cellToWorld(
                MAP.length-2,
                MAP[0].length-2
            )
        );

        stamina=MAX_STAMINA;

        setTimeout(
            ()=>{
                document
                    .getElementById(
                        "message"
                    )
                    .textContent="";
            },
            1800
        );
    }


    renderer.render(
        scene,
        camera
    );
}
