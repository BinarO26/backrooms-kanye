<script type="module">

import * as THREE from "three";


/* =========================================================
   BASIC SETUP
========================================================= */

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        .05,
        300
    );

camera.rotation.order = "YXZ";

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   GAME STATE
========================================================= */

let currentLevel = null;
let gameStarted = false;
let paused = false;

let worldObjects = [];
let colliders = [];

let entity = null;

let entityPath = [];
let pathTimer = 0;

let falling = false;

let velocityY = 0;
let grounded = true;

let stamina = 100;

const WALK_SPEED = 4.5;
const SPRINT_SPEED = 7.5;
const ENTITY_SPEED = 7.5;

const GRAVITY = 20;
const JUMP = 7.5;

const PLAYER_RADIUS = .38;
const ENTITY_RADIUS = .38;


/* =========================================================
   PLAYER
========================================================= */

const player =
    new THREE.Object3D();

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    0,
    0
);

let yaw = 0;
let pitch = 0;


/* =========================================================
   INPUT
========================================================= */

const keys = {};

addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

        if(e.code === "Space"){
            e.preventDefault();

            if(
                grounded &&
                !falling &&
                gameStarted &&
                !paused
            ){
                velocityY = JUMP;
                grounded = false;
            }
        }

        if(
            e.code === "Escape" ||
            e.key.toLowerCase() === "p"
        ){
            if(gameStarted)
                togglePause();
        }
    }
);

addEventListener(
    "keyup",
    e => {
        keys[e.key.toLowerCase()] = false;
    }
);


/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    e => {

        if(
            document.pointerLockElement !==
            document.body
        )
            return;

        yaw -= e.movementX * .002;
        pitch -= e.movementY * .002;

        pitch =
            Math.max(
                -Math.PI / 2.1,
                Math.min(
                    Math.PI / 2.1,
                    pitch
                )
            );

        player.rotation.y = yaw;
        camera.rotation.x = pitch;
    }
);


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function material(
    color,
    roughness=1
){
    return new THREE.MeshStandardMaterial({
        color,
        roughness
    });
}


/* =========================================================
   LEVEL CLEANUP
========================================================= */

function clearWorld(){

    for(
        const object of worldObjects
    ){
        scene.remove(object);
    }

    worldObjects = [];
    colliders = [];

    entity = null;

    entitySound.pause();

    entitySound.currentTime = 0;
}


/* =========================================================
   ADD OBJECT
========================================================= */

function addObject(object){

    scene.add(object);
    worldObjects.push(object);

    return object;
}


/* =========================================================
   COLLIDER
========================================================= */

function addCollider(object){

    const box =
        new THREE.Box3()
        .setFromObject(object);

    colliders.push(box);
}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function hitsWall(position){

    for(
        const box of colliders
    ){

        const x =
            Math.max(
                box.min.x,
                Math.min(
                    position.x,
                    box.max.x
                )
            );

        const z =
            Math.max(
                box.min.z,
                Math.min(
                    position.z,
                    box.max.z
                )
            );

        const dx =
            position.x - x;

        const dz =
            position.z - z;

        if(
            dx*dx +
            dz*dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ){
            return true;
        }
    }

    return false;
}


function moveObject(
    object,
    direction,
    speed,
    radius
){

    const movement =
        direction
        .clone()
        .multiplyScalar(
            speed *
            clock.getDelta()
        );

    let next =
        object.position.clone();

    next.x += movement.x;

    if(
        !hitsWallRadius(
            next,
            radius
        )
    ){
        object.position.x =
            next.x;
    }

    next =
        object.position.clone();

    next.z += movement.z;

    if(
        !hitsWallRadius(
            next,
            radius
        )
    ){
        object.position.z =
            next.z;
    }
}


function hitsWallRadius(
    position,
    radius
){

    for(
        const box of colliders
    ){

        const x =
            Math.max(
                box.min.x,
                Math.min(
                    position.x,
                    box.max.x
                )
            );

        const z =
            Math.max(
                box.min.z,
                Math.min(
                    position.z,
                    box.max.z
                )
            );

        const dx =
            position.x - x;

        const dz =
            position.z - z;

        if(
            dx*dx +
            dz*dz <
            radius*radius
        ){
            return true;
        }
    }

    return false;
}


/* =========================================================
   BACKROOMS TEXTURES
========================================================= */

function wallpaperTexture(){

    const c =
        document.createElement("canvas");

    c.width = 1024;
    c.height = 1024;

    const x =
        c.getContext("2d");

    x.fillStyle="#c7b64c";
    x.fillRect(0,0,1024,1024);

    for(
        let i=0;
        i<40000;
        i++
    ){

        const s =
            Math.random()*3+1;

        x.fillStyle =
            Math.random()>.5
            ? "rgba(255,240,100,.06)"
            : "rgba(50,40,5,.09)";

        x.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            s,
            s
        );
    }

    for(
        let i=0;
        i<35;
        i++
    ){

        x.strokeStyle =
            "rgba(70,55,5,.12)";

        x.lineWidth=2;

        const xx =
            Math.random()*1024;

        x.beginPath();
        x.moveTo(xx,0);
        x.lineTo(
            xx + Math.random()*30-15,
            1024
        );
        x.stroke();
    }

    const texture =
        new THREE.CanvasTexture(c);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(2.5,2.5);

    return texture;
}


function carpetTexture(){

    const c =
        document.createElement("canvas");

    c.width=1024;
    c.height=1024;

    const x =
        c.getContext("2d");

    x.fillStyle="#555754";
    x.fillRect(0,0,1024,1024);

    for(
        let i=0;
        i<70000;
        i++
    ){

        const s =
            Math.random()*3+1;

        const v =
            70 +
            Math.random()*45;

        x.fillStyle =
            `rgba(${v},${v},${v},.10)`;

        x.fillRect(
            Math.random()*1024,
            Math.random()*1024,
            s,
            s
        );
    }

    for(
        let i=0;
        i<70;
        i++
    ){

        const px =
            Math.random()*1024;

        const py =
            Math.random()*1024;

        const r =
            15+Math.random()*55;

        const g =
            x.createRadialGradient(
                px,py,0,
                px,py,r
            );

        g.addColorStop(
            0,
            "rgba(15,20,18,.25)"
        );

        g.addColorStop(
            1,
            "rgba(15,20,18,0)"
        );

        x.fillStyle=g;

        x.beginPath();
        x.arc(px,py,r,0,Math.PI*2);
        x.fill();
    }

    return new THREE.CanvasTexture(c);
}


/* =========================================================
   CREATE FLOOR
========================================================= */

function createFloor(
    width,
    depth,
    y,
    mat
){

    const floor =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                depth
            ),
            mat
        );

    floor.rotation.x =
        -Math.PI/2;

    floor.position.y=y;

    addObject(floor);

    return floor;
}


/* =========================================================
   CREATE BOX
========================================================= */

function box(
    w,
    h,
    d,
    x,
    y,
    z,
    mat,
    collision=true
){

    const object =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            mat
        );

    object.position.set(
        x,y,z
    );

    addObject(object);

    if(collision)
        addCollider(object);

    return object;
}


/* =========================================================
   BACKROOMS
========================================================= */

function buildBackrooms(){

    currentLevel="backrooms";

    document
        .getElementById("level")
        .textContent =
        "BACKROOMS";

    scene.background =
        new THREE.Color(
            0x16140a
        );

    scene.fog =
        new THREE.Fog(
            0x16140a,
            12,
            90
        );

    scene.add(
        new THREE.AmbientLight(
            0xffe7a0,
            1.5
        )
    );

    const wallMat =
        new THREE.MeshStandardMaterial({
            map:wallpaperTexture(),
            roughness:1
        });

    const floorMat =
        new THREE.MeshStandardMaterial({
            map:carpetTexture(),
            roughness:1
        });

    const width=150;
    const depth=130;
    const wallH=4;

    createFloor(
        width,
        depth,
        0,
        floorMat
    );


    /*
       Ceiling.
    */

    const ceiling =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                depth
            ),
            material(0x89803d)
        );

    ceiling.rotation.x=
        Math.PI/2;

    ceiling.position.y=
        wallH;

    addObject(ceiling);


    /*
       Outer walls.
    */

    box(
        width,
        wallH,
        1,
        0,
        wallH/2,
        -depth/2,
        wallMat
    );

    box(
        width,
        wallH,
        1,
        0,
        wallH/2,
        depth/2,
        wallMat
    );

    box(
        1,
        wallH,
        depth,
        -width/2,
        wallH/2,
        0,
        wallMat
    );

    box(
        1,
        wallH,
        depth,
        width/2,
        wallH/2,
        0,
        wallMat
    );


    /*
       Interior hall network.
       Large openings are deliberately
       left between the walls.
    */

    const walls=[
        [-40,0,70,1],
        [40,0,70,1],
        [0,-38,1,75],
        [0,38,1,75],

        [-20,-15,1,42],
        [20,15,1,42],

        [-48,22,35,1],
        [48,-22,35,1],

        [-15,5,28,1],
        [15,-5,28,1],

        [-55,-38,1,35],
        [55,38,1,35]
    ];

    for(
        const w of walls
    ){

        if(w[2] > w[3]){

            box(
                w[2],
                wallH,
                w[3],
                w[0],
                wallH/2,
                w[1],
                wallMat
            );

        }else{

            box(
                w[2],
                wallH,
                w[3],
                w[0],
                wallH/2,
                w[1],
                wallMat
            );
        }
    }


    /*
       Fluorescent lights.
    */

    const lightMat =
        new THREE.MeshBasicMaterial({
            color:0xffffd0
        });

    for(
        let x=-60;
        x<=60;
        x+=12
    ){

        for(
            let z=-50;
            z<=50;
            z+=14
        ){

            const fixture =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        2.2,.08,.45
                    ),
                    lightMat
                );

            fixture.position.set(
                x,
                3.82,
                z
            );

            addObject(fixture);

            const light =
                new THREE.PointLight(
                    0xffeaa0,
                    2.8,
                    16
                );

            light.position.set(
                x,
                3.65,
                z
            );

            addObject(light);
        }
    }


    /*
       Deadly square-hole grid.
       It is a large regular grid,
       not random holes.
    */

    const holeMaterial =
        new THREE.MeshBasicMaterial({
            color:0x010201
        });

    for(
        let x=-18;
        x<=18;
        x+=4
    ){

        for(
            let z=18;
            z<=50;
            z+=4
        ){

            const hole =
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        3.1,
                        3.1
                    ),
                    holeMaterial
                );

            hole.rotation.x=
                -Math.PI/2;

            hole.position.set(
                x,
                -.15,
                z
            );

            addObject(hole);
        }
    }


    /*
       Spawn away from the hole area.
    */

    player.position.set(
        -45,
        1.65,
        -42
    );

    yaw=0;
    pitch=0;

    createEntity(
        38,
        38
    );
}


/* =========================================================
   HOTEL — LEVEL 188
========================================================= */

function buildHotel(){

    currentLevel="hotel";

    document
        .getElementById("level")
        .textContent =
        "HOTEL";

    scene.background =
        new THREE.Color(
            0x0d1013
        );

    scene.fog =
        new THREE.Fog(
            0x0d1013,
            20,
            130
        );

    scene.add(
        new THREE.AmbientLight(
            0x9aa6ad,
            .75
        )
    );


    const concrete =
        material(
            0x85827d,
            .92
        );

    const darkConcrete =
        material(
            0x555450,
            1
        );

    const courtyardGrass =
        material(
            0x263d20,
            1
        );

    const carpet =
        material(
            0x4d4a46,
            1
        );


    /*
       CENTRAL COURTYARD

       Large rectangular open area.
    */

    createFloor(
        60,
        70,
        0,
        courtyardGrass
    );


    /*
       Paved perimeter.
    */

    const pavement =
        material(
            0x696762,
            1
        );

    box(
        8,
        .15,
        70,
        -34,
        .05,
        0,
        pavement,
        false
    );

    box(
        8,
        .15,
        70,
        34,
        .05,
        0,
        pavement,
        false
    );

    box(
        68,
        .15,
        8,
        0,
        .05,
        -39,
        pavement,
        false
    );

    box(
        68,
        .15,
        8,
        0,
        .05,
        39,
        pavement,
        false
    );


    /*
       Five hotel floors.
    */

    const FLOOR_HEIGHT=4.2;

    for(
        let floor=0;
        floor<5;
        floor++
    ){

        const y =
            floor *
            FLOOR_HEIGHT;

        buildHotelFloor(
            y,
            concrete,
            darkConcrete,
            carpet
        );
    }


    /*
       Central bridge/walkway.
    */

    buildHotelBridge(
        FLOOR_HEIGHT*2,
        concrete
    );


    /*
       Rooftop rim.
    */

    const top =
        FLOOR_HEIGHT*5;

    box(
        78,
        .6,
        2,
        0,
        top,
        -38,
        darkConcrete
    );

    box(
        78,
        .6,
        2,
        0,
        top,
        38,
        darkConcrete
    );


    /*
       Hotel-style exterior lighting.
    */

    for(
        let floor=0;
        floor<5;
        floor++
    ){

        const y =
            2 +
            floor*FLOOR_HEIGHT;

        for(
            let x=-28;
            x<=28;
            x+=7
        ){

            const light =
                new THREE.PointLight(
                    0xd7d0bd,
                    .7,
                    12
                );

            light.position.set(
                x,
                y,
                -34
            );

            addObject(light);
        }
    }


    /*
       Spawn in the courtyard.
    */

    player.position.set(
        0,
        1.65,
        27
    );

    yaw=Math.PI;
    pitch=0;

    createEntity(
        -24,
        -27
    );
}


/* =========================================================
   HOTEL FLOOR
========================================================= */

function buildHotelFloor(
    y,
    concrete,
    darkConcrete,
    carpet
){

    const H=3.8;

    /*
       Four building wings around courtyard.
    */

    const thickness=5;

    /*
       North.
    */

    buildWing(
        0,
        y,
        -35,
        76,
        thickness,
        H,
        concrete,
        carpet
    );

    /*
       South.
    */

    buildWing(
        0,
        y,
        35,
        76,
        thickness,
        H,
        concrete,
        carpet
    );

    /*
       West.
    */

    buildWing(
        -35,
        y,
        0,
        thickness,
        70,
        H,
        concrete,
        carpet
    );

    /*
       East.
    */

    buildWing(
        35,
        y,
        0,
        thickness,
        70,
        H,
        concrete,
        carpet
    );


    /*
       Window grids facing courtyard.
    */

    createWindowGrid(
        -28,
        y+2.0,
        0,
        "west"
    );

    createWindowGrid(
        28,
        y+2.0,
        0,
        "east"
    );

    createWindowGrid(
        0,
        y+2.0,
        -28,
        "north"
    );

    createWindowGrid(
        0,
        y+2.0,
        28,
        "south"
    );


    /*
       Interior corridor around each floor.
    */

    createCorridor(
        y,
        carpet
    );
}


/* =========================================================
   HOTEL WING
========================================================= */

function buildWing(
    x,
    y,
    z,
    width,
    depth,
    height,
    wallMat,
    carpet
){

    /*
       Floor slab.
    */

    box(
        width,
        .25,
        depth,
        x,
        y,
        z,
        concreteMaterial(),
        true
    );


    /*
       Outer wall.
    */

    if(width > depth){

        box(
            width,
            height,
            1.5,
            x,
            y+height/2,
            z,
            wallMat
        );

    }else{

        box(
            1.5,
            height,
            depth,
            x,
            y+height/2,
            z,
            wallMat
        );
    }


    /*
       Roof/ceiling slab.
    */

    box(
        width,
        .25,
        depth,
        x,
        y+height,
        z,
        wallMat
    );
}


function concreteMaterial(){

    return material(
        0x686762,
        .95
    );
}


/* =========================================================
   HOTEL WINDOWS
========================================================= */

function createWindowGrid(
    x,
    y,
    z,
    side
){

    const frame =
        material(
            0x353735,
            .8
        );

    const darkGlass =
        new THREE.MeshStandardMaterial({
            color:0x101517,
            roughness:.25,
            metalness:.1,
            emissive:0x020304
        });

    const litGlass =
        new THREE.MeshStandardMaterial({
            color:0xd0b878,
            emissive:0x75632e,
            emissiveIntensity:.45
        });


    /*
       Windows are intentionally
       small and repeated.
    */

    for(
        let i=0;
        i<8;
        i++
    ){

        for(
            let j=0;
            j<2;
            j++
        ){

            const lit =
                Math.random()<.16;

            const window =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        side==="north" ||
                        side==="south"
                        ? 3.1
                        : .15,

                        2.0,

                        side==="north" ||
                        side==="south"
                        ? .15
                        : 3.1
                    ),

                    lit
                    ? litGlass
                    : darkGlass
                );


            if(
                side==="north" ||
                side==="south"
            ){

                window.position.set(
                    -25 +
                    i*7,
                    y,
                    z
                );

            }else{

                window.position.set(
                    x,
                    y,
                    -25 +
                    i*7
                );
            }

            addObject(window);


            /*
               Four-sided window frame.
            */

            const wx =
                side==="north" ||
                side==="south"
                ? 3.5
                : .25;

            const wz =
                side==="north" ||
                side==="south"
                ? .25
                : 3.5;

            const top =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        wx,
                        .15,
                        wz
                    ),
                    frame
                );

            top.position.copy(
                window.position
            );

            top.position.y += 1.1;

            addObject(top);


            const bottom =
                top.clone();

            bottom.position.y -= 2.2;

            addObject(bottom);
        }
    }
}


/* =========================================================
   HOTEL CORRIDORS
========================================================= */

function createCorridor(
    y,
    carpet
){

    /*
       Long interior walkways.
    */

    const floor =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                62,
                4
            ),
            carpet
        );

    floor.rotation.x=
        -Math.PI/2;

    floor.position.set(
        0,
        y+.15,
        -31
    );

    addObject(floor);


    const floor2 =
        floor.clone();

    floor2.position.z=31;

    addObject(floor2);


    const side =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                62,
                4
            ),
            carpet
        );

    side.rotation.x=
        -Math.PI/2;

    side.rotation.z=
        Math.PI/2;

    side.position.set(
        -31,
        y+.15,
        0
    );

    addObject(side);


    const side2 =
        side.clone();

    side2.position.x=31;

    addObject(side2);


    /*
       Doors along corridors.
    */

    for(
        let x=-25;
        x<=25;
        x+=7
    ){

        createDoor(
            x,
            y+1.8,
            -32
        );

        createDoor(
            x,
            y+1.8,
            32
        );
    }
}


function createDoor(
    x,
    y,
    z
){

    const door =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.8,
                3.3,
                .15
            ),
            material(0x403b36,.8)
        );

    door.position.set(
        x,y,z
    );

    addObject(door);

    addCollider(door);
}


/* =========================================================
   HOTEL BRIDGE
========================================================= */

function buildHotelBridge(
    y,
    mat
){

    const bridge =
        box(
            12,
            .35,
            50,
            0,
            y,
            0,
            mat
        );


    /*
       Rails.
    */

    box(
        .2,
        1.1,
        50,
        -5.7,
        y+.7,
        0,
        darkRailMaterial()
    );

    box(
        .2,
        1.1,
        50,
        5.7,
        y+.7,
        0,
        darkRailMaterial()
    );


    /*
       Supports.
    */

    for(
        let z=-18;
        z<=18;
        z+=12
    ){

        box(
            .35,
            y,
            .35,
            -4,
            y/2,
            z,
            darkRailMaterial()
        );

        box(
            .35,
            y,
            .35,
            4,
            y/2,
            z,
            darkRailMaterial()
        );
    }
}


function darkRailMaterial(){

    return material(
        0x292b29,
        .8
    );
}


/* =========================================================
   ENTITY
========================================================= */

const entityTexture =
    new THREE.TextureLoader()
    .load(
        "./entity.png"
    );

entityTexture.colorSpace =
    THREE.SRGBColorSpace;


const entitySound =
    new Audio(
        "./entity.mp3"
    );

entitySound.loop=true;
entitySound.volume=0;


function createEntity(
    x,
    z
){

    if(entity)
        scene.remove(entity);

    entity =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                1.8,
                3.4
            ),
            new THREE.MeshBasicMaterial({
                map:entityTexture,
                transparent:true,
                side:THREE.DoubleSide
            })
        );

    entity.position.set(
        x,
        1.7,
        z
    );

    addObject(entity);

    entityPath=[];
    pathTimer=0;
}


/* =========================================================
   SIMPLE ENTITY CHASE
========================================================= */

function updateEntity(delta){

    if(!entity)
        return;

    /*
       Rather than allowing the entity
       to walk through walls, it moves
       toward the player only when there
       is a clear line of sight.

       Otherwise it searches around
       obstacles using small waypoints.
    */

    const target =
        new THREE.Vector3(
            player.position.x,
            entity.position.y,
            player.position.z
        );

    const direction =
        target
        .sub(entity.position);

    direction.y=0;

    const distance =
        direction.length();


    if(distance>.2){

        direction.normalize();

        /*
           Try direct movement.
        */

        const next =
            entity.position
            .clone()
            .add(
                direction
                .clone()
                .multiplyScalar(
                    ENTITY_SPEED*delta
                )
            );

        if(
            !hitsWallRadius(
                next,
                ENTITY_RADIUS
            )
        ){

            entity.position.copy(next);

        }else{

            /*
               If blocked, try sideways.
            */

            const side =
                new THREE.Vector3(
                    -direction.z,
                    0,
                    direction.x
                );

            const nextSide =
                entity.position
                .clone()
                .add(
                    side
                    .multiplyScalar(
                        ENTITY_SPEED*delta
                    )
                );

            if(
                !hitsWallRadius(
                    nextSide,
                    ENTITY_RADIUS
                )
            ){

                entity.position.copy(
                    nextSide
                );
            }
        }
    }


    /*
       Face player.
    */

    entity.lookAt(
        player.position.x,
        entity.position.y,
        player.position.z
    );


    /*
       Distance sound.
    */

    const d =
        entity.position.distanceTo(
            player.position
        );

    const max=35;

    let volume =
        1-d/max;

    volume =
        THREE.MathUtils.clamp(
            volume,
            0,
            1
        );

    entitySound.volume =
        volume*volume;


    /*
       Danger effect.
    */

    const danger =
        document.getElementById(
            "danger"
        );

    if(d<15){

        const intensity =
            1-d/15;

        danger.style.boxShadow =
            `inset 0 0 180px
             rgba(180,0,0,
             ${intensity*.65})`;

    }else{

        danger.style.boxShadow="none";
    }


    /*
       Entity catches player.
    */

    if(
        d<1.25 &&
        !falling
    ){

        document
            .getElementById("message")
            .textContent=
            "THE ENTITY FOUND YOU";

        respawnPlayer();

        setTimeout(
            ()=>{
                document
                    .getElementById("message")
                    .textContent="";
            },
            1800
        );
    }
}


/* =========================================================
   PLAYER RESPAWN
========================================================= */

function respawnPlayer(){

    if(currentLevel==="hotel"){

        player.position.set(
            0,
            1.65,
            27
        );

    }else{

        player.position.set(
            -45,
            1.65,
            -42
        );
    }

    velocityY=0;
    grounded=true;
    falling=false;
    stamina=100;
}


/* =========================================================
   HOLES
========================================================= */

function checkBackroomsHoles(){

    if(
        currentLevel!=="backrooms" ||
        falling
    )
        return;

    /*
       Same grid used when the holes
       were created.
    */

    const x=player.position.x;
    const z=player.position.z;

    if(
        x>=-19 &&
        x<=19 &&
        z>=16 &&
        z<=52
    ){

        const gx =
            Math.round(
                (x+18)/4
            );

        const gz =
            Math.round(
                (z-18)/4
            );

        const hx =
            -18+gx*4;

        const hz =
            18+gz*4;

        if(
            Math.abs(x-hx)<1.5 &&
            Math.abs(z-hz)<1.5
        ){

            falling=true;
            velocityY=0;
        }
    }
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(delta){

    if(falling){

        velocityY -=
            GRAVITY*delta;

        player.position.y -=
            velocityY*delta;

        if(
            player.position.y<
            -12
        ){

            respawnPlayer();
        }

        return;
    }


    const direction =
        new THREE.Vector3();


    if(keys.w)
        direction.z-=1;

    if(keys.s)
        direction.z+=1;

    if(keys.a)
        direction.x-=1;

    if(keys.d)
        direction.x+=1;


    if(
        direction.lengthSq()>0
    ){

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(
                0,1,0
            ),
            yaw
        );


        const sprint =
            keys.shift &&
            stamina>0;


        const speed =
            sprint
            ? SPRINT_SPEED
            : WALK_SPEED;


        if(sprint){

            stamina -=
                27*delta;

        }else{

            stamina +=
                17*delta;
        }


        stamina =
            THREE.MathUtils.clamp(
                stamina,
                0,
                100
            );


        const movement =
            direction
            .clone()
            .multiplyScalar(
                speed*delta
            );


        const nextX =
            player.position.clone();

        nextX.x += movement.x;

        if(
            !hitsWall(
                nextX
            )
        ){
            player.position.x=
                nextX.x;
        }


        const nextZ =
            player.position.clone();

        nextZ.z += movement.z;

        if(
            !hitsWall(
                nextZ
            )
        ){
            player.position.z=
                nextZ.z;
        }

    }else{

        stamina +=
            17*delta;

        stamina =
            Math.min(
                100,
                stamina
            );
    }


    /*
       Gravity.
    */

    velocityY -=
        GRAVITY*delta;

    player.position.y +=
        velocityY*delta;


    if(
        player.position.y<=1.65
    ){

        player.position.y=1.65;

        velocityY=0;

        grounded=true;

    }else{

        grounded=false;
    }


    checkBackroomsHoles();


    document
        .getElementById("stamina")
        .style.width=
        stamina+"%";
}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(level){

    clearWorld();

    currentLevel=level;

    if(level==="hotel")
        buildHotel();
    else
        buildBackrooms();

    gameStarted=true;
    paused=false;

    document
        .getElementById("menu")
        .style.display="none";

    document
        .getElementById("pause")
        .style.display="none";

    document.body.requestPointerLock();

    entitySound
        .play()
        .catch(()=>{});
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(!gameStarted)
        return;

    if(paused)
        resumeGame();
    else
        pauseGame();
}


function pauseGame(){

    paused=true;

    document
        .getElementById("pause")
        .style.display="flex";

    document.exitPointerLock();

    entitySound.pause();
}


function resumeGame(){

    paused=false;

    document
        .getElementById("pause")
        .style.display="none";

    document.body.requestPointerLock();

    entitySound
        .play()
        .catch(()=>{});
}


/* =========================================================
   MENU BUTTONS
========================================================= */

document
    .getElementById("backroomsButton")
    .onclick=()=>{
        startLevel("backrooms");
    };


document
    .getElementById("hotelButton")
    .onclick=()=>{
        startLevel("hotel");
    };


document
    .getElementById("resume")
    .onclick=()=>{
        resumeGame();
    };


document
    .getElementById("restart")
    .onclick=()=>{

        if(currentLevel)
            startLevel(currentLevel);
    };


document
    .getElementById("levels")
    .onclick=()=>{

        paused=false;
        gameStarted=false;

        document.exitPointerLock();

        entitySound.pause();

        clearWorld();

        document
            .getElementById("pause")
            .style.display="none";

        document
            .getElementById("menu")
            .style.display="flex";
    };


/* =========================================================
   CLICK TO LOCK MOUSE
========================================================= */

document.addEventListener(
    "click",
    ()=>{
        if(
            gameStarted &&
            !paused &&
            document.pointerLockElement!==document.body
        ){
            document.body.requestPointerLock();

            entitySound
                .play()
                .catch(()=>{});
        }
    }
);


/* =========================================================
   CLOCK
========================================================= */

const clock =
    new THREE.Clock();


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        !gameStarted ||
        paused
    ){

        renderer.render(
            scene,
            camera
        );

        return;
    }


    updatePlayer(delta);

    updateEntity(delta);


    /*
       Camcorder flicker.
    */

    document
        .getElementById("vhs")
        .style.opacity =
        .30+
        Math.random()*.08;


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
